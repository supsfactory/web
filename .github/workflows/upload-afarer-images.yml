name: Upload afarer images to R2

# 手动触发：把本仓库 scripts/afarer-images/* 的图片上传到
# R2 桶的 images/sups/ 前缀，并尝试把自定义域绑定到该桶。
# 桶名和域名从 GitHub Variables 读取，或使用 SITE_ID 派生的默认值。
#
# 依赖仓库 secrets：CLOUDFLARE_API_TOKEN（需 Account › R2 Storage › Edit
# 权限）、CLOUDFLARE_ACCOUNT_ID。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Set resource names from variables
        id: config
        env:
          CF_PROD_R2_BUCKET: ${{ vars.CF_PROD_R2_BUCKET }}
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
          SITE_ID: ${{ vars.SITE_ID }}
        run: |
          R2_BUCKET="${CF_PROD_R2_BUCKET:-${SITE_ID:-supsfactory}-files-prod}"
          CDN_DOMAIN="assets.${CF_PROD_DOMAIN:-${SITE_ID:-supsfactory}.com}"
          CDN_ZONE="${CF_PROD_DOMAIN:-${SITE_ID:-supsfactory}.com}"
          echo "r2_bucket=$R2_BUCKET" >> "$GITHUB_OUTPUT"
          echo "cdn_domain=$CDN_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "cdn_zone=$CDN_ZONE" >> "$GITHUB_OUTPUT"
      # 未配置凭据时优雅跳过，避免留下红叉。
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置，跳过。"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # 探测 token 的 R2 权限、桶是否存在，并解析自定义域所在 zone。
      - name: Preflight R2 access
        id: preflight
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ steps.config.outputs.r2_bucket }}
          CDN_ZONE: ${{ steps.config.outputs.cdn_zone }}
        run: |
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          HTTP=$(curl -sS -o /tmp/r2buckets.json -w '%{http_code}' \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?per_page=100" -H "$AUTH")
          if [ "$HTTP" = "200" ]; then
            echo "r2_ok=true" >> "$GITHUB_OUTPUT"
            if jq -e --arg b "$R2_BUCKET" '.result.buckets | any(.name == $b)' /tmp/r2buckets.json >/dev/null; then
              echo "bucket_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "bucket_exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::桶 $R2_BUCKET 不存在，将尝试创建。"
            fi
          else
            echo "r2_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::R2 API probe failed (HTTP $HTTP). CLOUDFLARE_API_TOKEN 需要 Account › R2 Storage › Edit 权限。$(jq -c '.errors' /tmp/r2buckets.json 2>/dev/null)"
          fi

          ZHTTP=$(curl -sS -o /tmp/zones.json -w '%{http_code}' \
            "$API/zones?name=$CDN_ZONE&per_page=1" -H "$AUTH")
          if [ "$ZHTTP" = "200" ]; then
            ZID=$(jq -r '.result[0].id // ""' /tmp/zones.json)
            if [ -n "$ZID" ]; then
              echo "zone_id=$ZID" >> "$GITHUB_OUTPUT"
              echo "zone_found=true" >> "$GITHUB_OUTPUT"
            else
              echo "zone_found=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Zone $CDN_ZONE 不在该账号下，自定义域绑定将跳过。"
            fi
          else
            echo "zone_found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Zone lookup failed (HTTP $ZHTTP)。"
          fi

      - name: Create R2 bucket if missing
        if: steps.guard.outputs.enabled == 'true' && steps.preflight.outputs.r2_ok == 'true' && steps.preflight.outputs.bucket_exists == 'false'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ steps.config.outputs.r2_bucket }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"$R2_BUCKET\"}" | jq .

      # 图片源已提交在本仓库 scripts/afarer-images/（从 afarer 仓库同步）。
      # --missing：只上传 R2 缺失的对象，已存在的跳过（PUT 幂等但白费 12.9MiB
      # 流量；也让"新增图忘传"在 deploy 里被自动补上）。
      - name: Upload missing afarer images to R2
        if: steps.guard.outputs.enabled == 'true' && steps.preflight.outputs.r2_ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upload-afarer-images.mjs --http --missing --src scripts/afarer-images

      - name: Attach custom domain to R2 bucket
        id: cdn
        if: steps.guard.outputs.enabled == 'true' && steps.preflight.outputs.r2_ok == 'true' && steps.preflight.outputs.zone_found == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
          R2_BUCKET: ${{ steps.config.outputs.r2_bucket }}
          CDN_DOMAIN: ${{ steps.config.outputs.cdn_domain }}
        run: |
          RESP=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET/domains/custom" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"domain\":\"$CDN_DOMAIN\",\"enabled\":true,\"zoneId\":\"$ZONE_ID\"}")
          echo "$RESP" | jq .
          if echo "$RESP" | jq -e '.success == true' >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::自定义域绑定未成功（若提示已存在可忽略）。否则请手动绑定: https://dash.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/r2/default/buckets/$R2_BUCKET/settings"
          fi

      - name: Verify upload
        if: steps.guard.outputs.enabled == 'true' && steps.preflight.outputs.r2_ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ steps.config.outputs.r2_bucket }}
          CDN_DOMAIN: ${{ steps.config.outputs.cdn_domain }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET/objects?prefix=images/sups/products/afarer-og-default&per_page=20" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq '{success, keys: [.result[].key]}'
          echo "--- CDN reachability (the 3 hero AVIFs that silently 404'd before) ---"
          for f in afarer-og-default.avif afarer-og-default-768.avif afarer-og-default-480.avif afarer-og-default.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 8 --retry-delay 5 "https://$CDN_DOMAIN/images/sups/products/$f?v=$(date +%s)")
            echo "$code https://$CDN_DOMAIN/images/sups/products/$f"
          done
