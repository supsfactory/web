name: D1 Data Verification (one-off)
on:
  workflow_dispatch:
    inputs:
      db:
        description: 'D1 database name (title) to count rows in'
        required: true
        default: 'isupfactory-db-prod'
      compare_db:
        description: 'Optional source DB to compare against (blank to skip)'
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROD_D1_ID: ${{ vars.CF_PROD_D1_ID }}
      CF_PROD_KV_ID: ${{ vars.CF_PROD_KV_ID }}
      CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # 注入真实生产资源 ID，否则 wrangler 按名字命中配置里的占位 database_id。
      - name: Generate wrangler.jsonc (real resource ids)
        run: node .github/scripts/gen-wrangler.mjs
      - name: Count rows
        run: |
          set +e
          sql="SELECT (SELECT count(*) FROM user) AS user, (SELECT count(*) FROM account) AS account, (SELECT count(*) FROM session) AS session, (SELECT count(*) FROM verification) AS verification, (SELECT count(*) FROM rateLimit) AS rateLimit, (SELECT count(*) FROM waitlist) AS waitlist, (SELECT count(*) FROM feedback) AS feedback, (SELECT count(*) FROM inquiry) AS inquiry;"
          for db in "${{ inputs.db }}" "${{ inputs.compare_db }}"; do
            [ -n "$db" ] || continue
            echo "=== db: $db"
            npx wrangler d1 execute "$db" --remote --json --command="$sql" >/tmp/v_stdout.json 2>/tmp/v_stderr.txt
            code=$?
            echo "wrangler exit=$code"
            if [ $code -ne 0 ]; then
              cat /tmp/v_stdout.json
              cat /tmp/v_stderr.txt
              continue
            fi
            jq -r '.. | objects | select(has("user")) | "user=\(.user) account=\(.account) session=\(.session) verification=\(.verification) rateLimit=\(.rateLimit) waitlist=\(.waitlist) feedback=\(.feedback) inquiry=\(.inquiry)"' /tmp/v_stdout.json 2>/dev/null
          done
      - name: Schema sanity (tables present)
        run: |
          set -e
          npx wrangler d1 execute "${{ inputs.db }}" --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite%' ORDER BY name;"