  text: 'El drop-stitch es un tejido cuyos pilares de hilo de poliéster mantienen las capas superior e inferior de PVC a una distancia fija, de modo que la presión del aire vuelve rígida la tabla. Núcleos Afarer: 1,680 DTEX, 2 hilos por pulgada cuadrada, laminado exterior de PVC de 1.2 mm, homologados a 20 PSI y validados mediante una prueba de retención de 24 horas a 1.5&times; la presión nominal.'
