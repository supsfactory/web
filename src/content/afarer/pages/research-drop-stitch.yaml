  text: 'Drop-stitch is a fabric whose pillars of polyester thread hold the top and bottom PVC layers a fixed distance apart, so air pressure turns the board rigid. Afarer cores: 1,680 DTEX, 2 threads per square inch, 1.2 mm PVC outer laminate, rated to 15 PSI, validated by a 48-hour hold test at 1.25&times; rated pressure.'
