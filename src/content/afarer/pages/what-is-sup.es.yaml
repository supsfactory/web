body: |
  <h2>¿Qué es un SUP hinchable?</h2>
  <p>Un SUP hinchable (Stand-Up Paddle Board) es una embarcación portátil fabricada con material PVC drop-stitch que se vuelve rígido al inflarse a alta presión (12-15 PSI). A diferencia de las tablas rígidas tradicionales de espuma y fibra de vidrio, un SUP hinchable puede desinflarse, enrollarse y guardarse en una bolsa del tamaño de una mochila.</p>
  <p>A pesar de ser hinchables, los SUP modernos igualan la rigidez y el rendimiento de las tablas rígidas en la mayoría de aplicaciones recreativas y de travesía. La innovación clave es la <strong>construcción drop-stitch</strong>: miles de hilos de poliéster conectan las capas superior e inferior del tejido, evitando que la tabla se abombe al presurizarse.</p>

  <h2>Cómo funciona: la tecnología drop-stitch</h2>
  <p>El núcleo de todo SUP hinchable es el tejido drop-stitch. Durante la fabricación, miles de hilos se tejen entre dos capas de tejido recubierto de PVC. Cuando la tabla se infla:</p>
  <ul>
    <li>Los hilos mantienen los paneles superior e inferior a una distancia fija</li>
    <li>Esto crea una plataforma rígida y plana que resiste la flexión</li>
    <li>A 12-15 PSI, la tabla alcanza una rigidez comparable a la de las tablas de núcleo de espuma EPS</li>
  </ul>

  <h2>Componentes clave</h2>
  <ul>
    <li><strong>Núcleo drop-stitch de PVC</strong>: la capa estructural principal que aporta rigidez</li>
    <li><strong>Banda de canto (rail)</strong>: bordes reforzados que protegen contra la abrasión y los impactos</li>
    <li><strong>Pavimento de espuma EVA</strong>: superficie antideslizante para estar de pie con comodidad y tracción</li>
    <li><strong>Sistema de quillas</strong>: quillas extraíbles para la estabilidad direccional (normalmente configuración 2+1)</li>
    <li><strong>Válvula</strong>: válvula unidireccional de alta presión para inflar y desinflar</li>
  </ul>

  <h2>Usos habituales</h2>
  <ul>
    <li><strong>Paleo en aguas tranquilas</strong>: lagos, bahías calmadas y ríos de corriente lenta</li>
    <li><strong>Travesía</strong>: paleo de larga distancia en aguas abiertas que requiere buena planeación</li>
    <li><strong>Surf</strong>: olas pequeñas y medianas (de principiante a intermedio)</li>
    <li><strong>Pesca</strong>: acceso silencioso a aguas poco profundas para pescadores</li>
    <li><strong>Fitness</strong>: yoga SUP, pilates y entrenamiento de core sobre el agua</li>
    <li><strong>Viajes</strong>: el diseño portátil lo hace ideal para aviones y viajes por carretera</li>
  </ul>

  <h2>SUP hinchable vs. rígido: diferencias clave</h2>
  <table>
    <tr><th>Aspecto</th><th>SUP hinchable</th><th>SUP rígido (EPS/Fibra de vidrio)</th></tr>
    <tr><td>Portabilidad</td><td>Cabe en una mochila</td><td>Requiere baca o vehículo grande</td></tr>
    <tr><td>Durabilidad</td><td>Resistente a impactos, sin abolladuras</td><td>Puede agrietarse, abollarse o delaminarse</td></tr>
    <tr><td>Almacenamiento</td><td>Cabe en un armario o maletero</td><td>Necesita espacio de almacenamiento dedicado</td></tr>
    <tr><td>Rendimiento</td><td>Excelente para recreo y travesía</td><td>Superior en competición y surf avanzado</td></tr>
    <tr><td>Aptitud para principiantes</td><td>Pavimento más blando, menor riesgo de lesión</td><td>Superficie dura, menos tolerante</td></tr>
    <tr><td>Tiempo de montaje</td><td>3-5 minutos de inflado</td><td>Lista para usar</td></tr>
  </table>

  <h2>Cómo elegir el SUP adecuado</h2>
  <p>Al seleccionar un SUP hinchable, ten en cuenta estos factores:</p>
  <ul>
    <li><strong>Volumen (litros)</strong>: determina la flotabilidad. Un mayor volumen soporta más peso y aporta estabilidad.</li>
    <li><strong>Longitud</strong>: las tablas más largas (11-14 pies) navegan mejor en travesía; las más cortas (9-10 pies) son más maniobrables para el surf.</li>
    <li><strong>Ancho</strong>: las tablas más anchas (32-36 pulgadas) son más estables; las más estrechas (28-31 pulgadas) son más rápidas.</li>
    <li><strong>Grosor</strong>: las tablas de 6 pulgadas ofrecen una rigidez óptima; las de 4,7 pulgadas son más ligeras y portátiles.</li>
    <li><strong>Calidad de construcción</strong>: busca drop-stitch laminado por fusión o tejido para mayor durabilidad.</li>
  </ul>

  <h2>Preguntas frecuentes</h2>
  <h3>¿Es un SUP hinchable tan rígido como una tabla rígida?</h3>
  <p>Con el inflado adecuado (12-15 PSI), los SUP drop-stitch modernos alcanzan una rigidez comparable para el paleo recreativo. Las tablas rígidas siguen teniendo ventaja en competición y surf avanzado por su menor peso y unas características de flexión más refinadas.</p>

  <h3>¿Cuánto se tarda en inflar?</h3>
  <p>Con una bomba de doble acción, la mayoría de las tablas alcanzan 12-15 PSI en 3-5 minutos. Hay bombas eléctricas disponibles que reducen el tiempo de inflado a unos 2 minutos.</p>

  <h3>¿Puedo llevar un SUP hinchable en avión?</h3>
  <p>Sí. Desinflada y enrollada, la mayoría de las tablas caben en una mochila que cumple los requisitos de equipaje facturado de las aerolíneas. Consulta siempre con tu aerolínea los límites de tamaño y peso.</p>

  <h3>¿Cómo de duraderos son los SUP hinchables?</h3>
  <p>Los SUP hinchables son muy duraderos. La construcción de PVC de grado militar resiste impactos, perforaciones y daños por rayos UV. Las perforaciones pequeñas pueden repararse sobre el terreno con el kit de reparación incluido.</p>

  <h3>¿Qué mantenimiento requieren?</h3>
  <p>Aclara con agua dulce después del uso en agua salada. Guárdala en un lugar fresco y seco, alejada de la luz solar directa. Durante el almacenamiento prolongado, infla parcialmente para mantener la forma sin someter a presión las costuras.</p>