qc_section:
  tagline: Quality Control
  title: Testing & Quality Assurance Process
  subtitle: Every board undergoes mandatory testing before shipping. Our quality lab operates independently from production and reports directly to management.
  steps:
    - step: '1'
      title: Raw Material Inspection
      desc: PVC, Hypalon, and drop-stitch fabrics undergo tensile testing (), tear propagation, and UV resistance verification before any batch enters production.
    - step: '2'
      title: 48-Hour Air Retention Test
      desc: Every tube chamber is inflated to 125% of rated pressure and held for 48 hours. Pressure drop below 5% triggers automatic rejection and seam re-inspection.
    - step: '3'
      title: Load & Balance Testing
      desc: Completed boards are inflated to rated pressure and checked for symmetric swell, rigidity at 15 PSI, and stability under load. Each board is wet-tested in our test pool before final inspection.

oem_section:
  tagline: OEM Projects
  title: Brand & OEM Partnership Case Studies
  subtitle: From concept to container —how we help global brands launch and scale their inflatable SUP lines.
  cases:
    - challenge: European outdoor retailer needed a private-label SUP line with unique deck graphics, eco-friendly PVC, and retail-ready packaging —all delivered in 60 days.
      solution: Developed custom digital print files, sourced REACH-compliant PVC, and compressed sampling from 3 rounds to 1 by co-locating the design team at our Qingdao factory.
      result: 55 days from signed PO to FOB. 2,400 units across 4 SKUs. Repeat order placed before first container arrived.
    - challenge: US watersports startup needed a high-performance drop-stitch SUP with custom shape, co-branded packaging, and BSCI certification for retail placement.
      solution: Adapted existing SUP mould with modified outline, developed co-branded packaging artwork, and provided full BSCI audit documentation.
      result: Successfully listed in 3 major US outdoor chains. 5,000+ units in first year with 98% sell-through rate.
    - challenge: Australian distributor required a CE-certified SUP range with custom colours and compliance with Australian standards.
      solution: Produced pre-production samples with 4 colour variants and coordinated third-party compliance testing.
      result: 3-model SUP range launched in AU/NZ market. Followed by government tender win for 12 patrol SUPs.

faq_section:
  tagline: FAQ
  title: B2B & OEM Frequently Asked Questions
  questions:
    - q: What is the minimum order quantity (MOQ) for OEM inflatable SUP boards?
      a: 'MOQ is tiered: 5–10 units for standard trial orders, 50 units per design for a standard OEM batch, and 200 units for custom-mould or private-label projects depending on complexity. Trial orders and sample runs are available for new brand launches.'
    - q: Does afarer hold BSCI certification?
      a: Yes. Our factory maintains valid BSCI social compliance certification (audit report available on request). We also hold ISO 9001 for quality management. Standard models carry CE marking per Directive 2013/53/EU, and custom models can be CE certified through our established process. REACH and RoHS compliance documentation is provided with every OEM shipment.
    - q: What is the typical lead time for an OEM order?
      a: Standard lead time is 30–45 days from confirmed PO and deposit for bulk OEM production. Custom mould development adds 15–20 days for tooling. Expedited production is available for urgent orders and seasonal rushes. Prototype samples typically ship within 15–20 days.
    - q: Can you ship FOB Qingdao or CIF to our port?
      a: Yes. We ship FOB Qingdao, CIF major global ports, and DDP for qualified partners. Our logistics team manages container booking, export documentation, and customs clearance. We ship to 50+ countries across EU, US, AU, and Asia markets.

b2b_moq: 'Tiered MOQ: 5–10 units trial, 50 units per design standard OEM batch, 200 units custom mould / private label.'

production_flow:
  tagline: Production Flow
  title: From Material to Finished Board
  subtitle: Every board passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: '01'
      title: Material Receiving & Incoming QC
      description: 'All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.'
      qc_check: 'Tensile strength (ASTM D751), tear resistance (ISO 4674), thickness gauge, adhesive viscosity, visual defect scan'
      qc_threshold: '100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect'
      responsibility: Incoming QC team (3 inspectors)
    - stage: '02'
      title: CNC Cutting & Material Prep
      description: 'Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.'
      qc_check: 'Dimensional check against CAD DXF files, edge quality inspection, panel count verification'
      qc_threshold: 'Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance'
      responsibility: Cutting workshop lead
    - stage: '03'
      title: Welding & Drop-Stitch Bonding
      description: 'Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.'
      qc_check: 'Peel test every 50 units (ASTM D751), weld width measurement, hot-air temperature log review, visual seam inspection under backlight'
      qc_threshold: 'Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject'
      responsibility: Welding QC (2 inspectors per shift)
    - stage: '04'
      title: Assembly & Rigging
      description: 'Boards move to final assembly where all components come together: deck and hull panels fused, valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist.'
      qc_check: '100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection'
      qc_threshold: 'Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic: AQL 2.5 (ISO 2859)'
      responsibility: Assembly team lead + line QC
    - stage: '05'
      title: Pressure Testing & Quality Hold
      description: 'Every chamber is inflated to 1.25× rated pressure (typically about 19 PSI for a 12–15 PSI rated SUP) and held for 48 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.'
      qc_check: '48h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair'
      qc_threshold: 'Max 5% pressure drop over 48h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch'
      responsibility: Quality lab (independent of production, reports to management)
    - stage: '06'
      title: Final Inspection & Packing
      description: 'Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.'
      qc_check: 'Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification'
      qc_threshold: 'AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units visually inspected'
      responsibility: Final QC team (4 inspectors) + Packing team lead

