workshops_section:
  tagline: Workshops
  title: Manufacturing Workshops
  workshops:
    - title: PVC Cutting & Material Preparation
      description: Automatic CNC cutting machines process PVC, Hypalon, and drop-stitch fabrics with sub-millimetre precision. Computer-optimised nesting minimises material waste and ensures every panel meets its dimensional specification before welding.
      image: https://assets.afarer.com/images/afarer/hero/production-dept.webp
      alt: CNC PVC cutting machine preparing inflatable SUP fabric panels at Qingdao factory
    - title: Tube Welding & Heat Sealing
      description: Dedicated welding workshop with heat sealing machines  and RF dielectric presses. Hot-air heat sealers bond and fuse PVC tube chambers, while RF welds produce high-strength airtight seams that exceed  requirements.
      image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
      alt: RF welding machine sealing inflatable boat tube chambers at Qingdao factory
    - title: Drop-Stitch Core Bonding
      description: SUP board drop-stitch cores are bonded to outer PVC laminates using heat lamination. Thousands of internal polyester threads connect top and bottom layers, creating a rigid structure at 12-15 PSI. Rail bands are triple-layer fusion bonded for edge strength.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
      alt: Drop-stitch SUP core being bonded to PVC laminate in heat lamination press
    - title: SUP Printing & Decoration
      description: SUP boards are decorated using digital printing  for full-colour graphics and screen printing  for logos and repeating patterns. Digital printers produce photo-quality deck designs, while screen printing delivers durable, vivid brand marks.
      image: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
      alt: Digital printer applying full-colour deck graphics to inflatable SUP board
    - title: Final Assembly & Fitting
      description: Assembly line where valves, D-rings, handles, fin boxes, and deck pads are installed on each SUP board. Each board follows a 100-point assembly checklist signed off by the team lead.
      image: https://assets.afarer.com/images/afarer/hero/factory-gate.webp
      alt: Inflatable SUP final assembly line installing valves, D-rings and deck pads at Qingdao factory
    - title: Quality Testing & Inspection
      description: Every completed board undergoes mandatory air-retention testing, seam peel verification, and a full systems check before shipping. Our quality lab operates independently from production and reports directly to management.
      image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
      alt: Pressure testing inflatable SUP for air retention before shipping at Qingdao factory

