faqs_sup:
  title: 'SUP Board FAQs'
  subtitle: 'Common questions about our stand-up paddle boards.'
  columns: 2
  items:
    - title: 'What SUP board sizes does afarer offer?'
      description: 'We offer SUP boards from 9 ft to 12 ft, covering everything from compact all-around boards to touring and specialty designs. Each model is available with multiple configuration options.'
    - title: 'What is the difference between an inflatable SUP and a hard SUP?'
      description: 'An inflatable SUP uses drop-stitch construction with thousands of internal threads allowing high air pressure, while a hard SUP uses epoxy or fiberglass. Inflatable SUPs offer portability and storage convenience without sacrificing rigidity.'
    - title: 'What is the weight limit for SUP boards?'
      description: 'Our SUP boards support up to 150 kg depending on the model and volume. Each product page lists the maximum load rating for your specific model.'
    - title: 'Are afarer SUPs CE certified?'
      description: 'Yes. All recreational SUP models are CE certified under applicable European standards for recreational use.'
    - title: 'What is the warranty on SUP boards?'
      description: 'All afarer SUPs come with a standard one-year warranty against manufacturing defects, covering seam failure, valve defects, and material delamination under normal use.'
    - title: 'How long does it take to inflate a SUP board?'
      description: 'Using the included hand pump, a full inflation to 15 PSI takes approximately 8–12 minutes. For faster inflation, we recommend our afarer 12V electric pump, which inflates a board in under 4 minutes.'

faqs_materials:
  title: 'SUP Material & Care FAQs'
  subtitle: 'Common questions about our inflatable SUP materials, care, and storage.'
  columns: 2
  items:
    - title: 'What materials are used in afarer inflatable SUPs?'
      description: 'We use military-grade PVC (1100 denier) with UV-stabilized, abrasion-resistant construction, compliant with EU REACH and RoHS regulations.'
    - title: 'How long do inflatable SUPs last?'
      description: 'With proper care, a quality PVC inflatable SUP lasts 5–10 years. Regular cleaning, UV protection, and proper storage significantly extend service life.'
    - title: 'What maintenance is required for an inflatable SUP?'
      description: 'Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and avoiding prolonged sun exposure when not in use.'
    - title: 'Can inflatable SUPs be used in saltwater?'
      description: 'Yes. All afarer inflatable SUPs are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure.'
    - title: 'How do I store an inflatable SUP?'
      description: 'Deflate, clean, and dry the board completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.'
    - title: 'What is the weight capacity of afarer inflatable SUPs?'
      description: 'Weight capacities range from 100 kg for our smallest models to over 200 kg for larger boards. Each product page lists the maximum load rating for your specific model.'

