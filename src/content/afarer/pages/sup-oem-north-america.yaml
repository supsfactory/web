answer:
  label: 'Straight answer'
  text: 'North American brands order inflatable SUP from SUPsfactory on standard terms: MOQ is confirmed by project configuration: sample runs of 1–2 pcs validate the build, pilot batches of 20–50 pcs test the market on existing platforms, and standard volume production runs 90–100+ pcs per design from a full 150 m drop-stitch roll. The first sample ships 7–12 days after specification approval, production runs 25–35 days after confirmed PO and deposit, and sea freight adds 4–6 weeks to US or Canadian ports. DDP covers customs clearance and delivery to your warehouse.'
