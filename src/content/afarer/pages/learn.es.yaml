hero:
  tagline: 'Conocimiento para explorar el agua'
  title: 'Aprende'
  subtitle: |
    Guías, tutoriales y análisis en profundidad: todo lo que necesitas para
    explorar el agua con confianza. Desde elegir tu primer SUP hasta dominar técnicas avanzadas.
  taglineSection: 'Conocimiento para cada paddler. De principiante a profesional.'

featured:
  tagline: 'Temas destacados'
  title: 'Comienza tu viaje de aprendizaje'
  subtitle: 'Tanto si eres nuevo en los deportes acuáticos como si quieres subir de nivel, nuestras guías te lo ponen fácil.'
  items:
    - title: 'Nociones de SUP'
      description: 'Todo lo que un principiante necesita saber: tipos de tablas, talla del remo, postura y consejos para el primer día.'
      icon: 'tabler:lifebuoy'
      href: '/es/academy'
    - title: 'Tabla hinchable vs. rígida'
      description: '¿Cuál te conviene? Comparamos portabilidad, rendimiento, durabilidad y coste, lado a lado.'
      icon: 'tabler:arrows-left-right'
      href: '/es/inflatable-vs-hardboard'
    - title: 'Seguridad en el agua'
      description: 'Conocimientos de seguridad esenciales que todo paddler debe tener: clima, dispositivos de flotación, autorrescate y más.'
      icon: 'tabler:shield'
      href: '/es/safety'
    - title: 'Guía de materiales'
      description: 'PVC frente a Hypalon, tecnología drop-stitch, clasificación denier: entiende de qué está hecho tu equipo.'
      icon: 'tabler:flask'
      href: '/es/research'
    - title: 'Guía de tallas de SUP'
      description: 'Encuentra el largo, ancho y volumen de tabla adecuados para tu peso, nivel y estilo de paleo.'
      icon: 'tabler:ruler'
      href: '/es/size-guide'
    - title: 'Técnicas intermedias'
      description: 'Mejora tu paleo con brazadas avanzadas, técnicas de giro y manejo en aguas agitadas.'
      icon: 'tabler:droplet'
      href: '/es/learn'

