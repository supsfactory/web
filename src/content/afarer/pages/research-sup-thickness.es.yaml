  subtitle: '6 min de lectura'

answer:
  label: 'Respuesta directa'
  text: 'El grosor equilibra la rigidez y la estabilidad: el de 4\" (10 cm) es el más rígido, ligero y rápido: ideal para travesía y competición; el de 5\" (12.7 cm) es la elección polivalente para la mayoría de los paleadores; el de 6\" (15.2 cm) maximiza la estabilidad primaria para yoga y paleadores más pesados (100+ kg). Una sección más delgada es estructuralmente más rígida, por lo que una tabla de 4\" a 15 PSI se flexiona menos que una de 6\" a 25 PSI.'
  verified: '2026-08'

content_html: |
  <h2>Los tres grosores estándar</h2>

  <h3>4" (10 cm) – Travesía y rendimiento</h3>
  <ul>
    <li>Máxima rigidez: menor flexión bajo carga</li>
    <li>La más ligera: menos material, menos volumen de aire</li>
    <li>Excelente dirección: menos balanceo lateral</li>
    <li>La más rápida: menor resistencia, planeo más fácil</li>
    <li>Ideal para: travesía, competición, paleo fitness y paleadores experimentados</li>
  </ul>

  <h3>5" (12.7 cm) – Polivalente</h3>
  <ul>
    <li>Buena rigidez: proporción equilibrada entre flexión y rigidez</li>
    <li>Peso moderado: uso estándar de material</li>
    <li>Buena estabilidad primaria y secundaria</li>
    <li>Ideal para: paleo recreativo, principiantes y uso ocasional en lagos y ríos</li>
  </ul>

  <h3>6" (15.2 cm) – Estabilidad y yoga</h3>
  <ul>
    <li>Máxima estabilidad primaria: flotabilidad enorme</li>
    <li>La más pesada: más material de PVC, mayor volumen de aire</li>
    <li>La más lenta: más resistencia, más difícil mantener el planeo</li>
    <li>Ideal para: yoga/fitness, paleadores pesados (100+ kg) y aguas muy picadas</li>
  </ul>

  <h2>Análisis de ingeniería</h2>
  <p>La rigidez de un SUP hinchable viene determinada por la presión interna del aire y por el momento de inercia de la sección transversal de la tabla. A 20 PSI, una tabla de 4" presenta aproximadamente un 30% menos de deflexión bajo carga que una de 6" de la misma anchura y longitud. La estabilidad primaria procede de la anchura en la línea de flotación y de la flotabilidad; la estabilidad secundaria está influida por la forma del rail y la anchura de la tabla.</p>

  <h2>Grosor según el peso del paleador</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Peso del paleador</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Grosor recomendado</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Menos de 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" o 6"</td></tr>
      <tr><td class="p-3 border">Más de 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Equilibrio entre grosor y PSI</h2>
  <p>Una idea errónea habitual es que un PSI más alto puede compensar un grosor excesivo. A 25 PSI, una tabla de 6" muestra más flexión que una de 4" a 15 PSI porque el momento de inercia geométrico domina la ecuación de la rigidez. Para los paleadores orientados al rendimiento, una tabla más delgada a menor presión supera a una tabla más gruesa a mayor presión.</p>

  <h2>Gama de Afarer</h2>
  <ul>
    <li><strong>Tablas de 4":</strong> serie Cheetah Touring: SUP de travesía de 12' x 30" x 4" para fitness y paleo de larga distancia</li>
    <li><strong>Tablas de 5":</strong> serie Cheetah All-Round: 10'6" x 32" x 5" para uso recreativo</li>
    <li><strong>Tablas de 6":</strong> serie Cheetah Ultra-Stable: 10' x 34" x 6" para yoga, paleadores grandes y plataformas de fotografía</li>
  </ul>
  <p>Todas las tablas utilizan núcleos drop-stitch de 1,680 DTEX con presión nominal de 20 PSI y laminados de PVC de 1.2 mm.</p>
  <p>El grosor, el PSI y la especificación del tejido son configurables para líneas personalizadas: descubre cómo <a href="/oem-odm-manufacturer">diseñamos tablas para marcas OEM y de marca blanca</a> y recorre nuestra construcción de tablas en la <a href="/factory">planta de la fábrica</a>.</p>

