oem_section:
  tagline: Launch Your Brand
  title: From Idea To Market In 16 Weeks
  subtitle: Your complete SUP brand launch partner — design, prototype, manufacture, and ship.
  steps:
    - number: '01'
      title: Idea & Brief
      desc: Share your vision, target market, and specifications.
    - number: '02'
      title: Design & Engineering
      desc: 3D modeling, material selection, and custom graphic design.
    - number: '03'
      title: Prototype & Validate
      desc: Sample production with CE certification and quality testing.
    - number: '04'
      title: Mass Production
      desc: Full-scale manufacturing with inline QC and factory audit support.
    - number: '05'
      title: Global Delivery
      desc: FOB Qingdao logistics, CIF major ports, door-to-door.
