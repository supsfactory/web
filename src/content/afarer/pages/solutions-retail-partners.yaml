meta:
  title: 'Custom & Private Label SUP Production For Retailers | {SITE}'
  description: 'Custom and private label SUP production for retail brands: board specifications, branded graphics, low trial MOQ and factory QC — from sample to bulk.'

hero:
  tagline: Retail Brands
  title: 'Custom SUP Production For Retail Brands'
  subtitle: 'Retail brands launch their own paddle board line with our factory: board specifications developed from your requirements, your brand on the product, and production QC handled end to end.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Afarer SUP boards produced for a retail brand

margin_section:
  title: 'Production Tiers For Retail Brands'
  subtitle: 'Start with a trial batch, scale to a standard OEM run, or invest in a custom mould — MOQ and lead times are set by the production path, not by guesswork.'
  items:
    - tier: 'Trial Batch'
      moq: '5–10 units'
      margin_note: 'Sample lead time 15–20 days'
      features:
        - 'Artwork development from your brand assets'
        - 'Physical sample for approval'
        - 'Standard platform QC'
    - tier: 'Standard OEM Batch'
      moq: '50 units per design'
      margin_note: 'Bulk production 30–45 days'
      features:
        - 'Full-board graphics, logo and EVA layout'
        - 'Reorders on the same verified platforms'
        - 'Export documentation included'
    - tier: 'Custom Mould'
      moq: '200 units'
      margin_note: 'Tooling adds 15–20 days'
      features:
        - 'New board shape and mould development'
        - 'Full specification control'
        - 'Priority production allocation'

