workshops:
  - title: Producción de tablas de SUP
    description: '4 líneas de ensamblaje en paralelo para tablas de SUP hinchables. Cada línea puede producir 50–80 tablas por turno. Las estaciones de impresión digital y serigrafía funcionan simultáneamente. Capacidad anual de SUP: más de 8.000 tablas.'
    output: 'Más de 8.000 SUP al año'
  - title: Producción de tablas de SUP
    description: 'Capacidad de producción ampliada para tablas de SUP con líneas de ensamblaje adicionales. La unión de núcleos drop-stitch, la impresión digital y las estaciones de ensamblaje funcionan en paralelo.'
    output: 'Capacidad de SUP ampliada'
  - title: Tablas y accesorios SUP
    description: 'Líneas de producción polivalentes para tablas de SUP y accesorios. Las estaciones de soldadura de aire caliente, las prensas dieléctricas RF y los puestos de ensamblaje se reconfiguran según la mezcla de pedidos. Capacidad anual: más de 5.000 unidades.'
    output: 'Más de 5.000 unidades al año'
  - title: Equipo de seguridad
    description: 'Área de producción de sala limpia independiente para chalecos salvavidas y equipo de seguridad. Estaciones dedicadas de costura, inserción de espuma y ensayos. Capacidad anual de chalecos salvavidas: más de 50.000 unidades.'
    output: 'Más de 50.000 chalecos salvavidas al año'

oem_capacity:
  moq: 'SUP: 5–10 de prueba | 50 lote estándar | Molde personalizado: más de 200 unidades'
  lead_time: 'Estándar de 30–45 días. Muestras en 15–20 días. Acelerado disponible.'
  payment: 'T/T 30% de depósito + 70% antes del envío. Se aceptan L/C y Western Union.'

lead_time_explainer:
  tagline: 'Planificación y programación'
  title: 'Cómo se traduce la capacidad en tu entrega'
  subtitle: 'La capacidad no es un número único: así se asignan realmente los plazos.'
  items:
    - title: 'La capacidad varía según tu especificación'
      body: 'Los huecos disponibles cambian según el tipo de tabla, la complejidad de construcción, el packaging y la demanda estacional. Durante el pico de primavera/verano, las líneas están al máximo y los huecos de muestras se reservan primero.'
    - title: 'Planifica antes de tu temporada de lanzamiento'
      body: 'Fija pronto la confirmación de muestras y el cierre de arte. Los pedidos repetidos se programan en tu hueco recurrente acordado una vez archivada la muestra dorada.'
    - title: 'Tres vías de programación'
      body: 'Las muestras entran primero en la línea de prototipos, los pedidos iniciales se colocan en la ventana de ensamblaje abierta más próxima y los pedidos repetidos se ejecutan en su hueco recurrente.'
    - title: 'Plazos firmes tras la revisión'
      body: 'Confirmamos un plazo firme solo después de revisar especificación, arte, packaging y cantidad — nunca como una promesa fija a priori.'

cta:
  title: 'Comprueba la disponibilidad de producción para tu fecha de lanzamiento'
  subtitle: 'Envía tu tipo de tabla, cantidad y fecha de envío objetivo — respondemos con la próxima ventana de producción abierta y una estimación de plazo firme.'
  button_text: 'Comprobar disponibilidad'
  button_link: /contact