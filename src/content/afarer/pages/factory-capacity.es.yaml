hero:
  tagline: Capacidad de producción
  title: Capacidad de fabricación y producción anual
  subtitle: 'Instalación de 12.000 m² que produce más de 15.000 tablas de SUP al año, con margen para escalar'

answer:
  label: 'Respuesta directa'
  text: 'Capacidad de la fábrica: 12.000 m² repartidos en seis talleres, más de 15.000 tablas de SUP al año, más de 200 trabajadores en dos turnos y exportación a más de 50 países. El MOQ se estructura por tramos: pedido de prueba de 5–10 unidades, 50 unidades por diseño en lote OEM estándar y más de 200 unidades para molde personalizado. Plazo de entrega de 30–45 días y muestras en 15–20 días.'
  verified: '2026-08'

intro: afarer opera una de las instalaciones dedicadas más grandes de fabricación de SUP hinchables en Qingdao, China. Nuestra fábrica de 12.000 m² está organizada en seis talleres especializados que trabajan en paralelo, lo que nos da la capacidad de producir más de 15.000 tablas al año en las líneas de SUP y equipo de seguridad.

