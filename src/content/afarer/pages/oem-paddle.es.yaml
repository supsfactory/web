faqs:
  title: 'Preguntas frecuentes sobre la producción OEM'
  subtitle: 'Respuestas a las preguntas más habituales de las marcas que lanzan su propio paddle.'
  items:
    - title: '¿Cómo creo mi propia marca de paddle?'
      description: 'Lanza tu marca: briefing, diseño, prototipo certificado CE, producción en serie y entrega. Muestras en 15-20 días y producción en 30-45 días a partir del pedido y del depósito. Explora nuestros paquetes OEM.'
    - title: '¿Cuál es el plazo de producción?'
      description: 'La muestra está lista en 15-20 días y la producción en serie en 30-45 días después del pedido y del depósito, según el volumen.'
    - title: '¿El paddle lleva nuestro logotipo?'
      description: 'Sí: marca privada completa con impresión del logotipo, colores personalizados, embalaje y etiquetas en tu marca.'
    - title: '¿Puedo comprar en gran volumen desde el primer día?'
      description: 'El volumen mínimo se escalona: 5-10 unidades para pedidos de prueba, 50 unidades para modelos estándar y 200 unidades para moldes personalizados, con precios por mayor que mejoran a medida que aumenta el volumen.'

