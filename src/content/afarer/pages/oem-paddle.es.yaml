  label: 'Respuesta directa'
  text: 'Cantidad mínima de pedido: 5-10 unidades para un pedido de prueba, 50 unidades por modelo para la producción OEM estándar y 200 unidades para proyectos con molde a medida. Las muestras se envían en 15-20 días; la producción en serie tarda 30-45 días tras la confirmación del pedido y el depósito. La certificación CE y toda la documentación de conformidad se incluyen en cada pedido.'
