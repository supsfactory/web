steps2_manufacturing:
  title: 'Cómo garantizamos la calidad'
  subtitle: 'Desde la inspección de materias primas hasta el ensayo de presión final: cada producto pasa por una rigurosa cadena de calidad.'
  items:
    - title: 'Inspección de materias primas'
      description: 'Cada rollo de tejido PVC se ensaya en cuanto a grosor, resistencia a la tracción y resistencia UV antes de entrar en producción.'
      icon: 'tabler:search'
    - title: 'Control de calidad en proceso'
      description: 'Las soldaduras, las instalaciones de válvulas y las uniones de cámaras se inspeccionan en cada estación durante el montaje.'
      icon: 'tabler:eye'
    - title: 'Ensayo de presión'
      description: 'Cada producto hinchable se infla a 1,5× el PSI nominal y se mantiene 24 horas para verificar la retención de aire y la integridad de las costuras.'
      icon: 'tabler:wind'
    - title: 'Inspección final'
      description: 'Cada unidad se inspecciona en cuanto a acabado, herrajes y embalaje antes de aprobarse para su envío. Las muestras de lote se envían a nuestro laboratorio para ensayos destructivos.'
      icon: 'tabler:clipboard-check'

