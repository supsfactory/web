faqs_sup:
  title: 'Preguntas frecuentes sobre tablas de SUP'
  subtitle: 'Preguntas habituales sobre nuestras tablas de paddle surf.'
  columns: 2
  items:
    - title: '¿Qué tallas de tablas de SUP ofrece afarer?'
      description: 'Ofrecemos tablas de SUP desde 9 hasta 12 pies, cubriendo desde tablas polivalentes compactas hasta diseños de travesía y especiales. Cada modelo está disponible con múltiples opciones de configuración.'
    - title: '¿Cuál es la diferencia entre un SUP hinchable y un SUP rígido?'
      description: 'Un SUP hinchable usa construcción drop-stitch con miles de hilos internos que permiten una alta presión de aire, mientras que un SUP rígido usa epoxi o fibra de vidrio. Los SUP hinchables ofrecen portabilidad y comodidad de almacenamiento sin sacrificar rigidez.'
    - title: '¿Cuál es el límite de peso de las tablas de SUP?'
      description: 'Nuestras tablas de SUP soportan hasta 150 kg según el modelo y el volumen. Cada página de producto indica la carga máxima de tu modelo concreto.'
    - title: '¿Están certificados CE los SUP de afarer?'
      description: 'Sí. Todos los modelos recreativos de SUP están certificados CE según las normas europeas aplicables para uso recreativo.'
    - title: '¿Cuál es la garantía de las tablas de SUP?'
      description: 'Todos los SUP de afarer incluyen una garantía estándar de un año contra defectos de fabricación, que cubre fallos de costuras, defectos de válvulas y delaminación de materiales en condiciones de uso normal.'
    - title: '¿Cuánto se tarda en inflar una tabla de SUP?'
      description: 'Con la bomba manual incluida, el inflado completo a 15 PSI tarda aproximadamente 8–12 minutos. Para un inflado más rápido, recomendamos nuestra bomba eléctrica afarer de 12 V, que infla una tabla en menos de 4 minutos.'

faqs_materials:
  title: 'Preguntas frecuentes sobre materiales y cuidados del SUP'
  subtitle: 'Preguntas habituales sobre los materiales, el cuidado y el almacenamiento de nuestros SUP hinchables.'
  columns: 2
  items:
    - title: '¿Qué materiales se usan en los SUP hinchables de afarer?'
      description: 'Usamos PVC de grado militar (1100 denier) con construcción estabilizada contra rayos UV y resistente a la abrasión, conforme a los reglamentos REACH y RoHS de la UE.'
    - title: '¿Cuánto duran los SUP hinchables?'
      description: 'Con los cuidados adecuados, un SUP hinchable de PVC de calidad dura de 5 a 10 años. La limpieza regular, la protección UV y un almacenamiento correcto prolongan considerablemente la vida útil.'
    - title: '¿Qué mantenimiento requiere un SUP hinchable?'
      description: 'El mantenimiento básico incluye aclarar con agua dulce tras cada uso (especialmente en agua salada), secar antes del almacenamiento, revisar los sellos de las válvulas anualmente y evitar la exposición prolongada al sol cuando no se usa.'
    - title: '¿Pueden usarse los SUP hinchables en agua salada?'
      description: 'Sí. Todos los SUP hinchables de afarer están diseñados para uso en agua dulce y salada. Recomendamos aclarar con agua dulce y secar bien tras la exposición al agua salada.'
    - title: '¿Cómo guardo un SUP hinchable?'
      description: 'Desinfla, limpia y seca completamente la tabla antes de guardarla. Enróllala sin apretar (evita pliegues marcados), guárdala en un lugar fresco y seco lejos de la luz solar directa y evita los suelos de hormigón para impedir la absorción de humedad.'
    - title: '¿Cuál es la capacidad de peso de los SUP hinchables de afarer?'
      description: 'Las capacidades de peso van desde 100 kg en nuestros modelos más pequeños hasta más de 200 kg en las tablas más grandes. Cada página de producto indica la carga máxima de tu modelo concreto.'

