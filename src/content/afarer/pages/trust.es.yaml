  isBeforeContent: true
  items:
    - title: 'Certificación CE'
      description: 'Todos los SUP de afarer cumplen la norma europea de seguridad CE para uso recreativo. Cada producto se somete a ensayos de presión, flotabilidad y carga antes de salir de la fábrica.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001:2015'
      description: 'Nuestra planta de Qingdao, de 12.000 m², opera bajo un sistema de gestión de calidad. Cada lote de producción es trazable, documentado e inspeccionado.'
      icon: 'tabler:clipboard-check'
    - title: 'Cumplimiento social BSCI'
      description: 'Estamos certificados BSCI, lo que garantiza prácticas laborales éticas, condiciones de trabajo seguras y responsabilidad medioambiental en toda nuestra cadena de suministro.'
      icon: 'tabler:users'
    - title: 'REACH y RoHS'
      description: 'Todos los materiales (PVC, Hypalon, espuma EVA, adhesivos) cumplen los reglamentos REACH y RoHS de la UE. Sin sustancias restringidas, sin concesiones.'
      icon: 'tabler:flask'
    - title: 'Laboratorio de ensayo de materiales'
      description: 'El laboratorio interno de materiales ensaya la resistencia a la tracción, la resistencia UV, la integridad de las costuras y la abrasión de cada lote de tejido antes de la producción.'
      icon: 'tabler:microscope'
    - title: 'Garantía de 2 años'
      description: 'Cada producto afarer incluye una garantía de dos años contra defectos de fabricación. Respaldo lo que construimos.'
      icon: 'tabler:shield-check'

