tests:
  - title: Ensayo de presión
    description: Las cámaras hinchables se someten a presiones superiores a sus límites operativos recomendados durante periodos prolongados. Esto verifica la estanqueidad y la integridad estructural del material y las costuras, garantizando que el producto resista el uso previsto y una posible sobrepresión sin fallos ni fugas.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
    alt: Cámara de SUP hinchable bajo ensayo de presión para verificar la estanqueidad
  - title: Ensayo de impacto
    description: Los productos se someten a impactos controlados desde distintos pesos y ángulos. Esto evalúa la resistencia del material a perforaciones, desgarros y daños por colisiones con obstáculos en el agua, demostrando durabilidad y longevidad.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Equipo de ensayo de impacto evaluando la resistencia a perforaciones del material de embarcaciones hinchables
  - title: Ensayo de resistencia UV
    description: Las muestras de material se exponen a radiación UV acelerada para comprobar que no amarilleen, se agrieten ni pierdan resistencia con el tiempo. Cada lote de PVC se verifica contra la degradación solar antes de su uso en producción.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
    alt: Muestras de PVC bajo radiación UV acelerada en ensayo de resistencia
  - title: Ensayo de resistencia a la abrasión
    description: Las muestras de material se frotan contra superficies abrasivas durante un número determinado de ciclos bajo presión controlada. Esto mide la capacidad del material para soportar el desgaste por uso repetido, el contacto con arena, rocas u otras superficies, garantizando la durabilidad a largo plazo.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
    alt: Máquina de abrasión frotando una muestra de tela de PVC para medir la resistencia al desgaste
  - title: Ensayo de rendimiento a baja temperatura
    description: Los productos se ensayan en entornos fríos para evaluar su funcionalidad y durabilidad en distintas condiciones de temperatura, evitando rigidez o grietas en aguas más frías. Esencial para embarcaciones destinadas a uso invernal o de alta latitud.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
    alt: Producto hinchable en cámara fría para ensayo de rendimiento a baja temperatura
  - title: Ensayo de flotabilidad y capacidad de carga
    description: Los productos se ensayan con distintos pesos para determinar su capacidad máxima de carga y garantizar que soporten con seguridad a usuarios y equipo. La capacidad nominal de cada modelo se verifica antes de su lanzamiento.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
    alt: Ensayo de flotabilidad y capacidad de carga con pesos sobre una embarcación hinchable
  - title: Ensayo de maniobrabilidad
    description: Los productos se ensayan en cuanto a su respuesta a los movimientos de paleo o motor, evaluando el radio de giro y la facilidad de manejo. Las pruebas sobre el agua verifican que el comportamiento real coincide con las especificaciones de diseño.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
    alt: Ensayo de maniobrabilidad en el agua de tablas SUP y cascos de embarcaciones hinchables
  - title: Ensayo de estanqueidad
    description: Los productos totalmente ensamblados se sumergen o se someten a pulverización de agua para comprobar posibles fugas por costuras, válvulas o materiales. Cada embarcación supera una verificación obligatoria de estanqueidad antes del envío.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
    alt: Ensayo de estanqueidad por inmersión comprobando costuras y válvulas
content_certifications:
  tagline: Nuestras certificaciones
  title: 'Calidad certificada, reconocida mundialmente'
  subtitle: 'Una certificación solo vale por lo que cubre. A continuación, el alcance de cada certificación, el titular del certificado y cómo verificar o solicitar los documentos para tu proyecto.'
  items:
    - title: 'Marcado CE'
      description: 'Los modelos estándar de SUP y embarcaciones llevan el marcado CE según la Directiva 2013/53/UE para embarcaciones de recreo. Los modelos personalizados se certifican CE mediante nuestro proceso establecido para tu configuración. Números de certificado e informes de ensayo disponibles bajo petición.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Sistema de gestión de calidad certificado según ISO 9001:2015, que cubre el diseño, la fabricación y la distribución de embarcaciones hinchables y equipo marino. Alcance de la certificación e informe de auditoría disponibles bajo petición.'
      icon: tabler:clipboard-check
    - title: 'Cumplimiento BSCI'
      description: 'Auditado según BSCI (Business Social Compliance Initiative), cubriendo las condiciones de trabajo y el cumplimiento de la fábrica. Informe de auditoría disponible bajo petición.'
      icon: tabler:heart-handshake
    - title: 'Cumplimiento REACH'
      description: 'Los materiales cumplen el reglamento europeo REACH de seguridad química. Las declaraciones de materiales se entregan con la documentación de producción de cada envío.'
      icon: tabler:flask
    - title: 'Cumplimiento RoHS'
      description: 'Cumplimiento de sustancias peligrosas restringidas documentado según RoHS para los componentes y materiales aplicables.'
      icon: tabler:flame
    - title: 'Ensayo de materiales'
      description: 'Los tejidos se ensayan en cuanto a resistencia a la tracción, resistencia al desgarro, degradación UV y comportamiento ante grietas por frío. Cada lote de producción se muestrea y verifica según el protocolo de ensayo publicado.'
      icon: tabler:test-pipe
content_factory:
  tagline: Estándares de fábrica
  title: 'Excelencia en fabricación — construido según especificación'
  subtitle: 'Nuestra planta de 12.000 m² opera bajo estrictos protocolos de control de calidad en cada etapa de la producción.'
  list:
    - 'Inspección de materiales entrantes: todas las materias primas (tejido PVC, Hypalon, aluminio, contrachapado, adhesivos) se ensayan contra las especificaciones antes de entrar en producción.'
    - 'Control de calidad en proceso: cada etapa de producción tiene puntos de control documentados. La resistencia de soldaduras, la alineación de costuras, la instalación de válvulas y el par de apriete se verifican en línea.'
    - 'Ensayo de presión: cada cámara hinchable se somete a prueba de presión a 1,25× la presión nominal durante 48 horas (rechazo automático al superar el 5% de caída de presión en un mantenimiento de 24 horas). El 100% de las unidades se prueba antes del embalaje.'
    - 'Inspección final: los productos terminados se inspeccionan en cuanto a precisión dimensional, acabado cosmético, integridad de accesorios e integridad del embalaje antes del envío.'
    - 'Trazabilidad por lotes: cada producto lleva un número de serie vinculado a los registros del lote de producción, lo que permite una trazabilidad completa desde la materia prima hasta el producto terminado.'
content_safety:
  tagline: Normas de seguridad marina
  title: 'Ensayado según normas marinas internacionales'
  subtitle: 'Los productos se diseñan y ensayan según normas internacionales de seguridad marina para uso comercial y recreativo. Los métodos y resultados de verificación se documentan por proyecto.'
  items:
    - title: 'ISO 6185'
      description: 'Construcción, estabilidad, flotabilidad y capacidad de carga verificadas según ISO 6185 para embarcaciones hinchables. Los ensayos de pelado de costuras y de mantenimiento de presión siguen los métodos ISO 6185.'
      icon: tabler:sailboat
    - title: 'Aprobación USCG'
      description: 'Documentación de cumplimiento aprobada por la USCG para productos exportados al mercado estadounidense. Documentación disponible bajo petición por envío.'
      icon: tabler:shield
    - title: 'AS 1799'
      description: 'Cumplimiento de embarcaciones hinchables según la norma australiana AS 1799, coordinado con ensayos de terceros para proyectos de Australia y Nueva Zelanda.'
      icon: tabler:lifebuoy
