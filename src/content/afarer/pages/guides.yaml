size_guide:
  tagline: Size & Specs
  title: Find the Right Size for Your Needs
  desc: Compare SUP board dimensions, weight capacities, and recommended uses. Whether you need a touring SUP, a yoga board, or an all-around SUP —our size guide helps you choose the right fit.
  link_label: 'Full size guide with product specs →'
  link: /size-guide
  cards:
    - title: SUP Boards
      desc: Choose length based on your weight and intended use. Wider boards (32"+) offer more stability. Longer boards (11–12 ft) track better for touring.
    - title: Touring SUPs
      desc: Longer boards (11–12 ft) for covering distance and tracking straight. Stable enough for touring with gear. Always check weight capacity.
    - title: All-Around SUPs
      desc: Choose length by rider weight and use. Wider boards (32"+) for stability. Versatile for recreation and fitness.
