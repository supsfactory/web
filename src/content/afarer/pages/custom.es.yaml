meta:
  title: 'Custom Lab — Tablas de paddle hinchables'
  description: 'Tablas de paddle hinchables personalizadas: diseño exclusivo, logo, molde a medida y producción OEM/ODM con certificado CE.'
  keywords:
    - 'fabricante paddle board personalizado'
    - 'sup hinchable personalizado'
    - 'paddle board con logo'
    - 'sup hinchable oem'
    - 'fabricación paddle board'
hero:
  tagline: afarer Custom Lab
  title: Diseña tu propia tabla de SUP
  subtitle: Fabricante de SUP personalizados que ofrece producción de paddle boards OEM, ODM y de etiqueta privada para empresas de todo el mundo. Desde un único prototipo hasta series de producción completas.
  cta: Inicia tu proyecto
  footer_link: /es/contact

steps_section:
  tagline: Cómo funciona
  title: Del concepto a la producción
  subtitle: Cuatro pasos desde tu idea hasta un producto terminado y listo para el mar.
  steps:
    - num: '01'
      title: Elige tu tabla
      desc: 'Selecciona uno de nuestros modelos base de SUP: polivalente, travesía, yoga, deporte o infantil. Elige talla, material y color.'
    - num: '02'
      title: Sube tu diseño
      desc: Envíanos tu logo, arte o guía de marca. Nuestro equipo de diseño prepara una prueba digital.
    - num: '03'
      title: Revisa la maqueta con IA
      desc: Visualiza una maqueta fotorrealista generada por IA de tu tabla personalizada antes de iniciar la producción.
    - num: '04'
      title: Producción y entrega
      desc: Una vez aprobado, tu pedido entra en nuestra línea de producción. Plazos desde 30 días.

services_section:
  tagline: Servicios
  title: Servicios de fabricación para marcas globales
  subtitle: 'Modelos de colaboración flexibles: desde fabricación por contrato hasta construcción de marca integral.'
  items:
    - title: Fabricación OEM
      desc: 'Producimos tus diseños según especificaciones: tu propiedad intelectual, tus planos, tus estándares de calidad. Protección total mediante NDA.'
      icon: ⚙️
    - title: Soluciones ODM
      desc: Elige entre más de 50 plataformas probadas y personaliza talla, color, gráficos y embalaje.
      icon: '🎨'
    - title: Etiqueta privada
      desc: 'Tu marca en nuestros productos: logo, embalaje, colgantes y manuales. Listo para la venta minorista.'
      icon: '🎨'
    - title: Marca personalizada
      desc: 'Impresión de cubierta, gráficos de casco, calcomanías de tubo y etiquetas personalizadas: integración total de la marca.'
      icon: ⚙️

capabilities_section:
  tagline: Capacidades
  title: Capacidades de producción y personalización
  subtitle: Todo lo que necesitas saber antes de hacer tu pedido.
  capabilities:
    - label: Volumen de pedido
      value: Pedido mínimo 5–10 unidades (SUP)
    - label: Plazo de entrega
      value: 30–45 días estándar; 15–20 días para prototipos
    - label: Personalización
      value: Talla, forma, color, gráficos, embalaje, herrajes
    - label: Materiales
      value: PVC, Hypalon, drop-stitch, fibra de vidrio, aluminio
    - label: Impresión
      value: Digital (CMYK), serigrafía, transferencia térmica, sublimación
    - label: Certificación
      value: CE, UKCA, FCC (soporte para cumplimiento global)

