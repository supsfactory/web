tests:
  - title: Pressure Testing
    description: Inflatable chambers are subjected to pressures exceeding their recommended operating limits for extended periods. This verifies the airtightness and structural integrity of the material and seams, ensuring the product can withstand intended use and potential over-inflation without failure or leaks.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
    alt: Inflatable SUP chamber under pressure testing to verify airtightness
  - title: Impact Testing
    description: Products are subjected to controlled impacts from various weights and angles. This assesses the material's resistance to punctures, tears, and damage from collisions with obstacles in the water, demonstrating durability and longevity.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Impact testing rig assessing inflatable boat material puncture resistance
  - title: UV Resistance Testing
    description: Material samples are exposed to accelerated UV radiation to verify they do not yellow, crack, or lose strength over time. Each PVC batch is checked against solar degradation before use in production.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
    alt: PVC material samples under accelerated UV radiation in resistance testing
  - title: Abrasion Resistance Testing
    description: Material samples are rubbed against abrasive surfaces for a specified number of cycles under controlled pressure. This measures the material's ability to withstand wear and tear from repeated use, contact with sand, rocks, or other surfaces, ensuring long-term durability.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
    alt: Abrasion test machine rubbing PVC fabric sample to measure wear resistance
  - title: Low-Temperature Performance Testing
    description: Products are tested in cold environments to assess functionality and durability in various temperature conditions, preventing stiffness or cracking in colder waters. Essential for boats destined for winter or high-latitude use.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
    alt: Inflatable product inside cold chamber for low-temperature performance testing
  - title: Buoyancy & Load Capacity Testing
    description: Products are tested with various weights to determine their maximum load-bearing capacity and ensure they safely support users and gear. Every model's rated capacity is verified before release.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
    alt: Buoyancy and load capacity test with weights on inflatable watercraft
  - title: Maneuverability Testing
    description: Products are tested for their responsiveness to paddling or motor inputs, evaluating turning radius and ease of handling. On-water trials validate that real-world handling matches design specifications.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
    alt: On-water maneuverability testing of inflatable SUP and boat hulls
  - title: Watertightness Testing
    description: Fully assembled products are submerged or subjected to water spray to check for any leaks through seams, valves, or materials. Every boat passes a mandatory watertightness check before shipping.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
    alt: Submersion watertightness test checking seams and valves for leaks
content_certifications:
  tagline: Our Certifications
  title: 'Certified Quality, Globally Recognized'
  subtitle: 'Certifications are only as valuable as what they cover. Below is the certification scope, the certificate holder, and how to verify or request the documents for your project.'
  items:
    - title: 'CE Marking'
      description: 'Standard SUP and boat models carry CE marking per Directive 2013/53/EU for recreational craft. Custom models are CE certified through our established process for your configuration. Certificate numbers and test reports available on request.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Quality management system certified to ISO 9001:2015, covering design, manufacturing, and distribution of inflatable watercraft and marine equipment. Certification scope and audit report available on request.'
      icon: tabler:clipboard-check
    - title: 'BSCI Social Compliance'
      description: 'BSCI (Business Social Compliance Initiative) audited, covering working conditions and factory compliance. Audit report available on request.'
      icon: tabler:heart-handshake
    - title: 'REACH Material Compliance'
      description: 'Materials comply with EU REACH regulation for chemical safety. Material declarations are provided with production documentation for each shipment.'
      icon: tabler:flask
    - title: 'RoHS Compliance'
      description: 'Restricted-hazardous-substance compliance documented per RoHS for applicable components and materials.'
      icon: tabler:flame
    - title: 'Material Testing'
      description: 'Fabrics are tested for tensile strength, tear resistance, UV degradation, and cold-crack performance. Every production batch is sampled and verified to the published test protocol.'
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: 'Manufacturing Excellence —Built to Specification'
  subtitle: 'Our 12,000 m² facility operates under strict quality control protocols at every stage of production.'
  list:
    - 'Incoming Material Inspection: All raw materials —PVC fabric, Hypalon, aluminum, plywood, adhesives —are tested against specifications before entering production.'
    - 'In-Process Quality Control: Every production stage has documented QC checkpoints. Weld strength, seam alignment, valve installation, and fitting torque are verified inline.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.25× rated pressure for 48 hours, with auto-reject above a 5% pressure drop. 100% of units are tested before packing.'
    - 'Final Inspection: Completed products are inspected for dimensional accuracy, cosmetic finish, accessory completeness, and packaging integrity before shipping.'
    - 'Batch Traceability: Every product carries a serial number linked to production batch records, enabling full traceability from raw material to finished goods.'
content_safety:
  tagline: Marine Safety Standards
  title: 'Tested to International Marine Standards'
  subtitle: 'Products are designed and tested against international marine safety standards for commercial and recreational use. Verification methods and results are documented per project.'
  items:
    - title: 'ISO 6185'
      description: 'Construction, stability, buoyancy, and load capacity verified per ISO 6185 for inflatable craft. Seam peel and pressure-hold tests follow ISO 6185 methods.'
      icon: tabler:sailboat
    - title: 'USCG Approval'
      description: 'USCG-approved compliance documentation for exported products entering the US market. Documentation available on request per shipment.'
      icon: tabler:shield
    - title: 'AS 1799'
      description: 'Inflatable watercraft compliance per Australian Standard AS 1799, coordinated with third-party testing for AU/NZ projects.'
      icon: tabler:lifebuoy
