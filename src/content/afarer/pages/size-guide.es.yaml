how_to_choose:
  title: Cómo elegir la talla adecuada
  cards:
    - title: Tablas SUP
      description: Elige el largo según tu peso y el uso previsto. Las tablas más anchas (32"+ ) ofrecen más estabilidad. Las más largas (11–12 pies) navegan mejor en travesía. Los paddlers más pesados necesitan tablas de mayor volumen.
    - title: SUP de travesía
      description: Las tablas más largas (11–12 pies) son las mejores para recorrer distancias y navegar. Las más anchas (32"+ ) ofrecen más estabilidad. Comprueba la capacidad de peso para la carga total, incluido el equipo.
    - title: SUP polivalentes
      description: Elige el largo según el peso del rider y el uso previsto. Las tablas polivalentes sirven para recreo, fitness y yoga. Las más pequeñas son más maniobrables.