faqs:
  - question: '¿Qué es más duradero: el SUP hinchable o el rígido?'
    answer: Los SUP hinchables son en general más duraderos porque resisten abolladuras, grietas y daños por impacto que dañarían permanentemente una tabla rígida.
  - question: ¿Es un SUP hinchable mejor para los principiantes?
    answer: Sí. Los SUP hinchables se recomiendan para principiantes porque son más tolerantes, más fáciles de transportar y menos propensos a causar lesiones en las caídas.
  - question: ¿Pueden rendir los SUP hinchables igual que las tablas rígidas?
    answer: Para el paleo recreativo y la travesía, los SUP hinchables igualan el rendimiento de las tablas rígidas. Las rígidas siguen destacando en competición y surf avanzado por su menor peso y una flexión más refinada.
body: |
  <h2>Diferencias fundamentales</h2>
  <p>Los SUP hinchables (iSUP) y las tablas rígidas cumplen la misma función básica: estar de pie y remar sobre el agua, pero lo consiguen con métodos de construcción completamente distintos. La elección correcta depende de cómo pienses usar la tabla.</p>

  <table>
    <tr><th>Factor</th><th>SUP hinchable</th><th>SUP rígido</th></tr>
    <tr><td>Construcción</td><td>PVC drop-stitch, inflado a 12-15 PSI</td><td>Núcleo de espuma EPS recubierto de fibra de vidrio o epoxi</td></tr>
    <tr><td>Peso</td><td>8-13 kg (solo tabla)</td><td>9-14 kg (solo tabla)</td></tr>
    <tr><td>Tamaño plegado</td><td>Mochila (76 × 38 × 25 cm)</td><td>Longitud completa (3-4,3 m)</td></tr>
    <tr><td>Montaje</td><td>3-5 minutos de inflado</td><td>Lista para usar</td></tr>
    <tr><td>Vida útil</td><td>5-10 años con cuidados</td><td>3-8 años (propensa a abolladuras)</td></tr>
  </table>

  <h2>Portabilidad</h2>
  <p><strong>Gana el hinchable.</strong> Esta es la ventaja más clara. Un SUP hinchable cabe en una mochila que puede ir en el maletero, un armario del piso o el maletero del avión. Los viajeros, quienes viven en apartamentos y cualquiera que no tenga baca descubrirán que el SUP hinchable es mucho más práctico.</p>
  <p>Las tablas rígidas requieren baca, un vehículo grande o un espacio de almacenamiento dedicado. Son difíciles de transportar y no pueden llevarse en avión sin estuches de envío especiales.</p>

  <h2>Durabilidad</h2>
  <p><strong>Gana el hinchable.</strong> Los SUP hinchables están fabricados con PVC de grado militar que resiste impactos, perforaciones y daños por rayos UV. Cuando dejas caer una tabla hinchable o chocas contra una roca, rebota. Una tabla rígida se astillaría, agrietaría o delaminaría con el mismo impacto.</p>
  <p>Las tablas rígidas son más susceptibles al desgaste cotidiano. Una sola caída sobre cemento puede provocar una abolladura permanente que afecte al rendimiento y permita la entrada de agua.</p>

  <h2>Rendimiento</h2>
  <p><strong>La tabla rígida gana en el nivel más alto.</strong> Para el paleo recreativo y la travesía a velocidades moderadas, ambos tipos rinden de forma similar. Las tablas rígidas tienen ventaja en:</p>
  <ul>
    <li><strong>Velocidad</strong>: las rígidas son más ligeras y rígidas, lo que se traduce en mejor planeación y mayor velocidad punta</li>
    <li><strong>Surf</strong>: las rígidas ofrecen transiciones de canto a canto más reactivas y mejor rendimiento en olas</li>
    <li><strong>Competición</strong>: el surf de competición usa casi exclusivamente tablas rígidas por sus ventajas de peso y rigidez</li>
  </ul>
  <p>Para el paddler recreativo medio, estas diferencias de rendimiento son marginales. La mayoría de los paddlers no superará el rendimiento de una tabla hinchable de calidad.</p>

  <h2>Aptitud para principiantes</h2>
  <p><strong>Gana el hinchable.</strong> Los SUP hinchables son más fáciles para los principiantes porque:</p>
  <ul>
    <li>El pavimento más blando es más cómodo y menos propenso a causar lesiones en las caídas</li>
    <li>Las tablas hinchables más anchas y gruesas ofrecen más estabilidad primaria</li>
    <li>Un menor coste de inversión facilita el acceso</li>
    <li>El transporte fácil significa más oportunidades de remar</li>
  </ul>

  <h2>Almacenamiento y mantenimiento</h2>
  <p>Los SUP hinchables requieren secado y un plegado correcto antes de guardarlos. Las tablas rígidas pueden guardarse montadas, pero necesitan protección contra el sol, el calor y los impactos. Ambas se benefician de un aclarado con agua dulce tras su uso en agua salada.</p>

  <h2>Recomendación</h2>
  <p><strong>Elige un SUP hinchable si:</strong> viajas, tienes poco espacio de almacenamiento, remas por recreo o eres principiante. El 90% de los paddlers estarán bien servidos con una tabla hinchable de calidad.</p>
  <p><strong>Elige una tabla rígida si:</strong> compites, surfeas olas avanzadas o priorizas el máximo rendimiento sobre la portabilidad y la durabilidad.</p>

  <h2>FAQ</h2>
  <h3>¿Qué es más duradero: el SUP hinchable o el rígido?</h3>
  <p>Los SUP hinchables son en general más duraderos porque resisten abolladuras, grietas y daños por impacto que dañarían permanentemente una tabla rígida.</p>

  <h3>¿Es un SUP hinchable mejor para los principiantes?</h3>
  <p>Sí. Los SUP hinchables se recomiendan para principiantes porque son más tolerantes, más fáciles de transportar y menos propensos a causar lesiones en las caídas.</p>

  <h3>¿Pueden rendir los SUP hinchables igual que las tablas rígidas?</h3>
  <p>Para el paleo recreativo y la travesía, los SUP hinchables igualan el rendimiento de las tablas rígidas. Las rígidas siguen destacando en competición y surf avanzado por su menor peso y una flexión más refinada.</p>