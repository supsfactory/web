customization:
  tagline: Construido a tu especificación
  title: Qué puedes personalizar
  subtitle: 'Cada plataforma sale de fábrica como tu producto — de la geometría del casco a la caja retail. Estos son los puntos de la especificación que controlas en un proyecto OEM:'
  items:
    - 'Forma de la tabla — longitud, anchura, grosor, rocker y volumen ajustados a tus riders y mercados objetivo'
    - 'Estructura de materiales — número y calidad de las capas de PVC, densidad drop-stitch, rigidizadores y refuerzos del rail'
    - 'Gráficos y colores — paletas ilimitadas con tu propio arte o con el apoyo de nuestro equipo de diseño interno'
    - 'Alfombrilla EVA — diseños cortados a medida de la cubierta antideslizante, logotipos y colores del deck'
    - 'Asas y anillas D — posición, número y especificación del herraje según tu caso de uso'
    - 'Sistemas de aleta — configuraciones de una, dos o tres aletas y cajas de aleta a tu especificación'
    - 'Palas, bombas, correas y accesorios — tu paquete, tu marca'
    - 'Embalaje y presentación retail — cajas retail, embalaje marítimo y displays para punto de venta con tu marca'
    - 'Etiquetas y marcas de cumplimiento — etiquetas de serie, logotipos y documentación por mercado preparada para tu región de exportación'

faq_section:
  tagline: FAQ
  title: Preguntas frecuentes OEM y ODM
  questions:
    - q: ¿Cuál es la diferencia entre OEM y ODM?
      a: 'OEM (fabricación con equipo original) fabrica una tabla según tu especificación: tu forma, arte, materiales y empaque, sobre plataformas existentes o un molde nuevo a medida. ODM (fabricación con diseño original) parte de una plataforma probada que ya diseñamos e ingeniamos, y tú la adaptas con tu marca, colores, arte y accesorios. En la práctica ambas rutas comparten la misma planta, el mismo sistema de QC y el mismo equipo de exportación: OEM cuando tú eres dueño del diseño; ODM cuando quieres la vía más rápida y de menor riesgo hacia una tabla con tu marca, sin desarrollar diseño propio.'
    - q: '¿Qué enfoque encaja con mi proyecto: OEM u ODM?'
      a: 'Elige OEM cuando tengas tu propia especificación, planos o una idea de producto diferenciada y quieras fabricarla tal cual. Elige ODM cuando quieras una línea con tu marca partiendo de una plataforma existente y probada en mercado, con cambios solo de logo, color y empaque: ODM evita el desarrollo de molde, puede partir de un piloto de 20–50 uds. y envía muestras en 7–12 días.'
    - q: ¿Cuál es el MOQ para SUP hinchable OEM?
      a: 'El MOQ se confirma según la configuración del proyecto: casco y utillaje, colores y PVC, arte, empaque y accesorios. La producción de volumen estándar corre en lotes de 90–100 unidades (un rollo de drop-stitch de 150 m), mientras que el co-branding de lotes pequeños parte de menos de 20 unidades con tarifas de serigrafía transparentes. Lee la lógica de cálculo completa en nuestra Guía de MOQ y Branding Flexible.'
    - q: ¿Cuál es el plazo de entrega de un pedido OEM?
      a: 'La producción se entrega en 25–35 días desde el pedido confirmado y el depósito. El diseño del molde añade 15–20 días adicionales. Las muestras suelen enviarse en 7–12 días.'
    - q: ¿Ofrecen muestras antes de la producción?
      a: 'Sí. Se fabrica una muestra física y se aprueba antes de cualquier producción en serie, normalmente dentro de 7–12 días.'
    - q: ¿Qué certificaciones tiene la fábrica?
      a: 'CE, ISO 9001, BSCI, REACH y RoHS. Se entrega la documentación completa de cumplimiento con cada envío OEM.'
    - q: ¿Cuáles son sus condiciones de envío?
      a: 'FOB Qingdao, CIF a los principales puertos del mundo, o DDP para socios calificados. Enviamos a más de 50 mercados en la UE, EE. UU., Australia y Asia.'

process:
  title: El proceso OEM — del brief al contenedor
  subtitle: 'Siete etapas controladas dirigidas por un solo equipo de fábrica, para que cada paso desde tu primer brief hasta el contenedor quede documentado y a tiempo.'
  steps:
    - phase: '01'
      title: Consulta y brief
      period: Día 1–3
      items:
        - 'Comparte tu mercado objetivo, tipos de tabla, volúmenes y presupuesto — o solo una idea aproximada.'
        - 'Respondemos con una revisión de capacidades y una primera evaluación de viabilidad en un día laborable.'
    - phase: '02'
      title: Diseño e ingeniería
      period: Semana 1–2
      items:
        - 'La forma del casco, el grado del drop-stitch, las especificaciones de PVC y la construcción del rail se diseñan en casa.'
        - 'Tu marca, arte y embalaje se desarrollan alrededor de la tabla — el utillaje del molde a medida empieza aquí.'
    - phase: '03'
      title: Prototipo y muestra
      period: 7–12 días
      items:
        - 'Se fabrica una muestra física y se envía para tu revisión — con pruebas de navegación para formas nuevas.'
        - 'El desarrollo de muestras (1–2 unidades) valida forma y branding antes de comprometer cualquier volumen.'
    - phase: '04'
      title: Pruebas y validación
      period: En paralelo
      items:
        - 'Retención de aire, presión, resistencia de costuras, carga y UV, verificadas por línea de producción.'
        - 'Documentación CE, ISO 9001, BSCI, REACH y RoHS preparada para tus mercados de exportación.'
    - phase: '05'
      title: Aprobación y confirmación
      period: Tras aprobar la muestra
      items:
        - 'Apruebas la muestra y el arte; el PO y el depósito fijan la fecha de producción.'
        - 'Un plan de preproducción confirma fechas, cantidades, embalaje y puerto de carga.'
    - phase: '06'
      title: Producción
      period: 25–35 días
      items:
        - 'La producción corre bajo control de calidad multipunto — material entrante, proceso e inspección final.'
        - 'Desde pedidos piloto (20–50 unidades) sobre plataformas existentes hasta lotes completos de rollo de 150 m (90–100+ unidades) para producción de volumen estándar.'
    - phase: '07'
      title: Embalaje y envío
      period: 1 día + tránsito
      items:
        - 'Embalaje de exportación con etiquetas de número de serie, luego FOB Qingdao, CIF o DDP a más de 50 países.'
        - 'Documentación aduanera, seguimiento y soporte de reorden incluidos en cada etapa.'

