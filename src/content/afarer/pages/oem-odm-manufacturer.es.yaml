faq_section:
  tagline: FAQ
  title: Preguntas frecuentes OEM y ODM
  questions:
    - q: ¿Cuál es el MOQ para SUP hinchable OEM?
      a: 'El MOQ es por tramos: 5–10 unidades para un pedido de prueba, 50 unidades por diseño para un lote OEM estándar, y 200 unidades para proyectos con molde a medida o etiqueta privada.'
    - q: ¿Cuál es el plazo de entrega de un pedido OEM?
      a: 'La producción se entrega en 30–45 días desde el pedido confirmado y el depósito. El diseño del molde añade 15–20 días adicionales. Las muestras suelen enviarse en 15–20 días.'
    - q: ¿Ofrecen muestras antes de la producción?
      a: 'Sí. Se fabrica una muestra física y se aprueba antes de cualquier producción en serie, normalmente dentro de 15–20 días.'
    - q: ¿Qué certificaciones tiene la fábrica?
      a: 'CE, ISO 9001, BSCI, REACH y RoHS. Se entrega la documentación completa de cumplimiento con cada envío OEM.'
    - q: ¿Cuáles son sus condiciones de envío?
      a: 'FOB Qingdao, CIF a los principales puertos del mundo, o DDP para socios calificados. Enviamos a más de 50 mercados en la UE, EE. UU., Australia y Asia.'

