faq_section:
  tagline: FAQ
  title: OEM & ODM Frequently Asked Questions
  questions:
    - q: What is the difference between OEM and ODM?
      a: 'OEM (Original Equipment Manufacturing) builds a board to your specification — your shape, artwork, materials and packaging — from existing platforms or a new custom mould. ODM (Original Design Manufacturing) uses a proven platform we already designed and engineers, and you adapt it with your brand, colors, artwork and accessories. In practice both routes share the same plant, QC system and export team: OEM when you own the product design, ODM when you want the fastest, lowest-risk path to a branded board without design ownership.'
    - q: Which approach fits my project — OEM or ODM?
      a: 'Choose OEM when you have your own spec, drawings or a distinct product idea and want it manufactured as-is. Choose ODM when you want a branded line out of an existing, market-tested platform with only logo, color and packaging changes — ODM skips mould development, starts at 50 pcs, and ships samples in 15–20 days.'
    - q: What is the MOQ for OEM inflatable SUP?
      a: 'MOQ is tiered: 5–10 units for a standard trial order, 50 units per design for a standard OEM batch, and 200 units for full custom mould or private-label projects, depending on complexity.'
    - q: What is the typical lead time for an OEM order?
      a: 'Production runs 30–45 days from confirmed PO and deposit. Custom mould development adds 15–20 days for tooling. Prototype samples usually ship within 15–20 days.'
    - q: Do you provide samples before production?
      a: 'Yes. A physical sample is produced and approved before any production run, typically within 15–20 days.'
    - q: Which certifications does the factory hold?
      a: 'CE, ISO 9001, BSCI, REACH and RoHS. Full compliance documentation is provided with every OEM shipment.'
    - q: What are your shipping terms?
      a: 'FOB Qingdao, CIF major global ports, or DDP for qualified partners. We ship to 50+ countries across EU, US, AU and Asia markets.'

process:
  title: The OEM Process — From Brief to Shipped Container
  subtitle: 'Seven controlled stages run by one factory team, so every step from your first brief to the packed container stays documented and on schedule.' 
  steps:
    - phase: '01'
      title: Consultation & Brief
      period: Day 1–3
      items:
        - 'Share your target market, board types, volumes and budget — or just a rough idea.'
        - 'We respond with a capability review and a first feasibility assessment within one business day.'
    - phase: '02'
      title: Design & Engineering
      period: Week 1–2
      items:
        - 'Hull shape, drop-stitch grade, PVC specs and rail construction are engineered in-house.'
        - 'Your brand, graphics and packaging are developed around the board — custom mould tooling starts here.'
    - phase: '03'
      title: Prototype & Sample
      period: 15–20 days
      items:
        - 'A physical sample is produced and sent for your review — runway trials included for new shapes.'
        - 'Standard trial orders start from 5–10 units, so you validate before committing to volume.'
    - phase: '04'
      title: Testing & Validation
      period: In parallel
      items:
        - 'Air-retention, pressure-hold, seam-strength, load and UV checks per production line.'
        - 'CE, ISO 9001, BSCI, REACH and RoHS documentation prepared for your export markets.'
    - phase: '05'
      title: Approval & Confirmation
      period: After sample sign-off
      items:
        - 'You approve the sample and artwork; the PO and deposit lock the production slot.'
        - 'A pre-production plan confirms dates, quantities, packaging and port of loading.'
    - phase: '06'
      title: Production
      period: 30–45 days
      items:
        - 'Production runs under multi-point QC — incoming material, in-process and final inspection.'
        - 'From 50 units per design for standard OEM batches up to container-scale runs.'
    - phase: '07'
      title: Packing & Shipment
      period: 1 day + transit
      items:
        - 'Export packing with model serial labels, then FOB Qingdao, CIF or DDP to 50+ countries.'
        - 'Customs documentation, tracking and reorder support included at every stage.'

