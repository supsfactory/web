meta:
  title: 'Contact — OEM Quotes & SUP Manufacturer | {SITE}'
  description: 'Contact afarer for OEM/ODM quotes, private label projects, or professional fleets. Inflatable SUP and boat manufacturer, we respond within 2 business days.'
  keywords:
    - 'contact afarer'
    - 'oem paddle board quote'
    - 'professional sup supplier'
    - 'contact sup manufacturer'
hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Send us a message
  subtitle: For quotes, technical questions or partnership enquiries, drop us a line. We reply within one business day.
  email_to: info@afarer.com
  submit_button: Send Inquiry →Get a Quote
  success_message: Thanks! Your message has landed in our inbox. We will reply within one business day.
  error_message: Something went wrong sending your message. Please try again or email us directly.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: please solve the following'
  fields:
    - name: country
      label: Country
      row: 1
      type: select
      optionsKey: countries
      step: 1
    - name: orderVolume
      label: Estimated Order Volume
      row: 2
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: '5-10'
          label: 5–10 units (Standard MOQ)
        - value: '100-500'
          label: 100–500 units
        - value: '500-plus'
          label: 500+ units (Volume pricing)
      step: 1
    - name: customization
      label: Customization Needed?
      row: 3
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: Full OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
      step: 1
    - name: productInterest
      label: Product Categories of Interest
      row: 4
      type: select
      options:
        - value: ''
          label: Select product category...
        - value: all
          label: All products / Full catalog
        - value: sup
          label: SUP Boards / Paddleboards
        - value: safety
          label: Safety Equipment / Life Vests
        - value: accessory
          label: Accessories (pumps, oars, bags)
      step: 1
    - name: firstName
      label: First Name
      row: 1
      step: 2
    - name: lastName
      label: Last Name
      row: 1
      step: 2
    - name: companyName
      label: Company Name
      row: 2
      step: 2
    - name: email
      label: E-mail
      row: 3
      type: email
      step: 2
    - name: tel
      label: TEL
      row: 3
      type: tel
      withCountryCode: true
      step: 2
    - name: address
      label: Address
      row: 4
      step: 2
    - name: zip
      label: Zip / Postal Code
      row: 5
      step: 2
    - name: subject
      label: Subject
      row: 1
      step: 3
    - name: message
      label: Message
      row: 2
      type: textarea
      rows: 6
      step: 3
features2_other_ways:
  title: Other ways to reach us
  columns: 3
  items:
    - title: Sales enquiries
      description: Quotes, configurations, dealer applications and bulk orders.
      icon: tabler:shopping-bag
    - title: Technical support
      description: Warranty, repairs, spare parts and operating questions.
      icon: tabler:tool
    - title: Press & partnerships
      description: Media kits, sponsorship and industry collaboration.
      icon: tabler:news
    - title: Phone
      description: '+86 13305324192'
      icon: tabler:headset
    - title: Email
      description: info@afarer.com
      icon: tabler:mail
    - title: Headquarters
      description: Economic Development Zone, Laixi, Qingdao, China, 266600
      icon: tabler:map-pin
    - title: Company
      description: 'Afarer —SUP brand of Qingdao Vatrad Group Co., Ltd. (OEM support team)'
      icon: tabler:building
map:
  title: Our Location
  subtitle: Visit us at our headquarters
  address: Economic Development Zone, Laixi, Qingdao, China, 266600
