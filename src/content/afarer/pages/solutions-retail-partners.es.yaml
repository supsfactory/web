  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Sigue leyendo:</strong> consulta el <a href="/oem-odm-manufacturer">programa completo de fabricación OEM/ODM</a> — MOQ de prueba desde 5–10 unidades, branding de etiqueta privada y cumplimiento CE — o visita la <a href="/factory">fábrica</a> para ver cómo se gestiona el QC preparado para el comercio minorista.</p>
