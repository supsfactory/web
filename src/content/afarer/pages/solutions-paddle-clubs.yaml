meta:
  title: 'Paddle Club SUP Equipment & Fleet Solutions | {SITE}'
  description: 'Complete SUP fleet programs for paddle clubs and schools. Start-up packages, professional fleets, competition boards, training center kits, and replacement parts support.'

hero:
  tagline: Paddle Clubs & Schools
  title: 'Launch, Run & Grow Your Paddle Club With Commercial-Grade SUP Fleets'
  subtitle: 'SUP club equipment supplier for paddle clubs and SUP schools worldwide — durable commercial boards, bulk club pricing, custom branding, and fast replacement parts, so you can focus on growing your community.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Paddle club members on matching Afarer SUP boards

benefits:
  title: Club Fleet Benefits
  subtitle: Why paddle clubs across 50+ countries choose Afarer as their equipment partner.
  items:
    - metric: '40%+'
      label: Fleet Cost Savings
      detail: Vs. retail pricing with bulk club discounts
    - metric: '48h'
      label: Parts Replacement
      detail: Minimal downtime for your rental fleet
    - metric: '500+'
      label: Rental Cycles
      detail: Commercial-grade durability per board
    - metric: '5+ Years'
      label: Fleet Lifespan
      detail: With proper maintenance and care

packages:
  title: Club Fleet Programs
  subtitle: "Choose the fleet program that matches your club's size and ambition."
  items:
    - name: Start-Up Package
      tagline: 'For new clubs, up to 30 members'
      features:
        - '10 SUP boards (all-round + touring mix)'
        - '10 paddles + 10 life vests'
        - '2 dual-action pumps + repair kit'
        - 'Club branding on boards (logo print)'
        - 'Launch guide + safety checklist'
        - 'CE certified — all equipment'
      cta_text: 'Start Your Club'
    - name: Professional Fleet
      tagline: 'For established clubs, 50-100 members'
      features:
        - '30 SUP boards (3 size options)'
        - '30 paddles + 30 life vests'
        - '5 pumps + 2 repair kits + storage rack'
        - 'Custom club colors + logo on boards'
        - 'Replacement parts program (15% discount)'
        - 'Staff training session (online)'
        - 'CE certified — all equipment'
      popular: true
      cta_text: 'Build Your Fleet'
    - name: Competition Fleet
      tagline: 'For racing clubs, events, competitions'
      features:
        - '50+ racing / performance boards'
        - 'Full accessory set (paddles, vests, pumps)'
        - 'Event support kit (starting buoys, markers)'
        - 'Priority parts (24h dispatch)'
        - 'Dedicated account manager'
        - 'Custom team uniforms option'
        - 'CE certified — all equipment'
      cta_text: 'Get Competition Fleet'

