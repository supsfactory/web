hero:
  tagline: Seguridad
  title: Estándares de seguridad y certificación
  subtitle: Cada producto afarer se somete a ensayos rigurosos y cumple las normas internacionales de seguridad para uso recreativo y profesional.

certifications:
  - title: Certificación CE
    description: Todo el equipo de seguridad de afarer cumple los requisitos de marcado CE del Reglamento Europeo de Equipos de Protección Individual (UE) 2016/425.
  - title: Estándares de flotabilidad
    description: Los chalecos salvavidas cumplen los estándares de flotabilidad. El Life Vest Classic ofrece flotabilidad 50N+; el Life Vest Pro cumple los requisitos SOLAS con inflado automático.
  - title: Cumplimiento SOLAS
    description: El Life Vest Pro cumple la normativa SOLAS (Seguridad de la vida humana en el mar) para operaciones marinas offshore y comerciales.

