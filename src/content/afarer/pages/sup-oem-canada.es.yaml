answer:
  label: 'Respuesta directa'
  text: 'Las marcas canadienses piden SUP hinchables a SUPsfactory con condiciones estándar: prueba con 5–10 unidades, lote OEM estándar de 50 unidades por diseño, molde a medida desde 200 unidades. La primera muestra sale en 15–20 días tras la aprobación de la especificación, la producción transcurre en 30–45 días tras el PO y el depósito confirmados, y el flete marítimo añade 4–6 semanas a puertos canadienses — Vancouver en la costa oeste, Toronto y Montreal en el este. El DDP incluye despacho de aduanas y entrega en tu almacén.'
  verified: '2026-08'

