why_canada:
  tagline: 'Por qué los compradores en Canadá'
  title: 'Diseñada para las importaciones canadienses'
  subtitle: 'La fábrica responde a las preguntas que plantean las marcas y minoristas canadienses antes de su primer contenedor.'
  items:
    - title: 'DDP para un coste total predecible'
      description: 'El DDP incluye despacho de aduanas y entrega en tu almacén — aranceles, impuestos y flete en un solo total en CAD o USD. La opción más elegida por los importadores noveles.'
    - title: 'Rutas por las dos costas'
      description: 'Cotizamos flete marítimo a Vancouver o a Toronto y Montreal por la ruta de Suez — la que mejor equilibre tu tiempo de tránsito y tu coste total.'
    - title: 'Archivos de producto listos para bilingüe'
      description: 'La documentación CE, REACH y aduanera se prepara para tus mercados objetivo, de modo que tu ficha de producto sirva para requisitos de empaque en inglés y francés.'
    - title: 'Una fábrica, un sistema de calidad'
      description: 'Desarrollo, muestreo, producción y control de calidad ocurren dentro de la planta de 12,000 m² — sin intermediarios, sin muestras que la producción no pueda igualar.'

process_notes:
  tagline: 'Cómo funciona'
  title: 'De la especificación al contenedor'
  subtitle: 'Las mismas seis etapas compres dos o veinte contenedores al año: especificación, ingeniería, muestreo, pruebas, utillaje, producción — y después entrega FOB, CIF o DDP.'
  items:
    - title: '1. Envía tu especificación'
      description: 'Basta con una tabla de referencia, un boceto o una especificación de la competencia. La revisión de ingeniería y el presupuesto llegan en un día laborable.'
    - title: '2. Aprueba la muestra'
      description: 'Tu primera muestra física sale en 15–20 días con una hoja de aprobación que cubre construcción, colores de impresión y resultados de pruebas de presión.'
    - title: '3. Producción y exportación'
      description: 'Las tiradas se completan en 30–45 días con puntos de control de calidad en proceso. La lista de empaque, la factura y el conocimiento de embarque viajan antes que el buque.'
    - title: '4. Entrega en tu almacén'
      description: '4–6 semanas de flete marítimo a Vancouver, Toronto o Montreal — con DDP gestionamos el despacho y la entrega hasta tu puerta.'

faq_section:
  tagline: 'Preguntas frecuentes'
  title: 'Preguntas sobre la importación en Canadá'
  questions:
    - q: '¿Cuánto tarda el flete marítimo a Canadá?'
      a: 'Cuenta con 4–6 semanas desde el puerto de Qingdao a los puertos canadienses — Vancouver en la costa oeste, Toronto y Montreal en el este — según destino y calendario de salidas. Los proyectos DDP incluyen el plazo completo puerta a puerta.'
    - q: '¿Enviáis con DDP a Canadá?'
      a: 'Sí. El DDP incluye flete marítimo, despacho de aduanas, aranceles e impuestos, y entrega en tu almacén — un precio total predecible. También ofrecemos FOB Qingdao y CIF.'
    - q: '¿Cuál es el MOQ para una importación de SUP de marca privada?'
      a: 'Las pruebas parten de 5–10 unidades, el lote OEM estándar es de 50 unidades por diseño, y los proyectos de molde a medida o marca privada completa parten de 200 unidades.'
    - q: '¿Soportáis empaque en inglés y francés?'
      a: 'Sí. Nuestro equipo de preprensa prepara los datos de impresión para los idiomas y normativas de tus mercados objetivo — incluido el empaque bilingüe EN/FR para el mercado canadiense.'
    - q: '¿Puedo visitar la fábrica antes de pedir?'
      a: 'Sí. La planta de 12,000 m² en Qingdao está abierta a los clientes — se pueden organizar visitas virtuales en línea y visitas presenciales guiadas por las líneas de producción y los puestos de control de calidad.'
    - q: '¿Cómo empiezo un proyecto desde Canadá?'
      a: 'Envía una tabla de referencia, un boceto o una especificación. La revisión de ingeniería y el presupuesto llegan en un día laborable, y se firma un NDA antes de cualquier intercambio de archivos.'

cta:
  title: 'Empieza tu proyecto desde Canadá'
  subtitle: 'Envía un boceto, una tabla de referencia o una especificación — revisión de ingeniería y presupuesto en un día laborable.'
