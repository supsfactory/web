why_europe:
  tagline: 'Por qué los compradores europeos'
  title: 'Pensado para las importaciones europeas'
  subtitle: 'La fábrica responde a las preguntas que las marcas europeas hacen antes de su primer contenedor — certificación primero.'
  items:
    - title: 'Documentación CE y REACH'
      description: 'La muestra aprobada viaja con documentación CE y REACH preparada para el mercado de la UE, de modo que tu expediente técnico y tu papeleo aduanero están listos antes del contenedor.'
    - title: 'DDP para un coste total predecible'
      description: 'El DDP incluye despacho de aduanas, aranceles, impuestos y entrega en tu almacén — un solo total, puerta a puerta por toda la UE.'
    - title: 'FOB Qingdao con tu propio agente de carga'
      description: '¿Importas con regularidad? Elige FOB Qingdao y usa tu propio socio logístico — nosotros cargamos y documentamos el contenedor, tú controlas el resto.'
    - title: 'Una fábrica, un sistema de calidad'
      description: 'El desarrollo, el muestreo, la producción y el control de calidad ocurren dentro de la planta de 12.500 m² — la muestra que apruebas es el producto que recibes.'

process_notes:
  tagline: 'Cómo funciona'
  title: 'De la especificación al contenedor'
  subtitle: 'Las mismas seis etapas tanto si compras dos contenedores al año como veinte: especificación, ingeniería, muestreo, pruebas, utillaje, producción — y entrega FOB, CIF o DDP.'
  items:
    - title: '1. Envía tu especificación'
      description: 'Basta con una tabla de referencia, un boceto o la especificación de un competidor. La revisión de ingeniería y el presupuesto vuelven en un día laborable.'
    - title: '2. Aprueba la muestra'
      description: 'Tu primera muestra física sale en 7–12 días con una hoja de aprobación que cubre construcción, colores de impresión y resultados de prueba de presión.'
    - title: '3. Producción y exportación'
      description: 'Las tiradas se completan en 25–35 días con puntos de control de calidad durante el proceso. La lista de empaque, la factura y el conocimiento de embarque viajan antes que el buque.'
    - title: '4. Entrega en tu almacén'
      description: 'De 4 a 6 semanas de flete marítimo a Róterdam o Hamburgo — con DDP gestionamos el despacho y la entrega hasta tu puerta.'

faq_section:
  tagline: FAQ
  title: 'Preguntas sobre importación a Europa'
  questions:
    - q: ¿La documentación CE está incluida en mi pedido?
      a: 'Sí. La documentación CE y REACH se prepara para el mercado de la UE junto con tu muestra aprobada, antes de que comience la producción — los documentos viajan con el contenedor.'
    - q: ¿Cuánto tarda el flete marítimo a Europa?
      a: 'Cuenta con 4–6 semanas desde el puerto de Qingdao hasta Róterdam o Hamburgo, según el itinerario de navegación. Los proyectos DDP incluyen el calendario completo puerta a puerta.'
    - q: ¿Enviáis con DDP a países de la UE?
      a: 'Sí. El DDP incluye flete marítimo, despacho de aduanas, aranceles e impuestos y entrega en tu almacén — un total predecible. También ofrecemos FOB Qingdao y CIF.'
    - q: ¿Cuál es el MOQ para importar SUP de marca privada?
      a: 'MOQ confirmado por configuración del proyecto: las muestras cubren 1–2 unidades, los lotes piloto corren de 20–50 unidades sobre plataformas existentes, y la producción de volumen estándar corre de 90–100+ unidades por diseño a partir de un rollo completo de drop-stitch de 150 m.'
    - q: ¿Qué documentación proporcionáis para las importaciones?
      a: 'La muestra aprobada se envía con documentación CE y REACH preparada para tu mercado objetivo, y cada contenedor viaja con lista de empaque, factura y conocimiento de embarque.'
    - q: ¿Cómo inicio un proyecto desde Europa?
      a: 'Envía una tabla de referencia, un boceto o una especificación. La revisión de ingeniería y el presupuesto vuelven en un día laborable, y se firma un NDA antes de cualquier intercambio de archivos.'

