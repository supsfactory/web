process_notes:
  tagline: 'How it works'
  title: 'From Spec to Container'
  subtitle: 'The same six stages whether you buy two containers a year or twenty: specification, engineering, sampling, testing, tooling, production — then FOB, CIF or DDP delivery.'
  items:
    - title: '1. Send your spec'
      description: 'A reference board, a sketch or a competitor specification is enough. Engineering review and a quote return within one business day.'
    - title: '2. Approve the sample'
      description: 'Your first physical sample ships in 15–20 days with an approval sheet covering construction, print colors and pressure-test results.'
    - title: '3. Production & export'
      description: 'Runs complete in 30–45 days with in-process QC checkpoints. Packing list, invoice and bill of lading travel ahead of the vessel.'
    - title: '4. Delivery to your warehouse'
      description: '4–6 weeks of sea freight to Rotterdam or Hamburg — under DDP we handle clearance and delivery to your door.'

faq_section:
  tagline: FAQ
  title: 'European Import Questions'
  questions:
    - q: Is CE documentation included with my order?
      a: 'Yes. CE and REACH documentation is prepared for the EU market alongside your approved sample, before production starts — the documents ship with the container.'
    - q: How long does sea freight take to Europe?
      a: 'Allow 4–6 weeks from the Qingdao port to Rotterdam or Hamburg, depending on the sailing schedule. DDP projects include the complete door-to-door timeline.'
    - q: Do you ship DDP to EU countries?
      a: 'Yes. DDP includes ocean freight, customs clearance, duties and taxes, and delivery to your warehouse — one predictable total price. FOB Qingdao and CIF are also available.'
    - q: What is the MOQ for a private label SUP import?
      a: 'Trial runs start at 5–10 pcs, a standard OEM batch is 50 pcs per design, and custom mould or full private-label projects start at 200 pcs.'
    - q: What documentation do you provide for imports?
      a: 'The approved sample ships with CE and REACH documentation prepared for your target market, and every container ships with packing list, invoice and bill of lading.'
    - q: How do I start a project from Europe?
      a: 'Send a reference board, sketch or specification. The engineering review and quotation return within one business day, and an NDA is signed before any file exchange.'

