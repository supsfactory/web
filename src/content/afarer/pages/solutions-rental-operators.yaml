meta:
  title: 'SUP Rental Equipment Supplier & Fleet Solutions'
  description: 'Commercial SUP boards engineered for daily rental use: UV-resistant PVC, reinforced seams and quick-dry materials to scale your rental business.'

hero:
  tagline: Rental Operators
  title: 'Scale Your Rental Business With Confidence'
  subtitle: 'SUP rental equipment supplier for rental operators. High-rotation SUP boards engineered for daily rental use, 365 days a year. Your revenue never takes a day off.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Busy rental kiosk with SUP boards ready for guests

features:
  title: Built for the Rental Grind
  subtitle: 'Every board is engineered for 500+ rental cycles with minimal maintenance.'
  items:
    - title: '500+ Rental Cycles'
      description: 'Tested to survive daily use in saltwater, sun, and sand.'
      icon: 'tabler:shield-check'
    - title: 'UV-Resistant Fabric'
      description: 'No fading or degradation after 1 year of outdoor storage.'
      icon: 'tabler:sun'
    - title: 'Reinforced Seams'
      description: '3x stronger than standard inflatable board construction.'
      icon: 'tabler:layers-intersect'
    - title: 'Quick-Dry Materials'
      description: 'Boards ready for next rental in under 30 minutes.'
      icon: 'tabler:droplet'
    - title: 'Stackable Storage'
      description: 'Space-saving design — store 40% more boards in the same area.'
      icon: 'tabler:stack'
    - title: 'Color-Coded Sizes'
      description: 'Staff grabs the right board instantly with color-coded sizing.'
      icon: 'tabler:color-swatch'

stats:
  title: Operations Metrics
  stats:
    - title: Board Turnover
      amount: '< 5 min'
    - title: Annual Maintenance
      amount: '~15 min/board'
    - title: Parts Dispatch
      amount: '48h'
    - title: Defect Rate
      amount: '< 0.5%'

fleet_guide:
  title: Fleet Sizing Guide
  subtitle: 'Estimate how many boards your operation needs by daily rental rotation.'
  tiers:
    - label: Small Kiosk
      boards: '15-20'
      note: 'Up to 2–3 board rotations per day at peak season'
    - label: Mid-Size Operation
      boards: '30-50'
      note: 'Multiple launch points or high weekend traffic'
    - label: Large Beach Rental
      boards: '50-100'
      note: 'Full-service rental fleets across several beach stations'

cta:
  title: 'Ready to scale your rental business?'
  subtitle: 'Get rental pricing or compare board models for your operation.'
  actions:
    - text: 'Get Rental Pricing'
      href: '/contact?package=rental'
      variant: 'primary'
    - text: 'Compare Board Models'
      href: '/compare'
      variant: 'secondary'
