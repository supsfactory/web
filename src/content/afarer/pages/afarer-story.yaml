timeline:
  - year: '2012'
    title: 'Marine Manufacturing Foundation'
    body: 'afarer began as a specialized watercraft workshop in Qingdao, China, committed to marine craftsmanship and watercraft manufacturing. The early focus was building reliable inflatable products through practical engineering experience and manufacturing discipline.'
  - year: '2015'
    title: 'First Export & CE Certification'
    body: "Initial export orders reached Japan and Korea. CE certification was achieved for core product lines, marking afarer's entry into international markets. The company began serving commercial and recreational users beyond China."
  - year: '2018'
    title: 'Factory Expansion'
    body: 'Relocated to a 12,000 m² production facility. Added RF welding lines and drop-stitch production capacity, enabling larger-scale manufacturing and improved quality control systems.'
  - year: '2020'
    title: 'R&D Center Established'
    body: 'Opened a dedicated R&D center with PVC fabric lab, hydrodynamic test tank, and CAD/FEA simulation studio. Product development expanded to focus on lightweight construction, improved durability, and user-centered design.'
  - year: '2022'
    title: 'Certification & Global Growth'
    body: 'Achieved ISO 9001 certification. Expanded to 14 R&D engineers and 200+ workers. Products reached customers across Europe, Americas, and Asia-Pacific through distributor and OEM partnerships.'
  - year: '2024'
    title: 'Innovation & Design Studio'
    body: 'Launched full-service design and innovation studio for custom ODM projects, from concept to production. Strengthened professional marine applications including rescue, commercial, and government tenders.'
  - year: '2026'
    title: 'Building The Future Of Water Exploration'
    body: "Today, afarer continues to develop SUP systems and marine accessories —connecting people and organizations with the world's waters. 50+ countries served, 15,000+ units annual capacity."

content_founding:
  tagline: The Beginning
  title: 'Born on the Waterfront'
  subtitle: 'afarer started in a coastal workshop in Qingdao with one boat and a vision: to build inflatable watercraft that could handle real marine conditions.'
  paragraphs:
    - 'In 2012, our founders saw a gap in the market —most inflatable watercraft were either affordable but unreliable, or high-quality but prohibitively expensive. They believed there was room for a manufacturer that delivered both quality and value.'
    - 'The first hull was built by hand, tested in local waters, and refined based on real feedback from fishermen and small commercial operators. That feedback loop —build, test, listen, improve —remains at the core of our engineering philosophy today.'
    - 'By 2015, word had spread beyond Qingdao. International distributors began requesting samples. What started as a local workshop was becoming a global supplier.'
  image:
    src: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: afarer early production workshop and manufacturing

content_growth:
  tagline: Growth & Innovation
  title: 'From Workshop to 12,000 m² Facility'
  subtitle: 'Continuous investment in people, equipment, and process has transformed afarer into a modern marine manufacturing facility.'
  paragraphs:
    - 'As demand grew, so did our facility. We expanded from a small workshop to a 12,000 m² factory with dedicated production lines for SUP boards and accessories.'
    - 'We invested in CNC cutting machines, high-frequency welding equipment, drop stitch production lines, and comprehensive testing rigs —allowing us to control every aspect of production quality.'
    - 'Today, our team of 200+ includes marine engineers, material scientists, quality control specialists, and skilled craftspeople —many of whom have been with afarer since the early days.'

philosophy:
  tagline: 'Brand Philosophy'
  title: 'Engineering Freedom On Water'
  body: 'Freedom on water is not only about movement. It represents discovering new places, creating outdoor experiences, connecting people with nature, and enabling professional missions. Engineering makes that freedom possible.'
  pillars:
    - title: 'Reliability First'
      body: 'Water environments demand trust. afarer products are designed around stability, durability, safety, and consistent performance.'
    - title: 'Human-Centered Design'
      body: 'Products should serve people, not technology. Every design decision begins with understanding how people use watercraft, where they explore, and what challenges they face.'
    - title: 'Accessible Exploration'
      body: 'Water should not belong only to experts. afarer creates equipment that allows more people to safely experience rivers, lakes, oceans, and coastal environments.'
    - title: 'Continuous Innovation'
      body: 'Innovation is not only creating new products. It is improving every detail —materials, structures, manufacturing, and user experience.'

engineeringDna:
  tagline: 'Engineering DNA'
  title: 'How afarer Creates Products'
  areas:
    - title: 'Material Science'
      body: 'afarer focuses on selecting appropriate materials for different marine environments. Key considerations include abrasion resistance, UV resistance, pressure stability, and long-term durability.'
      items: ['Abrasion Resistance', 'UV Resistance', 'Pressure Stability', 'Long-Term Durability']
    - title: 'Structural Engineering'
      body: 'Inflatable watercraft require precise balance between rigidity, weight, portability, and stability. afarer engineering focuses on optimizing these factors through drop-stitch core technology and advanced seam construction.'
      items: ['Rigidity', 'Weight Optimization', 'Portability', 'Stability']
    - title: 'Manufacturing Precision'
      body: 'Every product goes through controlled processes: material preparation, precision cutting, welding and bonding, assembly, quality inspection, and performance verification.'
      items: ['Material Prep', 'Precision Cutting', 'Welding & Bonding', 'Assembly & QC']
    - title: 'User Scenario Engineering'
      body: 'Products are developed around real applications —recreation, adventure, and professional use —ensuring each design meets the specific demands of its intended environment.'
      items: ['Recreation', 'Adventure', 'Professional', 'Commercial']

