meta:
  title: 'Resort & Hotel SUP Fleet Supplier | {SITE}'
  description: 'Commercial-grade inflatable SUP fleets for hotels and resorts: custom branding, staff training and ROI-optimized packages from 20 to 100+ boards.'

hero:
  tagline: Resorts & Hotels
  title: 'Turn Your Waterfront Into a Revenue Centre With Premium SUP Fleets'
  subtitle: 'Afarer equips resorts worldwide with commercial-grade inflatable SUP fleets — from 20-board starter packages to 100+ board flagship programs. Custom branding, staff training, and replacement parts included.'
  image:
    src: https://assets.afarer.com/images/afarer/lifestyle/afarer-lifestyle-1.webp
    alt: Resort guests enjoying SUP boarding on a pristine beach

roi_section:
  title: 'The Resort SUP Revenue Model'
  subtitle: 'How resorts generate $50,000 - $200,000+ annual SUP rental income with a single investment.'
  metrics:
    - metric: '$50K–$200K+'
      label: Annual SUP Revenue
      detail: Per resort, based on fleet size and occupancy
    - metric: '4–6 Months'
      label: Average Payback Period
      detail: Recoup full fleet investment within one season
    - metric: '40%'
      label: Revenue Increase
      detail: Average boost after switching to Afarer fleets
    - metric: '500+'
      label: Rental Cycles Per Board
      detail: Commercial-grade durability for daily use

packages:
  title: Resort Package System
  subtitle: 'Choose the package that fits your guest capacity and revenue goals. All packages include 12-month warranty and CE certification.'
  items:
    - name: Starter Package
      tagline: 'For boutique resorts, up to 20 guests/day'
      features:
        - '20 SUP boards (3 sizes for adults/kids)'
        - '20 paddles (adjustable) + 20 life vests'
        - '4 dual-action pumps (electric optional)'
        - '2 storage racks + repair kit'
        - 'Custom logo print on boards'
        - '12-month warranty + CE certified'
      revenue: '$50K–$80K annual revenue potential'
      cta_text: 'Get Starter Package'
    - name: Premium Package
      tagline: 'For large resorts, 50-100 guests/day'
      features:
        - '50 SUP boards (5 sizes, mixed fleet)'
        - '50 paddles + 50 life vests'
        - '10 dual-action pumps + 2 electric pumps'
        - '5 storage racks + 2 roller carts'
        - 'Full custom branding (boards, paddles, bags)'
        - 'Staff training session (online)'
        - '48-hour replacement parts dispatch'
        - '12-month warranty + CE certified'
      revenue: '$120K–$200K+ annual revenue potential'
      popular: true
      cta_text: 'Get Premium Package'
    - name: Flagship Package
      tagline: 'For ultra-premium resorts, 100+ guests/day'
      features:
        - '100+ SUP boards (full size range)'
        - 'Complete accessory set (paddles, vests, pumps, carts)'
        - 'On-site staff training (2 days)'
        - 'Dedicated account manager'
        - 'Priority replacement parts (24h dispatch)'
        - 'Full custom branding (boards + accessories)'
        - 'Marketing photo/video package'
        - '24-month warranty + CE certified'
      revenue: '$200K+ annual revenue potential'
      cta_text: 'Get Flagship Package'

case_study:
  quote: 'Since switching to Afarer, our SUP rental revenue increased 40%. Board replacement costs dropped 60%. We recouped our full fleet investment in 4 months.'
