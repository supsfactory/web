    - title: '48h Parts Dispatch'
      description: 'Replacement parts shipped within 48 hours — your rental revenue never stops.'
      icon: 'tabler:truck-delivery'
    - title: 'Custom Branding'
      description: 'Match your resort identity with custom colors and logo on every board.'
      icon: 'tabler:palette'
    - title: 'Staff Training'
      description: 'Online and on-site training programs for your activities team.'
      icon: 'tabler:school'
    - title: 'Global Logistics'
      description: 'Shipping to 50+ countries with consolidated freight options.'
      icon: 'tabler:world'
    - title: 'CE Certified'
      description: 'All equipment CE certified, ISO 9001:2015 — safety and quality guaranteed.'
