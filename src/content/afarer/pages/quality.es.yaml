commitment:
  title: Nuestro compromiso
  body: Mediante estos rigurosos procedimientos de ensayo, {SITE} ofrece a los clientes la garantía de que nuestros SUP y embarcaciones hinchables no solo rinden al máximo, sino que están construidos para durar, asegurando innumerables aventuras seguras y agradables en el agua. Nuestro laboratorio de calidad funciona de forma independiente de la producción e informa directamente a la dirección.
  cta: Solicitar documentación de ensayos
  cta_link: /es/contact