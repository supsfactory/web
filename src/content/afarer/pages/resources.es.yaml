meta:
  title: 'Recursos y descargas B2B | {SITE}'
  description: 'Descarga guías de fabricación OEM, catálogos de productos, informes de calidad y calculadoras de ROI para negocios de SUP hinchable.'

hero:
  tagline: Centro de recursos
  title: 'Herramientas y recursos para socios de negocio de SUP'
  subtitle: 'Descarga guías OEM, catálogos de productos e informes de calidad, y usa nuestra calculadora de ROI para planificar la inversión de tu flota de SUP.'

resources:
  - title: 'Catálogo de productos OEM/ODM 2026'
    description: 'Línea de productos completa con especificaciones, niveles de precios, pedido mínimo y opciones de personalización para socios B2B.'
    icon: 'tabler:file-text'
    type: 'catalog'
    link: '/es/media'
    cta: 'Descargar catálogo'
  - title: 'Guía de marca SUP de etiqueta privada'
    description: 'Guía paso a paso para lanzar tu propia marca de SUP, desde la investigación de mercado y el diseño hasta la producción y la entrega mundial.'
    icon: 'tabler:book'
    type: 'guide'
    link: '/es/news/private-label-sup-oem-guide'
    cta: 'Leer guía'
  - title: 'Calculadora de ROI para flotas de SUP'
    description: 'Estima la inversión de tu flota de SUP para resort o club, los ingresos previstos y el plazo de amortización con nuestra calculadora interactiva.'
    icon: 'tabler:calculator'
    type: 'tool'
    link: '#roi-calculator'
    cta: 'Calcular ROI'
  - title: 'Informe de calidad y certificación'
    description: 'Documentos de certificación CE, gestión de calidad ISO 9001, resultados de ensayos de envejecimiento UV y de retención de presión.'
    icon: 'tabler:certificate'
    type: 'report'
    link: '/es/evidence'
    cta: 'Ver informes'
  - title: 'Folleto de capacidades de fábrica'
    description: 'Visita virtual a nuestra planta de fabricación de 12.000 m², con detalles de las líneas de producción y los procesos de control de calidad.'
    icon: 'tabler:building-factory'
    type: 'brochure'
    link: '/es/factory'
    cta: 'Visitar fábrica'
  - title: 'Guía de ingresos para flotas de resort'
    description: 'Análisis de ROI para flotas SUP comerciales con modelos de precios, tasas de utilización y resultados reales de casos de resorts de 5 estrellas.'
    icon: 'tabler:chart-bar'
    type: 'guide'
    link: '/es/news/commercial-sup-fleet-roi-resorts'
    cta: 'Leer guía'

cta:
  title: '¿Necesitas soporte personalizado?'
  subtitle: 'Contacta con nuestro equipo B2B para recibir asesoramiento personalizado para tu proyecto.'
