hero:
  tagline: 'Norteamérica'
  title: 'Fabricante OEM de SUP hinchables para Norteamérica — de Qingdao a tu almacén'
  subtitle: 'Muestra en 7–12 días, producción en 25–35 días, flete marítimo de 4–6 semanas a puertos de EE. UU. o Canadá. FOB Qingdao, CIF o DDP — la misma fábrica, el mismo control de calidad, el mismo proceso de desarrollo en seis etapas que todos los clientes de SUPsfactory.'

answer:
  label: 'Respuesta directa'
  text: 'Las marcas norteamericanas piden SUP hinchables a SUPsfactory con condiciones estándar: MOQ confirmado por configuración del proyecto: muestra de 1–2 unidades, lote piloto de 20–50 unidades y producción de volumen estándar de 90–100+ unidades por diseño a partir de un rollo completo de drop-stitch de 150 m. La primera muestra sale en 7–12 días tras la aprobación de la especificación, la producción transcurre en 25–35 días tras el PO y el depósito confirmados, y el flete marítimo añade 4–6 semanas a puertos de EE. UU. o Canadá. El DDP incluye despacho de aduanas y entrega en tu almacén.'
  verified: '2026-08'

