  text: 'Canadian brands order inflatable SUP from SUPsfactory on standard terms: trial run 5–10 pcs, standard OEM batch 50 pcs per design, custom mould from 200 pcs. The first sample ships 15–20 days after specification approval, production runs 30–45 days after confirmed PO and deposit, and sea freight adds 4–6 weeks to Canadian ports — Vancouver on the west coast, Toronto and Montreal in the east. DDP covers customs clearance and delivery to your warehouse.'
