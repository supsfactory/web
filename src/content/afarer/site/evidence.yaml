certifications:
  - name: CE
    body: European Union
    desc: All products carry CE certification in accordance with EU directives for recreational craft and personal flotation devices.
  - name: ISO 9001
    body: SGS / BSI
    desc: Quality management system certified for design, manufacturing, and distribution of inflatable water sports equipment.
  - name: BSCI
    body: amfori
    desc: Social compliance certification demonstrating ethical manufacturing, fair labour, and workplace safety.
  - name: REACH
    body: European Chemicals Agency
    desc: All materials comply with REACH regulations for chemical safety. Documentation provided with every shipment.
  - name: RoHS
    body: European Union
    desc: Restriction of hazardous substances compliance across all electronic and electrical components.
  - name: AS 1799
    body: Standards Australia
    desc: Australian standard for inflatable watercraft — tested and certified for commercial use in AU/NZ waters.

test_results:
  - metric: Units Pressure Tested
    value: 100%
    detail: Every boat, every chamber, every batch
  - metric: Max Pressure Drop
    value: '<5%'
    detail: Over 24h at 1.25x rated pressure
  - metric: Major Defect Threshold
    value: AQL 2.5
    detail: Per ISO 2859 sampling standard
  - metric: Pressure Hold Duration
    value: 24-48h
    detail: Depending on product category
  - metric: Test Pressure Margin
    value: 1.25x
    detail: Safety margin on every chamber
  - metric: Safety Defect Tolerance
    value: 0%
    detail: Valves, D-rings, seams, buoyancy

