answer:
  label: 'Közvetlen válasz'
  text: 'Mérőmedencénkben 1:3 és 1:5 közötti méretarányban teszteljük a SUP víztestének formáját – a borda leszállási profilját, a szín görbületi sugarát, a rocker szögletet és a benyíló felületet – miközben mérjük az ellenállást, a csúszási hatásfokot és a stabilitást, még egy teljes méretű prototípus elkészítése előtt. Egy hét a medencében ugyanazokat a teljesítményadatokat adja, amelyekhez teljes méretben hónapokra lenne szükség.'
  verified: '2026. szeptember'

hero:
  tagline: '04. laboratórium'
  title: 'Hidrodinamikai mérőmedence'
