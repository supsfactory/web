faqs:
  title: 'Ofte stillede spørgsmål om OEM-pagajproduktion'
  subtitle: 'Svar på de mest almindelige spørgsmål fra mærker, der lancerer deres egen pagaj.'
  items:
    - title: 'Hvordan skaber jeg mit eget pagajmærke?'
      description: 'Sæt dit mærke i markedet: brief, design, CE-certificeret prototype, serieproduktion og levering. Prøver på 7–12 dage, produktion på 25–35 dage fra PO og depositum. Se vores OEM-pakker.'
    - title: 'Hvad er produktionens leveringstid?'
      description: 'Prøven er klar på 7–12 dage, og serieproduktionen tager 25–35 dage efter PO og depositum afhængigt af volumen.'
    - title: 'Bærer pagajen vores logo?'
      description: 'Ja — komplet private label: logotryk, specialfarver, emballage og etiketter i dit mærke.'
    - title: 'Kan jeg købe i stort fra dag 1?'
      description: 'Minimumsordren (MOQ) fastlægges ud fra projektkonfigurationen — prøve (1–2 stk.), pilot (20–50 stk.) og standardvolumen (90–100+ stk. pr. batch), med engrospristrin, der falder med stigende volumen.'

