answer:
  label: 'Det korte svar'
  text: 'Minimumsordren (MOQ) fastlægges ud fra projektkonfigurationen: prøve (1–2 stk.), pilot (20–50 stk.) og standardvolumen (90–100+ stk. pr. batch fra en 150 m drop-stitch-rulle), med co-branding i minimale partier fra 5–10 stk. Prøver afsendes på 7–12 dage; serieproduktion kører 25–35 dage efter PO og depositum. CE-certificering for modeller til EU-markedet og fuld overensstemmelsesdokumentation følger med enhver ordre.'
  verified: 'September 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
