why_north_america:
  tagline: 'De ce cumpărătorii din SUA și Canada'
  title: 'Construit pentru importurile în America de Nord'
  subtitle: 'Fabrica răspunde întrebărilor pe care mărcile americane și canadiene le pun înainte de primul container.'
  items:
    - title: 'DDP pentru un cost final previzibil'
      description: 'DDP include formalitățile vamale și livrarea la depozitul dumneavoastră — taxe vamale, impozite și transport într-un singur total. Cea mai populară alegere pentru importatorii de prima dată.'
    - title: 'Documentație pentru piața dumneavoastră țintă'
      description: 'Documentația CE, REACH și vamală este pregătită pentru piețele dumneavoastră țintă împreună cu mostra aprobată, astfel încât dosarul de produs să fie gata pentru export.'
    - title: 'FOB Qingdao cu propriul dumneavoastră comisionar'
      description: 'Importați regulat? Alegeți FOB Qingdao și folosiți propriul partener logistic — noi încărcăm și documentăm containerul, dumneavoastră controlați restul.'
    - title: 'O singură fabrică, un singur sistem de calitate'
      description: 'Dezvoltarea, mostrele, producția și controlul calității au loc toate în interiorul fabricii de 12,500 m² — fără deplasări la broker, fără mostre pe care producția nu le poate replica.'

process_notes:
  tagline: 'Cum funcționează'
  title: 'De la specificații la container'
  subtitle: 'Aceleași șase etape, indiferent dacă cumpărați două containere pe an sau douăzeci: specificații, inginerie, mostre, încercări, matriță, producție — apoi livrare FOB, CIF sau DDP.'
  items:
    - title: '1. Trimiteți specificațiile'
      description: 'O placă de referință, o schiță sau specificațiile unui concurent sunt suficiente. Analiza de inginerie și oferta revin în termen de o zi lucrătoare.'
    - title: '2. Aprobați mostra'
      description: 'Prima dumneavoastră mostră fizică se expediază în 7–12 zile, însoțită de o fișă de aprobare care acoperă construcția, culorile de imprimare și rezultatele testului de presiune.'
    - title: '3. Producție și export'
      description: 'Seriile se finalizează în 25–35 de zile, cu puncte de control al calității în proces. Lista de ambalare, factura și certificatul de transport maritim călătoresc înaintea vasului.'
    - title: '4. Livrare la depozitul dumneavoastră'
      description: '4–6 săptămâni de transport maritim până la porturile din SUA sau Canada — în regim DDP ne ocupăm de formalitățile vamale și de livrare la ușa dumneavoastră.'

faq_section:
  tagline: FAQ
  title: 'Întrebări despre importul în America de Nord'
  questions:
    - q: 'Cât durează transportul maritim până în SUA sau Canada?'
      a: 'Alocați 4–6 săptămâni de la portul Qingdao până la porturile din SUA sau Canada, în funcție de destinație și de programul plecărilor. Proiectele DDP includ întregul termen de la ușă la ușă.'
    - q: 'Livrați DDP în SUA și Canada?'
      a: 'Da. DDP include transportul maritim, formalitățile vamale, taxele vamale și impozitele, precum și livrarea la depozitul dumneavoastră — un singur preț total, previzibil. Sunt disponibile și FOB Qingdao și CIF.'
    - q: 'Care este MOQ-ul pentru un import SUP private label?'
      a: 'MOQ este confirmat în funcție de configurația proiectului: dezvoltarea mostrei acoperă 1–2 bucăți, loturile pilot sunt de 20–50 bucăți pe platforme existente, iar producția standard de volum rulează 90–100+ bucăți pe model dintr-o rolă completă de drop-stitch de 150 m.'
    - q: 'Ce documentație furnizați pentru importuri?'
      a: 'Mostra aprobată se expediază împreună cu documentația CE și REACH pregătită pentru piețele dumneavoastră țintă, iar fiecare container se expediază cu listă de ambalare, factură și certificat de transport maritim.'
    - q: 'Ce documente de conformitate din SUA furnizați pentru plăcile SUP?'
      a: 'Plăcile SUP gonflabile pentru adulți nu sunt produse pentru copii, așadar regulile CPSIA pentru produsele de consum nu se aplică, în general. California Prop 65 reprezintă o evaluare la discreția dumneavoastră în privința etichetării — documentația noastră de materiale REACH/RoHS, furnizată la fiecare comandă, susține această evaluare. Documentația conformă cu USCG poate fi susținută acolo unde categoria dumneavoastră de produs o impune, iar inginerul de proiect desemnat confirmă documentele exacte cerute de avocatul sau retailerul dumneavoastră înainte de începerea producției.'
    - q: 'Pot vizita fabrica înainte de comandă?'
      a: 'Da. Fabrica de 12,500 m² din Qingdao este deschisă clienților — tururile virtuale ale fabricii pot fi organizate online, iar vizitele în persoană sunt conduse pe liniile de producție și la posturile de control al calității.'
    - q: 'Cum încep un proiect din SUA sau Canada?'
      a: 'Trimiteți o placă de referință, o schiță sau specificații. Analiza de inginerie și oferta revin în termen de o zi lucrătoare, iar un NDA este semnat înainte de orice schimb de fișiere.'

