moq_stages:
  tagline: Mostră · Pilot · Volum
  title: 'Trei etape distincte de cantitate'
  subtitle: 'Cantitățile pentru mostră, pilot și producția de volum sunt diferite. Fiecare proiect este încadrat într-unul dintre cele trei trepte distincte, astfel încât să validați înainte de a vă angaja.'
  steps:
    - step: '01'
      title: 'Dezvoltarea mostrei (1–2 bucăți)'
      desc: 'Confirmare fizică a rigidității corpului de apă, a texturii suprapușului de tracțiune EVA, a acurateții graficii și a montării accesoriilor, înainte de orice angajament financiar. Se aplică taxele pentru mostră, care sunt creditate la comanda de producție la semnarea contractului.'
    - step: '02'
      title: 'Comanda pilot (20–50 de bucăți)'
      desc: 'Testare comercială înainte de sezon și validare a pieței regionale, folosind platforme existente ale corpului de apă, materiale din stoc și ambalaje simplificate, pentru a minimiza fricțiunea de configurare.'
    - step: '03'
      title: 'Producția de volum (90–100+ bucăți)'
      desc: 'Se confirmă după blocarea listei de materiale, finalizarea artwork-ului, ambalajele personalizate și planificarea livrării — role complete de țesătură de 150 m, țesături Pantone personalizate, ambalaje dedicate, reduceri de volum și trasabilitate a loturilor pe întregul lanț.'

moq_factors:
  tagline: Ce determină MOQ-ul dumneavoastră
  title: 'De ce MOQ-ul complet personalizat este întotdeauna specific proiectului'
  subtitle: 'Pentru producție 100% pe comandă, MOQ-ul se calculează din arhitectura completă a produsului — aceste patru componente sunt evaluate împreună înainte de ofertă.'
  headers:
    component: Componentă de proiect
    driver: Factor de producție
    impact: Impact asupra cantității minime
  rows:
    - component: 'Forma corpului de apă și uneltele'
      driver: 'Forme rocker existente în fabrică față de matrițe de tăiere CAD dedicate și unelte de presare la cald EVA'
      impact: 'Platforme existente: comenzi pilot de la 20 de bucăți. Corpuri de apă dedicate: este necesară amortizarea uneltelor specifice.'
    - component: 'Variantele de culoare și PVC-ul'
      driver: 'Culori standard unice din stoc față de foi de PVC vopsite Pantone, proprietare'
      impact: 'PVC-ul Pantone personalizat necesită rulaje dedicate de vopsire chimică, cu MOQ-uri independente pentru materii prime.'
    - component: 'Ambalajele de marcă'
      driver: 'Cutii generice cu etichete cu cod de bare față de cutii de cadou retail din carton de 5 straturi, tipărite integral în culoare, și manuale cu branding'
      impact: 'Cutii colorate personalizate au un minim independent al utilajului de tipărire offset (de regulă 500+ cutii).'
    - component: 'Pachetele de accesorii'
      driver: 'Vâsle standard din aluminiu sau nailon față de vâsle din carbon adaptate și pompe cu branding'
      impact: 'Accesoriile complet personalizate urmează loturile de producție ale furnizorilor de subnivel.'

