moq_faqs:
  tagline: FAQ
  title: 'Întrebări frecvente despre MOQ'
  items:
    - q: 'MOQ-ul se calculează pe comandă, pe model sau pe variantă de culoare?'
      a: 'MOQ-ul se poate aplica pe model, variantă de culoare, versiune de artwork, configurație de ambalare sau comandă totală. Deoarece grosimi diferite ale drop-stitch-ului (12 cm față de 15 cm) și culorile diferite de PVC provin din role de materii prime distincte, comandarea a 50 de plăci împărțite pe 5 culori creează 5 cerințe separate de role de țesătură. Confirmăm calculul exact față de matricea dumneavoastră de SKU-uri înainte de ofertă, astfel încât să vă puteți planifica combinația clar.'
    - q: 'Pot comanda o mostră înainte de producția de masă?'
      a: 'Da. Dezvoltarea mostrei (1–2 bucăți) verifică rigiditatea corpului de apă, textura suprapușului de tracțiune EVA, acuratețea graficii și montarea accesoriilor, înainte de eliberarea producției de masă. Se aplică taxele pentru mostră, care sunt creditate la comanda de producție la semnarea contractului.'
    - q: 'De ce are ambalajul retail personalizat un MOQ independent?'
      a: 'Utilajele de tipărire flexografică sau offset pentru cutii personalizate necesită o producție minimă de 500+ bucăți. Oferim o Soluție Hibridă de Depozitare a Ambalajelor: producem cele 500 de cutii tipărite personalizat, păstrăm excedentul în depozitul nostru curat și îl eliberm pe parcursul expedițiilor de plăci programate ale dumneavoastră — astfel încât și o comandă mai mică poate fi expediată în ambalaje retail complet personalizate.'
    - q: 'De ce este MOQ-ul de volum standard de 90–100 de bucăți?'
      a: 'MOQ-ul de volum standard urmează materia primă: o rolă master de 150 m de țesătură drop-stitch de calitate superioară furnizează aproximativ 90–100 de plăci finite pentru un corp de apă touring sau all-around standard. Utilizarea rolelor complete elimină îmbinările de țesătură, menține tensiunea fibrelor uniformă și amortizează calibrarea de 2 ore a liniei de sudură și laminare — asigurând cel mai mic cost posibil pe bucată.'
    - q: 'O cantitate mai mare reduce costul pe bucată?'
      a: 'În majoritatea proiectelor, da. Cantitățile mai mari îmbunătățesc randamentul materialelor, distribuie cheltuielile fixe de configurare a liniei de producție pe mai multe plăci și reduc costurile de ambalare pe bucată.'
    - q: 'Se aplică din nou taxele pentru forme de co-branding la comenzile repetate?'
      a: 'Nu. Taxele pentru formele de tipărire în serigrafie se percep o singură dată la configurarea inițială și sunt scutite la comenzile repetate care folosesc aceeași dimensiune a artwork-ului. Plătiți doar taxa de manipulare în fabrică și tipărire de $1.00 USD per placă.'
    - q: 'Solicitarea unei consultanțe MOQ mă obligă la o comandă?'
      a: 'Nu. Solicitarea unei consultanțe MOQ de proiect permite echipei noastre de inginerie de la Qingdao Vatrad Group Co., Ltd. să analizeze fișa tehnică a dumneavoastră și să vă recomande traseul de producție cel mai rentabil. Un Acord de Confidențialitate (NDA) este disponibil înainte de a partaja specificații tehnice sau artwork confidențial.'

