answer:
  label: 'Короткий ответ'
  text: 'Да — вы можете запустить бренд надувных SUP с пробным заказом по низкому MOQ. Точка входа разбита на уровни, а не «всё или ничего»: сначала закажите 1–2 образца (готовы за 7–12 дней), чтобы зафиксировать корпус, графику и упаковку; затем разместите пробный заказ 20–50 досок (производство 25–35 дней), чтобы проверить реальные продажи; и только затем масштабируйтесь до стандартных серий 90–100+ досок на рулон ткани drop-stitch 150 m, когда формат подтверждён. Мелкосерийный со-брендинг начинается всего с 5–10 шт. для операторов, которым нужны брендированные доски вообще без этапа разработки. Ваш первый контейнер приходит только тогда, когда данные это показывают.'
  verified: 'Сентябрь 2026'

trial_included:
  tagline: Что входит в пробный заказ
  title: 'Всё, что нужно для запуска, без накладных расходов'
  subtitle: 'Пробный заказ — это не уменьшенный счёт, а тот же заводской процесс, масштабированный под запускающийся бренд. Вот что включает каждая пробная программа.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Платформа и конструкция доски'
      desc: 'Проверенные в эксплуатации туристические и универсальные корпуса с конструкцией drop-stitch, трёхслойным бортом и жёсткостью 12–15 PSI — те же платформы, которые используют наши серийные клиенты, в складских размерах от 10 ft до 11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Ваш брендинг, нанесённый по-настоящему'
      desc: 'Графика на всю поверхность — цифровая или трафаретная печать, накладка EVA с вашим логотипом и дополнительный брендинг на носу или боковых бортах. Мелкосерийный со-брендинг использует центральный брендинг iSupfactory с вашим логотипом на носу или бортах.'
    - icon: P
      icon_bg: purple
      title: 'Варианты упаковки, масштабируемые дальше'
      desc: 'Начните с типовых коробок и штрихкодовых наклеек, а для последующих серий перейдите на полноцветные 5-слойные розничные коробки под бренд. Индивидуальная упаковка имеет независимый минимум печати; излишки коробок хранятся и выдаются по графику.'
    - icon: Q
      icon_bg: orange
      title: 'Контроль качества заводского уровня'
      desc: 'Каждая доска проходит тот же чек-лист сборки из 100 пунктов и 24-часовое испытание давлением и на герметичность (удержание 18.0 PSI, автоматический брак при падении более 0.50 PSI), что применяется к любому заказу, образцу или контейнеру.'
    - icon: D
      icon_bg: blue
      title: 'Экспорт и документация'
      desc: 'Документация о соответствии CE, ISO 9001, BSCI, REACH и RoHS, упаковка экспортного класса и координация морских перевозок более чем в 50 стран — от образца в 1 доску до полных программ.'
    - icon: T
      icon_bg: green
      title: 'Сроки, на которые можно планировать'
      desc: 'Образцы за 7–12 дней, пробное производство за 25–35 дней после подтверждения заказа и задатка, а также подтверждённые производственные слоты для предсезонных заказов — чтобы запуск пришёлся на сезон, а не после него.'

trial_steps:
  tagline: Дорожная карта запуска
  title: 'От идеи до первых продаж за шесть этапов'
  subtitle: 'Типичный первый запуск занимает 8–12 недель от брифа до поставленного пробного заказа при использовании готовых платформ — дольше, если индивидуальный корпус требует разработки пресс-формы. Для каждого этапа заранее согласована дата.'
  steps:
    - step: 'Этап 1'
      title: 'Продуктовый бриф и инженерная проверка (дни 0–2)'
      desc: 'Вы сообщаете целевую модель доски, объём заказа, графику и замысел по упаковке. Инженерная проверка завершается в течение одного рабочего дня, при необходимости NDA доступно до передачи конфиденциальных спецификаций.'
    - step: 'Этап 2'
      title: 'Спецификация, MOQ и расчёт цены (дни 3–7)'
      desc: 'Коммерческое предложение с расшифровкой, содержащее точный расчёт MOQ, стоимость образцов и этапы сроков изготовления. Стоимость образцов засчитывается в счёт вашего производственного заказа после подписания договора.'
    - step: 'Этап 3'
      title: 'Образцы за 7–12 дней'
      desc: '1–2 физические доски подтверждают жёсткость корпуса, текстуру накладки EVA, точность графики и посадку аксессуаров. Вы тестируете доску до принятия любых других обязательств.'
    - step: 'Этап 4'
      title: 'Пробный заказ 20–50 досок (25–35 дней)'
      desc: 'Производство на готовых платформах корпуса со складскими материалами и упрощённой упаковкой — минимальный коммерческий тест, отражающий реальные условия работы с запасами.'
    - step: 'Этап 5'
      title: 'Продажи и окно обратной связи'
      desc: 'Важный этап проходит на вашем рынке, а не на нашем заводе: прокатчики и покупатели подтверждают формат доски, графику и ценовой уровень до того, как вы масштабируетесь.'
    - step: 'Этап 6'
      title: 'Масштабирование до серий (90–100+ досок)'
      desc: 'Когда формат подтверждён, стандартные серии по рулону 150 m дают полную производственную эффективность, брендированную упаковку и объёмные цены. Программа в контейнерных объёмах — это цель, а не требование.'

