trial_faqs:
  tagline: FAQ
  title: 'Частые вопросы о запуске с пробным заказом'
  items:
    - q: 'Можно ли действительно запустить бренд SUP без заказа-контейнера?'
      a: 'Да. Точка входа разбита на уровни: 1–2 образца подтверждают доску (готовы за 7–12 дней), пробный заказ 20–50 досок подтверждает рынок (производство за 25–35 дней), а серии 90–100+ досок подключаются только тогда, когда продажи подтверждают формат. Мелкосерийный со-брендинг начинается всего с 5–10 шт., когда вам нужны брендированные доски вообще без этапа разработки.'
    - q: 'Сколько времени занимает полный запуск от начала до конца?'
      a: 'При использовании готовых платформ корпуса типичный первый запуск занимает 8–12 недель от продуктового брифа до поставленного пробного заказа: образцы за 7–12 дней, пробное производство за 25–35 дней после подтверждения заказа и задатка. Индивидуальный корпус добавляет 15–20 дней разработки пресс-формы.'
    - q: 'Что входит в цену — и что не входит?'
      a: 'Справочные диапазоны указаны EXW Циндао за сами доски, включая нанесение брендинга и стандартный контроль качества. Они ориентировочные: итоговый расчёт цены подтверждается по вашей конфигурации — корпус, PVC, охват графикой, упаковка и аксессуары — до любых обязательств. Перевозка, пошлины и таможенное оформление в месте назначения рассчитываются отдельно.'
    - q: 'Обязательно ли покупать 100 или 500 досок, чтобы нанести на них свой логотип?'
      a: 'Нет. Мелкосерийный со-брендинг наносит ваш логотип на нос или боковые борты уже от 5–10 шт., а пробные заказы 20–50 досок поддерживают нанесение полной графики при том же качестве, что и серийное производство. С количеством меняется цена изделия, а не доступность.'
    - q: 'Что будет, если я захочу изменить дизайн после пробного заказа?'
      a: 'Изменения между пробным заказом и серией — это обычное и приветствуемое дело — в этом и состоит смысл пробного заказа. Сочетания цветов, графика, упаковка и аксессуары пересчитываются по новой конфигурации, а затем замораживаются с утверждением графики и BOM перед серийным производством. Сборы за пресс-форму трафаретной печати не взимаются при повторных заказах с тем же размером графики.'
    - q: 'Подписываете ли вы NDA до того, как я поделюсь дизайном?'
      a: 'Да. Соглашение о неразглашении доступно до того, как вы поделитесь конфиденциальными техническими спецификациями или графикой. Мы производим исключительно под брендами наших клиентов и никогда не конкурируем с ними ни на одном рынке — та же политика применяется как к образцу в 1 доску, так и к программе в контейнерных объёмах.'

