answer:
  label: 'Közvetlen válasz'
  text: 'Az európai márkák standard feltételekkel rendelnek felfújható SUP-t az iSupfactory-tól: az MOQ-t a projekt konfigurációja határozza meg: az 1–2 darabos mintasorozatok validálják a szerkezetet, a 20–50 darabos pilóta tételek meglévő platformokon tesztelik a piacot, a standard tömeggyártás pedig modellenként 90–100+ darabot gyárt egy teljes, 150 m-es drop-stitch tekercsből. Az első minta a specifikációk jóváhagyása után 7–12 nap alatt, a gyártás a megrendelés és az előleg megerősítése után 25–35 nap alatt készül el, a tengeri szállítás pedig további 4–6 hetet tesz hozzá Rotterdam vagy Hamburg vonatkozásban. A CE- és REACH-dokumentáció a jóváhagyott mintával együtt készül el, a DDP pedig tartalmazza a vámformalitásokat és a raktárába történő kiszállítást.'
  verified: '2026. szeptember'

