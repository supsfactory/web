  text: 'Ein aufblasbares SUP ist ein Stand-Up-Paddle-Board aus Drop-Stitch-PVC-Gewebe, das bei Aufblasen auf 12–15 PSI formstabil wird. Für die meisten Freizeit- und Toureneinsätze erreicht es die Leistung von Hardboards, wiegt etwa 8–10 kg und lässt sich für Lagerung und Reisen zu einem Rucksack zusammengelegt verstauen.'
