meta:
  title: 'Checklist de auditoria da fábrica — O que verificar antes de escolher um produtor de SUP | iSupfactory'
  description: 'Checklist de auditoria da fábrica para compradores de SUP insufláveis: sistema de qualidade, capacidade, rastreabilidade de materiais, testes de pressão, conformidade social e documentação.'
  dateModified: '2026-08-21'
