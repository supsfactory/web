meta:
  title: 'Kalite Laboratuvarı — Test ve Kalite Güvence | {SITE}'
  description: 'Vatrad’da ISO 9001 süreçleriyle çalışan bağımsız kalite laboratuvarı: şişirilebilir SUP tahta kalitesini garanti etmek için her birim sevkiyattan önce test edilir.'
  dateModified: '2026-08-07'
  keywords:
    - 'sup kalite kontrol'
    - 'kürek tahtası test laboratuvarı'
    - 'iso 9001 sup fabrikası'
    - 'şişirilebilir sup kalitesi'
hero:
  tagline: Kalite Kontrol Laboratuvarı
  title: Test Laboratuvarı ve Kalite Güvence
  subtitle: 'ISO 9001 süreçleriyle çalışan bağımsız kalife laboratuvarı — her birim sevkiyattan önce test edilir'

answer:
  label: 'Net cevap'
  text: 'Birimlerin %100’ü 18.0 PSI’da 24 saat basınç testine tabi tutulur ve basınç düşümü 0.50 PSI’ın üzerine çıktığında otomatik ret uygulanır. Ham kumaş partileri ASTM D751 ve ISO 4674’e göre doğrulanır; kaynak soyma testleri her 50 birimde ve ISO 2859’a göre AQL 2.5 nihai örnekleme ile yürütülür.'
  verified: 'Eylül 2026'

intro: Vatrad, üretimden bağımsız olarak faaliyet gösteren, kendine ait bir kalite kontrol laboratuvarı işletir. Her hammadde partisi ve her tamamlanmış SUP tahtası, sevkiyat öncesi belgelenmiş denetim protokollerinden geçer. QC ekibimiz doğrudan yönetime raporlar ve tarafsız kalite kararları alınmasını sağlar.

highlights:
  - value: 100%
    label: Basınç testine tabi tutulan birimler
    detail: Her oda, her tahta
  - value: 24 h
    label: Hava tutma testi süresi
    detail: 18.0 PSI anma basıncında
  - value: '&lt;5%'
    label: İzin verilen azami basınç düşümü
    detail: 24 saatlik tutma süresi boyunca
  - value: AQL 2.5
    label: Ana kusur eşiği
    detail: ISO 2859 örneklemesine göre

test_procedures:
  - title: Ham Malzeme Denetimi
    description: 'Gelen her PVC, Hypalon, drop-stitch kumaş ve donanım partisi kabul öncesi test edilir. Çekme dayanımı (ASTM D751), yırtılma direnci (ISO 4674) ve UV direnci doğrulanır. Uyumsuz malzemeler karantinaya alınır ve iade edilir.'
    standards:
      - 'ASTM D751 (çekme)'
      - 'ISO 4674 (yırtılma)'
      - 'ISO 4892 (UV)'
  - title: Süreç İçi QC Kontrol Noktaları
    description: 'Üretim operatörleri her aşamada kendi denetimini yapar. QC denetçileri vardiya boyunca rastgele örnekleme yürütür. Kaynak soyma testleri her 50 birimde gerçekleştirilir. Ölçü kontrolleri her 20. panelde yapılır.'
    standards:
      - 'ASTM D751 (soyma)'
      - 'İç 100 maddelik kontrol listesi'
      - 'ISO 2859 örneklemesi'
  - title: 48 Saatlik Hava Tutma Testi
    description: 'Her tüp oda 18.0 PSI’a şişirilir ve 24 saat tutulur. Basınç sensörleri sıcaklık telafisiyle kesintisiz kaydeder. 0.50 PSI basınç düşümünü aşan her oda, otomatik parti yeniden denetimini tetikler.'
    standards:
      - 'ISO 6185'
      - 'CE 2013/53/EU'
  - title: 'Yük ve Denge Testi'
    description: 'Tamamlanan tahtalar, kararlılık, serbest yükseklik ve kullanım açısından azami anma kapasitesinde test edilir. Her tahta, nihai denetim onayından önce su testine tabi tutulur.'
    standards:
      - 'ISO 12217'
      - 'CE 2013/53/EU'

equipment:
  - name: Evrensel Test Cihazı (çekme)
    spec: 5 kN, ASTM D751 uyumlu
  - name: Basınç Düşüm Test Cihazı
    spec: Çok kanallı, 0–50 psi, veri kaydı
  - name: UV Yaşlandırma Odası
    spec: ISO 4892, 1.000 saat döngü
  - name: Kalınlık Ölçer (dijital)
    spec: 0,01 mm çözünürlük
  - name: Soyma Test Cihazı (kaynak)
    spec: Motorlu, 50 N kapasite
  - name: Sıcaklık Odası
    spec: -40 °C ile +100 °C
  - name: Sızıntı Tespit Tankı
    spec: 6 m × 2 m, aydınlatmalı

lab_evidence:
  tagline: Test Raporu Dosyaları
  title: 'Gerçek Laboratuvar Test Raporlarını İndirin'
  subtitle: 'Kalite ekibimizin kapatma yaptığı aynı iki dilli kontrollü kayıtlar — yapı, yöntem, kriterler ve sonuçlar, gizli alanlar çıkarılmış olarak. Her dosya yedi denetim kapısından birine karşılık gelir.'
  items:
    - title: 'IQC — Giriş Malzemesi Raporları'
      description: 'Kumaş, PVC rulo, supap ve bileşen doğrulamasının onaylı şartnameye karşı testi.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'IQC raporlarını indir (PDF)'
    - title: 'IPQC — Süreç İçi ve İlk Ürün Raporları'
      description: 'Kilitlenmiş revizyona karşı ilk ürün ve süreç içi denetim kayıtları.'
      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'IPQC raporlarını indir (PDF)'
    - title: 'Hava Sızdırmazlığı — Basınç ve Sızıntı Kayıtları'
      description: '%100 dikiş sızıntı tespiti, supap bütünlüğü ve 24 saatlik basınç tutma doğrulaması.'
      icon: tabler:waves
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Hava sızdırmazlığı raporlarını indir (PDF)'
    - title: 'FQC — Nihai Tahta Test Raporları'
      description: 'Onaylı numuneye karşı nihai denetim — ölçüler, kozmetik ve fin kutusu.'
      icon: tabler:shield-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'FQC raporlarını indir (PDF)'
    - title: 'PSI — Ambalajlama ve Sevk Öncesi Raporlar'
      description: 'Kit tamlığı, barkod derecesi, koli işaretleri ve düşürme güvenliği kayıtları.'
      icon: tabler:package
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'PSI raporlarını indir (PDF)'
    - title: 'Sevkiyat Onayı ve İzlenebilirlik Dosyası'
      description: 'Şartname, görsel sanat ve BOM’a eşlenen sevkiyat onayı ve parti izlenebilirliği.'
      icon: tabler:history
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Onay raporlarını indir (PDF)'
    - title: 'Eksiksiz Kalite Dosyası'
      description: 'Dokümantasyon sistemimin tamamını kapsayan tek paket — QIP, kapı kayıtları, izlenebilirlik ve NCR kontrolü.'
      icon: tabler:books
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'Dokümantasyon paketini indir (PDF)'

