hero:
  tagline: 'Kanada'
  title: 'Kanada için Şişirilebilir SUP OEM — Qingdaodan Deponuza'
  subtitle: '7–12 günde numune, 25–35 günde üretim, Vancouver, Toronto veya Montreal limanlarına 4–6 haftalık deniz navlunu. FOB Qingdao, CIF veya DDP — her iSupfactory müşterisiyle aynı fabrika, aynı kalite kontrolü, aynı altı aşamalı geliştirme süreci.'

answer:
  label: 'Doğrudan cevap'
  text: 'Kanadalı markalar şişirilebilir SUPyi iSupfactoryden standart koşullarla sipariş eder: MOQ, proje yapılandırmasıyla belirlenir — 1–2 adetlik numune partileri yapıyı doğrular, mevcut platformlarda 20–50 adetlik pilot partiler pazarı test eder, standart hacimli üretim ise tam 150 m drop stitch rulosundan tasarım başına 90–100+ adet çalışır. İlk numune, teknik özellik onayından 7–12 gün sonra sevk edilir; üretim, kesinleşen sipariş ve depozitodan 25–35 gün sonra tamamlanır, deniz navlunu ise Kanada limanlarına 4–6 hafta ekler — batı kıyısında Vancouver, doğuda Toronto ve Montreal. DDP, gümrükleme ve deponuza teslimi kapsar.'
  verified: 'Eylül 2026'

