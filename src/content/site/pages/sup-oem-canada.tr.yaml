why_canada:
  tagline: 'Kanadalı alıcılar neden tercih ediyor'
  title: 'Kanada İthalatı İçin Tasarlandı'
  subtitle: 'Fabrika, Kanadalı markaların ve perakendecilerin ilk konteynerlerinden önce sorduğu sorulara yanıt verir.'
  items:
    - title: 'Öngörülebilir maliyet için DDP'
      description: 'DDP, gümrükleme ve deponuza teslimi kapsar — gümrük vergileri, vergiler ve navlun CAD veya USD olarak tek bir toplamda. İlk kez ithalat yapanlar için en popüler seçenek.'
    - title: 'Batı ve doğu kıyısı yönlendirmesi'
      description: 'Vancouver için veya Süveyş rotası üzerinden Toronto ve Montreal için deniz navlunu fiyatlandırırız — hangisi geçiş süreniz ve maliyetinizi dengeliyorsa seçenek sunarız.'
    - title: 'İki dilli hazır ürün dosyaları'
      description: 'CE, REACH ve gümrük belgeleri hedef pazarlarınız için hazırlanır; böylece ürün dosyanız İngilizce ve Fransızca ambalajlama gereksinimlerine uygun olur.'
    - title: 'Tek fabrika, tek kalite sistemi'
      description: 'Geliştirme, numune, üretim ve kalite kontrolün tamamı 12.500 m² tesis içinde gerçekleşir — aracıya dönüş yok, üretimin karşılayamadığı numune yok.'

process_notes:
  tagline: 'Nasıl çalışır'
  title: 'Teknik Özellikten Konteynere'
  subtitle: 'Yılda iki konteyner de alsanız yirmi de alsanız aynı altı aşama: teknik özellik, mühendislik, numune, test, kalıp, üretim — ardından FOB, CIF veya DDP teslim.'
  items:
    - title: '1. Teknik özelliklerinizi gönderin'
      description: 'Bir referans board, bir taslak çizim veya bir rakip teknik özellik yeterlidir. Mühendislik incelemesi ve teklif bir iş günü içinde döner.'
    - title: '2. Numuneyi onaylayın'
      description: 'İlk fiziksel numuneniz, konstrüksiyon, baskı renkleri ve basınç testi sonuçlarını kapsayan onay formuyla 7–12 günde sevk edilir.'
    - title: '3. Üretim ve ihracat'
      description: 'Partiler süreç içi kalite kontrolü kontrol noktalarıyla 25–35 günde tamamlanır. Paket listesi, fatura ve konşe mektubu gemiden önce yola çıkar.'
    - title: '4. Deponuza teslim'
      description: 'Vancouver, Toronto veya Montreal için 4–6 haftalık deniz navlunu — DDP kapsamında gümrükleme ve kapınıza teslimi biz üstleniriz.'

faq_section:
  tagline: SSS
  title: 'Kanada İthalatı Soruları'
  questions:
    - q: Kanada için deniz navlunu ne kadar sürer?
      a: 'Sefer programına ve hedefe bağlı olarak Qingdao limanından Kanada limanlarına — batı kıyısında Vancouver, doğuda Toronto ve Montreal — 4–6 hafta öngörün. DDP projeleri eksiksiz kapıdan kapıya zaman çizelgesini içerir.'
    - q: Kanada için DDP gönderiyor musunuz?
      a: 'Evet. DDP, deniz navlununu, gümrükleme, gümrük vergileri ve vergileri ve deponuza teslimi kapsar — öngörülebilir tek bir toplam fiyat. FOB Qingdao ve CIF seçenekleri de mevcuttur.'
    - q: Özel marka SUP ithalatı için MOQ nedir?
      a: 'MOQ, proje yapılandırmasıyla belirlenir: numune geliştirme 1–2 adedi kapsar, mevcut platformlarda pilot partiler 20–50 adet çalışır ve standart hacimli üretim tam 150 m drop stitch rulosundan tasarım başına 90–100+ adet çalışır.'
    - q: İngilizce ve Fransızca ambalajlamayı destekliyor musunuz?
      a: 'Evet. Ön baskı ekibimiz, hedef pazarlarınızın dilleri ve düzenlemeleri için baskı verisi hazırlar — Kanada pazarı için iki dilli EN/FR ambalajlama dahil.'
    - q: Sipariş öncesi fabrikayı ziyaret edebilir miyim?
      a: 'Evet. Qingdao şehrindeki 12.500 m² tesis müşterilere açıktır — çevrimiçi sanal fabrika turları düzenlenebilir ve üretim hatları ile kalite kontrol istasyonlarında rehberli yerinde ziyaretler gerçekleştirilebilir.'
    - q: Kanada üzerinden bir proje nasıl başlatırım?
      a: 'Bir referans board, taslak çizim veya teknik özellik gönderin. Mühendislik incelemesi ve teklif bir iş günü içinde döner ve her dosya alışverişinden önce NDA imzalanır.'

