values_section:
  title: Így dolgozik a gyár a márkákkal
  subtitle: 'Három alapelv, amely minden VATRAD-gyárban megvalósuló projektet meghatároz.'
  columns: 3
  items:
    - title: Mérnöki tervezés a gyártás előtt
      description: 'Minden projekt igényekkel, rajzokkal és egy fizikai mintával indul — a test formája, a drop-stitch osztály, a grafika elhelyezése és a csomagolás már a sorozatgyártás előtt validálva van, nem a soron derül ki.'
      icon: 'tabler:settings'
    - title: Egy csapat, egy üzem
      description: 'A tervezés, a vágás, a hegesztés, az összeállítás és a tesztelés egyetlen 12,500 m²-es üzemben zajlik. Nincs kereskedőcég-jellegű átadás: azok válaszolnak az Ön kérdéseire, akik az Ön deszkáit építik.'
      icon: 'tabler:building-factory-2'
    - title: Kis kezdő sorozatok
      description: 'A közös márkájú kis sorozatok gyártása 5–10 darabbal indul, a standard tömegsor gyártása pedig 90–100+ darab soronként (egy 150 m-es drop-stitch tekercs) fut, így a márkák a bővülés előtt validálhatják a piacot — a későbbi megrendelések számára megőrzött szerszámok és grafika megtartásával.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Mit szállít a gyár
  subtitle: 'Az iSupfactory ügyfelei számára rendelkezésre álló gyártási szolgáltatások.'
  columns: 2
  items:
    - title: Egyedi SUP fejlesztés
      description: 'Igényfelmérés, specifikáció, anyagválasztás, grafika, prototípuskészítés, minta jóváhagyása és egyedi felfújható SUP termékek gyártása.'
      icon: 'tabler:bulb'
    - title: Private label gyártás
      description: 'Az Ön logója, színvilága és csomagolása már validált értékesítési platformokon — a deszka, a lapát és a tartozékok, valamint a dobozok az Ön arculatát hordozzák, a gyár márkajelölése nélkül.'
      icon: 'tabler:tag'
    - title: OEM / ODM gyártás
      description: 'Teljes OEM és ODM gyártás felfújható SUP deszkákhoz, az ügyfél rajzai vagy a közösen kifejlesztett tervek alapján, beleértve az új deszkaformák egyedi matricáit.'
      icon: 'tabler:package'
    - title: Intézményi flották
      description: 'Márkázott deszkaflotta üdülők, klubok, iskolák és kölcsönző üzemeltetők részére, egységes kiegészítőkkel és a flottákhoz igazított gyártási sorokkal.'
      icon: 'tabler:users-group'
certifications_section:
  title: 'Tanúsítások és megfelelőség'
  subtitle: 'A gyár dokumentált megfelelési rendszer alapján szállít az EU-ba, az USA-ba és az ázsiai-csendes-óceáni térségbe.'
  columns: 2
  items:
    - title: CE-tanúsítás
      description: 'A felfújható SUP termék- és csónakvonalak megfelelnek az Európai Unió biztonsági előírásainak, minden piac számára rendelkezésre álló dokumentációval.'
      icon: 'tabler:certificate'
    - title: ISO 9001 minőségügyi rendszer
      description: 'A gyártóüzem ISO 9001 minőségirányítási rendszer szerint működik, amely lefedi a beérkező anyagok ellenőrzését, a folyamat közbeni vizsgálatokat és a végső ellenőrzést.'
      icon: 'tabler:badge-check'
    - title: BSCI szociális megfelelőség
      description: 'A társadalmi felelősségvállalás a BSCI alapján auditált, lefedve a munkafeltételeket és a gyár megfelelőségét.'
      icon: 'tabler:shield-check'
    - title: REACH anyagmegfelelőség
      description: 'Az anyagok megfelelnek az Európai Unió REACH-rendeletének a vegyi biztonságról.'
      icon: 'tabler:flask'
    - title: USCG jóváhagyás
      description: 'Az Amerikai Egyesült Államok Parti Őrsége által jóváhagyott felfújható csónakgyártás.'
      icon: 'tabler:anchor'
    - title: Terméktesztelés
      description: 'Lebegőképesség, teherbíró képesség, varratszilárdság, UV-sugárzással szembeni ellenállás, kopásállóság és nyomástartás tesztelése minden gyártósoron.'
      icon: 'tabler:test-pipe'
cta:
  title: 'Fejlessze SUP-projektjét együtt a VATRAD gyárral'
  subtitle: 'Küldje el az igényeket — a deszka típusát, a méreteket, a mennyiséget és a grafikát — és egy munkanapon belül részletes ajánlatot kap.'
  actions:
