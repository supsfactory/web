intro: |
  <p>A <strong>VATRAD</strong> a <strong>Qingdao Vatrad Group Co., Ltd.</strong> tengeri gyártódivíziója, amelynek székhelye a kínai Shandong tartománybeli Qingdao Laixi Gazdasági Fejlesztési Zónájában található. A vállalat 2012-ben alakult egy hajóépítésre szakosodott műhelyként, amely a tengeri kézművesség mellett elkötelezett, és ma már tanúsított gyárként szolgálja ki az 50-nél több országból érkező OEM- és ODM-ügyfeleket.</p>
  <p>Az iSupfactory a VATRAD gyár B2B egyedi fejlesztődivíziója. Minden iSupfactory-projekt — az első mintától vagy a közös márkájú kis sorozattól a teljes private label termékvonalig — ugyanabban az üzemben, ugyanazokkal a csapatokkal és ugyanazzal a minőségügyi rendszerrel készül, amelyet itt ismertetünk.</p>
  <p>A gyár 12,500 m² területet foglal el, és magában foglalja a PVC-vágásra, a drop-stitch magok összeállítására, a nagyfrekvenciás hegesztésre, a deszkák összeállítására, valamint a légtömörségi, nyomástartási és varratszilárdsági vizsgálatokhoz használt tesztrészlet elkülönített üzemeit. A gyártási kapacitás meghaladja az évente 120.000 felfújható darabot, és az üzem az ISO 9001 minőségirányítás, a CE, a BSCI, a REACH, valamint az USCG által jóváhagyott megfelelés szerint működik az exportált termékek esetén.</p>
  <p>Több mint 350 szakképzett dolgozó és 14+ kutatási-fejlesztési mérnök támogatja azt a két irányt, amely számít a SUP-márkák szempontjából: a mérnöki munkát (a deszka testének megtervezése, az anyagkiválasztás, a prototípuskészítés) és a gyártást (grafika alkalmazása, összeállítás, ellenőrzés, exportcsomagolás). Saját kutatási-fejlesztő központunk, PVC-szöveglaboratóriummal és próbateknővel rendelkezik, amely kezeli az egyedi matricákat és a szerkezetek validálását a sorozatgyártás megkezdése előtt.</p>
