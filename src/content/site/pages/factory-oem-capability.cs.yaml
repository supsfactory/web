  subtitle: Od konceptu po sériovou výrobu — upravte každý detail své řady nafukovacích SUP

answer:
  label: 'Přímá odpověď'
  text: 'MOQ se určuje podle konfigurace projektu, nikoli podle pevného čísla: každý projekt prochází fází vzorku (1–2 kusy) a pilotní dávky (20–50 kusů), zatímco standardní sériová výroba běží v dávkách 90–100+ kusů z plného 150m role drop-stitch. Vzorky jsou připraveny za 7–12 dní; standardní výroba trvá 25–35 dní po potvrzení objednávky a zálohy.'
  verified: 'září 2026'

intro: Vatrad nabízí komplexní služby OEM a ODM značkám, distributorům a státním organizacím po celém světě. S více než 10 lety zkušeností s exportem a s certifikovaným závodem o ploše 12 500 m² s certifikacemi ISO 9001 a BSCI přebíráme vše od návrhu výrobku a vývoje forem až po sériovou výrobu, balení a řízení exportu.

highlight:
  - value: 10+
    label: Let zkušeností s OEM
    detail: Od roku 2012
  - value: 50+
