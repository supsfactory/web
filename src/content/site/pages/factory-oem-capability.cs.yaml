services:
  - title: Návrh výrobku a inženýring
    description: Náš interní vývojový tým pracuje s vaším konceptem nebo specifikací a vytváří výkresy CAD, 3D modely a prototypy. Nabízíme návrh forem, optimalizaci tvaru trupu a poradenství při výběru materiálu.
  - title: Individualizovaný branding a grafika
    description: Plnobarevný digitální tisk, sítotisk, reliéfní značení a varianty etiket. Vyvíjíme grafiku na palubě, branding na bočnicích a obaly připravené pro maloobchod.
  - title: Individualizace materiálu a specifikace
    description: Vybírejte z PVC (standardní, ekologické, zpomalovač hoření), Hypalon/CSM, drop-stitch a hybridních konstrukcí. Individuální barvy bočnic, gramáže tkanin a varianty zesílení.
  - title: Balení a logistika
    description: Individuální maloobchodní obaly, krabice pod vlastní značkou, vakuové balení, paletování a balení na úrovni pro export — vše připravujeme vlastními silami.

moq_table:
  - product: Nafukovací desky SUP
    standard_moq: 'Vzorek 1–2 | Pilot 20–50'
    custom_moq: 'Objem 90–100+ (z 150m role)'
    lead_time: 25–35 dní

why_us:
  - title: Vertikální integrace
    description: 'Vlastníme svůj závod, formy i dodavatelský řetězec — žádní prostředníci ani subdodavatelé. To nám dává kontrolu nad kvalitou, náklady i dodávkou.'
  - title: Dvojitá certifikace
    description: Řízení kvality podle ISO 9001 a certifikace sociální odpovědnosti BSCI. Zprávy z auditu závodu předkládáme na vyžádání.
  - title: Soulad s CE
    description: Certifikace CE se vztahuje na modely určené pro trhy EU (rozsah se potvrzuje u každého projektu). Individuální modely lze přes náš osvědčený postup rovněž certifikovat podle CE.
  - title: MOQ podle konkrétního projektu
    description: 'MOQ se potvrzuje podle konfigurace vašeho projektu — malé dávky spolupráce na značce začínají na 5–10 kusech, standardní objem běží po 90–100+ kusech v dávce. Pomáháme začínajícím značkám vstoupit na trh bez nadměrných zásob.'

