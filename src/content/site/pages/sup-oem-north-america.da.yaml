why_north_america:
  tagline: 'Hvorfor købere i USA og Canada'
  title: 'Bygget til nordamerikansk import'
  subtitle: 'Fabrikken besvarer de spørgsmål, amerikanske og canadiske mærker stiller, før den første container ankommer.'
  items:
    - title: 'DDP for en forudsigelig kostpris'
      description: 'DDP inkluderer toldbehandling og levering til dit lager — told, afgifter og fragt i en sum. Det mest populære valg for førstegangsimportører.'
    - title: 'Dokumentation til dit målmarked'
      description: 'CE-, REACH- og tolddokumentation udarbejdes til dine målmarkeder sammen med den godkendte prøve, så din produktfil er eksportklar.'
    - title: 'FOB Qingdao med din egen speditør'
      description: 'Importerer du regelmæssigt? Tag FOB Qingdao og brug din egen logistikpartner — vi lader og dokumenterer containeren, du styrer resten.'
    - title: 'En fabrik, et kvalitetssystem'
      description: 'Udvikling, prøvefremstilling, produktion og QC foregår alle i fabrikken på 12,500 m² — ingen omveje via speditører, ingen prøver, som produktionen ikke kan matche.'

process_notes:
  tagline: 'Sådan fungerer det'
  title: 'Fra specifikation til container'
  subtitle: 'De samme seks faser, uanset om du køber to eller tyve containere om året: specifikation, konstruktion, prøvning, test, værktøj og produktion — derefter FOB-, CIF- eller DDP-levering.'
  items:
    - title: '1. Send din specifikation'
      description: 'Et referencebræt, en skitse eller en konkurrent-specifikation er nok. Konstruktionsgennemgang og tilbud returneres inden for en arbejdsdag.'
    - title: '2. Godkend prøven'
      description: 'Din første fysiske prøve afsendes på 7–12 dage sammen med et godkendelsesark, der dækker konstruktion, trykfarver og resultater af trykprøvning.'
    - title: '3. Produktion og eksport'
      description: 'Kørsler afsluttes på 25–35 dage med QC-kontrolpunkter undervejs. Pakliste, faktura og bill of lading sendes før skibet.'
    - title: '4. Levering til dit lager'
      description: '4–6 ugers søfragt til havne i USA eller Canada — under DDP håndterer vi toldbehandling og levering til din dør.'

faq_section:
  tagline: FAQ
  title: 'Spørgsmål om import til Nordamerika'
  questions:
    - q: 'Hvor længe tager søfragten til USA eller Canada?'
      a: 'Regn med 4–6 uger fra Qingdao-havnen til havne i USA eller Canada, afhængigt af destination og afsejlingsplan. DDP-projekter omfatter den komplette tidsplan fra dør til dør.'
    - q: 'Sender I DDP til USA og Canada?'
      a: 'Ja. DDP inkluderer søfragt, toldbehandling, told og afgifter samt levering til dit lager — en forudsigelig samlet pris. FOB Qingdao og CIF er også tilgængelige.'
    - q: 'Hvad er minimumsordren for en private label SUP-import?'
      a: 'Minimumsordren (MOQ) fastlægges ud fra projektkonfigurationen: prøveudvikling dækker 1–2 stk., pilotbatcher kører 20–50 stk. på eksisterende platforme, og serieproduktion kører 90–100+ stk. pr. design ud fra en fuld drop-stitch-rulle på 150 m.'
    - q: 'Hvilken dokumentation udleverer I til importen?'
      a: 'Den godkendte prøve afsendes med CE- og REACH-dokumentation udarbejdet til dine målmarkeder, og hver container sendes med pakliste, faktura og bill of lading.'
    - q: 'Hvilke amerikanske overensstemmelsesdokumenter udleverer I til SUP?'
      a: 'Oppustelige SUP til voksne er ikke børneprodukter, så CPSIA-regler for forbrugersikkerhed gælder generelt ikke. Californias Prop 65 er en vurdering, du selv afgør efter mærkningsbehov — vores materialedokumentation for REACH/RoHS pr. ordre understøtter vurderingen. USCG-overensstemmelsesdokumentation kan stilles til rådighed, hvor din produktkategori kræver det, og din navngivne projektingeniør bekræfter de præcise dokumenter, din advokat eller forhandler efterspørger, før produktionen starter.'
    - q: 'Kan jeg besøge fabrikken, før jeg bestiller?'
      a: 'Ja. Fabrikken på 12,500 m² i Qingdao er åben for kunder — der kan arrangeres virtuelle fabriksture online, og du kan besøge os personligt med omvisning i produktionslinjerne og QC-stationerne.'
    - q: 'Hvordan starter jeg et projekt fra USA eller Canada?'
      a: 'Send et referencebræt, en skitse eller en specifikation. Konstruktionsgennemgangen og tilbuddet returneres inden for en arbejdsdag, og en NDA underskrives før nogen filudveksling.'

