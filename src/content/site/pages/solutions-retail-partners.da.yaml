content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Læs videre:</strong> se hele <a href="/da/oem-manufacturing">OEM/ODM-produktionsprogrammet</a> — projektbekræftede MOQ’er i prøve-, pilot- og volumenstadiet, private label-branding og CE-overensstemmelse — eller læs <a href="/da/oem-moq-guide">guiden til MOQ og fleksibel branding</a>, eller gå en tur på <a href="/da/factory">fabrikken</a> for at se, hvordan retailklar QC drives.</p>
  </div>

