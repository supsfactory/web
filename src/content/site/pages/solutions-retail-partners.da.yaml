meta:
  title: 'Special- og private label-SUP-produktion for forhandlere | {SITE}'
  description: 'Special- og private label-SUP-produktion for retailmærker: brætspecifikationer, brandet tryk, lave prøve-MOQ’er og fabriksQC — fra prøve til større partier.'
  dateModified: '2026-08'

hero:
  tagline: Retailmærker
  title: 'Specialproduktion af SUP til retailmærker'
  subtitle: 'Retailmærker lancerer deres egen paddleboard-serie med vores fabrik: brætspecifikationer udviklet ud fra dine krav, dit mærke på produktet og produktions-QC håndteret fra start til slut.'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
    alt: Vatrad SUP-brætter produceret til et retailmærke

answer:
  label: 'Det korte svar'
  text: 'MOQ bekræftes ud fra projektkonfigurationen: retailmærker starter med en prøve (1–2 stk.) eller et pilotparti (20–50 stk., prøver på 7–12 dage), skalerer til en OEM-serie i standardvolumen på 90–100+ stk. pr. design (25–35 dage efter ordre og depositum), eller investerer i en specialform til fuldt skræddersyede serier (værktøjet koster 15–20 dage ekstra). Ethvert bræt trykprøves før afsendelse, med FOB-, CIF- eller DDP-betingelser fra Qingdao.'
  verified: 'September 2026'

margin_section:
  title: 'Produktionsstadier for retailmærker'
  subtitle: 'Start med en prøve, kør en pilot for at validere, skaler til en serie i standardvolumen, eller invester i en specialform — MOQ og leveringstider fastsættes af produktionsvejen, ikke af gætteri.'
  items:
    - tier: 'Prøvestadium'
      moq: '1–2 stk.'
      margin_note: 'Leveringstid for prøve 7–12 dage'
      features:
        - 'Udvikling af artwork ud fra dine brandmaterialer'
        - 'Fysisk prøve til godkendelse'
        - 'QC på standardplatform'
    - tier: 'Pilotstadium'
      moq: '20–50 stk.'
      margin_note: 'Markedsvalidering på lagerførte platforme'
      features:
        - 'Tryk på hele brættet, logo og EVA-layout'
        - 'Genbestillinger på de samme verificerede platforme'
        - 'Eksportdokumentation inkluderet'
    - tier: 'Specialform'
      moq: 'Bekræftes ud fra projektkonfigurationen'
      margin_note: 'Værktøjet koster 15–20 dage ekstra'
      features:
        - 'Ny brætform og udvikling af form'
        - 'Fuld kontrol over specifikationerne'
        - 'Prioriteret allokering i produktionen'

