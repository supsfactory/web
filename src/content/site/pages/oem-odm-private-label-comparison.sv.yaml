hero:
  tagline: 'Välj er samarbetsmodell'
  title: 'OEM vs. ODM vs. Private Label — vilken modell passar ert projekt?'
  subtitle: 'Tre sätt att samarbeta med en SUP-fabrik, vart och ett med annan ägande, andra investeringar och en annan avvägning mellan fart och kontroll. Den här guiden förklarar skillnaderna, så att ni väljer rätt spår före er första förfrågan.'

answer:
  label: 'Snabb jämförelse'
  text: 'OEM: ni äger design och specifikation — vi tillverkar enligt era ritningar. ODM: vårt tekniska team utvecklar brädan utifrån er briefing — ni godkänner före produktionen. Private Label: ert varumärke på en befintlig, bevisad plattform utan strukturella ändringar — snabbaste vägen till marknaden. Alla tre spår går genom samma fabrik, samma QC-system och samma exportteam i Qingdao, Kina.'
  verified: 'September 2026'

comparison_table:
  tagline: 'Bredvid varandra'
  title: 'OEM / ODM / Private Label jämförda'
  subtitle: 'Väsentliga skillnader i designägande, MOQ, formverktyg, leveranstider och immateriella äganderätt.'
  headers:
    dimension: Dimension
    oem: OEM-produktion
    odm: ODM-utveckling
    pl: Private Label
  rows:
    - dimension: ' vem designar brädan?'
      oem: 'Ni levererar specifikation, ritningar eller en referensbräda'
      odm: 'Fabrikens tekniska team utvecklar utifrån er briefing'
      pl: 'Befintlig fabriksplattform — ingen designinsats'
    - dimension: 'Ägande av design och IP'
      oem: 'Ni äger alla designer, formverktyg och den immateriella äganderätten'
      odm: 'Ni äger den godkända slutdesignen; fabriken behåller utvecklingsprocessens IP'
      pl: 'Fabriken äger plattformsdesignen; ni äger varumärke och grafik'
    - dimension: 'Formverktyg / utrustning'
      oem: 'Eget formverktyg behövs för nya former — engångskostnad för utrustning, +15–20 dagar'
      odm: 'Kan kräva eget formverktyg beroende på specifikation — samma utrustningsplanering'
      pl: 'Inget nytt formverktyg — befintlig plattforms utrustning används'
    - dimension: 'Minsta beställningsmängd'
      oem: '90–100+ enheter per godkänd konfiguration'
      odm: '90–100+ enheter per godkänd konfiguration; pilotpartier på 20–50'
      pl: '5–10 enheter (co-branding) eller 20–50 (pilotparti på befintlig plattform)'
    - dimension: 'Typisk leveranstid'
      oem: '25–35 dagar + 15–20 dagar för utrustning vid nytt formverktyg'
      odm: '25–35 dagar + utvecklingsiteration (varierar med komplexiteten)'
      pl: '25–35 dagar (ingen fördröjning från formverktyg)'
    - dimension: 'Anpassningsnivå'
      oem: 'Total — form, konstruktion, material, grafik, förpackning'
      odm: 'Total — fabriken föreslår, ni godkänner varje element'
      pl: 'Endast grafik och förpackning — inga strukturella ändringar'
    - dimension: 'Provprocess'
      oem: '1–2 prototyprover på 7–12 dagar efter specifikationsgodkännande'
      odm: '1–2 prototyprover på 7–12 dagar efter designgodkännande'
      pl: '1–2 prover på 7–12 dagar — plattformen är redan validerad'
    - dimension: 'Ideal för'
      oem: 'Köpare med befintliga designer, referensbrädor eller detaljerade specifikationer'
      odm: 'Köpare med produktidéer eller marknadskrav men utan detaljerad specifikation'
      pl: 'Köpare som snabbt vill ha märkta brädor utan produktutveckling'

