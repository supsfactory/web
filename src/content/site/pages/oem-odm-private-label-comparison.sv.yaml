ip_rules:
  tagline: 'Skydd av immateriella äganderätt'
  title: 'Så skyddar vi er design och ert varumärke'
  subtitle: 'Oavsett samarbetsmodell förblir ert artwork, era formverktyg och era specifikationsfiler era egna.'
  body: |
    **NDA före filutbytet.** Vi undertecknar en sekretessessavtal före varje utbyte av tekniska filer — standard svarstid inom 4 arbets timmar.

    **Ingen återanvändning av designer.** Ert artwork, era formverktyg och era specifikationsfiler delas eller säljs aldrig till andra kunder. OEM-formverktyg är exklusivt era. ODM-designer godkänns av er före produktionen. Private Label-plattformar är delade strukturer, men er grafik och varumärkessättning är exklusiv.

    **Endast B2B.** Vi tillverkar uteslutande under våra kunders varumärken. Vi säljer inte till slutanvändare och konkurrerar inte med våra kunder på någon marknad.

    **Ägande av formverktyg.** Egna formverktyg som betalats av köparen tillhör köparen. Vi förvarar och underhåller dem, men får inte använda dem för andra kunder utan skriftligt tillstånd.

faqs:
  tagline: 'FAQ'
  title: 'Vanliga frågor om OEM, ODM och Private Label'
  items:
    - q: 'Kan jag senare byta från Private Label till OEM?'
      a: 'Ja. Många kunder börjar med Private Label-produktion eller en pilot för att validera marknaden och investerar sedan i egen utrustning för ett fullständigt OEM-program när efterfrågan är bevisad. Samma fabrik och samma QC-system stöder båda spåren.'
    - q: 'Innebär ODM att fabriken äger mitt varumärke?'
      a: 'Nej. Vid ODM äger ni ert varumärke, er grafik och er förpackning. Fabriken utvecklar brädans struktur utifrån er briefing och ni godkänner designen före produktionen. Fabriken behåller utvecklingsprocessens IP, men den godkända produktspecifikationen är er.'
    - q: 'Är Private Label av sämre kvalitet än OEM?'
      a: 'Nej. Alla tre spår går genom samma fabrik, samma QC-system och samma exportteam. Private Label-brädor byggs på bevisade, validerade plattformar, med hela trycktestet på 18 PSI/24 timmar och samma 100-punkts montagelista.'
    - q: 'Vad gör jag om jag inte är säker på vilken modell jag ska välja?'
      a: 'Kontakta oss om er situation — vårt tekniska team rådgör om det mest praktiska spåret utifrån era produktkrav, er planering och era antalsmål. Det finns ingen som helst förpliktelse före specifikationsgranskningen.'
    - q: 'Kan jag få prover innan jag väljer modell?'
      a: 'Ja. 1–2 prototyprover skickas inom 7–12 dagar. Provkostnaderna räknas av mot er storbeställning. Så kan ni bedöma konstruktion och kvalitet före någon volymförpliktelse.'

