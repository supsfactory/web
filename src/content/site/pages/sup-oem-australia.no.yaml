hero:
  tagline: 'Australia'
  title: 'OEM oppblåsbare SUP for Australia — lager før sesongen'
  subtitle: 'Prøver innen 7–12 dager, produksjon på 25–35 dager, sjøfrakt på 4–6 uker til Sydney, Melbourne eller Brisbane. Kjøpere på sørhalvøgel planlegger 3–4 måneder i forveien, slik at varene rekker frem før sesongen desember–februar.'

answer:
  label: 'Kort svar'
  text: 'Australske merker bestiller oppblåsbare SUP hos iSupfactory under standardvilkår: MOQ bekreftes av prosjektkonfigurasjonen: prøvesykluser med 1–2 stk validerer konstruksjonen, små pilotserier med 20–50 stk tester markedet på eksisterende plattformer, og standardvolumserier går med 90–100+ stk per design fra en hel drop-stitch-rull på 150 m. Den første prøven sendes 7–12 dager etter at spesifikasjonene er godkjent, produksjonen tar 25–35 dager etter bekreftet PO og depositum, og sjøfrakten kommer i tillegg med 4–6 uker til Sydney, Melbourne eller Brisbane. Med produksjon pluss frakt bestiller du 3–4 måneder før du trenger brettene på lager; DDP dekker tollbehandling og levering til lageret ditt.'
  verified: 'September 2026'
