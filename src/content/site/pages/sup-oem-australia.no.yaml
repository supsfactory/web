why_australia:
  tagline: 'Hvorfor kjøpere i Australia'
  title: 'Bygd for det australske markedet'
  subtitle: 'For australske merker er kalenderen avgjørende: bestill i første halvdel av året, slik at containerne rekker frem før sommeren.'
  items:
    - title: 'Sesongtilpasset planlegging'
      description: 'Den australske sommeren går fra desember til februar. En produksjon på 25–35 dager pluss 4–6 ukers frakt innebærer: en ordre i Q1–Q2 gir varene på lager før høysesongen.'
    - title: 'DDP for planleggbare destinasjonskostnader'
      description: 'DDP omfatter tollbehandling, importtoll, avgifter og levering til lageret ditt — én totalpris, dør til dør.'
    - title: 'FOB Qingdao med din speditør'
      description: 'Fast importør? Velg FOB Qingdao og bruk din egen logistikkpartner — vi laster og dokumenterer containeren, du tar seg av resten.'
    - title: 'Én fabrikk, ett kvalitetssystem'
      description: 'Utvikling, prøver, produksjon og QC skjer alle i fabrikken på 12 500 m² — den godkjente prøven er produktet du får.'

process_notes:
  tagline: 'Slik fungerer det'
  title: 'Fra spesifikasjon til container'
  subtitle: 'De samme seks fasene, uansett om du kjøper to eller tjue containere per år: spesifikasjon, konstruksjon, prøve, verifisering, verktøybygging, produksjon — deretter levering FOB, CIF eller DDP.'
  items:
    - title: '1. Send spesifikasjonen din'
      description: 'Et referansebrett, en skisse eller en konkurrentens spesifikasjon er nok. Teknisk verifisering og tilbud følger innen én arbeidsdag.'
    - title: '2. Godkjenn prøven'
      description: 'Din første fysiske prøve sendes innen 7–12 dager med en godkjenningsblankett for konstruksjon, trykkfarger og resultatene av trykktestingen.'
    - title: '3. Produksjon & eksport'
      description: 'Syklusene fullføres på 25–35 dager med QC-kontrollpunkter under produksjonen. Pakkeliste, faktura og bill of lading går før skipet.'
    - title: '4. Levering til lageret ditt'
      description: '4–6 ukers sjøfrakt til Sydney, Melbourne eller Brisbane — med DDP håndterer vi tollbehandlingen og leveransen til døren din.'

faq_section:
  tagline: Vanlige spørsmål
  title: 'Spørsmål om import til Australia'
  questions:
    - q: Hvor lang tid tar sjøfrakten til Australia?
      a: 'Regn med 4–6 uker fra Qinhaos havn til Sydney, Melbourne eller Brisbane, avhengig av avgangsschedules. DDP-prosjekter omfatter hele tidslinjen dør til dør.'
    - q: Når må jeg bestille for å ha lager før sommeren?
      a: 'Produksjonen tar 25–35 dager og frakten 4–6 uker, så bestill omtrent 3–4 måneder før du trenger varene. For sommer-sesongen desember–februar legger du PO-en i første halvdel av året.'
    - q: Sender dere DDP til Australia?
      a: 'Ja. DDP omfatter sjøfrakt, tollbehandling, importtoll og avgifter pluss levering til lageret ditt — én planleggbar totalpris. Også FOB Qingdao og CIF er tilgjengelig.'
    - q: Hva er MOQ for en private label-SUP-import?
      a: 'MOQ bekreftes av prosjektkonfigurasjonen: prøveutviklingen omfatter 1–2 stk, små pilotserier går med 20–50 stk på eksisterende plattformer, og standardvolumserier går med 90–100+ stk per design fra en hel drop-stitch-rull på 150 m.'
    - q: Hvilken dokumentasjon leverer dere for importen?
      a: 'Den godkjente prøven sendes med CE- og REACH-dokumentasjon som er utarbeidet for målmarkedene dine, og hver container sendes med pakkeliste, faktura og bill of lading.'
    - q: Hvordan starter jeg et prosjekt fra Australia?
      a: 'Send et referansebrett, en skisse eller en spesifikasjon. Den tekniske verifiseringen og tilbudet kommer innen én arbeidsdag, og en NDA signeres før hver filutveksling.'

