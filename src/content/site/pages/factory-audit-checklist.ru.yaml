hero:
  tagline: 'Проверка благонадёжности'
  title: 'Чек-лист аудита завода'
  subtitle: 'Прежде чем сделать выбор в пользу производителя SUP, проверьте основу. Этот чек-лист охватывает восемь областей, которые должен проверить профессиональный закупщик: от менеджмента качества и производственной мощности до прослеживаемости материалов и социальной ответственности. Каждый пункт этого списка мы можем подтвердить документами, а не только заявлениями.'

answer:
  label: 'Краткий ответ'
  text: 'Восемь областей аудита, которые важнее всего: (1) Система менеджмента качества — сертификация ISO 9001 и реальные записи о контроле по каждому этапу, а не просто сертификат на стене. (2) Производственная мощность — фактические цифры выпуска, а не паспортные. (3) Прослеживаемость материалов — входной контроль и протоколы испытаний на уровне партий. (4) Испытания давлением и конструкции — документированные протоколы выдержки. (5) Контроль сварки и сборки — параметры ВЧ-сварки и контроль швов. (6) Социальная ответственность — аудит BSCI или эквивалентный. (7) Документация и прослеживаемость — документы партий, журналы контроля, сертификаты соответствия. (8) Поддержка после поставки — процесс гарантии, запасные части, оперативность коммуникации.'
  verified: 'Сентябрь 2026'

audit_areas:
  tagline: Восемь областей аудита
  title: 'Что проверить — восемь областей аудита'
  subtitle: 'Каждая область включает вопросы, которые нужно задать, документы, которые нужно запросить, и тревожные признаки, на которые нужно обратить внимание.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
  features:
    - icon: Q
      icon_bg: blue
      title: '1. Система менеджмента качества'
      desc: 'Запросите: сертификат ISO 9001 (аккредитованный орган, действующий), график внутренних аудитов, журнал CAPA (корректирующих и предупреждающих действий), процедуры контрольных этапов. Тревожный признак: только сертификат, без записей о контроле по этапам и без процесса CAPA.'
    - icon: C
      icon_bg: green
      title: '2. Производственная мощность'
      desc: 'Запросите: помесячные цифры выпуска по типам продукции, производственный график с текущей загрузкой, мощность оснастки (число пресс-форм, станков с ЧПУ, ВЧ-сварочных аппаратов). Тревожный признак: только паспортная мощность, без данных о загрузке и без производственного графика.'
    - icon: M
      icon_bg: purple
      title: '3. Прослеживаемость материалов'
      desc: 'Запросите: записи входного контроля материалов, сертификаты поставщиков PVC и drop-stitch, прослеживаемость партии от сырья до готовой доски, декларации о веществах REACH/RoHS. Тревожный признак: нет прослеживаемости на уровне партий, сертификаты на материалы недоступны.'
    - icon: P
      icon_bg: orange
      title: '4. Испытания давлением и конструкцией'
      desc: 'Запросите: протокол испытания давлением (PSI, длительность, критерии годности), журналы испытаний последних производственных партий, записи испытаний конструкции (падение, удар, нагрузка на усилители борта). Тревожный признак: «только визуальный контроль» или отсутствие документированного протокола с количественными критериями годности.'
    - icon: W
      icon_bg: blue
      title: '5. Контроль сварки и сборки'
      desc: 'Запросите: записи параметров ВЧ-сварки (температура, давление, время выдержки), критерии контроля швов и уровень брака, документацию по последовательности сборки. Тревожный признак: нет журналов параметров сварки, высокий брак швов без CAPA.'
    - icon: S
      icon_bg: green
      title: '6. Социальная ответственность'
      desc: 'Запросите: отчёт об аудите BSCI или SMETA (действующий, полного охвата), документы по рабочему времени и заработной плате, отчёты по охране труда и промышленной безопасности, документацию по экологическому соответствию. Тревожный признак: нет стороннего социального аудита либо аудит с неустранёнными существенными несоответствиями.'
    - icon: D
      icon_bg: purple
      title: '7. Документация и прослеживаемость'
      desc: 'Запросите: документы производственных партий, журналы контроля по каждому этапу, сертификаты соответствия, упаковочные листы со ссылками на партии, систему учёта гарантийных обращений. Тревожный признак: нет документации на уровне партий, гарантийные обращения не отслеживаются и не анализируются.'
    - icon: A
      icon_bg: orange
      title: '8. Поддержка после поставки'
      desc: 'Запросите: условия гарантии и порядок обращений, среднее время рассмотрения обращений, наличие запасных частей, обязательства по времени ответа, процедуру анализа после поставки. Тревожный признак: нет документированного процесса по гарантии, медленная или непоследовательная коммуникация после поставки.'

our_position:
  heading: 'Наша позиция по каждой области аудита'
  body: |
    Мы не просто заявляем о соответствии — мы предоставляем документы. Вот наша позиция по каждой из восьми областей аудита:

    - **Менеджмент качества**: сертифицирован по ISO 9001:2015, ежегодный аудит аккредитованной третьей стороной. Система контрольных этапов из 7 стадий с документированными критериями годности на каждом этапе. Журнал CAPA ведётся и пересматривается ежеквартально.
    - **Производственная мощность**: годовая мощность 120,000+ досок, ежемесячный выпуск около 10,000. Производственный график доступен для ознакомления во время посещения завода. 4 автоматизированные производственные линии, раскрой с ЧПУ, ВЧ-сварка и лаборатория испытаний давлением.
    - **Прослеживаемость материалов**: прослеживаемость на уровне партий от входящего материала до готовой доски. Сертификаты поставщиков PVC и drop-stitch находятся в архиве. Декларации о веществах REACH и RoHS доступны по каждой партии.
    - **Испытания давлением**: выдержка при 18.0 PSI с автоматическим браком при падении более 0.50 PSI за 24 часа. Журналы испытаний доступны по каждой производственной партии. Испытания конструкции и ударные испытания по типу конструкции.
    - **Контроль сварки**: параметры ВЧ-сварки фиксируются по каждому производственному запуску. Контроль швов на этапе 3 с документированным уровнем брака. CAPA инициируется при превышении порогового уровня брака.
    - **Социальная ответственность**: аудит BSCI пройден. Документы по рабочему времени, заработной плате и технике безопасности доступны для ознакомления во время посещения завода.
    - **Документация**: документы производственных партий, журналы контроля по каждому этапу, сертификаты соответствия и упаковочные листы со ссылками на партии отгружаются с каждым заказом. Система учёта гарантийных обращений поддерживается в актуальном состоянии.
    - **Поддержка после поставки**: условия гарантии зафиксированы в договоре. Среднее рассмотрение обращения — менее 14 рабочих дней. Запасные части доступны со склада. Анализ после поставки предлагается для каждого первого заказа.

evidence_review:
  tagline: 'Доказательства и верификация'
  title: 'СПЕЦИФИКАЦИИ ПРОВЕРЕНЫ'
  body: 'Все производственные заявления и заявления о качестве на этой странице проверены нашей производственно-инженерной командой на заводе в Лайси, Циндао. Сертификаты, записи о контроле качества, протоколы испытаний на давление и конструкцию, а также журналы прослеживаемости партий предоставляются по запросу. Спецификации в последний раз проверены в сентябре 2026.'

faqs:
  tagline: FAQ
  title: 'Аудит завода — часто задаваемые вопросы'
  items:
    - q: 'Могу ли я посетить завод для выездного аудита?'
      a: 'Да. Мы приветствуем посещения завода и можем организовать структурированный аудит по всем восьми областям. Типичный визит включает обход производственной площадки, наблюдение за контрольными этапами, осмотр склада материалов, проверку документов и ответы на вопросы с участием руководителя по качеству. Предусмотрите полный рабочий день. Свяжитесь с нами, чтобы согласовать визит.'
    - q: 'Вы предоставляете документацию по аудиту до визита?'
      a: 'Да. Мы можем поделиться сертификатом ISO 9001, отчётом BSCI, сводкой по производственной мощности, протоколом испытания давлением и образцами записей о контроле до вашего визита, чтобы вы могли подготовить адресные вопросы. Полные документы по партиям доступны на месте во время визита.'
    - q: 'Какие сторонние инспекции вы используете?'
      a: 'Мы работаем с SGS, Intertek и TUV над сторонними инспекциями и сертификацией. Сторонняя предотгрузочная инспекция доступна по запросу для любого заказа. Объём инспекции и стоимость подтверждаются на этапе расчёта цены.'
    - q: 'Как понять, что ваша система качества действительно применяется, а не только задокументирована?'
      a: 'Каждая доска проходит 7 контрольных этапов с количественными критериями годности, а не визуальные чек-листы. Данные испытаний давлением, параметры сварки и уровень брака фиксируются по каждой партии и доступны для вашего ознакомления. CAPA запускается автоматически при результатах вне спецификации. Мы приветствуем аудит действующего процесса во время посещения завода.'

