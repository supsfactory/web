faqs:
  tagline: FAQ para distribuidores
  title: 'Programa de distribuição por grosso — Perguntas frequentes'
  items:
    - q: 'Qual é a encomenda mínima para um novo distribuidor?'
      a: 'Os novos parceiros de distribuição começam normalmente com uma encomenda de aprovação de amostras e pré-produção, seguida de um primeiro contentor calibrado para a sua época. Os quantitativos mínimos exatos dependem da amplitude do território e do sortido escolhido; o teu gestor de conta confirma o quantitativo inicial durante o planeamento de sortido e branding.'
    - q: 'Podemos vender as pranchas com a nossa marca?'
      a: 'Sim. O private label é o modelo padrão aqui: as pranchas são produzidas com marca própria, com as tuas gráficas, a tua embalagem e as tuas especificações. A iSupfactory produz exclusivamente para os seus clientes e não compete com eles em nenhum mercado.'
    - q: 'Os territórios são exclusivos?'
      a: 'Sim. Os programas para distribuidores baseiam-se em territórios exclusivos — cada parceiro por grosso cobre um país ou região definidos e recebe apoio de preços e de programa para esse mercado, conforme estabelecido no acordo comercial.'
    - q: 'Apoiam o drop-shipping?'
      a: 'A capacidade drop-ship está incluída no programa. Amostras, embalagem e gestão são validadas na fase de aprovação de amostras, para que as encomendas drop-ship funcionem sem problemas desde o primeiro dia.'
    - q: 'Que modelos podemos encomendar?'
      a: 'O catálogo de produção inclui pranchas SUP insufláveis em formas Allround, Touring e Surf, caiaques insufláveis, bombas, pás, coletes salva-vidas e acessórios de manutenção, além de formas personalizadas desenvolvidas com a nossa equipa de engenheiros. A maioria dos parceiros começa com 4–8 SKUs bestseller e expande nas épocas seguintes.'
    - q: 'Como são enviadas as encomendas?'
      a: 'As encomendas saem da fábrica com partidas planeadas, com possibilidade de pré-encomenda para estabilizar os custos de transporte. O teu gestor de conta dedicado planeia a produção e o envio em torno das tuas previsões e do calendário sazonal.'
    - q: 'Como me candidato?'
      a: 'Usa o formulário de candidatura presente nesta página ou contacta-nos diretamente. As candidaturas são examinadas pela equipa de vendas e respondemos em poucos dias úteis com os passos seguintes, incluindo a atribuição do território e um esboço de contrato.'

