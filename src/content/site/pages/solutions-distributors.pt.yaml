  label: 'Resposta breve'
  text: 'Distribuidores e marcas colaboram diretamente com a fábrica: pranchas SUP white label com marca própria, preços por grosso diretos de fábrica, território exclusivo por programa, 3–8 SKUs no arranque e 45–60 dias de dilação de pagamento (tudo sujeito ao acordo comercial), com 100 % do stock testado em pressão antes do envio. Quantitativos mínimos iniciais e condições de transporte são acordados por território, com envio FOB Qingdao ou CIF.'
