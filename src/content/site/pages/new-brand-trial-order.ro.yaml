answer:
  label: 'Răspuns direct'
  text: 'Da — puteți lansa o marcă de SUP gonflabil cu o comandă de încercare cu MOQ redus. Punctul de intrare este eșalonat, nu de tip „totul sau nimic”: comandați mai întâi 1–2 mostre (gata în 7–12 zile) pentru a bloca corpul de apă, grafica și ambalajele; apoi plasați o comandă de încercare de 20–50 de plăci (producție în 25–35 de zile) pentru a testa rotația reală a stocurilor; în final, scalați către loturi de volum standard de 90–100+ plăci pe rolă de țesătură drop-stitch de 150 m, după ce formatul este dovedit. Co-branding-ul în loturi mici începe de la doar 5–10 bucăți, pentru operatori care vor plăci de marcă fără nicio etapă de dezvoltare. Primul container vine doar atunci când datele arată că este momentul potrivit.'
  verified: 'Septembrie 2026'

trial_included:
  tagline: Ce acoperă comanda de încercare
  title: 'Tot ce necesită o lansare, fără cheltuieli fixe'
  subtitle: 'O comandă de încercare nu este o factură redusă — este același proces de fabrică, dimensionat pentru o marcă aflată la început. Iată ce include fiecare program de încercare.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Platformă și construcție a plăcii'
      desc: 'Corpuri de apă touring și all-around testate în practică, cu construcție drop-stitch, fuziune în trei straturi a benzii de șină și rigiditate de 12–15 PSI — aceleași platforme folosite de clienții noștri de volum, în dimensiuni standard de la 10 ft la 11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Brandingul dumneavoastră, aplicat efectiv'
      desc: 'Artwork digital sau tipărit în serigrafie pe întreaga suprafață, suprapuș de tracțiune EVA cu logo-ul dumneavoastră și branding secundar pe prăbuie sau pe șinele laterale. Co-branding-ul în loturi mici folosește brandingul central iSupfactory, cu logo-ul dumneavoastră pe prăbuie sau pe șine.'
    - icon: P
      icon_bg: purple
      title: 'Opțiuni de ambalaje care se scalează'
      desc: 'Porniți cu cutii generice și etichete cu cod de bare, apoi treceți la cutii de cadou retail din carton de 5 straturi, tipărite integral în culoare, pentru loturile ulterioare. Ambalajele personalizate au un minim independent de utilaj; cutiile excedentare sunt depozitate și eliberate conform programului.'
    - icon: Q
      icon_bg: orange
      title: 'Control al calității la nivel de fabrică'
      desc: 'Fiecare placă trece prin aceeași listă de verificare a asamblării în 100 de puncte și prin aceeași testare la presiune și de etanșeitate pe 24 de ore (menținere la 18.0 PSI, respingere automată la o scădere de peste 0.50 PSI) care se aplică oricărei comenzi, mostre sau container.'
    - icon: D
      icon_bg: blue
      title: 'Export și documentație'
      desc: 'Documentație de conformitate CE, ISO 9001, BSCI, REACH și RoHS, ambalare de calitate export și coordonarea transportului maritim către peste 50 de țări — de la o mostră de 1 placă până la programele complete.'
    - icon: T
      icon_bg: green
      title: 'Un termen pe care îl puteți planifica'
      desc: 'Mostre în 7–12 zile, producție de încercare în 25–35 de zile după comanda confirmată și avans, și sloturi de producție confirmate pentru comenzile de presezon — astfel încât lansarea să cadă în sezon, nu după el.'

trial_steps:
  tagline: Foaia de parcurs a lansării
  title: 'De la idee la prima rotație de stoc în șase porți'
  subtitle: 'O primă lansare tipică durează 8–12 săptămâni de la fișă la comanda de încercare livrată, folosind platforme existente — mai mult timp atunci când un corp de apă dedicat adaugă dezvoltarea formelor. Fiecare poartă are o dată asupra căreia conveniți în prealabil.'
  steps:
    - step: 'Poarta 1'
      title: 'Fișă de produs și analiză de inginerie (Zilele 0–2)'
      desc: 'Partajați modelul de placă vizat, cantitatea comenzii, artwork-ul și intenția pentru ambalaje. Analiza de inginerie se finalizează în decurs de o zi lucrătoare, iar un NDA este disponibil înainte de a partaja specificații confidențiale.'
    - step: 'Poarta 2'
      title: 'Specificații, MOQ și ofertă (Zilele 3–7)'
      desc: 'Ofertă detaliată pe articole, cu calculul exact al MOQ-ului, taxele pentru mostre și segmentele de termen. Taxele pentru mostre sunt creditate la comanda de producție la semnarea contractului.'
    - step: 'Poarta 3'
      title: 'Mostre în 7–12 zile'
      desc: '1–2 plăci fizice validează rigiditatea corpului de apă, textura suprapușului de tracțiune EVA, acuratețea graficii și montarea accesoriilor. Folosiți placa înainte de a vă angaja la orice altceva.'
    - step: 'Poarta 4'
      title: 'Comandă de încercare de 20–50 de plăci (25–35 de zile)'
      desc: 'Producție pe platformele existente ale corpului de apă, cu materiale din stoc și ambalaje simplificate — cel mai mic test comercial care reflectă condițiile reale de stoc.'
    - step: 'Poarta 5'
      title: 'Fereastra de rotație a stocurilor și de feedback'
      desc: 'Poarta importantă este în piața dumneavoastră, nu în fabrica noastră: cei care închiriază și clienții confirmă formatul plăcii, grafica și nivelul de preț înainte de a scala.'
    - step: 'Poarta 6'
      title: 'Scalarea către loturi de volum (90–100+ plăci)'
      desc: 'Odată ce formatul este dovedit, loturile cu role de 150 m aduc eficiență completă de producție, ambalaje de marcă și prețuri de volum. Un program de container este scopul, nu cerința.'

trial_budget:
