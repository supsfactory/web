  title: 'Cât costă o lansare — intervale de preț de referință'
  subtitle: 'Intervale orientative de referință, EXW Qingdao (China), pentru un corp de apă touring sau all-around standard, în dimensiuni din stoc. Oferta finală depinde de forma corpului de apă, PVC, acoperirea graficii, ambalaje, accesorii și cantitate — confirmată față de configurația dumneavoastră înainte de orice angajament.'
  headers:
    stage: Etapa comenzii
    price: Preț de referință per placă
    notes: Observații
  rows:
    - stage: 'Mostre (1–2 plăci)'
      price: 'USD 250–350'
      notes: 'Mostră fizică cu grafica dumneavoastră aplicată. Taxele pentru mostre sunt creditate la comanda de producție la semnarea contractului.'
    - stage: 'Comandă de încercare / pilot (20–50 de plăci)'
      price: 'USD 180–260'
      notes: 'Platforme existente ale corpului de apă, materiale din stoc și ambalaje simplificate. Traseul standard de lansare cu MOQ redus.'
    - stage: 'Volum standard (90–100+ plăci pe rolă de 150 m)'
      price: 'USD 150–220'
      notes: 'Role complete de țesătură de 150 m, opțiuni de PVC Pantone personalizat, ambalaje de marcă și prețuri de volum.'
    - stage: 'Corp de apă și unelte dedicate (suplimentar)'
      price: 'Ofertat individual'
      notes: 'O formă dedicată a corpului de apă adaugă 15–20 de zile de dezvoltare a formelor în termenul general; uneltele sunt detaliate pe articole și ofertate o singură dată.'

derisk:
  tagline: Lansați fără riscuri
  title: 'Patru moduri în care o comandă de încercare reduce riscul lansării'
  subtitle: 'Cele mai multe lansări de mărci noi eșuează din cauza stocurilor, nu a calității produsului. O comandă de încercare este concepută astfel încât greșelile evitabile să devină imposibile.'
  features:
    - icon: I
      icon_bg: blue
      title: 'Fără angajament de stoc greu'
      desc: 'Expunerea dumneavoastră pentru primul sezon rămâne sub 50 de plăci. Dacă formatul necesită ajustări, le faceți înaintea cheltuielii mari, nu după.'
    - icon: C
      icon_bg: green
      title: 'Flux de numerar gestionabil'
      desc: 'Comenzi mai mici înseamnă avansuri mai mici, plăți eșalonate și fără capital imobilizat în depozit. Prețurile de volum așteaptă până când sunt efectiv câștigate.'
    - icon: Q
      icon_bg: purple
      title: 'Calitatea nu este niciodată redusă'
      desc: 'O comandă de încercare de 20 de plăci trece prin aceeași listă de verificare în 100 de puncte și prin aceleași încercări la presiune ca un program de container — fără compromisuri de tip „întâi încercăm, apoi vedem calitatea”.'
    - icon: G
      icon_bg: orange
      title: 'Traseu garantat către scalare'
      desc: 'Fiecare comandă de încercare are un traseu confirmat către volum: credite păstrate pentru mostră, artwork și listă de materiale blocate, și sloturi de producție rezervate pentru lotul dumneavoastră următor.'

scale_path:
  tagline: După încercare
  title: 'Ce urmează după o comandă de încercare reușită'
  subtitle: 'Comanda de încercare este concepută intenționat ca primul pas al unei relații mai lungi. Acesta este traseul pe care îl convenim înainte de expedierea primei plăci.'
  steps:
    - step: 'Faza 1'
      title: 'Încercare livrată și evaluată'
      desc: '20–50 de plăci ajung în sezon, iar datele de rotație a stocurilor revin din canalul dumneavoastră — închiriere, retail sau direct.'
    - step: 'Faza 2'
      title: 'Feedback și rafinare'
      desc: 'Variantele de culoare, grafica, ambalajele și combinația de accesorii sunt ajustate pe baza răspunsului real al pieței. Artwork-ul și lista de materiale sunt blocate pentru lotul următor.'
    - step: 'Faza 3'
      title: 'Lot de volum (90–100+ plăci)'
      desc: 'Loturi cu role de 150 m, cu eficiență completă de producție, ambalaje retail de marcă și prețuri de volum — creditele pentru mostră fiind deja aplicate.'
    - step: 'Faza 4'
      title: 'Programe la scară de container'
      desc: 'Programe de 300+ plăci, cu expediții eșalonate, materiale Pantone personalizate și întregul flux de dezvoltare — aceeași fabrică, acum la scară completă.'

trial_faqs:
  tagline: FAQ
  title: 'Întrebări frecvente despre lansarea cu o comandă de încercare'
  items:
    - q: 'Pot lansa o marcă SUP fără o comandă de container?'
      a: 'Da. Punctul de intrare este eșalonat: 1–2 mostre validează placa (gata în 7–12 zile), o comandă de încercare de 20–50 de plăci validează piața (producție în 25–35 de zile), iar loturile de volum de 90–100+ plăci urmează doar când rotația stocurilor dovedește formatul. Co-branding-ul în loturi mici începe de la doar 5–10 bucăți, atunci când doriți plăci de marcă fără nicio etapă de dezvoltare.'
    - q: 'Cât durează o lansare completă, de la un capăt la altul?'
      a: 'Folosind platformele existente ale corpului de apă, o primă lansare tipică durează 8–12 săptămâni de la fișa de produs la comanda de încercare livrată: mostre în 7–12 zile, producție de încercare în 25–35 de zile după comanda confirmată și avans. Un corp de apă dedicat adaugă 15–20 de zile de dezvoltare a formelor.'
    - q: 'Ce include prețul — și ce nu include?'
      a: 'Intervalele de referință sunt EXW Qingdao pentru plăcile în sine, incluzând aplicarea brandingului și controlul standard al calității. Ele sunt orientative: oferta finală este confirmată față de configurația dumneavoastră — corp de apă, PVC, acoperirea graficii, ambalaje și accesorii — înainte de orice angajament. Transportul, taxele vamale și formalitățile de vămuire la destinație se ofertează separat.'
    - q: 'Trebuie să cumpăr 100 sau 500 de plăci ca să pun logo-ul pe plăci?'
      a: 'Nu. Co-branding-ul în loturi mici pune logo-ul dumneavoastră pe prăbuie sau pe șinele laterale începând de la doar 5–10 bucăți, iar comenzile de încercare de 20–50 de plăci permit aplicarea integrală a graficii la aceeași calitate ca producția de volum. Ce se schimbă odată cu cantitatea este prețul pe bucată, nu disponibilitatea.'
    - q: 'Ce se întâmplă dacă vreau să schimb proiectarea după încercare?'
      a: 'Modificările dintre încercare și volum sunt normale și binevenite — tocmai acesta este rostul încercării. Variantele de culoare, grafica, ambalajele și accesoriile sunt reevaluate ca preț față de noua configurație, apoi blocate cu semnarea artwork-ului și a listei de materiale înaintea lotului de volum. Taxele pentru formele de tipărire în serigrafie sunt scutite la comenzile repetate care folosesc aceeași dimensiune a artwork-ului.'
    - q: 'Semnăm un NDA înainte să vă partajez proiectările?'
      a: 'Da. Un Acord de Confidențialitate este disponibil înainte de a partaja specificații tehnice sau artwork confidențial. Noi fabricăm exclusiv sub mărcile clienților și nu concurăm niciodată cu ei pe nicio piață — aceeași politică se aplică unei mostre de 1 placă și unui program de container întreg.'

