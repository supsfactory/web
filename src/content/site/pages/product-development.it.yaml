hero:
  tagline: Sviluppo prodotto
  title: 'Sviluppo prodotto SUP personalizzato, dall''idea al container'
  subtitle: 'Sei fasi trasformano la tua idea in tavole SUP pronte per la produzione — specifica, ingegneria, prototipazione, test, costruzione attrezzature e produzione in serie, tutto in un''unica fabbrica con un sistema qualità responsabile.'

answer:
  label: 'Risposta breve'
  text: 'Lo sviluppo prodotto SUP da SUPsfactory passa attraverso sei fasi — specifica di prodotto, ingegneria strutturale, campionatura del prototipo, test & validazione, costruzione di attrezzature personalizzate e produzione in serie. Il primo campione fisico parte 7–12 giorni dopo l''approvazione della specifica; la produzione prosegue per 25–35 giorni dopo l''ordine confermato e l''acconto; un nuovo stampo aggiunge 15–20 giorni.'
  verified: 'September 2026'

stages:
  title: 'Le sei fasi dello sviluppo prodotto SUP'
  subtitle: 'Ogni fase ha un risultato chiaro — così sai sempre a che punto è il tuo progetto — e cosa succede dopo.'
  items:
    - title: '1. Idea & specifica di prodotto'
      description: 'Geometria della tavola, fascia di peso del rider, volume, obiettivi di costruzione e pacchetto accessori. Una tavola di riferimento, uno schizzo o la specifica di un concorrente bastano per iniziare.'
      icon: 'tabler:bulb'
    - title: '2. Ingegneria & design 3D'
      description: 'Ingegneria strutturale, spessore del drop-stitch e selezione della classe PVC, oltre a una verifica di producibilità e un''offerta — entro un giorno lavorativo.'
      icon: 'tabler:blueprint'
    - title: '3. Campionatura del prototipo'
      description: 'Il tuo primo campione fisico parte in 7–12 giorni, documentato con un modulo di approvazione per costruzione, colori di stampa e risultati del test di pressione.'
      icon: 'tabler:tools'
    - title: '4. Test & validazione'
      description: 'Tenuta di pressione, resistenza delle saldature e controlli dimensionali rispetto al campione approvato, con documentazione CE e REACH per i tuoi mercati di destinazione.'
      icon: 'tabler:test-pipe'
    - title: '5. Attrezzature & produzione in serie'
      description: 'Costruzione di stampi personalizzati in 15–20 giorni, se necessario; la produzione prosegue per 25–35 giorni con punti di controllo QC in linea e tracciabilità dei lotti.'
      icon: 'tabler:settings'
    - title: '6. Consegna & scalabilità'
      description: 'Logistica FOB, CIF o DDP verso oltre 50 paesi — poi ordini di riassortimento sulla tua linea consolidata con tempi di consegna stabili e artwork approvato archiviato.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Perché lo sviluppo in fabbrica batte un progetto mediato'
  subtitle: 'Lo sviluppo direttamente nello stabilimento di produzione cambia ciò che ottieni in ogni fase.'
  items:
    - title: Nessun passaggio di consegne nel design
      description: 'Il team di ingegneria e disegno lavora sullo stesso piano della linea di saldatura — una modifica al disegno entra in produzione nella stessa settimana, non dopo un giro commerciale.'
      icon: 'tabler:handshake'
    - title: Campioni conformi alla produzione
      description: 'Il run di campionatura e il run di produzione condividono le stesse macchine, materiali e postazioni QC — il campione approvato è quindi esattamente ciò che ricevi a scala container.'
      icon: 'tabler:stack-2'
    - title: Ingegneria che non vende nulla
      description: 'Le decisioni vengono prese rispetto a costi target, peso e durata — non rispetto a margini di ricarico, perché qui è una fabbrica e la produzione è l''unica fonte di fatturato.'
      icon: 'tabler:scale'
    - title: Riservatezza come impegno permanente
      description: 'Una NDA viene firmata prima di ogni scambio di file e il tuo artwork, le tue attrezzature e i tuoi file di specifica restano di tua proprietà — mai riutilizzati, rivenduti o mostrati ad altri clienti.'
      icon: 'tabler:lock'

