faq_section:
  tagline: FAQ
  title: 'Domande frequenti sullo sviluppo SUP'
  questions:
    - q: Potete sviluppare un prodotto SUP partendo da un''idea?
      a: 'Sì. Accompagniamo tutto il percorso dalla specifica di prodotto e dall''ingegneria, attraverso lo sviluppo del prototipo, la personalizzazione e la produzione in serie in base ai tuoi requisiti. Uno schizzo, una tavola di riferimento o persino la specifica di un concorrente bastano per la verifica ingegneristica.'
    - q: Quanto costa lo sviluppo prodotto SUP?
      a: 'La verifica della specifica e la valutazione ingegneristica sono gratuite e vengono restituite entro un giorno lavorativo. La campionatura del prototipo viene quotata per progetto dopo il congelamento della specifica; i prezzi di produzione dipendono dai materiali, dalla quantità e dal fatto che sia o meno necessaria un''attrezzatura propria.'
    - q: Quanto dura lo sviluppo prodotto SUP?
      a: 'Il primo campione parte 7–12 giorni dopo l''approvazione della specifica, con 3–7 giorni per ogni giro di revisione. La produzione prosegue per 25–35 giorni dopo l''ordine e l''acconto. Uno stampo proprio aggiunge 15–20 giorni in anticipo e il trasporto marittimo incide per 4–6 settimane sulla maggior parte delle destinazioni.'
    - q: Cosa viene prima — campione o produzione?
      a: 'Sempre il campione. Un prototipo fisico viene realizzato, misurato e approvato rispetto alla specifica prima che parta qualsiasi run di produzione. Non produciamo quantità da design non approvati.'
    - q: Firmate una NDA per lo sviluppo prodotto?
      a: 'Sì. Una NDA viene firmata prima di ogni scambio di file e i tuoi design, il tuo artwork e le tue attrezzature restano di tua proprietà durante tutto lo sviluppo e la produzione.'
    - q: Potete proteggere il mio design e le mie specifiche SUP?
      a: 'I design dei clienti, le specifiche e i concept di prodotto vengono trattati in modo riservato durante lo sviluppo e la produzione. I tuoi file di attrezzatura non vengono mai riutilizzati, rivenduti o mostrati ad altri clienti.'

