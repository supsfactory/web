answer:
  label: 'Přímá odpověď'
  text: 'Minimální objednávkové množství se potvrzuje podle konfigurace projektu: vzorek (1–2 kusy), pilotní dávka (20–50 kusů) a standardní sériová dávka (90–100+ kusů na dávku z 150m role drop-stitch), přičemž malá dávka ve spolupráci na značce začíná na 5–10 kusech. Vzorky odeíláme za 7–12 dní; sériová výroba běží 25–35 dní po objednávce a záloze. Certifikace CE pro modely na trh EU a úplná dokumentace o souladu jsou součástí každé objednávky.'
  verified: 'září 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Nafukovací pádlo OEM na míru s logem značky
  actions:
    - text: 'Začít svůj projekt OEM'
      href: /cs/contact
      variant: primary
    - text: 'Prohlédnout balíčky OEM'
      href: /cs/oem-manufacturing
      variant: secondary
