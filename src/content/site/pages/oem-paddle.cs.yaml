faqs:
  title: 'FAQ k výrobě pádel OEM'
  subtitle: 'Odpovědi na nejčastější otázky značek, které si zakládají vlastní pádla.'
  items:
    - title: 'Jak si založit vlastní značku pádel?'
      description: 'Uveďte svou značku: zadání, design, certifikovaný prototyp s CE, sériová výroba a dodání. Vzorky za 7–12 dní, výroba 25–35 dní od objednávky a zálohy. Prohlédněte naše balíčky OEM.'
    - title: 'Jaká je dodací lhůta výroby?'
      description: 'Vzorek je připraven za 7–12 dní, sériová výroba běží 25–35 dní po objednávce a záloze podle objemu.'
    - title: 'Unese pádlo naše logo?'
      description: 'Ano — kompletní private label: tisk loga, vlastní barvy, obaly a etikety v image vaší značky.'
    - title: 'Mohu nakupovat ve velkém už od prvního dne?'
      description: 'MOQ se potvrzuje podle konfigurace projektu — vzorek (1–2 kusy), pilotní dávka (20–50 kusů) a standardní sériová dávka (90–100+ kusů na dávku), s cenovými úrovněmi velkoobchodu rostoucími s objemem.'

