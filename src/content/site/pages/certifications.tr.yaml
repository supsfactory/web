quality_basis:
  tagline: Kalite Esası
  title: 'Ürün Kabulünü Belirleyen Nedir'
  subtitle: 'Nihai kabul kriterleri üretim onayından önce belirlenir. Bu kontrollü proje belgeleri, ne üretileceğini, kilit ayrıntıların nasıl doğrulanacağını ve sevkiyat öncesinde nelerin kontrol edileceğini tanımlar; alıcı ile birlikte onaylanır ve Kalite Denetim Planında (QIP) dondurulur. Her değişiklik talebi belgelenmiş değişiklik kontrolünden geçer, asla üretim hattında sessizce yürütülmez.'
  items:
    - title: 'Onaylı Numune'
      description: 'Alıcı tarafından onaylanan fiziksel referans tahta. Her bitmiş tahta; ölçü, profil, sertlik ve yüzey açısından bu referansla karşılaştırılır.'
      icon: tabler:medal
    - title: 'Teknik Şartname'
      description: 'Malzeme, yapı ve ölçülendirme çizimleri revizyon numarasına bağlı olarak kilitlenir. İlk ürün denetimi (FAI), ilk partiyi bu revizyona göre doğrular.'
      icon: tabler:file-check
    - title: 'Onaylı Görsel Sanat'
      description: 'Görsel sanat, baskı renkleri ve yerleşim, kesim öncesinde onaylanır ve sürüm kilidiyle sabitlenir; böylece her güverte, markanın onayladığı görünümle sevk edilir.'
      icon: tabler:palette
    - title: 'Müşteri Onaylı BOM'
      description: 'Malzeme listesi — tahta, kürek, pompa, güvenlik ipi, çanta, kılavuz — alıcı tarafından teyit edilir. PSI, set kitaplığının %100 uygunluğunu bu BOM’a karşı kontrol eder.'
      icon: tabler:list-checks
    - title: 'Ambalajlama ve Etiketleme Gereksinimleri'
      description: 'Koli yapısı, işaretler, barkodlar, etiket içeriği ve sevkiyat işaretleri yazılı olarak sabitlenir. Barkod okunabilirliği ve işaret doğruluğu PSI’da doğrulanır.'
      icon: tabler:package
tests:
  - title: Basınç Testi
    description: Şişirilebilir odalar, önerilen çalışma sınırlarının üzerindeki basınçlara uzun süreler boyunca maruz bırakılır. Bu, malzemenin ve dikişlerin hava sızdırmazlığını ve yapısal bütünlüğünü doğrular; ürünün amaçlanan kullanımı ve olası aşırı şişirmeyi hatasız ve sızıntısız karşılayabildiğini garanti eder.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Hava sızdırmazlığı doğrulaması için basınç testindeki şişirilebilir SUP odası
  - title: Darbe Testi
    description: Ürünler, farklı ağırlıklar ve açılardan kontrollü darbelere maruz bırakılır. Bu, malzemenin suda engellerle çarpışmadan kaynaklanan delinme, yırtılma ve hasar direncini değerlendirerek dayanıklılık ve ömrü gösterir.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Şişirilebilir tekne malzemesinin delinme direncini değerlendiren darbe testi düzeneği
  - title: UV Direnç Testi
    description: Malzeme numuneleri hızlandırılmış UV radyasyona maruz bırakılarak zamanla sararmadıkları, çatlamadıkları veya dayanım kaybetmedikleri doğrulanır. Her PVC partisi, üretimde kullanılmadan önce güneş kaynaklı bozulmaya karşı kontrol edilir.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: Direnç testinde hızlandırılmış UV radyasyona maruz PVC malzeme numuneleri
  - title: Aşınma Direnci Testi
    description: Malzeme numuneleri, kontrollü basınç altında belirli sayıda çevrim boyunca aşındırıcı yüzeylere sürtülür. Bu, malzemenin tekrarlanan kullanımdan, kum, kaya veya benzeri yüzeylerle temastan doğan aşınmaya dayanma yeteneğini ölçerek uzun vadeli dayanıklılığı belgeler.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Aşınma direncini ölçmek için PVC kumaş numunesini sürtün aşınma test makinesi
  - title: Düşük Sıcaklık Performans Testi
    description: Ürünler, çeşitli sıcaklık koşullarındaki işlevselliği ve dayanıklılığı değerlendirmek üzere soğuk ortamlarda test edilir; böylece daha soğuk sularda sertleşme veya çatlama önlenir. Kış veya yüksek enlem kullanımına yönelik tekneler için kritik bir testtir.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Düşük sıcaklık performans testi için soğuk oda içindeki şişirilebilir ürün
  - title: Kaldırma Kuvveti ve Yük Kapasitesi Testi
    description: Ürünler, maksimum taşıma kapasitelerini belirlemek ve kullanıcı ile ekipmanı güvenle taşıdıklarını doğrulamak için çeşitli ağırlıklarla test edilir. Her modelin anma kapasitesi onaylanmadan önce doğrulanır.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Ağırlıklarla şişirilebilir su aracında kaldırma kuvveti ve yük kapasitesi testi
  - title: Yönlendirilebilirlik Testi
    description: Ürünler, kürek veya motor girdilerine verdiği tepki açısından test edilir; dönüş yarıçapı ve kullanım kolaylığı değerlendirilir. Su üzerindeki denemeler, gerçek hayattaki kullanımın tasarım şartnameleriyle örtüştüğünü doğrular.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Şişirilebilir SUP ve tekne gövdelerinin su üzerinde yönlendirilebilirlik testi
  - title: Su Geçirmezlik Testi
    description: Tam monte edilmiş ürünler, dikişler, supaplar veya malzemeler üzerinden herhangi bir sızıntı olup olmadığını kontrol etmek üzere suya batırılır veya su püskürtmesine maruz bırakılır. Her tekne, sevkiyat öncesi zorunlu bir su geçirmezlik kontrolünden geçer.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Dikiş ve supaplarda sızıntı kontrolü yapan suya batırma su geçirmezlik testi
qc_flow:
  tagline: 7 Aşamalı Denetim Akışı
  title: 'Uçtan uca Yedi Kontrollü Kalite Kapısı'
  subtitle: 'Aşağıdaki her kapı, denetim nesnesi, yöntemi, kabul kriterleri ve kayıt çıktısıyla proje Kalite Denetim Planında tanımlanır. İki dilli rapor dosyaları gerçek kontrollü kayıtlardır — yapıyı görmek için herhangi birini açın.'
  obj_label: Denetim nesnesi
  method_label: Denetim yöntemi
  criteria_label: Kabul kriterleri
  record_label: Kayıt çıktısı
  stages:
    - stage: STAGE 01
      title: 'Proje Kalite Planlaması (PPM)'
      summary: 'Üretim öncesi toplantı, hat başlamadan önce kapsamı, temel değerleri ve denetim planını kilitler.'
      checks:
        - 'Ürün adı, iç kod, müşteri SKU’su, sipariş numarası ve parti tanımı kaydedilir.'
        - 'Tahta tipi, drop-stitch çekirdek, malzemeler, ray bantları, EVA, supaplar ve fin sistemi belirtilir.'
        - 'Görsel sanat dosya adı, sürümü, renkleri, logo konumu ve baskı alanı kilitlenir ve onaylanır.'
        - 'BOM — set başına adet, renk, parça numarası ve ikame kurallarıyla birlikte her kalem — müşteri onaylıdır.'
        - 'Ambalajlama, etiketleme, barkod, kılavuz dili ve üçüncü taraf denetim düzenlemeleri yazılı olarak sabitlenir.'
      object: 'Proje kapsamı ile müşteri gereksinimlerinin karşılaştırılması — malzemeler, ölçüler, görsel sanat, ambalajlama, hedef pazar ve geçerli standartlar.'
      method: 'Satış, mühendislik ve QC ile üretim öncesi toplantı; Altın Numune onayı; sipariş için Kalite Denetim Planı (QIP) yayımlanır.'
      criteria: 'Beş temel değerin tamamı seri üretim başlamadan önce onaylanır ve dondurulur. Çözümlenmemiş maddeler üretim onayını engeller.'
      record: 'QIP + PPM tutanakları, onaylı numune kayıtları.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: Bir OEM SUP siparişi için altın numune ve kalite denetim planını gözden geçiren üretim öncesi toplantı
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'QIP İndir (PDF)'
    - stage: STAGE 02
      title: 'Giriş Malzemesi Denetimi (IQC)'
      summary: 'Hammadde, üretime girmeden önce onaylı tedarikçi şartnamesine karşı doğrulanır.'
      checks:
        - 'Drop-stitch kumaş, PVC rulo, ray malzemesi ve EVA güverte pedleri onaylı numuneye karşı — renk, kalınlık, ağırlık ve yüzey kusurları açısından kontrol edilir.'
        - 'Supaplar, fin yuvaları, D halkaları, tutamaklar ve donanımlar tip, ölçü, yüzey, pas ve doğru işlev açısından kontrol edilir.'
        - 'Pompalar, kürekler, güvenlik ipleri, çantalar ve onarım kitleri model, renk ve proje yapılandırması açısından doğrulanır.'
        - 'Tedarikçi sertifikaları (COA), malzeme beyanları ve REACH/RoHS uyum belgeleri parti bazında incelenir.'
        - 'Uyumsuz partiler karantinaya alınır ve herhangi bir malzeme hatta ulaşmadan iade edilir.'
      object: 'Drop-stitch kumaş, PVC rulo, supaplar, finler, aksesuarlar ve ambalajlama malzemelerinin onaylı şartname ve tedarikçi test sertifikalarına karşı kontrolü.'
      method: 'Görsel, ölçüsel ve ağırlık kontrolleri; AQL’a göre parti numune alma; malzeme sertifikalarının incelenmesi; onaylı tedarikçi listesinin uygulanması.'
      criteria: 'Onaylı şartnameyi ve sertifikaları karşılar. Uyumsuz partiler hatta sevk edilmeden önce karantinaya alınır ve reddedilir.'
      record: 'Parti referansları ve kararlarıyla IQC test raporları.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Fabrikada PVC kumaş ve SUP bileşenlerinin giriş malzemesi denetimi
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'IQC raporlarını indir (PDF)'
    - stage: STAGE 03
      title: 'Süreç İçi Kontrol ve İlk Ürün (IPQC / FAI)'
      summary: 'Yapım yöntemleri ve kontrol noktaları onaylı tahta platformuna ve proje yapılandırmasına göre seçilir. İlk ürün, kilitlenmiş temel değerlere karşı kontrol edilir; her vardiyada hat üzerinde devriye kontrolleri sürdürülür.'
      checks:
        - 'İlk ürün, seri üretim başlamadan önce onaylı numune, teknik çizim, BOM, görsel sanat ve ambalajlama dosyalarına karşı doğrulanır.'
        - 'Tahta ölçüleri, konturu ve simetrisi ölçülür; mürekkep ve logo yönü, konumu, renkleri ve revizyonu teyit edilir.'
        - 'Dikişler ve ray sürekliliği, hat üzerinde boşluk, ayrışma, kırışıklık, kirlenme veya hizasızlık açısından kontrol edilir.'
        - 'Supap, D halkası, tutamak ve fin kutusu montajı, müşteri onaylı BOM’a karşı konum, adet ve uyum açısından kontrol edilir.'
        - 'FAI onayı görsel sanatı, ölçüleri ve BOM’u sürüm kilidine alır; sapmalar yeniden işleme karar akışına yönlendirilir — asla hat üzerinde yamama yapılmaz.'
      object: 'İlk ürün ve süreç içi montajlar — dikişler, raylar, fin kutusu, supap tabanı, görsel sanat konumu, donanım torku.'
      method: 'İlk birimde İlk Ürün Denetimi; vardiya başına devriye kontrolleri; kaynak dayanımı ve dikiş hizası hat içinde doğrulanır.'
      criteria: 'FAI onayı görsel sanatı, ölçüleri ve BOM’u sürüm kilidine alır. Sapmalar yeniden işleme karar akışına yönlendirilir — asla hat üzerinde yamama yapılmaz.'
      record: 'FAI kaydı, vardiya devriye tutanakları, yeniden işleme ve karar notları.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: SUP üretimi sırasında süreç içi denetim ve ilk ürün kontrolü
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'IPQC raporlarını indir (PDF)'
    - stage: STAGE 04
      title: 'Şişirme ve Hava Sızdırmazlığı Testi'
      summary: 'Ambalajlamadan önce tamamlanan her tahta, şişirme ve hava sızdırmazlığı doğrulamasından geçirilir — birimlerin %100’ü, numune değil.'
      checks:
        - 'Şişirmeden önce tahta yüzeyi, raylar ve supap bölgesi; delikler, çatlaklar, anormal kıvrımlar veya ayrışma açısından kontrol edilir.'
        - 'Odalar kalibre edilmiş dijital göstergeyle proje test basıncına şişirilir ve ilk okuma kilitlenir.'
        - 'Supap çekirdeği, supap tabanı ve ray dikişleri çevre boyunca kontrol edilir — burun, kuyruk ve kavisli bölgeler dahil.'
        - 'Sürekli kayıtla 24 saatlik basınç tutma; izin verilen basınç düşümünün üzerinde otomatik ret.'
        - 'Başarısız tahtalar karantinaya alınır, talimat gereği yeniden işlenir ve tam olarak yeniden test edilir — yalnızca onarım noktasında tekrar kontrol edilmez.'
      object: 'Şişirilmiş odaların %100’ü — tüm dikiş boyunca sızıntı tespiti, supap bütünlüğü ve basınç düşümüyle tutma.'
      method: 'Tüm dikişlerde sızıntı tespiti, ardından 18.0 PSI’da 24 saatlik basınç tutma; 0.50 PSI düşümün üzerinde otomatik ret.'
      criteria: 'Sıfır sızıntı noktası ve oda başına 0.50 PSI içinde basınç düşümü; başarısız birimler karantinaya alınır ve yeniden işlenir veya hurdaya ayrılır.'
      record: 'Her oda için bir adet olmak üzere hava sızdırmazlığı test raporları, partiyle ilişkilendirilmiş.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Şişirilebilir bir SUP odasının şişirme ve hava sızdırmazlığı testi
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Hava sızdırmazlığı raporlarını indir (PDF)'
    - stage: STAGE 05
      title: 'Son Ürün Denetimi (FQC)'
      summary: 'Tamamlanan tahtalar, onaylı altın numuneye karşı ölçülür ve görsel açıdan derecelendirilir.'
      checks:
        - 'Temel ölçüler — uzunluk, genişlik ve kalınlık — çalışma basıncında, çizim toleranslarına karşı ölçülür.'
        - 'Tahta konturu, rocker profili ve simetri doğrulanır; şişirme sonrası anormal deformasyon, burulma veya eğilme bulunmaz.'
        - 'D65 gün ışığı lambaları altında kozmetik derecelendirme: çizikler, lekeler, yapıştırıcı izleri, kabarcıklar, kırışıklık, renk sapması.'
        - 'İşlevsel kontroller: supap açma/kapama ve kapak uyumu, fin takma ve kilitleme, D halkaları, tutamaklar ve kürek işlevi.'
        - 'Yapılandırma, müşteri onaylı BOM ve SKU’ya karşı doğrulanır — aksesuarlar, etiketler, barkodlar ve seri numaraları.'
      object: 'Tamamlanmış tahta ile altın numunenin karşılaştırılması — ölçüler, rocker, profil, kozmetik, fin kutusu uyumu ve aksesuar bütünlüğü.'
      method: 'Çizim toleranslarına karşı ölçüsel doğrulama; D65 gün ışığı lambaları altında kozmetik derecelendirme; fin kutusu ve donanım uygunluk testleri.'
      criteria: 'Ölçüler tolerans içinde (örn. 3508 × 814 × 150.3 mm), kozmetik derece onaylı numuneye göre, tüm aksesuarlar mevcut.'
      record: 'Denetçi imzası ve kararıyla FQC raporları.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Ambalajlamadan önce tamamlanmış SUP tahtalarının son ürün denetimi
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'FQC raporlarını indir (PDF)'
    - stage: STAGE 06
      title: 'Ambalajlama ve Sevk Öncesi Denetim (PSI)'
      summary: 'Ambalajlanmış set; bütünlük, işaret doğruluğu ve sevkiyata hazırlık açısından kontrol edilir.'
      checks:
        - 'BOM’a karşı %100 set bütünlüğü: tahta, kürek, pompa, güvenlik ipi, çanta, onarım kiti ve kılavuz — aynı anda bir set.'
        - 'Kırılgan parçalar korunur (pompa ve kürek çantaları), tahta ambalajlama standardına göre katlanır, aksesuarlar model ve renkle eşleşir.'
        - 'Koli grafikleri, marka, uyarılar ve dil sürümleri onaylı görsel sanat revizyonuna karşı doğrulanır.'
        - 'Barkod tipi, numarası, konumu ve okunabilirliği doğrulanır; sevkiyat işaretleri, SKU, PO, koli numarası ve adet doğrudur.'
        - 'Koli ölçüsü, brüt/net ağırlık ve iç ambalajlama ambalajlama şartnamesine uygundur; gerektiğinde düşürme testi sonucu kaydedilir.'
      object: 'Ambalajlanmış set — tahta, kürek, pompa, güvenlik ipi, çanta, kılavuz — müşteri onaylı BOM ve ambalaj şartnamesine karşı.'
      method: 'BOM’a karşı %100 set bütünlüğü; barkod taraması (Derece ≥ B); koli işaret doğruluğu; ambalajlı kolilerde ISTA-1A düşürme testi.'
      criteria: 'Yüklemeden önce BOM’a %100 set uyumu, okunabilir barkodlar, doğru işaretler ve düşürmeye dayanıklı ambalajlama.'
      record: 'Koli başına PSI kontrol listeleri ve ambalajlama kayıtları.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Ambalajlanmış SUP setinin BOM’a karşı sevk öncesi denetimi
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'PSI raporlarını indir (PDF)'
    - stage: STAGE 07
      title: 'Sevkiyat Onayı ve İzlenebilirlik'
      summary: 'Kalite, yalnızca önceki altı kapının tamamı kapatıldığında ve her kayıt eksiksiz olduğunda partiye onay verir.'
      checks:
        - 'Üretim partisi, sipariş numarası, SKU, adet ve koli sayısı, sevkiyat listesine ve ticari faturayla eşleşir.'
        - 'Şartname, BOM, görsel sanat ve ambalajlama dosyalarının tamamı güncel onaylı revizyondadır.'
        - 'IQC, FAI, süreç içi, hava sızdırmazlığı, FQC ve PSI kayıtları sevk edilen parti için eksiksizdir.'
        - 'Tüm uyumsuzluklar çözülür, yeniden işlenir, yeniden denetlenir ve kapatılır — sevkiyat onayında açık madde bulunmaz.'
        - 'Parti başına izlenebilirlik alanları kaydedilir: proje kodu, PO, SKU, görsel sanat/BOM/ambalajlama revizyonları, üretim tarihi, denetçi ve kayıt numaraları.'
      object: 'Parti için sevkiyat onay yetkisi — tüm kapılar kapalı, kayıtlar eksiksiz, seri numaraları partiyle eşleştirilmiş.'
      method: 'Kalite tarafından önceki altı kaydın kapı incelemesi; parti izlenebilirlik dosyasının hazırlanması; kayıtların sevkiyatla birlikte teslimi.'
