faqs:
  tagline: SSS
  title: Kalite Sistemimiz Hakkında Sıkça Sorulan Sorular
  items:
    - q: 'Gerçek denetim raporlarını indirebilir miyim?'
      a: 'Evet. Bu sayfadaki yedi iki dilli rapor dosyası — QIP, IQC, IPQC/FAI, hava sızdırmazlığı, FQC, PSI ve sevkiyat onayı — gizli alanlar kaldırılmış gerçek kontrollü kayıtlardır. Her siparişte kullanılan yapıyı, yöntemleri ve kabul kriterlerini tam olarak gösterirler.'
    - q: 'Yedi kapı projemle nasıl eşleşir?'
      a: 'Her proje, ürününüz ve pazarınız için geçerli kapıları, her kapıdaki denetim kapsamını ve alacağınız kayıtları tanımlayan bir Kalite Denetim Planı (QIP) alır. Yapıyı görmek için bu sayfadaki QIP numunesini indirin.'
    - q: 'Bu denetim kaydı numuneleri gerçek mi?'
      a: 'Evet. Numuneler gerçek kontrollü kayıt yapımızı izler — belge başlığı, denetim kontrol listesi, kabul kriterleri, yöntem, sonuçlar, denetçi rolü ve sevkiyat kararı. Tüm kimlik bilgileri demo değerleriyle (DEMO-* kodları) değiştirilmiştir; hiçbir müşteri, görsel sanat, sipariş veya fiyat verisi açığa çıkmaz.'
    - q: 'Numuneler neden anonimleştirilmiş?'
      a: 'Alıcı gizliliği önce gelir. Müşteri adları, görsel sanat, sipariş detayları, tedarikçi bilgileri ve fiyatlar tasarım gereği korunur. Anonimleştirme, olası her alıcının başka bir müşterinin işini açığa çıkarmadan kayıt yapımızı ve izlenebilirliğimizi doğrulamasına imkan verir.'
    - q: 'Projemiz için eksiksiz denetim raporları alabilir miyiz?'
      a: 'Evet. Onaylanan projelerde siparişinize geçerli kalite belgelerini paylaşırız — kalite denetim planı, giriş, süreç içi, hava sızdırmazlığı, son ve ambalajlama denetim raporları ile sevkiyat onay yetkisi — parti izlenebilirliğinize bağlı olarak. Hassas ticari veriler, üzerinde anlaşıldığı şekilde NDA kapsamında kalır.'
    - q: 'Parti bazında bir denetim kaydı neleri içerir?'
      a: 'Her kayıt, üretim partisini geçerli şartname veya çizim revizyonuna bağlar, her denetim kalemini kabul kriteriyle birlikte kullanılan yöntem ve aletle kaydeder ve denetçi rolü, sonuç durumu ile kalite tarafından imzalanan sevkiyat kararıyla kapanır.'
evidence_review:
