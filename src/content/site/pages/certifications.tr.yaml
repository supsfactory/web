hero:
  tagline: Özel Projeler İçin Kalite Kontrol
  title: 'Özel Şişirilebilir SUP Projeleri İçin Kalite Kontrolü'
  subtitle: 'Kalite, genel bir iddiaya karşı değil, her proje için onaylanan numuneye, teknik şartnameye, görsel sanata, malzeme listesine ve ambalajlama gereksinimlerine göre doğrulanır. Giriş malzemelerinden sevkiyat onayına kadar denetim sürecimiz, ürün uygunluğunun tanımlı üretim aşamalarında doğrulanması için yapılandırılmıştır. Vatrad arkasındaki 12.500 m² şişirilebilir SUP fabrikası olan QINGDAO VATRAD GROUP tarafından desteklenir.'
