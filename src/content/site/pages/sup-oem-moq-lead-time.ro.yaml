hero:
  tagline: 'MOQ și termen de livrare pentru SUP personalizat'
  title: 'De la 1 mostră la comenzi la scară de container — MOQ și termenul de livrare explicate'
  subtitle: 'O prezentare pe înțelesul tuturor a nivelurilor de cantitate și a termenilor de producție pentru SUP-uri gonflabile personalizate: ce puteți comanda la fiecare etapă, cât durează efectiv fiecare etapă și cum se încadrează o comandă de mostră, pilot și de volum într-un singur proiect. Proiectat și operat de Qingdao Vatrad Group Co., Ltd.'
