key_factors:
  heading: 'Kulcstényezők a konstrukciótípuson túl'
  body: |
    A konstrukciótípus csak az egyik változó a deszka teljesítményében. Három másik tényező legalább ennyit, vagy többet számít:

    - **Drop-stitch sűrűség** — a szálsűrűség hüvelykben határozza meg, mennyire egyenletesen őrzi meg a deszka az alakját nyomás alatt. Standard építésben hüvelykbenként 96 szálat, teljesítménykivitelekre 140 szálat használunk. Nagyobb sűrűség = laposabb deszka = jobb csúszás.
    - **A PVC minősége és vastagsága** – Nem minden PVC egyforma. A Koreából importált 0.7 mm-es PVC nagyobb szakadás- és UV-állóságot ad, mint a vékonyabb alternatívák. Az alapanyag minőségét projektenként specifikáljuk.
    - **Peremkialakítás** – Az egyszaporú peremek a leggyakoribb töréspontot jelentik az olcsó deszkákon. A megerősített, kétszaporú peremsávok drámaian csökkentik a peremszakadás kockázatát. Minden deszkánk használ megerősített peremet, a konstrukciós szinttől függetlenül.

faqs:
  tagline: GYIK
  title: 'SUP-konstrukció – gyakori kérdések'
  items:
    - q: 'Milyen konstrukciótípus kell a márkáimhoz?'
      a: 'A célpiactól és az árpozicionálástól függ. Belépő szint és nagy alapterületű kiskereskedelem: egyszaporú. Bérelő flották, klubok és középkategóriás márkák: kétszaporú. Teljesítmény, túra és prémium: drop-stitch mag. A legtöbb márka a kétszaporúval indul, mert az adja a legjobb egyensúlyt a költség, a tartósság és az evező élménye között. A megvalósíthatósági elemzés szakaszában az Ön konkrét piaca alapján adunk ajánlást.'
    - q: 'Kínálhatok-e több konstrukciós szintet ugyanazon márka alatt?'
      a: 'Igen – sok márka kínál két vagy három szintet. Mindhárom konstrukciót ugyanazon a soron gyártjuk, azonos minőségi ellenőrzési lépésekkel, így a konstrukciótípusok egy megrendelésben kombinálhatók. A héj formája és a grafika minden szinten azonos lehet; csak a konstrukció és az alapanyagok változnak.'
    - q: 'Mi a nyomáspróba standard minden konstrukció esetén?'
      a: 'Minden deszkát, a konstrukciótípustól függetlenül, 18.0 PSI nyomástartási próbának vetünk alá, 24 óra alatt 0.50 PSI-nél nagyobb nyomásesésnél automatikus elutasítással. Az egyszaporú deszkák névleges evezési nyomása 12–15 PSI, a kétszaporúaké 15–18 PSI, a drop-stitch magosoké 18–25 PSI. A próbanyomás minden típusnál meghaladja a névleges nyomást.'
    - q: 'Hogyan befolyásolja a konstrukció a garanciális igényeket?'
      a: 'Az egyszaporú deszkák garanciális igényaránya kissé magasabb kereskedelmi vagy bérbeadási használatban, a perem kitettsége és a perforációk miatt. A kétszaporú és a drop-stitch magos konstrukciók igényaránya lényegesen alacsonyabb. Az ajánlatkérési szakaszban a gyártási nyilvántartásainkból vett, szintenkénti garanciális adatokat adunk át.'

