content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Verdiep je:</strong> ontdek het <a href="/nl/oem-manufacturing">volledige OEM/ODM-productieprogramma</a> — MOQ's die per project worden bevestigd via de niveaus monster, pilot en serie, private label branding en CE-conformiteit — of lees de <a href="/nl/oem-moq-guide">gids MOQ & flexibele branding</a> of bezoek de <a href="/nl/factory">fabriek</a> om te zien hoe de handelsgereed-gebrachte QC wordt geïmplementeerd.</p>
  </div>

