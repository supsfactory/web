nc_intro:
  tagline: Управление несоответствующей продукцией
  title: Что происходит, когда изделие не соответствует критериям
  body: |
    Изделия или компоненты, не отвечающие установленным критериям приёмки, выявляются и помещаются под контроль, чтобы исключить непреднамеренное использование, дальнейшую обработку или отгрузку. Применимые критерии приёмки основываются на утверждённом образце, технической спецификации, макетах, спецификации материалов, требованиях к упаковке и плане контроля проекта.

    Несоответствующие изделия оцениваются для определения затронутого объёма и надлежащего решения. В зависимости от проблемы изделие может быть удержано, доработано по контролируемым инструкциям, заменено, отклонено или иным образом обработано в утверждённом порядке. Доработанные или исправленные изделия проходят повторный контроль до выпуска. Выпуск отгрузки допускается только после оформления соответствующих документов по качеству и подтверждения соответствия изделия применимым критериям приёмки.

nc_flow:
  tagline: Стандартный замкнутый цикл из 7 шагов
  title: От выявления до корректирующего действия
  subtitle: 'Единый контролируемый цикл для каждого несоответствия: выявление, карантин, рассмотрение, доработка или замена, повторный контроль, выпуск или отклонение, улучшение.'
  steps:
    - step: '01'
      title: Выявление
      desc: 'Любое выявленное несоответствие регистрируется в отношении затронутого изделия, партии или компонента и оценивается на соответствие применимым требованиям проекта. Обнаружение может произойти при входном контроле материалов, при контроле в процессе производства, при финальных испытаниях, при упаковке или при инспекции заказчика и третьей стороны.'
    - step: '02'
      title: Карантин
      desc: 'Изделия чётко обозначаются и переводятся в статус контролируемого удержания или карантина, чтобы исключить непреднамеренное использование, дальнейшую обработку или отгрузку. На этикетках HOLD / QUARANTINE / REJECTED указываются номер NCR, артикул, партия, количество, описание дефекта и дата.'
    - step: '03'
      title: Рассмотрение
      desc: 'Оценивается затронутый объём и надлежащее решение: единица, партия за смену, вся партия или несколько партий — с учётом общих партий материалов, ревизий макетов, этапов процесса и ревизий документов. При необходимости применяются дополнительные меры по локализации или ужесточение контроля.'
    - step: '04'
      title: Доработка или замена
      desc: 'Разрешённая доработка выполняется по утверждённым инструкциям, определяющим затронутое изделие, метод, материалы, контрольные точки и требования к повторному контролю. Не утверждённые изменения спецификации изделия, макетов, конфигурации аксессуаров или упаковки не допускаются. Заменённые изделия повторно проходят применимые контрольные этапы.'
    - step: '05'
      title: Повторный контроль
      desc: 'Доработанные или исправленные изделия проходят повторный контроль по применимым критериям приёмки. Исходная несоответствующая характеристика и все связанные характеристики, которые могли быть затронуты доработкой, проверяются до выпуска — независимым отделом контроля качества, а при ремонте герметичности — с полностью новым 24-часовым циклом испытания давлением.'
    - step: '06'
      title: Выпуск или отклонение
      desc: 'Продукция выпускается только после завершения необходимого повторного контроля и подтверждения уполномоченными специалистами качества соответствия применимым требованиям проекта. Изделия, которые невозможно привести в соответствие, отклоняются, заменяются, возвращаются или по ним принимается решение в контролируемом порядке, включая физическое уничтожение с наблюдением.'
    - step: '07'
      title: Корректирующее действие
      desc: '''Повторяющиеся, существенные или системные несоответствия анализируются на предмет первопричины и корректирующего действия (CAPA). Улучшения могут включать изменения рабочих инструкций, контроля материалов, контрольных точек, обучения, управления поставщиками или управления документами.'

nc_pillars:
  tagline: Основы доверия закупщика
  title: Три контроля, которые защищают ваш бренд
  subtitle: 'Процесс построен вокруг вопросов, которые действительно задают закупщики за рубежом: будут ли проблемы скрываться, выйдет ли доработка из-под контроля и будут ли отремонтированные доски перепроверены.'
  features:
    - icon: 1
      icon_bg: blue
      title: Только контролируемые инструкции
      desc: 'Доработка строго регулируется утверждёнными стандартными инструкциями по доработке (SRI). Не утверждённые изменения на месте, изменение спецификаций или модификация макетов без письменного разрешения категорически запрещены.'
    - icon: 2
      icon_bg: green
      title: Независимый повторный контроль
      desc: 'Доработанные доски проходят повторный контроль 100% силами инспекторов ОКК по исходным критериям приёмки. Для ремонта герметичности требуется полностью новый полный 24-часовой цикл испытания давлением, а не частичная перепроверка.'
    - icon: 3
      icon_bg: purple
      title: Уполномоченная подпись и прослеживаемость
      desc: '''Выпуск отгрузки допускается только после полного оформления документов по NCR и уполномоченной подписи службы качества, при этом статус партии переходит из HOLD в RELEASED. Системные или повторяющиеся отклонения автоматически запускают процессы CAPA по первопричине.'

