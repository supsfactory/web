answer:
  label: 'Прямой ответ'
  text: 'Несоответствующая продукция в QINGDAO VATRAD GROUP.,LTD. никогда не скрывается, не дорабатывается неформально и не выпускается без проверки. Каждое выявленное несоответствие регистрируется в отношении затронутого изделия, партии или компонента и связывается с NCR. Изделие маркируется (HOLD / QUARANTINE / REJECTED), физически отделяется, а затронутый объём оценивается по партии, партии материала, этапу процесса и ревизии документа. Решение принимается на уровне полномочий, соответствующем критичности дефекта: незначительные вопросы подписываются на уровне линии, существенные требуют решения руководителя ОКК и инженера-технолога с контролируемой инструкцией по доработке и независимым повторным контролем 100%, а критические требуют решения совета по анализу материалов и письменного разрешения заказчика там, где это необходимо, — в противном случае обязательное уничтожение с наблюдением. Доработанные изделия проходят повторный контроль по исходным критериям приёмки, ремонту герметичности назначается полностью новый цикл испытаний давлением, а выпуск отгрузки происходит только после разрешающей подписи службы качества. Повторяющиеся или системные проблемы запускают корректирующее действие по первопричине (CAPA).'
  verified: 'Сентябрь 2026'

