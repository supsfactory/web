faqs:
  tagline: FAQ
  title: Часто задаваемые вопросы о качестве и контроле дефектов для закупщиков со всего мира
  items:
    - q: 'Как вы гарантируете, что доработанные доски отвечают полным стандартам безопасности?'
      a: 'Любая доработанная доска считается новой единицей и должна пройти точно такой же полный цикл испытаний с нуля, а при ремонте герметичности — полный 24-часовой тест давлением. Разрешающую проверку выполняют независимые инспекторы ОКК, а не операторы доработки.'
    - q: 'Будет ли завод отгружать доски с незначительными отклонениями внешнего вида, не сообщив нам?'
      a: 'Никогда. Любое отклонение, затрагивающее утверждённые заказчиком эталонные образцы, макеты логотипа, цветовые варианты или упаковку, требует официального письменного соглашения об отступлении, подписанного клиентом до выпуска отгрузки.'
    - q: 'Что происходит, если доработанная доска не проходит повторный контроль?'
      a: 'Доска не выпускается. Она возвращается на новое рассмотрение, и если привести её в соответствие невозможно, она заменяется, отклоняется или уничтожается по протоколу списания с наблюдением. Повторный брак одного и того же класса дефектов запускает CAPA по первопричине.'
    - q: 'Могут ли бракованные доски продаваться как изделия второй категории или через другие каналы?'
      a: 'Нет. Не поддающиеся доработке изделия, не соответствующие спецификации, физически уничтожаются по протоколу списания с наблюдением: фурнитура срезается, сердцевина и борта разрезаются, видео фиксируется с хешем SHA-256 и хранится не менее 5 лет. Акт о списании и уничтожении подписывают директор по качеству и директор завода.'
    - q: 'Как оценивается затронутый объём при обнаружении дефекта?'
      a: 'Объём пересматривается по идентификатору изделия, производственной партии, партии материала или компонента, этапу процесса и применимой ревизии документа. Если задействованы та же партия материала, ревизия макетов или рабочее место, затронутая продукция локализуется и проверяется соответствующим образом.'
    - q: 'Требуется ли ваше одобрение до предоставления отступления?'
      a: 'Да. Любое принятие в рамках документированного отступления, затрагивающего требования заказчика, будь то утверждённые образцы, спецификация, макеты, упаковка или критерии приёмки, требует письменного одобрения заказчика до выпуска. Без него изделие дорабатывается по исходному требованию, заменяется или отклоняется.'
    - q: 'Какую документацию мы получаем при несоответствии?'
      a: 'Документ NCR включает номер NCR, этап обнаружения, изделие или артикул, партию, применимые ревизии документов, описание дефекта, меры по локализации, принятое решение, ссылку на инструкцию по доработке, результат повторного контроля и одобрение выпуска или закрытия — в объёме, предусмотренном вашим соглашением о качестве проекта.'

