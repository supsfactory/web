nc_severity:
  tagline: Критичность дефекта и полномочия
  title: Классификация по критичности и полномочия по принятию решений
  subtitle: Не каждое несоответствие обрабатывается на одном уровне — полномочия по решению растут вместе с критичностью дефекта, от подписи на уровне линии до совета по анализу материалов и разрешения заказчика.
  headers:
    severity: Критичность
    examples: Типичные примеры
    authority: Полномочия по решению и контроль
    control: Условие выпуска
  rows:
    - severity: 'Незначительная'
      examples: 'Замятие угла короба, небольшое некритичное смещение аксессуара'
      authority: 'Подпись на месте ведущим инженером участка ОКК и руководителем линии, замена или выпуск'
      control: 'Регистрируется в NCR; не влияет на функционирование изделия и требования заказчика'
    - severity: 'Существенная'
      examples: 'Медленная протечка клапана, смещение EVA за пределами допуска (>2 mm), отсутствующий аксессуар'
      authority: 'Руководитель ОКК и инженер-технолог выпускают контролируемую инструкцию по доработке (SRI)'
      control: 'Независимый повторный контроль 100% исходной несоответствующей и затронутых характеристик до выпуска'
    - severity: 'Критическая'
      examples: 'Повреждение камеры drop-stitch, пузырь или трещина в усилителе борта под высоким давлением, ошибка печати логотипа заказчика или отклонение цвета'
      authority: 'Решение совета по анализу материалов (MRB); письменное разрешение заказчика там, где это требуется'
      control: '''Выпуск без уполномоченного разрешения невозможен; в противном случае обязательное физическое уничтожение с наблюдением'

nc_matrix:
  tagline: Матрица инженерных протоколов
  title: Матрица решений по дефектам SUP и повторного контроля
  subtitle: 'Стандартные инженерные протоколы, применяемые к наиболее частым производственным отклонениям, — те же количественные параметры, которые заказчики могут проверить во время аудита.'
  headers:
    defect: Категория дефекта
    protocol: Контролируемый протокол принятия решения
    validation: Независимый повторный контроль и валидация
  rows:
    - defect: 'Медленная протечка клапана'
      protocol: 'Изолировать доску. Разобрать сердцевину клапана откалиброванным моментным инструментом (25 N·m), очистить внутреннюю резьбу, заменить силиконовое уплотнительное кольцо и затянуть с моментом затяжки.'
      validation: 'Погружение в раствор с пузырьками; повторное накачивание до 18 PSI и полный 24-часовой контроль падения давления (ΔP ≤ 0.05 PSI).'
    - defect: 'Пузыри в шве усилителя борта'
      protocol: 'Поместить партию за смену на карантин. Расслоить зону пузырей соплом с подогревом, очистить поверхность растворителем, нанести двухкомпонентный клей PU под давлением 5 bar.'
      validation: 'Визуальный и тактильный контроль шва 100%; конструктивное испытание на пробное давление (18.0 PSI) плюс 24-часовая выдержка герметичности.'
    - defect: 'Смещение накладки EVA'
      protocol: 'Снять с подогревом инструментом с регулируемой температурой (80°C). Повторно выровнять с помощью прецизионного акрилового позиционирующего шаблона.'
      validation: 'Проверка зазоров (≤ ±1.5 mm), проверка симметрии ромбовидного рисунка, испытание адгезии кромки 100%.'
    - defect: 'Ошибка в брендинге или логотипе'
      protocol: 'Немедленно остановить линию печати. Удержать все напечатанные панели. Согласовать ревизию вектора с клиентом; никаких не утверждённых изменений.'
      validation: 'Цветовая проверка спектрофотометром (ΔE ≤ 1.5); проверка выравнивания текста 100% по подписанному клиентом векторному мастеру PDF.'
    - defect: 'Несоответствие упаковки / отсутствие артикула'
      protocol: 'Поместить экспортный поддон на карантин. Распаковать и выполнить поимённую проверку спецификации 100% (насос, плавник, шнур, весло, ремонтная трубка).'
      validation: 'Динамическая электронная валидация контрольного веса при движении (±30 g); проверка оптическим 2D-сканером штрихкодов.'

nc_scrap:
  tagline: Нулевая утечка на рынок
  title: Списание и уничтожение с наблюдением — протокол противодействия утечке брака
  body: |
    Зарубежным бренд-партнёрам необходима уверенность в том, что бракованные доски никогда не попадут на вторичную розницу, серые рынки или каналы электронной коммерции. Доски, которые невозможно привести в соответствие, уничтожаются по протоколу с наблюдением и фиксацией:

    **1. Срезание фурнитуры и аксессуаров.** Под руководством директора по качеству гидравлические ножницы срезают все D-кольца из нержавеющей стали 316, стропы переносных ручек и пряжки сумок. Узел воздушного клапана и основание крепления для плавника (US-Box / плавник на защёлках) вырезаются у корня доски, что исключает любые пригодные для повторного использования компоненты.

    **2. Продольная и поперечная распилка сердцевины Drop-stitch.** Внутренняя сердцевина drop-stitch прорезается поперёк доски и палубы глубокими крест-накрест надрезами (≥ 50 cm на рез), а усиленные боковые борта разрезаются как минимум на 4 фрагмента — это навсегда разрушает герметизирующие свойства и плавучесть.

    **3. Видео- и фотоархив.** Уничтожение фиксируется видеозаписью в формате 1080p без монтажных склеек с крупными планами серийного штрихкода, процесса срезания, распилки сердцевины и итоговой взвешенной кучи лома. Видео хешируется (SHA-256) и хранится на контролируемом сервере ≥ 5 лет.

    **4. Сертифицированная утилизация отходов.** Все фрагменты PVC и drop-stich взвешиваются, регистрируются в журнале исходящих отходов и вывозятся исключительно квалифицированными партнёрами по переработке полимеров — никакие остатки не покидают площадку через другие каналы.

    > **Гарантия защиты бренда:** QINGDAO VATRAD GROUP CO., LTD. гарантирует 100% уничтожение не поддающихся доработке плавсредств, не соответствующих спецификации. Никакие заводские изделия второй категории или скомпрометированные доски никогда не попадут на вторичную розницу, серые рынки или каналы электронной коммерции. Акт о списании и уничтожении (VAT-QA-SCRAP-CERT-2026) фиксирует изделие, партию, заключение MRB, фотографии наблюдения и двойную подпись директора по качеству и директора завода.

