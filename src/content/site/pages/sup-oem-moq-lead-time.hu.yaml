answer:
  label: 'Közvetlen válasz'
  text: 'Az MOQ és a szállítási határidő projektspecifikus, de a keretrendszer rögzített. Minden testreszabott SUP-projekt ugyanazokon a lépcsőzetes szakaszokon megy keresztül: mintafejlesztés (1–2 deszka, készen 7–12 nap alatt), próba- és pilóta megrendelések (20–50 deszka) és standard tömeggyártások (90–100+ deszka 150 m-es drop-stitch tekercsenként). A gyártási határidő a megrendelés és az előleg megerősítésétől számított 25–35 nap; ha a projekthez teljesen testreszabott héjra van szükség, a szerszámfejlesztés további 15–20 napot tesz hozzá a gyártás megkezdése előtt. Egy tipikus első projekt tehát így néz ki: minták kb. 1–2 hét alatt, pilóta deszkák 4–6 hét alatt, és az első teljes gyártás a megrendelés megerősítése után kb. 6–8 héten belül kerül feladásra.'
  verified: '2026. szeptember'

moq_lead_table:
  tagline: 'A referencia-keretrendszer'
  title: 'A testreszabott SUP MOQ-szintjei és szállítási határideje röviden'
  subtitle: 'Minden szakasz validálja a következőt. Soha ne ugorjon közvetlenül a rajztól a konténerig – erősítse meg a héjat, a grafikát és a csomagolást minden szinten, mielőtt több deszkába kötelezi magát.'
  headers:
    stage: Megrendelési szakasz
    quantity: Tipikus mennyiség
    lead_time: Szállítási határidő
    best_for: Ideális ehhez
  rows:
    - stage: 'Mintafejlesztés'
      quantity: '1–2 deszka'
      lead_time: '7–12 nap'
      best_for: 'A héj merevségének, az EVA futófelület textúrájának, a grafika pontosságának és a tartozékszerelésnek a validálása. Mintaköltség fizetendő, amelyet a szerződés aláírásakor a gyártási megrendelésből levonunk.'
    - stage: 'Próba- / pilóta megrendelés'
      quantity: '20–50 deszka'
      lead_time: '25–35 nap'
      best_for: 'Kereskedelmi tesztelés a szezon előtt, piaci validálás és az első eladások, meglévő héjplatformok, raktáron lévő anyagok és egyszerűsített csomagolás felhasználásával.'
    - stage: 'Standard tömeggyártás'
      quantity: '90–100+ deszka 150 m-es tekercsenként'
      lead_time: '25–35 nap'
      best_for: 'Maximális gyártási hatékonyság teljes, 150 m-es anyagtekercseken – anyagillesztések nélkül, egyenletes szálfeszességgel és a sor beállítási költségeinek amortizálásával. A testreszabott szerszámú formák ezen a szinten futnak.'
    - stage: 'Nagyszabású program'
      quantity: '300+ deszka'
      lead_time: '25–35 nap tételenként, ütemezett szállításokkal'
      best_for: 'Konténerméretű programok és szezonális flották, több gyártási tételre ütemezve, így a raktár és a pénzáram kezelhető marad.'

moq_drivers:
  tagline: 'Mi határozza meg az Ön MOQ-ját'
  title: 'Az a hat tényező, amely a minimális mennyiséget meghatározza'
  subtitle: 'Az MOQ nem egy véletlenszerűen kiválasztott szám. A teljes termékarchitektúrából számítjuk – ezeket az összetevőket együtt értékeljük az ajánlattétel előtt.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: H
      icon_bg: blue
      title: 'Héjforma és szerszám'
      desc: 'A gyár meglévő szerszámai 20 deszkától induló pilóta megrendeléseket tesznek lehetővé. A teljesen testreszabott héjhoz dedikált CAD-vágási sablonokra és EVA melegprés-szerszámra van szükség, a szerszámfejlesztés pedig 15–20 napot tesz hozzá az ütemezéshez.'
    - icon: C
      icon_bg: green
      title: 'Szín- és PVC-változatok'
      desc: 'A raktáron lévő standard színek pilóta mennyiségben futnak, míg a saját, Pantone színűre festett PVC-lemezek dedikált kémiai festési sorokat igényelnek, saját alapanyag-minimumokkal.'
    - icon: A
      icon_bg: purple
      title: 'Grafika és nyomtatási felület'
      desc: 'Egy orrcsúcsra nyomtatott logó sablonon kis sorozatban is nyomtatható, míg a teljes felületű vagy többpaneles grafika digitális nyomtatási lemezelőkészítést és bevonatpróbákat igényel, ami megnöveli a gyakorlati tételnagyságot.'
    - icon: B
      icon_bg: orange
      title: 'Márkás csomagolás'
      desc: 'A testreszabott, 5 rétegű kiskereskedelmi dobozoknak önálló minimumuk van az offset nyomtatón. Kevesebb dobozt rendel, mi pedig raktáron tartjuk a felesleget, és az ütemezett szállítások során adjuk ki.'
    - icon: G
      icon_bg: blue
      title: 'Tartozékcsomagok'
      desc: 'A standard alumínium vagy nylon evezőlapátok, szivattyúk és zsákok a beszállítók alszintjei szerint futnak. A saját márkás szénrost evezőlapátoknak és testreszabott szivattyúknak saját gyártási minimumaik vannak.'
    - icon: S
      icon_bg: green
      title: 'Szezon és fizetési ütemezés'
      desc: 'A szezon előtti ablakban leadott megrendelések megerősített gyártási időpontokat kapnak. A 300+ deszkás ütemezett szállítási programok a szerződés aláírásakor kerülnek megerősítésre, nem a gyártás után.'

moq_timeline:
  tagline: 'Teljes ütemterv'
  title: 'A termékbrieftől a feladott deszkákig: napról napra'
  subtitle: 'A teljes ütemezés egy tipikus testreszabott SUP-programhoz. A meglévő héjplatformok az ütemterv bal oldalán tömörülnek; a teljesen testreszabott héj hozzáadja a szerszámfejlesztési szakaszt.'
  steps:
    - step: '0. nap'
      title: 'Küldje el a termékbriefet'
      desc: 'A deszka modellje, a célmennyiség, a színváltozatok, a grafika és a csomagolási követelmények. A mérnöki elemzés egy munkanapon belül elkészül.'
    - step: '1–2. nap'
      title: 'Mérnöki és megvalósíthatósági elemzés'
      desc: 'Mérnöki csapatunk ellenőrzi a héj geometriáját, az anyagokat és a megfelelőségi útvonalat, és megerősíti, hogy a projekt illeszkedik-e a meglévő platformokba vagy új szerszámokat igényel.'
    - step: '3–7. nap'
      title: 'Részletes specifikáció és ajánlat'
      desc: 'Megkapja a teljes specifikációt, az MOQ-számítással, a szállítási határidő-szegmensekkel és a lebontott költségekkel – beleértve az esetleges szerszámdíjakat is –, minden kötelezettségvállalás előtt.'
    - step: '7–12. nap'
      title: 'Mintafejlesztés (1–2 deszka)'
      desc: 'A fizikai minta elkészül és tesztelésre kerül: héj merevsége, EVA futófelület textúrája, grafika pontossága és tartozékszerelés. A minták költségét a gyártási megrendelésből, az aláíráskor vonjuk le.'
    - step: '+15–20 nap'
      title: 'Testreszabott szerszámfejlesztés (csak egyedi héjak)'
      desc: 'Csak az új héjformájú projekteknél: CNC-vágási sablonok, EVA melegprés-szerszám és a szerszámpróbák a tömeggyártás megkezdése előtt készülnek el.'
    - step: '25–35 nap'
      title: 'Gyártás a megrendelés és az előleg megerősítése után'
      desc: 'Teljes, 150 m-es anyagtekercsek, Pantone anyagok, márkás csomagolás és összeszerelés 100 ponton. Minden deszka átmegy a 24 órás nyomás- és légzárási próbán.'
    - step: '300+ deszka'
      title: 'Ütemezett szállítások programozása'
      desc: 'A nagy programok ütemezett tételekben kerülnek feladásra, hogy a szezonális eladásokhoz, a raktárkapacitáshoz és a fizetési ütemezésekhez illeszkedjenek.'
    - step: '0–90. nap'
      title: 'Az első megrendelés tipikus távlata'
      desc: 'A brieftől az első leszállított gyártásig: kb. 6–8 hét meglévő platformokkal, 8–12 hét, ha testreszabott szerszámot is tartalmaz. A többtekercses és konténerméretű programok tervezéssel túllépik ezt az intervallumot.'

