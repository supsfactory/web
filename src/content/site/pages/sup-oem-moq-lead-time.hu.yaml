      desc: 'A tételgyártás bármely szakaszban készen áll a független ellenőrzésre. A legtöbb ügyfél a tömeges programokon a 7 lépésből álló ellenőrzési rendszerünket vagy szállítás előtti ellenőrzést is alkalmaz.'

moq_faqs:
  tagline: GYIK
  title: 'Gyakori kérdések az MOQ-ról és a szállítási határidőről'
  items:
    - q: 'Mi a minimális megrendelési mennyiség egy testreszabott SUP-hoz?'
      a: 'A projekt szakaszától függ: a minták 1–2 deszka, a kis mennyiségű co-branding 5–10 darabtól indul, a próba- és pilóta megrendelések 20–50 deszkát tesznek ki, a standard tömeggyártás pedig modellenként 90–100+ deszkát gyárt 150 m-es drop-stitch tekercsenként. A testreszabott szerszámú formák a volumszinten futnak. A pontos számítást az Ön konfigurációjára az ajánlattétel előtt megerősítjük.'
    - q: 'Mennyi idő alatt készül el egy felfújható SUP-minta?'
      a: 'A mintafejlesztés 7–12 napot vesz igénybe. A minta ellenőrzi a héj merevségét, az EVA futófelület textúráját, a grafika pontosságát és a tartozékszerelést. Mintaköltség fizetendő, amelyet a szerződés aláírásakor a gyártási megrendelésből levonunk.'
    - q: 'Mennyi ideig tart a gyártás a megrendelés megerősítése után?'
      a: 'A gyártási határidő a megrendelés és az előleg megerősítésétől számított 25–35 nap. Ha a projekt teljesen testreszabott héjat tartalmaz, a szerszámfejlesztés további 15–20 nap szerszámmunkát tesz hozzá a gyártás megkezdése előtt.'
    - q: 'Az MOQ-t megrendelésenként, modellenként vagy színváltozatonként számítják?'
      a: 'Az MOQ vonatkozhat modellenként, színváltozatonként, grafikai változatonként, csomagolási konfigurációnként vagy a teljes megrendelésre. Mivel a különböző drop-stitch vastagságok és PVC-színek külön alapanyagtekercsekből származnak, az 50 deszka 5 színre elosztva 5 külön anyagtekercs-követelményt eredményez. A számítást az Ön SKU-mátrixára megerősítjük.'
    - q: 'Kezdhetem-e csak 1–2 deszkával a piac tesztelésére?'
      a: 'Igen. Az 1–2 deszkás mintarendelés a legolcsóbb lehetséges validálás: a héj merevsége, a grafika és a tartozékszerelés minden gyártási pénzügyi kötelezettségvállalás előtt megerősítésre kerül. Onnan 20–50 deszkás próbarendeléssel haladhat a kereskedelmi validálás felé.'
    - q: 'Lehet-e egy 300+ deszkás programot több tételben szállítani?'
      a: 'Igen. A nagyszabású programok több gyártási tételre ütemezett, eltolt szállításokként tervezhetők, így a szezonális flották akkor érkeznek, amikor szükséges, a pénzáram és a raktárhely kezelhető marad. A programok a szerződésben kerülnek megerősítésre, nem a gyártás után.'

evidence_review:
  tagline: 'Bizonyítékok és ellenőrzés'
