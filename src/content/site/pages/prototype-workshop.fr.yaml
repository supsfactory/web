answer:
  label: 'Réponse directe'
  text: 'Nous transformons un modèle CAO en planche d''échantillon navigable et testée en 7–12 jours : prototypage gonflable, essais sur vagues d''eau, itérations de rail et de nez, puis engagement de l''outillage de production. Les moules complets sur mesure prennent 15–20 jours d''outillage en plus du délai standard de 25–35 jours pour le volume.'
  verified: '2026-08'

