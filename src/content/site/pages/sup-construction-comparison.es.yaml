      href: /odm-development

key_factors:
  heading: 'Factores Clave Más Allá del Tipo de Construcción'
  body: |
    El tipo de construcción es una variable en el rendimiento de la tabla. Tres factores adicionales importan tanto o más:

    - **Densidad drop-stitch** — Los hilos por pulgada determinan qué tan uniformemente la tabla mantiene su forma bajo presión. Usamos 96 hilos/pulgada estándar y 140 hilos/pulgada para construcciones de rendimiento. Mayor densidad = tabla más plana = mejor deslizamiento.
    - **Grado y espesor del PVC** — No todo el PVC es igual. El PVC de 0.7 mm importado de Corea tiene mayor resistencia al desgarro y resistencia UV que alternativas más delgadas. Especificamos el grado de material por proyecto.
    - **Construcción de cantos** — Los cantos monocapa son el punto de falla más común en tablas baratas. La cinta de canto bicapa y reforzada reduce drásticamente el riesgo de perforación del canto. Todas nuestras tablas usan cantos reforzados independientemente del nivel de construcción.

faqs:
  tagline: Preguntas Frecuentes
  title: 'Construcción de SUP — Preguntas Frecuentes'
  items:
    - q: '¿Qué tipo de construcción debo elegir para mi marca?'
      a: 'Depende de su mercado objetivo y posicionamiento de precio. Nivel de entrada y grandes superficies: monocapa. Flotas de alquiler, clubes y marcas de gama media: bicapa. Rendimiento, travesía y premium: núcleo drop-stitch. La mayoría de las marcas comienzan con bicapa como el mejor equilibrio de costo, durabilidad y experiencia del jinete. Recomendamos según su mercado específico durante la revisión de viabilidad.'
    - q: '¿Puedo ofrecer múltiples niveles de construcción bajo una misma marca?'
      a: 'Sí — muchas marcas ofrecen dos o tres niveles. Producimos las tres construcciones en la misma línea con las mismas puertas de control de calidad, por lo que puede mezclar tipos de construcción dentro de un solo pedido. La forma del casco y los gráficos pueden ser idénticos entre niveles; solo cambian la construcción y los materiales.'
    - q: '¿Cuál es el estándar de prueba de presión para todas las construcciones?'
      a: 'Cada tabla, independientemente del tipo de construcción, supera una prueba de retención de 18.0 PSI con rechazo automático por encima de 0.50 PSI de caída de presión en 24 horas. Las tablas monocapa están clasificadas para presión de uso de 12–15 PSI, bicapa para 15–18 PSI, y núcleo drop-stitch para 18–25 PSI. La presión de prueba supera la presión nominal para todos los tipos.'
    - q: '¿Cómo afecta la construcción a las reclamaciones de garantía?'
      a: 'Las tablas monocapa tienen tasas de reclamación de garantía marginalmente más altas en uso comercial/alquiler debido a la exposición de cantos y perforaciones. Las construcciones bicapa y núcleo drop-stitch tienen tasas de reclamación significativamente más bajas. Proporcionamos datos de garantía por nivel de nuestros registros de producción durante la fase de cotización.'

