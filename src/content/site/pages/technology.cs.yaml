meta:
  title: 'Technologie — Drop Stitch a námořní PVC | {SITE}'
  description: 'Technologie Vatrad: konstrukce drop stitch, námořní PVC, dvojvrstvé sestavy a vysoký tlak. Inovace od profesionálního výrobce nafukovacích SUP desek.'
  dateModified: '2026-08'
  keywords:
    - 'technologie sup'
    - 'konstrukce drop stitch'
    - 'sup s vysokým tlakem'
