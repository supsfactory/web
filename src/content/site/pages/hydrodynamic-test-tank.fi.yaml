  text: 'Testaamme SUP-lautojen runkomuotoja 1:3–1:5-mittakaavassa — kärkiprofiili, kylkilinjan säde, kaarevuus ja kastunut pinta — ja mittaamme vastuksen, liu’tehokkuuden ja vakautteen ennen kuin sitoudumme täysikokoiseen prototyyppiin. Viikko altaalla tuottaa samat suorituskykytiedot, joissa kestäisi kuukausia täysikokoisella kokeilulla ja virheiden kautta.'
