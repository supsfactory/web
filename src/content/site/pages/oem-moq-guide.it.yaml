moq_stages:
  tagline: 'Campione · Pilota · Volume'
  title: 'Tre livelli di quantità ben distinti'
  subtitle: 'Le quantità di produzione per campione, pilota e volume sono diverse. Ogni progetto è suddiviso in tre fasi separate, così puoi validare prima di impegnarti.'
  steps:
    - step: '01'
      title: 'Sviluppo del campione (1–2 unità)'
      desc: 'Conferma fisica di rigidità dello scafo, aderenza del tappetino antiscivolo EVA, precisione della grafica e vestibilità degli accessori prima di qualsiasi impegno finanziario. Le tariffe dei campioni si applicano e vengono accreditate sull''ordine di produzione dopo la firma del contratto.'
    - step: '02'
      title: 'Ordine pilota (20–50 unità)'
      desc: 'Test commerciali pre-stagione e validazione del mercato regionale con piattaforme di scafo esistenti, materiali standard e imballaggio semplificato, per ridurre al minimo gli sforzi di attrezzaggio.'
    - step: '03'
      title: 'Produzione in quantità (90–100+ unità)'
      desc: 'Confermata dopo BOM congelato, artwork finalizzato, imballaggio personalizzato e date di consegna pianificate — bobine complete da 150 m, tessuti Pantone personalizzati, imballaggio su misura, sconti sul volume e tracciabilità completa dei lotti lungo tutta la filiera.'

moq_factors:
  tagline: Cosa determina il tuo MOQ
  title: 'Perché il MOQ completamente personalizzato è sempre specifico del progetto'
  subtitle: 'Per la produzione al 100% su misura, il MOQ viene calcolato dall''intera architettura di prodotto — queste quattro componenti vengono valutate insieme prima dell''offerta.'
  headers:
    component: Componente del progetto
    driver: Driver di produzione
    impact: Impatto sulla quantità minima
  rows:
    - component: 'Forma dello scafo e attrezzatura'
      driver: 'Forme rocker di fabbrica esistenti vs. strumenti di taglio CAD personalizzati e attrezzature di pressa a caldo EVA'
      impact: 'Piattaforme esistenti: ordini pilota da 20 pezzi. Scafi dedicati: necessaria l''ammortizzazione dell''attrezzatura dedicata.'
    - component: 'Varianti di colore e PVC'
      driver: 'Singoli colori standard di magazzino vs. teli PVC tinti Pantone proprietari'
      impact: 'Il PVC Pantone personalizzato richiede run di tintura chimica dedicati con quantità minime di materia prima proprie.'
    - component: 'Imballaggio brandizzato'
      driver: 'Scatole standard con adesivi codice a barre vs. box regalo commerciali a 5 strati a colori e manuali brandizzati'
      impact: 'Le scatole colorate personalizzate hanno un proprio volume minimo di stampa offset (di solito 500+ scatole).'
    - component: 'Pacchetti di accessori'
      driver: 'Pagaie in alluminio o nylon standard vs. pagaie in carbonio abbinate su misura e pompe brandizzate'
      impact: 'Gli accessori completamente brandizzati seguono i lotti di produzione dei sub-fornitori.'

