hero:
  tagline: 'Trasparente e basato sul progetto'
  title: 'Guida al branding flessibile e al MOQ di produzione'
  subtitle: 'Comprendi la fisica del materiale grezzo drop-stitch che governa i run di produzione SUP — e come funziona il nostro programma di co-branding a bassa soglia d''ingresso per noleggiatori, club, resort e marchi di sport acquatici in crescita. Progettato e gestito dalla Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Risposta breve'
  text: 'Il MOQ non è una taglia unica. Ogni MOQ viene confermato in base al progetto: forma dello scafo e attrezzatura, varianti di colore e PVC, complessità dell''artwork, imballaggio e mix di accessori. La produzione completa in quantità standard gira con 90–100 unità per lotto da una bobina standard di tessuto drop-stitch da 150 m; il co-branding per piccoli lotti parte da 5–10 unità; e ogni progetto si articola in tre fasi ben distinte — sviluppo del campione (1–2 unità), ordine pilota (20–50 unità) e produzione in quantità (90–100+ unità). Confermiamo il calcolo esatto per il tuo mix SKU prima dell''offerta — niente vaghe promesse di "MOQ basso", nessun compromesso nascosto.'
  verified: 'Settembre 2026'

moq_principle:
  tagline: La logica tecnica
  title: 'Perché il MOQ standard è di 90–100 unità: la fisica delle bobine di materiale grezzo'
  subtitle: 'Le dimensioni dei lotti di produzione non sono numeri arbitrari inventati dall''ufficio vendite — derivano dalle lunghezze delle bobine del tessuto grezzo drop-stitch e dalla fisica dei cambi di linea.'
  body: |
    **La linea di base del tessuto grezzo da 150 metri.** Il tessuto drop-stitch intrecciato ad alta resistenza viene prodotto e rivestito su bobine madri continue. La lunghezza standard del troncone industriale per un singolo lotto è di 150 metri di materiale continuo.

    **Il calcolo della resa (da 90 a 100 tavole).** Con uno scafo SUP Touring o Allround standard (da 10 ft 6 in a 11 ft 6 in), 150 m di bobina madre producono circa 90-100 paddle board finite.

    **Zero giunzioni di tessuto.** Le bobine complete garantiscono una continuità strutturale totale — nessuna giunzione trasversale rischiosa del tessuto e tensione uniforme delle fibre su parte superiore e inferiore della tavola.

    **Calibrazione termica e degli adesivi.** Le linee automatizzate di saldatura ad aria calda ad alta frequenza e di laminazione con adesivi marini richiedono 2 ore di preriscaldamento, profilazione della temperatura e calibrazione della pressione. Un lotto completo di 90–100 unità ammortizza questi costi fissi di attrezzaggio e ottiene così il costo unitario più basso possibile.

