ip_rules:
  tagline: 'Защита интеллектуальной собственности'
  title: 'Как мы защищаем ваш дизайн и бренд'
  subtitle: 'Независимо от модели сотрудничества ваша графика, оснастка и файлы спецификации остаются вашей собственностью.'
  body: |
    **Соглашение о неразглашении до обмена файлами.** Мы подписываем соглашение о неразглашении до любого обмена техническими файлами — стандартный срок ответа — в течение 4 рабочих часов.

    **Никакого повторного использования дизайна.** Ваша графика, оснастка и файлы спецификации никогда не передаются и не продаются другим клиентам. Пресс-формы OEM принадлежат исключительно вам. Дизайны ODM утверждаются вами до производства. Платформы Private Label — это общие конструкции, но ваша графика и брендинг исключительны.

    **Только B2B.** Мы производим исключительно под брендами наших клиентов. Мы не продаём конечным потребителям и не конкурируем с нашими клиентами ни на одном рынке.

    **Право собственности на пресс-форму.** Специальные пресс-формы, оплаченные покупателем, принадлежат покупателю. Мы храним и обслуживаем их, но не можем использовать для других клиентов без письменного разрешения.

faqs:
  tagline: 'FAQ'
  title: 'Частые вопросы об OEM, ODM и Private Label'
  items:
    - q: 'Можно ли позже перейти с private label на OEM?'
      a: 'Да. Многие клиенты начинают с private label или пилотной партии, чтобы проверить рынок, а затем вкладывают средства в специальную оснастку для полноценной программы OEM, когда спрос подтверждён. Оба пути поддерживаются одним и тем же заводом и системой контроля качества.'
    - q: 'Означает ли ODM, что завод владеет моим брендом?'
      a: 'Нет. В рамках ODM бренд, графика и упаковка принадлежат вам. Завод разрабатывает конструкцию доски по вашему брифу, и вы утверждаете дизайн до производства. Завод сохраняет права на процесс разработки, но утверждённая спецификация изделия принадлежит вам.'
    - q: 'Private label хуже по качеству, чем OEM?'
      a: 'Нет. Все три пути проходят через один и тот же завод, одну систему контроля качества и одну экспортную команду. Доски private label изготавливаются на проверенных, подтверждённых платформах с полным испытанием давлением 18 PSI / 24h и тем же чек-листом сборки из 100 пунктов.'
    - q: 'Что делать, если я не уверен, какую модель выбрать?'
      a: 'Свяжитесь с нами и опишите свою ситуацию — наша инженерная команда порекомендует наиболее практичный путь с учётом требований к продукту, сроков и целевых объёмов. Никаких обязательств до ознакомления со спецификацией.'
    - q: 'Можно ли получить образцы до принятия решения по модели?'
      a: 'Да. 1–2 прототипа отгружаются за 7–12 дней. Стоимость образца засчитывается в счёт вашего серийного заказа. Это позволяет оценить конструкцию и качество до любых обязательств по объёму.'

