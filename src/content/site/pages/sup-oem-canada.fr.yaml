why_canada:
  tagline: 'Pourquoi les acheteurs au Canada'
  title: 'Conçu pour les importations canadiennes'
  subtitle: 'L''usine répond aux questions que se posent les marques et détaillants canadiens avant leur premier conteneur.'
  items:
    - title: 'DDP pour un coût rendu prévisible'
      description: 'Le DDP inclut le dédouanement et la livraison à votre entrepôt — droits, taxes et fret dans un total, en CAD ou USD. Le choix le plus populaire pour les importateurs débutants.'
    - title: 'Routage côte est et côte ouest'
      description: 'Nous tarifons le fret maritime vers Vancouver ou vers Toronto et Montréal via la route de Suez — selon ce qui équilibre votre temps de transit et votre coût rendu.'
    - title: 'Fichiers produit prêts bilingues'
      description: 'La documentation CE, REACH et douane est préparée pour vos marchés cibles, donc votre fichier produit répond aux exigences d''emballage en anglais et en français.'
    - title: 'Une usine, un système qualité'
      description: 'Le développement, l''échantillonnage, la production et le contrôle qualité ont tous lieu dans l''usine de 12 500 m² — pas d''allers-retours par courtier, pas d''échantillons que la production ne peut pas reproduire.'

process_notes:
  tagline: 'Comment ça marche'
  title: 'De la spéc. au conteneur'
  subtitle: 'Les mêmes six étapes que vous achetiez deux conteneurs ou vingt par an : spécification, ingénierie, échantillonnage, tests, outillage, production — puis livraison FOB, CIF ou DDP.'
  items:
    - title: '1. Envoyez votre spéc.'
      description: 'Une planche de référence, un croquis ou une spécification concurrent suffisent. La revue d''ingénierie et un devis reviennent sous un jour ouvré.'
    - title: '2. Approuvez l''échantillon'
      description: 'Votre premier échantillon physique part en 7–12 jours avec une fiche d''approbation couvrant la construction, les couleurs d''impression et les résultats de test de pression.'
    - title: '3. Production & export'
      description: 'Les séries se terminent en 25–35 jours avec des points de contrôle QC en cours de processus. La liste de colisage, la facture et le connaissement partent avant le navire.'
    - title: '4. Livraison à votre entrepôt'
      description: '4–6 semaines de fret maritime vers Vancouver, Toronto ou Montréal — en DDP, nous gérons le dédouanement et la livraison à votre porte.'

faq_section:
  tagline: FAQ
  title: 'Questions d''importation canadienne'
  questions:
    - q: 'Combien de temps le fret maritime prend-il vers le Canada ?'
      a: 'Prévoir 4–6 semaines du port de Qingdao vers les ports canadiens — Vancouver sur la côte ouest, Toronto et Montréal à l''est — selon la destination et les rotations. Les projets DDP incluent le calendrier complet porte-à-porte.'
    - q: 'Expédiez-vous en DDP vers le Canada ?'
      a: 'Oui. Le DDP inclut le fret maritime, le dédouanement, les droits et taxes, et la livraison à votre entrepôt — un prix total prévisible. Le FOB Qingdao et le CIF sont également disponibles.'
    - q: 'Quel est le MOQ pour un import de SUP en marque privée ?'
      a: 'Le MOQ est confirmé par la configuration du projet : le développement d''échantillon couvre 1–2 pcs, les lots pilotes s''exécutent à 20–50 pcs sur les plateformes existantes, et la production standard en volume s''exécute à 90–100+ pcs par design à partir d''un rouleau complet de drop-stitch de 150 m.'
    - q: 'Prenez-vous en charge l''emballage en anglais et en français ?'
      a: 'Oui. Notre équipe de prépresse prépare les données d''impression pour les langues et réglementations de vos marchés cibles — y compris un emballage bilingue EN/FR pour le marché canadien.'
    - q: 'Puis-je visiter l''usine avant de commander ?'
      a: 'Oui. L''usine de 12 500 m² de Qingdao est ouverte aux clients — des visites virtuelles peuvent être organisées en ligne, et des visites sur place guidées à travers les lignes de production et les postes QC.'
    - q: 'Comment démarrer un projet depuis le Canada ?'
      a: 'Envoyez une planche de référence, un croquis ou une spécification. La revue d''ingénierie et le devis reviennent sous un jour ouvré, et un NDA est signé avant tout échange de fichier.'

