  title: 'SUP gonflable OEM pour le Canada — de Qingdao à votre entrepôt'
  subtitle: 'Échantillon en 7–12 jours, production en 25–35 jours, fret maritime 4–6 semaines vers les ports de Vancouver, Toronto ou Montréal. FOB Qingdao, CIF ou DDP — la même usine, le même QC, le même processus de développement en six étapes que tous les clients SUPsfactory.'

answer:
  label: 'Réponse directe'
  text: 'Les marques canadiennes commandent des SUP gonflables à SUPsfactory selon des conditions standard : le MOQ est confirmé par la configuration du projet : des séries d''échantillons de 1–2 pcs valident la fabrication, des lots pilotes de 20–50 pcs testent le marché sur les plateformes existantes, et la production standard en volume s''exécute à 90–100+ pcs par design à partir d''un rouleau complet de drop-stitch de 150 m. Le premier échantillon part en 7–12 jours après approbation de la spéc., la production s''exécute en 25–35 jours après bon de commande confirmé et acompte, et le fret maritime ajoute 4–6 semaines vers les ports canadiens — Vancouver sur la côte ouest, Toronto et Montréal à l''est. Le DDP couvre le dédouanement et la livraison à votre entrepôt.'
  verified: '2026-08'

