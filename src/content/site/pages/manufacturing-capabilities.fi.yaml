faq_section:
  tagline: FAQ
  title: SUP-valmistusominaisuuksia koskevat kysymykset
  questions:
    - q: Mitkä valmistusprosessit tehdään omissa tiloissa?
      a: 'Kaikki ydinprosessit tehdään omissa tiloissamme: runkosuunnittelu, drop-stitch-ytimen käsittely, RF-hitsaus, painatus, EVA-stanssaus, kokoonpano, testaus ja pakkaus. Lisävarusteet ja osa raaka-aineista tulevat sertifioiduilta toimittajilta; lopullinen pakkaaminen tehdään omissa tiloissamme täyden jäljitettävyyden varmistamiseksi.'
    - q: Mikä on tuotantokapasiteettinne?
      a: 'Yli 120,000 lautaa vuodessa (noin 10,000 kuukaudessa) 4 automaattisella linjalla ja 4 erikoistuneella osastolla 12,500 m²:n laitoksessa, jossa työskentelee 350+ henkilöä.'
    - q: Mikä vähimmäiseräkoko koskee näitä ominaisuuksia?
      a: 'Vakiintunut volyymierä on 90–100+ kpl hyväksytyn konfiguroation mukaan (yksi 150 m drop-stitch-kangasrulla); pilottierät alkavat 20–50 kpl:stä olemassa olevilla alustoilla; pelkkää logoa sisältävät tilaukset 5–10 kpl:stä.'
    - q: Millaisiin toimitusaikoihin kannattaa varautua?
      a: 'Prototyyppinäytteet 7–12 päivässä; tuotanto 25–35 päivää vahvistetun tilauksen ja käsirahajan jälkeen; räätälöity muotin kehittely lisää 15–20 päivää työkalustukseen.'
    - q: Miten ominaisuudet näkyvät laadussa?
      a: 'Jokainen prosessi syöttää 7-vaiheista laatujärjestelmää: 100 pisteen kokoonpanotarkistuslista, 18.0 PSI:n 24 tunnin paineen pito ja automaattinen hylkäys yli 0.50 PSI:n painehävikin kohdalla, ISO 2859-1:n tason II näytteistys sekä 10 vuoden erien jäljitettävyys ERP:ssä.'

