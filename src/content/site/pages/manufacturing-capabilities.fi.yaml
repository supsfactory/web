hero:
  tagline: Valmistusominaisuudet
  title: 'SUP-valmistusominaisuudet'
  subtitle: 'Jokainen prosessi — runkosuunnittelu, drop-stitch-ytimen käsittely, RF-hitsaus, painatus, muotityökalut, kokoonpano, testaus ja pakkaus — tehdään omissa tiloissamme 12,500 m²:n Qingdaon laitoksessamme, joten yksi vastuullinen tiimi vie projektisi ensimmäisestä piirustuksesta lähetettyyn konttiin.'

answer:
  label: 'Suora vastaus'
  text: 'SUP-valmistus on täysin omissa käsissämme Qingdaon laitoksessamme: runkosuunnittelu ja mittatekniikka 0.1 mm:n CNC-tarkkuudella; drop-stitch-materiaalin käsittely ja RF-hitsaus 4 automaattisella linjalla; kuvituspainatus; EVA-patjan stanssaus; räätälöity muotityökalusto (+15–20 päivää uusille muodoille); kokoonpano 100 pisteen tarkistuslistan mukaisesti; sekä 18.0 PSI:n 24 tunnin paineen pito -testaus ja automaattinen hylkäys yli 0.50 PSI:n painehävikin kohdalla. Vuosikapasiteetti on yli 120,000 lautaa (~10,000/kk) 4 erikoistuneesta osastosta ja 350+ työntekijän voimin, toimitettuna yli 50 maahan sinun brändilläsi.'
  verified: 'Syyskuu 2026'

