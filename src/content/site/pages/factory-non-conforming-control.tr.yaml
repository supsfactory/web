faqs:
  tagline: SSS
  title: 'Küresel Alıcılar İçin Kalite ve Kusur Kontrolü SSS'
  items:
    - q: 'Yeniden işlenen tahtaların eksiksiz güvenlik standartlarını karşıladığını nasıl garanti edersiniz?'
      a: 'Yeniden işlenen her tahta yeni bir birim olarak değerlendirilir ve sıfırdan başlayarak aynı eksiksiz test döngüsünü tamamlamak zorundadır — hava sızdırmazlığı onarımları için eksiksiz 24 saatlik basınç testi. Sevkiyat doğrulamasını, yeniden işleme operatörleri değil, bağımsız QC denetçileri gerçekleştirir.'
    - q: 'Fabrika, hafif kozmetik sapmaları bize söylemeden tahtaları sevk eder mi?'
      a: 'Asla. Müşteri onaylı altın numuneleri, logo görsel sanatını, renk seçeneklerini veya ambalajlamayı etkileyen her sapma, sevkiyat onayından önce müşteri tarafından imzalanan resmi yazılı Feragat Sözleşmesi gerektirir.'
    - q: 'Yeniden işlenen bir tahta yeniden denetimde başarısız olursa ne olur?'
      a: 'Tahta sevk edilmez. Yeni bir karar incelemesine döner ve uygunluğa getirilemiyorsa değiştirilir, reddedilir veya tanıklı hurda protokolüyle imha edilir. Aynı kusur sınıfının tekrarlanan başarısızlığı kök neden CAPA’sını tetikler.'
    - q: 'Başarısız tahtalar fabrika ikinci el ürünü olarak veya başka kanallardan satılabilir mi?'
      a: 'Hayır. Yeniden işlenemeyen şartname dışı tahtalar tanıklı hurda protokolüyle fiziksel olarak imha edilir — donanım kesilir, çekirdek ve raylar bölünür, video SHA-256 hash’i ile kaydedilir ve en az 5 yıl arşivlenir. Hurda ve İmha Sertifikası, QA Direktörü ve Fabrika Müdürü tarafından imzalanır.'
    - q: 'Bir kusur bulunduğunda etkilenen kapsam nasıl değerlendirilir?'
      a: 'Kapsam; ürün tanımı, üretim partisi, malzeme veya bileşen partisi, süreç aşaması ve geçerli belge revizyonu bazında incelenir. Aynı malzeme lotu, görsel sanat revizyonu veya çalışma istasyonu söz konusuysa, etkilenen ürünler içerik altına alınır ve buna göre kontrol edilir.'
    - q: 'Feragat vermeden önce onayımız gerekiyor mu?'
      a: 'Evet. Müşteri gereksinimlerini etkileyen — onaylı numune, şartname, görsel sanat, ambalajlama veya kabul kriterleri — belgelenmiş bir feragat altındaki her kabul, sevkiyat öncesinde yazılı müşteri onayı gerektirir. Onay olmadan ürün özgün gereksinime göre yeniden işlenir, değiştirilir veya reddedilir.'
    - q: 'Bir uyumsuzluk için hangi belgeleri alıyoruz?'
      a: 'NCR kaydı; NCR numarasını, tespit aşamasını, ürün/SKU’yu, partiyi, geçerli belge revizyonlarını, kusur açıklamasını, içerik almayı, kararı, yeniden işleme talimatı referansını, yeniden denetim sonucunu ve sevkiyat veya kapatma onayını kapsar — proje kalite anlaşmanıza uygun olarak sunulur.'
