nc_intro:
  tagline: Uyumsuz Ürünlerin Kontrolü
  title: 'Bir Ürün Kriterleri Karşılamadığında Ne Olur'
  body: |
    Tanımlı kabul kriterlerini karşılamayan ürün veya bileşenler, istenmeyen kullanımı, sonraki işlemi veya sevkiyatı önlemek üzere tespit edilir ve kontrollü biçimde yönetilir. Geçerli kabul kriterleri; onaylı numune, teknik şartname, görsel sanat, malzeme listesi, ambalajlama gereksinimleri ve proje denetim planına dayanır.

    Uyumsuz kalemler, etkilenen kapsamı ve uygun kararı belirlemek üzere değerlendirilir. Soruna bağlı olarak kalem bekletilebilir, kontrollü talimatlarla yeniden işlenebilir, değiştirilebilir, reddedilebilir veya onaylı bir süreçle başka şekilde ele alınabilir. Yeniden işlenen veya düzeltilen kalemler sevkiyat öncesinde yeniden denetlenir. Sevkiyat onayına, ilgili kalite kayıtları tamamlandıktan ve ürün geçerli kabul kriterlerini karşıladıktan sonra izin verilir.

nc_flow:
  tagline: Standart 7 Adımlı Kapalı Döngü
  title: Tespitten Düzeltici Faaliyete
  subtitle: 'Her uyumsuzluk için tek kontrollü döngü: tespit, karantina, inceleme, yeniden işleme veya değiştirme, yeniden denetim, sevkiyat veya ret, iyileştirme.'
  steps:
    - step: '01'
      title: Tespit
      desc: 'Tespit edilen her uyumsuzluk, etkilenen ürün, parti veya bileşene karşı kaydedilir ve geçerli proje gereksinimlerine göre değerlendirilir. Tespit, giriş malzemesinde, süreç içi kontrolde, son testte, ambalajlamada veya müşteri/üçüncü taraf denetiminde gerçekleşebilir.'
    - step: '02'
      title: Karantina
      desc: 'Kalemler net biçimde tanımlanır ve istenmeyen kullanımı, sonraki işlemi veya sevkiyatı önlemek üzere kontrollü bekleme veya karantina durumuna alınır. HOLD / QUARANTINE / REJECTED etiketleri NCR numarasını, SKU’yu, partiyi, adedi, kusur açıklamasını ve tarihi taşır.'
    - step: '03'
      title: İnceleme
      desc: 'Etkilenen kapsam ve uygun karar değerlendirilir: tek birim, vardiya partisi, tam parti veya birden fazla parti — ortak malzeme lotları, görsel sanat revizyonları, süreç aşamaları ve belge revizyonları boyunca. Gerektiğinde ek içerik alma veya sıkılaştırılmış denetim uygulanır.'
    - step: '04'
      title: Yeniden İşleme veya Değiştirme
      desc: 'İzin verilen yeniden işleme, etkilenen kalemi, yöntemi, malzemeleri, kontrol noktalarını ve yeniden denetim gereksinimlerini belirleyen onaylı talimatlara göre yürür. Ürün şartnamesine, görsel sanata, aksesuar yapılandırmasına veya ambalajlamaya onaysız değişiklik asla yapılmaz. Değiştirilen kalemler geçerli denetim kapılarına yeniden girer.'
    - step: '05'
      title: Yeniden Denetim
      desc: 'Yeniden işlenen veya düzeltilen kalemler geçerli kabul kriterlerine karşı yeniden denetlenir. Sevkiyat öncesi; özgün başarısız özellik ve yeniden işlemeden etkilenebilecek ilgili tüm özellikler bağımsız QC tarafından doğrulanır; hava sızdırmazlığı onarımlarında eksiksiz yeni bir 24 saatlik basınç testi döngüsü uygulanır.'
    - step: '06'
      title: Sevkiyat veya Ret
      desc: 'Ürün, yalnızca gerekli yeniden denetim tamamlandıktan ve yetkili kalite personeli uygunluğu proje gereksinimlerine göre teyit ettikten sonra sevk edilir. Uygunluğa getirilemeyen kalemler, tanıklı fiziksel imhayı dahil olmak üzere kontrollü prosedürlerle reddedilir, değiştirilir, iade edilir veya kararına bağlanır.'
    - step: '07'
      title: Düzeltici Faaliyet
      desc: 'Tekrarlayan, önemli veya sistematik uyumsuzluklar kök neden ve düzeltici faaliyet (CAPA) açısından incelenir. İyileştirmeler; iş talimatlarının güncellenmesini, malzeme kontrollerini, kontrol noktalarını, eğitimi, tedarikçi yönetimini veya belge kontrolünü kapsayabilir.'
