answer:
  label: 'Net cevap'
  text: 'QINGDAO VATRAD GROUP.,LTD.’de uyumsuz ürünler asla gizlenmez, gayri resmi biçimde yeniden işlenmez veya doğrulama yapılmadan sevk edilmez. Tespit edilen her uyumsuzluk, etkilenen ürün, parti veya bileşene karşı kaydedilir ve bir NCR ile ilişkilendirilir. Kalem etiketlenir (HOLD / QUARANTINE / REJECTED), fiziksel olarak ayrılır ve etkilenen kapsam parti, malzeme lotu, süreç aşaması ve belge revizyonu bazında değerlendirilir. Karar, kusur şiddetine uygun yetki seviyesinde verilir: küçük sorunlar hat seviyesinde onaylanır, büyük sorunlar kontrollü yeniden işleme talimatı ve %100 bağımsız yeniden denetim gerektiren QC Müdürü + Teknik Mühendis kararı gerektirir, kritik sorunlar ise Material Review Board kararı ve gerektiğinde yazılı müşteri feragati gerektirir — aksi halde zorunlu tanıklı imha uygulanır. Yeniden işlenen kalemler özgün kabul kriterlerine karşı yeniden denetlenir, hava sızdırmazlığı onarımları eksiksiz yeni bir basınç testi döngüsü alır ve sevkiyat onayı yalnızca yetkili kalite onayından sonra gerçekleşir. Tekrarlayan veya sistematik sorunlar kök neden düzeltici faaliyetini (CAPA) tetikler.'
  verified: 'Eylül 2026'

