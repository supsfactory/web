nc_severity:
  tagline: 'Kusur Şiddeti ve Yetkisi'
  title: 'Şiddet Sınıflandırması ve Karar Yetkisi'
  subtitle: 'Her uyumsuzluk aynı seviyede ele alınmaz — karar yetkisi, kusur şiddetiyle ölçeklenir; hat seviyesindeki onaydan Material Review Board ve müşteri feragatine kadar.'
  headers:
    severity: Şiddet
    examples: Tipik Örnekler
    authority: 'Karar Yetkisi ve Kontrol'
    control: Sevkiyat Koşulu
  rows:
    - severity: 'Küçük'
      examples: 'Koli köşesinde kıvrım, kritik olmayan hafif aksesuar hizasızlığı'
      authority: 'Bölüm QC sorumlusu + hat şefi yerinde onay, değiştirme veya sevkiyat'
      control: 'NCR üzerinde kaydedilir; ürün işlevi veya müşteri gereksinimleri üzerinde etkisi yoktur'
    - severity: 'Büyük'
      examples: 'Yavaş supap sızıntısı, tolerans dışı EVA hizasızlığı (>2 mm), eksik aksesuar'
      authority: 'QC Müdürü + Teknik Mühendis kontrollü yeniden işleme talimatı (SRI) düzenler'
      control: 'Sevkiyat öncesi özgün başarısız ve etkilenen özelliklerin %100 bağımsız yeniden testi'
    - severity: 'Kritik'
      examples: 'Drop-stitch oda hasarı, yüksek basınçta ray kabarcığı veya çatlağı, müşteri logosu hatalı baskısı veya renk sapması'
      authority: 'Material Review Board (MRB) kararı; gerektiğinde yazılı müşteri feragati'
      control: 'Yetkili feragat olmadan sevkiyat yapılmaz; aksi halde zorunlu tanıklı fiziksel imha'
nc_matrix:
  tagline: Mühendislik Protokol Matrisi
  title: 'SUP Kusur Karar ve Yeniden Denetim Matrisi'
  subtitle: 'En sık görülen üretim sapmalarına uygulanan standart mühendislik protokolleri — denetimlerde müşterilerin doğrulayabileceği aynı nicel parametreler.'
  headers:
    defect: Kusur Kategorisi
    protocol: Kontrollü Karar Protokolü
    validation: Bağımsız Yeniden Denetim ve Doğrulama
  rows:
    - defect: 'Yavaş Supap Sızıntısı'
      protocol: 'Tahtayı ayırın. Kalibre edilmiş tork aletiyle (25 N·m) supap çekirdeğini sökün, iç dişleri temizleyin, silikon O-rengi değiştirin ve torku yeniden uygulayın.'
      validation: 'Köpük çözeltisine batırın; tam 24 saatlik basınç düşümü testiyle 18 PSI’a yeniden şişirin (ΔP ≤ 0.05 PSI).'
    - defect: 'Ray Dikişi Hava Kabarcıkları'
      protocol: 'Vardiya partisini karantinaya alın. Kabarcık bölgesini ısı destekli noz ile ayırın, yüzeyi çözücüyle temizleyin, 5 bar basınç altında iki bileşenli PU yapıştırıcı uygulayın.'
      validation: 'Dikişlerde %100 görsel ve dokunsal denetim; yapısal kanıt basınç testi (18.0 PSI) ve 24 saatlik hava sızdırmazlığı tutma.'
    - defect: 'EVA Ped Hizasızlığı'
      protocol: 'Sıcaklık düzenlemeli aletle (80°C) ısı destekli soyma yapın. Hassas akrilik konumlama aparatıyla hizalayın.'
      validation: 'Açıklık toleransı doğrulaması (≤ ±1.5 mm), elmas desen simetri kontrolü, kenar yapıştırma adhezyonu için %100 test.'
    - defect: 'Markalama / Logo Yazım Hatası'
      protocol: 'Baskı hattını derhal durdurun. Baskılı tüm panelleri bekletin. Vektör revizyonunu müşteriyle gözden geçirin; onaysız hiçbir değişiklik yapılmayacak.'
      validation: 'Spektrofotometre renk kontrolü (ΔE ≤ 1.5); müşteri tarafından imzalanmış vektör ana PDF’ye karşı %100 görsel metin hizası doğrulaması.'
    - defect: 'Ambalaj Uyumsuzluğu / Eksik SKU'
      protocol: 'İhracat paletini karantinaya alın. Kolileri açın ve kalem kalem %100 BOM kontrolü yapın (pompa, fin, güvenlik ipi, kürek, onarım tüpü).'
      validation: 'Hat içi dinamik elektronik tartı doğrulaması (±30 g sapma); optik 2B barkod tarayıcı doğrulaması.'
nc_scrap:
  tagline: Sıfır Pazar Sızıntısı
  title: 'Tanıklı Hurda ve İmha — Sıfır Kusurlu, Karşı Pazar Transferine Karşı Protokol'
  body: |
    Yurt dışı marka iş ortaklarının, başarısız tahtaların asla ikincil perakendeye, gri pazarlara veya e-ticaret kanallarına ulaşmayacağı konusunda güvenceye ihtiyacı vardır. Uygunluğa getirilemeyen tahtalar tanıklı, kayıt altına alınan bir protokolle imha edilir:

    **1. Donanım ve aksesuar kesme.** QA Direktörü gözetiminde hidrolik makas tüm 316 paslanmaz çelik D halkalarını, taşıma tutamak kayışlarını ve bagaj tokalarını keser. Şişirme supap grubu ve fin kutusu tabanı (US-Box / snap-in fin) tahtanın kökünden kesilerek kurtarılabilecek hiçbir bileşen bırakılmaz.

    **2. Drop-stitch yarma ve ray bölme.** İç drop-stitch çekirdek, derin çapraz kesiklerle (her kesikte ≥ 50 cm) tahta ve güverte boyunca enine kesilir, güçlendirilmiş yan raylar en az 4 parçaya bölünür — sızdırmazlık ve kaldırma kuvveti kalıcı olarak ortadan kalkar.

    **3. Video ve fotoğraf arşivi.** İmha, seri numarası barkodunun yakın çekimleri, kesme işlemi, çekirdek yarma ve tartılan nihai hurda yığınıyla kesintisiz 1080p video olarak kaydedilir. Video hashlenir (SHA-256) ve kontrollü bir sunucuda ≥ 5 yıl arşivlenir.

    **4. Sertifikalı atık imhası.** Tüm PVC ve drop-stitch parçaları tartılır, çıkış defterine kaydedilir ve yalnızca yetkin polimer geri dönüşüm ortakları tarafından taşınır — tesisten başka hiçbir kanaldan kalıntı çıkmaz.

    > **Marka koruma garantisi:** QINGDAO VATRAD GROUP CO., LTD., yeniden işlenemeyen şartname dışı su araçlarının %100 imhasını garanti eder. Fabrika ikinci el ürünleri veya kusurlu tahtalar asla ikincil perakendeye, gri pazarlara veya e-ticaret kanallarına girmez. Hurda ve İmha Sertifikası (VAT-QA-SCRAP-CERT-2026); ürünü, partiyi, MRB sonucunu, tanık fotoğraflarını ve QA Direktörü ile Fabrika Müdürü tarafından çift imzayı kaydeder.
