      desc: 'Beställ certifieringsprover för att kontrollera kvalitet, förpackning och dropship-hantering. Proverna godkänns innan serietillverkningen startar.'
    - step: 5
      title: Säsongsbunden efterbeställning
      desc: 'Din kontoshantagare planerar tillverkning och lager utifrån dina prognoser och säsongskalendern.'

