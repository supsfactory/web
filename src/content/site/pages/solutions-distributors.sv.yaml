faqs:
  tagline: Vanliga frågor för distributörer
  title: 'Grossistdistributionsprogram — vanliga frågor'
  items:
    - q: 'Vad är minsta order för en ny distributör?'
      a: 'Nya distributionspartner börjar vanligtvis med en prov- och förproduktionsorder, följt av en första container som anpassats till deras säsong. De exakta minimimängderna beror på territoriets omfattning och det valda sortimentet; din kontoshantagare bekräftar den initiala mängden under sortiments- och brandingplaneringen.'
    - q: 'Kan vi sälja brädorna under vårt eget varumärke?'
      a: 'Ja. Private label är standardmodellen här: brädorna tillverkas under eget varumärke med din grafik, din förpackning och dina specifikationer. iSupfactory tillverkar enbart för sina egna kunder och konkurrerar inte med dem på någon marknad.'
    - q: 'Är territorierna exklusiva?'
      a: 'Ja. Distributorprogrammen bygger på exklusiva territorier — varje grossistpartner täcker ett fastställt land eller en fastställd region och får pris- och programstöd för den marknaden, enligt det kommersiella avtalet.'
    - q: 'Stöder ni dropshipping?'
      a: 'Dropship-kapaciteten ingår i programmet. Prover, förpackning och hantering valideras i fasen för provgodkännande, så att dropship-orders fungerar utan problem från dag ett.'
    - q: 'Vilka modeller kan vi beställa?'
      a: 'Produktionskatalogen omfattar uppblåsbara SUP-brädor i Allround-, Touring- och Surf-utförande, uppblåsbara kajaker, pumpaer, paddlar, flytbojar och vårdtillbehör, plus anpassade format som utvecklats tillsammans med vårt konstruktionsteam. De flesta partner börjar med 4–8 bästsäljande SKU:er och utökar under kommande säsonger.'
    - q: 'Hur skickas orderna?'
      a: 'Orderna lämnar fabriken med planerade avgångar, med möjlighet till förbeställning för att stabilisera transportkostnaderna. Din tilldedlade kontoshantagare planerar tillverkning och frakt utifrån dina prognoser och säsongskalendern.'
    - q: 'Hur registrerar jag mig?'
      a: 'Använd anmälningsformuläret på den här sidan eller kontakta oss direkt. Anmälningarna bedöms av säljteamet, och vi svarar inom några arbetsdagar med nästa steg, inklusive territoriestilldelning och ett avtalsutkast.'

