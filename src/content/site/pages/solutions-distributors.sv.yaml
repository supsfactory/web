steps:
  tagline: Så fungerar det
  title: 'Från anmälan till första container'
  subtitle: 'En tydlig och strukturerad onboardingprocess i flera faser, så att ditt program under eget varumärke startar i tid inför första säsongen.'
  steps:
    - step: 1
      title: Skicka din anmälan
      desc: 'Skicka distributörsanmälan med ditt företagsprofil, din tidigare grossistomsättning och ditt territorium.'
    - step: 2
      title: Tilldelning av territorium
      desc: 'Vi bekräftar vilka länder eller regioner ditt program under eget varumärke omfattar och om territoriet är exklusivt.'
    - step: 3
