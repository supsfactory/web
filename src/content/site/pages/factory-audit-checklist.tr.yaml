hero:
  tagline: 'Durum Tespiti'
  title: 'Fabrika Denetim Kontrol Listesi'
  subtitle: 'Bir SUP üreticisiyle çalışmayı taahhüt etmeden önce temelleri doğrulayın. Bu kontrol listesi, profesyonel bir alıcının denetlemesi gereken sekiz alanı kapsar — kalite yönetimi ve üretim kapasitesinden malzeme izlenebilirliği ve sosyal uyuma kadar. Bu listedeki her kalem, yalnızca iddia değil, kayıtlarla gösterebileceğimiz bir konudur.'

answer:
  label: 'Hızlı cevap'
  text: 'En önemli sekiz denetim alanı: (1) Kalite yönetim sistemi — ISO 9001 sertifikası ve duvarda asılı bir belge değil, fiili kapı kapı denetim kayıtları. (2) Üretim kapasitesi — gerçek çıktı rakamları, tabelası değil. (3) Malzeme izlenebilirliği — parti düzeyinde giriş denetimi ve test raporları. (4) Basınç ve yapısal testler — belgelenmiş tutma testi protokolleri. (5) Kaynak ve montaj kontrolleri — RF kaynak parametreleri ve dikiş denetimi. (6) Sosyal uyum — BSCI veya eşdeğer denetim. (7) Belgeler ve izlenebilirlik — parti kayıtları, denetim tutanakları, uygunluk sertifikaları. (8) Teslim sonrası destek — garanti süreci, yedek parça, iletişim hızı.'
  verified: 'Eylül 2026'

audit_areas:
  tagline: Sekiz Denetim Alanı
  title: 'Doğrulanacaklar — Sekiz Denetim Alanı'
  subtitle: 'Her alan; sorulacak soruları, istenecek kayıtları ve izlenmesi gereken kırmızı bayrakları içerir.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
  features:
    - icon: Q
      icon_bg: blue
      title: '1. Kalite Yönetim Sistemi'
      desc: 'İstenecek: ISO 9001 sertifikası (akredite kuruluş, güncel), iç denetim takvimi, CAPA (düzeltici ve önleyici faaliyet) kaydı, denetim kapısı prosedürleri. Kırmızı bayrak: yalnızca sertifika, kapı düzeyinde denetim kaydı veya CAPA süreci yok.'
    - icon: C
      icon_bg: green
      title: '2. Üretim Kapasitesi'
      desc: 'İstenecek: ürün tipine göre aylık çıktı rakamları, mevcut kullanımı gösteren üretim programı, kalıp kapasitesi (kalıp sayısı, CNC makine, RF kaynak sayısı). Kırmızı bayrak: yalnızca tabela kapasitesi, kullanım verisi veya üretim programı yok.'
    - icon: M
      icon_bg: purple
      title: '3. Malzeme İzlenebilirliği'
      desc: 'İstenecek: giriş malzemesi denetim kayıtları, PVC ve drop-stitch tedarikçi sertifikaları, hammadde bitmiş tahtaya parti izlenebilirliği, REACH/RoHS madde beyanları. Kırmızı bayrak: parti düzeyinde izlenebilirlik yok, malzeme sertifikaları mevcut değil.'
    - icon: P
      icon_bg: orange
      title: '4. Basınç ve Yapısal Testler'
      desc: 'İstenecek: basınç testi protokolü (PSI, süre, geçer/ret kriterleri), son üretim partilerinin test kayıtları, yapısal test kayıtları (düşürme, darbe, ray stresi). Kırmızı bayrak: yalnızca “görsel denetim” veya nicel geçer/ret ölçütü olmayan belgelenmiş test protokolü yok.'
    - icon: W
      icon_bg: blue
      title: '5. Kaynak ve Montaj Kontrolleri'
      desc: 'İstenecek: RF kaynak parametre kayıtları (sıcaklık, basınç, bekleme süresi), dikiş denetim kriterleri ve ret oranları, montaj sırası belgeleri. Kırmızı bayrak: kaynak parametresi kaydı yok, CAPA olmaksızın yüksek dikiş ret oranı.'
    - icon: S
      icon_bg: green
      title: '6. Sosyal Uyum'
      desc: 'İstenecek: BSCI veya SMETA denetim raporu (güncel, tam kapsamlı), çalışma saatleri ve ücret kayıtları, iş sağlığı ve güvenliği denetim raporları, çevresel uyum belgeleri. Kırmızı bayrak: üçüncü taraf sosyal denetim yok veya çözülmemiş önemli uyumsuzluklar içeren denetim.'
    - icon: D
      icon_bg: purple
      title: '7. Belgeler ve İzlenebilirlik'
      desc: 'İstenecek: parti üretim kayıtları, kapı başına denetim tutanakları, uygunluk sertifikaları, parti referanslı sevkiyat listeleri, garanti talebi takip sistemi. Kırmızı bayrak: parti düzeyinde belge yok, garanti talepleri takip edilmiyor veya analiz edilmiyor.'
    - icon: A
      icon_bg: orange
      title: '8. Teslim Sonrası Destek'
      desc: 'İstenecek: garanti koşulları ve talep süreci, ortalama talep çözüm süresi, yedek parça bulunabilirliği, iletişim yanıt süresi taahhüdü, teslim sonrası gözden geçirme süreci. Kırmızı bayrak: belgelenmiş garanti süreci yok, teslim sonrası yavaş veya tutarsız iletişim.'

our_position:
  heading: 'Her Denetim Alanındaki Konumumuz'
  body: |
    Yalnızca uyum iddiasında bulunmuyoruz — kayıtları sunuyoruz. Sekiz denetim alanının her biri konusundaki konumumuz:

    - **Kalite yönetimi**: ISO 9001:2015 sertifikalı, akredite üçüncü tarafça yıllık denetlenir. Her kapıda belgelenmiş geçer/ret kriterleri bulunan 7 aşamalı denetim kapısı sistemi. CAPA kaydı sürdürülür ve üç ayda bir gözden geçirilir.
    - **Üretim kapasitesi**: Yıllık 120.000+ tahta kapasite, aylık ~10.000 çıktı. Üretim programı fabrika ziyareti sırasında incelenebilir. 4 otomatik üretim hattı, CNC kesim, RF kaynak ve basınç test laboratuvarı.
    - **Malzeme izlenebilirliği**: Giriş malzemesinden bitmiş tahtaya parti düzeyinde izlenebilirlik. PVC ve drop-stitch tedarikçi sertifikaları dosyada. Parti başına REACH ve RoHS madde beyanları mevcut.
    - **Basınç testi**: 18.0 PSI tutma testi; 24 saatte 0.50 PSI düşümün üzerinde otomatik ret. Her üretim partisi için test kayıtları mevcut. Yapı ve darbe testleri yapı tipine göre uygulanır.
    - **Kaynak kontrolleri**: RF kaynak parametreleri üretim çalıştırması bazında kaydedilir. 3. kapıda belgelenmiş ret oranlarıyla dikiş denetimi. Eşiği aşan ret oranları için CAPA başlatılır.
    - **Sosyal uyum**: BSCI denetimlidir. Çalışma saatleri, ücret ve güvenlik kayıtları fabrika ziyareti sırasında incelenebilir.
    - **Belgeler**: Parti üretim kayıtları, kapı başına denetim tutanakları, uygunluk sertifikaları ve parti referanslı sevkiyat listeleri her siparişle birlikte sevk edilir. Garanti talebi takip sistemi sürdürülür.
    - **Teslim sonrası destek**: Garanti koşulları sözleşme başına belgelenir. Ortalama talep çözümü 14 iş gününün altındadır. Yedek parçalar stoktan temin edilir. Her ilk sipariş için teslim sonrası gözden geçirme sunulur.

evidence_review:
  tagline: 'Kanıt ve Doğrulama'
  title: 'DOĞRULANMIŞ TEKNİK ŞARTNAMELER'
  body: 'Bu sayfadaki tüm üretim ve kalite iddiaları, Laixi, Qingdao fabrikamızdaki üretim mühendisliği ekibimiz tarafından doğrulanmıştır. Sertifikalar, QC denetim kayıtları, basınç ve yapısal test raporları ile parti izlenebilirlik kayıtları talep üzerine mevcuttur. Teknik şartnameler en son Eylül 2026’da doğrulanmıştır.'

faqs:
  tagline: SSS
  title: 'Fabrika Denetimi — Sıkça Sorulan Sorular'
  items:
    - q: 'Yerinde denetim için fabrikayı ziyaret edebilir miyim?'
      a: 'Evet. Fabrika ziyaretlerine memnuniyetle karşı veriyoruz ve sekiz alanın tamamını kapsayan yapılandırılmış bir denetim planlayabiliriz. Tipik ziyaret; üretim alanı turu, QC kapısı gözlemi, malzeme deposu denetimi, belge incelemesi ve kalite müdürüyle soru-cevap içerir. Bir tam gün ayırın. Planlamak için bizimle iletişime geçin.'
    - q: 'Ziyaret öncesinde denetim belgelerini sağlıyor musunuz?'
      a: 'Evet. Ziyaretinizden önce ISO 9001 sertifikasını, BSCI raporunu, üretim kapasitesi özetini, basınç testi protokolünü ve örnek denetim kayıtlarını paylaşabiliriz — böylece hedefli sorular hazırlayabilirsiniz. Eksiksiz parti kayıtları ziyaret sırasında yerinde mevcuttur.'
    - q: 'Hangi üçüncü taraf denetimlerini kullanıyorsunuz?'
      a: 'Üçüncü taraf denetim ve sertifikasyon için SGS, Intertek ve TUV ile çalışıyoruz. Her sipariş için talep üzerine üçüncü taraf sevk öncesi denetimi mevcuttur. Denetim kapsamı ve maliyetleri teklif aşamasında teyit edilir.'
    - q: 'Kalite sisteminizin yalnızca belgelenmiş değil, gerçekten uygulandığını nasıl anlarım?'
      a: 'Her tahta, görsel kontrol listeleri değil, nicel geçer/ret kriterleriyle 7 denetim kapısından geçer. Basınç testi verileri, kaynak parametreleri ve ret oranları parti bazında kaydedilir ve incelemenize sunulur. Şartname dışı sonuçlar için CAPA otomatik olarak tetiklenir. Canlı süreci fabrika ziyaretinde denetlemenizi teşvik ediyoruz.'

