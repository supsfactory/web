how_to_choose:
  title: Cum să alegeți dimensiunea potrivită
  cards:
    - title: Plăci SUP
      description: Alegeți lungimea în funcție de greutatea dumneavoastră și de utilizarea intenționată. Plăcile mai late (32"+) oferă mai multă stabilitate. Plăcile mai lungi (11-12 ft) au o ținută de direcție mai bună pentru tură. Vâslașii mai grei au nevoie de plăci cu volum mai mare.
    - title: Plăci SUP de tură
      description: Plăcile mai lungi (11–12 ft) sunt ideale pentru acoperirea distanțelor și pentru tură. Plăcile mai late (32"+) oferă mai multă stabilitate. Verificați capacitatea de greutate pentru sarcina totală, inclusiv echipamentul.
    - title: Plăci SUP all-around
      description: Alegeți lungimea după greutatea vâslașului și utilizarea intenționată. Plăcile all-around sunt potrivite pentru recreere, fitness și yoga. Plăcile mai mici sunt mai manevrabile.

