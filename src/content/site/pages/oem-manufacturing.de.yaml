customization:
  tagline: Nach Ihrer Spezifikation gebaut
  title: OEM-Spezifikationspunkte
  subtitle: 'Diese Spezifikationspunkte steuern Sie bei einem OEM-Projekt — Ihr Spezifikationsdokument ist der Produktionsvertrag:'
  items:
    - 'Board-Maße — Länge, Breite, Dicke, Rocker und Volumen nach Ihren Zeichnungen oder Ziel-Fahrern'
    - 'Materialstruktur — PVC-Lagenzahl und -qualität, Drop-stitch-Dichte, Versteifungen und Rail-Verstärkungen'
    - 'Grafik und Farben — Ihr Artwork mit unbegrenzten Paletten oder Unterstützung unseres Designteams'
    - 'EVA-Antirutschpad — individuell geschnittene Deck-Pads, Logos und Deckfarben auf jedem Board'
    - 'Griffe und D-Ringe — Platzierung, Anzahl und Hardware-Spezifikation für Ihren Einsatzzweck'
    - 'Fin-Systeme — Einzel-, Doppel- oder Dreifach-Finne sowie Fin-Boxen nach Ihrer Spezifikation'
    - 'Paddel, Pumpen, Leashes und Zubehör — Ihr Paket, Ihr Branding'
    - 'Verpackung & Handelsaufbereitung — Handelsverpackungen, seetüchtige Versandverpackung und Point-of-Sale-Displays unter Ihrer Marke'
    - 'Etiketten und Konformitätskennzeichen — Serien-Etiketten, Logos und marktspezifische Dokumentation für Ihre Exportregion'

faq_section:
  tagline: FAQ
  title: Fragen zur OEM-Fertigung
  questions:
    - q: Wie starte ich ein OEM-Projekt mit meinem eigenen Design?
      a: 'Senden Sie Ihre Zeichnungen, ein Referenz-Board oder eine schriftliche Spezifikation. Unsere technische Prüfung bestätigt die Produzierbarkeit und liefert innerhalb eines Werktages eine Offerte — das ist unser Standardversprechen, und bei Bedarf wird vor jedem Dateiaustausch eine NDA unterzeichnet.'
    - q: Wie hoch ist der MOQ für Inflatable-SUP-OEM?
      a: 'Der MOQ wird projektspezifisch bestätigt — Rumpf und Werkzeug, Farbvarianten und PVC, Artwork, Verpackung und Zubehör. Die Standardmengenproduktion läuft mit 90–100 Einheiten pro Charge (eine 150-m-Drop-stitch-Rolle), während Pilotläufe bei 20–50 Einheiten auf bestehenden Plattformen starten. Die volle Berechnungslogik steht in unserem MOQ- & Flexible-Branding-Leitfaden.'
    - q: Wie ist die typische Lieferzeit für einen OEM-Auftrag?
      a: 'Die Produktion läuft 25–35 Tage ab bestätigtem Auftrag und Anzahlung. Der Formenbau addiert 15–20 Tage. Prototyp-Muster gehen in der Regel innerhalb von 7–12 Tagen raus.'
    - q: Können Sie nur auf Basis meiner bestehenden Zeichnungen fertigen?
      a: 'Ja. OEM baut direkt nach Ihrer Spezifikation — Sie besitzen das Design. Unsere Ingenieure prüfen die Zeichnungen auf Produktionsfähigkeit, weisen vor Formenbau oder Zuschnitt auf Konflikte hin, und das freigegebene Muster wird zur Produktionsreferenz.'
    - q: Liefern Sie vor der Produktion Muster?
      a: 'Ja. Vor jedem Produktionslauf wird ein physisches Muster produziert und freigegeben — in der Regel innerhalb von 7–12 Tagen — und es dient als Referenz für alle weiteren QC-Prüfungen.'
    - q: Welche Zertifizierungen besitzt die Fabrik?
      a: 'ISO 9001:2015 Qualitätsmanagement (werksweit), BSCI Sozialcompliance (amfori-Fabrikaudit), CE-Konformitätsdokumentation für anwendbare EU-Marktkonfigurationen (Geltungsbereich projektbezogen bestätigt), REACH (Materialien) und RoHS (elektronisches Zubehör). Vollständige Konformitätsdokumentation wird mit jeder OEM-Lieferung für Ihre Zielmärkte bereitgestellt.'
    - q: Wie wird die Qualität bei einem OEM-Lauf kontrolliert?
      a: 'Die Produktion läuft unter mehrstufiger Qualitätskontrolle — Wareneingang, prozessbegleitende und Endprüfung — mit 18,0-PSI-24-Stunden-Druckhalttest (automatische Aussortierung über 0,50 PSI Abfall), einer 100-Punkte-Montagecheckliste und 10-jähriger ERP-Chargenrückverfolgbarkeit je Seriennummer.'
    - q: Wie lauten Ihre Lieferbedingungen?
      a: 'FOB Qingdao, CIF zu wichtigen globalen Häfen oder DDP für qualifizierte Partner. Wir liefern in über 50 Länder in den EU-, US-, AU- und Asien-Märkten.'

process:
  title: 'Der OEM-Prozess — von der Spezifikation bis zum verschifften Container'
  subtitle: 'Sieben kontrollierte Stufen von einem Fabrikteam, sodass jeder Schritt von Ihrer ersten Spezifikation bis zum verpackten Container dokumentiert und termingerecht bleibt.'
  steps:
    - phase: '01'
      title: Spezifikationsprüfung & Offerte
      period: 1 Werktag
      items:
        - 'Teilen Sie Ihre Zeichnungen, Spezifikation oder Referenz-Boards — unsere Ingenieure prüfen die Produzierbarkeit.'
        - 'Sie erhalten eine detaillierte Offerte und einen Projektplan innerhalb eines Werktages.'
    - phase: '02'
      title: Technische Bestätigung
      period: Woche 1
      items:
        - 'Rumpfmaße, Drop-stitch-Qualität, PVC-Spezifikationen und Rail-Konstruktion werden gegen Ihr Dokument bestätigt.'
        - 'Formen- oder Plattformentscheidungen werden fixiert — bei Bedarf startet hier der eigene Formenbau.'
    - phase: '03'
      title: Prototyp & Muster
      period: 7–12 Tage
      items:
        - 'Ein physisches Muster wird produziert und zu Ihrer Bewertung gesendet — Wassererprobung für neue Formen inklusive.'
        - 'Das Muster (1–2 Einheiten) validiert Ihre Spezifikation vor jeder Mengenzusage.'
    - phase: '04'
      title: Prüfung & Validierung
      period: Parallel
      items:
        - 'Luftretention, Druckhalt, Nahtfestigkeit, Last- und UV-Prüfungen je Produktionslinie.'
        - 'CE-, ISO-9001-, BSCI-, REACH- und RoHS-Dokumentation für Ihre Exportmärkte erstellt.'
    - phase: '05'
      title: Freigabe & Bestätigung
      period: Nach Musterfreigabe
      items:
        - 'Sie geben Muster und Artwork frei; Auftrag und Anzahlung sichern den Produktionsslot.'
        - 'Ein Vorproduktionsplan bestätigt Termine, Mengen, Verpackung und Verladehafen.'
    - phase: '06'
      title: Produktion
      period: 25–35 Tage
      items:
        - 'Produktion unter mehrstufiger Qualitätskontrolle — Wareneingang, prozessbegleitende und Endprüfung.'
        - 'Von Pilotaufträgen (20–50 Einheiten) auf bestehenden Plattformen bis zu vollen 150-m-Rollen (90–100+ Einheiten) in der Standardmengenproduktion.'
    - phase: '07'
      title: Verpackung & Versand
      period: 1 Tag + Transit
      items:
        - 'Exportverpackung mit Modell-Serienetiketten, dann FOB Qingdao, CIF oder DDP in über 50 Länder.'
        - 'Zolldokumentation, Tracking und Nachbestell-Support in jeder Stufe inklusive.'

