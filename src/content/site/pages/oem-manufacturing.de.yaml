hero:
  tagline: OEM-Fertigung
  title: 'Individuelle SUP-OEM-Fertigung — Ihre Spezifikation, unsere Fabrik'
  subtitle: 'Sie bringen Design, Zeichnung oder ein erprobtes Plattform-Konzept mit — wir fertigen im Containermaßstab. Technische Prüfung innerhalb eines Werktages, Muster in 7–12 Tagen, Produktion 25–35 Tage nach bestätigtem Auftrag und Anzahlung, verschifft unter Ihrer Marke.'

answer:
  label: 'Kurze Antwort'
  text: 'Die OEM-Produktion läuft nach Ihrer Spezifikation. Der MOQ wird projektbezogen bestätigt statt als fixe Zahl: Die Standardmengenproduktion läuft mit 90–100 Einheiten pro Charge aus einer 150-m-Drop-stitch-Geweberolle, Pilotläufe starten bei 20–50 Einheiten auf bestehenden Plattformen, und jedes Projekt durchläuft vor der Menge ein Muster (1–2 Einheiten). Muster gehen in 7–12 Tagen raus; die Produktion läuft 25–35 Tage nach bestätigtem Auftrag und Anzahlung, plus 15–20 Tage, wenn neues Werkzeug nötig ist.'
  verified: 'September 2026'

