intro: 'Распространённое заблуждение, что гидродинамические испытания предназначены только для судов и гоночных корпусов. На самом деле характеристики доски SUP — глиссирующего корпуса длиной от 10 до 14 футов — так же сильно зависят от подводной формы, как и любой другой корпус. Профиль носа, радиус усилителя борта, rocker и площадь смачиваемой поверхности оказывают решающее влияние на сопротивление, эффективность скольжения и устойчивость. В {SITE.name} мы эксплуатируем специализированный гидродинамический испытательный бассейн, который позволяет количественно оценить эти эффекты на масштабе модели — до принятия решения о закупке ткани и оснастки для полноразмерного прототипа.'

content_html: |
  <h2>Зачем испытывать доску SUP в бассейне?</h2>
  <p>Испытания на масштабе модели (обычно 1:3 и 1:5) позволяют нам быстро и экономично итерировать формы досок. Неделя в бассейне даёт те же данные о характеристиках, на которые в полном масштабе потребовались бы месяцы проб и ошибок, — при доле соответствующих затрат.</p>

  <h2>Характеристики оборудования</h2>
  <table>
    <thead><tr><th>Параметр</th><th>Спецификация</th></tr></thead>
    <tbody>
      <tr><td>Размеры бассейна</td><td>35 m (L) × 3.5 m (W) × 1.8 m (D)</td></tr>
      <tr><td>Буксировочная тележка</td><td>Электрическая с сервоприводом, максимальная скорость 12 m/s (23 kn), точность скорости ± 0.5 %</td></tr>
      <tr><td>Генератор волн</td><td>Лопастного типа, программируемые регулярное и нерегулярное волнение, Hs до 0.3 m в масштабе модели</td></tr>
      <tr><td>Измерительная аппаратура</td><td>6-компонентный динамометр (сопротивление, боковая сила, момент рыскания), акселерометры, инклинометры, датчики волн</td></tr>
      <tr><td>Сбор данных</td><td>Дискретизация 1000 Hz по каждому каналу, отображение в реальном времени и пакет постобработки</td></tr>
      <tr><td>Изготовление моделей</td><td>Собственные фрезерные станки с ЧПУ и 3D-печать для корпусов моделей длиной до 1.8 m LOA</td></tr>
    </tbody>
  </table>

  <h2>Наша программа испытаний</h2>
  <p>Стандартная программа разработки доски в нашем бассейне выполняется по следующей последовательности:</p>
  <ol>
    <li><strong>Изготовление модели</strong> — модель масштаба 1:4 изготавливается фрезерованием из пеноматериала высокой плотности и покрывается стекловолокном для жёсткости. Масса и центр тяжести подбираются под полностью нагруженное состояние в масштабе Фруда.</li>
    <li><strong>Буксировочные забеги</strong> — модель буксируется на 6-10 скоростях, охватывающих диапазон гребления (2–6 kn в полном масштабе). Полное сопротивление измеряется и раскладывается на составляющие трения и остаточное сопротивление методом ITTC-1957.</li>
    <li><strong>Измерение посадки и осадки</strong> — посадка на ходу и осадка фиксируются при каждой скорости. Целевой является угол посадки, который минимизирует смачиваемую поверхность, сохраняя нос над гребнем волны.</li>
    <li><strong>Исследование волнового следа</strong> — поперечные волновые разрезы измеряются на двух скоростях для оценки волнообразующего сопротивления и выявления взаимодействий формы носа, замедляющих доску.</li>
    <li><strong>Морестойкость (по желанию)</strong> — забеги встречными волнами в регулярном волнении для измерения добавочного сопротивления и вертикальных ускорений при волнении, — данных, лежащих в основе проектирования носа touring-досок.</li>
    <li><strong>Анализ данных и рекомендации</strong> — предоставляется полный отчёт со сравнительными графиками, кривыми сопротивления и скорости и конкретными конструктивными рекомендациями для полноразмерной доски.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Типичные результаты испытаний в бассейне — сопротивление в зависимости от скорости (универсальная доска 11''0, масштаб 1:4)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">2 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">11 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">3 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">21 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">4 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">32 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">6 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">52 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Сопротивление (N) в масштабе модели при скоростях в масштабе Фруда. Прогноз мощности в полном масштабе выполняется по методу прогнозирования характеристик ITTC-1978.</p>
  </div>

  <h2>Экспертная команда</h2>
  <p>Нашим бассейном руководит гидродинамик с докторской степенью по кораблестроению и 8-летним опытом работы в буксировочных бассейнах крупного европейского морского исследовательского института. Ему помогает техник, который готовит все модели и измерительную аппаратуру. Команда следует Рекомендуемым процедурам ITTC (International Towing Tank Conference), чтобы каждое испытание было повторяемым, прослеживаемым и защитимым на международном уровне.</p>

  <h2>Испытания в бассейне для разработки кастомных досок</h2>
  <p>Наш бассейн используется не только для досок собственной разработки — мы регулярно проводим программы испытаний для заказчиков, которым нужно подтвердить кастомную форму доски или исследовать вопрос по характеристикам:</p>
  <ul>
    <li><strong>Сравнение форм</strong> — две или более кандидатные формы досок испытываются в идентичных условиях, что даёт объективное сопоставление сопротивления, скорости и устойчивости для обоснованного выбора конструкции.</li>
    <li><strong>Оптимизация усилителя борта и носа</strong> — вариации профиля носа и радиуса усилителя борта можно испытывать в разных конфигурациях, чтобы количественно оценить их вклад в снижение сопротивления.</li>
    <li><strong>Исследование нагрузки пользователя</strong> — данные сопротивления снимаются по всему диапазону паспортного веса пользователя, что позволяет задать оптимальные длину и ширину для целевого гребца.</li>
  </ul>

  <h2>Почему стоит испытывать у нас?</h2>
  <p>Мы не просто предоставляем набор исходных цифр. Наши отчёты переводят данные бассейна в практические инженерные рекомендации: «Увеличьте rocker носа на 10 mm, чтобы снизить сопротивление гребня волны на крейсерской скорости», «Скруглите усилитель борта в миделе, чтобы уменьшить смачиваемую поверхность» или «Сместите площадку для стояния на 50 mm вперёд для улучшения посадки». Вы получаете чёткое понимание, что и зачем нужно изменить.</p>
  <p>Наш бассейн также доступен для независимых сторонних испытаний на платной основе. Если вы разрабатываете доску и хотите получить непредвзятую гидродинамическую оценку, выполненную профессионально, мы будем рады вашему запросу.</p>

