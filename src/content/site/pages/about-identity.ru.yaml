  tagline: 'Брендовая идентичность'
  title: 'Кто такой iSupfactory?'
  subtitle: 'iSupfactory — это бренд производства Vatrad, ориентированный на закупщиков: морское производственное подразделение Qingdao Vatrad Group Co., Ltd. — производитель надувных досок SUP и надувной морской продукции в Лайси, Циндао, Китай. Мы производим исключительно под брендами наших клиентов и никогда не конкурируем с ними ни на одном рынке.'

answer:
  label: 'Кратко'
  text: 'Юридическое лицо: Qingdao Vatrad Group Co., Ltd. Производственное подразделение: Vatrad (бренд iSupfactory). Завод: Лайси, Циндао, Шаньдун, Китай. Направление деятельности: OEM, ODM и private-label производство надувных досок SUP, веслов и надувной морской продукции. Сертификаты: ISO 9001:2015, CE (модели для рынка ЕС), BSCI, REACH, RoHS. Мы не продаём под собственным брендом — каждая доска, которую мы производим, несёт бренд закупщика.'
  verified: 'Сентябрь 2026'

