manufacturing_scope:
  heading: 'Производственный профиль'
  body: |
    Наш производственный профиль охватывает всю производственную цепочку надувной SUP и морской продукции — от входного контроля сырья до финальной упаковки и экспортной документации.

    - **Категории продукции**: надувные доски SUP (all-around, touring, surf, fishing, yoga, racing), надувные каяки, надувные лодки, весла, насосы и аксессуары.
    - **Типы конструкции**: однослойный PVC, двухслойный PVC, сердцевина drop-stitch с оболочкой из PVC. Индивидуальные конструктивные спецификации для каждого проекта.
    - **Модели сотрудничества**: OEM (собственный дизайн закупщика), ODM (разработано заводом по брифу закупщика), private-label/ко-брендинг (бренд на уже проверенных платформах).
    - **Сертификация**: ISO 9001:2015 (менеджмент качества на заводе), CE (модели для рынка ЕС, объём зависит от проекта), BSCI (социальная ответственность), REACH (химическая безопасность), RoHS (ограниченные вещества).
    - **Производственная мощность**: более 120,000 досок в год, около 10,000 единиц в месяц на 4 автоматизированных линиях. Возможно расширение при заблаговременном планировании.

brand_positioning:
  heading: 'Позиционирование бренда'
  body: |
    iSupfactory занимает определённую позицию на рынке — мы не бренд, мы производитель. Это различие определяет все аспекты нашей работы:

    - **Мы никогда не продаём под собственным брендом.** Каждая доска, которую мы производим, несёт бренд закупщика. Мы не конкурируем со своими клиентами ни на одном рынке и ни в одном канале. Эта политика не подлежит обсуждению.
    - **Мы не торговая компания.** Мы эксплуатируем завод. Контроль качества, инженерная разработка, планирование производства и экспортная документация ведутся собственными силами. Между вашим заказом и производственным цехом нет посредников.
    - **Мы специализируемся на надувной продукции.** Это не побочное направление и не одна из многих категорий продукции. Надувные SUP и морские изделия — наша ключевая компетенция. Каждый станок, каждый процесс и каждый контрольный пункт качества оптимизированы под эту категорию продукции.
    - **Мы работаем с профессиональными закупщиками.** Наши клиенты — бренды, дистрибьюторы, операторы курортов, клубы и школы, а не частные покупатели. Наши цены, структура минимальных заказов, документация и коммуникация рассчитаны на B2B-отношения.

evidence_review:
  tagline: 'Доказательства и верификация'
  title: 'СПЕЦИФИКАЦИИ ПРОВЕРЕНЫ'
  body: 'Все организационные и производственные заявления на этой странице поддаются проверке. Сертификат ISO 9001, отчёт BSCI, лицензия на ведение деятельности и документы о регистрации завода предоставляются по запросу. Посещения завода приветствуются. Спецификации в последний раз проверены в сентябре 2026.'

faqs:
  tagline: FAQ
  title: 'Брендовая идентичность — часто задаваемые вопросы'
  items:
    - q: 'Является ли iSupfactory отдельной компанией по отношению к Qingdao Vatrad Group?'
      a: 'Нет. iSupfactory — это бренд Vatrad, ориентированный на закупщиков; Vatrad является морским производственным подразделением Qingdao Vatrad Group Co., Ltd. Юридическим лицом по всем заказам выступает Qingdao Vatrad Group Co., Ltd. Завод, команда и система качества — это одна и та же операция.'
    - q: 'Продаёте ли вы доски под собственным брендом?'
      a: 'Нет. Мы производим исключительно под брендами наших клиентов и никогда не конкурируем с ними ни на одном рынке. Это основополагающая политика, а не временная позиция. Если вы обнаружите на рынке доску с брендом iSupfactory, она не из нашего завода.'
    - q: 'Могу ли я посетить завод?'
      a: 'Да. Мы приветствуем посещения завода и можем организовать структурированный аудит, охватывающий весь производственный процесс, контрольные пункты качества, склад материалов и проверку документации. Свяжитесь с нами, чтобы согласовать визит.'
    - q: 'Каковы отношения между Vatrad и iSupfactory?'
      a: 'Vatrad — это название производственного подразделения внутри Qingdao Vatrad Group. iSupfactory — международный бренд, ориентированный на закупщиков, используемый для услуг OEM, ODM и private-label производства. Оба названия относятся к одной и той же операции — морскому производственному подразделению в Лайси, Циндао.'

