hero:
  tagline: 'Doğrulayabileceğiniz Üretim'
  title: 'OEM Güven ve Fabrika Güvencesi'
  subtitle: 'Bu sitedeki her iddia doğrulanabilir: resmi şirket kaydı, ziyaret veya denetim yapabileceğiniz fiziki 12.500 m² fabrika, NDA altında gerçek mühendisler, indirebileceğiniz QMS dokümanları ve seri numarası bazında kaydedilen test verileri. Qingdao Vatrad Group Co., Ltd. tarafından tasarlanır ve yürütülür.'

answer:
  label: 'Doğrudan yanıt'
  text: 'Güven bir söz değildir — dokümantasyondur. Çin’de kayıtlı bir üretim kuruluşuyuz (Qingdao Vatrad Group Co., Ltd.): Qingdao’da fiziki 12.500 m² tesisimiz, 350+ çalışanımız ve yıllık 120.000+ tahta kapasitemiz var. Kaydı doğrulayabilir, fabrikayı denetleyebilir, QMS SOP belgelerini inceleyebilir, örnek kalite kayıtları indirebilir, üçüncü taraf incelemeleri (SGS, TÜV, BV veya Intertek) planlayabilir ve 4 iş saatinde bir NDA imzalatabilirsiniz. Her tahta 24 saat boyunca 18.0 PSI basınçta test edilir, 0.50 PSI üzeri düşüşte otomatik ret uygulanır ve her parti 10 yıllık ERP izlenebilirliğini korur. Bir iddia belgelenemiyorsa onu yapmayız.'
  verified: 'Eylül 2026'

