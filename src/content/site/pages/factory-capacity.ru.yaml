intro: Vatrad эксплуатирует один из крупнейших специализированных заводов по производству надувных досок SUP в Циндао, Китай. Наш завод площадью 12,500 m² организован в четыре специализированных цеха, работающих параллельно. Годовая мощность по SUP составляет 120,000+ надувных досок SUP (около 10,000 в месяц), при этом на отдельных продуктовых линиях выпускается 50,000+ спасательных жилетов и 5,000+ аксессуаров.

