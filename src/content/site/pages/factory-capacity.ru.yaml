workshops:
  - title: Производство досок SUP
    description: '4 автоматизированные сборочные линии для надувных досок SUP с суммарным выпуском около 10,000 досок в месяц. Участки цифровой и трафаретной печати работают параллельно. Годовая мощность по SUP: 120,000+ досок.'
    output: '120,000+ SUP в год'
  - title: Производство досок SUP — расширительные линии
    description: 'Дополнительные автоматизированные сборочные линии для досок SUP, включаемые по мере роста объёма. Участки соединения сердцевины drop-stitch, цифровой печати и сборки работают параллельно.'
    output: 'Часть годовой мощности 120,000+ досок SUP'
  - title: Аксессуары для SUP и смешанная сборка
    description: 'Многоцелевые сборочные линии для аксессуаров SUP: весла, плавники, шнуры, сумки и комплекты. Участки термовоздушной сварки, прессы для ВЧ-диэлектрической сварки и сборочные рабочие места перенастраиваются в зависимости от структуры заказов. Годовая мощность по аксессуарам: 5,000+ единиц.'
    output: '5,000+ аксессуаров в год'
  - title: Средства безопасности
    description: 'Отдельная зона производства в чистых условиях для спасательных жилетов и средств безопасности. Специализированные участки шитья, вставки пеноматериала и испытаний. Годовая мощность по спасательным жилетам: 50,000+ единиц.'
    output: '50,000+ спасательных жилетов в год'

oem_capacity:
  moq: 'SUP: образец 1–2 | пилот 20–50 | объём 90–100+ (на рулон 150 m)'
  lead_time: 'Стандартно 25–35 дней. Образец 7–12 дней. Возможен срочный выпуск.'
  payment: 'T/T 30% предоплата + 70% остатка. Принимаются L/C, Western Union.'

lead_time_explainer:
  tagline: 'Планирование и график'
  title: 'Как мощность превращается в сроки вашей поставки'
  subtitle: 'Мощность — это не одно число: вот как на самом деле распределяются сроки изготовления.'
  items:
    - title: 'Мощность зависит от вашей спецификации'
      body: 'Доступные окна меняются в зависимости от типа доски, сложности конструкции, упаковки и сезонного спроса. В период весенне-летнего наращивания объёма линии работают почти на полную мощность, и окна под образцы заканчиваются первыми.'
    - title: 'Планируйте до начала вашего сезона'
      body: 'Зафиксируйте подтверждение образца и заморозку макетов заранее. Повторные заказы планируются в согласованное регулярное окно после того, как эталонный образец заархивирован.'
    - title: 'Три потока планирования'
      body: 'Образцы поступают на прототипную линию первыми, первоначальные заказы размещаются в ближайшем свободном сборочном окне, а повторные заказы выполняются в своём регулярном окне.'
    - title: 'Твёрдый срок после согласования'
      body: 'Мы подтверждаем твёрдый срок только после согласования спецификации, макетов, упаковки и количества, и никогда не заранее как фиксированное обязательство.'

