  description: 'Forskning og udvikling — PVC-stoftest, skrogkonstruktion, højfrekvenssvejsning, hydrodynamisk test og kvalitetskontrol. Specialiserede R&D-services fås.'
  dateModified: '2026-08'

hero:
  tagline: R&D-center
  title: R & D-center
  subtitle: Fokuseret på fremskridt

intro:
  - VatRads forsknings- og udviklingscenter (R&D) er drivkraften bag vores mission om at revolutionere udstyr til vandsport. Vi giver vandsportister over hele verdenen sikrere, mere komfortable og mere fornøjende produkter gennem ihærdig innovation i oppustelige stand-up paddleboards (SUP) og både. Vores dedikerede team af ingeniører, designere og passionerede vandsportseksperter former branchens fremtid og løfter konstant barren for kvalitet, ydelse og bæredygtighed.
  - Vores R&D-facilitet samler materialeforskere, skibsingeniører og produktionsingeniører under et tag. Fra stofformulering og skrogsimulering til udvikling af svejseprocesser og fuldstørige søforsøg drives hvert stadium af produktudvikling af data og valideres ved test.

mission:
  tagline: Vores mission
  title: Vi innoverer vandsportens fremtid
  pillars:
    - icon: lightning
      title: Teknologisk fremskridt
      desc: Vi baner vejen for nye materialer, designs og produktionsmetoder, der giver bedre produktydelse og længere levetid.
    - icon: design
      title: Brugerorienteret design
      desc: Vi forstår brugerbehov dybt og overgår dem gennem ergonomisk og intuitivt produktdesign.
    - icon: globe
      title: Bæredygtige arbejdsgange
      desc: Vi minimerer vores miljøaftryk ved at bruge miljøvenlige materialer og processer.
    - icon: shield
      title: Kompromisløs sikkerhed
      desc: Vi sikrer de højeste sikkerhedsstandarder gennem stringent test og certificering.

pillars:
  - title: Teknologisk fremskridt
    desc: Vi baner vejen for nye materialer, designs og produktionsprocesser, der giver bedre produktydelse og længere levetid.
    icon: tech
  - title: Avancerede materialer
    desc: Vi undersøger banebrydende PVC, Hypalon, kompositter og bæredygtige alternativer for bedre produktegenskaber.
    icon: materials
  - title: Bæredygtighed
    desc: 'Et kerneengagement: Vi varetager miljøet gennem bæredygtig produktion og genanvendelige materialer.'
    icon: sustainability

capabilities:
  tagline: Kapaciteter
  title: R&D-kapaciteter
  subtitle: Fire kernefag, der giver os fuldt herover fra råmaterialeforskning til endelig certificering.
  groups:
    - title: Materialekemi og stofteknologi
      items:
        - Analyse og optimering af PVC- og Hypalonformuleringer
        - Udvikling af UV-stabilisering, brandhæmmende og antimikrobielle additiver
        - Laminering af flerlagede stoffer og limteknologi
        - Accelereret aldringstest (UV, varme, fugt, salt spray)
    - title: Skrogkonstruktion og hydrodynamik
      items:
        - Parametrisk 3D-skrogdesign og CFD-optimering
        - Elementanalyset for struktur- og stødlast
        - Slæbetest i model skala og validering af ydelse
        - Specialudvikling af skrog til særlige missionsprofiler
    - title: Svejse- og samlingsteknologi
      items:
        - Udvikling og optimering af højfrekvenssvejsning
        - Luft-, varmkile- og ultralydssvejsemetoder
        - Kvalificering af limbinding og sømtape
        - Modellering af svejstyrke og levetidsprognoser
    - title: Test, certificering og overensstemmelse
      items:
        - Kvalitetsstyring og CE-overensstemmelsestest
        - Uafhængig tredjepartstest og støtte til certificering
        - Udvikling af skræddersyede testprotokoller til kvalifikationskrav
        - Fejlanalyse i drift og undersøgelse af årsagssammenhænge

