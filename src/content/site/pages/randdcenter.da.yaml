rd_services:
  tagline: Specialiseret R&D
  title: R&D-services til partnere
  services:
    - title: Specialudvikling af materialer
      desc: Vi udvikler skræddersyede stofformuleringer, laminatopbygninger og limesystemer tilpasset dit driftsmiljø og dine ydelsesmål.
    - title: OEM / ODM produktudvikling
      desc: Vi udvikler skræddersyede stofformuleringer, laminatopbygninger og limesystemer tilpasset dit driftsmiljø og dine ydelsesmål.
    - title: Tredjepartstest og certificering
      desc: Brug vores ISO-kompatible testfaciliteter til uafhængig materialetest, produktvalidering og støtte til certificering.
  cta: Drøft dine R&D-behov →
  cta_link: /da/contact

vision:
  tagline: Vores vision
  title: Vi former vandsportens fremtid
  body: Vatrad stræber efter at lede branchen for oppustelige både og SUP gennem kontinuerlig innovation, kompromisløs kvalitet og en urokkelig engagement i sikkerhed og bæredygtighed — og dermed beriger oplevelserne for vandsportister verden over. Vatrad R&D-centeret er, hvor passion møder innovation, og hvor nye standarder sættes for vandsportsbranchen.

labs_section:
  tagline: Laboratorier
  title: Vores laboratorier
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: PVC-stoflaboratorium
      description: Kontinuerlig forskning i og test af PVC- og Hypalonrørstoffer for trækstyrke, UV-bestandighed, slid og fleksibilitet ved lave temperaturer, så vi kan sikre langsigtet holdbarhed i maritime miljøer.
      href: /da/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Skrogkonstruktionsstudio
      description: CAD-baseret design og elementanalyse af skrog i HDPE, aluminium og glasfiber. Ethvert skrog simuleres digitalt for spændingsfordeling og slagstyrke, før den første prototype bygges.
      href: /da/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: Højfrekvenssvejsecenter
      description: Dedikeret facilitet til højfrekvenssvejsning med præcis temperatur- og trykstyring, som producerer stærke og lufttætte sømme, der opfylder maritim branches standarder for oppustelige fartøjer.
      href: /da/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hydrodynamisk test bassin
      description: Test i modelskala i vores eget testbassin for at optimere skrogform, glitsegenskaber, stabilitet og brændstofeffektivitet på tværs af last- og havforhold.
      href: /da/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypeværksted
      description: Facilitet til prototyping og riggning i fuld størrelse, hvor nye modeller bygges, monteres og prøvesejles. Hver prototype gennemgår et testprogram på mindst 20 timer i vandet, før produktionen godkendes.
      href: /da/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Kvalitets- og inspektionslaboratorium
      description: Dedikeret kvalitetssikringslaboratorium, der udfører trækprøvning, cyklusser for lufttab, sømpeelprøvninger og materialecertificering, så enhver båd, der forlader værkstedet, lever op til vores offentliggjorte specifikationer.
      href: /da/randdcenter/quality-inspection-lab
