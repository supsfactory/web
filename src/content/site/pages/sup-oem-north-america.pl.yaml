why_north_america:
  tagline: 'Dlaczego kupujący w USA i Kanadzie'
  title: 'Zbudowane pod import z Ameryki Północnej'
  subtitle: 'Fabryka odpowiada na pytania, które amerykańskie i kanadyjskie marki zadają przed pierwszym kontenerem.'
  items:
    - title: 'DDP dla przewidywalnego kosztu końcowego'
      description: 'DDP obejmuje odprawę celną i dostawę do Twojego magazynu — cło, podatki i fracht w jednej kwocie. Najpopularniejszy wybór przy pierwszym imporcie.'
    - title: 'Dokumentacja pod Twój rynek docelowy'
      description: 'Dokumentację CE, REACH i celną przygotowujemy pod Twoje rynki docelowe równolegle do zatwierdzonej próbki, więc Twoja dokumentacja produktowa jest gotowa do eksportu.'
    - title: 'FOB Qingdao z własnym spedytorem'
      description: 'Importujesz regularnie? Wybierz FOB Qingdao i skorzystaj ze swojego partnera logistycznego — my załadujemy i udokumentujemy kontener, resztą kontrolujesz sam.'
    - title: 'Jedna fabryka, jeden system jakości'
      description: 'Rozwój, pobieranie próbek, produkcja i QC odbywają się w całości w zakładzie o powierzchni 12,500 m² — bez przeskakiwania między pośrednikami i bez próbek, których produkcja nie jest w stanie odtworzyć.'

process_notes:
  tagline: 'Jak to działa'
  title: 'Od specyfikacji do kontenera'
  subtitle: 'Te same sześć etapów, niezależnie od tego, czy kupujesz dwa kontenery rocznie, czy dwadzieścia: specyfikacja, inżynieria, próbki, badania, oprzyrządowanie, produkcja — a następnie dostawa FOB, CIF lub DDP.'
  items:
    - title: '1. Wyślij specyfikację'
      description: 'Wystarczy deska referencyjna, szkic lub specyfikacja konkurenta. Analiza inżynierska i oferta wracają w ciągu jednego dnia roboczego.'
    - title: '2. Zatwierdź próbkę'
      description: 'Twoja pierwsza fizyczna próbka wyrusza w 7–12 dni z arkuszem zatwierdzenia obejmującym konstrukcję, kolory nadruku i wyniki badania ciśnieniowego.'
    - title: '3. Produkcja i eksport'
      description: 'Serie kończą się w 25–35 dni z punktami kontrolnymi QC w trakcie procesu. Przeładowanie, faktura i list przewozowy wyruszają przed statkiem.'
    - title: '4. Dostawa do Twojego magazynu'
      description: '4–6 tygodni żeglugi morskiej do portów USA lub Kanady — przy DDP zajmujemy się odprawą i dostawą pod Twoje drzwi.'

faq_section:
  tagline: FAQ
  title: 'Pytania o import do Ameryki Północnej'
  questions:
    - q: 'Ile trwa żegluga morska do USA lub Kanady?'
      a: 'Zaplanuj 4–6 tygodni od portu w Qingdao do portów USA lub Kanady, w zależności od przeznaczenia i rozkładu rejsów. Projekty DDP obejmują pełny harmonogram drzwi do drzwi.'
    - q: 'Czy wysyłacie DDP do USA i Kanady?'
      a: 'Tak. DDP obejmuje żeglugę morską, odprawę celną, cło i podatki oraz dostawę do Twojego magazynu — jedna przewidywalna cena końcowa. Dostępne są również FOB Qingdao i CIF.'
    - q: 'Jaka jest minimalna ilość zamówienia (MOQ) przy imporcie SUP private label?'
      a: 'MOQ potwierdzamy wg konfiguracji projektu: rozwój próbki obejmuje 1–2 szt., serie pilotażowe to 20–50 szt. na istniejących platformach, a standardowa produkcja seryjna to 90–100+ szt. na projekt z pełnej rolki drop-stitch 150 m.'
    - q: 'Jaką dokumentację dostarczacie do importu?'
      a: 'Zatwierdzona próbka wyrusza z dokumentacją CE i REACH przygotowaną pod Twoje rynki docelowe, a każdy kontener wysyłamy z przeładowaniem, fakturą i listem przewozowym.'
    - q: 'Jakie dokumenty zgodności dostarczacie w USA dla SUP?'
      a: 'Dorosłe nadmuchiwane SUP nie są produktami dla dzieci, więc zasady CPSIA dotyczące produktów konsumenckich zasadniczo nie mają zastosowania. Kalifornijska Prop 65 to ocena zależna od Twojej decyzji dotyczącej etykietowania — wspierają ją nasze dokumentacje materiałowe REACH/RoHS do każdego zamówienia. Tam, gdzie wymaga tego kategoria Twojego produktu, możemy przygotować dokumentację zgodną z USCG, a wskazany inżynier projektu potwierdzi dokładne dokumenty wymagane przez Twojego prawnika lub sprzedawcę przed rozpoczęciem produkcji.'
    - q: 'Czy mogę odwiedzić fabrykę przed zamówieniem?'
      a: 'Tak. Zakład o powierzchni 12,500 m² w Qingdao jest otwarty dla klientów — wirtualne wycieczki po fabryce można zorganizować online, a wizyty na miejscu prowadzimy przez linie produkcyjne i stacje QC.'
    - q: 'Jak rozpocząć projekt z USA lub Kanady?'
      a: 'Wyślij deskę referencyjną, szkic lub specyfikację. Analiza inżynierska i oferta wracają w ciągu jednego dnia roboczego, a NDA podpisujemy przed jakąkolwiek wymianą plików.'

