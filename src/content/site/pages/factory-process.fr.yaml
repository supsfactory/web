  title: 'Processus de fabrication — de la matière première au SUP'
  description: 'De la matière première au SUP prêt pour la mer : chaque étape du processus de fabrication Afarer sous notre contrôle, de la découpe et du soudage aux essais.'
  dateModified: '2026-08'
