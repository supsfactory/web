hero:
  tagline: Manufacturing Capabilities
  title: 'SUP Manufacturing Capabilities'
  subtitle: 'Every process — hull engineering, drop-stitch core processing, RF welding, printing, mould tooling, assembly, testing and packing — runs in-house in our 12,500 m² Qingdao plant, so one accountable team takes your project from first drawing to shipped container.'

answer:
  label: 'Straight answer'
  text: 'SUP manufacturing is fully in-house at our Qingdao plant: hull design and dimensional engineering at 0.1 mm CNC accuracy; drop-stitch material processing and RF welding across 4 automated lines; graphics printing; EVA pad die-cutting; custom mould tooling (+15–20 days for new shapes); assembly to a 100-point checklist; and 18.0 PSI 24-hour pressure-hold testing with auto-reject above 0.50 PSI drop. Annual capacity is 120,000+ boards (~10,000/month) from 4 specialized workshops with 350+ workers, shipped to 50+ countries under your brand.'
  verified: '2026-09'

