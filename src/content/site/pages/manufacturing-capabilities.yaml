faq_section:
  tagline: FAQ
  title: SUP Manufacturing Capability Questions
  questions:
    - q: Which manufacturing processes are in-house?
      a: 'All core processes are in-house: hull engineering, drop-stitch core processing, RF welding, printing, EVA die-cutting, assembly, testing and packing. Accessories and some raw materials come from certified suppliers; final kitting happens in-house for full traceability.'
    - q: What is your production capacity?
      a: '120,000+ boards per year (around 10,000/month) across 4 automated lines and 4 specialized workshops in a 12,500 m² plant with 350+ workers.'
    - q: What MOQ applies across these capabilities?
      a: 'Standard volume runs 90–100+ units per approved configuration (one 150 m drop-stitch fabric roll); pilot runs start at 20–50 units on existing platforms; logo-only orders from 5–10 units.'
    - q: What lead times should we plan?
      a: 'Prototype samples in 7–12 days; production 25–35 days after confirmed PO and deposit; custom mould development adds 15–20 days for tooling.'
    - q: How do capabilities translate into quality?
      a: 'Each process feeds the 7-stage quality system: a 100-point assembly checklist, 18.0 PSI 24-hour pressure hold with auto-reject above 0.50 PSI drop, ISO 2859-1 Level II sampling and 10-year ERP batch traceability.'

