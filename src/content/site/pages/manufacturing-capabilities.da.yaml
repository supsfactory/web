faq_section:
  tagline: FAQ
  title: Spørgsmål om SUP-produktionskapaciteter
  questions:
    - q: 'Hvilke produktionsprocesser foregår i eget hus?'
      a: 'Alle kerneprocesser foregår i eget hus: skrogkonstruktion, behandling af drop-stitch-kerner, højfrekvenssvejsning, tryk, EVA-stansning, samling, test og pakning. Tilbehør og dele råmaterialer kommer fra certificerede leverandører; den endelige sammensætning sker i eget hus for fuld sporbarhed.'
    - q: 'Hvad er jeres produktionskapacitet?'
      a: '120,000+ brætter om året (cirka 10,000/måned) på 4 automatiserede linjer og 4 specialiserede værksteder i et anlæg på 12,500 m² med 350+ medarbejdere.'
    - q: 'Hvilket minimumsordre gælder på tværs af disse kapaciteter?'
      a: 'Standardvolumen kører 90–100+ stk. pr. godkendt konfiguration (en 150 m drop-stitch-dugrulle); pilotserier starter ved 20–50 stk. på eksisterende platforme; ordrer med kun logo fra 5–10 stk.'
    - q: 'Hvilke leveringstider skal vi planlægge efter?'
      a: 'Prototypeprøver på 7–12 dage; produktion 25–35 dage efter bekræftet PO og depositum; udvikling af specialform medfører 15–20 dage til værktøjet.'
    - q: 'Hvordan omsættes kapaciteterne til kvalitet?'
      a: 'Hver proces føder ind i kvalitetssystemets 7 trin: en tjekliste for samling med 100 punkter, 18.0 PSI trykholdning i 24 timer med automatisk kassering ved trykfald på over 0.50 PSI, stikkprøvning efter ISO 2859-1 niveau II og 10 års ERP-batchsporbarhed.'

