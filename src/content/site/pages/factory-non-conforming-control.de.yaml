nc_intro:
  tagline: Kontrolle nichtkonformer Produkte
  title: Was passiert, wenn ein Produkt die Kriterien nicht erfüllt
  body: |
    Produkte oder Komponenten, die die definierten Abnahmekriterien nicht erfüllen, werden identifiziert und kontrolliert, um unbeabsichtigte Verwendung, Weiterverarbeitung oder Versand zu verhindern. Die anwendbaren Abnahmekriterien basieren auf dem freigegebenen Muster, der technischen Spezifikation, der Grafik, der Stückliste, den Verpackungsanforderungen und dem Projektinspektionsplan.

    Nichtkonforme Artikel werden bewertet, um den betroffenen Umfang und die angemessene Disposition zu bestimmen. Je nach Problem kann der Artikel gehalten, unter kontrollierten Anweisungen nachgearbeitet, ersetzt, zurückgewiesen oder anderweitig über einen freigegebenen Prozess behandelt werden. Nachgearbeitete oder korrigierte Artikel werden vor der Freigabe erneut geprüft. Die Versandfreigabe ist nur nach Abschluss der relevanten Qualitätsaufzeichnungen und Erfüllung der anwendbaren Abnahmekriterien durch das Produkt zulässig.

nc_flow:
  tagline: Standard-7-Schritte geschlossener Kreislauf
  title: Von der Identifikation zur Korrekturmaßnahme
  subtitle: 'Ein kontrollierter Kreislauf für jede Nichtkonformität: identifizieren, sperren, prüfen, nacharbeiten oder ersetzen, nachprüfen, freigeben oder zurückweisen, verbessern.'
  steps:
    - step: '01'
      title: Identifizieren
      desc: 'Jede identifizierte Nichtkonformität wird gegen das betroffene Produkt, die Charge oder Komponente erfasst und gegen die anwendbaren Projektanforderungen bewertet. Die Erkennung kann beim Wareneingang, in der Prozesskontrolle, bei der Endprüfung, beim Verpacken oder bei der Kunden-/Drittinspektion erfolgen.'
    - step: '02'
      title: Sperren
      desc: 'Artikel werden klar identifiziert und unter kontrolliertem Halt oder Quarantänestatus gelegt, um unbeabsichtigte Verwendung, Weiterverarbeitung oder Versand zu verhindern. HOLD / QUARANTINE / REJECTED-Etiketten tragen NCR-Nummer, SKU, Charge, Menge, Fehlerbeschreibung und Datum.'
    - step: '03'
      title: Prüfen
      desc: 'Der betroffene Umfang und die angemessene Disposition werden bewertet: einzelne Einheit, Schichtcharge, vollständige Charge oder mehrere Chargen — über gemeinsame Material-Lots, Grafikrevisionen, Prozessstufen und Dokumentenrevisionen. Zusätzliche Eindämmung oder verschärfte Inspektion wird bei Bedarf angewendet.'
    - step: '04'
      title: Nacharbeit oder Ersatz
      desc: 'Zulässige Nacharbeit folgt freigegebenen Anweisungen, die den betroffenen Artikel, die Methode, die Materialien, die Inspektionspunkte und die Nachprüfanforderungen identifizieren. Nicht genehmigte Änderungen an Produktspezifikation, Grafik, Zubehörkonfiguration oder Verpackung sind niemals erlaubt. Ersatzartikel treten wieder in die anwendbaren Inspektionsgates ein.'
    - step: '05'
      title: Nachprüfen
      desc: 'Nachgearbeitete oder korrigierte Artikel werden gegen die anwendbaren Abnahmekriterien erneut geprüft. Das ursprünglich fehlgeschlagene Merkmal und alle damit verbundenen Merkmale, die von der Nacharbeit potenziell betroffen sind, werden vor der Freigabe verifiziert — durch unabhängige QC und bei Luftdichtigkeitsreparaturen mit einem vollständigen neuen 24h-Drucktestzyklus.'
    - step: '06'
      title: Freigeben oder Zurückweisen
      desc: 'Produkt wird erst nach Abschluss der erforderlichen Nachprüfung freigegeben, wenn autorisiertes Qualitätspersonal die Konformität mit den anwendbaren Projektanforderungen bestätigt. Artikel, die nicht in Konformität gebracht werden können, werden zurückgewiesen, ersetzt, zurückgesendet oder unter kontrollierten Verfahren disponiert — einschließlich begleiteter physischer Zerstörung.'
    - step: '07'
      title: Korrekturmaßnahme
      desc: 'Wiederkehrende, bedeutende oder systemische Nichtkonformitäten werden auf Ursache und Korrekturmaßnahme (CAPA) untersucht. Verbesserungen können Aktualisierungen von Arbeitsanweisungen, Materialkontrollen, Inspektionspunkten, Schulungen, Lieferantenmanagement oder Dokumentenkontrolle umfassen.'

nc_pillars:
  tagline: Säulen des Käufervertrauens
  title: Drei Kontrollen, die Ihre Marke schützen
  subtitle: 'Der Prozess ist um die Fragen aufgebaut, die Überseekäufer tatsächlich stellen: werden Probleme versteckt, läuft Nacharbeit außer Kontrolle, und werden reparierte Boards erneut verifiziert.'
  features:
    - icon: 1
      icon_bg: blue
      title: Nur kontrollierte Anweisungen
      desc: 'Nacharbeit wird strikt durch autorisierte Standard Rework Instructions (SRI) geregelt. Nicht genehmigte Feldänderungen, Änderungen an Spezifikationen oder Modifikationen von Grafiken ohne schriftliche Autorisierung sind strikt verboten.'
    - icon: 2
      icon_bg: green
      title: Unabhängige Nachprüfung
      desc: 'Nachgearbeitete Boards unterziehen sich einer 100 %-Nachprüfung durch QA-Inspektoren gegen die ursprünglichen Abnahmekriterien. Luftdichtigkeitsreparaturen erfordern einen brandneuen, vollständigen 24h-Drucktestzyklus — niemals eine teilweise Nachprüfung.'
    - icon: 3
      icon_bg: purple
      title: Autorisierte Freigabe & Rückverfolgbarkeit
      desc: 'Die Versandfreigabe ist ausschließlich nach vollständiger NCR-Dokumentation und autorisierter QC-Freigabe zulässig, wobei der Chargenstatus von HOLD auf RELEASED wechselt. Systemische oder wiederkehrende Abweichungen lösen automatisch CAPA-Workflows zur Ursachenanalyse aus.'

