faqs:
  tagline: FAQ
  title: FAQ zu Qualität & Fehlerkontrolle für globale Käufer
  items:
    - q: 'Wie garantieren Sie, dass nachgearbeitete Boards die vollständigen Sicherheitsstandards erfüllen?'
      a: 'Jedes nachgearbeitete Board wird wie eine neue Einheit behandelt und muss denselben vollständigen Testzyklus von Null durchlaufen — bei Luftdichtigkeitsreparaturen einen vollständigen 24h-Drucktest. Unabhängige QC-Inspektoren, nicht die Nacharbeitsoperatoren, führen die Freigabevalidierung durch.'
    - q: 'Wird die Fabrik Boards mit leichten kosmetischen Abweichungen versenden, ohne uns zu informieren?'
      a: 'Niemals. Jede Abweichung, die kundenfreigegebene Golden Samples, Logografiken, Farbvarianten oder Verpackung betrifft, erfordert eine formelle schriftliche Konzessionsvereinbarung, die der Kunde vor der Versandfreigabe unterzeichnet.'
    - q: 'Was passiert, wenn ein nachgearbeitetes Board die Nachprüfung nicht besteht?'
      a: 'Das Board wird nicht freigegeben. Es kehrt zu einer neuen Dispositionsprüfung zurück, und wenn es nicht in Konformität gebracht werden kann, wird es unter dem begleiteten Schrottprotokoll ersetzt, zurückgewiesen oder zerstört. Wiederholtes Versagen derselben Fehlerklasse löst CAPA zur Ursachenanalyse aus.'
    - q: 'Können fehlerhafte Boards als Fabrik-Sekundenartikel oder über andere Kanäle verkauft werden?'
      a: 'Nein. Nicht nacharbeitbare Boards außerhalb der Spezifikation werden unter dem begleiteten Schrottprotokoll physisch zerstört — Beschläge abgeschert, Kern und Rails durchtrennt, Video mit SHA-256-Hash aufgezeichnet und für mindestens 5 Jahre archiviert. Das Schrott- & Zerstörungszertifikat wird vom QA-Direktor und Werksleiter unterzeichnet.'
    - q: 'Wie wird der betroffene Umfang bewertet, wenn ein Fehler gefunden wird?'
      a: 'Der Umfang wird nach Produktidentifikation, Produktionscharge, Material- oder Komponentencharge, Prozessstufe und anwendbarer Dokumentenrevision geprüft. Wenn dasselbe Material-Lot, dieselbe Grafikrevision oder dieselbe Arbeitsstation betroffen ist, werden betroffene Produkte entsprechend eingeschlossen und geprüft.'
    - q: 'Benötigen wir Ihre Zustimmung, bevor eine Konzession erteilt wird?'
      a: 'Ja. Jede Abnahme unter einer dokumentierten Konzession, die Kundenanforderungen betrifft — freigegebene Muster, Spezifikation, Grafik, Verpackung oder Abnahmekriterien — erfordert die schriftliche Kundenfreigabe vor der Freigabe. Ohne diese wird das Produkt gemäß der ursprünglichen Anforderung nachgearbeitet, ersetzt oder zurückgewiesen.'
    - q: 'Welche Dokumentation erhalten wir bei einer Nichtkonformität?'
      a: 'Der NCR-Datensatz umfasst NCR-Nummer, Erkennungsstufe, Produkt/SKU, Charge, anwendbare Dokumentenrevisionen, Fehlerbeschreibung, Eindämmung, Disposition, Referenz der Nacharbeitsanweisung, Nachprüfergebnis und Freigabe- oder Abschlussfreigabe — verfügbar gemäß Ihrer Projektqualitätsvereinbarung.'

