nc_severity:
  tagline: Fehlerschweregrad & Befugnis
  title: Schweregradklassifizierung & Dispositionsbefugnis
  subtitle: Nicht jede Nichtkonformität wird auf derselben Ebene behandelt — die Dispositionsbefugnis skaliert mit dem Fehlerschweregrad, von der Freigabe auf Linienebene bis zum Material Review Board und zur Kundenzustimmung.
  headers:
    severity: Schweregrad
    examples: Typische Beispiele
    authority: Dispositionsbefugnis & Kontrolle
    control: Freigabebedingung
  rows:
    - severity: 'Leicht'
      examples: 'Kartonkantenfalz, leichte nicht-kritische Zubehörfehlausrichtung'
      authority: 'Vor-Ort-Freigabe durch QC-Leitung der Sektion + Linienvorgesetzter, Ersatz oder Freigabe'
      control: 'Im NCR erfasst; keine Auswirkung auf Produktfunktion oder Kundenanforderungen'
    - severity: 'Schwer'
      examples: 'Langsames Ventilleck, EVA-Fehlausrichtung außerhalb der Toleranz (>2 mm), fehlendes Zubehör'
      authority: 'QC-Manager + Technischer Ingenieur erteilen eine kontrollierte Nacharbeitsanweisung (SRI)'
      control: '100 % unabhängiger Neukonformance-Test der ursprünglich fehlgeschlagenen und betroffenen Merkmale vor der Freigabe'
    - severity: 'Kritisch'
      examples: 'Drop-Stitch-Kammerschaden, Railblase oder Riss unter hohem Druck, Kundenlogo-Fehldruck oder Farbabweichung'
      authority: 'Entscheidung des Material Review Board (MRB); schriftliche Kundenzustimmung wo erforderlich'
      control: 'Keine Freigabe ohne autorisierte Zustimmung; ansonsten verbindliche begleitete physische Zerstörung'

nc_matrix:
  tagline: Engineering-Protokollmatrix
  title: SUP-Fehlerdispositions- & Nachprüfmatrix
  subtitle: Standard-Engineering-Protokolle, die auf die häufigsten Fertigungsabweichungen angewendet werden — dieselben quantifizierten Parameter, die Kunden während Audits verifizieren können.
  headers:
    defect: Fehlerkategorie
    protocol: Kontrolliertes Dispositionsprotokoll
    validation: Unabhängige Nachprüfung & Validierung
  rows:
    - defect: 'Langsames Ventilleck'
      protocol: 'Board isolieren. Ventilkern mit kalibriertem Drehmomentwerkzeug (25 N·m) demontieren, Innengewinde reinigen, Silikon-O-Ring ersetzen und erneut festziehen.'
      validation: 'In Seifenlösung eintauchen; auf 18 PSI aufblasen und vollständigen 24h-Druckabfalls-Neutest durchführen (ΔP ≤ 0.05 PSI).'
    - defect: 'Luftblasen in der Railnaht'
      protocol: 'Schichtcharge sperren. Blasenbereich mit wärmeunterstützter Düse delaminieren, Oberfläche lösungsmittelreinigen, zweikomponentigen PU-Klebstoff unter 5 bar Druck auftragen.'
      validation: '100 % Nahtsicht- und Tastprüfung; strukturelle Proof-Druckprüfung (18.0 PSI) plus 24h-Luftdichtheitshalt.'
    - defect: 'EVA-Pad-Fehlausrichtung'
      protocol: 'Wärmeunterstütztes Abziehen mit temperaturreguliertem Werkzeug (80°C). Neuausrichtung mit präziser Acryl-Positionierschablone.'
      validation: 'Verifizierung der Spaltfertigungstoleranz (≤ ±1.5 mm), Diamantmuster-Symmetrieprüfung, 100 % Kantenhaftungstest.'
    - defect: 'Branding-/Logotippfehler'
      protocol: 'Sofortiger Drucklinienstopp. Alle bedruckten Paneele anhalten. Vektorrevision mit dem Kunden prüfen; null nicht genehmigte Änderungen.'
      validation: 'Spektralphotometer-Farbprüfung (ΔE ≤ 1.5); 100 % Sichtprüfung der Textausrichtung gegen die vom Kunden unterzeichnete Vektor-Master-PDF.'
    - defect: 'Verpackungsabweichung / fehlende SKU'
      protocol: 'Exportpalette sperren. Auspacken und 100 % Positionsprüfung gemäß BOM durchführen (Pumpe, Finne, Leash, Paddel, Reparaturrohr).'
      validation: 'Inline dynamische elektronische Kontrollwaagen-Validierung (±30 g Varianz); optische 2D-Barcodescanner-Verifizierung.'

nc_scrap:
  tagline: Null Marktleckage
  title: Begleitete Verschrottung & Zerstörung — Null-Fehler-Antidiversionsprotokoll
  body: |
    Überseeische Markenpartner brauchen Gewissheit, dass fehlerhafte Boards niemals in den Zweiteinzelhandel, graue Märkte oder E-Commerce-Kanäle gelangen. Boards, die nicht in Konformität gebracht werden können, werden unter einem begleiteten, aufgezeichneten Protokoll zerstört:

    **1. Beschlag- & Zubehörabscheren.** Unter Aufsicht des QA-Direktors entfernt eine hydraulische Schere alle D-Ringe aus 316er-Edelstahl, Tragegriff-Gurte und Gepäckschnallen. Die Aufblasventilbaugruppe und der Finbox-Sockel (US-Box / Einrastfinne) werden an der Boardwurzel herausgeschnitten, wodurch alle wiederverwertbaren Komponenten eliminiert werden.

    **2. Drop-Stitch-Schlitzen & Railsektionierung.** Der interne Drop-Stitch-Kern wird durch Board und Deck mit tiefen kreuzweisen Schnitten (≥ 50 cm pro Schnitt) durchgetrennt, und die verstärkten Seitenrails werden in mindestens 4 Segmenten durchtrennt — wodurch Versiegelungsfähigkeit und Auftrieb dauerhaft zerstört werden.

    **3. Video- & Fotovault.** Die Zerstörung wird als ungeschnittenes 1080p-Video mit Nahaufnahmen des Serienbarcodes, des Abscherens, des Kernschützens und des endgültigen gewogenen Schrotthaufens aufgezeichnet. Das Video wird gehasht (SHA-256) und für ≥ 5 Jahre auf einem kontrollierten Server archiviert.

    **4. Zertifizierte Abfallentsorgung.** Alle PVC- und Drop-Stitch-Fragmente werden gewogen, im Ausgangsbuch erfasst und nur von qualifizierten Polymer-Recycling-Partnern transportiert — kein Reststoff verlässt die Anlage über andere Kanäle.

    > **Markenschutzgarantie:** QINGDAO VATRAD GROUP CO., LTD. garantiert die 100 %-Zerstörung nicht nacharbeitbarer, außerhalb der Spezifikation liegender Wasserfahrzeuge. Null Fabrik-Sekundenartikel oder kompromittierte Boards werden jemals in Zweiteinzelhandel, graue Märkte oder E-Commerce-Kanäle gelangen. Das Schrott- & Zerstörungszertifikat (VAT-QA-SCRAP-CERT-2026) dokumentiert Produkt, Charge, MRB-Schlussfolgerung, Zeugenfotos und die doppelte Zeichnung durch QA-Direktor und Werksleiter.

