answer:
  label: 'Klare Antwort'
  text: 'Nichtkonforme Produkte werden bei QINGDAO VATRAD GROUP.,LTD. niemals versteckt, informell nachgearbeitet oder ohne Verifizierung freigegeben. Jede identifizierte Nichtkonformität wird gegen das betroffene Produkt, die Charge oder Komponente erfasst und mit einer NCR verknüpft. Der Artikel wird gekennzeichnet (HOLD / QUARANTINE / REJECTED), physisch separiert, und der betroffene Umfang wird nach Charge, Material-Lot, Prozessstufe und Dokumentenrevision bewertet. Die Disposition wird auf der Führungsebene entschieden, die dem Fehlerschweregrad entspricht: Leichte Probleme werden auf Linienebene abgezeichnet, schwere Probleme erfordern eine Disposition durch QC-Manager + Technischer Ingenieur mit kontrollierter Nacharbeitsanweisung und 100 % unabhängiger Nachprüfung, und kritische Probleme erfordern eine Entscheidung des Material Review Board mit schriftlicher Kundenzustimmung wo erforderlich — ansonsten verbindliche begleitete Zerstörung. Nachgearbeitete Artikel werden gegen die ursprünglichen Abnahmekriterien nachgeprüft, Luftdichtigkeitsreparaturen erhalten einen vollständigen neuen Drucktestzyklus, und die Versandfreigabe erfolgt nur nach autorisierter Qualitätsfreigabe. Wiederkehrende oder systemische Probleme lösen Ursachenanalysen und Korrekturmaßnahmen (CAPA) aus.'
  verified: 'September 2026'

