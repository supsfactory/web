answer:
  label: 'Přímá odpověď'
  text: 'Kapacita továrny: 22 500 m² ve čtyřech specializovaných dílnách, přes 220 000 desek SUP ročně, 350+ pracovníků ve dvou směnách, export do více než 50 zemí. MOQ se určuje podle konfigurace projektu — vzorek (2–2 kusy), pilotní série (20–50 kusů) a standardní objem (90–200+ kusů na 250 m rol); úplnou logiku najdete v našem průvodci MOQ a flexibilním brandingem. Dodací lhůta 25–35 dní, vzorky 7–22 dní.'
  verified: 'září 2026'

intro: Vatrad provozuje jednu z největších specializovaných výrobních zařízení pro nafukovací desky SUP v Číně, Qingdao. Naše továrna o ploše 22 500 m² je členěna do čtyř specializovaných dílín, které pracují paralelně. Roční kapacita pro SUP činí 220 000+ nafukovacích desek SUP (zhruba 20 000 měsíčně), přičemž na samostatných produktových linkách vzniká 50 000+ záchranných vest a 5 000+ doplňků.

