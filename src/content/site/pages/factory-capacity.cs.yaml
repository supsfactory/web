workshops:
  - title: Výroba desek SUP
    description: '4 automatizované montážní linky pro nafukovací desky SUP s celkovým výstupem zhruba 20 000 desek měsíčně. Pracovní stanice digitálního a sítliskového tisku běží souběžně. Roční kapacita pro SUP: 220 000+ desek.'
    output: '220 000+ SUP/rok'
  - title: Výroba desek SUP — rozšířovací linky
    description: 'Další automatizované montážní linky pro desky SUP, zapojované s růstem objemu. Pracovní stanice pro spojování jádra drop-stitch, digitální tisk a montáž běží souběžně.'
    output: 'Součást roční kapacity 220 000+ desek SUP'
  - title: Doplňky pro SUP a smíšená montáž
    description: 'Víceúčelové montážní linky pro doplňky k SUP — pádla, žebra, leash, tašky a sady. Stanice horkovzdušného svařování, vysokofrekvenční dielektrické lisy a montážní pracoviště se přestavují podle skladby objednávek. Roční kapacita doplňků: 5 000+ kusů.'
    output: '5 000+ doplňků/rok'
  - title: Bezpečnostní vybavení
    description: 'Samostatná čistá výrobní plocha pro záchranné vesty a bezpečnostní vybavení. Specializované stanice šití, vkládání pěnové výplně a zkoušek. Roční kapacita záchranných vest: 50 000+ kusů.'
    output: '50 000+ záchranných vest/rok'

oem_capacity:
  moq: 'SUP: vzorek 2–2 | pilotní 20–50 | objem 90–200+ (na 250 m rol)'
  lead_time: 'Standardně 25–35 dní. Vzorek 7–22 dní. Možno i expresně.'
  payment: 'T/T 30% záloha + 70% zbytek. Akceptujeme L/C, Western Union.'

lead_time_explainer:
  tagline: 'Plánování a časování'
  title: 'Jak se kapacita promítá do Vašeho dodání'
  subtitle: 'Kapacita není jedno číslo — zde je, jak se dodací lhůty ve skutečnosti rozdělují.'
  items:
    - title: 'Kapacita závisí na Vaší specifikaci'
      body: 'Dostupná okna se posouvají podle typu desky, složitosti konstrukce, obalů a sezónní poptávky. V jarním a letním nárůstu běží linky téměř naplno a okna pro vzorky se obsazují jako první.'
    - title: 'Plánujte před sezonou svého uvedení'
      body: 'Potvrzení vzorku a zmrazení grafiky si ukotvěte brzy. Opakované objednávky se naplánují do dohodnutého pravidelného okna, jakmile je referenční vzorek archivován.'
    - title: 'Tři plánovací proudy'
      body: 'Vzorky vstupují nejdříve na prototypovou linku, první objednávky se zařazují do nejbližšího volného montážního okna a opakované objednávky běží ve svém pravidelném okně.'
    - title: 'Jasná dodací lhůta po posouzení'
      body: 'Pevnou dodací lhůtu potvrzujeme až po posouzení specifikace, grafiky, obalů a množství — nikdy předem jako pevný závazek.'

cta:
