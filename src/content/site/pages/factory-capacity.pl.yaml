workshops:
  - title: Produkcja desek SUP
    description: '4 zautomatyzowane linie montażu nadmuchiwanych desek SUP o łącznym wyprowadzeniu około 10,000 desek miesięcznie. Stacje druku cyfrowego i sitograficznego działają równolegle. Roczna zdolność SUP: ponad 120,000 desek.'
    output: 'Ponad 120,000 desek SUP/rok'
  - title: Produkcja desek SUP — linie rozszerzenia
    description: 'Dodatkowe zautomatyzowane linie montażu desek SUP uruchamiane wraz ze wzrostem wolumenu. Stacje laminowania rdzenia drop-stitch, druku cyfrowego i montażu działają równolegle.'
    output: 'Część rocznej zdolności 120,000+ desek SUP'
  - title: Akcesoria SUP i montaż mieszany
    description: 'Wielofunkcyjne linie montażu akcesoriów SUP — wiosła, płetwy, smycze, worki i zestawy. Stanowiska zgrzewania gorącopowietrznego, prasy dielektryczne HF i stanowiska montażowe są przestawiane zależnie od struktury zamówień. Roczna zdolność akcesoriów: ponad 5,000 sztuk.'
    output: 'Ponad 5,000 akcesoriów/rok'
  - title: Sprzęt bezpieczeństwa
    description: 'Odrębna hala produkcyjna o podwyższonym standardzie czystości dla kamizelek ratunkowych i sprzętu bezpieczeństwa. Dedykowane stanowiska szycia, wkładania pianki i badań. Roczna zdolność produkcji kamizelek: ponad 50,000 sztuk.'
    output: 'Ponad 50,000 kamizelek/rok'

oem_capacity:
  moq: 'SUP: próbka 1–2 | pilotażowa 20–50 | wolumen 90–100+ (na rolkę 150 m)'
  lead_time: 'Standardowo 25–35 dni. Próbka 7–12 dni. Możliwa ekspresowa realizacja.'
  payment: 'T/T 30% zaliczki + 70% pozostałości. Akceptujemy L/C i Western Union.'

lead_time_explainer:
  tagline: 'Planowanie i harmonogram'
  title: 'Jak zdolność produkcyjna przekłada się na Twoją dostawę'
  subtitle: 'Zdolność produkcyjna to nie jedna liczba — oto jak w praktyce przydzielamy terminy realizacji.'
  items:
    - title: 'Zdolność zależy od Twojej specyfikacji'
      body: 'Dostępne terminy zmieniają się wraz z typem deski, złożonością konstrukcji, opakowaniem i sezonowym popytem. Wiosenno-letnie wzmożenie produkcji oznacza, że linie pracują niemal na pełnej mocy, a miejsca na próbki znikają najszybciej.'
    - title: 'Zaplanuj przed sezonem premiery'
      body: 'Zablokuj potwierdzenie próbki i zamrożenie projektu graficznego wcześnie. Zamówienia powtarzalne trafiają do uzgodnionego cyklicznego terminu, gdy próbka wzorcowa jest już w archiwum.'
    - title: 'Trzy ścieżki harmonogramu'
      body: 'Próbki wchodzą najpierw na linię prototypową, pierwsze zamówienia zajmują najbliższe wolne okno montażowe, a zamówienia powtarzalne realizowane są w swoim cyklicznym terminie.'
    - title: 'Wiążący termin po przeglądzie'
      body: 'Potwierdzamy wiążący czas realizacji dopiero po przeglądzie specyfikacji, projektu graficznego, opakowania i ilości — nigdy jako stałą obietnicę z góry.'

cta:
  title: 'Sprawdź dostępność produkcji na swój termin premiery'
  subtitle: 'Wyślij typ deski, ilość i docelową datę wysyłki — odpowiemy najbliższym wolnym terminem produkcyjnym i szacunkowym czasem realizacji.'
