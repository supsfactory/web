hero:
  tagline: 'Guia de construção'
  title: 'Comparação das construções SUP'
  subtitle: 'Três tipos de construção, uma única linha de produção. Compreende os compromissos entre rigidez, peso, durabilidade e custos do PVC monofolha, do PVC de dupla camada e do núcleo drop-stitch — e qual se adapta ao teu rider-alvo e ao teu posicionamento de mercado.'

answer:
  label: 'Comparação rápida'
  text: 'O PVC monofolha é o mais leve e económico — ideal para riders ocasionais e mercados sensíveis ao preço. O PVC de dupla camada acrescenta uma segunda película em PVC para rigidez e durabilidade a peso moderado — a escolha padrão do setor para frotas de aluguer e modelos de gama média. O núcleo drop-stitch com revestimento em PVC oferece a máxima rigidez e tolerância à pressão — preferido para performance, surf e riders pesados. Todas as três construções são produzidas na mesma linha com os mesmos gates QC; a diferença está nos materiais e nos passos de laminação.'
  verified: 'September 2026'

