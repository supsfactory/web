      link_label: 'Desenvolvimento de pranchas performance'
      href: /pt/odm-manufacturing

key_factors:
  heading: 'Fatores importantes além do tipo de construção'
  body: |
    O tipo de construção é uma variável da prestação da prancha. Outros três fatores são igualmente importantes ou mais:

    - **Densidade do drop-stitch** — Os fios por polegada determinam o quão uniformemente a prancha mantém a sua forma sob pressão. Usamos padrões de 96 fios/polegada e 140 fios/polegada para as builds performance. Densidade maior = prancha mais plana = melhor deslize.
    - **Qualidade e espessura do PVC** — Nem todo o PVC é igual. O PVC de 0.7 mm importado da Coreia tem uma resistência ao rasgamento e uma proteção UV superiores às alternativas mais finas. Especificamos a qualidade do material por projeto.
    - **Construção das rails** — As rails monofolha são o ponto de rotura mais comum nas pranchas económicas. As rails de dupla camada e o rail tape reforçado reduzem drasticamente o risco de perfurações das rails. Todas as nossas pranchas usam rails reforçadas independentemente do nível de construção.

faqs:
  tagline: FAQ
  title: 'Construção SUP — Perguntas frequentes'
  items:
    - q: 'Qual tipo de construção devo escolher para a minha marca?'
      a: 'Depende do teu mercado-alvo e do posicionamento de preço. Entry-level e grande distribuição: monofolha. Frotas de aluguer, associações e marcas médias: dupla camada. Performance, tour e premium: núcleo drop-stitch. A maioria das marcas começa pela dupla camada como melhor compromisso entre custo, durabilidade e experiência de condução. Aconselhamos com base no teu mercado específico durante a verificação de viabilidade.'
    - q: 'Posso oferecer vários níveis de construção sob uma única marca?'
      a: 'Sim — muitas marcas oferecem dois ou três níveis. Produzimos todas as três construções na mesma linha com os mesmos gates QC, para que possas misturar os tipos de construção dentro de uma única encomenda. A forma do casco e as gráficas podem ser idênticas em todos os níveis; mudam apenas construção e materiais.'
    - q: 'Qual padrão de teste de pressão vale para todas as construções?'
      a: 'Cada prancha, independentemente do tipo de construção, ultrapassa um teste de estanquicidade a 18.0 PSI com rejeição automática numa queda de pressão superior a 0.50 PSI em 24 horas. As pranchas monofolha são projetadas para 12–15 PSI de pressão de condução, as de dupla camada para 15–18 PSI e as de núcleo drop-stitch para 18–25 PSI. A pressão de teste ultrapassa a pressão nominal de todos os tipos.'
    - q: 'De que forma a construção incide nos pedidos de garantia?'
      a: 'As pranchas monofolha têm uma taxa de pedidos de garantia ligeiramente mais alta no uso comercial/de aluguer devido a rails e perfurações. As construções de dupla camada e de núcleo drop-stitch têm taxas de pedidos claramente inferiores. Fornecemos dados de garantia por nível extraídos dos nossos registos de produção durante a fase de proposta.'

