hero:
  tagline: Teknoloji
  title: Performans İçin Üretilmiş
  subtitle: 'Vatrad marka her şişirilebilir SUP, drop stitch yapı ve deniz sınıfı PVC ile tasarlanır — zorlu deniz ortamları için test edilmiş hassas malzemeler ve üretim yöntemleri.'

sections:
  - title: Drop Stitch Çekirdek
    description: 'Binlerce iç polyester iplik üst ve alt katmanları birbirine bağlayarak 12-15 PSI seviyesinde rijit bir yapı oluşturur. Bu, profesyonel paddle boardlarda ve şişirilebilir yarış SUPlerinde kullanılan aynı teknolojidir.'
    imageAlt: DS Çekirdek Şeması
  - title: Deniz Sınıfı PVC
    description: 'Deniz ortamları için sınıflandırılmış çok katmanlı laminasyonlu PVC kumaş. Her katman yapıştırılmak yerine füzyon kaynaklıdır; bu da ayrışma riskini ortadan kaldırır. UV dayanımı, tuzlu su korozyonu ve aşınmaya karşı test edilmiştir.'
    imageAlt: PVC Katman
  - title: Askeri Sınıfı PVC
    description: 'Tüm SUP modellerinde kullanılan premium PVC, üstün UV ve kimyasal dayanım sağlar. Aşırı sıcaklık koşullarında esnekliğini korur ve bozulmaya karşı direnç gösterir.'
    imageAlt: PVC
  - title: Hava Destekli Zemin
    description: 'Ayakta durma, balık tutma ve yoga için olağanüstü rijitlik sağlayan yüksek basınçlı şişirilebilir drop stitch yapı. Kurulum süresini, toplam ağırlığı ve depolama hacmini azaltır.'
    imageAlt: Hava Desteği

