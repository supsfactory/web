meta:
  title: 'Teknoloji — Drop Stitch ve Deniz PVC | {SITE}'
  description: 'Vatrad teknolojileri: drop stitch yapı, deniz PVC, çift katmanlı üretim ve yüksek basınç. Profesyonel şişirilebilir SUP üreticisinden gelen yenilik.'
  dateModified: '2026-08'
  keywords:
    - 'sup teknolojisi'
