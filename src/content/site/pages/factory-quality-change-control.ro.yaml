cc_validation:
  tagline: Validare de inginerie
  title: 'Protocol de validare și acceptare — dovezi în loc de afirmații'
  body: |
    Formulări vagi de acceptare precum *„placa reparată trebuie să fie bună”* nu sunt acceptate. Formularea controlată este:

    > „Mostra reprocesată trebuie să respecte aceleași criterii aplicabile de etanșeitate la aer, calitate a execuției vizuale, funcționare a supapei și acceptare specifice proiectului ca o placă conformă, cu excepția situației în care o abatere aprobată de client definește explicit un criteriu alternativ.”

    Dovezile de validare sunt cantitative, iar reperul de inginerie pentru reprocesarea etanșeității la aer include:

    - **Eliminarea scurgerii și menținerea presiunii.** Scurgerea inițială este eliminată, fără bule persistente la detecția cu soluție apă-săpun; placa menține presiunea standard de încercare de 18.0 PSI timp de 24 de ore, cu scădere netă de presiune ΔP ≤ 0.2 PSI după compensarea temperaturii și umidității — reperul mai strict pentru validarea reprocesării, distinct de pragul de respingere automată de 0.50 PSI aplicat la acceptarea finală pe linia de producție.
    - **Funcționarea supapei.** Cuplul miezului supapei respectă specificația de 15–20 N·m, fără microscurgeri la etanșare sub umflare la presiune ridicată și apăsare dinamică.
    - **Lipirea cusăturii și durabilitate.** Marginile de lipire nu prezintă desprindere, albitură sau delaminare; după ciclurile de îmbătrânire la căldură și umiditate, stratul de adeziv nu prezintă înmuiere sau fisurare fragilă.
    - **Aspect și calitate a execuției.** Fără urme de scurgere a adezivului, fără deteriorare a padscai EVA, fără deformarea plăcii și fără deplasarea logo-ului sau zgârieturi ale suprafeței tipărite.

cc_engineering:
  tagline: Matricea de execuție de inginerie
  title: 'Parametri cuantificați pentru cele patru procese de reprocesare de bază'
  subtitle: 'Fiecare proces de reprocesare controlat are parametri, metodologie și criterii de acceptare definite — aceleași valori pe care operatorii noștri le urmează și pe care clienții le pot verifica în cadrul auditurilor.'
  headers:
    process: Proces de reprocesare
    parameters: Parametri controlați
    methodology: Metodologie de încercare
    acceptance: Criterii de acceptare
  rows:
    - process: 'Repararea găurilor de ac / micro-scurgeri prin păturare'
      parameters: 'Curățare cu solvent și uscare 3–5 min; activare cu aer cald 60°C ± 5°C; rolă de presiune ≥ 0.4 MPa'
      methodology: 'Umflare la 18 PSI; imersie completă în apă sau aplicare de soluție săpunoasă; observare timp de 10 minute'
      acceptance: 'Zero bule emise; decojire la 180° a marginii fără desprindere și fără urme de scurgere a adezivului'
    - process: 'Relipirea benzilor de margine / a cusăturilor'
      parameters: 'Raportul adezivului bicomponent strict controlat; mediu 22–28°C, ≤ 65% RH; fixare în menghină ≥ 4 h'
      methodology: 'Încercare de suprapresiune la 22 PSI timp de 2 h; apoi polimerizare în cameră termică la 50°C timp de 6 h și 2 h de repaus la temperatura camerei'
      acceptance: 'Zero desprinderi, zero fisurări; scădere netă de presiune ΔP ≤ 0.1 PSI; strat de adeziv fără albitură sau îmbarcăcire'
    - process: 'Slăbirea bazei supapei / micro-scurgere'
      parameters: 'Cuplu cu cheie dedicată 18–20 N·m; garnitură de etanșare plană, fără deformare; confirmarea curățeniei filetelor'
      methodology: 'Umflare la 15 PSI; 20 de cicluri de umflare/deflare; observare prin imersie în apă'
      acceptance: 'Zero bule la miezul supapei și la periferia bazei; cuplu după ciclare ≥ 16 N·m'
    - process: 'Încercarea finală de menținere a presiunii pe 24h'
      parameters: 'Umflare de referință 18.0 PSI; manometru digital Clasa 1.0 / ±0.5%; temperatura și umiditatea ambiantă înregistrate și compensate'
      methodology: 'Înregistrator digital de presiune; curbă continuă a presiunii pe 24 h'
      acceptance: 'Scădere netă de presiune ΔP ≤ 0.20 PSI / 24 h după compensare; fără deformarea sau umflarea plăcii'

cc_photos:
  tagline: În hala de producție
  title: 'Refacere, retestare, eliberare — documentate la fiecare pas'
  subtitle: 'Fotografii din atelierul nostru din Qingdao arată fiecare proces de reprocesare controlat, împreună cu mijloacele de măsurare calibrate, parametrii definiți și înregistrările de la locul lor — aceleași dovezi pe care inspectorii le pot solicita în orice moment.'
  grid: 'sm:grid-cols-2'
  features:
    - image: https://assets.isupfactory.com/site/quality/cc-pinhole-repair.avif
      alt: Tehnician care repară o gaură de ac, adică o microscurgere, pe o placă SUP gonflabilă, cu ajutorul unui pistol cu aer cald și al unei role de presiune
      title: Repararea găurilor de ac
      desc: 'Un tehnician tratează o microscurgere marcată cu ajutorul unui pistol cu aer cald setat la specificația de 60°C și al unei role de presiune; apa cu săpun confirmă locul scurgerii, iar tichetul ECR semnat de QA aflat pe banc de lucru indică poarta de control al modificărilor (Poka-Yoke nr. 1).'
    - image: https://assets.isupfactory.com/site/quality/cc-rail-seam-bonding.avif
      alt: Tehnician care aplică adeziv PU bicomponent pe o cusătură de margine cu o pensulă de precizie, într-un climat controlat
      title: Lipirea cusăturii marginii
      desc: 'Adezivul PU bicomponent este aplicat pe cusătura marginii cu o pensulă de precizie, în timp ce placa este ținută într-o menghină de fixare; termohigrometrul de la locul lor indică fereastra controlată de 24°C / 55% RH.'
    - image: https://assets.isupfactory.com/site/quality/cc-valve-base-integrity.avif
      alt: Cheie dinamometrică digitală setată la 19 N·m, care fixează miezul supapei pe materialul drop-stitch
      title: Integritatea bazei supapei
      desc: 'O cheie dinamometrică digitală setată la specificația de 19 N·m realizează strângerea finală a miezului supapei, etanșând baza pe materialul drop-stitch — mijlocul de măsurare poartă eticheta verde CALIBRAT.'
    - image: https://assets.isupfactory.com/site/quality/cc-pressure-hold-testing.avif
      alt: Plăci SUP gonflabile finite conectate la înregistrătoare digitale de presiune, în zona de încercare finală de menținere a presiunii
      title: 'Încercarea finală de menținere a presiunii'
      desc: 'Plăcile finalizate sunt conectate la înregistrătoare digitale de presiune de înaltă precizie; manometrul de referință indică valoarea de 18.00 PSI, iar toate datele de încercare sunt încărcate automat și asociate sistemului contractual de trasabilitate.'

cc_pokayoke:
  tagline: Măsuri de prevenire a erorilor
  title: 'Poka-Yoke: blocaje care opresc modificările necontrolate'
  subtitle: Standardul este aplicat nu doar prin proceduri, ci și prin blocaje fizice și de sistem care fac imposibilă executarea modificărilor necontrolate.
  features:
    - icon: 1
      icon_bg: blue
      title: 'Poartă ECR pentru deblocarea sculei'
      desc: 'Posturile de reprocesare citesc un cod de barej ECR semnat de QA înainte de deblocarea supapelor pneumatice de umflare și a malaxatoarelor de lipici. Fără o înregistrare de control al modificărilor aprobată, fără alimentare — semnătura retroactivă („mai întâi modificăm, apoi semnăm”) este blocată fizic.'
    - icon: 2
      icon_bg: green
      title: 'Expirarea automată a abaterilor temporare'
      desc: 'Abaterile temporare au un plafon rigid în sistem (de exemplu, maximum 50 de plăci sau 7 zile calendaristice). Atingerea plafonului blochează lotul și împiedică tipărirea etichetei de trecere a expediției până la evaluarea formală a modificării.'
    - icon: 3
      icon_bg: purple
      title: 'Dovezi minime de validare'
      desc: 'Modificările cu risc ridicat necesită cel puțin 5 plăci probă reprezentative, care acoperă limitele superioară și inferioară de toleranță, inspectate integral de 2 inspectori de control al calități independenți, înainte de emiterea unui raport de validare — o singură placă reparată nu este niciodată tratată drept validare de proces.'
    - icon: 4
      icon_bg: orange
      title: 'Control documentar „unu intrat, unu ieșit”'
      desc: 'Fișele de post de lucru depășite sunt colectate fizic și anulate (perforate) înainte de emiterea celei noi, marcate cu sigiliul roșu controlat — versiunile veche și cele noi nu coexistă niciodată la același post de lucru.'

