cc_intro:
  tagline: 'Domeniu și politică'
  title: Principii fundamentale de guvernanță
  body: |
    **Document:** QMS-SOP-QC-CC-001 — *Standard de control al modificării parametrilor procesului de reprocesare* (Rev 2.0, Versiune Oficială). **Producător:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Referință standard:** ISO 9001:2015 Sisteme de management al calității.

    - **Nicio modificare necontrolată.** Modificările parametrilor de reprocesare trebuie să parcurgă controlul formal al modificărilor. Operatorii de pe teren, șefii de tură sau un departament individual nu au voie niciodată să modifice parametri de reprocesare aprobați prin acord verbal sau prin adnotări scrise de mână pe o fișă de reprocesare.
    - **Acoperire integrală a elementelor.** Domeniul controlat cuprinde etanșeitatea la aer, scaunele supapelor, benzile de margine, lipirea cusăturilor, polimerizarea cu aer cald și încercarea de menținere a presiunii — fiecare parametru care poate influența etanșeitatea, durabilitatea structurală, aspectul, acceptarea de către client sau trasabilitatea.
    - **Limita inferioară impusă de client.** Orice modificare care îndepărtează produsul de la mostra, specificația tehnică, lista de materiale, grafica, cerința de ambalare sau criteriile de acceptare aprobate de client este implementată numai cu acordul scris al clientului. Fără acesta, placa este reprocesată conform cerinței inițiale, înlocuită sau respinsă — niciodată „relaxată” de fabrică pe cont propriu.

cc_scope:
  tagline: Clasificarea riscului
  title: 'Domeniul modificării și clasificarea riscului'
  subtitle: 'Orice element dintre cele de mai jos declanșează controlul formal al modificărilor — nu este tratat niciodată prin notarea în fișa de reprocesare. Nivelul de risc stabilește cine aprobă și câtă validare este necesară.'
  headers:
    category: Categorie de modificare
    examples: Exemple tipice
    risk: Risc
    requirements: Cerințe de control și aprobare
  rows:
    - category: 'Materiale de reprocesare'
      examples: 'Adeziv, solvent de curățare, material de păturare, etanșare a supapei, primer sau schimbare de furnizor'
      risk: 'Ridicat'
      requirements: 'Analiză interdepartamentală + validarea compatibilității materialelor și a menținerii presiunii + semnătură a clientului unde este cazul'
    - category: 'Condiții de proces'
      examples: 'Pregătirea suprafeței, temperatura și umiditatea la polimerizarea cu aer cald, presiunea de strângere, durata de menținere'
      risk: 'Ridicat'
      requirements: 'Aprobare de către Inginerie și Calitate, cu validarea unei ferestre definite de temperatură și umiditate'
    - category: 'Scule și mijloace de măsurare'
      examples: 'Manometre, detectoare de scurgeri, pistolare cu aer cald, unelte pentru supape, software de încercare'
      risk: 'Mediu/Ridicat'
      requirements: 'Verificarea valabilității calibrării + evaluare a adecvării echipamentului'
    - category: 'Domeniul defectului'
      examples: 'Extinderea ariei de reprocesare; micro-scurgere de suprafață care se extinde în zonele critice ale marginii, cusăturii sau scaunului supapei'
      risk: 'Ridicat'
      requirements: 'Suprafețe structurale portante: oprire obligatorie și reevaluare'
    - category: 'Metode de inspecție'
      examples: 'Metoda de detecție a scurgerilor, presiunea de încercare (18.0 PSI), durata de menținere (24h)'
      risk: 'Ridicat'
      requirements: 'Aprobare de către Calitate + confirmarea acordului tehnic cu clientul'
    - category: 'Documentație și autorizare'
      examples: 'Instrucțiunea de reprocesare, fișele de inspecție, logica de eliminare NCR, calificarea operatorilor'
      risk: 'Mediu'
      requirements: 'Revizia documentului controlat (Rev A → Rev B) + înregistrări de instruire'

cc_containment:
  tagline: Regula opririi imediate
  title: Limitare imediată a efectelor atunci când situația devine serioasă
  body: |
    > „Metoda de reprocesare existentă va fi supusă analizei și nu va fi aplicată produselor afectate suplimentar până la evaluarea și autorizarea modificării, cu excepția situației în care este aprobată de Calitate și Inginerie o abatere temporară documentată.”

    Metoda de reprocesare curentă trebuie suspendată imediat atunci când reinspecția după reprocesare continuă să eșueze, când defectul implică zone structurale portante (baza supapei, margini, cusături, zone de presiune la prabă și coadă), când un material înlocuitor nu este încă validat sau când parametrii curenți intră în conflict cu specificația aprobată de client.

    Abaterile temporare nu devin niciodată practică permanentă: fiecare are o fereastră de valabilitate definită, un domeniu de loturi aplicabil, un plafon de cantitate, cerințe de validare și un mecanism de expirare automată. O excepție verbală nu este o excepție — dacă nu este documentată împreună cu termenul de expirare, nu există.

cc_flow:
  tagline: Standard în buclă închisă, în 9 pași
  title: De la cererea de modificare la închidere și păstrare
  subtitle: 'O buclă documentată unică pentru fiecare modificare de parametru: propunere, triaj, evaluare, aprobare, validare, pilot, verificare, revizie, închidere.'
  steps:
    - step: '01'
      title: 'Cerere de modificare (ECR)'
      desc: 'Orice departament poate înainta o cerere, dar aceasta este susținută de conducerea Ingineriei, Calității sau Producției. ECR răspunde la întrebările de ce se propune modificarea, ce se modifică, ce este afectat și cum va fi verificată — cu numărul de control al modificării, NCR/CAPA asociat, parametrul curent față de cel propus, loturile afectate și clasificarea temporară/permanentă.'
    - step: '02'
      title: 'Triaj inițial și limitarea efectelor'
      desc: 'Cererea este analizată mai întâi din perspectiva limitării imediate a efectelor: metoda curentă trebuie oprită acum? Dacă este permisă o abatere temporară, aceasta este delimitată de fereastra de valabilitate, domeniul de loturi, plafonul de cantitate și expirarea automată.'
    - step: '03'
      title: 'Evaluarea impactului și a riscului'
      desc: 'Inginerie, Calitate, Producție, Achiziții/Lanț de Aprovizionare și Proiect evaluează performanța produsului, criteriile de acceptare, compatibilitatea materialelor, aspectul, capabilitatea procesului, echipamentele și mijloacele de măsurare, calificarea personalului, cerințele clientului, domeniul conformității și al trasabilității.'
    - step: '04'
      title: 'Analiză și aprobare comună'
      desc: 'Aprobarea urmează matricea fixă de autorizare — nu „cine strigă mai tare”. Modificările cu risc ridicat necesită aprobare interdepartamentală și, acolo unde este necesar, aprobarea scrisă a clientului înainte de orice încercare.'
    - step: '05'
      title: 'Plan de validare'
      desc: 'Pentru modificările cu risc ridicat este necesar un plan de validare aprobat înainte de aplicarea de rutină: plăci probă reprezentative, metoda curentă față de cea propusă, metode de încercare, criterii de acceptare, etape de inspecție, persoane responsabile și program.'
    - step: '06'
      title: 'Pilot și implementare controlate'
      desc: 'Documentele noi sunt emise, iar versiunile depășite sunt retrase și marcate ca OBSOLETE; materialele și mijloacele de măsurare noi sunt verificate și calibrate; operatorii sunt instruiți și calibrați; primul lot rulează sub inspecție strictă, cu identificare clară a stării.'
    - step: '07'
      title: 'Reinspecție și analiză a eficacității'
      desc: 'Rata de reușită la prima reprocesare, rata de trecere la reinspecție, rata de recurență și acceptarea aspectului sunt măsurate și analizate înainte ca modificarea să poată fi considerată eficientă — o singură placă reparată nu este niciodată tratată drept validare de proces.'
    - step: '08'
      title: 'Revizia documentelor și instruirea'
      desc: 'Instrucțiunile de lucru, fișele de inspecție, opțiunile de eliminare NCR, fișele de parametri și materialele de instruire sunt actualizate la noua revizie, cu instruire practică înregistrată și calificarea operatorilor.'
    - step: '09'
      title: 'Închidere și păstrarea înregistrărilor'
      desc: 'Modificarea este închisă numai după analizarea și aprobarea dovezilor de validare, a actualizărilor documentare, a înregistrărilor de instruire și a eficacității implementării. Dacă rezultatul urmărit nu este obținut, modificarea este revizuită, extinsă, suspendată sau retrasă.'

