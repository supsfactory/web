faqs:
  tagline: FAQ
  title: 'Întrebări frecvente despre controlul modificărilor în reprocesare'
  items:
    - q: 'Poate fabrica să modifice parametrii de reprocesare fără să ne informeze?'
      a: 'Nu. Orice modificare propusă a materialelor de reprocesare aprobate, a condițiilor de proces, a sculei, a metodelor de încercare, a criteriilor de inspecție sau a personalului autorizat trebuie să treacă mai întâi prin controlul documentat al modificărilor. Modificările care afectează specificațiile, mostrele, listele de materiale, grafica sau criteriile de acceptare aprobate de client necesită aprobarea scrisă a clientului.'
    - q: 'Ce se consideră o modificare cu risc ridicat?'
      a: 'Modificările materialelor sau furnizorilor de reprocesare, ale condițiilor de presiune și menținere sau de polimerizare, ale metodelor de reprocesare a supapelor, marginilor și cusăturilor, ale criteriilor de inspecție sau acceptare, precum și extinderea domeniului defectului către zone structurale sunt clasificate cu risc ridicat. Ele necesită analiză interdepartamentală, plan de validare aprobat și implementare pilot controlată înainte de utilizarea de rutină.'
    - q: 'Poate fi folosită o abatere temporară pe termen nelimitat?'
      a: 'Nu. Fiecare abatere temporară are o fereastră de valabilitate definită, un domeniu de loturi, un plafon de cantitate și cerințe de validare, cu expirare automată. Atingerea plafonului blochează lotul și împiedică tipărirea etichetei de trecere până la evaluarea formală a modificării.'
    - q: 'Cum se dovedește că o metodă modificată funcționează înainte de utilizarea la scară?'
      a: 'Modificările cu risc ridicat necesită un plan de validare: cel puțin 5 plăci probă reprezentative care acoperă limitele de toleranță, încercate de 2 inspectori de control al calități independenți față de criterii de acceptare cuantificate (eliminarea scurgerii, menținerea presiunii, funcționarea supapei, durabilitatea cusăturilor, aspectul). Aprobarea pentru validare nu este aprobare pentru aplicare.'
    - q: 'Trebuie să aprobăm fiecare modificare?'
      a: 'Nu fiecare modificare, dar orice modificare care îndepărtează produsul de la mostra, specificația tehnică, lista de materiale, grafica, ambalarea sau criteriile de acceptare aprobate de client este implementată numai cu acordul scris al clientului. Fără acesta, plăcile sunt reprocesate conform cerinței inițiale, înlocuite sau respinse.'
    - q: 'Ce se întâmplă cu documentele vechi după aprobarea unei modificări?'
      a: 'Instrucțiunile de lucru, fișele de parametri și fișele de inspecție vechi sunt colectate fizic și anulate (unu intrat, unu ieșit), marcate ca OBSOLETE și înlocuite de noua revizie controlată după instruire. Versiunile veche și cele noi nu coexistă niciodată la același post de lucru.'
    - q: 'Cât timp se păstrează înregistrările controlului modificărilor?'
      a: 'Înregistrările de închidere — dovezile de validare, reviziile documentare, înregistrările de instruire și analizele de eficacitate — sunt păstrate conform politicii noastre de păstrare a înregistrărilor (minimum 3 ani pentru înregistrările de închidere), astfel încât fiecare modificare să rămână trasabilă pentru audituri și analize de trasabilitate.'

