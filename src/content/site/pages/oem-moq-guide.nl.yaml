moq_stages:
  tagline: 'Sample · Piloot · Volume'
  title: 'Drie duidelijk gescheiden kwantiteitsniveaus'
  subtitle: 'De productiehoeveelheden voor sample, piloot en volume zijn verschillend. Elk project is verdeeld in drie afzonderlijke fasen, zodat je kunt valideren vóór je je vastlegt.'
  steps:
    - step: '01'
      title: 'Sampleontwikkeling (1–2 eenheden)'
      desc: 'Fysieke bevestiging van rompstijfheid, hechting van het antislip EVA-deckpad, grafische precisie en pasvorm van de accessoires vóór enige financiële verplichting. De sampletarieven zijn van toepassing en worden na ondertekening van het contract verrekend met de productiebestelling.'
    - step: '02'
      title: 'Pilotorder (20–50 eenheden)'
      desc: 'Pre-seizoen commercialtests en regionale marktvalidatie met bestaande rompplatforms, standaardmaterialen en vereenvoudigde verpakking, om de instelinspanning te minimaliseren.'
    - step: '03'
      title: 'Volumeproductie (90–100+ eenheden)'
      desc: 'Bevestigd na bevroren BOM, afgeronde artwork, aangepaste verpakking en geplande leverdata — volledige 150 m rollen, aangepaste Pantone-weefsels, maatwerkverpakking, volume-korting en volledige partijtraceerbaarheid door de hele toeleveringsketen.'

