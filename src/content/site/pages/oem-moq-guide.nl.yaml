hero:
  tagline: 'Transparant en projectgebaseerd'
  title: 'Gids voor flexibele branding en productie-MOQ'
  subtitle: 'Begrijp de fysica van het ruwe drop-stitch materiaal die de SUP-productieruns beheerst — en hoe ons co-brandingprogramma met lage instapdrempel werkt voor verhuurders, clubs, resorts en opkomende watersportmerken. Ontworpen en beheerd door de Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Kort antwoord'
  text: 'Het MOQ is geen one-size-fits-all. Elke MOQ wordt per project bevestigd: rompvorm en apparatuur, kleur- en PVC-varianten, artworkcomplexiteit, verpakking en accessoirologie. De volledige productie in standaardhoeveelheden draait op 90–100 eenheden per partij uit één standaardrol van 150 m drop-stitch weefsel; co-branding voor kleine partijen start vanaf 5–10 eenheden; en elk project verdeelt zich in drie duidelijk gescheiden fasen — sampleontwikkeling (1–2 eenheden), pilotorder (20–50 eenheden) en volumeproductie (90–100+ eenheden). We bevestigen de exacte berekening voor jouw SKU-mix vóór de offerte — geen vage "lage MOQ"-beloften, geen verborgen compromissen.'
  verified: 'September 2026'

moq_principle:
  tagline: De technische logica
  title: 'Waarom het standaard-MOQ 90–100 eenheden is: de fysica van grondstofrollen'
  subtitle: 'Productiepartijformaten zijn geen willekeurige getallen uit het verkoopkantoor — ze komen voort uit de rollengtes van het ruwe drop-stitch weefsel en de fysica van lijnwisselingen.'
  body: |
    **De basislijn van 150 meter ruw weefsel.** Het hoogsterkte drop-stitch weefsel wordt geproduceerd en gecoat op doorlopende moederrollen. De standaard industriële sectielengte voor één partij is 150 meter doorlopend materiaal.

    **De opbrengstberekening (90 tot 100 planken).** Met een standaard SUP Touring- of Allround-romp (van 10 ft 6 in tot 11 ft 6 in) leveren 150 m moederrol circa 90–100 afgewerkte paddle boards op.

    **Geen weefselverbindingen.** Volledige rollen garanderen totale structurele continuïteit — geen risicovolle transversale weefselverbindingen en een gelijkmatige vezelspanning aan boven- en onderzijde van de plank.

    **Thermische en lijmkalibratie.** De geautomatiseerde hoogfrequente warme- en lijmlijnen voor mariene verlijming vereisen 2 uur voorverwarming, temperatuurprofilering en drukkalibratie. Een volledige partij van 90–100 eenheden absorbeert deze vaste instelkosten en levert daarmee de laagst mogelijke kostprijs per eenheid.

