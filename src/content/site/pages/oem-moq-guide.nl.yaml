moq_faqs:
  tagline: FAQ
  title: 'Veelgestelde vragen over het MOQ'
  items:
    - q: 'Wordt het MOQ berekend per order, per model of per kleurvariant?'
      a: 'Het MOQ kan gelden per model, kleurvariant, artworkversie, verpakkingsconfiguratie of totale order. Omdat verschillende drop-stitch diktes (12 cm vs. 15 cm) en PVC-kleuren uit afzonderlijke grondstofrollen komen, vereist een order van 50 planken verdeeld over 5 kleuren 5 afzonderlijke weefselrollen. We bevestigen de exacte berekening tegen je SKU-matrix vóór de offerte, zodat je je mix kunt plannen.'
    - q: 'Kan ik een sample bestellen vóór de massaproductie?'
      a: 'Ja. De sampleontwikkeling (1–2 eenheden) controleert rompstijfheid, hechting van het antislip EVA-deckpad, grafische precisie en pasvorm van de accessoires vóór de goedkeuring voor massaproductie. De sampletarieven zijn van toepassing en worden na ondertekening van het contract verrekend met de productiebestelling.'
    - q: 'Waarom heeft aangepaste commerciële verpakking een eigen MOQ?'
      a: 'Aangepaste flexo- of offsetpersen voor de dozen vereisen een minimaal instelvolume van 500+ eenheden. We bieden een hybride verpakkingsopslagoplossing: we produceren de 500 aangepaste bedrukte dozen, bewaren het overschot in ons schone magazijn en leveren het uit volgens de geplande leveringen van je planken — zo kan ook een kleinere plankenorder volledig ge-branded in commerciële kartonverpakking worden verzonden.'
    - q: 'Waarom is het standaard-MOQ 90–100 eenheden?'
      a: 'Het standaard-MOQ volgt de grondstof: een moederrol van 150 m hoogsterk drop-stitch weefsel levert circa 90–100 afgewerkte planken op voor een standaard Touring- of Allround-romp. Volledige rollen elimineren weefselverbindingen, houden de vezelspanning gelijkmatig en absorberen de 2-uurskalibratie van de las- en laminatielijnen — tegen de laagst mogelijke kosten per eenheid.'
    - q: 'Verlaagt een grotere hoeveelheid de prijs per eenheid?'
      a: 'Bij de meeste projecten ja. Grotere hoeveelheden verbeteren de materiaalopbrengst, spreiden de vaste instelkosten van de productielijnen over meer planken en verlagen de verpakkingskosten per eenheid.'
    - q: 'Komen de co-branding matrijkosten terug bij herdrukken?'
      a: 'Nee. De zeefdrukmatrijkosten worden eenmalig in rekening gebracht bij de eerste configuratie en vervallen bij herdrukken met hetzelfde artworkformaat. Je betaalt alleen de fabrieksbewerkings- en druktorief van $1.00 USD per plank.'
    - q: 'Verplicht een MOQ-adviesaanvraag me tot een bestelling?'
      a: 'Nee. Een projectgebaseerde MOQ-adviesaanvraag stelt ons technisch team van de Qingdao Vatrad Group Co., Ltd. eenvoudig in staat je technische briefing te beoordelen en het meest economische productietraject te adviseren. Er is een geheimhoudingsovereenkomst (NDA) beschikbaar voordat je eigendoms-technische specificaties of artwork deelt.'

