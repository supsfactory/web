meta:
  title: 'SUP-MOQ-gids: flexibele branding en minimale bestelhoeveelheden'
  description: 'Zo wordt het MOQ voor opblaasbare SUP''s berekend: drop-stitch rollen van 150 m leveren 90–100 planken, co-branding vanaf 5–10 stuks en transparante matrijkosten.'
  dateModified: '2026-08-14'
  keywords:
    - 'MOQ SUP'
    - 'minimale bestelhoeveelheid opblaasbare SUP''s'
