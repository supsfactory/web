  title: 'MOQ SUP personalizado & prazos de entrega: da amostra aos lotes por contentor'
  description: 'MOQ SUP personalizado e níveis de entrega: amostras em 7–12 dias, encomendas piloto de 20–50 pranchas, volumes padrão de 90–100+ por rolo de 150 m, produção em 25–35 dias.'
  dateModified: '2026-08-16'
