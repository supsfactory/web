answer:
  label: 'Kurze Antwort'
  text: 'SUP-Produktentwicklung bei SUPsfactory durchläuft sechs Stufen — Produktspezifikation, Strukturengineering, Prototyp-Bemusterung, Test & Validierung, individueller Werkzeugbau und Serienfertigung. Das erste physische Muster versendet 7–12 Tage nach Spezifikationsfreigabe; die Produktion läuft 25–35 Tage nach bestätigtem Auftrag und Anzahlung; ein neuer Formenbau addiert 15–20 Tage.'
  verified: 'September 2026'

stages:
  title: 'Die sechs Stufen der SUP-Produktentwicklung'
  subtitle: 'Jede Stufe hat ein klares Ergebnis — so wissen Sie stets, wo Ihr Projekt steht — und was als Nächstes kommt.'
  items:
    - title: '1. Idee & Produktspezifikation'
      description: 'Board-Geometrie, Fahrergewichtsbereich, Volumen, Konstruktionsziele und Zubehörpaket. Ein Referenz-Board, eine Skizze oder eine Konkurrenzspezifikation genügt für den Start.'
      icon: 'tabler:bulb'
    - title: '2. Engineering & 3D-Design'
      description: 'Strukturengineering, Drop-stitch-Dicke und PVC-Klassenauswahl sowie eine Fertigbarkeitsprüfung und Offerte — innerhalb eines Werktages zurück.'
      icon: 'tabler:blueprint'
    - title: '3. Prototyp-Bemusterung'
      description: 'Ihr erstes physisches Muster versendet in 7–12 Tagen, dokumentiert mit einem Freigabeblatt für Konstruktion, Druckfarben und Drucktestergebnisse.'
      icon: 'tabler:tools'
    - title: '4. Test & Validierung'
      description: 'Druckhalt, Nahtfestigkeit und Maßprüfungen gegen das freigegebene Muster, mit CE- und REACH-Dokumentation für Ihre Zielmärkte.'
      icon: 'tabler:test-pipe'
    - title: '5. Werkzeugbau & Serienfertigung'
      description: 'Individueller Formenbau in 15–20 Tagen, falls erforderlich; die Produktion läuft 25–35 Tage mit Inline-QC-Prüfpunkten und Chargenrückverfolgbarkeit.'
      icon: 'tabler:settings'
    - title: '6. Lieferung & Skalierung'
      description: 'FOB-, CIF- oder DDP-Logistik in über 50 Länder — danach Folgeaufträge auf Ihrer etablierten Linie mit stabilen Lieferzeiten und hinterlegtem freigegebenem Artwork.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Warum Entwicklung in einer Fabrik ein vermitteltes Projekt schlägt'
  subtitle: 'Entwicklungsarbeit direkt im Produktionswerk verändert, was Sie in jeder Stufe erhalten.'
  items:
    - title: Keine Übergabelücken im Design
      description: 'Das Engineering- und Zeichnungsteam arbeitet auf derselben Etage wie die Schweißlinie — eine Zeichnungsänderung geht noch in derselben Woche in die Produktion, nicht nach einer kommerziellen Rückrunde.'
      icon: 'tabler:handshake'
    - title: Muster, die der Produktion entsprechen
      description: 'Musterlauf und Produktionslauf teilen sich dieselben Maschinen, Materialien und QC-Stationen — das freigegebene Muster ist also genau das, was Sie im Containermaßstab erhalten.'
      icon: 'tabler:stack-2'
    - title: Engineering, das nichts verkauft
      description: 'Entscheidungen fallen gegen Zielkosten, Gewicht und Haltbarkeit — nicht gegen Uplift-Margen, denn das hier ist eine Fabrik und Produktion ist die einzige Umsatzquelle.'
      icon: 'tabler:scale'
    - title: Vertraulichkeit als Dauerverpflichtung
      description: 'Eine NDA wird vor jedem Dateiaustausch unterzeichnet, und Ihr Artwork, Ihr Werkzeug und Ihre Spezifikationsdateien bleiben Ihr Eigentum — nie wiederverwendet, weiterverkauft oder einem anderen Kunden gezeigt.'
      icon: 'tabler:lock'

