faq_section:
  tagline: FAQ
  title: 'Häufig gestellte Fragen zur SUP-Entwicklung'
  questions:
    - q: Können Sie ein SUP-Produkt aus einer Idee entwickeln?
      a: 'Ja. Wir begleiten den gesamten Weg von der Produktspezifikation und dem Engineering über die Prototypenentwicklung, Individualisierung und Serienfertigung auf Basis Ihrer Anforderungen. Eine Skizze, ein Referenz-Board oder sogar eine Konkurrenzspezifikation genügt für die Engineering-Prüfung.'
    - q: Was kostet die SUP-Produktentwicklung?
      a: 'Die Spezifikationsprüfung und die Engineering-Bewertung sind kostenlos und werden innerhalb eines Werktages zurückgeliefert. Das Prototyp-Sampling wird pro Projekt nach Fixierung der Spezifikation kalkuliert; die Produktionspreise hängen von Materialien, Menge und davon ab, ob ein eigener Werkzeugbau erforderlich ist.'
    - q: Wie lange dauert die SUP-Produktentwicklung?
      a: 'Das erste Muster versendet 7–12 Tage nach Spezifikationsfreigabe, mit 3–7 Tagen pro Überarbeitungsrunde. Die Produktion läuft 25–35 Tage nach Auftrag und Anzahlung. Ein eigener Formenbau addiert 15–20 Tage vorab, und die Seefracht schlägt bei den meisten Zielen mit 4–6 Wochen zu Buche.'
    - q: Was kommt zuerst — Muster oder Produktion?
      a: 'Immer das Muster. Ein physischer Prototyp wird hergestellt, vermessen und gegen die Spezifikation freigegeben, bevor irgendein Produktionslauf startet. Wir produzieren keine Mengen aus nicht freigegebenen Designs.'
    - q: Unterzeichnen Sie für die Produktentwicklung eine NDA?
      a: 'Ja. Eine NDA wird vor jedem Dateiaustausch unterzeichnet, und Ihre Designs, Ihr Artwork und Ihr Werkzeug bleiben während der gesamten Entwicklung und Fertigung Ihr Eigentum.'
    - q: Können Sie mein SUP-Design und meine Spezifikationen schützen?
      a: 'Kundendesigns, Spezifikationen und Produktkonzepte werden während Entwicklung und Fertigung vertraulich behandelt. Ihre Werkzeugdateien werden nie wiederverwendet, weiterverkauft oder einem anderen Kunden gezeigt.'

