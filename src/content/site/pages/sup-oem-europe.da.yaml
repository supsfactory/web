why_europe:
  tagline: 'Hvorfor købere i Europa'
  title: 'Bygget til europæisk import'
  subtitle: 'Fabrikken besvarer de spørgsmål, europæiske mærker stiller, før den første container ankommer — certificering først.'
  items:
    - title: 'CE- og REACH-dokumentation'
      description: 'Den godkendte prøve afsendes med CE- og REACH-dokumentation udarbejdet til EU-markedet, så din tekniske fil og dine toldpapirer er klar, før containeren ankommer.'
    - title: 'DDP for en forudsigelig kostpris'
      description: 'DDP inkluderer toldbehandling, told, afgifter og levering til dit lager — en samlet pris, dør til dør i hele EU.'
    - title: 'FOB Qingdao med din egen speditør'
      description: 'Regelmæssig importør? Tag FOB Qingdao og brug din egen logistikpartner — vi lader og dokumenterer containeren, du styrer resten.'
    - title: 'En fabrik, et kvalitetssystem'
      description: 'Udvikling, prøvefremstilling, produktion og QC foregår alle i fabrikken på 12,500 m² — den prøve, du godkender, er det produkt, du modtager.'

process_notes:
  tagline: 'Sådan fungerer det'
  title: 'Fra specifikation til container'
  subtitle: 'De samme seks faser, uanset om du køber to eller tyve containere om året: specifikation, konstruktion, prøvning, test, værktøj og produktion — derefter FOB-, CIF- eller DDP-levering.'
  items:
    - title: '1. Send din specifikation'
      description: 'Et referencebræt, en skitse eller en konkurrent-specifikation er nok. Konstruktionsgennemgang og tilbud returneres inden for en arbejdsdag.'
    - title: '2. Godkend prøven'
      description: 'Din første fysiske prøve afsendes på 7–12 dage sammen med et godkendelsesark, der dækker konstruktion, trykfarver og resultater af trykprøvning.'
    - title: '3. Produktion og eksport'
      description: 'Kørsler afsluttes på 25–35 dage med QC-kontrolpunkter undervejs. Pakliste, faktura og bill of lading sendes før skibet.'
    - title: '4. Levering til dit lager'
      description: '4–6 ugers søfragt til Rotterdam eller Hamburg — under DDP håndterer vi toldbehandling og levering til din dør.'

faq_section:
  tagline: FAQ
  title: 'Spørgsmål om import til Europa'
  questions:
    - q: 'Er CE-dokumentation inkluderet i min ordre?'
      a: 'Ja. CE- og REACH-dokumentation udarbejdes til EU-markedet sammen med din godkendte prøve, før produktionen starter — dokumenterne afsendes med containeren.'
    - q: 'Hvor længe tager søfragten til Europa?'
      a: 'Regn med 4–6 uger fra Qingdao-havnen til Rotterdam eller Hamburg, afhængigt af afsejlingsplanen. DDP-projekter omfatter den komplette tidsplan fra dør til dør.'
    - q: 'Sender I DDP til EU-lande?'
      a: 'Ja. DDP inkluderer søfragt, toldbehandling, told og afgifter samt levering til dit lager — en forudsigelig samlet pris. FOB Qingdao og CIF er også tilgængelige.'
    - q: 'Hvad er minimumsordren for en private label SUP-import?'
      a: 'Minimumsordren (MOQ) fastlægges ud fra projektkonfigurationen: prøveudvikling dækker 1–2 stk., pilotbatcher kører 20–50 stk. på eksisterende platforme, og serieproduktion kører 90–100+ stk. pr. design ud fra en fuld drop-stitch-rulle på 150 m.'
    - q: 'Hvilken dokumentation udleverer I til importen?'
      a: 'Den godkendte prøve afsendes med CE- og REACH-dokumentation udarbejdet til dit målmarked, og hver container sendes med pakliste, faktura og bill of lading.'
    - q: 'Hvordan starter jeg et projekt fra Europa?'
      a: 'Send et referencebræt, en skitse eller en specifikation. Konstruktionsgennemgangen og tilbuddet returneres inden for en arbejdsdag, og en NDA underskrives før nogen filudveksling.'

