hero:
  tagline: 'Europa'
  title: 'Oppustelig SUP OEM til Europa — CE-dokumenteret fra Qingdao'
  subtitle: 'Prøve på 7–12 dage, produktion på 25–35 dage, søfragt på 4–6 uger til Rotterdam eller Hamburg. CE- og REACH-dokumentation udarbejdes sammen med din godkendte prøve — FOB Qingdao, CIF eller DDP-levering.'

answer:
  label: 'Kort svar'
  text: 'Europæiske mærker bestiller oppustelig SUP hos iSupfactory på standardvilkår: minimumsordren (MOQ) fastlægges ud fra projektkonfigurationen: prøvekørsler på 1–2 stk. validerer bygningen, pilotbatcher på 20–50 stk. tester markedet på eksisterende platforme, og serieproduktion kører 90–100+ stk. pr. design ud fra en fuld drop-stitch-rulle på 150 m. Den første prøve afsendes 7–12 dage efter specifikationsgodkendelse, produktionen kører 25–35 dage efter bekræftet ordre og depositum, og søfragten tilføjer 4–6 uger til Rotterdam eller Hamburg. CE- og REACH-dokumentation udarbejdes sammen med den godkendte prøve, og DDP dækker toldbehandling og levering til dit lager.'
  verified: 'September 2026'

