meta:
  title: 'Fabrieksaudit-checklist — Wat te controleren vóór de keuze van een SUP-producent | SUPsfactory'
  description: 'Fabrieksaudit-checklist voor kopers van opblaasbare SUP''s: kwaliteitssysteem, capaciteit, materialentraceerbaarheid, drukproeven, sociale conformiteit en documentatie.'
  dateModified: '2026-08-21'
  keywords:
