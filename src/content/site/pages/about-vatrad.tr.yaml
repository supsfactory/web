values_section:
  title: 'Fabrika Markalarla Nasıl Çalışır'
  subtitle: 'Vatrad fabrikasının ürettiği her projeyi şekillendiren üç ilke.'
  columns: 3
  items:
    - title: 'Üretimden Önce Mühendislik'
      description: 'Her proje teknik şartname, çizim ve fiziksel numune ile başlar — gövde biçimi, drop-stitch sınıfı, grafik yerleşimi ve ambalajlama, üretim hattında keşfedilmeden önce her üretim çalıştırması öncesinde doğrulanır.'
      icon: 'tabler:settings'
    - title: 'Tek Ekip, Tek Tesis'
      description: 'Tasarım, kesim, kaynak, montaj ve testler tek bir 12.500 m² tesiste gerçekleşir. Ticaret şirketi devir yoktur: sorularınızı yanıtlayan kişiler, tahtalarınızı üreten kişilerin aynısıdır.'
      icon: 'tabler:building-factory-2'
    - title: 'Küçük İlk Partiler'
      description: 'Küçük partili ortak marka çalışmaları 5–10 adetle başlar, standart hacim üretimi ise parti başına 90–100+ adet (bir 150 m drop-stitch rulo) ile yürür; böylece markalar ölçeklemeden önce pazarı doğrular, kalıp ve görseller yeniden siparişler için saklanır.'
      icon: 'tabler:layers-intersect'
services_section:
  title: 'Fabrikanın Sunduğu Hizmetler'
  subtitle: 'iSupfactory müşterilerine sunulan üretim hizmetleri.'
  columns: 2
  items:
    - title: 'Özel SUP Geliştirme'
      description: 'Özel şişirilebilir SUP ürünleri için gereksinim değerlendirmesi, şartname, malzeme seçimi, grafik tasarım, prototip, numune onayı ve üretim.'
      icon: 'tabler:bulb'
    - title: 'Özel Marka Üretimi'
      description: 'Kanıtlanmış ticari sınıf platformlarda sizin logonuz, renkleriniz ve ambalajınız — tahta, güverte pedi, aksesuarlar ve kolilerin tamamı sizin kimliğinizi taşır, fabrika markası bulunmaz.'
      icon: 'tabler:tag'
    - title: 'OEM / ODM Üretimi'
      description: 'Müşteri çizimlerinden veya birlikte geliştirilen tasarımlardan eksiksiz OEM ve ODM şişirilebilir SUP üretimi; yeni tahta biçimleri için özel kalıplar dahil.'
      icon: 'tabler:package'
    - title: 'Filo Tedariki'
      description: 'Tatil tesisleri, kulüpler, okullar ve kiralama işletmecileri için markalı tahta filoları; uyumlu aksesuarlar ve filo dostu üretim partileri ile.'
      icon: 'tabler:users-group'
certifications_section:
  title: 'Sertifika ve Uyum'
  subtitle: 'Fabrika, belgelenmiş bir uyum sistemiyle AB, ABD ve Asya-Pasifik’e sevkiyat yapar.'
  columns: 2
  items:
    - title: 'CE Sertifikası'
      description: 'Şişirilebilir SUP ve su aracı ürün hatları AB güvenlik direktiflerine uygundur; her pazar için belge paketi sağlanır.'
      icon: 'tabler:certificate'
    - title: 'ISO 9001 Kalite Sistemi'
      description: 'Üretim tesisi, giriş malzemesi, süreç içi ve son denetim kapsamındaki ISO 9001 kalite yönetim sistemiyle çalışır.'
      icon: 'tabler:badge-check'
    - title: 'BSCI Sosyal Uyum'
      description: 'Çalışma koşulları ve fabrika uyumunu kapsayan BSCI kapsamında denetlenen sosyal sorumluluk.'
      icon: 'tabler:shield-check'
    - title: 'REACH Malzeme Uyumu'
      description: 'Malzemeler, kimyasal güvenlik için AB REACH yönetmeliğine uygundur.'
      icon: 'tabler:flask'
    - title: 'USCG Onayı'
      description: 'Şişirilebilir su aracı ürün hatları için ABD Sahil Güvenliği onaylı üretim.'
      icon: 'tabler:anchor'
    - title: 'Ürün Testleri'
      description: 'Her üretim hattında kaldırma kuvveti, yük kapasitesi, dikiş dayanımı, UV ve aşınma direnci ile basınç tutma testleri.'
      icon: 'tabler:test-pipe'
