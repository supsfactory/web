  description: 'Hoe opblaasbare SUP-planken van 4", 5" en 6" verschillen in stijfheid, gewicht, stabiliteit en koersvastheid, met aanbevelingen over de dikte.'
  author: 'iSupfactory'
  datePublished: '2026-08-04'
  dateModified: '2026-08-07'
