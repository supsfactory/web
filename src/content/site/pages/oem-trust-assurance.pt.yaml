  tagline: 'Produção que podes verificar'
  title: 'Confiança OEM & garantias de fábrica'
  subtitle: 'Cada afirmação deste site é verificável: registo empresarial oficial, uma fábrica física de 12.500 m² que podes visitar ou auditar, engenheiros reais sob NDA, documentos QMS descarregáveis e dados de teste registados por número de série. Projetada e gerida pela Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Resposta breve'
  text: 'A confiança não é uma promessa: é documentação. Somos uma empresa industrial chinesa registada (Qingdao Vatrad Group Co., Ltd.) com uma instalação física de 12.500 m² em Qingdao, 350+ colaboradores e uma capacidade anual de 120.000+ pranchas. Podes verificar o registo, auditar a fábrica, examinar as SOP QMS, descarregar exemplos de registos de qualidade, programar inspeções de terceiros (SGS, TÜV, BV ou Intertek) e obter uma NDA assinada em 4 horas úteis. Cada prancha é testada em pressão durante 24 horas a 18,0 PSI, com rejeição automática para além de uma queda de 0,50 PSI, e cada lote mantém uma rastreabilidade ERP de 10 anos. Se uma afirmação não for documentável, não a fazemos.'
  verified: 'September 2026'

