role_boundary:
  tagline: 'O que somos — e o que não somos'
  title: 'Uma fábrica que podes verificar, nunca uma afirmação para acreditar por fé'
  subtitle: 'A diferença de verificabilidade entre uma fábrica e um escritório comercial é simples: por trás de cada afirmação há um documento, uma pessoa ou uma máquina.'
  features:
