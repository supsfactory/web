capabilities:
  tagline: Kapazitäten
  title: F&E-Kapazitäten
  subtitle: Vier Kerndisziplinen geben uns die End-to-End-Kontrolle über die Produktentwicklung — von der Rohstoffforschung bis zur Endzertifizierung.
  groups:
    - title: Materialwissenschaft & Gewebetechnologie
      items:
        - Analyse und Optimierung von PVC- und Hypalon-Formulierungen
        - Entwicklung von UV-Stabilisierung, Flammschutz und antimikrobiellen Zusatzstoffen
        - Mehrschichtige Gewebelaminierung und Klebverbindungs-Engineering
        - Beschleunigte Alterungsprüfung (UV, thermisch, Feuchtigkeit, Salzsprühnebel)
    - title: Rumpfengineering & Hydrodynamik
      items:
        - Parametrisches 3D-Rumpfdesign und CFD-Optimierung
        - Finite-Elemente-Analyse für Struktur- und Stoßlasten
        - Schlepptankprüfung mit Modellen und Leistungsvalidierung
        - Individuelle Rumpfentwicklung für spezielle Missionsprofile
    - title: Schweiß- & Fügetechnologie
      items:
        - Entwicklung und Optimierung des HF-Dielektrik-Schweißverfahrens
        - Heißluft-, Heizkeil- und Ultraschallschweißverfahren
        - Qualifizierung von Klebverbindungen und Nahtbändern
        - Schweißfestigkeitsmodellierung und Lebensdauervorhersage
    - title: Prüfung, Zertifizierung & Konformität
      items:
        - Qualitätsmanagement- und CE-Konformitätsprüfung
        - Unterstützung bei unabhängigen Drittprüfungen und Zertifizierungen
        - Entwicklung individueller Testprotokolle für die Beschaffungsqualifizierung
        - Fehleranalyse im Einsatz und Ursachenforschung

