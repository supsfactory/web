hero:
  tagline: F&E-Zentrum
  title: F & E-Zentrum
  subtitle: Fokus auf Fortschritt

intro:
  - Vatrads Forschungs- und Entwicklungs-(F&E-)Zentrum ist die treibende Kraft unserer Mission, die Wassersportausrüstung zu revolutionieren. Durch unermüdliche Innovation bei aufblasbaren Stand-up-Paddle-Boards (SUPs) und Booten ermöglichen wir Wassersportbegeisterten weltweit sicherere, komfortablere und schönere Produkte. Unser engagiertes Team aus Ingenieuren, Designern und leidenschaftlichen Wassersportexperten gestaltet die Zukunft der Branche und hebt die Messlatte für Qualität, Leistung und Nachhaltigkeit stetig an.
  - Unsere F&E-Einrichtung vereint Materialwissenschaftler, Schiffsarchitekten und Produktionsingenieure unter einem Dach. Von der Gewebeformulierung und Rumpfsimulation über die Entwicklung von Schweißverfahren bis hin zu großmaßstäblichen Seeversuchen wird jede Phase der Produktentwicklung von Daten getrieben und durch Prüfungen validiert.

