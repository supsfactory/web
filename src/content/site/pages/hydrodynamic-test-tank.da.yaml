  text: 'Vi bassintester SUP-skrogets former i modelskala 1:3 til 1:5 — noseprofil, kantradius, rocker og våd overflade — og måler modstand, glidningseffektivitet og stabilitet, før vi binder os til en prototype i fuld størrelse. En uge i bassinet giver de ydeevnedata, der ellers ville tage måneder af prøvninger i fuld skala.'
