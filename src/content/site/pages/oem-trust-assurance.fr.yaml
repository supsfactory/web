role_boundary:
  tagline: 'Ce que nous sommes —et ce que nous ne sommes pas'
  title: 'Une usine que vous pouvez vérifier, jamais une allégation à prendre sur la foi'
  subtitle: 'La différence de vérification entre une usine et un bureau de trading est simple : chaque allégation a un document, une personne ou une machine derrière elle.'
