hero:
  tagline: Výrobní schopnosti
  title: 'Výrobní schopnosti SUP'
  subtitle: 'Každý proces — inženýring trupu, zpracování jádra drop-stitch, svařování vysokofrekvencí, tisk, výroba nástrojů formy, montáž, zkoušení a balení — probíhá vlastními silami v našem závodě o ploše 12 500 m² v Qingdao, takže jeden zodpovědný tým vede váš projekt od prvního výkresu po odeslaný kontejner.'

answer:
  label: 'Přímá odpověď'
  text: 'Výroba SUP je u nás v závodě v Qingdao zcela interní: návrh trupu a rozměrový inženýring s přesností CNC 0,1 mm; zpracování materiálu drop-stitch a svařování vysokofrekvencí na 4 automatizovaných linkách; tisk grafiky; výřez podložek EVA; zákazkové nástroje formy (+15–20 dní u nových tvarů); montáž podle kontrolního seznamu o 100 bodech; a 24hodinové zkoušení udržením tlaku 18,0 PSI s automatickým odmítnutím při poklesu nad 0,50 PSI. Roční kapacita činí 120 000+ desek (přibližně 10 000/měsíc) ze 4 specializovaných dílíň s 350+ pracovníky, dodávaných do 50+ zemí pod Vaší značkou.'
  verified: 'září 2026'

