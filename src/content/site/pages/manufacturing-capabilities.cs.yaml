faq_section:
  tagline: FAQ
  title: Otázky o výrobních schopnostech SUP
  questions:
    - q: Které výrobní procesy probíhají vlastními silami?
      a: 'Všechny klíčové procesy probíhají vlastními silami: inženýring trupu, zpracování jádra drop-stitch, svařování vysokofrekvencí, tisk, výřez EVA, montáž, zkoušení a balení. Příslušenství a část surovin pocházejí od certifikovaných dodavatelů; konečná kompletace probíhá u nás, aby byla zajištěna plná stopovatelnost.'
    - q: Jaká je vaše výrobní kapacita?
      a: '120 000+ desek ročně (zhruba 10 000/měsíc) na 4 automatizovaných linkách a ve 4 specializovaných dílnách závodu o ploše 12 500 m² s 350+ pracovníky.'
    - q: Jaké MOQ se vztahuje na tyto schopnosti?
      a: 'Standardní sériové dávky běží po 90–100+ kusech na schválenou konfiguraci (jedna 150m role tkaniny drop-stitch); pilotní dávky začínají na 20–50 kusech na existujících platformách; objednávky pouze s logem od 5–10 kusů.'
    - q: Jaké dodací lhůty bychom měli plánovat?
      a: 'Prototypové vzorky za 7–12 dní; výroba 25–35 dní po potvrzené objednávce a záloze; vývoj zákazkové formy přidává 15–20 dní na nástroj.'
    - q: Jak se schopnosti přetvářejí v kvalitu?
      a: 'Každý proces živí sedmistupňový systém kvality: kontrolní seznam montáže o 100 bodech, 24hodinové udržení 18,0 PSI s automatickým odmítnutím při poklesu nad 0,50 PSI, výběrové konání ISO 2859-1 Level II a 10letá stopovatelnost dávek v ERP.'

