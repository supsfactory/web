answer:
  label: 'Qué pasa después'
  text: 'Después de enviar un brief de proyecto, recibes una respuesta en un día hábil. Un NDA está disponible antes de que compartas cualquier detalle de propiedad. Ingeniería revisa tu brief y devuelve una cotización detallada con MOQ, tarifas de muestra y un cronograma puerta por puerta — típicamente 7–12 días para muestras y 6–8 semanas para la primera producción desde PO confirmado. Las tarifas de muestra se acreditan hacia tu pedido de producción. Sin compromiso hasta que firmes.'
  verified: '2026-08'

process_steps:
  tagline: El Proceso
  title: 'Del Brief a las Tablas Entregadas — Cinco Pasos'
  subtitle: 'Cada paso tiene un cronograma definido, un entregable documentado y un punto de control de aprobación/rechazo. Avanzas solo cuando estés listo.'
  steps:
    - step: 'Paso 1'
      title: 'Envía Tu Brief de Proyecto'
      desc: 'Cuéntanos sobre tu tabla — especificaciones objetivo, volumen, necesidades de cumplimiento y cronograma. El brief toma 5–10 minutos. Si no estás seguro de cada detalle, comparte lo que tengas y nosotros guiamos el resto. Un NDA está disponible antes de compartir diseños de propiedad.'
    - step: 'Paso 2'
      title: 'NDA y Revisión de Factibilidad (1–5 Días)'
      desc: 'Firmamos un NDA si lo solicitas, luego ingeniería revisa tu brief contra la capacidad de fabricación, disponibilidad de materiales y alcance de cumplimiento. Recibes una cotización detallada con cálculo de MOQ, tarifas de muestra y un cronograma puerta por puerta.'
    - step: 'Paso 3'
      title: 'Muestra y Aprobación (7–21 Días)'
      desc: '1–2 tablas físicas producidas según tu especificación. Remas y evalúas — rigidez del casco, precisión de gráficos, ajuste de accesorios. Los ajustes se capturan en un BOM revisado. La muestra congelada se convierte en la referencia de producción. Las tarifas de muestra se acreditan hacia la producción.'
    - step: 'Paso 4'
      title: 'Planificación de Preproducción (7 Días)'
      desc: 'Adquisición de materiales, configuración de utillaje, confirmación de empaque y reserva de cupo de producción. Todos los materiales son inspeccionados a la entrada contra el BOM congelado. Se emite un cronograma de producción con fechas de puertas de QC antes de que comience la fabricación.'
    - step: 'Paso 5'
      title: 'Producción, QC y Envío (4–6 Semanas)'
      desc: 'La fabricación atraviesa el sistema de inspección de 7 etapas con criterios de aprobación/rechazo en cada puerta. Embalaje de grado exportación, documentación de cumplimiento y coordinación de flete marítimo a 50+ países. Una revisión post-entrega captura refinamientos para el próximo pedido.'

