what_we_need:
  heading: 'Qué Preparar Antes de Tu Brief'
  body: |
    Un brief completo acelera el proceso. Esto es lo que ayuda:

    - **Especificaciones de tabla** — Largo, ancho, grosor, peso del rider, caso de uso. Las dimensiones de referencia o modelos competidores son útiles.
    - **Archivos de diseño** — Arte vectorial (AI, SVG, PDF) para gráficos y logos. Si no está listo, los mood boards o imágenes de referencia funcionan para la factibilidad inicial.
    - **Volumen y cronograma** — Cantidad objetivo y calendario de temporada. Incluso un rango aproximado ("20–50 tablas para marzo") es suficiente para empezar.
    - **Necesidades de cumplimiento** — Mercados objetivo y cualquier requisito de certificación específico más allá de CE, ISO 9001, BSCI, REACH, RoHS.
    - **Rango de presupuesto** — Un presupuesto indicativo por tabla o costo landed objetivo nos ayuda a recomendar la plataforma adecuada.

    **¿No tienes todo listo?** Envía lo que tengas. Nosotros guiamos el resto.

faqs:
  tagline: FAQ
  title: 'Iniciar un Proyecto SUP — Preguntas Frecuentes'
  items:
    - q: '¿Cuál es el pedido mínimo para empezar?'
      a: 'El punto de entrada es escalonado: primero 1–2 muestras (7–12 días), un pedido de prueba de 20–50 tablas (25–35 días), y luego series de volumen estándar de 90–100+ tablas por configuración aprobada. El co-branding de marca privada empieza desde 5–10 unidades sin etapa de desarrollo.'
    - q: '¿Cuánto tardan las muestras?'
      a: 'Las muestras físicas se producen en 7–12 días desde la especificación confirmada y el depósito. Usando plataformas de casco existentes, el ciclo completo desde el brief hasta el pedido de prueba entregado típicamente corre en 8–12 semanas. Un casco a medida añade 15–20 días de desarrollo de molde.'
    - q: '¿Está protegido mi diseño?'
      a: 'Sí. Un NDA está disponible de inmediato — antes de que compartas cualquier información de propiedad. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellas. Todos los archivos técnicos se almacenan en sistemas con control de acceso y trazabilidad de auditoría.'
    - q: '¿Qué pide el formulario de brief de proyecto?'
      a: 'El brief pregunta por tu tipo de negocio, nombre de empresa, especificaciones de tabla objetivo, rango de cantidad del pedido, cronograma y cualquier requisito de cumplimiento. Toma unos 5–10 minutos. Puedes adjuntar archivos de diseño (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) hasta 10 MB. Si no estás seguro de algún campo, omítelo — haremos seguimiento.'
    - q: '¿Qué pasa después de enviar el brief?'
      a: 'Recibes una respuesta en un día hábil. Ingeniería revisa tu brief y devuelve una cotización detallada con MOQ, tarifas de muestra y un cronograma puerta por puerta. No se requiere compromiso hasta que revises y firmes el contrato. Las tarifas de muestra se acreditan hacia tu pedido de producción.'

