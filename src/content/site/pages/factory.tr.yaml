hero:
  tagline: Fabrika
  title: Fabrika ve Üretim
  subtitle: 12.500 m2 SUP fabrikası, Çin, Qingdao — ham PVC malzemeden bitmiş şişirilebilir kürek tahtasına kadar özel SUP üretimi

answer:
  label: 'Net cevap'
  text: 'Çin’in Qingdao kentinde sertifikalı şişirilebilir SUP fabrikası: ISO 9001, ISO 25649, BSCI, CE, REACH ve RoHS. 4 uzmanlaşmış atölyeye yayılmış 12.500 m² tesis, 350+ çalışan, yıllık 120.000+ tahta üretimi (4 otomatik hatta ayda 10.000 tahta). Her tahta 18.0 PSI’da 24 saat basınç testinden geçer, 100 maddelik montaj kontrol listesini tamamlar ve 10 yıllık malzeme izlenebilirliği taşır.'
  verified: 'Eylül 2026'

intro:
  - '**Qingdao Vatrad Group Co., Ltd.** üretim birimi olarak Vatrad, şişirilebilir SUP üretiminin her aşamasını kontrol eder — ham PVC malzemelerin gelişinden bitmiş kürek tahtasının teslim öncesi son denetimine kadar. Qingdao Ekonomik Gelişim Bölgesi’ndeki üretim tesisimiz 12.500 metrekarelik alana yayılmış olup PVC kesimi, drop-stitch çekirdek yapıştırması, SUP dijital baskısı, son montaj ve kalite testi için ayrılmış atölyeler barındırır.'
  - 'Tasarım, mühendislik, prototip, üretim ve testleri tek çatı altında birleştirerek taşeron üretim verimsizliklerini ortadan kaldırıyor; üretim kalitesi, malzeme seçimi ve teslim takvimi üzerinde doğrudan kontrol sağlıyoruz. Atölyemizden çıkan her SUP, bizim insanlarımız, bizim ekipmanımız ve bizim standartlarımızla üretilir.'

