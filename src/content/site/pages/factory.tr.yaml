qc_section:
  tagline: Kalite Kontrol
  title: Test ve Kalite Güvence Süreci
  subtitle: Her tahta sevkiyat öncesi zorunlu testlerden geçer. Kalite laboratuvarımız üretimden bağımsız çalışır ve doğrudan yönetime raporlar.
  steps:
    - step: '1'
      title: Hammadde Denetimi
      desc: 'PVC, Hypalon ve drop-stitch kumaşlar, herhangi bir parti üretime girmeden önce çekme testi, yırtılma yayılımı ve UV direnci doğrulamasından geçirilir.'
    - step: '2'
      title: 24 Saatlik Hava Tutma Testi
      desc: 'Her tüp oda 18.0 PSI’a şişirilir ve 24 saat tutulur. 0.50 PSI’ın üzerindeki basınç düşümü otomatik ret ve dikiş yeniden denetimini tetikler.'
    - step: '3'
      title: Yük ve Dengeleme Testi
      desc: 'Tamamlanan tahtalar anma basıncına şişirilir; simetrik şişme, 15 PSI’da rijitlik ve yük altında stabilite kontrol edilir. Her tahta, son denetim öncesi test havuzumuzda ıslak teste tabi tutulur.'
oem_section:
  tagline: OEM Projeleri
  title: 'Marka ve OEM İş Ortaklığı Vaka Çalışmaları'
  subtitle: 'Konseptten üretime kadar — küresel markaların şişirilebilir SUP hatlarını lanser etmelerine ve ölçeklendirmelerine nasıl yardımcı oluyoruz.'
  cases:
    - challenge: 'Avrupa açık hava perakendecisi, benzersiz güverte grafikleri, çevre dostu PVC ve perakendeye hazır ambalajlama gerektiren özel markalı bir SUP hattı istedi — hepsi 60 günde teslim edildi.'
      solution: 'Özel dijital baskı dosyaları geliştirdik, REACH uyumlu PVC tedarik ettik ve tasarım ekibini Qingdao fabrikamızla aynı lokasyonda konumlandırarak numune alma sürecini 3 turdan 1’e indirdik.'
      result: 'İmzalı PO’dan itibaren 25–35 gün üretim; ilk sevkiyat 60 günlük varış penceresi içinde gerçekleşti. 4 SKU üzerinden 2.400 adet. İlk parti tamamen teslim edilmeden yeniden sipariş verildi.'
      disclaimer: 'Anonimleştirilmiş proje özeti — proje tipi ve kapsam temsilidir; somut sonuçlar bağımsız olarak doğrulanamaz.'
    - challenge: 'ABD su sporları girişimi, perakende yerleşimi için özel biçimli, ortak markalı ambalajlı ve BSCI sertifikalı yüksek performanslı drop-stitch SUP talep etti.'
      solution: 'Mevcut SUP kalıbını değiştirilmiş konturla uyarladık, ortak markalı ambalaj görselini geliştirdik ve eksiksiz BSCI denetim belgelerini sağladık.'
      result: 'ABD’deki önde gelen açık hava perakendecilerinde başarıyla raflandı; 1. yılda 5.000 adedin üzerinde satış ve %98 satışa dönüşüm oranıyla güçlü ivme sağlandı.'
      disclaimer: 'Anonimleştirilmiş proje özeti — proje tipi ve kapsam temsilidir; somut sonuçlar bağımsız olarak doğrulanamaz.'
    - challenge: 'Avustralya distribütörü, özel renkli ve Avustralya standartlarına uyumlu CE sertifikalı bir SUP serisi talep etti.'
      solution: 'Üretim öncesi numuneleri 4 renk varyantıyla ürettik ve üçüncü taraf uyum testlerini koordine ettik.'
      result: '3 modelli SUP serisi AU/NZ pazarında lansman edildi. Ardından 12 adet devriye SUP için kamu ihalesi kazanıldı.'
      disclaimer: 'Anonimleştirilmiş proje özeti — proje tipi ve kapsam temsilidir; somut sonuçlar bağımsız olarak doğrulanamaz.'

faq_section:
  tagline: SSS
  title: B2B ve OEM Hakkında Sıkça Sorulan Sorular
  questions:
    - q: OEM şişirilebilir SUP tahtaları için minimum sipariş miktarı (MOQ) nedir?
      a: 'MOQ sabit bir sayı yerine proje yapılandırmasıyla belirlenir — gövde ve kalıp, renk seçenekleri ve PVC, görsel sanat, ambalajlama ve aksesuarlar. Standart hacim üretimi tam bir 150 m drop-stitch rulosundan parti başına 90–100+ adet ile yürür, küçük partili ortak marka 5–10 adetten başlar ve her proje numune (1–2 adet) ile pilot (20–50 adet) aşamalarından geçer. Eksiksiz hesaplama mantığı için MOQ ve Esnek Markalama Kılavuzumuzu inceleyin.'
    - q: Vatrad BSCI sertifikasına sahip mi?
      a: 'Evet. Fabrikamız geçerli BSCI sosyal uyum sertifikasını sürdürmektedir (denetim raporu talep üzerine mevcuttur). Ayrıca kalite yönetimi için ISO 9001 belgesine sahibiz. CE sertifikası AB pazarlarına yönelik modeller için geçerlidir; kapsam proje bazında teyit edilir. REACH ve RoHS uyum belgeleri her OEM siparişiyle birlikte sağlanır.'
    - q: Bir OEM siparişi için tipik teslim süresi nedir?
      a: 'Standart teslim süresi, toplu OEM üretimi için onaylanmış PO ve depozitodan itibaren 25–35 gündür. Özel kalıp geliştirme, kalıp işleme için 15–20 gün ekler. Acil siparişler ve sezon yoğunlukları için hızlı üretim mevcuttur. Prototip numuneleri genellikle 7–12 gün içinde hazırdır.'
    - q: İhracat belgelerini siz mi yönetiyorsunuz?
      a: 'Evet. Ekibimiz ihracat belgelerini ve gümrük müklemesini içeride yönetir; AB, ABD, Avustralya ve Asya pazarlarında 50’den fazla ülkeye tedarik sağlıyoruz.'

b2b_moq: 'MOQ proje yapılandırmasıyla belirlenir: numune 1–2, pilot 20–50, hacim 90–100+ (rulo başına 150 m); küçük partili ortak marka 5–10 adetten başlar.'

production_flow:
  tagline: Üretim Akışı
  title: 'Malzemeden Bitmiş Tahtaya'
  subtitle: 'Her tahta, her adımda QC kontrol noktalarıyla 6 üretim aşamasından geçer. Kısayol yok, atlanan denetim yok.'
  stages:
    - stage: '01'
      title: Malzeme Kabulü ve Giriş QC’si
      description: 'Gelen tüm malzemeler ERP sistemimizde parti/numara bazında kaydedilir. PVC kumaş rulo, drop-stitch çekirdek, supap, yapıştırıcı ve donanımlar, QC onayı verene kadar karantinaya alınır.'
      qc_check: 'Çekme dayanımı (ASTM D751), yırtılma direnci (ISO 4674), kalınlık ölçümü, yapıştırıcı viskozitesi, görsel kusur taraması'
      qc_threshold: 'Partilerin %100’ü test edilir. Çekme < şartnamenin %90’ı, yırtılma < şartname asgarisi veya herhangi bir görsel kusur varsa ret'
      responsibility: Giriş QC ekibi (3 denetçi)
    - stage: '02'
      title: CNC Kesimi ve Malzeme Hazırlığı
      description: 'Bilgisayar optimizasyonlu yerleşim, israfı en aza indirmek için panelleri PVC stok üzerine yerleştirir. Otomatik CNC kesim makineleri 0.1 mm konumsal hassasiyeti korur.'
      qc_check: 'CAD DXF dosyalarına karşı ölçüsel kontrol, kenar kalitesi denetimi, panel adedi doğrulaması'
      qc_threshold: 'Her 20. panel ölçülür. Tolerans ±0.5 mm. Tolerans dışı oranı >%2 ise parti ret edilir'
      responsibility: Kesim atölyesi sorumlusu
    - stage: '03'
      title: Kaynak ve Drop-Stitch Yapıştırma
      description: 'Drop-stitch çekirdekleri ısı laminasyonu ile dış PVC katmanlarına yapıştırılır. Tüp odaları RF ile veya sıcak hava ile kaynaklanır. Ray bantları üç katmanlı füzyonla yapıştırılır.'
      qc_check: 'Her 50 adette soyma testi (ASTM D751), kaynak genişliği ölçümü, sıcak hava sıcaklık kaydı incelemesi, arka ışıkta görsel dikiş denetimi'
      qc_threshold: 'Soyma dayanımı en az 8 N/cm. Kaynak genişliği toleransı ±1 mm. Görünür kanal oluşumu varsa ret'
      responsibility: Kaynak QC (vardiya başına 2 denetçi)
    - stage: '04'
      title: Montaj ve Aksesuar Takımı
      description: 'Tahtalar, tüm bileşenlerin bir araya geldiği son montaja geçer: güverte ve gövde panelleri kaynaklanır, supaplar takılır, D halkaları, tutamaklar, fin kutuları ve taşıma çantası monte edilir. Her birim 100 maddelik montaj kontrol listesini izler.'
      qc_check: 'Birim başına 100 maddelik kontrol listesi onayı, supap işlev testi (10 açma/kapama çevrimi), donanım tork doğrulaması, görsel denetim'
      qc_threshold: 'Güvenlik açısından kritik kalemlerde (supaplar, D halkaları, tutamaklar) sıfır kusur politikası. Hafif kozmetik: AQL 2.5 (ISO 2859)'
      responsibility: Montaj ekip lideri + hat QC’si
    - stage: '05'
      title: Basınç Testi ve Kalite Bekleme
      description: 'Her oda 18.0 PSI’a (12–15 PSI anma değerli bir SUP için) şişirilir ve 24 saat tutulur. Basınç sensörleri sürekli kayıt yapar. 0.50 PSI basınç düşümünü aşan odalar reddedilir ve dikiş yeniden denetimine gönderilir.'
      qc_check: '24 saatlik basınç tutma kaydı, sensör kalibrasyonunun günlük doğrulanması, sıcaklık kompanzasyonlu basınç okuması, onarımdan sonra dikiş yeniden testi'
      qc_threshold: 'Kararlı sıcaklıkta 24 saatte en fazla 0.50 PSI basınç düşümü. Bu eşiği aşan her oda için üretim partisinin tamamı %100 yeniden teste tabi tutulur'
      responsibility: Kalite laboratuvarı (üretimden bağımsız, yönetime raporlar)
    - stage: '06'
      title: Son Denetim ve Ambalajlama
      description: 'Son görsel ve işlevsel denetim. Yüzey kusurları, renk tutarlılığı, etiket/BIN doğrulaması, ambalaj bütünlüğü ve aksesuar eksiksizliği. Birimler vakumlanır, kutuya alınır ve konteyner yüklemesi için paletlenir.'
      qc_check: 'Eksiksiz görsel denetim, SKU başına aksesuar kontrol listesi, ambalaj düşürme testi (1 m, rastgele numune), etiket/barkod taraması doğrulaması'
      qc_threshold: 'Ana kusurlar için AQL 2.5, hafif kusurlar için AQL 4.0. Güvenlik kusurlarında sıfır tolerans. Birimlerin %100’ü görsel olarak denetlenir'
      responsibility: Son QC ekibi (4 denetçi) + Ambalajlama ekip lideri
workforce:
  tagline: İnsanlarımız
