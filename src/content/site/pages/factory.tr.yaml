workshops_section:
  tagline: Atölyeler
  title: Üretim Atölyeleri
  workshops:
    - title: PVC Kesimi ve Malzeme Hazırlığı
      description: Otomatik CNC kesim makineleri, PVC, Hypalon ve drop-stitch kumaşları mikrometre altı hassasiyetle işler. Bilgisayar optimizasyonlu yerleşim malzeme israfını en aza indirir ve her panelin kaynak öncesinde ölçü şartnamesine uymasını sağlar.
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: Qingdao fabrikasında şişirilebilir SUP kumaş panellerini hazırlayan CNC PVC kesim makinesi
    - title: Boru Kaynağı ve Isı Yapıştırma
      description: Isı yapıştırma makineleri ve RF dielektrik presleri ile ayrılmış kaynak atölyesi. Sıcak havalı ısı yapıştırıcılar PVC tüp odalarını birleştirir ve kaynaştırır; RF kaynak ise yüksek dayanımlı, hava sızdırmaz dikişler üretir ve gereksinimleri aşar.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Qingdao fabrikasında şişirilebilir tekne tüp odalarını kaynaklayan RF kaynak makinesi
    - title: Drop-Stitch Çekirdek Yapıştırması
      description: SUP tahtası drop-stitch çekirdekleri ısı laminasyonu ile dış PVC katmanlarına yapıştırılır. Binlerce iç polyester iplik üst ve alt katmanı birbirine bağlayarak 12-15 PSI’da rijit bir yapı oluşturur. Ray bantları kenar dayanımı için üç katmanlı füzyonla yapıştırılır.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Qingdao fabrikasında drop-stitch çekirdek yapıştırma ekipmanlarıyla şişirilebilir SUP üretim hattı
    - title: SUP Baskısı ve Dekorasyonu
      description: SUP tahtaları tam renkli grafikler için dijital baskı, logolar ve tekrarlayan desenler için ekran baskısı ile süslenir. Dijital yazıcılar fotoğraf kalitesinde güverte tasarımları üretirken ekran baskısı dayanıklı ve canlı marka işaretleri sağlar.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Qingdao şişirilebilir SUP fabrikasında üretim bölümünün iç mekanı
    - title: Son Montaj ve Aksesuar Takımı
      description: Her SUP tahtasına supapların, D halkalarının, tutamakların, fin kutularının ve güverte pedlerinin takıldığı montaj hattı. Her tahta, ekip lideri tarafından imzalanan 100 maddelik montaj kontrol listesini izler.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Qingdao fabrikasında montaj istasyonları bulunan üretim bölümü
    - title: Kalite Testi ve Denetim
      description: Tamamlanan her tahta, sevkiyat öncesi zorunlu hava tutma testi, dikiş soyma doğrulaması ve eksiksiz sistem kontrolünden geçirilir. Kalite laboratuvarımız üretimden bağımsız çalışır ve doğrudan yönetime raporlar.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Qingdao fabrikasında sevkiyat öncesi hava tutma için şişirilebilir SUP basınç testi
