workshops:
  - title: SUP-productie
    description: '4 geautomatiseerde assemblagelijnen voor opblaasbare SUP''s met een gecombineerde productie van circa 10.000 planken per maand. De digitale print- en zeefdrukposten opereren parallel. Jaarlijkse SUP-capaciteit: meer dan 120.000 planken.'
    output: '120.000+ SUP''s/jaar'
  - title: SUP-productie — uitbreidingslijnen
    description: 'Verdere geautomatiseerde assemblagelijnen voor SUP''s, geactiveerd zodra de volumes groeien. Het verlijmen van de drop-stitch kern, het digitaal printen en de assemblageposten opereren parallel.'
    output: 'Deel van de jaarlijkse capaciteit van meer dan 120.000 SUP''s'
  - title: SUP-accessoires & gemengde assemblage
    description: 'Multi-functionele assemblagelijnen voor SUP-accessoires — peddels, vinnen, leash, tassen en kits. Hetelucht-lasposten, HF-diëlektrische persen en assemblagebanken worden gereconfigureerd op basis van de order-mix. Jaarlijkse accessoirecapaciteit: meer dan 5.000 eenheden.'
    output: '5.000+ accessoires/jaar'
  - title: Veiligheidsuitrusting
    description: 'Aparte cleanroom-productieafdeling voor reddingsvesten en veiligheidsuitrusting. Speciale posten voor naaien, het inbrengen van schuim en het testen. Jaarlijkse capaciteit van reddingsvesten: meer dan 50.000 eenheden.'
    output: '50.000+ reddingsvesten/jaar'

oem_capacity:
  moq: 'SUP: monster 1–2 | pilot 20–50 | hoeveelheid 90–100+ (per rol van 150 m)'
  lead_time: 'Standaard 25–35 dagen. Monsters 7–12 dagen. Express beschikbaar.'
  payment: 'T/T 30% aanbetaling + 70% saldo. L/C, Western Union geaccepteerd.'

lead_time_explainer:
  tagline: 'Planning & schedulering'
  title: 'Hoe de capaciteit jouw levering wordt'
  subtitle: 'Capaciteit is geen enkel getal — zo worden de levertijden werkelijk toegewezen.'
  items:
    - title: 'De capaciteit varieert met jouw specificatie'
      body: 'De beschikbare slots verschuiven met het planktype, de constructiecomplexiteit, de verpakking en de seizoensvraag. Tijdens de lente-/zomeropbouw draaien de lijnen vrijwel op volle capaciteit en raken de monsterslots het eerst vol.'
    - title: 'Plan vóór jouw lanceerseizoen'
      body: 'Stel de monsterbevestiging en de graphics-freeze ruim van tevoren vast. Herhalingsorders worden in jouw overeengekomen herhalingsslot gepland zodra het golden sample is gearchiveerd.'
    - title: 'Drie schedulingsbanen'
      body: 'Monsters gaan eerst de prototypelijn in, eerste orders belanden in het volgende vrije assemblagevenster en herhalingsorders draaien in hun herhalingsslot.'
    - title: 'Bindende levertijden na verificatie'
      body: 'We bevestigen een bindende levertijd pas nadat specificatie, graphics, verpakking en hoeveelheid zijn geverifieerd — nooit als een vaste belofte op voorhand.'

cta:
