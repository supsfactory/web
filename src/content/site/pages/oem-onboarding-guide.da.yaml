answer:
  label: 'Det korte svar'
  text: 'Et typisk OEM-onboarding tager 2–4 uger til godkendelse af prøvebrætter og 6–8 uger til den første produktionsserie fra bekræftet PO. Du begynder ved at indsende et projekbrief (brætspecifikationer, volumen, overholdelseskrav). Vi svarer inden for en arbejdsdag, tilbyder en NDA, før du deler fortrolige detaljer, og producerer 1–2 fysiske prøvebrætter på 7–12 dage til din gennemgang og godkendelse. Når prøvebrættet er fastlåst, følger produktionsplanlægning og fremstilling med faste QC-spor i hvert trin. Alle trin er dokumenterede og spørgsmålbare.'
  verified: 'September 2026'

process_steps:
  tagline: De syv spærringer
  title: 'Onboardingflow — syv spærringer fra brief til levering'
  subtitle: 'Hver spærring har et defineret input, et defineret output og en tidsplan, du aftaler på forhånd. Du går aldrig videre uden et udtrykkeligt OK.'
  steps:
    - step: 'Spærring 1'
      title: 'Første forespørgsel og NDA (dag 0)'
      desc: 'Indsend et projekbrief via /da/contact med dine ønskede brætspecifikationer, ordrevægt, overholdelseskrav og tidsplan. En NDA er tilgængelig med det samme — inden du deler fortrolige tekniske specifikationer eller artwork. Svar inden for en arbejdsdag.'
    - step: 'Spærring 2'
      title: 'Gennemgang af muligheder og tilbud (dag 1–5)'
      desc: 'Konstruktion gennemgår dit brief i forhold til produktionskapacitet, materialetilgængelighed og overholdelsesomfang. Du modtager et specificeret tilbud med beregning af minimumsordrestørrelse, prøvegebyrer (som modregnes produktionen) og led i leveringstiden — ikke et område, men en tidsplan for hvert spærring.'
    - step: 'Spærring 3'
      title: 'Produktion af prøvebrætter (dag 6–17)'
      desc: '1–2 fysiske brætter produceres efter din specifikation: skrogstivhed, tekstur på EVA-gripflade, grafisk nøjagtighed, tilbehørspasform. Du pagajer og vurderer brættet, før du binder dig til noget andet. Prøvegebyrerne modregnes din produktionsordre ved underskrift af kontrakten.'
    - step: 'Spærring 4'
      title: 'Gennemgang og godkendelse af prøvebræt (dag 18–21)'
      desc: 'Du vurderer prøvebrættet mod dine specifikationer — køreegenskaber, grafisk troværdighed, emballage, tilbehør. Justeringer registreres i en revideret BOM og en godkendt artworkversion. Den fastlåste specifikation bliver produktionsreferencen for alle efterfølgende serier.'
    - step: 'Spærring 5'
      title: 'Planlægning før produktion (dag 22–28)'
      desc: 'Indkøb af materialer, opsætning af værktøj, bekræftelse af emballage og reservation af produktionsplads. Alle materialer modtages og inspiceres mod den fastlåste BOM. En produktionsplan med datoer for QC-spor udstedes, før fremstillingen begynder.'
    - step: 'Spærring 6'
      title: 'Produktion og QC-spor (dag 29–55)'
      desc: 'Fremstillingen gennemløber systemet med 7 inspektionstrin: inspektion af modtagne materialer, inspektion af drop-stitch-dug, svejsning og samling, tryk- og lufttæthedstest (holdeprøvning ved 18.0 PSI, automatisk kassation ved fald på over 0.50 PSI), montage af EVA-flader og tilbehør, QC af grafik og branding samt endelig emballage og dokumentation. Hvert spor har kriterier for bestået/faldet og spørgsmålsrekorder.'
    - step: 'Spærring 7'
      title: 'Afsendelse og opfølgning efter levering (dag 56–63)'
      desc: 'Eksportkvalitetsemballage, overholdelsesdokumentation (CE, ISO 9001, BSCI, REACH, RoHS) samt koordinering af søfragt til 50+ lande. En opfølgning efter levering registrerer læringer og forbedringer til den næste ordrerydde.'

