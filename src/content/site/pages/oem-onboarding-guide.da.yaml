checklist:
  heading: 'Hvad du skal forberede, før du sender dit projekbrief'
  body: |
    Jo mere færdigt dit brief er, desto hurtigere og mere præcist bliver tilbuddet. Her er, hvad du bør have klar:

    - **Brætspecifikationer** — Ønsket længde, bredde, tykkelse, ryttervægtsinterval og tilsigtet brug (touring, allround, surf, fiskeri, yoga osv.). Har du dimensioner på et referencebræt eller en konkurrentmodel, så tag dem med.
    - **Designfiler** — Vektorartwork (AI, SVG eller PDF) til brættets grafik, logo på EVA-flader og eventuel sekundær branding. Er artworket ikke klar, er en moodboard eller referencebilleder nok til den første gennemgang af mulighederne.
    - **Ordrevægt og tidsplan** — Din ønskede mængde til den første ordre og det sæson, du skal ramme. Selv et groft interval ("20–50 brætter inden marts") er nok til at bekræfte mulighederne og ledighed i kalenderen.
    - **Overholdelseskrav** — Målmarkeder (EU, Nordamerika, Australien osv.) og eventuelle særlige certificerings- eller testkrav ud over vores standardomfang (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Budgetinterval** — Et vejledende budget pr. bræt eller en målpris landet hjælper os med at anbefale den rette platform og konstruktionsniveau. Eksakte priser bekræftes først efter gennemgang i konstruktionen — aldrig før.

    Hvis du ikke har alt dette endnu, så send, hvad du har. Vi guider resten.

evidence_review:
  tagline: 'Dokumentation & verifikation'
  title: 'SPECIFIKATIONER VERIFICERET'
  body: 'Alle produktionspåstande på denne side er verificeret af vores produktionsingeniørteam på fabrikken i Laixi, Qingdao. Certifikater, QC-inspektionsrekorder, tryk- og strukturtestrapporter samt logfiler for batchspørgsmål er tilgængelige på forespørgsel. Specifikationerne blev senest verificeret i september 2026.'

faqs:
  tagline: FAQ
  title: 'OEM-onboarding — ofte stillede spørgsmål'
  items:
    - q: 'Hvor lang tid tager hele onboardingprocessen?'
      a: 'Godkendelse af prøvebrætter tager typisk 2–4 uger (inklusive produktion af prøvebrætter på 7–12 dage og din gennemgangstid). Den første produktionsserie tager 6–8 uger fra bekræftet PO og depositum. En specialform tilføjer 15–20 dage til udvikling af formen. Alle spærringer har en fast tidsplan, du aftaler på forhånd.'
    - q: 'Skal jeg underskrive en NDA, før jeg deler mit design?'
      a: 'En NDA er tilgængelig med det samme på forespørgsel — inden du deler fortrolige tekniske specifikationer eller artwork. Vi fremstiller udelukkende under vores kunders mærker og konkurrerer aldrig med dem på noget marked. Samme politik gælder for et prøvebræt på 1 stk. som for et containerprogram.'
    - q: 'Hvad er minimumsordren for den første OEM-serie?'
      a: 'Indgangspunktet er trinvis: først 1–2 prøvebrætter (klar på 7–12 dage), derefter en prøve- eller pilotordre på 20–50 brætter (produktion på 25–35 dage) og til sidst standardvolumenserier på 90–100+ brætter pr. godkendt konfiguration. Co-branding i små serier starter fra 5–10 stk., når et udviklingstrin ikke er nødvendigt. Prøvegebyrerne modregnes din produktionsordre.'
    - q: 'Hvordan håndteres beskyttelse af intellektuelle rettigheder under onboarding?'
      a: 'Dine designs og specifikationer er beskyttet af den NDA, der er underskrevet, før nogen fortrolige oplysninger deles. Al artwork, BOM-data og tekniske filer opbevares i adgangskontrollerede systemer med revisionsspor. I OEM-modellen ejer du alle intellektuelle rettigheder. I ODM-modellen deles IP på den tilpassede platform efter aftale. I Private Label-modellen forbliver IP hos iSupfactory, og du licenserer brandanvendelsen.'
    - q: 'Hvilke kvalitetsgarantier gælder for den første ordre?'
      a: 'Ethvert bræt — prøvebræt, prøveordre eller volumen — gennemgår det samme system med 7 inspektionstrin: inspektion af modtagne materialer, inspektion af drop-stitch-dug, svejsning og samling, 24 timers tryk- og lufttæthedstest (holdeprøvning ved 18.0 PSI, automatisk kassation ved fald på over 0.50 PSI), montage af EVA-flader og tilbehør, QC af grafik og branding samt endelig emballage og dokumentation. Kvaliteten nedprioriteres aldrig på grund af ordrestørrelsen.'

