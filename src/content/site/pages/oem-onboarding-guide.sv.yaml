checklist:
  heading: 'Vad du bör förbereda före projektbriefingen'
  body: |
    Ju mer komplett din briefing är, desto snabbare och mer exakt blir offerten. Så förbereder du dig:

    - **Brädspecifikationer** — mållängd, bredd och tjocklek, användarens viktintervall och tänkt användning (touring, allround, surf, fiske, yoga etc.). Har du referensmått eller en modell från en konkurrent, lägg till dem.
    - **Designfiler** — vektorgrafik (AI, SVG eller PDF) för brädgrafiken, logotypen på EVA-deckpadsen och den sekundära varumärkessättningen. Är grafiken inte klar räcker ett moodboard eller referensbilder för den första genomförbarhetskontrollen.
    - **Antal & planering** — din målmängd för den första beställningen och den säsongstidplan du måste hålla. Även ett grovt intervall (t.ex. ”20–50 brädor före mars”) hjälper oss att bekräfta genomförbarheten och tillgången till produktionsplatser.
    - **Överensstämmelsekrav** — målmarknader (EU, Nordamerika, Australien etc.) och eventuella certifierings- eller testkrav utöver våra standarder (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Budget** — en indikativ budget per bräda eller ett målvärde på platsen hjälper oss att rekommendera rätt plattform och nivå. Det exakta priset bekräftas först efter den tekniska granskningen — aldrig tidigare.

    Har du inte allt, skicka det du har. Vi vägleder dig genom resten.

evidence_review:
  tagline: 'Bevis & verifiering'
  title: 'KONTROLLERADE SPECIFIKATIONER'
  body: 'Alla produktionspåståenden på denna sida har verifierats av vårt Manufacturing Engineering-team i fabriken i Laixi, Qingdao. Certifikat, QC-inspektionsprotokoll, tryck- och strukturtester och register över partispårbarhet finns tillgängliga på begäran. Specifikationerna verifierades senast i september 2026.'

faqs:
  tagline: FAQ
  title: 'OEM-onboarding — vanliga frågor'
  items:
    - q: 'Hur länge tar hela onboardingprocessen?'
      a: 'Provgodkännandet tar normalt 2–4 veckor (inklusive provproduktion på 7–12 dagar och din granskningsfas). Den första produktionscykeln tar 6–8 veckor från bekräftad beställning och handpengar. En ny skalpform lägger till 15–20 dagars formbygge. Varje port har en i förväg avtalad genomlöpningstid.'
    - q: 'Måste jag underteckna ett NDA innan jag delar min design?'
      a: 'Ett NDA finns direkt på begäran — före delning av egna tekniska specifikationer eller artwork. Vi tillverkar uteslutande under våra kunders varumärken och konkurrerar inte med dem på någon marknad. Samma policy gäller för ett enda prov som för ett containerprogram.'
    - q: 'Vilken är minsta beställningsmängd för en första OEM-cykel?'
      a: 'Starten är trappstegsvis: först 1–2 prover (tillgängliga inom 7–12 dagar), därefter en prov- eller pilotorder på 20–50 brädor (produktion på 25–35 dagar), sedan standardmängder på 90–100+ brädor per godkänd konfiguration. Co-branding i små partier startar från 5–10 stycken om ingen utvecklingsfas behövs. Provkostnaderna räknas av mot produktionsbeställningen.'
    - q: 'Hur regleras skyddet av den immateriella äganderätten under onboarding?'
      a: 'Dina designer och specifikationer skyddas av det NDA som undertecknas före utbytet av egna uppgifter. All artwork, BOM-data och tekniska filer förvaras i system med åtkomstkontroll och spårbar granskningslogg. I OEM-läge äger du all IP. I ODM-läge är den anpassade plattformens IP delad såsom avtalats. I Private Label-läge är IP:t iSupfactory:s och du får en licens för varumärkessättningen.'
    - q: 'Vilka kvalitetsgarantier gäller för en första beställning?'
      a: 'Varje bräda — prov, provmängd eller volym — går igenom samma system med 7 inspektionsportar: varumottagningskontroll, kontroll av drop-stitch-tyget, svetsning & montering, 24-timmars tryck- och lufttätningstest (18.0 PSI hållning, automatisk kassering över 0.50 PSI), montage av EVA-deckpad & tillbehör, grafik- & varumärkes-QC, slutförpackning & dokumentation. Kvaliteten sänks aldrig för mindre beställningar.'
    - q: 'Vad är det första praktiska steget?'
      a: 'Fyll i /sv/contact#project-brief med planerade specifikationer, målmängd och planering. Vi svarar inom en arbetsdag med genomförbarhetskontrollen och ett offertförslag post för post. Allt annat i processen är dokumenterat port för port, från NDA till leverans.'

