answer:
  label: 'Kort svar'
  text: 'En typisk OEM-onboarding tar 2–4 veckor till provgodkännandet och 6–8 veckor för den första produktionscykeln räknat från orderbekräftelsen. Du börjar med en projektbriefing (brädspecifikationer, antal, överensstämmelsekrav). Vi svarar inom en arbetsdag, erbjuder ett NDA före utbytet av egna data och tillverkar 1–2 fysiska prover på 7–12 dagar för din bedömning och ditt godkännande. När provet är fryst följer produktionsplaneringen och produktionen med fasta QC-portar i varje fas. Varje steg är dokumenterat och spårbart.'
  verified: 'September 2026'

process_steps:
  tagline: 'De sju portarna'
  title: 'Onboardingförlopp — sju portar från briefing till leverans'
  subtitle: 'Varje port har en definierad input, en definierad output och en i förväg avtalad genomlöpningstid. Du passerar ingen port utan uttryckligt godkännande.'
  steps:
    - step: 'Port 1'
      title: 'Första förfrågan & NDA (dag 0)'
      desc: 'Skicka via /contact en projektbriefing med dina målbrädspecifikationer, beställningsmängden, överensstämmelsekraven och tidplanen. Ett NDA finns omedelbart tillgängligt — före delning av egna tekniska specifikationer eller artwork. Svar inom en arbetsdag.'
    - step: 'Port 2'
      title: 'Genomförbarhetskontroll & offert (dag 1–5)'
      desc: 'Konstruktionsavdelningen kontrollerar din briefing avseende produktionskapacitet, materialtillgänglighet och överensstämmelseomfattning. Du får ett offertförslag post för post med MOQ-beräkning, provkostnader (som räknas av mot produktionen) och en specifikation av genomlöpningstider — inga grova intervall utan en planering port för port.'
    - step: 'Port 3'
      title: 'Provproduktion (dag 6–17)'
      desc: '1–2 fysiska brädor enligt din specifikation: skalpens styvhet, det halksäkra EVA-deckpadets vidhäftning, grafikens trogenhet, tillbehörens passform. Du testar och bedömer brädan innan du binder dig till något slutgiltigt. Provkostnaderna räknas av mot produktionsbeställningen vid undertecknad kontrakt.'
    - step: 'Port 4'
      title: 'Provgranskning & godkännande (dag 18–21)'
      desc: 'Du bedömer provet mot din specifikation — känslan, grafikens trogenhet, förpackning, tillbehör. Ändringar tas in i en reviderad BOM och ett godkännande av artwork. Den frysta specifikationen blir produktionsreferensen för alla efterföljande cykler.'
    - step: 'Port 5'
      title: 'Planering före produktion (dag 22–28)'
      desc: 'Materialinköp, installation av formverktyg, bekräftelse av förpackningen och reservation av produktionsplatsen. Alla material kontrolleras vid mottagning mot den frysta BOM:en. Före produktionsstart utfärdas en produktionsplan med QC-portarnas datum.'
    - step: 'Port 6'
      title: 'Produktion & QC-portar (dag 29–55)'
      desc: 'Produktionen går igenom systemet med 7 inspektionsportar: varumottagningskontroll, kontroll av drop-stitch-tyget, svetsning & montering, tryck- och lufttätningstest (24 timmars hållning vid 18.0 PSI, automatisk kassering över 0.50 PSI), montage av EVA-deckpad & tillbehör, grafik- & varumärkes-QC, slutförpackning & dokumentation. Varje port har godkänd/underkänd-kriterier och spårbarhetsprotokoll.'
    - step: 'Port 7'
      title: 'Leverans & uppföljning (dag 56–63)'
      desc: 'Exportklar förpackning, överensstämmelsedokumentation (CE, ISO 9001, BSCI, REACH, RoHS) och koordinering av sjöfrakt till över 50 länder. En uppföljning efter leverans fångar upp lärdomar och förbättringar för nästa ordercykel.'

