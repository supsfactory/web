meta:
  title: 'Conformité SUP par marché — CE, REACH, RoHS, BSCI, ISO 9001 | SUPsfactory'
  description: 'Guide de conformité pour planches SUP gonflables par marché : CE (UE), CPSIA (USA), AS/NZS (AU), ISO 9001, BSCI, REACH et RoHS — périmètre et docs par marché.'
  dateModified: '2026-08-21'
