answer:
  label: 'Was als Nächstes passiert'
  text: 'Nachdem Sie ein Projektbriefing eingereicht haben, erhalten Sie innerhalb eines Werktags eine Antwort. Vor der Weitergabe vertraulicher Details ist eine NDA verfügbar. Engineering prüft Ihr Briefing und liefert ein aufgeschlüsseltes Angebot mit MOQ, Mustergebühren und einem stufenweisen Zeitplan — in der Regel 7–12 Tage für Muster und 6–8 Wochen für die erste Produktion ab bestätigter PO. Mustergebühren werden auf Ihre Produktionsbestellung angerechnet. Keine Verbindlichkeit, bis Sie unterschreiben.'
  verified: 'September 2026'

process_steps:
  tagline: Der Prozess
  title: 'Vom Briefing zu gelieferten Boards — fünf Schritte'
  subtitle: 'Jeder Schritt hat einen definierten Zeitrahmen, ein dokumentiertes Ergebnis und einen Go/No-Go-Meilenstein. Sie gehen nur dann weiter, wenn Sie bereit sind.'
  steps:
    - step: 'Schritt 1'
      title: 'Reichen Sie Ihr Projektbriefing ein'
      desc: 'Erzählen Sie uns von Ihrem Board — Ziel-Spezifikationen, Stückzahl, Konformitätsanforderungen und Zeitplan. Das Briefing dauert 5–10 Minuten. Wenn Sie sich bei jedem Detail nicht sicher sind, teilen Sie, was Sie haben, und wir führen Sie durch den Rest. Eine NDA ist verfügbar, bevor Sie vertrauliche Designs teilen.'
    - step: 'Schritt 2'
      title: 'NDA & Machbarkeitsprüfung (1–5 Tage)'
      desc: 'Wir unterzeichnen auf Wunsch eine NDA, anschließend prüft Engineering Ihr Briefing gegen Fertigungskapazität, Materialverfügbarkeit und Konformitätsscope. Sie erhalten ein aufgeschlüsseltes Angebot mit MOQ-Berechnung, Mustergebühren und einem stufenweisen Zeitplan.'
    - step: 'Schritt 3'
      title: 'Muster & Freigabe (7–21 Tage)'
      desc: '1–2 physische Boards nach Ihrer Spezifikation. Sie paddeln und bewerten — Rumpfsteifigkeit, Grafikgenauigkeit, Zubehörpassung. Änderungen werden in einer überarbeiteten BOM erfasst. Das freigegebene Muster wird zur Produktionsreferenz. Mustergebühren werden auf die Produktion angerechnet.'
    - step: 'Schritt 4'
      title: 'Vorproduktionsplanung (7 Tage)'
      desc: 'Materialbeschaffung, Werkzeugaufbau, Verpackungsbestätigung und Reservierung des Produktionsslots. Alle Materialien werden gegen die eingefrorene BOM eingangsgeprüft. Ein Produktionsplan mit QC-Gate-Terminen wird vor Produktionsbeginn ausgegeben.'
    - step: 'Schritt 5'
      title: 'Produktion, QC & Versand (4–6 Wochen)'
      desc: 'Die Fertigung läuft durch das 7-stufige Inspektions-Gate-System mit Bestanden/Nicht-bestanden-Kriterien an jedem Gate. Exportgerechte Verpackung, Konformitätsdokumentation und Seefrachtkoordination in über 50 Länder. Eine Nachlieferanalyse erfasst Verbesserungen für die nächste Bestellung.'

