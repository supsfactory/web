what_we_need:
  heading: 'Was Sie vor Ihrem Briefing vorbereiten sollten'
  body: |
    Ein vollständiges Briefing beschleunigt den Prozess. Das hilft:

    - **Board-Spezifikationen** — Ziellänge, -breite, -dicke, Fahrergewicht, Einsatzzweck. Referenzmaße von Boards oder Konkurrenzmodelle sind hilfreich.
    - **Designdateien** — Vektorgrafiken (AI, SVG, PDF) für Grafiken und Logos. Falls noch nicht fertig, reichen Moodboards oder Referenzbilder für die erste Machbarkeit.
    - **Menge & Zeitplan** — Zielstückzahl und Saisonplan. Schon ein grober Rahmen („20–50 Boards bis März") reicht zum Start.
    - **Konformitätsanforderungen** — Zielmärkte und spezifische Zertifizierungsanforderungen über CE, ISO 9001, BSCI, REACH, RoHS hinaus.
    - **Budgetrahmen** — Ein indikatives Budget pro Board oder ein Ziel-Landed-Cost hilft uns, die richtige Plattform zu empfehlen.

    **Noch nicht alles bereit?** Reichen Sie ein, was Sie haben. Wir führen Sie durch den Rest.

faqs:
  tagline: FAQ
  title: 'Ein SUP-Projekt starten — Häufig gestellte Fragen'
  items:
    - q: 'Wie hoch ist die Mindestbestellung zum Start?'
      a: 'Der Einstieg ist gestaffelt: zuerst 1–2 Muster (7–12 Tage), dann eine Probebestellung von 20–50 Boards (25–35 Tage), danach Standard-Serienläufe von 90–100+ Boards pro freigegebener Konfiguration. Private-Label-Co-Branding startet ab 5–10 Einheiten ohne Entwicklungsphase.'
    - q: 'Wie lange dauert es, Muster zu erhalten?'
      a: 'Physische Muster werden in 7–12 Tagen ab bestätigter Spezifikation und Anzahlung produziert. Mit bestehenden Rumpfplattformen dauert der vollständige Zyklus vom Briefing bis zur gelieferten Probebestellung in der Regel 8–12 Wochen. Ein individueller Rumpf ergänzt 15–20 Tage Formentwicklung.'
    - q: 'Ist mein Design geschützt?'
      a: 'Ja. Eine NDA ist sofort verfügbar — bevor Sie vertrauliche Informationen teilen. Wir fertigen ausschließlich unter den Marken unserer Kunden und konkurrieren nie mit ihnen. Alle technischen Dateien werden in zugriffskontrollierten Systemen mit Audit-Trails gespeichert.'
    - q: 'Was fragt das Projektbriefing-Formular ab?'
      a: 'Das Briefing fragt nach Geschäftstyp, Firmenname, Ziel-Board-Spezifikationen, Bestellmengenrahmen, Zeitplan und eventuellen Konformitätsanforderungen. Es dauert etwa 5–10 Minuten. Sie können Designdateien (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) bis 10 MB anhängen. Wenn Sie bei einem Feld unsicher sind, überspringen Sie es — wir melden uns.'
    - q: 'Was passiert, nachdem ich das Briefing eingereicht habe?'
      a: 'Sie erhalten innerhalb eines Werktags eine Antwort. Engineering prüft Ihr Briefing und liefert ein aufgeschlüsseltes Angebot mit MOQ, Mustergebühren und einem stufenweisen Zeitplan. Keine Verbindlichkeit entsteht, bis Sie den Vertrag geprüft und unterschrieben haben. Mustergebühren werden auf Ihre Produktionsbestellung angerechnet.'

