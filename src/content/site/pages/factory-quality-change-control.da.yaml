cc_intro:
  tagline: 'Omfang & politik'
  title: Grundlæggende styringsprincipper
  body: |
    **Dokument:** QMS-SOP-QC-CC-001 — *Standard for ændringsstyring af parametre i genbearbejdningsprocessen* (Rev 2.0, Officiel udgivelse). **Producent:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Standardhenvisning:** ISO 9001:2015 Quality Management Systems.

    - **Ingen ukontrollerede ændringer.** Ændringer i genbearbejdningsparametre skal gennemgå formel ændringsstyring. Operatører på stedet, holdledere eller en enkeltafdeling må aldrig ændre godkendte genbearbejdningsparametre ved mundtlig aftale eller ved at skrive i en genbearbejdningsregistrering.
    - **Dækning af alle elementer.** Det kontrollerede omfang dækker lufttæthed, ventilpladser, kantbånd, sømbinding, varmlufthærdning og trykholdeprøvning — hver parameter, der kan påvirke tætning, strukturel holdbarhed, udseende, kundens accept eller spørgsmål.
    - **Kundens godkendelse er sidste instans.** Enhver ændring, der flytter et produkt væk fra kundens godkendte prøveeksemplar, tekniske specifikation, BOM, artwork, emballagekrav eller acceptkriterier, implementeres kun med skriftlig godkendelse fra kunden. Uden denne genbearbejdes brættet efter det oprindelige krav, erstattes eller kasseres — aldrig "lempet" af fabrikken alene.

cc_scope:
  tagline: Risikoklassificering
  title: 'Ændringsomfang og risikoklassificering'
  subtitle: 'Ethvert af følgende udløser formel ændringsstyring — det håndteres aldrig ved at skrive en note i genbearbejdningsregistreringen. Risikoniveauet afgør, hvem der godkender, og hvor meget validering der kræves.'
  headers:
    category: Ændringskategori
    examples: 'Typiske eksempler'
    risk: Risiko
    requirements: Krav om kontrol og godkendelse
  rows:
    - category: 'Genbearbejdningsmaterialer'
      examples: 'Lim, rensemiddel, lapemateriale, ventilpakning, primer eller leverandørskift'
      risk: 'Høj'
      requirements: 'Tværfaglig gennemgang + materialekompatibilitet og validering af trykholdeevne + kundens signatur, hvor det er relevant'
    - category: 'Procesforhold'
      examples: 'Overfladeforberedelse, temperatur/luftfugtighed ved varmlufthærdning, klemtryk, holdetid'
      risk: 'Høj'
      requirements: 'Godkendelse fra Konstruktion + Kvalitet med validering af defineret temperatur- og luftfugtighedsvindue'
    - category: 'Værktøj & måleinstrumenter'
      examples: 'Manometre, lækagedetektorer, varmluftpistoler, ventilværktøj, testsoftware'
      risk: 'Mellem/høj'
      requirements: 'Kontrol af kalibreringens gyldighed + vurdering af udstyrets egnethed'
    - category: 'Fejlsomfang'
      examples: 'Udvidelse af genbearbejdningsområdet; overfladisk mikrolækage der vokser ind i kant, søm eller ventilplads, som er kritiske områder'
      risk: 'Høj'
      requirements: 'Strukturelt bærende overflader: obligatorisk stop og ny vurdering'
    - category: 'Inspektionsmetoder'
      examples: 'Lækagemetode, testtryk (18.0 PSI), holdetid (24h)'
      risk: 'Høj'
      requirements: 'Godkendelse fra Kvalitet + bekræftelse af teknisk aftale med kunden'
    - category: 'Dokumentation & bemyndigelse'
      examples: 'Genbearbejdningsinstruktion, inspektionsark, dispositionslogik for afvigelser, operatørkvalifikation'
      risk: 'Mellem'
      requirements: 'Kontrolleret dokumentrevision (Rev A → Rev B) + oplæringsrekorder'

cc_containment:
  tagline: 'Forbud mod fortsættelse'
  title: 'Øjeblikkelig inddæmming, når forholdene bliver alvorlige'
  body: |
    > "Den eksisterende genbearbejdningsmetode skal underkastes en gennemgang og må ikke anvendes på yderligere berørt produkt, før ændringen er vurderet og godkendt, medmindre en dokumenteret midlertidig afvigelse er godkendt af Kvalitet og Konstruktion."

    Den nuværende genbearbejdningsmetode skal straks sættes i bero, når geninspektionen af genbearbejdningen fortsat mislykkes, når fejlen vedrører strukturelt bærende områder (ventilbasis, kanter, sømme, trykområder i nese og hale), når et erstatningsmateriale endnu ikke er valideret, eller når de nuværende parametre er i konflikt med kundens godkendte specifikation.

    Midlertidige afvigelser bliver aldrig fast praksis: hver afvigelse har et defineret gyldighedsvindue, et anvendeligt batchomfang, en mængdegrænse, valideringskrav og en automatisk udløbsmekanisme. En mundtlig undtagelse er ikke en undtagelse — hvis den ikke er dokumenteret med sin udløbsdato, findes den ikke.

cc_flow:
  tagline: 'Standardiseret lukket løkke i 9 trin'
  title: 'Fra ændringsanmodning til lukning og opbevaring'
  subtitle: 'En dokumenteret løkke for hver parameterændring: foreslå, screene, vurdere, godkende, validere, pilotere, verificere, revidere, lukke.'
  steps:
    - step: '01'
      title: 'Ændringsanmodning (ECR)'
      desc: 'Enhver afdeling kan rejse en anmodning, men den skal sponsorers af ledelsen i Konstruktion, Kvalitet eller Produktion. ECR-registeret besvarer, hvorfor ændringen foreslås, hvad der ændres, hvad der berøres, og hvordan det skal verificeres — med nummer på ændringsstyringen, tilknyttet NCR/CAPA, nuværende mod foreslået parameter, berørte batcher og klassificering som midlertidig eller permanent.'
    - step: '02'
      title: 'Indledende screening og inddæmming'
      desc: 'Anmodningen screenes først med henblik på øjeblikkelig inddæmming: skal den nuværende metode stoppes nu? Hvis en midlertidig afvigelse tillades, afgrænses den af gyldighedsvindue, batchomfang, mængdegrænse og automatisk udløb.'
    - step: '03'
      title: 'Konsekvens- og risikovurdering'
      desc: 'Konstruktion, Kvalitet, Produktion, Indkøb/Supply Chain og Projekt vurderer produktets ydeevne, acceptkriterier, materialekompatibilitet, udseende, procesevne, udstyr og måleinstrumenter, personalets kvalifikation, kundens krav, overholdelse og spørgsmålsomfang.'
    - step: '04'
      title: 'Fælles gennemgang og godkendelse'
      desc: 'Godkendelse følger den fastsatte bemyndigelsesmatrix — ikke "hvem der taler højest". Ændringer med høj risiko kræver tværfaglig godkendelse og, hvor det kræves, skriftlig godkendelse fra kunden, før der foretages forsøg.'
    - step: '05'
      title: Valideringsplan
      desc: 'For ændringer med høj risiko kræves en godkendt valideringsplan, før metoden anvendes i almindelig drift: repræsentative prøvebrætter, nuværende mod foreslået metode, testmetoder, acceptkriterier, inspektionstrin, ansvarlige og tidsplan.'
    - step: '06'
      title: 'Kontrolleret pilot og implementering'
      desc: 'Nye dokumenter udgives, og forældede versioner trækkes tilbage og mærkes OBSOLETE; nye materialer og måleinstrumenter verificeres og kalibreres; operatører oplæres og kvalificeres; det første batch kører under skærpet inspektion med tydelig statusmærkning.'
    - step: '07'
      title: 'Geninspektion og effektivitetsgennemgang'
      desc: 'Førstegangsbeståelsesprocenten for genbearbejdning, beståelsesprocenten ved geninspektion, tilbagefaldshyppigheden og accepten af udseendet måles og gennemgås, før ændringen kan anses for effektiv — et repareret bræt anses aldrig som procesvalidering.'
    - step: '08'
      title: 'Dokumentrevision og oplæring'
      desc: 'Arbejdsinstruktioner, inspektionsark, dispositionsmuligheder for afvigelser, parameterkort og oplæringsmaterialer opdateres til den nye revision, og praktisk oplæring samt operatørkvalifikation registreres.'
    - step: '09'
      title: 'Lukning og opbevaring af rekorder'
      desc: 'Ændringen lukkes først, når valideringsdokumentation, dokumentopdateringer, oplæringsrekorder og implementeringens effekt er gennemgået og godkendt. Hvis det tilsigtede resultat ikke opnås, revideres, forlænges, sættes i bero eller trækkes ændringen tilbage.'

