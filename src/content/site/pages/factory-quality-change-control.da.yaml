cc_validation:
  tagline: 'Ingeniørmæssig validering'
  title: 'Validerings- og acceptprotokol — dokumentation frem for udsagn'
  body: |
    Uklare acceptformuleringer som *"det reparerede bræt skal være godt"* accepteres ikke. Den kontrollerede formulering er:

    > "Det genbearbejdede prøveeksemplar skal opfylde de samme gældende kriterier for lufttæthed, visuelt arbejde, ventilfunktion og projektspecifik accept som et overensstemmende bræt, medmindre et kundegodkendt afvigelse specifikt definerer et alternativt kriterium."

    Valideringsdokumentationen er kvantitativ, og det ingeniørmæssige grundlag for genbearbejdning af lufttæthed omfatter:

    - **Fjernelse af lækage & trykfastholdelse.** Den oprindelige lækage fjernes uden vedvarende bobler ved lækagemedtagelse i sæbevand; brættet holder ved standardtesttrykket på 18.0 PSI i 24 timer, med et netto trykfald ΔP ≤ 0.2 PSI efter kompensering for temperatur og luftfugtighed — det strammere grundlag for validering af genbearbejdning, som er forskelligt fra tærsklen på 0.50 PSI for automatisk kassation ved endelig accept på produktionslinjen.
    - **Ventilfunktion.** Moment på ventilkernen overholder specifikationen på 15–20 N·m, uden mikrolækage ved pakningen under højtrykspumpning og dynamisk pres.
    - **Sømbinding & holdbarhed.** Limkanterne viser ingen løftning, hvidning eller delaminering; efter aldringscykler i varme og fugt viser limlaget ingen blødgøring eller sprød revnedannelse.
    - **Udseende & arbejdsudførelse.** Ingen løbspor fra lim, ingen skade på EVA, ingen deformering af brættet og intet skift i logo eller ridser på trykoverfladen.

cc_engineering:
  tagline: 'Ingeniørmæssig udførelsesmatrix'
  title: 'Kvantificerede parametre for de fire kerneprocesser for genbearbejdning'
  subtitle: 'Hver kontrolleret genbearbejdningsproces har definerede parametre, metode og acceptkriterier — de samme tal, vores operatører følger, og vores kunder kan efterprøve ved audits.'
  headers:
    process: Genbearbejdningsproces
    parameters: 'Kontrollerede parametre'
    methodology: Testmetode
    acceptance: 'Acceptkriterier'
  rows:
    - process: 'Lappe reparation af punktformede huller / mikrolækage'
      parameters: 'Rensning med opløsningsmiddel og tørring 3–5 min; varmluftaktivering 60°C ± 5°C; trykrulle ≥ 0.4 MPa'
      methodology: 'Pump op til 18 PSI; fuld neddybning i vand eller påføring af sæbevand; observe i 10 minutter'
      acceptance: 'Ingen bobledannelse; 180° skrabning på kanten uden løftning og uden løbspor fra lim'
    - process: 'Genbinding af kantbånd / søm'
      parameters: 'Miksforhold for tokomponentlim strengt kontrolleret; miljø 22–28°C, ≤ 65% RH; fastspænding i fixtur ≥ 4 t'
      methodology: 'Overtrykstest ved 22 PSI i 2 t; derefter 6 t i varmeboks ved 50°C og 2 t i stuetemperatur'
      acceptance: 'Ingen adskillelse, ingen revnedannelse; netto trykfald ΔP ≤ 0.1 PSI; limlag uden hvidning eller hårdhed'
    - process: 'Løsning af ventilbasis / mikrolækage'
      parameters: 'Dedikeret nøgle med moment 18–20 N·m; pakningsflade flad uden deformering; renlighed i gevind bekræftet'
      methodology: 'Pump op til 15 PSI; 20 cyklusser med pumpning og udluftning; observation under neddybning i vand'
      acceptance: 'Ingen bobler ved ventilkerne og rundt om basen; moment efter cyklusser ≥ 16 N·m'
    - process: 'Endelig trykholdeprøvning i 24 t'
      parameters: 'Referencetryk 18.0 PSI; digitalt manometer klasse 1.0 / ±0.5%; omgivelsestemperatur og luftfugtighed registreres og kompenseres'
      methodology: 'Digital trykregistrering; kontinuerlig trykkurve over 24 t'
      acceptance: 'Netto trykfald ΔP ≤ 0.20 PSI / 24 t efter kompensering; ingen udvanding eller deformering af brættet'

