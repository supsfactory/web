cc_pokayoke:
  tagline: 'Sikkerhedsforanstaltninger mod fejl'
  title: 'Poka-Yoke: Hårde spærringer, der stopper ukontrollerede ændringer'
  subtitle: 'Standarden håndhæves ikke kun gennem procedurer, men gennem fysiske og systembaserede spærringer, der gør det umuligt at gennemføre ukontrollerede ændringer.'
  features:
    - icon: 1
      icon_bg: blue
      title: 'ECR-spærring for frigivelse af værktøj'
      desc: 'Genbearbejdningsstationer aflæser en QA-signeret ECR-stregkode, før pneumatiske pumpventiler og blandemaskiner frigives. Ingen godkendt ændringsstyringsrekord, ingen forsyning — bagvendt signering ("ændr først, underskriv siden") er fysisk spærret.'
    - icon: 2
      icon_bg: green
      title: 'Automatisk udløb af midlertidige afvigelser'
      desc: 'Midlertidige afvigelser er hårdt begrænset i systemet (for eksempel højst 50 brætter eller 7 kalenderdage). Når grænsen nås, låses batchen, og udskrivning af afsendelsespasset blokeres, indtil ændringen er formelt vurderet.'
    - icon: 3
      icon_bg: purple
      title: 'Minimal valideringsdokumentation'
      desc: 'Ændringer med høj risiko kræver mindst 5 repræsentative prøvebrætter, der dækker de øvre og nedre tolerancer, fuldt inspiceret af 2 uafhængige QC-inspektører, før en valideringsrapport kan udstedes — et repareret bræt anses aldrig som procesvalidering.'
    - icon: 4
      icon_bg: orange
      title: '1-ud-1-ind dokumentkontrol'
      desc: 'Forældede kort til arbejdspladser indsamles fysisk og annulleres (hulstempling), før det nye kort med det kontrollerede røde segl udstedes — gamle og nye versioner deler aldrig en arbejdsplads.'

