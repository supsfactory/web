faqs:
  tagline: FAQ
  title: Ofte stillede spørgsmål om ændringsstyring af genbearbejdning
  items:
    - q: 'Kan fabrikken ændre genbearbejdningsparametre uden at fortælle os det?'
      a: 'Nej. Ethvert foreslået skift i godkendte genbearbejdningsmaterialer, procesforhold, værktøj, testmetoder, inspektionskriterier eller bemyndigede personer skal først gennemgå dokumenteret ændringsstyring. Ændringer, der påvirker kundens godkendte specifikationer, prøveeksemplarer, BOM’er, artwork eller acceptkriterier, kræver skriftlig godkendelse fra kunden.'
    - q: 'Hvad regnes som en ændring med høj risiko?'
      a: 'Ændringer af genbearbejdningsmaterialer eller leverandører, tryk/holdetid eller hærdningsforhold, genbearbejdningsmetoder for ventil/kant/søm, inspektions- eller acceptkriterier samt udvidelse af fejlsomfang ind i strukturelle områder klassificeres som ændringer med høj risiko. De kræver tværfaglig gennemgang, en godkendt valideringsplan og kontrolleret pilotimplementering, før de tages i almindelig brug.'
    - q: 'Kan en midlertidig afvigelse bruges uden tidsbegrænsning?'
      a: 'Nej. Enhver midlertidig afvigelse har et defineret gyldighedsvindue, batchomfang, en mængdegrænse og valideringskrav med automatisk udløb. Når grænsen nås, låses batchen, og udskrivning af afsendelsespasset blokeres, indtil ændringen er formelt vurderet.'
    - q: 'Hvordan dokumenteres det, at en ændret metode virker, før den tages i fuld brug?'
      a: 'Ændringer med høj risiko kræver en valideringsplan: mindst 5 repræsentative prøvebrætter, der dækker tolerancerne, testet af 2 uafhængige QC-inspektører mod kvantificerede acceptkriterier (fjernelse af lækage, trykfastholdelse, ventilfunktion, sømholdbarhed, udseende). Godkendelse til at validere er ikke godkendelse til at anvende.'
    - q: 'Skal vi godkende alle ændringer?'
      a: 'Ikke alle ændringer, men enhver ændring, der flytter produktet væk fra kundens godkendte prøveeksemplar, tekniske specifikation, BOM, artwork, emballage eller acceptkriterier, implementeres kun med skriftlig godkendelse fra kunden. Uden denne genbearbejdes bræt efter det oprindelige krav, erstattes eller kasseres.'
    - q: 'Hvad sker der med gamle dokumenter, når en ændring er godkendt?'
      a: 'Gamle arbejdsinstruktioner, parameterkort og inspektionsark indsamles fysisk og annulleres (1-ud-1-ind), mærkes OBSOLETE og erstattes af den nye kontrollerede revision efter oplæring. Gamle og nye versioner deler aldrig en arbejdsplads.'
    - q: 'Hvor længe opbevares rekorder for ændringsstyring?'
      a: 'Lukningsrekorder — valideringsdokumentation, dokumentrevisioner, oplæringsrekorder og effektivitetsgennemgange — opbevares i henhold til vores politik for opbevaring af rekorder (mindst 3 år for lukningsrekorder), så hver ændring forbliver spørgsmålbar ved audits og gennemgange af spørgsmål.'

