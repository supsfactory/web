hero:
  tagline: Centre de R&D
  title: Centre de R et D
  subtitle: Focalisés sur le progrès

intro:
  - Le Centre de Recherche et de Développement (R&D) d'Afarer est la force motrice de notre mission de révolutionner l'équipement de sports nautiques. Nous donnons aux passionnés de sports nautiques du monde entier des produits plus sûrs, plus confortables et plus agréables grâce à une innovation constante dans les planches de stand-up paddle (SUP) et les bateaux gonflables. Notre équipe dédiée d'ingénieurs, de designers et d'experts passionnés des sports nautiques façonne l'avenir de l'industrie, élevant constamment le niveau de la qualité, de la performance et de la durabilité.
  - Notre installation de R&D réunit sous un même toit des scientifiques des matériaux, des architectes navals et des ingénieurs de production. De la formulation des tissus et de la simulation de coque au développement des processus de soudure et aux essais en mer à grande échelle, chaque étape du développement produit est pilotée par les données et validée par les tests.

mission:
  tagline: Notre mission
  title: Innover l'avenir des sports nautiques
  pillars:
    - icon: lightning
      title: Avancement technologique
      desc: Innover de nouveaux matériaux, designs et fabrications pour une performance et une longévité supérieures du produit.
    - icon: design
      title: Design centré sur l'utilisateur
      desc: Comprendre et dépasser profondément les besoins des utilisateurs grâce à un design de produit ergonomique et intuitif.
    - icon: globe
      title: Pratiques durables
      desc: Minimiser notre empreinte environnementale en utilisant des matériaux et processus écologiques.
    - icon: shield
      title: Sécurité sans compromis
      desc: Garantir les plus hauts standards de sécurité grâce à des tests et une certification rigoureux.

pillars:
  - title: Avancement technologique
    desc: Innover de nouveaux matériaux, designs et processus de fabrication pour offrir une performance et une longévité supérieures du produit.
    icon: tech
  - title: Matériaux avancés
    desc: Rechercher des PVC, Hypalon, composites de pointe et des alternatives durables pour améliorer les caractéristiques du produit.
    icon: materials
  - title: Durabilité
    desc: 'Un engagement central : nous sommes dédiés à la gestion environnementale grâce à une fabrication durable et des matériaux recyclables.'
    icon: sustainability

capabilities:
  tagline: Capacités
  title: Capacités de R&D
  subtitle: Quatre disciplines clés qui nous donnent un contrôle de bout en bout sur le développement produit —de la recherche sur les matières premières à la certification finale.
  groups:
    - title: Science des matériaux et technologie du tissu
      items:
        - Analyse et optimisation des formulations de PVC et Hypalon
        - Développement d'additifs de stabilisation UV, de résistance aux flammes et antimicrobiens
        - Ingénierie de laminage multicouche et de liaison adhésive
        - Tests de vieillissement accéléré (UV, thermique, humidité, brouillard salin)
    - title: Ingénierie de coque et hydrodynamique
      items:
        - Conception de coque 3D paramétrique et optimisation CFD
        - Analyse par éléments finis pour les charges structurelles et d'impact
        - Tests en bassin de remorquage sur modèle réduit et validation de performance
        - Développement de coque personnalisée pour des profils de mission spéciaux
    - title: Technologie de soudure et d'assemblage
      items:
        - Développement et optimisation des processus de soudure diélectrique RF
        - Méthodes de soudure à air chaud, cale chaude et ultrasonique
        - Qualification des liaisons adhésives et des bandes de couture
        - Modélisation de la résistance de soudure et prédiction de durée de vie
    - title: Test, certification et conformité
      items:
        - Management de la qualité et test de conformité CE
        - Support de test et de certification tierce partie indépendante
        - Développement de protocoles de test personnalisés pour la qualification d'approvisionnement
        - Analyse des défaillances en service et investigation des causes racines

