rd_services:
  tagline: R&D personnalisée
  title: Services de R&D pour les partenaires
  services:
    - title: Développement de matériaux personnalisés
      desc: Nous développons des formulations de tissu, des empilements de laminé et des systèmes adhésifs personnalisés adaptés à votre environnement d'exploitation et à vos objectifs de performance.
    - title: Ingénierie de produit OEM / ODM
      desc: Nous développons des formulations de tissu, des empilements de laminé et des systèmes adhésifs personnalisés adaptés à votre environnement d'exploitation et à vos objectifs de performance.
    - title: Test et certification tierce partie
