hero:
  tagline: 'Vælg din samarbejdsvej'
  title: 'OEM kontra ODM kontra Private Label — hvilken model passer til dit projekt?'
  subtitle: 'Tre måder at arbejde sammen med en SUP-fabrik på, hver med forskellige afvejninger mellem ejerskab, investering og hastighed. Denne guide forklarer forskellene, så du kan vælge den rette vej, før du sender din første forespørgsel.'

answer:
  label: 'Hurtig sammenligning'
  text: 'OEM: du ejer designet og specifikationen — vi fremstiller efter dine tegninger. ODM: vores konstruktionsteam udvikler brættet ud fra dit brief — du godkender, før der produceres. Private Label: dit mærke på en gennemprøvet eksisterende platform uden strukturelle ændringer — hurtigste vej til markedet. Alle tre veje løber gennem samme anlæg, samme QC-system og eksportteam i Qingdao, Kina.'
  verified: 'September 2026'

comparison_table:
  tagline: 'Side om side'
  title: 'Sammenligning af OEM / ODM / Private Label'
  subtitle: 'De vigtigste forskelle for designejerskab, minimumsordre, værktøj, leveringstid og intellektuelle rettigheder.'
  headers:
    dimension: Dimension
    oem: OEM-produktion
    odm: ODM-udvikling
    pl: Private Label
  rows:
    - dimension: 'Hvem designer brættet?'
      oem: 'Du leverer specifikationen, tegninger eller et referencebræt'
      odm: 'Fabrikkens konstruktionsteam udvikler ud fra dit brief'
      pl: 'Eksisterende platform i fabrikken — intet designarbejde nødvendigt'
    - dimension: 'Ejerskab af design & IP'
      oem: 'Du ejer alle designs, forme og intellektuelle rettigheder'
      odm: 'Du ejer det endeligt godkendte design; fabrikken ejer IP på udviklingsprocessen'
      pl: 'Fabrikken ejer platformsdesignet; du ejer dit mærke og din grafik'
    - dimension: 'Form / værktøj'
      oem: 'Specialform påkrævet ved nye former — engangsgebyr for værktøj, 15–20 ekstra dage'
      odm: 'Kan kræve specialform afhængigt af specifikationen — samme værktøjstidsplan'
      pl: 'Ingen ny form — der bruges eksisterende platformværktøj'
    - dimension: Minimumsordre
      oem: '90–100+ stk. pr. godkendt konfiguration'
      odm: '90–100+ stk. pr. godkendt konfiguration; pilotserier fra 20–50 stk.'
      pl: '5–10 stk. (co-branding) eller 20–50 stk. (pilotserie på eksisterende platform)'
    - dimension: 'Typisk leveringstid'
      oem: '25–35 dage + 15–20 dage for værktøj ved ny form'
      odm: '25–35 dage + udviklingstid (varierer efter kompleksitet)'
      pl: '25–35 dage (ingen forsinkelse fra værktøj)'
    - dimension: Tilpasningsniveau
      oem: 'Fuldt — form, konstruktion, materialer, grafik, emballage'
      odm: 'Fuldt — fabrikken foreslår, du godkender hvert element'
      pl: 'Kun grafik og emballage — ingen strukturelle ændringer'
    - dimension: Prøveproces
      oem: '1–2 prototypeprøver på 7–12 dage efter godkendelse af specifikation'
      odm: '1–2 prototypeprøver på 7–12 dage efter designgodkendelse'
      pl: '1–2 prøver på 7–12 dage — platformen er allerede valideret'
    - dimension: 'Bedst til'
      oem: 'Købere med eksisterende designs, referencebrætter eller detaljerede specifikationer'
      odm: 'Købere med produktideer eller markedskrav, men uden detaljeret specifikation'
      pl: 'Købere, der hurtigt har brug for mærkede brætter uden produktudvikling'

