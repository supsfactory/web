ip_rules:
  tagline: Beskyttelse af intellektuelle rettigheder
  title: 'Sådan beskytter vi dit design og dit mærke'
  subtitle: 'Uanset samarbejdsmodel forbliver dit artwork, dit værktøj og dine specifikationsfiler dine ejendom.'
  body: |
    **NDA før filudveksling.** Vi underskriver en fortrolighedsaftale, før nogen tekniske filer udveksles — standard svartid er inden for 4 arbejdstimer.

    **Ingen genbrug af design.** Dit artwork, dit værktøj og dine specifikationsfiler deles aldrig med eller sælges til andre kunder. OEM-forme tilhører udelukkende dig. ODM-designs godkendes af dig, før der produceres. Private Label-platforme er delte strukturer, men din grafik og dit branding er eksklusivt.

    **Kun B2B.** Vi fremstiller udelukkende under vores kunders mærker. Vi sælger ikke til private forbrugere og konkurrerer ikke med vores kunder på noget marked.

    **Ejerskab af forme.** Specialforme, som køberen betaler for, tilhører køberen. Vi opbevarer og vedligeholder dem, men kan ikke bruge dem til andre kunder uden skriftlig tilladelse.

faqs:
  tagline: 'FAQ'
  title: 'Ofte stillede spørgsmål om OEM, ODM og Private Label'
  items:
    - q: 'Kan jeg senere skifte fra private label til OEM?'
      a: 'Ja. Mange kunder starter med en private label eller en pilotserie for at validere markedet og investerer derefter i specialværktøj til et fuldt OEM-program, når efterspørgslen er dokumenteret. Samme anlæg og samme QC-system understøtter begge veje.'
    - q: 'Betyder ODM, at fabrikken ejer mit mærke?'
      a: 'Nej. Under ODM ejer du dit mærke, din grafik og din emballage. Fabrikken udvikler brættets konstruktion ud fra dit brief, og du godkender designet, før der produceres. Fabrikken bevarer IP på udviklingsprocessen, men den godkendte produktspecifikation er din.'
    - q: 'Er private label af lavere kvalitet end OEM?'
      a: 'Nej. Alle tre veje løber gennem samme anlæg, samme QC-system og samme eksportteam. Private label-brætter bygges på gennemprøvede, validerede platforme med fuld 18 PSI / 24h tryktest og den samme tjekliste for samling med 100 punkter.'
    - q: 'Hvad hvis jeg ikke er sikker på, hvilken model jeg skal vælge?'
      a: 'Kontakt os med din situation — vores konstruktionsteam anbefaler den mest praktiske vej ud fra dine produktkrav, din tidsplan og dine volumenmål. Der er ingen forpligtelse, før specifikationen er gennemgået.'
    - q: 'Kan jeg få prøver, før jeg binder mig til nogen model?'
      a: 'Ja. 1–2 prototypeprøver afsendes på 7–12 dage. Prøveprisen modregnes din større ordre. Dermed kan du vurdere konstruktion og kvalitet, før du påtager dig nogen volumenforpligtelse.'

