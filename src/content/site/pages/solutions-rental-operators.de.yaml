meta:
  title: 'SUP-Verleihausrüstung & Flottenlösungen'
  description: 'Kommerzielle SUP-Boards für den täglichen Verleih: UV-beständiges PVC, verstärkte Nähte und schnell trocknende Materialien für hochfrequent rotierende Verleihflotten.'
  dateModified: '2026-08'

hero:
  tagline: Verleihbetriebe
  title: 'SUP-Boards für Verleihflotten entwickelt'
  subtitle: 'Spezifizieren Sie eine Flotte, die täglichen Verleih übersteht: hochfrequent rotierende Boards mit UV-beständigem PVC, verstärkten Nähten und schnell trocknenden Materialien — entwickelt für 365 Tage Nutzung pro Jahr.'
  image:
    src: https://assets.supsfactory.com/images/sups/use-cases/supsfactory-family-use-case.webp
    alt: SUP-Boards bereit für den täglichen Verleih

answer:
  label: 'Kurze Antwort'
  text: 'Verleihflotten-Boards werden mit UV-beständigem Marine-PVC gebaut, mit Nähten, die 3× stärker als Standard-Konstruktionen sind, und Drop-Stitch-Kernen für 15 PSI — getestet für 500+ Verleihzyklen. Die MOQ wird durch die Projektkonfiguration bestätigt: Muster (1–2 Einheiten), Pilot (20–50 Einheiten) und Standardvolumen (90–100+ Einheiten pro Charge aus einer 150-m-Rolle); die Produktion läuft 25–35 Tage nach PO und Anzahlung, mit FOB-, CIF- oder DDP-Bedingungen.'
  verified: 'September 2026'

features:
  title: Gebaut für den Verleih-Alltag
  subtitle: 'Jedes Board ist für 500+ Verleihzyklen mit minimalem Wartungsaufwand ausgelegt.'
  items:
    - title: '500+ Verleihzyklen'
      description: 'Getestet, um den täglichen Einsatz in Salzwasser, Sonne und Sand zu überstehen.'
      icon: 'tabler:shield-check'
    - title: 'UV-beständiges Gewebe'
      description: 'Kein Ausbleichen oder Verfall nach 1 Jahr Außenlagerung.'
      icon: 'tabler:sun'
    - title: 'Verstärkte Nähte'
      description: 'Verstärkte Nahtkonstruktion für tägliche Verleihrotation und wiederholte Aufblaszyklen.'
      icon: 'tabler:layers-intersect'
    - title: 'Schnell trocknende Materialien'
      description: 'Schnell trocknende Materialien halten Boards zwischen den Einsätzen einsatzbereit.'
      icon: 'tabler:droplet'
    - title: 'Stapelbare Lagerung'
      description: 'Platzsparendes stapelbares Design — mehr Boards im gleichen Lagerbereich.'
      icon: 'tabler:stack'
    - title: 'Farbkodierte Größen'
      description: 'Das Personal greift dank farbkodierter Größen sofort zum richtigen Board.'
      icon: 'tabler:color-swatch'

