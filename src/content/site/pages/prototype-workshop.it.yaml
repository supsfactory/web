answer:
  label: 'Risposta breve'
  text: 'Trasformiamo un modello CAD in una tavola campione navigabile e testabile in 7–12 giorni: prototipazione gonfiabile, prove in acqua con moto ondoso, iterazioni su rail e nose, poi la decisione sull''attrezzatura di produzione. La costruzione completa di stampi personalizzati richiede 15–20 giorni in aggiunta al lead time standard della produzione in serie di 25–35 giorni.'
  verified: 'September 2026'

