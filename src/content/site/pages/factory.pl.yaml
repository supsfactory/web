  system: Własny ERP (system wewnętrzny Qingdao Vatrad Group) + fizyczne metki partii na każdym zleceniu
  coverage: 100% materiałów produkcyjnych —PCV, Hypalon, tkanina drop-stitch, kleje, zawory, osprzęt, opakowanie
