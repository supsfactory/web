workshops_section:
  tagline: Oddziały
  title: Oddziały produkcyjne
  workshops:
    - title: Cięcie PCV i przygotowanie materiału
      description: Automatyczne maszyny CNC do cięcia PCV, Hypalonu i tkanin drop-stitch z dokładnością poniżej milimetra. Zoptymalizowany komputerowo nestling minimalizuje odpady materiału i zapewnia zgodność każdego panelu ze specyfikacją wymiarową przed zgrzewaniem.
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: Maszyna CNC do cięcia PCV przygotowująca panele nadmuchiwanych desek SUP w fabryce w Qingdao
    - title: Zgrzewanie rur i zamykanie termiczne
      description: Dedykowany oddział zgrzewania z maszynami do zgrzewania termicznego i prasami dielektrycznymi RF. Zgrzewarki gorącopowietrzne łączą i topią komory rurowe z PCV, a zgrzewanie RF tworzy wytrzymałe, szczelne szwy przekraczające wymagania.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Maszyna do zgrzewania RF zamykająca komory rurowe nadmuchiwanej łodzi w fabryce w Qingdao
    - title: Laminowanie rdzenia drop-stitch
      description: Rdzenie drop-stich desek SUP są łączone z zewnętrznymi laminatami PCV metodą laminowania cieplnego. Tysiące wewnętrznych nici poliestrowych łączy warstwę górną z dolną, tworząc sztywną konstrukcję przy 12-15 PSI. Listwy krawędziowe są łączone przez zgrzewanie fuzyjne w trzech warstwach dla wytrzymałości krawędzi.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Linia produkcji nadmuchiwanych desek SUP z wyposażeniem do laminowania rdzenia drop-stitch w fabryce w Qingdao
    - title: Druk i dekoracja SUP
      description: Deski SUP zdobimy za pomocą druku cyfrowego w grafice pełnokolorowej oraz sitografii dla logo i wzorów powtarzalnych. Drukarki cyfrowe dają projekty pokładu o jakości fotograficznej, a sitografia zapewnia trwałe, żywe oznaczenia marki.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Wnętrze działu produkcji w fabryce nadmuchiwanych desek SUP w Qingdao
    - title: Montaż końcowy i osprzęt
      description: Linia montażowa, na której na każdą deskę SUP montowane są zawory, oczka D-ring, uchwyty, gniazda płetw i nakładki pokładowe. Każda deska przechodzi listę kontrolną montażu w 100 punktach podpisaną przez kierownika zmiany.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Dział produkcji ze stanowiskami montażowymi w fabryce w Qingdao
    - title: Badania i inspekcja jakości
      description: Każda ukończona deska przechodzi obowiązkowe badanie retencji powietrza, weryfikację odrywania szwów i pełną kontrolę układów przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do zarządu.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Badanie ciśnieniowe nadmuchiwanej deski SUP pod kątem retencji powietrza przed wysyłką w fabryce w Qingdao

