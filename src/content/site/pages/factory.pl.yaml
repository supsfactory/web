qc_section:
  tagline: Kontrola jakości
  title: Proces badań i zapewnienia jakości
  subtitle: Każda deska przechodzi obowiązkowe badania przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do zarządu.
  steps:
    - step: '1'
      title: Inspekcja surowców
      desc: PCV, Hypalon i tkaniny drop-stitch przechodzą badanie wytrzymałości na rozciąganie (), propagację rozdarcia i weryfikację odporności na UV, zanim jakakolwiek partia trafi na produkcję.
    - step: '2'
      title: 24-godzinne badanie retencji powietrza
      desc: Każda komora rurowa jest napompowywana do 18.0 PSI i utrzymywana przez 24 godziny. Spadek ciśnienia powyżej 0.50 PSI uruchamia automatyczne odrzucenie i ponowną inspekcję szwów.
    - step: '3'
      title: Badanie obciążenia i równowagi
      desc: Gotowe deski są napompowywane do ciśnienia znamionowego i sprawdzane pod kątem symetrycznego wybrzuszenia, sztywności przy 15 PSI oraz stabilności pod obciążeniem. Każda deska przechodzi próbę wodną w naszym basie przed inspekcją końcową.

oem_section:
  tagline: Projekty OEM
  title: 'Studia przypadków: marki i partnerstwo OEM'
  subtitle: Od koncepcji po produkcję —jak pomagamy globalnym markom uruchamiać i skalować ich linie nadmuchiwanych desek SUP.
  cases:
    - challenge: Europejski detaliczny sklep outdoorowy potrzebował linii SUP private label z unikalną grafiką pokładu, ekologicznym PCV i opakowaniem gotowym do sprzedaży —wszystko w 60 dni.
      solution: Opracowaliśmy własne pliki druku cyfrowego, pozyskaliśmy PCV zgodny z REACH i skróciliśmy etapy próbkowania z 3 do 1, umieszczając zespół projektowy w naszej fabryce w Qingdao.
      result: 25–35 dni produkcji od podpisanego zamówienia, z pierwszą dostawą w 60-dniowym oknie. 2,400 sztuk w 4 SKU. Zamówienie powtórne złożone przed pełnym dostarczeniem pierwszej partii.
      disclaimer: 'Zanonimizowane podsumowanie projektu — typ i zakres projektu są reprezentatywne; konkretne wyniki nie są niezależnie weryfikowalne.'
    - challenge: Amerykański startup sportów wodnych potrzebował wydajnej deski SUP drop-stitch o własnym kształcie, opakowaniu współmarkowanym i certyfikacji BSCI, aby trafić do kanału detalicznego.
      solution: Zaadaptowaliśmy istniejącą formę SUP ze zmodyfikowanym obrysem, opracowaliśmy projekt graficzny opakowania współmarkowanego i udostępniliśmy pełną dokumentację audytu BSCI.
      result: 'Deski trafiły do kluczowych amerykańskich sklepów outdoorowych, generując silny momentum: ponad 5,000 sprzedanych sztuk w roku 1 i 98% rotacji.'
      disclaimer: 'Zanonimizowane podsumowanie projektu — typ i zakres projektu są reprezentatywne; konkretne wyniki nie są niezależnie weryfikowalne.'
    - challenge: Australijski dystrybutor wymagał linii SUP z certyfikatem CE, niestandardowymi kolorami i zgodnością z normami australijskimi.
      solution: Wyprodukowaliśmy próbki przedprodukcyjne w 4 wariantach kolorystycznych i skoordynowaliśmy badania zgodności z podmiotem trzecim.
      result: Linia SUP z 3 modeli wprowadzona na rynek AU/NZ. Następnie wygrana w przetargu rządowym na 12 desek patrolowych SUP.
      disclaimer: 'Zanonimizowane podsumowanie projektu — typ i zakres projektu są reprezentatywne; konkretne wyniki nie są niezależnie weryfikowalne.'

faq_section:
  tagline: FAQ
  title: B2B i OEM — najczęściej zadawane pytania
  questions:
    - q: Jaka jest minimalna ilość zamówienia (MOQ) dla nadmuchiwanych desek SUP w modelu OEM?
      a: 'MOQ potwierdzamy wg konfiguracji projektu, a nie jako sztywna liczba — kadłub i narzędzia, kolorystyka i PCV, projekt graficzny, opakowanie i akcesoria. Standardowa produkcja seryjna to 90–100+ szt. na partię z pełnej rolki drop-stitch 150 m, współmarkowanie w małej serii zaczyna się od 5–10 szt., a każdy projekt przechodzi etapy próbki (1–2 szt.) i pilotażu (20–50 szt.). Pełną logikę obliczeń znajdziesz w naszym Przewodniku MOQ i elastycznego brandingu.'
    - q: Czy Vatrad posiada certyfikację BSCI?
      a: Tak. Nasza fabryka utrzymuje ważną certyfikację zgodności społecznej BSCI (raport z audytu dostępny na żądanie). Mamy również ISO 9001 dla zarządzania jakością. Certyfikacja CE dotyczy modeli przeznaczonych na rynki UE; zakres potwierdzamy dla każdego projektu. Dokumentacja zgodności REACH i RoHS dołączana jest do każdego zamówienia OEM.
    - q: Jaki jest typowy czas realizacji zamówienia OEM?
      a: Standardowy czas realizacji to 25–35 dni od potwierdzonego zamówienia i zaliczki dla hurtowej produkcji OEM. Opracowanie formy na zamówienie dodaje 15–20 dni na narzędzia. Dla pilnych zamówień i sezonowych szczytów dostępna jest produkcja przyspieszona. Próbki prototypowe są zwykle gotowe w 7–12 dni.
    - q: Czy zajmujecie się dokumentacją eksportową?
      a: Tak. Nasz zespół obsługuje dokumentację eksportową i odprawę celną we własnym zakresie, a dostarczamy do ponad 50 krajów na rynkach UE, USA, AU i Azji.

b2b_moq: 'MOQ potwierdzamy wg konfiguracji projektu: próbka 1–2, pilotaż 20–50, wolumen 90–100+ (na rolkę 150 m); współmarkowanie w małej serii od 5–10 szt.'

production_flow:
  tagline: Przepływ produkcji
  title: Od surowca do gotowej deski
  subtitle: Każda deska przechodzi przez 6 etapów produkcji z punktami kontrolnymi QC na każdym kroku. Bez skrótów, bez pomijanych inspekcji.
  stages:
    - stage: '01'
      title: Przyjęcie materiałów i QC przychodzące
      description: 'Wszystkie materiały przychodzące są rejestrowane w naszym systemie ERP według numeru partii/lotu. Rolki tkaniny PCV, rdzenie drop-stitch, zawory, kleje i osprzęt trafiają do kwarantanny do czasu zatwierdzenia przez QC.'
      qc_check: 'Wytrzymałość na rozciąganie (ASTM D751), odporność na rozdarcie (ISO 4674), grubościomierz, lepkość kleju, skan wizualny wad'
      qc_threshold: '100% partii badanych. Odrzucenie przy wytrzymałości < 90% specyfikacji, rozdarciu < minimum specyfikacji lub jakiejkolwiek wadzie wizualnej'
      responsibility: Zespół QC przychodzącego (3 inspektorzy)
    - stage: '02'
      title: Cięcie CNC i przygotowanie materiału
      description: 'Zoptymalizowany komputerowo nestling układa panele na arkuszach PCV, aby zminimalizować odpady. Automatyczne maszyny CNC do cięcia utrzymują dokładność pozycjonowania 0.1 mm.'
      qc_check: 'Kontrola wymiarowa względem plików CAD DXF, inspekcja jakości krawędzi, weryfikacja liczby paneli'
      qc_threshold: 'Co 20 panel mierzony. Tolerancja ±0.5 mm. Odrzucenie partii przy >2% poza tolerancją'
      responsibility: Kierownik oddziału cięcia
    - stage: '03'
      title: Zgrzewanie i łączenie rdzenia drop-stitch
      description: 'Rdzenie drop-stitch są łączone z zewnętrznymi laminatami PCV metodą laminowania cieplnego. Komory rurowe są zgrzewane RF lub gorącopowietrznie. Listwy krawędziowe są łączone przez zgrzewanie fuzyjne w trzech warstwach.'
      qc_check: 'Próba odrywania co 50 sztuk (ASTM D751), pomiar szerokości szwu, przegląd dziennika temperatur gorącopowietrznych, wizualna inspekcja szwów pod światłem przechodzącym'
      qc_threshold: 'Minimalna wytrzymałość na odrywanie 8 N/cm. Tolerancja szerokości szwu ±1 mm. Jakikolwiek widoczny kanał = odrzucenie'
      responsibility: QC zgrzewania (2 inspektorzy na zmianę)
    - stage: '04'
      title: Montaż i osprzęt
      description: 'Deski przechodzą do montażu końcowego, gdzie łączą się wszystkie komponenty: panele pokładu i kadłuba, zawory, oczka D-ring, uchwyty, gniazda płetw i pokrowiec. Każda sztuka przechodzi listę kontrolną montażu w 100 punktach.'
      qc_check: 'Podpis listy kontrolnej w 100 punktach dla każdej sztuki, test działania zaworu (10 cykli otwarcia/zamknięcia), weryfikacja momentu dokręcenia osprzętu, inspekcja wizualna'
      qc_threshold: 'Zasada zero wad dla pozycji krytycznych dla bezpieczeństwa (zawory, oczka D-ring, uchwyty). Drobne wady kosmetyczne: AQL 2.5 (ISO 2859)'
      responsibility: Kierownik zespołu montażu + QC linii
    - stage: '05'
      title: Badania ciśnieniowe i wstrzymanie jakościowe
      description: 'Każda komora jest napompowywana do 18.0 PSI (dla SUP o ciśnieniu znamionowym 12–15 PSI) i utrzymywana przez 24 godziny. Czujniki ciśnienia zapisują dane w sposób ciągły. Komory ze spadkiem powyżej 0.50 PSI są odrzucane i kierowane na ponowną inspekcję szwów.'
      qc_check: 'Dziennik utrzymania ciśnienia 24h, codzienna weryfikacja kalibracji czujników, odczyt ciśnienia skompensowany temperaturowo, ponowna próba szwu po naprawie'
      qc_threshold: 'Maks. spadek ciśnienia 0.50 PSI w ciągu 24h przy stabilnej temperaturze. Jakakolwiek komora przekraczająca tę wartość = ponowne badanie 100% całej partii produkcyjnej'
      responsibility: Laboratorium jakości (niezależne od produkcji, raportuje do zarządu)
    - stage: '06'
      title: Inspekcja końcowa i pakowanie
      description: 'Końcowa inspekcja wizualna i czynnościowa. Wady powierzchniowe, zgodność kolorystyczna, weryfikacja etykiet/BIN, integralność opakowania i kompletność akcesoriów. Sztuki są pakowane próżniowo, wkładane do kartonów i układane na paletach pod załadunek kontenera.'
      qc_check: 'Pełna inspekcja wizualna, lista kontrolna akcesoriów dla każdego SKU, próba upuszczenia opakowania (1 m, losowa próbka), weryfikacja skanu etykiety i kodu kreskowego'
      qc_threshold: 'AQL 2.5 dla wad istotnych, AQL 4.0 dla drobnych. Zerowa tolerancja dla wad bezpieczeństwa. 100% sztuk sprawdzanych wizualnie'
      responsibility: Zespół QC końcowego (4 inspektorzy) + kierownik pakowania

