  text: 'En oppustelig SUP er et stand-up paddleboard bygget i drop-stitch-PVC, der bliver stift, når det pumpes op til 12–15 PSI. Den matcher hardboards ydelse til de fleste fritids- og touringformål, vejer cirka 8–10 kg og kan pakkes sammen i en rygsæk til opbevaring og transport.'
