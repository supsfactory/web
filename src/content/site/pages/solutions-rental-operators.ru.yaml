meta:
  title: 'Поставщик оборудования для проката SUP и флотовые решения'
  description: 'Коммерческие доски SUP, спроектированные для ежедневной эксплуатации в прокате: стойкий к УФ-излучению ПВХ, армированные швы и быстросохнущие материалы для парков проката с высокой ротацией.'
  dateModified: '2026-08'

hero:
  tagline: Прокатные операторы
  title: 'Доски SUP, спроектированные для прокатных парков'
  subtitle: 'Закажите парк, выдерживающий ежедневную эксплуатацию в прокате: доски с высокой ротацией, стойкий к УФ-излучению ПВХ, армированные швы и быстросохнущие материалы — спроектированы на 365 дней использования в год.'
  image:
    src: https://assets.isupfactory.com/images/sups/use-cases/isupfactory-family-use-case.webp
    alt: Подготовленные к ежедневной эксплуатации в прокате доски SUP

answer:
  label: 'Прямой ответ'
  text: 'Флотовые доски для проката изготавливаются из морского ПВХ, стойкого к УФ-излучению, со швами в 3× прочнее стандартной конструкции и ядром drop stitch, рассчитанным на 15 PSI — испытано на 500+ прокатных циклов. MOQ подтверждается конфигурацией проекта: образец (1–2 единицы), пилот (20–50 единиц) и стандартный серийный объем (90–100+ единиц на партию из 150-метрового рулона); серийное производство занимает 25–35 дней после PO и аванса, с условиями FOB, CIF или DDP.'
  verified: 'Сентябрь 2026'

features:
  title: Создано для прокатной нагрузки
  subtitle: 'Каждая доска спроектирована на 500+ прокатных циклов с минимальным обслуживанием.'
  items:
    - title: '500+ прокатных циклов'
      description: 'Испытано на ежедневное использование в соленой воде, на солнце и в песке.'
      icon: 'tabler:shield-check'
    - title: 'Ткань, стойкая к УФ-излучению'
      description: 'Без выцветания и разрушения после 1 года хранения на открытом воздухе.'
      icon: 'tabler:sun'
    - title: 'Армированные швы'
      description: 'Армированная конструкция швов, рассчитанная на ежедневную ротацию в прокате и многократные циклы надувания.'
      icon: 'tabler:layers-intersect'
    - title: 'Быстросохнущие материалы'
      description: 'Быстросохнущие материалы позволяют подготовить доски к следующей сдаче между сеансами.'
      icon: 'tabler:droplet'
    - title: 'Складное хранение'
      description: 'Экономичный штабельный дизайн — больше досок в том же складском помещении.'
      icon: 'tabler:stack'
    - title: 'Цветовая кодировка размеров'
      description: 'Персонал мгновенно берет нужную доску благодаря цветовой кодировке размеров.'
      icon: 'tabler:color-swatch'

stats:
