fleet_guide:
  title: Руководство по подбору размера парка
  subtitle: 'Оцените, сколько досок нужно вашей операции, исходя из ежедневной ротации проката.'
  tiers:
    - label: Небольшой киоск
      boards: '15-20'
      note: 'До 2–3 ротаций досок в день в пиковый сезон'
    - label: Средняя операция
      boards: '30-50'
      note: 'Несколько точек спуска или высокий трафик в выходные'
    - label: Крупный пляжный прокат
      boards: '50-100'
      note: 'Полносервисные прокатные парки на нескольких пляжных станциях'

content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Читайте дальше:</strong> прокатные доски начинаются с вашей спецификации — посмотрите нашу <a href="/ru/oem-manufacturing">программу OEM/ODM</a> по кастомизации, низким пробным MOQ и флотовым ценам. Каждая доска проходит <a href="/ru/factory">производственную линию</a> площадью 12,500 м&sup2; и на 100% проходит испытание давлением до отгрузки.</p>
  </div>

