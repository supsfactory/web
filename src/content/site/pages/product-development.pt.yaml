faq_section:
  tagline: FAQ
  title: 'Perguntas frequentes sobre o desenvolvimento SUP'
  questions:
    - q: Podem desenvolver um produto SUP a partir de uma ideia?
      a: 'Sim. Acompanhamos todo o percurso desde a especificação de produto e a engenharia, através do desenvolvimento do protótipo, da personalização e da produção em série conforme os teus requisitos. Um esboço, uma prancha de referência ou até a especificação de um concorrente bastam para a verificação de engenharia.'
    - q: Quanto custa o desenvolvimento de produto SUP?
      a: 'A verificação da especificação e a avaliação de engenharia são gratuitas e são devolvidas num dia útil. A amostragem do protótipo é orçamentada por projeto após o congelamento da especificação; os preços de produção dependem dos materiais, da quantidade e de ser ou não necessário equipamento próprio.'
    - q: Quanto dura o desenvolvimento de produto SUP?
      a: 'A primeira amostra parte 7–12 dias após a aprovação da especificação, com 3–7 dias para cada ronda de revisão. A produção continua por 25–35 dias após a encomenda e o sinal. Um molde próprio acrescenta 15–20 dias antecipadamente e o transporte marítimo representa 4–6 semanas na maioria dos destinos.'
    - q: O que vem primeiro — amostra ou produção?
      a: 'Sempre a amostra. Um protótipo físico é realizado, medido e aprovado relativamente à especificação antes de arrancar qualquer run de produção. Não produzimos quantidades de designs não aprovados.'
    - q: Assinam uma NDA para o desenvolvimento de produto?
      a: 'Sim. Uma NDA é assinada antes de cada troca de ficheiros e os teus designs, o teu artwork e o teu equipamento continuam a ser tua propriedade durante todo o desenvolvimento e produção.'
    - q: Podem proteger o meu design e as minhas especificações SUP?
      a: 'Os designs dos clientes, as especificações e os conceitos de produto são tratados de forma confidencial durante o desenvolvimento e a produção. Os teus ficheiros de equipamento nunca são reutilizados, revendidos ou mostrados a outros clientes.'

