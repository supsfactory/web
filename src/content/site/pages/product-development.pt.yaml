hero:
  tagline: Desenvolvimento de produto
  title: 'Desenvolvimento de produto SUP personalizado, da ideia ao contentor'
  subtitle: 'Seis fases transformam a tua ideia em pranchas SUP prontas para a produção — especificação, engenharia, prototipagem, teste, construção de equipamento e produção em série, tudo numa única fábrica com um sistema de qualidade responsável.'

answer:
  label: 'Resposta breve'
  text: 'O desenvolvimento de produto SUP da iSupfactory passa por seis fases — especificação de produto, engenharia estrutural, amostragem do protótipo, teste & validação, construção de equipamento personalizado e produção em série. A primeira amostra física parte 7–12 dias após a aprovação da especificação; a produção continua por 25–35 dias após a encomenda confirmada e o sinal; um novo molde acrescenta 15–20 dias.'
  verified: 'September 2026'

stages:
  title: 'As seis fases do desenvolvimento de produto SUP'
  subtitle: 'Cada fase tem um resultado claro — para saberes sempre em que ponto está o teu projeto — e o que acontece a seguir.'
  items:
    - title: '1. Ideia & especificação de produto'
      description: 'Geometria da prancha, faixa de peso do rider, volume, objetivos de construção e pacote de acessórios. Uma prancha de referência, um esboço ou a especificação de um concorrente bastam para começar.'
      icon: 'tabler:bulb'
    - title: '2. Engenharia & design 3D'
      description: 'Engenharia estrutural, espessura do drop-stitch e seleção da classe de PVC, além de uma verificação de producibilidade e uma proposta — num dia útil.'
      icon: 'tabler:blueprint'
    - title: '3. Amostragem do protótipo'
      description: 'A tua primeira amostra física parte em 7–12 dias, documentada com um formulário de aprovação para construção, cores de impressão e resultados do teste de pressão.'
      icon: 'tabler:tools'
    - title: '4. Teste & validação'
      description: 'Estanquicidade de pressão, resistência das soldaduras e controlos dimensionais relativamente à amostra aprovada, com documentação CE e REACH para os teus mercados de destino.'
      icon: 'tabler:test-pipe'
    - title: '5. Equipamento & produção em série'
      description: 'Construção de moldes personalizados em 15–20 dias, se necessário; a produção continua por 25–35 dias com pontos de controlo QC em linha e rastreabilidade dos lotes.'
      icon: 'tabler:settings'
    - title: '6. Entrega & escalabilidade'
      description: 'Logística FOB, CIF ou DDP para mais de 50 países — depois encomendas de reabastecimento sobre a tua linha consolidada com tempos de entrega estáveis e artwork aprovado arquivado.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Porque o desenvolvimento em fábrica vence um projeto intermediado'
  subtitle: 'O desenvolvimento diretamente na unidade de produção muda o que obténs em cada fase.'
  items:
    - title: Sem passagens de testemunho no design
      description: 'A equipa de engenharia e desenho trabalha no mesmo piso que a linha de soldadura — uma alteração ao desenho entra em produção na mesma semana, não após uma ronda comercial.'
      icon: 'tabler:handshake'
    - title: Amostras conformes com a produção
      description: 'O run de amostragem e o run de produção partilham as mesmas máquinas, materiais e postos QC — a amostra aprovada é portanto exatamente o que recebes à escala de contentor.'
      icon: 'tabler:stack-2'
    - title: Engenharia que não vende nada
      description: 'As decisões são tomadas relativamente a custos-alvo, peso e duração — não relativamente a margens de revenda, porque aqui é uma fábrica e a produção é a única fonte de faturação.'
      icon: 'tabler:scale'
    - title: Confidencialidade como compromisso permanente
      description: 'Uma NDA é assinada antes de cada troca de ficheiros e o teu artwork, o teu equipamento e os teus ficheiros de especificação continuam a ser tua propriedade — nunca reutilizados, revendidos ou mostrados a outros clientes.'
      icon: 'tabler:lock'

