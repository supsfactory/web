body: |
  <h2>Temel Farklar</h2>
  <p>Şişirilebilir SUP’ler (iSUP’lar) ve sert tahtalar aynı temel amaca hizmet eder — suda ayakta durmak ve kürek çekmek — ancak bunu tamamen farklı imalat yöntemleriyle başarırlar. Doğru seçim, tahtayı nasıl kullanmayı planladığınıza bağlıdır.</p>

  <table>
    <tr><th>Faktör</th><th>Şişirilebilir SUP</th><th>Sert SUP</th></tr>
    <tr><td>İmalat</td><td>Drop-stitch PVC, 12-15 PSI’a şişirilir</td><td>Cam elyaf veya epoksi ile sarılmış EPS köpük çekirdek</td></tr>
    <tr><td>Ağırlık</td><td>18-28 lbs (yalnızca tahta)</td><td>20-30 lbs (yalnızca tahta)</td></tr>
    <tr><td>Paketlenmiş ölçü</td><td>Sırt çantası (30 x 15 x 10 inç)</td><td>Tam boy (10-14 ft)</td></tr>
    <tr><td>Kurulum</td><td>3-5 dakika şişirme</td><td>Kullanıma hazır</td></tr>
    <tr><td>Ömür</td><td>Özenle 5-10 yıl</td><td>3-8 yıl (çürüklere karşı hassas)</td></tr>
  </table>

  <h2>Taşınabilirlik</h2>
  <p><strong>Şişirilebilir kazanır.</strong> Bu en açık avantajdır. Şişirilebilir bir SUP, araba bagajına, daire dolabına veya uçak üst bagajına sığan bir sırt çantasına sığar. Seyahat edenler, dairede yaşayanlar ve üstü bagaj rafı olmayan herkes için şişirilebilir SUP’ler çok daha pratiktir.</p>
  <p>Sert tahtalar üst bagaj rafı, büyük araç veya ayrı bir depolama alanı gerektirir. Taşımaları zordur ve özel nakliye kasaları olmadan uçakla götürülemezler.</p>

  <h2>Dayanıklılık</h2>
  <p><strong>Şişirilebilir kazanır.</strong> Şişirilebilir SUP’ler darbeye, delilmeye ve UV hasarına direnç gösteren askeri sınıf PVC’den üretilir. Şişirilebilir bir tahtayı düşürdüğünüzde veya bir kayaya çarptığınızda geri seker. Aynı darbe sert tahtada kırılma, çatlak veya ayrışmaya yol açardı.</p>
  <p>Sert tahtalar günlük aşınmaya ve yıpranmaya daha hassastır. Betona düşme tek başına, performansı ve su geçirgenliğini etkileyen kalıcı bir çürüğe yol açabilir.</p>

  <h2>Performans</h2>
  <p><strong>Üst segmentte sert tahta kazanır.</strong> Orta hızlarda rekreasyonel kürek ve turlarda her iki tahta tipi benzer performans gösterir. Sert tahtalar şu alanlarda öne çıkar:</p>
  <ul>
    <li><strong>Hız</strong> —Sert tahtalar daha hafif ve daha rijittir; bu da daha iyi kayma ve daha yüksek azami hıza karşılık gelir</li>
    <li><strong>Sörf</strong> —Sert tahtalar raydan raya daha duyarlı geçişler ve daha iyi dalga performansı sunar</li>
    <li><strong>Yarış</strong> —Rekabetçi yarış, ağırlık ve rijitlik avantajları nedeniyle neredeyse tamamen sert tahtalar kullanır</li>
  </ul>
  <p>Ortalama rekreasyonel kürekçi için bu performans farkları ihmal edilebilir düzeydedir. Çoğu kürekçi kaliteli bir şişirilebilir tahtayı geçemez.</p>

  <h2>Başlangıç Dostu Olma</h2>
  <p><strong>Şişirilebilir kazanır.</strong> Şişirilebilir SUP’ler başlangıç için daha kolaydır; çünkü:</p>
  <ul>
    <li>Daha yumuşak güverte yüzeyi daha konforludur ve düşmeler sırasında yaralanma olasılığını azaltır</li>
    <li>Daha geniş, daha kalın şişirilebilir tahtalar daha fazla birincil kararlılık sağlar</li>
    <li>Daha düşük yatırım maliyeti başlamayı erişilebilir kılar</li>
    <li>Kolay taşıma, kürek çekme fırsatlarını artırır</li>
  </ul>

  <h2>Depolama ve Bakım</h2>
  <p>Şişirilebilir SUP’lerin depolanmadan önce kurutulması ve doğru katlanması gerekir. Sert tahtalar monte edilmiş halde depolanabilir ancak güneş, ısı ve darbeye karşı korunmalıdır. İkisi de tuzlu su kullanımı sonrası tatlı suyla durulamaktan fayda görür.</p>

  <h2>Öneri</h2>
  <p><strong>Şişirilebilir bir SUP seçin:</strong> Seyahat ediyorsanız, sınırlı depolama alanınız varsa, rekreasyonel olarak kürek çekiyorsanız veya başlangıççısınız. Kürekçilerin %90’ı kaliteli bir şişirilebilir tahtayla gayet iyi şekilde başlar.</p>
  <p><strong>Sert bir tahta seçin:</strong> Rekabetçi yarış yapıyorsanız, ileri dalga sörfü yapıyorsanız veya taşınabilirlik ile dayanıklılığın önünde azami performansa öncelik veriyorsanız.</p>

  <h2>SSS</h2>
  <h3>Hangisi daha dayanıklı: şişirilebilir mi, sert SUP mi?</h3>
  <p>Şişirilebilir SUP’ler genel olarak daha dayanıklıdır; çünkü sert tahtada kalıcı hasar bırakan çukur, çatlak ve darbe hasarına karşı direnç gösterirler.</p>

  <h3>Şişirilebilir bir SUP başlangıç için daha mı iyi?</h3>
  <p>Evet. Şişirilebilir SUP’ler başlangıç için önerilir; çünkü daha bağışlayıcıdır, taşınması daha kolaydır ve düşmeler sırasında yaralanma olasılığı daha düşüktür.</p>

  <h3>Şişirilebilir SUP’ler sert tahtalar kadar performans gösterebilir mi?</h3>
  <p>Rekreasyonel kürek ve turlar için şişirilebilir SUP’ler sert tahta performansına eşdeğerdir. Sert tahtalar; daha düşük ağırlıkları ve hassas esneklikleri sayesinde yarışta ve ileri sörfte hala üstündür.</p>

