      pl: 'Tehtaan olemassa oleva alusta — ei suunnittelutyötä'
    - dimension: 'Suunnittelun omistajuus ja immateriaalioikeudet'
      oem: 'Omistat kaikki suunnittelut, muotit ja immateriaalioikeudet'
      odm: 'Omistat lopullisen hyväksytyn suunnittelun; tehtaalla on kehitysprosessin immateriaalioikeudet'
      pl: 'Tehtaan omistuksessa oleva alustasuunnittelu; sinulla brändisi ja kuvituksesi'
    - dimension: 'Muotti / työkalusto'
      oem: 'Uusi muoto vaatii räätälöidyn muotin — kertaluontoinen työkalustomaksu, 15–20 päivää lisää'
      odm: 'Määrityksestä riippuen voi vaatia räätälöidyn muotin — sama työkaluston aikataulu'
      pl: 'Ei uutta muottia — käytetään olemassa olevan alustan työkalustoa'
    - dimension: 'Vähimmäiseräkoko'
      oem: '90–100+ kpl hyväksytyn konfigurointia kohti'
      odm: '90–100+ kpl hyväksytyn konfigurointia kohti; pilottierät 20–50 kpl:stä'
      pl: '5–10 kpl (co-branding) tai 20–50 kpl (pilottisarja olemassa olevalla alustalla)'
    - dimension: 'Tyypillinen toimitusaika'
      oem: '25–35 päivää + 15–20 päivää työkalustoon, jos uusi muotti'
      odm: '25–35 päivää + kehittämisen iterointiaika (riippuu monimutkaisuudesta)'
      pl: '25–35 päivää (ei työkaluston viivästystä)'
    - dimension: 'Räätälöintitaso'
      oem: 'Täysi — muoto, rakenne, materiaalit, kuvitus, pakkaus'
      odm: 'Täysi — tehdas ehdottaa, hyväksyt jokaisen osan'
      pl: 'Vain kuvitus ja pakkaus — ei rakenteellisia muutoksia'
    - dimension: 'Näyteprosessi'
      oem: '1–2 prototyyppinäytettä 7–12 päivässä määrityksen hyväksynnän jälkeen'
      odm: '1–2 prototyyppinäytettä 7–12 päivässä suunnittelun hyväksynnän jälkeen'
      pl: '1–2 näytettä 7–12 päivässä — alusta on jo validoitu'
    - dimension: 'Sopii parhaiten'
      oem: 'Ostajille, joilla on olemassa olevia suunnitelmia, referenssilaudoja tai yksityiskohtaisia määrityksiä'
      odm: 'Ostajille, joilla on tuoteideoita tai markkinavaatimuksia mutta ei yksityiskohtaista määritystä'
      pl: 'Ostajille, jotka tarvitsevat brändättyjä lautoja nopeasti ilman tuotekehitystä'

