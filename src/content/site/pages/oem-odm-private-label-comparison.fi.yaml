hero:
  tagline: 'Valitse yhteistyömallisi'
  title: 'OEM vs ODM vs Private Label — mikä malli sopii projektiisi?'
  subtitle: 'Kolme tapaa tehdä yhteistyötä SUP-tehtaan kanssa, joilla kullakin on erilaiset omistajuus-, investointi- ja nopeuskompromissit. Tämä opas selittää erot, jotta voit valita oikean reullan jo ennen ensimmäistä tiedustelua.'

answer:
  label: 'Nopea vertailu'
  text: 'OEM: omistat suunnittelun ja määrityksen — valmistamme piirustustesi mukaisesti. ODM: tuotetekniikan tiimimme kehittää laudan toimeksiannostasi — hyväksyt ennen tuotantoa. Private Label: brändisi todistetulla olemassa olevalla alustalla ilman rakenteellisia muutoksia — nopein reitti markkinoille. Kaikki kolme reittiä kulkevat saman laitoksen, laadunvalvontajärjestelmän ja vientitiimin läpi Qingdaossa, Kiinassa.'
  verified: 'Syyskuu 2026'

comparison_table:
  tagline: 'Rinnakkain'
  title: 'OEM / ODM / Private Label -vertailu'
  subtitle: 'Keskeiset erot suunnittelun omistajuudessa, vähimmäiserässä, työkalustossa, toimitusajassa ja immateriaalioikeuksissa.'
