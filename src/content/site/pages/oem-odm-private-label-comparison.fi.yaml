ip_rules:
  tagline: Imateriaalioikeuksien suoja
  title: 'Näin suojaamme suunnittelusi ja brändisi'
  subtitle: 'Riippumatta yhteistyömallista, artworkisi, työkalustosi ja määritystiedostosi pysyvät omaisuuttanasi.'
  body: |
    **NDA ennen tiedostojen vaihtoa.** Allekirjoitamme salassapitosopimuksen ennen mitään teknistä tiedostovaihtoa — vakiintunut vastausaika on 4 työtuntia.

    **Suunnittelujen uudelleenkäyttö ei ole sallittua.** Artworkiasi, työkalustosi ja määritystiedostojasi ei koskaan jaeta eikä myydä muille asiakkaille. OEM-muotit kuuluvat yksinomaan sinulle. ODM-suunnittelut hyväksyt ennen tuotantoa. Private Label -alustat ovat yhteisiä rakenteita, mutta kuvituksesi ja brändäyksesi ovat eksklusiivisia.

    **Vain B2B.** Valmistamme yksinomaan asiakkaidemme brändeillä. Emme myy loppukuluttajille emmekäkä kilpaile asiakkaidemme kanssa millään markkinoilla.

    **Muotin omistajuus.** Ostajan maksamat räätälöidyt muotit kuuluvat ostajalle. Säilytämme ja huollamme niitä, mutta emme voi käyttää niitä muille asiakkaille ilman kirjallista valtuutusta.

faqs:
  tagline: 'FAQ'
  title: 'Usein kysytyt kysymykset OEM:stä, ODM:stä ja Private Labelista'
  items:
    - q: 'Voinko myöhemmin siirtyä private labelista OEM:ään?'
      a: 'Kyllä. Monet asiakkaat aloittavat private labelilla tai pilottierällä markkinoiden varmistamiseksi ja investoivat sitten räätälöityyn työkalustoon täyden OEM-ohjelman kautta, kun kysyntä on todennettu. Sama laitoksen ja laadunvalvontajärjestelmän tukee molempia reittejä.'
    - q: 'Tarkoittaako ODM, että tehdas omistaa brändini?'
      a: 'Ei. ODM:n yhteydessä omistat brändisi, kuvituksesi ja pakkauksesi. Tehdas kehittää laudan rakenteen toimeksiannostasi ja hyväksyt suunnittelun ennen tuotantoa. Tehtaalla säilyy kehitysprosessin immateriaalioikeudet, mutta hyväksytty tuotemääritys on sinun.'
    - q: 'Onko private label alempi laatu kuin OEM?'
      a: 'Ei. Kaikki kolme reittiä kulkevat saman laitoksen, saman laadunvalvontajärjestelmän ja saman vientitiimin läpi. Private label -laudat rakennetaan todistetuilla, validoiduilla alustoilla täydellä 18 PSI / 24h painetestauksella ja samalla 100 pisteen kokoonpanotarkistuslistalla.'
    - q: 'Entä jos en ole varma, mitä mallia valita?'
      a: 'Ota yhteyttä tilanteeseesi — tuotetekniikan tiimimme suosittelee käytännöllisimmän reullan tuotevaatimustesi, aikataatusi ja volyymitavoitteesi perusteella. Sitoumuksia ei vaadita ennen määrityksen tarkastusta.'
    - q: 'Voinko saada näytteitä ennen minkään mallin vakiintumista?'
      a: 'Kyllä. 1–2 prototyyppinäytettä lähetetään 7–12 päivässä. Näytemaksu vähennetään volyymitilauksestasi. Näin voit arvioida rakenteen ja laadun ennen mitään volyymisitoumusta.'

