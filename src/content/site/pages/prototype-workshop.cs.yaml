  text: 'Převedeme model z CADu na otestovanou vzorovou desku připravenou k jízdě za 7–12 dnů: nafukování prototypu, vodní zkoušky v mírné vlně, iterace na boku a přídi a následné spuštění do výrobních nástrojů. Zcela vlastní formy vyžadují navíc 15–20 dnů na nástroje nad standardní sériovou výrobu, která trvá 25–35 dnů.'
