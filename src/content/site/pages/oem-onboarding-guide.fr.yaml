answer:
  label: 'Réponse directe'
  text: 'Une intégration OEM typique prend 2–4 semaines pour l''approbation de l''échantillon et 6–8 semaines pour la première série de production à partir du bon de commande confirmé. Vous commencez par soumettre un brief de projet (spéc. de planche, volume, besoins de conformité). Nous répondons sous un jour ouvré, proposons une NDA avant que vous partagiez des détails propriétaires, et produisons 1–2 échantillons physiques en 7–12 jours pour votre examen et votre approbation. Une fois l''échantillon figé, la planification de production et la fabrication suivent avec des portes de QC fixes à chaque étape. Chaque étape est documentée et traçable.'
  verified: '2026-08'

process_steps:
  tagline: Les sept portes
  title: 'Déroulement de l''intégration — sept portes du brief à la livraison'
  subtitle: 'Chaque porte a une entrée définie, une sortie définie et un calendrier que vous convenez à l''avance. Vous ne dépassez jamais une porte sans approbation explicite.'
  steps:
    - step: 'Porte 1'
      title: 'Demande initiale et NDA (Jour 0)'
      desc: 'Soumettez un brief de projet via /contact avec vos spéc. de planche cibles, le volume de commande, les exigences de conformité et le calendrier. Une NDA est disponible immédiatement — avant que vous partagiez toute spécification technique ou graphisme propriétaire. Réponse sous un jour ouvré.'
    - step: 'Porte 2'
      title: 'Revue de faisabilité et devis (Jours 1–5)'
      desc: 'L''ingénierie examine votre brief contre la capacité de fabrication, la disponibilité des matériaux et le périmètre de conformité. Vous recevez un devis détaillé avec le calcul du MOQ, les frais d''échantillon (crédités sur la production) et les segments de délai — pas une fourchette approximative, mais un calendrier porte par porte.'
    - step: 'Porte 3'
      title: 'Production d''échantillon (Jours 6–17)'
      desc: '1–2 planches physiques produites selon votre spécification : rigidité de la coque, texture du tapis de traction EVA, précision des graphismes, montage des accessoires. Vous montez et évaluez la planche avant de vous engager dans autre chose. Les frais d''échantillon sont crédités sur votre commande de production à la signature du contrat.'
    - step: 'Porte 4'
      title: 'Examen et approbation de l''échantillon (Jours 18–21)'
      desc: 'Vous évaluez l''échantillon contre vos spécifications — qualité de roulage, fidélité des graphismes, emballage, accessoires. Les ajustements sont capturés dans une BOM révisée et une signature des graphismes. La spécification figée devient la référence de production pour toutes les séries ultérieures.'
    - step: 'Porte 5'
      title: 'Planification de pré-production (Jours 22–28)'
      desc: 'Approvisionnement des matériaux, configuration de l''outillage, confirmation de l''emballage et réservation du créneau de production. Tous les matériaux sont contrôlés à l''arrivée contre la BOM figée. Un planning de production avec les dates de portes QC est émis avant le début de la fabrication.'
    - step: 'Porte 6'
      title: 'Production et portes QC (Jours 29–55)'
      desc: 'La fabrication passe par le système de portes d''inspection à 7 étapes : inspection des matériaux entrant, inspection du tissu drop-stitch, soudure et assemblage, test de pression et d''étanchéité à l''air (maintien à 18,0 PSI, rejet automatique au-delà d''une chute de 0,50 PSI), installation du tapis EVA et des accessoires, QC des graphismes et de la marque, emballage final et documentation. Chaque porte a des critères de réussite/échec et des enregistrements de traçabilité.'
    - step: 'Porte 7'
      title: 'Expédition et examen post-livraison (Jours 56–63)'
      desc: 'Conditionnement adapté à l''export, documentation de conformité (CE, ISO 9001, BSCI, REACH, RoHS) et coordination du fret océanique vers 50+ pays. Un examen post-livraison capture les enseignements et les améliorations pour le prochain cycle de commande.'

