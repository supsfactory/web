faqs:
  tagline: FAQ
  title: 'Intégration OEM — questions fréquentes'
  items:
    - q: 'Combien de temps prend le processus d''intégration complet ?'
      a: 'L''approbation de l''échantillon prend généralement 2–4 semaines (y compris la production d''échantillon en 7–12 jours et votre période d''examen). La première série de production prend 6–8 semaines à partir du bon de commande confirmé et de l''acompte. Une forme de coque sur mesure ajoute 15–20 jours de développement de moule. Chaque porte a un calendrier fixe convenu à l''avance.'
    - q: 'Dois-je signer une NDA avant de partager mon design ?'
      a: 'Une NDA est disponible immédiatement sur demande — avant que vous partagiez toute spécification technique ou graphisme propriétaire. Nous fabriquons exclusivement sous les marques de nos clients et ne concurrençons jamais sur aucun marché. La même politique s''applique à un échantillon d''1 planche qu''à un programme conteneur.'
    - q: 'Quelle est la commande minimale pour une première série OEM ?'
      a: 'Le point d''entrée est étagé : 1–2 échantillons d''abord (prêts en 7–12 jours), une commande d''essai ou pilote de 20–50 planches (production en 25–35 jours), puis des séries de volume standard de 90–100+ planches par configuration approuvée. Le co-marquage en petits lots commence dès 5–10 unités quand aucune étape de développement n''est nécessaire. Les frais d''échantillon sont crédités sur votre commande de production.'
    - q: 'Comment la protection de la PI est-elle gérée pendant l''intégration ?'
      a: 'Vos designs et spécifications sont protégés sous la NDA signée avant que toute information propriétaire soit partagée. Tous les graphismes, données BOM et fichiers techniques sont stockés dans des systèmes à accès contrôlé avec pistes d''audit. En mode OEM, vous possédez toute la PI. En mode ODM, la PI de la plateforme adaptée est partagée selon l''accord. En mode Marque privée, la PI reste avec SUPsfactory et vous licencez l''application de la marque.'
    - q: 'Quelles garanties de qualité s''appliquent à une première commande ?'
      a: 'Chaque planche — échantillon, essai ou volume — passe par le même système de portes d''inspection à 7 étapes : inspection des matériaux entrant, inspection du tissu drop-stitch, soudure et assemblage, test de pression et d''étanchéité à l''air de 24 heures (maintien à 18,0 PSI, rejet automatique au-delà d''une chute de 0,50 PSI), installation du tapis EVA et des accessoires, QC des graphismes et de la marque, et emballage final et documentation. La qualité n''est jamais réduite pour les commandes plus petites.'

