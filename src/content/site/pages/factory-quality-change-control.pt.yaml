faqs:
  tagline: FAQ
  title: Perguntas frequentes sobre o controlo de alterações de retrabalho
  items:
    - q: 'A fábrica pode modificar os parâmetros de retrabalho sem nos informar?'
      a: 'Não. Cada alteração proposta a materiais de retrabalho libertados, condições de processo, equipamento, métodos de ensaio, critérios de inspeção ou pessoal autorizado deve primeiro passar por um controlo de alterações documentado. As alterações que afetam especificações aprovadas pelo cliente, amostras, BOM, gráficas ou critérios de aceitação exigem a libertação escrita do cliente.'
    - q: 'O que conta como alteração de alto risco?'
      a: 'As alterações a materiais ou fornecedores de retrabalho, condições de pressão/manutenção ou cura, métodos de retrabalho de válvulas/rail/costuras, critérios de inspeção ou aceitação e a extensão do âmbito do defeito para zonas estruturais são classificadas como de alto risco. Exigem verificação interfuncional, um plano de validação libertado e implementação piloto controlada antes da utilização de rotina.'
    - q: 'Um desvio temporário pode ser usado sem limites?'
      a: 'Não. Cada desvio temporário traz uma janela de validade definida, um âmbito de partida, um teto de quantidade e requisitos de validação com expiração automática. Atingir o teto bloqueia a partida e bloqueia a impressão da etiqueta de passagem até a alteração ser formalmente avaliada.'
    - q: 'Como se demonstra que um método alterado funciona antes da utilização plena?'
      a: 'As alterações de alto risco exigem um plano de validação: pelo menos 5 pranchas amostra representativas que cobrem os limites de tolerância, testadas por 2 inspetores QC independentes contra critérios de aceitação quantificados (eliminação de fugas, manutenção de pressão, função da válvula, durabilidade das costuras, aspeto). A libertação para a validação não é uma libertação para a aplicação.'
    - q: 'Precisamos de libertar cada alteração?'
      a: 'Não é cada alteração, mas cada alteração que afasta o produto da amostra aprovada pelo cliente, da especificação técnica, da BOM, das gráficas, da embalagem ou dos critérios de aceitação é implementada apenas com a libertação escrita do cliente. Sem ela, as pranchas são retrabalhadas, substituídas ou rejeitadas segundo o requisito original.'
    - q: 'O que acontece aos documentos antigos quando uma alteração é libertada?'
      a: 'As antigas instruções de trabalho, as fichas de parâmetros e as folhas de inspeção são fisicamente retiradas e invalidadas (1-in-1-out), marcadas OBSOLETE e substituídas pela nova revisão controlada após a formação. As versões antigas e novas nunca partilham uma estação de trabalho.'
    - q: 'Durante quanto tempo são conservados os registos do controlo de alterações?'
      a: 'Os registos de encerramento — evidências de validação, revisões documentais, evidências de formação e provas de eficácia — são conservados segundo a nossa política de conservação (pelo menos 3 anos para os registos de encerramento), para que cada alteração permaneça reconstruível para auditorias e verificações de rastreabilidade.'

