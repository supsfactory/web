cc_pokayoke:
  tagline: Proteção à prova de erro
  title: 'Poka-Yoke: bloqueios rígidos que param as alterações não controladas'
  subtitle: O padrão é aplicado não apenas através de procedimentos, mas com bloqueios físicos e sistémicos que tornam impossíveis as alterações não controladas.
  features:
    - icon: 1
      icon_bg: blue
      title: Gate ECR para a ativação das ferramentas
      desc: 'As estações de retrabalho leem um código de barras ECR assinado pela QA antes de as válvulas de inflagem pneumáticas e os misturadores de adesivo se ativarem. Sem evidência de controlo de alterações libertado, sem alimentação — a assinatura retroativa ("primeiro muda, depois assina") é fisicamente bloqueada.'
    - icon: 2
      icon_bg: green
      title: Expiração automática dos desvios temporários
      desc: 'Os desvios temporários têm um teto hard-coded no sistema (ex. máximo de 50 pranchas ou 7 dias de calendário). Atingir o teto bloqueia a partida e bloqueia a impressão da etiqueta de passagem de envio até a alteração ser formalmente avaliada.'
    - icon: 3
      icon_bg: purple
      title: Evidência mínima de validação
      desc: 'As alterações de alto risco exigem pelo menos 5 pranchas amostra representativas que cobrem o limite de tolerância superior e inferior, totalmente testadas por 2 inspetores QC independentes antes de poder ser emitido um relatório de validação — uma prancha reparada nunca é tratada como validação de processo.'
    - icon: 4
      icon_bg: orange
      title: Controlo documental 1-in-1-out
      desc: 'As fichas obsoletas das estações de trabalho são fisicamente retiradas e invalidadas (perfuradas) antes de a nova ficha ser emitida carimbada com o selo vermelho controlado — as versões antigas e novas nunca partilham uma estação de trabalho.'

