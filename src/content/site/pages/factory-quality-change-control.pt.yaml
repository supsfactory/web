cc_intro:
  tagline: Âmbito & política
  title: Princípios de governança core
  body: |
    **Documento:** QMS-SOP-QC-CC-001 — *Padrão de controlo de alterações para os parâmetros de processo de retrabalho* (Rev 2.0, publicação oficial). **Produtor:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Referência de padrão:** ISO 9001:2015 Sistemas de gestão da qualidade.

    - **Sem alterações não controladas.** As alterações aos parâmetros de retrabalho devem passar por um controlo formal de alterações. Os operadores no terreno, os chefes de turno ou um departamento individual nunca devem modificar os parâmetros de retrabalho libertados com um acordo verbal ou um registo escrito à mão num relatório de retrabalho.
    - **Cobertura completa dos elementos.** O âmbito controlado inclui estanquicidade ao ar, sedes das válvulas, rail bands, colagem das costuras, cura a ar quente e testes de manutenção da pressão — cada parâmetro que pode influenciar a selagem, a durabilidade estrutural, o aspeto, a aceitação do cliente ou a rastreabilidade.
    - **A libertação do cliente como ponto central.** Cada alteração que afasta um produto da amostra aprovada pelo cliente, da especificação técnica, da BOM, das gráficas, do requisito de embalagem ou dos critérios de aceitação é implementada apenas com a libertação escrita do cliente. Sem ela, a prancha é retrabalhada, substituída ou rejeitada segundo o requisito original — nunca "afrouxada" apenas pela fábrica.

cc_scope:
  tagline: Classificação de risco
  title: Âmbito das alterações & classificação de risco
  subtitle: Cada uma das seguintes alterações ativa o controlo formal de alterações — nunca é gerida com uma nota no relatório de retrabalho. O nível de risco determina quem liberta e quanta validação é exigida.
  headers:
    category: Categoria de alteração
    examples: Exemplos típicos
    risk: Risco
    requirements: Requisitos de controlo & libertação
  rows:
    - category: 'Materiais de retrabalho'
      examples: 'Adesivo, desengordurante, material de reparação, junta da válvula, primário ou mudança de fornecedor'
      risk: 'Alto'
      requirements: 'Verificação interfuncional + validação de compatibilidade de materiais & manutenção de pressão + libertação do cliente quando aplicável'
    - category: 'Condições de processo'
      examples: 'Preparação da superfície, temperatura/humidade de cura a ar quente, pressão de prensagem, duração da manutenção'
      risk: 'Alto'
      requirements: 'Libertação de design + qualidade com validação definida das janelas de temperatura & humidade'
    - category: 'Equipamento & instrumentos de medição'
      examples: 'Manómetros, detetores de fugas, termoelementos de ar quente, ferramentas para válvulas, software de ensaio'
      risk: 'Médio/Alto'
      requirements: 'Verificação de validade da calibração + avaliação da adequação do equipamento'
    - category: 'Âmbito do defeito'
      examples: 'Extensão da área de retrabalho; micro-reparação superficial que cresce para zonas críticas de rail, costura ou sede de válvula'
      risk: 'Alto'
      requirements: 'Superfícies estruturalmente portantes: paragem obrigatória e nova avaliação'
    - category: 'Métodos de inspeção'
      examples: 'Método de deteção de fugas, pressão de ensaio (18.0 PSI), duração da manutenção (24h)'
      risk: 'Alto'
      requirements: 'Libertação de qualidade + confirmação do acordo técnico do cliente'
    - category: 'Documentação & autorização'
      examples: 'Instrução de retrabalho, folhas de inspeção, lógica de disposição NCR, qualificação de operadores'
      risk: 'Médio'
      requirements: 'Revisão documental controlada (Rev A → Rev B) + evidências de formação'

cc_containment:
  tagline: Regra da paragem rígida
  title: Contenção imediata quando as condições ficam sérias
  body: |
    > "O método de retrabalho existente deve ser submetido a verificação e não aplicado a mais produtos afetados até a alteração ser avaliada e autorizada, a menos que um desvio temporário documentado tenha sido aprovado pela Qualidade e pelo Design."

    O método de retrabalho em vigor deve ser suspenso imediatamente se a nova verificação do retrabalho continuar a falhar, se o defeito afetar zonas estruturalmente portantes (base da válvula, rail, costuras, áreas de pressão de proa/proa-popa), se um material de substituição ainda não estiver validado ou se os parâmetros atuais colidirem com a especificação aprovada pelo cliente.

    Os desvios temporários nunca se tornam prática permanente: cada um traz uma janela de validade definida, um âmbito de partida aplicável, um teto de quantidade, requisitos de validação e um mecanismo de expiração automática. Uma exceção verbal não é uma exceção — se não estiver documentada com a sua expiração, não existe.

cc_flow:
  tagline: Ciclo fechado padrão em 9 fases
  title: Do pedido de alteração ao encerramento e à conservação
  subtitle: 'Um ciclo documentado para cada alteração de parâmetros: propor, filtrar, avaliar, libertar, validar, pilotar, verificar, rever, encerrar.'
  steps:
    - step: '01'
      title: Pedido de alteração (ECR)
      desc: 'Qualquer departamento pode apresentar um pedido, mas é patrocinado pelo Design, pela Qualidade ou pela direção de produção. O ECR responde ao porquê da alteração, ao que muda, ao que é afetado e a como será verificado — com número de controlo de alterações, NCR/CAPA ligado, parâmetro atual vs. proposto, partidas afetadas e classificação de alteração temporária/permanente.'
    - step: '02'
      title: Filtragem inicial & contenção
      desc: 'O pedido é primeiro filtrado para a contenção imediata: o método atual deve ser parado agora? Se for permitido um desvio temporário, é limitado por janela de validade, âmbito de partida, teto de quantidade e expiração automática.'
    - step: '03'
      title: Avaliação de impacto & risco
      desc: 'Design, Qualidade, Produção, Aprovisionamento/cadeia de abastecimento e Projeto avaliam o desempenho do produto, os critérios de aceitação, a compatibilidade dos materiais, o aspeto, a capacidade de processo, o equipamento e os instrumentos de medição, a qualificação do pessoal, os requisitos do cliente, a conformidade e o âmbito da rastreabilidade.'
    - step: '04'
      title: Verificação conjunta & libertação
      desc: 'A libertação segue a matriz de autorização fixa — não "quem fala mais alto". As alterações de alto risco exigem a libertação interfuncional e, quando necessário, a libertação escrita do cliente antes de qualquer tentativa.'
    - step: '05'
      title: Plano de validação
      desc: 'Para as alterações de alto risco é exigido um plano de validação libertado antes da aplicação de rotina: pranchas amostra representativas, método atual vs. proposto, métodos de ensaio, critérios de aceitação, níveis de inspeção, responsáveis e cronograma.'
    - step: '06'
      title: Pilotos controlados & implementação
      desc: 'Os novos documentos são libertados e as versões obsoletas retiradas e marcadas OBSOLETE; os novos materiais e instrumentos de medição são verificados e calibrados; os operadores são formados e qualificados; a primeira partida corre sob inspeção reforçada com marcação clara de estado.'
    - step: '07'
      title: Nova verificação & prova de eficácia
      desc: 'A taxa de primeiro passe da retrabalhagem, a taxa de aprovação da nova verificação, a taxa de repetição e a aceitação do aspeto são medidas e verificadas antes de a alteração ser considerada eficaz — uma prancha reparada nunca é tratada como validação de processo.'
    - step: '08'
      title: Revisão documental & formação
      desc: 'Instruções de trabalho, folhas de inspeção, opções de disposição NCR, fichas de parâmetros e materiais de formação são atualizados para a nova revisão, com formação prática registada e qualificação do operador.'
    - step: '09'
      title: Encerramento & conservação dos registos
      desc: 'A alteração é encerrada apenas depois de as evidências de validação, as atualizações documentais, as evidências de formação e a eficácia da implementação serem verificadas e libertadas. Se o resultado previsto não for alcançado, a alteração é revista, alargada, suspensa ou retirada.'

