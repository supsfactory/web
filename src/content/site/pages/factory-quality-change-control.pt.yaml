cc_validation:
  tagline: Validação de engenharia
  title: Protocolo de validação & aceitação — evidências, não afirmações
  body: |
    Uma formulação de aceitação vaga como *"a prancha reparada deve estar boa"* não é aceite. A formulação controlada é:

    > "O exemplar retrabalhado deve cumprir os mesmos critérios de aceitação aplicáveis de estanquicidade ao ar, acabamento visual, função da válvula e específicos do projeto de uma prancha conforme, a menos que um desvio aprovado pelo cliente defina expressamente um critério alternativo."

    As evidências de validação são quantitativas e a baseline técnica para o retrabalho de estanquicidade ao ar inclui:

    - **Eliminação da fuga & manutenção da pressão.** A fuga original é eliminada sem bolhas persistentes na deteção com água saponosa; a prancha mantém a pressão à pressão de ensaio padrão de 18.0 PSI durante 24 horas, com queda de pressão líquida ΔP ≤ 0.2 PSI após compensação de temperatura/humidade — a baseline mais rigorosa para a validação do retrabalho, separada do limiar de exclusão automática de 0.50 PSI aplicado à aceitação final da linha de produção.
    - **Função da válvula.** O aperto do núcleo da válvula cumpre a especificação de 15–20 N·m, sem micro-fugas na junta sob inflagem a alta pressão e pressão dinâmica.
    - **Colagem das costuras & durabilidade.** Os bordos de colagem não mostram levantamentos, branqueamentos ou delaminação; após os ciclos de envelhecimento térmico/humidade, a camada adesiva não mostra amolecimento ou fissuras frágeis.
    - **Aspeto & acabamento.** Sem excesso de adesivo, sem danos no EVA, sem deformação da prancha e sem deslocamento do logótipo ou riscos na superfície impressa.

cc_engineering:
  tagline: Matriz de execução de engenharia
  title: Parâmetros quantificados para os quatro processos de retrabalho core
  subtitle: 'Cada processo de retrabalho controlado traz parâmetros definidos, metodologia e critérios de aceitação — os mesmos números que os nossos operadores seguem e que os clientes podem verificar durante as auditorias.'
  headers:
    process: Processo de retrabalho
    parameters: Parâmetros controlados
    methodology: Metodologia de ensaio
    acceptance: Critérios de aceitação
  rows:
    - process: 'Reparação de furos de alfinete/micro-fugas'
      parameters: 'Limpeza com solvente & secagem 3–5 min; ativação a ar quente 60°C ± 5°C; rolo de prensagem ≥ 0.4 MPa'
      methodology: 'Inflar a 18 PSI; imersão completa em água ou aplicação de sabão; observar durante 10 minutos'
      acceptance: 'Emissão de bolhas igual a zero; abdução do bordo a 180° sem levantamentos e sem excesso de adesivo'
    - process: 'Re-colagem de rail band/costura'
      parameters: 'Rácio de adesivo bicomponente estritamente controlado; ambiente 22–28°C, ≤ 65% humidade relativa; prensa do gabarito ≥ 4 h'
      methodology: 'Teste de sobrepressão a 22 PSI durante 2 h; depois 6 h de cura em forno a quente a 50°C e 2 h de repouso à temperatura ambiente'
      acceptance: 'Separação igual a zero, fissuras igual a zero; queda de pressão líquida ΔP ≤ 0.1 PSI; camada adesiva sem branqueamentos ou fragilização'
    - process: 'Afolgamento da base da válvula / micro-fuga'
      parameters: 'Aperto dedicado da chave 18–20 N·m; anel de vedação plano sem deformações; limpeza da rosca confirmada'
      methodology: 'Inflar a 15 PSI; 20 ciclos de inflagem/descompressão; observação durante a imersão em água'
      acceptance: 'Bolhas iguais a zero no núcleo da válvula e em redor da base; aperto após os ciclos ≥ 16 N·m'
    - process: 'Teste final de manutenção de pressão de 24h'
      parameters: 'Inflagem de referência 18.0 PSI; manómetro digital classe 1.0 / ±0.5%; temperatura & humidade ambiente registadas e compensadas'
      methodology: 'Registador de pressão digital; curva de pressão contínua de 24h'
      acceptance: 'Queda de pressão líquida ΔP ≤ 0.20 PSI / 24 h após compensação; nenhuma abaulagem ou deformação da prancha'

