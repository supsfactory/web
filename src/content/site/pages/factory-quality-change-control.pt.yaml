answer:
  label: 'Resposta clara'
  text: 'As alterações aos parâmetros de retrabalho nunca são decididas oralmente ou retroativamente na QINGDAO VATRAD GROUP.,LTD. Cada alteração proposta a materiais de retrabalho libertados, condições de processo, equipamento, métodos de ensaio, critérios de inspeção ou pessoal autorizado deve passar por um controlo formal de alterações antes da implementação: um Engineering Change Request (ECR) documentado, avaliação de impacto e risco, verificação interfuncional de design, qualidade, produção, aprovisionamento e projeto, libertação ao nível definido pela nossa matriz de autorização, um plano de validação libertado para as alterações de alto risco, implementação piloto controlada, nova verificação e prova de eficácia, bem como encerramento apenas após revisão documental e formação. Cada alteração que afeta especificações aprovadas pelo cliente, amostras, BOM, gráficas ou critérios de aceitação exige ainda a libertação escrita do cliente.'
  verified: 'September 2026'

