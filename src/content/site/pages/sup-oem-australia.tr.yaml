answer:
  label: 'Doğrudan cevap'
  text: 'Avustralyalı markalar şişirilebilir SUPyi iSupfactoryden standart koşullarla sipariş eder: MOQ, proje yapılandırmasıyla belirlenir — 1–2 adetlik numune partileri yapıyı doğrular, mevcut platformlarda 20–50 adetlik pilot partiler pazarı test eder, standart hacimli üretim ise tam 150 m drop stitch rulosundan tasarım başına 90–100+ adet çalışır. İlk numune, teknik özellik onayından 7–12 gün sonra sevk edilir; üretim, kesinleşen sipariş ve depozitodan 25–35 gün sonra tamamlanır, deniz navlunu ise Sidney, Melbourne veya Brisbane için 4–6 hafta ekler. Üretim ve navlun birlikte düşünüldüğünde, stoğu rafta görmekten 3–4 ay önce sipariş verin; DDP, gümrükleme ve deponuza teslim kapsamındadır.'
  verified: 'Eylül 2026'

