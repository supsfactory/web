    - icon: C
      icon_bg: green
      title: 'Kezelhető pénzügyi áramlás'
      desc: 'A kisebb megrendelések kisebb előlegeket, ütemezett fizetéseket jelentenek, és nincs raktárban lekötött tőke. A térfogati árak addig várnak, amíg azokat ténylegesen ki nem érdemli.'
    - icon: Q
      icon_bg: purple
