scale_path:
  tagline: A próba után
  title: 'Mi következik egy sikeres próbarendelés után'
  subtitle: 'A próbarendelés szándékosan egy hosszabb kapcsolat első lépése. Ez az az út, amelyet az első deszka feladása előtt egyeztetünk.'
  steps:
    - step: '1. fázis'
      title: 'A próba kiszállítva és értékelve'
      desc: '20–50 deszka érkezik a szezonba, és a készletforgalmi adatok visszaérkeznek az Ön csatornájából – bérelés, kiskereskedelem vagy közvetlen értékesítés.'
    - step: '2. fázis'
      title: 'Visszajelzés és finomítás'
      desc: 'A színváltozatok, a grafika, a csomagolás és a tartozékok kombinációja a piac valós reakciója alapján finomul. A grafika és az anyaglista a következő szállítmányra rögzül.'
    - step: '3. fázis'
      title: 'Térfogatszállítmány (90–100+ deszka)'
      desc: '150 m-es tekercsekkel dolgozó szállítmányok teljes gyártási hatékonysággal, márkás kiskereskedelmi csomagolással és térfogati árakkal – a mintajóváhagyások már levonva.'
    - step: '4. fázis'
      title: 'Konténer-skálájú programok'
      desc: '300+ deszkás programok, ütemezett feladásokkal, testreszabott Pantone anyagokkal és a teljes fejlesztési folyamattal – ugyanaz a gyár, most már teljes méretben.'

trial_faqs:
  tagline: GYIK
  title: 'Gyakori kérdések az indulásról próbarendeléssel'
  items:
    - q: 'Elindíthatok egy SUP márkát konténerrendelés nélkül?'
      a: 'Igen. A belépési pont lépcsőzetes: 1–2 minta validálja a deszkát (7–12 nap alatt kész), 20–50 deszkás próbarendelés validálja a piacot (25–35 napos gyártás), a 90–100+ deszkás térfogatszállítmányok pedig csak akkor következnek, ha a készletforgalom bizonyítja a formát. A kis szállítmányú közös márkázás már 5–10 darabtól indul, ha fejlesztési lépés nélkül szeretne márkás deszkát.'
    - q: 'Mennyi ideig tart egy teljes indulás, egyik végétől a másikig?'
      a: 'A meglévő víztest-platformokat használva egy szokásos első indulás 8–12 hétig tart a terméklaptól a kiszállított próbarendelésig: 7–12 napos minták, 25–35 napos próbagyártás a megerősített megrendelés és előleg után. Egy dedikált víztest 15–20 nap formafejlesztési időt ad hozzá.'
    - q: 'Mit tartalmaz az ár – és mit nem?'
      a: 'A referencia-tartományok a deszkákra vonatkoznak EXW Qingdao feltételekkel, beleértve a márkázás alkalmazását és a standard minőségellenőrzést. Irányadó jellegűek: a végső ajánlatot az Ön konfigurációjára – víztest, PVC, grafikai fedettség, csomagolás és tartozékok – vonatkozóan erősítjük meg, bármilyen kötelezettségvállalás előtt. A szállítás, a vámdíjak és a célállási vámügyi eljárások külön árajánlatot kapnak.'
    - q: 'Meg kell-e vásárolnom 100 vagy 500 deszkát ahhoz, hogy a logóm a deszkára kerüljön?'
      a: 'Nem. A kis szállítmányú közös márkázás már 5–10 darabtól elhelyezi az Ön logóját a bordán vagy az oldalsó színeken, a 20–50 deszkás próbarendelések pedig lehetővé teszik a grafika teljes alkalmazását ugyanolyan minőséggel, mint a tömeggyártásnál. A mennyiséggel az darabonkénti ár változik, nem az elérhetőség.'
    - q: 'Mi történik, ha a próba után meg akarom változtatni a kivitelt?'
      a: 'A próba és a térfogat közötti módosítások normálisak és örömmel fogadjuk őket – éppen ez a próba célja. A színváltozatokat, a grafikát, a csomagolást és a tartozékokat újrakalibráljuk az új konfigurációhoz az ár szempontjából, majd rögzítjük őket a grafika és az anyaglista aláírásával a térfogatszállítmány előtt. A szitámlás nyomtatási formadíjak elengedésre kerülnek azoknál az ismétlődő megrendeléseknél, amelyek ugyanazt a grafikai méretet használják.'
    - q: 'Aláírunk-e NDA-t, mielőtt megosztanám Önökkel a kiviteleket?'
      a: 'Igen. Titoktartási megállapodás rendelkezésre áll, mielőtt megosztanánk műszaki specifikációkat vagy bizalmas grafikát. Mi kizárólag az ügyfeleink márkái alatt gyártunk, és egyetlen piacon sem versenyzünk velük – ugyanez a politika érvényes egyetlen deszkás mintára és egy teljes konténerprogramra egyaránt.'

