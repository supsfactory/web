why_canada:
  tagline: 'Proč nakupující v Kanadě'
  title: 'Stvořeno pro import do Kanady'
  subtitle: 'Továrna odpovídá na otázky, které si kanadské značky a maloobchodníci kladou před příchodem prvního kontejneru.'
  items:
    - title: 'DDP pro předvídatelnou konečnou cenu'
      description: 'DDP zahrnuje vyclení a dopravu na Váš sklad — cla, daně a dopravu jednou konečnou částkou v CAD, nebo USD. Nejpopulárnější volba pro začínající importéry.'
    - title: 'Trasování na západní a východní pobřeží'
      description: 'Námořní dopravu kalkulujeme jak do Vancouveru, tak do Toronta a Montrealu přes trasu kolem Suezského kanálu — podle toho, co nejlépe vyváží dobu dodání a konečné náklady.'
    - title: 'Podklady pro dvojjazyčné obaly'
      description: 'Dokumentace pro CE, REACH a celní požadavky připravíme pro Vaše cílové trhy, takže Vás produktový soubor bude vhodný pro obaly v angličtině i francouzštině.'
    - title: 'Jedna továrna, jeden systém kvality'
      description: 'Vývoj, výroba vzorků, sériová výroba a QC probíhají na jednom areálu o ploše 12 500 m² — bez cestování přes zprostředkovatele a bez vzorků, které by výroba nedokázala zopakovat.'

process_notes:
  tagline: 'Jak to funguje'
  title: 'Od specifikace po kontejner'
  subtitle: 'Stejných šest fází bez ohledu na to, zda nakupujete dva kontejnery ročně, nebo dvacet: specifikace, konstrukční vývoj, vzorky, zkoušky, nástroje, výroba — následně dodání FOB, CIF, nebo DDP.'
  items:
    - title: '1. Odešlete specifikaci'
      description: 'Stačí referenční deska, náčrtek, nebo specifikace konkurence. Konstrukční prověření a obchodní nabídku vracíme do jednoho pracovního dne.'
    - title: '2. Odsouhlaste vzorek'
      description: 'Váš první fyzický vzorek odesíláme za 7–12 dnů s odsouhlasovacím listem, který zahrnuje konstrukci, barvy tisku a výsledky tlakové zkoušky.'
    - title: '3. Výroba a export'
      description: 'Dávky dokončíme za 25–35 dnů s kontrolními body QC v průběhu. Balicí list, faktura a nákladní list odešleme před odplutím lodi.'
    - title: '4. Doprava na Váš sklad'
      description: '4–6 týdnů námořní dopravy do Vancouveru, Toronta, nebo Montrealu — za podmínek DDP přebíráme vyclení a dopravu až k Vašim dveřím.'

faq_section:
  tagline: FAQ
  title: 'Dotazy k importu do Kanady'
  questions:
    - q: 'Jak dlouho trvá námořní doprava do Kanady?'
      a: 'Počítejte s 4–6 týdny od přístavu Qingdao do kanadských přístavů — Vancouver na západním pobřeží, Toronto a Montreal na východě — podle místa určení a plánu plaveb. Projekty DDP zahrnují celou dobu od dveří ke dveřím.'
    - q: 'Odesíláte DDP do Kanady?'
      a: 'Ano. DDP zahrnuje námořní dopravu, vyclení, cla a daně i dopravu na Váš sklad — jedna předvídatelná konečná cena. K dispozici jsou také FOB Qingdao a CIF.'
    - q: 'Jaké je MOQ pro import SUP pod vlastní značkou?'
      a: 'MOQ se potvrzuje podle konfigurace projektu: vývoj vzorku zahrnuje 1–2 kusy, pilotní dávky běží v objemu 20–50 kusů na stávajících platformách a standardní sériová výroba 90–100+ kusů na každý návrh z plné role drop stitch o délce 150 m.'
    - q: 'Podporujete obaly v angličtině a francouzštině?'
      a: 'Ano. Náš tiskový tým připraví tisková data v jazycích a podle pravidel Vašich cílových trhů — včetně dvojjazyčných obalů EN/FR pro kanadský trh.'
    - q: 'Mohu před objednávkou navštívit továrnu?'
      a: 'Ano. Areál o ploše 12 500 m² v Qingdao je otevřený pro klienty — virtuální prohlídku továrny lze sjednat online a osobní návštěvy probíhají s průvodcem po výrobních linkách a stanicích QC.'
    - q: 'Jak začít projekt z Kanady?'
      a: 'Odešlete referenční desku, náčrtek, nebo specifikaci. Konstrukční prověření a obchodní nabídku vracíme do jednoho pracovního dne a NDA podepíšeme před výměnou souborů.'

