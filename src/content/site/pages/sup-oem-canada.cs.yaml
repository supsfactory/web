answer:
  label: 'Přímá odpověď'
  text: 'Kanadské značky objednávají nafukovací SUP u iSupfactory za standardních podmínek: MOQ se potvrzuje podle konfigurace projektu — vzorky 1–2 kusy potvrdí konstrukci, pilotní dávky 20–50 kusy otestují trh na stávajících platformách a standardní sériová výroba běží po dávkách 90–100+ kusů na každý návrh z plné role drop stitch o délce 150 m. První vzorek odesíláme za 7–12 dnů od odsouhlasení specifikace, výroba trvá 25–35 dnů od potvrzeného PO a zálohy a námořní doprava přidává 4–6 týdnů do kanadských přístavů — Vancouver na západním pobřeží, Toronto a Montreal na východě. DDP zahrnuje vyclení i dopravu na Váš sklad.'
  verified: 'září 2026'

