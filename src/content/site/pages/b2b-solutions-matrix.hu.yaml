answer:
  label: 'Közvetlen válasz'
  text: 'Egyetlen gyár szolgálja ki az összes B2B ágat: projektenként megerősített MOQ-val végzett OEM/ODM-gyártás (minta 1–2 darab, pilótasor 20–50 darab, standard térfogat 150 m tekercsenként 90–100+ darab; közös márkától 5–10 darabtól), private label gyártás már validált platformokon, nagykereskedelmi forgalmazás, valamint flótaprogramok üdülők, klubok és iskolák számára. Minden ügyféltípushoz egy meghatározott megoldáskészlet tartozik – minták 7–12 napon belül, gyártás 25–35 nappal a megrendelés és az előleg kiállítása után.'
  verified: '2026. szeptember'

