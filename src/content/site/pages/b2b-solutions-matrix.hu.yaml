  description: 'A VATRAD teljes B2B ügyfélmegoldás-mátrixa, amely 24 ügyféltípust fogad le – a szabadidőségi startupoktól a tengeri természetvédelmi intézményekig.'
  dateModified: '2026-08'

hero:
  tagline: Megoldások B2B ügyfeleknek
  title: '24 B2B megoldás, amely illik az Ön vállalkozásához'
  subtitle: 'A startup-alapítóktól a nemzetközi forgalmazókig – találja meg azt a VATRAD-megoldást, amely pontosan az Ön üzleti modelljéhez, szektorjához és céljaihoz készült.'
