customization:
  tagline: Gebouwd volgens jouw specificatie
  title: OEM-specificatiepunten
  subtitle: 'Deze specificatiepunten beheers jij in een OEM-project — jouw specificatiedocument is het productiecontract:'
  items:
    - 'Plankafmetingen — lengte, breedte, dikte, rocker en volume volgens jouw tekeningen of referentiegebruikers'
    - 'Materiaalstructuur — aantal en kwaliteit van de PVC-lagen, drop-stitch dichtheid, versterkingen en rail-verstevigingen'
    - 'Graphics en kleuren — jouw artwork met onbeperkte paletten of ondersteuning van ons designteam'
    - 'Antislip EVA-deckpad — passend gesneden deckpads, logo''s en dekkleuren op elke plank'
    - 'Handgrepen en D-ringen — plaatsing, aantal en specificatie van het beslag voor jouw gebruik'
    - 'Vin-systemen — enkele, dubbele of drievoudige vin en fin box volgens jouw specificatie'
    - 'Peddels, pompen, leashes en accessoires — jouw pakket, jouw branding'
    - 'Commerciële en POS-verpakking — commerciële verpakkingen, zeevrachtverpakking en point-of-sale displays onder jouw merk'
    - 'Labels en conformiteitsmarkeringen — serielabels, logo''s en marktspecifieke documentatie voor jouw exportregio'

faq_section:
  tagline: FAQ
  title: Vragen over OEM-productie
  questions:
    - q: Hoe start ik een OEM-project met mijn ontwerp?
      a: 'Stuur je tekeningen, een referentieplank of een schriftelijke specificatie. Onze technische controle bevestigt de produceerbaarheid en levert binnen één werkdag een offerte — dat is onze standaardbelofte, en indien nodig ondertekenen we een NDA vóór elke bestandsuitwisseling.'
    - q: Wat is het MOQ voor OEM van opblaasbare SUP''s?
      a: 'Het MOQ wordt per project bevestigd — romp en apparatuur, kleur- en PVC-varianten, artwork, verpakking en accessoires. De productie in standaardhoeveelheden draait op 90–100 eenheden per partij (één 150 m drop-stitch rol), terwijl pilotruns vanaf 20–50 eenheden op bestaande platforms starten. De volledige berekeningslogica vind je in onze gids voor MOQ en flexibele branding.'
    - q: Wat is de typische levertijd voor een OEM-bestelling?
      a: 'De productie loopt 25–35 dagen vanaf de bevestigde bestelling en de aanbetaling. De matrijzenbouw voegt 15–20 dagen toe. Prototypesamples vertrekken doorgaans binnen 7–12 dagen.'
    - q: Kunnen jullie produceren op basis van mijn bestaande tekeningen?
      a: 'Ja. OEM bouwt rechtstreeks volgens jouw specificatie — het ontwerp is van jou. Onze ingenieurs controleren de produceerbaarheid van de tekeningen, melden conflicten vóór de matrijzenbouw of het snijden en het goedgekeurde sample wordt het productiereferentie.'
    - q: Leveren jullie samples vóór de productie?
      a: 'Ja. Vóór elke productierun wordt een fysiek sample geproduceerd en goedgekeurd — doorgaans binnen 7–12 dagen — en het dient als referentie voor alle volgende QC-controles.'
    - q: Welke certificeringen heeft de fabriek?
      a: 'ISO 9001:2015 kwaliteitsbeheer (op fabrieksniveau), BSCI sociale conformiteit (amfori-fabrieksaudit), CE-conformiteitsdocumentatie voor de configuraties die van toepassing zijn op de EU-markt (toepassingsbereik per project bevestigd), REACH (materialen) en RoHS (elektronische accessoires). Volledige conformiteitsdocumentatie wordt bij elke OEM-levering verstrekt voor jouw doelmarkten.'
    - q: Hoe wordt de kwaliteit gecontroleerd in een OEM-run?
      a: 'De productie draait onder meerlaagse kwaliteitscontrole — inkomende goederen, in-proces controles en eindtest — met een druktest van 18,0 PSI gedurende 24 uur (automatische afkeur boven 0,50 PSI drukval), een assemblagechecklist van 100 punten en ERP-partijtraceerbaarheid van 10 jaar per serienummer.'
    - q: Wat zijn jullie leveringsvoorwaarden?
      a: 'FOB Qingdao, CIF naar de belangrijkste wereldhavens of DDP voor gekwalificeerde partners. We leveren in meer dan 50 landen op de EU-, VS-, AU- en Azië-markten.'

process:
  title: 'Het OEM-proces — van specificatie tot verzonden container'
  subtitle: 'Zeven fasen, beheerd door een fabrieksteam, zodat elke stap van je eerste specificatie tot de verpakte container gedocumenteerd en op tijd blijft.'
  steps:
    - phase: '01'
      title: Specificatiecontrole en offerte
      period: 1 werkdag
      items:
        - 'Deel je tekeningen, specificatie of referentieplanken — onze ingenieurs controleren de produceerbaarheid.'
        - 'Ontvang binnen één werkdag een gedetailleerde offerte en een projectplan.'
    - phase: '02'
      title: Technische bevestiging
      period: Week 1
      items:
        - 'Hulpmiddelen, drop-stitch kwaliteit, PVC-specificaties en railconstructie worden bevestigd tegen jouw document.'
        - 'De beslissingen over matrijs of platform worden vastgesteld — indien nodig start hier de bouw van eigen matrijzen.'
    - phase: '03'
      title: Prototype en sample
      period: 7–12 dagen
      items:
        - 'Een fysiek sample wordt geproduceerd en naar jouw beoordeling gestuurd — inclusief watertest voor nieuwe vormen.'
        - 'Het sample (1–2 eenheden) valideert je specificatie vóór enige kwantiteitsverplichting.'
    - phase: '04'
      title: Test en validatie
      period: Parallel
      items:
        - 'Luchtdichtheid, drukbehoud, lassterkte, belasting- en UV-tests voor elke productielijn.'
        - 'CE-, ISO-9001-, BSCI-, REACH- en RoHS-documentatie klaargezet voor je exportmarkten.'
    - phase: '05'
      title: Goedkeuring en bevestiging
      period: Na samplegoedkeuring
      items:
        - 'Je keurt sample en artwork goed; de bestelling en de aanbetaling reserveren het productieslot.'
        - 'Een pre-productieplan bevestigt data, hoeveelheden, verpakking en laadhaven.'
    - phase: '06'
      title: Productie
      period: 25–35 dagen
      items:
        - 'Productie onder meerlaagse kwaliteitscontrole — inkomende goederen, in-proces controles en eindtest.'
        - 'Van pilotorders (20–50 eenheden) op bestaande platforms tot volledige 150 m rollen (90–100+ eenheden) in de standaard volumeproductie.'
    - phase: '07'
      title: Verpakking en verzending
      period: 1 dag + transit
      items:
        - 'Exportverpakking met serielabels van het model, daarna FOB Qingdao, CIF of DDP naar meer dan 50 landen.'
        - 'Douanedocumentatie, tracking en ondersteuning bij herdrukken zijn in elke fase inbegrepen.'

