moq_faqs:
  tagline: FAQ
  title: 'Частые вопросы о MOQ'
  items:
    - q: 'MOQ рассчитывается на заказ, на модель или на сочетание цветов?'
      a: 'MOQ может применяться к модели, сочетанию цветов, версии графики, конфигурации упаковки или ко всему заказу. Поскольку разная толщина drop-stitch (12 cm против 15 cm) и разные цвета PVC поступают с разных рулонов сырья, заказ 50 досок с разбивкой на 5 цветов создаёт 5 отдельных требований к рулонам ткани. Мы подтверждаем точный расчёт по вашей матрице SKU до расчёта цены, чтобы вы могли чётко спланировать состав заказа.'
    - q: 'Могу ли я заказать образец до серийного производства?'
      a: 'Да. Разработка образца (1–2 шт.) подтверждает жёсткость корпуса, текстуру накладки EVA, точность графики и посадку аксессуаров до запуска в массовое производство. Стоимость образца применяется и засчитывается в счёт вашего производственного заказа после подписания договора.'
    - q: 'Почему индивидуальная розничная упаковка имеет независимый MOQ?'
      a: 'Флексографские или офсетные печатные машины для коробок требуют минимальной партии наладки от 500 шт. Мы предлагаем гибридное решение по хранению упаковки: мы производим 500 коробок с индивидуальной печатью, храним излишки на нашем чистом складе и выдаём их по мере ваших запланированных отгрузок досок — так что заказ меньшего объёма досок тоже может отгружаться в полностью брендированной розничной упаковке.'
    - q: 'Почему стандартный серийный MOQ составляет 90–100 шт.?'
      a: 'Стандартный серийный MOQ следует из сырья: мастер-рулон высококачественной ткани drop-stitch 150 m даёт приблизительно 90–100 готовых досок для стандартного туристического или универсального корпуса. Работа полными рулонами исключает соединения ткани, сохраняет равномерное натяжение волокон и амортизирует 2-часовую калибровку линии сварки и ламинирования — обеспечивая минимально возможную себестоимость изделия.'
    - q: 'Снижает ли большее количество себестоимость изделия?'
      a: 'В большинстве проектов — да. Бо́льшие объёмы улучшают выход материала, распределяют фиксированные затраты на наладку производственной линии на большее число досок и снижают удельные затраты на упаковку.'
    - q: 'Взимаются ли повторно сборы за пресс-форму со-брендинга при повторных заказах?'
      a: 'Нет. Сборы за пресс-форму трафаретной печати взимаются один раз при первоначальной настройке и не взимаются при повторных заказах с тем же размером графики. Вы оплачиваете только сбор завода за обработку и печать $1.00 USD за доску.'
    - q: 'Обязывает ли меня запрос рекомендаций по MOQ к размещению заказа?'
      a: 'Нет. Запрос рекомендаций по MOQ для проекта лишь позволяет нашей инженерной команде Qingdao Vatrad Group Co., Ltd. изучить ваш технический бриф и предложить наиболее экономически выгодный путь производства. Соглашение о неразглашении (NDA) доступно до того, как вы поделитесь конфиденциальными техническими спецификациями или графикой.'

