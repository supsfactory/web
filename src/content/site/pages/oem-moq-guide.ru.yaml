moq_stages:
  tagline: Образец · Пилотная партия · Серия
  title: 'Три отдельных этапа по объёму'
  subtitle: 'Объёмы образцов, пилотных партий и серийного производства различаются. Каждый проект разносится по трём отдельным уровням, чтобы вы могли проверить решение до того, как примете на себя обязательства.'
  steps:
    - step: '01'
      title: 'Разработка образца (1–2 шт.)'
      desc: 'Физическое подтверждение жёсткости корпуса, текстуры накладки EVA, точности графики и посадки аксессуаров до любых финансовых обязательств. Стоимость образца применяется и засчитывается в счёт вашего производственного заказа после подписания договора.'
    - step: '02'
      title: 'Пилотный заказ (20–50 шт.)'
      desc: 'Коммерческое тестирование перед сезоном и проверка регионального рынка с использованием готовых платформ корпуса, складских материалов и упрощённой упаковки, чтобы свести к минимуму затраты на наладку.'
    - step: '03'
      title: 'Серийное производство (90–100+ шт.)'
      desc: 'Подтверждается после заморозки BOM, утверждения графики, фиксации индивидуальной упаковки и планирования поставок — полные рулоны ткани 150 m, индивидуальные ткани по Pantone, упаковка на заказ, объёмные скидки и сквозная прослеживаемость партий.'

