hero:
  tagline: 'Прозрачно и с учётом проекта'
  title: 'Руководство по гибкому брендингу и MOQ'
  subtitle: 'Разберитесь в физике сырьевого материала drop-stitch, определяющей объёмы производственных серий SUP, — и в том, как наша программа со-брендинга с низким порогом работает для прокатных операторов, клубов, курортов и развивающихся брендов водного спорта. Разработано и эксплуатируется Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Короткий ответ'
  text: 'MOQ — не универсальная цифра. Каждый MOQ подтверждается конфигурацией проекта: форма корпуса и оснастка, сочетания цветов и PVC, сложность графики, упаковка и состав аксессуаров. Полностью индивидуальное серийное производство выполняется партиями по 90–100 шт. со стандартного рулона ткани drop-stitch 150 m; мелкосерийный со-брендинг начинается с 5–10 шт.; и каждый проект разбит на три отдельных этапа — разработка образца (1–2 шт.), пилотный заказ (20–50 шт.) и серийное производство (90–100+ шт.). Точный расчёт по вашему набору SKU мы подтверждаем до расчёта цены — никаких расплывчатых обещаний «низкого MOQ» и никаких скрытых компромиссов.'
  verified: 'Сентябрь 2026'

moq_principle:
  tagline: Инженерная логика
  title: 'Почему стандартный серийный MOQ составляет 90–100 шт.: физика рулона сырья'
  subtitle: 'Объёмы производственных серий — не произвольные цифры, заданные отделом продаж: они определяются длиной рулонов ткани drop-stitch и физикой переналадки линии.'
  body: |
    **Базовый рулон сырья 150 метров.** Высокопрочная тканая ткань drop-stitch производится и покрывается на непрерывных мастер-рулонах. Стандартная длина промышленного рулона одной партии — 150 метров непрерывного материала.

    **Расчёт выхода (от 90 до 100 досок).** Для стандартного туристического или универсального корпуса SUP (10 ft 6 in — 11 ft 6 in) полный мастер-рулон 150 m даёт приблизительно от 90 до 100 готовых досок с веслом.

    **Политика отсутствия стыков ткани.** Полные рулоны ткани обеспечивают непрерывность конструкции — без поперечных соединений ткани высокого риска и с равномерным натяжением волокон по верхней и нижней поверхностям доски.

    **Тепловая и адгезивная калибровка.** Автоматизированные линии высокочастотной сварки горячим воздухом и ламинирования морским клеем требуют 2 часов предварительного нагрева, профилирования температуры и калибровки давления. Полная партия из 90–100 шт. амортизирует эти фиксированные затраты на наладку, обеспечивая минимально возможную себестоимость изделия.

