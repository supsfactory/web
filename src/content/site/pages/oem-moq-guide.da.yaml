hero:
  tagline: 'Transparent og projektspecifik'
  title: 'Guide til fleksibelt branding og minimumsordrestørrelser'
  subtitle: 'Forstå den fysiske logik bag råmaterialet i drop-stitch, der styrer produktionsserier af SUP — og hvordan vores lavt barrier-program for co-branding fungerer for udlejningsvirksomheder, klubber, resorter og voksende vandsportsbrands. Udviklet og drevet af Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Det korte svar'
  text: 'MOQ er ikke et tal, der passer til alle. Hver minimumsordrestørrelse bekræftes ud fra projektets konfiguration: skrogform og værktøj, farvevarianter og PVC, artworkets kompleksitet, emballage og sammensætningen af tilbehør. Specialfremstillet volumenproduktion kører 90–100 stk. pr. batch fra en standard 150 m rulle drop-stitch-dug; co-branding i små serier starter ved 5–10 stk.; og ethvert projekt opdeles i tre tydelige trin — udvikling af prøvebrætter (1–2 stk.), prøveordre (20–50 stk.) og volumenproduktion (90–100+ stk.). Vi bekræfter den præcise beregning for din kombination af varer, før der gives tilbud — ingen vage løfter om "lav MOQ" og ingen skjulte kompromiser.'
  verified: 'September 2026'

moq_principle:
  tagline: 'Den ingeniørmæssige logik'
  title: 'Hvorfor standard-MOQ for volumen er 90–100 stk.: fysikken i rådulles ruller'
  subtitle: 'Størrelsen på produktionsserier er ikke vilkårlige tal fastsat af en salgsafdeling — de bestemmes af længden på ruller drop-stitch-dug og af fysikken i omstillingen af linjen.'
  body: |
    **Udgangspunktet på 150 meter rådug.** Drop-stitch-dug i højspændingsvævet kvalitet produceres og belægges på kontinuerlige masterruller. Den industrielle standardrullelængde for et enkelt batch er 150 meter sammenhængende materiale.

    **Udbytteberegningen (90 til 100 brætter).** For et standard touring- eller allround-SUP-skrog (10 ft 6 in til 11 ft 6 in) giver en fuld 150 m masterrulle cirka 90 til 100 færdige paddleboards.

    **Politik om ingen splejsninger i duget.** Fulde dugruller sikrer sammenhængende struktur — ingen tværgående splejsninger i højrisikoområder og ensartet fiberspænding på brættets over- og underside.

    **Termisk og klæbemæssig kalibrering.** Automatiserede højfrekvente varmluftsvejsningslinjer og lamineringslinjer med marine lim kræver 2 timers forvarmning, temperaturprofilering og trykkalibrering. Et fuldt batch på 90–100 stk. fordeler disse faste omstillingsomkostninger og giver den lavest mulige enhedskost.

