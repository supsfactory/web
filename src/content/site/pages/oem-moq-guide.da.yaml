moq_faqs:
  tagline: FAQ
  title: 'Ofte stillede spørgsmål om minimumsordrestørrelse'
  items:
    - q: 'Beregnes minimumsordrestørrelsen pr. ordre, pr. model eller pr. farvevariant?'
      a: 'Minimumsordrestørrelsen kan gælde pr. model, farvevariant, artworkversion, emballagekonfiguration eller samlet ordre. Fordi forskellige drop-stitch-tykkelser (12 cm mod 15 cm) og PVC-farver kommer fra forskellige rådulruller, medfører 50 brætter fordelt på 5 farver 5 separate krav om dugruller. Vi bekræfter den præcise beregning mod din varematrix, før der gives tilbud, så du kan planlægge din kombination tydeligt.'
    - q: 'Kan jeg bestille et prøvebræt før masseproduktion?'
      a: 'Ja. Udvikling af prøvebrætter (1–2 stk.) verificerer skrogstivhed, tekstur på EVA-gripflade, grafisk nøjagtighed og tilbehørspasform, før masseproduktionen frigives. Prøvegebyrer opkræves og modregnes din produktionsordre ved underskrift af kontrakten.'
    - q: 'Hvorfor har specialfremstillet salgsemballage sin egen minimumsordre?'
      a: 'Flexografiske og offsetpresser til kartoner kræver en minimumsopsætning på 500+ stk. Vi tilbyder en hybrid løsning for emballage på lager: vi producerer de 500 specialtrykkede kartoner, opbevarer overskuddet i vores rene lager og frigiver det i takt med dine planlagte brætleverancer — så en mindre brætordre stadig kan afsendes i fuldt mærket salgsemballage.'
    - q: 'Hvorfor er standard-MOQ for volumen 90–100 stk.?'
      a: 'Standard-MOQ for volumen følger råmaterialet: en 150 m masterrulle med drop-stitch-dug i høj kvalitet giver cirka 90–100 færdige brætter til et standard touring- eller allround-skrog. Kørsel på fulde ruller eliminerer splejsninger i duget, holder fiberspændingen ensartet og fordeler de 2 timers kalibrering af svejse- og lamineringslinjen — hvilket giver den lavest mulige enhedskost.'
    - q: 'Reducerer en større mængde enhedskosten?'
      a: 'I de fleste projekter, ja. Større mængder forbedrer materialets udbytte, fordeler faste omstillingsomkostninger for produktionslinjen over flere brætter og reducerer emballageomkostningen pr. enhed.'
    - q: 'Opkræves formgebyrer for co-branding igen ved gentbestillinger?'
      a: 'Nej. Formgebyrer for silketryk opkræves en gang ved den første opsætning og frafales ved gentbestillinger, der bruger samme artworkmål. Du betaler kun håndterings- og trykgebyret på $1.00 USD pr. bræt.'
    - q: 'Forpligter en anmodning om vejledning til minimumsordre mig til en ordre?'
      a: 'Nej. En anmodning om projektspecifik vejledning til minimumsordrer giver ganske vist vores konstruktionsteam hos Qingdao Vatrad Group Co., Ltd. mulighed for at gennemgå dit tekniske brief og rådgive om den mest omkostningseffektive produktionsvej. En fortrolighedsaftale (NDA) er tilgængelig, før du deler fortrolige tekniske specifikationer eller artwork.'

