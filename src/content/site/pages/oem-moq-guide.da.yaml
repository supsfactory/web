moq_stages:
  tagline: 'Prøvebræt · pilot · volumen'
  title: 'Tre tydelige mængdetrin'
  subtitle: 'Mængderne til prøvebrætter, pilot og volumenproduktion er forskellige. Ethvert projekt inddeles i tre tydelige niveauer, så du validerer, før du binder dig.'
  steps:
    - step: '01'
      title: 'Udvikling af prøvebræt (1–2 stk.)'
      desc: 'Fysisk bekræftelse af skrogstivhed, tekstur på EVA-gripflade, grafisk nøjagtighed og tilbehørspasform, før nogen økonomisk forpligtelse. Prøvegebyrer opkræves og modregnes din produktionsordre ved underskrift af kontrakten.'
    - step: '02'
      title: 'Pilotordre (20–50 stk.)'
      desc: 'Kommerciel test før sæsonen og validering på regionale markeder med eksisterende skrogplatforme, lagerførte materialer og forenklet emballage for at minimere omstillingsbesvær.'
    - step: '03'
      title: 'Volumenproduktion (90–100+ stk.)'
      desc: 'Bekræftet efter fastlåst BOM, færdiggjort artwork, specialfremstillet emballage og planlagte leveringsbetingelser — fulde 150 m dugruller, specialfarvet Pantone-dug, skræddersygt emballage, mængderabat og spørgsmål gennem hele forsyningskæden.'

moq_factors:
  tagline: 'Hvad der driver din minimumsordre'
  title: 'Hvorfor minimumsordren ved specialfremstilling altid er projektspecifik'
  subtitle: 'Ved 100 % specialfremstilling beregnes minimumsordrestørrelsen ud fra produktets samlede arkitektur — disse fire komponenter vurderes samlet, før der Gives tilbud.'
  headers:
    component: Projektkomponent
    driver: 'Fremstillingsforudsætning'
    impact: 'Påvirkning af minimumsmængden'
  rows:
    - component: 'Skrogform & værktøj'
      driver: 'Eksisterende rockerforme i fabrikken vs. skræddersyede CAD-skæresidser og værktøj til varmpresse på EVA'
      impact: 'Eksisterende platforme: pilotordrer fra 20 stk. Skræddersyede skrog: kræver afskrivning på dedikeret værktøj.'
    - component: 'Farvevarianter & PVC'
      driver: 'Enkeltstående standardfarver på lager vs. proprietære, Pantone-farvede PVC-plader'
      impact: 'Pantone-PVC i specialfarve kræver dedikerede kemiske farvningskørsler med selvstændige minimumsmængder på råmaterialet.'
    - component: 'Mærket emballage'
      driver: 'Generiske kartoner med barcodeetiketter vs. salgsgavekasser i fuldfarve i 5 lag og mærkede manualer'
      impact: 'Specialfargede kasser har en selvstændig minimumsproduktion på offsetpressen (typisk 500+ kasser).'
    - component: 'Tilbehørspakker'
      driver: 'Standardpagajer i aluminium eller nylon vs. specialtilpassede carbonpagajer og mærkede pumper'
      impact: 'Fuldt mærkede tilbehør følger underleverantørernes produktionsbatches på lavere niveau.'

