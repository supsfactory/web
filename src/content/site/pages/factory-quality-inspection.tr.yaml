rework_intro:
  tagline: Yeniden İşleme Yönetişimi
  title: 'Kontrollü Hava Sızdırmazlığı Uyumsuzluğu ve Yeniden İşleme Yönetişimi'
  body: |
    QINGDAO VATRAD GROUP.,LTD.’de yeniden işleme, uyumsuz bir birimi özgün mühendislik şartnamesine tam uyum haline getirmek olarak tanımlanır — hızlı bir onarım olarak değil. Hava sızdırmazlığı uyumsuzluğu tespit edilen her tahta, işlenmeden önce kontrollü beklemeye alınır ve bir Uyumsuzluk Raporuna (NCR) bağlanır; sızıntı kaynağı onaylı tanı yöntemiyle bulunur ve kaydedilir.

    Yeniden işleme yalnızca kusur onaylı yeniden işleme kapsamı içindeyse ve yetkili bir yöntem mevcutsa ilerleyebilir. Yeniden işleme talimatı; ürünü, partiyi, kusur konumunu, onaylı malzemeyi, yöntemi, gereken koşulları ve yeniden denetim kapsamını belirtir. Gerekli kürleme veya kararlılık süresi sonrasında tahta, uygun bir tahtayla aynı geçerli kabul kriterlerine karşı yeniden denetlenir — yeniden işleme kabul standardını asla düşürmez. Yeniden denetim başarısızlığı, yeni mühendislik ve kalite kararı gerektirir; belgelenmiş onay olmadan tekrarlayan yeniden işlemeye izin verilmez.

rework_decision:
  tagline: Etkileşimli Akış
  title: 'Yeniden İşleme Karar Akışı — Her Düğüme Tıklayın'
  subtitle: 'Bir hava sızdırmazlığı uyumsuzluğunun tespitten sevkiyata veya hurdaya nasıl ele alındığını izleyin. Bir düğüme tıklayarak o adımdaki kontrol gereksinimlerini genişletin.'
  nodes:
    - id: detect
      type: start
      label: 'Sızıntı Tespit Edildi'
      detail: 'Denetim sırasında bir hava sızdırmazlığı uyumsuzluğu tanımlanır — basınç tutma başarısızlığı, görünür sızıntı veya ilgili bir hava sistemi kusuru.'
    - id: hold
      type: step
      label: 'Hattı Durdur · HOLD Etiketi · NCR'
      detail: 'İşleme durur. Tahta kimliği, ürün kodu, parti, çalışma istasyonu, tarih ve denetçi kaydedilir; HOLD / QUARANTINE etiketi asılır ve geçerli şartname revizyonuna karşı NCR açılır.'
    - id: locate
      type: step
      label: 'Sızıntı Kaynağını Bul'
      detail: 'Tahta, projede onaylanan tanı basıncına şişirilir ve kaynak onaylı bir yöntemle bulunur — basınç tutma, kalibre kabarcık testi, akustik veya sızıntı tespit ekipmanı.'
    - id: classify
      type: step
      label: 'Kusuru Sınıflandır (A–G)'
      detail: 'Kusur onay matrisine göre sınıflandırılır: A supap arayüzü, B supap tabanı dikişi, C yüzey deliği, D yerel ray dikişi, E geniş ray arızası, F tekrarlayan sızıntı, G yapısal hasar.'
    - id: authorize
      type: decision
      label: 'Yeniden İşleme Onaylı mı?'
      yes: rework
      no: escalate
      detail: 'QC kusur kategorisini teyit eder ve Mühendislik, tahtanın özgün şartnamesine geri döndürülüp döndürülemeyeceğini inceler. Yetkilendirme; yöntem kartını, malzemeleri, koşulları ve yeniden denetim kapsamını kaydeder — ya da değiştirme, ret, hurda veya müşteri feragati rotasına yönlendirir.'
    - id: rework
      type: step
      label: 'Kontrollü Yeniden İşleme'
      detail: 'Yalnızca onaylı kusur sınırı içinde, onaylı yöntem kartı, malzeme partisi ve aparatla yürütülür — ölçüler, yapı, grafikler, aksesuarlar veya ambalajlama gereksinimleri asla değiştirilmez.'
    - id: cure
      type: step
      label: 'Kürleme ve Kararlılık'
      detail: 'Tahta, onaylı malzeme ve süreç talimatının tanımladığı kürleme ve kararlılık süresi boyunca HOLD durumunda kalır, ardından görsel ve işçilik ön kontrolünden geçirilir.'
    - id: reinspect
      type: decision
      label: 'Yeniden Denetim Geçti mi?'
      yes: release
      no: escalate
      detail: 'Tahta, projede onaylanan yeniden denetim basıncına şişirilir ve özgün başarısızlık ile potansiyel olarak etkilenebilecek tüm özellikler yeniden doğrulanır — sızıntı konumu, supap, raylar, dikişler, yüksek gerilim bölgeleri, aksesuarlar ve görünüm. Yeniden işleme kabul standardını asla düşürmez.'
    - id: release
      type: release
      label: 'Kalite Onayı'
      detail: 'Kalite, kapatılmış NCR’yi, yeniden işleme kaydını ve yeniden denetim sonucunu gözden geçirir ve sevkiyatı onaylar. Yeniden işlenmiş hiçbir tahta, yetkili kalite onayı olmadan ambalajlanmaz veya sevk edilmez.'
    - id: escalate
      type: escalate
      label: 'Yükseltin — Değiştir / Hurda / Feragat'
      detail: 'Belgelenmiş onay olmadan tekrarlayan yeniden işleme yoktur. Özgün şartname geri kazanılamıyorsa tahta değiştirme, ret, hurda veya yazılı müşteri feragati rotasına yönlendirilir.'

defect_matrix:
  tagline: Kusur Sınıflandırması
  title: 'Hava Sızdırmazlığı Kusur Sınıflandırması ve Onay Matrisi'
