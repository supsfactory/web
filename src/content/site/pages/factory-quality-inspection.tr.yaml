answer:
  label: 'Net cevap'
  text: 'QINGDAO VATRAD GROUP.,LTD., şişirilebilir SUP kalitesini 4 aşamalı bir doğrulama sistemiyle kontrol eder: giriş malzemesi kontrolü (IQC), süreç içi kalite kontrolü (IPQC), nihai tahta testi ve şişirme doğrulaması (FQC) ve ambalajlama ile sevk öncesi onay (OQC). Her sipariş onaylanan numune, teknik şartname, görsel sanat kanıtı, BOM ve ambalajlama standartlarına karşı denetlenir; hava sızdırmazlığı doğrulaması, görsel ve ölçü kontrolleri, aksesuar teyidi ve parti izlenebilirliği uygulanır. Kabul kriterlerini karşılamayan kalemler kontrollü bekleme veya karantinaya alınır, yalnızca onaylı talimatlarla yeniden işlenir ve yetkili onaydan önce yeniden denetlenir.'
  verified: 'Eylül 2026'

intro: 'Kalite sistemimiz OEM/ODM projeleri için kurulmuştur: denetim kriterleri sipariş bazında tanımlanır, belgelenir ve üretim ile kalite ekipleri tarafından giriş malzemesinden ambalajlamaya kadar uygulanır. Bu, kalite beklentilerinin fabrika ile sizin markanız arasında ilk numuneden tam konteyner sevkiyatlarına kadar hizalı kalmasını sağlar.'

scope_note:
  tagline: Kapsam
  title: Proje Özelinde Denetim Kriterleri
  body: |
    Kalite şartnameleri; tahta yapısına (örneğin tek/çift katman, örgülü drop-stitch, füzyon ray), amaçlanan son kullanıma, hedef pazar mevzuatına ve müşteri tarafından onaylanan parametrelere göre değişebilir. Nihai sevkiyat onayı, yalnızca sipariş için üzerinde anlaşılan belgelenmiş denetim kriterlerine dayanarak verilir.

stages:
  tagline: Kalite Çerçevesi
  title: 4 Aşamalı Kalite Doğrulama Sistemimiz
  subtitle: Ham Maddenin gelişinden sevkiyat onayına kadar eksiksiz bir QC döngüsü.
  steps:
    - title: '1. Giriş Malzemesi Kontrolü (IQC)'
      desc: 'Ana malzemeler ve satın alınan bileşenler, üretim hattına girmeden önce onaylanan şartnamelere ve referans numunelere karşı kontrol edilir. Drop-stitch ve PVC’de malzeme tanımı, tedarikçi partisi, gramaj/yoğunluk, kalınlık, onaylı numune renkleriyle renk uyumu ve yüzey kusurları doğrulanır. EVA kaymaz pedlerde desen, renk, kalınlık, kesim hassasiyeti ve yapıştırıcı uyumluluğu kontrol edilir. Supaplar ve donanımda işlev, diş, conta bütünlüğü ve uyum testleri uygulanır. Aksesuar ve ambalaj (pompa, kürek, fin, güvenlik ipi, çanta, koli) adet, renk, markalama, barkod doğruluğu ve görsel sanat sürümü açısından onaylı BOM’a karşı eşleştirilir.'
    - title: '2. Süreç İçi Kalite Kontrolü (IPQC)'
      desc: 'Kritik imalat adımları, tahtalar sonraki çalışma istasyonlarına geçmeden önce uyumsuzlukları yakalamak için denetlenir. Kesim ve baskıda panel ölçüleri, görsel sanat yerleşimi, ayna yönelimi ve kenar temizliği onaylı teknik çizimlere karşı doğrulanır. Tahta montajı ve ray yapıştırmada kontur simetrisi, dikiş bindirmelerinin sürekliliği ve yüksek gerilim bölgelerindeki boşluk veya hava ceplerinin giderilmesi kontrol edilir. Supap ve aksesuar takımı, grafik ve markalamada konum, yönelim, yapıştırıcı kapsaması, logo yazımı ve görsel sanat sürümü doğrulanır.'
    - title: '3. Nihai Tahta Testi ve Şişirme Doğrulaması (FQC)'
      desc: 'Tamamlanan tahtalar, ambalajlama onayından önce zorunlu fiziksel ve yapısal testlere tabi tutulur. Tahtalar projede onaylanan denetim basıncına şişirilir ve yapısal rijitlik ile basınç kararlılığı doğrulanmak üzere tutulur. Hava sızdırmazlığı taramaları; supap muhafazası, ray dikişleri, burun/kuyruk konileri ve gerilim ekleri kalibre sızıntı tespit yöntemleriyle (basınç düşümü izleme veya kabarcık testi) kapsar. Kozmetik ve ölçü denetimi; gün ışığı standardı aydınlatma altında ölçüleri, rocker profilini ve EVA ped hizasını (tolerans ±2 mm) doğrular.'
    - title: '4. Ambalajlama ve Sevk Öncesi Onay (OQC)'
      desc: 'Kapsamlı sevk öncesi doğrulama, SKU yapılandırması veya sevkiyat işaretlerinde sıfır uyuşmazlık sağlar. Kit tamlığı; tahta, fin, güvenlik ipi, kürek, pompa, çanta, onarım kiti ve kullanım kılavuzu sipariş BOM’una karşı çapraz kontrol edilir. Ambalajlama ve barkod kontrollerinde koli işaretleri, SKU etiketleri, barkod okunabilirliği, kılavuz dili ve koli yapısal bütünlüğü doğrulanır. Siparişler, ancak nihai ambalajlama denetimi yetkili kalite personeli tarafından imzalandıktan sonra sevk edilir.'

inspection_points:
  tagline: Denetim Kapsamı
  title: Anahtar Denetim Kontrol Noktaları
  subtitle: Her kontrol noktası, sipariş başına üzerinde anlaşılan belgelenmiş kabul kriterlerine göre yürütülür.
  features:
    - icon: A
      icon_bg: blue
      title: 'Hava Sızdırmazlığı Doğrulaması'
      desc: 'Tamamlanan tahtalar onaylanan denetim basıncına şişirilir; basınç tutma, supap tabanı durumu, ray dikişleri, burun ve kuyruk bölgeleri ve yüksek gerilim noktaları kontrol edilir. Denetim prosedürünün gerektirdiği durumlarda şüpheli sızıntı bölgeleri onaylı sızıntı tespit yöntemleriyle incelenir.'
    - icon: B
      icon_bg: green
      title: 'Görsel ve Ölçü Denetimi'
      desc: 'Tahtalar uygun aydınlatma altında; malzeme yüzey durumu, baskı kusurları, renk sapması, EVA hizası, kıvrımlar, çizikler, kirlilik ve yapıştırma görünümü açısından denetlenir. Ana ölçüler ve aksesuar konumları onaylı çizim veya şartnamelere karşı doğrulanır.'
    - icon: C
      icon_bg: purple
      title: 'Aksesuar ve Ambalaj Doğrulaması'
      desc: 'Sevkiyat öncesi eksiksiz ürün yapılandırması doğrulanır: tahta modeli, fin sistemi, kürek, pompa, güvenlik ipi, taşıma çantası, onarım kiti, kullanım kılavuzu ve müşteriye özel aksesuarlar — her biri onaylı numune, çizim ve BOM’a karşı eşleştirilir.'
    - icon: D
      icon_bg: orange
      title: 'Ambalajlama ve Sevkiyat Onayı'
      desc: 'Ambalajlı birimler SKU yapılandırması, aksesuar tamlığı, ürün etiketleri, barkod bilgileri, talimat kılavuzu sürümü, koli işaretlemesi, ambalaj adedi ve koli durumu açısından kontrol edilir. Tüm denetim ve ambalajlama gereksinimleri tamamlandıktan sonra sevkiyat onayı yetkilendirilir.'

traceability_intro:
  tagline: Parti İzlenebilirliği
  title: Proje Düzeyinde ve Parti Bazında İzlenebilirlik Sistemi
  body: |
    Her özel SUP siparişi, teknik şartnameleri, onaylı BOM’u, görsel sanat revizyonlarını, malzeme lot numaralarını, ambalajlama referanslarını ve denetim kayıtlarını birbirine bağlayan birleşik bir proje kodu altında yönetilir. Üretim ve denetim kayıtları ilgili proje ve üretim partisi bazında tutulur; her parti, onaylı ürün şartnamesine, BOM’a, görsel sanata ve ambalajlama referanslarına geri bağlanabilir.

    Bu, bir kalite endişesi belirlendiğinde ürün yapılandırmasının, denetim durumunun ve etkilenen kapsamın tahta veya koli tanımlaması kullanılarak kaynak kayıtlarına kadar geriye dönük verimli biçimde incelenmesini sağlar.

traceability_chain:
  tagline: İzlenebilirlik Zinciri
  title: Proje Kodundan Sevkiyat Onayına
  subtitle: Sipariş teyidinden yetkili sevkiyata kadar kontrollü referansların tek zinciri.
  steps:
    - step: '01'
      title: Proje Kodu
      desc: Her kontrollü belgeyi siparişe bağlayan birleşik proje referansı.
    - step: '02'
      title: Belge Revizyonları
      desc: Güncel şartname, BOM, görsel sanat ve ambalajlama revizyon seviyeleri — üretim için yalnızca onaylı sürümler geçerlidir.
    - step: '03'
      title: Parti ve Malzemeler
      desc: Malzeme ve bileşen lotlarının üretim partisine karşı kaydı.
    - step: '04'
      title: Denetim Kayıtları
      desc: Parti başına IQC, süreç içi, hava sızdırmazlığı, nihai ve ambalajlama denetim sonuçları.
    - step: '05'
      title: Ambalajlama ve Onay
      desc: Ambalajlama partisi, NCR kapatma durumu ve yetkili sevkiyat onayı özeti.

traceability_sample:
  tagline: Anonimleştirilmiş Örnek
  title: İzlenebilirlik Kontrol Kaydı (Demo)
  body: |
    Yalnızca gösterim amaçlı örnek değerler sunulmaktadır — gizliliği korumak için müşteri adları, PO numaraları, özel görsel sanatlar, tedarikçi verileri ve ticari bilgiler kaldırılmıştır.

