quarantine_intro:
  tagline: Uyumsuzluk Kontrolü
  title: Uyumsuz Ürünlerin Kontrolü ve Karantina
  body: |
    Tanımlı kabul kriterlerini karşılamayan ürün veya bileşenler açıkça tanımlanır ve kontrollü bekleme veya karantina durumuna alınır. Yetkili bir karar tamamlanana kadar sonraki üretim aşamasına, ambalajlamaya veya sevkiyata ilerleyemezler. Yeniden işleme onaylı talimatlar altında gerçekleştirilir ve ilgili uyumsuzluk kaydına bağlanır; yeniden işlenen kalemler, kalite onayından önce geçerli proje gereksinimlerine karşı yeniden denetlenir.

quarantine_flow:
  tagline: 7 Adımlı Kontrol Akışı
  title: 'Bir Uyumsuzluk Bulunduğunda Ne Olur'
  subtitle: Tanımla, kontrol et, düzelt, doğrula — ardından sevk et veya reddet. Uyumsuz ürün asla denetim yapılmadan üretime veya ambalajlamaya geri dönmez.
  steps:
    - step: '01'
      title: Tanımlama
      desc: Uyumsuzluk; etkilenen ürün, SKU, parti veya süreç aşamasına karşı kaydedilir.
    - step: '02'
      title: Etiketleme
      desc: Etkilenen kalemler kontrollü durum etiketleriyle açıkça tanımlanır — HOLD, QUARANTINE veya REJECTED.
    - step: '03'
      title: Karantina
      desc: Kalemler, istenmeyen kullanım veya sevkiyatı önlemek üzere fiziksel olarak kontrollü bir karantina alanında ayrılır veya sistem üzerinden kontrol edilir.
    - step: '04'
      title: Kapsamı Değerlendirme
      desc: Etkilenen kapsam; parti, süreç aşaması, malzeme lotu ve belge revizyonu bazında gözden geçirilir.
    - step: '05'
      title: 'Yeniden İşleme / Değiştirme'
      desc: Düzeltme yalnızca onaylı bir karar ve kontrollü iş talimatıyla yapılabilir.
    - step: '06'
      title: Yeniden Denetim
      desc: Düzeltilen kalemler, sevkiyat öncesinde geçerli kabul kriterlerine karşı yeniden denetlenir.
    - step: '07'
      title: Sevkiyat veya Ret
      desc: Yalnızca yetkili ve uygun ürün ambalajlamaya veya sevkiyat onayına ilerler.

