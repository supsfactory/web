rework_flow:
  tagline: 7 Adımlı Kapalı Döngü
  title: 'Kontrollü Yeniden İşleme İş Akışı — Tespitten Sevkiyata veya Hurdaya'
  subtitle: 'Her hava sızdırmazlığı yeniden işlemesi aynı kontrollü döngüyü izler: tespit et, karantinaya al, tanıla, yetkilendir, yeniden işle, yeniden denetle, sevk et.'
  steps:
    - step: '01'
      title: 'Tespit, Hattı Durdurma ve Karantina'
      desc: 'Etkilenen tahtada işleme derhal durur. Tahta kimliği, ürün kodu, parti, çalışma istasyonu, tarih ve denetçi kaydedilir, HOLD / QUARANTINE etiketi asılır ve geçerli şartname revizyonuna karşı NCR açılır.'
    - step: '02'
      title: 'Sistematik Sızıntı Tanısı'
      desc: 'Tahta, projede onaylanan tanı basıncına şişirilir ve sızıntı kaynağı onaylı bir yöntemle bulunur — basınç tutma, kalibre kabarcık testi, akustik veya sızıntı tespit ekipmanı. Şüpheli konum, tahtaya zarar vermeden işaretlenir.'
    - step: '03'
      title: 'Mühendislik Kararı ve Yetkilendirme'
      desc: 'QC kusur kategorisini teyit eder ve Mühendislik, tahtanın özgün şartnamesine geri döndürülüp döndürülemeyeceğini inceler. NCR’yi referans alan yeniden işleme yetkilendirmesi; onaylı yöntemi, malzemeleri, koşulları ve yeniden denetim kapsamını kaydeder — ya da değiştirme, ret, hurda veya müşteri feragatini atar.'
    - step: '04'
      title: 'Kontrollü Yeniden İşleme Uygulaması'
      desc: 'Yeniden işleme yalnızca onaylı kusur sınırı içinde, onaylı yöntem kartı, malzeme partisi ve aparatla yürütülür. Tahta ölçüleri, yapısı, grafikleri, aksesuar yapılandırması ve ambalajlama gereksinimleri asla değiştirilmez.'
    - step: '05'
      title: 'Kürleme, Kararlılık ve Ön Kontrol'
      desc: 'Yeniden işlenen tahta, onaylı malzeme ve süreç talimatının tanımladığı kürleme ve kararlılık süresi boyunca HOLD durumunda kalır, ardından yeniden denetim öncesi görsel ve işçilik ön kontrolünden geçirilir.'
    - step: '06'
      title: 'Yeniden Denetim ve Kanıt Testi'
      desc: 'Tahta, projede onaylanan yeniden denetim basıncına şişirilir ve özgün başarısızlık ile potansiyel olarak etkilenebilecek tüm özellikler yeniden doğrulanır: sızıntı konumu ve çevresi, supap, raylar, dikişler, yüksek gerilim bölgeleri, aksesuarlar ve görünüm. Yeniden işleme kabul standardını asla düşürmez.'
    - step: '07'
      title: 'QA Onayı veya Nihai Karar'
      desc: 'Kalite, tamamlanan NCR’yi, yeniden işleme kaydını ve yeniden denetim sonucunu gözden geçirir, ardından sevkiyatı onaylar — ya da değiştirme, ret, hurda veya müşteri feragati rotasına yükseltir. Yeniden işlenmiş hiçbir tahta, yetkili kalite onayı olmadan ambalajlanmaz veya sevk edilmez.'

quality_safeguards:
  tagline: Kalite Güvenceleri
  title: 'Markanızı Koruyan Hata Önleme Kuralları'
  subtitle: 'Kontrolsüz onarım döngülerini önleyen sert kontroller — kusur başına tek belgelenmiş yeniden işleme, parti düzeyinde alarm eşikleri, kalibre ölçüm gereçleri ve kontrollü test koşulları.'
  features:
    - icon: 1
      icon_bg: blue
      title: 'Kusur Başına Tek Yeniden İşleme'
      desc: 'Tek bir konum, yetkili bir talimat altında bir kez yeniden işlenebilir. Yeniden denetim yine başarısız olursa tahta değiştirme, ret, hurda veya müşteri feragati için yükseltilir — belgelenmiş onay olmadan tekrarlayan yeniden işlemeye izin verilmez.'
    - icon: 2
      icon_bg: green
      title: 'Parti Alarmı ve Hat Durdurma'
      desc: 'Bir üretim partisindeki uyumsuzluk mühendislik tarafından belirlenen eşiği aştığında, hat durdurulur ve üretim devam etmeden önce neden — malzeme lotu, süreç koşulları ve kayıtlar — Mühendislik tarafından incelenir.'
    - icon: 3
      icon_bg: purple
      title: 'Kalibre Ölçüm Gereçleri'
      desc: 'Hava sızdırmazlığı testinde kullanılan basınç göstergeleri, dijital manometreler ve zamanlayıcılar, geçerlilik süreleri içinde kontrollü tutulur ve üçüncü taraf laboratuvarlarınca kalibre edilir; kalibrasyon durumu denetim alanında görünürdür.'
    - icon: 4
      icon_bg: orange
      title: 'Kontrollü Test Koşulları'
      desc: 'Hava sızdırmazlığı testi ve kürleme alanları, sonuçların gece gündüz sıcaklık dalgalanmalarından etkilenmemesi için kontrollü bir ortamda tutulur.'

rework_boundaries:
  tagline: 'Kapsam ve Sınırlar'
  title: 'Bu Sistemin Kapsamadıkları'
  body: |
    Yeniden işleme kontrol sistemi, sevkiyat onayından önce hava kaçağı, basınç tutma başarısızlığı veya ilgili hava sistemi kusurları tespit edilen tamamlanmış veya süreç içi şişirilebilir SUP tahtalarına uygulanır. Onaylanan yapıda, malzemede, grafikte, ürün yapılandırmasında veya müşteri gereksinimlerinde değişikliklere izin vermez ve şunları kapsamaz:

    - Zaten sevk edilmiş veya müşteri kanallarındaki ürünler.
    - Mühendislik tarafından değerlendirilmemiş yapısal hasar veya tahta deformasyonu.
    - Yaygın ray veya dikiş arızası, çekirdek malzeme hasarı ya da güvenliği etkileyebilecek kusurlar.
    - Yeniden işlemeye izin verilmeyen projeler: müşteri tarafından onaylanan numuneler, sertifikasyon veya test birimleri.
    - Özel müşteri süreçleri, özel malzemeleri veya özel onarım gereksinimleri olan projeler.
    - Yer tespit edilemeyen tekrarlayan sızıntılar veya yeniden işlemeden sonra yeniden başarısız olan tahtalar.

    Müşteri şartnamelerinden her türlü sapma, belgelenmiş mühendislik incelemesi ve uygun olduğunda yazılı müşteri onayı gerektirir. Özgün şartnamesine geri döndürülemeyen tahtalar yalnızca açık bir müşteri feragatiyle sevk edilir — asla yalnızca üretim kararıyla.

method_cards:
  tagline: Yöntem Kartı Sistemi
  title: Kontrollü Yeniden İşleme Yöntem Kartı İndeksi
  subtitle: 'Genel talimat süreci kontrol eder; yöntem kartları operasyonu kontrol eder. Yeniden işleme talimatı (WI-QC-AT-001), MC-RW-01 ile MC-RW-06 yöntem kartlarına ve zorunlu hurda ve ret için MC-RW-00’a atıf yapar.'
  headers:
    code: Yöntem Kartı
    defect: Kusur Sınıfı
    scope: Uygulama Kapsamı
    controls: Anahtar Mühendislik Kontrolleri
    approval: İmza Yetkisi
  rows:
    - code: MC-RW-01
      defect: Sınıf A (Supap Arayüzü)
      scope: 'Supap çekirdeği bakımı, conta temizliği ve yeniden montaj'
      controls: 'Kalibre tork anahtarı, temiz conta yuvası, supap dişlerinde hasar olmaması'
      approval: 'QC Denetçisi'
    - code: MC-RW-02
      defect: Sınıf B (Supap Çevresi)
      scope: 'Supap tabanı flanş sızdırmazlığı ve kontrollü kelepçeleme'
      controls: 'Kontrollü yüzey hazırlığı, onaylı yapıştırma malzemesi, dairesel basınç fikstürü'
      approval: 'QC + Mühendislik'
    - code: MC-RW-03
      defect: Sınıf C (Yüzey Mikro Sızıntı)
      scope: 'Yapısal olmayan delik sızdırmazlığı'
      controls: 'İki bileşenli onaylı yapıştırıcı, grafiklere veya EVA’ya yapıştırıcı akıntısı olmaması'
      approval: 'QC + Mühendislik'
    - code: MC-RW-04
      defect: Sınıf D (Yerel Ray Dikişi)
      scope: 'Yerel ray bindirme dikişinin yeniden yapıştırılması'
      controls: 'Sıcaklık kontrollü ısı aktivasyonu, basınç merdanesi, kıvrılma önleyici fikstür'
      approval: 'Mühendislik + QA Müdürü'
    - code: MC-RW-05
      defect: Sınıf B/C (Aksesuar Çevresi)
      scope: 'Fin kutusu yaması ve aksesuar montaj tabanı sızdırmazlığı'
      controls: 'Yüzey yapışma destekleyicisi, profilli kelepçe bloğu, tanımlı tutma süresi'
      approval: 'QC + Mühendislik'
    - code: MC-RW-06
      defect: Sınıf D (Burun/Kuyruk Dikişi)
      scope: 'Yüksek gerilimli eğri dikiş müdahalesi'
      controls: 'Yüksek kayma dayanımlı onaylı yapıştırma malzemesi, yeniden testten önce uzatılmış kürleme süresi'
      approval: 'Baş Mühendis'
    - code: MC-RW-00
      defect: Sınıf E/F/G (Kritik / Kopma)
      scope: 'Zorunlu hurda ve fiziksel imha'
      controls: 'Karışmayı önlemek için fiziksel kesme, hurda kaydı, fonksiyonlar arası kök neden incelemesi'
      approval: 'Fabrika Müdürü'

inspector_friendly:
  tagline: Üçüncü Taraf Denetimi
  title: 'Denetçi Dostu Protokol'
  body: |
    Kalibre basınç göstergeleri, dikiş ve grafik kontrolleri için standart ışık masaları ve önceden doldurulmuş Denetim Özetleri içeren, ayrılmış bir denetim alanı sunuyoruz; böylece üçüncü taraf kuruluşlar (SGS, BV, Intertek, QIMA) sevk öncesi denetimi verimli biçimde tamamlayabilir — denetim maliyetinizden tasarruf edersiniz.

    Her özet; PO için geçerli belge revizyonlarını, onaylı numune referansını, kalite kritik kontrolleri, üzerinde anlaşılan örnekleme seviyesini, işlevsel testleri ve ambalajlama ile barkod gereksinimlerini özetler. Belirtilen adet, kalite, ambalajlama ve temel güvenlik kalemleri onaylı proje referanslarına karşı doğrulanır — saha üzerinde son anda belge aramaya gerek kalmaz.

