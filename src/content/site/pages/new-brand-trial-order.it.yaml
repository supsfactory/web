hero:
  tagline: 'Per marchi di SUP nuovi e in crescita'
  title: 'Lancia un marchio di SUP con un ordine di prova a MOQ basso'
  subtitle: 'Non ti serve un container per lanciare un marchio di SUP. Valida la tua tavola, la tua grafica e il tuo mercato con un singolo campione e testa le vendite con un ordine di prova di 20–50 tavole — prima di impegnarti su volumi di produzione interi. Branding, controllo qualità e logistica export sono gestiti dalla Qingdao Vatrad Group Co., Ltd.'
  actions:
    - variant: primary
