moq_faqs:
  tagline: FAQ
  title: 'Vanliga frågor om MOQ'
  items:
    - q: 'Beräknas MOQ per order, per modell eller per färgvariant?'
      a: 'MOQ kan gälla per modell, färgvariant, artworkversion, förpackningskonfiguration eller total order. Eftersom olika drop-stitch-tjocklekar (12 cm mot 15 cm) och PVC-färger kommer från separata råmaterialrullar kräver en order på 50 brädor fördelade på 5 färger 5 separata tygrullar. Vi bekräftar den exakta beräkningen mot er SKU-matris före offerten, så att ni kan planera er mix.'
    - q: 'Kan jag beställa ett prov före massproduktionen?'
      a: 'Ja. Provutvecklingen (1–2 enheter) kontrollerar skalpens styvhet, det halksäkra EVA-deckpadets vidhäftning, grafikens precision och tillbehörens passform före godkännandet för massproduktion. Provpriserna gäller och räknas av mot produktionsbeställningen efter undertecknad kontrakt.'
    - q: 'Varför har anpassad kommersiell förpackning en egen MOQ?'
      a: 'Anpassade flexo- eller offsetpressar för kartongerna kräver en minsta inställningsvolym på 500+ enheter. Vi erbjuder en hybridlösning med förpackningslager: vi tillverkar de 500 anpassade tryckta kartongerna, lagrar överskottet i vårt rena lager och levererar ut det enligt dina planerade brädleveranser — så även en mindre brädorder kan skickas helt märkt i kommersiell kartongförpackning.'
    - q: 'Varför är standard-MOQ 90–100 enheter?'
      a: 'Standard-MOQ följer råmaterialet: en moderull på 150 m drop-stitch-tyg med hög hållfasthet ger cirka 90–100 färdiga brädor för en standard Touring- eller Allround-skalp. Hela rullar eliminerar tygfogar, håller fibrspänningen jämn och absorberar svets- och laminatlinjernas 2-timmars kalibrering — till lägst möjliga kostnad per enhet.'
    - q: 'Sänker en större mängd priset per enhet?'
      a: 'I de flesta projekt, ja. Större mängder förbättrar materialavkastningen, sprider produktionslinjernas fasta inställningskostnader över fler brädor och sänker förpackningskostnaden per enhet.'
    - q: 'Kommer co-brandingens formkostnader tillbaka vid återtryck?'
      a: 'Nej. Formkostnaderna för silkeskärmstryck debiteras en gång vid den första konfigurationen och faller bort vid återtryck med samma artworkformat. Du betalar endast fabrikens bearbetnings- och tryckavgift på $1.00 USD per bräda.'
    - q: 'Binder en MOQ-rådgivningsförfrågan mig till en beställning?'
      a: 'Nej. En projektrelaterad MOQ-rådgivningsförfrågan ger Qingdao Vatrad Group Co., Ltd:s tekniska team enbart möjlighet att bedöma din tekniska briefing och rådgöra om det mest ekonomiska produktionsspåret. En sekretessessavtal (NDA) finns tillgängligt innan ni delar egna tekniska specifikationer eller artwork.'

