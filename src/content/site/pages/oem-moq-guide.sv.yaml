moq_stages:
  tagline: 'Prov · Pilot · Volym'
  title: 'Tre tydligt åtskilda kvantitetsnivåer'
  subtitle: 'Produktionsmängderna för prov, pilot och volym skiljer sig åt. Varje projekt delas in i tre separata faser, så att du kan validera innan du binder dig.'
  steps:
    - step: '01'
      title: 'Provutveckling (1–2 enheter)'
      desc: 'Fysisk bekräftelse av skalpens styvhet, det halksäkra EVA-deckpadets vidhäftning, grafikens precision och tillbehörens passform före någon finansiell förpliktelse. Provpriserna gäller och räknas av mot produktionsbeställningen efter undertecknad kontrakt.'
    - step: '02'
      title: 'Pilotorder (20–50 enheter)'
      desc: 'Kommersiella tester före säsong och regional marknadsvalidering med befintliga skalpplattformar, standardmaterial och förenklad förpackning, för att minimera inställningsarbetet.'
    - step: '03'
      title: 'Volymproduktion (90–100+ enheter)'
      desc: 'Bekräftas efter fryst BOM, färdig artwork, anpassad förpackning och planerade leveransdatum — hela rullar på 150 m, anpassade Pantone-tyger, skräddarsydd förpackning, volymrabatt och fullständig partispårbarhet genom hela leveranskedjan.'

moq_factors:
  tagline: Vad som avgör din MOQ
  title: 'Varför den helt anpassade MOQ alltid är projektspecifik'
  subtitle: 'För 100 % skräddarsydd produktion beräknas MOQ ur hela produktionsarkitekturen — dessa fyra komponenter bedöms tillsammans före offerten.'
  headers:
    component: Projektkomponent
    driver: Produktionsdrivande faktor
    impact: Påverkan på minsta mängd
  rows:
    - component: 'Skalpform och utrustning'
      driver: 'Befintliga fabrikens rocker-former vs. anpassad CAD-skärverktyg och EVA-varmpressutrustning'
      impact: 'Befintliga plattformar: pilotorder från 20 stycken. Egna skalper: avskrivning av egen utrustning krävs.'
    - component: 'Färg- och PVC-varianter'
      driver: 'Standardlagretiketter vs. egna Pantonefärgade PVC-blad'
      impact: 'Anpassat Pantone-PVC kräver egna kemiska färgserier med egna minimimängder av råmaterial.'
    - component: 'Förpackning med varumärkessättning'
      driver: 'Standardkartonger med streckkodsetiketter vs. kommersiella 5-lagers färgkartonger och märkta bruksanvisningar'
      impact: 'Anpassade färgkartonger har ett eget minimivolym för offsettryck (vanligtvis 500+ kartonger).'
    - component: 'Tillbehörspaket'
      driver: 'Standardpaddlar i aluminium eller nylon vs. skräddarsydda karbonpaddlar och märkta pumpar'
      impact: 'Helt märkta tillbehör följer produktionspartierna hos underleverantörerna.'

