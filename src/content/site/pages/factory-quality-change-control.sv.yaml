cc_validation:
  tagline: Teknisk validering
  title: Validerings- och acceptansprotokoll — bevis, inte påståenden
  body: |
    En vag acceptansformulering som *"den reparerade brädan ska vara bra"* accepteras inte. Den kontrollerade formuleringen lyder:

    > "Det omtillverkade provet ska uppfylla samma tillämpliga acceptanskriterier för lufttätning, visuell finish, ventilfunktion och projektspecifika krav som en konform bräda, om inte en kundgodkänd avvikelse uttryckligen anger ett alternativt kriterium."

    Valideringsbevisen är kvantitativa och den tekniska baslinjen för lufttätningsreparation omfattar:

    - **Eliminering av läckan & tryckhållning.** Ursprungsläckan elimineras utan bestående bubblor i tvållösningen; brädan håller trycket vid standardtesttrycket 18.0 PSI under 24 timmar, med en netto tryckförlust ΔP ≤ 0.2 PSI efter kompensation för temperatur/fuktighet — den strängaste baslinjen för omtillverkningsvalidering, skild från den automatiska uteslutningströskeln på 0.50 PSI som tillämpas vid slutacceptans på produktionslinjen.
    - **Ventilfunktion.** Åtdragningsmomentet för ventilkärnan uppfyller specifikationen 15–20 N·m, utan mikroläckage vid förseglingen under högtrycks- och dynamiskt tryck vid uppumpningen.
    - **Sömlimning & livslängd.** Limfogarna uppvisar ingen lossning, vitgulning eller delaminering; efter cyklerna av termisk/fuktighetsåldring visar limlagret ingen mjukgörande eller borstade revor.
    - **Utseende & finish.** Inget limutslag, ingen skada på EVA, ingen deformation av brädan och ingen förskjutning av logotypen eller repor på den tryckta ytan.

cc_engineering:
  tagline: Teknisk utförandematris
  title: Kvantifierade parametrar för de fyra kärnomtillverkningsprocesserna
  subtitle: 'Varje kontrollerad omtillverkningsprocess bär definierade parametrar, metodik och acceptanskriterier — samma siffror som våra operatörer följer och som kunder kan verifiera under revisioner.'
  headers:
    process: Omtillverkningsprocess
    parameters: Kontrollerade parametrar
    methodology: Testmetodik
    acceptance: Acceptanskriterier
  rows:
    - process: 'Reparation av nålstygningshål/mikroläckage'
      parameters: 'Rengöring med lösningsmedel & torkning 3–5 min; varmluftsaktivering 60°C ± 5°C; tryckvals ≥ 0.4 MPa'
      methodology: 'Pumpning till 18 PSI; fullständig nedsänkning i vatten eller tvålapplication; observation under 10 minuter'
      acceptance: 'Noll bubbl bildning; 180°-kantböjning utan lossning och utan limutslag'
    - process: 'Omlimning av kantband/söm'
      parameters: 'Strikt kontrollerad blandningsförhållande för tvåkomponentlim; omgivning 22–28 °C, ≤ 65 % relativ luftfuktighet; klammer i form ≥ 4 tim'
      methodology: 'Övertryckstest vid 22 PSI i 2 tim; därefter 6 tim härdning i ugn vid 50°C och 2 tim vila i rumstemperatur'
      acceptance: 'Noll separation, noll revbildning; netto tryckförlust ΔP ≤ 0.1 PSI; limlager utan vitgulning eller sprödhet'
    - process: 'Lossnande ventilbas / mikroläckage'
      parameters: 'Specifikt åtdragningsmoment 18–20 N·m; plan försegelingsring utan deformation; kontrollerad gängjarning'
      methodology: 'Pumpning till 15 PSI; 20 cykler uppblåsning/avblåsning; observation vid nedsänkning under vatten'
      acceptance: 'Noll bubblor vid ventilkärnan och runt basen; åtdragningsmoment efter cyklerna ≥ 16 N·m'
    - process: 'Slutligt 24-timmars tryckhållningstest'
      parameters: 'Referensuppumpningstryck 18.0 PSI; digital manometer klass 1.0 / ±0.5 %; registrerad och kompenserad omgivningstemperatur & fuktighet'
      methodology: 'Digital tryckregistrator; kontinuerlig 24-timmars tryckkurva'
      acceptance: 'Netto tryckförlust ΔP ≤ 0.20 PSI / 24 tim efter kompensation; ingen utbukning eller deformation av brädan'

