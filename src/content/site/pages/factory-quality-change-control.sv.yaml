answer:
  label: 'Tydligt svar'
  text: 'Ändringar av omtillverkningsparametrar beslutas aldrig muntligen eller med retroaktiv verkan hos QINGDAO VATRAD GROUP.,LTD. Varje föreslagen ändring av godkända omtillverkningsmaterial, processförhållanden, utrustning, testmetoder, inspektionskriterier eller auktoriserad personal måste gå igenom en formell ändringskontroll före införandet: en dokumenterad Engineering Change Request (ECR), konsekvens- och riskbedömning, tvärfunktionell verifiering av konstruktion, kvalitet, produktion, inköp och projekt, frigörning på den nivå som fastställs i vår auktoriseringsmatris, ett godkänt valideringsplan för högrisksändringar, kontrollerad pilotinförande, omverifiering och effektivitetsbevis samt stängning enbart efter dokumentrevision och utbildning. Varje ändring som påverkar kundgodkända specifikationer, prov, BOM, grafik eller acceptanskriterier kräver dessutom kundens skriftliga frigörning.'
  verified: 'September 2026'

