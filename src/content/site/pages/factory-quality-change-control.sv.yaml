cc_intro:
  tagline: Omfång & policy
  title: Kärnprinciper för styrning
  body: |
    **Dokument:** QMS-SOP-QC-CC-001 — *Standard för ändringskontroll av omtillverkningsprocessparametrar* (Rev 2.0, officiell publicering). **Tillverkare:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Normreferens:** ISO 9001:2015 Kvalitetsledningssystem.

    - **Inga okontrollerade ändringar.** Ändringar av omtillverkningsparametrar måste gå igenom en formell ändringskontroll. Operatörer i verkstaden, skiftledare eller en enskild avdelning får aldrig ändra godkända omtillverkningsparametrar genom ett muntligt avtal eller en handskriven notering i ett omtillverkningsprotokoll.
    - **Fullständig elementtäckning.** Det kontrollerade omfånget täcker lufttätning, ventilsäten, kantband, sömlimning, varmluftshärdning och tryckhållningstestet — varje parameter som kan påverka försegling, strukturell livslängd, utseende, kundens acceptans eller spårbarhet.
    - **Kundens frigörning som central punkt.** Varje ändring som flyttar en produkt bort från det kundgodkända provet, den tekniska specifikationen, BOM, grafiken, förpackningskravet eller acceptanskriterierna implementeras endast med kundens skriftliga frigörning. Utan den frigörningen omtillverkas, byts ut eller kasseras brädan enligt det ursprungliga kravet — aldrig "mildrat" enbart av fabriken.

cc_scope:
  tagline: Riskklassning
  title: Ändringsomfång & riskklassning
  subtitle: Varje av följande ändringar aktiverar den formella ändringskontrollen — hanteras aldrig med en notering i omtillverkningsprotokollet. Risknivån avgör vem som frigör och hur mycket validering som krävs.
  headers:
    category: Ändringskategori
    examples: Typiska exempel
    risk: Risk
    requirements: Kontroll- och frigöringskrav
  rows:
    - category: 'Omtillverkningsmaterial'
      examples: 'Lim, avfettare, reparationsmaterial, ventiltätning, grundmassa eller byte av leverantör'
      risk: 'Hög'
      requirements: 'Tvärfunktionell verifiering + validering av materialkompatibilitet & tryckhållning + kundens frigörning där det tillämpligt'
    - category: 'Processförhållanden'
      examples: 'Ytbearbetning, temperatur/fuktighet vid varmluftshärdning, presstryck, hålltid'
      risk: 'Hög'
      requirements: 'Konstruktions- och kvalitetsfrigörning med definierad validering av temperatur- och fuktfönster'
    - category: 'Utrustning & mätinstrument'
      examples: 'Manometrar, läckagedetektorer, varmluftstermopar, ventilverktyg, testprogramvara'
      risk: 'Medel/Hög'
      requirements: 'Verifiering av kalibreringens giltighet + bedömning av utrustningens lämplighet'
    - category: 'Defektomfång'
      examples: 'Utvidgning av omtillverkningsområdet; ytlig mikro-reparation som växer ut till kritiska zoner för kant, söm eller ventilsäte'
      risk: 'Hög'
      requirements: 'Strukturellt bärande ytor: obligatoriskt stopp och ombedömning'
    - category: 'Inspektionsmetoder'
      examples: 'Metod för läckagedetektering, testtryck (18.0 PSI), lagringstid (24u)'
      risk: 'Hög'
      requirements: 'Kvalitetsfrigörning + bekräftelse av kundens tekniska överensstämmelse'
    - category: 'Dokumentation & auktorisering'
      examples: 'Omtillverkningsinstruktion, inspektionsblanketter, logik för NCR-beslut, operatörskvalificering'
      risk: 'Medel'
      requirements: 'Kontrollerad dokumentrevision (Rev A → Rev B) + utbildningsbevis'

cc_containment:
  tagline: Regeln om hårstopp
  title: Omedelbar inneslutning när förhållandena blir allvarliga
  body: |
    > "Den befintliga omtillverkningsmetoden ska underkastas en verifiering och inte tillämpas på ytterligare berörda produkter förrän ändringen har bedömts och auktoriserats, om inte en dokumenterad tillfällig avvikelse har godkänts av Kvalitet och Konstruktion."

    Den pågående omtillverkningsmetoden ska omedelbart sättas i paus när omverifieringen av omtillverkningen fortsätter att underkännas, när felet rör strukturellt bärande zoner (ventilbas, kant, sömar, tryckzoner i bog och akter), när ett ersättningsmaterial ännu inte är validerat eller när de pågående parametrarna krockar med den kundgodkända specifikationen.

    Tillfälliga avvikelser blir aldrig beständig praktik: varje avvikelse bär ett definierat giltighetsfönster, ett tillämpligt partiomfång, en antalsgräns, valideringskrav och en mekanism för automatisk utgångsdatum. Ett muntligt undantag är inget undantag — dokumenteras det inte med sitt utgångsdatum, så existerar det inte.

cc_flow:
  tagline: Kontrollerad sluten cykel i nio faser
  title: Från ändringsbegäran till stängning och förvaring
  subtitle: 'En dokumenterad cykel för varje parameterändring: föreslå, screena, bedöma, frigöra, validera, pilotera, verifiera, revidera, stänga.'
  steps:
    - step: '01'
      title: Ändringsbegäran (ECR)
      desc: 'Varje avdelning kan lämna in en begäran, men Konstruktion, Kvalitet eller produktionsledningen är sponsor. ECR besvarar varför ändringen behövs, vad som förändras, vad som berörs och hur det ska verifieras — med ett ändringskontrollnummer, kopplade NCR/CAPA, nuvarande mot föreslagen parameter, berörda partier och klassningen tillfällig/permanent ändring.'
    - step: '02'
      title: Första screening & inneslutning
      desc: 'Begäran screenas först avseende omedelbar inneslutning: ska den pågående metoden stoppas nu? Om en tillfällig avvikelse tillåts begränsas den av ett giltighetsfönster, partiomfång, antalsgräns och automatiskt utgångsdatum.'
    - step: '03'
      title: Konsekvens- & riskbedömning
      desc: 'Konstruktion, Kvalitet, Produktion, Inköp/leveranskedja och Projekt bedömer produktprestanda, acceptanskriterier, materialkompatibilitet, utseende, processkapacitet, utrustning och mätinstrument, personalkvalificering, kundkrav, överensstämmelse och spårbarhetsomfång.'
    - step: '04'
      title: Gemensam verifiering & frigörning
      desc: 'Frigörningen följer den fasta auktoriseringsmatrisen — inte "vem som skriwer högst". Högrisksändringar kräver tvärfunktionell frigörning och, där det behövs, kundens skriftliga frigörning före varje försök.'
    - step: '05'
      title: Valideringsplan
      desc: 'För högrisksändringar krävs ett godkänt valideringsplan före rutinmässig tillämpning: representativa exempelbrädor, nuvarande mot föreslagen metod, testmetoder, acceptanskriterier, inspektionsnivåer, ansvariga och planering.'
    - step: '06'
      title: Kontrollerade piloter & införande
      desc: 'De nya dokumenten frigörs och de föråldrade versionerna återkallas och märks OBSOLETE; nya material och mätinstrument verifieras och kalibreras; operatörerna utbildas och kvalificeras; det första partiet körs under förstärkt inspektion med tydlig statusmärkning.'
    - step: '07'
      title: Omverifiering & effektivitetsbevis
      desc: 'Förstågångsprocenten för omtillverkningen, omverifieringens godkännandeandel, återkommandegraden och acceptansen av utseendet mäts och verifieras innan ändringen bedöms vara effektiv — en reparerad bräda behandlas aldrig som processvalidering.'
    - step: '08'
      title: Dokumentrevision & utbildning
      desc: 'Arbetsinstruktioner, inspektionsblanketter, NCR-beslutsalternativ, parameterkort och utbildningsmaterial uppdateras till den nya revisionen, med registrerad praktisk utbildning och kvalificering av operatören.'
    - step: '09'
      title: Stängning & förvaring av registren
      desc: 'Ändringen stängs först när valideringsbevisen, dokumentuppdateringarna, utbildningsbevisen och effektiviteten av införandet har verifierats och frigjorts. Uppnås inte det avsedda resultatet revideras, utvidgas, pausas eller återkallas ändringen.'

