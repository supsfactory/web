cc_pokayoke:
  tagline: Fel Prevention
  title: 'Poka-Yoke: hårda blockeringar som stoppar okontrollerade ändringar'
  subtitle: Standarden tillämpas inte bara genom procedurer, utan med fysiska och systemiska blockeringar som gör okontrollerade ändringar omöjliga.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR-grind för aktivering av verktyget
      desc: 'Omtillverkningsstationerna läser av en QC-undertecknad ECR-streckkod innan de pneumatiska uppumpningsventilerna och limblandarna aktiveras. Inget bevis på godkänd ändringskontroll, ingen ström — en retroaktiv signatur ("ändra först, underteckna senare") blockeras fysiskt.'
    - icon: 2
      icon_bg: green
      title: Automatiskt utgångsdatum för tillfälliga avvikelser
      desc: 'Tillfälliga avvikelser är hårdkodade som gräns i systemet (t.ex. högst 50 brädor eller 7 kalenderdagar). När gränsen nås blockeras partiet och blockeras avtrycket av avsändningens genomfartstag tills ändringen har bedömts formellt.'
    - icon: 3
      icon_bg: purple
      title: Minimibevis för validering
      desc: 'Högrisksändringar kräver minst 5 representativa exempelbrädor som täcker den övre och undre toleransgränsen, fullständigt testade av 2 oberoende QC-inspektörer innan en valideringsrapport får lämnas ut — en reparerad bräda behandlas aldrig som processvalidering.'
    - icon: 4
      icon_bg: orange
      title: Dokumentkontroll 1-in-1-out
      desc: 'De föråldrade arbetsstationskorten återkallas fysiskt ogiltigförklaras (perforeras) innan det nya kortet utfärdas, stämplat med det kontrollerade röda sigillet — gamla och nya versioner delar aldrig en arbetsstation.'

