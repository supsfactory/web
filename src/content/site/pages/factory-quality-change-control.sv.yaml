faqs:
  tagline: FAQ
  title: Vanliga frågor om ändringskontroll av omtillverkning
  items:
    - q: 'Kan fabriken ändra omtillverkningsparametrar utan att informera oss?'
      a: 'Nej. Varje föreslagen ändring av godkända omtillverkningsmaterial, processförhållanden, utrustning, testmetoder, inspektionskriterier eller auktoriserad personal måste först gå igenom en dokumenterad ändringskontroll. Ändringar som påverkar kundgodkända specifikationer, prov, BOM, grafik eller acceptanskriterier kräver kundens skriftliga frigörning.'
    - q: 'Vad räknas som en högrisksändring?'
      a: 'Ändringar av omtillverkningsmaterial eller -leverantör, tryck-/håll- eller härdningsförhållanden, omtillverkningsmetoder för ventil/kant/sömar, inspektions- eller acceptanskriterier och utvidgning av defektomfånget till strukturella zoner klassas som hög risk. De kräver tvärfunktionell verifiering, ett godkänt valideringsplan och kontrollerat pilotinförande före rutinmässig användning.'
    - q: 'Kan en tillfällig avvikelse användas utan begränsning?'
      a: 'Nej. Varje tillfällig avvikelse bär ett definierat giltighetsfönster, ett partiomfång, en antalsgräns och valideringskrav med automatiskt utgångsdatum. När gränsen nås blockeras partiet och blockeras avtrycket av genomfartstag tills ändringen har bedömts formellt.'
    - q: 'Hur visar ni att en ändrad metod fungerar före fullständig användning?'
      a: 'Högrisksändringar kräver ett valideringsplan: minst 5 representativa exempelbrädor som täcker toleransgränserna, testade av 2 oberoende QC-inspektörer mot kvantifierade acceptanskriterier (läckeliminering, tryckhållning, ventilfunktion, sömlivslängd, utseende). Frigörning för validering är inte frigörning för tillämpning.'
    - q: 'Måste vi frigöra varje ändring?'
      a: 'Inte varje ändring, men varje ändring som flyttar produkten bort från det kundgodkända provet, den tekniska specifikationen, BOM, grafiken, förpackningen eller acceptanskriterierna implementeras endast med kundens skriftliga frigörning. Utan den frigörningen omtillverkas, byts ut eller kasseras brädorna enligt det ursprungliga kravet.'
    - q: 'Vad händer med gamla dokument när en ändring frigörs?'
      a: 'De gamla arbetsinstruktionerna, parameterkorten och inspektionsblanketterna återkallas fysiskt och ogiltigförklaras (1-in-1-out), märks OBSOLETE och ersätts av den nya kontrollerade revisionen efter utbildningen. Gamla och nya versioner delar aldrig en arbetsstation.'
    - q: 'Hur länge förvaras ändringskontrollens register?'
      a: 'Stängningsregistren — valideringsbevis, dokumentrevisioner, utbildningsbevis och effektivitetsbevis — förvaras enligt vår förvaringspolicy (minst 3 år för stängningsregister), så att varje ändring förblir spårbar för revisioner och verifieringar.'

