why_canada:
  tagline: 'Почему покупатели в Канаде'
  title: 'Создано для импорта в Канаду'
  subtitle: 'Завод отвечает на вопросы, которые канадские бренды и ритейлеры задают до получения первого контейнера.'
  items:
    - title: 'DDP для предсказуемой конечной стоимости'
      description: 'DDP включает таможенное оформление и доставку на ваш склад — пошлины, налоги и фрахт одной итоговой суммой в CAD или USD. Самый популярный вариант для импортеров-новичков.'
    - title: 'Маршрутизация на западное и восточное побережье'
      description: 'Мы рассчитываем морскую доставку как в Ванкувер, так и в Торонто и Монреаль через маршрут через Суэцкий канал — в зависимости от того, что лучше балансирует по сроку доставки и конечной стоимости.'
    - title: 'Продуктовые файлы с готовностью к двум языкам'
      description: 'Документация по CE, REACH и таможенным требованиям готовится для ваших целевых рынков, поэтому ваш продуктовый файл подходит для упаковки на английском и французском языках.'
    - title: 'Один завод, одна система качества'
      description: 'Разработка, изготовление образцов, производство и QC происходят на одной площадке 12,500 m² — без поездок через брокеров и без образцов, которые производство не сможет повторить.'

process_notes:
  tagline: 'Как это работает'
  title: 'От спецификации до контейнера'
  subtitle: 'Одни и те же шесть этапов независимо от того, покупаете ли вы два контейнера в год или двадцать: спецификация, инженерная разработка, образцы, испытания, оснастка, производство — затем доставка FOB, CIF или DDP.'
  items:
    - title: '1. Отправьте спецификацию'
      description: 'Достаточно референсной доски, эскиза или спецификации конкурента. Инженерная проверка и коммерческое предложение возвращаются в течение одного рабочего дня.'
    - title: '2. Утвердите образец'
      description: 'Ваш первый физический образец отгружается за 7–12 дней с листом утверждения, охватывающим конструкцию, цвета печати и результаты испытания давлением.'
    - title: '3. Производство и экспорт'
      description: 'Партии завершаются за 25–35 дней с контрольными точками QC в процессе. Упаковочный лист, счет-фактура и коносамент отправляются до выхода судна.'
    - title: '4. Доставка на ваш склад'
      description: '4–6 недель морской доставки в Ванкувер, Торонто или Монреаль — на условиях DDP мы берем на себя оформление и доставку до ваших дверей.'

faq_section:
  tagline: FAQ
  title: 'Вопросы об импорте в Канаду'
  questions:
    - q: Сколько занимает морская доставка в Канаду?
      a: 'Зложите 4–6 недель от порта Циндао до канадских портов — Ванкувер на западном побережье, Торонто и Монреаль на востоке — в зависимости от пункта назначения и расписания рейсов. Проекты DDP включают полный срок от двери до двери.'
    - q: Вы отгружаете DDP в Канаду?
      a: 'Да. DDP включает морской фрахт, таможенное оформление, пошлины и налоги, а также доставку на ваш склад — одна предсказуемая итоговая цена. Также доступны FOB Циндао и CIF.'
    - q: Каков MOQ для импорта SUP под собственным брендом?
      a: 'MOQ подтверждается конфигурацией проекта: разработка образца охватывает 1–2 единицы, пилотные партии выполняются в объеме 20–50 единиц на существующих платформах, а стандартное серийное производство — 90–100+ единиц на каждый дизайн из полного 150 m рулона drop stitch.'
    - q: Вы поддерживаете упаковку на английском и французском языках?
      a: 'Да. Наша допечатная команда готовит данные для печати на языках и по правилам ваших целевых рынков — включая двуязычную упаковку EN/FR для канадского рынка.'
    - q: Могу ли я посетить завод до заказа?
      a: 'Да. Площадка 12,500 m² в Циндао открыта для клиентов — виртуальные экскурсии по заводу можно организовать онлайн, а личные визиты проводятся с сопровождением по производственным линиям и станциям QC.'
    - q: Как начать проект из Канады?
      a: 'Отправьте референсную доску, эскиз или спецификацию. Инженерная проверка и коммерческое предложение возвращаются в течение одного рабочего дня, а NDA подписывается до обмена файлами.'

