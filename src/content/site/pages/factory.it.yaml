qc_section:
  tagline: Controllo qualità
  title: Processo di test e garanzia di qualità
  subtitle: Ogni tavola supera prima della spedizione un test obbligatorio. Il nostro laboratorio qualità opera in modo indipendente dalla produzione e riporta direttamente alla direzione.
  steps:
    - step: '1'
      title: Controllo materie prime
      desc: I tessuti in PVC, Hypalon e drop-stitch vengono sottoposti a prove di resistenza alla trazione, test di strappo e verifica della resistenza ai raggi UV prima che un lotto entri in produzione.
    - step: '2'
      title: Test di ritenzione dell''aria di 24 ore
      desc: Ogni camera viene gonfiata a 18.0 PSI e mantenuta per 24 ore. Una caduta di pressione superiore a 0.50 PSI attiva il rifiuto automatico e il ricontrollo delle cuciture.
    - step: '3'
      title: Test di carico e bilanciamento
      desc: Le tavole finite vengono gonfiate alla pressione nominale e controllate per riempimento simmetrico, rigidità a 15 PSI e stabilità sotto carico. Ogni tavola viene testata in acqua nella nostra vasca di prova prima del controllo finale.

oem_section:
  tagline: Progetti OEM
  title: Casi di studio di partnership con marchi & OEM
  subtitle: Dalla concept alla produzione — come aiutiamo i marchi globali a lanciare e scalare le loro linee di SUP gonfiabili.
  cases:
    - challenge: Un rivenditore outdoor europeo aveva bisogno di una linea di SUP private label con grafiche deck uniche, PVC eco-friendly e imballaggio pronto per il retail — tutto consegnato in 60 giorni.
      solution: Sviluppo di file di stampa digitale personalizzati, approvvigionamento di PVC conforme REACH e compressione della fase di campione da 3 round a 1 grazie al team di design ospitato nella nostra fabbrica di Qingdao.
      result: 'Produzione in 25–35 giorni dall''ordine firmato, con la prima consegna entro la finestra dei 60 giorni. 2,400 unità su 4 SKU. Ordine ripetuto prima che il primo lotto fosse completamente consegnato.'
      disclaimer: 'Riepilogo di progetto anonimizzato — il tipo e l''ambito del progetto sono rappresentativi; i risultati concreti non sono verificabili in modo indipendente.'
    - challenge: Una startup americana di sport acquatici aveva bisogno di un SUP drop-stitch ad alte prestazioni con forma personalizzata, imballaggio in co-branding e certificazione BSCI per il retail.
      solution: Adattamento di una forma SUP esistente con contorno modificato, sviluppo di grafiche di imballaggio in co-branding e fornitura della documentazione completa di audit BSCI.
      result: 'Posizionamento riuscito presso i principali rivenditori outdoor statunitensi, con forte slancio grazie a oltre 5,000 unità vendute nel primo anno e un tasso di completamento del 98%.'
      disclaimer: 'Riepilogo di progetto anonimizzato — il tipo e l''ambito del progetto sono rappresentativi; i risultati concreti non sono verificabili in modo indipendente.'
    - challenge: Un distributore australiano aveva bisogno di una serie SUP certificata CE con colori personalizzati e conformità agli standard australiani.
      solution: Produzione di campioni di pre-serie con 4 varianti di colore e coordinamento dei test di conformità di terze parti.
      result: 'Lancio di una serie SUP a 3 modelli nel mercato AU/NZ. Seguito da un successo in appalto governativo per 12 SUP di pattuglia.'
      disclaimer: 'Riepilogo di progetto anonimizzato — il tipo e l''ambito del progetto sono rappresentativi; i risultati concreti non sono verificabili in modo indipendente.'

faq_section:
  tagline: FAQ
  title: Domande frequenti su B2B & OEM
  questions:
    - q: Qual è la quantità minima d''ordine (MOQ) per le tavole SUP gonfiabili OEM?
      a: 'Il MOQ viene confermato in base alla configurazione del progetto e non da un numero fisso — scafo e attrezzatura, varianti di colore e PVC, grafiche, imballaggio e accessori. La produzione standard in serie gira con 90–100+ unità per lotto da una bobina completa di drop-stitch da 150 m, il co-branding in piccoli lotti parte da 5–10 unità e ogni progetto attraversa le fasi di campione (1–2 unità) e pilota (20–50 unità). Consulta la nostra guida MOQ & branding flessibile per la logica completa di calcolo.'
    - q: Vatrad possiede una certificazione BSCI?
      a: 'Sì. La nostra fabbrica detiene una certificazione di conformità sociale BSCI valida (report di audit disponibile su richiesta). Manteniamo inoltre ISO 9001 per la gestione della qualità. La certificazione CE si applica ai modelli destinati al mercato UE; l''ambito viene confermato per ogni progetto. La documentazione di conformità REACH e RoHS viene fornita con ogni ordine OEM.'
    - q: Qual è il tipico tempo di consegna per un ordine OEM?
      a: 'Il tempo di consegna standard è di 25–35 giorni da PO e acconto confermati per la produzione OEM in volume. Il design di forme personalizzate aggiunge 15–20 giorni per la realizzazione dello stampo. La produzione express è disponibile per ordini urgenti e picchi stagionali. I campioni prototipo sono pronti in genere entro 7–12 giorni.'
    - q: Gestite la documentazione commerciale di esportazione?
      a: 'Sì. Il nostro team gestisce internamente la documentazione commerciale di esportazione e lo sdoganamento, e spediamo in oltre 50 paesi nei mercati UE, USA, AU e asiatici.'

b2b_moq: 'MOQ confermato in base alla configurazione del progetto: campione 1–2, pilota 20–50, quantità 90–100+ (per bobina da 150 m); co-branding in piccoli lotti da 5–10 unità.'

production_flow:
  tagline: Flusso di produzione
  title: Dal materiale alla tavola finita
  subtitle: Ogni tavola attraversa 6 fasi di produzione con punti di controllo QC in ogni passaggio. Nessuna scorciatoia, nessuna ispezione saltata.
  stages:
    - stage: '01'
      title: Ingresso merci & QC di ingresso
      description: 'Tutti i materiali in ingresso vengono registrati nel nostro sistema ERP con numero di lotto. Le bobine di tessuto PVC, i nuclei drop-stitch, le valvole, gli adesivi e i raccordi vengono tenuti in quarantena fino al rilascio QC.'
      qc_check: 'Resistenza alla trazione (ASTM D751), resistenza allo strappo (ISO 4674), misurazione spessore, viscosità adesivi, scansione difetti visivi'
      qc_threshold: '100% dei lotti testati. Rifiuto se resistenza alla trazione < 90% della specifica, resistenza allo strappo < minimo di spec. o presenza di un difetto visivo'
      responsibility: Team QC di ingresso (3 ispettori)
    - stage: '02'
      title: Taglio CNC & preparazione materiali
      description: 'L''annidamento ottimizzato al computer dispone i pannelli sulla materia prima PVC per minimizzare gli scarti. Le taglierine automatiche CNC mantengono una precisione di posizionamento di 0.1 mm.'
      qc_check: 'Verifica dimensionale contro i file CAD-DXF, ispezione della qualità dei bordi, verifica del numero di pannelli'
      qc_threshold: 'Misurato ogni 20° pannello. Tolleranza ±0.5 mm. Rifiutare il lotto se >2% fuori tolleranza'
      responsibility: Capo dell''officina di taglio
    - stage: '03'
      title: Saldatura & incollaggio drop-stitch
      description: 'I nuclei drop-stitch vengono incollati ai laminati esterni in PVC tramite laminazione a caldo. Le camere vengono saldate con HF o aria calda. I rail band vengono incollati per fusione a tre strati.'
      qc_check: 'Test di peeling ogni 50 unità (ASTM D751), misurazione larghezza saldatura, verifica log temperatura aria calda, ispezione visiva delle cuciture in controluce'
      qc_threshold: 'Resistenza al peeling min. 8 N/cm. Tolleranza larghezza saldatura ±1 mm. Scanalatura visibile = rifiuto'
      responsibility: QC saldatura (2 ispettori per turno)
    - stage: '04'
      title: Assemblaggio & attrezzatura
      description: 'Le tavole entrano nell''assemblaggio finale dove convergono tutti i componenti: pannelli di deck e scafo saldati, valvole installate, anelli a D, maniglie, fin box e borsa di trasporto montati. Ogni unità segue una checklist di assemblaggio a 100 punti.'
      qc_check: 'Rilascio checklist a 100 punti per unità, test funzionale valvola (10 cicli apertura/chiusura), verifica coppia raccordi, ispezione visiva'
      qc_threshold: 'Politica zero difetti sui componenti critici per la sicurezza (valvole, anelli a D, maniglie). Cosmetici minori: AQL 2.5 (ISO 2859)'
      responsibility: Capo squadra assemblaggio + QC di linea
    - stage: '05'
      title: Test di pressione & blocco qualità
      description: 'Ogni camera viene gonfiata a 18.0 PSI (per un SUP con rating di 12–15 PSI) e mantenuta per 24 ore. I sensori di pressione registrano in modo continuo. Le camere con una caduta di pressione superiore a 0.50 PSI vengono rifiutate e inviate al ricontrollo delle cuciture.'
      qc_check: 'Registro mantenimento pressione 24h, calibrazione sensori verificata quotidianamente, misurazione pressione compensata in temperatura, test cuciture dopo riparazione'
      qc_threshold: 'Max. 0.50 PSI di caduta di pressione in 24h a temperatura stabile. Ogni camera che supera questo = nuovo test al 100% dell''intero lotto di produzione'
      responsibility: Laboratorio qualità (indipendente dalla produzione, riporta alla direzione)
    - stage: '06'
      title: Controllo finale & imballaggio
      description: 'Controllo visivo e funzionale finale. Difetti superficiali, coerenza del colore, verifica etichette/BIN, integrità dell''imballaggio e completezza degli accessori. Le unità vengono imballate sottovuoto, inserite nei cartoni e pallettizzate a strati per il carico in container.'
      qc_check: 'Ispezione visiva completa, checklist accessori per SKU, drop test imballaggio (1 m, campione), verifica scansione etichette/codici a barre'
      qc_threshold: 'AQL 2.5 per difetti gravi, AQL 4.0 per difetti lievi. Tolleranza zero per difetti di sicurezza. 100% delle unità ispezionate visivamente'
      responsibility: Team QC finale (4 ispettori) + capo squadra imballaggio

