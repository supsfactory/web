material_traceability:
  tagline: Rintracciabilità
  title: Tracciamento dei materiali & controllo lotti
  description: Ogni lotto di materia prima riceve un numero di lotto univoco nel nostro sistema ERP. Dall''ingresso fino alla produzione e al prodotto finale, la distinta base di ogni tavola rimanda al lotto originale del fornitore. Questo consente una piena rintracciabilità a monte per qualsiasi richiesta di qualità o conformità.
  system: ERP personalizzato (sistema interno del Qingdao Vatrad Group) + marcature fisiche dei lotti su ogni ordine di lavoro
  coverage: '100% del materiale di produzione — PVC, Hypalon, tessuto drop-stitch, adesivi, valvole, raccordi, imballaggio'
  records_retained: 10 anni (secondo requisito CE 2013/53/UE)
  suppliers:
    - material: PVC di qualità marina
      source: Fornitori cinesi e coreani
      certified: ISO 9001, REACH, RoHS
    - material: 'Hypalon (CSM)'
      source: Fornitore giapponese
      certified: ISO 9001, REACH
    - material: Tessuto drop-stitch
      source: Tessitura propria + partner esterno
      certified: QC interno + fornitore ISO 9001
    - material: Valvole & raccordi
      source: Fornitori OEM cinesi
      certified: ISO 9001, certificati materiali per lotto

