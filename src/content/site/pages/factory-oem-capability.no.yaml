services:
  - title: Produktdesign og konstruksjon
    description: Vårt interne FoU-team arbeider med ideen eller spesifikasjonen din for å utvikle CAD-tegninger, 3D-modeller og prototyper. Vi tilbyr formdesign, optimalisering av skrogformen og rådgivning om materialvalg.
  - title: Branding og tilpasset grafikk
    description: Digital trykking i full farge, silkeskjermtrykk, preging og etikettalternativer. Vi utvikler merk spesifikk deck-grafikk, branding av kammer og detaljhandelsklare emballasjer.
  - title: Tilpasning av materialer og spesifikasjoner
    description: Velg mellom PVC (standard, miljøvennlig, flammehemmende), Hypalon/CSM, drop-stitch og hybridkonstruksjoner. Tilpassede kammerfarger, stoffvekter og forsterkningsalternativer.
  - title: Emballasje og logistikk
    description: Skreddersydde kommersielle emballasjer, private label-kartonger, vakuumpakking, palletering og eksportklare stabler, klargjort på stedet.

moq_table:
  - product: Oppblåsbare SUP-brett
    standard_moq: 'Prøve 1–2 | Pilotparti 20–50'
    custom_moq: 'Antall 90–100+ (per rull på 150 m)'
    lead_time: 25–35 dager

why_us:
  - title: Vertikal integrasjon
    description: Vi eier fabrikken, formverktøyene og forsyningskjeden — ingen mellomledd, ingen underleverandører. Det gir oss kontroll over kvalitet, kostnad og levering.
  - title: Dobbel sertifisering
    description: Kvalitetsledelse etter ISO 9001 og BSCI-sertifisering for sosialt samsvar. Fabrikkrevisjonsrapporter er tilgjengelige på forespørsel.
  - title: CE-samsvar
    description: CE-sertifiseringen gjelder modeller beregnet for EU-markeder (omfang bekreftet per prosjekt). Skreddersydde modeller kan CE-sertifiseres via den etablerte prosessen vår.
  - title: Prosjektspesifikk MOQ
    description: 'MOQ bekreftes av prosjektkonfigurasjonen din — co-branding i små partier starter på 5–10 enheter, standardserieproduksjon går med 90–100+ enheter per parti. Vi hjelper nye merker med å komme i gang uten overmålte lagerforpliktelser.'

cta:
