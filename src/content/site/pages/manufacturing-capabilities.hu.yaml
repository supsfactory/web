faq_section:
  tagline: GYIK
  title: 'Kérdések a SUP gyártási kapacitásokról'
  questions:
    - q: 'Mely gyártási folyamatok valósulnak meg belsőleg?'
      a: 'Minden alapfolyamat belső: a légkamra mérnöksége, a drop-stitch mag feldolgozása, az RF-hegesztés, a nyomtatás, az EVA vágás, az összeállítás, a vizsgálat és a csomagolás. A tartozékok és egyes alapanyagok tanúsított beszállítóktól származnak; a végső felszerelést belsően végezzük, a teljes követhetőség érdekében.'
    - q: 'Mekkora az Ön gyártási kapacitása?'
      a: 'Több mint 120 000 deszka évente (körülbelül havi 10 000 db) 4 automatizált soron és 4 speciális üzemrészben, egy 12 500 m²-es gyárban, több mint 350 munkavállalóval.'
    - q: 'Mekkora MOQ érvényes ezekre a kapacitásokra?'
      a: 'A standard mennyiség 90–100+ darab jóváhagyott konfigurációnként (150 m-es drop-stitch szövettekercs); a pilot lották 20–50 darabtól indulnak meglévő platformokon; a csak emblémás megrendelések 5–10 darabtól indulnak.'
    - q: 'Milyen határidőkkel kell számolnunk?'
      a: 'Prototípusminta 7–12 nap; gyártás 25–35 nap a megrendelés és az előleg megerősítése után; az egyedi formák fejlesztése további 15–20 napot ad a szerszámokhoz.'
    - q: 'Hogyan fordulnak le a kapacitások minőséggé?'
      a: 'Minden folyamat a 7 lépéses minőségi rendszert szolgálja ki: 100 pontos összeállítási ellenőrzőlista, 18.0 PSI nyomáson 24 órás megtartás 0.50 PSI-nél nagyobb nyomáscsökkenés esetén automatikus elutasítással, ISO 2859-1 II. szintű mintavétel és 10 éves ERP-alapú lotkövethetőség.'

