hero:
  tagline: Gyártási kapacitások
  title: 'SUP gyártási kapacitások'
  subtitle: 'Minden folyamat — a légkamra mérnöksége, a drop-stitch mag feldolgozása, az RF-hegesztés, a nyomtatás, a formázó szerszámok, az összeállítás, a vizsgálat és a csomagolás — a qingdaói 12 500 m²-es gyárunkban zajlik, így egyetlen felelős csapat viszi az Ön projektjét az első rajzotól a kiszállított konténerig.'

answer:
  label: 'Közvetlen válasz'
  text: 'A SUP-gyártás teljes egészében a qingdaói gyárunkban történik: a légkamra tervezése és a méret szerinti mérnökség 0.1 mm CNC-pontossággal; a drop-stitch alapanyag feldolgozása és az RF-hegesztés 4 automatizált soron; a grafika nyomtatása; az EVA borítékok vágása; egyedi formázó szerszámok (új formák esetén +15–20 nap); az összeállítás 100 pontos ellenőrzőlista szerint; valamint a 18.0 PSI nyomáspróba 24 órás megtartással, 0.50 PSI-nél nagyobb nyomáscsökkenés esetén automatikus elutasítással. Az éves kapacitás több mint 120 000 deszka (körülbelül havi 10 000 db) 4 speciális üzemrészből, több mint 350 munkavállalóval, több mint 50 országba szállítva, az Ön márkájában.'
  verified: '2026. szeptember'

