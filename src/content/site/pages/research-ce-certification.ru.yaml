answer:
  label: 'Прямой ответ'
  text: 'Надувные SUP подпадают под Директиву ЕС о маломерных судах 2013/53/EU при длине корпуса более 2,5 м либо под Директиву о безопасности потребительских товаров, если они меньше. Сертификация стоит примерно 13,000&ndash;31,000 EUR и 8&ndash;14 недель для первого изделия: технический файл, типовые испытания в аккредитованном органе, аудит завода, затем Декларация о соответствии.'
  verified: 'Сентябрь 2026'

content_html: |
  <h2>Что такое сертификация CE?</h2>
  <p>Маркировка CE (Conformit&eacute; Europ&eacute;enne) означает, что изделие соответствует требованиям ЕС в области здоровья, безопасности и охраны окружающей среды. Для надувных водных транспортных средств применимая нормативная база зависит от категории изделия.</p>

  <h2>Применимые директивы</h2>

  <h3>Директива о маломерных судах (2013/53/EU)</h3>
  <p>Основная директива для большинства надувных лодок, SUP и каяков. Она применяется к маломерным судам с длиной корпуса от 2,5 м до 24 м, к частично завершенным лодкам (для поставок OEM) и к маломерным плавательным средствам индивидуального пользования.</p>

  <h3>Регламент о средствах индивидуальной защиты (2016/425)</h3>
  <p>Спасательные жилеты, средства обеспечения плавучести и оборудование безопасности, поставляемые вместе с водными транспортными средствами, должны соответствовать требованиям Регламента о СИЗ, включая экспертизу типа (модуль B) в аккредитованном органе и обеспечение качества производства (модуль D или E).</p>

  <h2>Процесс сертификации</h2>
  <ol>
    <li>Классификация изделия: определение категории проекта (A – D по ISO 8666)</li>
    <li>Применимые стандарты: EN ISO 6185 (части 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (шильдик изготовителя)</li>
    <li>Подготовка технического файла: конструкторские чертежи, спецификация материалов, сертификаты на материалы, оценка рисков</li>
    <li>Типовые испытания: плавучесть, устойчивость, грузоподъемность, испытания материалов, прочность швов, герметичность</li>
    <li>Производственный контроль на заводе: аудит производственных процессов аккредитованным органом</li>
    <li>Декларация о соответствии: изготовитель подписывает DoC и наносит маркировку CE</li>
  </ol>

  <h2>Аккредитованные органы для надувных водных транспортных средств</h2>
  <p>Распространенные аккредитованные органы: Bureau Veritas (Франция), DNV GL (Германия), RINA (Италия), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Германия).</p>

  <h2>Сроки и стоимость</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Этап</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Продолжительность</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Типичная стоимость (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Подготовка технического файла</td><td class="p-3 border">2 – 4 недели</td><td class="p-3 border">2,000 – 5,000</td></tr>
      <tr><td class="p-3 border">Типовые испытания</td><td class="p-3 border">4 – 8 недель</td><td class="p-3 border">8,000 – 20,000</td></tr>
      <tr><td class="p-3 border">Аудит завода</td><td class="p-3 border">1 – 2 дня (на месте)</td><td class="p-3 border">3,000 – 6,000</td></tr>
      <tr><td class="p-3 border">Итого (первое изделие)</td><td class="p-3 border">8 – 14 недель</td><td class="p-3 border">13,000 – 31,000</td></tr>
    </tbody>
  </table>

  <h2>Что это значит для покупателей</h2>
  <p>При закупке сертифицированных надувных досок всегда проверяйте, что маркировка CE нанесена на шильдик изготовителя, существует действующая DoC, указан номер аккредитованного органа, а руководство пользователя содержит инструкции по безопасности на вашем языке. Вся продукция Vatrad поставляется с сертификацией CE и полной прослеживаемостью до отчетов об аудите аккредитованного органа.</p>
  <p>Сертификация является частью каждого производственного тиража на нашей площадке в Циндао — ознакомьтесь с <a href="/ru/factory">рабочим процессом контроля качества и испытаний на заводе</a> и с тем, как мы поддерживаем <a href="/ru/oem-manufacturing">соответствие CE для OEM- и private-label-партнеров</a>.</p>

