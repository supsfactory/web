  tagline: 'Merkeidentitet'
  title: 'Hvem er iSupfactory?'
  subtitle: 'iSupfactory er Vatrads kundeorienterte produksjonsmerke, den marine produksjonsdivisjonen innen Qingdao Vatrad Group Co., Ltd. — en produsent av oppblåsbare SUP-brett og oppblåsbare marine produkter med base i Laixi, Qingdao, Kina. Vi produserer utelukkende under kundenes våre merker og konkurrerer aldri med dem.'

answer:
  label: 'Kort sagt'
  text: 'Juridisk enhet: Qingdao Vatrad Group Co., Ltd. Produksjonsdivisjon: Vatrad (merket iSupfactory). Fabrikk: Laixi, Qingdao, Shandong, Kina. Virksomhetsområde: OEM-, ODM- og private label-produksjon av oppblåsbare SUP-brett, padler og oppblåsbare marine produkter. Sertifiseringer: ISO 9001:2015, CE (modeller beregnet for EU-markedet), BSCI, REACH, RoHS. Vi selger ikke under noe eget merke — hvert brett vi produserer bærer kjøperens merke.'
  verified: 'September 2026'

