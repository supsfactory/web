    - **Ilmatiiviyskirjaus:** HYVÄKSYTTY — säilytetään erää kohti
    - **Tarkastustila:** HYVÄKSYTTY
    - **Lähetystila:** LUOVUTETTU

quarantine_intro:
  tagline: Vaatimustenvastaisuuden valvonta
  title: Vaatimustenvastaisten tuotteiden hallinta ja eristys
  body: |
    Tuotteet tai osat, jotka eivät täytä määriteltyjä hyväksymiskriteerejä, tunnistetaan selvästi ja siirretään ohjattuun pidätys- tai eristystilaan. Ne eivät voi edetä seuraavaan tuotantovaiheeseen, pakkaukseen tai lähetettäväksi, ennen kuin valtuutettu päätös on tehty. Korjaus tehdään hyväksytyn ohjeen mukaisesti ja se liitetään asiaan liittyvään vaatimustenvastaisuuskirjaukseen; korjatut kohteet tarkastetaan uudelleen sovellettavia projektivaatimuksia vasten ennen laadullista luovutusta.

quarantine_flow:
  tagline: 7-vaiheinen valvontavirta
  title: Mitä tapahtuu, kun vaatimustenvastaisuus löytyy
  subtitle: Tunnista, valvo, korjaa, varmenna — sitten luovuta tai hylkää. Vaatimustenvastaista tuotetta ei koskaan päästetä takaisin tuotantoon tai pakkaukseen tarkastamatta.
  steps:
    - step: '01'
      title: Tunnistaminen
      desc: Vaatimustenvastaisuus kirjataan kyseisen tuotteen, SKU:n, erän tai prosessivaiheen kohdalle.
    - step: '02'
      title: Merkitseminen
      desc: Vaikutusalaan kuuluvat kohteet merkitään selvästi ohjatulla tilamerkillä — HOLD, QUARANTINE tai REJECTED.
    - step: '03'
      title: Eristäminen
      desc: Kohteet eristetään fyysisesti valvottuun eristysalueeseen tai järjestelmäohjattuun tilaan, jotta ne eivät pääse vahingossa käyttöön tai lähetettäväksi.
    - step: '04'
      title: Vaikutusalueen arviointi
      desc: Vaikutusalue käydään läpi erän, prosessivaiheen, materiaalierän ja asiakirjarevision mukaan.
    - step: '05'
      title: Korjaus / vaihto
      desc: Korjaus sallitaan vain hyväksytyn päätöksen ja ohjatun työohjeen kautta.
    - step: '06'
      title: Uudelleentarkastus
      desc: Korjatut kohteet tarkastetaan uudelleen sovellettavia hyväksymiskriteerejä vasten ennen luovutusta.
    - step: '07'
      title: Luovutus tai hylkäys
      desc: Vain valtuutettu vaatimustenmukainen tuote etenee pakkaukseen tai lähetysluovutukseen.

quarantine_evidence:
  tagline: Tehdashallissa
  title: Ohjattu testaus ja eristys käytännössä
  subtitle: Kuvat tehtaan työpajasta Qingdaosta näyttävät, miten tilavalvonta ja tarkastuskirjaukset toteutetaan paikan päällä.
  features:
    - image: https://assets.isupfactory.com/site/quality/qc-air-tightness-test-area.avif
      alt: Tehtaan ilmatiiviystestausalueella täyttöön asetetut puhallettavat SUP-laudat, joita seurataan digitaalisella painemittarilla
      title: Ilmatiiviystestausalue
      desc: 'Täyttöön asetetut laudat pidetään teollisuusvalaistuksessa laadunvalvonnan testialueella, ja digitaaliset painemittarit seuraavat hyväksyttyä ilmanpidätystestiä venttiilin pohjassa, kiskon saumoissa, keulassa ja hännässä sekä korkean rasituksen kohdissa. Kirjaukset säilytetään erää kohti ja linkitetään lopputarkastukseen.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
      alt: Laadunvalvonnan tarkistuslehdet ja ohjatun pidätyksen tilamerkinnät tehtaan tarkastuspisteessä
      title: Pidätys- ja eristysasema
      desc: 'Tarkastuspiste, jossa on laadunvalvonnan tarkistuslehdet ja tilamerkinnät. Mikään hyväksymiskriteerit täyttämätön kohde ei pääse pakkaukseen: se merkitään, kirjataan ja siirretään eristykseen — se ei voi edetä pakkaukseen ennen kuin valtuutettu päätös ja pakollinen uudelleentarkastus on tehty.'
    - image: https://assets.isupfactory.com/site/quality/qc-air-tightness-rework.avif
      alt: Laadunvalvonnan tekniikko tekee ohjattua ilmatiiviyskorjausta puhallettavaan SUP-lautaan tehtaan korjausasemalla
      title: Ohjattu korjausasema
      desc: 'Ilmatiiviyskorjaus tehdään omalla asemallaan hyväksytyn menetelmäkortin mukaisesti: virhe merkitään, lauta pysyy HOLD-tilassa, ja vaaditun kovettumisajan jälkeen se palaa testialueelle uudelleentarkastukseen alkuperäisiä hyväksymiskriteerejä vasten.'
    - image: https://assets.isupfactory.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Ohjatun eristyksen esittely työpajassa Qingdaon tehtaassa
      title: Eristysalueen esittely
      desc: 'Esittelykuva työpajasta, joka näyttää, miten ohjattu eristys toimii paikan päällä: eristetyt yksiköt pidetään tilavalvonnassa, kunnes valtuutettu päätös on tehty.'

rework_intro:
  tagline: Korjauksen hallinta
  title: Ohjattu ilmatiiviyysvaatimustenvastaisuuksien ja korjauksen hallinta
  body: |
    QINGDAO VATRAD GROUP.,LTD.:ssä korjaus määritellään tiukasti vaatimustenvastaavan yksikön palauttamiseksi täyteen vaatimustenmukaisuuteen alkuperäisen tuoteteknisen määrityksensä mukaisesti — ei nopeaksi paikaksi. Jokainen lauta, jossa on havaittu ilmatiiviyysvaatimustenvastaisuus, siirretään ohjattuun pidätykseen ja linkitetään vaatimustenvastausraporttiin (NCR) ennen jatkokäsittelyä; vuodon lähde paikannetaan ja kirjataan hyväksytyllä diagnostiikkamenetelmällä.

    Korjaus voidaan tehdä vain, kun virhe kuuluu hyväksytyn korjauksen laajuuteen ja valtuutettu menetelmä on käytettävissä. Korjausohje määrittää tuotteen, erän, virheen sijainnin, hyväksytyn materiaalin, menetelmän, vaaditut olosuhteet ja uudelleentarkastuksen laajuuden. Vaaditun kovettumis- tai stabilointijakson jälkeen lauta tarkastetaan uudelleen samoja sovellettavia hyväksymiskriteerejä vasten kuin vaatimustenmukainen lauta — korjaus ei koskaan laske hyväksymisstandardia. Uudelleentarkastuksen epäonnistuminen vaatii uuden tuotetekn ja laadun päätöksen; toistuva korjaus ei ole sallittu ilman dokumentoitua hyväksyntää.

rework_decision:
  tagline: Vuorovaikutteinen virta
  title: Korjauspäätöksen virta — klikkaa solmua
  subtitle: Seuraa, miten ilmatiiviyysvaatimustenvastaisuus käsitellään havaitsemisesta luovutukseen tai romutukseen. Klikkaa solmua laajentaaksesi kyseisen vaiheen valvontavaatimukset.
  nodes:
    - id: detect
      type: start
      label: Vuoto havaittu
      detail: 'Ilmatiiviyysvaatimustenvastaisuus havaitaan tarkastuksessa — paineen säilymisen epäonnistuminen, näkyvä vuoto tai siihen liittyvä ilmajärjestelmän virhe.'
    - id: hold
      type: step
      label: Pysäytä linja · HOLD-merkki · NCR
      detail: 'Käsittely pysäytetään. Laudan tunnus, tuotekoodi, erä, työpiste, päivämäärä ja tarkastaja kirjataan; HOLD / QUARANTINE -merkki kiinnitetään ja NCR avataan sovellettavaa määritysrevisiota vasten.'
    - id: locate
      type: step
      label: Paikanna vuodon lähde
      detail: 'Lauda täytetään projektissa hyväksyttyyn diagnostiikkapaineeseen ja lähde paikannetaan hyväksytyllä menetelmällä — paineen säilyminen, kalibroitu kuplatesti, akustinen tai vuodon tunnistuslaite.'
    - id: classify
      type: step
      label: Luokittele virhe (A–G)
      detail: 'Virhe luokitellaan hyväksymismatriisin mukaan: A venttiiliraja, B venttiilin pohjan sauma, C pinnan neulansuoja, D paikallinen kiskon sauma, E laaja kiskon vika, F toistuva vuoto, G rakenteellinen vaurio.'
    - id: authorize
      type: decision
      label: Korjaus valtuutettu?
      yes: rework
      no: escalate
      detail: 'Laadunvalvonta vahvistaa virheluokan ja Tuotetekniikka arvioi, voidaanko lauta palauttaa alkuperäiseen määritykseensä. Valtuutus kirjaa menetelmäkortin, materiaalit, olosuhteet ja uudelleentarkastuksen laajuuden — tai ohjaa sen vaihtoon, hylkäyseen, romutukseen tai asiakkaan suostumukseen.'
    - id: rework
      type: step
      label: Ohjattu korjaus
      detail: 'Toteutetaan vain hyväksytyn virherajan sisällä käyttäen hyväksyttyä menetelmäkorttia, materiaalierää ja työkalustoa — mitään mittoja, rakennetta, kuvitusta, lisävarusteita tai pakkausvaatimuksia muuttamatta.'
    - id: cure
      type: step
      label: Kovettuminen ja stabilointi
      detail: 'Lauda pysyy HOLD-tilassa hyväksytyn materiaalin ja prosessiohjeen määrittellyn kovettumis- ja stabilointijakson läpi, minkä jälkeen se saa silmämääräisen ja työn laadun esitarkastuksen.'
    - id: reinspect
      type: decision
      label: Uudelleentarkastus läpi?
      yes: release
      no: escalate
      detail: 'Lauda täytetään projektissa hyväksyttyyn uudelleentarkastuspaineeseen ja alkuperäinen vika sekä kaikki mahdollisesti vaikuttuneet ominaisuudet varmennetaan uudelleen — vuodon sijainti, venttiili, kiskot, saumat, korkean rasituksen alueet, lisävarusteet ja ulkonäkö. Korjaus ei koskaan laske hyväksymisstandardia.'
    - id: release
      type: release
      label: Laadullinen luovutus
      detail: 'Laatu käy läpi suljetun NCR:n, korjauskirjauksen ja uudelleentarkastustuloksen ja valtuuttaa luovutuksen. Yhtään korjattua lautaa ei pakata eikä lähetetä ilman valtuutettua laadullista luovutusta.'
    - id: escalate
      type: escalate
      label: Eskaloi — vaihto / romutus / suostumus
      detail: 'Ei toistuvaa korjausta ilman dokumentoitua hyväksyntää. Lauda ohjataan vaihtoon, hylkäyseen, romutukseen tai kirjalliseen asiakkaan suostumukseen, jos alkuperäistä määritystä ei voida palauttaa.'

defect_matrix:
  tagline: Virheluokitus
  title: Ilmatiiviyysvirheiden luokitus- ja hyväksymismatriisi
  subtitle: Kaikkia vuotoja ei korjata — jokainen virhe luokitellaan ja sen päätös hyväksytään oikealla tasolla aina laadunvalvonnan tarkastajasta tehtaanjohtajaan.
  headers:
