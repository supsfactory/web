  title: Lataa näytteen laatupaketti ja protokollapohjat
  subtitle: 'OEM/ODM-hankkeissa käytetyt vakiintuneet ohjatut pohjat — jäsennettynä 00–15-asiakirjarekisteriksi (projekti-indeksi, hyväksytty määritys, materiaaliluettelo, artwork- ja pakkausviittaukset, QIP, tarkastuskirjaukset, NCR, muutosvalvonta, kolmannen osapuolen kohde, luovutusyhteenveto).'
  features:
