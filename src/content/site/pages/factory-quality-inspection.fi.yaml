      link: '/fi/factory/non-conforming-control'
      link_label: Katso sivu

faqs:
  tagline: FAQ
  title: Usein kysytyt kysymykset SUP-laadunvalvonnasta
  items:
    - q: 'Miten QINGDAO VATRAD GROUP.,LTD. valvoo puhallettavien SUP-laatujen laatua?'
      a: 'Laatua valvotaan saapuvan materiaalin tarkastuksella, tuotantoprosessin tarkastuspisteillä, lopputuotteen varmennuksella, pakkauksen tarkastuksella ja tuotannon jäljitettävyydellä — kukin toteutettuna projektissa hyväksyttyjä näytteitä, määrityksiä ja tarkastuskriteerejä vasten.'
    - q: 'Mitä laatutarkastuksia SUP-tuotannossa tehdään?'
      a: 'Tarkastuksiin kuuluvat materiaalien varmennus, leikkauksen ja tulostuksen tarkistukset, laudan rakentamisen tarkastus, venttiilin asennuksen varmennus, lisävarusteiden tarkastus, ilmatiiviystestaus, ulkonäön tarkastus ja pakkauksen varmennus.'
    - q: 'Voivatko OEM-asiakkaat pyytää SUP-tarkastuskirjaukset?'
      a: 'Kyllä. Tarkastuskirjaukset ja laatuasiakirjat voidaan toimittaa projektivaatimusten ja asiakkaan laatua koskevien sopimusten mukaisesti, mukaan lukien näytteen esilähetystarkastusraportit.'
    - q: 'Miten tehdas varmistaa OEM-tuotannon yhdenmukaisuuden?'
      a: 'Tuotannon yhdenmukaisuus ylläpidetään hyväksytyillä näytteillä, teknisillä määrityksillä, valmistuksen tarkastuspisteillä, tarkastusmenettelyillä ja kuhunkin tilaukseen linkitetyillä dokumentoiduilla laadunvalvontaprosesseilla.'
    - q: 'Voinko järjestää kolmannen osapuolen tarkastuksen SGS:n, BV:n, Intertekin tai QIMA:n toimesta?'
      a: 'Kyllä. Otamme kolmannen osapuolen tarkastajat vastaan omalla tarkastusalueellamme, kalibroituine painemittareineen, valmiiksi täytettyine tarkastuskohteineen ja saatavilla olevine kirjauksineen. Jaa määrityksesi, hyväksytyt näytteesi, artworkisi, pakkausvaatimuksesi ja virhekriteerisi — tai käytä kolmannen osapuolen tarkastuskohteen pohjaamme.'
    - q: 'Miten artwork-, materiaaliluettelo- tai pakkausmuutokset käsitellään tuotannon aikana?'
      a: 'Muutokset kirjataan muutosvalvontakirjaan, jossa on vaikuttavan asiakirjarevision, muutoksen yhteenveto, syy, vaikutusarvio, asiakkaan hyväksynnän tila ja voimaan tuleva erä. Vanhentuneet versiot vedetään pois, jotta tuotanto ja tarkastus käyttävät aina nykyisiä hyväksyttyjä asiakirjoja.'
    - q: 'Tukeeko tehdas räätälöityjä puhallettavien SUPien projekteja?'
      a: 'Kyllä. Räätälöityjä puhallettavien SUPien OEM/ODM-hankkeita tuetaan asiakkaan määritysten, artwork-vaatimusten, lisävarustekokoonpanojen ja pakkaustarpeiden mukaisesti, ja projektikohtaiset tarkastuskriteerit sovitaan ennen tuotantoa.'
    - q: 'Voiko vuotavan SUP-laudan korjata tehtaalla?'
      a: 'Kyllä — ohjatuissa oloissa. Lauda siirretään HOLD-tilaan ja linkitetään NCR:ään, vuoto paikannetaan hyväksytyllä diagnostiikkamenetelmällä, ja korjaus etenee vasta laadunvalvonnan/Tuotetekniikan valtuutuksen jälkeen ja vain niiden virheluokkien puitteissa, jotka on hyväksytty korjattavaksi. Lauda tarkastetaan sitten uudelleen samoja hyväksymiskriteerejä vasten kuin vaatimustenmukainen lauta ennen luovutusta.'
    - q: 'Kuinka monta kertaa tehdas voi korjata laudan?'
      a: 'Yhtä kohtaa saa korjata kerran valtuutetun ohjeen mukaisesti. Jos uudelleentarkastus yhä epäonnistuu, lauta eskaloidaan vaihtoon, hylkäyseen, romutukseen tai asiakkaan suostumukseen — toistuva korjaus ilman dokumentoitua hyväksyntää ei ole sallittu.'

