    - category: 'Luokka B — Venttiilin pohjan sauma'
      area: 'Mikrokuoppa venttiilin reunan kohdalla'
      eligibility: 'Korjaus arvioidaan hyväksytyn menetelmäkortin mukaan'
      approval: 'Laadunvalvonta + Tuotetekniikka'
    - category: 'Luokka C — Pinnan neulansuoja'
      area: 'Paikallinen mikroneulansuoja jännittämättömällä pinnalla'
      eligibility: 'Valtuutettu vain, kun se vastaa asiakkaan määrityksiä'
      approval: 'Laadunvalvonta + Tuotetekniikka'
    - category: 'Luokka D — Paikallinen kiskon sauma'
      area: 'Paikallinen vuoto kiskonauhan päällekkäisyydessä'
      eligibility: 'Korkea riski; vaatii tiukkaa tuoteteknistä päätöstä'
      approval: 'Tuotetekniikka + Laadunvarmistuksen päällikkö'
    - category: 'Luokka E — Laaja kiskon vika'
      area: 'Jatkuva saumavika korkean rasituksen vyöhykkeillä'
      eligibility: 'Vakiokorjausta ei valtuuteta — vaihto tai juurisyntianalyysi'
      approval: 'Laadunvarmistuksen päällikkö + asiakkaan suostumus'
    - category: 'Luokka F — Toistuva vuoto'
      area: 'Paikantamaton vuoto tai uudelleentestin epäonnistuminen'
      eligibility: 'Ei toistuvaa korjausta; vaihto, romutus tai tuotetekninen juurisyntianalyysi'
      approval: 'Laadunvarmistuksen esimies / Tuotetekniikka'
    - category: 'Luokka G — Rakenteellinen vaurio'
      area: 'Materiaalivahinko, delaminointi, laudan vääntyminen'
      eligibility: 'Korjausluovutusta ei valtuuteta — vaihto, romutus tai kirjallinen asiakkaan suostumus'
      approval: 'Laadunvarmistuspäällikkö + asiakkaan hyväksyntä'

rework_flow:
  tagline: 7-vaiheinen suljettu silmukka
  title: Ohjattu korjausprosessi — havaitsemisesta luovutukseen tai romutukseen
  subtitle: 'Jokainen ilmatiiviyskorjaus noudattaa samaa ohjattua silmukkaa: havaitse, eristä, diagnosoi, valtuuta, korjaa, tarkasta uudelleen, luovuta.'
  steps:
    - step: '01'
      title: Havaiteminen, linjapysäytys ja eristys
      desc: 'Käsittely pysäytetään välittömästi kyseisen laudan kohdalla. Laudan tunnus, tuotekoodi, erä, työpiste, päivämäärä ja tarkastaja kirjataan, HOLD / QUARANTINE -merkki kiinnitetään ja NCR avataan sovellettavaa määritysrevisiota vasten.'
    - step: '02'
      title: Järjestelmällinen vuodon diagnostiikka
      desc: 'Lauda täytetään projektissa hyväksyttyyn diagnostiikkapaineeseen ja vuodon lähde paikannetaan hyväksytyllä menetelmällä — paineen säilyminen, kalibroitu kuplatesti, akustinen tai vuodon tunnistuslaite. Epäilty sijainti merkitään vahingoittamatta lautaa.'
    - step: '03'
      title: Tuotetekninen päätös ja valtuutus
      desc: 'Laadunvalvonta vahvistaa virheluokan ja Tuotetekniikka arvioi, voidaanko lauda palauttaa alkuperäiseen määritykseensä. NCR:ään viittaava korjausvaltuutus kirjaa hyväksytyn menetelmän, materiaalit, olosuhteet ja uudelleentarkastuksen laajuuden — tai määrää vaihdon, hylkäyksen, romutuksen tai asiakkaan suostumuksen.'
    - step: '04'
      title: Ohjatun korjauksen toteutus
      desc: 'Korjaus toteutetaan vain hyväksytyn virherajan sisällä käyttäen hyväksyttyä menetelmäkorttia, materiaalierää ja työkalustoa. Laudan mittoja, rakennetta, kuvitusta, lisävarustekokoonpanoa tai pakkausvaatimuksia ei koskaan muuteta.'
    - step: '05'
      title: Kovettuminen, stabilointi ja esitarkastus
      desc: 'Korjattu lauta pysyy HOLD-tilassa hyväksytyn materiaalin ja prosessiohjeen määrittellyn kovettumis- ja stabilointijakson läpi, minkä jälkeen se saa silmämääräisen ja työn laadun esitarkastuksen ennen uudelleentarkastusta.'
    - step: '06'
      title: Uudelleentarkastus ja varmennustestaus
      desc: 'Lauda täytetään projektissa hyväksyttyyn uudelleentarkastuspaineeseen ja alkuperäinen vika sekä kaikki mahdollisesti vaikuttuneet ominaisuudet varmennetaan uudelleen: vuodon sijainti ja ympäröivä alue, venttiili, kiskot, saumat, korkean rasituksen alueet, lisävarusteet ja ulkonäkö. Korjaus ei koskaan laske hyväksymisstandardia.'
    - step: '07'
      title: Laadunvarmistuksen luovutus tai lopullinen päätös
      desc: 'Laatu käy läpi valmiin NCR:n, korjauskirjauksen ja uudelleentarkastustuloksen ja valtuuttaa sitten luovutuksen — tai eskaloi vaihtoon, hylkäyseen, romutukseen tai asiakkaan suostumukseen. Yhtään korjattua lautaa ei pakata eikä lähetetä ilman valtuutettua laadullista luovutusta.'

quality_safeguards:
  tagline: Laadunsuojakeinot
  title: Virheiden torjuntasäännöt, jotka suojaavat brändiäsi
  subtitle: Kovat valvonnat, jotka estävät valvomattomat korjaussilmukat — yksi dokumentoitu korjaus virhettä kohti, erätason hälytysrajat, kalibroitu instrumentaatio ja ohjatut testiolosuhteet.
  features:
    - icon: 1
      icon_bg: blue
      title: Yksi korjaus virhettä kohti
      desc: 'Yhtä kohtaa saa korjata kerran valtuutetun ohjeen mukaisesti. Jos uudelleentarkastus yhä epäonnistuu, lauta eskaloidaan vaihtoon, hylkäyseen, romutukseen tai asiakkaan suostumukseen — toistuva korjaus ilman dokumentoitua hyväksyntää ei ole sallittu.'
    - icon: 2
      icon_bg: green
      title: Eräkohtainen hälytys ja linjapysäytys
      desc: 'Kun tuotantoerän vaatimustenvastaisuus ylittää tuotetekniikan asettaman rajan, linja pysäytetään ja Tuotetekniikka tutkii syyn — materiaalierän, prosessin olosuhteet ja kirjaukset — ennen tuotannon jatkamista.'
    - icon: 3
      icon_bg: purple
      title: Kalibroitu instrumentaatio
      desc: 'Ilmatiiviystestauksessa käytettävät painemittarit, digitaaliset manometrit ja ajastimet ovat valvottuja ja kolmansien osapuolten laboratorioiden kalibroimia voimassaoloaikansa kuluessa, ja kalibrointitila on näkyvissä tarkastusalueella.'
    - icon: 4
      icon_bg: orange
      title: Ohjatut testiolosuhteet
      desc: 'Ilmatiiviystestaus- ja kovettumisalueet pidetään ohjatussa ympäristössä, jotta tuloksiin ei vaikuta vuorokauden lämpötilan vaihtelu.'

rework_boundaries:
  tagline: Laajuus ja rajat
  title: Mitä tämä järjestelmä ei koske
  body: |
    Korjauksen valvontajärjestelmä koskee valmiita tai prosessissa olevia puhallettavia SUP-laudoja, joissa on havaittu ilmanvuoto, paineen säilymisen epäonnistuminen tai siihen liittyvä ilmajärjestelmän virhe ennen lähetysluovutusta. Se ei valtuuta muutoksia hyväksyttyyn rakenteeseen, materiaaleihin, kuvitukseen, tuotekokoonpanoon tai asiakkaan vaatimuksiin, eikä se kata seuraavia:

    - Tuotteita, jotka on jo lähetetty tai jotka ovat asiakkaan kanavissa.
    - Rakenteellisia vahinkoja tai laudan vääntymistä, joita Tuotetekniikka ei ole arvioinut.
    - Laajaa kiskon tai sauman vikaa, ydinkuitumateriaalin vahinkoa tai virheitä, jotka voivat vaikuttaa turvallisuuteen.
    - Projekteja, joissa korjaus ei ole sallittu: asiakkaan hyväksymät näytteet, sertifiointi- tai testiyksiköt.
    - Projekteja, joissa on asiakkaan omia prosesseja, erikoismateriaaleja tai erityisiä korjausvaatimuksia.
    - Toistuvan vuodon, jota ei voida paikantaa, tai lautoja, jotka epäonnistuvat uudelleen korjauksen jälkeen.

    Mikään poikkeama asiakkaan määrityksistä vaatii dokumentoidun tuoteteknisen katselmuksen ja sovelluksen mukaisesti asiakkaan kirjallisen hyväksynnän. Laudat, joita ei voida palauttaa alkuperäiseen määritykseensä, luovutetaan vain asiakkaan nimenomaisella suostumuksella — eikä koskaan tuotannon päätöksellä.

method_cards:
  tagline: Menetelmäkorttijärjestelmä
  title: Ohjattujen korjausmenetelmäkorttien hakemisto
  subtitle: 'Yleinen ohje valvoo prosessia; menetelmäkortit valvovat toimenpidettä. Korjausohje (WI-QC-AT-001) viittaa menetelmäkortteihin MC-RW-01–MC-RW-06 sekä MC-RW-00:aan, joka koskee pakollista romutusta ja hylkäämistä.'
  headers:
    code: Menetelmäkortti
    defect: Virheluokka
    scope: Sovellusalue
    controls: Keskeiset tuotetekniset valvonnat
    approval: Allekirjoitusvaltuutus
  rows:
    - code: MC-RW-01
      defect: Luokka A (venttiiliraja)
      scope: 'Venttiilin rungon huolto, tiivisteen puhdistus ja uudelleenkokoonpano'
      controls: 'Kalibroitu momenttiavain, puhdas tiivisteen pinta, ei vahinkoa venttiilin kierteisiin'
      approval: 'Laadunvalvonnan tarkastaja'
    - code: MC-RW-02
      defect: Luokka B (venttiilin reuna)
      scope: 'Venttiilin pohjan laippatiivisteen tiivistys ja ohjattu puristus'
      controls: 'Ohjattu pinnan esikäsittely, hyväksytty liimamateriaali, pyöreä painofixture'
      approval: 'Laadunvalvonta + Tuotetekniikka'
    - code: MC-RW-03
      defect: Luokka C (pinnan mikrovuoto)
      scope: 'Ei-rakenteellisten neulansuojojen tiivistys'
      controls: 'Hyväksytty kaksikomponenttinen liima, ei valumista kuvitukseen tai EVAan'
      approval: 'Laadunvalvonta + Tuotetekniikka'
    - code: MC-RW-04
      defect: Luokka D (paikallinen kiskon sauma)
      scope: 'Paikallisen kiskon päällekkäissauman uudelleenliimaus'
      controls: 'Lämpötilasäädelty lämpöaktivointi, puristustela, kihdistymisenesto-fixture'
      approval: 'Tuotetekniikka + Laadunvarmistuksen päällikkö'
    - code: MC-RW-05
      defect: Luokka B/C (lisävarusteen reuna)
      scope: 'Evälaatikon paikkauksen ja lisävarusteiden asennuspohjan tiivistys'
      controls: 'Pinnan tarttumisen edistäjä, profiloitu puristuslohko, määritelty pitoaika'
      approval: 'Laadunvalvonta + Tuotetekniikka'
    - code: MC-RW-06
      defect: Luokka D (keula-/häntäsauma)
      scope: 'Korkean rasituksen kaarevien saumojen käsittely'
      controls: 'Hyväksytty suuren leikkauskuorman liimamateriaali, pidennetty kovettumisaika ennen uudelleentestausta'
      approval: 'Päällikköinsinööri'
    - code: MC-RW-00
      defect: Luokka E/F/G (kriittinen / halkeilu)
      scope: 'Pakollinen romutus ja fyysinen tuhointi'
      controls: 'Fyysinen katkaisu sekaantumisen estämiseksi, romutuskirjaus, osastojen välinen juurisyntianalyysi'
      approval: 'Tehtaanjohtaja'

inspector_friendly:
  tagline: Kolmannen osapuolen tarkastus
  title: Tarkastajaystävällinen protokolla
  body: |
    Tarjoamme oman tarkastusalueen, jossa on kalibroidut painemittarit, standardoidut valopöydät sauma- ja kuvitustarkistuksiin sekä valmiiksi täytetyt tarkastuskohdet, jotta kolmannen osapuolen toimistot (SGS, BV, Intertek, QIMA) voivat suorittaa esilähetystarkastuksen tehokkaasti — säästäen tarkastuskustannuksiasi.

    Jokainen kohde kokoaa yhteen sovellettavat asiakirjarevisiot, hyväksytyn näytteen viitteen, laadulle kriittiset tarkistukset, sovitun otostason, toiminnalliset testit sekä PO:n pakkaus- ja viivakoodivaatimukset. Määritetyt määrät, laatu, pakkaus ja perusturvallisuuskohteet varmennetaan hyväksyttyjä projektiviittauksia vasten — eikä paikan päällä tarvitse viime hetkellä etsiä asiakirjoja.

