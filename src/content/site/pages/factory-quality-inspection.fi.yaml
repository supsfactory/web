answer:
  label: 'Suora vastaus'
  text: 'QINGDAO VATRAD GROUP.,LTD. valvoo puhallettavien SUP-laatujen laatua 4-vaiheisella todennusjärjestelmällä: saapuvan materiaalin valvonta (IQC), prosessin aikainen laadunvalvonta (IPQC), lopputarkastus ja täyttövarmennus (FQC) sekä pakkaus ja lähetystä edeltävä luovutus (OQC). Jokainen tilaus tarkastetaan hyväksytyn näytteen, teknisen määrityksen, artwork-vedoksen, materiaaliluettelon ja pakkausstandardien mukaan, mukaan lukien ilmatiiviyden varmennus, silmämääräiset ja mittatarkastukset, lisävarusteiden vahvistus ja erän jäljitettävyys. Hyväksymiskriteerit täyttämättömät kohteet siirretään ohjattuun pidätykseen tai eristykseen, korjataan vain hyväksytyn ohjeen mukaisesti ja tarkastetaan uudelleen ennen valtuutettua luovutusta.'
  verified: 'Syyskuu 2026'

intro: 'Laadunjärjestelmämme on rakennettu OEM/ODM-hankkeita varten: tarkastuskriteerit määritellään tilauksen mukaan, dokumentoidaan ja niitä noudattavat tuotanto- ja laatatiimit saapuvasta materiaalista pakkaukseen. Näin laatuodotukset pysyvät tehtaan ja brändisi välillä yhtenäisinä aina ensimmäisestä näytteestä täysiin kontillislähetyksiin.'

scope_note:
  tagline: Laajuus
  title: Projektikohtaiset tarkastuskriteerit
  body: |
    Laatumääritykset voivat vaihdella laudan rakenteen (esimerkiksi yksi-/kaksikerros, kudottu drop-stitch, fuusioitu kisko), suunnitellun loppukäytön, kohdemarkkinoiden sääntelyn ja asiakkaan hyväksymien parametrien mukaan. Lopullinen luovutusvaltuutus perustuu ehdottomasti tilauksen osalta sovittuihin dokumentoituihin tarkastuskriteereihin.

stages:
  tagline: Laatukehys
  title: 4-vaiheinen laaduntodennusjärjestelmämme
  subtitle: Täydellinen laadunvalvontasilmukka raaka-aineen saapumisesta lähetysluovutukseen.
  steps:
    - title: '1. Saapuvan materiaalin valvonta (IQC)'
      desc: 'Päämateriaalit ja hankitut osat tarkastetaan hyväksyttyjä määrityksiä ja referenssinäytteitä vasten ennen tuotantolinjalle tuloa. Drop-stitch ja PVC varmennetaan materiaalin tunnistuksen, toimittajaerän, painon/tiheyden, paksuuden, värin osalta hyväksyttyjä näyttöihin sekä pintavirheiden osalta. EVA-koostumatyynyt tarkastetaan kuvion, värin, paksuuden, leikkaustarkkuuden ja liiman sopivuuden osalta. Venttiilit ja osat käyvät läpi toimivuus-, kierre-, tiivistys- ja istuvuustestit. Lisävarusteet ja pakkaukset (pumput, melat, evät, ranneremmet, laukut, laatikot) täsmäytetään määrän, värin, brändäyksen, viivakoodin tarkkuuden ja artwork-version osalta hyväksyttyyn materiaaliluetteloon.'
    - title: '2. Prosessin aikainen laadunvalvonta (IPQC)'
      desc: 'Kriittiset valmistusvaiheet tarkastetaan, jotta vaatimustenvastaisuudet löytyvät ennen kuin laudat siirtyvät seuraaviin työpisteisiin. Leikkaus ja tulostus varmennetaan paneelin mittojen, artworkin asettelun, peilikuvion suunnan ja reunojen siisteyden osalta hyväksyttyjä teknisiä piirustuksia vasten. Laudan kokoonpano ja kiskojen liimaus tarkastetaan muodon symmetrian, sauman päällekkäisyyden jatkuvuuden ja tyhjien tai ilmataskujen poistamisen osalta korkean rasituksen alueilta. Venttiilin ja lisävarusteiden asennus, kuvitus ja brändäys varmennetaan sijainnin, suunnan, liiman peittävyyden, logon kirjoituksen ja artwork-version osalta.'
    - title: '3. Laudan lopputestaus ja täyttövarmennus (FQC)'
      desc: 'Valmiit laudat läpikäyvät pakollisen fyysisen ja rakenteellisen testauksen ennen pakkaushyväksyntää. Laudat täytetään projektissa hyväksyttyyn tarkastuspaineeseen ja pidetään täytössä rakenteellisen jäykkyyden ja painevakauden varmistamiseksi. Ilmatiiviysskannaus kattaa venttiilin kotelon, kiskon saumat, keula- ja häntäkartion sekä jännityskohdat kalibroituin vuodon tunnistusmenetelmin (paineenlaskun seuranta tai kuplatesti). Ulkonäkö- ja mittatarkastus varmentaa mitat, keikkoprofiilin ja EVA-alustan kohdistuksen (toleranssi ±2 mm) päivänvalon vaatimukset täyttävässä valaistuksessa.'
    - title: '4. Pakkaus ja lähetystä edeltävä luovutus (OQC)'
      desc: 'Kattava lähetystä edeltävä varmennus varmistaa, ettei SKU-kokoonpanossa eikä lähetysmerkinnöissä ole lainkaan poikkeamia. Sarjan täydellisyys tarkistetaan ristiin tilauksen materiaaliluetteloa vasten: lauta, evä, ranneremmi, mela, pumppu, laukku, korjaussarja ja käyttöohje. Pakkaus- ja viivakooditarkistukset varmennukset tarkastavat laatikkomerkinnät, SKU-etykkeet, viivakoodin luettavuuden, ohjeen kielen ja laatikoiden rakenteellisen eheyden. Tilaukset luovutetaan vasta, kun valtuutettu laatuhenkilö on allekirjoittanut lopullisen pakkausauditoinnin.'

inspection_points:
  tagline: Tarkastuksen kattavuus
  title: Tarkastuksen keskeiset valvontapisteet
  subtitle: Jokainen tarkastuspiste toteutetaan tilauksen osalta sovitun dokumentoidun hyväksymiskriteeristön mukaan.
  features:
    - icon: A
      icon_bg: blue
      title: Ilmatiiviysvarmennus
      desc: 'Valmiit laudat täytetään hyväksyttyyn tarkastuspaineeseen ja tarkastetaan paineen säilymisen, venttiilin pohjan kunnon, kiskon saumojen, keulan ja hännän sekä korkean rasituksen kohtien osalta. Tarkastusmenetelmän edellyttäessä epäillyt vuotoalueet tutkitaan hyväksytyin vuodon tunnistusmenetelmin.'
    - icon: B
      icon_bg: green
      title: Silmämääräinen ja mittatarkastus
      desc: 'Laudat tarkastetaan sopivassa valaistuksessa materiaalin pinnan kunnon, tulostusvirheiden, värivaihtelun, EVA-alustan kohdistuksen, ryppyjen, naarmujen, likaisuuden ja liimauksen ulkonäön osalta. Keskeiset mitat ja lisävarusteiden sijainnit varmennetaan hyväksyttyjä piirustuksia tai määrityksiä vasten.'
    - icon: C
      icon_bg: purple
      title: Lisävarusteiden ja pakkauksen varmennus
      desc: 'Täydellinen tuotekokoonpano varmennetaan ennen lähetystä: laudan malli, eväjärjestelmä, mela, pumppu, ranneremmi, kantolaukku, korjaussarja, käyttöohje ja asiakakohtaiset lisävarusteet — jokainen täsmäytetään hyväksyttyyn näytteeseen, piirustuksiin ja materiaaliluetteloon.'
    - icon: D
      icon_bg: orange
      title: Pakkaus ja lähetysluovutus
      desc: 'Pakatut yksiköt tarkastetaan SKU-kokoonpanon, lisävarusteiden täydellisyyden, tuotetietojen, viivakooditietojen, ohjeen version, laatikkomerkinnän, pakkausmäärän ja laatikoiden kunnon osalta. Lähetysluovutus valtuutetaan vasta, kun kaikki tarkastus- ja pakkausvaatimukset on täydennetty.'

traceability_intro:
  tagline: Erän jäljitettävyys
  title: Projekti- ja erätason jäljitettävyysjärjestelmä
  body: |
    Jokainen räätälöity SUP-tilaus hoidetaan yhtenäisen projektikoodin alla, joka yhdistää tekniset määritykset, hyväksytyn materiaaliluettelon, artwork-revisiot, materiaalierien numerot, pakkausviittaukset ja tarkastuskirjaukset. Tuotanto- ja tarkastuskirjauksia säilytetään kyseisen projektin ja tuotantoerän mukaan, ja jokainen erä voidaan jäljittää takaisin hyväksyttyyn tuotemääritykseen, materiaaliluetteloon, artworkiin ja pakkausviittauksiin.

    Tämä tukee tuotekokoonpanon, tarkastustilan ja vaikutusalueen tehokasta läpikäyntiä, jos laatuongelma havaitaan — laudan tai laatikon tunnuksella valmiista tuotteesta takaisin lähdekirjauksiin.

traceability_chain:
  tagline: Jäljitettävyysketju
  title: Projektikoodista lähetysluovutukseen
  subtitle: Yksi ohjattujen viittausten ketju tilauksen vahvistuksesta valtuutettuun lähetykseen.
  steps:
    - step: '01'
      title: Projektikoodi
      desc: Yhtenäinen projektiviittaus, joka yhdistää jokaisen ohjatun asiakirjan tilaukseen.
    - step: '02'
      title: Asiakirjarevisiot
      desc: Nykyisen määrityksen, materiaaliluettelon, artworkin ja pakkauksen revisiotasot — vain hyväksytyt versiot ovat tuotannossa kelvollisia.
    - step: '03'
      title: Erä ja materiaalit
      desc: Materiaali- ja osaerät, jotka on kirjattu tuotantoerää vasten.
    - step: '04'
      title: Tarkastuskirjaukset
      desc: IQC:n, prosessin aikaisen, ilmatiiviyden, lopputarkastuksen ja pakkauksen tarkastustulokset erää kohti.
    - step: '05'
      title: Pakkaus ja luovutus
      desc: Pakkauserä, NCR:n sulkutila ja valtuutetun lähetysluovutuksen yhteenveto.

traceability_sample:
  tagline: Anonymisoitu näyte
  title: Jäljitettävyysvalvontakirjaus (esimerkki)
  body: |
    Esimerkinarvot on esitetty vain havainnollistamista varten — asiakkaiden nimet, tilausnumerot, räätälöity artwork, toimittajatiedot ja kaupallinen tieto on poistettu luottamuksellisuuden suojaamiseksi.

