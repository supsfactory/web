faqs:
  - question: Şişirilebilir bir SUP üzerinde ayakta durup balık tutabilir misiniz?
    answer: Evet. Daha geniş şişirilebilir SUP’ler (33 inç ve üzeri) ayakta durma ve atış için yeterli kararlılık sağlar. Tam boy EVA güverte pedleri ıslak zeminde güvenli tutuş sunar.
  - question: Şişirilebilir bir SUP balıkçılık için uygun mu?
    answer: Şişirilebilir SUP’ler mükemmel balıkçılık platformlarıdır; özellikle sığ sularda ve sığ bölgeleri dolaşmak için. Geniş tasarımlar takım ve ekipmana kolay erişim sağlar.
  - question: Şişirilebilir bir SUP’ye ne kadar ekipman getirebilirim?
    answer: Çoğu şişirilebilir SUP toplam 220-300 lbs kapasiteyi (kürekçi ve ekipman) destekler. Takım, soğutucu ve güvenlik ekipmanı içeren tipik bir balıkçılık kurulumu 20-40 lbs ekler. Yeterli kapasiteyi doğrulamak için tahtanın hacim değerini kontrol edin.
body: |
  <h2>Neden Şişirilebilir Bir Tekneden Balık Tutmalı?</h2>
  <p>Şişirilebilir SUP’ler, balıkçılar için geleneksel teknelerin kıramayacağı benzersiz avantajlar sunar. Sığ draftları sayesinde motorlu teknelerin ulaşamadığı sulara erişir, sessiz yaklaşımları da balıkları en az rahatsız eder. Taşınabilirlik faktörü ise röntork veya tekne rampası olmadan uzak göllerde, nehirlerde ve kıyı bölgelerinde balıkçılık yapmanıza imkan verir.</p>
  <p>Ana avantajlar şunlardır:</p>
  <ul>
    <li><strong>Gizlilik</strong> —Motor gürültüsü olmadığı için balıkları ürkütmeden yaklaşabilirsiniz</li>
    <li><strong>Sığ Suya Erişim</strong> —Yalnızca birkaç inçlik draft, bataklıklarda, dereylerde ve sığlarda balık tutmanıza imkan verir</li>
    <li><strong>Taşınabilirlik</strong> —Aracınızla ulaşılamayan uzak noktalara teknenizi paketleyip götürün</li>
    <li><strong>Ayakta Durma</strong> —SUP tahtaları, suyu daha iyi görmek için ayakta durmaya imkan verir</li>
  </ul>

  <h2>Kararlılık Gereksinimleri</h2>
  <p>Balıkçılık kararlı bir platform gerektirir. Balıkçılık için bir şişirilebilir araç seçerken öncelik verin:</p>
  <ul>
    <li><strong>Genişlik</strong> —Daha geniş tahtalar (33-36 inç) ayakta durma ve atış için daha iyi kararlılık sağlar</li>
    <li><strong>Kalınlık</strong> —6 inçlik tahtalar ekipman için daha fazla rijitlik ve taşıma kapasitesi sunar</li>
    <li><strong>Hacim</strong> —Daha yüksek hacim (300+ litre), balıkçı ve ekipmanın toplam ağırlığını destekler</li>
    <li><strong>Güverte Yüzeyi</strong> —Tam boy EVA köpük güverte pedi, ıslakken kaymaz tutuş sağlar</li>
  </ul>

  <h2>Ekipman Uyumu</h2>
  <p>Şişirilebilir balıkçılık kurulumları genellikle şunları içerir:</p>
  <ul>
    <li><strong>Olta tutucular</strong> —Elde serbest kürek için klipsli veya güverteye monte olta tutucular</li>
    <li><strong>Kasa veya soğutucu</strong> —Takım ve av için bungee bağlama kayışlarıyla güverteye sabitlenir</li>
    <li><strong>Çapa sistemi</strong> —Akıntıda tutunmak için hafif katlanır çapa veya kazık direği</li>
    <li><strong>Kürek güvenlik ipi</strong> —Her iki eliniz gerektiğinde küreğin bağlı kalmasını sağlar</li>
    <li><strong>Kişisel Yüzdürme Cihazı (PFD/KYC)</strong> —Tüm balıkçılar için vazgeçilmez güvenlik ekipmanı</li>
  </ul>

  <h2>Balıkçılık İçin Önerilen Araç Tipleri</h2>
  <p>Farklı balıkçılık senaryoları farklı araç tiplerine uygundur:</p>

  <h3>Balıkçılık için SUP Tahtaları</h3>
  <p>En uygun olduğu yerler: sığlarda balıkçılık, göllerde levrek avı, sığ suda gözle balık avı. Yükseltilmiş ayakta durma konumu mükemmel görüş sağlar. Kararlılık için daha geniş bir tur veya her yönden tahta seçin.</p>

  <h3>Balıkçılık için SUP Tahtaları</h3>
  <p>En uygun olduğu yerler: çok kişilik balıkçılık seferleri, ağır ekipman taşıma ve korumalı kıyı suları. SUP’ler, taşınabilirliği korurken güverte alanı ve ağırlık kapasitesi sunar.</p>

  <h2>Güvenlik Hususları</h2>
  <ul>
    <li>Her zaman bir KYC (PFD) giyin — balıkçılık; ayakta durma, atış ve ekipman taşıma içerdiğinden düşme riskini artırır</li>
    <li>Çıkmadan önce hava durumu ve su koşullarını kontrol edin</li>
    <li>Bir düdük, su geçirmez kılıf içinde telefon ve temel bir onarım kiti taşıyın</li>
    <li>Birinin balıkçılık konumunuzu ve beklenen dönüş saatinizi bilmesini sağlayın</li>
  </ul>

  <h2>SSS</h2>
  <h3>Şişirilebilir bir SUP üzerinde ayakta durup balık tutabilir misiniz?</h3>
  <p>Evet. Daha geniş şişirilebilir SUP’ler (33 inç ve üzeri) ayakta durma ve atış için yeterli kararlılık sağlar. Tam boy EVA güverte pedleri ıslak zeminde güvenli tutuş sunar.</p>

  <h3>Şişirilebilir bir SUP’ye ne kadar ekipman getirebilirim?</h3>
  <p>Çoğu şişirilebilir SUP toplam 220-300 lbs kapasiteyi (kürekçi ve ekipman) destekler. Takım, soğutucu ve güvenlik ekipmanı içeren tipik bir balıkçılık kurulumu 20-40 lbs ekler. Yeterli kapasiteyi doğrulamak için tahtanın hacim değerini kontrol edin.</p>

