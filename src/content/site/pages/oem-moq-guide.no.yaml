moq_stages:
  tagline: 'Prøve · Pilot · Volum'
  title: 'Tre tydelig atskilte antallsnivåer'
  subtitle: 'Produksjonsantallene for prøve, pilot og volum skiller seg fra hverandre. Hvert prosjekt deles inn i tre separate faser, slik at du kan validere før du binder deg.'
  steps:
    - step: '01'
      title: 'Prøveutvikling (1–2 enheter)'
      desc: 'Fysisk bekreftelse av skrogets stivhet, det sklisikre EVA-deckpadets vedheft, grafikkens presisjon og tilbehørets passform før enhver økonomisk forpliktelse. Prøveprisene gjelder og trekkes fra produksjonsbestillingen etter signert kontrakt.'
    - step: '02'
      title: 'Pilotbestilling (20–50 enheter)'
      desc: 'Kommersielle tester før sesongen og regional markedsvalidering med eksisterende skrogplattformer, standardmateriale og forenklet emballasje, for å minimere innstillingsarbeidet.'
    - step: '03'
      title: 'Volumproduksjon (90–100+ enheter)'
      desc: 'Bekreftes etter frosset BOM, ferdig artwork, tilpasset emballasje og planlagte leveringsdatoer — hele ruller på 150 m, tilpassede Pantone-stoffer, skreddersydd emballasje, volumbonus og fullstendig partisporbarhet gjennom hele forsyningskjeden.'

