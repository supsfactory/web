why_north_america:
  tagline: 'Miksi Yhdysvaltain ja Kanadan ostajat'
  title: 'Rakennettu Pohjois-Amerikan tuonnille'
  subtitle: 'Tehtaan vastaukset niihin kysymyksiin, joita yhdysvaltalaiset ja kanadalaiset brändit kysyvät ennen ensimmäistä konttiaan.'
  items:
    - title: 'DDP ennustettavaa lopputoimituskustannusta varten'
      description: 'DDP sisältää tulliselvityksen ja toimituksen varastoosi — tullit, verot ja rahti yhdessä kokonaissummassa. Suosituin valinta ensimmäistä kertaa tuoville maahantuojille.'
    - title: 'Asiakirjat kohdemarkkinalle'
      description: 'CE-, REACH- ja tulliasiakirjat laaditaan kohdemarkkinoillesi hyväksytyn näytteen rinnalle, joten tuotetiedostosi on vientivalmis.'
    - title: 'FOB Qingdao omalla huolitsijallasi'
      description: 'Tuo säännöllisesti? Ota FOB Qingdao ja käytä omaa logistiikkakumppaniasi — me lastaamme ja dokumentoimme kontin, sinä hallitset loput.'
    - title: 'Yksi tehdas, yksi laatujärjestelmä'
      description: 'Kehittely, näytteenotto, tuotanto ja laadunvalvonta tapahtuvat kaikki 12,500 m² laitoksessa — ei välittäjän edesttakaisin kulkua eikä näytteitä, joita tuotanto ei pysty vastaamaan.'

process_notes:
  tagline: 'Näin se toimii'
  title: 'Määrityksestä konttiin'
  subtitle: 'Samat kuusi vaihetta riippumatta siitä, ostatko kaksi konttia vuodessa vai kaksikymmentä: määritykset, suunnittelu, näytteenotto, testaus, muottityö, tuotanto — sitten FOB-, CIF- tai DDP-toimitus.'
  items:
    - title: '1. Lähetä määrityksesi'
      description: 'Riittää vertailulauta, piirros tai kilpailijan määritys. Suunnittelukatsaus ja tarjous palautetaan yhden arkipäivän kuluessa.'
    - title: '2. Hyväksy näyte'
      description: 'Ensimmäinen fyysinen näyte lähetetään 7–12 päivässä mukana hyväksymislomake, joka kattaa rakenteen, painovärit ja painetestitulokset.'
    - title: '3. Tuotanto ja vienti'
      description: 'Erat valmistuvat 25–35 päivässä prosessin sisäisillä laadunvalvontatarkistuspisteillä. Pakkausluettelo, lasku ja konossaintti lähtevät ennen alusta.'
    - title: '4. Toimitus varastoosi'
      description: '4–6 viikkoa merirahtia Yhdysvaltain tai Kanadan satamiin — DDP-ehdoilla hoidamme selvityksen ja toimituksen ovelle asti.'

faq_section:
  tagline: UKK
  title: 'Pohjois-Amerikan tuonnin kysymykset'
  questions:
    - q: Kuinka kauan merirahti Yhdysvaltoihin tai Kanadaan kestää?
      a: 'Varauta 4–6 viikkoa Qingdaon satamasta Yhdysvaltain tai Kanadan satamiin kohdetta ja laivavuoroaikataulua riippuen. DDP-projekteissa mukana on koko ovelta ovelle -aikataulu.'
    - q: Lähetättekö DDP:ta Yhdysvaltoihin ja Kanadaan?
      a: 'Kyllä. DDP sisältää merirahdin, tulliselvityksen, tullit ja verot sekä toimituksen varastoosi — yksi ennustettava kokonaishinta. FOB Qingdao ja CIF ovat myös saatavilla.'
    - q: Mikä on private label -SUP-tuonnin MOQ?
      a: 'MOQ vahvistetaan projektin konfiguraation perusteella: näytekehitys kattaa 1–2 kpl, pilottierät 20–50 kpl olemassa olevilla alustoilla, ja vakiomääräinen tuotanto 90–100+ kpl per malli täydestä 150 m drop-stitch-rullasta.'
    - q: Mitä asiakirjoja toimitatte tuonnin varten?
      a: 'Hyväksytty näyte lähetetään mukana kohdemarkkinoillesi laaditut CE- ja REACH-asiakirjat, ja jokaisen kontin mukana kulkee pakkausluettelo, lasku ja konossaintti.'
    - q: Mitkä Yhdysvaltain vaatimustenmukaisuusasiakirjat toimitatte SUP-laudoille?
      a: 'Aikuisten puhallettavat SUP-laudat eivät ole lastentuotteita, joten CPSIA:n kuluttajatuotesäännöt eivät yleensä sovellu. Kalifornian Prop 65 on arviointi, jonka teet harkintasi mukaan merkinnässä — tilauksikohtainen REACH/RoHS-materiaalidokumentaatiomme tukee sitä. USCG-vaatimustenmukaisia asiakirjoja voidaan tukea, jos tuoteluokkasi sitä vaatii, ja nimetty projektisi insinööri vahvistaa tarkat asiakirjat, joita lakimiesi tai jälleenmyyjäsi pyytää, ennen tuotannon alkua.'
    - q: Voinko vierailla tehtaalla ennen tilaamista?
      a: 'Kyllä. Qingdaon 12,500 m² laitos on avoinna asiakkaille — virtuaalinen tehtasketsikierros voidaan järjestää verkossa, ja paikan päällä käynnit voidaan toteuttaa tuotantolinjoja ja laadunvalvontapisteitä ohjaten.'
    - q: Miten aloitan projektin Yhdysvalloista tai Kanadasta?
      a: 'Lähetä vertailulauta, piirros tai määritys. Suunnittelukatsaus ja tarjous palautetaan yhden arkipäivän kuluessa, ja NDA allekirjoitetaan ennen tiedostojen vaihtoa.'

