answer:
  label: 'Suora vastaus'
  text: 'Pohjois-Amerikan brändit tilaavat puhallettavia SUP-laudoja iSupfactorylta vakiosehdoilla: MOQ vahvistetaan projektin konfiguraation perusteella: 1–2 kpl:n näyte-erät varmistavat rakenteen, 20–50 kpl:n pilottierät testaavat markkinaa olemassa olevilla alustoilla, ja vakiomääräinen tuotanto 90–100+ kpl per malli täydestä 150 m drop-stitch-rullasta. Ensimmäinen näyte lähetetään 7–12 päivää määritysten hyväksynnän jälkeen, tuotanto 25–35 päivää vahvistetun tilauksen ja käsirahan jälkeen, ja merirahti lisää 4–6 viikkoa Yhdysvaltain tai Kanadan satamiin. DDP kattaa tulliselvityksen ja toimituksen varastoosi.'
  verified: 'September 2026'

