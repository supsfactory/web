ip_rules:
  tagline: 'Beskyttelse av immateriell eiendomsrett'
  title: 'Slik beskytter vi designen og merket ditt'
  subtitle: 'Uansatt samarbeidsmodell forblir artworket, formverktøyene og spesifikasjonsfilene dine egne.'
  body: |
    **NDA før filutvekslingen.** Vi signerer en hemmelighetsavtale før enhver utveksling av tekniske filer — standard svartid innen 4 arbeidstimer.

    **Ingen gjenbruk av design.** Artworket, formverktøyene og spesifikasjonsfilene dine deles eller selges aldri til andre kunder. OEM-formverktøy er eksklusivt ditt. ODM-design godkjennes av deg før produksjonen. Private Label-plattformer er delte strukturer, men grafikken og merkesettingen din er eksklusiv.

    **Kun B2B.** Vi produserer utelukkende under kundenes merker. Vi selger ikke til sluttbrukere og konkurrerer ikke med kundene våre i noe marked.

    **Eierskap til formverktøy.** Egne formverktøy som er betalt av kjøperen tilhører kjøperen. Vi oppbevarer og vedlikeholder dem, men får ikke bruke dem for andre kunder uten skriftlig tillatelse.

faqs:
  tagline: 'FAQ'
  title: 'Vanlige spørsmål om OEM, ODM og Private Label'
  items:
    - q: 'Kan jeg senere bytte fra Private Label til OEM?'
      a: 'Ja. Mange kunder starter med Private Label-produksjon eller en pilot for å validere markedet og investerer deretter i eget utstyr for et fullstendig OEM-program når etterspørselen er dokumentert. Samme fabrikk og samme QC-system støtter begge sporene.'
    - q: 'Betyr ODM at fabrikken eier merket mitt?'
      a: 'Nei. Ved ODM eier du merket, grafikken og emballasjen. Fabrikken utvikler brettets struktur ut fra briefingen din, og du godkjenner designen før produksjonen. Fabrikken beholder IP-en i utviklingsprosessen, men den godkjente produktspesifikasjonen er din.'
    - q: 'Er Private Label av dårligere kvalitet enn OEM?'
      a: 'Nei. Alle tre sporene går gjennom samme fabrikk, samme QC-system og samme eksportteam. Private Label-brett bygges på dokumenterte, validerte plattformer, med hele trykktesten på 18 PSI/24 timer og samme 100-punkts montasjeliste.'
    - q: 'Hva gjør jeg hvis jeg ikke er sikker på hvilken modell jeg skal velge?'
      a: 'Kontakt oss om situasjonen din — det tekniske teamet vårt rådgir om det mest praktiske sporet ut fra produktenes krav, planleggingen din og antallsmålene dine. Det er ingen forpliktelse før spesifikasjonsgjennomgangen.'
    - q: 'Kan jeg få prøveeksemplarer før jeg velger modell?'
      a: 'Ja. 1–2 prototypeprøver sendes innen 7–12 dager. Prøvekostnadene trekkes fra storbestillingen din. Slik kan du vurdere konstruksjon og kvalitet før enhver volumforpliktelse.'

