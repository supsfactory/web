hero:
  tagline: 'Velg samarbeidsmodellen din'
  title: 'OEM vs. ODM vs. Private Label — hvilken modell passer prosjektet ditt?'
  subtitle: 'Tre måter å samarbeide med en SUP-fabrikk på, hver med ulikt eierskap, ulike investeringer og en annen avveining mellom fart og kontroll. Denne guiden forklarer forskjellene, slik at du velger riktig spor før den første forespørselen.'

answer:
  label: 'Hurtig sammenligning'
  text: 'OEM: du eier design og spesifikasjon — vi produserer i henhold til tegningene dine. ODM: det tekniske teamet vårt utvikler brettet ut fra briefingen din — du godkjenner før produksjonen. Private Label: merket ditt på en eksisterende, dokumentert plattform uten strukturelle endringer — raskeste vei til markedet. Alle tre sporene går gjennom samme fabrikk, samme QC-system og samme eksportteam i Qingdao, Kina.'
  verified: 'September 2026'

comparison_table:
  tagline: 'Side om side'
  title: 'OEM / ODM / Private Label sammenlignet'
  subtitle: ' Vesentlige forskjeller i designeierskap, MOQ, formverktøy, leveringstider og immateriell eiendomsrett.'
  headers:
    dimension: Dimensjon
    oem: OEM-produksjon
    odm: ODM-utvikling
    pl: Private Label
  rows:
    - dimension: ' Hvem designer brettet?'
      oem: 'Du leverer spesifikasjon, tegninger eller et referansebrett'
      odm: 'Fabrikkens tekniske team utvikler ut fra briefingen din'
      pl: 'Eksisterende fabrikkplattform — ingen designinnsats'
    - dimension: 'Eierskap til design og IP'
      oem: 'Du eier all design, formverktøy og den immaterielle eiendomsretten'
      odm: 'Du eier den godkjente sluttdesignen; fabrikken beholder IP-en i utviklingsprosessen'
      pl: 'Fabrikken eier plattformdesignen; du eier merke og grafikk'
    - dimension: 'Formverktøy / utstyr'
      oem: 'Eget formverktøy kreves for nye former — engangskostnad for utstyr, +15–20 dager'
      odm: 'Kan kreve eget formverktøy avhengig av spesifikasjon — samme utstyrsplanlegging'
      pl: 'Ingen nytt formverktøy — eksisterende plattformutstyr brukes'
    - dimension: 'Minste bestillingsmengde'
      oem: '90–100+ enheter per godkjent konfigurasjon'
      odm: '90–100+ enheter per godkjent konfigurasjon; pilotpartier på 20–50'
      pl: '5–10 enheter (co-branding) eller 20–50 (pilotparti på eksisterende plattform)'
    - dimension: 'Vanlig leveringstid'
      oem: '25–35 dager + 15–20 dager for utstyr ved nytt formverktøy'
      odm: '25–35 dager + utviklingsiterasjon (varierer med kompleksiteten)'
      pl: '25–35 dager (ingen forsinkelse fra formverktøy)'
    - dimension: 'Tilpasningsnivå'
      oem: 'Totalt — form, konstruksjon, materiale, grafikk, emballasje'
      odm: 'Totalt — fabrikken foreslår, du godkjenner hvert element'
      pl: 'Bare grafikk og emballasje — ingen strukturelle endringer'
    - dimension: 'Prøveprosess'
      oem: '1–2 prototypeprøver på 7–12 dager etter spesifikasjonsgodkjenning'
      odm: '1–2 prototypeprøver på 7–12 dager etter designgodkjenning'
      pl: '1–2 prøveeksemplarer på 7–12 dager — plattformen er allerede validert'
    - dimension: 'Ideelt for'
      oem: 'Kjøpere med eksisterende design, referansebrett eller detaljerte spesifikasjoner'
      odm: 'Kjøpere med produktidéer eller markedskrav, men uten detaljert spesifikasjon'
      pl: 'Kjøpere som raskt vil ha merkede brett uten produktutvikling'

