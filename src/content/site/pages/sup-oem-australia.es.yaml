hero:
  tagline: 'Australia'
  title: 'Fabricante OEM de SUP hinchables para Australia — stock antes de tu temporada'
  subtitle: 'Muestra en 7–12 días, producción en 25–35 días, flete marítimo de 4–6 semanas a Sídney, Melbourne o Brisbane. Los compradores del hemisferio sur planifican con 3–4 meses de antelación para que el stock llegue antes de la temporada de diciembre a febrero.'

answer:
  label: 'Respuesta directa'
  text: 'Las marcas australianas piden SUP hinchables a SUPsfactory con condiciones estándar: MOQ confirmado por configuración del proyecto: muestra de 1–2 unidades, lote piloto de 20–50 unidades y producción de volumen estándar de 90–100+ unidades por diseño a partir de un rollo completo de drop-stitch de 150 m. La primera muestra sale en 7–12 días tras la aprobación de la especificación, la producción transcurre en 25–35 días tras el PO y el depósito confirmados, y el flete marítimo añade 4–6 semanas a Sídney, Melbourne o Brisbane. Entre producción y flete, pide con 3–4 meses de antelación para tener stock en la tienda; el DDP incluye despacho de aduanas y entrega en tu almacén.'
  verified: '2026-08'

