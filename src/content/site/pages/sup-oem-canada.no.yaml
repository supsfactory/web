hero:
  tagline: 'Canada'
  title: 'OEM oppblåsbare SUP for Canada — fra Qingdao til lageret ditt'
  subtitle: 'Prøver innen 7–12 dager, produksjon på 25–35 dager, sjøfrakt på 4–6 uker til havnene i Vancouver, Toronto eller Montreal. FOB Qingdao, CIF eller DDP — samme fabrikk, samme QC, samme seksfaseutviklingsprosess som for alle iSupfactory-kunder.'

answer:
  label: 'Kort svar'
  text: 'Kanadisiske merker bestiller oppblåsbare SUP hos iSupfactory under standardvilkår: MOQ bekreftes av prosjektkonfigurasjonen: prøvesykluser med 1–2 stk validerer konstruksjonen, små pilotserier med 20–50 stk tester markedet på eksisterende plattformer, og standardvolumserier går med 90–100+ stk per design fra en hel drop-stitch-rull på 150 m. Den første prøven sendes 7–12 dager etter at spesifikasjonene er godkjent, produksjonen tar 25–35 dager etter bekreftet PO og depositum, og sjøfrakten kommer i tillegg med 4–6 uker til de kanadisiske havnene — Vancouver på vestkysten, Toronto og Montreal i øst. DDP dekker tollbehandling og levering til lageret ditt.'
  verified: 'September 2026'

