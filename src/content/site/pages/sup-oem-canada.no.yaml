why_canada:
  tagline: 'Hvorfor kjøpere i Canada'
  title: 'Bygd for kanadisk import'
  subtitle: 'Fabrikken besvarer spørsmålene kanadisiske merker og forhandlere stiller før sin første container.'
  items:
    - title: 'DDP for planleggbare destinasjonskostnader'
      description: 'DDP omfatter tollbehandling og levering til lageret ditt — importtoll, avgifter og frakt i ett totalbeløp i CAD eller USD. Det mest populære valget for nye importører.'
    - title: 'Forbindelse til vest- og østkysten'
      description: 'Vi regner på sjøfrakt til Vancouver, eller til Toronto og Montreal via Suezruten — avhengig av hva som gir best balanse mellom transitid og destinasjonskostnad.'
    - title: 'Tospråkige produktdokumenter'
      description: 'CE-, REACH- og toll dokumentasjon utarbeides for målmarkedene dine, slik at produktdokumentene dine fungerer for emballasjekravene på engelsk og fransk.'
    - title: 'Én fabrikk, ett kvalitetssystem'
      description: 'Utvikling, prøver, produksjon og QC skjer alle i fabrikken på 12 500 m² — ingen omveier via mellomledd, ingen prøve som produksjonen ikke kan reprodusere.'

process_notes:
  tagline: 'Slik fungerer det'
  title: 'Fra spesifikasjon til container'
  subtitle: 'De samme seks fasene, uansett om du kjøper to eller tjue containere per år: spesifikasjon, konstruksjon, prøve, verifisering, verktøybygging, produksjon — deretter levering FOB, CIF eller DDP.'
  items:
    - title: '1. Send spesifikasjonen din'
      description: 'Et referansebrett, en skisse eller en konkurrentens spesifikasjon er nok. Teknisk verifisering og tilbud følger innen én arbeidsdag.'
    - title: '2. Godkjenn prøven'
      description: 'Din første fysiske prøve sendes innen 7–12 dager med en godkjenningsblankett for konstruksjon, trykkfarger og resultatene av trykktestingen.'
    - title: '3. Produksjon & eksport'
      description: 'Syklusene fullføres på 25–35 dager med QC-kontrollpunkter under produksjonen. Pakkeliste, faktura og bill of lading går før skipet.'
    - title: '4. Levering til lageret ditt'
      description: '4–6 ukers sjøfrakt til Vancouver, Toronto eller Montreal — med DDP håndterer vi tollbehandlingen og leveransen til døren din.'

faq_section:
  tagline: Vanlige spørsmål
  title: 'Spørsmål om import til Canada'
  questions:
    - q: Hvor lang tid tar sjøfrakten til Canada?
      a: 'Regn med 4–6 uker fra Qinhaos havn til de kanadisiske havnene — Vancouver på vestkysten, Toronto og Montreal i øst — avhengig av destinasjon og avgangsskjema. DDP-prosjekter omfatter hele tidslinjen dør til dør.'
    - q: Sender dere DDP til Canada?
      a: 'Ja. DDP omfatter sjøfrakt, tollbehandling, importtoll og avgifter pluss levering til lageret ditt — én planleggbar totalpris. Også FOB Qingdao og CIF er tilgjengelig.'
    - q: Hva er MOQ for en private label-SUP-import?
      a: 'MOQ bekreftes av prosjektkonfigurasjonen: prøveutviklingen omfatter 1–2 stk, små pilotserier går med 20–50 stk på eksisterende plattformer, og standardvolumserier går med 90–100+ stk per design fra en hel drop-stitch-rull på 150 m.'
    - q: Støtter dere emballasje på engelsk og fransk?
      a: 'Ja. Prepress-teamet vårt forbereder trykkfilene for målmarkedenes språk og regler — inkludert tospråkig EN/FR-emballasje for det kanadiske markedet.'
    - q: Kan jeg besøke fabrikken før bestillingen?
      a: 'Ja. Fabrikken på 12 500 m² i Qingdao er åpen for kunder — virtuelle fabikkvisninger kan bestilles online, og fysiske besøk ledes langs produksjonslinjene og QC-stasjonene.'
    - q: Hvordan starter jeg et prosjekt fra Canada?
      a: 'Send et referansebrett, en skisse eller en spesifikasjon. Den tekniske verifiseringen og tilbudet kommer innen én arbeidsdag, og en NDA signeres før hver filutveksling.'

