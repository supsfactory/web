values_section:
  title: Wie die Fabrik mit Marken zusammenarbeitet
  subtitle: 'Drei Prinzipien, die jedes von der Vatrad-Fabrik gebaute Projekt prägen.'
  columns: 3
  items:
    - title: Konstruktion vor Produktion
      description: 'Jedes Projekt beginnt mit Anforderungen, Zeichnungen und einem physischen Muster — Rumpfform, Drop-Stitch-Grade, Grafikplatzierung und Verpackung werden vor jedem Produktionslauf validiert, nicht erst an der Linie entdeckt.'
      icon: 'tabler:settings'
    - title: Ein Team, eine Anlage
      description: 'Design, Zuschnitt, Schweißung, Montage und Prüfung finden in einer 12,500 m² großen Anlage statt. Keine Handelsunternehmens-Übergaben: Die Personen, die Ihre Fragen beantworten, sind dieselben, die Ihre Boards bauen.'
      icon: 'tabler:building-factory-2'
    - title: Kleine erste Läufe
      description: 'Co-Branding in kleinen Chargen beginnt bei 5–10 Einheiten, und die Standard-Serienfertigung läuft mit 90–100+ Einheiten pro Charge (eine 150-m-Drop-Stitch-Rolle) — so validieren Marken den Markt vor der Skalierung, wobei Werkzeug und Grafiken für Nachbestellungen erhalten bleiben.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Was die Fabrik liefert
  subtitle: 'Die Fertigungsdienstleistungen, die iSupfactory-Kunden zur Verfügung stehen.'
  columns: 2
  items:
    - title: Individuelle SUP-Entwicklung
      description: 'Anforderungsbewertung, Spezifikation, Materialauswahl, Grafiken, Prototyping, Musterfreigabe und Produktion für maßgeschneiderte aufblasbare SUP-Produkte.'
      icon: 'tabler:bulb'
    - title: Private-Label-Produktion
      description: 'Ihr Logo, Ihre Farben und Ihre Verpackung auf bewährten kommerziellen Plattformen — Board, Deckpad, Zubehör und Kartons tragen alle Ihre Identität, ohne Fabrikbranding.'
      icon: 'tabler:tag'
    - title: OEM-/ODM-Fertigung
      description: 'Vollständige OEM- und ODM-Fertigung aufblasbarer SUPs nach Kundenzeichnungen oder gemeinsam entwickelten Designs, einschließlich kundenspezifischer Formen für neue Boardformen.'
      icon: 'tabler:package'
    - title: Flottenversorgung
      description: 'Markierte Boardflotten für Resorts, Clubs, Schulen und Verleihbetriebe, mit passendem Zubehör und flottenfreundlichen Produktionsläufen.'
      icon: 'tabler:users-group'
certifications_section:
  title: Zertifizierung & Konformität
  subtitle: 'Die Fabrik liefert in die EU, die USA und den asiatisch-pazifischen Raum unter einem dokumentierten Konformitätssystem.'
  columns: 2
  items:
    - title: CE-Zertifizierung
      description: 'Produktlinien für aufblasbare SUPs und Wasserfahrzeuge erfüllen die EU-Sicherheitsrichtlinien, mit Dokumentation für jeden Markt.'
      icon: 'tabler:certificate'
    - title: ISO-9001-Qualitätssystem
      description: 'Die Fertigungsanlage arbeitet nach einem ISO-9001-Qualitätsmanagementsystem, das Wareneingang, Prozess- und Endkontrolle abdeckt.'
      icon: 'tabler:badge-check'
    - title: BSCI-Sozialkonformität
      description: 'Soziale Verantwortung wird nach BSCI auditiert und deckt Arbeitsbedingungen und die Compliance der Fabrik ab.'
      icon: 'tabler:shield-check'
    - title: REACH-Materialkonformität
      description: 'Die Materialien erfüllen die EU-REACH-Verordnung zur chemischen Sicherheit.'
      icon: 'tabler:flask'
    - title: USCG-Zulassung
      description: 'Von der US Coast Guard zugelassene Fertigung für Produktlinien aufblasbarer Wasserfahrzeuge.'
      icon: 'tabler:anchor'
    - title: Produktprüfung
      description: 'Auftriebs-, Tragfähigkeits-, Nahtfestigkeits-, UV-Beständigkeits-, Abriebfestigkeits- und Druckhalttests auf jeder Produktionslinie.'
      icon: 'tabler:test-pipe'
