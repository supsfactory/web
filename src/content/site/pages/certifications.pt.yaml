content_certifications:
  tagline: Certificações e padrões
  title: 'Qualidade certificada, reconhecida a nível mundial'
  subtitle: 'As certificações valem tanto quanto aquilo que cobrem. A seguir encontras o âmbito da certificação, o titular do certificado e como requerer ou verificar os documentos para o teu projeto.'
  items:
    - title: 'Marcação CE'
      description: 'A documentação de conformidade CE está disponível para as configurações aplicáveis ao mercado da UE, segundo a diretiva 2013/53/UE (embarcações de recreio); o âmbito é confirmado para cada projeto. Números de certificado e relatórios de ensaio disponíveis mediante pedido.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Sistema de gestão da qualidade certificado ISO 9001:2015, que cobre o desenvolvimento, a produção e a venda de embarcações insufláveis e equipamento náutico. Âmbito de certificação e relatórios de auditoria disponíveis mediante pedido.'
      icon: tabler:clipboard-check
    - title: 'Conformidade social BSCI'
      description: 'Avaliado segundo a BSCI (Business Social Compliance Initiative), que cobre as condições de trabalho e a conformidade da fábrica. Relatório de auditoria disponível mediante pedido.'
      icon: tabler:heart-handshake
    - title: 'Conformidade de materiais REACH'
      description: 'Os materiais cumprem o regulamento REACH da UE sobre segurança química. As declarações de materiais são fornecidas com a documentação de produção de cada envio.'
      icon: tabler:flask
    - title: 'Conformidade RoHS'
      description: 'A restrição de substâncias perigosas é documentada segundo a RoHS para os componentes e materiais aplicáveis.'
      icon: tabler:flame
    - title: 'Ensaio de materiais'
      description: 'Os tecidos são testados quanto à resistência à tração, resistência ao rasgão, degradação UV e comportamento à fratura a frio. Cada lote de produção é amostrado e verificado contra o protocolo de ensaio publicado.'
      icon: tabler:test-pipe
faqs:
  tagline: FAQ
  title: Perguntas frequentes sobre o nosso sistema de qualidade
  items:
    - q: 'Posso descarregar os relatórios de inspeção reais?'
      a: 'Sim. Os sete dossiers de relatórios bilingues desta página — QIP, IQC, IPQC/FAI, estanquicidade ao ar, FQC, PSI e libertação para envio — são registos controlados reais com os campos reservados removidos. Mostram a estrutura exata, os métodos e os critérios de aceitação utilizados em cada encomenda.'
    - q: 'Como se aplicam os sete pontos ao meu projeto?'
      a: 'Cada projeto recebe um Plano de Inspeção da Qualidade (QIP) que define os pontos aplicáveis ao teu produto e mercado, o âmbito de inspeção em cada ponto e os registos que vais receber. Descarrega a amostra QIP nesta página para veres a estrutura.'
    - q: 'Estas amostras de inspeção são reais?'
      a: 'Sim. As amostras seguem a nossa estrutura de registo controlado efetiva — cabeçalho do documento, checklist de inspeção, critérios de aceitação, método, resultados, função do inspetor e disposição de libertação. Todos os valores de identificação são substituídos por valores demonstrativos (códigos DEMO-*), para que não sejam divulgados dados de clientes, gráficas, encomendas ou preços.'
    - q: 'Porque são anonimizadas as amostras?'
      a: 'A confidencialidade dos compradores tem prioridade. Nomes de clientes, gráficas, detalhes de encomendas, informações de fornecedores e preços são protegidos by design. A anonimização permite que cada potencial comprador verifique a nossa estrutura de registo e rastreabilidade sem divulgar os dados comerciais de outro cliente.'
    - q: 'Podemos receber os relatórios de inspeção completos para o nosso projeto?'
      a: 'Sim. Para projetos aprovados partilhamos a documentação de qualidade aplicável à tua encomenda — plano de inspeção da qualidade, relatórios de entrada de mercadorias, de processo, de estanquicidade ao ar, finais e de embalagem, além da autorização de libertação para envio — ligada à rastreabilidade do lote. Os dados comerciais sensíveis permanecem sob NDA, conforme acordado.'
    - q: 'O que contém um registo de inspeção ligado ao lote?'
      a: 'Cada registo liga o lote de produção à revisão de especificação ou desenho aplicável, regista cada ponto de controlo contra os seus critérios de aceitação com o método e o instrumento utilizados e fecha com a função do inspetor, o estado do resultado e a disposição de libertação assinada pela Qualidade.'
evidence_review:
  tagline: 'Provas e verificação'
  title: 'ESPECIFICAÇÕES VERIFICADAS'
  body: 'Todas as declarações de produção nesta página são verificadas pela nossa Manufacturing Engineering Team no local de Laixi, Qingdao. Certificados, registos de inspeção QC, relatórios de ensaio de pressão e estruturais e registos de rastreabilidade dos lotes estão disponíveis mediante pedido. Especificações verificadas pela última vez em setembro de 2026.'

