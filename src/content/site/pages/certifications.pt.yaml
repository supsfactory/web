  title: 'Precisas de requisitos de qualidade para o teu projeto SUP?'
  subtitle: 'Partilha a tua categoria de produto, o mercado de destino, a quantidade estimada e todos os requisitos de inspeção, documentação ou embalagem. Verificaremos os contributos de projeto aplicáveis e aconselharemos o passo seguinte para o desenvolvimento da amostra ou o planeamento da produção. Uma reunião NDA é possível antes da partilha de especificações, gráficas ou requisitos de qualidade não públicos.'
  actions:
    - variant: primary
      text: Solicitar uma verificação de qualidade do projeto
      href: /contact#quality-inquiry
    - text: Visita o nosso laboratório de inspeção de qualidade
      href: /randdcenter/quality-inspection-lab
    - text: Padrão de inspeção e downloads QMS
      href: /factory/quality-inspection
    - text: Padrão para produtos não conformes
