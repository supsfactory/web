traceability:
  tagline: Rastreabilidade por lote
  title: 'Quatro perguntas a que cada lote responde'
  subtitle: 'Os registos de qualidade são conservados por lote de produção e ligados à especificação de produto, às gráficas, à BOM e aos requisitos de embalagem aplicáveis. Isto suporta a investigação e a ação controlada quando é identificado um problema de qualidade. Numa auditoria do comprador, a nossa equipa de qualidade responde a estas quatro perguntas no terreno — cada resposta remete para um registo controlado.'
  items:
    - title: 'O que foi produzido?'
      description: 'Produto, modelo, configuração e revisão estão ligados ao número de encomenda e à revisão de especificação aprovada.'
      icon: '1'
