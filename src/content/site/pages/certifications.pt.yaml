meta:
  title: 'Controlo de qualidade para SUP personalizados: inspeção em 7 fases | SUPsfactory'
  description: 'Como é controlada cada encomenda de SUP personalizado: 7 pontos de inspeção do planeamento da produção à libertação para envio, com relatórios bilingues para download.'
  dateModified: '2026-08-15'
  keywords:
    - 'controlo de qualidade sup'
    - 'inspeção fábrica sup'
    - 'plano de inspeção qualidade oem'
    - 'inspeção pré-envio sup'
    - 'certificação ce sup'
    - 'iso 9001 sup'
hero:
  tagline: Controlo de qualidade para projetos personalizados
  title: 'Controlo de qualidade para projetos de SUP insufláveis personalizados'
  subtitle: 'A qualidade é verificada contra a amostra aprovada, a especificação técnica, as gráficas, a lista de materiais (BOM) e os requisitos de embalagem de cada projeto — não contra uma afirmação genérica. Do controlo de entrada à libertação para envio, o nosso processo de inspeção está estruturado para verificar a conformidade do produto em fases de produção definidas. Gerido pelo QINGDAO VATRAD GROUP, a fábrica de SUP insufláveis de 12,500 m² por trás da Vatrad.'
stats:
  - value: 100%
    label: Unidades testadas em pressão
  - value: '7'
    label: Pontos de inspeção controlados
  - value: 18.0 PSI
    label: Manutenção de pressão de 24 horas
  - value: ISO 9001
    label: Qualidade certificada
quality_basis:
  tagline: Base de qualidade
  title: 'O que define a aceitação do produto'
  subtitle: 'Os critérios finais de aceitação são definidos antes da libertação da produção. Estes documentos de projeto controlados definem o que deve ser fabricado, como são verificados os detalhes-chave e o que deve ser controlado antes do envio — aprovados pelo comprador e congelados no Plano de Inspeção da Qualidade (QIP). Cada pedido de alteração passa por um controlo de alterações documentado, nunca de forma tácita em linha.'
  items:
    - title: 'Amostra aprovada'
      description: 'A prancha física de referência aprovada e assinada pelo comprador. Cada prancha acabada é comparada com ela em dimensões, perfil, rigidez e acabamento.'
      icon: tabler:medal
    - title: 'Especificação técnica'
      description: 'Materiais, construção e desenhos com cotas, fixados num número de revisão. A FAI verifica o primeiro artigo exatamente contra esta revisão.'
      icon: tabler:file-check
    - title: 'Gráficas aprovadas'
      description: 'Gráficas, tintas de impressão e posicionamento aprovados e bloqueados por versão antes do corte — assim cada deck é enviado com o aspeto aprovado pela marca.'
      icon: tabler:palette
    - title: 'BOM aprovada pelo cliente'
      description: 'Lista de materiais — prancha, pá, bomba, leash, bolsa, manual — confirmada pelo comprador. A PSI verifica a completeza do kit a 100% contra esta BOM.'
      icon: tabler:list-checks
    - title: 'Requisitos de embalagem e etiquetagem'
      description: 'Estrutura da caixa, marcações, códigos de barras, conteúdos das etiquetas e marcações de envio fixados por escrito. A legibilidade dos códigos de barras e a precisão das marcações são verificadas na PSI.'
      icon: tabler:package
tests:
  - title: Teste de pressão
    description: As câmaras insufláveis são expostas durante períodos prolongados a pressões superiores aos seus limites operacionais recomendados. Isto verifica a estanquicidade e a integridade estrutural do material e das costuras, garantindo que o produto resiste à utilização prevista e a um eventual sobre-inflar sem cedências ou fugas.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-pressure-testing.webp
    alt: Câmara SUP insuflável em teste de pressão para verificação da estanquicidade
  - title: Teste de impacto
    description: Os produtos são sujeitos a impactos controlados com diferentes pesos e ângulos. Isto avalia a resistência do material a perfurações, rasgões e danos por colisão com obstáculos na água e demonstra a sua durabilidade e longevidade.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-production-department.webp
    alt: Dispositivo de teste de impacto a verificar a resistência à perfuração do material dos botes
  - title: Teste de resistência aos raios UV
    description: As amostras de material são expostas a radiação UV acelerada para verificar que não amarelecem, não rasgam nem perdem resistência ao longo do tempo. Cada lote de PVC é testado quanto à degradação solar antes da produção.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-uv-resistance-testing.webp
    alt: Amostras de material PVC expostas a radiação UV acelerada no teste de resistência
  - title: Teste de resistência à abrasão
    description: As amostras de material são friccionadas contra superfícies abrasivas durante um número definido de ciclos sob pressão controlada. Isto mede a capacidade do material de resistir ao desgaste devido à utilização repetida e ao contacto com areia, pedras ou outras superfícies, garantindo a durabilidade a longo prazo.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-pvc-material-testing.webp
    alt: Máquina de ensaio de abrasão a friccionar uma amostra de tecido PVC para medir a resistência ao desgaste
  - title: Teste de desempenho a baixas temperaturas
    description: Os produtos são testados em ambientes frios para avaliar a funcionalidade e a durabilidade em diferentes condições de temperatura, prevenindo rigidez ou fissuras em águas mais frias. Essencial para embarcações destinadas ao uso invernal ou em latitudes elevadas.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-factory-exterior.webp
    alt: Produto insuflável em célula frigorífica para o teste de desempenho a baixas temperaturas
  - title: Teste de flutuabilidade e capacidade de carga
    description: Os produtos são testados com diferentes pesos para determinar a capacidade de carga máxima e garantir que suportam em segurança utilizadores e equipamento. A capacidade nominal de cada modelo é verificada antes da libertação.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-stock-boat-inventory.webp
    alt: Teste de flutuabilidade e capacidade de carga com pesos em embarcações insufláveis
  - title: Teste de manobrabilidade
    description: Os produtos são testados quanto à resposta aos comandos de pagaiada ou motor, avaliando o raio de viragem e a manobrabilidade. As provas em água validam que o comportamento real corresponde às especificações de design.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-sup-manufacturing.webp
    alt: Teste de manobrabilidade em água de cascos SUP e embarcações insufláveis
  - title: Teste de estanquicidade
    description: Os produtos completamente montados são imersos ou expostos a jatos de água para verificar a existência de fugas nas costuras, válvulas ou materiais. Cada embarcação passa num teste de estanquicidade obrigatório antes do envio.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-production-department-2.webp
    alt: Teste de estanquicidade por imersão a verificar costuras e válvulas à procura de fugas
qc_flow:
  tagline: O fluxo de inspeção em 7 fases
  title: 'Sete pontos de controlo de qualidade controlados, end-to-end'
  subtitle: 'Cada ponto abaixo está definido no Plano de Inspeção da Qualidade específico do projeto, com o seu objeto de inspeção, método, critérios de aceitação e resultado documental. Os dossiers de relatórios bilingues são registos controlados reais — abre um para veres a estrutura efetiva.'
  obj_label: Objeto de inspeção
  method_label: Método de inspeção
  criteria_label: Critérios de aceitação
  record_label: Resultado documental
  stages:
    - stage: STAGE 01
      title: 'Planeamento de qualidade do projeto (PPM)'
      summary: 'A reunião de pré-produção fixa o âmbito, a baseline e o plano de inspeção antes do arranque da linha.'
      checks:
        - 'O nome do produto, o código interno, o SKU do cliente, o número de encomenda e a definição do lote são registados.'
        - 'O tipo de prancha, o núcleo drop-stitch, os materiais, o rail band, o EVA, as válvulas e o sistema de aletas são especificados.'
        - 'O nome do ficheiro gráfico, a versão, as cores, a posição do logótipo e a área de impressão são bloqueados e aprovados.'
        - 'A BOM — cada artigo por conjunto com quantidade, cor, número de peça e regras de substituição — é aprovada pelo cliente.'
        - 'A embalagem, a etiquetagem, os códigos de barras, o idioma dos manuais e as disposições para inspeções de terceiros são fixados por escrito.'
      object: 'Âmbito do projeto vs. requisitos do cliente — materiais, dimensões, gráficas, embalagem, mercado de destino e normas aplicáveis.'
      method: 'Reunião de pré-produção com vendas, design e QC; assinatura do golden sample; emissão do Plano de Inspeção da Qualidade (QIP) para a encomenda.'
      criteria: 'As cinco baselines são aprovadas e congeladas antes do arranque da produção em série. Os pontos por resolver bloqueiam a libertação da produção.'
      record: 'QIP + ata da PPM, atas de aprovação da amostra.'
      image: https://assets.supsfactory.com/site/quality/node01-ppm.avif
      alt: Reunião de pré-produção para análise do golden sample e do plano de inspeção de qualidade de uma encomenda SUP OEM
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Descarregar o QIP (PDF)'
    - stage: STAGE 02
      title: 'Controlo de entrada de mercadorias (IQC)'
      summary: 'As matérias-primas são verificadas contra a especificação aprovada do fornecedor antes de entrarem em produção.'
      checks:
        - 'O tecido drop-stitch, as bobinas de PVC, o material do rail e o deck pad em EVA são controlados contra a amostra aprovada — cor, espessura, peso e defeitos de superfície.'
        - 'As válvulas, as fin box, os anéis em D, as pegas e os encaixes são controlados quanto a tipo, dimensão, superfície, ferrugem e funcionamento correto.'
        - 'As bombas, as pás, os leashes, as bolsas e os kits de reparação são verificados quanto ao modelo, à cor e à configuração do projeto.'
        - 'Os certificados dos fornecedores (COA), as declarações de materiais e os documentos de conformidade REACH/RoHS são examinados para cada lote.'
        - 'Os lotes não conformes são bloqueados e rejeitados antes de o material chegar à linha.'
      object: 'Tecido drop-stitch, bobinas de PVC, válvulas, aletas, acessórios e materiais de embalagem contra a especificação aprovada e os certificados de ensaio dos fornecedores.'
      method: 'Controlos visuais, dimensionais e de peso; amostragem de lotes segundo AQL; certificados de materiais examinados; lista de fornecedores aprovados aplicada.'
      criteria: 'Cumpre a especificação e os certificados aprovados. Os lotes não conformes são bloqueados e rejeitados antes da libertação para a linha.'
      record: 'Relatório de ensaio IQC com referências aos lotes e disposições.'
      image: https://assets.supsfactory.com/site/quality/node02-iqc.avif
      alt: Controlo de entrada de mercadorias de tecido PVC e componentes SUP na fábrica
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios IQC (PDF)'
    - stage: STAGE 03
      title: 'Controlo de processo e teste do primeiro artigo (IPQC / FAI)'
      summary: 'Os métodos de construção e os pontos de controlo são escolhidos com base na plataforma de prancha aprovada e na configuração do projeto. O primeiro exemplar é verificado contra as baselines bloqueadas; cada turno mantém controlos por amostragem em linha.'
      checks:
        - 'O primeiro artigo é verificado contra a amostra aprovada, o desenho técnico, a BOM, as gráficas e os ficheiros de embalagem antes do arranque da produção em série.'
        - 'As dimensões da prancha, o contorno e a simetria são medidos; a direção da tinta e do logótipo, a posição, as cores e a revisão são confirmadas.'
        - 'As costuras e a continuidade do rail são controladas em linha quanto a folgas, delaminação, pregas, contaminação ou desalinhamento.'
        - 'A instalação da válvula, dos anéis em D, das pegas e da fin box é controlada quanto à posição, quantidade e montagem relativamente à BOM aprovada pelo cliente.'
        - 'A libertação FAI bloqueia por versão as gráficas, as dimensões e a BOM; os desvios passam pelo fluxo de decisão de retrabalho — nunca retoques em linha.'
      object: 'Primeiro artigo e montagens em curso — costuras, rail, fin box, base da válvula, posição das gráficas, aperto dos encaixes.'
      method: 'Teste do primeiro artigo na primeira peça; controlos por amostragem por turno; resistência da soldadura e alinhamento das costuras verificados em linha.'
      criteria: 'A libertação FAI bloqueia por versão as gráficas, as dimensões e a BOM. Os desvios passam pelo fluxo de decisão de retrabalho — nunca retoques em linha.'
      record: 'Registo FAI, atas por amostragem por turno, notas de retrabalho e disposição.'
      image: https://assets.supsfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Inspeção de processo e teste do primeiro artigo durante a produção SUP
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios IPQC (PDF)'
    - stage: STAGE 04
      title: 'Teste de inflagem e estanquicidade ao ar'
      summary: 'Cada prancha concluída é sujeita a verificação de inflagem e estanquicidade ao ar antes da embalagem — 100% das unidades, não uma amostra.'
      checks:
        - 'A superfície da prancha, os rails e a área da válvula são controlados antes da inflagem quanto a furos de alfinete, fissuras, pregas anómalas ou delaminação.'
        - 'As câmaras são infladas à pressão de teste do projeto com um manómetro digital calibrado e o valor inicial é bloqueado.'
        - 'O núcleo da válvula, a base da válvula e as costuras do rail são controlados em toda a circunferência — proa, popa e zonas curvas.'
        - 'Manutenção de pressão de 24 horas com registo contínuo; expulsão automática para além da queda de pressão permitida.'
        - 'As pranchas defeituosas são bloqueadas, retrabalhadas conforme instrução e testadas de novo por completo — não apenas reconfirmadas no ponto de reparação.'
      object: '100% das câmaras infladas — deteção completa de fugas nas costuras, integridade das válvulas e capacidade de manutenção da pressão.'
      method: 'Deteção completa de fugas nas costuras, seguida de uma manutenção de pressão de 24 horas a 18,0 PSI; expulsão automática para além de uma queda de 0,50 PSI.'
      criteria: 'Zero pontos de fuga e queda de pressão dentro de 0,50 PSI por câmara; as unidades defeituosas são bloqueadas e retrabalhadas ou sucatadas.'
      record: 'Relatório de teste de estanquicidade ao ar, um por câmara, com ligação ao lote.'
      image: https://assets.supsfactory.com/site/quality/node04-airtightness.avif
      alt: Teste de inflagem e estanquicidade ao ar de uma câmara SUP insuflável
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios de estanquicidade ao ar (PDF)'
    - stage: STAGE 05
      title: 'Inspeção do produto acabado (FQC)'
      summary: 'As pranchas acabadas são medidas e avaliadas visualmente contra o golden sample aprovado.'
      checks:
        - 'As dimensões-chave — comprimento, largura e espessura — são medidas à pressão de trabalho contra as tolerâncias do desenho.'
        - 'O contorno da prancha, o rocker e a simetria são verificados; nenhuma deformação, torção ou ondulação anómala após a inflagem.'
        - 'Avaliação visual sob lâmpadas de luz diurna D65: riscos, manchas, resíduos de adesivo, bolhas, pregas, desvios de cor.'
        - 'Testes funcionais: abertura/fecho da válvula e montagem da tampa, inserção e bloqueio da aleta, anéis em D, pegas e funcionamento da pá.'
        - 'A configuração é verificada contra a BOM e o SKU aprovados pelo cliente — acessórios, etiquetas, códigos de barras e números de série.'
      object: 'Prancha acabada vs. golden sample — dimensões, rocker, perfil, aspeto, montagem da fin box e completeza dos acessórios.'
      method: 'Verificação dimensional contra as tolerâncias do desenho; avaliação visual sob lâmpadas de luz diurna D65; testes de montagem da fin box e dos encaixes.'
      criteria: 'Dimensões dentro da tolerância (ex. 3508 × 814 × 150,3 mm), avaliação visual segundo a amostra aprovada, todos os acessórios presentes.'
      record: 'Relatório FQC com assinatura do inspetor e disposição.'
      image: https://assets.supsfactory.com/site/quality/node05-fqc.avif
      alt: Inspeção do produto acabado das pranchas SUP antes da embalagem
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios FQC (PDF)'
    - stage: STAGE 06
      title: 'Inspeção de embalagem pré-envio (PSI)'
      summary: 'O kit embalado é controlado quanto à completeza, precisão da etiquetagem e prontidão para o envio.'
      checks:
        - 'Completeza do kit a 100% vs. BOM: prancha, pá, bomba, leash, bolsa, kit de reparação e manual — um conjunto de cada vez.'
        - 'Peças delicadas protegidas (bolsos da bomba e da lâmina), prancha dobrada segundo a SOP de embalagem, acessórios conformes ao modelo e à cor.'
        - 'As gráficas da caixa, a marca, as advertências e as versões linguísticas são controladas contra a revisão gráfica aprovada.'
        - 'Tipo, número, posição e capacidade de leitura do código de barras verificados; marcações de envio, SKU, PO, número da caixa e quantidade corretos.'
        - 'Dimensões da caixa, peso bruto/líquido e embalagem interna conformes à especificação de embalagem; resultado do drop test registado quando solicitado.'
      object: 'Kit embalado — prancha, pá, bomba, leash, bolsa, manual — contra a BOM e a especificação de embalagem aprovadas pelo cliente.'
      method: 'Completeza do kit a 100% vs. BOM; leitura dos códigos de barras (nota ≥ B); precisão das etiquetas das caixas; drop test ISTA-1A nas caixas embaladas.'
      criteria: 'Correspondência do kit a 100% com a BOM, códigos de barras legíveis, etiquetas corretas e embalagem à prova de queda antes do carregamento.'
      record: 'Checklist PSI e atas de embalagem para cada caixa.'
      image: https://assets.supsfactory.com/site/quality/node06-psi.avif
      alt: Inspeção pré-envio a verificar o kit SUP embalado contra a BOM
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios PSI (PDF)'
    - stage: STAGE 07
      title: 'Libertação para envio e rastreabilidade'
      summary: 'A Qualidade liberta o lote apenas quando os seis pontos anteriores estão fechados e todos os registos estão completos.'
      checks:
        - 'O lote de produção, o número de encomenda, o SKU, a quantidade e o número de caixas correspondem à packing list e à fatura comercial.'
        - 'Os ficheiros de especificação, BOM, gráficas e embalagem estão todos na revisão aprovada atual.'
        - 'Os registos IQC, FAI, de processo, de estanquicidade ao ar, FQC e PSI estão completos para o lote a libertar.'
        - 'Todas as não conformidades estão resolvidas, retrabalhadas, testadas de novo e fechadas — sem pontos em aberto na libertação.'
        - 'Campos de rastreabilidade registados para cada lote: código do projeto, PO, SKU, revisões de gráficas/BOM/embalagem, data de produção, inspetor e números de registo.'
      object: 'Autorização de libertação do lote — todos os pontos fechados, registos completos, números de série do lote atribuídos.'
      method: 'Verificação dos pontos pela Qualidade em todos os seis registos anteriores; dossier de rastreabilidade do lote compilado; registos entregues ao envio.'
      criteria: 'Todos os pontos libertados pela QA; registos do lote e dossier de rastreabilidade entregues ao comprador ou mantidos sob NDA mediante pedido.'
      record: 'Autorização de libertação para envio e dossier de rastreabilidade do lote.'
      image: https://assets.supsfactory.com/site/quality/node07-shipment-release.avif
      alt: Assinatura da libertação para envio e entrega do relatório de rastreabilidade do lote
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descarregar os relatórios de libertação (PDF)'
system_map:
  tagline: O sistema de qualidade
  title: 'Um sistema, quatro padrões controlados'
  subtitle: 'Os sete pontos acima assentam em quatro padrões documentados, publicados cada um como procedimento controlado que podes descarregar e auditar. Em conjunto formam o QMS por trás de cada encomenda OEM/ODM — critérios de inspeção, controlo de alterações, não conformidades e testes de laboratório.'
  items:
    - title: 'Padrão de inspeção e libertação'
      description: 'O QIP do projeto orienta cada ponto: objeto de inspeção, método, critérios de aceitação e resultado documental de cada encomenda. Inclui o framework de QC em 4 fases, a cadeia de rastreabilidade, o fluxo de quarentena, a matriz de defeitos e o registo documental 00–15.'
      icon: tabler:clipboard-check
      link: /factory/quality-inspection
      link_label: 'Padrão de inspeção e downloads QMS'
    - title: 'Controlo de alterações de retrabalho'
      description: 'Nenhuma alteração dos parâmetros de retrabalho sem controlo documentado: contenção, classificação de risco, ciclo de alteração em 9 fases, matriz de libertação e validação. Cada alteração a especificações aprovadas, amostras, BOM ou critérios de aceitação exige a aprovação escrita do cliente.'
      icon: tabler:git-branch
      link: /factory/quality-change-control
      link_label: 'Padrão de controlo de alterações'
    - title: 'Controlo de produtos não conformes'
      description: 'Um ciclo fechado em 7 fases segundo a ISO 9001:2015, secção 8.7: identificar, bloquear, dispor através de NCR, retrabalhar ou rejeitar, voltar a verificar, libertar, corrigir. Inclui a autoridade com base na gravidade, a matriz de disposição de defeitos SUP e a destruição assistida.'
      icon: tabler:alert-triangle
      link: /factory/non-conforming-control
      link_label: 'Padrão para produtos não conformes'
    - title: 'Laboratório de ensaios e equipamento'
      description: 'O laboratório de qualidade opera de forma independente da produção: máquinas de tração, queda de pressão, envelhecimento UV, peeling das soldaduras, deteção de fugas e câmaras térmicas — com os procedimentos de calibração e ensaio na base das nossas declarações publicadas.'
      icon: tabler:flask
      link: /factory/quality-lab
      link_label: 'Laboratório de qualidade e equipamento de ensaio'
    - title: 'Laboratório de ensaio de materiais (I&D)'
      description: 'O centro de I&D executa ensaios independentes de materiais para formulações PVC/Hypalon, envelhecimento acelerado e apoio à certificação, alimentando os padrões usados pela produção.'
      icon: tabler:microscope
      link: /randdcenter/quality-inspection-lab
      link_label: 'Laboratório de ensaio de materiais I&D'
intelligence_cards:
  tagline: Documentação e rastreabilidade
  title: 'Registos de qualidade a suportar a rastreabilidade do projeto'
  subtitle: 'Os registos de inspeção são conservados por lote de produção e ligados à documentação de projeto aplicável — revisão de especificação, revisão gráfica, BOM e requisitos de embalagem. Para proteger os dados dos clientes, as amostras nesta página são anonimizadas: são apenas mostrados os campos estruturais (código do projeto, produto/SKU, lote, fase de inspeção, ponto de controlo, critérios de aceitação, resultado, inspetor, data e estado de libertação).'
  cards:
    - icon: 1
      icon_bg: blue
      title: Relatório de controlo de entrada de mercadorias
      desc: 'Demonstra que as matérias-primas, o tecido drop-stitch, as bobinas de PVC e os componentes são verificados contra a especificação aprovada antes da libertação da produção.'
      metrics:
