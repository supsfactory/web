      icon: '2'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Ver o dossier de rastreabilidade (PDF)'
    - title: 'Quem inspecionou e quando?'
      description: 'Cada registo apresenta a função do inspetor, a data, os instrumentos utilizados e o resultado — nenhuma assinatura anónima.'
      icon: '3'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
