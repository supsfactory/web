ip_rules:
  tagline: 'Fikri Mülkiyet Koruması'
  title: 'Tasarımlarınızı ve Markanızı Nasıl Koruyoruz'
  subtitle: 'İş birliği modelinden bağımsız olarak grafikleriniz, kalıplarınız ve spesifikasyon dosyalarınız sizin mülkiyetinizde kalır.'
  body: |
    **Dosya paylaşımı öncesi NDA.** Herhangi bir teknik dosya paylaşımından önce bir gizlilik anlaşması imzalarız — standart yanıt süremiz 4 iş saatinin içindedir.

    **Tasarım yeniden kullanımı yok.** Grafikleriniz, kalıplarınız ve spesifikasyon dosyalarınız asla başka müşterilerle paylaşılmaz veya onlara satılmaz. OEM kalıpları yalnızca size aittir. ODM tasarımları üretimden önce sizin onayınıza sunulur. Private Label platformları ortak yapılardır, ancak grafikleriniz ve markalamanız münhasırdır.

    **Yalnızca B2B.** Yalnızca müşterilerimizin markaları adına üretim yaparız. Son tüketicilere satış yapmayız ve hiçbir pazarda müşterilerimizle rekabet etmeyiz.

    **Kalıp mülkiyeti.** Alıcı tarafından ödenen özel kalıplar alıcıya aittir. Bunları depolar ve bakımını yaparız, ancak yazılı yetki olmadan başka müşteriler için kullanamayız.

faqs:
  tagline: 'SSS'
  title: 'OEM, ODM ve Private Label Hakkında Sık Sorulan Sorular'
  items:
    - q: 'Daha sonra private labeldan OEMe geçebilir miyim?'
      a: 'Evet. Birçok müşteri pazarı doğrulamak için private label veya pilot partiyle başlar, talep kanıtlandıktan sonra tam bir OEM programı için özel kalıplara yatırım yapar. Aynı tesis ve kalite kontrol sistemi her iki yolu da destekler.'
    - q: 'ODM, fabrikam markamın sahibi olduğu anlamına mı gelir?'
      a: 'Hayır. ODM kapsamında marka, grafikler ve ambalaj sizindir. Fabrika tahtanın yapısını brifinginizden geliştirir ve üretimden önce tasarımı onaylarsınız. Fabrika geliştirme süreci fikri mülkiyetini tutar, ancak onaylanan ürün spesifikasyonu sizindir.'
    - q: 'Private label kalite olarak OEMden daha mı düşük?'
      a: 'Hayır. Üç yolun tamamı aynı tesiste, aynı kalite kontrol sistemi ve aynı ihracat ekibiyle yürür. Private label tahtalar, tam 18 PSI / 24 saat basınç testi ve aynı 100 maddelik montaj kontrol listesiyle, kanıtlanmış platformlar üzerinde üretilir.'
    - q: 'Hangi modeli seçeceğimden emin değilsem ne olur?'
      a: 'Bize durumunuzu anlatın — mühendislik ekibimiz ürün gereksinimleriniz, takviminiz ve hacim hedeflerinize göre en uygulanabilir yolu önerir. Spesifikasyon incelemesinden önce hiçbir taahhüt gerekmez.'
    - q: 'Herhangi bir modele taahhüt etmeden önce numune alabilir miyim?'
      a: 'Evet. 1–2 prototip numune 7–12 günde sevk edilir. Numune maliyeti toplu siparişinizden mahsup edilir. Bu, herhangi bir hacim taahhüdünden önce yapı ve kaliteyi değerlendirmenizi sağlar.'

