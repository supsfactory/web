faqs:
  title: 'FAQ om tillverkning av OEM-paddlar'
  subtitle: 'Svar på de vanligaste frågorna från varumärken som lanserar en egen paddel.'
  items:
    - title: 'Hur startar jag mitt eget paddelvarumärke?'
      description: 'Lansera ditt varumärke: briefing, design, CE-certifierad prototyp, massproduktion och leverans. Prover på 7–12 dagar, produktion på 25–35 dagar efter beställning och handpengar. Upptäck våra OEM-paket.'
    - title: 'Vad är produktionstiden?'
      description: 'Provet är klart på 7–12 dagar och massproduktionen på 25–35 dagar efter beställning och handpengar, beroende på antal.'
    - title: 'Bär paddeln vår logotyp?'
      description: 'Ja — fullständig private label: logotyptryck, anpassade färger, förpackning och etiketter under ert varumärke.'
    - title: 'Kan jag köpa stora antal redan från dag ett?'
      description: 'MOQ fastställs per projekt — prov (1–2 enheter), pilot (20–50 enheter) och standardvolym (90–100+ enheter per parti), med grossistprisnivåer som växer med antalet.'

content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
