answer:
  label: 'Kort svar'
  text: 'Minsta beställningsmängd fastställs per projekt: prov (1–2 enheter), pilot (20–50 enheter) och standardvolym (90–100+ enheter per parti från en drop-stitch-rull på 150 m), med co-branding för små partier från 5–10 enheter. Prover skickas inom 7–12 dagar; serieproduktionen tar 25–35 dagar efter beställning och handpengar. CE-certifieringen för modeller avsedda för EU-marknaden och fullständig överensstämmelsedokumentation ingår i varje beställning.'
  verified: 'September 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Anpassad OEM-paddel med varumärkeslogotyp
  actions:
    - text: 'Starta mitt OEM-projekt'
      href: /sv/contact
      variant: primary
    - text: 'Se OEM-paketen'
      href: /sv/oem-manufacturing
      variant: secondary
