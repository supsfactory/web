manufacturing_scope:
  heading: 'Domeniul de producție'
  body: |
    Domeniul nostru de producție acoperă întregul lanț de producție pentru produsele SUP gonflabile și marine — de la inspecția materiilor prime la intrare până la ambalarea finală și documentația de export.

    - **Categorii de produse**: plăci SUP gonflabile (all-around, touring, surf, fishing, yoga, cursă), canoe gonflabile, bărci gonflabile, vâsle, pompe și accesorii.
    - **Tipuri de construcție**: PVC cu un singur strat, PVC cu două straturi, miez drop-stitch cu înveliș PVC. Specificații de construcție personalizate în funcție de proiect.
    - **Modele de colaborare**: OEM (proiect deținut de cumpărător), ODM (dezvoltat de fabrică pe baza briefului cumpărătorului), private-label / co-branding (marca aplicată pe platforme deja validate).
    - **Certificări**: ISO 9001:2015 (managementul calității în fabrică), CE (modele destinate UE, domeniu stabilit proiect cu proiect), BSCI (conformitate socială), REACH (securitate chimică), RoHS (substanțe restricționate).
    - **Capacitate de producție**: 120,000+ plăci anual, aproximativ 10.000 de unități pe lună pe 4 linii automate. Creșterea capacității este posibilă cu planificare în avans.

brand_positioning:
  heading: 'Poziționarea mărcii'
  body: |
    iSupfactory ocupă o poziție bine delimitată pe piață — nu suntem o marcă, ci un producător. Această distincție conturează fiecare aspect al activității noastre:

    - **Nu vindem niciodată sub marcă proprie.** Fiecare placă pe care o producem poartă marca cumpărătorului. Nu concurăm cu clienții noștri pe nicio piață și pe niciun canal. Această politică nu este negociabilă.
    - **Nu suntem o societate de comerț.** Noi operăm fabrica. Controlul calității, ingineria, programarea producției și documentația de export sunt gestionate integral în regim propriu. Între comanda dumneavoastră și sala de producție nu există intermediari.
    - **Suntem specializați în produse gonflabile.** Aceasta nu este o activitate secundară sau una dintre multe categorii de produse. Platformele SUP gonflabile și produsele marine reprezintă competența noastră centrală. Fiecare utilajă, fiecare proces și fiecare punct de control al calității este optimizat pentru această categorie de produse.
    - **Deservim cumpărători profesioniști.** Clienții noștri sunt mărci, distribuitori, operatori de stațiuni turistice, cluburi și școli — nu consumatori individuali. Prețurile, structura de MOQ, documentația și comunicarea noastră sunt concepute pentru relații B2B.

evidence_review:
  tagline: 'Dovezi și verificare'
  title: 'SPECIFICAȚII VERIFICATE'
  body: 'Toate afirmațiile organizatorice și de producție de pe această pagină sunt verificabile. Certificatul ISO 9001, raportul BSCI, licența de funcționare și documentele de înregistrare a fabricii sunt disponibile la cerere. Vizitele în fabrică sunt binevenite. Specificațiile au fost verificate ultima dată în septembrie 2026.'

faqs:
  tagline: FAQ
  title: 'Identitatea de marcă — Întrebări frecvente'
  items:
    - q: 'Este iSupfactory o companie distinctă de Qingdao Vatrad Group?'
      a: 'Nu. iSupfactory este marca orientată către cumpărător a VATRAD, care este divizia de producție marine a Qingdao Vatrad Group Co., Ltd. Entitatea juridică contractantă pentru toate comenzile este Qingdao Vatrad Group Co., Ltd. Fabrica, echipa și sistemul de calitate constituie o singură operațiune.'
    - q: 'Vindeți plăci sub propria dumneavoastră marcă?'
      a: 'Nu. Producem exclusiv sub mărcile clienților noștri și nu concurăm niciodată cu ei pe nicio piață. Aceasta este o politică fundamentală, nu o poziție temporară. Dacă găsiți pe piață o placă cu marca iSupfactory, aceasta nu provine din fabrica noastră.'
    - q: 'Pot vizita fabrica?'
      a: 'Da. Vizitele în fabrică sunt binevenite și putem organiza un audit structurat, care cuprinde întregul proces de producție, punctele de control al calității, depozitul de materii prime și verificarea documentației. Contactați-ne pentru a programa o vizită.'
    - q: 'Ce relație există între VATRAD și iSupfactory?'
      a: 'VATRAD este denumirea diviziei de producție din cadrul Qingdao Vatrad Group. iSupfactory este marca internațională orientată către cumpărător, utilizată pentru serviciile de producție OEM, ODM și private-label. Ambele se referă la aceeași operațiune — divizia de producție marine din Laixi, Qingdao.'

