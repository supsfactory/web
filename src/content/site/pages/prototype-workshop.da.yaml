answer:
  label: 'Det korte svar'
  text: 'Vi omdanner en CAD-model til et prøvebræt, der kan sejles og er testet, på 7–12 dage: prototyping i oppustet tilstand, sejlture i krap, iterationer på kant og nose, og derefter frigjøring af produktionsværktøjet. Helt specialforme tager yderligere 15–20 dages værktøjstid oven i den normale leveringstid på 25–35 dage for større partier.'
  verified: 'September 2026'

