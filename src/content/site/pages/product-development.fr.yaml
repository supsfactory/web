hero:
  tagline: Développement de produit
  title: 'Développement de produit SUP personnalisé, du concept au conteneur'
  subtitle: 'Six étapes transforment votre idée de produit en planches SUP prêtes pour la production — spécification, ingénierie, prototypage, test, outillage et production de masse, le tout dans une seule usine avec un seul système qualité responsable.'

answer:
  label: 'Réponse directe'
  text: 'Le développement de produit SUP chez SUPsfactory s''exécute en six étapes — spécification produit, ingénierie structurelle, échantillonnage de prototype, test et validation, outillage personnalisé et production de masse. Le premier échantillon physique part 7–12 jours après l''approbation de la spécification ; la production s''exécute en 25–35 jours après bon de commande confirmé et acompte ; le développement de nouveau moule ajoute 15–20 jours.'
  verified: '2026-08'

stages:
  title: 'Les six étapes du développement de produit SUP'
  subtitle: 'Chaque étape a un livrable clair, pour que vous sachiez toujours où en est votre projet — et ce qui arrive ensuite.'
  items:
    - title: '1. Idée et spécification produit'
      description: 'Géométrie de la planche, plage de poids du pagayeur, volume, objectifs de construction et pack d''accessoires. Une planche de référence, un croquis ou une spéc. concurrente suffit pour commencer.'
      icon: 'tabler:bulb'
    - title: '2. Ingénierie et design 3D'
      description: 'Ingénierie structurelle, épaisseur du drop-stitch et sélection de la qualité du PVC, plus une revue de fabricabilité et un devis — renvoyés sous un jour ouvré.'
      icon: 'tabler:blueprint'
    - title: '3. Échantillonnage de prototype'
      description: 'Votre premier échantillon physique part en 7–12 jours, documenté avec une fiche d''approbation couvrant la construction, les couleurs d''impression et les résultats de test de pression.'
      icon: 'tabler:tools'
    - title: '4. Test et validation'
      description: 'Maintien de pression, résistance de soudure et contrôles dimensionnels contre l''échantillon approuvé, avec documentation CE et REACH préparée pour vos marchés cibles.'
      icon: 'tabler:test-pipe'
    - title: '5. Outillage et production de masse'
      description: 'Développement de moule personnalisé en 15–20 jours si nécessaire ; production en 25–35 jours avec points de contrôle QC en cours de processus et traçabilité des lots.'
      icon: 'tabler:settings'
    - title: '6. Livraison et mise à l''échelle'
      description: 'Logistique FOB, CIF ou DDP vers 50+ pays — puis commandes récurrentes sur votre ligne établie avec des délais stables et des graphismes approuvés en dossier.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Pourquoi le développement à l''intérieur d''une usine bat un projet de courtier'
  subtitle: 'Le travail de développement situé à l''intérieur de l''usine de production change ce que vous obtenez à chaque étape.'
  items:
    - title: Pas de lacunes de transfert de design
      description: 'L''équipe d''ingénierie et de dessin travaille sur le même étage que la ligne de soudure — un changement de dessin va en production la même semaine, pas après un aller-retour commercial.'
      icon: 'tabler:handshake'
    - title: Des échantillons qui correspondent à la production
      description: 'La série d''échantillon et la série de production partagent les mêmes machines, matériaux et postes QC, donc l''échantillon approuvé est ce que vous recevez réellement à l''échelle du conteneur.'
      icon: 'tabler:stack-2'
    - title: Une ingénierie qui ne vend rien
      description: 'Les décisions sont prises contre le coût cible, le poids et la durabilité — pas contre des marges de montée en gamme, car c''est une usine et la production est le seul revenu.'
      icon: 'tabler:scale'
    - title: La confidentialité comme contrat permanent
      description: 'Une NDA est signée avant tout échange de fichiers, et vos graphismes, votre outillage et vos fichiers de spécification restent votre propriété — jamais réutilisés, revendus ou montrés à un autre client.'
      icon: 'tabler:lock'

