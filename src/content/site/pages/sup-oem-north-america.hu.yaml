why_north_america:
  tagline: 'Miért éppen az USA és Kanada vásárlói'
  title: 'Az észak-amerikai importra tervezve'
  subtitle: 'A gyár azokra a kérdésekre válaszol, amelyeket az amerikai és kanadai márkák az első konténer előtt feltesznek.'
  items:
    - title: 'DDP a kiszámítható végleges költségért'
      description: 'A DDP tartalmazza a vámformalitásokat és a raktárába történő kiszállítást – vámok, adók és szállítás egyetlen végösszegben. Az első alkalommal importálók kedvenc választása.'
    - title: 'Dokumentáció a célpiaca számára'
      description: 'A CE-, REACH- és vámdokumentáció a jóváhagyott mintával együtt, a célpiacaira elkészítve kerül kiállításra, így a termékdosszié az exportra készen áll.'
    - title: 'FOB Qingdao a saját vámkezelőjével'
      description: 'Rendszeresen importál? Válassza a FOB Qingdaót, és használja saját logisztikai partnerét – mi betöltjük és dokumentáljuk a konténert, Ön irányítja a többit.'
    - title: 'Egy gyár, egy minőségi rendszer'
      description: 'A fejlesztés, a minták, a gyártás és a minőségi ellenőrzés mind a 12,500 m²-es gyárban történik – nincs brókerek közötti ugrálás, nincsenek olyan minták, amelyeket a gyártás nem tud megismételni.'

process_notes:
  tagline: 'Hogyan működik'
  title: 'A specifikációktól a konténerig'
  subtitle: 'Ugyanaz a hat lépés, akár évente két konténert, akár húszat vesz: specifikáció, mérnökség, minta, vizsgálatok, szerszám, gyártás – majd FOB, CIF vagy DDP kiszállítás.'
  items:
    - title: '1. Küldje el a specifikációkat'
      description: 'Egy referencia-deszka, egy vázlat vagy egy versenytárs specifikációi elegendők. A mérnöki elemzés és az ajánlat egy munkanapon belül visszaérkezik.'
    - title: '2. Hagyja jóvá a mintát'
      description: 'Az első fizikai mintája 7–12 nap alatt kerül feladásra, egy jóváhagyási lap kíséretében, amely a szerkezetet, a nyomtatási színeket és a nyomáspróba eredményeit fedi.'
    - title: '3. Gyártás és export'
      description: 'A sorozatok 25–35 nap alatt készülnek el, folyamat közbeni minőségi ellenőrzési pontokkal. A csomagolólista, a számla és a hajójegy megelőzi a hajót.'
    - title: '4. Kiszállítás a raktárába'
      description: '4–6 hét tengeri szállítás az USA vagy Kanada kikötőihez – DDP módban mi intézzük a vámformalitásokat és a házhoz érkezést.'

faq_section:
  tagline: GYIK
  title: 'Az észak-amerikai import kérdései'
  questions:
    - q: 'Mennyi ideig tart a tengeri szállítás az USA-ba vagy Kanadába?'
      a: 'A qingdaói kikötőtől az USA vagy Kanada kikötőiig 4–6 hetet kell számolni, a rendeltetési helytől és a hajó választásától függően. A DDP projektek a teljes, házhoz szállítástól a házhoz szállításig terjedő határidőt tartalmazzák.'
    - q: 'Szállítanak-e DDP-vel az USA-ba és Kanadába?'
      a: 'Igen. A DDP tartalmazza a tengeri szállítást, a vámformalitásokat, a vámokat és az adókat, valamint a raktárába történő kiszállítást – egyetlen, kiszámítható végleges ár. A FOB Qingdao és a CIF szintén elérhető.'
    - q: 'Mi a private label SUP-import MOQ-ja?'
      a: 'Az MOQ-t a projekt konfigurációja határozza meg: a minta fejlesztése 1–2 darabot, a pilóta tételek 20–50 darabot ölelnek fel meglévő platformokon, a standard tömeggyártás pedig modellenként 90–100+ darabot gyárt egy teljes, 150 m-es drop-stitch tekercsből.'
    - q: 'Milyen dokumentációt adnak az importokhoz?'
      a: 'A jóváhagyott minta a célpiacaira elkészített CE- és REACH-dokumentációval együtt kerül feladásra, és minden konténert csomagolólista, számla és hajójegy kísér.'
    - q: 'Milyen amerikai megfelelőségi dokumentumokat biztosítanak a SUP deszkákhoz?'
      a: 'A felnőtteknek szánt felfújható SUP deszkák nem gyermektermékek, így a fogyasztási termékekre vonatkozó CPSIA-szabályok általában nem érvényesek. A California Prop 65 az Ön belátása szerinti címkézési értékelés – az általunk minden megrendeléshez mellékelt REACH/RoHS anyagdokumentáció támogatja ezt az értékelést. Az USCG-nek megfelelő dokumentáció ott támogatható, ahol a termékkategóriája ezt megköveteli, és a kijelölt projektmérnök a gyártás megkezdése előtt megerősíti az ügyvédje vagy kiskereskedője által kért pontos dokumentumokat.'
    - q: 'Meglátogathatom a gyárat a megrendelés előtt?'
      a: 'Igen. A qingdaói, 12,500 m²-es gyár nyitva áll az ügyfelek előtt – virtuális gyártúrák online szervezhetők, a személyes látogatásokat pedig a gyártósorokon és a minőség-ellenőrzési állomásokon vezetik.'
    - q: 'Hogyan kezdhetek egy projektet az USA-ból vagy Kanadából?'
      a: 'Küldjön egy referencia-deszkát, egy vázlatot vagy specifikációkat. A mérnöki elemzés és az ajánlat egy munkanapon belül visszaérkezik, és minden fájlcsere előtt NDA-t írunk alá.'

