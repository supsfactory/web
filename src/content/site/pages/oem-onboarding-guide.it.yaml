answer:
  label: 'Risposta breve'
  text: 'Un onboarding OEM tipico richiede 2–4 settimane per l''approvazione del campione e 6–8 settimane per il primo ciclo di produzione dal conferimento dell''ordine. Inizi con un briefing di progetto (specifiche della tavola, quantità, requisiti di conformità). Rispondiamo entro un giorno lavorativo, offriamo una NDA prima dello scambio di dettagli proprietari e produciamo 1–2 campioni fisici in 7–12 giorni per la tua valutazione e approvazione. Una volta congelato il campione, seguono la pianificazione della produzione e la produzione con gate di QC fissi in ogni fase. Ogni passaggio è documentato e rintracciabile.'
  verified: 'September 2026'

process_steps:
  tagline: I sette gate
  title: 'Percorso di onboarding — sette gate dal briefing alla consegna'
  subtitle: 'Ogni gate ha un input definito, un output definito e una tempistica concordata in anticipo. Non superi nessun gate senza un''approvazione esplicita.'
  steps:
    - step: 'Gate 1'
      title: 'Prima richiesta & NDA (Giorno 0)'
      desc: 'Invia tramite /contact un briefing di progetto con le tue specifiche obiettivo della tavola, la quantità dell''ordine, i requisiti di conformità e il calendario. Una NDA è disponibile immediatamente — prima di condividere specifiche tecniche proprietarie o artwork. Risposta entro un giorno lavorativo.'
    - step: 'Gate 2'
      title: 'Verifica di fattibilità & offerta (Giorno 1–5)'
      desc: 'L''ingegneria verifica il tuo briefing rispetto a capacità produttiva, disponibilità dei materiali e ambito di conformità. Ricevi un''offerta voce per voce con calcolo del MOQ, costi dei campioni (accreditati sulla produzione) e ripartizione dei tempi di consegna — nessun intervallo approssimativo, ma un programma gate per gate.'
    - step: 'Gate 3'
      title: 'Produzione dei campioni (Giorno 6–17)'
      desc: '1–2 tavole fisiche secondo la tua specifica: rigidità dello scafo, aderenza del pad antiscivolo in EVA, fedeltà grafica, vestibilità degli accessori. Tu provi e valuti la tavola prima di impegnarti su qualsiasi cosa definitiva. I costi dei campioni vengono accreditati sull''ordine di produzione alla firma del contratto.'
    - step: 'Gate 4'
      title: 'Revisione del campione & approvazione (Giorno 18–21)'
      desc: 'Valuti il campione rispetto alla tua specifica — sensazione di guida, fedeltà grafica, imballaggio, accessori. Le modifiche vengono incorporate in una BOM rivista e in un''approvazione dell''artwork. La specifica congelata diventa il riferimento di produzione per tutti i cicli successivi.'
    - step: 'Gate 5'
      title: 'Pianificazione della pre-produzione (Giorno 22–28)'
      desc: 'Approvvigionamento dei materiali, impostazione degli stampi, conferma dell''imballaggio e prenotazione dello slot di produzione. Tutti i materiali vengono controllati all''ingresso rispetto alla BOM congelata. Prima dell''inizio della produzione viene emesso un piano di produzione con le date dei gate di QC.'
    - step: 'Gate 6'
      title: 'Produzione & gate di QC (Giorno 29–55)'
      desc: 'La produzione passa attraverso il sistema a 7 gate di ispezione: controllo all''ingresso, controllo del tessuto drop-stitch, saldatura & assemblaggio, test di pressione e tenuta (18,0 PSI di tenuta, scarto automatico oltre 0,50 PSI), montaggio del pad EVA & accessori, QC grafica & branding, imballaggio finale & documentazione. Ogni gate ha criteri superato/non superato e protocolli di tracciabilità.'
    - step: 'Gate 7'
      title: 'Spedizione & valutazione post-consegna (Giorno 56–63)'
      desc: 'Imballaggio pronto per l''export, documentazione di conformità (CE, ISO 9001, BSCI, REACH, RoHS) e coordinamento del trasporto marittimo verso oltre 50 paesi. Una valutazione post-consegna cattura gli insegnamenti e i miglioramenti per il ciclo d''ordine successivo.'

