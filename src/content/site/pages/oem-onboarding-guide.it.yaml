checklist:
  heading: 'Cosa preparare prima del briefing del tuo progetto'
  body: |
    Più completo è il tuo briefing, più rapida e accurata sarà l'offerta. Ecco come prepararti:

    - **Specifiche della tavola** — lunghezza, larghezza e spessore target, intervallo di peso del rider e uso previsto (touring, allround, surf, pesca, yoga ecc.). Se hai misure di riferimento o un modello della concorrenza, includile.
    - **File di design** — artwork vettoriale (AI, SVG o PDF) per la grafica della tavola, il logo del pad EVA e il branding secondario. Se l'artwork non è ancora pronto, per la prima fattibilità bastano una mood-board o immagini di riferimento.
    - **Quantità & tempistiche** — la tua quantità target per il primo ordine e il calendario di stagione da rispettare. Anche un intervallo approssimativo („20–50 tavole entro marzo") serve a confermare fattibilità e disponibilità degli slot.
    - **Requisiti di conformità** — mercati target (UE, Nord America, Australia ecc.) ed eventuali requisiti di certificazione o test oltre il nostro standard (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Budget** — un budget indicativo per tavola o un costo a terra obiettivo ci aiuta a consigliare la piattaforma e il livello di costruzione giusti. Il prezzo esatto viene confermato solo dopo la verifica tecnica — mai prima.

    Se non hai ancora tutto, invia quello che hai. Ti guidiamo noi per il resto.

evidence_review:
  tagline: 'Prove & verifica'
  title: 'SPECIFICHE VERIFICATE'
  body: 'Tutte le dichiarazioni di produzione in questa pagina sono verificate dal nostro Manufacturing Engineering Team presso lo stabilimento di Laixi, Qingdao. Certificati, protocolli di ispezione QC, test di pressione e strutturali e registri di tracciabilità dei lotti sono disponibili su richiesta. Specifiche verificate l''ultima volta: settembre 2026.'

faqs:
  tagline: FAQ
  title: 'Onboarding OEM — domande frequenti'
  items:
    - q: 'Quanto dura l''intero processo di onboarding?'
      a: 'L''approvazione del campione richiede in genere 2–4 settimane (incluse la produzione del campione in 7–12 giorni e la tua fase di revisione). Il primo ciclo di produzione richiede 6–8 settimane dall''ordine confermato e dall''acconto. Un nuovo stampo dello scafo aggiunge 15–20 giorni di costruzione dello stampo. Ogni gate ha una tempistica concordata in anticipo.'
    - q: 'Devo firmare una NDA prima di condividere il mio design?'
      a: 'Una NDA è disponibile immediatamente su richiesta — prima di condividere specifiche tecniche proprietarie o artwork. Produciamo esclusivamente con i marchi dei nostri clienti e non competiamo con loro in nessun mercato. La stessa politica vale per un singolo campione come per un programma a container.'
    - q: 'Qual è la quantità minima di ordine per un primo ciclo OEM?'
      a: 'L''ingresso è scaglionato: prima 1–2 campioni (disponibili in 7–12 giorni), poi un ordine di prova o pilota di 20–50 tavole (produzione in 25–35 giorni), quindi cicli di quantità standard di 90–100+ tavole per configurazione approvata. Il co-branding in piccoli lotti parte da 5–10 unità se non serve una fase di sviluppo. I costi dei campioni vengono accreditati sull''ordine di produzione.'
    - q: 'Come viene gestita la protezione del IP durante l''onboarding?'
      a: 'I tuoi design e le tue specifiche sono protetti dalla NDA firmata prima dello scambio di informazioni proprietarie. Tutti gli artwork, i dati della BOM e i file tecnici sono conservati in sistemi ad accesso controllato con audit trail. In modalità OEM possiedi tutto il IP. In modalità ODM il IP della piattaforma adattata è condiviso come concordato. In modalità Private Label il IP appartiene a SUPsfactory e tu ottieni in licenza l''applicazione del marchio.'
    - q: 'Quali garanzie di qualità valgono per un primo ordine?'
      a: 'Ogni tavola — campione, prova o quantità — passa attraverso lo stesso sistema a 7 gate di ispezione: controllo all''ingresso, controllo del tessuto drop-stitch, saldatura & assemblaggio, test di pressione e tenuta di 24 ore (18,0 PSI di tenuta, scarto automatico oltre 0,50 PSI), montaggio del pad EVA & accessori, QC grafica & branding, imballaggio finale & documentazione. La qualità non viene mai ridotta per gli ordini più piccoli.'
    - q: 'Qual è il primo passo pratico?'
      a: 'Compila /it/contact#project-brief con le specifiche della tavola, la quantità target e le tempistiche. Rispondiamo entro un giorno lavorativo con la verifica di fattibilità e un''offerta voce per voce. Tutto il resto del processo è documentato gate per gate, dalla NDA alla consegna.'

