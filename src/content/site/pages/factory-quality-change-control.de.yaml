faqs:
  tagline: FAQ
  title: Häufig gestellte Fragen zur Nacharbeits-Änderungskontrolle
  items:
    - q: 'Kann die Fabrik Nacharbeitsparameter ändern, ohne uns zu informieren?'
      a: 'Nein. Jede vorgeschlagene Änderung an freigegebenen Nacharbeitsmaterialien, Prozessbedingungen, Werkzeugen, Testmethoden, Inspektionskriterien oder autorisiertem Personal muss zunächst eine dokumentierte Änderungskontrolle durchlaufen. Änderungen, die kundenfreigegebene Spezifikationen, Muster, BOMs, Grafiken oder Abnahmekriterien betreffen, erfordern die schriftliche Kundenfreigabe.'
    - q: 'Was gilt als risikoreiche Änderung?'
      a: 'Änderungen an Nacharbeitsmaterialien oder -lieferanten, Druck-/Halt- oder Aushärtungsbedingungen, Ventil-/Rail-/Nahtnacharbeitsmethoden, Inspektions- oder Abnahmekriterien und die Ausweitung des Fehlerumfangs in strukturelle Zonen werden als risikoreich klassifiziert. Sie erfordern eine abteilungsübergreifende Prüfung, einen freigegebenen Validierungsplan und kontrollierte Pilotumsetzung vor dem Routineeinsatz.'
    - q: 'Kann eine temporäre Abweichung unbegrenzt verwendet werden?'
      a: 'Nein. Jede temporäre Abweichung trägt ein definiertes Gültigkeitsfenster, einen Chargenumfang, eine Mengenobergrenze und Validierungsanforderungen mit automatischem Ablauf. Das Erreichen der Obergrenze sperrt die Charge und blockiert den Pass-Tag-Druck, bis die Änderung formell bewertet ist.'
    - q: 'Wie wird eine geänderte Methode vor dem vollen Einsatz als funktionsfähig nachgewiesen?'
      a: 'Risikoreiche Änderungen erfordern einen Validierungsplan: mindestens 5 repräsentative Musterboards, die die Toleranzgrenzen abdecken, getestet von 2 unabhängigen QC-Inspektoren gegen quantifizierte Abnahmekriterien (Leckbeseitigung, Druckhalt, Ventilfunktion, Nahthaltbarkeit, Erscheinungsbild). Die Freigabe zur Validierung ist keine Freigabe zur Anwendung.'
    - q: 'Müssen wir jede Änderung freigeben?'
      a: 'Nicht jede Änderung, aber jede Änderung, die das Produkt von der kundenfreigegebenen Probe, der technischen Spezifikation, der BOM, der Grafik, der Verpackung oder den Abnahmekriterien wegführt, wird nur mit schriftlicher Kundenfreigabe umgesetzt. Ohne diese werden Boards gemäß der ursprünglichen Anforderung nachgearbeitet, ersetzt oder zurückgewiesen.'
    - q: 'Was passiert mit alten Dokumenten, wenn eine Änderung freigegeben wird?'
      a: 'Alte Arbeitsanweisungen, Parameterkarten und Inspektionsblätter werden physisch eingesammelt und entwertet (1-in-1-out), als OBSOLETE markiert und nach der Schulung durch die neue kontrollierte Revision ersetzt. Alte und neue Versionen teilen sich nie eine Arbeitsstation.'
    - q: 'Wie lange werden Änderungskontrollaufzeichnungen aufbewahrt?'
      a: 'Abschlussaufzeichnungen — Validierungsnachweise, Dokumentenrevisionen, Schulungsnachweise und Effektivitätsprüfungen — werden gemäß unserer Aufbewahrungsrichtlinie aufbewahrt (mindestens 3 Jahre für Abschlussaufzeichnungen), damit jede Änderung für Audits und Rückverfolgbarkeitsprüfungen nachvollziehbar bleibt.'

