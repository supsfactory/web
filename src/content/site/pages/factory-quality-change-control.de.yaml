cc_pokayoke:
  tagline: Fehlerverhütungsschutz
  title: 'Poka-Yoke: harte Blöcke, die unkontrollierte Änderungen stoppen'
  subtitle: Der Standard wird nicht nur durch Verfahren, sondern durch physische und systemische Blöcke durchgesetzt, die unkontrollierte Änderungen unmöglich machen.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR-Gate für Werkzeugfreischaltung
      desc: 'Nacharbeitsstationen lesen einen QA-signierten ECR-Barcode, bevor sich pneumatische Aufblasventile und Klebstoffmischer freischalten. Kein freigegebener Änderungskontrollnachweis, keine Versorgung — rückwirkende Signierung ("erst ändern, dann signieren") ist physisch blockiert.'
    - icon: 2
      icon_bg: green
      title: Automatischer Ablauf temporärer Abweichungen
      desc: 'Temporäre Abweichungen sind im System hart gedeckelt (z. B. maximal 50 Boards oder 7 Kalendertage). Das Erreichen der Obergrenze sperrt die Charge und blockiert den Druck des Versandpass-Tags, bis die Änderung formell bewertet ist.'
    - icon: 3
      icon_bg: purple
      title: Mindestvalidierungsnachweis
      desc: 'Risikoreiche Änderungen erfordern mindestens 5 repräsentative Musterboards, die die obere und untere Toleranzgrenze abdecken und von 2 unabhängigen QC-Inspektoren vollständig geprüft werden, bevor ein Validierungsbericht ausgestellt werden kann — ein repariertes Board wird nie als Prozessvalidierung behandelt.'
    - icon: 4
      icon_bg: orange
      title: 1-in-1-out Dokumentenkontrolle
      desc: 'Veraltete Arbeitsstationskarten werden physisch eingesammelt und entwertet (gelocht), bevor die neue Karte mit dem kontrollierten roten Siegel gestempelt ausgegeben wird — alte und neue Versionen teilen sich nie eine Arbeitsstation.'

