cc_intro:
  tagline: Umfang & Richtlinie
  title: Kerner-Governance-Prinzipien
  body: |
    **Dokument:** QMS-SOP-QC-CC-001 — *Standard der Änderungskontrolle für Nacharbeitsprozessparameter* (Rev 2.0, offizielle Veröffentlichung). **Hersteller:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Standardreferenz:** ISO 9001:2015 Qualitätsmanagementsysteme.

    - **Keine unkontrollierten Änderungen.** Änderungen an Nacharbeitsparametern müssen über formelle Änderungskontrolle laufen. Vor-Ort-Operatoren, Schichtleiter oder eine einzelne Abteilung dürfen freigegebene Nacharbeitsparameter niemals durch mündliche Vereinbarung oder handschriftliche Eintragung in einem Nacharbeitsnachweis ändern.
    - **Volle Elementabdeckung.** Der kontrollierte Umfang umfasst Luftdichtigkeit, Ventilsitze, Railbänder, Nahtverklebung, Heißluftaushärtung und Druckhalttests — jeden Parameter, der Abdichtung, strukturelle Haltbarkeit, Erscheinungsbild, Kundenabnahme oder Rückverfolgbarkeit beeinflussen kann.
    - **Kundenfreigabe als Kernpunkt.** Jede Änderung, die ein Produkt von der kundenfreigegebenen Probe, der technischen Spezifikation, der BOM, der Grafik, der Verpackungsanforderung oder den Abnahmekriterien wegführt, wird nur mit schriftlicher Kundenfreigabe umgesetzt. Ohne diese wird das Board gemäß der ursprünglichen Anforderung nachgearbeitet, ersetzt oder zurückgewiesen — niemals allein durch die Fabrik "gelockert".

cc_scope:
  tagline: Risikoklassifizierung
  title: Änderungsumfang & Risikoklassifizierung
  subtitle: Jede der folgenden Änderungen löst formelle Änderungskontrolle aus — sie wird niemals durch eine Notiz im Nacharbeitsnachweis behandelt. Das Risikoniveau bestimmt, wer freigibt und wie viel Validierung erforderlich ist.
  headers:
    category: Änderungskategorie
    examples: Typische Beispiele
    risk: Risiko
    requirements: Kontroll- & Freigabeanforderungen
  rows:
    - category: 'Nacharbeitsmaterialien'
      examples: 'Klebstoff, Reiniger, Flickenmaterial, Ventildichtung, Primer oder Lieferantenwechsel'
      risk: 'Hoch'
      requirements: 'Abteilungsübergreifende Prüfung + Materialkompatibilitäts- & Druckhaltevalidierung + Kundenfreigabe wo anwendbar'
    - category: 'Prozessbedingungen'
      examples: 'Oberflächenvorbereitung, Heißluftaushärtungstemperatur/-feuchte, Klemmdruck, Haltedauer'
      risk: 'Hoch'
      requirements: 'Konstruktions- + Qualitätsfreigabe mit definierter Temperatur- & Feuchtefenster-Validierung'
    - category: 'Werkzeuge & Messgeräte'
      examples: 'Druckmessgeräte, Leckdetektoren, Heißluftgeräte, Ventilwerkzeuge, Testsoftware'
      risk: 'Mittel/Hoch'
      requirements: 'Kalibrierungsgültigkeitsprüfung + Ausrüstungseignungsbewertung'
    - category: 'Fehlerumfang'
      examples: 'Erweiterung des Nacharbeitsbereichs; Oberflächenmikrolack, der in kritische Rail-, Naht- oder Ventilsitzzonen wächst'
      risk: 'Hoch'
      requirements: 'Strukturell tragende Oberflächen: verbindlicher Stopp und Neubewertung'
    - category: 'Inspektionsmethoden'
      examples: 'Leckerkennungsmethode, Testdruck (18.0 PSI), Haltedauer (24h)'
      risk: 'Hoch'
      requirements: 'Qualitätsfreigabe + Bestätigung der technischen Kundenvereinbarung'
    - category: 'Dokumentation & Autorisierung'
      examples: 'Nacharbeitsanweisung, Inspektionsblätter, NCR-Dispositionslogik, Operatorqualifikation'
      risk: 'Mittel'
      requirements: 'Kontrollierte Dokumentenrevision (Rev A → Rev B) + Schulungsnachweise'

cc_containment:
  tagline: Hartstopp-Regel
  title: Sofortige Eindämmung, wenn die Bedingungen ernst werden
  body: |
    > "Die bestehende Nacharbeitsmethode soll einer Überprüfung unterzogen und nicht auf zusätzliche betroffene Produkte angewendet werden, bis die Änderung bewertet und autorisiert ist, es sei denn, eine dokumentierte temporäre Abweichung wurde von Qualität und Konstruktion genehmigt."

    Die aktuelle Nacharbeitsmethode muss sofort ausgesetzt werden, wenn die Nacharbeits-Nachprüfung weiterhin durchfällt, wenn der Fehler strukturell tragende Zonen betrifft (Ventilbasis, Rails, Nähte, Bug-/Heckdruckbereiche), wenn ein Ersatzmaterial noch nicht validiert ist oder wenn aktuelle Parameter mit der kundenfreigegebenen Spezifikation kollidieren.

    Temporäre Abweichungen werden nie zur dauerhaften Praxis: jede trägt ein definiertes Gültigkeitsfenster, einen anwendbaren Chargenumfang, eine Mengenobergrenze, Validierungsanforderungen und einen automatischen Ablaufmechanismus. Eine mündliche Ausnahme ist keine Ausnahme — wenn sie nicht mit ihrem Ablauf dokumentiert ist, existiert sie nicht.

cc_flow:
  tagline: Standard-9-Schritte geschlossener Kreislauf
  title: Vom Änderungsantrag zum Abschluss und zur Aufbewahrung
  subtitle: 'Ein dokumentierter Kreislauf für jede Parameteränderung: vorschlagen, screenen, bewerten, freigeben, validieren, pilotieren, verifizieren, überarbeiten, abschließen.'
  steps:
    - step: '01'
      title: Änderungsantrag (ECR)
      desc: 'Jede Abteilung darf einen Antrag stellen, aber Konstruktion, Qualität oder Produktionsleitung sponsern ihn. Der ECR beantwortet, warum die Änderung vorgeschlagen wird, was sich ändert, was betroffen ist und wie verifiziert wird — mit Änderungskontrollnummer, zugehörigem NCR/CAPA, aktuellem vs. vorgeschlagenem Parameter, betroffenen Chargen und Klassifizierung temporäre/dauerhafte Änderung.'
    - step: '02'
      title: Erstscreening & Eindämmung
      desc: 'Der Antrag wird zuerst auf sofortige Eindämmung gescreent: muss die aktuelle Methode jetzt gestoppt werden? Wenn eine temporäre Abweichung erlaubt ist, wird sie durch Gültigkeitsfenster, Chargenumfang, Mengenobergrenze und automatischen Ablauf begrenzt.'
    - step: '03'
      title: Auswirkungs- & Risikobewertung
      desc: 'Konstruktion, Qualität, Produktion, Beschaffung/Supply Chain und Projekt bewerten Produktleistung, Abnahmekriterien, Materialkompatibilität, Erscheinungsbild, Prozessfähigkeit, Ausrüstung und Messgeräte, Personalqualifikation, Kundenanforderungen, Konformität und Rückverfolgbarkeitsumfang.'
    - step: '04'
      title: Gemeinsame Prüfung & Freigabe
      desc: 'Die Freigabe folgt der festen Autorisierungsmatrix — nicht "wer am lautesten spricht". Risikoreiche Änderungen erfordern abteilungsübergreifende Freigabe und, wo erforderlich, schriftliche Kundenfreigabe vor jedem Versuch.'
    - step: '05'
      title: Validierungsplan
      desc: 'Für risikoreiche Änderungen ist vor der Routineanwendung ein freigegebener Validierungsplan erforderlich: repräsentative Musterboards, aktuelle vs. vorgeschlagene Methode, Testmethoden, Abnahmekriterien, Inspektionsstufen, Verantwortliche und Zeitplan.'
    - step: '06'
      title: Kontrollierte Piloten & Umsetzung
      desc: 'Neue Dokumente werden freigegeben und veraltete Versionen entzogen und als OBSOLETE markiert; neue Materialien und Messgeräte werden verifiziert und kalibriert; Operatoren werden geschult und qualifiziert; die erste Charge läuft unter verschärfter Inspektion mit klarer Statuskennzeichnung.'
    - step: '07'
      title: Nachprüfung & Effektivitätsprüfung
      desc: 'Erstdurchgangs-Nacharbeitsrate, Nachprüfungsbestehensrate, Wiederholungsrate und Erscheinungsakzeptanz werden gemessen und geprüft, bevor die Änderung als wirksam angesehen wird — ein repariertes Board wird nie als Prozessvalidierung behandelt.'
    - step: '08'
      title: Dokumentenrevision & Schulung
      desc: 'Arbeitsanweisungen, Inspektionsblätter, NCR-Dispositionsoptionen, Parameterkarten und Schulungsmaterialien werden auf die neue Revision aktualisiert, mit aufgezeichneter praktischer Schulung und Operatorqualifikation.'
    - step: '09'
      title: Abschluss & Aufzeichnungsaufbewahrung
      desc: 'Die Änderung wird erst abgeschlossen, nachdem Validierungsnachweise, Dokumentenaktualisierungen, Schulungsnachweise und Umsetzungseffektivität geprüft und freigegeben wurden. Wird das beabsichtigte Ergebnis nicht erreicht, wird die Änderung überarbeitet, erweitert, ausgesetzt oder zurückgezogen.'

