cc_validation:
  tagline: Engineering-Validierung
  title: Validierungs- & Abnahmeprotokoll — Nachweise statt Behauptungen
  body: |
    Vage Abnahmewortlaut wie *"das reparierte Board muss gut sein"* wird nicht akzeptiert. Der kontrollierte Wortlaut lautet:

    > "Das nachgearbeitete Muster muss dieselben anwendbaren Luftdichtigkeits-, Sichtverarbeitungs-, Ventilfunktions- und projektspezifischen Abnahmekriterien erfüllen wie ein konformes Board, es sei denn, eine kundenfreigegebene Abweichung definiert ausdrücklich ein alternatives Kriterium."

    Validierungsnachweise sind quantitativ, und die technische Baseline für Luftdichtigkeitsnacharbeit umfasst:

    - **Leckbeseitigung & Druckhalt.** Das ursprüngliche Leck wird beseitigt, ohne anhaltende Blasen in der Seifenwasser-Leckerkennung; das Board hält beim Standardtestdruck von 18.0 PSI für 24 Stunden, mit Netto-Druckabfall ΔP ≤ 0.2 PSI nach Temperatur-/Feuchtigkeitskompensation — die strengere Baseline für die Nacharbeitsvalidierung, getrennt von der 0.50-PSI-Auto-Ausschleusungsschwelle, die bei der Endabnahme der Produktionslinie angewendet wird.
    - **Ventilfunktion.** Das Ventilkern-Drehmoment erfüllt die 15–20 N·m-Spezifikation, ohne Mikro-Leck an der Dichtung unter Hochdruck-Aufblasung und dynamischem Druck.
    - **Nahtverklebung & Haltbarkeit.** Bindekanten zeigen kein Abheben, keine Weißfärbung und keine Delamination; nach Wärme-/Feuchtigkeitsalterungszyklen zeigt die Klebeschicht keine Erweichung oder spröde Rissbildung.
    - **Erscheinungsbild & Verarbeitung.** Keine Klebstofflaufspuren, keine EVA-Beschädigung, keine Boardverformung und kein Logo-Versatz oder Kratzer auf der Druckoberfläche.

cc_engineering:
  tagline: Engineering-Ausführungsmatrix
  title: Quantifizierte Parameter für die vier Kernnacharbeitsprozesse
  subtitle: 'Jeder kontrollierte Nacharbeitsprozess trägt definierte Parameter, Methodik und Abnahmekriterien — dieselben Zahlen, denen unsere Operatoren folgen und die Kunden während Audits verifizieren können.'
  headers:
    process: Nacharbeitsprozess
    parameters: Kontrollierte Parameter
    methodology: Testmethodik
    acceptance: Abnahmekriterien
  rows:
    - process: 'Nadelloch-/Mikroleck-Flickenreparatur'
      parameters: 'Lösungsmittelreinigung & Trocknen 3–5 min; Heißluftaktivierung 60°C ± 5°C; Pressrolle ≥ 0.4 MPa'
      methodology: 'Auf 18 PSI aufblasen; vollständiges Eintauchen in Wasser oder Seifenanwendung; 10 Minuten beobachten'
      acceptance: 'Null Blasenemission; 180°-Kantenabzug ohne Abheben und ohne Klebstofflaufspuren'
    - process: 'Railband-/Naht-Neuverklebung'
      parameters: 'Zweikomponenten-Klebstoffverhältnis strikt kontrolliert; Umgebung 22–28°C, ≤ 65 % rel. Feuchte; Vorrichtungsklemme ≥ 4 h'
      methodology: '22-PSI-Überdrucktest für 2 h; dann 6 h Wärmeofen-Backen bei 50°C und 2 h Raumtemperatur-Ruhe'
      acceptance: 'Null Trennung, null Rissbildung; Netto-Druckabfall ΔP ≤ 0.1 PSI; Klebeschicht ohne Weißfärbung oder Versprödung'
    - process: 'Ventilbasis-Lockerung / Mikro-Leck'
      parameters: 'Dediziertes Schlüsseldrehmoment 18–20 N·m; Dichtungsring flach ohne Verformung; Gewindesauberkeit bestätigt'
      methodology: 'Auf 15 PSI aufblasen; 20 Aufblas-/Entlüftungszyklen; Beobachtung beim Unterwassertauch'
      acceptance: 'Null Blasen am Ventilkern und der Basisumgebung; Drehmoment nach Zyklen ≥ 16 N·m'
    - process: 'Finaler 24h-Druckhalt-Test'
      parameters: 'Referenzaufblasung 18.0 PSI; digitales Manometer Klasse 1.0 / ±0.5 %; Umgebungstemperatur & -feuchte aufgezeichnet und kompensiert'
      methodology: 'Digitaler Druckrekorder; kontinuierliche 24h-Druckkurve'
      acceptance: 'Netto-Druckabfall ΔP ≤ 0.20 PSI / 24 h nach Kompensation; keine Boardwölbung oder Verformung'

cc_photos:
