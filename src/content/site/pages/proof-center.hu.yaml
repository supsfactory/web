meta:
  title: 'Bizonyítékközpont – minden gyártási állítás mögötti bizonyíték'
  description: 'Az iSupfactory állításai mögötti bizonyítékdosszié: az entitások kapcsolatai, a tanúsítványok és azok hatóköre, a géplista, a szállítmányszintű nyomon követhetőség és az ellenőrzési dokumentáció.'
  dateModified: '2026-08-16'
  keywords:
    - 'sup gyár bizonyítékai'
    - 'a gyár tanúsítványainak listája'
    - 'sup szállítmány nyomon követhetőség'
    - 'sup gyár ellenőrzése'
    - 'kínai gyártási bizonyítékok'

hero:
  tagline: 'A gyár bizonyítékközpontja'
  title: 'Bizonyítékközpont – minden, amit állítunk, itt, nyilvánosan'
  subtitle: 'Egy oldal, amely a weboldal minden állítását az azt alátámasztó bizonyítékhoz rendeli: a gyár mögötti bejegyzett entitás, a tanúsítványok a hatókörükkel együtt, a gyártást végző gépek és az egyes sorok után is megmaradó szállítmánynyilvántartások.'
  actions:
    - { variant: primary, text: 'Kérje az ellenőrzési csomagot', href: '/hu/contact#trust-verification' }
    - { variant: ghost, text: 'Fedezze fel a minőségi rendszert', href: '/hu/quality' }

answer:
  label: 'Közvetlen válasz'
  text: 'Az állítás és a bizonyíték közötti lánc a következő: a weboldal minden mondatát egy nyilvántartás, egy tanúsítvány, egy gép, egy dokumentum vagy egy próbajegyzkönyv támasztja alá – és mindegyik ellenőrizhető. Az iSupfactory a Qingdao Vatrad Group Co., Ltd. (2012 óta Qingdaóban bejegyzett) SUP termékek fejlesztési és gyártási divíziója. A 12,500 m²-es gyár ISO 9001:2015 minőségirányítási rendszerrel, ISO 25649 megfeleléssel, CE megfelelőségi dokumentációval, BSCI szociális megfeleléssel (auditjelentés kérésre) és minden megrendeléshez REACH/RoHS alapanyag-dokumentációval rendelkezik. Minden felfújható rekeszt 18.0 PSI nyomáson próbálunk 24 órán át, 0.50 PSI-nél nagyobb esésnél automatikus elutasítással, a szállítmány-nyilvántartásokat pedig 10 évig őrizzük az ERP rendszerben. A dosszié közzétett vagy kérésre rendelkezésre áll, és a gyár auditokra nyitva áll.'
  verified: '2026. szeptember'

