traceability:
  tagline: 'Egy szállítmány, a tekercstől a deszkáig követve'
  title: 'Hogyan néz ki a nyomon követhetőség a gyakorlatban'
  body: |
    Minden szállítmány **10 évig érvényes ERP szállítmánykódot** kap. Az egyetlen szállítmányhoz rögzített lánc:

    - **A nyersanyagtekercs** – alapanyag-tanúsítvány, a tekercs száma, a vizsgált alapanyagszállítmány (szakítás, szakadás, varrás)
    - **A vágás** – CNC vágási rendelés a tervezési fájlhoz képest, rögzített hibaszázalék
    - **A hegesztés és a laminálás** – sor, kezelő, az egyes rekeszek gépparaméterei
    - **Az összeállítás** – a deszka gyártási száma, a szelep típusa, a hídszőnyeg szállítmánya
    - **A vizsgálat** – 18.0 PSI × 24 órás nyomástartás minden rekesznél, 0.50 PSI-nél nagyobb esésnél automatikus elutasítással
    - **A kiadás** – 100 pontos ellenőrző lista minden deszkára, a QA-igazgató aláírása minden szállítmányra
    - **A feladás** – a küldeményt kísérő megfelelőségi tanúsítvány; a szerződésben fenntartott auditjog

    Kérjen egy minta QC jegyzőkönyvet az első megrendelés előtt – ugyanaz a formátum, amelyet az áruval együtt kap.

faqs:
  tagline: 'Gyakori kérdések'
  title: 'A bizonyítékokra vonatkozó kérdések, amelyeket a vásárlók feltesznek'
  items:
    - q: 'Ez az oldal csak ellenőrzésre szolgál, és nem helyettesíti a szokásos Due Diligence vizsgálatot?'
      a: 'Igy van – ez az oldal megmutatja, hol ellenőrizhető minden állítás: az entitás nyilvántartása, a tanúsítványok, a gépek, a nyilvántartások és egy auditokra nyitott gyár. A szokásos ellenőrzési lépések (nyilvántartás-ellenőrzés, audit, harmadik fél vizsgálata) továbbra is érvényesek és köszönően fogadottak.'
    - q: 'Mely entitásnak kell szerepelnie a megrendelésem dokumentációján?'
      a: 'A megrendelések a Qingdao Vatrad Group Co., Ltd.-hez érkeznek, amely a Vatrad (gyártódivízió) néven működik, az iSupfactory pedig a SUP terméksor. A szerződéses dokumentumokat az Értékesítési alelnök, a Műszaki Igazgató és a QA-igazgató írja alá.'
    - q: 'Kaphatok-e másolatot a tanúsítványokról a megrendelés előtt?'
      a: 'Igen – a tanúsítványszámokat és az auditnyilvántartásokat kérésre vagy audit során szolgáltatjuk ki. A lista közzétett, soha nem „csak kérésre elérhető”.'
    - q: 'Hogyan ellenőrizzem magam a szállítmány próbanyilvántartásait?'
      a: 'Minden rekeszt 18.0 PSI nyomáson vizsgálunk 24 órán át, 0.50 PSI-nél nagyobb esésnél automatikus elutasítással; a próbajegyzetek a gyártási számokhoz kapcsolódnak, és minden szállítmányt kísérnek a Megfelelőségi tanúsítvánnyal. Az ISO 2859-1 II. szint szerinti SGS, TÜV, BV vagy Intertek vizsgálat feladás előtt programozható, az Ön választása szerint.'
    - q: 'A tanúsítványok a tartozékokra is kiterjednek?'
      a: 'A REACH/RoHS alapanyag-dokumentáció az ugyanabban a megrendelésben kiszállított deszkákra és tartozékokra vonatkozik, a QC ellenőrző listák pedig a teljes készletet lefedik – deszka, evező, pumpa, biztonsági öv és hátizsák.'
    - q: 'Mi történik a bizonyítékokkal a megrendelés után?'
      a: 'A szállítmány ERP nyomon követhetőségét 10 évig megőrizzük. A minőségirányítási rendszer SOP eljárásai és az ellenőrzési szabványok letölthetők maradnak, a vásárló pedig a szerződés szerint fenntartja a gyártás alatti auditjogát.'

