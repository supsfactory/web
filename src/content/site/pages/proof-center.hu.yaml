certifications:
  tagline: 'Tanúsítványok és hatókör'
  title: 'Mivel rendelkezünk, mi tartozik bele, hogyan ellenőrizhető'
  subtitle: 'A közzétett lista – soha nem „csak kérésre elérhető”. A tanúsítványszámok és az auditnyilvántartások kérésre vagy audit során szolgáltatjuk ki.'
  headers:
    certificate: 'Tanúsítvány / szabvány'
    scope: 'Lefedettség'
    verify: 'Hogyan ellenőrizhető'
  rows:
    - certificate: 'ISO 9001:2015'
      scope: 'Minőségirányítás a SUP tervezéséhez és gyártásához'
      verify: 'A tanúsítványszám és az auditnyilvántartások kérésre vagy az audit során'
    - certificate: 'ISO 25649'
      scope: 'A felfújható csónakok biztonsága és szerkezeti megfelelősége (Európa)'
      verify: 'Megfelelőségi dokumentáció minden termékcsaládhoz'
    - certificate: 'CE'
      scope: 'EU megfelelőség a felfújható SUP termékekre'
      verify: 'A CE dokumentációt a megrendelésekkel együtt adjuk át'
    - certificate: 'BSCI'
      scope: 'Szociális megfelelőség a telephelyre és a munkaerőre'
      verify: 'Az auditjelentés kérésre rendelkezésre áll'
    - certificate: 'REACH és RoHS'
      scope: 'Anyagkorlátozások és alapanyag-dokumentáció'
      verify: 'Alapanyag-dokumentáció minden megrendeléshez'
    - certificate: 'Harmadik fél vizsgálata (opcionális)'
      scope: 'SGS, TÜV, BV vagy Intertek vizsgálat feladás előtt'
      verify: 'ISO 2859-1 II. szint, az Ön választása szerint programozva'

