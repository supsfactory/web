faqs:
  title: 'Вопросы об OEM-производстве весел'
  subtitle: 'Ответы на самые частые вопросы брендов, запускающих собственное весло.'
  items:
    - title: 'Как создать собственный бренд весел?'
      description: 'Запуск бренда: бриф, дизайн, прототип с сертификацией CE, серийное производство и доставка. Образцы за 7–12 дней, производство за 25–35 дней от заказа и задатка. Ознакомьтесь с нашими пакетами OEM.'
    - title: 'Каков срок изготовления?'
      description: 'Образец готов за 7–12 дней, серийное производство занимает 25–35 дней после заказа и задатка — в зависимости от объёма.'
    - title: 'Наносится ли на весло наш логотип?'
      description: 'Да — полный private label: печать логотипа, индивидуальные цвета, упаковка и этикетки в стиле вашего бренда.'
    - title: 'Можно ли сразу покупать оптом?'
      description: 'MOQ подтверждается конфигурацией проекта — образец (1–2 шт.), пилотная партия (20–50 шт.) и стандартная серия (90–100+ шт. на партию), при этом оптовые ценовые уровни снижаются по мере роста объёма.'

