answer:
  label: 'Короткий ответ'
  text: 'Минимальный заказ подтверждается конфигурацией проекта: образец (1–2 шт.), пилотная партия (20–50 шт.) и стандартная серия (90–100+ шт. на партию с рулона drop-stitch 150 m), а также мелкосерийный со-брендинг от 5–10 шт. Образцы отгружаются за 7–12 дней; серийное производство занимает 25–35 дней после подтверждения заказа и внесения задатка. Сертификация CE для моделей для рынка ЕС и полный комплект документов о соответствии включены в каждый заказ.'
  verified: 'Сентябрь 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Надувное весло OEM на заказ с логотипом бренда
  actions:
