how_to_choose:
  title: Så hittar du rätt storlek
  cards:
    - title: SUP-brädor
      description: Välj längd utifrån din vikt och det avsedda bruket. De bredare brädorna (32"+ – 81 cm+) ger mer stabilitet. De längre brädorna (11–12 ft) håller bättre spår under turer. Tyngre paddlare behöver brädor med större volym.
    - title: Touring-SUP
      description: De längre brädorna (11–12 ft) passar bäst för distanspaddling och turer. De bredare brädorna (32"+ – 81 cm+) ger mer stabilitet. Kontrollera bärkraften för den totala vikten inklusive utrustning.
    - title: Allround-SUP
      description: Välj längd utifrån användarens vikt och det avsedda bruket. Allround-brädor passar för fritid, fitness och yoga. Mindre brädor är lättare att manövrera.

