  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p>Chaque voie de cette matrice commence par les mêmes deux éléments : notre <a href="/fr/oem-manufacturing">programme de fabrication OEM/ODM</a> et l'<a href="/fr/factory">usine qui le soutient</a> — une installation de 12 500 m&sup2;, un même ensemble de normes de qualité, chaque canal desservi.</p>
