answer:
  label: 'Hvad der sker nu'
  text: 'Når du har indsendt en projektsbrief, modtager du et svar inden for en arbejdsdag. En NDA kan underskrives, før du deler proprietære detaljer. Vores konstruktionsteam gennemgår din brief og returnerer et specificeret tilbud med MOQ, prøvegebyrer og en tidsplan port for port — typisk 7–12 dage til prøver og 6–8 uger til første produktion efter bekræftet ordre. Prøvegebyrerne modregnes i din produktionsordre. Ingen forpligtelse, før du underskriver.'
  verified: 'September 2026'

process_steps:
  tagline: Processen
  title: 'Fra brief til leverede brætter — fem trin'
  subtitle: 'Hvert trin har en fastsat tidsplan, et dokumenteret resultat og en go/no-go-kontrol. Du går videre, når du er klar.'
  steps:
    - step: 'Trin 1'
      title: 'Indsend din projektsbrief'
      desc: 'Fortæl os om dit bræt — målspecifikationer, volumen, overensstemmelsesbehov og tidsplan. Briefen tager 5–10 minutter. Hvis du ikke er sikker på alle detaljer, del det, du har, så guider vi resten. En NDA kan underskrives, før du deler proprietære designs.'
    - step: 'Trin 2'
      title: 'NDA og gennemgang af muligheder (1–5 dage)'
      desc: 'Vi underskriver en NDA, hvis du beder om det, hvorefter konstruktionen gennemgår din brief i forhold til produktionskapacitet, materialetilgængelighed og overensstemmelsesomfang. Du modtager et specificeret tilbud med MOQ-beregning, prøvegebyrer og en tidsplan port for port.'
    - step: 'Trin 3'
      title: 'Prøve og godkendelse (7–21 dage)'
      desc: '1–2 fysiske brætter produceres efter din specifikation. Du sejler og vurderer — skrogstivhed, trykkets nøjagtighed, tilpasning af tilbehør. Ændringer registreres i en revideret stykliste. Den frosne prøve bliver produktionsreferencen. Prøvegebyrerne modregnes i produktionen.'
    - step: 'Trin 4'
      title: 'Planlægning før produktion (7 dage)'
      desc: 'Materialeindkøb, klargøring af værktøj, bekræftelse af emballage og reservation af produktionskapacitet. Alle materialer inspiceres ved modtagelsen mod den frosne stykliste. En produktionsplan med datoer for QC-porte udstedes, før produktionen begynder.'
    - step: 'Trin 5'
      title: 'Produktion, QC og afsendelse (4–6 uger)'
      desc: 'Fremstillingen kører gennem det 7-trins inspektionsportssystem med acceptkriterier i hver port. Eksportklar emballage, overensstemmelsesdokumentation og koordinering af søfragt til over 50 lande. En evaluering efter leveringen samler forbedringer til næste ordre.'

