what_we_need:
  heading: 'Hvad du skal forberede, før du skriver briefen'
  body: |
    En fuldstændig brief fremskynder processen. Her er, hvad der hjælper:

    - **Brætspecifikationer** — Mållængde, bredde, tykkelse, rytterens vægt, anvendelse. Mål på et referencebræt eller konkurrenternes modeller er nyttige.
    - **Designfiler** — Vektorartwork (AI, SVG, PDF) til tryk og logoer. Hvis det ikke er klar, fungerer moodboards eller referencebilleder til den første vurdering af mulighederne.
    - **Volumen og tidsplan** — Ønsket antal og sæsonplan. Selv et groft interval ("20–50 brætter inden marts") er nok til at starte.
    - **Overensstemmelsesbehov** — Målmarkeder og eventuelle særlige certificeringskrav ud over CE, ISO 9001, BSCI, REACH, RoHS.
    - **Budgetinterval** — Et indicativt budget pr. bræt eller en målpris inkl. fragt hjælper os med at anbefale den rette platform.

    **Ikke klar med det hele?** Indsend det, du har. Vi guider resten.

faqs:
  tagline: FAQ
  title: 'Sådan starter du et SUP-projekt — ofte stillede spørgsmål'
  items:
    - q: 'Hvad er minimumsordren for at komme i gang?'
      a: 'Indgangen er trinfordelt: først 1–2 prøver (7–12 dage), derefter en prøveordre på 20–50 brætter (25–35 dage) og til sidst serier i standardvolumen på 90–100+ brætter pr. godkendt konfiguration. Private label co-branding starter ved 5–10 stk. uden udviklingstrin.'
    - q: 'Hvor lang tid tager det at få prøver?'
      a: 'Fysiske prøver produceres på 7–12 dage efter bekræftet specifikation og depositum. Med eksisterende skrogplatforme tager hele cyklusen fra brief til leveret prøveordre typisk 8–12 uger. Et specialskrog koster 15–20 dages formudvikling extra.'
    - q: 'Er mit design beskyttet?'
      a: 'Ja. En NDA kan underskrives med det samme — før du deler nogen proprietære oplysninger. Vi producerer udelukkende under vores kunders mærker og konkurrerer aldrig med dem. Alle tekniske filer opbevares i adgangskontrollerede systemer med revisionsspor.'
    - q: 'Hvad spørger projektsbriefen om?'
      a: 'Briefen beder om din forretningstype, virksomhedsnavn, ønskede brætspecifikationer, ordremængdeinterval, tidsplan og eventuelle overensstemmelseskrav. Den tager cirka 5–10 minutter. Du kan vedhæfte designfiler (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) på op til 10 MB. Er du i tvivl om et felt, kan du springe det over — vi følger op.'
    - q: 'Hvad sker der, efter jeg har indsendt briefen?'
      a: 'Du modtager et svar inden for en arbejdsdag. Vores konstruktionsteam gennemgår din brief og returnerer et specificeret tilbud med MOQ, prøvegebyrer og en tidsplan port for port. Du er ikke forpligtet til noget, før du har gennemgået og underskrevet kontrakten. Prøvegebyrerne modregnes i din produktionsordre.'

