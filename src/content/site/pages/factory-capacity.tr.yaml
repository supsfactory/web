hero:
  tagline: Üretim Kapasitesi
  title: Üretim Kapasitesi ve Yıllık Çıktı
  subtitle: Yılda 120.000+ SUP tahtası üreten, ölçeklenmeye açık 12.500 m² tesis

answer:
  label: 'Net cevap'
  text: 'Fabrika kapasitesi: dört uzmanlaşmış atölyeye yayılmış 12.500 m², yılda 120.000+ SUP tahtası, iki vardiyada 350+ çalışan, 50+ ülkeye ihracat. MOQ proje yapılandırmasıyla belirlenir — numune (1–2 adet), pilot (20–50 adet) ve standart hacim (150 m rulo başına 90–100+ adet); eksiksiz mantık için MOQ ve Esnek Markalama Kılavuzumuzu inceleyin. Teslim süresi 25–35 gün, numune 7–12 gün.'
  verified: 'Eylül 2026'

intro: 'Vatrad, Çin’in Qingdao kentindeki en büyük özel şişirilebilir SUP üretim tesislerinden birini işletir. 12.500 m²lik fabrikamız, paralel çalışan dört uzmanlaşmış atölyeye ayrılmıştır. Yıllık SUP kapasitesi 120.000+ şişirilebilir SUP tahtasıdır (ayda yaklaşık 10.000 adet); ayrı ürün hatlarında 50.000+ canlı yelek ve 5.000+ aksesuar üretilir.'

highlights:
  - value: 12.500 m²
    label: Toplam üretim alanı
    detail: 4 uzmanlaşmış atölyeye yayılmış
  - value: 120.000+
