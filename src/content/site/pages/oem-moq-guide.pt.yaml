moq_stages:
  tagline: 'Amostra · Piloto · Volume'
  title: 'Três níveis de quantidade bem distintos'
  subtitle: 'As quantidades de produção para amostra, piloto e volume são diferentes. Cada projeto é dividido em três fases separadas, para que possas validar antes de te comprometeres.'
  steps:
    - step: '01'
      title: 'Desenvolvimento da amostra (1–2 unidades)'
      desc: 'Confirmação física da rigidez do casco, aderência do tapete antiderrapante EVA, precisão das gráficas e ajuste dos acessórios antes de qualquer compromisso financeiro. As taxas de amostras aplicam-se e são creditadas na encomenda de produção após a assinatura do contrato.'
    - step: '02'
      title: 'Encomenda piloto (20–50 unidades)'
      desc: 'Testes comerciais pré-época e validação do mercado regional com plataformas de casco existentes, materiais padrão e embalagem simplificada, para minimizar os esforços de ferramental.'
    - step: '03'
      title: 'Produção em quantidade (90–100+ unidades)'
      desc: 'Confirmada após BOM congelado, artwork finalizado, embalagem personalizada e datas de entrega planeadas — bobinas completas de 150 m, tecidos Pantone personalizados, embalagem à medida, descontos de volume e rastreabilidade completa dos lotes ao longo de toda a cadeia.'

moq_factors:
  tagline: O que determina o teu MOQ
  title: 'Porque é que o MOQ totalmente personalizado é sempre específico do projeto'
  subtitle: 'Para a produção 100% à medida, o MOQ é calculado a partir de toda a arquitetura de produto — estes quatro componentes são avaliados em conjunto antes da proposta.'
  headers:
    component: Componente do projeto
    driver: Motor de produção
    impact: Impacto na quantidade mínima
  rows:
    - component: 'Forma do casco e ferramental'
      driver: 'Formas rocker de fábrica existentes vs. ferramentas de corte CAD personalizadas e equipamento de prensa a quente EVA'
      impact: 'Plataformas existentes: encomendas piloto de 20 peças. Cascos dedicados: necessária a amortização do ferramental dedicado.'
    - component: 'Variantes de cor e PVC'
      driver: 'Cores padrão únicas de armazém vs. lonas PVC tingidas Pantone proprietárias'
      impact: 'O PVC Pantone personalizado exige runs de tingimento químico dedicados com as próprias quantidades mínimas de matéria-prima.'
    - component: 'Embalagem com marca'
      driver: 'Caixas padrão com autocolantes de código de barras vs. caixas de presente comerciais de 5 camadas a cores e manuais com marca'
      impact: 'As caixas personalizadas a cores têm o seu próprio volume mínimo de impressão offset (normalmente 500+ caixas).'
    - component: 'Pacotes de acessórios'
      driver: 'Pás de alumínio ou nylon padrão vs. pás de carbono combinadas à medida e bombas com marca'
      impact: 'Os acessórios totalmente personalizados seguem os lotes de produção dos sub-fornecedores.'

