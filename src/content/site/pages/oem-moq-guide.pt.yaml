moq_faqs:
  tagline: FAQ
  title: 'Perguntas frequentes sobre o MOQ'
  items:
    - q: 'O MOQ é calculado por encomenda, por modelo ou por variante de cor?'
      a: 'O MOQ pode valer por modelo, variante de cor, versão do artwork, configuração da embalagem ou encomenda global. Como diferentes espessuras de drop-stitch (12 cm vs. 15 cm) e cores PVC vêm de bobinas de matéria-prima separadas, uma encomenda de 50 pranchas distribuída por 5 cores exige 5 bobinas de tecido separadas. Confirmamos o cálculo exato contra a tua matriz de SKUs antes da proposta, para que possas planear o teu mix.'
    - q: 'Posso encomendar uma amostra antes da produção em massa?'
      a: 'Sim. O desenvolvimento da amostra (1–2 unidades) verifica a rigidez do casco, a aderência do tapete antiderrapante EVA, a precisão das gráficas e o ajuste dos acessórios antes da aprovação para a produção em massa. As taxas de amostras aplicam-se e são creditadas na encomenda de produção após a assinatura do contrato.'
    - q: 'Porque é que a embalagem comercial personalizada tem o seu próprio MOQ?'
      a: 'As prensas flexográficas ou offset personalizadas para as caixas exigem um volume mínimo de preparação de 500+ unidades. Oferecemos uma solução de armazenamento híbrido da embalagem: produzimos as 500 caixas impressas personalizadas, armazenamos o excedente no nosso armazém limpo e libertamo-lo conforme os envios programados das tuas pranchas — assim até uma encomenda de pranchas mais pequena pode ser enviada totalmente com marca no cartão comercial.'
    - q: 'Porque é que o MOQ padrão é de 90–100 unidades?'
      a: 'O MOQ padrão segue a matéria-prima: uma bobina-mãe de 150 m de tecido drop-stitch de alta qualidade produz cerca de 90–100 pranchas acabadas para um casco Touring ou Allround padrão. As bobinas completas eliminam as junções de tecido, mantêm uniforme a tensão das fibras e amortizam a calibração de 2 horas das linhas de soldadura e laminação — aos custos unitários mais baixos possíveis.'
    - q: 'Uma quantidade maior baixa o preço unitário?'
      a: 'Na maioria dos projetos sim. Quantidades maiores melhoram o rendimento dos materiais, distribuem os custos fixos de preparação das linhas de produção por mais pranchas e reduzem os custos de embalagem por unidade.'
    - q: 'Os custos dos moldes de co-branding recaem nas reencomendas?'
      a: 'Não. Os custos dos moldes de serigrafia são cobrados uma única vez na primeira configuração e anulados nas reencomendas com o mesmo formato de artwork. Pagas apenas a taxa de processamento e impressão em fábrica de $1.00 USD por prancha.'
    - q: 'Um pedido de consultoria sobre o MOQ obriga-me a uma encomenda?'
      a: 'Não. Um pedido de consultoria sobre o MOQ baseado no projeto permite simplesmente que a nossa equipa técnica da Qingdao Vatrad Group Co., Ltd. examine o teu briefing técnico e aconselhe o percurso de produção mais económico. Está disponível um acordo de não divulgação (NDA) antes de partilhares especificações técnicas proprietárias ou artwork.'

