answer:
  label: 'Mi következik'
  text: 'A projektbrief elküldése után egy munkanapon belül válaszolunk. Az NDA a bizalmas részletek megosztása előtt áll rendelkezésre. A mérnöki csapat elemzi a briefjét, és részletes ajánlatot ad vissza MOQ-val, a minták költségével és lépésenkénti ütemtervvel – általában 7–12 nap a mintákra és 6–8 hét az első gyártásra, a megrendelés visszaigazolásától számítva. A minták költségét levonjuk a gyártási megrendeléséből. Az aláírás előtt semmilyen kötelezettség nincs.'
  verified: '2026. szeptember'

process_steps:
  tagline: A folyamat
  title: 'A brieftől a kiszállított deszkákig – öt lépés'
  subtitle: 'Minden lépésnek meghatározott határideje, dokumentált eredménye és „igen vagy nem” döntési pontja van. Csak akkor lépjen tovább, ha készen áll.'
  steps:
    - step: '1. lépés'
      title: 'Küldje el a projektbriefet'
      desc: 'Meséljen a deszkájáról – célspecifikációk, mennyiség, megfelelőségi igények és határidő. A brief kitöltése 5–10 percet vesz igénybe. Ha nem biztos néhány részletben, küldje el, ami van, a többiben mi útmutatást adunk. Az NDA a bizalmas projektek elküldése előtt elérhető.'
    - step: '2. lépés'
      title: 'NDA és megvalósíthatósági elemzés (1–5 nap)'
      desc: 'Kérésre aláírjuk az NDA-t, majd a mérnöki csapat elemzi a briefjét a gyártási képesség, az alapanyag-elérhetőség és a megfelelőségi hatókör szempontjából. Részletes ajánlatot kap: MOQ-számítás, minta költsége és lépésenkénti ütemterv.'
    - step: '3. lépés'
      title: 'Minta és jóváhagyás (7–21 nap)'
      desc: '1–2 fizikai deszka, az Ön specifikációi szerint gyártva. Használja és értékelje – héjmerevség, grafikai pontosság, tartozékszerelés. A módosításokat egy felülvizsgált alapanyaglistába (BOM) rögzítjük. A lefagyasztott minta lesz a gyártási referencia. A minták költségét levonjuk a gyártásból.'
    - step: '4. lépés'
      title: 'Előgyártási tervezés (7 nap)'
      desc: 'Alapanyagbeszerzés, szerszámelőkészítés, csomagolás megerősítése és gyártási helylácsa. Minden alapanyagot a lefagyasztott BOM szerint, átvételkor ellenőrizünk. A gyártás megkezdése előtt szakaszonkénti minőségi ellenőrzési időpontokkal ellátott gyártási ütemtervet adunk ki.'
    - step: '5. lépés'
      title: 'Gyártás, minőségi ellenőrzés és kiszállítás (4–6 hét)'
      desc: 'A gyártás a 7 lépésből álló ellenőrzési rendszeren megy keresztül, minden lépésnél elfogadási vagy elutasítási kritériumokkal. Export-szintű csomagolás, megfelelőségi dokumentáció és tengeri szállítás koordinálása több mint 50 országba. A kiszállítás után az Ön értékelése rögzíti a következő megrendeléshez szánt javításokat.'

