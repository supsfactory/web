what_we_need:
  heading: 'Mit készítsen elő a brief előtt'
  body: |
    A teljes brief felgyorsítja a folyamatot. Íme, mi segít:

    - **A deszka specifikációi** — hossz, szélesség, cél-vastagság, az evező súlya, felhasználási eset. Más deszkák vagy versenytársak referenciaméretei is hasznosak.
    - **Tervezési fájlok** — vektorgrafika (AI, SVG, PDF) az illusztrációkhoz és a logókhoz. Ha nem állnak készen, a moodboard-ok vagy a referenciaképek is elegendők a kezdeti megvalósíthatósághoz.
    - **Mennyiség és határidő** — a célmennyiség és a szezon ütemterve. Még egy hozzávetőleges tartomány is (például „20–50 deszka márciusig”) elég a kezdéshez.
    - **Megfelelőségi igények** — a célpiacok és minden további, a CE, az ISO 9001, a BSCI, a REACH és a RoHS melletti specifikus tanúsítási követelmény.
    - **Költségvetési tartomány** — egy orientáló ár deszkánként vagy egy célár „gyárkapunál” segít a megfelelő platform kiválasztásában.

    **Nincs minden készen?** Küldje el, ami van. A többiben mi vezetjük.

faqs:
  tagline: GYIK
  title: 'SUP-projekt indítása – gyakori kérdések'
  items:
    - q: 'Mi a minimális megrendelés az induláshoz?'
      a: 'A belépési út lépcsőzetes: először 1–2 minta (7–12 nap), majd egy 20–50 deszkás próbarendelés (25–35 nap), ezt követi a 90–100+ deszkás standard tömeggyártás minden jóváhagyott konfigurációhoz. A private label co-branding 5–10 darabtól indul, fejlesztési szakasz nélkül.'
    - q: 'Mennyi idő alatt kapom meg a mintákat?'
      a: 'A fizikai minták a specifikációk és az előleg visszaigazolásától számított 7–12 nap alatt készülnek el. Meglévő héjplatformok használata esetén a teljes ciklus, a brieftől a kiszállított pilóta megrendelésig, általában 8–12 hét. A teljesen testreszabott héj további 15–20 napot ad a szerszámfejlesztésre.'
    - q: 'A dizájnom védett?'
      a: 'Igen. Az NDA azonnal rendelkezésre áll – a bizalmas adatok megosztása előtt. Kizárólag ügyfeleink márkáinak gyártunk, és soha nem versenyzünk velük. Minden műszaki fájl vezérelt hozzáférésű, auditnyomatosú rendszerekben tárolódik.'
    - q: 'Mit kér a projektbrief űrlapja?'
      a: 'A brief a cégtípust, a céget, a deszka célspecifikációit, a mennyiségtartományt, a határidőt és az esetleges megfelelőségi követelményeket kéri. Kitöltése kb. 5–10 percet vesz igénybe. Tervezési fájlokat csatolhat (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) maximum 10 MB-ig. Ha egy mezővel kapcsolatban bizonytalan, üresen hagyhatja – utána felvesszük Önnel a kapcsolatot.'
    - q: 'Mi történik a brief elküldése után?'
      a: 'Egy munkanapon belül válaszolunk. A mérnöki csapat elemzi a briefjét, és részletes ajánlatot ad vissza MOQ-val, a minták költségével és lépésenkénti ütemtervvel. A szerződés áttekintéséig és aláírásáig semmilyen kötelezettség nem áll fenn. A minták költségét levonjuk a gyártási megrendeléséből.'

