      desc: 'Vanhentuneet työpajan kortit kerätään fyysisesti pois ja mitätöidään (reikäkoneistetaan) ennen kuin uusi, ohjatulla punaisella sinetillä leimattu kortti annetaan — vanha ja uusi versio eivät koskaan jaa työpajaa.'

