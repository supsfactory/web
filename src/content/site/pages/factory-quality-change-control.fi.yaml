      desc: 'Korkean riskin muutokset vaativat vähintään 5 edustavaa näytelautaa, jotka kattavat ylä- ja al Toleranssirajat ja jotka 2 riippumatonta laadunvalvonnan tarkastajaa tarkastavat kokonaan, ennen kuin validointiraportti voidaan antaa — yhtä korjattua lautaa ei koskaan pidetä prosessin validointina.'
    - icon: 4
