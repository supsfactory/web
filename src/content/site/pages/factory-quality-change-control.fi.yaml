cc_pokayoke:
  tagline: Virheiden torjuntaturvat
  title: 'Poka-Yoke: kovat esteet, jotka pysäyttävät valvomattomat muutokset'
  subtitle: Standardia ei valvota vain menettelyillä, vaan fyysisillä ja järjestelmätason esteillä, jotka tekevät valvomattomien muutosten toteuttamisesta mahdotonta.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR-portti työkaluston avaamiseen
      desc: 'Korjausasemat lukevat laadunvalvonnan allekirjoittaman ECR-viivakoodin ennen kuin paineilmaventtiilit ja liimansekoittimet avautuvat. Ei hyväksyttyä muutosvalvontakirjausta, ei toimitusta — takautuva hyväksyntä ("muuta ensin, allekirjoita myöhemmin") on fyysisesti estetty.'
