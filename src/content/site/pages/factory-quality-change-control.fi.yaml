      desc: 'Väliaikaiset poikkeamat rajataan järjestelmässä kovasti (esimerkiksi enintään 50 lautaa tai 7 kalenteripäivää). Raja saavuttaessa erä lukitaan ja lähetyksen läpäpäisevä tunniste estetään tulostamasta, kunnes muutos on formaalisti arvioitu.'
    - icon: 3
