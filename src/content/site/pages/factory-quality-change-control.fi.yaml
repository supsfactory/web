faqs:
  tagline: FAQ
  title: Usein kysytyt kysymykset korjauksen muutosvalvonnasta
  items:
    - q: 'Voiko tehdas muuttaa korjausparametreja kertomatta siitä?'
      a: 'Ei. Jokainen ehdotettu muutos hyväksytyissä korjausmateriaaleissa, prosessin oloissa, työkalustossa, testimenetelmissä, tarkastuskriteereissä tai valtuutetussa henkilöstössä on läpikäytävä ensin dokumentoitu muutosvalvonta. Muutokset, jotka vaikuttavat asiakkaan hyväksymiin määrityksiin, näytteisiin, materiaaluluetteloihin, artworkiin tai hyväksymiskriteereihin, vaativat asiakkaan kirjallisen hyväksynnän.'
    - q: 'Mikä luetaan korkean riskin muutokseksi?'
      a: 'Muutokset korjausmateriaaleissa tai toimittajissa, paine- ja pito- tai jännitysolosuhteissa, venttiilin, kiskon ja sauman korjausmenetelmissä, tarkastus- tai hyväksymiskriteereissä sekä virheen laajuuden laajentuminen rakenteellisiin vyöhykkeisiin luokitellaan korkean riskin muutoksiksi. Ne vaativat osastojen välisen katselun, hyväksytyn validointisuunnitelman ja ohjatun pilottitoteutuksen ennen vakiintunutta käyttöä.'
    - q: 'Voiko väliaikaista poikkeamaa käyttää loputtomiin?'
      a: 'Ei. Jokaisella väliaikaisella poikkeamalla on määritelty voimassaoloikkuna, erälaajuus, määräraja ja validointivaatimukset sekä automaattinen vanheneminen. Raja saavuttaessa erä lukitaan ja läpäpäisevän tunniste tulostus estetään, kunnes muutos on formaalisti arvioitu.'
    - q: 'Miten muutettu menetelmä todistetaan toimivaksi ennen laajaa käyttöä?'
      a: 'Korkean riskin muutokset vaativat validointisuunnitelman: vähintään 5 edustavaa näytelautaa, jotka kattavat toleranssirajat ja joita 2 riippumatonta laadunvalvonnan tarkastajaa testaavat kvantifioituja hyväksymiskriteerejä vasten (vuodon poistaminen, painepito, venttiilin toiminta, sauman kestävyys, ulkonäkö). Hyväksyntä validointiin ei ole hyväksyntä soveltamiseen.'
    - q: 'Tarvitsemmeko meidän hyväksyä jokainen muutos?'
      a: 'Ei jokaista muutosta, mutta mikään muutos, joka vie tuotteen pois asiakkaan hyväksymästä näytteestä, teknisestä määrityksestä, materiaaliluettelosta, artworkista, pakkauksesta tai hyväksymiskriteereistä, toteutetaan vain asiakkaan kirjallisella hyväksynnällä. Ilman sitä laudat korjataan alkuperäisen vaatimuksen mukaisesti, korvataan tai hylätään.'
    - q: 'Mitä vanhoille asiakirjoille tapahtuu, kun muutos hyväksytään?'
      a: 'Vanha työohjeet, parametrikortit ja tarkastuslehdet kerätään fyysisesti pois ja mitätöidään (1-in-1-out), merkitään OBSOLETE ja korvataan uudella ohjatulla revisiiolla koulutuksen jälkeen. Vanha ja uusi versio eivät koskaan jaa työpajaa.'
    - q: 'Miten kauan muutosvalvontakirjauksia säilytetään?'
      a: 'Sulkemiskirjaukset — validointinäyttö, asiakirjarevisiot, koulutuskirjaukset ja vaikuttavuuskatselmukset — säilytetään kirjojen säilytyskäytöntömme mukaisesti (vähintään 3 vuotta sulkemiskirjauksille), jotta jokainen muutos pysyy jäljitettävissä auditointeja ja jäljitettävyyskatselmuksia varten.'

