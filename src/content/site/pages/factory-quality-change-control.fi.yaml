cc_validation:
  tagline: Tuotetekninen validointi
  title: Validointi- ja hyväksymisprotokolla — näyttö ennen väitteitä
  body: |
    Epämääräistä hyväksymiskieltä kuten *"korjatun laudan on oltava hyvä"* ei hyväksytä. Ohjattu sanasto on seuraava:

    > "Korjatun näytteen on täytettävä samat sovellettavat ilmatiiviyden, silmämääräisen työn laadun, venttiilin toiminnan ja projektikohtaiset hyväksymiskriteerit kuin vaatimustenmukainen lauta, ellei asiakkaan hyväksymä poikkeama määrittele nimenomaisesti vaihtoehtoista kriteeriä."

    Validointinäyttö on kvantitatiivista, ja ilmatiiviyskorjauksen tuotetekninen perusarvo sisältää seuraavat:

    - **Vuodon poistaminen ja painepito.** Alkuperäinen vuoto poistetaan ilman jatkuvia kuplia saippuavesivuodon tunnistuksessa; lauta säilyttää vakiintuneen testipaineen 18.0 PSI 24 tuntia, ja lämpötila-/kosteuskompensoinnin jälkeen netto paineen lasku on ΔP ≤ 0.2 PSI — tämä on korjausvalidoinnin tiukempi perusarvo, erillinen tuotantolinjan lopputarkastuksessa käytettävästä 0.50 PSI automaattisesta hylkäysrajasta.
    - **Venttiilin toiminta.** Venttiilin rungon momentti täyttää 15–20 N·m:määrityksen, eikä tiivisteessä ole mikrokuplivuotoa korkean paineen täytöllä ja dynaamisella painamisella.
    - **Sauman liimaus ja kestävyys.** Liiman reunoissa ei ole nostoa, valkoistumista tai delaminoitumista; lämpö-kosteusvanhenemissyklisten jälkeen liimakerros ei pehmene eikä halkeilu ole hauraan luonteinen.
    - **Ulkonäkö ja työn laatu.** Ei liiman valumisjälkiä, ei EVA-vahinkoja, ei laudan vääntymistä eikä logon siirtymää tai painopinnan naarmuja.

cc_engineering:
  tagline: Tuotetekninen toteutusmatriisi
  title: Neljän ydinkorjausprosessin kvantifioidut parametrit
  subtitle: 'Jokaisessa ohjatussa korjausprosessissa on määritetyt parametrit, menetelmä ja hyväksymiskriteerit — samat luvut, joita operoijamme noudattavat ja asiakkaamme voivat auditoinneissa tarkastaa.'
  headers:
    process: Korjausprosessi
    parameters: Ohjatut parametrit
    methodology: Testimenetelmä
    acceptance: Hyväksymiskriteerit
  rows:
    - process: 'Neulansuojan / mikrokuopan paikkauskorjaus'
      parameters: 'Puhdistus liuotteella ja kuivatus 3–5 min; kuumailma-aktivointi 60°C ± 5°C; puristustela ≥ 0.4 MPa'
      methodology: 'Täyttö 18 PSI:hin; täysi upotus veteen tai saippuaveden levitys; tarkkailu 10 minuutin ajan'
      acceptance: 'Ei lainkaan kuplien muodostumista; 180° reunojen nosto ilman nousua ja ilman liiman valumisjälkiä'
    - process: 'Kiskonauhan / sauman uudelleenliimaus'
      parameters: 'Kaksikomponenttisen liiman suhde tiukasti valvottu; ympäristö 22–28°C, ≤ 65% RH; kiinnikepaine ≥ 4 h'
      methodology: '22 PSI:n ylipainetesti 2 h; sitten 50°C:n lämpökaapissa 6 h ja 2 h huoneenlämpöinen tauko'
      acceptance: 'Ei erottumista, ei halkeilua; netto paineen lasku ΔP ≤ 0.1 PSI; liimakerros ilman valkoistumista tai haurastumista'
    - process: 'Venttiilin pohjan löysentyminen / mikrokuoppa'
      parameters: 'Omalla avaimella momentti 18–20 N·m; tiivistetiiviste litteäksi ilman vääntymistä; kierteiden puhtaus vahvistettu'
      methodology: 'Täyttö 15 PSI:hin; 20 täyttö/tyhjennyssykliä; tarkkailu veteen upotettuna'
      acceptance: 'Ei kuplia venttiilin rungossa eikä sen ympärillä; momentti syklin jälkeen ≥ 16 N·m'
    - process: 'Lopullinen 24h painepidon testi'
      parameters: 'Viitteellinen täyttöpaine 18.0 PSI; digitaalimittari Class 1.0 / ±0.5%; ympäristön lämpötila ja kosteus kirjataan ja kompensoidaan'
      methodology: 'Digitaalinen painetallennin; jatkuva 24 h painekäyrä'
      acceptance: 'Netto paineen lasku kompensoinnin jälkeen ΔP ≤ 0.20 PSI / 24 h; ei laudan pullistumista tai vääntymistä'

