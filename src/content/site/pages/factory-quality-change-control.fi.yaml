cc_intro:
  tagline: Laajuus ja periaatteet
  title: Ydinhallinnan periaatteet
  body: |
    **Asiakirja:** QMS-SOP-QC-CC-001 — *Korjausprosessin parametrien muutosvalvontastandardi* (Rev 2.0, virallinen julkaisu). **Valmistaja:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Standardiviittaus:** ISO 9001:2015 Laadunhallintajärjestelmät.

    - **Ei valvomattomia muutoksia.** Korjausparametrien muutokset on ohjattava formaalin muutosvalvonnan läpi. Paikan päällä toimivat operoijat, vuoroesimiehet tai yksikään osasto eivät saa muokata hyväksyttyjä korjausparametreja suullisella sopimuksella tai käsinkirjoittamalla korjauskirjaan.
    - **Kaikkien osien kattavuus.** Valvottu laajuus kattaa ilmatiiviyden, venttiilipinnat, kiskonauhat, sauman liimauksen, kuumailmajännityksen ja painepidon testauksen — jokaisen parametrin, joka voi vaikuttaa tiivistyteen, rakenteelliseen kestävyyteen, ulkonäköön, asiakkaan hyväksyntään tai jäljitettävyyteen.
    - **Asiakkaan hyväksyntä on ehdoton raja.** Mikään muutos, joka vie tuotteen pois asiakkaan hyväksymästä näytteestä, teknisestä määrityksestä, materiaaliluettelosta, artworkista, pakkausvaatimuksesta tai hyväksymiskriteereistä, toteutetaan vain asiakkaan kirjallisella hyväksynnällä. Ilman sitä lauta korjataan alkuperäisen vaatimuksen mukaisesti, korvataan tai hylätään — tehtaas ei koskaan yksinään "höllennä" vaatimuksia.

cc_scope:
  tagline: Riskiluokitus
  title: Muutoksen laajuus ja riskiluokitus
  subtitle: Mikä tahansa seuraavista käynnistää formaalin muutosvalvonnan — asiaa ei koskaan hoideta kirjoittamalla merkintä korjauskirjaan. Riskitaso määrää hyväksyjan ja vaadittavan validoinnin määrän.
  headers:
    category: Muutosluokka
    examples: Tyypillisiä esimerkkejä
    risk: Riski
    requirements: Valvonta- ja hyväksymisvaatimukset
  rows:
    - category: 'Korjausmateriaalit'
      examples: 'Liima, puhdistusaine, paikkausmateriaali, venttiilitiiviste, pohjuste tai toimittajan vaihtuminen'
      risk: 'Korkea'
      requirements: 'Osastojen välinen katselus + materiaalien sopivuus- ja painepidontvalidointi + asiakkaan hyväksyntä sovelluksen mukaan'
    - category: 'Prosessin olosuhteet'
      examples: 'Pinnan esikäsittely, kuumailmajännityksen lämpötila/kosteus, puristuspaine, pitoaika'
      risk: 'Korkea'
      requirements: 'Tuotetekniikan ja Laadun hyväksyntä sekä lämpötila- ja kosteusikkunan validointi'
    - category: 'Työkalusto ja mittarit'
      examples: 'Painemittarit, vuotodetektorit, kuumailmapistoolit, venttiilityökalut, testausohjelmistot'
      risk: 'Keskitaso/korkea'
      requirements: 'Kalibroinnin voimassaolon tarkistus + laitteiden soveltuvuusarvio'
    - category: 'Virheen laajuus'
      examples: 'Korjausalueen laajentuminen; pinnan vuodon leviäminen kiskon, sauman tai venttiilipinnan kriittiseen vyöhykkeeseen'
      risk: 'Korkea'
      requirements: 'Rakenteelliset kantavat pinnat: pakollinen pysäytys ja uudelleenarviointi'
    - category: 'Tarkastusmenetelmät'
      examples: 'Vuodon tunnistusmenetelmä, testipaine (18.0 PSI), pitoaika (24h)'
      risk: 'Korkea'
      requirements: 'Laadun hyväksyntä + asiakkaan teknisen sopimuksen vahvistus'
    - category: 'Dokumentaatio ja valtuutus'
      examples: 'Korjausohje, tarkastuslehdet, NCR-päätöslogiikka, operoijoiden pätevyys'
      risk: 'Keskitaso'
      requirements: 'Ohjattu asiakirjarevisio (Rev A → Rev B) + koulutuskirjaukset'

cc_containment:
  tagline: Pakotisen pysäytys
  title: Välitön eristys, kun olosuhteet vakautuvat
  body: |
    > "Käytössä oleva korjausmenetelmä on asetettava katselmuksen alle eikä sitä saa soveltaa uuteen vaikutusalaan kuuluvaan tuotteeseen, ennen kuin muutos on arvioitu ja valtuutettu, ellei Laatu ja Tuotetekniikka ole hyväksynyt dokumentoitua väliaikaista poikkeamaa."

    Nykyinen korjausmenetelmä on keskeytettävä välittömästi, kun korjauksen uudelleentarkastus epäonnistuu toistuvasti, kun virhe koskee rakenteellisia kantavia vyöhykkeitä (venttiilin pohja, kiskot, saumat, keula-/häntäpainealueet), kun korvaavaa materiaalia ei ole vielä validoitu tai kun nykyiset parametrit ovat ristiriidassa asiakkaan hyväksytyn määrityksen kanssa.

    Väliaikaiset poikkeamat eivät koskaan muutu pysyväksi käytännöksi: jokaisella on määritelty voimassaoloikkuna, sovellettava erälaajuus, määräraja, validointivaatimukset ja automaattinen vanhenemismekanismi. Suullinen poikkeama ei ole poikkeama — jos sitä ei ole dokumentoitu vanhenemispäivineen, sitä ei ole olemassa.

cc_flow:
  tagline: Vakiintunyt 9-vaiheinen suljettu silmukka
  title: Muutospyynnöstä sulkemiseen ja säilytykseen
  subtitle: 'Yksi dokumentoitu silmukka jokaiselle parametermuutokselle: ehdota, seulon, arvioi, hyväksy, validoi, pilotti, varmenna, revisioi, sulje.'
  steps:
    - step: '01'
      title: Muutospyyntö (ECR)
      desc: 'Mikä tahansa osasto voi nostaa pyynnön, mutta sitä sponsoroi Tuotetekniikan, Laadun tai Tuotannon johto. ECR vastaa, miksi muutosta ehdotetaan, mitä muutetaan, mihin se vaikuttaa ja miten se varmennetaan — sisältäen muutosvalvontanumeron, siihen liittyvän NCR:n/CAPA:n, nykyisen ja ehdotetun parametrin, vaikutusalaan kuuluvat erät sekä väliaikaisuus- ja pysyvyysluokituksen.'
    - step: '02'
      title: Alustava seulonta ja eristys
      desc: 'Pyyntö seulotaan ensin väliaikaisen eristyksen varalta: onko nykyinen menetelmä keskeytettävä heti? Jos väliaikainen poikkeama sallitaan, se rajataan voimassaoloikkunalla, erälaajuudella, määrärajalla ja automaattisella vanhenemisella.'
    - step: '03'
      title: Vaikutus- ja riskiarvio
      desc: 'Tuotetekniikka, Laatu, Tuotanto, Hankinta/Toimitusketju ja Projekti arvioivat tuotteen suorituskyvyn, hyväksymiskriteerit, materiaalien sopivuuden, ulkonäön, prosessikyvykkyyden, laitteet ja mittarit, henkilöstön pätevyyden, asiakkaan vaatimukset sekä vaatimustenmukaisuuden ja jäljitettävyyden laajuuden.'
    - step: '04'
      title: Yhteiskatselus ja hyväksyntä
      desc: 'Hyväksyntä noudattaa kiinteää valtuutusmatriisia — ei "kenen ääni on kovin". Korkean riskin muutokset vaativat osastojen välisen hyväksynnän ja tarvittaessa asiakkaan kirjallisen hyväksynnän ennen mitään koetta.'
    - step: '05'
      title: Validointisuunnitelma
      desc: 'Korkean riskin muutoksille vaaditaan hyväksytty validointisuunnitelma ennen vakiintunutta soveltamista: edustavat näytelaudat, nykyinen ja ehdotettu menetelmä, testimenetelmät, hyväksymiskriteerit, tarkastusvaiheet, vastuuhenkilöt ja aikataulu.'
    - step: '06'
      title: Ohjattu pilotti ja toteutus
      desc: 'Uudet asiakirjat julkaistaan ja vanhentuneet versiot vedetään pois ja merkitään OBSOLETE; uudet materiaalit ja mittarit varmennetaan ja kalibroidaan; operoijat koulutetaan ja todetaan päteviksi; ensimmäinen erä ajetaan tiivistetyn tarkastuksen läpi selkeän tilamerkinnän kanssa.'
    - step: '07'
      title: Uudelleentarkastus ja vaikuttavuuskatselus
      desc: 'Ensimmäisen kierroksen korjausaste, uudelleentarkastuksen läpäisyaste, uusintumisaste ja ulkonäön hyväksyntä mitataan ja katselmoiin ennen kuin muutosta voidaan pitää vaikuttavana — yhtä korjattua lautaa ei koskaan pidetä prosessin validointina.'
    - step: '08'
      title: Asiakirjarevisio ja koulutus
      desc: 'Työohjeet, tarkastuslehdet, NCR-päätösvaihtoehdot, parametrikortit ja koulutusmateriaalit päivitetään uuteen revisioon, ja käytännön koulutus sekä operoijien pätevyys kirjataan.'
    - step: '09'
      title: Sulkeminen ja kirjojen säilytys
      desc: 'Muutos suljetaan vasta, kun validointinäyttö, asiakirjapäivitykset, koulutuskirjaukset ja toteutuksen vaikuttavuus on katselmoitu ja hyväksytty. Jos tavoiteltua tulosta ei saavuteta, muutos revisioidaan, jatketaan, keskeytetään tai peruutetaan.'

