headline: 'Гарантия на OEM-производство и обеспечение качества продукции'
subtitle: 'Каждая изготавливаемая нами доска производится по утвержденному образцу и задокументированным записям по партиям. Эта гарантия определяет, что мы гарантируем по продукции, выпускаемой под вашим брендом, и как обращения рассматриваются на основе этих записей.'
seo:
  headline: 'Гарантия на OEM-производство и обеспечение качества продукции | iSupfactory'
  description: 'Гарантия на производство надувных досок SUP и другой морской продукции iSupfactory: 5-летнее покрытие целостности основной ткани трубок, швов и конструктивной прочности ядра drop stitch, а также клапанов накачки и установленных заводом аксессуаров.'
  datePublished: '2024-01-01'
  dateModified: '2026-09-23'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Настоящая производственная гарантия распространяется на надувные доски SUP, каяки и морскую надувную продукцию, изготавливаемую iSupfactory — производственным подразделением Qingdao Vatrad Group Co., Ltd. — по программам OEM, ODM и Private Label. Действующей датой считается проверяемая дата производства партии или отгрузки, согласованная в заказе на закупку. Покупатель (владелец бренда) самостоятельно устанавливает политику гарантии для конечных пользователей на своем рынке; настоящая гарантия — это обязательство завода по товару в изготовленном виде.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Покрытие производственной гарантией и срок</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 лет</h3>
        <p class="text-sm text-gray-600 mt-1">Целостность основной ткани трубок (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 лет</h3>
        <p class="text-sm text-gray-600 mt-1">Конструктивная целостность корпуса из стеклопластика (где применимо)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 лет</h3>
        <p class="text-sm text-gray-600 mt-1">Герметичность швов надувных трубок</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 лет</h3>
        <p class="text-sm text-gray-600 mt-1">Функциональность клапанов накачки</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 год</h3>
        <p class="text-sm text-gray-600 mt-1">Аксессуары и вспомогательные элементы, установленные заводом</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 год*</h3>
        <p class="text-sm text-gray-600 mt-1">Коммерческое, прокатное или парковое применение — все компоненты</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Коммерческое, государственное, чартерное, прокатное или обучающее применение сокращает гарантию до 1 года. Гоночное или соревновательное применение полностью лишает гарантии, если конфигурация для гонок прямо не оговорена в договоре закупки.</p>
  </div>

  <h2>Что покрывается</h2>
  <h3>Основная ткань трубок (5 лет)</h3>
  <p>Завод гарантирует основную ткань трубок от пористости, которая существенно ухудшает способность изделия удерживать рабочее давление. Это распространяется на ткань с покрытием CSM (Hypalon) и все другие материалы ткани трубок, используемые в производстве.</p>

  <h3>Конструктивная целостность корпуса из стеклопластика (5 лет)</h3>
  <p>Для изделий с корпусом из стеклопластика (FRP) базовая композитная конструкция гарантируется от разрушения вследствие дефектов материалов или изготовления.</p>

  <h3>Герметичность швов надувных трубок (5 лет)</h3>
  <p>Швы надувных трубок, сформированные в процессе производства, гарантируются от производственных дефектов, приводящих к существенной утечке воздуха через шов. Условием покрытия являются периодический осмотр и надлежащее поддержание рабочего давления.</p>

  <h3>Функциональность клапанов накачки (5 лет)</h3>
  <p>Клапаны накачки, установленные на производстве, гарантируются от производственных дефектов материалов или изготовления, препятствующих удержанию воздуха клапаном в соответствии с конструкцией.</p>

  <h3>Аксессуары, установленные заводом (1 год)</h3>
  <p>Компоненты и элементы, установленные на заводе, гарантируются от дефектов материалов и изготовления в течение одного года. Это не распространяется на сторонние позиции, которые покрываются только гарантиями их производителей.</p>

  <h2>Что не покрывается</h2>
  <ul>
    <li>Косметические дефекты, включая изменение цвета, пятна, выцветание, матирование или любые изменения внешнего вида</li>
    <li>Проколы, порезы, разрывы или другие физические повреждения</li>
    <li>Растрескивание, растрескивание поверхности, абразивный износ, истирание или разрушение от трения и контакта</li>
    <li>Деградация от воздействия ультрафиолета, атмосферных явлений и климатических условий</li>
    <li>Повреждения от контакта с топливом, растворителями, кислотами, щелочами или химическими веществами</li>
    <li>Повреждения в результате небрежности, неправильного использования, нарушения правил эксплуатации, несчастного случая или нормального износа</li>
    <li>Проблемы с поверхностью гелькоута или краски (вспучивание, растрескивание, изменение цвета, выцветание)</li>
    <li>Повреждения от удара, нагрузки, неправильной опоры или буксировки на прицепе</li>
    <li>Повреждения от неправильного накачивания или сдувания, а также от использования неутвержденных устройств накачки</li>
    <li>Стороннее оборудование, компоненты или системы (покрываются гарантиями их производителей)</li>
  </ul>

  <h2>Обязательства производителя и способ устранения</h2>
  <p>Единственное и исключительное обязательство завода — ремонт или замена, по его выбору, любого компонента, признанного дефектным по материалу или качеству изготовления и покрытого настоящей гарантией. Ремонт или замена выполняются заводом или его уполномоченным сервисным подразделением. На отремонтированные или замененные компоненты распространяется гарантия только на неистекший срок исходного гарантийного периода.</p>

  <h2>Условия гарантии</h2>
  <ul>
    <li><strong>Ссылка на партию:</strong> В обращении необходимо указать заказ на закупку, номер партии или диапазон серийных номеров, чтобы завод мог извлечь соответствующие записи инспекции.</li>
    <li><strong>Базовые спецификации:</strong> Обращения оцениваются по утвержденному образцу, технической спецификации, графике и BOM, зафиксированным для партии, — по тем же базовым значениям, что использовались в производстве.</li>
    <li><strong>Обслуживание:</strong> Изделие должно эксплуатироваться в соответствии с опубликованными рекомендациями по уходу, включая периодический осмотр и надлежащее поддержание рабочего давления.</li>
    <li><strong>Сотрудничество:</strong> Заявитель должен полностью и оперативно сотрудничать с заводом по всем вопросам, касающимся гарантийных обращений, включая осмотр затронутых изделий.</li>
    <li><strong>Гарантийная политика покупателя:</strong> Покупатель как владелец бренда определяет программу гарантии для конечных пользователей на своем рынке. Настоящая производственная гарантия — это обязательство завода по товару в изготовленном виде.</li>
  </ul>

  <h2>Коммерческое применение</h2>
  <p>Если изделие используется в коммерческих, государственных, некоммерческих, чартерных, прокатных, обучающих целях или в любых иных целях, кроме частного использования для отдыха, срок гарантии на все компоненты сокращается до одного (1) года с действующей даты. Использование в гонках, на скоростных или выносливостных соревнованиях полностью лишает гарантии, если конфигурация для гонок прямо не оговорена в договоре закупки.</p>

  <h2>Как подать гарантийное обращение</h2>
  <p>Свяжитесь с iSupfactory, указав заказ на закупку или ссылку на партию и подробное описание проблемы, включая серийные номера досок, если они доступны. Завод рассмотрит обращение на основе записей по партии и предоставит инструкции по осмотру и обслуживанию.</p>
  <p>По вопросам гарантийного обслуживания свяжитесь с нами через <a href="/ru/contact" class="text-sky-600 underline">страницу контактов</a>, указав номер заказа и данные изделия.</p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 my-10">
    <h2 class="text-xl font-bold mb-3">Подкреплено документированной системой качества</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Каждая доска проходит испытания до упаковки — <a href="/ru/factory/quality-inspection" class="text-sky-600 underline">7-этапные контрольные ворота инспекции</a> фиксируют результаты по каждому серийному номеру, а партии сохраняют 10-летнюю прослеживаемость в ERP. Гарантийные обращения рассматриваются на основе этих записей по партиям, а не догадок. Ознакомьтесь с <a href="/ru/quality" class="text-sky-600 underline">полной системой качества</a> и загрузите фактические <a href="https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf" class="text-sky-600 underline">протоколы финальной инспекции</a>.</p>
  </div>

  <h2>Сторонние позиции</h2>
  <p>Оборудование, компоненты или системы, изготовленные сторонними производителями (даже если они установлены заводом), покрываются исключительно гарантией, предоставляемой их соответствующими производителями. Завод прямо снимает с себя ответственность за гарантийные обязательства по таким сторонним позициям.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Настоящее изложение гарантии является кратким изложением условий производственной гарантии завода для программ OEM, ODM и Private Label. Все гарантийные условия и положения определяются полным договором закупки. Характеристики могут изменяться без уведомления. iSupfactory — производственное подразделение Qingdao Vatrad Group.
  </p>
