hero:
  tagline: OEM-produksjon
  title: 'Tilpasset SUP-OEM-produksjon — din spesifikasjon, vår fabrik'
  subtitle: 'Du tar med deg en design, en tegning eller et dokumentert plattformkonsept — vi produserer i containerstørrelse. Teknisk gjennomgang innen én arbeidsdag, prøveeksemplarer på 7–12 dager, produksjon 25–35 dager etter ordrebekreftelse og depositum, levert under merket ditt.'

answer:
  label: 'Kort svar'
  text: 'OEM-produksjonen skjer i henhold til spesifikasjonen din. MOQ fastsettes per prosjekt, ikke som et fast tall: produksjon i standardantall skjer med 90–100 enheter per parti fra en rull med 150 m drop-stitch-stoff, pilotkjøringer starter fra 20–50 enheter på eksisterende plattformer, og hvert prosjekt går først gjennom et prøveeksemplar (1–2 enheter) før volumet. Prøveeksemplarer sendes innen 7–12 dager; produksjonen tar 25–35 dager etter ordrebekreftelse og depositum, pluss 15–20 dager hvis nytt utstyr er nødvendig.'
  verified: 'September 2026'

