customization:
  tagline: 'Bygget etter spesifikasjonen din'
  title: 'Spesifikasjonspunkter i OEM'
  subtitle: 'Disse spesifikasjonspunktene styrer du i et OEM-prosjekt — spesifikasjonsdokumentet ditt er produksjonskontrakten:'
  items:
    - 'Brettmål — lengde, bredde, tykkelse, rocker og volum i henhold til tegningene eller referansebrukerne dine'
    - 'Materialstruktur — antall og kvalitet på PVC-lagene, drop-stitch-tetthet, forsterkninger og railforsterkninger'
    - 'Grafikk og farger — artworket ditt med ubegrenset antall farger eller støtte fra designteamet vårt'
    - 'Sklisikkert EVA-deckpad — formtilpassede deckpads, logoer og deckfarger på hvert brett'
    - 'Håndtak og D-ringer — plassering, antall og spesifikasjon av beslag for bruken din'
    - 'Finnesystem — enkel, dobbel eller trippel finne og finneboks i henhold til spesifikasjonen din'
    - 'Padler, pumper, leash-er og tilbehør — pakken din, merkesettingen din'
    - 'Kommersiell emballasje og POS-materiale — kommersielle emballasjer, sjøfraktemballasje og point-of-sale-displayer under merket ditt'
    - 'Etiketter og samsvarsmerking — serienummeretiketter, logoer og markedspesifikk dokumentasjon for eksportregionen din'

faq_section:
  tagline: FAQ
  title: Spørsmål om OEM-produksjon
  questions:
    - q: Hvordan starter jeg et OEM-prosjekt med designen min?
      a: 'Send tegningene dine, et referansebrett eller en skriftlig spesifikasjon. Vår tekniske gjennomgang bekrefter produksjonsevnen og gir et tilbud innen én arbeidsdag — det er standardløftet vårt, og ved behov signerer vi en NDA før hver filutveksling.'
    - q: Hva er MOQ for OEM av oppblåsbare SUP-er?
      a: 'MOQ fastsettes per prosjekt — skrog og utstyr, farge- og PVC-varianter, artwork, emballasje og tilbehør. Produksjon i standardantall skjer med 90–100 enheter per parti (en drop-stitch-rull på 150 m), mens pilotkjøringer starter fra 20–50 enheter på eksisterende plattformer. Hele beregningslogikken finner du i guiden vår om MOQ og fleksibel merkesetting.'
    - q: Hva er den vanlige leveringstiden for en OEM-bestilling?
      a: 'Produksjonen tar 25–35 dager fra bekreftet bestilling og depositum. Formbyggingen legger til 15–20 dager. Prototypeprøver sendes normalt innen 7–12 dager.'
    - q: Kan dere produsere ut fra tegningene mine?
      a: 'Ja. OEM bygger direkte i henhold til spesifikasjonen din — designen er din. Ingeniørene våre kontrollerer tegningenes produksjonsevne, melder fra om konflikter før formbyggingen eller kappingen, og det godkjente prøveeksemplaret blir produksjonsreferansen.'
    - q: Leverer dere prøveeksemplarer før produksjonen?
      a: 'Ja. Før hver produksjonskjøring lages og godkjennes et fysisk prøveeksemplar — normalt innen 7–12 dager — og det fungerer som referanse for alle etterfølgende QC-kontroller.'
    - q: Hvilke sertifiseringer har fabrikken?
      a: 'ISO 9001:2015 kvalitetsledelse (på fabrikknivå), BSCI-samsvar (amfori-fabrikkrevisjon), CE-samsvarsdokumentasjon for konfigurasjonene som omfattes av EU-markedet (omfang bekreftes per prosjekt), REACH (materiale) og RoHS (elektronisk tilbehør). Fullstendig samsvarsdokumentasjon leveres ved hver OEM-leveranse for målmarkedene dine.'
    - q: Hvordan kontrolleres kvaliteten i en OEM-kjøring?
      a: 'Produksjonen drives under flernivåkontroll — varemottak, prosesskontroller og slutttesting — med trykktesting ved 18.0 PSI i 24 timer (automatisk kassering ved trykktap over 0.50 PSI), 100-punkts montasjeliste og ERP-partisporbarhet i 10 år per serienummer.'
    - q: Hva er leveringsvilkårene deres?
      a: 'FOB Qingdao, CIF til verdens viktigste havner eller DDP for godkjente partnere. Vi leverer til over 50 land i EU, USA, AU og Asia.'

process:
  title: 'OEM-prosessen — fra spesifikasjon til levert container'
  subtitle: 'Sju faser, styrt av et fabrikkteam, slik at hvert steg fra din første spesifikasjon til den pakkede containeren forblir dokumentert og i tide.'
  steps:
    - phase: '01'
      title: Spesifikasjonsgjennomgang og tilbud
      period: 1 arbeidsdag
      items:
        - 'Del tegningene, spesifikasjonen eller referansebrettene dine — ingeniørene våre kontrollerer produksjonsevnen.'
        - 'Få et detaljert tilbud og en prosjektplan innen én arbeidsdag.'
    - phase: '02'
      title: Teknisk bekreftelse
      period: Uke 1
      items:
        - 'Redskaper, drop-stitch-kvalitet, PVC-spesifikasjoner og railkonstruksjon bekreftes mot dokumentet ditt.'
        - 'Beslutningen om formverktøy eller plattform fastsettes — ved behov starter byggingen av egne formverktøy her.'
    - phase: '03'
      title: Prototype og prøveeksemplar
      period: 7–12 dager
      items:
        - 'Et fysisk prøveeksemplar lages og sendes til din vurdering — inkludert vanntest for nye former.'
        - 'Prøveeksemplaret (1–2 enheter) validerer spesifikasjonen din før enhver volumforpliktelse.'
    - phase: '04'
      title: Testing og validering
      period: Parallelt
      items:
        - 'Lufttetthet, trykkholding, sømstyrke, belastnings- og UV-tester for hver produksjonslinje.'
        - 'CE-, ISO 9001-, BSCI-, REACH- og RoHS-dokumentasjon utarbeides for eksportmarkedene dine.'
    - phase: '05'
      title: Godkjenning og bekreftelse
      period: Etter godkjent prøveeksemplar
      items:
        - 'Du godkjenner prøveeksemplar og artwork; bestillingen og depositumet reserverer produksjonsplassen.'
        - 'En plan før produksjon bekrefter datoer, antall, emballasje og lastehavn.'
    - phase: '06'
      title: Produksjon
      period: 25–35 dager
      items:
        - 'Produksjon under flernivåkontroll — varemottak, prosesskontroller og slutttesting.'
        - 'Fra pilotbestilling (20–50 enheter) på eksisterende plattformer til hele ruller på 150 m (90–100+ enheter) i standardvolumproduksjonen.'
    - phase: '07'
      title: Emballasje og levering
      period: 1 dag + transport
      items:
        - 'Eksportemballasje med serienummeretiketter for modellen, deretter FOB Qingdao, CIF eller DDP til over 50 land.'
        - 'Tolldokumentasjon, sporing og støtte ved nytrykk inngår i hver fase.'

