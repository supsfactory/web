hero:
  tagline: 'Scegli il tuo modello di collaborazione'
  title: 'OEM vs. ODM vs. Private Label — quale modello si adatta al tuo progetto?'
  subtitle: 'Tre modi di collaborare con una fabbrica di SUP, ciascuno con proprietà, investimenti e compromessi sulla velocità diversi. Questa guida spiega le differenze, così scegli il percorso giusto prima della tua prima richiesta.'

answer:
  label: 'Confronto rapido'
  text: 'OEM: possiedi design e specifica — produciamo secondo i tuoi disegni. ODM: il nostro team tecnico sviluppa la tavola dal tuo briefing — approvi prima della produzione. Private Label: il tuo marchio su una piattaforma esistente collaudata senza modifiche strutturali — il percorso più rapido verso il mercato. Tutti e tre i percorsi passano per la stessa fabbrica, lo stesso sistema QC e lo stesso team export a Qingdao, Cina.'
  verified: 'Settembre 2026'

comparison_table:
  tagline: 'Fianco a fianco'
  title: 'OEM / ODM / Private Label a confronto'
  subtitle: 'Differenze essenziali su proprietà del design, MOQ, attrezzature, tempi di consegna e proprietà intellettuale.'
  headers:
    dimension: Dimensione
    oem: Produzione OEM
    odm: Sviluppo ODM
    pl: Private Label
  rows:
    - dimension: 'Chi progetta la tavola?'
      oem: 'Fornisci specifica, disegni o una tavola di riferimento'
      odm: 'Il team tecnico della fabbrica sviluppa dal tuo briefing'
      pl: 'Piattaforma di fabbrica esistente — nessuno sforzo di design'
    - dimension: 'Proprietà del design e IP'
      oem: 'Possiedi tutti i design, gli stampi e la proprietà intellettuale'
      odm: 'Possiedi il design finale approvato; la fabbrica detiene l''IP del processo di sviluppo'
      pl: 'La fabbrica possiede il design della piattaforma; tu possiedi marchio e grafica'
    - dimension: 'Stampo / attrezzatura'
      oem: 'Stampo dedicato necessario per nuove forme — tariffa unica per l''attrezzatura, 15–20 giorni aggiuntivi'
      odm: 'Può richiedere uno stampo dedicato a seconda della specifica — stessa pianificazione attrezzature'
      pl: 'Nessuno stampo nuovo — si usa l''attrezzatura della piattaforma esistente'
    - dimension: 'Quantità minima d''ordine'
      oem: '90–100+ unità per configurazione approvata'
      odm: '90–100+ unità per configurazione approvata; lotti pilota da 20–50'
      pl: '5–10 unità (co-branding) o 20–50 (lotto pilota su piattaforma esistente)'
    - dimension: 'Tempo di consegna tipico'
      oem: '25–35 giorni + 15–20 giorni di attrezzature se nuovo stampo'
      odm: '25–35 giorni + iterazione di sviluppo (varia con la complessità)'
      pl: '25–35 giorni (nessun ritardo di attrezzaggio)'
    - dimension: 'Grado di personalizzazione'
      oem: 'Totale — forma, costruzione, materiali, grafica, imballaggio'
      odm: 'Totale — la fabbrica propone, tu approvi ogni elemento'
      pl: 'Solo grafica e imballaggio — nessuna modifica strutturale'
    - dimension: 'Processo del campione'
      oem: '1–2 campioni prototipo in 7–12 giorni dopo l''approvazione della specifica'
      odm: '1–2 campioni prototipo in 7–12 giorni dopo l''approvazione del design'
      pl: '1–2 campioni in 7–12 giorni — piattaforma già validata'
    - dimension: 'Ideale per'
      oem: 'Acquirenti con design esistenti, tavole di riferimento o specifiche dettagliate'
      odm: 'Acquirenti con idee di prodotto o requisiti di mercato, ma senza specifica dettagliata'
      pl: 'Acquirenti che vogliono tavole brandizzate in fretta senza sviluppo prodotto'

