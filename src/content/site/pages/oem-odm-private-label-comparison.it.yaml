ip_rules:
  tagline: 'Protezione della proprietà intellettuale'
  title: 'Come proteggiamo i tuoi design e il tuo marchio'
  subtitle: 'Indipendentemente dal modello di collaborazione, il tuo artwork, i tuoi stampi e i tuoi file di specifica restano di tua proprietà.'
  body: |
    **NDA prima dello scambio di file.** Firmiamo un accordo di non divulgazione prima di ogni scambio di file tecnici — tempo di risposta standard entro 4 ore lavorative.

    **Nessun riutilizzo dei design.** Il tuo artwork, i tuoi stampi e i tuoi file di specifica non vengono mai condivisi o venduti ad altri clienti. Gli stampi OEM appartengono in esclusiva a te. I design ODM vengono approvati da te prima della produzione. Le piattaforme Private Label sono strutture condivise, ma la tua grafica e il tuo branding sono esclusivi.

    **Solo B2B.** Produciamo esclusivamente sotto i marchi dei nostri clienti. Non vendiamo ai consumatori finali e non entriamo in concorrenza con i nostri clienti in nessun mercato.

    **Proprietà degli stampi.** Gli stampi dedicati pagati dall''acquirente appartengono all''acquirente. Li immagazziniamo e li manteniamo, ma non possiamo usarli per altri clienti senza autorizzazione scritta.

faqs:
  tagline: 'FAQ'
  title: 'Domande frequenti su OEM, ODM e Private Label'
  items:
    - q: 'Posso passare dal Private Label all''OEM in seguito?'
      a: 'Sì. Molti clienti partono con una produzione Private Label o pilota per validare il mercato, poi investono in attrezzature dedicate per un programma OEM completo una volta dimostrata la domanda. La stessa fabbrica e lo stesso sistema QC supportano entrambi i percorsi.'
    - q: 'ODM significa che la fabbrica possiede il mio marchio?'
      a: 'No. Con l''ODM possiedi il tuo marchio, la tua grafica e il tuo imballaggio. La fabbrica sviluppa la struttura della tavola dal tuo briefing e tu approvi il design prima della produzione. La fabbrica mantiene l''IP del processo di sviluppo, ma la specifica di prodotto approvata è tua.'
    - q: 'Il Private Label è di qualità inferiore rispetto all''OEM?'
      a: 'No. Tutti e tre i percorsi passano per la stessa fabbrica, lo stesso sistema QC e lo stesso team export. Le tavole Private Label vengono costruite su piattaforme collaudate e validate, con il test completo di pressione 18-PSI/24 ore e la stessa checklist di montaggio a 100 punti.'
    - q: 'E se non sono sicuro di quale modello scegliere?'
      a: 'Contattaci con la tua situazione — il nostro team tecnico consiglia il percorso più pratico in base ai tuoi requisiti di prodotto, al tuo programma e ai tuoi obiettivi di quantità. Non c''è alcun obbligo prima della verifica della specifica.'
    - q: 'Posso ricevere campioni prima di decidere il modello?'
      a: 'Sì. 1–2 campioni prototipo partono in 7–12 giorni. I costi dei campioni vengono accreditati sul tuo ordine di massa. Così puoi valutare costruzione e qualità prima di qualsiasi impegno sulla quantità.'

