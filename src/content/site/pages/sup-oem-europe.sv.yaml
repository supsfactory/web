why_europe:
  tagline: 'Varför köpare i Europa'
  title: 'Byggd för europeisk import'
  subtitle: 'Fabriken besvarar de frågor som europeiska varumärken ställer inför sin första container — certifiering först.'
  items:
    - title: 'CE- och REACH-dokumentation'
      description: 'Det godkända provet skickas med CE- och REACH-dokumentation för EU-marknaden, så att din tekniska dossier och dina tulldokument är klara före containern.'
    - title: 'DDP för planerbara destinationskostnader'
      description: 'DDP omfattar tullhantering, införseltull, skatter och leverans till ditt lager — ett totalpris, dörr till dörr genom hela EU.'
    - title: 'FOB Qingdao med din speditör'
      description: 'Fast importör? Välj FOB Qingdao och använd din egen logistikpartner — vi lastar och dokumenterar containern, du sköter resten.'
    - title: 'En fabrik, ett kvalitetssystem'
      description: 'Utveckling, prover, tillverkning och QC sker alla i fabriken på 12 500 m² — det godkända provet är produkten du får.'

process_notes:
  tagline: 'Så fungerar det'
  title: 'Från specifikation till container'
  subtitle: 'Samma sex faser, oavsett om du köper två eller tjugo containrar per år: specifikation, konstruktion, prov, verifiering, verktygsbyggnad, tillverkning — därefter leverans FOB, CIF eller DDP.'
  items:
    - title: '1. Skicka din specifikation'
      description: 'En referensbräda, en skiss eller en konkurrents specifikation räcker. Teknisk verifiering och offert följer inom en arbetsdag.'
    - title: '2. Godkänn provet'
      description: 'Ditt första fysiska prov skickas inom 7–12 dagar med ett godkännandeformulär för konstruktion, tryckfärger och resultaten av tryckprovningen.'
    - title: '3. Tillverkning & export'
      description: 'Cyklerna slutförs på 25–35 dagar med QC-kontrollpunkter under tillverkningen. Packlista, faktura och konossement går före fartyget.'
    - title: '4. Leverans till ditt lager'
      description: '4–6 veckors sjöfrakt till Rotterdam eller Hamburg — med DDP hanterar vi tullhanteringen och leveransen till din dörr.'

faq_section:
  tagline: Vanliga frågor
  title: 'Frågor om import till Europa'
  questions:
    - q: Ingår CE-dokumentationen i min order?
      a: 'Ja. CE- och REACH-dokumentationen upprättas för EU-marknaden, parallellt med ditt godkända prov, innan tillverkningen börjar — dokumenten färdas med containern.'
    - q: Hur lång tid tar sjöfrakten till Europa?
      a: 'Räkna med 4–6 veckor från Qingdaos hamn till Rotterdam eller Hamburg, beroende på avgångsschemat. DDP-projekt omfattar hela tidslinjen dörr till dörr.'
    - q: Skickar ni DDP till EU-länder?
      a: 'Ja. DDP omfattar sjöfrakt, tullhantering, införseltull och skatter plus leverans till ditt lager — ett planerbart totalpris. Även FOB Qingdao och CIF finns tillgängliga.'
    - q: Vad är MOQ för en private label-SUP-import?
      a: 'MOQ bekräftas av projektkonfigurationen: provutvecklingen omfattar 1–2 st, små pilotserier går med 20–50 st på befintliga plattformar och standardvolymserier går med 90–100+ st per design ur en hel drop-stitch-rulle på 150 m.'
    - q: Vilken dokumentation levererar ni för importen?
      a: 'Det godkända provet skickas med CE- och REACH-dokumentation som upprättats för din målmarknad, och varje container skickas med packlista, faktura och konossement.'
    - q: Hur startar jag ett projekt från Europa?
      a: 'Skicka en referensbräda, en skiss eller en specifikation. Den tekniska verifieringen och offerten kommer inom en arbetsdag, och ett NDA undertecknas före varje filutbyte.'

