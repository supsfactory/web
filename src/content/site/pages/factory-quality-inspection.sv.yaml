quarantine_intro:
  tagline: Avvikelsekontroll
  title: Kontroll av icke-konformiga produkter & karantän
  body: |
    Produkter eller komponenter som inte uppfyller de definierade acceptanskriterierna märks tydligt och blockeras eller sätts i karantän på kontrollerat sätt. De får inte gå vidare till nästa produktionsfas, förpackningen eller leveransen förrän ett auktoriserat beslut är fattat. Omtillverkning sker enligt godkända instruktioner och är kopplad till den aktuella avvikelserapporten; omtillverkade enheter omverifieras mot de tillämpliga projektkraven före kvalitetsfrigörningen.

quarantine_flow:
  tagline: Kontrollflöde i sju faser
  title: Vad som händer när en avvikelse upptäcks
  subtitle: Identifiera, blockera, korrigera, verifiera — sedan frigöra eller kassera. Icke-konformiga produkter går aldrig tillbaka till produktion eller förpackning utan verifiering.
  steps:
    - step: '01'
      title: Identifiera
      desc: Avvikelsen registreras mot den berörda produkten, SKU, partiet eller processfasen.
    - step: '02'
      title: Märka
      desc: De berörda enheterna märks tydligt med kontrollerade statusetiketter — HOLD, i karantän eller kasserade.
    - step: '03'
      title: Karantän
      desc: Enheterna separeras i ett fysiskt kontrollerat eller systemhanterat karantänområde för att förhindra oavsiktlig användning eller leverans.
    - step: '04'
      title: Bedöma omfattning
      desc: Den berörda omfattningen undersöks per parti, processfas, materialparti och dokumentrevision.
    - step: '05'
      title: Omtillverka / Byta ut
      desc: En korrigering är endast tillåten via ett godkänt beslut och en kontrollerad arbetsinstruktion.
    - step: '06'
      title: Verifiera om
      desc: De korrigerade enheterna omverifieras mot de tillämpliga acceptanskriterierna före frigörningen.
    - step: '07'
      title: Frigöra eller kassera
      desc: Endast auktoriserade och konformiga produkter når förpackningen eller frigörningen inför leverans.

