rework_intro:
  tagline: Styrning av omtillverkning
  title: Kontrollerad hantering av lufttätningsavvikelser och omtillverkning
  body: |
    Hos QINGDAO VATRAD GROUP.,LTD. definieras omtillverkning strikt som återställandet av en icke-konform enhet till fullständig överensstämmelse med den ursprungliga tekniska specifikationen — inte som en snabb lösning. Varje bräda med en lufttätningsavvikelse blockeras på kontrollerat sätt och kopplas till en avvikelserapport (NCR) innan någon vidare bearbetning; läckans källa lokaliseras och registreras med den godkända diagnostiska metoden.

    Omtillverkning får endast ske om felet ryms inom det godkända omtillverkningsomfånget och en auktoriserad metod finns tillgänglig. Omtillverkningsinstruktionen identifierar produkten, partiet, felets placering, det godkända materialet, metoden, de erforderliga förhållandena och omfånget för den upprepade verifieringen. Efter den erforderliga härdnings- eller stabiliseringsfasen omverifieras brädan mot samma tillämpliga acceptanskriterier som en konform bräda — omtillverkning sänker aldrig acceptansnivån. Misslyckas den upprepade verifieringen krävs ett nytt konstruktions- och kvalitetsbeslut; upprepad omtillverkning är inte tillåten utan dokumenterad frigörning.

rework_decision:
  tagline: Interaktivt flöde
  title: Beslutsflöde för omtillverkning — klicka på varje nod
  subtitle: Följ hur en lufttätningsavvikelse hanteras från detektering till frigörning eller destruktion. Klicka på en nod för att unfolds kontrollkraven i det steget.
  nodes:
    - id: detect
      type: start
      label: Läckage upptäckt
      detail: 'Under inspektionen konstateras en lufttätningsavvikelse — ett fel i tryckhållningen, ett synligt läckage eller ett relaterat fel i luftsystemet.'
    - id: hold
      type: step
      label: Stoppa linjen · HOLD-etikett · NCR
      detail: 'Bearbetningen stoppas. Bräd-ID, produktkod, parti, arbetsstation, datum och inspektör registreras; en HOLD-/karantänetikett sätts på och ett NCR öppnas mot den tillämpliga specifikationsrevisionen.'
    - id: locate
      type: step
      label: Lokalisera läckans källa
      detail: 'Brädan pumpas upp till det projektegodkända diagnostiska trycket och källan lokaliseras med en godkänd metod — tryckhållning, kalibrerat bubbelprov, akustiskt eller läckagedetekteringsapparat.'
    - id: classify
      type: step
      label: Klassificera felet (A–G)
      detail: 'Felet klassificeras mot frigöringsmatrisen: A ventilgränssnitt, B ventilsätes-söm, C ytligt nålstygningshål, D lokal kantsöm, E utbredd kantskada, F återkommande läckage, G strukturell skada.'
    - id: authorize
      type: decision
      label: Omtillverkning auktoriserad?
      yes: rework
      no: escalate
      detail: 'QC bekräftar defektkategorin och konstruktion kontrollerar om brädan kan återföras till ursprungsspecifikationen. Auktoriseringen dokumenterar metodkortet, materialen, förhållandena och omfånget för den upprepade verifieringen — eller leder till utbyte, kassering, destruktion eller en koncession till kunden.'
    - id: rework
      type: step
      label: Kontrollerad omtillverkning
      detail: 'Utförs endast inom den godkända defektgränsen med det godkända metodkortet, materialpartiet och de godkända verktygen — aldrig genom att ändra mått, konstruktion, grafik, tillbehör eller förpackningskrav.'
    - id: cure
      type: step
      label: Härdning & stabilisering
      detail: 'Brädan förblir i HOLD under härdnings- och stabiliseringsfasen som definieras av den godkända material- och processinstruktionen och får därefter en visuell och bearbetningskontroll före omtillverkning.'
    - id: reinspect
      type: decision
      label: Upprepad verifiering godkänd?
      yes: release
      no: escalate
      detail: 'Brädan pumpas upp till det projektegodkända omverifieringstrycket och det ursprungliga felet tillsammans med alla potentiellt påverkade egenskaper verifieras om — läckpunkt, ventil, kant, sömar, tungt belastade zoner, tillbehör och utseende. Omtillverkning sänker aldrig acceptansnivån.'
    - id: release
      type: release
      label: Kvalitetsfrigörning
      detail: 'Kvalitet kontrollerar det stängda NCR, omtillverkningsregistret och resultatet av den upprepade verifieringen och auktoriserar frigörningen. Ingen omtillverkad bräda förpackas eller skickas utan auktoriserad kvalitetsfrigörning.'
    - id: escalate
      type: escalate
      label: Eskalering — byta ut / förstöra / koncession
      detail: 'Ingen upprepad omtillverkning utan dokumenterad frigörning. Brädan byts ut, kasseras, förstörs eller kunden erbjuds en skriftlig koncession när ursprungsspecifikationen inte kan återställas.'

defect_matrix:
  tagline: Defektklassning
  title: Klassificering av lufttätningsdefekter & frigöringsmatris
  subtitle: 'Inte alla läckage omtillverkas — varje fel klassificeras och beslutet frigörs på rätt nivå, från QC-inspektören till fabrikschefen.'
  headers:
    category: Defektkategori
    area: Typiskt område
    eligibility: Lämplighet för omtillverkning
    approval: Erforderlig frigörning
  rows:
    - category: 'Klass A — Ventilgränssnitt'
      area: 'Ventilkärna, korkförslutning, försegling, pumpgränssnitt'
      eligibility: 'Standardomtillverkning auktoriserad'
      approval: 'QC-inspektör'
    - category: 'Klass B — Ventilbasens söm'
      area: 'Mikroläckage längs ventilens kant'
      eligibility: 'Omtillverkning bedöms enligt det godkända metodkortet'
      approval: 'QC + Konstruktion'
    - category: 'Klass C — Ytligt nålstygningshål'
      area: 'Lokalt mikronålstygningshål på en obelastad yta'
      eligibility: 'Endast auktoriserat om det uppfyller kundens specifikationer'
      approval: 'QC + Konstruktion'
    - category: 'Klass D — Lokal kantsöm'
      area: 'Lokalt läckage i överlappningen på kantbandet'
      eligibility: 'Hög risk; kräver ett strikt konstruktionsbeslut'
      approval: 'Konstruktion + QA-chef'
    - category: 'Klass E — Utebradd kantskada'
      area: 'Kontinuerlig sömfel i tungt belastade zoner'
      eligibility: 'Standardomtillverkning inte auktoriserad — utbyte eller rotorsaksanalys'
      approval: 'QA-chef + koncession från kunden'
    - category: 'Klass F — Återkommande läckage'
      area: 'Läckage som inte kan lokaliseras eller återfaller vid omtest'
      eligibility: 'Ingen upprepad omtillverkning; utbyte, destruktion eller teknisk rotorsaksanalys'
      approval: 'Senior QA / Konstruktion'
    - category: 'Klass G — Strukturell skada'
      area: 'Materialskada, delaminering, deformation av brädan'
      eligibility: 'Omtillverkningsfrigörning inte auktoriserad — utbyte, destruktion eller skriftlig koncession från kunden'
      approval: 'Kvalitetschef + kundens frigörning'

rework_flow:
  tagline: Sluten cykel i sju faser
  title: Kontrollerat omtillverkningsflöde — från detektering till frigörning eller destruktion
  subtitle: 'Varje lufttätningsreparation följer samma kontrollerade cykel: upptäcka, sätta i karantän, diagnostisera, auktorisera, omtillverka, verifiera om, frigöra.'
  steps:
    - step: '01'
      title: Detektering, linjestopp & karantän
      desc: 'Bearbetningen av den berörda brädan stoppas omedelbart. Bräd-ID, produktkod, parti, arbetsstation, datum och inspektör registreras, en HOLD-/karantänetikett sätts på och ett NCR öppnas mot den tillämpliga specifikationsrevisionen.'
    - step: '02'
      title: Systematisk läckagediagnostik
      desc: 'Brädan pumpas upp till det projektegodkända diagnostiska trycket och läckans källa lokaliseras med en godkänd metod — tryckhållning, kalibrerat bubbelprov, akustiskt eller läckagedetekteringsapparat. Den misstänkta punkten märks utan att skada brädan.'
    - step: '03'
      title: Konstruktionsbeslut & auktorisering
      desc: 'QC bekräftar defektkategorin och konstruktion kontrollerar om brädan kan återföras till ursprungsspecifikationen. En omtillverkningsauktorisering som hänvisar till NCR dokumenterar den godkända metoden, materialen, förhållandena och omfånget för den upprepade verifieringen — eller föreskriver utbyte, kassering, destruktion eller koncession till kunden.'
    - step: '04'
      title: Kontrollerat utförande av omtillverkningen
      desc: 'Omtillverkningen utförs endast inom den godkända defektgränsen med det godkända metodkortet, materialpartiet och de godkända verktygen. Brädans mått, konstruktion, grafik, tillbehörskonfiguration och förpackningskrav ändras aldrig.'
    - step: '05'
      title: Härdning, stabilisering & förkontroll
      desc: 'Den omtillverkade brädan förblir i HOLD under härdnings- och stabiliseringsfasen som definieras av den godkända material- och processinstruktionen och får en visuell och bearbetningskontroll före den upprepade verifieringen.'
    - step: '06'
      title: Upprepad verifiering & testprov
      desc: 'Brädan pumpas upp till det projektegodkända omverifieringstrycket och det ursprungliga felet tillsammans med alla potentiellt påverkade egenskaper verifieras om: läckpunkten och omgivningen, ventilen, kanten, sömarna, de tungt belastade zonerna, tillbehören och utseendet. Omtillverkning sänker aldrig acceptansnivån.'
    - step: '07'
      title: QA-frigörning eller slutbeslut
      desc: 'Kvalitet kontrollerar det stängda NCR, omtillverkningsregistret och resultatet av den upprepade verifieringen och auktoriserar sedan frigörningen — eller eskalerar till utbyte, kassering, destruktion eller koncession till kunden. Ingen omtillverkad bräda förpackas eller skickas utan auktoriserad kvalitetsfrigörning.'

quality_safeguards:
  tagline: Kvalitetssäkringar
  title: Felpreventiva regler som skyddar ditt varumärke
  subtitle: 'Strikta kontroller som förhindrar okontrollerade reparationscykler — en dokumenterad omtillverkning per fel, larmgränser per parti, kalibrerade mätinstrument och kontrollerade testförhållanden.'
  features:
    - icon: 1
      icon_bg: blue
      title: En omtillverkning per fel
      desc: 'En enskild punkt får omtillverkas en gång under en auktoriserad instruktion. Misslyckas den upprepade verifieringen eskaleras brädan till utbyte, kassering, destruktion eller koncession till kunden — upprepad omtillverkning utan dokumenterad frigörning är inte tillåten.'
    - icon: 2
      icon_bg: green
      title: Partilarm & linjestopp
      desc: 'När ett produktionsparts avvikelse överstiger den tröskel som konstruktion fastställt stoppas linjen och konstruktion undersöker orsaken — materialparti, processförhållanden och register — innan produktionen återupptas.'
    - icon: 3
      icon_bg: purple
      title: Kalibrerade mätinstrument
      desc: 'Tryckinstrumenten, de digitala manometrarna och tidtagarna för lufttätningstesterna verifieras och kalibreras av externa laboratorier inom sin giltighetstid; kalibreringsstatus syns i inspektionsområdet.'
    - icon: 4
      icon_bg: orange
      title: Kontrollerade testförhållanden
      desc: 'Lufttätnings- och härdningsområdena förvaras i kontrollerad miljö så att resultaten inte påverkas av temperatursvängningar mellan dag och natt.'

rework_boundaries:
  tagline: Omfång & gränser
  title: Vad det här systemet inte täcker
  body: |
    Omtillverkningskontrollsystemet tillämpas på färdiga eller under bearbetning pågående uppblåsbara SUP-brädor där luftläckage, fel i tryckhållningen eller relaterade fel i luftsystemet upptäcks före frigörning inför leverans. Det auktoriserar inga ändringar av den godkända konstruktionen, materialen, grafiken, produktkonfigurationen eller kundkraven och täcker inte:

    - Produkter som redan skickats eller som befinner sig i kundernas system.
    - Strukturell skada eller deformation av brädan som inte bedömts av konstruktion.
    - Utbredda kant- eller sömdefekter, skador på kärnmaterialet eller defekter som kan äventyra säkerheten.
    - Projekt där omtillverkning inte är tillåten: kundgodkända prov, certifierings- eller testenheter.
    - Projekt med kundens egna processer, speciella material eller särskilda reparationskrav.
    - Återkommande läckage som inte kan lokaliseras, eller brädor som återfaller efter omtillverkning.

    Varje avvikelse från kundens specifikationer kräver en dokumenterad teknisk verifiering och, där det tillämpligt, kundens skriftliga frigörning. Brädor som inte kan återföras till sin ursprungsspecifikation frigörs endast under en uttrycklig koncession från kunden — aldrig enbart av produktionen.

method_cards:
  tagline: Metodkortssystem
  title: Index över kontrollerade omtillverkningsmetodkort
  subtitle: 'Den allmänna instruktionen styr processen; metodkorten styr utförandet. Omtillverkningsinstruktionen (WI-QC-AT-001) hänvisar till metodkorten MC-RW-01 till MC-RW-06, plus MC-RW-00 för den bindande destruktionen och kasseringen.'
  headers:
    code: Metodkort
    defect: Defektklass
    scope: Tillämpningsområde
    controls: Viktigaste konstruktionskontroller
    approval: Underteckningsbehörighet
  rows:
    - code: MC-RW-01
      defect: Klass A (ventilgränssnitt)
      scope: 'Underhåll av ventilkärnan, rengöring av förseglingen och återmontering'
      controls: 'Kalibrerad momentnyckel, ren förseglingsyta, ingen skada på ventilgängorna'
      approval: 'QC-inspektör'
    - code: MC-RW-02
      defect: Klass B (ventilomkrets)
      scope: 'Försegling av ventilens bottenplatta och kontrollerad åtdragning'
      controls: 'Kontrollerad ytberedning, godkänt limmaterial, cirkulärt tryckverktyg'
      approval: 'QC + Konstruktion'
    - code: MC-RW-03
      defect: Klass C (ytligt mikroläckage)
      scope: 'Försegling av icke-strukturella nålstygningshål'
      controls: 'Godkänt tvåkomponentlim, inget utslag på grafik eller EVA'
      approval: 'QC + Konstruktion'
    - code: MC-RW-04
      defect: Klass D (lokal kantsöm)
      scope: 'Omlimning av lokala överlappningssömar i kanten'
      controls: 'Temperaturkontrollerad värmeaktivering, tryckvals, anti-krulverktyg'
      approval: 'Konstruktion + QA-chef'
    - code: MC-RW-05
      defect: Klass B/C (tillbehörskant)
      scope: 'Reparation av fin box och försegling av tillbehörens monteringsbas'
      controls: 'Ytprimer för vidhäftning, formgjutet klämblock, definierad hålltid'
      approval: 'QC + Konstruktion'
    - code: MC-RW-06
      defect: Klass D (bog-/aktersöm)
      scope: 'Åtgärd på tungt belastade böjda sömar'
      controls: 'Godkänt limmaterial med hög skjuvhållfasthet, förlängd härdningstid före omtest'
      approval: 'Chefingenjör'
    - code: MC-RW-00
      defect: Klass E/F/G (kritisk / brott)
      scope: 'Bindande destruktion och fysiskt förstörande'
      controls: 'Fysisk kapning för att förhindra blandning, destruktionsprotokoll, tvärfunktionell rotorsaksanalys'
      approval: 'Fabrikschef'

inspector_friendly:
  tagline: Inspektion av tredjepart
  title: Inspektörsvänligt protokoll
  body: |
    Vi erbjuder ett särskilt inspektionsområde med kalibrerade tryckinstrument, standardiserade ljusbord för verifiering av sömar och grafik och ifyllda inspektionsbriefingar, så att externa organisationer (SGS, BV, Intertek, QIMA) effektivt kan utföra sin inspektion före leverans — det sparar din inspektionsoverhead.

    Varje briefing sammanfattar de tillämpliga dokumentrevisionerna, referensen till det godkända provet, de kritiska kvalitetsrelevanta kontrollerna, den överenskomna provnivån, funktionstesterna samt förpacknings- och streckkodskraven för PO:t. Specificerade antal, kvalitet, förpackning och väsentliga säkerhetsaspekter verifieras mot de godkända projektreferenserna — inget hastigt dokumentsökande på plats.

