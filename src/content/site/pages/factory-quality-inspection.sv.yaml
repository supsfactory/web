answer:
  label: 'Tydligt svar'
  text: 'QINGDAO VATRAD GROUP.,LTD. kontrollerar kvaliteten på uppblåsbara SUP-brädor via ett verifieringssystem i fyra faser: inkommande varukontroll (IQC), kvalitetskontroll under processen (IPQC), slutkontroll av brädan och uppumpningstest (FQC) samt avsändningskontroll av förpackning och leverans (OQC). Varje order verifieras mot det godkända provet, den tekniska specifikationen, konstprovaret, BOM och förpackningsnormerna — inklusive lufttätningskontroll, visuella och måttkontroller, bekräftelse av tillbehör och spårbarhet per parti. Enheter som inte uppfyller acceptanskriterierna blockeras eller sätts i karantän på kontrollerat sätt, omtillverkas endast enligt godkända instruktioner och omverifieras före den auktoriserade frigörningen.'
  verified: 'September 2026'

intro: 'Vårt kvalitetssystem är byggt för OEM/ODM-projekt: inspektionskriterierna definieras, dokumenteras och följs av produktions- och kvalitetsteamet per order, från varans ingång till förpackningen. Så förblir kvalitetsförväntningen i linje mellan fabrik och ditt varumärke, från det första provet till fullständiga containerleveranser.'

scope_note:
  tagline: Omfång
  title: Projektspecifika inspektionskriterier
  body: |
    Kvalitetsspecifikationer kan variera beroende på brädans konstruktion (t.ex. ett/t två lager, drop-stitch-tyg, limmad kant), det avsedda användningsområdet, målmarknadens regelverk och de kundgodkända parametrarna. Den slutliga frigörningen baseras strikt på de dokumenterade inspektionskriterier som överenskommits för ordern.

stages:
  tagline: Kvalitetsram
  title: Vårt kvalitetsverifieringssystem i fyra faser
  subtitle: En komplett QC-cykel från råvarans ingång till frigörning inför leverans.
  steps:
    - title: '1. Inkommande varukontroll (IQC)'
      desc: 'Kärnmaterialen och de inköpta komponenterna verifieras mot de godkända specifikationerna och referensproven innan de tillåts på produktionslinjen. Drop-stitch-material och PVC kontrolleras avseende materialidentifiering, leverantörsparti, vikt/densitet, tjocklek, färgöverensstämmelse med de godkända proven och ytfel. EVA-tractionpads kontrolleras avseende mönster, färg, tjocklek, skärnoggrannhet och limkompatibilitet. Ventiler och kopplingar genomgår funktions-, gäng-, packningsintegritets- och kopplingstester. Tillbehör och förpackning (pumpar, paddlar, fenor, leashar, väskor, kartonger) jämförs avseende antal, färg, branding, streckkodsnoggrannhet och konstversion mot den godkända BOM.'
    - title: '2. Kvalitetskontroll under processen (IPQC)'
      desc: 'De kritiska produktionsfaserna inspekteras för att hitta avvikelser innan brädorna når stationerna längre ned i flödet. Skärning och tryck verifieras avseende panelmått, konstlayout, spegelvänd orientering och kantrenhet mot de godkända tekniska ritningarna. Brädmonteringen och limningen av kanten kontrolleras avseende skrovsymmetri, kontinuitet i söms överlappningen och frånvaron av håligheter eller luftbubblor längs de tungt belastade zonerna. Fästningen av ventiler och tillbehör, grafiken och branding verifieras avseende placering, orientering, limtäckning, logotypens konturer och konstversion.'
    - title: '3. Slutkontroll av brädan & uppumpningstest (FQC)'
      desc: 'De färdiga brädorna genomgår bindande fysiska och strukturella tester före frigörning till förpackning. Brädorna pumpas upp och hålls vid det projektegodkända testtrycket för att verifiera strukturell styvhet och tryckstabilitet. Lufttätningskontrollerna täcker ventilhuset, kantsömmarna, bog- och akterkeglarna och spänningsfogarna med kalibrerade läckagedetekteringsmetoder (tryckförlustövervakning eller bubbelprov). Den estetiska kontrollen och måttkontrollen verifierar mått, rockerprofil och EVA-padens inriktning (tolerans ±2 mm) under standardbelysning.'
    - title: '4. Förpackning & avsändningskontroll (OQC)'
      desc: 'Den fullständiga kontrollen före leverans säkerställer en SKU-konfiguration och leveransmärkning som stämmer exakt, utan avvikelser. Kontrollen av satsens fullständighet jämför bräda, fena, leash, paddel, pump, väska, reparsats och manual mot orderns BOM. Förpacknings- och streckkodskontrollerna verifierar märkningarna på kartongen, SKU-etiketterna, streckkodens läsbarhet, manualens språk och kartongens strukturella integritet. Ordern frigörs först efter den slutliga förpackningskontrollen, undertecknad av auktoriserad kvalitetspersonal.'

inspection_points:
  tagline: Inspektionsäckfall
  title: Viktigaste inspektionskontrollpunkter
  subtitle: Varje kontrollpunkt utförs mot dokumenterade, per order överenskomna acceptanskriterier.
  features:
    - icon: A
      icon_bg: blue
      title: Lufttätningskontroll
      desc: 'De färdiga brädorna pumpas upp till det godkända testtrycket och kontrolleras avseende tryckhållning, ventilbasens kondition, kantsömmarna, bog- och akterzonerna samt de tungt belastade punkterna. Där inspektionsproceduren föreskriver det undersöks misstänkta läckagezoner med godkända detekteringsmetoder.'
    - icon: B
      icon_bg: green
      title: Visuell & måttkontroll
      desc: 'Brädorna kontrolleras under adekvat belysning avseende materialytans kondition, tryckfel, färgavvikelser, EVA-inriktning, veck, repor, föroreningar och staplingsoptik. Huvudmåtten och tillbehörens placering verifieras mot de godkända ritningarna eller specifikationerna.'
    - icon: C
      icon_bg: purple
      title: Kontroll av tillbehör & förpackning
      desc: 'Före leveransen verifieras den fullständiga produktkonfigurationen: brädmodell, fenasystem, paddel, pump, leash, transportväska, reparsats, manual och skräddarsydda tillbehör — varje del jämförd mot det godkända provet, ritningarna och BOM.'
    - icon: D
      icon_bg: orange
      title: Förpackning & frigörning inför leverans
      desc: 'De förpackade enheterna kontrolleras avseende SKU-konfiguration, tillbehörens fullständighet, produktetiketter, streckkodsinformation, manualversion, kartongmärkning, förpackningsantal och kartongens kondition. Frigörning inför leverans auktoriseras först när alla inspektions- och förpackningskrav är uppfyllda.'

traceability_intro:
  tagline: Spårbarhet per parti
  title: Projekt- och partsspårbarhetssystem
  body: |
    Varje skräddarsydd SUP-order hanteras under en enhetlig projektkod som sammanbinder de tekniska specifikationerna, den godkända BOM, konstrevisionerna, materialpartinumren, förpackningsreferenserna och inspektionsregistren. Produktions- och inspektionsregistren förvaras per projekt och tillämpligt produktionsparti, och varje parti kan spåras tillbaka till den godkända produktspecifikationen, BOM, konst och förpackningsreferenser.

    Detta stöder en effektiv verifiering av produktkonfiguration, inspektionsstatus och berörd omfattning när ett kvalitetsärende rapporteras — från den färdiga produkten tillbaka till originalregistren via brädans eller kartongens identifiering.

traceability_chain:
  tagline: Spårbarhetskedjan
  title: Från projektkod till frigörning inför leverans
  subtitle: En kedja av kontrollerade referenser från orderbekräftelsen till den auktoriserade leveransen.
  steps:
    - step: '01'
      title: Projektkod
      desc: Enhetlig projektreferens som kopplar varje kontrollerat dokument till ordern.
    - step: '02'
      title: Dokumentrevisioner
      desc: Aktuella revisionsnivåer för specifikation, BOM, konst och förpackning — endast godkända versioner är giltiga för produktion.
    - step: '03'
      title: Parti & material
      desc: Material- och komponentpartierna registreras mot produktionspartiet.
    - step: '04'
      title: Inspektionsregister
      desc: Resultat av IQC-, process-, lufttätnings-, slut- och förpackningsinspektion per parti.
    - step: '05'
      title: Förpackning & frigörning
      desc: Förpackningsparti, NCR-stängningsstatus och översikt över den auktoriserade frigörningen inför leverans.

traceability_sample:
  tagline: Anonymiserat exempel
  title: Spårbarhetskontrollregister (demo)
  body: |
    Demonstrationsvärdena är enbart illustrativa — kundnamn, ordernummer, skräddarsydd konst, leverantörsuppgifter och kommersiell information har tagits bort för att skydda konfidentialiteten.

