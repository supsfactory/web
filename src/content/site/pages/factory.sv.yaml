workshops_section:
  tagline: Verkstäder
  title: Produktionsverkstäder
  workshops:
    - title: PVC-skärning & materialförberedelse
      description: 'Automatiska CNC-skärmaskiner bearbetar PVC-, Hypalon- och drop-stitch-tyger med submillimeternoggrannhet. Datoroptimerad nesting minimerar materialavfall och garanterar att varje panel uppfyller sina specificerade mått före svetsning.'
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: CNC-skärmaskin för PVC som förbereder tygpanelerna på en uppblåsbar SUP i fabriken i Qingdao
    - title: Kammarsvetsning & termisk svetsning
      description: 'Särskild svetsavdelning med varmluftssvetsmaskiner och högfrekventa dielektriska pressar. Varmluftssvetsarna fogar och svetsar ihop kammarna på de uppblåsbara brädorna, medan HF-svetsningen skapar lufttäta sömar med hög styrka som överträffar kraven.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: HF-svetsmaskin som förseglar kammarna på uppblåsbara brädor i fabriken i Qingdao
    - title: Laminering av drop-stitch-kärnan
      description: 'SUP-brädornas drop-stitch-kärnor limmas till de yttre PVC-lagren genom varmlaminering. Tusenals polyestertrådar förbinder över- och underskiktet och skapar en styv konstruktion vid 12–15 PSI. Railbanden limmas genom treskiktsfusion för att ge kanterna styrka.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Produktionslinje för uppblåsbara SUP''er med laminationsanläggning för drop-stitch-kärnan i fabriken i Qingdao
    - title: Tryckning & dekoration av SUP
      description: 'SUP-brädorna dekoreras med digital tryckning för grafik i fullfärg och silkeskärmstryckning för logotyper och återkommande mönster. De digitala skrivarna producerar fotorealistiska deck-design, medan silkeskärmstryckningen ger hållbara och framträdande varumärken.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Interiör från produktionsavdelningen i fabriken för uppblåsbara SUP''er i Qingdao
    - title: Slutmontering & färdigställande
      description: 'Montagelinje där ventiler, D-ringar, handtag, fenhållare och deckpads monteras på varje SUP-bräda. Varje bräda följer en 100-punkts montagelista som undertecknas av skiftledaren.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Produktionsavdelning med montageposter i fabriken i Qingdao
    - title: Kvalitetskontroll & inspektion
      description: 'Varje färdig bräda genomgår före leveransen ett obligatoriskt lufttätningstest, en kontroll av sömdelaminering och en fullständig systemkontroll. Vårt kvalitetslaboratorium arbetar oberoende av produktionen och rapporterar direkt till ledningen.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Tryckprovning av en uppblåsbar SUP för lufttätning före leverans i fabriken i Qingdao

