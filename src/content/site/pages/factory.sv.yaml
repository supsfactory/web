      certified: Intern QC + ISO 9001-leverantör
    - material: Ventiler & delar
      source: Kinesiska OEM-leverantörer
      certified: ISO 9001, materialintyg per parti

qc_dashboard:
  tagline: QC i siffror
  title: Kvalitetskontrollmätvärden
