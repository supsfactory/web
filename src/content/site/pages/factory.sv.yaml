answer:
  label: 'Tydligt svar'
  text: 'Certifierad fabrik för uppblåsbara SUP''er i Qingdao, Kina: ISO 9001, ISO 25649, BSCI, CE, REACH och RoHS. Produktionsyta på 12 500 m² med 4 specialiserade verkstäder, över 350 medarbetare, över 120 000 brädor producerade per år (10 000 brädor/månad på 4 automatiserade linjer). Varje bräda trycktestas i 24 timmar vid 18.0 PSI, går igenom en 100-punkts montagelista och bär 10 års materialspårbarhet.'
