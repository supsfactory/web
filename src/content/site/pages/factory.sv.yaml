intro:
  - 'Som produktionsdivision inom **Qingdao Vatrad Group Co., Ltd.** kontrollerar Vatrad varje fas i produktionen av uppblåsbara SUP''er — från mottagningen av PVC-råmaterialet till den slutliga inspektionen före leverans av den färdiga paddelbrädan. Vår produktionsanläggning i Qingdaos ekonomiska utvecklingszon omfattar 12 500 kvadratmeter och rymmer verkstäder för PVC-skärning, laminering av drop-stitch-kärnan, digital tryckning av SUP''er, slutmontering och kvalitetskontroll.'
  - 'Genom att integrera design, konstruktion, prototyper, produktion och testning under ett tak eliminerar vi ineffektiviteten i orderbaserad produktion och behåller direkt kontroll över byggkvalitet, materialval och leveranstider. Varje SUP som lämnar vår anläggning är byggd av våra människor, med vår utrustning, enligt våra normer.'

