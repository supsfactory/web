  system: 'Skräddarsytt ERP-system (internt system för Qingdao Vatrad Group) + fysiska partimärkningar på varje arbetsorder'
  coverage: '100 % av produktionsmaterialet — PVC, Hypalon, drop-stitch-tyg, lim, ventiler, delar, förpackning'
  records_retained: 10 år (enligt kravet i CE 2013/53/EG)
  suppliers:
