qc_section:
  tagline: Kvalitetskontroll
  title: Testprocess & kvalitetssäkring
  subtitle: Varje bräda genomgår före leveransen ett obligatoriskt test. Vårt kvalitetslaboratorium arbetar oberoende av produktionen och rapporterar direkt till ledningen.
  steps:
    - step: '1'
      title: Kontroll av råvaror
      desc: 'PVC-, Hypalon- och drop-stitch-tyger genomgår provning av dragstyrka, rivprovning och verifiering av UV-beständighet innan ett parti får gå in i produktionen.'
    - step: '2'
      title: 24-timmars lufttätningstest
      desc: 'Varje kammer pumpas upp till 18.0 PSI och hålls i 24 timmar. En tryckförlust på mer än 0.50 PSI utlöser automatisk kassering och omkontroll av sömmarna.'
    - step: '3'
      title: Belastnings- & balanstest
      desc: 'De färdiga brädorna pumpas upp till nominellt tryck och kontrolleras avseende symmetrisk fyllning, styvhet vid 15 PSI och stabilitet under belastning. Varje bräda testas i vattnet i vår testbassäng före slutkontrollen.'

oem_section:
  tagline: OEM-projekt
  title: Fallstudier om partnerskap med varumärken & OEM
  subtitle: 'Från idé till produktion — så hjälper vi världsomspännande varumärken att lansera och skala upp sina serier av uppblåsbara SUP''er.'
  cases:
    - challenge: En europeisk friluftsbutiks-kedja behövde en egen SUP-serie med unika deck-tryck, miljövänligt PVC och butiksklara förpackningar — allt levererat inom 60 dagar.
      solution: 'Utveckling av skräddarsydda digitala tryckfiler, inköp av REACH-godkänt PVC och komprimering av provfasen från 3 omgångar till 1 tack vare det designteam som finns i vår fabrik i Qingdao.'
      result: 'Produktion på 25–35 dagar efter undertecknad order, med första leverans inom 60-dagarsfönstret. 2 400 enheter i 4 SKU:er. Återorder innan den första partin levererats komplett.'
      disclaimer: 'Anonymiserad projektsammanfattning — projekttypen och omfattningen är representativa; de konkreta resultaten är inte oberoende verifierbara.'
    - challenge: 'Ett amerikanskt vattensportstartup behövde en högkvalitativ drop-stitch-SUP med anpassad form, co-branding-förpackning och BSCI-certifiering för detaljhandeln.'
      solution: 'Anpassning av en befintlig SUP-form med ändrad kontur, utveckling av co-branding-förpackningsgrafik och leverans av fullständig BSCI-auditdokumentation.'
      result: 'Framgångsrik placering hos ledande amerikanska friluftsbutiker, med stark uppåtgång tack vare mer än 5 000 sålda enheter under det första året och en fullständighetsgrad på 98 %.'
      disclaimer: 'Anonymiserad projektsammanfattning — projekttypen och omfattningen är representativa; de konkreta resultaten är inte oberoende verifierbara.'
    - challenge: 'En australisk distributör behövde en CE-certifierad SUP-serie med anpassade färger och överensstämmelse med australiska normer.'
      solution: 'Produktion av seriemuster med 4 färgvarianter och samordning av överensstämmelsetest genom tredje part.'
      result: 'Lansering av en SUP-serie med 3 modeller på AU/NZ-marknaden. Därefter en framgångsrik offentlig upphandling av 12 patrull-SUP''er.'
      disclaimer: 'Anonymiserad projektsammanfattning — projekttypen och omfattningen är representativa; de konkreta resultaten är inte oberoende verifierbara.'

faq_section:
  tagline: FAQ
  title: Vanliga frågor om B2B & OEM
  questions:
    - q: Vilken är minsta beställningsmängd (MOQ) för OEM- tillverkning av uppblåsbara SUP-brädor?
      a: 'MOQ fastställs utifrån projektkonfigurationen och inte av en fast siffra — skropp och utrustning, färg- och PVC-varianter, grafik, förpackning och tillbehör. Standardserietillverkning sker med 90–100+ enheter per parti från en hel drop-stitch-rull på 150 m, co-branding i småpartier startar från 5–10 enheter och varje projekt går igenom faserna prov (1–2 enheter) och pilot (20–50 enheter). Se vår guide för flexibel MOQ & branding för hela beräkningslogiken.'
    - q: Har Vatrad en BSCI-certifiering?
      a: 'Ja. Vår fabrik har en giltig BSCI-certifiering för social efterlevnad (auditrapporter tillgängliga på begäran). Därutöver tillämpar vi ISO 9001 för kvalitetsledning. CE-certifieringen gäller modeller avsedda för EU-marknaden; omfattningen bekräftas projekt för projekt. Dokumentation för REACH- och RoHS-överensstämmelse medföljer varje OEM-order.'
    - q: Vad är den typiska leveranstiden för en OEM-order?
      a: 'Standardleveranstiden är 25–35 dagar efter bekräftad PO och handpengar för volym-OEM-produktion. Design av anpassade former adderar 15–20 dagar för framtagningen av formen. Expressproduktion finns tillgänglig för brådskande order och säsongstoppar. Prototyprover är vanligtvis klara inom 7–12 dagar.'
    - q: Hanterar ni den kommersiella exportdokumentationen?
      a: 'Ja. Vårt team hanterar kommersiell exportdokumentation och tullhantering internt, och vi skickar till över 50 länder på EU-, USA-, AU- och asiatiska marknader.'

b2b_moq: 'MOQ fastställs utifrån projektkonfigurationen: prov 1–2, pilot 20–50, serie 90–100+ (per rulle på 150 m); co-branding i småpartier från 5–10 enheter.'

production_flow:
  tagline: Produktionsflöde
  title: Från material till färdig bräda
  subtitle: Varje bräda går igenom 6 produktionsfaser med QC-kontrollpunkter i varje steg. Inga genastrick, inga utelämnade inspektioner.
  stages:
    - stage: '01'
      title: Varumottagning & ingående QC
      description: 'Allt inkommande material registreras i vårt ERP-system med ett partinummer. Rullar av PVC-tyg, drop-stitch-kärnor, ventiler, lim och delar hålls i karantän tills QC har frigjort dem.'
      qc_check: 'Dragstyrka (ASTM D751), rivhållfasthet (ISO 4674), tjockleksmätning, limviskositet, skanning efter visuella defekter'
      qc_threshold: '100 % av partierna testas. Kassering om dragstyrkan är < 90 % av specifikationen, rivhållfastheten är under spec-minimum eller en visuell defekt finns'
      responsibility: Ingående QC-team (3 inspektörer)
    - stage: '02'
      title: CNC-skärning & materialförberedelse
      description: 'Datoroptimerad nesting placerar panelerna på PVC-utgångsmaterialet för att minimera avfall. De automatiska CNC-skärmaskinerna bibehåller en positioneringsnoggrannhet på 0.1 mm.'
      qc_check: 'Måttkontroll mot CAD-DXF-filerna, kontroll av kantkvalitet, kontroll av antal paneler'
      qc_threshold: 'Mäts var 20:e panel. Tolerans ±0.5 mm. Partiet kasseras om >2 % ligger utanför toleransen'
      responsibility: Chef för skärverkstaden
    - stage: '03'
      title: Svetsning & limning av drop-stitch
      description: 'Drop-stitch-kärnorna limmas till de yttre PVC-lagren genom varmlaminering. Kammarna svetsas med HF eller varm luft. Railbanden limmas genom treskiktsfusion.'
      qc_check: 'Delamineringsprov var 50:e enhet (ASTM D751), mätning av sömbredd, kontroll av varmluftstemperaturloggen, visuell inspektion av sömmarna mot ljus'
      qc_threshold: 'Minsta rivstyrka 8 N/cm. Tolerans för sömbredd ±1 mm. Synlig fåra = kassering'
      responsibility: Svets-QC (2 inspektörer per skift)
    - stage: '04'
      title: Montering & färdigställande
      description: 'Brädorna går in i slutmonteringen där alla komponenter samlas: svetsade deck- och skroppspaneler, monterade ventiler, D-ringar, handtag, fenhållare och monterad transportväska. Varje enhet följer en 100-punkts montagelista.'
      qc_check: 'Frigörning av 100-punktslistan per enhet, funktionstest av ventiler (10 öppnings-/stängningscykler), kontroll av åtdragningsmoment på delar, visuell inspektion'
      qc_threshold: 'Nolldefektpolicy för säkerhetskritiska komponenter (ventiler, D-ringar, handtag). Mindre kosmetiska fel: AQL 2.5 (ISO 2859)'
      responsibility: Montageskiftledare + linj QC
    - stage: '05'
      title: Tryckprovning & kvalitetsgrind
      description: 'Varje kammer pumpas upp till 18.0 PSI (för en SUP med märkning 12–15 PSI) och hålls i 24 timmar. Trycksensorerna registrerar kontinuerligt. Kammare med en tryckförlust på mer än 0.50 PSI kasseras och skickas till omkontroll av sömmarna.'
      qc_check: 'Registrering av 24-timmars tryckhållning, daglig verifiering av sensorkalibreringen, temperaturkompenserad tryckmätning, sömnprov efter reparation'
      qc_threshold: 'Max 0.50 PSI tryckförlust på 24 h vid stabil temperatur. Varje kammer som överskrider detta = 100 % omtestning av hela produktionspartiet'
      responsibility: Kvalitetslaboratorium (oberoende av produktionen, rapporterar till ledningen)
    - stage: '06'
      title: Slutkontroll & förpackning
      description: 'Slutlig visuell och funktionell kontroll. Ytdefekter, färgkonsekvens, verifiering av etiketter/streckkod, förpackningsintegritet och fullständighet hos tillbehören. Enheterna vakuumförpackas, placeras i kartonger och palleteras i lager inför containerlastning.'
      qc_check: 'Fullständig visuell inspektion, tillbehörslista per SKU, fallprov av förpackningen (1 m, stickprov), verifiering av etikett- och streckkodsskanningar'
      qc_threshold: 'AQL 2.5 för allvarliga defekter, AQL 4.0 för lätta defekter. Nolltolerans för säkerhetsdefekter. 100 % av enheterna visuellt inspekterade'
      responsibility: Slut-QC-team (4 inspektörer) + förpackningsskiftledare

