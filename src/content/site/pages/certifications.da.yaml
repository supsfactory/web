quality_basis:
  tagline: Kvalitetsgrundlag
  title: 'Hvad der definerer accept af produktet'
  subtitle: 'De endelige acceptkriterier fastlægges, før produktionen frigives. Disse kontrollerede projektdokumenter definerer, hvad der skal fremstilles, hvordan nøgledetaljer verificeres, og hvad der skal kontrolleres før afsendelse — godkendt med køberen og fastlåst i Quality Inspection Plan (QIP). Alle ændringsanmodninger går gennem dokumenteret ændringsstyring, aldrig stilt og roligt gennem produktionen.'
  items:
    - title: 'Godkendt prøveeksemplar'
      description: 'Det fysiske referencebræt, som køberen har godkendt. Hvert færdigt bræt sammenlignes hermed for mål, profil, stivhed og finish.'
      icon: tabler:medal
    - title: 'Teknisk specifikation'
      description: 'Materialer, konstruktion og måltegninger låst til et revisionsnummer. FAI verificerer det første eksemplar mod netop denne revision.'
      icon: tabler:file-check
    - title: 'Godkendt artwork'
      description: 'Artwork, trykfarver og placering godkendt og versionslåst, før skæringen begynder, så hvert dæk afsendes i det udtryk, brandet godkendte.'
      icon: tabler:palette
    - title: 'Kundens godkendte BOM'
      description: 'Stykliste — bræt, pagaj, pumpe, sikkerhedsline, taske, manual — bekræftet af køberen. PSI kontrollerer 100 % sætets fuldstændighed mod denne BOM.'
      icon: tabler:list-checks
    - title: 'Emballage- og mærkningskrav'
      description: 'Kartonopbygning, mærkning, barcodes, etiketindhold og afsendelsesmærkninger fastlagt skriftligt. Barcodelæsbarhed og mærkningsnøjagtighed verificeres ved PSI.'
      icon: tabler:package
tests:
  - title: Tryktest
    description: Oppustelige kamre udsættes for tryk, der overstiger deres anbefalede driftsgrænser, i længere tid. Dette verificerer lufttæthed og strukturel integritet i materialer og sømme og sikrer, at produktet kan klare den tilsigtede anvendelse og mulig overpumpning uden fejl eller lækager.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: 'Oppusteligt SUP-kammer under tryktest, hvor lufttæthed verificeres'
  - title: Slagprøvning
    description: 'Produkter udsættes for kontrollerede slag fra forskellige vægter og vinkler. Dette vurderer materialets modstand mod punkteringer, revner og skader fra kollision med genstande i vandet og dokumenterer holdbarhed og levetid.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: 'Slagprøvningsanordning, der vurderer materialets punkteringsmodstand i en oppustelig båd'
  - title: UV-modstandstest
    description: 'Materialeprøver udsættes for accelereret UV-stråling for at verificere, at de ikke bliver gule, revner eller mister styrke over tid. Hvert PVC-batch kontrolleres mod solnedbrydning, før det bruges i produktionen.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: 'PVC-materialeprøver under accelereret UV-stråling i modstandstest'
  - title: Slidprøvning
    description: 'Materialeprøver gnides mod slibende overflader i et bestemt antal cyklusser under kontrolleret tryk. Dette måler materialets evne til at modstå slid fra gentagen brug, kontakt med sand, sten eller andre overflader og sikrer langtidsholdbarhed.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: 'Slidprøvemaskine, der gnider en prøve af PVC-dug for at måle slidmodstanden'
  - title: 'Test ved lave temperaturer'
    description: 'Produkter testes i kolde miljøer for at vurdere funktionalitet og holdbarhed ved forskellige temperaturforhold og forhindre stivhed eller revnedannelse i koldt vand. Vigtigt for både, der er beregnet til vinterbrug eller høje breddegrader.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: 'Oppusteligt produkt i en koldkammer under test ved lave temperaturer'
  - title: 'Test af opdrift & lasteevne'
    description: 'Produkter testes med forskellige vægte for at fastslå deres maksimale bæreevne og sikre, at de sikkert bærer brugere og udstyr. Hver models nominelle kapacitet verificeres, før den frigives.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: 'Test af opdrift og lasteevne med vægte på et oppusteligt fartøj'
  - title: Manøvredygtighedstest
    description: 'Produkter testes for deres reaktion på pagaj- eller motorinput, hvor svingradius og håndteringsvenlighed vurderes. Prøvesejlads på vandet bekræfter, at den faktiske håndtering svarer til designspecifikationerne.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: 'Test af manøvredygtighed for oppustelig SUP og bådskrog på vandet'
  - title: Vandtæthedstest
    description: 'Fuldt samlede produkter nedsænkes eller udsættes for vandspray for at kontrollere for lækager gennem sømme, ventiler eller materialer. Alle både gennemgår en obligatorisk vandtæthedskontrol, før de afsendes.'
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: 'Vandtæthedstest ved nedsænkning, der kontrollerer sømme og ventiler for lækager'
qc_flow:
  tagline: Inspektionsforløbet i 7 trin
  title: 'Syv kontrollerede kvalitetsspor fra start til slut'
  subtitle: 'Hvert spor nedenfor er defineret i projektets Quality Inspection Plan med sit inspektionsobjekt, sin metode, sine acceptkriterier og sin rekordudgang. De to-sprogede rapportdossierser er ægte kontrollerede rekorder — åbn et vilkårligt af dem for at se den faktiske struktur.'
  obj_label: Inspektionsobjekt
  method_label: Inspektionsmetode
  criteria_label: 'Acceptkriterier'
  record_label: 'Rekordudgang'
  stages:
    - stage: STAGE 01
      title: 'Projektkvalitetsplanlægning (PPM)'
      summary: 'Mødet før produktionen låser omfang, grundlinjer og inspektionsplan, før linjen sættes i gang.'
      checks:
        - 'Produktnavn, intern kode, kundens SKU, ordrenummer og batchdefinition registreres.'
        - 'Brættype, drop-stitch-kerne, materialer, kantbånd, EVA, ventiler og finnesystem specificeres.'
        - 'Artworkets filnavn, version, farver, logoplacering og trykområde låses og godkendes.'
        - 'BOM — alle dele pr. sæt med antal, farve, delnummer og regler for erstatning — godkendes af kunden.'
        - 'Emballage, mærkning, barcodes, sprog i manualerne og aftaler om tredjepartsinspektion fastlægges skriftligt.'
      object: 'Projektomfang mod kundens krav — materialer, mål, artwork, emballage, målmarked og gældende standarder.'
      method: 'Møde før produktion med salg, konstruktion og QC; godkendelse af Golden Sample; Quality Inspection Plan (QIP) udstedes for ordren.'
      criteria: 'Alle fem grundlinjer godkendes og låses, før masseproduktionen starter. Uløste punkter blokerer produktionsfrigivelse.'
      record: 'QIP + PPM-referat, rekorder for godkendte prøveeksemplarer.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: 'Møde før produktion, der gennemgår golden sample og kvalitetsinspektionsplan for en OEM-SUP-ordre'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Download QIP (PDF)'
    - stage: STAGE 02
      title: 'Kontrol af modtagne materialer (IQC)'
      summary: 'Råmaterialer verificeres mod den godkendte leverandørspecifikation, før de går ind i produktionen.'
      checks:
        - 'Drop-stitch-dug, PVC-ruller, kantmateriale og EVA-dækflader kontrolleres mod det godkendte prøveeksemplar — farve, tykkelse, vægt og overfladedefekter.'
        - 'Ventiler, finnekasser, D-ringe, håndtag og beslag kontrolleres for type, størrelse, finish, rust og korrekt funktion.'
        - 'Pumper, pagajer, sikkerhedsliner, tasker og reparationssæt verificeres for model, farve og projektkonfiguration.'
        - 'Leverandørattester (COA), materialeerklæringer og REACH/RoHS-overholdelsesdokumenter gennemgås pr. batch.'
        - 'Afvigende partier sættes i karantæne og returneres, før noget materiale når linjen.'
      object: 'Drop-stitch-dug, PVC-ruller, ventiler, finner, tilbehør og emballagematerialer mod den godkendte specifikation og leverandørens testattester.'
      method: 'Visuelle, måltekniske og vægtkontrol; udtagning pr. batch efter AQL; gennemgang af materialecertifikater; håndhævelse af listen over godkendte leverandører.'
      criteria: 'Opfylder godkendt specifikation og attester. Afvigende partier sættes i karantæne og afvises, før de frigives til linjen.'
      record: 'IQC-testrapporter med henvisning til partier og dispositioner.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: 'Kontrol af modtagne materialer med PVC-dug og SUP-komponenter på fabrikken'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Download IQC-rapporter (PDF)'
    - stage: STAGE 03
      title: 'Proceskontrol & første eksemplar (IPQC / FAI)'
      summary: 'Fremstillingsmetoder og kontrolpunkter vælges efter den godkendte brætplatform og projektkonfigurationen. Det første eksemplar kontrolleres mod de låste grundlinjer; hvert skift foretager patrolkontrol på linjen.'
      checks:
        - 'Det første eksemplar verificeres mod godkendt prøveeksemplar, teknisk tegning, BOM, artwork og emballagefiler, før masseproduktionen starter.'
        - 'Brættets mål, kontur og symmetri måles; trykfarve og logoretsning, placering, farver og revision bekræftes.'
        - 'Sømme og kantens kontinuitet kontrolleres for mellemrum, delaminering, folder, forurening eller fejljustering på linjen.'
        - 'Montering af ventil, D-ring, håndtag og finnekasse kontrolleres for placering, antal og pasform mod kundens godkendte BOM.'
        - 'Godkendelse af FAI versionslåser artwork, mål og BOM; afvigelser sendes til genbearbejdningsbeslutningsflowet — aldrig lappes i farten på linjen.'
      object: 'Første eksemplar og dele under fremstillingen — sømme, kanter, finnekasse, ventilbasis, placering af artwork og moment på beslag.'
      method: 'Førsteartikelinspektion på den første enhed; patrolkontrol pr. skift; svejstyrke og sømflugt verificeres løbende på linjen.'
      criteria: 'Godkendelse af FAI versionslåser artwork, mål og BOM. Afvigelser sendes til genbearbejdningsbeslutningsflowet — aldrig lappes i farten på linjen.'
      record: 'FAI-registrering, patrollogfiler pr. skift, noter om genbearbejdning og disposition.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: 'Inspektion under processen og kontrol af første eksemplar under produktionen af SUP'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Download IPQC-rapporter (PDF)'
    - stage: STAGE 04
      title: 'Oppumpning & lufttæthedstest'
      summary: 'Hvert færdigt bræt gennemgår oppumpning og lufttæhedsverificering, før pakningen — 100 % af enhederne, ikke et udvalg.'
      checks:
        - 'Brættets overflade, kanter og ventilområde kontrolleres for punkthuller, revner, unormale folder eller delaminering, før oppumpningen.'
        - 'Kamrene pumpes op med kaliberet digitalt manometer til projektets testtryk, og startaflæsningen låses.'
        - 'Ventilkerne, ventilbasis og kantsømme kontrolleres hele vejen rundt — nese, hale og krumme områder.'
        - '24 timers trykholdeprøvning med kontinuerlig registrering; automatisk kassation ved for stort tilladt trykfald.'
        - 'Fejlede brætter sættes i karantæne, genbearbejdes efter instruktion og testes fuldt ud igen — ikke blot efterkontrolleret ved reparationsstedet.'
      object: '100 % af de oppustede kamre — lækagedetektering i alle sømme, ventilens integritet og fastholdelse af trykfald.'
      method: 'Lækagedetektering i alle sømme efterfulgt af 24 timers trykholdeprøvning ved 18.0 PSI; automatisk kassation ved fald på over 0.50 PSI.'
      criteria: 'Ingen lækkepunkter og trykfald inden for 0.50 PSI pr. kammer; fejlede enheder sættes i karantæne og genbearbejdes eller skrotes.'
      record: 'Rapporter for lufttæthedstest, en pr. kammer, knyttet til batchen.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: 'Oppumpning og lufttæthedstest af et oppusteligt SUP-kammer'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Download rapporter for lufttæthed (PDF)'
    - stage: STAGE 05
      title: 'Endelig produktinspektion (FQC)'
      summary: 'Færdige brætter måles og vurderes kosmetisk mod det godkendte golden sample.'
      checks:
        - 'Nøgledimensioner — længde, bredde og tykkelse — måles ved arbejdstryk mod tegningernes tolerancer.'
        - 'Brættets kontur, rocker og symmetri verificeres; ingen unormal deformering, vridning eller krumning efter oppumpning.'
        - 'Kosmetik vurderes under D65-dagslyslamper: ridser, pletter, limspor, bobler, folder, farveafvigelse.'
        - 'Funktionskontrol: ventilens åbning/lukning og hættens pasform, isætning og låsning af finner, D-ringe, håndtag og pagajfunktion.'
        - 'Konfigurationen verificeres mod kundens godkendte BOM og SKU — tilbehør, etiketter, barcodes og serienumre.'
      object: 'Færdigt bræt mod golden sample — mål, rocker, profil, kosmetik, pasform i finnekasse og tilbehørens fuldstændighed.'
      method: 'Målteknisk verifikation mod tegningernes tolerancer; kosmetik vurderet under D65-dagslyslamper; pasformstest af finnekasse og beslag.'
      criteria: 'Mål inden for tolerancen (f.eks. 3508 × 814 × 150.3 mm), kosmetisk vurdering efter det godkendte prøveeksemplar, alle tilbehør til stede.'
      record: 'FQC-rapporter med inspektørsignatur og disposition.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: 'Endelig produktinspektion af færdige SUP-brætter før pakning'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Download FQC-rapporter (PDF)'
    - stage: STAGE 06
      title: 'Emballage- og forhåndsinspektion (PSI)'
      summary: 'Det pakkede sæt kontrolleres for fuldstændighed, mærkningsnøjagtighed og afsendelsesparathed.'
      checks:
        - '100 % fuldstændighed i sættet mod BOM: bræt, pagaj, pumpe, sikkerhedsline, taske, reparationssæt og manual — et sæt ad gangen.'
        - 'Sårbare dele er beskyttet (tasker til pumpe og blade), brættet er foldet efter emballegens SOP, og tilbehøret passer til model og farve.'
        - 'Kartongrafik, brand, advarsler og sprogudgaver verificeres mod den godkendte artworkrevision.'
        - 'Barcodetype, nummer, placering og læsbarhed verificeres; afsendelsesmærkninger, SKU, PO, kartonnummer og antal er korrekte.'
        - 'Kartonmål, brutto/nettovagt og indpakning matcher emballespecifikationen; resultatet af drop-test registreres, når det kræves.'
      object: 'Pakket sæt — bræt, pagaj, pumpe, sikkerhedsline, taske, manual — mod kundens godkendte BOM og emballespecifikation.'
      method: '100 % fuldstændighed i sættet mod BOM; barcode-scanning (klasse ≥ B); nøjagtighed i kartonnummerering; ISTA-1A drop-test på pakkede kartoner.'
      criteria: '100 % af sættet matcher BOM, læsbare barcodes, korrekte mærkninger og drop-sikker pakning, før lastningen.'
      record: 'PSI-tjeklister og pakningsrekorder pr. karton.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: 'Inspektion før afsendelse, hvor det pakkede SUP-sæt kontrolleres mod BOM'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Download PSI-rapporter (PDF)'
    - stage: STAGE 07
      title: 'Frigivelse & sporing'
      summary: 'Kvaliteten signerer først batchen, når alle seks foregående spor er lukket, og hver rekord er komplet.'
      checks:
        - 'Produktionsbatch, ordrenummer, SKU, antal og kartonantal matcher pakningslisten og den kommercielle faktura.'
        - 'Specifikation, BOM, artwork- og emballagefiler ligger alle på den aktuelle godkendte revision.'
        - 'IQC-, FAI-, proces-, lufttæheds-, FQC- og PSI-rekorder er komplette for den batch, der frigives.'
        - 'Alle afvigelser er løst, genbearbejdet, geninspekteret og lukket — ingen åbne punkter ved frigivelsen.'
        - 'Sporingsfelter registreres pr. batch: projektkode, PO, SKU, revisioner af artwork/BOM/emballage, produktionsdato, inspektør og rekoldnumre.'
      object: 'Frigivelsesbemyndigelse for batchen — alle spor lukket, rekorder komplette, serienumre kortlagt til batchen.'
      method: 'Sporgennemgang af alle seks foregående rekorder foretaget af kvaliteten; batchsporingsdossier samlet; rekorder overleveres med forsendelsen.'
      criteria: 'Alle spor godkendt af QA; batchrekorder og batchsporingsdossier leveres til køberen eller opbevares under NDA på forespørgsel.'
      record: 'Autorisation af frigivelse før afsendelse og batchsporingsdossier.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: 'Signatur for frigivelse før afsendelse og overdragelse af batchsporingsdossier'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Download frigivelsesrapporter (PDF)'
system_map:
  tagline: Kvalitetssystemet
  title: 'Et system, fire kontrollerede standarder'
  subtitle: 'De syv spor ovenfor kører på fire dokumenterede standarder, som hver især udgives som en kontrolleret procedure, du kan downloade og auditere. Tilsammen udgør de QMS bag enhver OEM/ODM-ordre — inspektionskriterier, ændringsstyring, afvigelseskontrol og laboratorietest.'
  items:
    - title: 'Inspektions- og frigivelsesstandarder'
      description: 'Projektets QIP driver hvert spor: inspektionsobjekt, metode, acceptkriterier og rekordudgang pr. ordre. Omfatter QC-rammen i 4 trin, sporingskæden, karantæneflowet, fejlmatrixen og dokumentregisteret 00–15.'
      icon: tabler:clipboard-check
      link: /da/factory/quality-inspection
      link_label: 'Inspektionsstandarder & QMS-downloads'
    - title: 'Ændringsstyring af genbearbejdning'
      description: 'Ingen ændringer i genbearbejdningsparametre uden dokumenteret kontrol: inddæmming, risikoklassificering, ændringsløkke i 9 trin, godkendelsesmatrix og validering. Enhver ændring i godkendte specifikationer, prøveeksemplarer, BOM’er eller acceptkriterier kræver skriftlig godkendelse fra kunden.'
      icon: tabler:git-branch
      link: /da/factory/quality-change-control
      link_label: 'Standard for ændringsstyring'
    - title: 'Kontrol af afvigende produkter'
      description: 'En lukket løkke i 7 trin under ISO 9001:2015 punkt 8.7: identificere, karantænesætte, disposition pr. NCR, genbearbejde eller kassere, geninspektere, frigive og korrigere. Omfatter bemyndigelse efter alvorgrad, dispositionsmatrix for SUP-fejl og overværet ødelæggelse.'
      icon: tabler:alert-triangle
      link: /da/factory/non-conforming-control
      link_label: 'Standard for kontrol af afvigende produkter'
    - title: 'Laboratorietest & udstyr'
      description: 'Kvalitetslaboratoriet drives uafhængigt af produktionen: trækprøvning, trykfald, UV-aldring, skrælning af svejser, lækagedetektering og temperaturkamre — med kalibreringen og testprocedurerne bag vores offentliggjorte påstande.'
      icon: tabler:flask
      link: /da/factory/quality-lab
      link_label: 'Kvalitetslaboratorium & testudstyr'
    - title: 'Materialetestlaboratorium (R&D)'
      description: 'R&D-centret drives uafhængig materialetestning af PVC/Hypalon-formuleringer, accelereret aldring og støtte til certificering, som leverer standarderne til produktionen.'
      icon: tabler:microscope
      link: /da/randdcenter/quality-inspection-lab
      link_label: 'Materialetestlaboratorium i R&D'
intelligence_cards:
  tagline: 'Dokumentation & sporbarhed'
  title: 'Kvalitetsrekorder, der understøtter sporing på projektniveau'
  subtitle: 'Inspektionsrekorder føres pr. produktionsbatch og kobles til den gældende projektdokumentation — specifikationsrevision, artworkrevision, BOM og pakkekrav. For at beskytte kundernes fortrolighed er eksemplerne på denne side anonymiserede: kun strukturelle felter vises (projektkode, produkt/SKU, batch, inspektionstrin, inspektionspunkt, acceptkriterier, resultat, inspektør, dato og frigivelsesstatus).'
  cards:
    - icon: 1
      icon_bg: blue
      title: 'Registrering af kontrol af modtagne materialer'
      desc: 'Beviser, at råmaterialer, drop-stitch-dug, PVC-ruller og komponenter er verificeret mod den godkendte specifikation, før produktionen frigives.'
