faqs:
  tagline: FAQ
  title: 'Ofte stillede spørgsmål om vores kvalitetssystem'
  items:
    - q: 'Kan jeg downloade de faktiske inspektionsrapporter?'
      a: 'Ja. De syv to-sprogede rapportdossierser på denne side — QIP, IQC, IPQC/FAI, lufttæthed, FQC, PSI og frigivelse før afsendelse — er ægte kontrollerede rekorder med fortrolige felter fjernet. De viser den præcise struktur, metoder og acceptkriterier, der bruges på hver ordre.'
    - q: 'Hvordan afstemmes de syv spor med mit projekt?'
      a: 'Hvert projekt får en Quality Inspection Plan (QIP), der definerer hvilke spor der gælder for dit produkt og marked, inspektionsomfanget i hvert spor og de rekorder, du modtager. Download QIP-eksemplet på denne side for at se strukturen.'
    - q: 'Er disse eksempler på inspektionsrekorder ægte?'
      a: 'Ja. Eksemplerne følger vores faktiske kontrollerede rekordstruktur — dokumenthoved, inspektionstjekliste, acceptkriterier, metode, resultater, inspektørens rolle og frigivelsesdisposition. Alle identificerende værdier er erstattet af demonstrationsværdier (DEMO-* koder), så ingen kunde-, artwork-, ordre- eller prisdata bliver blotlagt.'
    - q: 'Hvorfor er eksemplerne anonymiserede?'
      a: 'Kundernes fortrolighed kommer først. Kundenavne, artwork, ordredetaljer, leverandøroplysninger og priser er beskyttet som udgangspunkt. Anonymiseringen gør, at alle potentielle købere kan verificere vores rekordstruktur og sporing uden at blotte en anden kundes forretning.'
    - q: 'Kan vi modtage fulde inspektionsrapporter til vores projekt?'
      a: 'Ja. For godkendte projekter deler vi den kvalitetsdokumentation, der gælder for din ordre — plan for kvalitetsinspektion, rapporter for modtagne materialer, proces, lufttæthed, endelig inspektion og pakning samt autorisation af frigivelse før afsendelse — knyttet til din batchsporing. Fortrolige kommercielle data forbliver under NDA som aftalt.'
    - q: 'Hvad indeholder en inspektionsrektering på batchniveau?'
      a: 'Hver rekord knytter produktionsbatchen til den gældende specifikations- eller tegningsrevision, registrerer hvert inspektionspunkt mod sine acceptkriterier med den anvendte metode og det anvendte værktøj og afsluttes med inspektørens rolle, resultatstatus og den frigivelsesdisposition, som kvaliteten har signeret.'
evidence_review:
