hero:
  tagline: Kvalitetskontrol for specialprojekter
  title: 'Kvalitetskontrol af specialfremstillede oppustelige SUP-projekter'
  subtitle: 'Kvaliteten verificeres mod det godkendte prøveeksemplar, den tekniske specifikation, artwork, styklisten og emballagekravene for hvert projekt — ikke mod en generel påstand. Fra modtagne materialer til frigivelse før afsendelse er vores inspektionsproces struktureret til at verificere produktoverensstemmelse på definerede produktionstrin. Drevet af QINGDAO VATRAD GROUP, den 12,500 m² store fabrik for oppustelige SUP-brætter bag Vatrad.'
