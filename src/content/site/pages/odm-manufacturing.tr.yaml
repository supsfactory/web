hero:
  tagline: ODM Üretimi
  title: 'SUP ODM Üreticisi — Ürün Tasarımı ve Geliştirme'
  subtitle: 'Tamamlanmış bir SUP tasarımına ihtiyacınız yok. Bir ürün konsepti, pazar gereksinimi veya performans hedefiyle başlayın — kendi bünyemizdeki mühendislerimiz gövdeyi, yapıyı, grafikleri ve ambalajı brifinginize göre tasarlar, ardından 7–12 günde prototip üretir ve onaylanan siparişten sonra 25–35 günde seri üretime geçirir.'

answer:
  label: 'Doğrudan yanıt'
  text: 'iSupfactory, Çin, Qingdao merkezli bir SUP ODM üreticisidir. ODM geliştirme sizin çizimlerinizden değil, brifinginizden başlar: gövde tasarımı (uzunluk, genişlik, rocker, hacim), malzeme yapısı ve grafikler kendi bünyemizde tasarlanır, 7–12 günde prototip numunelerle doğrulanır ve 150 m rulo başına 90–100 adetlik standart hacimli MOQ ile üretilir (pilot 20–50 adetten başlar). Üretim, onaylanan sipariş ve depozitodan sonra 25–35 gün sürer; özel kalıp işleri 15–20 gün ekler. CE, ISO 9001, BSCI, REACH ve RoHS dokümantasyonu her siparişle birlikte gönderilir.'
  verified: 'Eylül 2026'

