      description: 'Drop-stitch yoğunluğu, PVC katman sayısı ve kalitesi, destek elemanı yerleşimi ve rail yapısı sizin tasarımınız için belirlenir ve doğrulanır.'
      icon: 'tabler:building-factory'
    - title: Grafikler ve Markalama
      description: 'Tahta üst yüzey grafikleri, boru markalaması, EVA padler ve perakende ambalajı kendi bünyemizdeki tasarım ekibimiz tarafından markanıza göre geliştirilir.'
      icon: 'tabler:palette'
