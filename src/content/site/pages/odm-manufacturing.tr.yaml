      description: 'Birim başına hava tutma, basınç tutma ve dikiş dayanımı testleri ile hedef pazara uygulanabilir ISO 9001, BSCI, REACH, RoHS ve CE uygunluk dokümantasyonu (kapsam proje bazında teyit edilir).'
      icon: 'tabler:certificate'
    - title: Kalıp Mülkiyeti Seçenekleri
      description: 'Kalıp mülkiyeti veya satın alma koşulları sözleşmeye yazılır — tasarımınız sizin kalır ve kalıplar yeniden siparişler için saklanır.'
      icon: 'tabler:lock'
