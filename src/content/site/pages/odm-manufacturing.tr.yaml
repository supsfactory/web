      description: 'Yeni gövde şekilleri kendi bünyemizde tasarlanıp kesilen kalıplarla başlar — kalıp işleri proje takvimine 15–20 gün ekler.'
      icon: 'tabler:shapes'
    - title: Prototip Doğrulama
      description: 'Fiziksel prototip üretilir, test edilir ve sizin incelemenize gönderilir — genellikle 7–12 gün içinde, pist testiyle birlikte.'
