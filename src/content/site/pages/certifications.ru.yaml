content_certifications:
  tagline: Сертификация и стандарты
  title: 'Сертифицированное качество, признанное во всём мире'
  subtitle: 'Сертификаты ценны ровно тем, что они охватывают. Ниже приведены область сертификации, держатель сертификата и порядок проверки или запроса документов для вашего проекта.'
  items:
    - title: 'Маркировка CE'
      description: 'Документация о соответствии CE доступна для применимых конфигураций рынка ЕС согласно Директиве 2013/53/EU (малые суда); объём подтверждается по каждому проекту. Номера сертификатов и протоколы испытаний предоставляются по запросу.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Система менеджмента качества сертифицирована по ISO 9001:2015 и охватывает проектирование, производство и распределение надувных плавсредств и морского оборудования. Область сертификации и отчёт об аудите предоставляются по запросу.'
      icon: tabler:clipboard-check
    - title: 'Соответствие BSCI по социальным требованиям'
      description: 'Проведён аудит BSCI (Business Social Compliance Initiative), охватывающий условия труда и соответствие завода требованиям. Отчёт об аудите предоставляется по запросу.'
      icon: tabler:heart-handshake
    - title: 'Соответствие REACH по материалам'
      description: 'Материалы соответствуют регламенту ЕС REACH в части химической безопасности. Декларации о материалах предоставляются вместе с производственной документацией по каждой отгрузке.'
      icon: tabler:flask
    - title: 'Соответствие RoHS'
