meta:
  title: 'Контроль качества индивидуальных SUP: контроль на 7 этапах | iSupfactory'
  description: 'Как контролируется каждый индивидуальный заказ SUP: 7 контрольных этапов от планирования перед производством до разрешения отгрузки, с двуязычными отчётами для скачивания.'
  dateModified: '2026-08-15'
  keywords:
    - 'контроль качества sup'
    - 'проверка на заводе sup'
    - 'план контроля качества oem'
    - 'предотгрузочная инспекция sup'
    - 'сертификация ce sup'
    - 'iso 9001 sup'
hero:
  tagline: Контроль качества для индивидуальных проектов
  title: 'Контроль качества индивидуальных надувных проектов SUP'
  subtitle: 'Качество проверяется по утверждённому образцу, технической спецификации, макетам, спецификации материалов и требованиям к упаковке для каждого проекта, а не по общим заявлениям. От входящих материалов до разрешения отгрузки наш процесс контроля структурирован так, чтобы подтвердить соответствие продукции на определённых этапах производства. Работает силами QINGDAO VATRAD GROUP — завода надувных досок SUP площадью 12,500 m², стоящего за Vatrad.'
stats:
  - value: 100%
    label: Единиц проверено под давлением
  - value: '7'
    label: Контрольных этапов со строгим регламентом
  - value: 18.0 PSI
    label: 24-часовое удержание давления
  - value: ISO 9001
    label: Подтверждено сертификатом качества
quality_basis:
  tagline: Основа качества
  title: 'Что определяет приёмку продукции'
  subtitle: 'Критерии финальной приёмки устанавливаются до запуска в производство. Эти проектные документы с регламентом определяют, что именно изготавливается, как проверяются ключевые детали и что должно быть проверено до отгрузки: они согласовываются с закупщиком и замораживаются в Плане контроля качества (QIP). Любой запрос на изменение проходит через документированное управление изменениями, а не незаметно по линии.'
  items:
    - title: 'Утверждённый образец'
      description: 'Физическая эталонная доска, подписанная закупщиком. Каждая готовая доска сравнивается с ней по размерам, профилю, жёсткости и отделке.'
      icon: tabler:medal
    - title: 'Техническая спецификация'
      description: 'Материалы, конструкция и размерные чертежи зафиксированы номером ревизии. FAI проверяет первое изделие по этой точной ревизии.'
      icon: tabler:file-check
    - title: 'Утверждённые макеты'
      description: 'Макеты, цвета печати и размещение утверждены и зафиксированы по версии до раскроя, поэтому каждая палуба отгружается в том виде, который утвердил бренд.'
      icon: tabler:palette
    - title: 'Спецификация материалов, утверждённая клиентом'
      description: 'Спецификация материалов и комплектующих: доска, весло, насос, шнур, сумка, инструкция, подтверждённая закупщиком. PSI проверяет комплектность на 100% по этой спецификации.'
      icon: tabler:list-checks
    - title: 'Требования к упаковке и маркировке'
      description: 'Конструкция короба, маркировка, штрихкоды, содержание этикеток и транспортные знаки зафиксированы в письменном виде. Читаемость штрихкодов и точность маркировки проверяются на этапе PSI.'
      icon: tabler:package
tests:
  - title: Испытание под давлением
    description: Надувные камеры в течение длительного времени подвергаются давлению, превышающему их рекомендуемые рабочие пределы. Это подтверждает герметичность и структурную целостность материала и швов, гарантируя, что изделие выдержит предполагаемую эксплуатацию и возможное избыточное накачивание без разрушения и утечек.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Надувная камера SUP под испытанием давлением для проверки герметичности
  - title: Ударные испытания
    description: Изделия подвергаются контролируемым ударам с различными грузами и под разными углами. Это оценивает сопротивление материала проколам, разрывам и повреждениям при столкновении с препятствиями на воде, подтверждая долговечность и ресурс.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Установка ударных испытаний оценивает сопротивление материала надувной лодки проколу
  - title: Испытание на устойчивость к УФ-излучению
    description: Образцы материалов подвергаются ускоренному УФ-излучению, чтобы убедиться, что они не желтеют, не трескаются и не теряют прочность со временем. Каждая партия PVC проверяется на деградацию под действием солнца до использования в производстве.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: Образцы материала PVC под ускоренным УФ-излучением при испытании на стойкость
  - title: Испытание на износостойкость
    description: Образцы материала трутся об абразивные поверхности в течение заданного числа циклов при контролируемом давлении. Это измеряет способность материала выдерживать износ от повторного использования, контакта с песком, камнями и другими поверхностями, обеспечивая долговременную долговечность.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Машина для испытания на абразивный износ, истирающая образец ткани PVC для измерения износостойкости
  - title: Испытание при низких температурах
    description: Изделия испытываются в холодных условиях для оценки работоспособности и долговечности при разных температурах, предотвращая жёсткость или растрескивание в холодной воде. Незаменимо для лодок, предназначенных для зимней эксплуатации или высоких широт.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Надувное изделие в холодильной камере при испытании рабочих характеристик при низких температурах
  - title: Испытание плавучести и грузоподъёмности
    description: Изделия испытываются с различными грузами для определения максимальной несущей способности и подтверждения безопасной поддержки пользователя и снаряжения. Номинальная грузоподъёмность каждой модели проверяется до выпуска.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Испытание плавучести и грузоподъёмности надувного плавсредства с грузами
  - title: Испытание управляемости
    description: Изделия испытываются на отклик на греблю или воздействие мотора с оценкой радиуса поворота и удобства управления. Испытания на воде подтверждают, что реальное поведение соответствует проектным спецификациям.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Испытание управляемости на воде надувной доски SUP и корпуса лодки
  - title: Испытание герметичности
    description: Полностью собранные изделия погружаются в воду или подвергаются обрызгиванию для выявления протечек через швы, клапаны или материалы. Каждая лодка проходит обязательную проверку герметичности перед отгрузкой.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Испытание герметичности погружением с проверкой швов и клапанов на протечки
qc_flow:
  tagline: Схема контроля на 7 этапах
  title: 'Семь контрольных ворот качества от начала до конца'
  subtitle: 'Каждое из этих ворот определено в Плане контроля качества проекта вместе с объектом контроля, методом, критериями приёмки и формируемым документом. Двуязычные комплекты отчётов — это реальные документы, регулируемые процедурой: откройте любой из них, чтобы увидеть фактическую структуру.'
  obj_label: Объект контроля
  method_label: Метод контроля
  criteria_label: Критерии приёмки
  record_label: Формируемый документ
  stages:
    - stage: STAGE 01
      title: 'Планирование качества проекта (PPM)'
      summary: 'Совещание перед запуском производства фиксирует объём работ, базовые показатели и план контроля до старта линии.'
      checks:
        - 'Фиксируются наименование продукта, внутренний код, артикул клиента, номер заказа и определение партии.'
        - 'Уточняются тип доски, сердцевина drop-stitch, материалы, усилители борта, покрытие EVA, клапаны и система плавника.'
        - 'Имя файла макета, версия, цвета, положение логотипа и область печати фиксируются и утверждаются.'
        - 'Спецификация материалов: каждая позиция комплекта с количеством, цветом, номером детали и правилами замены — утверждается клиентом.'
        - 'Упаковка, маркировка, штрихкоды, язык инструкций и условия привлечения третьей стороны фиксируются в письменном виде.'
      object: 'Объём проекта в сопоставлении с требованиями клиента: материалы, размеры, графика, упаковка, целевой рынок и применимые стандарты.'
      method: 'Совещание перед производством с участием продаж, инженерной службы и контроля качества; подписание эталонного образца; выпуск Плана контроля качества (QIP) для заказа.'
      criteria: 'Все пять базовых показателей утверждены и зафиксированы до начала серийного производства. Нерезолвённые вопросы блокируют запуск производства.'
      record: 'QIP + протоколы PPM, записи об утверждении образца.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: 'Совещание перед производством: проверка эталонного образца и плана контроля качества для заказа OEM SUP'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Скачать QIP (PDF)'
    - stage: STAGE 02
      title: 'Входной контроль материалов (IQC)'
      summary: 'Сырьё проверяется на соответствие утверждённой спецификации поставщика до поступления в производство.'
      checks:
        - 'Ткань drop-stitch, рулоны PVC, материал борта и накладки на палубу EVA сверяются с утверждённым образцом: цвет, толщина, вес и поверхностные дефекты.'
        - 'Клапаны, крепления для плавника, D-кольца, ручки и фурнитура проверяются по типу, размеру, отделке, отсутствию коррозии и работоспособности.'
        - 'Насосы, весла, шнуры, сумки и ремонтные комплекты проверяются по модели, цвету и конфигурации проекта.'
        - 'Сертификаты поставщика (COA), декларации о материалах и документы о соответствии REACH/RoHS рассматриваются по каждой партии.'
        - 'Несоответствующие партии помещаются на карантин и возвращаются до того, как материал попадёт на линию.'
      object: 'Ткань drop-stitch, рулоны PVC, клапаны, плавники, аксессуары и упаковочные материалы на соответствие утверждённой спецификации и испытательным сертификатам поставщика.'
      method: 'Визуальный, размерный контроль и взвешивание; выборочный контроль партий по AQL; проверка сертификатов материалов; соблюдение утверждённого списка поставщиков.'
      criteria: 'Соответствие утверждённой спецификации и сертификатам. Несоответствующие партии помещаются на карантин и отклоняются до выпуска на линию.'
      record: 'Отчёты об испытаниях IQC с указанием партий и решений по ним.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Входной контроль ткани PVC и компонентов SUP на заводе
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты IQC (PDF)'
    - stage: STAGE 03
      title: 'Контроль в процессе и проверка первого изделия (IPQC / FAI)'
      summary: 'Методы сборки и контрольные точки выбираются в соответствии с утверждённой платформой доски и конфигурацией проекта. Первое изделие сверяется с зафиксированными базовыми показателями; каждая смена проводит обходные проверки на линии.'
      checks:
        - 'Первое изделие сверяется с утверждённым образцом, техническим чертежом, спецификацией материалов, макетами и файлами упаковки до начала серийного производства.'
        - 'Измеряются размеры доски, контур и симметрия; подтверждаются направление, положение, цвета печати и логотипа, а также ревизия.'
        - 'Швы и непрерывность усилителей борта проверяются на разрывы, расслоение, морщины, загрязнения и смещение на линии.'
        - 'Установка клапана, D-кольца, ручки и крепления для плавника проверяется по положению, количеству и посадке относительно спецификации, утверждённой клиентом.'
        - 'Утверждение FAI фиксирует версию макетов, размеров и спецификации материалов; отклонения направляются по процедуре принятия решений о доработке, а не устраняются на месте на линии.'
      object: 'Первое изделие и сборочные узлы в процессе: швы, усилители борта, крепление для плавника, основание клапана, положение графики, момент затяжки фурнитуры.'
      method: 'Проверка первого изделия на первой единице; обходные проверки каждую смену; прочность сварных соединений и выравнивание швов контролируются по ходу производства.'
      criteria: 'Утверждение FAI фиксирует версию макетов, размеров и спецификации материалов. Отклонения направляются по процедуре принятия решений о доработке, а не устраняются на месте на линии.'
      record: 'Протокол FAI, журналы обходных проверок по сменам, заметки о доработке и решениях по изделиям.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Внутрипроизводственный контроль и проверка первого изделия при выпуске SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты IPQC (PDF)'
    - stage: STAGE 04
      title: 'Накачивание и испытание на герметичность'
      summary: 'Каждая готовая доска проходит накачивание и проверку герметичности перед упаковкой: 100% единиц, а не выборка.'
      checks:
        - 'Поверхность доски, усилители борта и зона клапана проверяются на проколы, трещины, ненормальные складки или расслоение до накачивания.'
        - 'Камеры накачиваются с помощью откалиброванного цифрового манометра до испытательного давления проекта, начальное показание фиксируется.'
        - 'Сердцевина клапана, основание клапана и швы борта проверяются по всему периметру: нос, корма и изогнутые участки.'
        - '24-часовое удержание давления с непрерывной записью; автоматический брак при превышении допустимого падения давления.'
        - 'Не прошедшие испытание доски помещаются на карантин, дорабатываются по инструкции и полностью перепроверяются, а не просто осматриваются в точке ремонта.'
      object: '100% надутых камер: выявление протечек по всему шву, целостность клапанов и удержание давления.'
      method: 'Выявление протечек по всему шву с последующим 24-часовым удержанием давления при 18.0 PSI; автоматический брак при падении более 0.50 PSI.'
      criteria: 'Нулевое число точек протечки и падение давления в пределах 0.50 PSI на камеру; несоответствующие единицы помещаются на карантин и дорабатываются или списаны.'
      record: 'Отчёты об испытании на герметичность, по одному на камеру, с привязкой к партии.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Накачивание и испытание на герметичность надувной камеры SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты по герметичности (PDF)'
    - stage: STAGE 05
      title: 'Финальный контроль продукции (FQC)'
      summary: 'Готовые доски измеряются и оцениваются по внешнему виду относительно утверждённого эталонного образца.'
      checks:
        - 'Ключевые размеры: длина, ширина и толщина измеряются при рабочем давлении с учётом допусков по чертежу.'
        - 'Проверяются контур доски, rocker и симметрия; после накачивания не допускаются аномальные деформации, перекос или коробление.'
        - 'Внешний вид оценивается при дневном свете D65: царапины, пятна, следы клея, пузыри, морщины, отклонение цвета.'
        - 'Функциональные проверки: открытие и закрытие клапана и посадка колпачка, установка и фиксация плавника, D-кольца, ручки и функционирование весла.'
        - 'Конфигурация сверяется со спецификацией материалов и артикулом, утверждёнными клиентом: аксессуары, этикетки, штрихкоды и серийные номера.'
      object: 'Готовая доска относительно эталонного образца: размеры, rocker, профиль, внешний вид, посадка крепления для плавника и комплектность аксессуаров.'
      method: 'Проверка размеров с учётом допусков по чертежу; оценка внешнего вида при дневном свете D65; испытания посадки крепления для плавника и фурнитуры.'
      criteria: 'Размеры в пределах допуска (например, 3508 × 814 × 150.3 mm), оценка внешнего вида по утверждённому образцу, все аксессуары в наличии.'
      record: 'Отчёты FQC с подписью инспектора и решением по изделию.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Финальный контроль готовых досок SUP перед упаковкой
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты FQC (PDF)'
    - stage: STAGE 06
      title: 'Упаковка и предотгрузочный контроль (PSI)'
      summary: 'Упакованный комплект проверяется на комплектность, точность маркировки и готовность к отгрузке.'
      checks:
        - 'Комплектность 100% по спецификации материалов: доска, весло, насос, шнур, сумка, ремонтный комплект и инструкция — комплект за комплектом.'
        - 'Хрупкие детали защищены (сумки насоса и лопасти), доска складывается по упаковочной SOP, аксессуары соответствуют модели и цвету.'
        - 'Графика короба, бренд, предупреждения и языковые версии сверяются с утверждённой ревизией макетов.'
        - 'Проверяются тип, номер, положение и считываемость штрихкодов; транспортные знаки, артикул, заказ, номер короба и количество корректны.'
        - 'Размер короба, брутто- и нетто-масса, а также внутренняя упаковка соответствуют упаковочной спецификации; при необходимости фиксируется результат теста на падение.'
      object: 'Упакованный комплект: доска, весло, насос, шнур, сумка, инструкция — на соответствие спецификации материалов и упаковочной спецификации, утверждённым клиентом.'
      method: 'Проверка комплектности 100% по спецификации; сканирование штрихкодов (класс не ниже B); точность маркировки короба; тест на падение ISTA-1A на упакованных коробах.'
      criteria: 'Комплектность 100% по спецификации, читаемые штрихкоды, корректная маркировка и ударобезопасная упаковка до погрузки.'
      record: 'Чек-листы PSI и записи об упаковке по каждому коробу.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Предотгрузочный контроль упакованного комплекта SUP по спецификации материалов
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты PSI (PDF)'
    - stage: STAGE 07
      title: 'Разрешение отгрузки и прослеживаемость'
      summary: 'Отдел качества подписывает партию только тогда, когда все шесть предыдущих этапов закрыты и каждый документ оформлен.'
      checks:
        - 'Производственная партия, номер заказа, артикул, количество и число коробов совпадают с упаковочным листом и коммерческим счётом.'
        - 'Спецификация материалов, спецификация материалов и комплектующих, макеты и файлы упаковки находятся на действующей утверждённой ревизии.'
        - 'Документы IQC, FAI, внутрипроизводственного контроля, герметичности, FQC и PSI оформлены по всей выпускаемой партии.'
        - 'Все несоответствия устранены, доработаны, повторно проверены и закрыты — при выпуске нет открытых пунктов.'
        - 'Поля прослеживаемости фиксируются по каждой партии: код проекта, заказ, артикул, ревизии макетов, спецификации материалов и упаковки, дата производства, инспектор и номера документов.'
      object: 'Разрешение на выпуск партии: все этапы закрыты, документы оформлены, серийные номера сопоставлены с партией.'
      method: 'Проверка службой качества всех шести предшествующих документов; формирование досье прослеживаемости партии; передача документов вместе с отгрузкой.'
      criteria: 'Все этапы утверждены отделом качества; документы партии и досье прослеживаемости передаются закупщику либо хранятся под NDA по запросу.'
      record: 'Разрешение на выпуск отгрузки и досье прослеживаемости партии.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Подписание разрешения на отгрузку и передача документов прослеживаемости партии
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Скачать отчёты о выпуске (PDF)'
system_map:
  tagline: Система качества
  title: 'Одна система, четыре стандарта с регламентом'
  subtitle: 'Семь этапов, описанных выше, работают по четырём документированным стандартам, каждый из которых опубликован как контролируемая процедура, доступная для скачивания и аудита. Вместе они образуют СМК, лежащую в основе каждого заказа OEM/ODM: критерии контроля, управление изменениями, несоответствия и лабораторные испытания.'
  items:
    - title: 'Стандарты контроля и выпуска'
      description: 'План контроля качества проекта задаёт каждый этап: объект контроля, метод, критерии приёмки и формируемый документ по каждому заказу. Включает четырёхэтапную систему контроля качества, цепочку прослеживаемости, порядок карантина, матрицу дефектов и реестр документации 00–15.'
      icon: tabler:clipboard-check
      link: /ru/factory/quality-inspection
      link_label: 'Стандарты контроля и загрузка документов СМК'
    - title: 'Управление изменениями при доработке'
      description: 'Никаких изменений параметров доработки без документированного контроля: локализация, классификация рисков, цикл изменений из 9 шагов, матрица согласования и валидация. Любое изменение утверждённых спецификаций, образцов, спецификаций материалов или критериев приёмки требует письменного согласования с клиентом.'
      icon: tabler:git-branch
      link: /ru/factory/quality-change-control
      link_label: 'Стандарт управления изменениями'
    - title: 'Управление несоответствующей продукцией'
      description: 'Замкнутый цикл из 7 шагов по ISO 9001:2015, пункт 8.7: выявление, карантин, решение по NCR, доработка или отклонение, повторный контроль, выпуск, корректировка. Включает полномочия по уровням критичности, матрицу решений по дефектам SUP и уничтожение с наблюдением.'
      icon: tabler:alert-triangle
      link: /ru/factory/non-conforming-control
      link_label: 'Стандарт управления несоответствующей продукцией'
    - title: 'Лабораторные испытания и оборудование'
      description: 'Лаборатория качества работает независимо от производства: разрывные испытания, падение давления, старение под УФ-излучением, прочность сварных соединений, выявление протечек и температурные камеры — вместе с методиками калибровки и испытаний, лежащими в основе наших опубликованных заявлений.'
      icon: tabler:flask
      link: /ru/factory/quality-lab
      link_label: 'Лаборатория качества и испытательное оборудование'
    - title: 'Лаборатория испытаний материалов (НИОКР)'
      description: 'Центр НИОКР ведёт независимые испытания материалов: рецептуры PVC/Hypalon, ускоренное старение и поддержка сертификации, формируя стандарты, применяемые в производстве.'
      icon: tabler:microscope
      link: /ru/randdcenter/quality-inspection-lab
      link_label: 'Лаборатория испытаний материалов НИОКР'
