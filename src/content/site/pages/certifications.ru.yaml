non_conformance:
  tagline: Управление несоответствующей продукцией
  title: 'При обнаружении дефекта: локализовать, решить, задокументировать'
  subtitle: 'Изделия или компоненты, не отвечающие установленным критериям приёмки, выявляются и помещаются под контролируемый карантин. Доработка или замена разрешаются только в рамками применимой процедуры качества, после чего проводится повторный контроль до разрешения на выпуск.'
  items:
    - title: 'Выявление и разделение'
      description: 'Несоответствующие единицы помечаются красным и перемещаются на участок карантина: никакой дальнейшей обработки или упаковки до принятия решения.'
      icon: tabler:alert-triangle
    - title: 'Решение по NCR'
      description: 'Служба качества оформляет отчёт о несоответствии (NCR) и направляет изделие на доработку, повторный контроль, отклонение или списание в соответствии с матрицей решений.'
      icon: tabler:git-branch
      link: /ru/factory/non-conforming-control
      link_label: 'Стандарт управления несоответствующей продукцией'
    - title: 'Проверка и выпуск'
      description: 'Доработанные единицы повторно проверяются по тем же критериям; NCR закрывается только после успешной повторной проверки.'
      icon: tabler:shield-check
    - title: 'Контроль списания'
      description: 'Списанный материал уничтожается с оформлением подписанного акта об уничтожении, поэтому он никогда не может вернуться на склад или на рынок.'
      icon: tabler:trash
      link: https://assets.isupfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Акт о списании и уничтожении (PDF)'
    - title: 'Обратная связь по первопричине'
      description: 'Повторяющиеся дефекты запускают корректирующее действие по ответственному процессу или поставщику: замкнутый цикл, а не бумаготворчество.'
      icon: tabler:refresh
      link: https://assets.isupfactory.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'SOP управления изменениями при доработке (PDF)'
third_party:
