      icon: tabler:test-pipe
faqs:
  tagline: FAQ
  title: Часто задаваемые вопросы о нашей системе качества
  items:
    - q: 'Могу ли я скачать сами отчёты о контроле?'
      a: 'Да. Семь двуязычных комплектов отчётов на этой странице — QIP, IQC, IPQC/FAI, герметичность, FQC, PSI и выпуск отгрузки — это реальные контролируемые документы с удалёнными конфиденциальными полями. Они показывают точную структуру, методы и критерии приёмки, применяемые в каждом заказе.'
    - q: 'Как семь этапов соотносятся с моим проектом?'
      a: 'Для каждого проекта разрабатывается План контроля качества (QIP), который определяет применимые к вашему изделию и рынку этапы, объём контроля на каждом этапе и документы, которые вы получите. Скачайте образец QIP на этой странице, чтобы увидеть структуру.'
    - q: 'Эти образцы документов контроля настоящие?'
      a: 'Да. Образцы повторяют нашу фактическую структуру контролируемого документа: шапка документа, чек-лист контроля, критерии приёмки, метод, результаты, роль инспектора и решение о выпуске. Все идентифицирующие значения заменены демонстрационными (коды DEMO-*), поэтому никакие данные клиентов, макетов, заказов или цен не раскрываются.'
    - q: 'Почему образцы обезличены?'
      a: 'Конфиденциальность клиентов на первом месте. Названия клиентов, макеты, детали заказов, информация о поставщиках и цены защищены по замыслу. Обезличивание позволяет любому потенциальному закупщику проверить структуру наших документов и прослеживаемость, не раскрывая бизнес другого клиента.'
    - q: 'Мы можем получить полные отчёты о контроле по нашему проекту?'
      a: 'Да. Для одобренных проектов мы предоставляем документацию по качеству, применимую к вашему заказу: план контроля качества, отчёты о входном, внутрипроизводственном контроле, герметичности, финальном контроле и упаковке, а также разрешение на выпуск отгрузки — с привязкой к прослеживаемости вашей партии. Конфиденциальные коммерческие данные остаются под NDA согласно договорённости.'
    - q: 'Что содержит документ о контроле на уровне партии?'
      a: 'Каждый документ связывает производственную партию с применимой ревизией спецификации или чертежа, фиксирует каждый объект контроля относительно критериев приёмки с указанием применённого метода и инструмента и завершается указанием роли инспектора, статуса результата и решения о выпуске, подписанного отделом качества.'
evidence_review:
