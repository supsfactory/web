hero:
  tagline: Лаборатория контроля качества
  title: Лаборатория испытаний и подтверждение качества
  subtitle: Независимая лаборатория качества с процессами по ISO 9001 — каждое изделие проходит испытания перед отгрузкой

answer:
  label: 'Прямой ответ'
  text: '100% изделий проходят испытание давлением 18.0 PSI в течение 24 часов с автоматическим браком при падении давления более 0.50 PSI. Партии сырья проверяются по ASTM D751 и ISO 4674, испытания сварных швов на отрыв проводятся каждые 50 единиц, а финальная выборка ведётся по AQL 2.5 в соответствии с ISO 2859.'
  verified: 'Сентябрь 2026'

intro: Vatrad эксплуатирует выделенную лабораторию контроля качества, работающую независимо от производства. Каждая партия сырья и каждая готовая доска SUP проходит через документированные процедуры контроля до выпуска. Наша служба качества подчиняется непосредственно руководству, что обеспечивает объективность решений по качеству.

highlights:
  - value: 100%
    label: Единиц проверено под давлением
    detail: Каждая камера, каждая доска
  - value: 24 h
    label: Длительность испытания на герметичность
    detail: При номинальном давлении 18.0 PSI
  - value: '&lt;5%'
    label: Максимально допустимое падение давления
    detail: За 24-часовой период выдержки
  - value: AQL 2.5
    label: Порог существенных дефектов
    detail: По правилам выборочного контроля ISO 2859

test_procedures:
  - title: Контроль сырьевых материалов
    description: Каждая входящая партия PVC, Hypalon, ткани drop-stitch и фурнитуры испытывается до приёмки. Проверяются разрывное усилие (ASTM D751), сопротивление разрыву (ISO 4674) и устойчивость к УФ-излучению. Несоответствующие материалы помещаются на карантин и возвращаются.
    standards:
      - ASTM D751 (разрыв)
      - ISO 4674 (надрыв)
      - ISO 4892 (УФ)
  - title: Контрольные точки качества в процессе производства
    description: Операторы производства выполняют самоконтроль на каждом этапе. Инспекторы ОКК проводят случайную выборку в течение смены. Испытания сварных швов на отрыв проводятся каждые 50 единиц. Размерный контроль выполняется на каждой 20-й панели.
    standards:
      - ASTM D751 (отрыв)
      - Внутренний чек-лист на 100 пунктов
      - ISO 2859 (выборочный контроль)
  - title: 48-часовое испытание на герметичность
    description: Каждая трубчатая камера накачивается до 18.0 PSI и выдерживается 24 часа. Датчики давления ведут непрерывную запись с компенсацией температуры. Превышение падения давления 0.50 PSI по любой камере запускает автоматический повторный контроль партии.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Испытания на нагрузку и стабильность
    description: Готовые доски испытываются при максимальной номинальной нагрузке на устойчивость, бортовой запас и управляемость. Каждая доска проходит водные испытания до утверждения финального контроля.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Универсальная испытательная машина (разрыв)
    spec: 5 kN, соответствует ASTM D751
  - name: Прибор для измерения падения давления
    spec: Многоканальный, 0–50 psi, с регистрацией данных
  - name: Камера искусственного старения под УФ-излучением
    spec: ISO 4892, 1,000 h циклов
  - name: Толщиномер (цифровой)
    spec: Разрешение 0.01 mm
  - name: Машина для испытания швов на отрыв
    spec: Моторизованная, нагрузка 50 N
  - name: Термошкаф
    spec: От -40 °C до +100 °C
  - name: Ванна для выявления протечек
    spec: 6 m × 2 m, с подсветкой

lab_evidence:
  tagline: Комплекты протоколов испытаний
  title: 'Скачайте реальные протоколы лабораторных испытаний'
  subtitle: 'Те же двуязычные контролируемые документы, которые закрывает наша служба качества: структура, методы, критерии и результаты с удалёнными конфиденциальными полями. Каждый комплект соответствует одному из семи этапов контроля.'
  items:
    - title: 'IQC — отчёты по входному контролю материалов'
      description: 'Проверка ткани, рулонов PVC, клапанов и компонентов относительно утверждённой спецификации.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты IQC (PDF)'
    - title: 'IPQC — отчёты по контролю в процессе и проверке первого изделия'
      description: 'Записи проверки первого изделия и внутрипроизводственного контроля относительно зафиксированной ревизии.'
      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты IPQC (PDF)'
    - title: 'Герметичность — записи по давлению и протечкам'
      description: 'Выявление протечек по швам на 100%, целостность клапанов и подтверждение 24 h выдержки давления.'
      icon: tabler:waves
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты по герметичности (PDF)'
    - title: 'FQC — протоколы испытаний готовой доски'
      description: 'Финальный контроль относительно утверждённого образца: размеры, внешний вид и крепление для плавника.'
      icon: tabler:shield-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты FQC (PDF)'
    - title: 'PSI — отчёты по упаковке и предотгрузочному контролю'
      description: 'Записи о комплектности комплекта, классе штрихкодов, маркировке коробов и ударной безопасности.'
      icon: tabler:package
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты PSI (PDF)'
    - title: 'Досье о выпуске и прослеживаемости'
      description: 'Разрешение на выпуск и прослеживаемость партии, связанная со спецификацией, макетами и спецификацией материалов.'
