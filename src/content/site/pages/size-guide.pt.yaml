how_to_choose:
  title: Como encontrar a medida certa
  cards:
    - title: Pranchas SUP
      description: Escolhe o comprimento com base no teu peso e no uso previsto. As pranchas mais largas (32"+ — 81 cm+) oferecem mais estabilidade. As pranchas mais compridas (11-12 ft) mantêm melhor o rumo nos tours. Os paddlers mais pesados necessitam de pranchas com maior volume.
    - title: SUP Touring
      description: As pranchas mais compridas (11–12 ft) são as mais adequadas ao paddling de distância e aos tours. As pranchas mais largas (32"+ — 81 cm+) oferecem mais estabilidade. Verifica a capacidade de peso para o peso total incluindo o equipamento.
    - title: SUP Allround
      description: Escolhe o comprimento com base no peso do rider e no uso previsto. As pranchas Allround são adequadas para tempo livre, fitness e yoga. As pranchas mais pequenas são mais manobráveis.

