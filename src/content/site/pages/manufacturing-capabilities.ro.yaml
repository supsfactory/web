faq_section:
  tagline: FAQ
  title: Întrebări despre capabilitățile de producție SUP
  questions:
    - q: Ce procese de producție sunt realizate intern?
      a: 'Toate procesele de bază sunt interne: ingineria corpului de apă, prelucrarea miezului drop-stitch, sudura RF, tipărirea, decuparea EVA, asamblarea, testarea și ambalarea. Accesoriile și unele materii prime provin de la furnizori certificați; echiparea finală se face intern, pentru trasabilitate completă.'
    - q: Care este capacitatea dumneavoastră de producție?
      a: 'Peste 120,000 de plăci pe an (aproximativ 10,000 pe lună) pe 4 linii automatizate și 4 ateliere specializate, într-o uzină de 12,500 m² cu peste 350 de lucrători.'
    - q: Ce MOQ se aplică pentru aceste capabilități?
      a: 'Volumul standard este de 90–100+ bucăți pe configurație aprobată (o rolă de țesătură drop-stitch de 150 m); loturile pilot încep de la 20–50 de bucăți pe platforme existente; comenzile doar cu logo încep de la 5–10 bucăți.'
    - q: Ce termene ar trebui să planificăm?
      a: 'Mostre de prototip în 7–12 zile; producție în 25–35 de zile după confirmarea comenzii și a avansului; dezvoltarea formelor personalizate adaugă 15–20 de zile pentru unelte.'
    - q: Cum se traduc capabilitățile în calitate?
      a: 'Fiecare proces alimentează sistemul de calitate în 7 etape: o listă de verificare pentru asamblare în 100 de puncte, menținere la 18.0 PSI pe 24 de ore cu respingere automată la o scădere de peste 0.50 PSI, eșantionare ISO 2859-1 Nivel II și trasabilitate ERP a loturilor pe 10 ani.'

