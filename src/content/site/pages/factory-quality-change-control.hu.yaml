cc_validation:
  tagline: Mérnöki validáció
  title: 'Validációs és elfogadási protokoll – bizonyítékok állítások helyett'
  body: |
    Az olyan elnagyolt elfogadási megfogalmazásokat, mint *„a javított deszkának jónak kell lennie”*, nem fogadjuk el. A szabályozott megfogalmazás a következő:

    > „Az újrafeldolgozott mintának ugyanazokra az alkalmazandó kritériumokra kell megfelelnie a légtömörség, a vizuális kivitelezés minősége, a szelep működése és a projektspecifikus elfogadás tekintetében, mint egy megfelelő deszka, kivéve, ha az ügyfél által jóváhagyott eltérés explicit alternatív kritériumot ír elő.”

    A validációs bizonyítékok számszerűek, és a légtömörségi újrafeldolgozás mérnöki viszonyítási alapja a következőket tartalmazza:

    - **A szivárgás megszüntetése és a nyomástartás.** A kezdeti szivárgást megszüntetjük, tartós buborékok nélkül a szappanos oldattal végzett észlelés során; a deszka 24 órán át tartja a 18.0 PSI standard vizsgálati nyomást, ΔP ≤ 0.2 PSI nettó nyomáscsökkenéssel a hőmérséklet- és páratartalom-korrekció után – ez az újrafeldolgozás validálásának szigorúbb viszonyítási alapja, és különbözik a gyártósor végső elfogadásakor alkalmazott 0.50 PSI automatikus elutasítási küszöbötől.
    - **A szelep működése.** A szelepmag meghúzási nyomatéka megfelel a 15–20 N·m specifikációnak, mikroszivárgás nélkül a tömítésnél magas nyomáson és dinamikus nyomás mellett végzett felfújáskor.
    - **A varrat ragasztása és a tartósság.** A ragasztási éleken nincs leválás, kifehéredés vagy delamináció; a hő- és nedvességi öregítési ciklusok után a ragasztóréteg nem mutat áztatást vagy rideg repedést.
    - **Megjelenés és kivitelezési minőség.** Nincs ragasztócsurgás, nincs az EVA pad sérülése, nincs a deszka deformálódása, és nincs a logó elmozdulása vagy a nyomtatott felület karcolódása.

cc_engineering:
  tagline: A mérnöki végrehajtási mátrix
  title: 'A négy alapvető újrafeldolgozási folyamat számszerű paraméterei'
  subtitle: 'Minden szabályozott újrafeldolgozási folyamatnak vannak meghatározott paraméterei, módszertana és elfogadási kritériumai – ugyanazok az értékek, amelyeket kezelőink követnek, és amelyeket az ügyfelek az auditok során ellenőrizhetnek.'
  headers:
    process: Újrafeldolgozási folyamat
    parameters: 'Szabályozott paraméterek'
    methodology: Vizsgálati módszertan
    acceptance: Elfogadási kritériumok
  rows:
    - process: 'Tűlyukak / mikroszivárgások javítása foltozással'
      parameters: 'Oldószeres tisztítás és 3–5 perc szárítás; aktiválás 60°C ± 5°C meleglevegővel; ≥ 0.4 MPa nyomóhenger'
      methodology: 'Felfújás 18 PSI-re; teljes bemerítés vízbe vagy szappanoldat alkalmazása; 10 perces megfigyelés'
      acceptance: 'Nulla kibocsátott buborék; 180°-os élleválasztás leválás és ragasztócsurgás nélkül'
    - process: 'Él / varrat-szalagok újraragasztása'
      parameters: 'Szigorúan szabályozott kétkomponensű ragasztóarány; 22–28°C környezet, ≤ 65% relatív páratartalom; rögzítés fogóban ≥ 4 óra'
      methodology: 'Túlnyomási próba 22 PSI-en 2 órán át; majd polimerizálás termokamrában 50°C-on 6 órán át, és 2 óra pihentetés szobahőmérsékleten'
      acceptance: 'Nulla leválás, nulla repedés; ΔP ≤ 0.1 PSI nettó nyomáscsökkenés; ragasztóréteg kifehéredés vagy dagadás nélkül'
    - process: 'A szelepalap lazulása / mikroszivárgás'
      parameters: '18–20 N·m nyomaték speciális kulccsal; sík tömítőtömítés, deformálódás nélkül; a menetek tisztaságának megerősítése'
      methodology: 'Felfújás 15 PSI-re; 20 felfújási/leeresztési ciklus; megfigyelés vízbe merítéssel'
      acceptance: 'Nulla buborék a szelepmagnál és a szelepalap kerületén; a ciklusok utáni nyomaték ≥ 16 N·m'
    - process: 'A végső 24 órás nyomástartási próba'
      parameters: '18.0 PSI referencia-felfújás; 1.0 osztályú / ±0.5% digitális nyomásmérő; a környezeti hőmérséklet és páratartalom rögzítve és korrigálva'
      methodology: 'Digitális nyomásrögzítő; 24 órás folyamatos nyomásgörbe'
      acceptance: 'Korrekció után ΔP ≤ 0.20 PSI / 24 h nettó nyomáscsökkenés; a deszka deformálódása vagy kidomborodása nélkül'

