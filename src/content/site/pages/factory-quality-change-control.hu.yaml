faqs:
  tagline: GYIK
  title: 'Gyakori kérdések az újrafeldolgozási változtatáskezelésről'
  items:
    - q: 'A gyár módosíthatja-e az újrafeldolgozási paramétereket anélkül, hogy értesítene minket?'
      a: 'Nem. A jóváhagyott újrafeldolgozási anyagok, a folyamatkörülmények, a szerszámok, a vizsgálati módszerek, az ellenőrzési kritériumok vagy az engedélyezett személyzet bármely javasolt módosításának először át kell esnie a dokumentált változtatáskezelésen. A jóváhagyott specifikációkat, mintákat, anyaglistákat, grafikát vagy elfogadási kritériumokat érintő módosításokhoz az ügyfél írásbeli jóváhagyása szükséges.'
    - q: 'Melyek a magas kockázatú módosítások?'
      a: 'Az újrafeldolgozási anyagok vagy beszállítók, a nyomási és nyomástartási vagy polimerizációs körülmények, a szelepek, élek és varratok újrafeldolgozási módszerei, az ellenőrzési vagy elfogadási kritériumok, valamint a hiba hatókörének szerkezeti zónákra terjedése magas kockázatúnak minősül. Ezek osztályközi elemzést, jóváhagyott validációs tervet és szabályozott pilótabevezetést igényelnek a rutinszerű használat előtt.'
    - q: 'Használható-e korlátlan ideig ideiglenes eltérés?'
      a: 'Nem. Minden ideiglenes eltérésnek meghatározott érvényességi ideje, lotkörű hatókörje, mennyiségi plafonja és validációs igénye van, automatikus lejárattal. A plafon elérése blokkolja a lót, és megakadályozza az átadási címke kinyomtatását a módosítás formális értékeléséig.'
    - q: 'Hogyan bizonyítják, hogy egy módosított módszer nagy mennyiségben alkalmazás előtt működik?'
      a: 'A magas kockázatú módosításokhoz validációs terv szükséges: legalább 5 reprezentatív próbadeszka, amely lefedi a tűréshatárokat, és amelyet 2 független minőségi ellenőr vizsgál számszerű elfogadási kritériumokhoz képest (a szivárgás megszüntetése, a nyomástartás, a szelep működése, a varratok tartóssága, a megjelenés). A validációra vonatkozó jóváhagyás nem az alkalmazásra vonatkozó jóváhagyás.'
    - q: 'Jóvá kell hagynunk minden módosítást?'
      a: 'Nem minden módosítást, de bármely módosítást, amely eltávolítja a terméket az ügyfél által jóváhagyott mintától, műszaki specifikációtól, anyaglistától, grafikától, csomagolástól vagy elfogadási kritériumoktól, csak az ügyfél írásbeli hozzájárulásával vezetjük be. Ennek hiányában a deszkákat az eredeti igény szerint újrafeldolgozzuk, cseréljük vagy elutasítjuk.'
    - q: 'Mi történik a régi dokumentumokkal egy módosítás jóváhagyása után?'
      a: 'A régi munkautasításokat, paraméterlapokat és ellenőrzési űrlapokat fizikailag összegyűjtjük és érvénytelenítjük (egy be, egy ki), ELAVULTnak jelöljük, és a képzés után az új felügyelt revízióval helyettesítjük. A régi és az új verzió soha nem létezik egyidejűleg ugyanazon a munkahelyen.'
    - q: 'Meddig őrizzük a változtatáskezelés nyilvántartásait?'
      a: 'A lezárási nyilvántartásokat – a validációs bizonyítékokat, a dokumentációs revíziókat, a képzési nyilvántartásokat és a hatékonyságelemzéseket – a nyilvántartás-őrzési politikánk szerint őrizzük (legalább 3 év a lezárási nyilvántartások esetén), így minden módosítás auditok és követhetőségi elemzések számára követhető marad.'

