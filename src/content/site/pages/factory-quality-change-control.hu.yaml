cc_intro:
  tagline: 'Hatókör és politika'
  title: Az irányítás alapelvei
  body: |
    **Dokumentum:** QMS-SOP-QC-CC-001 – *Az újrafeldolgozási folyamat paramétereinek változtatáskezelési szabványa* (Rev 2.0, hivatalos verzió). **Gyártó:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Szabványos hivatkozás:** ISO 9001:2015 Minőségirányítási rendszerek.

    - **Nincs szabályozatlan módosítás.** Az újrafeldolgozási paraméterek módosításának át kell esnie a formális változtatáskezelésen. A helyszíni kezelők, a műszakvezetők vagy egy önálló osztály soha nem módosíthat jóváhagyott újrafeldolgozási paramétert szóbeli megállapodással vagy az újrafeldolgozási lapra kézzel írt jegyzetekkel.
    - **Teljes lefedettség.** A szabályozott hatókör magában foglalja a légtömörséget, a szelepüléseket, az élszalagokat, a varratok ragasztását, a meleglevegős polimerizálást és a nyomástartási próbát – minden olyan paramétert, amely befolyásolhatja a tömörséget, a szerkezeti tartósságot, a megjelenést, az ügyféli elfogadást vagy a követhetőséget.
    - **Az ügyfél által szabott alsó korlát.** Bármely módosítást, amely eltávolítja a terméket az ügyfél által jóváhagyott mintától, műszaki specifikációtól, anyaglistától, grafikától, csomagolási igénytől vagy elfogadási kritériumoktól, csak az ügyfél írásbeli hozzájárulásával vezetjük be. Ennek hiányában a deszkát az eredeti igény szerint újrafeldolgozzuk, cseréljük vagy elutasítjuk – a gyár soha nem „lazít” rajta saját belátása szerint.

cc_scope:
  tagline: Kockázatbesorolás
  title: 'A módosítás hatóköre és kockázatbesorolása'
  subtitle: 'Az alábbi elemek bármelyike formális változtatáskezelést indít – soha nem kezeljük pusztán az újrafeldolgozási lapra való bejegyzéssel. A kockázati szint határozza meg, ki hagyja jóvá, és mennyi validálás szükséges.'
  headers:
    category: Módosítási kategória
    examples: 'Tipikus példák'
    risk: Kockázat
    requirements: 'Ellenőrzési és jóváhagyási igények'
  rows:
    - category: 'Újrafeldolgozási anyagok'
      examples: 'Ragasztó, tisztítószer, foltanyag, szelep tömítése, alapozó vagy beszállítóváltás'
      risk: 'Magas'
      requirements: 'Osztályközi elemzés + az anyagok kompatibilitásának és a nyomástartásnak a validálása + az ügyfél aláírása, ahol szükséges'
    - category: 'Folyamatkörülmények'
      examples: 'Felület-előkészítés, a meleglevegős polimerizálás hőmérséklete és páratartalma, a meghúzási nyomás, a tartási idő'
      risk: 'Magas'
      requirements: 'A Mérnökség és a Minőség jóváhagyása, a meghatározott hőmérséklet- és páratartalom-tartomány validálásával'
    - category: 'Szerszámok és mérőeszközök'
      examples: 'Nyomásmérők, szivárgásérzékelők, meleglevegős pisztolyok, szelepszerszámok, vizsgálatszoftver'
      risk: 'Közepes/Magas'
      requirements: 'A kalibrálás érvényességének ellenőrzése + az eszköz alkalmaságának értékelése'
    - category: 'A hiba hatóköre'
      examples: 'Az újrafeldolgozási terület kiterjesztése; felületi mikroszivárgás, amely az él, a varrat vagy a szelepülés kritikus zónáira terjed'
      risk: 'Magas'
      requirements: 'Teherviselő szerkezeti felületek: kötelező leállítás és újraértékelés'
    - category: 'Vizsgálati módszerek'
      examples: 'A szivárgás észlelésének módszere, a vizsgálati nyomás (18.0 PSI), a tartási idő (24h)'
      risk: 'Magas'
      requirements: 'A Minőség jóváhagyása + az ügyféllel való technikai megállapodás megerősítése'
    - category: 'Dokumentáció és jogosultság'
      examples: 'Az újrafeldolgozási utasítás, az ellenőrzési űrlapok, az NCR intézkedési logikája, a kezelők képesítése'
      risk: 'Közepes'
      requirements: 'A felügyelt dokumentum revíziója (Rev A → Rev B) + képzési nyilvántartások'

cc_containment:
  tagline: 'A haladéktali leállítás szabálya'
  title: A hatások azonnali korlátozása, amikor a helyzet súlyossá válik
  body: |
    > „A meglévő újrafeldolgozási módszert elemzés alá kell vonni, és a továbbiakban nem szabad alkalmazni az érintett termékeken, amíg a módosítás értékelése és engedélyezése meg nem történt, kivéve, ha a Minőség és a Mérnökség dokumentált ideiglenes eltérést hagy jóvá."

    A jelenlegi újrafeldolgozási módszert azonnal fel kell függeszteni, amikor az újrafeldolgozás utáni újraellenőrzés továbbra is elbukik, amikor a hiba teherviselő szerkezeti zónákat érint (szelepalap, élek, varratok, a csőorr és a far nyomászónái), amikor egy helyettesítő anyag még nincs validálva, illetve amikor a jelenlegi paraméterek ütköznek az ügyfél által jóváhagyott specifikációval.

    Az ideiglenes eltérések soha nem válnak tartós gyakorlattá: mindegyiknek meghatározott érvényességi ideje van, alkalmazandó lotkörű hatókörrel, mennyiségi plafonnal, validációs igényekkel és automatikus lejárati mechanizmussal. A szóbeli kivétel nem kivétel – ha nincs lejárati határidővel együtt dokumentálva, nem létezik.

cc_flow:
  tagline: A 9 lépéses zárt kör szabványa
  title: A változtatási kérelmtől a lezárásig és az őrzésig
  subtitle: 'Egyetlen dokumentált kör minden paramétermódosításhoz: javaslat, szelektálás, értékelés, jóváhagyás, validálás, pilóta, ellenőrzés, felülvizsgálat, lezárás.'
  steps:
    - step: '01'
      title: 'Változtatási kérelem (ECR)'
      desc: 'Bármely osztály benyújthat kérelmet, de azt a Mérnökség, a Minőség vagy a Gyártás vezetése támogatja. Az ECR megválaszolja, hogy miért javasolt a módosítás, mit módosítunk, mi érintett, és hogyan ellenőrizzük – a változtatásellenőrzési számmal, a kapcsolódó NCR/CAPA-val, a jelenlegi és a javasolt paraméterrel, az érintett lotokkal, valamint az ideiglenes/tartós besorolással együtt.'
    - step: '02'
      title: 'Előzetes szelektálás és hatáskorlátozás'
      desc: 'A kérelmet először az azonnali hatáskorlátozás szempontjából elemezzük: most le kell állítani a jelenlegi módszert? Ha ideiglenes eltérés engedélyezett, azt az érvényességi időablak, a lotkörű hatókör, a mennyiségi plafon és az automatikus lejárat korlátozza.'
    - step: '03'
      title: 'Hatás- és kockázatértékelés'
      desc: 'A Mérnökség, a Minőség, a Gyártás, a Beszerzés/Ellátási lánc és a Projekt értékeli a termék teljesítményét, az elfogadási kritériumokat, az anyagok kompatibilitását, a megjelenést, a folyamatképességet, az eszközöket és a mérőmódszereket, a személyzet képesítését, az ügyfél igényeit, valamint a megfelelőség és a követhetőség hatókörét.'
    - step: '04'
      title: 'Közös elemzés és jóváhagyás'
      desc: 'A jóváhagyás a rögzített jogosultsági mátrixot követi – nem azt, hogy „ki szól hangosabban”. A magas kockázatú módosítások osztályközi jóváhagyást és szükség esetén az ügyfél írásbeli jóváhagyását igénylik, még minden próba előtt.'
    - step: '05'
      title: Validációs terv
      desc: 'A magas kockázatú módosításokhoz a rutinszerű alkalmazás előtt jóváhagyott validációs terv szükséges: reprezentatív próbadeszkák, a jelenlegi és a javasolt módszer összehasonlítása, vizsgálati módszerek, elfogadási kritériumok, ellenőrzési lépések, felelősök és ütemezés.'
    - step: '06'
      title: 'Pilóta és szabályozott bevezetés'
      desc: 'Az új dokumentumok kiállításra kerülnek, a lejárt verziókat bevonjuk és ELAVULTnak jelöljük; az új anyagokat és mérőeszközöket ellenőrizzük és kalibráljuk; a kezelőket betanítjuk és felkészítjük; az első lot szigorú felügyelet mellett fut, egyértelmű állapotjelöléssel.'
    - step: '07'
      title: 'Újraellenőrzés és hatékonyságelemzés'
      desc: 'Az első újrafeldolgozás sikerességi arányát, az újraellenőrzés átvételi arányát, a visszatérési arányt és a megjelenés elfogadását mérjük és elemezzük, mielőtt a módosítást hatékonynak tekinthetjük – egyetlen javított deszkát soha nem tekintünk folyamatvalidációnak.'
    - step: '08'
      title: 'Dokumentumfelülvizsgálat és képzés'
      desc: 'A munkautasításokat, az ellenőrzési űrlapokat, az NCR intézkedési lehetőségeket, a paraméterlapokat és a képzési anyagokat frissítjük az új revízióra, rögzített gyakorlati képzéssel és a kezelők képesítésével.'
    - step: '09'
      title: 'Lezárás és nyilvántartás-őrzés'
      desc: 'A módosítás csak a validálási bizonyítékok, a dokumentációs frissítések, a képzési nyilvántartások és a bevezetés hatékonyságának elemzése és jóváhagyása után zárható le. Ha a kívánt eredményt nem érjük el, a módosítást felülvizsgáljuk, kiterjesztjük, felfüggesztjük vagy visszavonjuk.'

