faq_section:
  tagline: FAQ
  title: 'Veelgestelde vragen over SUP-ontwikkeling'
  questions:
    - q: Kunnen jullie een SUP-product uit een idee ontwikkelen?
      a: 'Ja. We begeleiden het hele traject van productspecificatie en engineering, via prototypeontwikkeling, maatwerk en serieproductie op basis van jouw eisen. Een schets, een referentieplank of zelfs de specificatie van een concurrent is genoeg voor de engineeringcheck.'
    - q: Hoeveel kost SUP-productontwikkeling?
      a: 'De specificatiecheck en de engineeringbeoordeling zijn gratis en komen binnen één werkdag terug. Prototypebemonstering wordt per project geoffreerd na het bevriezen van de specificatie; productieprijzen hangen af van materialen, hoeveelheid en of eigen gereedschap nodig is.'
    - q: Hoe lang duurt SUP-productontwikkeling?
      a: 'Het eerste monster vertrekt 7–12 dagen na de specificatiegoedkeuring, met 3–7 dagen per revisieronde. De productie loopt 25–35 dagen na de bestelling en aanbetaling. Een eigen malvoegt 15–20 dagen van tevoren toe en zeetransport telt voor de meeste bestemmingen 4–6 weken op.'
    - q: Wat komt er eerst — monster of productie?
      a: 'Altijd het monster. Een fysiek prototype wordt gemaakt, gemeten en goedgekeurd tegen de specificatie voordat een productierun start. We produceren geen aantallen uit niet-goedgekeurde ontwerpen.'
    - q: Ondertekenen jullie een NDA voor productontwikkeling?
      a: 'Ja. Er wordt een NDA ondertekend vóór elke bestandsuitwisseling en jouw ontwerpen, artwork en gereedschap blijven van jou tijdens de hele ontwikkeling en productie.'
    - q: Kunnen jullie mijn SUP-ontwerp en -specificatie beschermen?
      a: 'Ontwerpen, specificaties en productconcepten van klanten worden vertrouwelijk behandeld tijdens ontwikkeling en productie. Jouw gereedschapsbestanden worden nooit hergebruikt, doorverkocht of aan andere klanten getoond.'

