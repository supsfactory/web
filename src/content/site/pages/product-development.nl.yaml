hero:
  tagline: Productontwikkeling
  title: 'Aangepaste SUP-productontwikkeling, van idee tot container'
  subtitle: 'Zes fasen zetten jouw idee om in productieklaar SUP-planken — specificatie, engineering, prototyping, testen, gereedschapsbouw en serieproductie, allemaal in één fabriek met een verantwoordelijk kwaliteitssysteem.'

answer:
  label: 'Kort antwoord'
  text: 'SUP-productontwikkeling bij iSupfactory doorloopt zes fasen — productspecificatie, structurele engineering, prototypebemonstering, testen & validatie, bouw van maatgereedschap en serieproductie. Het eerste fysieke monster vertrekt 7–12 dagen na de specificatiegoedkeuring; de productie loopt 25–35 dagen na de bevestigde bestelling en aanbetaling; een nieuw malvormstempel voegt 15–20 dagen toe.'
  verified: 'September 2026'

stages:
  title: 'De zes fasen van SUP-productontwikkeling'
  subtitle: 'Elke fase heeft een duidelijk resultaat — zodat je altijd weet waar je project staat — en wat er daarna gebeurt.'
  items:
    - title: '1. Idee & productspecificatie'
      description: 'Plankgeometrie, gewichtsbereik van de gebruiker, volume, constructiedoelstellingen en accessoirepakket. Een referentieplank, een schets of de specificatie van een concurrent is genoeg om te starten.'
      icon: 'tabler:bulb'
    - title: '2. Engineering & 3D-ontwerp'
      description: 'Structurele engineering, drop-stitch dikte en selectie van de PVC-klasse, plus een produceerbaarheidscheck en een offerte — binnen één werkdag.'
      icon: 'tabler:blueprint'
    - title: '3. Prototypebemonstering'
      description: 'Je eerste fysieke monster vertrekt binnen 7–12 dagen, gedocumenteerd met een goedkeuringsformulier voor constructie, printkleuren en drukproefresultaten.'
      icon: 'tabler:tools'
    - title: '4. Testen & validatie'
      description: 'Drukbehoud, lassterkte en maatcontroles ten opzichte van het goedgekeurde monster, met CE- en REACH-documentatie voor jouw doelmarkten.'
      icon: 'tabler:test-pipe'
    - title: '5. Gereedschap & serieproductie'
      description: 'Bouw van maatmatrijzen in 15–20 dagen, indien nodig; de productie loopt 25–35 dagen met inline QC-controlepunten en partijtraceerbaarheid.'
      icon: 'tabler:settings'
    - title: '6. Levering & schaalbaarheid'
      description: 'Logistiek FOB, CIF of DDP naar meer dan 50 landen — daarna herdrukorders op jouw vastgestelde lijn met stabiele levertijden en gearchiveerde goedgekeurde artwork.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Waarom in-fabriek ontwikkeling een intermediair project verslaat'
  subtitle: 'Ontwikkeling rechtstreeks in de productiefaciliteit verandert wat je in elke fase krijgt.'
  items:
    - title: Geen overdrachtsmomenten in het ontwerp
      description: 'Het engineering- en tekenteam werkt op dezelfde vloer als de laslijn — een ontwerpaanpassing komt in dezelfde week in de productie, niet na een commerciële heen-en-weer.'
      icon: 'tabler:handshake'
    - title: Monsters die overeenkomen met de productie
      description: 'De bemonsteringsrun en de productierun delen dezelfde machines, materialen en QC-stations — het goedgekeurde monster is dus exact wat je op containerschaal ontvangt.'
      icon: 'tabler:stack-2'
    - title: Engineering die niets verkoopt
      description: 'Beslissingen worden genomen op basis van streefkosten, gewicht en levensduur — niet op winstmarges, want dit is een fabriek en productie is de enige bron van omzet.'
      icon: 'tabler:scale'
    - title: Vertrouwelijkheid als blijvende toezegging
      description: 'Een NDA wordt ondertekend vóór elke bestandsuitwisseling en jouw artwork, gereedschap en specificatiebestanden blijven van jou — nooit hergebruikt, doorverkocht of aan andere klanten getoond.'
      icon: 'tabler:lock'

