vision:
  tagline: Vizyonumuz
  title: Su Sporlarının Geleceğini Şekillendirmek
  body: Vatrad; kesintisiz inovasyon, tavizsiz kalite ve güvenlik ile sürdürülebilirliğe kararlı bir bağlılık yoluyla şişirilebilir bot ve SUP sektöründe lider olmayı hedefler — nihayetinde dünya genelindeki su sporları meraklılarının deneyimlerini zenginleştirir. Vatrad Ar-Ge Merkezi, tutku ile inovasyonun buluştuğu ve su sporları sektörü için yeni standartlar koyan yerdir.

labs_section:
  tagline: Laboratuvarlar
  title: Laboratuvarlarımız
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: PVC Kumaş Laboratuvarı
      description: Denizcilik ortamlarında uzun vadeli güvenilirliği sağlamak için çekme dayanımı, UV direnci, aşınma ve düşük sıcaklıkta esneklik üzerine PVC ve Hypalon boru kumaşlarının sürekli araştırması ve testi.
      href: /tr/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Gövde Mühendisliği Stüdyosu
      description: HDPE, alüminyum ve cam elyaf gövdeler için CAD destekli tasarım ve sonlu eleman analizi. İlk prototip üretilmeden önce her gövde, gerilme dağılımı ve darbe dayanımı açısından dijital olarak simüle edilir.
      href: /tr/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: RF Kaynak Merkezi
      description: Hassas sıcaklık ve basınç kontrolüne sahip, şişirilebilir tekneler için denizcilik sektörü standartlarını karşılayan yüksek dayanımlı, hava sızdırmaz dikişler üreten özel radyofrekans kaynak tesisi.
      href: /tr/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hidrodinamik Test Tankı
      description: Çeşitli yük ve deniz koşullarında gövde formunu, planlama performansını, kararlılığı ve yakıt verimliliğini optimize etmek için kendi test tankımızda ölçekli model testleri.
      href: /tr/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototip Atölyesi
      description: Yeni modellerin üretildiği, donatıldığı ve denizde denendiği tam ölçekli prototip ve rigging tesisi. Her prototip, üretim onayından önce en az 20 saatlik su içi test programına tabi tutulur.
      href: /tr/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Kalite ve İnceleme Laboratuvarı
      description: Atölyeden çıkan her botun yayımlanmış spesifikasyonlarımızı karşılamasını sağlamak üzere çekme testi, hava tutma döngüleri, dikiş soyma testleri ve malzeme sertifikası yürüten özel kalite güvenlik laboratuvarı.
      href: /tr/randdcenter/quality-inspection-lab
