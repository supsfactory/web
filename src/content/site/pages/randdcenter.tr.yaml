hero:
  tagline: Ar-Ge Merkezi
  title: Ar-Ge Merkezi
  subtitle: İlerlemeye Odaklanmak

intro:
  - Vatrad Araştırma ve Geliştirme (Ar-Ge) Merkezi, su sporları ekipmanında devrim yaratma misyonumuzun itici gücüdür. Şişirilebilir ayakta duran kürek tahtalarında (SUP) ve botlarda kesintisiz yenilikler yoluyla küresel su sporları meraklılarına daha güvenli, daha konforlu ve daha keyifli ürünler sunuyoruz. Mühendislerden, tasarımcılardan ve tutkulu su sporları uzmanlarından oluşan özel ekibimiz sektörün geleceğini şekillendiriyor, kalite, performans ve sürdürülebilirlik için sürekli çıtayı yükseltiyor.
  - Ar-Ge tesisimiz malzeme bilimcilerini, deniz mimarlarını ve üretim mühendislerini çatı altında bir araya getiriyor. Kumaş formülasyonundan gövde simülasyonuna, kaynak süreci geliştirmeden tam ölçekli deniz denemelerine kadar ürün geliştirmenin her aşaması veriyle yürütülür ve testlerle doğrulanır.

mission:
  tagline: Misyonumuz
  title: Su Sporlarının Geleceğini İnovasyonla Şekillendiriyoruz
  pillars:
    - icon: lightning
      title: Teknolojik İlerleme
      desc: Üstün ürün performansı ve ömrü için yeni malzemelerin, tasarımların ve üretim yöntemlerinin öncülüğünü üstlenmek.
    - icon: design
      title: Kullanıcı Odaklı Tasarım
      desc: Ergonomik ve sezgisel ürün tasarımıyla kullanıcı ihtiyaçlarını derinlemesine anlamak ve beklentilerin aşmak.
    - icon: globe
      title: Sürdürülebilir Uygulamalar
      desc: Çevre dostu malzemeleri ve süreçleri kullanarak çevresel ayak izimizi en aza indirmek.
    - icon: shield
      title: Tavizsiz Güvenlik
      desc: Titiz testler ve sertifikasyonla en yüksek güvenlik standartlarını sağlamak.

pillars:
  - title: Teknolojik İlerleme
    desc: Üstün ürün performansı ve ömrü sunmak için yeni malzemelerin, tasarımların ve üretim süreçlerinin öncülüğünü üstlenmek.
    icon: tech
  - title: İleri Düzey Malzemeler
    desc: Ürün özelliklerini geliştirmek için son derece gelişmiş PVC, Hypalon, kompozitler ve sürdürülebilir alternatifler üzerinde araştırmak.
    icon: materials
  - title: Sürdürülebilirlik
    desc: 'Temel Bir Taahhüt: Sürdürülebilir üretim ve geri dönüştürülebilir malzemelerle çevre korumaya adanmışız.'
    icon: sustainability

capabilities:
  tagline: Yetenekler
  title: Ar-Ge Yetenekleri
  subtitle: Ham malzeme araştırmasından nihai sertifikasyona kadar ürün geliştirme üzerinde uçtan uca kontrol sağlayan dört temel disiplin.
  groups:
    - title: Malzeme Bilimi ve Kumaş Teknolojisi
      items:
        - PVC ve Hypalon formülasyon analizi ve optimizasyonu
        - UV stabilizasyonu, alev geciktiricilik ve antimikrobiyal katkı geliştirme
        - Çok katmanlı kumaş laminasyonu ve yapışma mühendisliği
        - Hızlandırılmış yaşlandırma testleri (UV, termal, nem, tuz spreyi)
    - title: Gövde Mühendisliği ve Hidrodinamik
      items:
        - Parametrik 3B gövde tasarımı ve CFD optimizasyonu
        - Yapısal ve darbe yükleri için sonlu eleman analizi
        - Ölçekli model çekme tankı testleri ve performans doğrulaması
        - Özel görev profilleri için özel gövde geliştirme
    - title: Kaynak ve Birleştirme Teknolojisi
      items:
        - RF dielektrik kaynak süreci geliştirme ve optimizasyonu
        - Sıcak hava, sıcak kama ve ultrasonik kaynak yöntemleri
        - Yapıştırıcı bağlama ve dikiş bandı uygunluk değerlendirmesi
        - Kaynak dayanımı modellemesi ve ömür tahmini
    - title: Test, Sertifikasyon ve Uyumluluk
      items:
        - Kalite yönetimi ve CE uyumluluk testleri
        - Bağımsız üçüncü taraf test ve sertifikasyon desteği
        - Satın alma uygunluk süreci için özel test protokolü geliştirme
        - Hizmet sırasındaki kusur analizi ve kök neden araştırması

