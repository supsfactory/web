rd_services:
  tagline: I&D personalizada
  title: Serviços de I&D para parceiros
  services:
    - title: Desenvolvimento de materiais personalizado
      desc: Desenvolvemos formulações de tecido, stacks de laminado e sistemas adesivos personalizados, à medida do teu ambiente de utilização e dos teus objetivos de desempenho.
    - title: Engenharia de produto OEM / ODM
      desc: Desenvolvemos formulações de tecido, stacks de laminado e sistemas adesivos personalizados, à medida do teu ambiente de utilização e dos teus objetivos de desempenho.
