hero:
  tagline: Centro de I&D
  title: Centro de I & D
  subtitle: 'Foco no progresso'

intro:
  - O centro de investigação e desenvolvimento (I&D) da Vatrad é a força motriz da nossa missão de revolucionar o equipamento de desportos aquáticos. Através de uma inovação incansável nas pranchas stand-up paddle (SUP) insufláveis e nos gomões, tornamos possíveis produtos mais seguros, mais confortáveis e mais bonitos para os entusiastas de desportos aquáticos em todo o mundo. A nossa equipa dedicada de engenheiros, designers e apaixonados experientes do setor molda o futuro da indústria, elevando constantemente o nível de qualidade, desempenho e sustentabilidade.
  - A nossa estrutura de I&D reúne sob o mesmo teto cientistas de materiais, arquitetos navais e engenheiros de produção. Da formulação dos tecidos e a simulação do casco ao desenvolvimento dos processos de soldadura até às provas em mar em grande escala, cada fase do desenvolvimento de produto é orientada por dados e validada por ensaios.

