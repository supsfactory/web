capabilities:
  tagline: Capacidades
  title: Capacidades de I&D
  subtitle: Quatro disciplinas-chave dão-nos o controlo end-to-end sobre o desenvolvimento de produto — da investigação das matérias-primas à certificação final.
  groups:
    - title: Ciência dos materiais & tecnologia dos tecidos
      items:
        - Análise e otimização das formulações PVC e Hypalon
        - Desenvolvimento de estabilização UV, retardadores de chama e aditivos antimicrobianos
        - Laminação de tecidos multicamada e engenharia das ligações adesivas
        - Provas de envelhecimento acelerado (UV, térmico, humidade, nevoeiro salino)
    - title: Engenharia do casco & hidrodinâmica
      items:
        - Design paramétrico 3D do casco e otimização CFD
        - Análise de elementos finitos para cargas estruturais e de impacto
        - Provas em tanque de reboque com modelos e validação do desempenho
        - Desenvolvimento personalizado do casco para perfis de utilização especiais
    - title: Tecnologia de soldadura & junção
      items:
        - Desenvolvimento e otimização do processo de soldadura dielétrica HF
        - Processos de soldadura a ar quente, cunha térmica e ultrassons
        - Qualificação das ligações adesivas e dos fitas de costura
        - Modelação da resistência da soldadura e previsão da duração
    - title: Ensaios, certificação & conformidade
      items:
        - Gestão da qualidade e ensaios de conformidade CE
        - Apoio para ensaios e certificações de terceiros independentes
        - Desenvolvimento de protocolos de prova personalizados para a qualificação de aprovisionamento
        - Análise de falhas em campo e investigação de causas

