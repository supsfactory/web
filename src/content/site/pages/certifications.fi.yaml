content_certifications:
  tagline: Sertifioinnit ja standardit
  title: 'Sertifioitu laatu, globaalisti tunnustettu'
  subtitle: 'Sertifioinnit ovat yhtä arvokkaita kuin niiden kattama sisältö. Alla on sertifioinnin laajuus, todistuksen haltija sekä ohje dokumenttien varmistamiseen tai pyytämiseen projektillesi.'
  items:
    - title: 'CE-merkintä'
      description: 'CE-vaatimustenmukaisuusasiakirjat ovat saatavilla soveltuviin EU-markkina-konfiguraatioihin direktiivin 2013/53/EU (vapaa-ajan vesillikkeet) mukaan; laajuus vahvistetaan projekti kohtaisesti. Todistusnumerot ja testiraportit pyydettäessä.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Laadunhallintajärjestelmä on sertifioitu ISO 9001:2015 -standardin mukaan kattaen puhallettavien vesillikkeiden ja merivarusteiden suunnittelun, valmistuksen ja jakelun. Sertifioinnin laajuus ja auditointiraportti pyydettäessä.'
      icon: tabler:clipboard-check
    - title: 'BSCI-yhteiskunnallinen vaatimustenmukaisuus'
      description: 'BSCI (Business Social Compliance Initiative) auditoidaan kattaen työolot ja tehtään vaatimustenmukaisuuden. Auditointiraportti pyydettäessä.'
      icon: tabler:heart-handshake
    - title: 'REACH-materiaalivaatimustenmukaisuus'
      description: 'Materiaalit täyttävät EU:n REACH-asetuksen kemikaaliturvallisuutta koskevat vaatimukset. Materiaalideklaratiot toimitetaan tuotantoasiakirjojen mukana jokaisen lähetyksen osalta.'
      icon: tabler:flask
    - title: 'RoHS-vaatimustenmukaisuus'
      description: 'Rajoitettujen vaarallisten aineiden vaatimustenmukaisuus on dokumentoitu RoHS:n mukaan sovellettavissa oleville komponenteille ja materiaaleille.'
