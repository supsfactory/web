traceability:
  tagline: Erätason jäljitettävyys
  title: 'Neljä kysymystä, joihin jokainen erä vastaa'
  subtitle: 'Laatukirjaukset pidetään tuotantoerittäin ja linkitetään sovellettavaan tuotemäärittelyyn, kuvioihin, BOM:iin ja pakkausvaatimuksiin. Tämä tukee tutkimusta ja ohjattua toimenpidettä, jos laatuongelma havaitaan. Ostajan auditoinnin aikana laadun tiimimme vastaa lattialla näihin neljään kysymykseen — jokainen vastaus viittaa ohjattuun kirjaukseen.'
  items:
    - title: 'Mitä valmistettiin?'
      description: 'Tuote, malli, konfiguraatio ja tarkistus on sidottu tilausnumeroon ja hyväksytyn määrittelyn tarkistukseen.'
      icon: '1'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Näytä jäljitettävyyspaketti (PDF)'
    - title: 'Mitä materiaaleja käytettiin?'
      description: 'Jokainen erään menevä materiaalierä kirjataan toimittajineen, todistuksineen ja IQC-päätöksineen.'
      icon: '2'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Näytä jäljitettävyyspaketti (PDF)'
    - title: 'Kuka tarkasti ja milloin?'
      description: 'Jokaisessa kirjauksessa on tarkastajan rooli, päivämäärä, käytetyt välineet ja tulos — eikä nimettömiä allekirjoituksia.'
      icon: '3'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Näytä jäljitettävyyspaketti (PDF)'
    - title: 'Miten erä luovutettiin?'
      description: 'Laatu myöntää luvan vasta, kun kaikki portit on suljettu; päätös dokumentoidaan kirjaukseen.'
      icon: '4'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Näytä jäljitettävyyspaketti (PDF)'
non_conformance:
  tagline: Vaatimustenmukaisuuspoikkeavien tuotteiden ohjaus
  title: 'Vian löytyessä: rajaus, päätös, dokumentointi'
  subtitle: 'Tuotteet tai komponentit, jotka eivät täytä määriteltyjä hyväksymiskriteerejä, tunnistetaan ja siirretään ohjattuun säilytykseen. Korjaus tai vaihto on sallittu vain sovellettavan laatumenettelyn kautta, minkä jälkeen suoritetaan uusintatarkastus ennen luvan myöntämistä.'
  items:
    - title: 'Tunnistus ja eristäminen'
      description: 'Epäonnistuneet yksiköt merkitään punaisella siirretään eristysasemalle — ei jatkokäsittelyä eikä pakkausta ennen päätöstä.'
      icon: tabler:alert-triangle
    - title: 'Päätös NCR:n mukaisesti'
      description: 'Laatu laatii vaatimustenmukaisuusraportin ja ohjaa yksikön korjaukseen, uusintatarkastukseen, hylkäämiseen tai romuttamiseen päätösmatriisin mukaan.'
      icon: tabler:git-branch
      link: /fi/factory/non-conforming-control
      link_label: 'Vaatimustenmukaisuuspoikkeavien tuotteiden ohjauksen standardi'
    - title: 'Varmistus ja luovutus'
      description: 'Korjatut yksiköt tarkastetaan uudelleen samoja kriteereitä vasten; NCR suljetaan vasta uudelleenvarmennuksen menestyessä.'
      icon: tabler:shield-check
    - title: 'Romun ohjaus'
      description: 'Romutettu materiaali tuhotaan allekirjoitetulla romu-todistuksella, jotta se ei koskaan pääse takaisin varastoon tai markkinoille.'
      icon: tabler:trash
      link: https://assets.isupfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Roma- ja tuhoamistodistus (PDF)'
    - title: 'Perussyyn palautus'
      description: 'Toistuvat viat käynnistävät korjaavan toimenpiteen vastaavan prosessin tai toimittajan kanssa — suljettu silmukka, ei paperityötä.'
      icon: tabler:refresh
      link: https://assets.isupfactory.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'Korjauksen muutoksenhallinnan SOP (PDF)'
third_party:
