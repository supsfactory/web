  title: 'Tarkastajasi on tervetullut tehtaalle'
  subtitle: 'Ostajan nimeämät ja riippumattomat kolmannen osapuolen tarkastukset (SGS, TUV, Bureau Veritas, tulli-edustajat) voidaan sopia ennen tuotannon vapauttamista. Tarkastuksen laajuus, näytteistystaso, hyväksymiskriteerit, ajoitus ja raportointivaatimukset on vahvistettava ennen tuotannon aloittamista. Soveltuvin osin koordinoimme pääsyn tuotanto-, lopputarkastus- ja pakkausvaiheisiin sovitun tarkastussuunnitelman mukaisesti.'
