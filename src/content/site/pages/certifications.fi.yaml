hero:
  tagline: Räätälöityjen projektien laadunvalvonta
  title: 'Räätälöityjen puhallettavien SUP-projektien laadunvalvonta'
  subtitle: 'Laatu todennetaan hyväksyttyä näytettä, teknistä määrittelyä, kuvioita, materiaaliluetteloa ja kunkin projektin pakkausvaatimuksia vasten — ei yleistä väitettä vasten. Saapuvista materiaaleista lähetysluvan myöntämiseen asti tarkastusprosessimme on rakennettu tuotteen vaatimustenmukaisuuden todentamiseksi määritellyissä tuotantovaiheissa. Taustalla toimii QINGDAO VATRAD GROUP, Vatradin 12,500 m² puhallettavien SUP-lautojen tehdas.'
