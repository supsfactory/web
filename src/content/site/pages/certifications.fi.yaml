      link_label: 'Lataa dokumentaatiopaketti (PDF)'
    - title: 'OEM-projektin toteutettavuus- ja laatuopas'
      description: 'Miten projekti etenee tiedustelusta hyväksyttyyn kultaiseen näytteeseen — suunnittelu- ja laatuvaiheet ennen sarjatuotantoa.'
      icon: tabler:route
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_OEM_PROJECT_FEASIBILITY_AND_QUALITY_GUIDE.pdf
