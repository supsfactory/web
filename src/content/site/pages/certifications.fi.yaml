faqs:
  tagline: FAQ
  title: Usein kysytyt kysymykset laadunhallintajärjestelmästämme
  items:
    - q: 'Voinko ladata todelliset tarkastusraportit?'
      a: 'Kyllä. Tämän sivun seitsemä kaksikielistä raporttipaketit — QIP, IQC, IPQC/FAI, ilmatiiviys, FQC, PSI ja lähetyslupa — ovat todellisia ohjattuja kirjauksia, joista luottamukselliset kentät on poistettu. Ne näyttävät tarkat rakenteet, menetelmät ja hyväksymiskriteerit, joita jokaisella tilauksella käytetään.'
    - q: 'Miten seitsemän porttia kohdistuvat projektiini?'
      a: 'Jokainen projekti saa laaduntarkastussuunnitelman (QIP), joka määrittelee tuotteeseen ja markkinaasi soveltuvat portit, kunkin portin tarkastuksen laajuuden ja kirjaukset, jotka saat. Lataa tämän sivun QIP-näyte nähdäksesi rakenteen.'
    - q: 'Ovatko nämä tarkastuskirjausnäytteet todellisia?'
      a: 'Kyllä. Näytteet noudattelevat todellista ohjattua kirjausrakennettamme — asiakirjan otsikko, tarkastuslista, hyväksymiskriteerit, menetelmä, tulokset, tarkastajan rooli ja luvun päätös. Kaikki tunnistetiedot on korvattu esittelyarvoilla (DEMO-*-koodit), joten mitään asiakas-, kuvio-, tilaus- tai hintatietoa ei paljastu.'
    - q: 'Miksi näytteet on anonymisoitu?'
      a: 'Ostajan luottamuksellisuus on etusijalla. Asiakkaiden nimet, kuviot, tilaustiedot, toimittajatiedot ja hinnat on suojattu suunnittelulla. Anonymisointi mahdollistaa, että kuka tahansa potentiaalinen ostaja voi todentaa kirjausrakenteemme ja jäljitettävyytemme paljastamatta toisen asiakkaan liiketoimintaa.'
    - q: 'Saammeko täydet tarkastusraportit omalle projektillemme?'
      a: 'Kyllä. Hyväksytyille projekteille toimitamme tilaukseesi soveltuvat laatuasiakirjat — laaduntarkastussuunnitelma, saapuvien materiaalien, valmistuksen aikaisen, ilmatiiviyden, loppu- ja pakkaustarkastuksen raportit sekä lähetyslupa — linkitettynä erän jäljitettävyyteen. Herkät kaupalliset tiedot pysyvät sopimuksen mukaisesti NDA:n puitteissa.'
    - q: 'Mitä erätason tarkastuskirjaus sisältää?'
      a: 'Jokainen kirjaus linkittää tuotantoerän sovellettavaan määrittely- tai piirustustarkistukseen, kirjaa jokaisen tarkastuskohteen hyväksymiskriteereitä vasten käytetyllä menetelmällä ja välineellä ja päättyy tarkastajan rooliin, tulostilaan sekä laadun allekirjoittamaan luvun päätökseen.'
evidence_review:
  tagline: 'Näyttö ja todentaminen'
  title: 'TEKNISET ARVOT TODENNETTU'
  body: 'Kaikki tämän sivun valmistusväitteet on varmennettu valmistustekniikan tiimimme toimesta Laixin, Qingdaon laitoksella. Todistukset, laaduntarkastuskirjaukset, paine- ja rakennetestiraportit sekä erien jäljitettävyyskirjaukset ovat pyydettäessä saatavilla. Tekniset arvot on viimeksi todennettu syyskuussa 2026.'

cta:
  title: 'Tarvitsetko laatuvaatimuksia SUP-projektillesi?'
  subtitle: 'Kerro tuoteluokkasi, kohdemarkkinasi, arvioitu määrä sekä mahdolliset tarkastus-, dokumentaatio- tai pakkausvaatimukset. Käymme läpi soveltuvat projektisyötteet ja neuvomme seuraavan vaiheen näytekehitystä tai tuotannon suunnittelua varten. NDA:stä voidaan keskustella ennen kuin jaat ei-julkisia määrittelyjä, kuvioita tai laatuvaatimuksia.'
