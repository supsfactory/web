faq_section:
  tagline: FAQ
  title: Pytania o możliwości produkcyjne desek SUP
  questions:
    - q: Które procesy produkcyjne realizujecie we własnym zakładzie?
      a: 'Wszystkie procesy rdzeniowe realizujemy we własnym zakładzie: inżynieria kadłuba, obróbka rdzenia drop-stitch, zgrzewanie HF, druk, wycinanie EVA, montaż, badania i pakowanie. Akcesoria i część surowców pochodzą od certyfikowanych dostawców; kompletowanie końcowe odbywa się u nas, co zapewnia pełną identyfikowalność.'
    - q: Jaka jest wasza zdolność produkcyjna?
      a: '120,000+ desek rocznie (około 10,000/miesiąc) na 4 zautomatyzowanych liniach i w 4 wyspecjalizowanych oddziałach zakładu o powierzchni 12,500 m² z ponad 350 pracownikami.'
    - q: Jakie MOQ obowiązuje przy tych możliwościach?
      a: 'Standardowa produkcja seryjna to 90–100+ szt. na zatwierdzoną konfigurację (jedna rolka tkaniny drop-stitch 150 m); serie pilotażowe startują od 20–50 szt. na gotowych platformach; zamówienia z samym logo od 5–10 szt.'
    - q: Jakie czasy realizacji powinniśmy zakładać?
      a: 'Próbki prototypowe w 7–12 dni; produkcja 25–35 dni po potwierdzeniu zamówienia i zaliczce; opracowanie formy na zamówienie dodaje 15–20 dni na narzędzia.'
    - q: Jak przekładają się możliwości na jakość?
      a: 'Każdy proces zasila 7-etapowy system jakości: listę kontrolną montażu w 100 punktach, próbę ciśnieniową 18.0 PSI przez 24 godziny z automatycznym odrzuceniem przy spadku powyżej 0.50 PSI, próbkowanie wg ISO 2859-1 poziom II oraz 10-letnią identyfikowalność partii w ERP.'

