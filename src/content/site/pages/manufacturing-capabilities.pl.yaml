hero:
  tagline: Możliwości produkcyjne
  title: 'Możliwości produkcji desek SUP'
  subtitle: 'Każdy proces — inżynieria kadłuba, obróbka rdzenia drop-stitch, zgrzewanie HF, druk, narzędzia form, montaż, badania i pakowanie — realizujemy we własnym zakładzie o powierzchni 12,500 m² w Qingdao, więc jeden odpowiedzialny zespół prowadzi Twój projekt od pierwszego rysunku aż po załadowany kontener.'

answer:
  label: 'Wprost'
  text: 'Produkcja desek SUP odbywa się w całości w naszym zakładzie w Qingdao: projekt kadłuba i inżynieria wymiarowa z dokładnością CNC 0.1 mm; obróbka materiału drop-stitch i zgrzewanie HF na 4 zautomatyzowanych liniach; druk grafiki; wycinanie nakładek EVA; własne narzędzia form (+15–20 dni przy nowych kształtach); montaż według listy kontrolnej w 100 punktach; oraz próba ciśnieniowa 18.0 PSI przez 24 godziny z automatycznym odrzuceniem przy spadku powyżej 0.50 PSI. Roczna zdolność to 120,000+ desek (ok. 10,000/miesiąc) z 4 wyspecjalizowanych oddziałów i 350+ pracowników, wysyłanych do ponad 50 krajów pod Twoją marką.'
  verified: 'Wrzesień 2026'

