faqs:
  tagline: FAQ
  title: Veelgestelde vragen over ons kwaliteitssysteem
  items:
    - q: 'Kan ik de echte inspectierapporten downloaden?'
      a: 'Ja. De zeven tweetalige rapporterdossiers op deze pagina — QIP, IQC, IPQC/FAI, luchtdichtheid, FQC, PSI en vrijgave voor verzending — zijn echte gecontroleerde registraties met de gereserveerde velden verwijderd. Ze tonen de exacte structuur, methoden en acceptatiecriteria die in elke order worden gebruikt.'
    - q: 'Hoe worden de zeven punten op mijn project toegepast?'
      a: 'Elk project ontvangt een Kwaliteitsinspectieplan (QIP) dat de punten definieert die van toepassing zijn op jouw product en markt, de inspectieomvang bij elk punt en de registraties die je ontvangt. Download het QIP-voorbeeld op deze pagina om de structuur te zien.'
    - q: 'Zijn deze inspectievoorbeelden echt?'
      a: 'Ja. De voorbeelden volgen onze daadwerkelijke gecontroleerde registratiestructuur — documentkop, inspectiechecklist, acceptatiecriteria, methode, resultaten, rol van de inspecteur en vrijgavebesluit. Alle identificerende waarden zijn vervangen door demonstratieve waarden (DEMO-*-codes), zodat er geen klantgegevens, graphics, orders of prijzen worden onthuld.'
    - q: 'Waarom zijn de voorbeelden geanonimiseerd?'
      a: 'De vertrouwelijkheid van kopers heeft prioriteit. Klantnamen, graphics, ordergegevens, leveranciersinformatie en prijzen zijn by design beschermd. Door anonimisering kan elke potentiële koper onze registratiestructuur en traceerbaarheid verifiëren zonder de commerciële gegevens van een andere klant te onthullen.'
    - q: 'Kunnen we de volledige inspectierapporten voor ons project ontvangen?'
      a: 'Ja. Voor goedgekeurde projecten delen we de kwaliteitsdocumentatie die op jouw order van toepassing is — kwaliteitsinspectieplan, rapporten van inkomende goederen, proces, luchtdichtheid, eindcontrole en verpakking, plus de vrijgave-autorisatie voor verzending — gekoppeld aan de lot-traceerbaarheid. Gevoelige commerciële gegevens blijven zoals overeengekomen onder NDA.'
    - q: 'Wat bevat een aan het lot gekoppelde inspectieregistratie?'
      a: 'Elke registratie koppelt het productielot aan de toepasselijke specificatie- of tekeningrevisie, registreert elk controlepunt tegen de acceptatiecriteria met methode en gebruikt instrument, en sluit af met de rol van de inspecteur, de resultaatstatus en het door Quality ondertekende vrijgavebesluit.'
evidence_review:
  tagline: 'Bewijzen en verificatie'
  title: 'GEVERIFIEERDE SPECIFICATIES'
  body: 'Alle productieverklaringen op deze pagina worden geverifieerd door ons Manufacturing Engineering Team op de locatie in Laixi, Qingdao. Certificaten, QC-inspectieregistraties, druk- en structurele testrapporten en lot-traceerbaarheidsregistraties zijn op aanvraag beschikbaar. Specificaties voor het laatst geverifieerd in september 2026.'

