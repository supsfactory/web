hero:
  tagline: Kwaliteitscontrole voor gepersonaliseerde projecten
  title: 'Kwaliteitscontrole voor gepersonaliseerde opblaasbare SUP-projecten'
  subtitle: 'De kwaliteit wordt geverifieerd tegen het goedgekeurde monster, de technische specificatie, de graphics, de stuklijst en de verpakkingsvereisten van elk project — niet tegen een algemene bewering. Van inkomende controle tot vrijgave voor verzending is ons inspectieproces gestructureerd om productconformiteit te verifiëren in gedefinieerde productiefasen. Beheerd door QINGDAO VATRAD GROUP, de opblaasbare SUP-fabriek van 12.500 m² achter Vatrad.'
