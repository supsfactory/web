intro: |
  <p><strong>Vatrad</strong> je námořní výrobní divize společnosti <strong>Qingdao Vatrad Group Co., Ltd.</strong> se sídlem v zóně hospodářského rozvoje Laixi, Qingdao, Shandong, Čína. Založená roku 2012 začínala jako specializovaná dílna na plavidla, která se věnovala námořnímu řemeslu, a postupně se vyvinula v certifikovanou továrnu obsluhující klienty OEM a ODM ve více než 50 zemích.</p>
  <p>iSupfactory je B2B divize individuálního vývoje na bázi továrny Vatrad. Každý projekt iSupfactory — od prvního vzorku nebo malé série s co-brandingem až po kompletní produktovou řadu pod vlastní značkou — se vyrábí ve stejném zařízení, stejnými týmy a podle téhož systému kvality, který je zde popsán.</p>
  <p>Továrna zabírá 12 500 m² a zahrnuje samostatné dílny pro řezání PVC, skládání jádra drop-stitch, vysokofrekvenční svařování, montáž desek a zkušební prostor pro zkoušky nepropustnosti, udržení tlaku a pevnosti švů. Výrobní kapacita přesahuje 120 000 nafukovacích jednotek ročně a provozovna pracuje pod systémem řízení kvality ISO 9001 s CE, BSCI, REACH a schválením USCG pro exportované výrobky.</p>
  <p>Více než 350 zkušených pracovníků a 14+ vývojářů se zabývá dvěma oblastmi, které jsou pro značky SUP zásadní: konstrukčním vývojem (návrh trupu, výběr materiálů, prototypování) a výrobou (použití grafiky, montáž, kontrola, exportní balení). Vlastní vývojové centrum s laboratoří PVC textilií a zkušební nádrží zhotovuje zakázkové formy a ověřuje konstrukci před zahájením sériové výroby.</p>
