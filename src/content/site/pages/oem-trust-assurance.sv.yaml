hero:
  tagline: 'Produktion du kan verifiera'
  title: 'OEM-förtroende & fabriksgarantier'
  subtitle: 'Varje påstående på den här webbplatsen är verifierbart: officiell företagsregistrering, en fysisk fabrik på 12 500 m² som du kan besöka eller revisionera, riktiga ingenjörer under NDA, nedladdningsbara QMS-dokument och testdata registrerad per serienummer. Utformad och förvaltad av Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Kort svar'
  text: 'Förtroende är inget löfte: det är dokumentation. Vi är ett registrerat kinesiskt tillverkningsföretag (Qingdao Vatrad Group Co., Ltd.) med en fysisk fabrik på 12 500 m² i Qingdao, 350+ medarbetare och en årskapacitet på 120 000+ brädor. Du kan verifiera registreringen, revisionera fabriken, ta del av QMS-SOP:erna, ladda ner exempel på kvalitetsregistreringar, boka inspektion av tredje part (SGS, TÜV, BV eller Intertek) och få ett undertecknat NDA inom 4 arbets timmar. Varje bräda testas i 24 timmar vid 18.0 PSI med automatiskt underkännande över 0.50 PSI tryckfall, och varje parti behåller 10 års ERP-spårbarhet. Om ett påstående inte kan dokumenteras gör vi det inte.'
  verified: 'September 2026'

