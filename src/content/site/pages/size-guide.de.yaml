how_to_choose:
  title: So finden Sie die richtige Größe
  cards:
    - title: SUP-Boards
      description: Wählen Sie die Länge nach Ihrem Gewicht und dem vorgesehenen Einsatz. Breitere Boards (32"+) bieten mehr Stabilität. Längere Boards (11-12 ft) liegen beim Touren besser in der Spur. Schwerere Paddler benötigen Boards mit höherem Volumen.
    - title: Touring-SUPs
      description: Längere Boards (11–12 ft) eignen sich am besten für Distanz- und Touren-Paddling. Breitere Boards (32"+) bieten mehr Stabilität. Prüfen Sie die Gewichtskapazität für das Gesamtgewicht inklusive Ausrüstung.
    - title: Allround-SUPs
      description: Wählen Sie die Länge nach Fahrergewicht und vorgesehenem Einsatz. Allround-Boards eignen sich für Freizeit, Fitness und Yoga. Kleinere Boards sind wendiger.

