rework_intro:
  tagline: Styring av omtillverkning
  title: Kontrollert håndtering av lufttetthetsavvik og omtillverkning
  body: |
    Hos QINGDAO VATRAD GROUP.,LTD. defineres omtillverkning strengt som gjenopprettelse av en ikke-samsvarende enhet til full samsvar med den opprinnelige tekniske spesifikasjonen — ikke som en rask løsning. Hvert brett med et lufttetthetsavvik sperres på kontrollert vis og kobles til en avvikelsesrapport (NCR) før eventuell videre bearbeiding; lekkasjens kilde lokaliseres og registreres med den godkjente diagnostiske metoden.

    Omtillverkning kan bare skje hvis feilen er innenfor det godkjente omtillverkningsomfanget, og en autorisert metode er tilgjengelig. Omtillverkningsinstruksjonen identifiserer produktet, partiet, feilens plassering, det godkjente materialet, metoden, de nødvendige forholdene og omfanget av den gjentatte verifiseringen. Etter den nødvendige herde- eller stabiliseringsfasen reverifiseres brettet mot de samme gjeldende akseptkriteriene som et samsvarende brett — omtillverkning senker aldri akseptnivået. Feiler den gjentatte verifiseringen, kreves et nytt konstruksjons- og kvalitetsvedtak; gjentatt omtillverkning er ikke tillatt uten dokumentert frigjøring.

rework_decision:
  tagline: Interaktivt flyt
  title: Beslutningsflyt for omtillverkning — klikk på hver node
  subtitle: Følg hvordan et lufttetthetsavvik håndteres fra deteksjon til frigjøring eller destruksjon. Klikk på en node for å utfolde kontrollkravene i det trinnet.
  nodes:
    - id: detect
      type: start
      label: Lekkasje oppdaget
      detail: 'Under inspeksjonen konorteres et lufttetthetsavvik — en feil i trykkholdingen, en synlig lekkasje eller en relatert feil i luftsystemet.'
    - id: hold
      type: step
      label: Stopp linjen · HOLD-etikett · NCR
      detail: 'Bearbeidingen stoppes. Brett-ID, produktkode, parti, arbeidsstasjon, dato og inspektør registreres; en HOLD-/karanteneetikett settes på, og et NCR åpnes mot den gjeldende spesifikasjonsrevisjonen.'
    - id: locate
      type: step
      label: Lokaliser lekkasjens kilde
      detail: 'Brettet pumpes opp til det prosjektgodkjente diagnostiske trykket, og kilden lokaliseres med en godkjent metode — trykkholding, kalibrert bobletest, akustisk eller lekkasjedeteksjonsapparat.'
    - id: classify
      type: step
      label: Klassifiser feilen (A–G)'
      detail: 'Feilen klassifiseres mot frigjøringsmatrisen: A ventilgrensesnitt, B ventilsetesøm, C overflatisk stinghull, D lokal kantsøm, E utbredt kant skade, F gjentakende lekkasje, G strukturell skade.'
    - id: authorize
      type: decision
      label: Omtillverkning autorisert?
      yes: rework
      no: escalate
      detail: 'QC bekrefter feilkategorien, og konstruksjon kontrollerer om brettet kan føres tilbake til originalspesifikasjonen. Autorisasjonen dokumenterer metodekortet, materialet, forholdene og omfanget av den gjentatte verifiseringen — eller fører til utskifting, kassering, destruksjon eller en avvikstillatelse til kunden.'
    - id: rework
      type: step
      label: Kontrollert omtillverkning
      detail: 'Utføres bare innenfor den godkjente feilgrensen med det godkjente metodekortet, materialpartiet og de godkjente verktøyene — aldri ved å endre mål, konstruksjon, grafikk, tilbehør eller emballasjekrav.'
    - id: cure
      type: step
      label: Herding og stabilisering
      detail: 'Brettet forblir i HOLD under herde- og stabiliseringsfasen som defineres av den godkjente material- og prosessinstruksjonen, og får deretter en visuell og bearbeidingskontroll før omtillverkningen.'
    - id: reinspect
      type: decision
      label: Gjentatt verifisering godkjent?
      yes: release
      no: escalate
      detail: 'Brettet pumpes opp til det prosjektgodkjente reverifiseringstrykket, og den opprinnelige feilen sammen med alle potensielt påvirkede egenskaper verifiseres på nytt — lekkasjepunkt, ventil, kant, sømmer, tungt belastede soner, tilbehør og utseende. Omtillverkning senker aldri akseptnivået.'
    - id: release
      type: release
      label: Kvalitetsfrigjøring
      detail: 'Kvalitet kontrollerer det lukkede NCR-et, omtillverkningsregistret og resultatet av den gjentatte verifiseringen og autoriserer frigjøringen. Ingen omtillverket brett pakkes eller sendes uten autorisert kvalitetsfrigjøring.'
    - id: escalate
      type: escalate
      label: Eskalering — bytt ut / ødelegg / avvikstillatelse
      detail: 'Ingen gjentatt omtillverkning uten dokumentert frigjøring. Brettet byttes ut, kasseres, ødelegges, eller kunden tilbys en skriftlig avvikstillatelse når originalspesifikasjonen ikke kan gjenopprettes.'

defect_matrix:
  tagline: Feilklassifisering
  title: Klassifisering av lufttetthetsfeil og frigjøringsmatrise
  subtitle: 'Ikke alle lekkasjer omtillverkes — hver feil klassifiseres, og vedtaket frigjøres på riktig nivå, fra QC-inspektøren til fabrikksjefen.'
  headers:
    category: Feilkategori
    area: Typisk område
    eligibility: Egnethet for omtillverkning
    approval: Nødvendig frigjøring
  rows:
    - category: 'Klasse A — Ventilgrensesnitt'
      area: 'Ventilkjerne, korklukking, forsegling, pumpegrensesnitt'
      eligibility: 'Standard omtillverkning autorisert'
      approval: 'QC-inspektør'
    - category: 'Klasse B — Ventilbasens søm'
      area: 'Mikrolekkasje langs ventilens kant'
      eligibility: 'Omtillverkning vurderes etter det godkjente metodekortet'
      approval: 'QC + Konstruksjon'
    - category: 'Klasse C — Overflatisk stinghull'
      area: 'Lokalt mikrostinghull på en ubelastet flate'
      eligibility: 'Bare autorisert dersom det oppfyller kundens spesifikasjoner'
      approval: 'QC + Konstruksjon'
    - category: 'Klasse D — Lokal kantsøm'
      area: 'Lokal lekkasje i overlappen på kantbåndet'
      eligibility: 'Høy risiko; krever et strengt konstruksjonsvedtak'
      approval: 'Konstruksjon + QA-sjef'
    - category: 'Klasse E — Utbredt kantskade'
      area: 'Kontinuerlig sømfeil i tungt belastede soner'
      eligibility: 'Standard omtillverkning ikke autorisert — utskifting eller rotorsaksanalyse'
      approval: 'QA-sjef + avvikstillatelse fra kunden'
    - category: 'Klasse F — Gjentakende lekkasje'
      area: 'Lekkasje som ikke kan lokaliseres eller gjentas ved ny prøve'
      eligibility: 'Ingen gjentatt omtillverkning; utskifting, destruksjon eller teknisk rotorsaksanalyse'
      approval: 'Senior QA / Konstruksjon'
    - category: 'Klasse G — Strukturell skade'
      area: 'Materialskade, delaminering, deformering av brettet'
      eligibility: 'Frigjøring for omtillverkning ikke autorisert — utskifting, destruksjon eller skriftlig avvikstillatelse fra kunden'
      approval: 'Kvalitetssjef + kundens frigjøring'

rework_flow:
  tagline: Lukket syklus i sju faser
  title: Kontrollert omtillverkningsflyt — fra deteksjon til frigjøring eller destruksjon
  subtitle: 'Hver lufttetthetsreparasjon følger den samme kontrollerte syklusen: oppdag, sett i karantene, diagnostiser, autoriser, omtillverk, verifiser på nytt, frigjør.'
  steps:
    - step: '01'
      title: Deteksjon, linjestopp og karantene
      desc: 'Bearbeidingen av det berørte brettet stoppes umiddelbart. Brett-ID, produktkode, parti, arbeidsstasjon, dato og inspektør registreres, en HOLD-/karanteneetikett settes på, og et NCR åpnes mot den gjeldende spesifikasjonsrevisjonen.'
    - step: '02'
      title: Systematisk lekkasjediagnostikk
      desc: 'Brettet pumpes opp til det prosjektgodkjente diagnostiske trykket, og lekkasjens kilde lokaliseres med en godkjent metode — trykkholding, kalibrert bobletest, akustisk eller lekkasjedeteksjonsapparat. Den mistenkte punkten merkes uten å skade brettet.'
    - step: '03'
      title: Konstruksjonsvedtak og autorisasjon
      desc: 'QC bekrefter feilkategorien, og konstruksjon kontrollerer om brettet kan føres tilbake til originalspesifikasjonen. En omtillverkningsautorisasjon med henvisning til NCR dokumenterer den godkjente metoden, materialet, forholdene og omfanget av den gjentatte verifiseringen — eller foreskriver utskifting, kassering, destruksjon eller avvikstillatelse til kunden.'
    - step: '04'
      title: Kontrollert utførelse av omtillverkningen
      desc: 'Omtillverkningen utføres bare innenfor den godkjente feilgrensen med det godkjente metodekortet, materialpartiet og de godkjente verktøyene. Brettets mål, konstruksjon, grafikk, tilbehørskonfigurasjon og emballasjekrav endres aldri.'
    - step: '05'
      title: Herding, stabilisering og forkontroll
      desc: 'Det omtillverkede brettet forblir i HOLD under herde- og stabiliseringsfasen som defineres av den godkjente material- og prosessinstruksjonen, og får en visuell og bearbeidingskontroll før den gjentatte verifiseringen.'
    - step: '06'
      title: Gjentatt verifisering og prøvetaking
      desc: 'Brettet pumpes opp til det prosjektgodkjente reverifiseringstrykket, og den opprinnelige feilen sammen med alle potensielt påvirkede egenskaper verifiseres på nytt: lekkasjepunktet og omgivelsene, ventilen, kanten, sømmene, de tungt belastede sonene, tilbehøret og utseendet. Omtillverkning senker aldri akseptnivået.'
    - step: '07'
      title: QA-frigjøring eller sluttvedtak
      desc: 'Kvalitet kontrollerer det lukkede NCR-et, omtillverkningsregistret og resultatet av den gjentatte verifiseringen og autoriserer deretter frigjøringen — eller eskalerer til utskifting, kassering, destruksjon eller avvikstillatelse til kunden. Ingen omtillverket brett pakkes eller sendes uten autorisert kvalitetsfrigjøring.'

quality_safeguards:
  tagline: Kvalitetssikringer
  title: Feilforebyggende regler som beskytter merket ditt
  subtitle: 'Strenge kontroller som hindrer ukontrollerte reparasjonssykluser — én dokumentert omtillverkning per feil, alarmgrenser per parti, kalibrerte måleinstrumenter og kontrollerte testforhold.'
  features:
    - icon: 1
      icon_bg: blue
      title: Én omtillverkning per feil
      desc: 'En enkelt punkt kan omtillverkes én gang under en autorisert instruksjon. Feiler den gjentatte verifiseringen, eskaleres brettet til utskifting, kassering, destruksjon eller avvikstillatelse til kunden — gjentatt omtillverkning uten dokumentert frigjøring er ikke tillatt.'
    - icon: 2
      icon_bg: green
      title: Partyalarm og linjestopp
      desc: 'Når avviket i et produksjonsparti overstiger terskelen som konstruksjonen har fastsatt, stoppes linjen, og konstruksjonen undersøker årsaken — materialparti, prosessforhold og registre — før produksjonen gjenopptas.'
    - icon: 3
      icon_bg: purple
      title: Kalibrerte måleinstrumenter
      desc: 'Trykkinstrumentene, de digitale manometrene og tidtakerne for lufttetthetstestene verifiseres og kalibreres av eksterne laboratorier innen gyldighetstiden; kalibreringsstatus er synlig i inspeksjonsområdet.'
    - icon: 4
      icon_bg: orange
      title: Kontrollerte testforhold
      desc: 'Lufttetthets- og herdeområdene oppbevares i kontrollert miljø slik at resultatene ikke påvirkes av temperatursvingninger mellom dag og natt.'

rework_boundaries:
  tagline: Omfang og grenser
  title: Hva dette systemet ikke dekker
  body: |
    Omtillverkningskontrollsystemet anvendes på ferdige eller under bearbeiding pågående oppblåsbare SUP-brett der luftlekkasje, feil i trykkholdingen eller relaterte feil i luftsystemet oppdages før frigjøring før levering. Det autoriserer ingen endringer i den godkjente konstruksjonen, materialet, grafikken, produktkonfigurasjonen eller kundekravene og dekker ikke:

    - Produkter som allerede er sendt, eller som befinner seg i kundenes systemer.
    - Strukturell skade eller deformering av brettet som ikke er vurdert av konstruksjonen.
    - Utbredde kant- eller sømfeil, skader på kjernematerialet eller feil som kan true sikkerheten.
    - Prosjekter der omtillverkning ikke er tillatt: kundengodkjente prøver, sertifiserings- eller testenheter.
    - Prosjekter med kundens egne prosesser, spesielle materialer eller særskilte reparasjonskrav.
    - Gjentakende lekkasjer som ikke kan lokaliseres, eller brett som gjentas etter omtillverkning.

    Ethvert avvik fra kundens spesifikasjoner krever en dokumentert teknisk verifisering og, der dette gjelder, kundens skriftlige frigjøring. Brett som ikke kan føres tilbake til sin originalspesifikasjon, frigjøres bare under en uttrykkelig avvikstillatelse fra kunden — aldri av produksjonen alene.

method_cards:
  tagline: Metodekortsystem
  title: Indeks over kontrollerte omtillverkningsmetodekort
  subtitle: 'Den generelle instruksjonen styrer prosessen; metodekortene styrer utførelsen. Omtillverkningsinstruksjonen (WI-QC-AT-001) viser til metodekortene MC-RW-01 til MC-RW-06, samt MC-RW-00 for den bindende destruksjonen og kasseringen.'
  headers:
    code: Metodekort
    defect: Feilklasse
    scope: Anvendelsesområde
    controls: Viktigste konstruksjonskontroller
    approval: Signaturmyndighet
  rows:
    - code: MC-RW-01
      defect: Klasse A (ventilgrensesnitt)
      scope: 'Vedlikehold av ventilkjernen, rengjøring av forseglingen og remontasje'
      controls: 'Kalibrert momentnøkkel, ren forseglingsflate, ingen skade på ventilgjengene'
      approval: 'QC-inspektør'
    - code: MC-RW-02
      defect: Klasse B (ventilkrets)
      scope: 'Forsegling av ventilens bunnplate og kontrollert tiltrekking'
      controls: 'Kontrollert overflatebehandling, godkjent limmateriale, sirkulært trykkverktøy'
      approval: 'QC + Konstruksjon'
    - code: MC-RW-03
      defect: Klasse C (overflatisk mikrolekkasje)
      scope: 'Forsegling av ikke-strukturelle stinghull'
      controls: 'Godkjent tokomponentlim, ingen utslag på grafikk eller EVA'
      approval: 'QC + Konstruksjon'
    - code: MC-RW-04
      defect: Klasse D (lokal kantsøm)
      scope: 'Omliming av lokale overlappssømmer i kanten'
      controls: 'Temperaturkontrollert varmeaktivering, trykkvalg, anti-krøllverktøy'
      approval: 'Konstruksjon + QA-sjef'
    - code: MC-RW-05
      defect: Klasse B/C (tilbehørskant)
      scope: 'Reparasjon av finneboks og forsegling av tilbehørens monteringsbase'
      controls: 'Overflateprimer for vedheft, formstøpt klemblokk, definert holdetid'
      approval: 'QC + Konstruksjon'
    - code: MC-RW-06
      defect: Klasse D (baug-/hekksøm)
      scope: 'Tiltak på tungt belastede bøyde sømmer'
      controls: 'Godkjent limmateriale med høy skjærholdfasthet, forlenget herdetid før ny prøve'
      approval: 'Sjefingeniør'
    - code: MC-RW-00
      defect: Klasse E/F/G (kritisk / brudd)
      scope: 'Bindende destruksjon og fysisk ødeleggelse'
      controls: 'Fysisk kapping for å hindre videre omsetning, destruksjonsprotokoll, tverrfunksjonell rotorsaksanalyse'
      approval: 'Fabrikkdirektør'

inspector_friendly:
  tagline: Tredjepartsinspeksjon
  title: Inspektørvennlig protokoll
  body: |
    Vi tilbyr et eget inspeksjonsområde med kalibrerte trykkinstrumenter, standardiserte lysbord for verifisering av sømmer og grafikk og utfylte inspeksjonsbriefinger, slik at eksterne organisasjoner (SGS, BV, Intertek, QIMA) effektivt kan utføre inspeksjonen før levering — det sparer inspeksjonskostnadene dine.

    Hver briefing oppsummerer de gjeldende dokumentrevisjonene, referansen til det godkjente prøveeksemplaret, de kritiske kvalitetsrelevante kontrollene, den avtalte prøvenivåen, funksjonstestene samt emballasje- og strekkodekravene for PO-en. Spesifiserte antall, kvalitet, emballasje og vesentlige sikkerhetsaspekter verifiseres mot de godkjente prosjektreferansene — intet hastig dokumentsøk på stedet.

