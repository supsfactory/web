answer:
  label: 'Tydelig svar'
  text: 'QINGDAO VATRAD GROUP.,LTD. kontrollerer kvaliteten på oppblåsbare SUP-brett via et verifiseringssystem i fire faser: inngående varekontroll (IQC), kvalitetskontroll under prosessen (IPQC), sluttkontroll av brettet og oppumpingsstest (FQC) samt avsendelseskontroll av emballasje og levering (OQC). Hver bestilling verifiseres mot det godkjente prøveeksemplaret, den tekniske spesifikasjonen, grafikkprøven, BOM og emballasjestandardene — inkludert lufttetthetskontroll, visuelle og målekontroller, bekreftelse av tilbehør og sporbarhet per parti. Enheter som ikke oppfyller akseptkriteriene, sperres eller settes i karantene på kontrollert vis, omtillverkes bare etter godkjente instruksjoner og reverifiseres før den autoriserte frigjøringen.'
  verified: 'September 2026'

intro: 'Kvalitetssystemet vårt er bygget for OEM/ODM-prosjekter: inspeksjonskriteriene defineres, dokumenteres og følges opp av produksjons- og kvalitetsteamet per bestilling, fra varens inngang til emballasjen. Slik forblir kvalitetsforventningen i tråd mellom fabrikk og merket ditt, fra det første prøveeksemplaret til fulle containerleveranser.'

scope_note:
  tagline: Omfang
  title: Prosjektspesifikke inspeksjonskriterier
  body: |
    Kvalitetsspesifikasjoner kan variere avhengig av brettets konstruksjon (f.eks. ett/to lag, drop-stitch-stoff, limt kant), det tiltenkte bruksområdet, regelverket i målmarkedet og de kundengodkjente parameterne. Den endelige frigjøringen bygger strengt på de dokumenterte inspeksjonskriteriene som er avtalt for bestillingen.

stages:
  tagline: Kvalitetsramme
  title: Verifiseringssystemet vårt i fire faser
  subtitle: En komplett QC-syklus fra råvarens inngang til frigjøring før levering.
  steps:
    - title: '1. Inngående varekontroll (IQC)'
      desc: 'Kjernematerialet og de innkjøpte komponentene verifiseres mot de godkjente spesifikasjonene og referanseprøvene før de tillates på produksjonslinjen. Drop-stitch-materiale og PVC kontrolleres for materialidentifisering, leverandørparti, vekt/tetthet, tykkelse, fargeoverensstemmelse med de godkjente prøvene og overflatefeil. EVA-gripeputer kontrolleres for mønster, farge, tykkelse, skjærnøyaktighet og limkompatibilitet. Ventiler og koblinger går gjennom funksjons-, gjenge-, tetningsintegritets- og koblingstester. Tilbehør og emballasje (pumper, årer, finner, leaser, vesker, kartonger) sammenlignes for antall, farge, merking, strekkodenøyaktighet og grafikkversjon mot den godkjente BOM-en.'
    - title: '2. Kvalitetskontroll under prosessen (IPQC)'
      desc: 'De kritiske produksjonsfasene inspiseres for å finne avvik før brettene når stasjonene lenger ned i flyten. Kapping og trykk verifiseres for panelmål, grafikkplassering, speilvendt orientering og kantenhet mot de godkjente tekniske tegningene. Brettmontering og liming av kanten kontrolleres for skrogsymmetri, kontinuitet i sømoverlappen og fravær av hulrommer eller luftbobler langs de tungt belastede sonene. Festing av ventiler og tilbehør, grafikken og merkingen verifiseres for plassering, orientering, limdekning, logoens konturer og grafikkversjon.'
    - title: '3. Sluttkontroll av brett og oppumpingsstest (FQC)'
      desc: 'De ferdige brettene gjennomgår bindende fysiske og strukturelle tester før frigjøring til emballasje. Brettene pumpes opp og holdes ved det prosjektgodkjente testtrykket for å verifisere strukturell stivhet og trykkstabilitet. Lufttetthetskontrollene dekker ventilhuset, kantsømmene, baug- og hekksømmene og spenningssømmene med kalibrerte lekkasjedeteksjonsmetoder (trykktapsovervåking eller bobletest). Den estetiske kontrollen og målekontrollen verifiserer mål, rockerprofil og justeringen av EVA-puten (toleranse ±2 mm) under standardbelysning.'
    - title: '4. Emballasje og avsendelseskontroll (OQC)'
      desc: 'Den komplette kontrollen før levering sikrer en nøyaktig SKU-konfigurasjon og leveransemerking uten avvik. Kontrollen av settets fullstendighet sammenligner brett, finne, leash, åre, pumpe, veske, reparasjonssett og brukerhåndbok mot bestillingens BOM. Emballasje- og strekkodekontrollene verifiserer merkingen på kartongen, SKU-etikettene, strekkodens lesbarhet, brukerhåndbokens språk og kartongens strukturelle integritet. Bestillingen frigjøres først etter den endelige emballasjekontrollen, signert av autorisert kvalitetspersonell.'

inspection_points:
  tagline: Inspeksjonspunkter
  title: Viktigste inspeksjonskontrollpunkter
  subtitle: Hvert kontrollpunkt utføres mot dokumenterte, per bestilling avtalte akseptkriterier.
  features:
    - icon: A
      icon_bg: blue
      title: Lufttetthetskontroll
      desc: 'De ferdige brettene pumpes opp til det godkjente testtrykket og kontrolleres for trykkholding, ventilbasens tilstand, kantsømmene, baug- og hekksonene samt de tungt belastede punktene. Der inspeksjonsprosedyren foreskriver det, undersøkes mistenkte lekkasjesoner med godkjente deteksjonsmetoder.'
    - icon: B
      icon_bg: green
      title: Visuell og målekontroll
      desc: 'Brettene kontrolleres under egnet lys for materialoverflatens tilstand, trykkfeil, fargeavvik, EVA-justering, folder, riper, forurensninger og stableopptak. Hovedmålene og plasseringen av tilbehøret verifiseres mot de godkjente tegningene eller spesifikasjonene.'
    - icon: C
      icon_bg: purple
      title: Kontroll av tilbehør og emballasje
      desc: 'Før leveringen verifiseres den komplette produktkonfigurasjonen: brettmodell, finnesystem, åre, pumpe, leash, transportveske, reparasjonssett, brukerhåndbok og skreddersydd tilbehør — hver del sammenlignet mot det godkjente prøveeksemplaret, tegningene og BOM-en.'
    - icon: D
      icon_bg: orange
      title: Emballasje og frigjøring før levering
      desc: 'De emballerte enhetene kontrolleres for SKU-konfigurasjon, tilbehørens fullstendighet, produktetiketter, strekkodeinformasjon, brukerhåndbokversjon, kartongmerking, emballasjeantall og kartongens tilstand. Frigjøring før levering autoriseres først når alle inspeksjons- og emballasjekrav er oppfylt.'

traceability_intro:
  tagline: Sporbarhet per parti
  title: Prosjekt- og partssporbarhetssystem
  body: |
    Hver skreddersydd SUP-bestilling håndteres under en enhetlig prosjektkode som binder sammen de tekniske spesifikasjonene, den godkjente BOM-en, grafikkrevisjonene, materialpartinummerene, emballasjereferansene og inspeksjonsregistrene. Produksjons- og inspeksjonsregistrene oppbevares per prosjekt og gjeldende produksjonsparti, og hvert parti kan spores tilbake til den godkjente produktspesifikasjonen, BOM-en, grafikken og emballasjereferansene.

    Dette støtter en effektiv verifisering av produktkonfigurasjon, inspeksjonsstatus og berørt omfang når et kvalitetsspørsmål rapporteres — fra det ferdige produktet tilbake til originalregistrene via brettets eller kartongens identifisering.

traceability_chain:
  tagline: Sporbarhetskjeden
  title: Fra prosjektkode til frigjøring før levering
  subtitle: En kjede av kontrollerte referanser fra ordrebekreftelsen til den autoriserte leveransen.
  steps:
    - step: '01'
      title: Prosjektkode
      desc: Enhetlig prosjektreferanse som kobler hvert kontrollert dokument til bestillingen.
    - step: '02'
      title: Dokumentrevisjoner
      desc: Gjeldende revisjonsnivåer for spesifikasjon, BOM, grafikk og emballasje — bare godkjente versjoner er gyldige for produksjon.
    - step: '03'
      title: Parti og materiale
      desc: Material- og komponentpartiene registreres mot produksjonspartiet.
    - step: '04'
      title: Inspeksjonsregistre
      desc: Resultater fra IQC-, prosess-, lufttetthets-, slutt- og emballasjeinspeksjon per parti.
    - step: '05'
      title: Emballasje og frigjøring
      desc: Emballasjeparti, NCR-lukningsstatus og oversikt over den autoriserte frigjøringen før levering.

traceability_sample:
  tagline: Anonymisert eksempel
  title: Sporbarhetskontrollregister (demo)
  body: |
    Demoverdiene er utelukkende illustrative — kundenavn, ordrenummer, skreddersydd grafikk, leverandørdata og kommersiell informasjon er fjernet for å beskytte konfidensialiteten.

    - **Produsent:** QINGDAO VATRAD GROUP, LTD.
    - **Prosjektkode:** DEMO-SUP-2026-01
    - **SKU-referanse:** DEMO-TR-126
    - **Produksjonsparti:** BATCH-AUG-01
    - **Spesifikasjon / BOM / Grafikkrevisjon:** Rev B / Rev C / Rev B
    - **Lufttetthetsregister:** GODKJENT — oppbevares per parti
    - **Inspeksjonsstatus:** GODKJENT
    - **Leveransestatus:** FRIGJORT

quarantine_intro:
  tagline: Avvikelseskontroll
  title: Kontroll av ikke-samsvarlende produkter og karantene
  body: |
    Produkter eller komponenter som ikke oppfyller de definerte akseptkriteriene, merkes tydelig og sperres eller settes i karantene på kontrollert vis. De får ikke gå videre til neste produksjonsfase, emballasje eller levering før et autorisert vedtak er fattet. Omtillverkning skjer etter godkjente instruksjoner og er koblet til den aktuelle avvikelsesrapporten; omtillverkede enheter reverifiseres mot de gjeldende prosjektkravene før kvalitetsfrigjøringen.

quarantine_flow:
  tagline: Kontrollflyt i sju faser
  title: Hva som skjer når et avvik oppdages
  subtitle: Identifiser, sperr, korriger, verifiser — og frigjør eller kasser. Ikke-samsvarlende produkter går aldri tilbake til produksjon eller emballasje uten verifisering.
  steps:
    - step: '01'
      title: Identifiser
      desc: Avvikelsen registreres mot den berørte produktet, SKU-en, partiet eller prosessfasen.
    - step: '02'
      title: Merk
      desc: De berørte enhetene merkes tydelig med kontrollerte statusetiketter — HOLD, i karantene eller kassert.
    - step: '03'
      title: Karantene
      desc: Enhetene skilles ut i et fysisk kontrollert eller systemhåndtert karanteneområde for å hindre utilsiktet bruk eller levering.
    - step: '04'
      title: Vurder omfang
      desc: Det berørte omfanget undersøkes per parti, prosessfase, materialparti og dokumentrevisjon.
    - step: '05'
      title: Omtillverk / bytt ut
      desc: En korrigering er bare tillatt via et godkjent vedtak og en kontrollert arbeidsinstruksjon.
    - step: '06'
      title: Verifiser på nytt
      desc: De korrigerte enhetene reverifiseres mot de gjeldende akseptkriteriene før frigjøringen.
    - step: '07'
      title: Frigjør eller kasser
      desc: Bare autoriserte og samsvarende produkter når emballasjen eller frigjøringen før levering.

