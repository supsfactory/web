faqs:
  tagline: FAQ
  title: Vanlige spørsmål om SUP-kvalitetskontroll
  items:
    - q: 'Hvordan kontrollerer QINGDAO VATRAD GROUP.,LTD. kvaliteten på oppblåsbare SUP-brett?'
      a: 'Kvaliteten kontrolleres via inngående varekontroll, kontrollpunkter i produksjonsprosessen, verifisering av sluttproduktet, emballasjeinspeksjon og produksjonssporbarhet — hver del utført mot de prosjektgodkjente prøvene, spesifikasjonene og inspeksjonskriteriene.'
    - q: 'Hvilke kvalitetskontroller utføres under SUP-produksjonen?'
      a: 'Inspeksjonene omfatter materialverifisering, kappe- og trykkkontroller, inspeksjon av brettkonstruksjonen, verifisering av ventilmonteringen, inspeksjon av tilbehøret, lufttetthetstester, utseendekontroll og emballasjeverifisering.'
    - q: 'Kan OEM-kunder be om SUP-inspeksjonsregistrene?'
      a: 'Ja. Inspeksjonsregistre og kvalitetsdokumentasjon kan leveres ut fra prosjektkravene og kvalitetsavtalene som gjelder for kunden, inkludert rapporter fra stikkprøveinspeksjoner før levering.'
    - q: 'Hvordan sikrer fabrikken en konstant OEM-produksjonskvalitet?'
      a: 'Produksjonskonsistensen opprettholdes via godkjente prøver, tekniske spesifikasjoner, produksjonskontrollpunkter, inspeksjonsprosedyrer og dokumenterte kvalitetskontrollprosesser som er koblet til hver bestilling.'
    - q: 'Kan jeg arrangere en inspeksjon fra tredjepart med SGS, BV, Intertek eller QIMA?'
      a: 'Ja. Vi tar imot eksterne inspektører med et eget inspeksjonsområde, kalibrerte trykkinstrumenter, utfylte inspeksjonsbriefinger og tilgjengelige registre. Del spesifikasjonen, det godkjente prøveeksemplaret, grafikken, emballasjekravene og feilkriteriene — eller bruk malen vår for inspeksjonsbriefing til tredjepart.'
    - q: 'Hvordan håndteres endringer i grafikk, BOM eller emballasje under produksjonen?'
      a: 'Endringer registreres i endringskontrollprotokollen vår, inkludert berørt dokumentrevisjon, endringsoversikt, begrunnelse, konsekvensvurdering, status for kundens frigjøring og effektivt parti. Foreldete versjoner tilbakekalles, slik at produksjon og inspeksjon alltid bruker de gjeldende godkjente dokumentene.'
    - q: 'Støtter fabrikken skreddersydde oppblåsbare SUP-prosjekter?'
      a: 'Ja. Skreddersydde OEM/ODM-prosjekter for oppblåsbare SUP-brett støttes ut fra kundens spesifikasjoner, grafikkkrav, tilbehørskonfigurasjoner og emballasjebehov, med prosjektspesifikke avtalte inspeksjonskriterier før produksjonen.'
    - q: 'Kan et SUP-brett med en lekkasje omtillverkes i fabrikken?'
      a: 'Ja — under kontrollerte forhold. Brettet settes i HOLD og kobles til et NCR, lekkasjen lokaliseres med en godkjent diagnostisk metode, og omtillverkningen skjer først etter autorisasjon fra QC/Konstruksjon og bare innenfor de godkjente feilklassene for omtillverkning. Brettet reverifiseres deretter mot de samme akseptkriteriene som et samsvarende brett før frigjøringen.'
    - q: 'Hvor mange ganger kan fabrikken omtillverke et brett?'
      a: 'En enkelt punkt kan omtillverkes én gang under en autorisert instruksjon. Feiler den gjentatte verifiseringen, eskaleres brettet til utskifting, kassering, destruksjon eller avvikstillatelse til kunden — gjentatt omtillverkning uten dokumentert frigjøring er ikke tillatt.'

