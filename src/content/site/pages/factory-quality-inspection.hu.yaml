rework_intro:
  tagline: A javítások irányítása
  title: A légtömörségi nem megfelelőségek felügyelete és a javítások irányítása
  body: |
    A QINGDAO VATRAD GROUP.,LTD. vállalatánál a javítást szigorúan az alábbiaként definiáljuk: egy nem megfelelő egység teljes visszaállítása az eredeti mérnöki specifikációjával való teljes megfelelésre — nem gyorsjavításként. A légtömörségi nem megfelelőséggel azonosított deszkát ellenőrzött visszatartásba helyezzük, és a további feldolgozás előtt Nem megfelelőségi jelentéshez (NCR) kötjük; a szivárgás forrását a jóváhagyott diagnosztikai módszerrel lokalizáljuk és rögzítjük.

    A javítás csak akkor folytatható, ha a hiba a jóváhagyott javítási hatótérbe esik, és rendelkezésre áll engedélyezett módszer. A javítási utasítás azonosítja a terméket, a lottagot, a hiba helyét, a jóváhagyott anyagot, a módszert, a szükséges feltételeket és az újraellenőrzés hatóterét. A szükséges megszilárdulási vagy stabilizációs idő után a deszkát ugyanazoknak a vonatkozó elfogadási kritériumoknak megfelelően ellenőrizzük újra, mint egy megfelelő deszkát — a javítás soha nem csökkenti az elfogadási szintet. Az újraellenőrzés sikertelensége új mérnöki és minőségi intézkedést igényel; az ismételt javítások dokumentált jóváhagyás nélkül nem engedélyezettek.

rework_decision:
  tagline: Interaktív folyamatábra
  title: 'Javítási döntési folyamat — kattintson bármelyik csomópontra'
  subtitle: 'Kövesse nyomon, hogyan kezeljük a légtömörségi nem megfelelőséget az észleléstől az engedélyezésig vagy a hulladékig. Kattintson egy csomópontra az adott lépés ellenőrzési követelményeinek megtekintéséhez.'
  nodes:
    - id: detect
      type: start
      label: Szivárgás észlelve
      detail: 'Vizsgálat közben légtömörségi nem megfelelőséget azonosítottunk — nyomástartási hiba, látható szivárgás vagy a légtömörségi rendszer kapcsolódó hibája.'
    - id: hold
      type: step
      label: 'Gyártásleállás · HOLD címke · NCR'
      detail: 'A feldolgozás leáll. Rögzítjük a deszka azonosítóját, a termékkódot, a lottagot, a munkahelyet, a dátumot és az ellenőrt; csatolunk egy HOLD / QUARANTINE címkét, és megnyitunk egy NCR-t a vonatkozó specifikációrevízióhoz.'
    - id: locate
      type: step
      label: A szivárgás forrásának lokalizálása
      detail: 'A deszkát a projektre jóváhagyott diagnosztikai nyomásra fújjuk, és a forrást jóváhagyott módszerrel lokalizáljuk — nyomástartás, kalibrált buborékpróba, akusztikus berendezés vagy szivárgáskereső műszer.'
    - id: classify
      type: step
      label: 'A hiba osztályba sorolása (A–G)'
      detail: 'A hibát a jóváhagyási mátrix alapján osztályba soroljuk: A szelep illesztési felülete, B a szelep alatti varrat, C felületi perforáció, D a sín helyi varrata, E a sín súlyos hibája, F visszatérő szivárgás, G szerkezeti károsodás.'
    - id: authorize
      type: decision
      label: 'Engedélyezett javítás?'
      yes: rework
      no: escalate
      detail: 'A minőség-ellenőrzés megerősíti a hiba kategóriáját, a Mérnökség pedig megvizsgálja, hogy a deszka visszaállítható-e az eredeti specifikációjához. Az engedélyezés rögzíti a módszerlapot, az anyagokat, a feltételeket és az újraellenőrzés hatóterét — vagy a csere, az elutasítás, a hulladék, illetve az ügyfél által adott kereskedelmi engedmény felé irányítja a döntést.'
    - id: rework
      type: step
      label: Ellenőrzött javítás
      detail: 'Kizárólag a jóváhagyott hiba hatóterén belül, a módszerlap, az anyaglot és a jóváhagyott szerszámok használatával — soha nem módosítva a méreteket, a felépítést, a grafikát, a tartozékokat vagy a csomagolási követelményeket.'
    - id: cure
      type: step
      label: Megszilárdulás és stabilizálás
      detail: 'A deszka a jóváhagyott anyag és folyamatutasítás által meghatározott megszilárdulási és stabilizációs időszak alatt HOLD állapotban marad, majd vizuális és kivitelezési előzetes ellenőrzést kap.'
    - id: reinspect
      type: decision
      label: 'Az újraellenőrzés sikeres?'
      yes: release
      no: escalate
      detail: 'A deszkát a projektre jóváhagyott újraellenőrzési nyomásra fújjuk, és újraellenőrizzük az eredeti hibát valamint valamennyi potenciálisan érintett jellemzőt — a szivárgás helyét, a szelepet, a síneket, a varratokat, a nagy igénybevételi zónákat, a tartozékokat és a megjelenést. A javítás soha nem csökkenti az elfogadási szintet.'
    - id: release
      type: release
      label: A minőségi engedélyezés
      detail: 'A minőség-ellenőrzés áttekinti a lezárt NCR-t, a javítási nyilvántartást és az újraellenőrzés eredményét, majd engedélyezi az átadást. Javított deszkát a minőségi engedélyezés nélkül nem csomagolunk és nem szállítunk.'
    - id: escalate
      type: escalate
      label: 'Eskalálás — csere / hulladék / engedmény'
      detail: 'Ismételt javítás dokumentált jóváhagyás nélkül nem engedélyezett. A deszkát a cserére, elutasításra, hulladékként kezelésre vagy az ügyfél által adott írásbeli kereskedelmi engedményre irányítjuk, ha az eredeti specifikáció nem állítható vissza.'

