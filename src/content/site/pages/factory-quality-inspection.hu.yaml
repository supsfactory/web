answer:
  label: 'Közvetlen válasz'
  text: 'A QINGDAO VATRAD GROUP.,LTD. 4 lépéses ellenőrzési rendszerrel vizsgálja a felfújható SUP deszkák minőségét: beérkező anyagellenőrzés (IQC), folyamatközi minőségellenőrzés (IPQC), a deszka végső vizsgálata és a felfújás ellenőrzése (FQC), valamint csomagolás és szállítás előtti engedélyezés (OQC). Minden megrendelést a jóváhagyott mintához, a műszaki specifikációhoz, a grafikai próbához, a BOM-hoz és a csomagolási szabványokhoz hasonlítva ellenőrzünk, légtömörségi vizsgálattal, vizuális és méretellenőrzéssel, tartozék-egyeztetéssel és lotonkénti követhetőséggel. Azok a termékek, amelyek nem felelnek meg az elfogadási kritériumoknak, ellenőrzött visszatartásba vagy karanténba kerülnek, kizárólag jóváhagyott utasítás szerint javítjuk őket, és az engedélyezés előtt újraellenőrizzük.'
  verified: '2026. szeptember'

intro: 'Minőségi rendszerünket OEM/ODM projektekre terveztük: az ellenőrzési kritériumokat megrendelésenként rögzítjük, dokumentáljuk, és a gyártó- és minőségi csapatok az alapanyag beérkezésétől a csomagolásig betartják őket. Így a minőségi elvárások a gyár és az Ön márkája között egységesek maradnak, az első mintától a teljes konténeres szállításokig.'

scope_note:
  tagline: Hatály
  title: Projektspecifikus ellenőrzési kritériumok
  body: |
    A minőségi specifikációk a deszka felépítésétől (például egyrétegű/kétrétegű, drop-stitch szövet, olvasztott sín), a tervezett végfelhasználástól, a célpiaci szabályozástól és az ügyfél által jóváhagyott paraméterektől függenek. A végső engedélyezés kizárólag a megrendelésre dokumentált és egyeztetett ellenőrzési kritériumokon alapul.

stages:
  tagline: A minőségi keretrendszer
  title: A 4 lépéses minőségellenőrzési rendszerünk
  subtitle: 'Egy teljes QC ciklus a nyersanyag beérkezésétől a szállítás engedélyezéséig.'
  steps:
    - title: '1. Beérkező anyagellenőrzés (IQC)'
      desc: 'A fő anyagokat és a beszerzett alkatrészeket a jóváhagyott specifikációkhoz és a referencia mintákhoz hasonlítva ellenőrizzük, mielőtt a gyártósorba kerülnének. A drop-stitch és a PVC anyagoknál ellenőrizzük az anyagazonosítást, a beszállítói lottagot, a tömeget/sűrűséget, a vastagságot, a szín egyezését a jóváhagyott mintákkal, valamint a felületi hibákat. A húzószállású (EVA) borítékoknál ellenőrizzük a modellt, a színt, a vastagságot, a vágás pontosságát és a ragasztó kompatibilitását. A szelepeken és szerelvényeken működési, menetes, tömítési épségi és szerelési próbát végzünk. A tartozékokat és a csomagolóanyagokat (pumpák, lapátok, uszonyok, kötelek, táskák, dobozok) mennyiség, szín, márkázás, vonalkód-pontosság és grafikai verzió szempontjából egyeztetjük a jóváhagyott BOM-mal.'
    - title: '2. Folyamatközi minőségellenőrzés (IPQC)'
      desc: 'A kritikus gyártási lépések ellenőrzése célja, hogy a nem megfelelőségeket már azelőtt kimutassuk, mielőtt a deszkák a következő állomásra kerülnének. A vágást és a nyomtatást a panelméretek, a grafika megjelenése, a tükörkép szerinti tájolás és a szélek tisztasága alapján ellenőrizzük a jóváhagyott műszaki rajzokhoz képest. A deszka összeállítását és a sín ragasztását a kontúr szimmetriájára, a varratátfedések folytonosságára, valamint a nagy igénybevételi zónák menti hézagok és légbuborékok megszüntetésére ellenőrizzük. A szelepek és a tartozékok rögzítését, a grafikát és a márkázást a helyzet, a tájolás, a ragasztó fedettsége, a embléma helyesírása és a grafikai verzió alapján ellenőrizzük.'
    - title: '3. A deszka végső vizsgálata és a felfújás ellenőrzése (FQC)'
      desc: 'A befejezett deszkákat a csomagolás jóváhagyása előtt kötelező fizikai és szerkezeti vizsgálaton vetjük alá. A deszkákat a projektre jóváhagyott ellenőrzési nyomásra fújjuk, és a szerkezeti merevség és a nyomásstabilitás ellenőrzése érdekében tartjuk. A légtömörségi vizsgálatok kiterjednek a szelep házára, a sín varrataira, az orr/farok kúpos részeire és a teherviselő toldatokra, kalibrált szivárgáskeresési módszerekkel (nyomáscsökkenés-figyelés vagy buborékpróba). A kozmetikai és méretellenőrzés a méreteket, a rocker-profilt és az EVA boríték illeszkedését (±2 mm tűrés) ellenőrzi, szabványos természetes fényben.'
    - title: '4. Csomagolás és szállítás előtti engedélyezés (OQC)'
      desc: 'A szállítás előtti teljes ellenőrzés garantálja, hogy az SKU-konfigurációban vagy a szállítási jelölésekben nincs semmilyen eltérés. A készlet teljességét kereszt-ellenőrzéssel vizsgáljuk: a deszkát, az uszonyt, a kötelet, a lapátot, a pumpát, a táskát, a javítócsomagot és a használati útmutatót a megrendelés BOM-jához hasonlítva. A csomagolási és vonalkód-ellenőrzések a dobozjelöléseket, az SKU-címkéket, a vonalkód olvashatóságát, az útmutató nyelvét és a doboz szerkezeti épségét vizsgálják. A megrendelések csak akkor kerülnek engedélyezésre, miután a végső csomagolási auditot az engedélyezett minőségi személyzet aláírta.'

inspection_points:
  tagline: Az ellenőrzés lefedettsége
  title: Az ellenőrzés kulcsfontosságú pontjai
  subtitle: 'Minden ellenőrzési pontot a megrendelésenként dokumentált és egyeztetett elfogadási kritériumok szerint hajtunk végre.'
  features:
    - icon: A
      icon_bg: blue
      title: Légtömörségi ellenőrzés
      desc: 'A befejezett deszkákat a jóváhagyott ellenőrzési nyomásra fújjuk, és ellenőrizzük a nyomástartást, a szelep aljának állapotát, a sín varratait, az orr- és fartérsegeket, valamint a nagy igénybevételi pontokat. Ahol az ellenőrzési eljárás megköveteli, a szivárgásra gyanús területeket jóváhagyott szivárgáskeresési módszerekkel vizsgáljuk.'
    - icon: B
      icon_bg: green
      title: Vizuális és méretellenőrzés
      desc: 'A deszkákat megfelelő megvilágításban vizsgáljuk az anyag felületi állapota, a nyomtatási hibák, a színváltozások, az EVA illeszkedése, a gyűrődések, a karcolások, a szennyeződés és a ragasztás megjelenése szempontjából. A fő méreteket és a tartozékok helyzetét a jóváhagyott rajzokhoz vagy specifikációkhoz hasonlítva ellenőrizzük.'
    - icon: C
      icon_bg: purple
      title: Tartozék- és csomagolásellenőrzés
      desc: 'A termék teljes konfigurációját szállítás előtt ellenőrizzük: a deszka modellje, az uszonyrendszer, a lapát, a pumpa, a kötél, a szállítótáska, a javítócsomag, a használati útmutató és az ügyfél-specifikus tartozékok — mindegyik a jóváhagyott mintához, a rajzokhoz és a BOM-hoz igazítva.'
    - icon: D
      icon_bg: orange
      title: Csomagolás és szállítási engedélyezés
      desc: 'A csomagolt egységeket ellenőrizzük az SKU-konfiguráció, a tartozékok teljessége, a termékcímkék, a vonalkód adatai, az útmutató verziója, a dobozjelölés, a csomagolási mennyiség és a doboz állapota szempontjából. A szállítási engedélyezésre csak az összes ellenőrzési és csomagolási követelmény teljesülése után kerül sor.'

traceability_intro:
  tagline: A lottagok követhetősége
  title: Projektszintű és lotszintű követhetőségi rendszer
  body: |
    Minden egyedi SUP megrendelést egységes projektkód alatt kezeljük, amely összekapcsolja a műszaki specifikációkat, a jóváhagyott BOM-ot, a grafika revízióit, az anyagok lottagszámait, a csomagolási hivatkozásokat és az ellenőrzési nyilvántartásokat. A gyártási és ellenőrzési nyilvántartásokat az érintett projekthez és gyártási lothoz vezetjük, és minden lot visszakapcsolható a jóváhagyott termékspecifikációhoz, a BOM-hoz, a grafikához és a csomagolási hivatkozásokhoz.

    Ez hatékony áttekintést tesz lehetővé a termékkonfigurációról, az ellenőrzés állapotáról és az érintett hatótérről, ha minőségi problémát azonosítunk — a készterméktől visszafelé a forrásnyilvántartásokig, a deszka vagy a doboz azonosítója alapján.

traceability_chain:
  tagline: A követhetőségi lánc
  title: A projektkódtól a szállítás engedélyezéséig
  subtitle: 'Egyetlen ellenőrzött hivatkozási lánc a megrendelés megerősítésétől az engedélyezett szállításig.'
  steps:
    - step: '01'
      title: Projektkód
      desc: 'Egységes projektazonosító, amely a megrendelés minden ellenőrzött dokumentumát összekapcsolja.'
    - step: '02'
      title: Dokumentumrevíziók
      desc: 'A specifikáció, a BOM, a grafika és a csomagolás aktuális revíziószintjei — csak a jóváhagyott verziók érvényesek a gyártásban.'
    - step: '03'
      title: Lottagok és anyagok
      desc: 'A gyártási lothoz rendelt anyag- és alkatrészlottagok.'
    - step: '04'
      title: Ellenőrzési nyilvántartások
      desc: 'Lotonkénti IQC-, folyamatközi, légtömörségi, végső és csomagolási ellenőrzés eredményei.'
    - step: '05'
      title: Csomagolás és engedélyezés
      desc: 'A csomagolási lot, a lezárt NCR állapota és az engedélyezett szállítási engedélyezés összefoglalója.'

traceability_sample:
  tagline: Anonimizált minta
  title: Követhetőségi ellenőrzési nyilvántartás (demó)
  body: |
    A demóértékek kizárólag szemléltető célból szerepelnek — az ügyfelek nevei, a megrendelésszámok, az egyedi grafikák, a beszállítói adatok és az üzleti információk el lettek távolítva a titkosság megőrzése érdekében.

    - **Gyártó:** QINGDAO VATRAD GROUP, LTD.
    - **Projektkód:** DEMO-SUP-2026-01
    - **SKU-hivatkozás:** DEMO-TR-126
    - **Gyártási lot:** BATCH-AUG-01
    - **Specifikáció / BOM / grafika revíziója:** Rev B / Rev C / Rev B
    - **Légtömörségi nyilvántartás:** PASS — lotonként megőrzött
    - **Ellenőrzés állapota:** PASS
    - **Szállítás állapota:** RELEASED

quarantine_intro:
  tagline: Nem megfelelőség-kezelés
  title: Nem megfelelő termékek felügyelete és karantén
  body: |
    Azokat a termékeket vagy alkatrészeket, amelyek nem felelnek meg a meghatározott elfogadási kritériumoknak, egyértelműen azonosítjuk, és ellenőrzött visszatartásba vagy karanténállapotba helyezzük. Ezek nem kerülhetnek át a következő gyártási-, csomagolási vagy szállítási szakaszba, amíg nincs lezárva egy engedélyezett intézkedés. A javítást a jóváhagyott utasítások szerint végezzük, és a javítási nyilvántartást az érintett nem megfelelőségi nyilvántartáshoz kötjük; a javított termékeket a minőségi engedélyezés előtt a projektre vonatkozó követelmények szerint újraellenőrizzük.

quarantine_flow:
  tagline: 7 lépéses ellenőrzési folyamat
  title: Mi történik, ha nem megfelelőséget azonosítunk?
  subtitle: 'Azonosítás, ellenőrzés, helyesbítés, ellenőrzés — majd engedélyezés vagy elutasítás. A nem megfelelő termék ellenőrzés nélkül soha nem kerül vissza a gyártásba vagy a csomagolásba.'
  steps:
    - step: '01'
      title: Azonosítás
      desc: A nem megfelelőséget az érintett termékhez, SKU-hoz, lothoz vagy folyamatlépéshez rögzítjük.
    - step: '02'
      title: Címkézés
      desc: 'Az érintett termékeket egyértelműen, ellenőrzött állapotcímkékkel jelöljük — HOLD, QUARANTINE vagy REJECTED.'
    - step: '03'
      title: Karantén
      desc: 'A termékeket fizikailag ellenőrzött karanténterületen, illetve rendszerrel szabályozott módon elkülönítjük a véletlen felhasználás vagy szállítás megelőzése érdekében.'
    - step: '04'
      title: Hatótér értékelése
      desc: 'Az érintett hatóteret lotonként, folyamatlépésenként, anyaglotonként és dokumentumrevízióonként felülvizsgáljuk.'
    - step: '05'
      title: Javítás / csere
      desc: A helyesbítés csak jóváhagyott intézkedéssel és ellenőrzött munkautasítással végezhető.
    - step: '06'
      title: Újraellenőrzés
      desc: A helyesbített termékeket az engedélyezés előtt a vonatkozó elfogadási kritériumok szerint újraellenőrizzük.
    - step: '07'
      title: Engedélyezés vagy elutasítás
      desc: 'Csak az engedélyezett, megfelelő termék mehet tovább csomagolásra vagy szállítási engedélyezésre.'

