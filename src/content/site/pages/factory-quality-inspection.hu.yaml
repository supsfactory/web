rework_flow:
  tagline: Zárt hurok 7 lépésben
  title: 'Ellenőrzött javítási munkafolyamat — az észleléstől az engedélyezésig vagy a hulladékig'
  subtitle: 'Minden légtömörségi javítás ugyanazt az ellenőrzött hurkot követi: észlelés, karantén, diagnosztika, engedélyezés, javítás, újraellenőrzés, engedélyezés.'
  steps:
    - step: '01'
      title: 'Észlelés, gyártásleállás és karantén'
      desc: 'A feldolgozás azonnal leáll az érintett deszkánál. Rögzítjük a deszka azonosítóját, a termékkódot, a lottagot, a munkahelyet, a dátumot és az ellenőrt, csatolunk egy HOLD / QUARANTINE címkét, és megnyitunk egy NCR-t a vonatkozó specifikációrevízióhoz.'
    - step: '02'
      title: 'A szivárgás szisztematikus diagnosztikája'
      desc: 'A deszkát a projektre jóváhagyott diagnosztikai nyomásra fújjuk, és a szivárgás forrását jóváhagyott módszerrel lokalizáljuk — nyomástartás, kalibrált buborékpróba, akusztikus berendezés vagy szivárgáskereső műszer. A gyanús helyzet megjelölése a deszka károsítása nélkül történik.'
    - step: '03'
      title: 'Mérnöki intézkedés és engedélyezés'
      desc: 'A minőség-ellenőrzés megerősíti a hiba kategóriáját, a Mérnökség pedig megvizsgálja, hogy a deszka visszaállítható-e az eredeti specifikációjához. Az NCR-re hivatkozó javítási engedély rögzíti a jóváhagyott módszert, az anyagokat, a feltételeket és az újraellenőrzés hatóterét — vagy a cserét, az elutasítást, a hulladékot vagy az ügyfél által adott kereskedelmi engedményt rendeli ki.'
    - step: '04'
      title: 'Az ellenőrzött javítás végrehajtása'
      desc: 'A javítást kizárólag a jóváhagyott hiba hatóterén belül, a módszerlap, az anyaglot és a jóváhagyott szerszámok használatával hajtjuk végre. A deszka méretei, a felépítés, a grafika, a tartozékkonfiguráció és a csomagolási követelmények soha nem módosulnak.'
    - step: '05'
      title: 'Megszilárdulás és előzetes ellenőrzés'
      desc: 'A javított deszka a jóváhagyott anyag és folyamatutasítás által meghatározott megszilárdulási és stabilizációs időszak alatt HOLD állapotban marad, majd az újraellenőrzés előtt vizuális és kivitelezési előzetes ellenőrzést kap.'
    - step: '06'
      title: 'Újraellenőrzés és próbavizsgálat'
      desc: 'A deszkát a projektre jóváhagyott újraellenőrzési nyomásra fújjuk, és újraellenőrizzük az eredeti hibát valamint valamennyi potenciálisan érintett jellemzőt: a szivárgás helyét és a környező területet, a szelepet, a síneket, a varratokat, a nagy igénybevételi zónákat, a tartozékokat és a megjelenést. A javítás soha nem csökkenti az elfogadási szintet.'
    - step: '07'
      title: 'QA-engedélyezés vagy végleges intézkedés'
      desc: 'A minőség-ellenőrzés áttekinti a lezárt NCR-t, a javítási nyilvántartást és az újraellenőrzés eredményét, majd engedélyezi az átadást — vagy a cserére, elutasításra, hulladékra, illetve az ügyfél által adott kereskedelmi engedményre eszkalálja. Javított deszkát a minőségi engedélyezés nélkül nem csomagolunk és nem szállítunk.'

quality_safeguards:
  tagline: Minőségvédelmi intézkedések
  title: Hibamegelőzési szabályok, amelyek védik az Ön márkáját
  subtitle: 'Szigorú ellenőrzések, amelyek megelőzik az ellenőrizetlen javítási hurkokat — egy dokumentált javítás hibánként, lotszintű riasztási küszöbök, kalibrált műszerek és ellenőrzött vizsgálati körülmények.'
  features:
    - icon: 1
      icon_bg: blue
      title: Egy javítás hibánként
      desc: 'Egyetlen helyszín csak egyszer javítható, engedélyezett utasítás szerint. Ha az újraellenőrzés továbbra is sikertelen, a deszkát eszkaláljuk cserére, elutasításra, hulladékra vagy az ügyfél által adott kereskedelmi engedményre — a dokumentált jóváhagyás nélküli ismételt javítások nem engedélyezettek.'
    - icon: 2
      icon_bg: green
      title: Lotalriasztás és gyártásleállás
      desc: 'Ha a gyártási lotban a nem megfelelőség meghaladja a Mérnökség által megállapított küszöböt, a gyártósort leállítjuk, és a Mérnökség kivizsgálja az okot — az anyaglottagot, a folyamatkörülményeket és a nyilvántartásokat —, mielőtt a gyártás folytatódna.'
    - icon: 3
      icon_bg: purple
      title: Kalibrált műszerezettség
      desc: 'A légtömörségi vizsgálathoz használt nyomásmérők, digitális nyomásmérők és időmérők érvényességi idejükön belül külső laboratóriumok által ellenőrzöttek és kalibráltak, és a kalibrálás állapota látható az ellenőrzőterületen.'
    - icon: 4
      icon_bg: orange
      title: Ellenőrzött vizsgálati körülmények
      desc: 'A légtömörségi vizsgálóterületet és a megszilárdulási területet ellenőrzött környezetben tartjuk, hogy az eredményeket ne befolyásolják a nappali és éjszakai hőmérséklet-változások.'

rework_boundaries:
  tagline: 'Hatály és korlátok'
  title: 'Amire ez a rendszer nem terjed ki'
  body: |
    A javítás-ellenőrzési rendszer a befejezett vagy folyamatban lévő felfújható SUP deszkákra alkalmazandó, amelyeket a szállítási engedélyezés előtt levegőszivárgással, nyomástartási hibával vagy a légtömörségi rendszer kapcsolódó hibáival azonosítottunk. Nem engedélyezi a felépítés, az anyagok, a grafika, a termékkonfiguráció vagy az ügyfél által jóváhagyott követelmények módosítását, és nem terjed ki az alábbiakra:

    - A már szállított vagy az ügyfelek csatornáiban lévő termékekre.
    - A szerkezeti károsodásra vagy a deszka olyan deformációjára, amelyet a Mérnökség nem értékelt ki.
    - A sínek vagy a varratok kiterjedt hibáira, a maganyag károsodására vagy a biztonságot befolyásoló hibákra.
    - Azokra a projektekre, ahol a javítás nem engedélyezett: az ügyfél által jóváhagyott minták, tanúsítási vagy vizsgálati egységek.
    - Azokra a projektekre, amelyekben az ügyfél saját folyamatai, speciális anyagai vagy speciális javítási követelményei érvényesek.
    - Azokra a visszatérő szivárgásokra, amelyek nem lokalizálhatók, vagy azokra a deszkákra, amelyek a javítás után ismét elbuknak.

    Az ügyfél specifikációitól való bármely eltéréshez dokumentált mérnöki elemzés és – ahol szükséges – az ügyfél írásbeli jóváhagyása szükséges. Azok a deszkák, amelyek nem állíthatók vissza az eredeti specifikációjukra, csak az ügyfél kifejezett engedményével adhatók át — soha nem pusztán a gyártó döntésére.

method_cards:
  tagline: 'A módszerlapok rendszere'
  title: 'Az ellenőrzött javítás módszerlapjainak jegyzéke'
  subtitle: 'Az általános utasítás a folyamatot szabályozza; a módszerlapok a műveletet. A javítási utasítás (WI-QC-AT-001) a MC-RW-01-től MC-RW-06-ig tartozó módszerlapokra hivatkozik, továbbá az MC-RW-00 lapra, amely a kötelező hulladékként kezelést és elutasítást szabja meg.'
  headers:
    code: Módszerlap
    defect: Hibaosztály
    scope: Hatály
    controls: Kulcsfontosságú mérnöki ellenőrzések
    approval: Aláírási jogkör
  rows:
    - code: MC-RW-01
      defect: A osztály (a szelep illesztési felülete)
      scope: 'A szelep magjának szervizelése, a tömítés tisztítása és újbóli összeszerelése'
      controls: 'Kalibrált nyomatékkulcs, tiszta tömítőfelület, a szelepmenetek károsítása nélkül'
      approval: 'QC-ellenőr'
    - code: MC-RW-02
      defect: B osztály (a szelep kerülete)
      scope: 'A szelep alatti karima tömítése és ellenőrzött meghúzása'
      controls: 'Ellenőrzött felület-előkészítés, jóváhagyott ragasztóanyag, kör alakú sajtóeszköz'
      approval: 'QC + Mérnökség'
    - code: MC-RW-03
      defect: C osztály (felületi mikroszivárgás)
      scope: 'A nem szerkezeti perforációk tömítése'
      controls: 'Jóváhagyott kétkomponensű ragasztó, szivárgás nélkül a grafikán és az EVA-n'
      approval: 'QC + Mérnökség'
    - code: MC-RW-04
      defect: D osztály (a sín helyi varrata)
      scope: 'A sín helyi átfedő varratának újraragasztása'
      controls: 'Ellenőrzött hőaktiválás, sajtóhenger, hullámzásgátló eszköz'
      approval: 'Mérnökség + QA-vezető'
    - code: MC-RW-05
      defect: B/C osztály (a tartozék széle)
      scope: 'Az uszonydoboz toldójának és a tartozék szerelőalapjának tömítése'
      controls: 'Felületi tapadássegítő, profilos sajtóblokk, meghatározott megtartási idő'
      approval: 'QC + Mérnökség'
    - code: MC-RW-06
      defect: D osztály (orr/farok varrat)
      scope: 'Beavatkozás a nagy igénybevételű görbületi varratokon'
      controls: 'Nagy nyíróigénybevételhez jóváhagyott ragasztóanyag, meghosszabbított megszilárdulási idő az újratesztelés előtt'
      approval: 'Főmérnök'
    - code: MC-RW-00
      defect: E/F/G osztály (kritikus / törés)
      scope: 'Kötelező hulladékkezelés és fizikai megsemmisítés'
      controls: 'Fizikai darabolás a keveredés megelőzése érdekében, hulladék-nyilvántartás, több osztály együttes gyökérok-elemzése'
      approval: 'Üzemvezető'

inspector_friendly:
  tagline: 'Harmadik fél általi ellenőrzés'
  title: 'Ellenőrbarát protokoll'
  body: |
    Külön ellenőrzőterületet kínálunk kalibrált nyomásmérőkkel, a varratok és a grafika ellenőrzésére szabványosított fényasztalokkal, valamint előkitöltött ellenőrzési utasításokkal, hogy a harmadik fél ügynökségei (SGS, BV, Intertek, QIMA) hatékonyan el tudják végezni a szállítás előtti ellenőrzést — így Ön időt takarít meg az ellenőrzésen.

    Minden utasítás összefoglalja az adott megrendelésre vonatkozó dokumentumrevíziókat, a jóváhagyott minta hivatkozását, a minőségi kritikus ellenőrzéseket, az egyeztetett mintavételi szintet, a funkcionális vizsgálatokat, valamint a csomagolási és vonalkód-követelményeket. A megadott mennyiségeket, a minőséget, a csomagolást és az alapvető biztonsági elemeket a projekt jóváhagyott hivatkozásaihoz hasonlítva ellenőrizzük — nincs utolsó pillanatbeli dokumentumkeresés a helyszínen.

