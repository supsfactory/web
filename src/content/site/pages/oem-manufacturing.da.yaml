hero:
  tagline: OEM-produktion
  title: 'Specialfremstillet SUP i OEM — din specifikation, vores fabrik'
  subtitle: 'Du bidrager med designet, tegningen eller den gennemprøvede platform — vi fremstiller den i containerstørrelse. Gennemgang i konstruktionen inden for en arbejdsdag, prøvebrætter på 7–12 dage og produktion på 25–35 dage efter bekræftet PO og depositum, afsendt under dit mærke.'

answer:
  label: 'Det korte svar'
  text: 'OEM-produktion bygger på din specifikation. Minimumsordrestørrelsen bekræftes ud fra projektets konfiguration frem for et fast tal: standardvolumenproduktion kører 90–100 stk. pr. batch fra en 150 m rulle drop-stitch-dug, pilotserier starter ved 20–50 stk. på eksisterende platforme, og ethvert projekt gennemgår prøvebrætter (1–2 stk.) før volumen. Prøvebrætter afsendes på 7–12 dage; produktion kører 25–35 dage efter bekræftet PO og depositum, plus 15–20 dage når nyt værktøj er påkrævet.'
  verified: 'September 2026'

