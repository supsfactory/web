customization:
  tagline: 'Bygget efter din specifikation'
  title: 'Specifikationspunkter i OEM'
  subtitle: 'Her er de specifikationspunkter, du styrer i et OEM-projekt — dit specifikationsdokument er produktionskontrakten:'
  items:
    - 'Brættets mål — længde, bredde, tykkelse, rocker og volumen ud fra dine tegninger eller målryttere'
    - 'Materialestruktur — antal og kvalitet af PVC-lag, drop-stitchdensitet, forstærkninger og kantforstærkninger'
    - 'Grafik og farver — dit artwork anvendt med ubegrænsede paletter, eller støtte fra vores eget designteam'
    - 'EVA-gripflade — specialskårede dækflader, logoer og dækfarger på hvert bræt'
    - 'Håndtag og D-ringe — placering, antal og beslagspecifikation til dit anvendelsesformål'
    - 'Finnsystemer — konfigurationer med enkelt-, dobbelt- eller trefinner og finnekasser efter din specifikation'
    - 'Pagajer, pumper, sikkerhedsliner og tilbehør — din pakke, dit branding'
    - 'Emballage og salgspresentation — salgskasser, sødygtige transportkasser og displays i butikken under dit mærke'
    - 'Etiketter og overholdelsesmærker — serienummeretiketter, logoer og dokumentation pr. marked, der klargjort til din eksportregion'

faq_section:
  tagline: FAQ
  title: 'Spørgsmål om OEM-produktion'
  questions:
    - q: Hvordan starter jeg et OEM-projekt med mit eget design?
      a: 'Send dine tegninger, et referencebræt eller en skriftlig specifikation. Vores gennemgang i konstruktionen bekræfter fremstillingsmulighederne og giver et tilbud inden for en arbejdsdag — det er vores standardforpligtelse, og der underskrives en NDA inden nogen filudveksling, når det er nødvendigt.'
    - q: Hvad er minimumsordrestørrelsen for OEM af oppustelige SUP?
      a: 'Minimumsordrestørrelsen bekræftes ud fra projektets konfiguration — skrog og værktøj, farvevarianter og PVC, artwork, emballage og tilbehør. Standardvolumenproduktion kører 90–100 stk. pr. batch (en 150 m rulle drop-stitch), mens pilotserier starter ved 20–50 stk. på eksisterende platforme. Læs hele beregningslogikken i vores guide til minimumsordrer og fleksibelt branding.'
    - q: Hvad er den typiske leveringstid for en OEM-ordre?
      a: 'Produktion kører 25–35 dage fra bekræftet PO og depositum. Udvikling af specialform lægger 15–20 dage til for værktøjet. Prøvebrætter afsendes normalt inden for 7–12 dage.'
    - q: Kan I fremstille udelukkende ud fra mine eksisterende tegninger?
      a: 'Ja. OEM bygger på din specifikation som den er — du ejer designet. Vores ingeniører gennemgår tegningerne for produktionsmuligheder, påpeger eventuelle modstridende krav, før værktøj eller skæring begynder, og det godkendte prøvebræt bliver produktionsreferencen.'
    - q: Leverer I prøvebrætter før produktionen?
      a: 'Ja. Et fysisk prøvebræt fremstilles og godkendes, før nogen produktionsserie, typisk inden for 7–12 dage, og det er referencen for alle efterfølgende QC-kontroller.'
    - q: Hvilke certificeringer har fabrikken?
      a: 'ISO 9001:2015 kvalitetsstyring (fabriksdækkende), BSCI social ansvarlighed (amfori-anlægsaudit), CE-overensstemmelsesdokumentation for gældende konfigurationer til EU-markedet (omfanget bekræftes pr. projekt), REACH (materialer) og RoHS (elektronisk tilbehør). Fuld overholdelsesdokumentation leveres med hver OEM-forsendelse, klargjort til dine målmarkeder.'
    - q: Hvordan kontrolleres kvaliteten på en OEM-serie?
      a: 'Produktionen kører under QC på flere punkter — modtagne materialer, proceskontrol og endelig inspektion — med trykholdeprøvning på 18.0 PSI i 24 timer (automatisk kassation ved fald på over 0.50 PSI), en tjekliste for samling med 100 punkter og 10 års batchspørgsmål i ERP pr. serienummer.'
    - q: Hvad er jeres leveringsbetingelser?
      a: 'FOB Qingdao, CIF til større globale havne eller DDP for kvalificerede partnere. Vi sender til 50+ lande på markederne i EU, USA, AU og Asien.'

process:
  title: 'OEM-processen — fra specifikation til afsendt container'
  subtitle: 'Syv kontrollerede trin gennemført af et fabriksteam, så hvert trin fra din første specifikation til den pakkede container er dokumenteret og holder tidsplanen.'
  steps:
    - phase: '01'
      title: 'Gennemgang af specifikation og tilbud'
      period: 1 arbejdsdag
      items:
        - 'Del dine tegninger, specifikation eller referencebrætter — vores ingeniører kontrollerer fremstillingsmulighederne.'
        - 'Du modtager et detaljeret tilbud og en projektplan inden for en arbejdsdag.'
    - phase: '02'
      title: 'Ingeniørmæssig bekræftelse'
      period: Uge 1
      items:
        - 'Skrogmål, drop-stitch-kvalitet, PVC-specifikationer og kantkonstruktion bekræftes mod dit dokument.'
        - 'Beslutninger om form eller platform låses — udvikling af specialformværktøj starter her, når det er påkrævet.'
    - phase: '03'
      title: 'Prototype og prøvebræt'
      period: 7–12 dage
      items:
        - 'Et fysisk prøvebræt fremstilles og sendes til din gennemgang — prøvesejlads er inkluderet for nye former.'
        - 'Prøvebrættet (1–2 stk.) validerer din specifikation, før nogen volumenforpligtelse indgås.'
    - phase: '04'
      title: 'Test og validering'
      period: Parallelt
      items:
        - 'Kontrol af luftfastholdelse, trykhold, sømstyrke, belastning og UV pr. produktionslinje.'
        - 'Dokumentation for CE, ISO 9001, BSCI, REACH og RoHS klargøres til dine eksportmarkeder.'
    - phase: '05'
      title: 'Godkendelse og bekræftelse'
      period: Efter godkendelse af prøvebræt
      items:
        - 'Du godkender prøvebrættet og artworket; PO og depositum låser produktionspladsen.'
        - 'En plan for før produktion bekræfter datoer, antal, emballage og indlæsningshavn.'
    - phase: '06'
      title: Produktion
      period: 25–35 dage
      items:
        - 'Produktionen kører under QC på flere punkter — modtagne materialer, proceskontrol og endelig inspektion.'
        - 'Fra pilotordrer (20–50 stk.) på eksisterende platforme til fulde batcher på en 150 m rulle (90–100+ stk.) til standardvolumenproduktion.'
    - phase: '07'
      title: Emballage og afsendelse
      period: 1 dag + transport
      items:
        - 'Eksportemballage med serienummeretiketter, derefter FOB Qingdao, CIF eller DDP til 50+ lande.'
        - 'Tolddokumentation, sporing og support ved gentbestilling er inkluderet i alle trin.'

