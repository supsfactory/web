answer:
  label: 'Прямой ответ'
  text: 'Доверие — это не обещание, это документация. Мы — зарегистрированное китайское производственное юридическое лицо (Qingdao Vatrad Group Co., Ltd.) с физической площадкой 12,500 m² в Циндао, 350+ работниками и мощностью более 120 000 досок в год. Вы можете проверить регистрацию, проаудировать завод, изучить SOP системы качества, скачать образцы записей контроля качества, назначить стороннюю инспекцию (SGS, TÜV, BV или Intertek) и подписать NDA в течение 4 рабочих часов. Каждая доска испытывается при 18.0 PSI в течение 24 часов с автоматическим браком при падении более 0.50 PSI, а каждая партия сохраняет 10-летнюю ERP-прослеживаемость. Если утверждение нельзя подтвердить документально, мы его не делаем.'
  verified: 'Сентябрь 2026'

