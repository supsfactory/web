trust_steps:
  tagline: 'Реальный кейс'
  title: 'Как прокатный парк Северной Европы проверил нас до заказа'
  subtitle: 'Семь шагов проверки, которые коммерческий прокатный оператор выполнил перед размещением заказа на парк из 90–100+ досок —тот же чек-лист открыт для вас.'
  steps:
    - step: '01'
      title: 'Проверка официального юридического лица'
      desc: 'Покупатель запросил китайскую регистрацию бизнеса и экспортную лицензию на внешнюю торговлю. Юридическое лицо, стоящее за iSupfactory, — это Qingdao Vatrad Group Co., Ltd., производитель, зарегистрированный в Циндао, провинция Шаньдун, с 2012 года —проверено через национальный реестр под NDA.'
    - step: '02'
      title: 'Физический завод и аудит площадки'
      desc: 'Аудит завода (очно и в формате видеообхода) подтвердил площадку 12,500 m²: четыре специализированных цеха, 350+ работников, четыре автоматизированные линии и месячный выпуск около 10,000 досок. Отчет об аудите хранится вместе с договорными документами.'
    - step: '03'
      title: 'Люди: реальные инженеры, а не продажные скрипты'
      desc: 'Покупатель общался напрямую с инженерной командой —проектирование корпуса, лаборатория материалов и контроль качества. Спецификация проекта и NDA были обменяны в течение 4 рабочих часов, а инженерная проверка вернулась в течение одного рабочего дня.'
    - step: '04'
      title: 'Документы: СМК, сертификаты и сторонняя инспекция'
      desc: 'Были изучены ISO 9001:2015, документация по ISO 25649 и соответствию CE, записи BSCI/REACH/RoHS, а также SOP системы качества. Покупатель назначил предотгрузочную инспекцию SGS по ISO 2859-1 Level II на первый серийный заказ —и получил Сертификат соответствия по каждой партии.'
    - step: '05'
      title: 'Данные: протоколы испытаний по каждому серийному номеру'
      desc: 'Покупатель проверил реальные протоколы испытаний: каждая камера испытана при 18.0 PSI в течение 24 часов с автоматическим браком при падении давления более 0.50 PSI, чек-листы сборки из 100 пунктов и 10-летняя ERP-прослеживаемость партий. Образцы записей контроля качества были предоставлены до заказа.'
    - step: '06'
      title: 'Защита договором'
      desc: 'Договор на заказ охватывал лицензию на бренд, согласованный период эксклюзивности по территории, права на пресс-форму и условия выкупа, а также определял данные и записи, передаваемые вместе с оснасткой. Покупатель утвердил пресс-форму на заводе до начала производства.'
    - step: '07'
      title: 'Текущее управление'
      desc: 'Ежеквартальные бизнес-ревью с вице-президентом по продажам и главным инженером, зарезервированное право на аудит в ходе производства и путь эскалации к директору по качеству при любом спорном вопросе. Соглашение было совместно подписано вице-президентом по продажам, главным инженером и директором по качеству.'

trust_faqs:
  tagline: 'FAQ'
  title: '12 вопросов, которые покупатели задают до заказа'
  items:
    - q: 'iSupfactory действительно завод или торговая компания?'
      a: 'iSupfactory — это подразделение разработки и производства продуктов SUP компании Qingdao Vatrad Group Co., Ltd. Мы сами эксплуатируем площадку 12,500 m² в Циндао —проектирование, раскрой, сварка, сборка и испытания происходят на одной площадке. Передач на сторонних торговых компаний нет: люди, отвечающие на ваши вопросы, — это люди, которые строят ваши доски.'
    - q: 'С кем именно я буду работать во время проекта?'
      a: 'С назначенным проектным инженером и назначенным контактом по контролю качества, а также с руководителями подразделений, которые подписывают ваши документы. Вы можете попросить поговорить напрямую с главным инженером, директором по качеству или директором завода —до заказа и после. Между вами и теми, кто выполняет работу, нет слоя менеджеров по работе с клиентами.'
    - q: 'Могу ли я посетить или проаудировать завод?'
      a: 'Да. Мы принимаем посещения завода в зоне экономического развития Лайси, Циндао, и поддерживаем удаленный аудит в формате живого видеообхода. Аудит можно организовать независимо (ваш инспектор или третья сторона, например SGS, TÜV, BV или Intertek), а график аудита можно закрепить в договоре.'
    - q: 'Подпишете ли вы NDA до того, как я передам дизайн?'
      a: 'Да. Наше стандартное NDA подписывается в течение 4 рабочих часов с момента запроса —до передачи любых конфиденциальных спецификаций, макетов или технических файлов. Доступны двуязычные версии (английский/китайский), документ подписывается директором завода с нашей стороны.'
    - q: 'Как мне понять, что ваши заявления о качестве реальны?'
      a: 'За каждым утверждением на этом сайте стоит документ: SOP системы качества и стандарты инспекции доступны для скачивания, опубликованы обезличенные образцы записей контроля качества, а данные испытаний фиксируются по каждому серийному номеру с 10-летней ERP-прослеживаемостью партий. Вы также можете назначить стороннюю предотгрузочную инспекцию на ваш выбор.'
    - q: 'Что произойдет, если мои доски прибудут с дефектами?'
      a: 'Каждая доска проверяется до упаковки, а партийные записи позволяют проследить первопричину по каждому серийному номеру. Договор определяет обязательства по инспекции, замене и переделке, а партию выпускает директор по качеству. Переделанные доски испытываются полностью —никогда частично.'
    - q: 'Вы действительно можете испытать 100% досок до отгрузки?'
      a: 'Да —и записи это доказывают. Каждая камера накачивается до 18.0 PSI и выдерживается 24 часа с непрерывной регистрацией по датчикам; любая камера с падением давления более 0.50 PSI за 24 часа автоматически отбраковывается и проходит повторную инспекцию. Журналы испытаний связаны с каждым серийным номером и входят в документацию партии.'
    - q: 'Какими сертификатами вы на самом деле обладаете?'
      a: 'Менеджмент качества ISO 9001:2015, соответствие ISO 25649 и CE для продуктов — надувных SUP, а также соответствие BSCI, REACH и RoHS для площадки и материалов. Номера сертификатов и записи аудита предоставляются по запросу или в ходе аудита —перечень опубликован, а не «доступен только по запросу».'
    - q: 'Будет ли мой бренд в безопасности —дизайн, пресс-формы и рынок?'
      a: 'Да. Ваш бренд, дизайн и оснастка защищены NDA, условиями лицензии на бренд и положениями о праве собственности на пресс-форму или выкупе, закрепленными в договоре. Оснастка хранится для бренда и может быть передана. Условия по территории и эксклюзивности согласуются в письменной форме до начала производства.'
    - q: 'Каков ваш реальный MOQ?'
      a: 'MOQ определяется по каждому проекту и объясняется в нашем руководстве по MOQ: образцы 1–2 единицы, небольшие серии со-брендингом 5–10 единиц, пилотные партии 20–50 единиц и стандартный серийный объем 90–100+ единиц на 150-метровый рулон (около 180–220 досок). Формы из индивидуальных пресс-форм производятся на серийном уровне. Расчет подтверждается до коммерческого предложения —никаких расплывчатых цифр «низкого MOQ».'
    - q: 'Что произойдет, если производство задержится?'
      a: 'Срок изготовления подтверждается после согласования спецификации, макетов и упаковки —он никогда не обещается заранее. Договор охватывает график, уведомление о задержке и порядок разрешения споров, а ежеквартальное бизнес-ревью отслеживает выполнение поставок по согласованному календарю.'
    - q: 'Кто подписывает договорные документы с вашей стороны?'
      a: 'Заказы и соглашения совместно подписывают вице-президент по продажам, главный инженер и директор по качеству —три человека, отвечающие соответственно за коммерческие условия, инженерное исполнение и выпуск по качеству. Вы получаете подписанные документы вместе с договорными записями.'

governance:
  tagline: 'Структура ответственности'
  title: 'Назначенные подписанты и зарезервированные права'
  subtitle: 'Каждое обязательство привязано к конкретной роли, а не к отделу продаж.'
  body: |
    **Совместное согласование.** Заказы, планы качества и разрешения споров подписывают три роли: вице-президент по продажам (коммерческие условия), главный инженер (инженерное исполнение) и директор по качеству (выпуск по качеству). Двуязычные SOP находятся под контролем версий и используют ту же структуру подписей.

    **Зарезервированные права.** Покупатель сохраняет право аудировать производство, изучать протоколы испытаний и приостанавливать выпуск партии до подписания результатов инспекции. Переделка выполняется только по утвержденной записи об изменении, а выпуск подтверждает независимый контроль качества —никогда сами операторы, выполнявшие переделку.

    **Передаваемые записи.** Журналы партийных испытаний, сертификаты соответствия и отчеты об инспекции передаются с каждой отгрузкой, а партийная прослеживаемость ERP хранится 10 лет. Записи по оснастке и чертежи пресс-форм передаются вместе с оснасткой, если это предусмотрено договором.

