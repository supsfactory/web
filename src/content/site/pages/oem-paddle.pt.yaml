faqs:
  title: 'FAQ sobre a produção de paddles OEM'
  subtitle: 'Respostas às perguntas mais frequentes das marcas que lançam a sua própria paddle.'
  items:
    - title: 'Como crio a minha marca de paddles?'
      description: 'Lança a tua marca: briefing, design, protótipo certificado CE, produção em massa e entrega. Amostras em 7–12 dias, produção em 25–35 dias desde a encomenda e o sinal. Descobre os nossos pacotes OEM.'
    - title: 'Qual é o lead time de produção?'
      description: 'A amostra está pronta em 7–12 dias, a produção em massa em 25–35 dias após a encomenda e o sinal, consoante a quantidade.'
    - title: 'A paddle leva o nosso logótipo?'
      description: 'Sim — private label completo: impressão do logótipo, cores personalizadas, embalagem e etiquetas com a marca.'
    - title: 'Posso comprar grandes quantidades desde o primeiro dia?'
      description: 'O MOQ é confirmado com base no projeto — amostra (1–2 unidades), piloto (20–50 unidades) e volume padrão (90–100+ unidades por lote), com escalões de preço por grosso que crescem com a quantidade.'

