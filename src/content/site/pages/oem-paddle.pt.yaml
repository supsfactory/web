answer:
  label: 'Resposta breve'
  text: 'A quantidade mínima de encomenda é confirmada com base no projeto: amostra (1–2 unidades), piloto (20–50 unidades) e volume padrão (90–100+ unidades por lote de um rolo de drop-stitch de 150 m), com co-branding para pequenos lotes a partir de 5–10 unidades. As amostras partem em 7–12 dias; a produção em série continua por 25–35 dias após a encomenda e o sinal. A certificação CE para os modelos destinados ao mercado da UE e a documentação de conformidade completa estão incluídas em cada encomenda.'
  verified: 'September 2026'
  image:
    src: https://assets.supsfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Paddle OEM personalizada com o logótipo da marca
  actions:
