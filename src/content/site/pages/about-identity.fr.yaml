manufacturing_scope:
  heading: 'Périmètre de fabrication'
  body: |
    Notre périmètre de fabrication couvre toute la chaîne de production des SUP gonflables et des produits nautiques — de l'inspection d'entrée des matières premières jusqu'à l'emballage final et la documentation d'exportation.

    - **Catégories de produits** : planches de SUP gonflables (all-around, touring, surf, pêche, yoga, course), kayaks gonflables, bateaux gonflables, pagaies, pompes et accessoires.
    - **Types de construction** : PVC monocouche, PVC double couche, noyau drop-stitch avec enveloppe PVC. Spécifications de construction personnalisées par projet.
    - **Modèles de collaboration** : OEM (conception appartenant à l'acheteur), ODM (conception développée par l'usine à partir du cahier des charges acheteur), marque privée/co-branding (marque appliquée sur des plateformes éprouvées).
    - **Certifications** : ISO 9001:2015 (management de la qualité de l'usine), CE (modèles destinés à l'UE, périmètre selon projet), BSCI (conformité sociale), REACH (sécurité chimique), RoHS (substances restreintes).
    - **Capacité de production** : plus de 30 000 planches par an, plus de 2 500 unités par mois. Montée en cadence possible avec planification anticipée.

brand_positioning:
  heading: 'Positionnement de la marque'
  body: |
    SUPsfactory occupe une position spécifique sur le marché — nous ne sommes pas une marque, nous sommes un fabricant. Cette distinction façonne tous les aspects de notre fonctionnement :

    - **Nous ne vendons jamais sous notre propre marque.** Chaque planche que nous produisons porte la marque de l'acheteur. Nous ne concurrençons pas nos clients sur aucun marché, aucun canal. Cette politique n'est pas négociable.
    - **Nous ne sommes pas une société de négoce.** Nous exploitons l'usine. Le contrôle qualité, l'ingénierie, la planification de la production et la documentation d'exportation sont tous gérés en interne. Aucun intermédiaire entre votre commande et l'atelier de production.
    - **Nous sommes spécialisés dans les produits gonflables.** Ce n'est ni une activité secondaire ni une catégorie de produits parmi d'autres. Les SUP gonflables et les produits nautiques sont notre cœur de compétence. Chaque machine, chaque processus, chaque poste de contrôle qualité est optimisé pour cette catégorie de produits.
    - **Nous servons des acheteurs professionnels.** Nos clients sont des marques, des distributeurs, des opérateurs de resorts, des clubs et des écoles — pas des consommateurs individuels. Nos prix, notre structure de MOQ, notre documentation et notre communication sont conçus pour les relations B2B.

evidence_review:
  tagline: 'Preuves et vérification'
  title: 'SPÉCIFICATIONS VÉRIFIÉES'
  body: 'Toutes les allégations organisationnelles et de fabrication de cette page sont vérifiables. Le certificat ISO 9001, le rapport BSCI, la licence commerciale et les documents d''enregistrement de l''usine sont disponibles sur demande. Visites d''usine bienvenues. Spécifications dernièrement vérifiées en 2026-08.'

faqs:
  tagline: FAQ
  title: 'Identité de marque — Questions fréquentes'
  items:
    - q: 'SUPsfactory est-elle une société distincte de Qingdao Vatrad Group ?'
      a: 'Non. SUPsfactory est la marque orientée acheteurs d''Afarer, qui est la division de fabrication nautique de Qingdao Vatrad Group Co., Ltd. L''entité juridique contractante pour toutes les commandes est Qingdao Vatrad Group Co., Ltd. L''usine, l''équipe et le système qualité constituent une seule opération.'
    - q: 'Vendez-vous des planches sous votre propre marque ?'
      a: 'Non. Nous fabriquons exclusivement sous les marques de nos clients et ne les concurrençons jamais sur aucun marché. C''est une politique fondamentale — et non une position temporaire. Si vous trouvez sur le marché une planche de marque SUPsfactory, elle ne provient pas de notre usine.'
    - q: 'Puis-je visiter l''usine ?'
      a: 'Oui. Nous accueillons volontiers les visites d''usine et pouvons organiser un audit structuré couvrant l''ensemble du processus de production, les postes de contrôle qualité, l''entrepôt de matériaux et la revue documentaire. Contactez-nous pour planifier une visite.'
    - q: 'Quelle est la relation entre Afarer et SUPsfactory ?'
      a: 'Afarer est le nom de la division de fabrication au sein de Qingdao Vatrad Group. SUPsfactory est la marque internationale orientée acheteurs utilisée pour les services de fabrication OEM, ODM et en marque privée. Elles désignent la même opération — la division de fabrication nautique de Laixi, Qingdao.'

