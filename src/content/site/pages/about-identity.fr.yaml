  text: 'Entité juridique : Qingdao Vatrad Group Co., Ltd. Division de fabrication : Afarer (marque SUPsfactory). Usine : Laixi, Qingdao, Shandong, Chine. Périmètre : fabrication OEM, ODM et en marque privée de planches de SUP gonflables, de pagaies et d''embarcations nautiques. Certifications : ISO 9001:2015, CE (modèles destinés à l''UE), BSCI, REACH, RoHS. Nous ne vendons pas sous notre propre marque — chaque planche que nous produisons porte la marque de l''acheteur.'
