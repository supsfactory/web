      alt: Накачанные надувные доски SUP на заводском участке испытаний на герметичность под контролем цифрового манометра
      title: Участок испытаний на герметичность
      desc: 'Накачанные доски выдерживаются на испытательном участке ОКК при промышленном освещении, цифровые манометры контролируют утверждённое испытание на удержание воздуха у основания клапана, швов усилителя борта, носовой и кормовой зон и нагруженных участков. Записи ведутся по партиям и связываются с финальным контролем.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
