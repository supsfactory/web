faqs:
  tagline: FAQ
  title: Часто задаваемые вопросы о контроле качества SUP
  items:
    - q: 'Как QINGDAO VATRAD GROUP.,LTD. контролирует качество надувных досок SUP?'
      a: 'Качество контролируется через входной контроль материалов, контрольные точки производственного процесса, проверку готового изделия, контроль упаковки и производственную прослеживаемость, — каждый этап выполняется по утверждённым заказчиком образцам, спецификациям и критериям контроля.'
    - q: 'Какие проверки качества выполняются при производстве SUP?'
      a: 'Проверки включают подтверждение материалов, контроль раскроя и печати, контроль конструкции доски, проверку установки клапанов, контроль комплектующих, испытание на герметичность, визуальный контроль и проверку упаковки.'
    - q: 'Могут ли OEM-заказчики запросить записи контроля SUP?'
      a: 'Да. Записи контроля и документация по качеству могут быть предоставлены в соответствии с требованиями проекта и договорённостями о качестве с заказчиком, включая образцы отчётов о предотгрузочной инспекции.'
    - q: 'Как завод обеспечивает стабильность качества OEM-производства?'
      a: 'Стабильность поддерживается за счёт утверждённых образцов, технических спецификаций, производственных контрольных точек, процедур контроля и документированных процессов управления качеством, привязанных к каждому заказу.'
    - q: 'Могу ли я организовать стороннюю инспекцию SGS, BV, Intertek или QIMA?'
      a: 'Да. Мы принимаем сторонних инспекторов, предоставляя отдельный участок контроля, откалиброванные манометры, заполненные брифы по контролю и доступные записи. Передайте свою спецификацию, утверждённый образец, макет, требования к упаковке и критерии дефектов, — либо воспользуйтесь нашим шаблоном брифа для сторонней инспекции.'
    - q: 'Как обрабатываются изменения макета, BOM или упаковки в ходе производства?'
      a: 'Изменения фиксируются в нашем журнале управления изменениями с указанием затронутой ревизии документа, описания изменения, причины, оценки воздействия, статуса одобрения заказчиком и действующей партии. Устаревшие версии изымаются, чтобы производство и контроль всегда использовали действующие утверждённые документы.'
    - q: 'Поддерживает ли завод кастомные проекты надувных SUP?'
      a: 'Да. Кастомные проекты надувных SUP на условиях OEM/ODM поддерживаются на основе спецификаций заказчика, требований к макетам, конфигураций комплектующих и потребностей в упаковке, с согласованием специфичных для проекта критериев контроля до начала производства.'
    - q: 'Можно ли доработать протекающую доску SUP на заводе?'
      a: 'Да, — в контролируемых условиях. Доска помещается в статус HOLD и связывается с NCR, протечка локализуется утверждённым диагностическим методом, а доработка выполняется только после разрешения ОКК и инженерной службы и только в пределах классов дефектов, утверждённых для доработки. Затем доска повторно контролируется по тем же критериям приёмки, что и годная доска, до выпуска.'
    - q: 'Сколько раз завод может дорабатывать доску?'
      a: '''Одно место может быть доработано один раз по авторизованной инструкции. Если повторный контроль снова не пройден, доска направляется на замену, отклонение, списание или согласование с заказчиком, — повторная доработка без документированного одобрения не допускается.'

