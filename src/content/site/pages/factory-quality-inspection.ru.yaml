      title: Станция контролируемой доработки
      desc: 'Доработка герметичности выполняется на отдельной станции по утверждённой карточке метода: дефект отмечается, доска остаётся в статусе HOLD, а после требуемого периода отверждения возвращается на участок испытаний для повторного контроля по исходным критериям приёмки.'
    - image: https://assets.isupfactory.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Демонстрация физического разделения карантина на заводе в Циндао
      title: Демонстрация зоны карантина
      desc: '''Демонстрационная фотография из цеха, показывающая, как на площадке работает контролируемое разделение карантина: отделённые единицы остаются под управлением статусом до принятия уполномоченного решения.'

rework_intro:
  tagline: Управление доработкой
  title: Управление несоответствиями герметичности и доработкой
  body: |
    В QINGDAO VATRAD GROUP.,LTD. доработка определяется строго как восстановление несоответствующей единицы до полного соответствия исходной инженерной спецификации, а не как быстрое исправление. Любая доска с выявленным несоответствием по герметичности помещается под контролируемый запрет и связывается с протоколом о несоответствии (NCR) до дальнейшей обработки; источник протечки определяется и фиксируется утверждённым диагностическим методом.

    Доработка возможна только тогда, когда дефект входит в утверждённую область доработки и имеется авторизованный метод. Инструкция по доработке определяет изделие, партию, место дефекта, утверждённый материал, метод, необходимые условия и объём повторного контроля. После требуемого периода отверждения или стабилизации доска повторно контролируется по тем же применимым критериям приёмки, что и годная доска, — доработка никогда не снижает планку приёмки. Непрохождение повторного контроля требует нового инженерного решения и решения службы качества; повторная доработка не допускается без документированного одобрения.

rework_decision:
  tagline: Интерактивная схема
  title: Схема принятия решения по доработке — нажмите на любой узел
  subtitle: 'Проследите, как обрабатывается несоответствие герметичности, от обнаружения до выпуска или списания. Нажмите на узел, чтобы раскрыть требования контроля на этом шаге.'
  nodes:
    - id: detect
      type: start
      label: Обнаружена протечка
      detail: 'Несоответствие по герметичности выявлено при контроле, — неудержание давления, видимая утечка или связанный дефект воздушной системы.'
    - id: hold
      type: step
      label: Остановка линии · этикетка HOLD · NCR
      detail: 'Обработка останавливается. Фиксируются идентификатор доски, код изделия, партия, рабочее место, дата и инспектор; наклеивается этикетка HOLD / QUARANTINE и открывается NCR по применимой ревизии спецификации.'
    - id: locate
      type: step
      label: Определение источника протечки
      detail: 'Доска накачивается до согласованного для проекта диагностического давления, а источник определяется утверждённым методом, — удержание давления, откалиброванный пузырьковый метод, акустический метод или оборудование для выявления протечек.'
    - id: classify
      type: step
      label: Классификация дефекта (A–G)
      detail: 'Дефект классифицируется по матрице одобрения: A интерфейс клапана, B шов основания клапана, C поверхностный прокол, D локальный шов усилителя борта, E большой разрыв усилителя борта, F повторяющаяся протечка, G конструктивное повреждение.'
    - id: authorize
      type: decision
      label: Доработка разрешена?
      yes: rework
      no: escalate
      detail: 'ОКК подтверждает категорию дефекта, а инженерная служба оценивает, можно ли восстановить доску до исходной спецификации. В разрешении фиксируются карточка метода, материалы, условия и объём повторного контроля, — либо изделие направляется на замену, отклонение, списание или согласование с заказчиком.'
    - id: rework
      type: step
      label: Контролируемая доработка
      detail: 'Выполняется только в утверждённых границах дефекта с использованием утверждённой карточки метода, партии материала и оснастки, — без изменения габаритов, конструкции, графики, комплектующих или требований к упаковке.'
    - id: cure
      type: step
      label: Отверждение и стабилизация
      detail: 'Доска остаётся в статусе HOLD в течение периода отверждения и стабилизации, определённого утверждённой инструкцией по материалу и процессу, после чего проходит предварительную визуальную проверку и оценку качества изготовления.'
    - id: reinspect
      type: decision
      label: Повторный контроль пройден?
      yes: release
      no: escalate
      detail: 'Доска накачивается до согласованного для проекта давления повторного контроля, а исходный отказ и все потенциально затронутые характеристики проверяются заново, — место протечки, клапан, усилители борта, швы, зоны высоких напряжений, комплектующие и внешний вид. Доработка никогда не снижает планку приёмки.'
    - id: release
      type: release
      label: Выпуск по качеству
      detail: 'Служба качества проверяет закрытый NCR, запись о доработке и результат повторного контроля и разрешает выпуск. Ни одна доработанная доска не упаковывается и не отгружается без разрешённого выпуска по качеству.'
    - id: escalate
      type: escalate
      label: Эскалация — замена / списание / согласование
      detail: '''Повторная доработка без документированного одобрения не допускается. Доска направляется на замену, отклонение, списание или официальное согласование с заказчиком, если исходная спецификация не может быть восстановлена.'

defect_matrix:
  tagline: Классификация дефектов
  title: Классификация дефектов герметичности и матрица одобрения
  subtitle: Не каждая протечка подлежит доработке, — каждый дефект классифицируется, и его решение утверждается на нужном уровне, от инспектора ОКК до начальника завода.
  headers:
    category: Категория дефекта
    area: Типичная зона
    eligibility: Допустимость доработки
    approval: Требуемое одобрение
  rows:
    - category: 'Класс A — интерфейс клапана'
      area: 'Сердцевина клапана, уплотнение колпачка, прокладка, интерфейс насоса'
      eligibility: 'Стандартная доработка разрешена'
      approval: 'Инспектор ОКК'
    - category: 'Класс B — шов основания клапана'
      area: 'Микропротечка по периметру клапана'
      eligibility: 'Доработка оценивается по утверждённой карточке метода'
      approval: 'ОКК + инженерная служба'
    - category: 'Класс C — поверхностный прокол'
      area: 'Локальный микропрокол на ненагруженной поверхности'
      eligibility: 'Разрешена только при соответствии спецификациям заказчика'
      approval: 'ОКК + инженерная служба'
    - category: 'Класс D — локальный шов усилителя борта'
      area: 'Локальная протечка нахлёста на усилителе борта'
      eligibility: 'Высокий риск; требуется строгое инженерное решение'
      approval: 'Инженерная служба + начальник ОКК'
    - category: 'Класс E — большой разрыв усилителя борта'
      area: 'Непрерывный разрыв шва в зонах высоких напряжений'
      eligibility: 'Стандартная доработка не разрешена, — замена или анализ первопричины'
      approval: 'Начальник ОКК + согласование с заказчиком'
    - category: 'Класс F — повторяющаяся протечка'
      area: 'Нелокализуемая протечка или отказ при повторном испытании'
      eligibility: 'Повторная доработка не допускается; замена, списание или инженерный анализ первопричины'
      approval: 'Ведущий специалист ОКК / инженерная служба'
    - category: 'Класс G — конструктивное повреждение'
      area: 'Повреждение материала, расслоение, деформация доски'
      eligibility: 'Выпуск после доработки не разрешён, — замена, списание или письменное согласование с заказчиком'
      approval: 'Менеджер по качеству + одобрение заказчика'

rework_flow:
  tagline: 7-шаговый замкнутый цикл
  title: Контролируемый процесс доработки, от обнаружения до выпуска или списания
  subtitle: 'Каждая доработка герметичности проходит один и тот же контролируемый цикл: выявить, изолировать, диагностировать, согласовать, доработать, повторно проверить, выпустить.'
  steps:
    - step: '01'
      title: Обнаружение, остановка линии и карантин
      desc: 'Обработка немедленно останавливается на затронутой доске. Фиксируются идентификатор доски, код изделия, партия, рабочее место, дата и инспектор, наклеивается этикетка HOLD / QUARANTINE и открывается NCR по применимой ревизии спецификации.'
    - step: '02'
      title: Систематическая диагностика протечки
      desc: 'Доска накачивается до согласованного для проекта диагностического давления, а источник протечки определяется утверждённым методом, — удержание давления, откалиброванный пузырьковый метод, акустический метод или оборудование для выявления протечек. Предполагаемое место отмечается без повреждения доски.'
    - step: '03'
      title: Инженерное решение и разрешение
      desc: 'ОКК подтверждает категорию дефекта, а инженерная служба оценивает, можно ли восстановить доску до исходной спецификации. Разрешение на доработку со ссылкой на NCR фиксирует утверждённый метод, материалы, условия и объём повторного контроля, — либо назначает замену, отклонение, списание или согласование с заказчиком.'
    - step: '04'
      title: Контролируемое выполнение доработки
      desc: 'Доработка выполняется только в утверждённых границах дефекта с использованием утверждённой карточки метода, партии материала и оснастки. Габариты доски, конструкция, графика, конфигурация комплектующих и требования к упаковке никогда не изменяются.'
    - step: '05'
      title: Стабилизация после отверждения и предварительная проверка
      desc: 'Доработанная доска остаётся в статусе HOLD в течение периода отверждения и стабилизации, определённого утверждённой инструкцией по материалу и процессу, после чего проходит предварительную визуальную проверку и оценку качества изготовления перед повторным контролем.'
    - step: '06'
      title: Повторный контроль и подтверждающие испытания
      desc: 'Доска накачивается до согласованного для проекта давления повторного контроля, а исходный отказ и все потенциально затронутые характеристики проверяются заново: место протечки и прилегающая зона, клапан, усилители борта, швы, зоны высоких напряжений, комплектующие и внешний вид. Доработка никогда не снижает планку приёмки.'
    - step: '07'
      title: Выпуск ОКК или окончательное решение
      desc: 'Служба качества проверяет завершённый NCR, запись о доработке и результат повторного контроля, а затем разрешает выпуск, — либо направляет изделие на замену, отклонение, списание или согласование с заказчиком. Ни одна доработанная доска не упаковывается и не отгружается без разрешённого выпуска по качеству.'

quality_safeguards:
  tagline: Средства защиты качества
  title: Правила защиты от ошибок, которые берегут ваш бренд
  subtitle: 'Жёсткие контроли, исключающие неконтролируемые циклы ремонта, — одна документированная доработка на дефект, пороги остановки на уровне партии, откалиброванные приборы и контролируемые условия испытаний.'
  features:
    - icon: 1
      icon_bg: blue
      title: Одна доработка на дефект
      desc: 'Одно место может быть доработано один раз по авторизованной инструкции. Если повторный контроль снова не пройден, доска направляется на замену, отклонение, списание или согласование с заказчиком, — повторная доработка без документированного одобрения не допускается.'
    - icon: 2
      icon_bg: green
      title: Остановка линии по порогу партии
      desc: 'Если доля несоответствий в производственной партии превышает установленный инженерной службой порог, линия останавливается, а инженерная служба исследует причину, — партию материала, технологические условия и записи, — до возобновления производства.'
    - icon: 3
      icon_bg: purple
      title: Откалиброванные приборы
      desc: 'Манометры, цифровые измерители давления и таймеры, используемые для испытаний на герметичность, находятся под контролем и калибруются сторонними лабораториями в пределах срока действия, при этом статус калибровки виден на участке контроля.'
    - icon: 4
      icon_bg: orange
      title: Контролируемые условия испытаний
      desc: '''Участки испытаний на герметичность и отверждения содержатся в контролируемой среде, чтобы результаты не зависели от перепадов температуры между днём и ночью.'

rework_boundaries:
  tagline: Область и границы
  title: Что эта система не охватывает
  body: |
    Система управления доработкой применяется к готовым или находящимся в производстве надувным доскам SUP с выявленными утечками воздуха, неудержанием давления или связанными дефектами воздушной системы до выпуска на отгрузку. Она не разрешает изменения утверждённых конструкции, материалов, графики, конфигурации изделия или требований заказчика и не охватывает:

    - Изделия, уже отгруженные или находящиеся в каналах заказчика.
    - Конструктивные повреждения или деформацию досок, не оценённые инженерной службой.
    - Массовые разрывы усилителя борта или швов, повреждения основного материала, а также дефекты, которые могут повлиять на безопасность.
    - Проекты, где доработка не допускается: утверждённые заказчиком образцы, сертификационные или испытательные образцы.
    - Проекты с особыми процессами заказчика, специальными материалами или специальными требованиями к ремонту.
    - Повторяющуюся протечку, которую невозможно локализовать, или доски, повторно не выдержавшие испытание после доработки.

    Любое отклонение от спецификаций заказчика требует документированного инженерного рассмотрения и, где применимо, письменного одобрения заказчика. Доски, которые невозможно восстановить до исходной спецификации, выпускаются только при официальном согласовании с заказчиком, — никогда производством самостоятельно.

method_cards:
  tagline: Система карточек метода
  title: Указатель контролируемых карточек метода доработки
  subtitle: 'Общая инструкция управляет процессом; карточки метода управляют операцией. Инструкция по доработке (WI-QC-AT-001) ссылается на карточки метода MC-RW-01 и MC-RW-06, а также MC-RW-00 для обязательного списания и отклонения.'
  headers:
    code: Карточка метода
    defect: Класс дефекта
    scope: Область применения
    controls: Ключевые инженерные контроли
    approval: Полномочия по подписанию
  rows:
    - code: MC-RW-01
      defect: Класс A (интерфейс клапана)
      scope: 'Обслуживание сердцевины клапана, очистка уплотнений и повторная сборка'
      controls: 'Откалиброванный моментный ключ, чистое посадочное место прокладки, без повреждения резьбы клапана'
      approval: 'Инспектор ОКК'
    - code: MC-RW-02
      defect: Класс B (периметр клапана)
      scope: 'Герметизация фланца основания клапана и контролируемый зажим'
      controls: 'Контролируемая подготовка поверхности, утверждённый материал для соединения, круговое приспособление для давления'
      approval: 'ОКК + инженерная служба'
    - code: MC-RW-03
      defect: Класс C (поверхностная микропротечка)
      scope: 'Герметизация ненагруженного прокола'
      controls: 'Утверждённый двухкомпонентный клей без вытекания на графику или EVA'
      approval: 'ОКК + инженерная служба'
    - code: MC-RW-04
      defect: Класс D (локальный шов усилителя борта)
      scope: 'Повторное соединение локального нахлёста усилителя борта'
      controls: 'Активация нагревом с контролем температуры, прикатный валик, приспособление против скручивания'
      approval: 'Инженерная служба + начальник ОКК'
    - code: MC-RW-05
      defect: Класс B/C (периметр комплектующих)
      scope: 'Герметизация заплатки короба плавника и основания крепления комплектующих'
      controls: 'Промотор адгезии поверхности, профильный прижимной блок, определённая длительность выдержки'
      approval: 'ОКК + инженерная служба'
    - code: MC-RW-06
      defect: Класс D (шов носа и кормы)
      scope: 'Вмешательство в шов с высокой кривизной в зоне высоких напряжений'
      controls: 'Утверждённый материал для соединения с высоким сдвигом, увеличенный период отверждения до повторного испытания'
      approval: 'Главный инженер'
    - code: MC-RW-00
      defect: Класс E/F/G (критический / разрыв)
      scope: 'Обязательное списание и физическое уничтожение'
      controls: 'Физический отрез для предотвращения смешения, запись о списании, межотдельный анализ первопричины'
      approval: 'Начальник завода'

inspector_friendly:
  tagline: Сторонний контроль
  title: Протокол, удобный для инспекторов
  body: |
    Мы предоставляем отдельный участок контроля с откалиброванными манометрами, стандартизированными столами с подсветкой для проверки швов и графики, а также заполненными брифами по контролю, чтобы сторонние агентства (SGS, BV, Intertek, QIMA) могли эффективно провести предотгрузочный контроль, — сокращая ваши затраты на инспекцию.

    Каждый бриф суммирует применимые ревизии документов, ссылку на утверждённый образец, критичные для качества проверки, согласованный уровень выборки, функциональные испытания, а также требования к упаковке и штрихкодам для данного PO. Указанные количества, качество, упаковка и базовые требования безопасности сверяются с утверждёнными проектными ссылками, — без срочного поиска документов на площадке.

