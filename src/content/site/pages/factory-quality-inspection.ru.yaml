      title: Станция удержания и карантина
      desc: 'Станция контроля с контрольными листами ОКК и этикетированием статуса. Любое изделие, не соответствующее критериям приёмки, маркируется, регистрируется и переносится в карантин, — оно не может перейти к упаковке до принятия уполномоченного решения и обязательного повторного контроля.'
