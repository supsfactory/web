answer:
  label: 'Прямой ответ'
  text: 'QINGDAO VATRAD GROUP.,LTD. управляет качеством надувных SUP через 4-этапную систему проверки: входной контроль материалов (IQC), контроль в процессе производства (IPQC), финальные испытания досок и проверка с накачиванием (FQC), а также упаковка и выпуск перед отгрузкой (OQC). Каждый заказ контролируется по утверждённому образцу, технической спецификации, подписанному макету, BOM и стандартам упаковки, с проверкой герметичности, визуальным и размерным контролем, подтверждением комплектующих и прослеживаемостью партий. Изделия, не соответствующие критериям приёмки, помещаются под контролируемый запрет или карантин, дорабатываются только по утверждённым инструкциям и повторно контролируются до разрешённого выпуска.'
  verified: 'Сентябрь 2026'

intro: 'Наша система качества построена для проектов OEM/ODM: критерии контроля определяются для каждого заказа, документируются и соблюдаются производственной командой и службой качества от входного материала до упаковки. Это синхронизирует ожидания по качеству между заводом и вашим брендом от первого образца до полных контейнерных отгрузок.'

scope_note:
  tagline: Область действия
  title: Специфичные для проекта критерии контроля
  body: |
    Спецификации качества могут различаться в зависимости от конструкции доски (например, однослойная или двухслойная, тканый drop-stitch, сплавной усилитель борта), предполагаемого конечного применения, нормативов целевого рынка и параметров, утверждённых заказчиком. Разрешение на финальный выпуск строго основано на документированных критериях контроля, согласованных для заказа.

stages:
  tagline: Структура качества
  title: Наша 4-этапная система проверки качества
  subtitle: Полный цикл ОКК от прибытия сырья до выпуска на отгрузку.
  steps:
    - title: '1. Входной контроль материалов (IQC)'
      desc: 'Основные материалы и покупные комплектующие проверяются на соответствие утверждённым спецификациям и эталонным образцам до поступления на производственную линию. Для drop-stitch и PVC подтверждаются идентификация материала, партия поставщика, вес и плотность, толщина, соответствие цвета утверждённым образцам и отсутствие дефектов поверхности. Тяговые накладки из EVA проверяются на рисунок, цвет, толщину, точность раскроя и совместимость с клеем. Клапаны и фурнитура проходят испытания функционирования, резьбы, целостности уплотнений и посадки. Комплектующие и упаковка (насосы, весла, плавники, линчи, сумки, коробки) сверяются по количеству, цвету, брендингу, корректности штрихкодов и версии макета с утверждённой BOM.'
    - title: '2. Контроль качества в процессе (IPQC)'
      desc: 'Критичные технологические операции контролируются, чтобы выявить несоответствия до перехода досок на следующие рабочие места. Раскрой и печать проверяются на размеры панелей, расположение макета, зеркальную ориентацию и чистоту кромок по утверждённым чертежам. Сборка доски и соединение усилителя борта проверяются на симметрию контура, непрерывность нахлёста швов и отсутствие пустот и воздушных карманов в зонах высоких напряжений. Установка клапанов и комплектующих, нанесение графики и брендинга проверяются по положению, ориентации, площади нанесения клея, правильности написания логотипа и версии макета.'
    - title: '3. Финальные испытания доски и проверка с накачиванием (FQC)'
      desc: 'Готовые доски проходят обязательные физические и конструктивные испытания до разрешения упаковки. Доски накачиваются до согласованного для проекта контрольного давления и выдерживаются для проверки конструктивной жёсткости и стабильности давления. Сканирование герметичности охватывает корпус клапана, швы усилителя борта, носовую и кормовую зоны и нагруженные соединения с использованием откалиброванных методов выявления протечек (контроль падения давления или пузырьковый метод). Визуальный и размерный контроль проверяет габариты, профиль rocker и выравнивание накладок EVA (допуск ±2 mm) при освещении по стандарту дневного света.'
    - title: '4. Упаковка и выпуск перед отгрузкой (OQC)'
      desc: '''Комплексная проверка перед отгрузкой исключает нулевое расхождение конфигурации SKU или транспортных маркировок. Комплектность сверяется по доске, плавнику, линчу, веслу, насосу, сумке, ремкомплекту и руководству пользователя с BOM заказа. Проверка упаковки и штрихкодов подтверждает маркировку коробок, этикетки SKU, читаемость штрихкодов, язык руководства и конструктивную целостность коробок. Заказы выпускаются только после подписания финального аудита упаковки уполномоченными специалистами по качеству.'

inspection_points:
  tagline: Охват контроля
  title: Ключевые контрольные точки
  subtitle: Каждый контрольный пункт выполняется по документированным критериям приёмки, согласованным для заказа.
  features:
    - icon: A
      icon_bg: blue
      title: Проверка герметичности
      desc: 'Готовые доски накачиваются до утверждённого контрольного давления и проверяются на удержание давления, состояние основания клапана, швы усилителя борта, носовую и кормовую зоны и нагруженные участки. Там, где этого требует процедура контроля, предполагаемые зоны протечки исследуются утверждёнными методами выявления протечек.'
    - icon: B
      icon_bg: green
      title: Визуальный и размерный контроль
      desc: 'Доски контролируются при подходящем освещении на состояние поверхности материала, дефекты печати, отклонения цвета, выравнивание EVA, морщины, царапины, загрязнения и вид соединений. Ключевые размеры и положения комплектующих сверяются с утверждёнными чертежами или спецификациями.'
    - icon: C
      icon_bg: purple
      title: Проверка комплектующих и упаковки
      desc: 'Полная конфигурация изделия проверяется перед отгрузкой: модель доски, система плавников, весло, насос, линч, сумка для переноски, ремкомплект, руководство пользователя и комплектующие заказчика, — каждая позиция сверяется с утверждённым образцом, чертежами и BOM.'
    - icon: D
      icon_bg: orange
      title: Упаковка и выпуск на отгрузку
      desc: '''Упакованные единицы проверяются на конфигурацию SKU, комплектность комплектующих, этикетки изделия, данные штрихкодов, версию руководства, маркировку коробок, количество в упаковке и состояние коробок. Выпуск на отгрузку разрешается только после выполнения всех требований контроля и упаковки.'

traceability_intro:
  tagline: Прослеживаемость партий
  title: Система прослеживаемости на уровне проекта и партии
  body: |
    Каждый заказ кастомной SUP ведётся под единым кодом проекта, связывающим технические спецификации, утверждённую BOM, ревизии макетов, номера партий материалов, упаковочные ссылки и записи контроля. Производственные и контрольные записи ведутся по соответствующему проекту и производственной партии, и каждую партию можно проследить до утверждённой спецификации изделия, BOM, макета и упаковочных ссылок.

    Это обеспечивает эффективный анализ конфигурации изделия, статуса контроля и затронутой области при выявлении вопроса к качеству, — от готового изделия до исходных записей по идентификатору доски или коробки.

traceability_chain:
  tagline: Цепочка прослеживаемости
  title: От кода проекта до выпуска на отгрузку
  subtitle: Единая цепочка контролируемых ссылок от подтверждения заказа до разрешённой отправки.
  steps:
    - step: '01'
      title: Код проекта
      desc: Единая ссылка на проект, связывающая каждый контролируемый документ с заказом.
    - step: '02'
      title: Ревизии документов
      desc: Действующие уровни ревизий спецификации, BOM, макета и упаковки, — для производства действительны только утверждённые версии.
    - step: '03'
      title: Партия и материалы
      desc: Партии материалов и комплектующих, зафиксированные за производственной партией.
    - step: '04'
      title: Записи контроля
      desc: Результаты входного, внутрипроизводственного, герметичности, финального и упаковочного контроля по каждой партии.
    - step: '05'
      title: Упаковка и выпуск
      desc: Упаковочная партия, статус закрытия NCR и сводка разрешённого выпуска на отгрузку.

traceability_sample:
  tagline: Обезличенный образец
  title: Запись управления прослеживаемостью (демо)
  body: |
    Демонстрационные значения приведены только для иллюстрации, — имена заказчиков, номера PO, индивидуальные макеты, данные поставщиков и коммерческая информация удалены для соблюдения конфиденциальности.

    - **Изготовитель:** QINGDAO VATRAD GROUP, LTD.
    - **Код проекта:** DEMO-SUP-2026-01
    - **Ссылка SKU:** DEMO-TR-126
    - **Производственная партия:** BATCH-AUG-01
    - **Спецификация / BOM / ревизия макета:** Rev B / Rev C / Rev B
    - **Запись герметичности:** PASS — хранится по партиям
    - **Статус контроля:** PASS
    - **Статус отгрузки:** RELEASED

quarantine_intro:
  tagline: Управление несоответствиями
  title: Управление несоответствующей продукцией и карантин
  body: |
    Изделия или компоненты, не отвечающие установленным критериям приёмки, чётко идентифицируются и помещаются под контролируемый запрет или карантин. Они не могут переходить к следующему этапу производства, упаковке или отгрузке до принятия уполномоченного решения. Доработка выполняется по утверждённым инструкциям и связывается с соответствующей записью о несоответствии; доработанные изделия повторно контролируются на соответствие применимым требованиям проекта до выпуска по качеству.

quarantine_flow:
  tagline: 7-шаговый поток управления
  title: Что происходит при обнаружении несоответствия
  subtitle: 'Выявить, локализовать, устранить, проверить, — затем выпустить или отклонить. Несоответствующая продукция никогда не возвращается в производство или упаковку без контроля.'
  steps:
    - step: '01'
      title: Выявление
      desc: Несоответствие фиксируется по отношению к затронутой продукции, SKU, партии или этапу процесса.
    - step: '02'
      title: Маркировка
      desc: Затронутые изделия чётко идентифицируются контролируемыми этикетками статуса, — HOLD, QUARANTINE или REJECTED.
    - step: '03'
      title: Карантин
      desc: Изделия физически разделяются в контролируемой зоне карантина или изолируются средствами системы, чтобы исключить непреднамеренное использование или отгрузку.
    - step: '04'
      title: Оценка области
      desc: Затронутая область анализируется по партиям, этапам процесса, партиям материалов и ревизиям документов.
    - step: '05'
      title: Доработка или замена
      desc: Устранение допускается только на основании утверждённого решения и контролируемой рабочей инструкции.
    - step: '06'
      title: Повторный контроль
      desc: Исправленные изделия повторно контролируются на соответствие применимым критериям приёмки до выпуска.
    - step: '07'
      title: Выпуск или отклонение
      desc: Только уполномоченная годная продукция переходит к упаковке или выпуску на отгрузку.

quarantine_evidence:
  tagline: На заводской площадке
  title: Контролируемые испытания и карантин на практике
  subtitle: 'Фотографии с нашего цеха в Циндао показывают, как на площадке применяются управление статусами и записи контроля.'
