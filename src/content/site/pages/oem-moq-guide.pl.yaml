moq_stages:
  tagline: Próbka · Pilotaż · Wolumen
  title: 'Trzy odrębne etapy ilościowe'
  subtitle: 'Ilości produkcji próbnej, pilotażowej i seryjnej są różne. Każdy projekt klasyfikujemy do trzech odrębnych progów, abyś mógł zweryfikować przed zobowiązaniem.'
  steps:
    - step: '01'
      title: 'Opracowanie próbki (1–2 szt.)'
      desc: 'Fizyczne potwierdzenie sztywności kadłuba, faktury nakładki EVA, wierności grafiki i dopasowania akcesoriów przed jakimkolwiek zobowiązaniem finansowym. Obowiązują opłaty za próbkę, które zaliczają się na Twoje zamówienie produkcyjne po podpisaniu umowy.'
    - step: '02'
      title: 'Zamówienie pilotażowe (20–50 szt.)'
      desc: 'Komercyjne testy przedsezonowe i walidacja rynku regionalnego na gotowych platformach kadłubów, standardowych materiałach i uproszczonym opakowaniu, aby zminimalizować tarcia przy uruchomieniu.'
    - step: '03'
      title: 'Produkcja seryjna (90–100+ szt.)'
      desc: 'Potwierdzona po zamrożeniu BOM, finalizacji projektu graficznego, niestandardowym opakowaniu i ustaleniu planu dostaw — pełne rolki tkaniny 150 m, niestandardowe tkaniny Pantone, opakowanie na zamówienie, rabaty wolumenowe i identyfikowalność całego łańcucha dla partii.'

