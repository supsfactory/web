moq_faqs:
  tagline: FAQ
  title: 'Najczęściej zadawane pytania o MOQ'
  items:
    - q: 'Czy MOQ liczy się na zamówienie, na model czy na kolorystykę?'
      a: 'MOQ może obowiązywać na model, kolorystykę, wersję grafiki, konfigurację opakowania lub całe zamówienie. Ponieważ różne grubości drop-stitch (12 cm a 15 cm) i kolory PCV pochodzą z odrębnych rolek surowca, zamówienie 50 desek rozłożone na 5 kolorów tworzy 5 odrębnych wymagań dotyczących rolek tkaniny. Dokładne obliczenie potwierdzamy względem Twojej macierzy SKU przed wyceną, abyś mógł jasno zaplanować mieszankę.'
    - q: 'Czy mogę zamówić próbkę przed produkcją hurtową?'
      a: 'Tak. Opracowanie próbki (1–2 szt.) potwierdza sztywność kadłuba, fakturę nakładki EVA, wierność grafiki i dopasowanie akcesoriów przed uruchomieniem masowej produkcji. Obowiązują opłaty za próbkę, które zaliczają się na Twoje zamówienie produkcyjne po podpisaniu umowy.'
    - q: 'Dlaczego niestandardowe opakowanie detaliczne ma własne MOQ?'
      a: 'Drukarki fleksograficzne i offsetowe do kartonów wymagają minimalnego nakładu uruchomieniowego 500+ szt. Oferujemy hybrydowe rozwiązanie magazynowe opakowań: wytwarzamy 500 niestandardowo drukowanych kartonów, przechowujemy nadmiar w naszym czystym magazynie i wydajemy go w ramach Twoich zaplanowanych wysyłek desek — dzięki temu mniejsze zamówienie desek nadal może trafić w pełni brandowane opakowanie detaliczne.'
    - q: 'Dlaczego standardowe MOQ wolumenowe to 90–100 szt.?'
      a: 'Standardowe MOQ wolumenowe wynika z surowca: rolka główna 150 m wysokogładzinowej tkaniny drop-stitch daje około 90–100 gotowych desek dla standardowego kadłuba turingowego lub allround. Praca na pełnych rolkach eliminuje łączenia tkaniny, utrzymuje jednorodne napięcie włókien i amortyzuje 2-godziną kalibrację linii zgrzewania i laminowania — dając najniższy możliwy koszt jednostkowy.'
    - q: 'Czy większa ilość obniża koszt jednostkowy?'
      a: 'W większości projektów tak. Wyższe ilości poprawiają wydajność materiału, rozłożą stałe koszty uruchomienia linii na więcej desek i obniżają koszt opakowania na sztukę.'
    - q: 'Czy przy zamówieniach powtarzalnych ponownie pobierane są opłaty za formy współmarkowania?'
      a: 'Nie. Opłaty za formy sitograficzne pobieramy jednorazowo przy uruchomieniu i zwalniamy przy zamówieniach powtarzalnych o tym samym wymiarze grafiki. Płacisz tylko $1.00 USD za deskę na obsługę fabryki i druk.'
    - q: 'Czy prośba o doradztwo w sprawie MOQ zobowiązuje mnie do zamówienia?'
      a: 'Nie. Prośba o doradztwo w sprawie MOQ projektu po prostu pozwala naszemu zespołowi inżynieryjnemu w Qingdao Vatrad Group Co., Ltd. przeanalizować Twój brief techniczny i wskazać najbardziej opłacalną ścieżkę produkcji. Umowa poufności (NDA) jest dostępna przed udostępnieniem chronionych specyfikacji technicznych lub projektu graficznego.'

evidence_review:
  tagline: 'Dowody i weryfikacja'
  title: 'ZWERYFIKOWANE SPECYFIKACJE'
  body: 'Wszystkie deklaracje produkcyjne na tej stronie są weryfikowane przez nasz zespół inżynierii produkcyjnej w fabryce w Laixi, w Qingdao. Certyfikaty, zapisy kontroli jakości, raporty z prób ciśnieniowych i wytrzymałościowych oraz rejestry identyfikowalności partii są dostępne na żądanie. Specyfikacje zweryfikowano ostatnio we wrześniu 2026.'

