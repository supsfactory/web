answer:
  label: 'Wprost'
  text: 'MOQ to nie jedna liczba, która pasuje do wszystkich. Każde MOQ potwierdzamy wg konfiguracji projektu: kształt kadłuba i narzędzia, kolorystyka i PCV, złożoność grafiki, opakowanie i zestaw akcesoriów. Produkcja seryjna na zamówienie to 90–100 szt. na partię ze standardowej rolki tkaniny drop-stitch 150 m; współmarkowanie w małej serii zaczyna się od 5–10 szt.; a każdy projekt dzielimy na trzy odrębne etapy — opracowanie próbki (1–2 szt.), zamówienie pilotażowe (20–50 szt.) i produkcja seryjna (90–100+ szt.). Dokładne obliczenie dla Twojej mieszanki SKU potwierdzamy przed wyceną — żadnych mglistych obietnic „niskiego MOQ” ani ukrytych kompromisów.'
  verified: 'Wrzesień 2026'

moq_principle:
  tagline: Logika inżynieryjna
  title: 'Dlaczego standardowe MOQ wolumenowe to 90–100 szt.: fizyka rolki surowca'
  subtitle: 'Wielkości serii produkcyjnych nie są dowolnymi liczbami ustalanymi przez zespół sprzedaży — wynikają z długości rolek tkaniny drop-stitch i fizyki przezbrodzeń na linii.'
  body: |
    **Wzorcowa długość 150 metrów tkanicy surowej.** Tkanina drop-stitch o wysokiej wytrzymałości na rozciąganie jest produkowana i powlekana na ciągłych rolkach głównych. Standardowa długość pojedynczej rolki przemysłowej wynosi 150 metrów ciągłego materiału.

    **Obliczenie wydajności (90 do 100 desek).** Ze standardowego kadłuba turingowego lub allround (10 ft 6 in do 11 ft 6 in) pełna rolka główna 150 m daje około 90 do 100 gotowych desek paddle.

    **Zasada zero łączeń tkaniny.** Pełne rolki zapewniają ciągłość konstrukcji — brak poprzecznego łączenia tkaniny, które jest punktem wysokiego ryzyka, oraz jednorodne napięcie włókien na górnej i dolnej powierzchni deski.

    **Kalibracja termiczna i klejowa.** Zautomatyzowane linie zgrzewania gorącopowietrznego o wysokiej częstotliwości i laminowania morskiego klejem wymagają 2 godzin nagrzewania, profilowania temperatury i kalibracji ciśnienia. Pełna partia 90–100 szt. amortyzuje te stałe koszty uruchomienia, dając najniższy możliwy koszt jednostkowy.

