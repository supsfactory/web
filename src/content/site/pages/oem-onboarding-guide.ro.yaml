checklist:
  heading: 'Ce trebuie să pregătiți înainte de fișa de proiect'
  body: |
    Cu cât fișa este mai completă, cu atât oferta este mai rapidă și mai exactă. Iată ce ar trebui să aveți la îndemână:

    - **Specificațiile plăcii** — Lungimea, lățimea și grosimea țintă, intervalul de greutate al sportivului și utilizarea intenționată (touring, all-around, surf, pescuit, yoga etc.). Dacă aveți dimensiuni de referință sau un model concurent, includeți-le.
    - **Fișierele de proiectare** — Artwork vectorial (AI, SVG sau PDF) pentru grafica plăcii, logo-ul de pe suprapușul EVA și orice branding secundar. Dacă artwork-ul nu este gata, un panou de moodboard sau imagini de referință sunt suficiente pentru fezabilitatea inițială.
    - **Volumul comenzii și termenul** — Cantitatea țintă pentru prima comandă și programarea sezonieră pe care trebuie să o respectați. Chiar și un interval aproximativ („20–50 de plăci până în martie”) este suficient pentru a confirma fezabilitatea și disponibilitatea slotului.
    - **Cerințele de conformitate** — Piețele țintă (UE, America de Nord, Australia etc.) și orice cerință specifică de certificare sau testare dincolo de domeniul nostru standard (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Intervalul de buget** — Un buget orientativ pe placă sau un cost final țintă ne ajută să recomandăm platforma și nivelul de construcție potrivite. Prețul exact se confirmă după analiza de inginerie — niciodată înainte.

    Dacă nu aveți încă toate aceste elemente, trimiteți ce aveți. Noi vă vom ghida pentru restul.

evidence_review:
  tagline: 'Dovezi și verificare'
  title: 'SPECIFICAȚII VERIFICATE'
  body: 'Toate afirmațiile de producție de pe această pagină sunt verificate de echipa noastră de inginerie de producție în fabrica din Laixi, Qingdao. Certificatele, înregistrările de inspecție, rapoartele de testare la presiune și structură și jurnalele de trasabilitate a loturilor sunt disponibile la cerere. Specificațiile au fost verificate ultima dată în septembrie 2026.'

faqs:
  tagline: FAQ
  title: 'Integrare OEM — întrebări frecvente'
  items:
    - q: 'Cât durează întregul proces de integrare?'
      a: 'Aprobarea mostrelor durează de obicei 2–4 săptămâni (inclusiv producția mostrelor în 7–12 zile și perioada dumneavoastră de evaluare). Primul lot de producție durează 6–8 săptămâni de la comanda confirmată și de la avans. O formă personalizată a corpului de apă adaugă 15–20 de zile pentru dezvoltarea formei. Fiecare poartă are un termen fix asupra căruia conveniți în prealabil.'
    - q: 'Trebuie să semnez un NDA înainte de a-mi partaja proiectarea?'
      a: 'Un NDA este disponibil imediat la cerere — înainte de a partaja orice specificație tehnică sau artwork confidențial. Noi fabricăm exclusiv sub mărcile clienților și nu concurăm niciodată cu ei pe nicio piață. Aceeași politică se aplică unei mostre de 1 placă și unui program de un container întreg.'
    - q: 'Care este comanda minimă pentru un prim lot OEM?'
      a: 'Punctul de intrare este eșalonat: mai întâi 1–2 mostre (gata în 7–12 zile), apoi o comandă de încercare sau pilot de 20–50 de plăci (producție în 25–35 de zile), apoi loturi de volum standard de 90–100+ plăci pe configurație aprobată. Co-branding-ul în loturi mici începe de la 5–10 bucăți, atunci când nu este necesară nicio etapă de dezvoltare. Taxele pentru mostre sunt creditate la comanda de producție.'
    - q: 'Cum este gestionată protecția proprietății intelectuale în timpul integrării?'
      a: 'Proiectările și specificațiile dumneavoastră sunt protejate prin NDA-ul semnat înainte de partajarea oricărei informații confidențiale. Toate artwork-urile, datele listei de materiale și fișierele tehnice sunt stocate în sisteme cu acces controlat și urme de audit. În modul OEM, drepturile de proprietate intelectuală vă aparțin integral. În modul ODM, drepturile asupra platformei adaptate sunt partajate conform acordului. În modul Private Label, drepturile rămân la iSupfactory, iar dumneavoastră licențiați aplicarea mărcii.'
    - q: 'Ce garanții de calitate se aplică unei prime comenzi?'
      a: 'Fiecare placă — mostră, lot de încercare sau volum — trece prin același sistem de porți de inspecție în 7 etape: inspecția materialelor la intrare, inspecția țesăturii drop-stitch, sudura și asamblarea, testarea la presiune și de etanșeitate pe 24 de ore (menținere la 18.0 PSI, respingere automată la o scădere de peste 0.50 PSI), montarea suprapușurilor EVA și a accesoriilor, controlul graficii și al branding-ului, precum și ambalarea finală și documentația. Calitatea nu este niciodată redusă pentru comenzi mai mici.'

