answer:
  label: 'Răspuns direct'
  text: 'O integrare OEM tipică durează 2–4 săptămâni pentru aprobarea mostrelor și 6–8 săptămâni pentru primul lot de producție, de la comanda confirmată. Începeți prin trimiterea unei fișe de proiect (specificații ale plăcii, volum, cerințe de conformitate). Noi răspundem în decurs de o zi lucrătoare, oferim un NDA înainte de a partaja detalii confidențiale și producem 1–2 mostre fizice în 7–12 zile, pentru evaluarea și aprobarea dumneavoastră. Odată cu blocarea mostrei, urmează planificarea producției și fabricarea, cu porți de control al calității fixe la fiecare etapă. Fiecare pas este documentat și trasabil.'
  verified: 'Septembrie 2026'

process_steps:
  tagline: Cele șapte porți
  title: 'Fluxul de integrare — șapte porți, de la fișă la livrare'
  subtitle: 'Fiecare poartă are un intrare definit, un rezultat definit și un termen asupra căruia conveniți în prealabil. Nu veți trece de o poartă fără o validare explicită.'
  steps:
    - step: 'Poarta 1'
      title: 'Solicitare inițială și NDA (Ziua 0)'
      desc: 'Trimiteți o fișă de proiect prin /ro/contact cu specificațiile țintă ale plăcii, volumul comenzii, cerințele de conformitate și termenul dorit. Un NDA este disponibil imediat — înainte de a partaja orice specificație tehnică sau artwork confidențial. Răspundem în decurs de o zi lucrătoare.'
    - step: 'Poarta 2'
      title: 'Analiză de fezabilitate și ofertă (Zilele 1–5)'
      desc: 'Ingineria analizează fișa dumneavoastră din punctul de vedere al capabilității de producție, al disponibilității materialelor și al domeniului de conformitate. Primiți o ofertă detaliată pe articole, cu calculul MOQ, taxele pentru mostre (creditate ulterior la producție) și segmentele de termen — nu un interval estimativ, ci un calendar portă cu portă.'
    - step: 'Poarta 3'
      title: 'Producția mostrelor (Zilele 6–17)'
      desc: 'Se produc 1–2 plăci fizice conform specificațiilor dumneavoastră: rigiditatea corpului de apă, textura suprapușului de tracțiune EVA, acuratețea graficii, montarea accesoriilor. Folosiți și evaluați placa înainte de a vă angaja la orice altceva. Taxele pentru mostre sunt creditate la comanda de producție la semnarea contractului.'
    - step: 'Poarta 4'
      title: 'Analiza și aprobarea mostrelor (Zilele 18–21)'
      desc: 'Evaluați mostra față de specificațiile dumneavoastră — calitatea de vâslit, fidelitatea graficii, ambalajul, accesoriile. Ajustările sunt consemnate într-o listă de materiale revizuită și într-un semn de acceptare a artwork-ului. Specificația blocată devine referința de producție pentru toate loturile următoare.'
    - step: 'Poarta 5'
      title: 'Planificarea preproducției (Zilele 22–28)'
      desc: 'Aprovizionarea materialelor, pregătirea uneltelor, confirmarea ambalajelor și rezervarea slotului de producție. Toate materialele sunt inspecționate la intrare față de lista de materiale blocată. Înainte de începerea fabricării se emite un grafic de producție cu datele porților de control al calității.'
    - step: 'Poarta 6'
      title: 'Producție și porți de control al calității (Zilele 29–55)'
      desc: 'Fabricarea parcurge sistemul de porți de inspecție în 7 etape: inspecția materialelor la intrare, inspecția țesăturii drop-stitch, sudura și asamblarea, testarea la presiune și de etanșeitate (menținere la 18.0 PSI, respingere automată la o scădere de peste 0.50 PSI), montarea suprapușurilor EVA și a accesoriilor, controlul graficii și al branding-ului, ambalarea finală și documentația. Fiecare poartă are criterii de acceptare sau respingere și înregistrări de trasabilitate.'
    - step: 'Poarta 7'
      title: 'Expediere și analiză post-livrare (Zilele 56–63)'
      desc: 'Ambalare de calitate export, documentație de conformitate (CE, ISO 9001, BSCI, REACH, RoHS) și coordonarea transportului maritim către peste 50 de țări. O analiză post-livrare consemnează concluziile și îmbunătățirile pentru următorul ciclu de comandă.'

