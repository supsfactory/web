nc_intro:
  tagline: Kontroll av icke-konformiga produkter
  title: Vad som händer när en produkt inte uppfyller kriterierna
  body: |
    Produkter eller komponenter som inte uppfyller de definierade acceptanskriterierna identifieras och sätts under kontroll för att förhindra oavsiktlig användning, fortsatt bearbetning eller leverans. De tillämpliga acceptanskriterierna baseras på det godkända provet, den tekniska specifikationen, grafiken, stycklistan, förpackningskraven och projektets inspektionsplan.

    Icke-konformiga artiklar bedöms för att fastställa den berörda omfattningen och rätt åtgärd. Beroende på problemet kan artikeln hållas kvar, omtillverkas enligt kontrollerade instruktioner, bytas ut, kasseras eller hanteras enligt en godkänd process. Omtillverkade eller korrigerade artiklar inspekteras om före frigörningen. Frigörning inför leverans är endast tillåten när de relevanta kvalitetsregistren är kompletta och produkten överensstämmer med de tillämpliga acceptanskriterierna.

nc_flow:
  tagline: Kontrollerad sluten cykel i sju faser
  title: Från identifiering till korrigerande åtgärd
  subtitle: 'En kontrollerad cykel för varje avvikelse: identifiera, blockera, verifiera, omtillverka eller byta ut, kontrollera om, frigöra eller kassera, förbättra.'
  steps:
    - step: '01'
      title: Identifiera
      desc: 'Varje identifierad avvikelse registreras mot den berörda produkten, partiet eller komponenten och bedöms mot de tillämpliga projektkraven. Detekteringen kan ske vid varuingången, vid processkontrollen, vid slutinspektionen, vid förpackningen eller vid kundens eller tredjeparts inspektion.'
    - step: '02'
      title: Blockera
      desc: 'Artiklarna identifieras tydligt och förs under kontrollerad blockerings- eller karantänstatus för att förhindra oavsiktlig användning, fortsatt bearbetning eller leverans. Etiketterna HOLD / QUARANTINE / REJECTED bär NCR-numret, SKU, parti, antal, felbeskrivning och datum.'
    - step: '03'
      title: Verifiera
      desc: 'Den berörda omfattningen och rätt åtgärd bedöms: en enskild enhet, ett skiftparti, ett helt parti eller flera partier — via gemensamma materialpartier, grafikrevisioner, processfaser och dokumentrevisioner. Vid behov tillämpas ytterligare inneslutning eller förstärkt inspektion.'
    - step: '04'
      title: Omtillverka eller byta ut
      desc: 'Tillåten omtillverkning sker enligt godkända instruktioner som identifierar den berörda artikeln, metoden, materialen, kontrollpunkterna och kraven på omverifiering. Oauktoriserade ändringar av produktspecifikation, grafik, tillbehörskonfiguration eller förpackning är aldrig tillåtna. Ersättningsartiklar omfattas av de tillämpliga inspektionsportarna.'
    - step: '05'
      title: Kontrollera om
      desc: 'Omtillverkade eller korrigerade artiklar inspekteras om mot de tillämpliga acceptanskriterierna. Det ursprungliga felet och alla tillhörande egenskaper som kan ha påverkats av omtillverkningen verifieras före frigörningen — av oberoende QC och, för lufttätningsreparationer, med en fullständig 24-timmars tryckprovscykel.'
    - step: '06'
      title: Frigöra eller kassera
      desc: 'Produkten frigörs först när den krävda omverifieringen är klar och auktoriserad kvalitetspersonal bekräftar överensstämmelse med de tillämpliga projektkraven. Artiklar som inte kan bringas till överensstämmelse kasseras, byts ut, returneras eller hanteras enligt kontrollerade procedurer — inklusive övervakad fysisk destruktion.'
    - step: '07'
      title: Korrigerande åtgärd
      desc: 'Återkommande, betydande eller systematiska avvikelser undersöks avseende orsak och korrigerande åtgärd (CAPA). Förbättringar kan omfatta uppdateringar av arbetsinstruktioner, materialkontroller, kontrollpunkter, utbildning, leverantörshantering eller dokumenthantering.'

nc_pillars:
  tagline: Hörnstenar i köparens förtroende
  title: Tre kontroller som skyddar ditt varumärke
  subtitle: 'Processen är byggd kring de frågor som utländska köpare faktiskt ställer: döljs problem, unkommer omtillverkningen kontrollen och omverifieras reparerade brädor.'
  features:
    - icon: 1
      icon_bg: blue
      title: Endast kontrollerade instruktioner
      desc: 'Omtillverkningen regleras strikt av auktoriserade Standard Rework Instructions (SRI). Ej godkända ändringar i verkstaden, variations i specifikation eller ändringar i grafik utan skriftligt tillstånd är absolut förbjudna.'
    - icon: 2
      icon_bg: green
      title: Oberoende omverifiering
      desc: 'Omtillverkade brädor omverifieras på 100 % av QA-inspektörer mot de ursprungliga acceptanskriterierna. Lufttätningsreparationer kräver en fullständig 24-timmars tryckprovscykel — aldrig en delvis verifiering.'
    - icon: 3
      icon_bg: purple
      title: Auktoriserad frigörning & spårbarhet
      desc: 'Frigörning inför leverans är endast tillåten efter fullständig NCR-dokumentation och QC-auktorisering, där statusen går från HOLD till RELEASED. Systematiska eller återkommande avvikelser aktiverar automatiskt CAPA-arbetsflöden för rotorsaksanalys.'

