answer:
  label: 'Tydligt svar'
  text: 'Icke-konformiga produkter döljs aldrig, omtillverkas informellt eller frigörs utan verifiering hos QINGDAO VATRAD GROUP.,LTD. Varje identifierad avvikelse registreras mot den berörda produkten, partiet eller komponenten och kopplas till ett NCR. Artikeln märks (HOLD / QUARANTINE / REJECTED), separeras fysiskt och den berörda omfattningen bedöms per parti, materialparti, processfas och dokumentrevision. Beslutet fattas på den befogenhetsnivå som motsvarar felets allvarlighetsgrad: mindre problem signeras på linjenivå, allvarliga problem kräver ett beslut av QC-chefen + teknisk ingenjör med kontrollerad omtillverkningsinstruktion och oberoende omverifiering på 100 %, och kritiska problem kräver ett beslut av Material Review Board med kundens skriftliga samtycke där det krävs — annars obligatorisk övervakad destruktion. Omtillverkade artiklar omverifieras mot de ursprungliga acceptanskriterierna, lufttätningsreparationer får en fullständig ny tryckprovscykel och frigörning inför leverans sker endast efter auktoriserad kvalificering. Återkommande eller systematiska problem aktiverar rotorsaksanalys och korrigerande åtgärder (CAPA).'
  verified: 'September 2026'

