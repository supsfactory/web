nc_severity:
  tagline: Felets allvarlighetsgrad & befogenhet
  title: Klassificering av allvarlighetsgrad & åtgärdsbefogenhet
  subtitle: 'Inte alla avvikelser hanteras på samma nivå — åtgärdsbefogenheten skalar med felets allvarlighetsgrad, från frigörning på linjenivå till Material Review Board med kundens samtycke.'
  headers:
    severity: Allvarlighetsgrad
    examples: Typiska exempel
    authority: Åtgärds- och kontrollbefogenhet
    control: Villkor för frigörning
  rows:
    - severity: 'Mindre'
      examples: 'Beskuren kartonghörn, lätt felinriktning av ett icke-kritiskt tillbehör'
      authority: 'Frigöring på plats av sektions-QC-chefen + linjesupervisor, med utbyte eller frigörning'
      control: 'Registrerat i NCR; ingen påverkan på produktens funktion eller kundens krav'
    - severity: 'Allvarlig'
      examples: 'Långsam läcka från ventilen, EVA-felinriktning utanför tolerans (>2 mm), saknat tillbehör'
      authority: 'QC-chefen + teknisk ingenjör utfärdar en kontrollerad omtillverkningsinstruktion (SRI)'
      control: 'Oberoende omtest på 100 % av de ursprungliga felen och de påverkade egenskaperna före frigörningen'
    - severity: 'Kritisk'
      examples: 'Skada på drop-stitch-kammaren, kantrem eller högtrycksrev, felaktigt tryckt kundlogotyp eller färgavvikelse'
      authority: 'Beslut av Material Review Board (MRB); kundens skriftliga samtycke där det krävs'
      control: 'Ingen frigörning utan auktoriserat samtycke; annars obligatorisk övervakad fysisk destruktion'

nc_matrix:
  tagline: Matrix över ingenjörsprotokollen
  title: Beslutsmatrix för SUP-defekter & omverifiering
  subtitle: Standardiserade ingenjörsprotokoll som tillämpas på de vanligaste produktionsavvikelserna — samma kvantifierade parametrar som kunder kan verifiera under revisioner.
  headers:
    defect: Defektkategori
    protocol: Kontrollerat åtgärdsprotokoll
    validation: Oberoende omverifiering & validering
  rows:
    - defect: 'Långsam läcka från ventilen'
      protocol: 'Isolera brädan. Demontera ventilkärnan med kalibrerat momentverktyg (25 N·m), rengör innergängorna, byt ut silikonens O-ring och dra åt igen.'
      validation: 'Dyk ner i tvållösning; pump upp till 18 PSI och genomför ett fullständigt omtest av 24-timmars tryckförlust (ΔP ≤ 0.05 PSI).'
    - defect: 'Luftbubblor i kantsömen'
      protocol: 'Blockera skiftpartiet. Delaminera bälgregionen med värmestödd munstycke, rengör ytan med lösningsmedel och applicera tvåkomponents PU-lim under 5 bar tryck.'
      validation: '100 % visuell och taktil kontroll av sömen; strukturell verifieringstryckprov (18.0 PSI) utöver 24-timmars lufttätning.'
    - defect: 'Felinriktning av EVA-pad'
      protocol: 'Värmestödd borttagning med verktyg i reglerad temperatur (80°C). Ny inriktning med en precisionstillbehörsform för positionering.'
      validation: 'Verifiering av spelstoleransen vid tillverkningen (≤ ±1.5 mm), verifiering av rutnätets symmetri, 100 % vidhäftningstest av kanterna.'
    - defect: 'Fel i branding/logotyp'
      protocol: 'Omedelbart stopp av trycklinjen. Blockera alla tryckta paneler. Verifiera vektorrevisionen med kunden; noll oauktoriserade ändringar.'
      validation: 'Färgverifiering med spektrofotometer (ΔE ≤ 1.5); 100 % visuell inspektion av textens inriktning mot kundens undertecknade master-vektor-PDF.'
    - defect: 'Förpackningsavvikelse / saknad SKU'
      protocol: 'Blockera exportpalleten. Öppna och utför en 100 % positionskontroll enligt BOM (pump, fena, leash, paddel, reparationsstav).'
      validation: 'Validering med integrerade elektroniska dynamiska kontrollvågar (±30 g variation); verifiering med optiska skannrar för 2D-streckkoder.'

nc_scrap:
  tagline: Noll utflöde till marknaden
  title: Kassation & övervakad destruktion — anti-divideringsprotokoll med nolldefekter
  body: |
    Utländska varumärkespartners behöver förvissning om att defekta brädor aldrig hamnar i sekundära detaljhandelskanaler, grå marknader eller e-handel. Brädor som inte kan bringas till överensstämmelse destrueras enligt ett övervakat och registrerat protokoll:

    **1. Kapning av delar och tillbehör.** Under uppsikt av QA-chefen kapar en hydraulisk sax bort alla D-ringar i rostfritt stål 316, transporthandtagens band och bagageförslutningar. Ventilgruppen och fin box-basen (US-box / klickfena) tas bort ända ned till brädans fot, vilket eliminerar alla återanvändbara komponenter.

    **2. Risning av drop-stitch & kapning av kanten.** Den interna drop-stitch-kärnan skärs med djupa korssnitt genom bräda och däck (≥ 50 cm per snitt), och kantens förstärkta sidor kapas i minst 4 segment — så att förseglingsegenskaper och flytförmåga permanent förstörs.

    **3. Video- och fotovault.** Destruktionen registreras som en oavbruten 1080p-video med närbilder av den seriella streckkoden, snittet, risningen av kärnan och det invägda slutavfallet. Videon hashades (SHA-256) och lagras i minst 5 år på en kontrollerad server.

    **4. Certifierad avfallshantering.** Alla PVC- och drop-stitch-fragment vägs, registreras i utgångsregistret och transporteras endast av kvalificerade partners för polymeråtervinning — inget restmaterial lämnar anläggningen via andra kanaler.

    > **Varumärkesskyddsgaranti:** QINGDAO VATRAD GROUP CO., LTD. garanterar 100 % destruktion av icke-omtillverkbara och utanför-specifikation-båtar. Ingen andraklassad eller komprometterad bräda kommer någonsin att hamna i sekundära detaljhandelskanaler, grå marknader eller e-handel. Kassations- och destruktionsintyget (VAT-QA-SCRAP-CERT-2026) dokumenterar produkten, partiet, MRB-slutsatsen, vittnesfoton och den dubbla underteckningen av QA-chefen och fabrikschefen.

