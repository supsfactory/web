faqs:
  tagline: FAQ
  title: FAQ om kvalitet och felhantering för köpare världen över
  items:
    - q: 'Hur säkerställer ni att omtillverkade brädor uppfyller hela säkerhetsstandarden?'
      a: 'Varje omtillverkad bräda behandlas som en ny enhet och måste genomgå samma fullständiga testcykel från början — för lufttätningsreparationer ett fullständigt 24-timmars tryckprov. Det är de oberoende QC-inspektörerna, inte omtillverkningsoperatörerna, som utför frigöringsvalideringen.'
    - q: 'Skickar fabriken brädor med mindre kosmetiska avvikelser utan att informera oss?'
      a: 'Aldrig. Varje avvikelse som påverkar kundgodkända golden samples, logografik, färgvarianter eller förpackning kräver ett formellt skriftligt koncessionsavtal, undertecknat av kunden, före frigörning inför leverans.'
    - q: 'Vad händer om en omtillverkad bräda inte klarar omverifieringen?'
      a: 'Brädan frigörs inte. Den går tillbaka till en ny åtgärdsbedömning och ersätts, kasseras eller destrueras enligt det övervakade kassationsprotokollet om den inte kan bringas till överensstämmelse. Återkommande fel i samma defektklass aktiverar en CAPA för rotorsaksanalys.'
    - q: 'Kan defekta brädor säljas som andraklass eller via andra kanaler?'
      a: 'Nej. Icke-omtillverkbara och utanför-specifikation-brädor destrueras fysiskt enligt det övervakade kassationsprotokollet — delar kapas, kärna och kant kapas, video registreras, hashas med SHA-256 och lagras i minst 5 år. Kassations- och destruktionsintyget undertecknas av QA-chefen och fabrikschefen.'
    - q: 'Hur bedöms den berörda omfattningen när ett fel upptäcks?'
      a: 'Omfattningen undersöks utifrån produktidentifiering, produktionsparti, material- eller komponentparti, processfas och tillämplig dokumentrevision. Om samma materialparti, samma grafikrevision eller samma arbetsstation berörs tas de aktuella produkterna med och inspekteras i enlighet därmed.'
    - q: 'Krävs ert tillstånd innan en koncession beviljas?'
      a: 'Ja. Varje dokumenterad koncession som påverkar kundens krav — godkända prov, specifikation, grafik, förpackning eller acceptanskriterier — kräver kundens skriftliga frigörning före frigörningen. Utan den frigörningen omtillverkas, byts ut eller kasseras produkten enligt det ursprungliga kravet.'
    - q: 'Vilken dokumentation får ni för en avvikelse?'
      a: 'NCR-dossieret omfattar NCR-numret, detekteringsfasen, produkten/ SKU, partiet, de tillämpliga dokumentrevisionerna, felbeskrivningen, inneslutningen, åtgärden, referensen till omtillverkningsinstruktionen, resultatet av omverifieringen och den slutliga frigörningen eller stängningen — tillgängligt enligt er projektkvalitetsavtal.'

