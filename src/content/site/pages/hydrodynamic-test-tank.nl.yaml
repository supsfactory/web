intro: 'Het is een wijdverbreide misvatting dat hydrodynamische tests zijn voorbehouden aan schepen en racewagens. In werkelijkheid hangen de prestaties van een SUP-board — een planerende romp van 10 tot 14 voet — net als elk ander vaartuig af van de onderwatervorm. Boegprofiel, railradius, rocker en nat oppervlak hebben een dramatische impact op weerstand, planeringsrendement en stabiliteit. Bij {SITE.name} beheren wij een dedicated hydrodynamische testvijver waarmee we deze effecten op modelschaal kunnen kwantificeren — vóórdat we stof en tooling vastleggen voor een prototype op ware grootte.'

content_html: |
  <h2>Waarom een SUP-board in een vijver testen?</h2>
  <p>Tests op modelschaal (typisch 1:3 tot 1:5) stellen ons in staat om boardvormen snel en tegen lage kosten te itereren. Een week in de vijver kan dezelfde prestatiegegevens opleveren die maanden van trial-and-error op ware grootte zouden vergen — tegen een fractie van de kosten.</p>

  <h2>Specificaties van de faciliteit</h2>
  <table>
    <thead><tr><th>Parameter</th><th>Specificatie</th></tr></thead>
    <tbody>
      <tr><td>Vijverafmetingen</td><td>35 m (L) × 3,5 m (B) × 1,8 m (D)</td></tr>
      <tr><td>Sleeptrolley</td><td>Elektrisch servo-aangedreven, maximale snelheid 12 m/s (23 kn), snelheidsnauwkeurigheid ± 0,5 %</td></tr>
      <tr><td>Golfgenerator</td><td>Flap-type, programmeerbare regelmatige &amp; onregelmatige zeeën, Hs tot 0,3 m op modelschaal</td></tr>
      <tr><td>Instrumentatie</td><td>6-componenten weerstandsmeetbalans (weerstand, dwarskracht, giermoment), versnellingsmeters, hellingsmeters, golfprobes</td></tr>
      <tr><td>Data-acquisitie</td><td>Bemonsteringsfrequentie 1000 Hz per kanaal, realtime visualisatie + softwarepakket voor nabewerking</td></tr>
      <tr><td>Modelproductie</td><td>CNC-frezen en 3D-printen in-house voor modelrompen tot 1,8 m lengte over alles</td></tr>
    </tbody>
  </table>

  <h2>Ons testprogramma</h2>
  <p>Een standaard boardontwikkelingsprogramma in onze vijver volgt deze volgorde:</p>
  <ol>
    <li><strong>Modelbouw</strong> — Een model op schaal 1:4 wordt met een CNC-frees gemaakt van schuim met hoge dichtheid en versterkt met glasvezel voor stijfheid. Gewicht en zwaartepunt worden afgesteld om de vollastconditie te bereiken, geschaald volgens Froude.</li>
    <li><strong>Weerstandsproeven</strong> — Het model wordt gesleept op 6–10 snelheden in het peddelbereik (2–6 kn op ware grootte). De totale weerstand wordt gemeten en gesplitst in wrijvings- en restweerstand met de ITTC-1957-methode.</li>
    <li><strong>Assetto- &amp; diepgangmeting</strong> — Assetto en diepgang tijdens het varen worden bij elke snelheid geregistreerd. Het doel is de assetto-hoek die het natte oppervlak minimaliseert terwijl de boeg duidelijk boven de boeggolf blijft.</li>
    <li><strong>Golfveldonderzoek</strong> — De dwarse golfprofielen worden bij twee snelheden gemeten om de golfweerstand te beoordelen en interacties van de boegvorm te identificeren die een board in het water vertragen.</li>
    <li><strong>Gedrag in zeegang (optioneel)</strong> — Proeven in golftegenstanders met regelmatige golven om de extra weerstand en verticale versnelling in golven te meten — de data achter het boegontwerp van touring boards.</li>
    <li><strong>Data-analyse &amp; aanbevelingen</strong> — Er wordt een volledig rapport opgeleverd met vergelijkende grafieken, weerstand/snelheidscurves en specifieke ontwerpaanbevelingen voor het board op ware grootte.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typische testvijverresultaten — Weerstand vs. snelheid (allround board 11''0, schaal 1:4)</p>
    <div class="space-y-2">
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">2 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:18%"></div>
        </div>
        <span class="w-16 text-right">11 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">3 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:35%"></div>
        </div>
        <span class="w-16 text-right">21 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">4 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:52%"></div>
        </div>
        <span class="w-16 text-right">32 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">5 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:68%"></div>
        </div>
        <span class="w-16 text-right">42 N</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="w-20">6 kn (1:1)</span>
        <div class="flex-1 bg-gray-200 dark:bg-gray-700 h-5 rounded">
          <div class="h-full bg-blue-600 rounded" style="width:85%"></div>
        </div>
        <span class="w-16 text-right">52 N</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Weerstand op modelschaal (N) bij volgens Froude geschaalde snelheden. De prestatievoorspelling op ware grootte volgt de ITTC-1978-methode voor prestatievoorspelling.</p>
  </div>

  <h2>Expertteam</h2>
  <p>Onze vijver wordt beheerd door een hydrodynamisch ingenieur met een doctoraat in scheepsarchitectuur en 8 jaar ervaring bij een belangrijk Europees maritiem onderzoeksinstituut. Hij wordt bijgestaan door een technicus die alle modellen en instrumentatie voorbereidt. Het team volgt de aanbevolen procedures van de ITTC (International Towing Tank Conference) om te garanderen dat elke test herhaalbaar, traceerbaar en internationaal verdedigbaar is.</p>

  <h2>Testvijvertests voor de ontwikkeling van aangepaste boards</h2>
  <p>Onze vijver wordt niet alleen gebruikt voor in-house boards — we voeren regelmatig testprogramma''s uit voor klanten die een aangepaste boardvorm willen valideren of een prestatieprobleem willen onderzoeken:</p>
  <ul>
    <li><strong>Vormvergelijking</strong> — Twee of meer kandidaatvormen worden onder identieke omstandigheden getest en leveren een objectieve weerstand/snelheid/stabiliteitsvergelijking als ondersteuning voor jullie designkeuze.</li>
    <li><strong>Optimalisatie van rail &amp; boeg</strong> — Varianten van boegprofiel en railradius kunnen in verschillende configuraties worden getest om hun bijdrage aan de weerstandsvermindering te kwantificeren.</li>
    <li><strong>Studie van de paddler-belading</strong> — De weerstandsgegevens worden over het hele gewichtsbereik van paddlers in kaart gebracht, zodat jullie de juiste lengte en breedte kunnen specificeren voor jullie doelgroep.</li>
  </ul>

  <h2>Waarom bij ons testen?</h2>
  <p>We geven jullie niet alleen een reeks ruwe cijfers. Onze rapporten vertalen de vijverdata naar uitvoerbare engineeringaanbevelingen: "Vergroot de boegrocker met 10 mm om de boeggolfweerstand op cruisesnelheid te verminderen", "Fase de rail bij de midscheepsdoorsnede af om het natte oppervlak te verkleinen" ofwel "Verplaats het staande voetgedeelte 50 mm naar voren voor een beter assetto". Je gaat naar huis met een duidelijk begrip van wat en waarom er zou moeten worden aangepast.</p>
  <p>Onze vijver is ook beschikbaar voor onafhankelijke tests door derden op honorariumbasis. Als jullie een board ontwikkelen en een onpartijdige, professioneel uitgevoerde hydrodynamische beoordeling willen, ontvangen we graag jullie aanvraag.</p>

