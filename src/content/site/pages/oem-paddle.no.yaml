answer:
  label: 'Kort svar'
  text: 'Minste bestillingsmengde fastsettes per prosjekt: prøve (1–2 enheter), pilot (20–50 enheter) og standardvolum (90–100+ enheter per parti fra en drop-stitch-rull på 150 m), med co-branding for små partier fra 5–10 enheter. Prøver sendes innen 7–12 dager; serieproduksjonen tar 25–35 dager etter bestilling og depositum. CE-sertifiseringen for modeller beregnet for EU-markedet og fullstendig samsvarsdokumentasjon inngår i hver bestilling.'
  verified: 'September 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Tilpasset OEM-padle med merkelogo
  actions:
