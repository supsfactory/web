faqs:
  title: 'FAQ om produksjon av OEM-padler'
  subtitle: 'Svar på de vanligste spørsmålene fra merker som lanserer sin egen padle.'
  items:
    - title: 'Hvordan starter jeg mitt eget padlemerke?'
      description: 'Lanser merket ditt: briefing, design, CE-sertifisert prototype, masseproduksjon og levering. Prøver på 7–12 dager, produksjon på 25–35 dager etter bestilling og depositum. Utforsk OEM-pakkene våre.'
    - title: 'Hva er produksjonstiden?'
      description: 'Prøven er klar på 7–12 dager og masseproduksjonen på 25–35 dager etter bestilling og depositum, avhengig av antall.'
    - title: 'Bærer padlen logoen vår?'
      description: 'Ja — fullstendig private label: logotrykk, tilpassede farger, emballasje og etiketter under merket ditt.'
    - title: 'Kan jeg kjøpe store antall fra dag én?'
      description: 'MOQ fastsettes per prosjekt — prøve (1–2 enheter), pilot (20–50 enheter) og standardvolum (90–100+ enheter per parti), med engrospriser som øker med antallet.'

