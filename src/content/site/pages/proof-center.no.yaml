traceability:
  tagline: 'Ett parti, sporet fra rull til brett'
  title: 'Hvordan sporbarheten ser ut i praksis'
  body: |
    Hvert parti tildeles en **10-årig ERP-partikode**. Kjeden som registreres under et parti:

    - **Inngående rull** — materialsertifikat, rullnummer, kontrollert materialparti (strekk, tilskjæring, sveising)
    - **Kutting** — CNC-nestingsordre mot designfilen, registrert svinnprosent
    - **Sveising & laminering** — linje, operatør, maskinparametere per luftkammer
    - **Montering** — brettets serienummer, ventiltype, parti for dekkstopp
    - **Testing** — 18.0 PSI × 24 t trykkholdetid per luftkammer, automatisk avvisning over 0.50 PSI trykktap
    - **Frigivelse** — kontrolliste med 100 punkter per brett, frigivelse av QA-sjefen per parti
    - **Videre** — samsvarsbevis (Certificate of Conformance) ved levering; revisjonsrett forbeholdes kontraktsmessig

    Be om eksemplet på en QC-protokoll før din første ordre — det har samme format som det du får ved leveringen.

faqs:
  tagline: 'Vanlige spørsmål'
  title: 'Spørsmål om beviset som kjøpere stiller'
  items:
    - q: 'Er denne siden bare til for verifisering, og erstatter den ikke due diligence?'
      a: 'Riktig — denne siden viser hvor hvert påstand kan verifiseres: enhetsregistrering, sertifikater, maskiner, registreringer og en fabrikk som står åpen for revisjoner. Dine vanlige due diligence-trinn (registerkontroll, revisjon, inspeksjon av tredjepart) gjelder fortsatt og er velkomne.'
    - q: 'Hvilken enhet skal stå på ordredokumentasjonen min?'
      a: 'Bestillinger inngås med Qingdao Vatrad Group Co., Ltd., som opererer under navnet Vatrad (produksjonsdivisjonen), med iSupfactory som SUP-serie. Kontraktsdokumenter signeres av VP Sales, sjefingeniøren og QA-sjefen.'
    - q: 'Kan jeg få kopier av sertifikatene før bestillingen?'
      a: 'Ja — sertifikatnumre og revisjonsdokumenter utleveres på forespørsel eller i forbindelse med en revisjon. Listen er publisert, aldri «kun tilgjengelig på forespørsel».'
    - q: 'Hvordan kan jeg selv verifisere testprotokollen for et parti?'
      a: 'Hver luftkammer testes i 24 timer ved 18.0 PSI med automatisk avvisning over 0.50 PSI trykktap; testprotokollene er koblet til serienumrene og følger med hvert parts samsvarsbevis. En inspeksjon før levering av SGS, TÜV, BV eller Intertek iht. ISO 2859-1 Nivå II kan planlegges etter eget valg.'
    - q: 'Dekker sertifikatene også tilbehøret?'
      a: 'Materialdokumentasjonen iht. REACH/RoHS gjelder brett og tilbehør i samme ordre, og QC-kontrollistene dekker hele pakken — brett, åre, pumpe, leash og bærebag.'
    - q: 'Hva skjer med beviset etter bestillingen?'
      a: 'ERP-sporbarheten per parti lagres i 10 år. QMS-SOP-ene og teststandardene forblir nedlastbare, og kjøperen beholder kontraktsmessig en revisjonsrett under produksjonen.'

