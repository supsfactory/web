meta:
  title: 'Proof Center — bevisene bakom hver produksjonspåstand'
  description: 'Samling av bevisene bakom påstandene til iSupfactory: bedriftsrelasjoner, sertifikater med anvendelsesområde, utstyrsliste, sporbarhet per parti og inspeksjonsdokumentasjon.'
  dateModified: '2026-08-16'
  keywords:
    - 'fabrikkbevis SUP'
    - 'oversikt fabrikksertifikater'
    - 'sporbarhet per parti SUP'
    - 'SUP-fabrikkverifisering'
    - 'produksjonsbevis Kina'

hero:
  tagline: 'Navn for fabrikkbevis'
  title: 'Proof Center — alt vi påstår er arkivert her'
  subtitle: 'En side som kobler hvert påstand på nettsiden til beviset: den registrerte enheten bak fabrikken, sertifikater med anvendelsesområde, maskinene som gjør jobben, og partiets registreringer som overlever hver produksjonskjøring.'
  actions:
    - { variant: primary, text: 'Bestill verifiseringspakken', href: '/no/contact#trust-verification' }
    - { variant: ghost, text: 'Utforsk kvalitetssystemet', href: '/no/quality' }

answer:
  label: 'Kort svar'
  text: 'Kjeden fra påstand til bevis fungerer slik: hvert påstand på denne nettsiden bygger på en registrering, et sertifikat, en maskin, et dokument eller en testprotokoll — og alt av det kan tas i bruk. iSupfactory er produktutviklings- og SUP-produksjonsdivisjonen i Qingdao Vatrad Group Co., Ltd. (registrert i Qingdao siden 2012). Fabrikken på 12 500 m² har kvalitetsledelse iht. ISO 9001:2015, samsvar iht. ISO 25649, CE-samsvarsdokumentasjon, sosialt samsvar iht. BSCI (revisjonsrapport på forespørsel) samt materialdokumentasjon iht. REACH/RoHS for hver ordre. Hver oppblåsbar luftkammer testes i 24 timer ved 18.0 PSI med automatisk avvisning over 0.50 PSI trykktap, og partiets registreringer lagres med 10 års ERP-sporbarhet. Dokumentasjonen er publisert eller kan deles, og fabrikken står åpen for revisjoner.'
  verified: 'September 2026'

