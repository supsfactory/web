hero:
  tagline: 'Teknik'
  title: 'Byggd för prestanda'
  subtitle: 'Varje uppblåsbar Vatrad-SUP är tillverkad med drop-stitch-konstruktion och marint PVC — material och precisionsmetoder, testade för krävande marina miljöer.'

sections:
  - title: 'Drop-stitch-kärna'
    description: 'Tusentals interna polyestertrådar förbinder det övre och undre lagret och skapar en styv konstruktion vid 12–15 PSI. Det är samma teknik som på professionella paddleboards och uppblåsbara race-SUP.'
    imageAlt: 'Diagram över drop-stitch-kärna'
  - title: 'Marint PVC'
    description: 'Flerskiktslaminerat PVC-tyg, utformat för marina miljöer. Varje lager svetsas och limmas inte, vilket eliminerar risken för delaminering. Testat för UV-beständighet, korrosion från saltvatten och slitage.'
    imageAlt: 'PVC-lager'
  - title: 'PVC av militär kvalitet'
    description: 'Det premium-PVC som används på alla SUP-modeller erbjuder överlägsen motståndskraft mot UV-strålning och kemikalier. Det förblir flexibelt vid extrema temperaturer och står emot åldrande.'
    imageAlt: 'PVC'
  - title: 'Air-Deck Floor'
    description: 'Drop-stitch-konstruktion med komprimerad luft för exceptionell styvhet vid stående, fiske och yoga. Minskar uppställningstiden, den totala vikten och deplaceringsvolymen.'
    imageAlt: 'Air-Deck'

