meta:
  title: 'Teknik — drop-stitch & marint PVC | {SITE}'
  description: 'Vatrads tekniker: drop-stitch-konstruktion, marint PVC, konstruktioner med dubbla lager och högt tryck. Innovation från en professionell tillverkare av uppblåsbara SUP.'
  dateModified: '2026-08'
  keywords:
    - 'sup teknik'
    - 'drop-stitch konstruktion'
    - 'sup högt tryck'
