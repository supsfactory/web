  description: 'Hogyan számítják ki a MOQ-t a felfújható SUP-khez: egy 150 m-es drop-stitch tekercs 90–100 deszkát ad, a közös márkázás 5–10 darabtól indul, és átlátható formadíjakkal dolgozunk.'
