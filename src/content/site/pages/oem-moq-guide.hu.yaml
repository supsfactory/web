moq_stages:
  tagline: Minta · Pilóta · Térfogat
  title: 'Három külön mennyiségi szakasz'
  subtitle: 'A minta, a pilóta és a térfogatú gyártás mennyiségei eltérnek. Minden projekt az egyik három külön szintre kerül, hogy a kötelezettségvállalás előtt validálhasson.'
  steps:
    - step: '01'
      title: 'Minta fejlesztése (1–2 darab)'
      desc: 'A víztest merevségének, az EVA csúszásgátló fedelem textúrájának, a grafika pontosságának és a tartozékok szerelésének fizikai megerősítése, bármilyen pénzügyi kötelezettségvállalás előtt. A mintadíjak felszólnak, amelyek a szerződés aláírásakor jóváíródnak a gyártási megrendelésen.'
    - step: '02'
      title: 'Pilóta megrendelés (20–50 darab)'
      desc: 'Kereskedelmi próba a szezon előtt és a regionális piac validálása, meglévő víztest-platformok, raktáron lévő anyagok és egyszerűsített csomagolás használatával, az átállási súrlódás minimalizálása érdekében.'
    - step: '03'
      title: 'Térfogatú gyártás (90–100+ darab)'
      desc: 'Az anyaglista, a grafika, a testreszabott csomagolás és a kiszállítási terv rögzítése után erősítjük meg – teljes 150 m-es szövettekercsek, testreszabott Pantone szövetek, dedikált csomagolás, térfogati kedvezmények és a szállítmányok nyomon követhetősége a teljes láncon.'

