    - icon: B
      icon_bg: green
      title: 'Cosa non siamo — il profilo da ufficio commerciale'
      desc: '· Nessuna trading company: non inoltriamo il tuo ordine a una fabbrica terza né addebitiamo commissioni da intermediario · Nessun marchio proprio sulle tue tavole: possiedi tu il marchio, il mercato e il cliente · Nessuna quantità minima vaga: il MOQ viene calcolato dalla fisica dei rotoli di materia prima e confermato in base al progetto · Nessun certificato "solo su richiesta": l''elenco è pubblicato e le registrazioni di audit sono consultabili · Nessuna affermazione puramente verbale: pressione di test, soglie e tracciabilità dei lotti sono documentate per numero di serie'
      link: '/it/oem-moq-guide'
      link_label: 'Vedi la guida MOQ trasparente'

trust_steps:
  tagline: 'Un caso studio reale'
  title: 'Come una flotta di noleggio del Nord Europa ci ha verificati prima dell''ordine'
  subtitle: 'Sette passaggi di verifica eseguiti da un noleggiatore commerciale prima di un ordine flotta di 90–100+ unità — la stessa checklist è a tua disposizione.'
  steps:
    - step: '01'
      title: 'Verifica dell''entità ufficiale'
      desc: 'L''acquirente ha richiesto la registrazione commerciale cinese e la licenza di commercio estero. La persona giuridica dietro SUPsfactory è la Qingdao Vatrad Group Co., Ltd., un produttore registrato a Qingdao, Shandong dal 2012 — verificato tramite il registro nazionale sotto NDA.'
    - step: '02'
      title: 'Fabbrica fisica & audit dello stabilimento'
      desc: 'Un audit di fabbrica (di persona e tramite video tour) ha confermato l''impianto di 12,500 m²: quattro officine specializzate, 350+ dipendenti, quattro linee automatizzate e una produzione mensile di circa 10.000 tavole. Il rapporto di audit viene archiviato nella documentazione contrattuale.'
    - step: '03'
      title: 'Persone: ingegneri reali, non copioni commerciali'
      desc: 'L''acquirente ha parlato direttamente con il team tecnico — progettazione dello scafo, laboratorio materiali e QC. La specifica di progetto e la NDA sono state scambiate entro 4 ore lavorative e una verifica tecnica è arrivata entro un giorno lavorativo.'
    - step: '04'
      title: 'Carta: QMS, certificati & ispezione di terze parti'
      desc: 'La documentazione di conformità ISO-9001:2015, ISO-25649 e CE, le registrazioni BSCI/REACH/RoHS e le SOP QMS sono state esaminate. L''acquirente ha programmato un''ispezione SGS pre-spedizione secondo ISO 2859-1 Livello II per il primo ordine in quantità — e ha ricevuto per ogni lotto un certificato di conformità (Certificate of Conformance).'
    - step: '05'
      title: 'Dati: registrazioni di test per numero di serie'
      desc: 'L''acquirente ha esaminato registrazioni di test reali: ogni camera testata per 24 ore a 18,0 PSI con scarto automatico oltre 0,50 PSI di caduta di pressione, checklist di montaggio a 100 punti e tracciabilità ERP dei lotti di 10 anni. Esempi di registrazioni QC sono stati forniti prima dell''ordine.'
    - step: '06'
      title: 'Protezione contrattuale'
      desc: 'Il contratto d''ordine copriva la licenza del marchio, una durata concordata di esclusività territoriale, la proprietà dello stampo e le condizioni di consegna, nonché i dati e le registrazioni da trasferire insieme alle attrezzature. L''acquirente ha approvato lo stampo in fabbrica prima della produzione.'
    - step: '07'
      title: 'Governance continua'
      desc: 'Riunioni commerciali trimestrali con il VP Vendite e l''ingegnere capo, un diritto di audit riservato durante la produzione e un percorso di escalation verso il Direttore QA per le controversie di qualità. L''accordo è stato firmato congiuntamente dal VP Vendite, dall''ingegnere capo e dal Direttore QA.'

trust_faqs:
  tagline: 'FAQ'
  title: 'Le 12 preoccupazioni che gli acquirenti sollevano prima dell''ordine'
  items:
    - q: 'SUPsfactory è davvero una fabbrica o una trading company?'
      a: 'SUPsfactory è la divisione di sviluppo prodotto e produzione SUP della Qingdao Vatrad Group Co., Ltd. Gestiamo direttamente l''impianto di 12,500 m² a Qingdao — design, taglio, saldatura, assemblaggio e collaudo avvengono in un unico stabilimento. Non ci sono passaggi attraverso trading company: le persone che rispondono alle tue domande sono le persone che costruiscono le tue tavole.'
    - q: 'Con chi avrò concretamente a che fare durante il mio progetto?'
      a: 'Con un ingegnere di progetto dedicato e un referente QC dedicato, oltre ai responsabili di reparto che firmano i tuoi documenti. Puoi parlare direttamente con l''ingegnere capo, il Direttore QA o il direttore dello stabilimento — prima e dopo l''ordine. Non c''è un livello di account manager tra te e chi esegue.'
    - q: 'Posso visitare o auditare la fabbrica?'
      a: 'Sì. Accogliamo visite in fabbrica nella Economic Development Zone di Laixi, Qingdao e supportiamo audit remoti con video tour in diretta. Gli audit possono essere organizzati in modo indipendente (dal tuo ispettore o da una terza parte come SGS, TÜV, BV o Intertek) e il piano di audit può essere incluso nel contratto.'
    - q: 'Firmate una NDA prima di condividere il mio design?'
      a: 'Sì. La nostra NDA standard viene firmata entro 4 ore lavorative dalla tua richiesta, prima di condividere qualsiasi specifica proprietaria, artwork o file tecnico. Sono disponibili versioni bilingue (inglese/cinese) e il documento è controfirmato dal direttore dello stabilimento.'
    - q: 'Come faccio a sapere che le vostre dichiarazioni di qualità sono reali?'
      a: 'Dietro ogni affermazione di questo sito c''è un documento: le SOP QMS e gli standard di prova sono scaricabili, esempi di registrazioni di qualità anonimizzate sono pubblicati e i dati di test sono registrati per numero di serie con tracciabilità ERP dei lotti di 10 anni. Puoi anche programmare un''ispezione pre-spedizione di terze parti a tua scelta.'
    - q: 'Cosa succede se le mie tavole arrivano con difetti?'
      a: 'Ogni tavola viene ispezionata prima dell''imballaggio e le registrazioni di lotto consentono l''analisi delle cause per numero di serie. Il contratto definisce gli obblighi di ispezione, sostituzione e rilavorazione e il Direttore QA firma il rilascio del lotto. Le tavole rilavorate vengono completamente ritestate — mai solo parzialmente controllate.'
    - q: 'Potete davvero testare il 100% delle tavole prima della spedizione?'
      a: 'Sì — e le registrazioni lo dimostrano. Ogni camera viene gonfiata a 18,0 PSI e mantenuta per 24 ore con registrazione continua dei sensori; ogni camera con una caduta di pressione superiore a 0,50 PSI in 24 ore viene automaticamente scartata e ricontrollata. I protocolli di test sono collegati a ogni numero di serie e fanno parte della documentazione di lotto.'
    - q: 'Quali certificazioni possedete effettivamente?'
      a: 'ISO 9001:2015 gestione della qualità, conformità ISO 25649 e CE per i prodotti SUP gonfiabili, nonché conformità BSCI, REACH e RoHS per lo stabilimento e i materiali. I numeri di certificato e le registrazioni di audit vengono forniti su richiesta o durante un audit — l''elenco è pubblicato, non "disponibile solo su richiesta".'
    - q: 'Il mio marchio è al sicuro — design, stampi e mercato?'
      a: 'Sì. Il tuo marchio, i tuoi design e le tue attrezzature sono protetti da NDA, condizioni di licenza del marchio e clausole di proprietà o consegna degli stampi nel contratto. L''attrezzatura è custodita per il marchio ed è trasferibile. Le condizioni territoriali e di esclusività vengono concordate per iscritto prima dell''inizio della produzione.'
    - q: 'Qual è il vostro MOQ effettivo?'
      a: 'Il MOQ dipende dal progetto ed è spiegato nella nostra guida MOQ: campioni 1–2 unità, piccola serie in co-branding 5–10 unità, lotti pilota 20–50 unità e quantità standard 90–100+ unità per rotolo da 150 m (ca. 180–220 tavole). Gli stampi per forme proprie girano al livello di volume. Il calcolo viene confermato prima dell''offerta — niente vaghi numeri "MOQ basso".'
    - q: 'Cosa succede se la produzione è in ritardo?'
      a: 'Il tempo di consegna viene confermato dopo la verifica di specifica, artwork e imballaggio — mai promesso in anticipo. Il contratto regola la pianificazione, la comunicazione dei ritardi e la via di soluzione, e la riunione commerciale trimestrale monitora le performance di consegna rispetto al calendario concordato.'
    - q: 'Chi firma dall''altra parte i documenti contrattuali?'
      a: 'Ordini e accordi vengono firmati congiuntamente dal VP Vendite, dall''ingegnere capo e dal Direttore QA — le tre persone responsabili rispettivamente di politica commerciale, realizzazione tecnica e rilascio qualità. Ricevi i documenti firmati con la documentazione contrattuale.'

governance:
  tagline: 'Struttura di responsabilità'
  title: 'Firmatari designati & diritti riservati'
  subtitle: 'Ogni impegno è legato a un ruolo designato — non a un reparto vendite.'
  body: |
    **Firma congiunta.** Ordini, piani di qualità e risoluzioni delle controversie vengono firmati da tre ruoli: il VP Vendite (politica commerciale), l''ingegnere capo (realizzazione tecnica) e il Direttore QA (rilascio qualità). Le SOP bilingue sono sotto controllo di versione e riportano la stessa struttura di firme.

    **Diritti riservati.** L''acquirente mantiene il diritto di auditare la produzione, esaminare le registrazioni di test e trattenere il rilascio dei lotti fino all''approvazione dell''ispezione. La rilavorazione avviene solo sotto un protocollo di modifica approvato e il rilascio viene validato da un controllo qualità indipendente — mai dagli operatori che hanno rilavorato.

    **Registrazioni consegnate.** I protocolli di test di lotto, i certificati di conformità e i rapporti di ispezione accompagnano ogni consegna e la tracciabilità ERP dei lotti viene conservata per 10 anni. Le registrazioni delle attrezzature e i disegni degli stampi passano insieme all''attrezzatura se previsto dal contratto.

