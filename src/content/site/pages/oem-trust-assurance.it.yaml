role_boundary:
  tagline: 'Cosa siamo — e cosa non siamo'
  title: 'Una fabbrica che puoi verificare, mai un''affermazione da prendere per fede'
  subtitle: 'La differenza di verificabilità tra una fabbrica e un ufficio commerciale è semplice: dietro ogni affermazione c''è un documento, una persona o una macchina.'
  features:
    - icon: A
      icon_bg: blue
      title: 'Cosa siamo — un produttore verificabile'
      desc: '· Una persona giuridica registrata: Qingdao Vatrad Group Co., Ltd. — i dettagli di registrazione vengono condivisi sotto NDA o durante l''audit · Una fabbrica fisica: 12,500 m² nella Economic Development Zone di Laixi, Qingdao, con 4 officine specializzate, 350+ dipendenti e 4 linee automatizzate · Un team di produzione: le persone che rispondono alle tue domande sono le persone che costruiscono le tue tavole · Documenti reali: SOP QMS, standard di prova e registrazioni di qualità anonimizzate da scaricare · Verifica indipendente benvenuta: ispezioni SGS, TÜV, BV o Intertek a tua scelta, secondo ISO 2859-1 Livello II'
