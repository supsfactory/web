trust_steps:
  tagline: 'Een echte casestudy'
  title: 'Hoe een Noord-Europese verhuurvloot ons vóór de bestelling verifieerde'
  subtitle: 'Zeven verificatiestappen uitgevoerd door een commerciële verhuurder vóór een vlootbestelling van 90–100+ eenheden — dezelfde checklist staat tot jouw beschikking.'
  steps:
    - step: '01'
      title: 'Verificatie van de officiële entiteit'
      desc: 'De koper vroeg de Chinese bedrijfsregistratie en de handelsvergunning voor het buitenland op. De rechtspersoon achter SUPsfactory is de Qingdao Vatrad Group Co., Ltd., een sinds 2012 in Qingdao, Shandong geregistreerde fabrikant — geverifieerd via het nationale register onder NDA.'
    - step: '02'
      title: 'Fysieke fabriek & vestigingsaudit'
      desc: 'Een fabrieksaudit (op locatie en via videotour) bevestigde de vestiging van 12,500 m²: vier speciale werkplaatsen, 350+ medewerkers, vier geautomatiseerde lijnen en een maandproductie van circa 10.000 planken. Het auditrapport wordt in de contractdocumentatie gearchiveerd.'
    - step: '03'
      title: 'Mensen: echte ingenieurs, geen commerciële scripts'
      desc: 'De koper sprak rechtstreeks met het technisch team — rompontwerp, materiaallaboratorium en QC. De projectspecificatie en de NDA werden binnen 4 werkuren uitgewisseld en een technische controle kwam binnen één werkdag.'
    - step: '04'
      title: 'Papier: QMS, certificaten & inspectie door derden'
      desc: 'De conformiteitsdocumentatie ISO-9001:2015, ISO-25649 en CE, de BSCI/REACH/RoHS-registraties en de QMS-SOP''s werden beoordeeld. De koper plande een SGS-inspectie vóór verzending volgens ISO 2859-1 Niveau II voor de eerste order in volume — en ontving voor elke partij een conformiteitscertificaat (Certificate of Conformance).'
    - step: '05'
      title: 'Data: testregistraties per serienummer'
      desc: 'De koper bekeek echte testregistraties: elke kamer 24 uur getest op 18,0 PSI met automatische afkeur boven 0,50 PSI drukval, een assemblagechecklist van 100 punten en een ERP-partijtraceerbaarheid van 10 jaar. Voorbeelden van QC-registraties werden vóór de bestelling verstrekt.'
    - step: '06'
      title: 'Contractuele bescherming'
      desc: 'Het ordercontract dekte de merkenlicentie, een afgesproken looptijd van territoriale exclusiviteit, het eigendom van de matrijs en de leveringsvoorwaarden, evenals de gegevens en registraties die samen met de apparatuur worden overgedragen. De koper keurde de matrijs in de fabriek goed vóór de productie.'
    - step: '07'
      title: 'Voortdurend bestuur'
      desc: 'Kwartaaloverleggen met de VP Sales en de hoofdingenieur, een voorbehouden auditrecht tijdens de productie en een escalatiepad naar de QA-directeur voor kwaliteitsgeschillen. De overeenkomst werd gezamenlijk ondertekend door de VP Sales, de hoofdingenieur en de QA-directeur.'

trust_faqs:
  tagline: 'FAQ'
  title: 'De 12 zorgen die kopers vóór de bestelling stellen'
  items:
    - q: 'Is SUPsfactory echt een fabriek of een trading company?'
      a: 'SUPsfactory is de productontwikkelings- en SUP-productiedivisie van de Qingdao Vatrad Group Co., Ltd. We beheren de fabriek van 12,500 m² in Qingdao rechtstreeks — ontwerp, snijden, lassen, assemblage en testen gebeuren in één vestiging. Er is geen omweg via trading companies: de mensen die jouw vragen beantwoorden zijn de mensen die jouw planken bouwen.'
    - q: 'Met wie krijg ik concreet te maken tijdens mijn project?'
      a: 'Met een toegewijde projectingenieur en een toegewijde QC-contactpersoon, naast de afdelingshoofden die jouw documenten ondertekenen. Je kunt rechtstreeks spreken met de hoofdingenieur, de QA-directeur of de fabrieksdirecteur — vóór en na de bestelling. Er zit geen accountmanager-laag tussen jou en de uitvoerders.'
    - q: 'Kan ik de fabriek bezoeken of auditren?'
      a: 'Ja. We verwelkomen fabrieksbezoeken in de Economic Development Zone van Laixi, Qingdao en ondersteunen externe audits met live videotours. Audits kunnen onafhankelijk worden georganiseerd (door jouw eigen inspecteur of een derde partij zoals SGS, TÜV, BV of Intertek) en het auditplan kan in het contract worden opgenomen.'
    - q: 'Ondertekenen jullie een NDA voordat ik mijn ontwerp deel?'
      a: 'Ja. Onze standaard-NDA wordt binnen 4 werkuren na jouw verzoek ondertekend, vóór het delen van enige eigendomspecificatie, artwork of technisch bestand. Tweetalige versies (Engels/Chinees) zijn beschikbaar en het document wordt medeondertekend door de fabrieksdirecteur.'
    - q: 'Hoe weet ik dat jullie kwaliteitsclaims echt zijn?'
      a: 'Achter elke claim op deze site zit een document: de QMS-SOP''s en testnormen zijn downloadbaar, voorbeelden van geanonimiseerde kwaliteitsregistraties zijn gepubliceerd en de testgegevens zijn per serienummer geregistreerd met een ERP-partijtraceerbaarheid van 10 jaar. Je kunt ook een inspectie vóór verzending door een derde partij naar jouw keuze plannen.'
    - q: 'Wat gebeurt er als mijn planken met defecten aankomen?'
      a: 'Elke plank wordt vóór het verpakken geïnspecteerd en de partijregistraties maken oorzaakanalyse per serienummer mogelijk. Het contract definieert de verplichtingen voor inspectie, vervanging en rework en de QA-directeur geeft de partij vrij. Geretoucheerde planken worden volledig opnieuw getest — nooit alleen steekproefsgewijs gecontroleerd.'
    - q: 'Kunnen jullie echt 100% van de planken vóór verzending testen?'
      a: 'Ja — en de registraties bewijzen het. Elke kamer wordt opgepompt tot 18,0 PSI en 24 uur vastgehouden met continue sensorregistratie; elke kamer met een drukval van meer dan 0,50 PSI in 24 uur wordt automatisch afgekeurd en opnieuw gecontroleerd. De testprotocollen zijn gekoppeld aan elk serienummer en maken deel uit van de partijdocumentatie.'
    - q: 'Welke certificeringen bezitten jullie daadwerkelijk?'
      a: 'ISO 9001:2015 kwaliteitsbeheer, ISO 25649- en CE-conformiteit voor opblaasbare SUP-producten, en BSCI-, REACH- en RoHS-conformiteit voor fabriek en materialen. De certificaatnummers en auditregistraties worden op aanvraag of tijdens een audit verstrekt — de lijst is gepubliceerd, niet "alleen op aanvraag beschikbaar".'
    - q: 'Is mijn merk veilig — ontwerp, matrijzen en markt?'
      a: 'Ja. Je merk, je ontwerpen en je apparatuur worden beschermd via de NDA, de voorwaarden van de merkenlicentie en clausules over eigendom of overdracht van de matrijzen in het contract. De apparatuur wordt voor het merk bewaard en is overdraagbaar. Territoriale en exclusiviteitsvoorwaarden worden vóór de start van de productie schriftelijk overeengekomen.'
    - q: 'Wat is jullie echte MOQ?'
      a: 'Het MOQ hangt van het project af en wordt uitgelegd in onze MOQ-gids: samples 1–2 eenheden, co-branding kleine series 5–10 eenheden, pilotpartijen 20–50 eenheden en standaardhoeveelheden 90–100+ eenheden per rol van 150 m (ca. 180–220 planken). Eigen matrijzen draaien op volumeniveau. De berekening wordt vóór de offerte bevestigd — geen vage "lage MOQ"-cijfers.'
    - q: 'Wat gebeurt er als de productie vertraging oploopt?'
      a: 'De levertijd wordt bevestigd na controle van specificatie, artwork en verpakking — nooit vooraf beloofd. Het contract regelt de planning, het melden van vertragingen en de oplossingsweg, en het kwartaaloverleg bewaakt de leveringsprestaties ten opzichte van de afgesproken kalender.'
    - q: 'Wie ondertekent de contractdocumenten aan jullie kant?'
      a: 'Bestellingen en overeenkomsten worden gezamenlijk ondertekend door de VP Sales, de hoofdingenieur en de QA-directeur — de drie personen die verantwoordelijk zijn voor respectievelijk commercieel beleid, technische uitvoering en kwaliteitsvrijgave. Je ontvangt de ondertekende documenten met de contractdocumentatie.'

governance:
  tagline: 'Verantwoordelijkheidsstructuur'
  title: 'Aangewezen ondertekenaars & voorbehouden rechten'
  subtitle: 'Elke toezegging is gekoppeld aan een aangewezen rol — niet aan een verkoopafdeling.'
  body: |
    **Gezamenlijke ondertekening.** Bestellingen, kwaliteitsplannen en geschillenbeslechting worden ondertekend door drie rollen: de VP Sales (commercieel beleid), de hoofdingenieur (technische uitvoering) en de QA-directeur (kwaliteitsvrijgave). De tweetalige SOP''s staan onder versiebeheer en hebben dezelfde ondertekeningsstructuur.

    **Voorbehouden rechten.** De koper behoudt het recht om de productie te auditren, de testregistraties in te zien en de vrijgave van partijen tegen te houden tot de inspectiegoedkeuring. Rework gebeurt alleen onder een goedgekeurd wijzigingsprotocol en de vrijgave wordt gevalideerd door een onafhankelijke kwaliteitscontrole — nooit door de operators die het rework hebben uitgevoerd.

    **Overgedragen registraties.** De testprotocollen van de partijen, de conformiteitscertificaten en de inspectierapporten vergezellen elke levering en de ERP-partijtraceerbaarheid wordt 10 jaar bewaard. De registraties van de apparatuur en de matrijstekeningen gaan mee met de apparatuur als het contract dat voorschrijft.

