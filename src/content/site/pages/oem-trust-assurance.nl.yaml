answer:
  label: 'Kort antwoord'
  text: 'Vertrouwen is geen belofte: het is documentatie. We zijn een geregistreerd Chinees productiebedrijf (Qingdao Vatrad Group Co., Ltd.) met een fysieke fabriek van 12,500 m² in Qingdao, 350+ medewerkers en een jaarcapaciteit van 120.000+ planken. Je kunt de registratie verifiëren, de fabriek auditren, de QMS-SOP''s inzien, voorbeelden van kwaliteitsregistraties downloaden, inspecties door derden plannen (SGS, TÜV, BV of Intertek) en binnen 4 werkuren een ondertekende NDA ontvangen. Elke plank wordt 24 uur op 18,0 PSI getest met automatische afkeur boven 0,50 PSI drukval, en elke partij behoudt een ERP-traceerbaarheid van 10 jaar. Als een claim niet kan worden gedocumenteerd, doen we hem niet.'
  verified: 'September 2026'

