      desc: Освоение новых материалов, конструкций и способов производства ради превосходных характеристик и долговечности продукции.
    - icon: design
      title: Дизайн, ориентированный на пользователя
      desc: Глубокое понимание и превосходство над потребностями пользователей за счет эргономичного и интуитивно понятного дизайна продукции.
    - icon: globe
      title: Устойчивые практики
      desc: Минимизация нашего экологического следа за счет использования экологичных материалов и процессов.
    - icon: shield
      title: Безопасность без компромиссов
      desc: Обеспечение высочайших стандартов безопасности за счет строгих испытаний и сертификации.

pillars:
  - title: Технологический прогресс
    desc: Освоение новых материалов, конструкций и производственных процессов для обеспечения превосходных характеристик и долговечности продукции.
    icon: tech
  - title: Передовые материалы
    desc: Исследование передовых ПВХ, Hypalon, композитов и устойчивых альтернатив для улучшения свойств продукции.
    icon: materials
  - title: Устойчивость
    desc: 'Ключевое обязательство: мы посвящены ответственному отношению к окружающей среде через устойчивое производство и перерабатываемые материалы.'
    icon: sustainability

capabilities:
  tagline: Возможности
  title: Возможности НИОКР
  subtitle: Четыре основные дисциплины, дающие нам сквозной контроль над разработкой продукта —от исследования сырья до финальной сертификации.
  groups:
    - title: Наука о материалах и текстильные технологии
      items:
        - Анализ и оптимизация рецептур ПВХ и Hypalon
        - Разработка УФ-стабилизаторов, антипиренов и антимикробных добавок
        - Инженерия многослойного ламинирования и адгезии тканей
        - Испытания ускоренного старения (УФ, температура, влажность, солевой туман)
    - title: Проектирование корпусов и гидродинамика
      items:
        - Параметрический 3D-дизайн корпуса и CFD-оптимизация
        - Конечно-элементный анализ конструктивных и ударных нагрузок
        - Испытания буксируемых моделей и валидация характеристик
        - Разработка индивидуальных корпусов под специальные задачи
    - title: Технологии сварки и соединения
      items:
        - Разработка и оптимизация процесса диэлектрической ВЧ-сварки
        - Методы сварки горячим воздухом, горячим клином и ультразвуком
        - Квалификация клеевых соединений и лента для швов
        - Моделирование прочности сварных швов и прогнозирование ресурса
    - title: Испытания, сертификация и соответствие
      items:
        - Испытания системы менеджмента качества и соответствия CE
        - Независимые сторонние испытания и поддержка сертификации
        - Разработка индивидуальных протоколов испытаний для квалификации поставок
        - Анализ отказов в эксплуатации и расследование первопричин

