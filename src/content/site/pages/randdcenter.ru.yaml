vision:
  tagline: Наше видение
  title: Формируем будущее водных видов спорта
  body: Vatrad стремится возглавлять отрасль надувных лодок и SUP за счет непрерывных инноваций, неизменного качества и непоколебимой приверженности безопасности и устойчивости —в конечном счете обогащая впечатления любителей водных видов спорта по всему миру. Центр НИОКР Vatrad — это место, где страсть встречается с инновациями, задавая новые стандарты отрасли водных видов спорта.

labs_section:
  tagline: Лаборатории
  title: Наши лаборатории
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: Лаборатория тканей PVC
      description: Непрерывные исследования и испытания тканей из трубчатого ПВХ и Hypalon на предел прочности при разрыве, стойкость к УФ-излучению, истирание и морозостойкость для обеспечения долговечной надежности в морской среде.
      href: /ru/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Студия проектирования корпусов
      description: Проектирование на основе CAD и конечно-элементный анализ корпусов из HDPE, алюминия и стеклопластика. Каждый корпус цифрово моделируется с точки зрения распределения напряжений и ударостойкости до сборки первого прототипа.
      href: /ru/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: Центр ВЧ-сварки
      description: Специализированная площадка радиочастотной сварки с прецизионным контролем температуры и давления, выпускающая прочные герметичные швы, отвечающие отраслевым стандартам для надувных плавсредств.
      href: /ru/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Гидродинамический испытательный бассейн
      description: Испытания уменьшенных моделей в нашем собственном испытательном бассейне для оптимизации формы корпуса, скорости на глиссе, устойчивости и топливной экономичности при различных нагрузках и условиях моря.
      href: /ru/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Прототипная мастерская
      description: Площадка полноразмерного прототипирования и оснастки, где новые модели изготавливаются, подгоняются и проходят морские испытания. Каждый прототип проходит программу испытаний в воде продолжительностью не менее 20 часов до допуска к производству.
      href: /ru/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Лаборатория качества и инспекции
      description: Специализированная лаборатория обеспечения качества, проводящая испытания на разрыв, циклические испытания на герметичность, испытания швов на отрыв и сертификацию материалов, чтобы каждая лодка, покидающая мастерскую, соответствовала нашим опубликованным спецификациям.
      href: /ru/randdcenter/quality-inspection-lab
