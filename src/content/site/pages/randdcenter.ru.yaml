intro:
  - Центр исследований и разработок (НИОКР) Vatrad — движущая сила нашей миссии по революции в снаряжении для водных видов спорта. Мы даем любителям водных видов спорта по всему миру более безопасную, более комфортную и более приятную продукцию за счет неустанных инноваций в надувных SUP-досках для гребле и лодках. Наша слаженная команда инженеров, дизайнеров и увлеченных специалистов по водным видам спорта формирует будущее отрасли, постоянно повышая планку качества, характеристик и устойчивости.
  - Наша площадка НИОКР объединяет под одной крышей специалистов по материалам, корабельных архитекторов и производственных инженеров. От рецептуры тканей и моделирования корпуса до разработки сварочных процессов и полномасштабных морских испытаний — каждый этап разработки продукта определяется данными и подтверждается испытаниями.

mission:
  tagline: Наша миссия
  title: Инновации в будущее водных видов спорта
  pillars:
