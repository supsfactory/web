what_we_need:
  heading: 'Cosa preparare prima del briefing'
  body: |
    Un briefing completo accelera il processo. Ecco cosa aiuta:

    - **Specifiche della tavola** — lunghezza, larghezza e spessore obiettivo, peso del rider, uso previsto. Le misure di riferimento di tavole o modelli concorrenti sono utili.
    - **File di design** — grafiche vettoriali (AI, SVG, PDF) per grafiche e loghi. Se non sono ancora pronti, per la prima fattibilità bastano moodboard o immagini di riferimento.
    - **Quantità & tempi** — quantità obiettivo e piano di stagione. Basta già una stima approssimativa ("20–50 tavole entro marzo") per iniziare.
    - **Requisiti di conformità** — mercati target e requisiti di certificazione specifici oltre a CE, ISO 9001, BSCI, REACH, RoHS.
    - **Quadro di budget** — un budget indicativo per tavola o un costo a destino obiettivo ci aiuta a consigliare la piattaforma giusta.

    **Non è ancora tutto pronto?** Invia quello che hai. Ti guidiamo noi attraverso il resto.

faqs:
  tagline: FAQ
  title: 'Avviare un progetto SUP — Domande frequenti'
  items:
    - q: 'Qual è l''ordine minimo per iniziare?'
      a: 'L''ingresso è a scaglioni: prima 1–2 campioni (7–12 giorni), poi un ordine di prova di 20–50 tavole (25–35 giorni), quindi cicli di serie standard di 90–100+ tavole per configurazione approvata. Il co-branding private label parte da 5–10 unità senza fase di sviluppo.'
    - q: 'Quanto tempo serve per ricevere i campioni?'
      a: 'I campioni fisici vengono prodotti in 7–12 giorni dalla conferma della specifica e dell''acconto. Con piattaforme di scafo esistenti, l''intero ciclo dal briefing all''ordine di prova consegnato richiede in genere 8–12 settimane. Uno scafo personalizzato aggiunge 15–20 giorni di sviluppo dello stampo.'
    - q: 'Il mio design è protetto?'
      a: 'Sì. Una NDA è disponibile immediatamente — prima che tu condivida informazioni riservate. Produciamo esclusivamente a marchio dei nostri clienti e non competiamo mai con loro. Tutti i file tecnici vengono conservati in sistemi con controllo degli accessi e audit trail.'
    - q: 'Cosa chiede il modulo di briefing di progetto?'
      a: 'Il briefing chiede tipo di attività, nome dell''azienda, specifiche obiettivo della tavola, fascia di quantità di ordinazione, tempi ed eventuali requisiti di conformità. Richiede circa 5–10 minuti. Puoi allegare file di design (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) fino a 10 MB. Se non sei sicuro di un campo, saltalo — ti ricontattiamo noi.'
    - q: 'Cosa succede dopo l''invio del briefing?'
      a: 'Ricevi una risposta entro un giorno lavorativo. L''ufficio tecnico esamina il tuo briefing e fornisce un''offerta dettagliata con MOQ, spese per i campioni e un piano a tappe. Non sorge alcun impegno finché non hai esaminato e firmato il contratto. Le spese per i campioni vengono accreditate sul tuo ordine di produzione.'

