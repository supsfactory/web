answer:
  label: 'Cosa succede dopo'
  text: 'Dopo aver inviato un briefing di progetto, ricevi una risposta entro un giorno lavorativo. Prima di condividere dettagli riservati è disponibile una NDA. L''ufficio tecnico esamina il tuo briefing e fornisce un''offerta dettagliata con MOQ, spese per i campioni e un piano a tappe — in genere 7–12 giorni per i campioni e 6–8 settimane per la prima produzione dalla PO confermata. Le spese per i campioni vengono accreditate sul tuo ordine di produzione. Nessun impegno fino alla firma.'
  verified: 'Settembre 2026'

process_steps:
  tagline: Il processo
  title: 'Dal briefing alle tavole consegnate — cinque passi'
  subtitle: 'Ogni passo ha un tempo definito, un risultato documentato e una milestone go/no-go. Prosegui solo quando sei pronto.'
  steps:
    - step: 'Passo 1'
      title: 'Invia il tuo briefing di progetto'
      desc: 'Raccontaci della tua tavola — specifiche obiettivo, quantità, requisiti di conformità e tempi. Il briefing richiede 5–10 minuti. Se non sei sicuro di qualche dettaglio, condividi quello che hai e ti guidiamo noi nel resto. Una NDA è disponibile prima che tu condivida design riservati.'
    - step: 'Passo 2'
      title: 'NDA & verifica di fattibilità (1–5 giorni)'
      desc: 'Su richiesta firmiamo una NDA, poi l''ufficio tecnico verifica il tuo briefing rispetto a capacità produttiva, disponibilità dei materiali e ambito di conformità. Ricevi un''offerta dettagliata con calcolo della MOQ, spese per i campioni e un piano a tappe.'
    - step: 'Passo 3'
      title: 'Campioni & approvazione (7–21 giorni)'
      desc: '1–2 tavole fisiche secondo la tua specifica. Pagai e valuti — rigidità dello scafo, precisione grafica, adattamento degli accessori. Le modifiche vengono registrate in una BOM rivista. Il campione approvato diventa riferimento di produzione. Le spese per i campioni vengono accreditate sulla produzione.'
    - step: 'Passo 4'
      title: 'Pianificazione pre-produzione (7 giorni)'
      desc: 'Approvvigionamento dei materiali, preparazione degli stampi, conferma dell''imballaggio e riserva dello slot di produzione. Tutti i materiali vengono ispezionati in ingresso rispetto alla BOM congelata. Prima dell''avvio della produzione viene emesso un piano con le date dei gate QC.'
    - step: 'Passo 5'
      title: 'Produzione, QC & spedizione (4–6 settimane)'
      desc: 'La produzione passa attraverso il sistema di gate di ispezione a 7 livelli, con criteri superato/non superato a ogni gate. Imballaggio conforme all''export, documentazione di conformità e coordinamento del trasporto marittimo in oltre 50 paesi. Un''analisi post-consegna raccoglie i miglioramenti per l''ordine successivo.'

