faqs:
  tagline: Distributor-FAQ
  title: 'Großhandelsvertriebsprogramm — Häufig gestellte Fragen'
  items:
    - q: 'Wie hoch ist die Mindestbestellung für einen neuen Distributor?'
      a: 'Neue Vertriebspartner starten in der Regel mit einer Muster- und Vorproduktions-Freigabebestellung, gefolgt von einem ersten Container, der auf ihre Saison abgestimmt ist. Die genauen Mindestmengen hängen von der Größe des Territoriums und dem gewählten Sortiment ab; Ihr Account-Manager bestätigt die Eröffnungsmenge während der Sortiments- und Branding-Planung.'
    - q: 'Können wir die Boards unter unserer eigenen Marke verkaufen?'
      a: 'Ja. Private Label ist hier das Standardmodell: Boards werden unter Ihrer Marke mit Ihren Grafiken, Ihrer Verpackung und Ihren Spezifikationen gefertigt. SUPsfactory fertigt ausschließlich für seine Kunden und konkurriert in keinem Markt mit ihnen.'
    - q: 'Sind die Territorien exklusiv?'
      a: 'Ja. Distributor-Programme basieren auf exklusiven Territorien — jeder Großhandelspartner deckt ein definiertes Land oder eine definierte Region ab und erhält Preis- und Programm-Support für diesen Markt, wie in der kommerziellen Vereinbarung festgelegt.'
    - q: 'Unterstützen Sie Drop-Shipping?'
      a: 'Die Drop-Ship-Fähigkeit ist im Programm enthalten. Muster, Verpackung und Abwicklung werden in der Musterfreigabephase validiert, sodass Drop-Ship-Bestellungen von Tag eins sauber laufen.'
    - q: 'Welche Modelle können wir bestellen?'
      a: 'Der Fertigungskatalog umfasst aufblasbare SUP-Boards in Allround-, Touring- und Surf-Formen, aufblasbare Kajaks, Pumpen, Paddel, Schwimmwesten und Pflegezubehör sowie kundenspezifische Formen, die mit unserem Ingenieurteam entwickelt werden. Die meisten Partner starten mit 4–8 Bestseller-SKUs und erweitern in späteren Saisons.'
    - q: 'Wie werden Bestellungen versendet?'
      a: 'Bestellungen verlassen die Fabrik auf geplanten Abfahrten, mit Vorbestellungsmöglichkeit zur Stabilisierung der Frachtkosten. Ihr dedizierter Account-Manager plant Produktion und Versand rund um Ihre Prognose und den Saisonkalender.'
    - q: 'Wie bewerbe ich mich?'
      a: 'Nutzen Sie das Antragsformular auf dieser Seite oder kontaktieren Sie uns direkt. Anträge werden vom Vertriebsteam geprüft, und wir antworten innerhalb weniger Werktage mit den nächsten Schritten, einschließlich territorialer Zuordnung und einem Vertragsentwurf.'

