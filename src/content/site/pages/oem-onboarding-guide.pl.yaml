answer:
  label: 'Wprost'
  text: 'Typowy onboarding OEM trwa 2–4 tygodnie do zatwierdzenia próbki i 6–8 tygodni do pierwszej serii produkcyjnej od potwierdzonego zamówienia. Zaczynasz od złożenia briefu projektu (specyfikacja deski, wolumen, wymagania zgodności). Odpowiadamy w ciągu jednego dnia roboczego, proponujemy NDA przed udostępnieniem szczegółów własnych i wytwarzamy 1–2 fizyczne próbki w 7–12 dni do Twojego przeglądu i zatwierdzenia. Po zamrożeniu próbki następują planowanie i produkcja z ustalonymi bramkami QC na każdym etapie. Każdy krok jest udokumentowany i identyfikowalny.'
  verified: 'Wrzesień 2026'

process_steps:
  tagline: Siedem bramek
  title: 'Przepływ onboardingu — siedem bramek od briefu po dostawę'
  subtitle: 'Każda bramka ma zdefiniowane wejście, zdefiniowane wyjście i termin uzgodniony z góry. Nigdy nie przechodzisz za bramkę bez wyraźnego zatwierdzenia.'
  steps:
    - step: 'Brama 1'
      title: 'Zapytanie wstępne i NDA (Dzień 0)'
      desc: 'Złóż brief projektu przez /contact wraz z docelową specyfikacją deski, wolumenem zamówienia, wymaganiami zgodności i terminem. NDA jest dostępne natychmiast — zanim udostępnisz jakiekolwiek chronione specyfikacje techniczne lub projekt graficzny. Odpowiedź w ciągu jednego dnia roboczego.'
    - step: 'Brama 2'
      title: 'Przegląd wykonalności i wycena (Dni 1–5)'
      desc: 'Inżynieria ocenia Twój brief pod kątem możliwości produkcyjnych, dostępności materiałów i zakresu zgodności. Otrzymujesz wycenę pozycjonowaną z obliczeniem MOQ, opłatami za próbki (zaliczanymi na produkcję) i segmentami czasu realizacji — nie szacunkowy zakres, lecz harmonogram bramka po bramku.'
    - step: 'Brama 3'
      title: 'Produkcja próbki (Dni 6–17)'
      desc: 'Wykonujemy 1–2 fizyczne deski zgodnie z Twoją specyfikacją: sztywność kadłuba, faktura nakładki EVA, wierność grafiki, dopasowanie akcesoriów. Wiosłujesz na desce i oceniasz ją przed jakimkolwiek dalszym zobowiązaniem. Opłaty za próbkę zaliczają się na Twoje zamówienie produkcyjne po podpisaniu umowy.'
    - step: 'Brama 4'
      title: 'Przegląd i zatwierdzenie próbki (Dni 18–21)'
      desc: 'Oceniasz próbkę względem swojej specyfikacji — jakość jazdy, wierność grafiki, opakowanie, akcesoria. Korekty zapisujemy w zaktualizowanym BOM i zatwierdzeniu projektu graficznego. Zamrożona specyfikacja staje się wzorcem produkcyjnym dla wszystkich kolejnych serii.'
    - step: 'Brama 5'
      title: 'Planowanie przedprodukcyjne (Dni 22–28)'
      desc: 'Zakup materiałów, przygotowanie narzędzi, potwierdzenie opakowania i rezerwacja terminu produkcyjnego. Wszystkie materiały przechodzą inspekcję przychodzącą względem zamrożonego BOM. Przed rozpoczęciem produkcji wydajemy harmonogram z datami bramek QC.'
    - step: 'Brama 6'
      title: 'Produkcja i bramki QC (Dni 29–55)'
      desc: 'Produkcja przechodzi przez 7-etapowy system bramek inspekcyjnych: inspekcja materiałów przychodzących, inspekcja tkaniny drop-stitch, zgrzewanie i montaż, badanie ciśnienia i szczelności (18.0 PSI, automatyczne odrzucenie przy spadku powyżej 0.50 PSI), montaż nakładek EVA i akcesoriów, kontrola grafiki i brandingu, opakowanie końcowe i dokumentacja. Każda bramka ma kryteria zaliczenia i zapisy identyfikowalności.'
    - step: 'Brama 7'
      title: 'Wysyłka i przegląd po dostawie (Dni 56–63)'
      desc: 'Opakowanie eksportowe, dokumentacja zgodności (CE, ISO 9001, BSCI, REACH, RoHS) i koordynacja transportu morskiego do ponad 50 krajów. Przegląd po dostawie zbiera wnioski i usprawnienia na kolejny cykl zamówień.'

