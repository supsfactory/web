checklist:
  heading: 'Co przygotować przed briefem projektu'
  body: |
    Im bardziej kompletny brief, tym szybsza i dokładniejsza wycena. Oto, co warto mieć gotowe:

    - **Specyfikacja deski** — docelowa długość, szerokość, grubość, zakres masy pływaka i zamierzone zastosowanie (touring, allround, surf, wędkarstwo, joga itd.). Jeśli masz wymiary deski wzorcowej lub model konkurenta, dołącz je.
    - **Pliki projektowe** — wektorowa grafika deski (AI, SVG lub PDF), logo na nakładce EVA i ewentualny branding wtórny. Jeśli projekt nie jest gotowy, moodboard lub zdjęcia referencyjne wystarczą do wstępnej oceny wykonalności.
    - **Wolumen i termin** — docelowa ilość na pierwsze zamówienie i harmonogram sezonowy, który musisz trafić. Nawet zgrubny zakres („20–50 desek do marca”) wystarczy do potwierdzenia wykonalności i dostępności terminu.
    - **Wymagania zgodności** — rynki docelowe (UE, Ameryka Północna, Australia itd.) oraz ewentualne specyficzne wymagania certyfikacyjne lub badawcze ponad nasz standardowy zakres (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Przedział budżetowy** — orientacyjny budżet na deskę lub docenowy koszt lądowy pomaga nam dobrać właściwą platformę i poziom konstrukcji. Dokładna cena jest potwierdzana po przeglądzie inżynieryjnym — nigdy wcześniej.

    Jeśli nie masz jeszcze wszystkiego, wyślij to, co masz. Resztę pomożemy Ci uporządkować.

evidence_review:
  tagline: 'Dowody i weryfikacja'
  title: 'ZWERYFIKOWANE SPECYFIKACJE'
  body: 'Wszystkie deklaracje produkcyjne na tej stronie są weryfikowane przez nasz zespół inżynierii produkcyjnej w fabryce w Laixi, w Qingdao. Certyfikaty, zapisy kontroli jakości, raporty z prób ciśnieniowych i wytrzymałościowych oraz dzienniki identyfikowalności partii są dostępne na żądanie. Specyfikacje zweryfikowano ostatnio we wrześniu 2026.'

faqs:
  tagline: FAQ
  title: 'Onboarding OEM — najczęściej zadawane pytania'
  items:
    - q: 'Ile trwa cały proces onboardingu?'
      a: 'Zatwierdzenie próbki trwa zwykle 2–4 tygodnie (w tym produkcja próbki w 7–12 dni i Twój okres przeglądu). Pierwsza seria produkcyjna trwa 6–8 tygodni od potwierdzonego zamówienia i zaliczki. Własny kształt kadłuba dodaje 15–20 dni opracowywania formy. Każda bramka ma stały termin uzgodniony z góry.'
    - q: 'Czy muszę podpisać NDA przed udostępnieniem projektu?'
      a: 'NDA jest dostępne natychmiast na życzenie — zanim udostępnisz jakiekolwiek chronione specyfikacje techniczne lub projekt graficzny. Produkujemy wyłącznie pod markami naszych klientów i nigdy z nimi nie konkurujemy na żadnym rynku. Ta sama polityka dotyczy próbki 1 deski i programu kontenerowego.'
    - q: 'Jaka jest minimalna ilość zamówienia (MOQ) na pierwszą serię OEM?'
      a: 'Próg wejścia jest stopniowany: najpierw 1–2 próbki (gotowe w 7–12 dni), potem zamówienie próbne lub pilotażowe 20–50 desek (produkcja w 25–35 dni), a następnie standardowe serie 90–100+ desek na zatwierdzoną konfigurację. Współmarkowanie w małej serii startuje od 5–10 szt., gdy nie jest potrzebny etap rozwoju. Opłaty za próbkę zaliczają się na Twoje zamówienie produkcyjne.'
    - q: 'Jak chroniona jest własność intelektualna podczas onboardingu?'
      a: 'Twoje projekty i specyfikacje są chronione NDA podpisanym przed udostępnieniem jakichkolwiek chronionych informacji. Cała grafika, dane BOM i pliki techniczne są przechowywane w systemach z kontrolą dostępu i śladami audytu. W modelu OEM to Ty dysponujesz całą własnością intelektualną. W modelu ODM własność intelektualna zaadaptowanej platformy jest dzielona zgodnie z umową. W modelu Private Label własność intelektualna pozostaje w iSupfactory, a Ty licencjonujesz zastosowanie marki.'
    - q: 'Jakie gwarancje jakości obowiązują pierwsze zamówienie?'
      a: 'Każda deska — próbka, próbna seria czy wolumen — przechodzi ten sam 7-etapowy system bramek inspekcyjnych: inspekcja materiałów przychodzących, inspekcja tkaniny drop-stitch, zgrzewanie i montaż, 24-godzinne badanie ciśnienia i szczelności (18.0 PSI, automatyczne odrzucenie przy spadku powyżej 0.50 PSI), montaż nakładek EVA i akcesoriów, kontrola grafiki i brandingu oraz opakowanie końcowe i dokumentacja. Jakość nigdy nie jest obniżana dla mniejszych zamówień.'

