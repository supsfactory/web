faqs:
  tagline: FAQ
  title: Najczęstsze pytania o kontrolę zmian w naprawie
  items:
    - q: 'Czy fabryka może zmienić parametry naprawy bez informowania nas?'
      a: 'Nie. Każda proponowana zmiana zatwierdzonych materiałów naprawczych, warunków procesu, oprzyrządowania, metod badań, kryteriów inspekcji lub upoważnionych osób musi najpierw przejść udokumentowaną kontrolę zmian. Zmiany wpływające na zatwierdzone przez klienta specyfikacje, próbki, specyfikacje materiałowe, projekt graficzny lub kryteria akceptacji wymagają pisemnej zgody klienta.'
    - q: 'Co liczy się jako zmiana wysokiego ryzyka?'
      a: 'Zmiany materiałów naprawczych lub dostawców, warunków ciśnienia/utrzymania/utwardzania, metod naprawy zaworów/listew/szwów, kryteriów inspekcji lub akceptacji oraz rozszerzenia zakresu wady na strefy konstrukcyjne są klasyfikowane jako wysokie ryzyko. Wymagają one przeglądu międzydziałowego, zatwierdzonego planu walidacji i kontrolowanego wdrożenia pilotażowego przed zastosowaniem rutynowym.'
    - q: 'Czy odstępstwo tymczasowe można stosować bezterminowo?'
      a: 'Nie. Każde odstępstwo tymczasowe ma określone okno ważności, zakres partii, limit ilościowy i wymagania walidacyjne, a także automatyczne wygaśnięcie. Osiągnięcie limitu blokuje partię i uniemożliwia wydrukowanie metki dopuszczenia, dopóki zmiana nie zostanie formalnie oceniona.'
    - q: 'Jak udowadnia się skuteczność zmienionej metody przed pełnym zastosowaniem?'
      a: 'Zmiany wysokiego ryzyka wymagają planu walidacji: co najmniej 5 reprezentatywnych desek próbnych obejmujących granice tolerancji, badanych przez 2 niezależnych inspektorów QC względem ilościowo ustalonych kryteriów akceptacji (usunięcie nieszczelności, utrzymanie ciśnienia, działanie zaworu, trwałość szwów, wygląd). Zgoda na walidację nie jest zgodą na zastosowanie.'
    - q: 'Czy musimy zatwierdzać każdą zmianę?'
      a: 'Nie każdą, ale każda zmiana, która odsuwa produkt od zatwierdzonej przez klienta próbki, specyfikacji technicznej, specyfikacji materiałowej, projektu graficznego, opakowania lub kryteriów akceptacji, jest wdrażana wyłącznie za pisemną zgodą klienta. Bez niej deski są naprawiane zgodnie z pierwotnym wymaganiem, wymieniane albo odrzucane.'
    - q: 'Co dzieje się ze starymi dokumentami po zatwierdzeniu zmiany?'
      a: 'Stare instrukcje robocze, karty parametrów i listy kontrolne inspekcji są fizycznie zbierane i unieważniane (1-w-1-out), oznaczane jako OBSOLETE i zastępowane nową kontrolowaną rewizją po szkoleniu. Stare i nowe wersje nigdy nie współdzielą stanowiska.'
    - q: 'Jak długo przechowywane są zapisy kontroli zmian?'
      a: 'Zapisy zamknięcia — dowody walidacji, rewizje dokumentów, zapisy szkoleniowe i przeglądy skuteczności — są przechowywane zgodnie z naszą polityką przechowywania zapisów (minimum 3 lata dla zapisów zamknięcia), dzięki czemu każda zmiana pozostaje identyfikowalna dla audytów i przeglądów identyfikowalności.'

