cc_intro:
  tagline: Zakres i polityka
  title: Podstawowe zasady nadzoru
  body: |
    **Dokument:** QMS-SOP-QC-CC-001 — *Standard kontroli zmian parametrów procesu naprawy* (Rev 2.0, WersjaOficjalna). **Producent:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Odwołanie do normy:** ISO 9001:2015 Systemy Zarządzania Jakością.

    - **Bez zmian niekontrolowanych.** Zmiany parametrów naprawy muszą być kierowane przez formalną kontrolę zmian. Operatorzy na hali, kierownicy zmiany ani pojedynczy dział nigdy nie mogą modyfikować zatwierdzonych parametrów naprawy na podstawie ustnej umowy ani dopisku w karcie naprawy.
    - **Pełne pokrycie elementów.** Zakres kontrolowany obejmuje szczelność powietrzną, gniazda zaworów, listwy krawędziowe, łączenie szwów, utwardzanie gorącym powietrzem i próby utrzymania ciśnienia — każdy parametr, który może wpływać na szczelność, trwałość konstrukcyjną, wygląd, akceptację klienta lub identyfikowalność.
    - **Zgoda klienta jako granica.** Każda zmiana, która odsuwa produkt od zatwierdzonej przez klienta próbki, specyfikacji technicznej, specyfikacji materiałowej, projektu graficznego, wymagań opakowaniowych lub kryteriów akceptacji, jest wdrażana wyłącznie za pisemną zgodą klienta. Bez niej deska jest naprawiana zgodnie z pierwotnym wymaganiem, wymieniana albo odrzucana — nigdy „rozluźniana" przez samą fabrykę.

cc_scope:
  tagline: Klasyfikacja ryzyka
  title: Zakres zmian i klasyfikacja ryzyka
  subtitle: Każda z poniższych sytuacji uruchamia formalną kontrolę zmian — nigdy nie obsługujemy jej dopiskiem w karcie naprawy. Poziom ryzyka decyduje o tym, kto zatwierdza zmianę i ile walidacji jest wymagane.
  headers:
    category: Kategoria zmiany
    examples: Typowe przykłady
    risk: Ryzyko
    requirements: Wymagania dotyczące kontroli i zatwierdzenia
  rows:
    - category: 'Materiały naprawcze'
      examples: 'Klej, środek czyszczący, materiał łat, uszczelka zaworu, podkład lub zmiana dostawcy'
      risk: 'Wysokie'
      requirements: 'Przegląd międzydziałowy + walidacja kompatybilności materiału i utrzymania ciśnienia + podpis klienta tam, gdzie to wymagane'
    - category: 'Warunki procesu'
      examples: 'Przygotowanie powierzchni, temperatura i wilgotność utwardzania gorącym powietrzem, siła docisku ściąg, czas utrzymania'
      risk: 'Wysokie'
      requirements: 'Zatwierdzenie Inżynierii i Jakości wraz z walidacją okna temperaturowo-wilgotnościowego'
    - category: 'Oprzyrządowanie i miary'
      examples: 'Manometry, wykrywacze nieszczelności, pistolety gorącego powietrza, narzędzia do zaworów, oprogramowanie badawcze'
      risk: 'Średnie/wysokie'
      requirements: 'Kontrola ważności wzorcowania + ocena przydatności urządzenia'
    - category: 'Zakres wady'
      examples: 'Powiększenie obszaru naprawy; mikroszczelność powierzchni rozprzestrzeniająca się na strefy krytyczne listwy, szwu lub gniazda zaworu'
      risk: 'Wysokie'
      requirements: 'Powierzchnie nośne konstrukcyjnie: obowiązkowe zatrzymanie i ponowna ocena'
    - category: 'Metody inspekcji'
      examples: 'Metoda wykrywania nieszczelności, ciśnienie próbne (18.0 PSI), czas utrzymania (24h)'
      risk: 'Wysokie'
      requirements: 'Zatwierdzenie Jakości + potwierdzenie uzgodnienia technicznego z klientem'
    - category: 'Dokumentacja i upoważnienia'
      examples: 'Instrukcja naprawy, listy kontrolne inspekcji, logika decyzji w NCR, kwalifikacja operatora'
      risk: 'Średnie'
      requirements: 'Kontrolowana rewizja dokumentu (Rev A → Rev B) + zapisy szkoleniowe'

cc_containment:
  tagline: Reguła twardego zatrzymania
  title: Natychmiastowe ograniczenie, gdy sytuacja się zaostrza
  body: |
    > "Obowiązująca metoda naprawy zostaje poddana przeglądowi i nie może być stosowana do kolejnych partii objętych skutkami, dopóki zmiana nie zostanie oceniona i zatwierdzona, chyba że Jakość i Inżynieria zatwierdziły udokumentowane odstępstwo tymczasowe."

    Obowiązującą metodę naprawy należy natychmiast wstrzymać, gdy ponowna inspekcja naprawy wciąż zawodzi, gdy wada dotyczy stref nośnych konstrukcyjnie (podstawa zaworu, listwy krawędziowe, szwy, strefy ciśnieniowe dzioba i ogona), gdy materiał zastępczy nie został jeszcze zwalidowany albo gdy obecne parametry są sprzeczne ze specyfikacją zatwierdzoną przez klienta.

    Odstępstwa tymczasowe nigdy nie stają się stałą praktyką: każde z nich ma określone okno ważności, zakres partii, limit ilościowy, wymagania walidacyjne i mechanizm automatycznego wygaśnięcia. Wyjątek ustny nie jest wyjątkiem — jeśli nie jest udokumentowany wraz z terminem ważności, to go nie ma.

cc_flow:
  tagline: Standardowa 9-etapowa pętla zamknięta
  title: Od żądania zmiany do zamknięcia i przechowywania zapisów
  subtitle: 'Jedna udokumentowana pętla dla każdej zmiany parametru: zgłoszenie, wstępna ocena, analiza skutków, zatwierdzenie, walidacja, pilotaż, weryfikacja, rewizja, zamknięcie.'
  steps:
    - step: '01'
      title: Żądanie zmiany (ECR)
      desc: 'Żądanie może zgłosić każdy dział, ale sponsoring sprawuje kierownictwo Inżynierii, Jakości lub Produkcji. ECR odpowiada na pytania, dlaczego zmiana jest proponowana, co się zmienia, co jest objęte skutkami i jak będzie weryfikowana — wraz z numerem kontroli zmian, powiązanym NCR/CAPA, parametrem obecnym i proponowanym, partiami objętymi skutkami oraz klasyfikacją tymczasową lub trwałą.'
    - step: '02'
      title: Wstępna weryfikacja i ograniczenie
      desc: 'Żądanie jest w pierwszej kolejności weryfikowane pod kątem natychmiastowego ograniczenia: czy obowiązującą metodę trzeba teraz zatrzymać? Jeśli dopuszczalne jest odstępstwo tymczasowe, jest ono ograniczone oknem ważności, zakresem partii, limitem ilościowym i automatycznym wygaśnięciem.'
    - step: '03'
      title: Ocena skutków i ryzyka
      desc: 'Inżynieria, Jakość, Produkcja, Zakupy/Łańcuch Dostaw i Projekt oceniają właściwości produktu, kryteria akceptacji, kompatybilność materiałów, wygląd, zdolność procesu, urządzenia i miary, kwalifikacje personelu, wymagania klienta, zgodność z przepisami oraz zakres identyfikowalności.'
    - step: '04'
      title: Wspólny przegląd i zatwierdzenie
      desc: 'Zatwierdzenie następuje zgodnie ze stałą macierzą uprawnień — a nie według zasady „kto głośniej mówi". Zmiany wysokiego ryzyka wymagają zatwierdzenia międzydziałowego, a tam, gdzie to wymagane, pisemnej zgody klienta przed jakimkolwiek pilotażem.'
    - step: '05'
      title: Plan walidacji
      desc: 'W przypadku zmian wysokiego ryzyka zatwierdzony plan walidacji jest wymagany przed zastosowaniem rutynowym: reprezentatywne deski próbne, porównanie metody obecnej i proponowanej, metody badań, kryteria akceptacji, etapy inspekcji, osoby odpowiedzialne i harmonogram.'
    - step: '06'
      title: Kontrolowany pilotaż i wdrożenie
      desc: 'Nowe dokumenty są wydawane, a wersje nieaktualne wycofywane i oznaczane jako OBSOLETE; nowe materiały i miary są sprawdzane i wzorcowane; operatorzy są szkoleni i kwalifikowani; pierwsza partia przebiega przy zaostrzonym nadzorze z jednoznacznym oznaczeniem statusu.'
    - step: '07'
      title: Ponowna inspekcja i przegląd skuteczności
      desc: 'Mierzy się i analizuje odsetek napraw zaliczonych za pierwszym razem, odsetek zaliczonych ponownej inspekcji, odsetek nawrotów i akceptowalność wyglądu, zanim zmiana zostanie uznana za skuteczną — jedna naprawiona deska nigdy nie jest traktowana jako walidacja procesu.'
    - step: '08'
      title: Rewizja dokumentów i szkolenie
      desc: 'Instrukcje robocze, listy kontrolne inspekcji, opcje decyzji w NCR, karty parametrów i materiały szkoleniowe są aktualizowane do nowej rewizji, a szkolenie praktyczne i kwalifikacja operatora są odnotowywane.'
    - step: '09'
      title: Zamknięcie i przechowywanie zapisów
      desc: 'Zmiana jest zamykana dopiero po przeglądzie i zatwierdzeniu dowodów walidacji, aktualizacji dokumentów, zapisów szkoleniowych i skuteczności wdrożenia. Jeśli zamierzony efekt nie zostanie osiągnięty, zmianę modyfikuje się, przedłuża, wstrzymuje lub wycofuje.'

