cc_validation:
  tagline: Walidacja inżynierska
  title: Protokół walidacji i akceptacji — dowody zamiast deklaracji
  body: |
    Nieprzyjmujemy nieprecyzyjnych sformułowań akceptacyjnych, takich jak *„naprawiona deska musi być dobra"*. Kontrolowane brzmienie brzmi następująco:

    > "Naprawiona próbka powinna spełniać te same obowiązujące kryteria szczelności powietrznej, jakości wykonania wizualnego, działania zaworów oraz kryteria akceptacji właściwe dla projektu, co deska zgodna, chyba że zatwierdzone przez klienta odstępstwo wprost określa kryterium alternatywne."

    Dowody walidacji są ilościowe, a inżynierska linia odniesienia dla naprawy szczelności powietrznej obejmuje:

    - **Usunięcie nieszczelności i utrzymanie ciśnienia.** Pierwotna nieszczelność jest usuwana bez utrzymujących się pęcherzyków w wykrywaniu wodą z mydłem; deska utrzymuje standardowe ciśnienie próbne 18.0 PSI przez 24 godziny, z netto spadkiem ciśnienia ΔP ≤ 0.2 PSI po kompensacji temperatury i wilgotności — to ostrzejsza linia odniesienia dla walidacji naprawy, odrębna od progu 0.50 PSI stosowanego przy akceptacji końcowej na linii produkcyjnej.
    - **Działanie zaworu.** Moment dokręcenia wkładu zaworu mieści się w specyfikacji 15–20 N·m, bez mikroszczelności na uszczelce pod pompowaniem wysokim ciśnieniem i dynamicznym naciskiem.
    - **Trwałość łączenia szwów.** Krawędzie połączenia nie wykazują odchodzenia, białych przebarwień ani rozwarstwienia; po cyklach starzenia cieplno-wilgotnościowego warstwa kleju nie wykazuje mięknięcia ani kruchych pęknięć.
    - **Wygląd i wykonanie.** Brak śladów spływu kleju, brak uszkodzeń EVA, brak odkształceń deski oraz przesunięcia logo czy zadrapań na powierzchni druku.

cc_engineering:
  tagline: Macierz realizacji inżynierskiej
  title: Ilościowo ustalone parametry czterech podstawowych procesów naprawy
  subtitle: 'Każdy kontrolowany proces naprawy ma zdefiniowane parametry, metodykę i kryteria akceptacji — te same liczby, których przestrzegają nasi operatorzy i które klienci mogą zweryfikować podczas audytu.'
  headers:
    process: Proces naprawy
    parameters: Kontrolowane parametry
    methodology: Metodyka badań
    acceptance: Kryteria akceptacji
  rows:
    - process: 'Naprawa nakłucia / mikroszczelności łatą'
      parameters: 'Czyszczenie rozpuszczalnikiem i suszenie 3–5 min; aktywacja gorącym powietrzem 60°C ± 5°C; wałek dociskowy ≥ 0.4 MPa'
      methodology: 'Pompowanie do 18 PSI; pełne zanurzenie w wodzie lub nałożenie wody mydlanej; obserwacja przez 10 minut'
      acceptance: 'Zero pęcherzyków; odrywanie krawędzi pod kątem 180° bez odchodzenia i bez śladów spływu kleju'
    - process: 'Ponowne spajanie listwy krawędziowej / szwu'
      parameters: 'Ściśle kontrolowany proporcjonalny stosunek składników dwuskładnikowego kleju; otoczenie 22–28°C, ≤ 65% wilgotności względnej; ścisk w uchwytce przez ≥ 4 h'
      methodology: 'Próba nadciśnieniowa 22 PSI przez 2 h; następnie 6 h suszenia w komorze cieplnej 50°C i 2 h odpoczynku w temperaturze pokojowej'
      acceptance: 'Zero rozwarstwienia, zero pęknięć; netto spadek ciśnienia ΔP ≤ 0.1 PSI; warstwa kleju bez białych przebarwień i kruchości'
    - process: 'Poluzowanie podstawy zaworu / mikroszczelność'
      parameters: 'Moment dedykowanym kluczem 18–20 N·m; uszczelka płaska bez odkształceń; potwierdzona czystość gwintów'
      methodology: 'Pompowanie do 15 PSI; 20 cykli pompowania / odpompowywania; obserwacja podczas zanurzenia pod wodą'
      acceptance: 'Zero pęcherzyków przy wkładzie zaworu i na obwodzie podstawy; moment po cyklach ≥ 16 N·m'
    - process: 'Końcowa próba utrzymania ciśnienia 24h'
      parameters: 'Ciśnienie odniesienia 18.0 PSI; manometr cyfrowy klasy 1.0 / ±0.5%; temperatura i wilgotność otoczenia zapisane i skompensowane'
      methodology: 'Cyfrowy rejestrator ciśnienia; ciągła krzywa ciśnienia 24 h'
      acceptance: 'Netto spadek ciśnienia ΔP ≤ 0.20 PSI / 24 h po kompensacji; brak wydęcia lub odkształcenia deski'

