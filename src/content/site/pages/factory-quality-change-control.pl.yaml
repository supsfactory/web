cc_pokayoke:
  tagline: Zabezpieczenia antybłędne
  title: 'Poka-Yoke: twarde blokady powstrzymujące niekontrolowane zmiany'
  subtitle: Standard jest egzekwowany nie tylko przez procedury, lecz także przez fizyczne i systemowe blokady, które sprawiają, że niekontrolowana zmiana nie może zostać wykonana.
  features:
    - icon: 1
      icon_bg: blue
      title: Brama ECR odblokowująca oprzyrządowanie
      desc: 'Stanowiska naprawy odczytują kod kreskowy ECR podpisany przez QA, zanim odblokują się pneumatyczne zawory do pompowania i mieszalnice kleju. Bez zatwierdzonego zapisu kontroli zmian nie ma możliwości dostawy — podpis kłódek po fakcie („najpierw zmiana, potem podpis") jest fizycznie zablokowany.'
    - icon: 2
      icon_bg: green
      title: Automatyczne wygaśnięcie odstępstwa tymczasowego
      desc: 'Odstępstwa tymczasowe mają w systemie twardy limit (na przykład maksymalnie 50 desek albo 7 dni kalendarzowych). Osiągnięcie limitu blokuje partię i uniemożliwia wydrukowanie metki dopuszczenia wysyłki, dopóki zmiana nie zostanie formalnie oceniona.'
    - icon: 3
      icon_bg: purple
      title: Minimalne dowody walidacji
      desc: 'Zmiany wysokiego ryzyka wymagają co najmniej 5 reprezentatywnych desek próbnych obejmujących górną i dolną granicę tolerancji, w pełni sprawdzonych przez 2 niezależnych inspektorów QC, zanim można wydać raport z walidacji — jedna naprawiona deska nigdy nie jest traktowana jako walidacja procesu.'
    - icon: 4
      icon_bg: orange
      title: Kontrola dokumentów typu 1-w-1-out
      desc: 'Nieaktualne karty stanowiskowe są fizycznie zbierane i unieważniane (dziurkowane), zanim zostanie wydana nowa karta z kontrolowaną czerwoną pieczęcią — stare i nowe wersje nigdy nie współdzielą stanowiska.'

