answer:
  label: 'Wprost'
  text: 'Zmiany parametrów naprawy nigdy nie są ustalane ustnie ani wprowadzane z mocą wsteczną w QINGDAO VATRAD GROUP.,LTD. Każda proponowana zmiana zatwierdzonych materiałów naprawczych, warunków procesu, urządzeń, metod badań, kryteriów inspekcji lub upoważnionych osób musi przejść formalną kontrolę zmian przed wdrożeniem: udokumentowane Żądanie Zmiany Inżynierskiej (ECR), ocenę skutków i ryzyka, przegląd międzydziałowy przez Inżynierię, Jakość, Produkcję, Zakupy i Projekt, zatwierdzenie na szczeblu określonym przez naszą macierz uprawnień, zatwierdzony plan walidacji dla zmian wysokiego ryzyka, kontrolowane wdrożenie pilotażowe, ponowną inspekcję i przegląd skuteczności, a zamknięcie — dopiero po rewizji dokumentu i szkoleniu. Każda zmiana wpływająca na zatwierdzone przez klienta specyfikacje, próbki, specyfikacje materiałowe, projekt graficzny lub kryteria akceptacji wymaga dodatkowo pisemnej zgody klienta.'
