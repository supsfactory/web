    - title: Grafică și branding
      description: 'Grafică pentru puntea plăcii, branding pe tub, suprapușuri EVA și ambalaje retail, dezvoltate de echipa noastră de proiectare în jurul mărcii dumneavoastră.'
      icon: 'tabler:palette'
    - title: Dezvoltarea formelor
      description: 'Formele noi ale corpului de apă pornesc ca unelte de formare proiectate și tăiate intern — uneltele adaugă 15–20 de zile la termenul proiectului.'
      icon: 'tabler:shapes'
    - title: Validarea prototipului
      description: 'Se construiește un prototip fizic, se încearcă și se trimite pentru evaluarea dumneavoastră, inclusiv cu încercări pe apă — de obicei în 7–12 zile.'
