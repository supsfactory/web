      description: 'Clauze de proprietate sau de răscumpărare a uneltelor înscrise în contract — proiectarea rămâne a dumneavoastră, iar uneltele sunt păstrate pentru comenzile repetate.'
      icon: 'tabler:lock'
    - title: De la prototip la container
      description: 'O proiectare ODM validată trece direct la producția de volum standard: 90–100+ bucăți pe lot de 150 m, în 25–35 de zile după comanda confirmată.'
      icon: 'tabler:package'

customization:
  tagline: Proiectat împreună cu dumneavoastră
  title: Ce dezvoltăm pornind de la fișa dumneavoastră
  subtitle: 'ODM înseamnă că produsul este proiectat pentru dumneavoastră de la zero sau din biblioteca noastră de platforme — acestea sunt pârghiile pe care le controlează fișa dumneavoastră:'
  items:
    - 'Profilul sportivului și piața — poziționare pentru începători, touring, cursă, yoga, pescuit sau uz mixt'
    - 'Dimensiunile plăcii — lungime, lățime, grosime și volum adaptate sportivului țintă și cazului de utilizare'
    - 'Caracterul corpului de apă — rocker, profilul șinei, forma prăbuliei și cozii reglate pentru stabilitate sau viteză'
    - 'Structura de materiale — densitate drop-stitch, număr de straturi și calitate de PVC, rigidizatoare și ranforsări de șină'
    - 'Grafică și culori — culorile mărcii, artwork-ul de pe punte și branding-ul de pe tub, dezvoltate intern'
    - 'Suprapuș de tracțiune EVA — configurație, culori și integrarea logo-ului pe întreaga punte'
    - 'Pachet de accesorii — vâsle, pompe, aripioare, lese și geanta, adaptate plăcii'
    - 'Ambalaje și prezentare retail — cutii de retail, display-uri și ambalare de export sub marca dumneavoastră'

faq_section:
  tagline: FAQ
  title: Întrebări despre dezvoltarea ODM
  questions:
    - q: Cum diferă ODM de OEM?
      a: 'ODM (Original Design Manufacturing) pornește de la fișa dumneavoastră — inginerii noștri dezvoltă structura plăcii, construcția, grafica și ambalajele, fie pornind de la un concept de piață, fie de la un obiectiv de performanță, fie prin adaptarea unei platforme validate. Dumneavoastră aprobați proiectarea înainte de producție. OEM (Original Equipment Manufacturing) fabrică conform specificației aprobate de dumneavoastră — desenele, dimensiunile, materialele și ambalajele dumneavoastră. Dețineți proiectarea și drepturile de proprietate intelectuală. Ambele trasee trec prin aceeași uzină, același sistem de control al calității și aceeași echipă de export; ODM este traseul cel mai rapid către o placă de marcă atunci când încă nu aveți o proiectare.'
    - q: Am doar o idee vagă — de unde începem?
      a: 'Trimiteți o fișă scurtă: sportivii țintă, cazurile de utilizare, dimensiuni aproximative, piețe și volume. Inginerii noștri revin cu un concept, o direcție de placă de referință și un plan de dezvoltare în decurs de o zi lucrătoare — iar un NDA este semnat înaintea oricărui schimb detaliat, la cerere.'
    - q: Cât durează dezvoltarea unei plăci SUP noi?
      a: 'Mostrele de prototip se expediază în 7–12 zile. Un corp de apă nou, cu unelte de formare personalizate, adaugă 15–20 de zile de inginerie înaintea mostrelor. Producția durează 25–35 de zile după comandă și avans.'
    - q: Care este MOQ-ul pentru o placă ODM?
      a: 'Producția de volum standard este de 90–100 de bucăți pe lot de 150 m de țesătură drop-stitch; loturile pilot încep de la 20–50 de bucăți pe platforme existente. Co-branding-ul în loturi mici începe de la 5–10 bucăți — consultați ghidul nostru MOQ și branding flexibil pentru calculul complet.'
    - q: Cine deține proiectarea și forma?
      a: 'Fișa, proiectarea și uneltele dumneavoastră sunt protejate prin NDA, prin condițiile de licență a mărcii și prin clauzele de proprietate sau răscumpărare a uneltelor înscrise în contract. Uneltele sunt păstrate pentru marca dumneavoastră și sunt transferabile.'
    - q: Puteți dezvolta o formă specifică (touring, pescuit, cursă, yoga)?
      a: 'Da. Ingineria corpului de apă acoperă toate categoriile principale de SUP — all-around, touring, cursă, yoga, pescuit și plăci pentru mai multe persoane — cu posibilitatea validării în bazinul de încercări hidrodinamice pentru formele orientate pe performanță.'
    - q: Ce certificări va purta placa dezvoltată?
      a: 'Sistem de management al calității ISO 9001:2015 (la nivelul fabricii), conformitate socială BSCI (audit de instalație amfori), documentație de conformitate CE pentru configurațiile aplicabile pieței UE (directiva privind ambarcatiunile de recreație — domeniul se confirmă pentru fiecare proiect), REACH (materiale), RoHS (accesorii electronice) și conformitate ISO 25649 pentru modelele de SUP gonflabile aplicabile. Documentele de certificare sunt pregătite pentru fiecare comandă, în funcție de piețele dumneavoastră de export.'

process:
  title: Procesul ODM — de la fișă la producția scalată
  subtitle: 'Șase etape controlate, conduse de aceeași echipă internă care proiectează, Mostrează și scalează placa dumneavoastră — totul rămâne documentat.'
  steps:
    - phase: '01'
      title: Fișă și concept
      period: 1 zi lucrătoare
      items:
        - 'Partajați sportivii țintă, cazurile de utilizare, dimensiunile, piețele și volumele — sau doar o idee.'
        - 'Inginerii noștri revin cu o direcție de concept, opțiuni de platformă și un plan de dezvoltare.'
    - phase: '02'
      title: Proiectarea corpului de apă și a structurii
      period: Săptămâna 1–2
      items:
        - 'Dimensiunile plăcii, caracterul corpului de apă, densitatea drop-stitch și structura PVC sunt ingineriate intern.'
        - 'Grafică, configurația punții EVA și conceptul de ambalaj sunt dezvoltate în jurul mărcii dumneavoastră.'
    - phase: '03'
      title: Formă și unelte
      period: +15–20 de zile (forme noi)
      items:
        - 'Unelte de formare personalizate, proiectate și tăiate pentru formele noi ale corpului de apă; platformele existente sar peste această etapă.'
        - 'Condițiile de proprietate a uneltelor sunt stabilite în contract înainte de începerea tăierii.'
    - phase: '04'
      title: Prototip și mostră
      period: 7–12 zile
      items:
        - 'Se construiește un prototip fizic, se încearcă și se trimite pentru evaluarea dumneavoastră — inclusiv încercări pe apă.'
        - 'Mostra (1–2 bucăți) validează forma, structura și branding-ul înainte de volum.'
    - phase: '05'
      title: Validare și aprobare
      period: În paralel
      items:
        - 'Verificări de reținere a aerului, menținere a presiunii, rezistență a cusăturilor, sarcină și UV, pe fiecare linie de producție.'
        - 'Documentația CE, ISO 9001, BSCI, REACH și RoHS este pregătită pentru piețele dumneavoastră de export.'
        - 'Dumneavoastră aprobați prototipul; comanda și avansul blochează slotul de producție.'
    - phase: '06'
      title: Producție și livrare
      period: 25–35 de zile
      items:
        - 'Loturile de volum standard sunt de 90–100+ bucăți pe rolă de 150 m, iar loturile pilot încep de la 20–50 de bucăți.'
        - 'Sunt incluse ambalarea de export, expedierea FOB/CIF/DDP către peste 50 de țări și sprijinul pentru comenzile repetate.'

