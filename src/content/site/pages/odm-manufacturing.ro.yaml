answer:
  label: 'Răspuns direct'
  text: 'iSupfactory este un producător SUP ODM din Qingdao, China. Dezvoltarea ODM pornește de la fișa dumneavoastră, nu de la desenele dumneavoastră: proiectarea corpului de apă (lungime, lățime, rocker, volum), structura de materiale și grafica sunt ingineriate intern, validate prin mostre de prototip în 7–12 zile și produse la MOQ de volum standard de 90–100 de bucăți pe lot de 150 m (pilot de la 20–50 de bucăți). Producția durează 25–35 de zile după comanda confirmată și avans; uneltele de formare personalizate adaugă 15–20 de zile. Documentația CE, ISO 9001, BSCI, REACH și RoHS este expediată odată cu fiecare comandă.'
  verified: 'Septembrie 2026'

