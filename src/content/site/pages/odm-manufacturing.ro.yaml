      description: 'Testare a reținerii aerului, a menținerii presiunii și a rezistenței cusăturilor pentru fiecare bucată, cu documentație de conformitate ISO 9001, BSCI, REACH, RoHS și CE aplicabilă pieței țintă (domeniul se confirmă pentru fiecare proiect).'
