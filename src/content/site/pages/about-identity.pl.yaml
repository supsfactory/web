manufacturing_scope:
  heading: 'Zakres produkcji'
  body: |
    Nasz zakres produkcji obejmuje cały łańcuch wytwarzania nadmuchiwanych desek SUP i produktów morskich — od kontroli surowców przychodzących aż po opakowanie końcowe i dokumentację eksportową.

    - **Kategorie produktów**: nadmuchiwane deski SUP (allround, touring, surf, wędkarskie, jogi, wyścigowe), nadmuchiwane kajaki, nadmuchiwane łodzie, wiosła, pompki i akcesoria.
    - **Typy konstrukcji**: PVC jednowarstwowy, PVC dwuwarstwowy, rdzeń drop-stitch z powłoką PVC. Indywidualna specyfikacja konstrukcji dla każdego projektu.
    - **Modele współpracy**: OEM (projekt należący do kupującego), ODM (opracowany w fabryce na podstawie briefu kupującego), private label/co-branding (marka na sprawdzonych platformach).
    - **Certyfikacje**: ISO 9001:2015 (zarządzanie jakością w fabryce), CE (modele przeznaczone na rynek UE, zakres wg projektu), BSCI (zgodność społeczna), REACH (bezpieczeństwo chemiczne), RoHS (substancje ograniczone).
    - **Moce produkcyjne**: ponad 120,000 desek rocznie, ok. 10,000 sztuk miesięcznie na 4 zautomatyzowanych liniach. Możliwość zwiększenia mocy przy wcześniej ustalonym harmonogramie.

brand_positioning:
  heading: 'Pozycjonowanie marki'
  body: |
    iSupfactory zajmuje określoną pozycję na rynku — nie jesteśmy marką, jesteśmy producentem. Ta różnica kształtuje każdy aspekt naszej pracy:

    - **Nigdy nie sprzedajemy pod własną marką.** Każda wyprodukowana przez nas deska nosi markę kupującego. Nigdy nie konkurujemy z klientami na żadnym rynku ani w żadnym kanale. Ta zasada nie podlega negocjacjom.
    - **Nie jesteśmy firmą handlową.** Sami prowadzimy fabrykę. Kontrola jakości, inżynieria, planowanie produkcji i dokumentacja eksportowa są obsługiwane wewnętrznie. Między Twoim zamówieniem a halą produkcyjną nie ma pośredników.
    - **Specjalizujemy się w produktach nadmuchiwanych.** To nie jest dodatkowa działka ani jedna z wielu kategorii produktów. Nadmuchiwane deski SUP i produkty morskie to nasza główna kompetencja. Każda maszyna, każdy proces i każdy punkt kontroli jakości jest zoptymalizowany pod tę kategorię produktów.
    - **Obsługujemy profesjonalnych kupujących.** Nasi klienci to marki, dystrybutorzy, ośrodki wypoczynkowe, kluby i szkoły — nie konsumenci indywidualni. Nasze ceny, struktura MOQ, dokumentacja i komunikacja są dostosowane do relacji B2B.

evidence_review:
  tagline: 'Dowody i weryfikacja'
  title: 'ZWERYFIKOWANE SPECYFIKACJE'
  body: 'Wszystkie deklaracje organizacyjne i produkcyjne na tej stronie można zweryfikować. Certyfikat ISO 9001, raport BSCI, licencja na prowadzenie działalności i dokumenty rejestracyjne fabryki są dostępne na żądanie. Wizyty w fabryce są mile widziane. Specyfikacje zweryfikowano ostatnio we wrześniu 2026.'

faqs:
  tagline: FAQ
  title: 'Identyfikacja marki — najczęściej zadawane pytania'
  items:
    - q: 'Czy iSupfactory to osobna firma od Qingdao Vatrad Group?'
      a: 'Nie. iSupfactory to marka Vatrad skierowana do kupujących, czyli morski dział produkcji w Qingdao Vatrad Group Co., Ltd. Podmiotem prawnym dla wszystkich zamówień jest Qingdao Vatrad Group Co., Ltd. Fabryka, zespół i system jakości to jedna organizacja.'
    - q: 'Czy sprzedajecie deski pod własną marką?'
      a: 'Nie. Produkujemy wyłącznie pod markami naszych klientów i nigdy nie konkurujemy z nimi na żadnym rynku. To fundamentalna zasada, a nie tymczasowe stanowisko. Jeśli znajdziesz na rynku deskę z marką iSupfactory, nie pochodzi ona z naszej fabryki.'
    - q: 'Czy mogę odwiedzić fabrykę?'
      a: 'Tak. Chętnie przyjmujemy wizyty w fabryce i możemy zorganizować uporządkowany audyt obejmujący cały proces produkcji, punkty kontroli jakości, magazyn materiałów i przegląd dokumentacji. Skontaktuj się z nami, aby umówić wizytę.'
    - q: 'Jaka jest relacja między Vatrad a iSupfactory?'
      a: 'Vatrad to nazwa działu produkcji w strukturze Qingdao Vatrad Group. iSupfactory to międzynarodowa marka skierowana do kupujących, używana dla usług produkcji OEM, ODM i private label. Oba określenia dotyczą tej samej działalności — morskiego działu produkcji w Laixi w Qingdao.'

