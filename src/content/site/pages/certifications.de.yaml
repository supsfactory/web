faqs:
  tagline: FAQ
  title: Häufig gestellte Fragen zu unserem Qualitätssystem
  items:
    - q: 'Kann ich die tatsächlichen Inspektionsberichte herunterladen?'
      a: 'Ja. Die sieben zweisprachigen Berichtsdossiers auf dieser Seite — QIP, IQC, IPQC/FAI, Luftdichtheit, FQC, PSI und Versandfreigabe — sind echte kontrollierte Aufzeichnungen mit entfernten vertraulichen Feldern. Sie zeigen die exakte Struktur, Methoden und Abnahmekriterien, die bei jeder Bestellung verwendet werden.'
    - q: 'Wie ordnen sich die sieben Gates meinem Projekt zu?'
      a: 'Jedes Projekt erhält einen Quality Inspection Plan (QIP), der die für Ihr Produkt und Ihren Markt anwendbaren Gates, den Inspektionsumfang an jedem Gate und die Aufzeichnungen definiert, die Sie erhalten werden. Laden Sie das QIP-Muster auf dieser Seite herunter, um die Struktur zu sehen.'
    - q: 'Sind diese Inspektionsmuster echt?'
      a: 'Ja. Die Muster folgen unserer tatsächlichen kontrollierten Aufzeichnungsstruktur — Dokumentenkopf, Inspektionscheckliste, Abnahmekriterien, Methode, Ergebnisse, Prüferrolle und Freigabedisposition. Alle identifizierenden Werte werden durch Demonstrationswerte (DEMO-*-Codes) ersetzt, sodass keine Kunden-, Grafik-, Auftrags- oder Preisdaten offengelegt werden.'
    - q: 'Warum sind die Muster anonymisiert?'
      a: 'Die Vertraulichkeit der Käufer hat Vorrang. Kundennamen, Grafiken, Auftragsdetails, Lieferanteninformationen und Preise sind konstruktionsbedingt geschützt. Die Anonymisierung ermöglicht jedem potenziellen Käufer, unsere Aufzeichnungsstruktur und Rückverfolgbarkeit zu verifizieren, ohne die Geschäftsdaten eines anderen Kunden offenzulegen.'
    - q: 'Können wir vollständige Inspektionsberichte für unser Projekt erhalten?'
      a: 'Ja. Für freigegebene Projekte teilen wir die für Ihre Bestellung anwendbare Qualitätsdokumentation — Qualitätsinspektionsplan, Wareneingangs-, Prozess-, Luftdichtheits-, End- und Packinspektionsberichte sowie die Versandfreigabeautorisierung — verknüpft mit Ihrer Chargen-Rückverfolgbarkeit. Sensible kommerzielle Daten bleiben wie vereinbart unter NDA.'
    - q: 'Was enthält eine chargenbezogene Inspektionsaufzeichnung?'
      a: 'Jede Aufzeichnung verknüpft die Produktionscharge mit der anwendbaren Spezifikations- oder Zeichnungsrevision, hält jeden Prüfpunkt gegen seine Abnahmekriterien mit der verwendeten Methode und dem Werkzeug fest und schließt mit Prüferrolle, Ergebnisstatus und der von Quality unterzeichneten Freigabedisposition.'
evidence_review:
  tagline: 'Nachweise & Verifizierung'
  title: 'VERIFIZIERTE SPEZIFIKATIONEN'
  body: 'Alle Fertigungsaussagen auf dieser Seite werden von unserem Manufacturing Engineering Team am Standort Laixi, Qingdao, verifiziert. Zertifikate, QC-Inspektionsaufzeichnungen, Druck- und Strukturtestberichte sowie Chargen-Rückverfolgbarkeitsaufzeichnungen sind auf Anfrage erhältlich. Spezifikationen zuletzt verifiziert im September 2026.'

