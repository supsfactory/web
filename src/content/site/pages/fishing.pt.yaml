faqs:
  - question: Pode-se estar de pé e pescar num SUP insuflável?
    answer: Sim. Os SUP insufláveis mais largos (33 polegadas ou mais) oferecem estabilidade suficiente para estar de pé e lançar. Os deck pads de EVA em toda a superfície garantem uma aderência segura mesmo molhados.
  - question: Um SUP insuflável é adequado para a pesca?
    answer: Os SUP insufláveis são plataformas excelentes para a pesca, especialmente para a pesca em zonas de águas baixas e a exploração de baixios. Os designs largos oferecem um acesso fácil ao equipamento e ao tackle.
  - question: Quanto equipamento posso levar num SUP insuflável?
    answer: A maioria dos SUP insufláveis suporta uma capacidade total de 220–300 lbs (paddler mais equipamento). Um setup de pesca típico com tackle, bolsa térmica e equipamento de segurança acrescenta 20–40 lbs. Verifiquem a indicação do volume da prancha para assegurar uma capacidade suficiente.
body: |
  <h2>Porque pescar a partir de uma prancha insuflável?</h2>
  <p>Os SUP insufláveis oferecem aos pescadores vantagens únicas que os barcos tradicionais não conseguem oferecer. O seu baixo calado permite aceder a espelhos de água que os barcos a motor não conseguem alcançar, enquanto a aproximação silenciosa minimiza o distúrbio aos peixes. A transportabilidade significa que podem pescar em lagos remotos, rios e zonas costeiras sem reboque nem rampa de alagem.</p>
  <p>As principais vantagens incluem:</p>
  <ul>
    <li><strong>Dissimulação</strong> —Sem ruído de motor significa que podem aproximar-se dos peixes sem os assustar</li>
    <li><strong>Acesso às águas baixas</strong> —Um calado de poucos centímetros permite pescar em pântanos, cursos de água e zonas de águas baixas</li>
    <li><strong>Transportabilidade</strong> —Transportem a vossa prancha para locais remotos inalcançáveis de barco</li>
    <li><strong>Possibilidade de estar de pé</strong> —As pranchas SUP permitem estar de pé para uma melhor vista sobre a água</li>
  </ul>

  <h2>Requisitos de estabilidade</h2>
  <p>A pesca exige uma plataforma estável. Ao escolherem uma prancha insuflável para a pesca, deem prioridade a:</p>
  <ul>
    <li><strong>Largura</strong> —As pranchas mais largas (33–36 polegadas) oferecem melhor estabilidade para estar de pé e lançar</li>
    <li><strong>Espessura</strong> —As pranchas de 6 polegadas oferecem mais rigidez e capacidade de peso para o equipamento</li>
    <li><strong>Volume</strong> —Um volume maior (300+ litros) suporta o peso combinado de pescador e equipamento</li>
    <li><strong>Superfície do deck</strong> —O deck pad em espuma EVA em toda a superfície oferece uma aderência antiderrapante mesmo molhado</li>
  </ul>

  <h2>Compatibilidade com o equipamento</h2>
  <p>Os setups de pesca típicos em pranchas insufláveis incluem:</p>
  <ul>
    <li><strong>Portunas</strong> —Portunas de clip ou montadas no deck para pagaiar com as mãos livres</li>
    <li><strong>Caixa ou bolsa térmica</strong> —Fixada firmemente ao deck com cordas elásticas, para o tackle e o pescado</li>
    <li><strong>Sistema de âncora</strong> —Âncora dobrável leve ou vara de stake-out para manter a posição em corrente</li>
    <li><strong>Leash da pá</strong> —Mantém a pá fixa quando ambas as mãos são precisas para pescar</li>
    <li><strong>Colete salva-vidas (PFD)</strong> —Equipamento de segurança indispensável para todos os pescadores</li>
  </ul>

  <h2>Tipos de prancha recomendados para a pesca</h2>
  <p>Diferentes cenários de pesca adaptam-se a diferentes tipos de prancha:</p>

  <h3>Pranchas SUP de pesca</h3>
  <p>Ideal para: pesca em águas baixas, pesca do black bass em lagos e pesca à vista em água baixa. A posição ereta elevada oferece uma vista excelente. Para estabilidade escolham um SUP de touring ou allround mais largo.</p>

  <h3>Pranchas SUP de pesca</h3>
  <p>Ideal para: saídas de pesca em várias pessoas, transporte de equipamento pesado e águas costeiras abrigadas. Os SUP oferecem espaço no deck e capacidade de peso mantendo-se transportáveis.</p>

  <h2>Notas de segurança</h2>
  <ul>
    <li>Usar sempre um colete salva-vidas —a pesca envolve estar de pé, lançar e mover equipamento, o que aumenta o risco de queda</li>
    <li>Verificar as condições meteorológicas e da água antes de partir</li>
    <li>Levar um apito, um telemóvel em caixa impermeável e um kit de reparação básico</li>
    <li>Comunicar a alguém o próprio spot de pesca e a hora prevista de regresso</li>
  </ul>

  <h2>FAQ</h2>
  <h3>Pode-se estar de pé e pescar num SUP insuflável?</h3>
  <p>Sim. Os SUP insufláveis mais largos (33 polegadas ou mais) oferecem estabilidade suficiente para estar de pé e lançar. Os deck pads de EVA em toda a superfície garantem uma aderência segura mesmo molhados.</p>

  <h3>Quanto equipamento posso levar num SUP insuflável?</h3>
  <p>A maioria dos SUP insufláveis suporta uma capacidade total de 220–300 lbs (paddler mais equipamento). Um setup de pesca típico com tackle, bolsa térmica e equipamento de segurança acrescenta 20–40 lbs. Verifiquem a indicação do volume da prancha para assegurar uma capacidade suficiente.</p>

