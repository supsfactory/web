answer:
  label: 'Kort svar'
  text: 'Vi gjør en CAD-modell om til et prøvebrett som kan padles og testes på 7–12 dager: produksjon av oppblåsbar prototype, vanntesting med bølger, iterasjoner på rails og baug, og deretter beslutningen om produksjonsverktøy. Å bygge tilpassede formverktøy tar 15–20 dager utover den standardiserte produksjonstiden på 25–35 dager.'
  verified: 'September 2026'

