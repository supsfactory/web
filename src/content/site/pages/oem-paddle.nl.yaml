faqs:
  title: 'FAQ over de productie van OEM-paddles'
  subtitle: 'Antwoorden op de meest gestelde vragen van merken die een eigen paddle lanceren.'
  items:
    - title: 'Hoe start ik mijn eigen paddle-merk?'
      description: 'Lanceer je merk: briefing, ontwerp, CE-gecertificeerd prototype, massaproductie en levering. Samples in 7–12 dagen, productie in 25–35 dagen na de bestelling en de aanbetaling. Ontdek onze OEM-pakketten.'
    - title: 'Wat is de productielevertijd?'
      description: 'Het sample is klaar in 7–12 dagen, de massaproductie in 25–35 dagen na de bestelling en de aanbetaling, afhankelijk van de hoeveelheid.'
    - title: 'Draagt de paddle ons logo?'
      description: 'Ja — volledig private label: logoprint, aangepaste kleuren, verpakking en labels onder jullie merk.'
    - title: 'Kan ik vanaf dag één grote hoeveelheden kopen?'
      description: 'Het MOQ wordt per project bevestigd — sample (1–2 eenheden), piloot (20–50 eenheden) en standaardvolume (90–100+ eenheden per partij), met groothandelsprijsschaal die meegroeit met de hoeveelheid.'

