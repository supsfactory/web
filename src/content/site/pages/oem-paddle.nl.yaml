answer:
  label: 'Kort antwoord'
  text: 'De minimale bestelhoeveelheid wordt per project bevestigd: sample (1–2 eenheden), piloot (20–50 eenheden) en standaardvolume (90–100+ eenheden per partij uit één drop-stitch rol van 150 m), met co-branding voor kleine partijen vanaf 5–10 eenheden. Samples vertrekken in 7–12 dagen; de serieproductie loopt 25–35 dagen na de bestelling en de aanbetaling. De CE-certificering voor modellen bestemd voor de EU-markt en de volledige conformiteitsdocumentatie zijn bij elke bestelling inbegrepen.'
  verified: 'September 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Aangepaste OEM-paddle met merkenlogo
  actions:
    - text: 'Start mijn OEM-project'
      href: /nl/contact
      variant: primary
    - text: 'Bekijk de OEM-pakketten'
      href: /nl/oem-manufacturing
      variant: secondary
