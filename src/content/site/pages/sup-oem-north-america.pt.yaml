hero:
  tagline: 'América do Norte'
  title: 'SUP insuflável OEM para a América do Norte — de Qingdao até ao teu armazém'
  subtitle: 'Amostras em 7–12 dias, produção em 25–35 dias, transporte marítimo de 4–6 semanas para os principais acessos de contentores da costa oeste e leste. FOB Qingdao, CIF ou DDP — mesma fábrica, mesmo QC, mesmo processo de desenvolvimento em seis fases como para cada cliente SUPsfactory.'

answer:
  label: 'Resposta breve'
  text: 'As marcas norte-americanas encomendam SUP insufláveis à SUPsfactory em condições padrão: a MOQ é confirmada pela configuração do projeto: os ciclos de amostras com 1–2 peças validam a construção, as pequenas séries piloto com 20–50 peças testam o mercado em plataformas existentes e a produção de série padrão roda com 90–100+ peças por design a partir de um rolo drop-stitch completo de 150 m. A primeira amostra parte 7–12 dias após a aprovação das especificações, a produção exige 25–35 dias após PO confirmada e sinal e o transporte marítimo acrescenta 4–6 semanas para os portos dos EUA e do Canadá. DDP cobre o desalfandegamento e a entrega no teu armazém.'
  verified: 'September 2026'

