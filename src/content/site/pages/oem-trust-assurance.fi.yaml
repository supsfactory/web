trust_steps:
  tagline: 'Todellinen tapaustutkimus'
  title: 'Näin Pohjois-Euroopan vuokrauslaite tarkisti meidät ennen tilausta'
  subtitle: 'Seitsemän varmennusvaihetta, jotka kaupallinen vuokrausoperaattori suoritti ennen 90–100+ kappaleen laite-erän tilausta — sama tarkistuslista on avoinna sinulle.'
  steps:
    - step: '01'
      title: 'Virallisen yksikön varmennus'
      desc: 'Ostaja pyysi kiinalaisen yritysrekisteröinnin ja vientilupa-asetuksen. iSupfactoryn takana oleva juridinen yksikkö on Qingdao Vatrad Group Co., Ltd., Qingdaossa Shandongissa vuodesta 2012 lähtien rekisteröity valmistaja — varmennettiin kansallisesta rekisteristä NDA:n alla.'
    - step: '02'
      title: 'Fyysinen tehdas ja auditointi paikan päällä'
      desc: 'Tehtasauditointi (paikan päällä ja videokierroksen kautta) vahvisti 12,500 m² laitoksen: neljä erikoistettua työpajaa, 350+ työntekijää, neljä automaattista linjaa ja noin 10,000 laudan kuukausitulokset. Auditointiraportti arkistoidaan sopimusasiakirjojen mukaan.'
    - step: '03'
      title: 'Ihmiset: aitoja insinöörejä, ei myyntitekstejä'
      desc: 'Ostaja keskusteli suoraan insinööritiimin kanssa — rungonsuunnittelu, materiaalilaboratorio ja laadunvarmistus. Projektiselvitys ja NDA vaihdettiin 4 työajan tunnin kuluessa, ja insinöörikatsaus palautui yhden työpäivän kuluessa.'
    - step: '04'
      title: 'Paperit: QMS, todistukset ja kolmansen osapuolen tarkastus'
      desc: 'ISO 9001:2015, ISO 25649 ja CE -vaatimustenmukaisuusasiakirjat, BSCI/REACH/RoHS-kirjat sekä QMS-sopimukset käytiin läpi. Ostaja ajoitti SGS:n esilähetystarkastuksen ISO 2859-1 Level II mukaisesti ensimmäiselle volyymitilaukselle — ja sai vaatimustenmukaisuustodistuksen jokaiselle erälle.'
    - step: '05'
      title: 'Data: mittauskirjat sarjanumeron mukaan'
      desc: 'Ostaja auditoi todelliset mittauskirjat: jokainen kammio testattiin 18.0 PSI:n paineella 24 tuntia ja hylättiin automaattisesti yli 0.50 PSI:n paineen laskun yli, kokoonpanolle 100 kohdan tarkistuslistat sekä 10 vuoden ERP-erien jäljitettävyys. Näytteet laadunvarmistuskirjoista toimitettiin ennen tilausta.'
    - step: '06'
      title: 'Sopimuksen suoja'
      desc: 'Tilaussopimus käsitti brändilisenssin, sovittujen alueiden yksinoikeusjakson, muovien omistajuuden ja lunastusehdot sekä määritteli työkaluston mukana siirtyvät tiedot ja kirjat. Ostaja hyväksyi muovan tehtaalla ennen tuotantoa.'
    - step: '07'
      title: 'Jatkuva ohjaus'
      desc: 'Kvartaalittaiset liiketoimintakatsaukset myyntijohtajan ja pääinsinöörin kanssa, varattu oikeus auditoida tuotannon aikana sekä eskalointipolku laadunvarmistusjohtajalle kaikissa laatuvaikutimuksissa. Sopimuksen allekirjoittivat yhteisesti myyntijohtaja, pääinsinööri ja laadunvarmistusjohtaja.'

trust_faqs:
  tagline: 'UKK'
  title: 'Ne 12 huolenaihetta, joita ostajat esittävät ennen tilausta'
  items:
    - q: 'Onko iSupfactory oikeasti tehdas vai kauppayritys?'
      a: 'iSupfactory on Qingdao Vatrad Group Co., Ltd:n SUP-tuotekehitys- ja valmistusosasto. Käytämme itse Qingdaon 12,500 m² laitosta — suunnittelu, leikkaus, hitsaus, kokoonpano ja testaus tapahtuvat yhdessä toimipisteessä. Kauppayrityksen kautta ei siirretä mitään: henkilöt, jotka vastaavat kysymyksiisi, ovat niitä, jotka rakentavat lautasi.'
    - q: 'Kenen kanssa tarkalleen olen tekemisissä projektini aikana?'
      a: 'Nimetty projekti-insinööri ja nimetetty laadunvarmistusyhteyshenkilö sekä ne osastonjohtajat, jotka allekirjoittavat asiakirjasi. Voit pyytää puhumaan suoraan pääinsinöörin, laadunvarmistusjohtajan tai tehtaanjohtajan kanssa — sekä ennen tilausta että sen jälkeen. Työntekijöiden ja sinun välissä ei ole asiakaspalvelukerrosta.'
    - q: 'Voinko vierailla tehtaalla tai auditoida sen?'
      a: 'Kyllä. Järjestämme tehtasvierailuja Qingdaon Laixin talousalueella ja tuemme etäauditointeja suoralla videokierroksella. Auditointi voidaan järjestää riippumattomasti (oma tarkastajasi tai kolmas osapuoli, kuten SGS, TUV, BV tai Intertek), ja auditointiaikataulu voidaan kirjata sopimukseen.'
    - q: 'Allekirjoitatteko NDA:n ennen kuin jaan suunnitteluni?'
      a: 'Kyllä. Vakiintunut NDA allekirjoitetaan 4 työajan tunnin kuluessa pyynnöstäsi ja ennen kuin mitään luottamuksellista erittelyä, kuvitusta tai teknistä tiedostoa jaetaan. Kaksikieliset (englanti/kiina) versiot ovat saatavilla, ja tehtaanjohtaja vahvistaa allekirjoituksellaan asiakirjan.'
    - q: 'Mistä tiedän, että laatuväitteenne ovat tosia?'
      a: 'Jokaisen väitteen takana tällä sivustolla on asiakirja: QMS-sopimukset ja tarkastusstandardit ovat ladattavissa, anonymisoituja laadunmittauspöytäkirjojen näytteitä on julkaistu, ja mittausdata kirjataan sarjanumeron mukaan 10 vuoden ERP-erien jäljitettävyyden kautta. Voit myös tilata haluamasi kolmansen osapuolen esilähetystarkastuksen.'
    - q: 'Mitä tapahtuu, jos laudat saapuvat vikoina?'
      a: 'Jokainen lauta testataan ennen pakkausta, ja erätason kirjat mahdollistavat juurisyyn jäljittämisen sarjanumeron mukaan. Sopimus määrittelee tarkastus-, vaihto- ja korjausvelvoitteet, ja laadunvarmistusjohtaja allekirjoittaa erän vapautuksen. Korjatut laudat testataan uudelleen kokonaisuudessaan — ei koskaan vain osittain.'
    - q: 'Voitteko oikeasti testata 100 % laudoista ennen lähetystä?'
      a: 'Kyllä — ja kirjat todistavat sen. Jokainen kammio täytetään 18.0 PSI:n paineeseen ja pidetään 24 tuntia jatkuvalla anturiloggauksella; kaikki kammiot, joissa 24 tunnin paineen lasku ylittää 0.50 PSI, hylätään automaattisesti ja tarkastetaan uudelleen. Mittauskirjat on linkitetty jokaiseen sarjanumeroon ja ne ovat osa erän asiakirjoja.'
    - q: 'Mitä sertifikaatteja teillä oikeesti on?'
      a: 'ISO 9001:2015 -laadunjohto, ISO 25649 ja CE -vaatimustenmukaisuus puhallettaville SUP-tuotteille sekä BSCI-, REACH- ja RoHS-vaatimustenmukaisuus laitokselle ja materiaaleille. Todistusnumerot ja auditointikirjat toimitetaan pyydettäessä tai auditin yhteydessä — luettelo on julkinen, ei "vain pyydettäessä saatavilla".'
    - q: 'Onko brändini turvassa — suunnittelu, muovat ja markkina?'
      a: 'Kyllä. Brändisi, suunnittelusi ja työkalustosi on suojattu NDA:lla, brändilisenssiehdoilla sekä sopimukseen kirjatuilla muovien omistajuus- ja lunastusehdoilla. Työkalusto säilytetään brändin käyttöön ja se on siirrettävissä. Alue- ja yksinoikeusehdot sovitaan kirjallisesti ennen tuotannon alkaa.'
    - q: 'Mikä on oikea minimitilauksenne?'
      a: 'MOQ on projektikohtainen ja käsitelty MOQ-oppaassamme: näytteet 1–2 kpl, pieni co-branding-erä 5–10 kpl, pilottierät 20–50 kpl ja vakiomäärä 90–100+ kpl 150 m rullaa kohti (noin 180–220 lautaa). Erikoismuotoiset mallit valmistetaan volyymitasolla. Laskelma vahvistetaan ennen tarjousta — ei epämääräisiä "matalan MOQ":n lukuja.'
    - q: 'Mitä tapahtuu, jos tuotanto viivästyy?'
      a: 'Toimitusaika vahvistetaan erittelyn, kuvituksen ja pakkauksen tarkastuksen jälkeen — ei koskaan lupausta etukäteen. Sopimus kattaa aikataulun, viivästysilmoituksen ja ratkaisupolut, ja kvartaalittainen liiketoimintakatsaus seuraa toimitustuloksia sovittuun aikatauluun nähden.'
    - q: 'Kuka allekirjoittaa sopimusasiakirjat puoleltanne?'
      a: 'Tilaukset ja sopimukset allekirjoittavat yhteisesti myyntijohtaja, pääinsinööri ja laadunvarmistusjohtaja — kolme henkilöä, jotka ovat vastuussa kaupallisista ehdoista, insinööritoteutuksesta ja laadunvapautuksesta. Saat allekirjoitetut asiakirjat sopimusasiakirjojen mukana.'

governance:
  tagline: 'Vastuuosuus'
  title: 'Nimetyn allekirjoittajat ja varatut oikeudet'
  subtitle: 'Jokainen sitoumus on sidottu nimettyyn rooliin — ei myyntiosastoon.'
  body: |
    **Yhteis Allekirjoitus.** Tilaukset, laatu-suunnitelmat ja riitat ratkaistaan allekirjoittavat kolme roolia: myyntijohtaja (kaupalliset ehdot), pääinsinööri (insinööritoteutus) ja laadunvarmistusjohtaja (laadunvapautus). Kaksikieliset SOP-aineisto on versiohallittu ja siinä on sama allekirjoitusrakenne.

    **Varatut oikeudet.** Ostajalla säilyy oikeus auditoida tuotantoa, tarkastella mittauskirjoja ja pidätellä erän vapautusta, kunnes tarkastus on hyväksytty. Korjaus tapahtuu vain hyväksytyn muutoskirjan alla, ja vapautuksen validoi riippumaton laadunvarmistus — ei koskaan korjausta tekevät työntekijät.

    **Siirtyvät kirjat.** Erän mittauslokit, vaatimustenmukaisuustodistukset ja tarkastusraportit toimitetaan jokaisen lähetyksen mukana, ja ERP-erien jäljitettävyys säilytetään 10 vuotta. Työkalustokirjat ja muovapiirrokset siirtyvät työkaluston mukana, kun sopimus näin määrää.

