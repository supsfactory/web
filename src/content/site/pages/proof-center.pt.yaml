traceability:
  tagline: 'Um lote, rastreado do rolo à prancha'
  title: 'Como se parece realmente a rastreabilidade'
  body: |
    A cada lote é atribuído um **código de lote ERP de 10 anos**. A cadeia registada sob um lote:

    - **Rolo à entrada** — certificado do material, número do rolo, partida de tecido verificada (tração, corte, soldadura)
    - **Corte** — ordem de nesting CNC relativamente ao ficheiro de design, percentagem de desperdício registada
    - **Soldadura & laminação** — linha, operador, parâmetros da máquina por câmara
    - **Montagem** — número de série da prancha, tipo de válvula, lote do deck pad
    - **Teste** — 18,0 PSI × 24 h de retenção por câmara, rejeição automática para além de uma queda de 0,50 PSI
    - **Libertação** — checklist de 100 pontos por prancha, libertação do Diretor de QA por lote
    - **Em diante** — certificado de conformidade (Certificate of Conformance) com a entrega; direito de audit reservado contratualmente

    Solicita o protocolo QC de exemplo antes da tua primeira encomenda — tem o mesmo formato que receberás com a entrega.

faqs:
  tagline: 'FAQ'
  title: 'Perguntas sobre as provas que os compradores fazem'
  items:
    - q: 'Esta página serve apenas para a verificação e não substitui a due diligence?'
      a: 'Exato — esta página mostra onde cada afirmação pode ser verificada: registo da entidade, certificados, máquinas, registos e uma instalação aberta a audits. Os teus habituais passos de due diligence (verificação do registo, audit, inspeção de terceiros) continuam válidos e são bem-vindos.'
    - q: 'Qual entidade deve constar na minha documentação de encomenda?'
      a: 'As encomendas são celebradas com a Qingdao Vatrad Group Co., Ltd., que opera como Vatrad (divisão de produção), com a SUPsfactory como linha de produto SUP. Os documentos contratuais são assinados pelo VP de Vendas, pelo engenheiro-chefe e pelo Diretor de QA.'
    - q: 'Posso receber cópias dos certificados antes da encomenda?'
      a: 'Sim — os números de certificado e os documentos de audit são fornecidos mediante pedido ou durante um audit. A lista é publicada, nunca "disponível apenas mediante pedido".'
    - q: 'Como posso verificar eu próprio os protocolos de teste dos lotes?'
      a: 'Cada câmara é testada durante 24 horas a 18,0 PSI com rejeição automática para além de uma queda de 0,50 PSI; os protocolos de teste estão ligados aos números de série e viajam com o certificado de conformidade de cada lote. Uma inspeção pré-envio SGS, TÜV, BV ou Intertek segundo a ISO 2859-1 Nível II pode ser programada à tua escolha.'
    - q: 'Os certificados cobrem também os acessórios?'
      a: 'A documentação de materiais REACH/RoHS vale para pranchas e acessórios da mesma encomenda e as checklists QC cobrem o kit completo — prancha, pá, bomba, leash e bolsa.'
    - q: 'O que acontece às provas depois da encomenda?'
      a: 'A rastreabilidade ERP dos lotes é conservada durante 10 anos. As SOP QMS e as normas de teste continuam descarregáveis e o comprador mantém contratualmente um direito de audit durante a produção.'

