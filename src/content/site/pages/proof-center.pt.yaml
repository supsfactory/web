hero:
  tagline: 'Hub de provas de fábrica'
  title: 'Proof Center — tudo o que afirmamos está arquivado aqui'
  subtitle: 'Uma página que associa cada afirmação deste site à sua prova: a entidade registada por trás da fábrica, os certificados com âmbito de aplicação, as máquinas que fazem o trabalho e os registos de lote que sobrevivem a cada run de produção.'
  actions:
    - { variant: primary, text: 'Solicita o pacote de verificação', href: '/pt/contact#trust-verification' }
    - { variant: ghost, text: 'Explora o sistema de qualidade', href: '/pt/quality' }

answer:
  label: 'Resposta breve'
  text: 'A cadeia de afirmação a prova funciona assim: cada afirmação deste site assenta num registo, um certificado, uma máquina, um documento ou um protocolo de teste — e cada um deles pode ser consultado. A SUPsfactory é a divisão de desenvolvimento de produto e produção de SUP da Qingdao Vatrad Group Co., Ltd. (registada em Qingdao desde 2012). A instalação de 12.500 m² dispõe de gestão de qualidade ISO-9001:2015, conformidade ISO-25649, documentação de conformidade CE, conformidade social BSCI (relatório de audit mediante pedido) e documentação de materiais REACH/RoHS para cada encomenda. Cada câmara insuflável é testada durante 24 horas a 18,0 PSI com rejeição automática para além de uma queda de 0,50 PSI e os registos de lote são conservados com rastreabilidade ERP de 10 anos. O percurso em papel é publicado ou partilhável e a fábrica em si está aberta a audits.'
  verified: 'September 2026'

