hero:
  tagline: 'Mærkeidentitet'
  title: 'Hvem er iSupfactory?'
  subtitle: 'iSupfactory er Vatrads kundeorienterede produktionsmærke, den marine produktionsdivision i Qingdao Vatrad Group Co., Ltd. — en producent af oppustelige SUP-brætter og oppustelige marine produkter i Laixi, Qingdao, Kina. Vi fremstiller udelukkende under vores kunders mærker og konkurrerer aldrig med dem på noget marked.'

answer:
  label: 'Kort fortalt'
  text: 'Juridisk enhed: Qingdao Vatrad Group Co., Ltd. Produktionsdivision: Vatrad (mærket iSupfactory). Fabrik: Laixi, Qingdao, Shandong, Kina. Virksomhedsområde: OEM-, ODM- og private label-fremstilling af oppustelige SUP-brætter, pagajer og oppustelige marine produkter. Certificeringer: ISO 9001:2015, CE (modeller til EU-markedet), BSCI, REACH, RoHS. Vi sælger ikke under eget mærke — hvert bræt, vi fremstiller, bærer køberens mærke.'
  verified: 'September 2026'

