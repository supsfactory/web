manufacturing_scope:
  heading: 'Produktionsområde'
  body: |
    Vores produktionsområde dækker hele produktionskæden for oppustelige SUP- og marine produkter — fra indgående råmaterialekontrol til endelig pakning og eksporthandelsdokumentation.

    - **Produktkategorier**: oppustelige SUP-brætter (allround, touring, surf, fishing, yoga, racing), oppustelige kajaker, oppustelige både, pagajer, pumper og tilbehør.
    - **Konstruktionstyper**: enkeltlags PVC, dobbeltlags PVC, drop-stitch-kerne med PVC-overtræk. Tilpassede konstruktionsspecifikationer pr. projekt.
    - **Samarbejdsformer**: OEM (kundens eget design), ODM (udviklet i fabrikken ud fra kundens brief), private label/co-branding (mærke på dokumenterede platforme).
    - **Certificeringer**: ISO 9001:2015 (kvalitetsledelse i fabrikken), CE (modeller til EU-markedet, omfang pr. projekt), BSCI (social overensstemmelse), REACH (kemiisk sikkerhed), RoHS (begrænsede stoffer).
    - **Produktionskapacitet**: 120,000+ brætter om året, ca. 10,000 stk. pr. måned på 4 automatiserede linjer. Opskalering mulig med forudgående planlægning.

brand_positioning:
  heading: 'Mærkepositionering'
  body: |
    iSupfactory indtager en bestemt position på markedet — vi er ikke et mærke, vi er en producent. Den forskel præger alle aspekter af den måde, vi arbejder på:

    - **Vi sælger aldrig under eget mærke.** Hvert bræt, vi fremstiller, bærer køberens mærke. Vi konkurrerer aldrig med vores kunder på nogetmarked eller i nogen kanal. Denne politik er ikke til forhandling.
    - **Vi er ikke et handelsselskab.** Vi driver fabrikken. Kvalitetskontrol, konstruktion, produktionsplanlægning og eksporthandelsdokumentation styres internt. Der er ingen mellemled mellem din ordre og produktionsgulvet.
    - **Vi er specialister i oppustelige produkter.** Det er ikke en sidegeskæft eller en produktkategori blandt mange. Oppustelige SUP- og marine produkter er vores kernekompetence. Hver maskine, hver proces og hvert kvalitetskontrolpunkt er optimeret til denne produktkategori.
    - **Vi betjener professionelle købere.** Vores kunder er mærker, distributører, resortdrivere, klubber og skoler — ikke private forbrugere. Vores priser, minimumsordrestruktur, dokumentation og kommunikation er udviklet til B2B-forhold.

evidence_review:
  tagline: 'Bevis & verifikation'
  title: 'VERIFICEREDE SPECIFIKATIONER'
  body: 'Alle organisations- og produktionspåstande på denne side kan verificeres. ISO 9001-certifikatet, BSCI-rapporten, handelsbeviset og fabrikens registreringsdokumenter udleveres på forespørgsel. Fabriksbesøg er velkomne. Specifikationerne blev senest verificeret i september 2026.'

faqs:
  tagline: FAQ
  title: 'Mærkeidentitet — ofte stillede spørgsmål'
  items:
    - q: 'Er iSupfactory en separat virksomhed fra Qingdao Vatrad Group?'
      a: 'Nej. iSupfactory er Vatrads kundeorienterede mærke, den marine produktionsdivision i Qingdao Vatrad Group Co., Ltd. Den juridiske enhed, der indgår alle ordrer, er Qingdao Vatrad Group Co., Ltd. Fabrikken, teamet og kvalitetssystemet er en og samme drift, samlet på et anlæg.'
    - q: 'Sælger I brætter under eget mærke?'
      a: 'Nej. Vi fremstiller udelukkende under vores kunders mærker og konkurrerer aldrig med dem på noget marked. Det er en grundlæggende politik — ikke en midlertidig holdning. Hvis du finder et bræt med mærket iSupfactory ude på markedet, kommer det ikke fra vores fabrik.'
    - q: 'Kan jeg besøge fabrikken?'
      a: 'Ja. Vi byder gerne fabriksbesøg velkommen og kan arrangere en struktureret audit, der dækker hele produktionsprocessen, kvalitetskontrolpunkterne, materiallageret og dokumentgennemgangen. Kontakt os for at aftale et besøg.'
    - q: 'Hvad er forholdet mellem Vatrad og iSupfactory?'
      a: 'Vatrad er navnet på produktionsdivisionen i Qingdao Vatrad Group. iSupfactory er det internationale kundeorienterede mærke, der bruges til OEM-, ODM- og private label-tjenester. Begge navne peger på den samme drift — den marine produktionsdivision i Laixi, Qingdao.'

