services:
  - title: Productontwerp & constructie
    description: Ons interne R&D-team werkt aan jouw concept of specificatie om CAD-tekeningen, 3D-modellen en prototypes te ontwikkelen. Wij bieden matrijsontwerp, optimalisatie van de vorm van de romp en advies over de materiaalkeuze.
  - title: Branding & op maat gemaakte graphics
    description: Digitaal full-colour printen, zeefdruk, embossing en etiketopties. Wij ontwikkelen merkspecifieke deck-graphics, branding van de kamers en retail-ready verpakking.
  - title: Maatwerk van materialen & specificaties
    description: Kies uit PVC (standaard, eco-vriendelijk, vlamvertragend), Hypalon/CSM, drop-stitch en hybride constructies. Aangepaste kamerkleuren, weefselgrammages en versterkingsopties.
  - title: Verpakking & logistiek
    description: Op maat gemaakte commerciële verpakking, private label dozen, vacuümverpakking, palletiseren en export-ready stouwen, in-house voorbereid.

moq_table:
  - product: Opblaasbare SUP''s
    standard_moq: 'Monster 1–2 | Pilot 20–50'
    custom_moq: 'Hoeveelheid 90–100+ (per rol van 150 m)'
    lead_time: 25–35 dagen

why_us:
  - title: Verticale integratie
    description: Wij bezitten onze fabriek, onze matrijzen en onze toeleveringsketen — geen tussenpersonen, geen onderaannemers. Dit geeft ons de controle over kwaliteit, kosten en levering.
  - title: Dubbele certificering
    description: ISO 9001-kwaliteitsbeheer en BSCI-certificering voor sociale conformiteit. Fabrieksauditrapporten op aanvraag beschikbaar.
  - title: CE-conformiteit
    description: De CE-certificering is van toepassing op modellen die bestemd zijn voor EU-markten (scope per project bevestigd). Op maat gemaakte modellen kunnen via ons gevestigde proces CE-gecertificeerd worden.
  - title: Projectspecifieke MOQ
    description: 'De MOQ wordt bevestigd door jouw projectconfiguratie — co-branding in kleine loten start vanaf 5–10 eenheden, de standaard serieproductie draait met 90–100+ eenheden per partij. Wij helpen nieuwe merken starten zonder overmatige voorraadverplichtingen.'

