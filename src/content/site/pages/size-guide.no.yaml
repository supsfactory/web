how_to_choose:
  title: Så finner du riktig størrelse
  cards:
    - title: SUP-brett
      description: Velg lengde ut fra vekten din og den tiltenkte bruken. De bredere brettene (32"+ – 81 cm+) gir mer stabilitet. De lengre brettene (11–12 ft) holder sporet bedre under turer. Tyngre padlere trenger brett med større volum.
    - title: Touring-SUP
      description: De lengre brettene (11–12 ft) passer best til distansepadling og turer. De bredere brettene (32"+ – 81 cm+) gir mer stabilitet. Kontroller bæreevnen mot den totale vekten inkludert utstyr.
    - title: Allround-SUP
      description: Velg lengde ut fra brukerens vekt og den tiltenkte bruken. Allround-brett passer for fritid, trening og yoga. Mindre brett er lettere å manøvrere.

