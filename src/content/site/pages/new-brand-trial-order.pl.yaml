    - icon: C
      icon_bg: green
      title: 'Kontrolowany przepływ gotówki'
      desc: 'Mniejsze zamówienia oznaczają mniejsze zaliczki, płatności etapowe i brak zamrożonego kapitału w magazynie. Ceny wolumenowe czekają, aż faktycznie je wypracujesz.'
    - icon: Q
      icon_bg: purple
      title: 'Jakość nigdy nie jest obniżana'
      desc: 'Zamówienie próbne 20 desek przechodzi tę samą listę kontrolną w 100 punktach i te same próby ciśnieniowe co program kontenerowy — bez kompromisów typu „najpierw ilość, potem jakość”.'
    - icon: G
      icon_bg: orange
      title: 'Gwarantowana ścieżka do skalowania'
      desc: 'Każde zamówienie próbne ma potwierdzoną drogę do wolumenu: zachowane kredyty za próbki, zamrożony projekt graficzny i BOM oraz zarezerwowane terminy produkcyjne na Twoją kolejną serię.'

scale_path:
  tagline: Po zamówieniu próbnym
  title: 'Co dzieje się po udanym zamówieniu próbnym'
  subtitle: 'Zamówienie próbne jest celowo zaprojektowane jako pierwszy krok dłuższej współpracy. To ścieżka, którą uzgadniamy przed wysłaniem pierwszej deski.'
  steps:
    - step: 'Faza 1'
      title: 'Zamówienie próbne dostarczone i ocenione'
      desc: '20–50 desek trafia w sezon, a dane o rotacji wracają z Twojego kanału — wynajmu, sprzedaży detalicznej lub bezpośredniej.'
    - step: 'Faza 2'
      title: 'Informacja zwrotna i dopracowanie'
      desc: 'Kolorystyka, grafika, opakowanie i zestaw akcesoriów są korygowane na podstawie rzeczywistej reakcji rynku. Projekt graficzny i BOM zostają zamrożone na kolejną serię.'
    - step: 'Faza 3'
      title: 'Seria wolumenowa (90–100+ desek)'
      desc: 'Standardowe serie z rolki 150 m z pełną wydajnością produkcji, brandingiem opakowań detalicznych i cenami wolumenowymi — kredyty za próbki już rozliczone.'
    - step: 'Faza 4'
      title: 'Programy w skali kontenerowej'
      desc: 'Programy 300+ desek z dostawami rozłożonymi w czasie, niestandardowymi materiałami Pantone i pełnym pipeline rozwojowym — ta sama fabryka, teraz w pełnej skali.'

trial_faqs:
  tagline: FAQ
  title: 'Najczęstsze pytania o uruchamianie marki zamówieniem próbnym'
  items:
    - q: 'Czy naprawdę mogę uruchomić markę SUP bez zamówienia kontenerowego?'
      a: 'Tak. Próg wejścia jest stopniowany: 1–2 próbki potwierdzają deskę (gotowe w 7–12 dni), zamówienie próbne 20–50 desek potwierdza rynek (produkcja w 25–35 dni), a serie wolumenowe 90–100+ desek następują dopiero wtedy, gdy rotacja potwierdzi format. Współmarkowanie w małej serii zaczyna się od 5–10 szt., gdy chcesz desek z marką bez jakiegokolwiek etapu rozwoju.'
    - q: 'Ile trwa pełna premiera od początku do końca?'
      a: 'Na gotowych platformach kadłubów typowa pierwsza premiera to 8–12 tygodni od briefu produktowego do dostarczonego zamówienia próbnego: próbki w 7–12 dni, produkcja próbna w 25–35 dni po potwierdzeniu zamówienia i zaliczki. Własny kadłub dodaje 15–20 dni opracowywania formy.'
    - q: 'Co obejmuje cena — a czego nie obejmuje?'
      a: 'Przedziały referencyjne dotyczą samych desek w cenie EXW Qingdao, w tym naniesienia brandingu i standardowego QC. Są orientacyjne: ostateczna wycena jest potwierdzana względem Twojej konfiguracji — kadłub, PCV, pokrycie graficzne, opakowanie i akcesoria — przed jakimkolwiek zobowiązaniem. Transport, cło i odprawa celna w miejscu docelowym wyceniane są osobno.'
    - q: 'Czy muszę kupić 100 albo 500 desek, aby umieścić na nich logo?'
      a: 'Nie. Współmarkowanie w małej serii umieszcza Twoje logo na nosie lub krawędziach bocznych już od 5–10 szt., a zamówienia próbne 20–50 desek obsługują pełne naniesienie grafiki w jakości produkcji seryjnej. Ilość zmienia cenę jednostkową, a nie dostępność.'
    - q: 'Co jeśli chcę zmienić projekt po zamówieniu próbnym?'
      a: 'Zmiany między serią próbną a wolumenem są normalne i mile widziane — na tym polega istota próby. Kolorystyka, grafika, opakowanie i akcesoria są wyceniane ponownie względem nowej konfiguracji, a następnie zamrażane zatwierdzeniem projektu graficznego i BOM przed serią wolumenową. Opłaty za formy sitograficzne nie są naliczane przy zamówieniach powtarzalnych o tym samym wymiarze grafiki.'
    - q: 'Czy podpisujecie NDA, zanim udostępnię swoje projekty?'
      a: 'Tak. Umowa poufności jest dostępna przed udostępnieniem chronionych specyfikacji technicznych lub projektu graficznego. Produkujemy wyłącznie pod markami naszych klientów i nigdy z nimi nie konkurujemy na żadnym rynku — ta sama polityka dotyczy próbki 1 deski i programu kontenerowego.'

