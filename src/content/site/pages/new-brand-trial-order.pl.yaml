  title: 'Ile kosztuje premiera — orientacyjne przedziały cenowe'
  subtitle: 'Orientacyjne przedziały referencyjne, EXW Qingdao (Chiny), dla standardowego kadłuba turingowego lub allround w dostępnych rozmiarach. Ostateczna wycena zależy od kształtu kadłuba, PCV, pokrycia graficznego, opakowania, akcesoriów i ilości — potwierdzana względem Twojej konfiguracji przed jakimkolwiek zobowiązaniem.'
  headers:
    stage: Etap zamówienia
    price: Cena referencyjna za deskę
    notes: Uwagi
  rows:
    - stage: 'Próbki (1–2 deski)'
      price: 'USD 250–350'
      notes: 'Fizyczna próbka z naniesioną Twoją grafiką. Opłaty za próbkę zaliczają się na zamówienie produkcyjne po podpisaniu umowy.'
    - stage: 'Zamówienie próbne / pilotażowe (20–50 desek)'
      price: 'USD 180–260'
      notes: 'Gotowe platformy kadłubów, standardowe materiały i uproszczone opakowanie. Standardowa niska ścieżka MOQ na start.'
    - stage: 'Standardowy wolumen (90–100+ desek na rolkę 150 m)'
      price: 'USD 150–220'
      notes: 'Pełne rolki tkaniny 150 m, niestandardowe warianty PCV Pantone, branding opakowań i ceny wolumenowe.'
    - stage: 'Własny kadłub i narzędzia (dodatek)'
      price: 'Wycena indywidualna'
      notes: 'Własny kształt kadłuba dodaje 15–20 dni opracowywania formy w harmonogramie ogólnym; narzędzia są pozycjonowane i wyceniane jednorazowo.'

derisk:
  tagline: Premiera bez ryzyka
  title: 'Cztery sposoby, w jakie zamówienie próbne ogranicza ryzyko premiery'
  subtitle: 'Większość nowych marek nie upada z powodu jakości produktu, lecz z powodu zapasów. Zamówienie próbne jest zaprojektowane tak, aby nieuniknialne błędy były niemożliwe.'
  features:
    - icon: I
      icon_bg: blue
      title: 'Bez dużego zamrożenia zapasów'
