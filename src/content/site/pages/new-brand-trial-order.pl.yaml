answer:
  label: 'Wprost'
  text: 'Tak — możesz uruchomić markę nadmuchiwanych desek SUP zamówieniem próbnym z niskim MOQ. Próg wejścia jest stopniowany, a nie „wszystko albo nic”: najpierw zamów 1–2 próbki (gotowe w 7–12 dni), aby zamrozić kadłub, grafikę i opakowanie; potem złóż zamówienie próbne 20–50 desek (produkcja w 25–35 dni), aby sprawdzić rzeczywistą rotację; na końcu skaluj do standardowych serii 90–100+ desek na rolkę tkaniny drop-stitch 150 m, gdy format się sprawdzi. Współmarkowanie w małej serii zaczyna się już od 5–10 szt. dla operatorów, którzy chcą desek z marką bez jakiegokolwiek etapu rozwoju. Twój pierwszy kontener pojawia się dopiero wtedy, gdy dane tego wskazują.'
  verified: 'Wrzesień 2026'

trial_included:
  tagline: Co obejmuje zamówienie próbne
  title: 'Wszystko, czego potrzebuje premiera, bez zbędnych kosztów'
  subtitle: 'Zamówienie próbne to nie pomniejszona faktura — to ten sam proces fabryczny, dopasowany do marki startującej. Oto, co obejmuje każdy program próbny.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Platforma deski i konstrukcja'
      desc: 'Sprawdzone kadłuby turingowe i allround w konstrukcji drop-stitch, ze zgrzewaniem trójwarstwowej listwy krawędziowej i sztywnością 12–15 PSI — te same platformy, których używają nasi klienci wolumenowi, w standardowych rozmiarach od 10 ft do 11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Twój branding, naprawdę zastosowany'
      desc: 'Pełnopowierzchniowy druk cyfrowy lub sitograficzny, nakładka EVA z Twoim logo i branding wtórny na nosie lub krawędziach bocznych. Współmarkowanie w małej serii wykorzystuje centralne oznaczenie iSupfactory z Twoim logo na nosie lub krawędziach.'
    - icon: P
      icon_bg: purple
      title: 'Opcje opakowania, które skalują się'
      desc: 'Zacznij od neutralnych kartonów i naklejek z kodem kreskowym, a przy kolejnych seriach przejdź na pełnokolorowe 5-warstwowe pudełka detaliczne z brandingiem. Opakowanie na zamówienie ma własne minimum drukarni; nadmiarowe pudełka przechowujemy i wydajemy zgodnie z harmonogramem.'
    - icon: Q
      icon_bg: orange
      title: 'Kontrola jakości na poziomie fabryki'
      desc: 'Każda deska przechodzi tę samą listę kontrolną montażu w 100 punktach oraz 24-godzinne badanie ciśnienia i szczelności (18.0 PSI, automatyczne odrzucenie przy spadku powyżej 0.50 PSI), które obowiązują każde zamówienie, próbkę czy kontener.'
    - icon: D
      icon_bg: blue
      title: 'Eksport i dokumentacja'
      desc: 'Dokumentacja zgodności CE, ISO 9001, BSCI, REACH i RoHS, opakowanie eksportowe i koordynacja transportu morskiego do ponad 50 krajów — od próbki 1 deski po pełne programy.'
    - icon: T
      icon_bg: green
      title: 'Termin, na którym możesz planować'
      desc: 'Próbki w 7–12 dni, produkcja próbna w 25–35 dni po potwierdzeniu zamówienia i zaliczki oraz potwierdzone terminy produkcyjne dla zamówień przedsezonowych — premiera trafia w sezon, a nie po nim.'

trial_steps:
  tagline: Mapa drogowa premiery
  title: 'Od pomysłu do pierwszej sprzedaży w sześciu bramkach'
  subtitle: 'Typowa pierwsza premiera to 8–12 tygodni od briefu do dostarczonego zamówienia próbnego na gotowych platformach — dłużej, gdy własny kadłub wymaga opracowania formy. Każda bramka ma termin uzgodniony z góry.'
  steps:
    - step: 'Brama 1'
      title: 'Brief produktowy i przegląd inżynieryjny (Dni 0–2)'
      desc: 'Dzielisz się docelowym modelem deski, ilością zamówienia, projektem graficznym i zamiarem opakowania. Przegląd inżynieryjny kończy się w ciągu jednego dnia roboczego, a NDA jest dostępne przed udostępnieniem chronionych specyfikacji.'
    - step: 'Brama 2'
      title: 'Specyfikacja, MOQ i wycena (Dni 3–7)'
      desc: 'Pozycjonowana wycena z dokładnym obliczeniem MOQ, opłatami za próbki i segmentami czasu realizacji. Opłaty za próbkę zaliczają się na Twoje zamówienie produkcyjne po podpisaniu umowy.'
    - step: 'Brama 3'
      title: 'Próbki w 7–12 dni'
      desc: '1–2 fizyczne deski potwierdzają sztywność kadłuba, fakturę nakładki EVA, wierność grafiki i dopasowanie akcesoriów. Wiosłujesz na desce, zanim zobowiążesz się na cokolwiek innego.'
    - step: 'Brama 4'
      title: 'Zamówienie próbne 20–50 desek (25–35 dni)'
      desc: 'Produkcja na gotowych platformach kadłubów ze standardowymi materiałami i uproszczonym opakowaniem — minimalny test komercyjny, który odzwierciedla rzeczywiste warunki magazynowe.'
    - step: 'Brama 5'
      title: 'Okno rotacji i informacji zwrotnej'
      desc: 'Ważna bramka jest na Twoim rynku, nie w naszej fabryce: najemcy i klienci potwierdzają format deski, grafikę i przedział cenowy, zanim zaczniesz skalować.'
    - step: 'Brama 6'
      title: 'Skalowanie do serii wolumenowych (90–100+ desek)'
      desc: 'Gdy format się sprawdzi, standardowe serie z rolki 150 m dają pełną wydajność produkcji, branding opakowań i ceny wolumenowe. Program kontenerowy jest celem, a nie warunkiem.'

