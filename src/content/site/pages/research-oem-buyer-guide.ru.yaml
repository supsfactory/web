answer:
  label: 'Прямой ответ'
  text: 'Минимальный объем заказа определяется конфигурацией проекта, а не фиксированным числом: разработка образца (1–2 единицы) подтверждает конструкцию, пилотные заказы (20–50 единиц) тестируют рынок на существующих платформах, стандартное серийное производство выполняется тиражами 90–100+ единиц на партию из полного 150-метрового рулона drop stitch, а мелкосерийный со-брендинг начинается с 5–10 единиц. Образцы отгружаются за 7–12 дней; серийное производство занимает 25–35 дней после подтвержденного PO и аванса, плюс 15–20 дней при необходимости новой оснастки.'
  verified: 'Сентябрь 2026'

content_html: |
  <h2>1. Предварительная квалификация: на что смотреть на заводе</h2>

  <h3>Сертификаты соответствия</h3>
  <ul>
    <li><strong>ISO 9001:2015</strong> – Система менеджмента качества</li>
    <li><strong>Сертификация CE</strong> – Проверьте номер аккредитованного органа</li>
    <li><strong>BSCI / SMETA / SEDEX</strong> – Аудиты социальной ответственности</li>
    <li><strong>REACH / RoHS</strong> – Декларации о соответствии материалов</li>
  </ul>

  <h3>Производственные возможности</h3>
  <ul>
    <li>Собственное ткачество ядер drop stitch или передача на аутсорс</li>
    <li>Линия нанесения покрытия ПВХ / ламинирования</li>
    <li>Оборудование для ВЧ-сварки и сварки горячим воздухом</li>
    <li>Собственное изготовление пресс-форм (механообработка на ЧПУ)</li>
    <li>Испытательная лаборатория (испытание давлением, УФ-старение, испытание на разрыв)</li>
  </ul>

  <h3>Проверка опыта</h3>
  <ul>
    <li>Лет в производстве надувных водных транспортных средств (минимум 5 лет)</li>
    <li>Количество инженеров в штате</li>
    <li>Существующие OEM/ODM-клиенты (запросите рекомендации)</li>
    <li>Направления экспорта – они уже отгружают на ваш целевой рынок?</li>
  </ul>

  <h2>2. Протоколы контроля качества</h2>
  <p>Входной контроль материалов: предел прочности при разрыве (ASTM D751 или ISO 1421), сопротивление надрыву (ASTM D2261 или ISO 4674), прочность адгезии, выборочные проверки УФ-старения.</p>
  <p>Контроль в процессе: контроль прочности швов каждые 50 единиц, проверка момента затяжки клапанов, контроль плотности нитей drop stitch, проверка размеров относительно CAD-чертежей.</p>
  <p>Финальная инспекция: 100% испытание на удержание давления (24 часа, максимальное падение 0.50 PSI), визуальный контроль, функциональная проверка клапанов, испытание случайной выборки (AQL 2.5 или 4.0 по ISO 2859).</p>

  <h2>3. Чек-лист документации по соответствию</h2>
  <ul>
    <li>Декларация о соответствии (DoC) со ссылкой на корректную директиву ЕС</li>
    <li>Сертификат CE от аккредитованного органа</li>
    <li>Протокол испытаний от аккредитованной лаборатории</li>
    <li>Паспорта безопасности материалов (MSDS)</li>
    <li>Декларация о соответствии REACH</li>
    <li>Спецификация материалов с прослеживаемостью поставщиков</li>
    <li>Отчет об инспекции завода</li>
  </ul>

  <h2>4. Переговоры по MOQ</h2>
  <p>MOQ на надувные доски SUP определяется производственным маршрутом и конфигурацией проекта, а не догадками. Все OEM/ODM-проекты Vatrad проходят три различных объемных этапа — образец, пилот и серия — и полная логика расчета объяснена в нашем <a href="/ru/oem-moq-guide">руководстве по MOQ и гибкому брендингу</a>:</p>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Производственный маршрут</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">MOQ</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Сроки</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">Разработка образца (на каждый дизайн)</td><td class="p-3 border">1 – 2 единицы</td><td class="p-3 border">Образцы за 7 – 12 дней</td></tr>
      <tr><td class="p-3 border font-medium">Пилотный заказ (существующие платформы)</td><td class="p-3 border">20 – 50 единиц</td><td class="p-3 border">Валидация рынка на складских материалах</td></tr>
      <tr><td class="p-3 border font-medium">Стандартная серийная партия (на каждый дизайн)</td><td class="p-3 border">90 – 100+ единиц</td><td class="p-3 border">25 – 35 дней после PO и аванса</td></tr>
      <tr><td class="p-3 border font-medium">Полностью индивидуальная пресс-форма / private label</td><td class="p-3 border">Подтверждается конфигурацией проекта</td><td class="p-3 border">Добавляет 15 – 20 дней на оснастку</td></tr>
    </tbody>
  </table>
  <p>Объемы на этапах образца, пилота и серии различаются: разработка образца (1–2 единицы) подтверждает конструкцию, пилотные заказы (20–50 единиц) тестируют рынок на существующих платформах, а стандартное серийное производство выполняется тиражами 90–100+ единиц на партию из полного 150-метрового рулона drop stitch — с ценовыми уровнями, растущими по мере увеличения размера заказа. Получите расчет MOQ, срок и условия оплаты по вашей конкретной доске в письменном виде до того, как примете решение о поставщике.</p>

  <h2>5. Логистика и доставка</h2>
  <p>Распространенные инкотермы: <strong>FOB</strong> (завод доставляет в порт отправления – самый распространенный), <strong>EXW</strong> (покупатель организует всю доставку от ворот завода), <strong>CIF</strong> (завод оплачивает фрахт и страхование до порта назначения).</p>
  <p>Надувная продукция имеет малый вес и большой объем — за стоимость доставки часто отвечает объемный вес (DIM). Запрашивайте вакуумную упаковку, чтобы сократить объем на 50–60%. Морская доставка из Китая в ЕС обычно занимает 25–35 дней, до западного побережья США — 7–12 дней — и это сверх производственного срока 25–35 дней.</p>

  <h2>6. Типичные ошибки</h2>
  <ul>
    <li><strong>Отсутствие аудита завода:</strong> Всегда проводите аудит сами или поручайте его третьей стороне (QIMA, SGS, Bureau Veritas)</li>
    <li><strong>Только устные спецификации:</strong> Подробный технический лист спецификации, подписанный обеими сторонами</li>
    <li><strong>Пропуск утверждения образца:</strong> Письменное подписание образцов до запуска массового производства</li>
    <li><strong>Отсутствие контроля качества в производстве:</strong> Сторонняя инспекция в ходе производства (DUPRO) и перед отгрузкой (PSI)</li>
    <li><strong>Игнорирование требований соответствия:</strong> Проверьте маркировку CE (Директива 2013/53/EU) и документацию для конкретного рынка до начала производства</li>
  </ul>

  <h2>7. Почему Vatrad</h2>
  <p>Vatrad производит OEM/ODM надувные доски SUP с 2012 года. С площадкой 12,500 м&sup2;, сертифицированной по ISO 9001, 25+ инженерами и сертификацией CE для моделей, поставляемых на рынки ЕС (область действия подтверждается по каждому проекту), мы отвечаем каждому критерию из этого руководства. Мы предлагаем пробные MOQ для новых партнеров и полные пакеты документации по соответствию.</p>
  <p>Изучите наши <a href="/ru/oem-manufacturing">услуги OEM/ODM-производства надувных SUP</a> или посетите <a href="/ru/factory">производственную площадку 12,500 м&sup2;</a>, чтобы увидеть оборудование и процессы контроля качества, лежащие в основе каждого шага выше.</p>

