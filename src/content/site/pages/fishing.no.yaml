faqs:
  - question: Kan man stå og fiske på en oppblåsbar SUP?
    answer: 'Ja. De bredere oppblåsbare SUP-ene (33 tommer eller mer) gir tilstrekkelig stabilitet til å stå og kaste. Deckpadene i hele EVA-overflaten gir trygt feste selv når de er våte.'
  - question: Er en oppblåsbar SUP egnet til fiske?
    answer: 'Oppblåsbare SUP-er er utmerkede fiskeplattformer, spesielt for fiske på grunt vann og for å kartlegge grunne områder. De brede modellene gir enkel tilgang til utstyr og agn.'
  - question: Hvor mye utstyr kan jeg ta med på en oppblåsbar SUP?
    answer: 'De fleste oppblåsbare SUP-er bærer en total last på 220–300 lb (padler pluss utstyr). Et typisk fiskeutstyr med agn, kjøleboks og sikkerhetsutstyr kommer i tillegg på 20–40 lb. Kontroller brettets volumangivelse for å sikre tilstrekkelig kapasitet.'
body: |
  <h2>Hvorfor fiske fra et oppblåsbart brett?</h2>
  <p>Oppblåsbare SUP-er gir fiskere unike fordeler som tradisjonelle båter ikke kan. Den lave dybden gir tilgang til vann som motorbåter ikke når, mens den stille nærmingen minimerer forstyrrelsen av fisken. Bæreevnen betyr at du kan fiske i avsides innsjøer, elver og kystområder uten tilhenger eller rampe.</p>
  <p>De viktigste fordelene er:</p>
  <ul>
    <li><strong>Stillhet</strong> — Ingen motorlyder betyr at du kan nærme deg fisken uten å skremme den</li>
    <li><strong>Tilgang til grunt vann</strong> — En dybde på noen centimeter gjør det mulig å fiske i myrer, grunntjern og grunne soner</li>
    <li><strong>Bæreevne</strong> — Ta med deg brettet til avsides steder som ikke er tilgjengelige med båt</li>
    <li><strong>Å stå på brettet</strong> — SUP-brett lar deg stå opp for bedre utsikt over vannet</li>
  </ul>

  <h2>Stabilitetskrav</h2>
  <p>Fiske krever en stabil plattform. Velger du et oppblåsbart brett til fiske, bør du prioritere:</p>
  <ul>
    <li><strong>Bredde</strong> — De bredere brettene (33–36 tommer) gir bedre stabilitet for å stå og kaste</li>
    <li><strong>Tykkelse</strong> — Brett på 6 tommer gir mer stivhet og bæreevne for utstyret</li>
    <li><strong>Volum</strong> — Et større volum (300+ liter) bærer den samlede vekten av fisker og utstyr</li>
    <li><strong>Deckoverflate</strong> — Deckpadet i hele EVA-skummet gir sklisikkert feste selv når det er vått</li>
  </ul>

  <h2>Kompatibilitet med utstyr</h2>
  <p>Typisk fiskeutstyr på oppblåsbare brett omfatter:</p>
  <ul>
    <li><strong>Fiskeholder</strong> — Klesholder eller deck-monterte fiskeholdere for håndfri padling</li>
    <li><strong>Kjøleboks eller bag</strong> — Solid festet på decket med elastiske remmer, for agn og fangst</li>
    <li><strong>Ankarsystem</strong> — Lett justerbart ankar eller stake-out-stang for å holde posisjonen i strømmen</li>
    <li><strong>Paddle-leash</strong> — Holder padlen på plass når begge hender trengs til fiske</li>
    <li><strong>Redningsvest (PFD)</strong> — Utenomkjennelig sikkerhetsutstyr for alle fiskere</li>
  </ul>

  <h2>Anbefalte brettyper for fiske</h2>
  <p>Ulike fiskesituasjoner passer ulike brettyper:</p>

  <h3>SUP-fiskebrett</h3>
  <p>Ideelt for: fiske på grunt vann, abborrefiske i innsjøer og såkalt sight fishing på grunt vann. Den forhøyede stående posisjonen gir utmerket utsikt. Velg en bredere touring- eller allround-SUP for stabiliteten.</p>

  <h3>SUP-fiskebrett</h3>
  <p>Ideelt for: fisketurer med flere personer, transport av tungt utstyr og beskyttede kystfarvann. SUP-er tilbyr dekkområde og bæreevne samtidig som de forblir bærbare.</p>

  <h2>Sikkerhetsnotater</h2>
  <ul>
    <li>Bruk alltid redningsvest — fiske innebærer å stå, kaste og flytte utstyr, noe som øker risikoen for å falle</li>
    <li>Kontroller vær- og vannforholdene før avreise</li>
    <li>Ta med en fløyte, en telefon i vanntett etui og en enkel reparasjonssett</li>
    <li>La noen vite hvor du fisker og når du forventer deg å være tilbake</li>
  </ul>

  <h2>FAQ</h2>
  <h3>Kan man stå og fiske på en oppblåsbar SUP?</h3>
  <p>Ja. De bredere oppblåsbare SUP-ene (33 tommer eller mer) gir tilstrekkelig stabilitet til å stå og kaste. Deckpadene i hele EVA-overflaten gir trygt feste selv når de er våte.</p>

  <h3>Hvor mye utstyr kan jeg ta med på en oppblåsbar SUP?</h3>
  <p>De fleste oppblåsbare SUP-er bærer en total last på 220–300 lb (padler pluss utstyr). Et typisk fiskeutstyr med agn, kjøleboks og sikkerhetsutstyr kommer i tillegg på 20–40 lb. Kontroller brettets volumangivelse for å sikre tilstrekkelig kapasitet.</p>

