    - dimension: 'Obvyklá dodací lhůta'
      oem: '25–35 dní + 15–20 dní na nástroj, pokud je forma nová'
      odm: '25–35 dní + čas iterací vývoje (podle složitosti)'
      pl: '25–35 dní (bez prodloužení kvůli nástroji)'
    - dimension: 'Úroveň přizpůsobení'
      oem: 'Úplná — tvar, konstrukce, materiály, grafika, obaly'
      odm: 'Úplná — závod navrhuje, vy schvalujete každý prvek'
      pl: 'Pouze grafika a obaly — bez strukturálních změn'
    - dimension: 'Proces vzorků'
      oem: '1–2 vzorky prototypu za 7–12 dní po schválení specifikace'
      odm: '1–2 vzorky prototypu za 7–12 dní po schválení návrhu'
      pl: '1–2 vzorky za 7–12 dní — platforma je již ověřená'
    - dimension: 'Vhodné pro'
      oem: 'Nakupující s hotovými návrhy, referenčními deskami nebo podrobnými specifikacemi'
      odm: 'Nakupující s produktovými nápady nebo požadavky trhu, ale bez podrobné specifikace'
      pl: 'Nakupující, kteří potřebují rychle značkové desky bez vývoje produktu'

