hero:
  tagline: 'Vyberte si cestu spolupráce'
  title: 'OEM vs ODM vs Private Label — který model sedí vášemu projektu?'
  subtitle: 'Tři způsoby spolupráce se závodem SUP, každý s jinými kompromisy vlastnictví, investic a rychlosti. Tento průvodce vysvětluje rozdíly, abyste si vybrali správnou cestu už před první poptávkou.'

answer:
  label: 'Rychlé srovnání'
  text: 'OEM: vlastníte návrh a specifikaci — vyrábíme podle vašich výkresů. ODM: náš inženýrský tým vyvine desku z vašeho zadání — schválíte ji před výrobou. Private Label: vaše značka na ověřené existující platformě bez strukturálních změn — nejrychlejší cesta na trh. Všechny tři cesty procházejí stejným závodem, systémem kontroly kvality a exportním týmem v Qingdao v Číně.'
  verified: 'září 2026'

comparison_table:
