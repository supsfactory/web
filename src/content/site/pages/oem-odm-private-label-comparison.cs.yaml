    - dimension: 'Vlastnictví návrhu a IP'
      oem: 'Vlastníte všechny návrhy, formy i duševní vlastnictví'
      odm: 'Vlastníte konečný schválený návrh; závod si ponechává IP vývojového procesu'
      pl: 'Platformní návrh vlastní závod; značku a grafiku vlastníte vy'
    - dimension: 'Forma / nástroj'
      oem: 'Nové tvary vyžadují zákazkovou formu — jednorázový poplatek za nástroj, o 15–20 dní navíc'
      odm: 'Podle specifikace může zákazková forma být potřebná — stejný časový rámec nástroje'
      pl: 'Žádná nová forma — používá se nástroj existující platformy'
    - dimension: 'Minimální objednávkové množství'
      oem: '90–100+ kusů na schválenou konfiguraci'
      odm: '90–100+ kusů na schválenou konfiguraci; pilotní dávky od 20–50 kusů'
