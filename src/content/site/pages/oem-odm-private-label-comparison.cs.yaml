ip_rules:
  tagline: 'Ochrana duševního vlastnictví'
  title: 'Jak chráníme vaše návrhy a značku'
  subtitle: 'Nezávisle na modelu spolupráce zůstává vaše grafika, nástroje a specifikační soubory vaším majetkem.'
  body: |
    **NDA před výměnou souborů.** Dojednáváme dohodu o mlčenlivosti před jakoukoli výměnou technických souborů — standardní reakční doba je do 4 pracovních hodin.

    **Žádné opětovné použití návrhu.** Vaše grafika, nástroje a specifikační soubory nikdy nesdílíme s jinými klienty ani jim neprodáváme. Formy OEM výhradně patří vám. Návrhy ODM schvalujete před výrobou. Platformy Private Label jsou sdílené konstrukce, ale vaše grafika a branding jsou exkluzivní.

    **Pouze B2B.** Vyrábíme výhradně pod značkami našich klientů. Neprodáváme koncovým zákazníkům a na žádném trhu se se svými klienty nesoutěžíme.

    **Vlastnictví forem.** Zákazkové formy financované kupujícím patří kupujícímu. Skladujeme je a udržujeme, ale bez písemného souhlasu je nemůžeme použít pro jiné klienty.

faqs:
  tagline: 'FAQ'
  title: 'Časté otázky o OEM, ODM a Private Label'
  items:
    - q: 'Mohu později přejít z private label na OEM?'
      a: 'Ano. Mnoho klientů začíná private label nebo pilotní dávkou, aby ověřilo trh, a poté po potvrzení poptávky investuje do zákazkového nástroje pro plný program OEM. Obě cesty podporuje stejný závod a systém kontroly kvality.'
    - q: 'Znamená ODM, že závod vlastní mou značku?'
      a: 'Ne. V modelu ODM vlastníte svou značku, grafiku a obaly. Závod vyvine strukturu desky z vašeho zadání a vy schválíte návrh před výrobou. Závodu zůstává IP vývojového procesu, ale schválená produktová specifikace patří vám.'
    - q: 'Je private label horší kvalitou než OEM?'
      a: 'Ne. Všechny tři cesty procházejí stejným závodem, stejným systémem kontroly kvality a stejným exportním týmem. Desky private label se staví na ověřených, validovaných platformách s plnou 24hodinovou zkouškou při tlaku 18 PSI a se stejným kontrolním listem montáže o 100 bodech.'
    - q: 'Co když nejsem jistý, který model zvolit?'
      a: 'Kontaktujte nás se svou situací — náš inženýrský tým doporučí nejpraktičtější cestu podle vašich produktových požadavků, časového rámce a cílových objemů. Před posouzením specifikace není žádný závazek nutný.'
    - q: 'Mohu získat vzorky dříve, než se zavážu k jakémukoli modelu?'
      a: 'Ano. 1–2 vzorky prototypu odeíláme za 7–12 dní. Náklad vzorku se odečítá z vaší objednávky. Díky tomu posoudíte konstrukci a kvalitu před jakýmkoli objemovým závazkem.'

