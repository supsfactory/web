  subtitle: 'Quatre voies de vérification, chacune organisée par votre spécialiste de projet — choisissez-en une ou combinez-les.'
  items:
    - title: Planifier une visite d''usine
      description: 'Nous accueillons les visites d''acheteurs à Qingdao toute l''année, avec prise en charge à l''aéroport et visite du site organisée autour de vos dates. NDA bienvenue à tout moment.'
      icon: 'tabler:map-pin'
    - title: Audit par un tiers
      description: 'Les rapports d''audit BSCI et ISO 9001 sont disponibles sur demande, et les audits co-animés sont les bienvenus pour que vous parcouriez l''usine avec l''auditeur.'
      icon: 'tabler:clipboard-check'
    - title: Inspection indépendante
      description: 'Inspection avant expédition ou en cours de production avec SGS, TÜV, BV ou Intertek selon l''échantillonnage ISO 2859-1 niveau II — à vos frais, organisée par nos soins, rapportée directement à vous.'
      icon: 'tabler:zoom-check'
    - title: Examen des documents
      description: 'Copies de certificats, dossiers d''inspection entrante/en cours/finale, rapports de test de maintien de pression et fichiers de traçabilité des lots partagés avant votre engagement.'
      icon: 'tabler:file-search'
    - title: Visite vidéo en direct
      description: 'Vous ne pouvez pas encore voyager ? Nous parcourons la ligne de production en appel vidéo — traitement drop-stitch, soudure, impression, assemblage, tests et emballage — avant votre commande.'
      icon: 'tabler:device-camera-phone'

faq_section:
  tagline: Questions de vérification
  title: Q&R vérification d''usine & inspection
  questions:
    - q: Où se trouve l''usine ?
      a: 'Le site est à Qingdao, dans le Shandong (Chine) — une installation de 12 500 m² avec 350+ employés, 4 lignes automatisées et 4 ateliers spécialisés. L''adresse et le plan sont partagés avec les acheteurs vérifiés lors de la planification d''une visite, et l''adresse de retrait figure dans les contrats, l''audit BSCI et les documents d''exportation.'
    - q: Que fabrique l''usine ?
      a: 'Des planches de SUP gonflables — de l''ingénierie de coque et du traitement du tissu drop-stitch aux graphismes, à l''assemblage, aux tests et à l''emballage export. Tous les procédés clés du SUP sont sous un même toit.'
    - q: Quels procédés sont réalisés en interne ?
      a: 'Le design de coque, l''ingénierie dimensionnelle, le traitement du tissu drop-stitch, la soudure HF, l''impression des graphismes, la découpe des tapis EVA, l''outillage de moules sur mesure, l''assemblage, les tests et l''emballage sont tous internes. Les accessoires et certaines matières premières proviennent de fournisseurs certifiés et sont conditionnés en interne pour la traçabilité.'
    - q: Les acheteurs peuvent-ils visiter l''usine ?
      a: 'Oui. Les visites d''acheteurs sont accueillies toute l''année à Qingdao. La prise en charge à l''aéroport international de Qingdao Jiaodong et une visite complète de l''usine sont organisées par votre spécialiste de projet.'
    - q: Les acheteurs peuvent-ils planifier une inspection par un tiers ?
      a: 'Oui. Les inspections SGS, TÜV, BV et Intertek sont les bienvenues avant ou pendant la production. L''inspection avant expédition utilise l''échantillonnage ISO 2859-1 niveau II, et le rapport vous est envoyé directement par l''organisme d''inspection.'
    - q: Les acheteurs peuvent-ils demander les documents QC ?
      a: 'Oui. Les copies de certificats, les dossiers d''inspection entrante/en cours/finale, les rapports de maintien de pression 18,0 PSI pendant 24 h et la check-list d''assemblage à 100 points sont délivrés par lot sur demande.'
    - q: Comment la traçabilité des lots est-elle gérée ?
      a: 'Chaque planche porte une étiquette de série. Les lots sont enregistrés dans un dossier ERP sur 10 ans reliant rouleau de tissu, matériaux, date de production, opérateurs et résultats de test à chaque numéro de série.'
    - q: Comment l''échantillon approuvé est-il utilisé ?
      a: 'L''échantillon approuvé devient la référence de production. Matériaux, dimensions, graphismes, accessoires et finition sont comparés à lui à chaque point de contrôle QC, afin que la production corresponde exactement à ce que vous avez validé.'
    - q: Comment le contrôle qualité de la production est-il assuré ?
      a: 'Un système qualité en 7 étapes (Node 01–07) exécute des portes d''inspection entrante, en cours et finale, avec test de maintien de pression 18,0 PSI pendant 24 h (rejet automatique au-delà de 0,50 PSI) et libération en fin de ligne selon l''échantillonnage ISO 2859-1 niveau II.'

