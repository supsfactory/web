why_north_america:
  tagline: 'Perché gli acquirenti in Nord America'
  title: 'Costruito per le importazioni nordamericane'
  subtitle: 'La fabbrica risponde alle domande che marchi e rivenditori di USA e Canada si pongono prima del loro primo container.'
  items:
    - title: 'DDP per costi a destino pianificabili'
      description: 'Il DDP include sdoganamento e consegna al tuo magazzino — dazi, tasse e trasporto in un importo totale. La scelta più gettonata per i primi importatori verso USA e Canada.'
    - title: 'Collegamento con la costa occidentale e orientale'
      description: 'Calcoliamo il trasporto marittimo verso i porti della costa occidentale e orientale, a seconda di ciò che bilancia al meglio tempi di transito e costi a destino per la tua logistica.'
    - title: 'Documentazione di prova e doganale'
      description: 'La documentazione CE, REACH e doganale viene preparata per i tuoi mercati target, così i tuoi documenti funzionano per i processi di importazione statunitensi e canadesi.'
    - title: 'Una fabbrica, un sistema di qualità'
      description: 'Sviluppo, campioni, produzione e QC avvengono tutti nello stabilimento di 12,500 m² — nessun giro attraverso broker, nessun campione che la produzione non riesce a replicare.'

process_notes:
  tagline: 'Come funziona'
  title: 'Dalla specifica al container'
  subtitle: 'Le stesse sei fasi, sia che tu compri due container l''anno o venti: specifica, ingegneria, campione, verifica, attrezzaggio, produzione — poi consegna FOB, CIF o DDP.'
  items:
    - title: '1. Invia la tua specifica'
      description: 'Basta una tavola di riferimento, uno schizzo o una specifica concorrente. Verifica tecnica e offerta arrivano entro un giorno lavorativo.'
    - title: '2. Approva il campione'
      description: 'Il tuo primo campione fisico parte in 7–12 giorni con un modulo di approvazione su costruzione, colori di stampa e risultati del test di pressione.'
    - title: '3. Produzione & export'
      description: 'I cicli vengono completati in 25–35 giorni con checkpoint QC durante la produzione. Packing list, fattura e polizza di carico precedono la nave.'
    - title: '4. Consegna al tuo magazzino'
      description: '4–6 settimane di trasporto marittimo verso USA e Canada — con DDP ci occupiamo noi di sdoganamento e consegna fino alla tua porta.'

faq_section:
  tagline: FAQ
  title: 'Domande sull''importazione in Nord America'
  questions:
    - q: Quanto dura il trasporto marittimo verso USA e Canada?
      a: 'Prevedi 4–6 settimane dal porto di Qingdao ai principali ingressi container della costa occidentale e orientale degli Stati Uniti oltre ai porti canadesi, a seconda della destinazione e del piano di partenza. I progetti DDP includono la timeline completa porta a porta.'
    - q: Spedite in DDP verso USA e Canada?
      a: 'Sì. Il DDP include trasporto marittimo, sdoganamento, dazi e tasse oltre alla consegna al tuo magazzino — un prezzo totale pianificabile. Sono disponibili anche FOB Qingdao e CIF.'
    - q: Qual è la MOQ per un'importazione di SUP private label?
      a: 'La MOQ viene confermata dalla configurazione del progetto: lo sviluppo dei campioni copre 1–2 pezzi, le piccole serie pilota girano con 20–50 pezzi su piattaforme esistenti e la produzione di serie standard gira con 90–100+ pezzi per design da un rotolo drop-stitch completo da 150 m.'
    - q: Supportate la documentazione doganale per USA e Canada?
      a: 'Sì. La documentazione viene preparata per i tuoi mercati target — inclusi i documenti di importazione compatibili con i processi doganali statunitensi e canadesi.'
    - q: Posso visitare la fabbrica prima dell'ordine?
      a: 'Sì. Lo stabilimento di 12,500 m² a Qingdao è aperto ai clienti — le visite virtuali alla fabbrica possono essere concordate online e le visite di persona vengono guidate attraverso le linee di produzione e le stazioni QC.'
    - q: Come avvio un progetto dal Nord America?
      a: 'Invia una tavola di riferimento, uno schizzo o una specifica. La verifica tecnica e l''offerta arrivano entro un giorno lavorativo e prima di ogni scambio di file viene firmata una NDA.'

