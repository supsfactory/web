hero:
  tagline: 'Nord America'
  title: 'SUP gonfiabile OEM per il Nord America — da Qingdao al tuo magazzino'
  subtitle: 'Campioni in 7–12 giorni, produzione in 25–35 giorni, trasporto marittimo di 4–6 settimane verso i principali ingressi container della costa occidentale e orientale. FOB Qingdao, CIF o DDP — stessa fabbrica, stesso QC, stesso processo di sviluppo a sei fasi come per ogni cliente iSupfactory.'

answer:
  label: 'Risposta breve'
  text: 'I marchi nordamericani ordinano SUP gonfiabili a iSupfactory a condizioni standard: la MOQ viene confermata dalla configurazione del progetto: i cicli di campioni con 1–2 pezzi validano la costruzione, le piccole serie pilota con 20–50 pezzi testano il mercato su piattaforme esistenti e la produzione di serie standard gira con 90–100+ pezzi per design da un rotolo drop-stitch completo da 150 m. Il primo campione parte 7–12 giorni dopo l''approvazione delle specifiche, la produzione richiede 25–35 giorni dopo PO confermata e acconto e il trasporto marittimo aggiunge 4–6 settimane verso i porti statunitensi e canadesi. DDP copre sdoganamento e consegna al tuo magazzino.'
  verified: 'Settembre 2026'

