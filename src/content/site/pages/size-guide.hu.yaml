how_to_choose:
  title: Hogyan válassza ki a megfelelő méretet
  cards:
    - title: SUP deszkák
      description: 'A hosszot az Ön súlya és a tervezett felhasználás alapján válassza. A szélesebb deszkák (32"+) több stabilitást adnak. A hosszabb deszkák (11-12 ft) jobb iramkövetést nyújtanak túrázáshoz. A nehezebb evezőknek nagyobb térfogatú deszkákra van szükségük.'
    - title: SUP túradeszkák
      description: 'A hosszabb deszkák (11–12 ft) ideálisak a távolságok lefedéséhez és a túrázáshoz. A szélesebb deszkák (32"+) több stabilitást adnak. Ellenőrizze a teherbíróképességet a teljes terhelésre, beleértve a felszerelést is.'
    - title: SUP all-around deszkák
      description: 'A hosszot az evező testsúlya és a tervezett felhasználás alapján válassza. Az all-around deszkák szabadidős evezésre, fitneszre és jóga-edzésre alkalmasak. A kisebb deszkák kezelhetőbbek.'

