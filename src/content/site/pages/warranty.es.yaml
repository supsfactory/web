label: 'Garantía OEM'
headline: 'Garantía de Fabricación OEM y Aseguramiento de Calidad de Producto'
subtitle: 'Cada tabla que fabricamos se construye contra una muestra aprobada y registros de lote documentados. Esta garantía define lo que aseguramos en los productos que hacemos bajo tu marca y cómo se resuelven las reclamaciones con esos registros.'
seo:
  headline: 'Garantía de Fabricación OEM y Aseguramiento de Calidad | SUPsfactory'
  description: 'Garantía de fabricación para SUP hinchables y otros productos marinos producidos por SUPsfactory: 5 años de cobertura en tejido principal del tubo, costuras e integridad estructural del núcleo drop-stitch, más válvulas de inflado y accesorios instalados en fábrica.'
  datePublished: '2024-01-01'
  dateModified: '2026-09-23'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Esta Garantía de Fabricación se aplica a las tablas de SUP hinchables, kayaks y productos marinos hinchables fabricados por SUPsfactory — la división de fabricación marina de Qingdao Vatrad Group Co., Ltd. — bajo programas OEM, ODM y de marca privada. La fecha efectiva es la fecha verificable de producción del lote o de envío acordada en la orden de compra. El comprador (propietario de la marca) define la política de garantía para el usuario final en su mercado; esta garantía es el compromiso de la fábrica sobre los productos tal y como se fabrican.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Cobertura y duración de la garantía de fabricación</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 años</h3>
        <p class="text-sm text-gray-600 mt-1">Integridad del tejido principal del tubo (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 años</h3>
        <p class="text-sm text-gray-600 mt-1">Integridad estructural del casco de fibra de vidrio</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 años</h3>
        <p class="text-sm text-gray-600 mt-1">Capacidad de retención de aire de las costuras del tubo hinchable</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 años</h3>
        <p class="text-sm text-gray-600 mt-1">Funcionamiento de la válvula de inflado</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 año</h3>
        <p class="text-sm text-gray-600 mt-1">Accesorios y herrajes instalados en fábrica</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 año*</h3>
        <p class="text-sm text-gray-600 mt-1">Uso comercial, de alquiler o en flota: todos los componentes</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*El uso comercial, gubernamental, de chárter, de alquiler o docente reduce la garantía a 1 año. El uso en competiciones o carreras anula la garantía por completo.</p>
  </div>

  <h2>Qué está cubierto</h2>
  <h3>Tejido principal del tubo (5 años)</h3>
  <p>La fábrica garantiza el tejido principal del tubo contra el deterioro por porosidad que comprometa sustancialmente la capacidad del producto para mantener la presión operativa. Se aplica al tejido recubierto de CSM (Hypalon) y a todos los demás materiales de tejido de tubo utilizados en la fabricación.</p>

  <h3>Integridad estructural del casco de fibra de vidrio (5 años)</h3>
  <p>Para productos con casco de plástico reforzado con fibra de vidrio (FRP), la estructura compuesta fundamental está garantizada contra fallos estructurales debidos a defectos de materiales o mano de obra.</p>

  <h3>Capacidad de retención de aire de las costuras del tubo hinchable (5 años)</h3>
  <p>Las costuras de los tubos hinchables, donde se unen durante la fabricación, están garantizadas contra defectos de fabricación que provoquen una fuga de aire sustancial a través de la costura. La inspección periódica y el mantenimiento de las presiones de inflado adecuadas son condiciones de la cobertura.</p>

  <h3>Funcionamiento de la válvula de inflado (5 años)</h3>
  <p>Las válvulas de inflado instaladas originalmente durante la producción están garantizadas contra defectos de materiales o mano de obra que impidan que la válvula retenga aire según el diseño.</p>

  <h3>Accesorios instalados en fábrica (1 año)</h3>
  <p>Los componentes y herrajes instalados en fábrica están garantizados contra defectos de material y mano de obra durante un año. Esto excluye los artículos de terceros, que están cubiertos únicamente por las garantías de sus respectivos fabricantes.</p>

  <h2>Qué no está cubierto</h2>
  <ul>
    <li>Defectos cosméticos, incluidos decoloración, manchas, pérdida de color, calcificación o cualquier alteración del aspecto</li>
    <li>Perforaciones, cortes, desgarros, roturas u otros daños físicos</li>
    <li>Craquelado, agrietamiento, abrasión, roces o deterioro por fricción o contacto</li>
    <li>Degradación por exposición a rayos UV, meteorización o condiciones atmosféricas</li>
    <li>Daños por contacto con combustibles, disolventes, ácidos, álcalis o productos químicos</li>
    <li>Daños por negligencia, uso indebido, abuso, accidente o desgaste normal</li>
    <li>Problemas de gelcoat o pintura (ampollas, craquelado, decoloración, pérdida de color)</li>
    <li>Daños por impacto, tensión, soporte inadecuado o transporte en remolque</li>
    <li>Daños por inflado/desinflado inadecuado o uso de dispositivos de inflado no aprobados</li>
    <li>Equipo, componentes o sistemas de terceros (cubiertos por sus respectivos fabricantes)</li>
  </ul>

  <h2>Obligación y reparación del fabricante</h2>
  <p>La única y exclusiva obligación de la fábrica es la reparación o sustitución, a su elección, de cualquier componente que se determine defectuoso en materiales o mano de obra y esté cubierto por esta garantía. Las reparaciones o sustituciones las realiza la fábrica o su centro de servicio autorizado designado. Los componentes reparados o sustituidos están garantizados únicamente por la parte no transcurrida del periodo de garantía original.</p>

  <h2>Condiciones de la garantía</h2>
  <ul>
    <li><strong>Referencia de lote:</strong> las reclamaciones deben hacer referencia a la orden de compra, el número de lote o el rango de series para que la fábrica pueda recuperar los registros de inspección correspondientes.</li>
    <li><strong>Base de especificación:</strong> las reclamaciones se evalúan contra la muestra aprobada, la especificación técnica, la obra de arte y la BOM que se congelaron para el lote — los mismos baselines usados en producción.</li>
    <li><strong>Mantenimiento:</strong> el producto debe mantenerse de acuerdo con las directrices publicadas de cuidado, incluida la inspección periódica y el mantenimiento de las presiones de inflado adecuadas.</li>
    <li><strong>Colaboración:</strong> el reclamante debe cooperar plena y puntualmente con la fábrica en todos los asuntos relativos a las reclamaciones de garantía, incluida la inspección de las unidades afectadas.</li>
    <li><strong>Política de garantía del comprador:</strong> el comprador, como propietario de la marca, define el programa de garantía para el usuario final en su mercado. Esta garantía de fabricación es lo que la fábrica garantiza sobre los productos tal y como se fabrican.</li>
  </ul>

  <h2>Uso comercial</h2>
  <p>Si el producto se utiliza con fines comerciales, gubernamentales, sin ánimo de lucro, de chárter, de alquiler, docentes o para cualquier propósito distinto del uso recreativo privado, el periodo de garantía de todos los componentes se reduce a un (1) año desde la fecha efectiva. El uso en competiciones, de velocidad o de resistencia anula inmediata e irrevocablemente la garantía por completo.</p>

  <h2>Cómo realizar una reclamación de garantía</h2>
  <p>Contacta con SUPsfactory con la orden de compra o referencia de lote y una descripción detallada del problema, incluidos los números de serie de las tablas cuando estén disponibles. La fábrica revisará la reclamación contra los registros del lote y te indicará los pasos para la inspección y el servicio.</p>
  <p>Para consultas sobre el servicio de garantía, contacta con nosotros a través de nuestra <a href="/es/contact" class="text-sky-600 underline">página de contacto</a> con tu número de pedido y los datos del producto.</p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 my-10">
    <h2 class="text-xl font-bold mb-3">Respaldado por un sistema de calidad documentado</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Cada tabla se prueba antes del embalaje — <a href="/es/factory/quality-inspection" class="text-sky-600 underline">7 puertas de inspección</a> registran resultados por número de serie y los lotes mantienen trazabilidad ERP de 10 años. Las reclamaciones de garantía se resuelven con estos registros de lote, no con suposiciones. Consulta el <a href="/es/quality" class="text-sky-600 underline">sistema de calidad completo</a> y descarga los <a href="https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf" class="text-sky-600 underline">informes de inspección final</a>.</p>
  </div>

  <h2>Artículos de terceros</h2>
  <p>El equipo, los componentes o los sistemas fabricados por terceros (aunque los instale la fábrica) están cubiertos exclusivamente por la garantía que ofrezca su respectivo fabricante. La fábrica renuncia expresamente a cualquier responsabilidad de garantía sobre dichos artículos de terceros.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Esta declaración de garantía es un resumen de los términos de garantía de fabricación de la fábrica para programas OEM, ODM y de marca privada. El acuerdo de compra completo rige todos los términos y condiciones. Las especificaciones están sujetas a cambios sin previo aviso. SUPsfactory es la división de fabricación de Qingdao Vatrad Group.
  </p>