meta:
  title: 'Parteneri — Distribuție și en-gros | {SITE}'
  description: 'Parteneriate de producție cu iSupfactory: distribuție, livrare en-gros, programe OEM și private label, precum și suport tehnic pentru companiile de paddle board din întreaga lume.'
  keywords:
    - 'partener distributie sup'
    - 'en-gros paddle board'
    - 'distribuitor sup gonflabil'
    - 'parteneriat sup'
  dateModified: '2026-08'
hero:
  tagline: Parteneri și distribuție
  title: 'Parteneriate de producție și distribuție'
  subtitle: "Fabricăm pentru distributori maritimi, dealeri, branduri de retail și organizații din peste 50 de țări. Dumneavoastră specificați produsul — noi îl proiectăm, îi realizăm probele și îl producem sub marca dumneavoastră."
  image:
    src: https://assets.isupfactory.com/images/sups/team/isupfactory-meeting-overseas.webp
