ip_rules:
  tagline: 'A szellemi tulajdon védelme'
  title: 'Hogyan védjük az Ön kiviteleit és márkáját'
  subtitle: 'Az együttműködési modelltől függetlenül a grafika, a szerszámok és a specifikációs fájlok az Ön tulajdonában maradnak.'
  body: |
    **NDA a fáilcsere előtt.** Titoktartási megállapodást írunk alá minden műszaki fáilcsere előtt – a standard válaszidő legfeljebb 4 munkaóra.

    **A kivitelek újrahasznosításának tilalma.** A grafikát, a szerszámokat és a specifikációs fájlokat soha nem osztjuk meg más ügyfelekkel, és nem is adjuk el nekik. Az OEM formák kizárólag az Önéi. Az ODM kiviteleket Ön hagyja jóvá a gyártás előtt. A Private Label platformok közös szerkezetek, de az Ön grafikája és márkázása kizárólagos.

    **Kizárólag B2B.** Kizárólag ügyfeleink márkái alatt gyártunk. Nem értékesítünk a végfelhasználóknak, és egyetlen piacon sem versenyzünk ügyfeleinkkel.

    **A formák tulajdonjoga.** A vásárló által fizetett egyedi formák a vásárlóéi. Mi tároljuk és karbantartjuk őket, de írásos engedély nélkül nem használhatjuk más ügyfelek számára.

faqs:
  tagline: 'GYIK'
  title: 'Gyakori kérdések az OEM, az ODM és a Private Label témájában'
  items:
    - q: 'Később át lehet-e váltani a private labelről az OEM-re?'
      a: 'Igen. Sok ügyfél private label vagy pilóta szállítmánnyal kezd a piac validálásához, majd a kereslet igazolása után saját szerszámokba fektet egy teljes OEM programban. Mindkét utat ugyanaz a gyár és ugyanaz a minőségellenőrzési rendszer támogatja.'
    - q: 'Az ODM azt jelenti, hogy a gyár birtokolja a márkámat?'
      a: 'Nem. Az ODM modellben Ön birtokolja a márkát, a grafikát és a csomagolást. A gyár az Ön specifikációs lapjáról fejleszti a deszka szerkezetét, és Ön a gyártás előtt jóváhagyja a kivitelt. A gyár megtartja a fejlesztési folyamat szellemi tulajdonjogát, de a jóváhagyott termékspecifikáció az Öné.'
    - q: 'A private label rosszabb minőségű, mint az OEM?'
      a: 'Nem. Mindhárom út ugyanazon a gyáron, ugyanazzal a minőségellenőrzési rendszerrel és ugyanazzal az exportcsapattal halad. A private label deszkák bizonyított, validált platformokra épülnek, teljes, 18 PSI / 24 órás nyomáspróbával és ugyanazzal a 100 pontos összeállítási ellenőrző listával.'
    - q: 'Mit tegyek, ha nem vagyok biztos benne, melyik modellt válasszam?'
      a: 'Írjon nekünk a helyzetéről – mérnöki csapatunk a legpraktikusabb utat ajánlja Önnek a termékkövetelmények, a határidő és a térfogati célok alapján. A specifikációk elemzése előtt semmilyen kötelezettség nem keletkezik.'
    - q: 'Kaphatok mintákat, mielőtt bármelyik modellhez elköteleződnék?'
      a: 'Igen. 1–2 prototípusminta 7–12 nap alatt kerül feladásra. A minták költségét jóváírjuk az Ön térfogati megrendelésén. Így a szerkezetet és a minőséget bármilyen térfogati kötelezettségvállalás előtt értékelheti.'

