values_section:
  title: Como a fábrica trabalha com as marcas
  subtitle: 'Três princípios que caracterizam cada projeto construído pela fábrica Vatrad.'
  columns: 3
  items:
    - title: Design antes da produção
      description: 'Cada projeto começa com requisitos, desenhos e uma amostra física — a forma do casco, os graus do drop-stitch, o posicionamento das gráficas e a embalagem são validados antes de cada ciclo produtivo, não descobertos apenas em linha.'
      icon: 'tabler:settings'
    - title: Uma equipa, uma instalação
      description: 'Design, corte, soldadura, montagem e ensaios acontecem numa única instalação de 12,500 m². Nenhum passo intermédio por empresas comerciais: as pessoas que respondem às tuas perguntas são as que constroem as tuas pranchas.'
      icon: 'tabler:building-factory-2'
    - title: Pequenos primeiros lotes
      description: 'O co-branding em pequenos lotes começa nas 5–10 unidades e a produção padrão em série corre com 90–100+ unidades por lote (uma bobina de drop-stitch de 150 m) — assim as marcas validam o mercado antes de escalar, mantendo moldes e gráficas para reencomendas.'
      icon: 'tabler:layers-intersect'
services_section:
  title: O que a fábrica oferece
  subtitle: 'Os serviços de produção disponíveis para os clientes iSupfactory.'
  columns: 2
  items:
    - title: Desenvolvimento SUP personalizado
      description: 'Avaliação de requisitos, especificações, seleção de materiais, gráficas, prototipagem, aprovação da amostra e produção de produtos SUP insufláveis à medida.'
      icon: 'tabler:bulb'
    - title: Produção em marca própria
      description: 'O teu logótipo, as tuas cores e a tua embalagem em plataformas comerciais testadas: prancha, deck pad, acessórios e caixas levam todos a tua identidade, sem branding de fábrica.'
      icon: 'tabler:tag'
    - title: Produção OEM/ODM
      description: 'Produção OEM e ODM completa de SUP insufláveis segundo os desenhos do cliente ou designs desenvolvidos em conjunto, incluindo moldes personalizados para novas formas de prancha.'
      icon: 'tabler:package'
    - title: Fornecimento de frotas
      description: 'Frotas de pranchas com marca para resorts, clubes, escolas e centros de aluguer, com acessórios coordenados e ciclos produtivos pensados para frotas.'
      icon: 'tabler:users-group'
certifications_section:
  title: Certificação e conformidade
  subtitle: 'A fábrica fornece a UE, os Estados Unidos e a região Ásia-Pacífico no âmbito de um sistema de conformidade documentado.'
  columns: 2
  items:
    - title: Certificação CE
      description: 'As linhas de produto de SUP insufláveis e embarcações cumprem as diretivas de segurança da UE, com documentação para cada mercado.'
      icon: 'tabler:certificate'
    - title: Sistema de qualidade ISO 9001
      description: 'A instalação produtiva opera com um sistema de gestão da qualidade ISO 9001 que cobre o controlo de entrada, de processo e final.'
      icon: 'tabler:badge-check'
    - title: Conformidade social BSCI
      description: 'A responsabilidade social é sujeita a auditoria segundo a BSCI e cobre as condições de trabalho e a conformidade da fábrica.'
      icon: 'tabler:shield-check'
    - title: Conformidade de materiais REACH
      description: 'Os materiais cumprem o regulamento REACH da UE sobre segurança química.'
      icon: 'tabler:flask'
    - title: Aprovação USCG
      description: 'Produção aprovada pela Guarda Costeira dos EUA para as linhas de produto de embarcações insufláveis.'
      icon: 'tabler:anchor'
    - title: Ensaio do produto
      description: 'Testes de flutuabilidade, capacidade de carga, resistência das costuras, resistência aos raios UV, resistência à abrasão e manutenção da pressão em cada linha de produção.'
      icon: 'tabler:test-pipe'
