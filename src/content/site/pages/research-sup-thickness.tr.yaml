answer:
  label: 'Doğrudan yanıt'
  text: 'Kalınlık, rijitlik ile denge arasında bir denge kurar: 4" (10 cm) en rijit, en hafif ve en hızlısıdır — tur ve yarış için en iyisi; 5" (12.7 cm) çoğu kürekçi için her ortama uyan seçimdir; 6" (15.2 cm) yoga ve daha ağır kürekçiler (100+ kg) için birincil dengeyi en üst düzeye çıkarır. Daha ince kesit yapısal olarak daha rijittir; bu nedenle 15 PSI’daki bir 4" tahta, 25 PSI’daki bir 6" tahtadan daha az esner.'
  verified: 'Eylül 2026'

content_html: |
  <h2>Üç Standart Kalınlık</h2>

  <h3>4" (10 cm) – Tur ve Performans</h3>
  <ul>
    <li>En yüksek rijitlik – yük altında daha az esneme</li>
    <li>En hafif – daha az malzeme, daha az hava hacmi</li>
    <li>Mükemmel yön tutma – azalan yandan yana salınım</li>
    <li>En hızlı – azalan sürükleme, daha kolay kayma</li>
    <li>En uygun olduğu alanlar: tur, yarış, kondisyon küreği, deneyimli kürekçiler</li>
  </ul>

  <h3>5" (12.7 cm) – Her Ortama Uygun</h3>
  <ul>
    <li>İyi rijitlik – dengeli esneme-rijitlik oranı</li>
    <li>Orta ağırlık – standart malzeme kullanımı</li>
    <li>İyi birincil + ikincil denge</li>
    <li>En uygun olduğu alanlar: rekreasyon küreği, başlangıç seviyesi, göl ve nehir kullanımı</li>
  </ul>

  <h3>6" (15.2 cm) – Denge ve Yoga</h3>
  <ul>
    <li>En yüksek birincil denge – çok büyük kaldırma kuvveti</li>
    <li>En ağır – daha fazla PVC malzeme, daha büyük hava hacmi</li>
    <li>En yavaş – daha fazla sürükleme, kaymayı sürdürmek daha zor</li>
    <li>En uygun olduğu alanlar: yoga/kondisyon, ağır kürekçiler (100+ kg), çok dalgalı koşullar</li>
  </ul>

  <h2>Mühendislik Analizi</h2>
  <p>Şişirilebilir bir SUP’nin rijitliği, iç hava basıncı ve tahtanın kesitinin atalet momenti tarafından belirlenir. 20 PSI’da, aynı genişlik ve uzunluktaki bir 6" tahtaya kıyasla 4" tahta yük altında yaklaşık %30 daha az sehim gösterir. Birincil denge, su kesiti genişliğinden ve kaldırma kuvvetinden gelir; ikincil denge ise rail şeklinden ve tahta genişliğinden etkilenir.</p>

  <h2>Kürekçi Ağırlığına Göre Kalınlık</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Kürekçi Ağırlığı</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Önerilen Kalınlık</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">65 kg altı (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" veya 6"</td></tr>
      <tr><td class="p-3 border">115 kg üzeri (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Kalınlık ve PSI Arasındaki Dengeleşme</h2>
  <p>Yaygın bir yanlış anlama, daha yüksek PSI değerinin aşırı kalınlığı telafi edebileceğidir. 25 PSI’da bir 6" tahta, 15 PSI’daki bir 4" tahtadan daha çok esner; çünkü rijitlik denkleminde geometrik atalet momenti baskın faktördür. Performans odaklı kürekçiler için, daha düşük basınçtaki ince bir tahta, daha yüksek basınçtaki kalın bir tahtadan daha iyi performans gösterir.</p>

  <h2>Vatrad Ürün Hattı</h2>
  <ul>
    <li><strong>4" tahtalar:</strong> Cheetah Touring serisi – kondisyon ve mesafe küreği için 12' x 30" x 4" tur SUP’leri</li>
    <li><strong>5" tahtalar:</strong> Cheetah All-Round serisi – rekreasyonel kullanım için 10'6" x 32" x 5"</li>
    <li><strong>6" tahtalar:</strong> Cheetah Ultra-Stable serisi – yoga, büyük kürekçiler ve fotoğraf platformları için 10' x 34" x 6"</li>
  </ul>
  <p>Tüm tahtalar 1.680 DTEX drop-stitch çekirdekleri, 15 PSI anma değeri ve 1.2 mm PVC laminatlar kullanır.</p>
  <p>Kalınlık, PSI ve kumaş spesifikasyonu, özel hatlar için tümüyle yapılandırılabilir — <a href="/tr/oem-manufacturing">OEM ve private label markalar için tahta mühendisliğini nasıl yaptığımıza</a> bakın ve tahta yapımızı <a href="/tr/factory">fabrika alanımızda</a> adım adım inceleyin.</p>

