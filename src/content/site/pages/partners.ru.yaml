answer:
  label: 'Прямой ответ'
  text: 'Условия партнерства начинаются с образца (1–2 единицы) и пилотных партий (20–50 единиц, образцы за 7–12 дней), затем переходят к стандартным OEM-тиражам 90–100+ единиц на партию из полного 150-метрового рулона drop stitch либо к инвестициям в индивидуальные пресс-формы для продуктов private label. MOQ подтверждается конфигурацией проекта. Дистрибьюторские программы включают эксклюзивные территории, оптовые цены напрямую с завода и отсрочку платежа 45–60 дней, отгрузку FOB Qingdao или CIF.'
  verified: 'Сентябрь 2026'
content_programs:
  tagline: Партнерские программы
  title: 'Модели партнерства на базе собственного производства'
  subtitle: 'Независимо от того, являетесь ли вы дистрибьютором, дилером или бренд-партнером, программа строится вокруг ваших требований к продукту и производственного плана.'
  columns: 3
  items:
    - title: 'Дистрибьюторская программа'
      description: 'Дистрибьюторские соглашения с прямым доступом к заводу, технической поддержкой и стабильным качеством повторных заказов по территориям. Минимальные обязательства зависят от размера территории.'
      icon: tabler:world
    - title: 'Дилерская программа'
      description: 'Спецификации продукта, утверждение образцов, гарантийная поддержка и надежные повторные заказы для розничных точек и интернет-магазинов.'
      icon: tabler:building-store
    - title: 'Партнерство OEM/ODM'
      description: 'Полноценное производство OEM и ODM с индивидуальным брендингом, упаковкой и спецификациями продукта. От идеи до контейнера.'
      icon: tabler:certificate
    - title: 'Бренд-партнерство'
      description: 'Private label и разработка моделей для известных брендов в сфере морского и активного отдыха на открытом воздухе.'
      icon: tabler:stars
    - title: 'Государственные и институциональные закупки'
      description: 'Программы для предпочтительных поставщиков государственных ведомств, береговых служб, военных и гуманитарных организаций. Документация, готовая к тендерам.'
      icon: tabler:building-community
    - title: 'Курорты и прокат'
      description: 'Флотовые цены, стабильное качество и индивидуальный брендинг для курортов, дайв-центров и прокатных операций по всему миру.'
      icon: tabler:sun
content_benefits:
  tagline: Почему стоит сотрудничать с нами
  title: 'Почему партнеры выбирают Vatrad'
  subtitle: 'Наши партнеры работают с реальным производством, стабильным качеством и оперативной инженерной поддержкой.'
  list:
    - 'Прямой доступ к заводу: Вы работаете напрямую с нашей производственной командой — без посредников. Быстрые ответы, полная прозрачность производства и инженерные ответы от тех, кто строит доски.'
    - 'Готовность к кастомизации: Брендируйте продукцию собственными цветами, логотипами, упаковкой и характеристиками. MOQ подтверждается конфигурацией проекта — образец, пилотная партия и серийный объем.'
    - 'Гарантированное качество: Производство сертифицировано по ISO 9001 с соответствием CE, BSCI и REACH. Каждое изделие проходит испытание давлением до отгрузки.'
    - 'Глобальная логистика: Отгрузка из Циндао, Китай, с вариантами FOB, CIF и DDP. Склад в США, штат Калифорния, Montclair, для дистрибуции в Северной Америке.'
    - 'Техническая документация: Каталоги продукции, фотографии и техническая документация для поддержки решений по спецификациям и повторным заказам.'
    - 'Поддержка по спецификациям и контролю качества: Выборка перед серийным производством, техническая поддержка ваших клиентов и координация гарантийного обслуживания.'
content_process:
  tagline: Как стать партнером
  title: 'Процесс партнерства'
  subtitle: 'Прозрачный процесс — от заявки до вашей первой серийной партии.'
  items:
    - title: 'Шаг 1: Подайте заявку'
      description: 'Заполните нашу форму заявки на партнерство, указав профиль компании, целевой рынок и интересующую продукцию.'
    - title: 'Шаг 2: Проверка квалификации'
      description: 'Наша команда рассматривает заявку и связывается с вами в течение 3 рабочих дней, чтобы обсудить требования.'
    - title: 'Шаг 3: Соглашение и настройка'
      description: 'Подпишите партнерское соглашение, откройте учетную запись и получите образцы продукции, спецификации и согласованные условия.'
    - title: 'Шаг 4: Образцы и производство'
      description: 'Утвердите физические образцы, подтвердите спецификации и MOQ, после чего запустите производство под вашим брендом.'
cta:
  title: 'Обсудить партнерство'
