how_to_choose:
  title: Comment choisir la bonne taille
  cards:
    - title: Planches SUP
      description: Choisissez la longueur selon votre poids et votre usage prévu. Les planches plus larges (32"+) offrent plus de stabilité. Les planches plus longues (11-12 pi) tiennent mieux leur cap pour le touring. Les pagayeurs lourds ont besoin de planches à plus grand volume.
    - title: SUP touring
      description: Les planches plus longues (11–12 pi) sont idéales pour couvrir de la distance et le touring. Les planches plus larges (32"+) offrent plus de stabilité. Vérifiez la capacité de charge pour la charge totale incluant l''équipement.
    - title: SUP tout-terrain
      description: Choisissez la longueur selon le poids du pagayeur et l''usage prévu. Les planches tout-terrain conviennent à la récréation, au fitness et au yoga. Les planches plus petites sont plus maniables.

