hero:
  tagline: Centro R&S
  title: Centro R & S
  subtitle: Focus sul progresso

intro:
  - Il centro ricerca e sviluppo (R&S) di Vatrad è la forza trainante della nostra missione di rivoluzionare le attrezzature per gli sport acquatici. Attraverso un'innovazione instancabile nelle tavole stand-up paddle (SUP) gonfiabili e nei gommoni, rendiamo possibili prodotti più sicuri, più comodi e più belli per gli appassionati di sport acquatici in tutto il mondo. Il nostro team dedicato di ingegneri, designer e appassionati esperti del settore plasma il futuro del settore, alzando costantemente l'asticella di qualità, prestazioni e sostenibilità.
  - La nostra struttura R&S riunisce sotto lo stesso tetto scienziati dei materiali, architetti navali e ingegneri di produzione. Dalla formulazione dei tessuti e la simulazione dello scafo allo sviluppo dei processi di saldatura fino alle prove in mare su larga scala, ogni fase dello sviluppo prodotto è guidata dai dati e validata dai collaudi.

mission:
  tagline: La nostra missione
  title: Innovare il futuro degli sport acquatici
  pillars:
    - icon: lightning
      title: Progresso tecnologico
