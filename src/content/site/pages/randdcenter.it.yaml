capabilities:
  tagline: Capacità
  title: Capacità R&S
  subtitle: Quattro discipline chiave ci danno il controllo end-to-end sullo sviluppo prodotto — dalla ricerca sulle materie prime alla certificazione finale.
  groups:
    - title: Scienza dei materiali & tecnologia dei tessuti
      items:
        - Analisi e ottimizzazione delle formulazioni PVC e Hypalon
        - Sviluppo di stabilizzazione UV, ritardanti di fiamma e additivi antimicrobici
        - Laminazione di tessuti multistrato e ingegneria dei collegamenti adesivi
        - Prove di invecchiamento accelerato (UV, termico, umidità, nebbia salina)
    - title: Ingegneria dello scafo & idrodinamica
      items:
        - Design parametrico 3D dello scafo e ottimizzazione CFD
        - Analisi agli elementi finiti per carichi strutturali e da impatto
        - Prove in vasca di traino con modelli e validazione delle prestazioni
        - Sviluppo personalizzato dello scafo per profili d'uso speciali
    - title: Tecnologia di saldatura & giunzione
      items:
        - Sviluppo e ottimizzazione del processo di saldatura dielettrica HF
        - Processi di saldatura ad aria calda, cuneo termico e ultrasuoni
        - Qualificazione dei collegamenti adesivi e dei nastri di cucitura
        - Modellazione della resistenza di saldatura e previsione della durata
    - title: Collaudi, certificazione & conformità
      items:
        - Gestione della qualità e collaudi di conformità CE
        - Supporto per collaudi e certificazioni di terze parti indipendenti
        - Sviluppo di protocolli di prova personalizzati per la qualificazione all'approvvigionamento
        - Analisi dei guasti sul campo e ricerca delle cause

