key_factors:
  heading: 'Avaintekijät rakennetyypin lisäksi'
  body: |
    Rakennetyyppi on yksi muuttuja laudan suorituskyvyssä. Kolme muuta tekijää ovat yhtä tärkeitä tai tärkeämpiä:

    - **Drop-stitch-tiheys** — Kierteet tuumaa kohti määrää, miten tasaisesti lauta säilyttää muotonsa paineen alla. Käytämme 96 kierrettä/tuumaa vakiossa ja 140 kierrettä/tuumaa suorituskykyversioissa. Suurempi tiheys = tasaisempi lauta = parempi liuku.
    - **PVC-laatu ja paksuus** — Kaikki PVC ei ole samanarvoista. Etelä-Koreasta tuotu 0.7 mm:n PVC suuremman repimislujuuden ja UV-kestävyyden vuoksi. Määritämme materiaaliluokan projektikohtaisesti.
    - **Reunarakenne** — Yksikerroksiset reunat ovat halpojen lautojen yleisin vikaantumiskohta. Kaksikerroksinen rakenne ja vahvistettu reunanauha pienentävät reunan puhkaisuriskiä dramaattisesti. Kaikki laudat käyttävät vahvistettuja reunoja rakennetasosta riippumatta.

faqs:
  tagline: UKK
  title: 'SUP-rakenne — usein kysytyt kysymykset'
  items:
    - q: 'Minkä rakennetyypin brändilleni valitsisin?'
      a: 'Se riippuu kohdemarkkinastasi ja hintapositiosta. Aloittelijat ja iso vähittäiskauppa: yksikerroksinen. Vuokrauslaivastot, seurat ja keskihintaluokat: kaksikerroksinen. Suorituskyky, touring ja premium: drop-stitch-ydin. Useimmat brändit aloittavat kaksikerroksisesta, koska se on paras tasapaino kustannusten, kestävyyden ja melojan kokemuksen välillä. Suosittelemme toteutettavuuskatsauksessa markkinaasi perusteella.'
    - q: 'Voinko tarjota useita rakennetasoja yhden brändin alla?'
      a: 'Kyllä — monet brändit tarjoavat kaksi tai kolme tasoa. Valmistamme kaikki kolme rakennetta samalla linjalla samoilla laadunvalvontaportilla, joten voit yhdistää rakennetyyppejä yhden tilauksen sisällä. Rungon muoto ja kuviot voivat olla identtiset kaikissa tasoissa; vain rakenne ja materiaalit muuttuvat.'
    - q: 'Mikä on kaikkien rakenteiden painetestin standardi?'
      a: 'Jokainen lauta rakenteesta riippumatta läpäisee 18.0 PSI:n pitävämaksutestin, jossa automaattinen hylkäys yli 0.50 PSI:n paineen laskun yli 24 tunnin aikana. Yksikerroksiset laudat on mitoitettu 12–15 PSI:n melontapaineelle, kaksikerroksiset 15–18 PSI:lle ja drop-stitch-ytimet 18–25 PSI:lle. Testipaine ylittää mitoitetun paineen kaikissa rakenteissa.'
    - q: 'Miten rakenne vaikuttaa takuuvaikutuksiin?'
      a: 'Yksikerroksisilla laudoilla on kaupallisessa ja vuokrauskäytössä hieman korkeampi takuuvaikutuslukumäärä reunojen ja puhkaisujen alttevuuden vuoksi. Kaksikerroksinen ja drop-stitch-rakenne tuovat selvästi alemmat vaikutuslukumäärät. Toimitamme tarjousvaiheessa tuotantotietoistamme johdetut tasokohtaiset takuutiedot.'

