hero:
  tagline: 'MOQ a lhůty pro vlastní SUP'
  title: 'Od 1 vzorku po kontejnerové dávky — MOQ a lhůty jednoduše'
  subtitle: 'Srozumitelné vysvětlení úrovní objednávkového množství a výrobních lhůt pro vlastní nafukovací SUP: co lze objednat v každé fázi, jak dlouho jednotlivé fáze reálně trvají a jak se vzorek, pilotní dávka a sériová objednávka skládají do jednoho projektu. Vyvinuto a provozováno společností Qingdao Vatrad Group Co., Ltd.'
