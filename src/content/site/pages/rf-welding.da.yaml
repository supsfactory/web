  text: 'Vi kører dielektriske højfrekvenspresser på 15 kW, der binder PVC-sømme molekylært ved luftsvejsningsekvivalenter på 200–600 °C, og validerer derefter hver svejse: peelprøvninger efter ASTM D751, lufttabsholdning ved 18.0 PSI og dokumenterede, sporbare sømme pr. enhed.'
