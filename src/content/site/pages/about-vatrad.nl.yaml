intro: |
  <p><strong>Vatrad</strong> is de nautische productiedivisie van <strong>Qingdao Vatrad Group Co., Ltd.</strong>, gevestigd in de economische ontwikkelingszone van Laixi, Qingdao, Shandong, China. Opgericht in 2012, begon het bedrijf als een gespecialiseerde bootwerkplaats gewijd aan nautisch vakmanschap en groeide het uit tot een gecertificeerde fabriek die OEM- en ODM-klanten bedient in meer dan 50 landen.</p>
  <p>SUPsfactory is de B2B-divisie voor de gepersonaliseerde ontwikkelingen van de Vatrad-fabriek. Elk SUPsfactory-project — van het eerste monster of een kleine co-branding-partij tot een complete private label productlijn — wordt gerealiseerd in dezelfde fabriek, door dezelfde teams en met hetzelfde kwaliteitssysteem als beschreven op deze pagina.</p>
  <p>De fabriek beslaat 12.500 m² met werkplaatsen voor het snijden van PVC, de assemblage van de drop-stitch kern, hoogfrequent lassen, boardmontage en een testgebied voor luchtretentie, drukbehoud en naadsterktetests. De productiecapaciteit bedraagt meer dan 120.000 opblaasbare eenheden per jaar en de fabriek werkt met een kwaliteitsmanagementsysteem volgens ISO 9001, met CE-, BSCI- en REACH-conformiteit en USCG-goedkeuring voor geëxporteerde producten.</p>
  <p>Meer dan 350 gekwalificeerde medewerkers en meer dan 14 R&D-ingenieurs ondersteunen de twee werkgebieden die voor SUP-merken belangrijk zijn: ontwerp (rompontwerp, materiaalkeuze, prototyping) en productie (grafische toepassing, assemblage, inspectie, exportverpakking). Een intern R&D-centrum met PVC-stoffenlaboratorium en testvijver verzorgt aangepaste vormen en structurele validatie vóór de start van de serieproductie.</p>
