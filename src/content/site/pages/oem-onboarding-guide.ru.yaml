answer:
  label: 'Короткий ответ'
  text: 'Типичный онбординг OEM занимает 2–4 недели до утверждения образца и 6–8 недель до первой производственной серии от подтверждения заказа. Вы начинаете с подачи брифа проекта (спецификации досок, объём, требования по соответствию). Мы отвечаем в течение одного рабочего дня, предлагаем NDA до передачи конфиденциальных деталей и изготавливаем 1–2 физических образца за 7–12 дней для вашего рассмотрения и утверждения. После заморозки образца следуют планирование производства и изготовление с фиксированными контрольными точками качества на каждом этапе. Каждый шаг задокументирован и прослеживаем.'
  verified: 'Сентябрь 2026'

process_steps:
  tagline: Семь этапов
  title: 'Схема онбординга — семь этапов от брифа до поставки'
  subtitle: 'У каждого этапа определены входные данные, результат и срок, который вы согласуете заранее. Вы никогда не переходите к следующему этапу без явного подтверждения.'
  steps:
    - step: 'Этап 1'
      title: 'Первичный запрос и NDA (день 0)'
      desc: 'Отправьте бриф проекта через /contact, указав целевые характеристики досок, объём заказа, требования по соответствию и сроки. NDA доступно сразу же — до того как вы поделитесь какими-либо конфиденциальными техническими спецификациями или графикой. Ответ в течение одного рабочего дня.'
    - step: 'Этап 2'
      title: 'Проверка осуществимости и расчёт цены (дни 1–5)'
      desc: 'Инженеры оценивают ваш бриф с точки зрения производственных возможностей, наличия материалов и области требований по соответствию. Вы получаете коммерческое предложение с расшифровкой, содержащее расчёт MOQ, стоимость образцов (засчитываемую в счёт производства) и этапы сроков изготовления — не приблизительный диапазон, а поминутный график по этапам.'
    - step: 'Этап 3'
      title: 'Изготовление образцов (дни 6–17)'
      desc: 'Изготавливаются 1–2 физические доски по вашей спецификации: жёсткость корпуса, текстура накладки EVA, точность графики, посадка аксессуаров. Вы тестируете и оцениваете доску до принятия любых других обязательств. Стоимость образцов засчитывается в счёт вашего производственного заказа после подписания договора.'
    - step: 'Этап 4'
      title: 'Рассмотрение и утверждение образца (дни 18–21)'
      desc: 'Вы оцениваете образец по своим спецификациям — качество хода, точность графики, упаковку, аксессуары. Корректировки фиксируются в пересмотренном BOM и утверждении графики. Замороженная спецификация становится эталоном производства для всех последующих серий.'
    - step: 'Этап 5'
      title: 'Предпроизводственное планирование (дни 22–28)'
      desc: 'Закупка материалов, наладка оснастки, подтверждение упаковки и бронирование производственного слота. Все материалы проходят входной контроль по замороженному BOM. До начала изготовления выпускается производственный график с датами контрольных точек качества.'
    - step: 'Этап 6'
      title: 'Производство и контрольные точки качества (дни 29–55)'
      desc: 'Изготовление проходит через 7-этапную систему контрольных ворот: входной контроль материалов, контроль ткани drop-stitch, сварка и сборка, испытание давлением и на герметичность (удержание 18.0 PSI, автоматический брак при падении более 0.50 PSI), установка накладок EVA и аксессуаров, контроль графики и брендинга, финальная упаковка и документация. Для каждых ворот установлены критерии приёмки и записи прослеживаемости.'
    - step: 'Этап 7'
      title: 'Отгрузка и анализ после поставки (дни 56–63)'
      desc: 'Транспортная упаковка экспортного класса, документация по соответствию (CE, ISO 9001, BSCI, REACH, RoHS) и координация морских перевозок более чем в 50 стран. Анализ после поставки фиксирует извлечённые уроки и доработки для следующего цикла заказа.'

