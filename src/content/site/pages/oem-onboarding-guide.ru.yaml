faqs:
  tagline: FAQ
  title: 'Онбординг OEM — часто задаваемые вопросы'
  items:
    - q: 'Сколько времени занимает весь процесс онбординга?'
      a: 'Утверждение образца обычно занимает 2–4 недели (включая изготовление образца за 7–12 дней и период вашего рассмотрения). Первая производственная серия занимает 6–8 недель от подтверждения заказа и задатка. Индивидуальная форма корпуса добавляет 15–20 дней на разработку пресс-формы. Для каждого этапа установлен фиксированный срок, который вы согласуете заранее.'
    - q: 'Нужно ли подписывать NDA до передачи дизайна?'
      a: 'NDA доступно сразу же по запросу — до того как вы поделитесь какими-либо конфиденциальными техническими спецификациями или графикой. Мы производим исключительно под брендами наших клиентов и никогда не конкурируем с ними ни на одном рынке. Та же политика применяется как к образцу из 1 доски, так и к программе в контейнерных объёмах.'
    - q: 'Каков минимальный заказ для первого запуска OEM?'
      a: 'Точка входа разбита на уровни: сначала 1–2 образца (готовы за 7–12 дней), затем пробный или пилотный заказ 20–50 досок (производство за 25–35 дней), а затем стандартные серии 90–100+ досок на каждую утверждённую конфигурацию. Мелкосерийный со-брендинг начинается с 5–10 шт., когда этап разработки не нужен. Стоимость образцов засчитывается в счёт вашего производственного заказа.'
    - q: 'Как обеспечивается защита интеллектуальной собственности во время онбординга?'
      a: 'Ваш дизайн и спецификации защищены NDA, подписанным до передачи любой конфиденциальной информации. Вся графика, данные BOM и технические файлы хранятся в системах с ограниченным доступом и журналами аудита. В режиме OEM все права интеллектуальной собственности принадлежат вам. В режиме ODM права на адаптированную платформу разделяются по соглашению. В режиме Private Label права интеллектуальной собственности остаются у iSupfactory, а вы лицензируете применение бренда.'
    - q: 'Какие гарантии качества действуют для первого заказа?'
      a: 'Каждая доска — образец, пробная или серийная — проходит одну и ту же 7-этапную систему контрольных ворот: входной контроль материалов, контроль ткани drop-stitch, сварка и сборка, испытание давлением и на герметичность в течение 24 часов (удержание 18.0 PSI, автоматический брак при падении более 0.50 PSI), установка накладок EVA и аксессуаров, контроль графики и брендинга, а также финальная упаковка и документация. Качество не снижается для меньших заказов.'

