checklist:
  heading: 'Что подготовить до подачи брифа проекта'
  body: |
    Чем полнее бриф, тем быстрее и точнее расчёт цены. Вот что следует подготовить:

    - **Спецификации досок** — целевая длина, ширина, толщина, диапазон веса пользователя и предполагаемое использование (туризм, универсальная, сёрфинг, рыбалка, йога и т. д.). Если у вас есть размеры образца для ориентира или модель конкурента, включите их.
    - **Файлы дизайна** — векторная графика (AI, SVG или PDF) для графики доски, логотипа на накладке EVA и любого дополнительного брендинга. Если графика ещё не готова, для первоначальной проверки осуществимости достаточно мудборда или референсных изображений.
    - **Объём заказа и сроки** — целевое количество на первый заказ и сезонный график, которого нужно достичь. Даже приблизительного диапазона («20–50 досок к марту») достаточно, чтобы подтвердить осуществимость и наличие свободных слотов.
    - **Требования по соответствию** — целевые рынки (ЕС, Северная Америка, Австралия и т. д.) и любые конкретные требования по сертификации или испытаниям сверх нашего стандартного объёма (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Диапазон бюджета** — ориентировочный бюджет на одну доску или целевая стоимость с доставкой помогает нам рекомендовать подходящую платформу и уровень конструкции. Точная цена подтверждается после инженерной проверки — и никогда раньше.

    Если у вас пока нет всего этого, отправьте то, что есть. Остальное мы подскажем.

