  title: 'Centrum B&R — inżynieria nadmuchiwanych desek SUP | {SITE}'
  description: 'Badania i rozwój — badania tkanin PCV, inżynieria kadłubów, zgrzewanie HF, badania hydrodynamiczne i kontrola jakości. Dostępne niestandardowe usługi B&R.'
  dateModified: '2026-08'

hero:
  tagline: 'Centrum B&R'
  title: 'Centrum B & R'
  subtitle: 'Skupione na postępie'

intro:
  - 'Centrum Badań i Rozwoju (B&R) Vatrad to siła napędowa naszej misji: rewolucjonizowania sprzętu sportów wodnych. Wspieramy miłośników sportów wodnych na całym świecie, oferując bezpieczniejszy, wygodniejszy i bardziej satysfakcjonujący sprzęt dzięki nieustannym innowacjom w zakresie nadmuchiwanych desek SUP i łodzi. Nasz oddany zespół inżynierów, projektantów i zapalonych ekspertów sportów wodnych kształtuje przyszłość branży, nieustannie podnosząc poprzeczkę w zakresie jakości, wydajności i zrównoważenia.'
  - 'Nasz zakład B&R skupia pod jednym dachem specjalistów materiałowych, projektantów jednostek pływających i inżynierów produkcji. Od receptur tkanin i symulacji kadłubów, przez rozwój procesów zgrzewania, aż po próby pełnoskalowe na morzu — każdy etap rozwoju produktu jest oparty na danych i potwierdzany badaniami.'

mission:
  tagline: 'Nasza misja'
  title: 'Współtworzymy przyszłość sportów wodnych'
  pillars:
    - icon: lightning
      title: 'Postęp technologiczny'
      desc: 'Pionierskie prace nad nowymi materiałami, wzornictwem i technologiami produkcji, które przekładają się na lepsze osiągi i żywotność produktów.'
    - icon: design
      title: 'Projekt skoncentrowany na użytkowniku'
      desc: 'Głębokie poznanie potrzeb użytkowników i przekraczanie ich oczekiwań dzięki ergonomicznemu i intuicyjnemu projektowi produktu.'
    - icon: globe
      title: 'Zrównoważone praktyki'
      desc: 'Ograniczanie naszego śladu środowiskowego poprzez stosowanie materiałów i procesów przyjaznych środowisku.'
    - icon: shield
      title: 'Bezkompromisowe bezpieczeństwo'
      desc: 'Zapewnienie najwyższych standardów bezpieczeństwa dzięki rygorystycznym badaniom i certyfikacji.'

pillars:
  - title: 'Postęp technologiczny'
    desc: 'Pionierskie prace nad nowymi materiałami, wzornictwem i procesami produkcyjnymi, które przekładają się na lepsze osiągi i żywotność produktów.'
    icon: tech
  - title: 'Zaawansowane materiały'
    desc: 'Badania najnowszych PCV, Hypalonu, kompozytów i zrównoważonych alternatyw w celu poprawy właściwości produktów.'
    icon: materials
  - title: 'Zrównoważony rozwój'
    desc: 'Kluczowe zobowiązanie: stawiamy na troskę o środowisko poprzez zrównoważoną produkcję i materiały poddające się recyklingowi.'
    icon: sustainability

capabilities:
  tagline: 'Możliwości'
  title: 'Możliwości B&R'
  subtitle: 'Cztery kluczowe dyscypliny, które dają nam pełną kontrolę nad rozwojem produktu — od badań surowców po certyfikację końcową.'
  groups:
    - title: 'Nauka o materiałach i technologia tkanin'
      items:
        - 'Analiza i optymalizacja receptur PCV i Hypalonu'
        - 'Rozwój stabilizatorów UV, retardantów płomienia i dodatków antymikrobiowych'
        - 'Inżynieria laminacji wielowarstwowych tkanin i adhezji'
        - 'Przyspieszone badania starzenia (UV, termiczne, wilgotność, mgła solna)'
    - title: 'Inżynieria kadłubów i hydrodynamika'
      items:
        - 'Parametryczny projekt kadłubów 3D i optymalizacja CFD'
        - 'Analiza elementów skończonych pod kątem obciążeń strukturalnych i udarowych'
        - 'Badania w basenie holowania na modelach w skali i walidacja osiągów'
        - 'Niestandardowy rozwój kadłubów dla specjalnych profili misji'
    - title: 'Technologia zgrzewania i łączenia'
      items:
        - 'Rozwój i optymalizacja procesu zgrzewania dielektrycznego HF'
        - 'Metody zgrzewania gorącym powietrzem, gorącym klinem i ultradźwiękowego'
        - 'Kwalifikacja łączenia klejem i taśmami do szwów'
        - 'Modelowanie wytrzymałości szwów i prognozowanie trwałości'
    - title: 'Testy, certyfikacja i zgodność'
      items:
        - 'Zarządzanie jakością i badania zgodności z CE'
        - 'Niezależne badania firm trzecich i wsparcie certyfikacyjne'
        - 'Opracowywanie niestandardowych protokołów testowych na potrzeby kwalifikacji dostawców'
        - 'Analiza uszkodzeń w eksploatacji i dochodzenie przyczyn'

