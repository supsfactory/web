rd_services:
  tagline: 'Niestandardowy B&R'
  title: 'Usługi B&R dla partnerów'
  services:
    - title: 'Niestandardowy rozwój materiałów'
      desc: 'Opracowujemy niestandardowe receptury tkanin, układy laminatów i systemy klejone dopasowane do Twojego środowiska pracy i celów wydajnościowych.'
    - title: 'Inżynieria produktu OEM / ODM'
      desc: 'Opracowujemy niestandardowe receptury tkanin, układy laminatów i systemy klejone dopasowane do Twojego środowiska pracy i celów wydajnościowych.'
    - title: 'Badania i certyfikacja przez firmy trzecie'
      desc: 'Korzystaj z naszych zgodnych z ISO obiektów laboratoryjnych do niezależnych badań materiałowych, walidacji produktów i wsparcia certyfikacyjnego.'
  cta: 'Omów swoje wymagania B&R →'
  cta_link: /pl/contact

vision:
  tagline: 'Nasza wizja'
  title: 'Ksztaltujemy przyszłość sportów wodnych'
  body: 'Vatrad dąży do przewodzenia w branży nadmuchiwanych łodzi i desek SUP dzięki ciągłym innowacjom, niezłomnej jakości i niezachwianemu zaangażowaniu w bezpieczeństwo i zrównoważony rozwój — ostatecznie wzbogacając doświadczenia miłośników sportów wodnych na całym świecie. Centrum B&R Vatrad to miejsce, w którym pasja spotyka innowacyjność i wyznacza nowe standardy dla branży sportów wodnych.'

labs_section:
  tagline: 'Laboratoria'
  title: 'Nasze laboratoria'
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: 'Laboratorium Tkanin PCV'
      description: 'Ciągłe badania i testy tkanin PCV i Hypalonu na rurach pod kątem wytrzymałości na rozciąganie, odporności na UV, ścierania i elastyczności w niskiej temperaturze, aby zapewnić długoterminową niezawodność w środowisku morskim.'
      href: /pl/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: 'Pracownia Inżynierii Kadłubów'
      description: 'Projektowanie w CAD i analiza elementów skończonych kadłubów z HDPE, aluminium i włókna szklanego. Każdy kadłub jest symulowany cyfrowo pod kątem rozkładu naprężeń i odporności na udar, zanim powstanie pierwszy prototyp.'
      href: /pl/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: 'Centrum Zgrzewania HF'
      description: 'Dedykowane stanowisko zgrzewania wysokoczęstotliwościowego z precyzyjną kontrolą temperatury i ciśnienia, wytwarzające wytrzymałe, szczelne szwy spełniające branżowe standardy morskie dla jednostek nadmuchiwanych.'
      href: /pl/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: 'Basen Hydrodynamiczny'
      description: 'Badania modeli w skali w naszym basenie próbowym, aby optymalizować kształt kadłuba, właściwości na płynność, stabilność i zużycie paliwa w różnych obciążeniach i warunkach morskich.'
      href: /pl/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: 'Warsztat Prototypów'
      description: 'Obiekt prototypowania w skali 1:1 i osprzętowania, w którym powstają, są wykańczane i próbowane na morzu nowe modele. Każdy prototyp przechodzi program testów na wodzie trwający co najmniej 20 godzin, zanim trafi do produkcji.'
      href: /pl/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: 'Laboratorium Jakości i Inspekcji'
      description: 'Dedykowane laboratorium zapewnienia jakości: badania wytrzymałości na rozciąganie, cykle utrzymania powietrza, testy zrywania szwów i certyfikacja materiałów, aby każda łódź opuszczająca warsztat spełniała nasze opublikowane specyfikacje.'
      href: /pl/randdcenter/quality-inspection-lab
