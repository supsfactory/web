hero:
  tagline: Laboratorium för kvalitetskontroll
  title: Test- och kvalitetssäkringslaboratorium
  subtitle: Oberoende kvalitetslaboratorium med ISO 9001-processer — varje enskild artikel testas före leverans

answer:
  label: 'Tydligt svar'
  text: '100 % av enheterna genomgår ett 24-timmars trycktest vid 18.0 PSI, med automatisk uteslutning från en tryckförlust på 0.50 PSI. Partier av råtyg verifieras enligt ASTM D751 och ISO 4674, och sömdelamineringsprovet körs varje 50:e enhet med slutlig acceptans AQL 2.5 enligt ISO 2859.'
  verified: 'September 2026'

intro: Vatrad driver ett internt kvalitetskontrollaboratorium som arbetar oberoende av produktionen. Varje parti råmaterial och varje färdig SUP går igenom dokumenterade inspektionsprotokoll före frigörningen. Vårt QC-team rapporterar direkt till ledningen, vilket garanterar opartiska kvalitetsbeslut.

highlights:
  - value: 100%
    label: Enheter som trycktestas
    detail: Varje kammer, varje bräda
  - value: 24 h
    label: Varaktighet för lufttätningstestet
    detail: Vid 18.0 PSI nominellt tryck
  - value: '&lt;5%'
    label: Maximalt tillåten tryckförlust
    detail: Under hela 24-timmarsperioden
  - value: AQL 2.5
    label: Gräns för allvarliga defekter
    detail: Enligt provningsförfarandet ISO 2859

test_procedures:
  - title: Kontroll av råmaterial
    description: Varje inkommande parti PVC, Hypalon, drop-stitch-tyg och delar kontrolleras före acceptans. Kontrollerad styrka är dragstyrka (ASTM D751), rivhållfasthet (ISO 4674) och UV-beständighet. Icke-konformigt material blockeras (karantän) och returneras.
    standards:
      - ASTM D751 (Drag)
      - ISO 4674 (Riv)
      - ISO 4892 (UV)
  - title: QC-kontrollpunkter under processen
    description: Produktionspersonalen utför egenkontroll i varje fas. QC-revisorer tar stickprov genom hela skiftet. Sömdelamineringsprov utförs var 50:e enhet. Måttkontroller sker var 20:e panel.
    standards:
      - ASTM D751 (Delaminering)
      - Intern 100-punktschecklista
      - Provningsförfarande ISO 2859
  - title: 24-timmars lufttätningstest
    description: Varje kammer pumpas upp till 18.0 PSI och hålls i 24 timmar. Trycksensorer registrerar kontinuerligt med temperaturkompensation. Varje kammer som uppvisar en tryckförlust på mer än 0.50 PSI aktiverar en automatisk upprepad verifiering av partiet.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Belastnings- & stabilitetstest
    description: De färdiga brädorna testas avseende stabilitet, fribord och manövrerbarhet vid maximal nominell belastning. Varje bräda genomgår ett vattentest innan den får slutinspektionens frigörning.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Universell testmaskin (drag)
    spec: '5 kN, enligt ASTM D751'
  - name: Tryckförlustestutrustning
    spec: 'Flerkanalig, 0–50 psi, datalogger'
  - name: UV-åldringskammare
    spec: 'ISO 4892, cykler på 1 000 tim'
  - name: Tjockleksmätare (digital)
    spec: 'Upplösning 0.01 mm'
  - name: Delamineringsprovare (söm)
    spec: 'Motoriserad, kapacitet 50 N'
  - name: Termisk kammare
    spec: '-40 °C till +100 °C'
  - name: Läckagedetekteringsbassäng
    spec: '6 m × 2 m, belyst'

lab_evidence:
  tagline: Dossier med testrapporter
  title: 'Ladda ner de verkliga laboratorierapporterna'
  subtitle: 'Samma kontrollerade tvåspråkiga register som vårt kvalitetsteam använder för att stänga dossierna — struktur, metoder, kriterier och resultat, med de konfidentiella fälten borttagna. Varje dossier motsvarar en av de sju inspektionsportarna.'
  items:
    - title: 'IQC — Rapport för inkommande varor'
      description: 'Verifiering av tyg, PVC-rullar, ventiler och komponenter mot den godkända specifikationen.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Ladda ner IQC-rapporterna (PDF)'
    - title: 'IPQC — Rapport för process & första artikel'
      description: 'Inspektionsregister för den första artikeln och för processen mot den låsta revisionen.'
      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Ladda ner IPQC-rapporterna (PDF)'
    - title: 'Lufttätning — Tryck- & läckageregister'
      description: '100 % sömläckagedetektering, ventilintegritet och verifiering av 24-timmars tryckhållning.'
      icon: tabler:waves
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Ladda ner lufttätningsrapporterna (PDF)'
    - title: 'FQC — Slutrapporter för brädorna'
      description: 'Slutkontroll mot det godkända provet — mått, optik och fin box.'
      icon: tabler:shield-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Ladda ner FQC-rapporterna (PDF)'
    - title: 'PSI — Rapport för förpackningsinspektion före leverans'
      description: 'Satsens fullständighet, streckkodspoäng, märkningar på kartongen och registreringar för tippstabilitet.'
      icon: tabler:package
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Ladda ner PSI-rapporterna (PDF)'
    - title: 'Dossier för frigörning inför leverans & spårbarhet'
      description: 'Frigöringsauktorisering och spårbarhet per parti, kopplad till specifikation, grafik och BOM.'
      icon: tabler:history
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Ladda ner frigöringsrapporterna (PDF)'
    - title: 'Komplett kvalitetsdossier'
      description: 'Ett paket som täcker hela dokumentationssystemet — QIP, portregister, spårbarhet och NCR-hantering.'
      icon: tabler:books
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'Ladda ner dokumentationspaketet (PDF)'

