nc_severity:
  tagline: Virhevaikeus ja päätösvalta
  title: Vaikeusluokitus ja päätösvalta
  subtitle: Kaikkia vaatimustenvastaisuuksia ei käsitellä samalla tasolla — päätösvalta skaalautuu virhevaikeuden mukaan linjatason hyväksynnistä materiaaliarviointikomiteaan ja asiakkaan suostumukseen.
  headers:
    severity: Vaikeus
    examples: Tyypillisiä esimerkkejä
    authority: Päätösvalta ja valvonta
    control: Luovutusehto
  rows:
    - severity: 'Vähäinen'
      examples: 'Pakkauksen kulman taittuma, pieni ei-kriittinen lisävarusteen epätarkkuus'
      authority: 'Osaston laadunvalvontapäällikkö + linjan esimies hyväksevät paikan päältä: vaihto tai luovutus'
      control: 'Kirjataan NCR:ään; ei vaikutusta tuotteen toimivuuteen tai asiakkaan vaatimuksiin'
    - severity: 'Vakava'
      examples: 'Hidas venttiilin vuoto, EVA-alustan epätarkkuus sallitun yli (>2 mm), puuttuva lisävaruste'
      authority: 'Laadunvalvontapäällikkö ja tuoteteknikko antavat ohjatun korjausohjeen (SRI)'
      control: 'Alkuperäisesti epäonnistuneen ja siihen liittyvien ominaisuuksien 100 %:n riippumaton uudelleentestaus ennen luovutusta'
    - severity: 'Kriittinen'
      examples: 'Drop-stitch-kammion vaurio, kiskon kuplat tai halkeilu korkeassa paineessa, asiakkaan logon painovirhe tai väripoikkeama'
      authority: 'Materiaaliarviointikomitean (MRB) päätös; kirjallinen asiakkaan suostumus tarvittaessa'
      control: 'Ei luovutusta ilman valtuutettua suostumusta; muuten pakollinen todistettu fyysinen tuhointi'

nc_matrix:
  tagline: Tuotetekniikan protokollamatriisi
  title: SUP-virheiden päätös- ja uudelleentarkastusmatriisi
  subtitle: Vakiintuneet tuotetekniset protokollat yleisimmille valmistuspoikkeamille — samat kvantifioidut parametrit, jotka asiakkaat voivat tarkastaa auditoinneissa.
  headers:
    defect: Virheluokka
    protocol: Ohjattu päätösprotokolla
    validation: Riippumaton uudelleentarkastus ja validointi
  rows:
    - defect: 'Hidas venttiilivuoto'
      protocol: 'Erota lauta. Pura venttiilin runko kalibroidulla momenttityökalulla (25 N·m), puhdista sisäkierteet, vaihda silikoninen O-rengas ja kiristä momentti uudelleen.'
      validation: 'Upota kuplaliuokseen; täyttää uudelleen 18 PSI:hin ja tee täysi 24h paineenlaskutesti (ΔP ≤ 0.05 PSI).'
    - defect: 'Kiskon sauman ilmat'
      protocol: 'Erota vaihdon erä. Aukaise kohdan delaminointi lämpöä tukevalla suuttimella, puhdista pinta liuotteella ja levitä kaksikomponenttista PU-liimaa 5 baarin paineessa.'
      validation: '100 %:n sauman visuaalinen ja kosketusinspektio; rakenteellinen paine-koepuristus (18.0 PSI) sekä 24h ilmatiiviyspito.'
    - defect: 'EVA-alustan epätarkkuus'
      protocol: 'Irrota lämpöä tukevalla lämpötilasäädellyllä työkalulla (80°C). Kohdista uudelleen tarkan akryylisen asemointikiinnikkeen avulla.'
      validation: 'Välityksen toleranssivarmennus (≤ ±1.5 mm), timanttipainon symmetrian tarkistus, 100 %:n reunaliimauksen tartuntatesti.'
    - defect: 'Brändäys / logon kirjoitusvirhe'
      protocol: 'Pysäytä tulostuslinja välittömästi. Pidä kaikki tulostetut paneelit. Tarkista vektoriversio asiakkaan kanssa; nolla hyväksymätöntä muutosta.'
      validation: 'Spektrofotometrinen väritarkistus (ΔE ≤ 1.5); 100 %:n tekstin kohdistuksen silmämääräinen varmennus asiakkaan allekirjoittamaan vektoriversion master-PDF:ään verrattuna.'
    - defect: 'Pakkauksen epäselvyys / puuttuva SKU'
      protocol: 'Erota vientilava. Avaa laatikot ja tee 100 %:n kohtainen BOM-tarkistus (pumppu, evä, ranneremmi, mela, korjausputki).'
      validation: 'Suoralla toiminnalla olevan sähköisen punnitusvaakan validointi (±30 g poikkeama); optinen 2D-viivakoodiskannerin varmennus.'

nc_scrap:
  tagline: Nolla markkinavuotoa
  title: Todistettu romutus ja tuhointi — nollavirheväiteiden ohjauspohjainen torjuntaprotokolla
  body: |
    Ulkomaisten brändikumppanimme tarvitsevat varmuuden siitä, ettei hyväksymättömiä lautoja koskaan pääse sekundääriseen vähittäiskauppaan, harmaan markkinoille tai verkkokauppakanaviin. Laudat, joita ei saada vaatimustenmukaisiksi, tuhotaan todistetun ja kirjatun protokollan mukaisesti:

    **1. Osien ja lisävarusteiden leikkaaminen.** Laadunvarmistuksen johtajan valvonnassa hydraulisella leikkurilla poistetaan kaikki 316-teräksiset D-renkaat, kantokahvan nauhat ja matkalukkojen soljet. Täyttöventtiilin kokoonpano ja evälaatikon pohja (US-Box / napsautuskiinnityksinen evä) irrotetaan laudan juuresta, jolloin mitään pelastuskelpoista osaa ei jää jäljelle.

    **2. Drop-stitch-rakenteen leikkaaminen ja kiskojen katkaiseminen.** Sisäinen drop-stitch-ydin leikataan laudan ja kannen läpi poikittain syvillä ristikkoviiltoilla (≥ 50 cm per leikkaus), ja vahvistetut sivukiskot katkaistaan vähintään 4 osaan — tiivistyskyky ja kelluvuus tuhoutuvat pysyvästi.

    **3. Video- ja kuvavarasto.** Tuhointi tallennetaan leikkaamattomana 1080p-videona, jossa on lähikuvat sarjanumeroviivakoodista, leikkausprosessista, ytimen leikkaamisesta ja lopullisesta punnitusta romupinosta. Video lasennetaan (SHA-256) ja arkistoidaan ohjatulle palvelimelle ≥ 5 vuodeksi.

    **4. Todistettu jätehuolto.** Kaikki PVC- ja drop-stitch-kappaleet punnitaan, kirjataan lähtevään kirjaan ja kuljetetaan vain pätevien muovinkierrättäjäkumppanien toimesta — mitään jäämiä ei poistu laitokselta muuta reittiä.

    > **Brändin suojelutakuu:** QINGDAO VATRAD GROUP CO., LTD. takaa 100 %:n tuhonnin kaikille korjauskelvottomille, määrityksen ulkopuolelle jääville vesillikkeille. Mitään tehtaan toisiarjaa tai vaarantunutta lauttaa ei koskaan pääse sekundääriseen vähittäiskauppaan, harmaan markkinoille tai verkkokauppakanaviin. Romutus- ja tuhointitodistus (VAT-QA-SCRAP-CERT-2026) kirjaa tuotteen, erän, MRB:n päätöksen, todistusvalokuvat sekä laadunvarmistuksen johtajan ja tehtaanjohtajan kaksoishyväksynnän.

