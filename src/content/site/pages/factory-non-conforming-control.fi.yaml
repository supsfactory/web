faqs:
  tagline: FAQ
  title: Laadun ja virheiden hallinnan FAQ maailmanlaajuisille ostajille
  items:
    - q: 'Miten takaatte, että korjatut laudat täyttävät kaikki turvallisuusvaatimukset?'
      a: 'Jokainen korjattu lauta käsitellään uutena yksilönä, ja sen on läpittävä täsmälleen sama täydellinen testisykli alusta asti — ilmatiiviyskorjauksille täysi 24h painetesti. Luovutusvalidoinnin suorittavat riippumattomat laadunvalvonnan tarkastajat, eivät korjausta tekevät henkilöt.'
    - q: 'Lähettääkö tehdas lautoja pienillä kosmeettisilla poikkeamilla kertomatta siitä?'
      a: 'Ei koskaan. Mikään poikkeama, joka vaikuttaa asiakkaan hyväksymiin referenssilautoihin, logon artworkiin, väriversioihin tai pakkaukseen, vaatii asiakkaan allekirjoittaman formaalin kirjallisen suostumussopimuksen ennen lähetysluovutusta.'
    - q: 'Mitä tapahtuu, jos korjattu lauta ei läpäise uudelleentarkastusta?'
      a: 'Lautaa ei luovuteta. Se palaa uuteen päätöskäsittelyyn, ja jos sitä ei saada vaatimustenmukaiseksi, se korvataan, hylätään tai tuhotaan todistetun romutusprotokollan mukaisesti. Saman virheluokan toistuva epäonnistuminen käynnistää juurisyntyisen CAPA:n.'
    - q: 'Voiiko hyväksymättömiä lautoja myydä tehtaan toisiarjana tai muiden kanavien kautta?'
      a: 'Ei. Korjauskelvottomat, määrityksen ulkopuolelle jäävät laudat tuhotaan fyysisesti todistetun romutusprotokollan mukaisesti — osat leikataan, ydin ja kiskot katkaistaan, video tallennetaan SHA-256-hajutusarvolla ja arkistoidaan vähintään 5 vuodeksi. Romutus- ja tuhointitodistuksen allekirjoittavat laadunvarmistuksen johtaja ja tehtaanjohtaja.'
    - q: 'Miten vaikutusalue arvioidaan, kun virhe löytyy?'
      a: 'Laajuus käydään läpi tuotteen tunnistetun, valmistuserän, materiaali- tai osaerän, prosessivaiheen ja sovellettavan asiakirjaversion mukaan. Jos kyseessä on sama materiaalierä, artwork-versio tai työasema, vaikutusalaan kuuluvat tuotteet eristetään ja tarkistetaan vastaavasti.'
    - q: 'Tarvitsetteko meidän hyväksymme ennen suostumuksen myöntämistä?'
      a: 'Kyllä. Mikään kirjalliseen suostumukseen perustuva hyväksyntä, joka vaikuttaa asiakkaan vaatimuksiin — hyväksyttyihin näytteisiin, määritykseen, artworkiin, pakkaukseen tai hyväksymiskriteereihin — vaatii asiakkaan kirjallisen hyväksynnän ennen luovutusta. Ilman sitä tuote korjataan alkuperäisen vaatimuksen mukaisesti, korvataan tai hylätään.'
    - q: 'Mitä dokumentaatiota saamme vaatimustenvastaisuudesta?'
      a: 'NCR-kirjaus sisältää NCR-numeron, tunnistusvaiheen, tuotteen/SKU:n, erän, sovellettavat asiakirjaversiot, virheen kuvauksen, eristyksen, päätöksen, korjausohjeen viitteen, uudelleentarkastustuloksen sekä luovutus- tai sulkuhyväksynnän — saatavilla projektin laatua koskevan sopimuksesi mukaisesti.'

