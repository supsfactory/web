nc_intro:
  tagline: Vaatimustenvastaisten tuotteiden hallinta
  title: Mitä tapahtuu, kun tuote ei täytä kriteerejä
  body: |
    Tuotteet tai osat, jotka eivät täytä määriteltyjä hyväksymiskriteerejä, tunnistetaan ja valvotaan, jotta ne eivät pääse vahingossa käyttöön, jatkokäsittelyyn tai lähetettäväksi. Sovellettavat hyväksymiskriteerit perustuvat hyväksytynäytteeseen, tekniseen määritykseen, artworkiin, materiaaliluetteloon, pakkausvaatimuksiin ja projektin tarkastussuunnitelmaan.

    Vaatimustenvastaiset kohdet arvioidaan vaikutusalueen ja asianmukaisen päätöksen määrittämiseksi. Ongelmasta riippuen kohde voidaan pitää tehtaan pidätyksessä, korjata ohjattujen ohjeiden mukaisesti, vaihtaa uuteen, hylätä tai käsitellä muuten hyväksytyn prosessin kautta. Korjatut tai korjautetut kohteet tarkastetaan uudelleen ennen luovutusta. Lähetysluovutus sallitaan vasta, kun asianomaiset laatukirjaukset on täydennetty ja tuote täyttää sovellettavat hyväksymiskriteerit.

nc_flow:
  tagline: Vakiintunut 7-vaiheinen suljettu silmukka
  title: Tunnistamisesta korjaavaan toimenpiteeseen
  subtitle: 'Yksi ohjattu silmukka jokaiselle vaatimustenvastaisuudelle: tunnista, erota, arvioi, korjaa tai vaihda, tarkasta uudelleen, luovuta tai hylkää, paranna.'
  steps:
    - step: '01'
      title: Tunnistaminen
      desc: 'Jokainen tunnistettu vaatimustenvastaisuus kirjataan kyseisen tuotteen, erän tai osan kohdalle ja arvioidaan suhteessa sovellettaviin projektivaatimuksiin. Tunnistus voi tapahtua saapuvassa tarkastuksessa, prosessin aikaisessa valvonnassa, lopputestauksessa, pakkauksessa tai asiakkaan/kolmannen osapuolen tarkastuksessa.'
    - step: '02'
      title: Erottelu
      desc: 'Kohdet identifioidaan selvästi ja siirretään ohjattuun pidätys- tai eristystilaan, jotta ne eivät pääse vahingossa käyttöön, jatkokäsittelyyn tai lähetettäväksi. HOLD / QUARANTINE / REJECTED -merkinnässä ovat NCR-numero, SKU, erä, määrä, virheen kuvaus ja päivämäärä.'
    - step: '03'
      title: Arviointi
      desc: 'Vaikutusalue ja asianmukainen päätös arvioidaan: yksikkö, vaihtoerä, koko erä tai useita eriä — yhteisten materiaalierien, artwork-versioiden, prosessivaiheiden ja asiakirjaversioiden kautta. Tarvittaessa kohdetaan eristetään lisäksi ja tarkastusta tiivistetään.'
    - step: '04'
      title: Korjaus tai vaihto
      desc: 'Sallittu korjaus tehdään hyväksytyn ohjeen mukaisesti, jossa määritetään kohteen, menetelmä, materiaalit, tarkastuspisteet ja uudelleentarkastusvaatimukset. Tuotemääritykseen, artworkiin, lisävarustekokoonpanoon tai pakkaukseen ei koskaan sallita hyväksymättömiä muutoksia. Korvaavat tuotteet palaavat sovellettavien tarkastusporttien läpi.'
    - step: '05'
      title: Uudelleentarkastus
      desc: 'Korjatut tai korjautetut kohteet tarkastetaan uudelleen sovellettavia hyväksymiskriteerejä vasten. Alkuperäisesti epäonnistunut ominaisuus ja kaikki korjauksen mahdollisesti vaikuttamat ominaisuudet varmennetaan ennen luovutusta — riippumattomalla laadunvalvonnalla, ja ilmatiiviyskorjauksille täydellä uudella 24h painetestisyklillä.'
    - step: '06'
      title: Luovutus tai hylkäys
      desc: 'Tuote luovutetaan vasta, kun vaadittu uudelleentarkastus on valmis ja valtuutettu laatuhenkilö vahvistaa vaatimustenmukaisuuden sovellettavia projektivaatimuksia vasten. Kohteet, joita ei saada vaatimustenmukaisiksi, hylätään, korvataan, palautetaan tai käsitellään ohjattujen menettelyjen mukaisesti — mukaan lukien todistettu fyysinen tuhointi.'
    - step: '07'
      title: Korjaava toimenpide
      desc: 'Toistuville, vakaville tai järjestelmällisille vaatimustenvastaisuuksille tehdään juurisyntianalyysi ja korjaava toimenpide (CAPA). Parannuksina voidaan tulla työohjeiden päivitykset, materiaalien valvonta, tarkastuspisteet, koulutus, toimittajien hallinta tai asiakirjojen valvonta.'

nc_pillars:
  tagline: Ostajan luottamuksen pilarit
  title: Kolme valvontaa, jotka suojaavat brändiäsi
  subtitle: 'Prosessi on suunniteltu vastaamaan niihin kysymyksiin, joita ulkomaankauppiajat oikeasti kysyvät: piilotetaanko ongelmat, pidättykö korjaus hallinnasta ja varmennetaanko korjatut laudat uudelleen.'
  features:
    - icon: 1
      icon_bg: blue
      title: Vain ohjatut ohjeet
      desc: 'Korjausta sääntelee tiukasti valtuutettu vakiokorjausohje (SRI). Hyväksymättömät kenttämuutokset, määritysten muuttaminen tai artworkin muokkaaminen ilman kirjallista valtuutusta on ehdottomasti kielletty.'
    - icon: 2
      icon_bg: green
      title: Riippumaton uudelleentarkastus
      desc: 'Korjatut laudat tarkastetaan 100 %:sti laadunvarmistuksen tarkastajien toimesta alkuperäisiä hyväksymiskriteerejä vasten. Ilmatiiviyskorjaukset vaativat aivan uuden, täyden 24h painetestisyklin — ei koskaan osittaista uudelleentarkistusta.'
    - icon: 3
      icon_bg: purple
      title: Valtuutettu hyväksyntä ja jäljitettävyys
      desc: 'Lähetysluovutus sallitaan vasta, kun NCR-dokumentaatio on täydellinen ja valtuutettu laadunvalvontahenkilö on hyväksynyt sen, ja erän tila siirtyy HOLD-tilasta RELEASED-tilaan. Järjestelmälliset tai toistuvat poikkeamat käynnistävät automaattisesti juurisyntyiset CAPA-käytännöt.'

