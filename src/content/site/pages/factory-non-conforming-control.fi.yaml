answer:
  label: 'Suora vastaus'
  text: 'QINGDAO VATRAD GROUP.,LTD.:ssä vaatimustenvastaisia tuotteita ei koskaan piiloteta, korjata epävirallisesti eikä luovuteta ilman todennusta. Jokainen tunnistettu vaatimustenvastaisuus kirjataan kyseisen tuotteen, erän tai osan kohdalle ja liitetään NCR-tunnukseen. Kohde merkitään (HOLD / QUARANTINE / REJECTED), erotetaan fyysisesti, ja vaikutusalue arvioidaan erän, materiaalierän, prosessivaiheen ja asiakirjaversioiden mukaan. Päätös tehdään virhevaikeutta vastaavalla päätösvallan tasolla: vähäiset ongelmat hyväksytään linjatason käsittelynä, vakavat ongelmat vaativat laadunvalvontapäällikön ja tuoteteknikon päätöksen sekä ohjatun korjausohjeen ja 100 %:n riippumattoman uudelleentarkastuksen, ja kriittiset ongelmat vaativat materiaaliarviointikomitean päätöksen sekä kirjallisen asiakkaan suostumuksen tarvittaessa — muuten pakollinen todistettu tuhointi. Korjatut tuotteet tarkastetaan uudelleen alkuperäisiä hyväksymiskriteerejä vasten, ilmatiiviyskorjauksille tehdään täysi uusi painetestisykli, ja lähetysluovutus tapahtuu vasta valtuutetun laadullisen hyväksynnän jälkeen. Toistuvat tai järjestelmälliset ongelmat käynnistävät juurisyntyisen korjaavan toimenpiteen (CAPA).'
  verified: 'Syyskuu 2026'

