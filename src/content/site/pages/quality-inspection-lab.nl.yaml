  text: 'Elke plank wordt vóór verzending getest tegen de gepubliceerde specificaties: 100 % drukhoudtest bij 18.0 PSI gedurende 24 uur (automatische afkeur boven 0.50 PSI drukval), trektests en naadpeeltests volgens ISO 1421 en een 100-punts montagechecklist. Het laboratorium rapporteert rechtstreeks aan de bedrijfsdirectie, niet aan de productie, en kan elke levering stoppen.'
