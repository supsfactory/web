answer:
  label: 'Răspuns direct'
  text: 'Transformăm un model CAD într-o placă de probă utilizabilă și testată în 7–12 zile: prototipizare cu elemente gonflabile, teste pe apă în val, iterații la nivelul șinei și al prăbuliei, apoi angajarea uneltelor de producție. Formele complet personalizate necesită 15–20 zile suplimentare de unelte, peste termenul standard de 25–35 zile pentru producția de serie.'
