what_we_need:
  heading: 'Que préparer avant votre brief'
  body: |
    Un brief complet accélère le processus. Voici ce qui aide :

    - **Specs de planche** — Longueur, largeur, épaisseur cibles, poids du pagayeur, cas d''usage. Les dimensions de planche de référence ou modèles concurrents sont utiles.
    - **Fichiers design** — Visuels vectoriels (AI, SVG, PDF) pour graphismes et logos. Si non prêts, des mood boards ou images de référence fonctionnent pour la faisabilité initiale.
    - **Volume & calendrier** — Quantité cible et planning saisonnier. Même une fourchette approximative (« 20–50 planches d''ici mars ») suffit à démarrer.
    - **Besoins de conformité** — Marchés cibles et toute exigence de certification spécifique au-delà de CE, ISO 9001, BSCI, REACH, RoHS.
    - **Fourchette budgétaire** — Un budget par planche indicatif ou un coût débarqué cible nous aide à recommander la bonne plateforme.

    **Pas prêt sur tout ?** Soumettez ce que vous avez. Nous guiderons le reste.

faqs:
  tagline: FAQ
  title: 'Lancer un projet SUP — Questions fréquentes'
  items:
    - q: 'Quelle est la commande minimale pour démarrer ?'
      a: 'Le point d''entrée est étagé : 1–2 échantillons d''abord (7–12 jours), une commande d''essai de 20–50 planches (25–35 jours), puis des runs de volume standard de 90–100+ planches par configuration approuvée. Le co-marquage en marque privée démarre à 5–10 unités sans étape de développement.'
    - q: 'Combien de temps pour obtenir des échantillons ?'
      a: 'Les échantillons physiques sont produits en 7–12 jours à partir de la spec et de l''acompte confirmés. En utilisant des plateformes de carène existantes, le cycle complet du brief à la commande d''essai livrée tourne généralement en 8–12 semaines. Une carène sur mesure ajoute 15–20 jours de développement de moule.'
    - q: 'Mon design est-il protégé ?'
      a: 'Oui. Un NDA est disponible immédiatement — avant de partager toute information propriétaire. Nous fabriquons exclusivement sous les marques de nos clients et ne leur faisons jamais concurrence. Tous les fichiers techniques sont stockés dans des systèmes à contrôle d''accès avec pistes d''audit.'
    - q: 'Que demande le formulaire de brief de projet ?'
      a: 'Le brief demande votre type d''entreprise, le nom de la société, les spécifications de planche cibles, la fourchette de quantité de commande, le calendrier et tout besoin de conformité. Cela prend environ 5–10 minutes. Vous pouvez joindre des fichiers design (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) jusqu''à 10 Mo. Si un champ vous est incertain, sautez-le — nous suivrons.'
    - q: 'Que se passe-t-il après avoir soumis le brief ?'
      a: 'Vous recevez une réponse sous un jour ouvré. L''ingénierie examine votre brief et renvoie un devis détaillé avec MOQ, frais d''échantillon et calendrier étape par étape. Aucun engagement n''est requis avant de revoir et signer le contrat. Les frais d''échantillon sont crédités sur votre commande de production.'

