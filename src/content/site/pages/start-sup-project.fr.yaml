answer:
  label: 'Que se passe-t-il ensuite'
  text: 'Après avoir soumis un brief de projet, vous recevez une réponse sous un jour ouvré. Un NDA est disponible avant de partager tout détail propriétaire. L''ingénierie examine votre brief et renvoie un devis détaillé avec MOQ, frais d''échantillon et un calendrier étape par étape — généralement 7–12 jours pour les échantillons et 6–8 semaines pour la première production à partir de la PO confirmée. Les frais d''échantillon sont crédités sur votre commande de production. Aucun engagement jusqu''à signature.'
  verified: '2026-08'

process_steps:
  tagline: Le processus
  title: 'Du brief aux planches livrées — cinq étapes'
  subtitle: 'Chaque étape a un calendrier défini, un livrable documenté et un point de contrôle go/no-go. Vous avancez seulement quand vous êtes prêt.'
  steps:
    - step: 'Étape 1'
      title: 'Soumettez votre brief de projet'
      desc: 'Parlez-nous de votre planche — specs cibles, volume, besoins de conformité et calendrier. Le brief prend 5–10 minutes. Si vous n''êtes pas sûr de chaque détail, partagez ce que vous avez et nous guiderons le reste. Un NDA est disponible avant de partager des designs propriétaires.'
    - step: 'Étape 2'
      title: 'NDA & revue de faisabilité (1–5 jours)'
      desc: 'Nous signons un NDA si demandé, puis l''ingénierie examine votre brief contre la capacité de fabrication, la disponibilité des matériaux et le périmètre de conformité. Vous recevez un devis détaillé avec calcul MOQ, frais d''échantillon et calendrier étape par étape.'
    - step: 'Étape 3'
      title: 'Échantillon & approbation (7–21 jours)'
      desc: '1–2 planches physiques produites selon votre spécification. Vous pagayez et évaluez — rigidité de la carène, exactitude des graphismes, ajustement des accessoires. Les ajustements sont capturés dans un BOM révisé. L''échantillon figé devient la référence de production. Les frais d''échantillon sont crédités sur la production.'
    - step: 'Étape 4'
      title: 'Planification pré-production (7 jours)'
      desc: 'Achats des matériaux, installation de l''outillage, confirmation de l''emballage et réservation du créneau de production. Tous les matériaux sont inspectés à l''entrée contre le BOM figé. Un planning de production avec dates de portes QC est émis avant le démarrage de la fabrication.'
    - step: 'Étape 5'
      title: 'Production, QC & expédition (4–6 semaines)'
      desc: 'La fabrication passe le système de portes d''inspection à 7 étapes avec critères pass/fail à chaque porte. Emballage de grade export, documentation de conformité et coordination du fret maritime vers 50+ pays. La revue post-livraison capture les améliorations pour la commande suivante.'

