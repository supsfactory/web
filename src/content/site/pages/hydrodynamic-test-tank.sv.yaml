answer:
  label: 'Entydigt svar'
  text: 'Vi testar SUP-skalpformer i testdammen i modellskala 1:3 till 1:5 — båtprofil, railradie, rocker och våt yta — och mäter motstånd, glideffektivitet och stabilitet, innan vi låser oss vid en prototyp i full storlek. En vecka i dammen ger de prestandadata som annars skulle kräva månader av försök och misslyckanden i full storlek.'
  verified: 'September 2026'

