  label: 'Прямой ответ'
  text: 'Надувный SUP — это сапборд для Stand Up Paddle из ткани ПВХ конструкции drop stitch, который становится жестким при накачке до 12–15 PSI. Он соответствует характеристикам жестких досок для большинства любительских и туристических применений, весит примерно 8–10 кг и складывается в рюкзак для хранения и перевозки.'
