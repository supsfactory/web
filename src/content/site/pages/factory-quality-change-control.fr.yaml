cc_intro:
  tagline: Périmètre et politique
  title: Principes de gouvernance essentiels
  body: |
    **Document :** QMS-SOP-QC-CC-001 — *Norme de contrôle des modifications de paramètres de processus de reprise* (Rev 2.0, publication officielle). **Fabricant :** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Référence de norme :** Systèmes de management de la qualité ISO 9001:2015.

    - **Aucune modification non contrôlée.** Les modifications de paramètres de reprise doivent passer par un contrôle formel des modifications. Les opérateurs sur site, les chefs d'équipe ou un service unique ne sont jamais autorisés à modifier des paramètres de reprise approuvés par accord verbal ou par écriture manuscrite sur un enregistrement de reprise.
    - **Couverture complète des éléments.** Le périmètre contrôlé couvre l'étanchéité à l'air, les sièges de valves, les bandes de rail, l'assemblage des coutures, le durcissement à l'air chaud et le test de maintien de pression — chaque paramètre pouvant influencer l'étanchéité, la durabilité structurelle, l'apparence, l'acceptation client ou la traçabilité.
    - **Ligne de base d'approbation client.** Toute modification qui éloigne un produit de l'échantillon approuvé par le client, de la spécification technique, de la BOM, des graphismes, de l'exigence d'emballage ou des critères d'acceptation n'est mise en œuvre qu'avec l'approbation écrite du client. Sans elle, la planche est reprise selon l'exigence d'origine, remplacée ou rejetée — jamais « assouplie » par l'usine seule.

cc_scope:
  tagline: Classification des risques
  title: Périmètre de modification et classification des risques
  subtitle: Chacun des éléments suivants déclenche un contrôle formel des modifications — il n'est jamais traité en écrivant une note dans l'enregistrement de reprise. Le niveau de risque détermine qui approuve et la quantité de validation requise.
  headers:
    category: Catégorie de modification
    examples: Exemples typiques
    risk: Risque
    requirements: Exigences de contrôle et d'approbation
  rows:
    - category: 'Matériaux de reprise'
      examples: 'Adhésif, nettoyant, matériau de patch, joint de valve, primaire ou changement de fournisseur'
      risk: 'Élevé'
      requirements: 'Revue interdépartementale + validation de compatibilité des matériaux et de maintien de pression + validation client le cas échéant'
    - category: 'Conditions de processus'
      examples: 'Préparation de surface, température/humidité de durcissement à l''air chaud, pression de serrage, durée de maintien'
      risk: 'Élevé'
      requirements: 'Approbation Ingénierie + Qualité avec validation de fenêtre de température et d''humidité définie'
    - category: 'Outillage et jauges'
      examples: 'Manomètres, détecteurs de fuite, pistolets thermiques, outils de valve, logiciels de test'
      risk: 'Moyen/Élevé'
      requirements: 'Contrôle de validité d''étalonnage + évaluation de l''aptitude de l''équipement'
    - category: 'Périmètre du défaut'
      examples: 'Extension de la zone de reprise ; micro-fuite de surface s''étendant vers les zones critiques du rail, de la couture ou du siège de valve'
      risk: 'Élevé'
      requirements: 'Surfaces structurelles porteuses : arrêt obligatoire et ré-évaluation'
    - category: 'Méthodes d''inspection'
      examples: 'Méthode de détection de fuite, pression de test (18,0 PSI), durée de maintien (24 h)'
      risk: 'Élevé'
      requirements: 'Approbation Qualité + confirmation d''accord technique client'
    - category: 'Documentation et autorisation'
      examples: 'Instruction de reprise, feuilles d''inspection, logique de disposition NCR, qualification des opérateurs'
      risk: 'Moyen'
      requirements: 'Révision documentaire contrôlée (Rev A → Rev B) + enregistrements de formation'

cc_containment:
  tagline: Règle d'arrêt dur
  title: Confinement immédiat quand les conditions deviennent sérieuses
  body: |
    > « La méthode de reprise existante doit être placée sous revue et ne doit pas être appliquée à des produits affectés supplémentaires jusqu'à ce que la modification soit évaluée et autorisée, sauf si un écart temporaire documenté est approuvé par la Qualité et l'Ingénierie. »

    La méthode de reprise actuelle doit être suspendue immédiatement lorsque la ré-inspection de reprise continue d'échouer, lorsque le défaut implique des zones structurelles porteuses (base de valve, rails, coutures, zones de pression nez/queue), lorsqu'un matériau de substitution n'est pas encore validé, ou lorsque les paramètres actuels entrent en conflit avec la spécification approuvée par le client.

    Les écarts temporaires ne deviennent jamais une pratique permanente : chacun porte une fenêtre de validité définie, un périmètre de lot applicable, un plafond de quantité, des exigences de validation et un mécanisme d'expiration automatique. Une exception verbale n'est pas une exception — si elle n'est pas documentée avec son expiration, elle n'existe pas.

cc_flow:
  tagline: Boucle fermée standard en 9 étapes
  title: De la demande de modification à la clôture et la conservation
  subtitle: 'Une boucle documentée pour chaque modification de paramètre : proposer, filtrer, évaluer, approuver, valider, piloter, vérifier, réviser, clôturer.'
  steps:
    - step: '01'
      title: Demande de modification (ECR)
      desc: 'Tout service peut soumettre une demande, mais la direction Ingénierie, Qualité ou Production la parraine. L''ECR répond pourquoi la modification est proposée, ce qui change, ce qui est affecté et comment elle sera vérifiée — avec numéro de contrôle des modifications, NCR/CAPA connexes, paramètre actuel vs proposé, lots affectés et classification temporaire/permanente.'
    - step: '02'
      title: Filtrage initial et confinement
      desc: 'La demande est d''abord filtrée pour le confinement immédiat : la méthode actuelle doit-elle s''arrêter maintenant ? Si un écart temporaire est autorisé, il est borné par la fenêtre de validité, le périmètre de lot, le plafond de quantité et l''expiration automatique.'
    - step: '03'
      title: Évaluation d'impact et de risque
      desc: 'L''Ingénierie, la Qualité, la Production, les Achats/Chaîne d''approvisionnement et le Projet évaluent la performance produit, les critères d''acceptation, la compatibilité des matériaux, l''apparence, la capacité de processus, l''équipement et les jauges, la qualification du personnel, les exigences client, la conformité et le périmètre de traçabilité.'
    - step: '04'
      title: Revue conjointe et approbation
      desc: 'L''approbation suit la matrice d''autorisation fixe — pas « celui qui parle le plus fort ». Les modifications à haut risque exigent une approbation interdépartementale et, là où requis, une approbation écrite du client avant tout essai.'
    - step: '05'
      title: Plan de validation
      desc: 'Pour les modifications à haut risque, un plan de validation approuvé est requis avant application de routine : planches échantillons représentatives, méthode actuelle vs proposée, méthodes de test, critères d''acceptation, étapes d''inspection, personnes responsables et calendrier.'
    - step: '06'
      title: Mise en œuvre pilote contrôlée
      desc: 'Les nouveaux documents sont publiés et les versions obsolètes retirées et marquées OBSOLÈTES ; les nouveaux matériaux et jauges sont vérifiés et étalonnés ; les opérateurs sont formés et qualifiés ; le premier lot tourne sous inspection renforcée avec identification claire du statut.'
    - step: '07'
      title: Ré-inspection et revue d'efficacité
      desc: 'Le taux de reprise au premier passage, le taux de réussite de ré-inspection, le taux de récurrence et l''acceptation de l''apparence sont mesurés et revus avant que la modification puisse être considérée comme efficace — une planche réparée n''est jamais traitée comme une validation de processus.'
    - step: '08'
      title: Révision documentaire et formation
      desc: 'Les instructions de travail, feuilles d''inspection, options de disposition NCR, cartes de paramètres et supports de formation sont mis à jour à la nouvelle révision avec formation pratique enregistrée et qualification des opérateurs.'
    - step: '09'
      title: Clôture et conservation des enregistrements
      desc: 'La modification n''est clôturée qu''après revue et approbation des preuves de validation, des mises à jour documentaires, des enregistrements de formation et de l''efficacité de la mise en œuvre. Si le résultat visé n''est pas atteint, la modification est révisée, prolongée, suspendue ou retirée.'

