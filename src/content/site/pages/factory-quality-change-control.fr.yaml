faqs:
  tagline: FAQ
  title: Questions fréquentes sur le contrôle des modifications de reprise
  items:
    - q: 'L''usine peut-elle modifier les paramètres de reprise sans nous en informer ?'
      a: 'Non. Toute modification proposée des matériaux de reprise approuvés, des conditions de processus, de l''outillage, des méthodes de test, des critères d''inspection ou du personnel autorisé doit d''abord passer un contrôle documenté des modifications. Les modifications affectant les spécifications, échantillons, BOM, graphismes ou critères d''acceptation approuvés par le client exigent une approbation écrite du client.'
    - q: 'Qu''est-ce qui compte comme une modification à haut risque ?'
      a: 'Les modifications des matériaux ou fournisseurs de reprise, des conditions de pression/maintien ou de durcissement, des méthodes de reprise de valve/rail/couture, des critères d''inspection ou d''acceptation, et l''extension du périmètre du défaut dans les zones structurelles sont classées à haut risque. Elles exigent une revue interdépartementale, un plan de validation approuvé et une mise en œuvre pilote contrôlée avant usage de routine.'
    - q: 'Un écart temporaire peut-il être utilisé indéfiniment ?'
      a: 'Non. Chaque écart temporaire porte une fenêtre de validité définie, un périmètre de lot, un plafond de quantité et des exigences de validation, avec expiration automatique. Atteindre le plafond verrouille le lot et bloque l''impression de l''étiquette de passe jusqu''à ce que la modification soit formellement évaluée.'
    - q: 'Comment une méthode modifiée est-elle prouvée efficace avant usage complet ?'
      a: 'Les modifications à haut risque exigent un plan de validation : au moins 5 planches échantillons représentatives couvrant les limites de tolérance, testées par 2 inspecteurs QC indépendants selon des critères d''acceptation quantifiés (élimination de fuite, maintien de pression, fonction de valve, durabilité de couture, apparence). L''approbation de validation n''est pas une approbation d''application.'
    - q: 'Devons-nous approuver chaque modification ?'
      a: 'Pas chaque modification, mais toute modification qui éloigne le produit de l''échantillon approuvé par le client, de la spécification technique, de la BOM, des graphismes, de l''emballage ou des critères d''acceptation n''est mise en œuvre qu''avec l''approbation écrite du client. Sans elle, les planches sont reprises selon l''exigence d''origine, remplacées ou rejetées.'
    - q: 'Que deviennent les anciens documents quand une modification est approuvée ?'
      a: 'Les anciennes instructions de travail, cartes de paramètres et feuilles d''inspection sont physiquement collectées et annulées (1-pour-1), marquées OBSOLÈTES, et remplacées par la nouvelle révision contrôlée après formation. Les anciennes et nouvelles versions ne partagent jamais un poste de travail.'
    - q: 'Combien de temps les enregistrements de contrôle des modifications sont-ils conservés ?'
      a: 'Les enregistrements de clôture — preuves de validation, révisions documentaires, enregistrements de formation et revues d''efficacité — sont conservés selon notre politique de conservation des enregistrements (minimum 3 ans pour les enregistrements de clôture), afin que chaque modification reste traçable pour les audits et les revues de traçabilité.'

