cc_pokayoke:
  tagline: Garde-fous anti-erreur
  title: 'Poka-Yoke : des blocages durs qui empêchent la modification non contrôlée'
  subtitle: La norme est appliquée non seulement par des procédures mais aussi par des blocages physiques et au niveau système qui rendent les modifications non contrôlées impossibles à exécuter.
  features:
    - icon: 1
      icon_bg: blue
      title: Porte ECR pour déverrouillage de l'outillage
      desc: 'Les postes de reprise lisent un code-barres ECR signé QA avant que les valves de gonflage pneumatiques et les mélangeurs de colle se déverrouillent. Pas d''enregistrement de contrôle des modifications approuvé, pas d''alimentation — la validation rétroactive (« modifier d''abord, signer ensuite ») est physiquement bloquée.'
    - icon: 2
      icon_bg: green
      title: Expiration automatique des écarts temporaires
      desc: 'Les écarts temporaires sont plafonnés en dur dans le système (par exemple un maximum de 50 planches ou 7 jours calendaires). Atteindre le plafond verrouille le lot et bloque l''impression de l''étiquette de passe d''expédition jusqu''à ce que la modification soit formellement évaluée.'
    - icon: 3
      icon_bg: purple
      title: Preuves de validation minimales
      desc: 'Les modifications à haut risque exigent au moins 5 planches échantillons représentatives couvrant les limites de tolérance supérieure et inférieure, entièrement inspectées par 2 inspecteurs QC indépendants, avant qu''un rapport de validation puisse être émis — une planche réparée n''est jamais traitée comme une validation de processus.'
    - icon: 4
      icon_bg: orange
      title: Contrôle documentaire 1-pour-1
      desc: 'Les cartes de poste de travail obsolètes sont physiquement collectées et annulées (perforées) avant que la nouvelle carte estampillée du sceau rouge contrôlé soit émise — les anciennes et nouvelles versions ne partagent jamais un poste de travail.'

