cc_validation:
  tagline: Validation d'ingénierie
  title: Protocole de validation et d'acceptation — des preuves plutôt que des affirmations
  body: |
    Les formulations d'acceptation vagues telles que *« la planche réparée doit être bonne »* ne sont pas acceptées. La formulation contrôlée est :

    > « L'échantillon repris doit satisfaire les mêmes critères d'acceptation applicables d'étanchéité à l'air, de finition visuelle, de fonction de valve et de spécifiques au projet qu'une planche conforme, sauf si un écart approuvé par le client définit spécifiquement un critère alternatif. »

    Les preuves de validation sont quantitatives, et la base d'ingénierie pour la reprise d'étanchéité à l'air comprend :

    - **Élimination de la fuite et maintien de pression.** La fuite d'origine est éliminée sans bulles persistantes dans la détection de fuite à l'eau savonneuse ; la planche tient à la pression de test standard de 18,0 PSI pendant 24 heures, avec une chute de pression nette ΔP ≤ 0,2 PSI après compensation de température/humidité.
    - **Fonction de valve.** Le couple du noyau de valve respecte la spécification de 15–20 N·m, sans micro-fuite au joint sous gonflage haute pression et pressage dynamique.
    - **Assemblage et durabilité des coutures.** Les bords liés ne montrent aucun soulèvement, blanchiment ou délamination ; après cycles de vieillissement chaleur-humidité, la couche adhésive ne montre aucun ramollissement ni fissuration fragile.
    - **Apparence et finition.** Aucune trace de coulure d'adhésif, aucun dommage EVA, aucune déformation de planche, aucun déplacement de logo ni rayure de surface imprimée.

cc_engineering:
  tagline: Matrice d'exécution d'ingénierie
  title: Paramètres quantifiés pour les quatre processus de reprise principaux
  subtitle: 'Chaque processus de reprise contrôlé porte des paramètres, une méthodologie et des critères d''acceptation définis — les mêmes chiffres que nos opérateurs suivent et que nos clients peuvent vérifier lors des audits.'
  headers:
    process: Processus de reprise
    parameters: Paramètres contrôlés
    methodology: Méthodologie de test
    acceptance: Critères d'acceptation
  rows:
    - process: 'Réparation de patch de trou d''épingle / micro-fuite'
      parameters: 'Nettoyage au solvant et séchage 3–5 min ; activation à l''air chaud 60 °C ± 5 °C ; rouleau presseur ≥ 0,4 MPa'
      methodology: 'Gonfler à 18 PSI ; immersion complète dans l''eau ou application de savon ; observer pendant 10 minutes'
      acceptance: 'Zéro émission de bulles ; pelage des bords à 180° sans soulèvement et sans trace de coulure d''adhésif'
    - process: 'Re-assemblage de bande de rail / couture'
      parameters: 'Rapport d''adhésif bicomposant strictement contrôlé ; environnement 22–28 °C, ≤ 65 % HR ; serrage au gabarit ≥ 4 h'
      methodology: 'Test de surpression à 22 PSI pendant 2 h ; puis cuisson en étuve 50 °C 6 h et repos 2 h à température ambiante'
      acceptance: 'Zéro séparation, zéro fissure ; chute de pression nette ΔP ≤ 0,1 PSI ; couche adhésive sans blanchiment ni fragilisation'
    - process: 'Desserrage / micro-fuite de base de valve'
      parameters: 'Couple de clé dédiée 18–20 N·m ; joint d''étanchéité plat sans déformation ; propreté des filetages confirmée'
      methodology: 'Gonfler à 15 PSI ; 20 cycles de gonflage/dégonflage ; observation par immersion dans l''eau'
      acceptance: 'Zéro bulle au noyau et à la périphérie de la base de valve ; couple après cycles ≥ 16 N·m'
    - process: 'Test final de maintien de pression de 24 h'
      parameters: 'Gonflage de référence 18,0 PSI ; jauge numérique Classe 1.0 / ±0,5 % ; température et humidité ambiantes enregistrées et compensées'
      methodology: 'Enregistreur de pression numérique ; courbe de pression continue de 24 h'
      acceptance: 'Chute de pression nette ΔP ≤ 0,20 PSI / 24 h après compensation ; aucun gonflement ni déformation de planche'

cc_photos:
