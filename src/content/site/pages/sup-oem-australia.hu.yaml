hero:
  tagline: 'Ausztrália'
  title: 'Felfújható SUP OEM Ausztráliának – készlet a szezon előtt'
  subtitle: 'Minta 7–12 nap alatt, gyártás 25–35 nap alatt, tengeri szállítás 4–6 hét alatt Sydney, Melbourne vagy Brisbane kikötőjéig. A déli félteke vásárlói 3–4 hónappal előre terveznek, így a készlet a december–februári szezon előtt érkezik meg.'

answer:
  label: 'Közvetlen válasz'
  text: 'Az ausztrál márkák standard feltételekkel rendelnek felfújható SUP-t az iSupfactory-tól: az MOQ-t a projekt konfigurációja határozza meg: az 1–2 darabos mintasorozatok validálják a szerkezetet, a 20–50 darabos pilóta tételek meglévő platformokon tesztelik a piacot, a standard tömeggyártás pedig modellenként 90–100+ darabot gyárt egy teljes, 150 m-es drop-stitch tekercsből. Az első minta a specifikációk jóváhagyása után 7–12 nap alatt kerül feladásra, a gyártás a megrendelés és az előleg megerősítése után 25–35 napot vesz igénybe, a tengeri szállítás pedig további 4–6 hetet ad hozzá Sydney, Melbourne vagy Brisbane vonatkozásában. A gyártást és a szállítást figyelembe véve 3–4 hónappal azelőtt rendeljen, mielőtt készletre van szüksége a polcokon; a DDP tartalmazza a vámformalitásokat és a raktárába történő kiszállítást.'
  verified: '2026. szeptember'

