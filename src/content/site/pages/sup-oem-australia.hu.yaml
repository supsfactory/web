why_australia:
  tagline: 'Miért éppen az ausztrál vásárlók'
  title: 'Az ausztrál piacra tervezve'
  subtitle: 'Az ausztrál márkák számára az időzítés számít: az év első felében adja le a megrendeléseket, hogy a konténerek a nyár előtt átmenjenek a vámkezelésen.'
  items:
    - title: 'Szezonközpontú tervezés'
      description: 'Az ausztrál nyár decembertől februárig tart. Egy 25–35 napos gyártás plusz 4–6 hét szállítás azt jelenti, hogy az első vagy második negyedévben leadott megrendelés a szezon csúcsa előtt polcokra viszi a készletet.'
    - title: 'DDP a kiszámítható végleges költségért'
      description: 'A DDP tartalmazza a vámformalitásokat, a vámokat, az adókat és a raktárába történő kiszállítást – egyetlen teljes, házhoz szállítástól a házhoz szállításig terjedő ár.'
    - title: 'FOB Qingdao a saját vámkezelőjével'
      description: 'Rendszeresen importál? Válassza a FOB Qingdaót, és használja saját logisztikai partnerét – mi betöltjük és dokumentáljuk a konténert, Ön irányítja a többit.'
    - title: 'Egy gyár, egy minőségi rendszer'
      description: 'A fejlesztés, a minták, a gyártás és a minőségi ellenőrzés mind a 12,500 m²-es gyárban történik – a jóváhagyott minta az a termék, amelyet megkap.'

process_notes:
  tagline: 'Hogyan működik'
  title: 'A specifikációktól a konténerig'
  subtitle: 'Ugyanaz a hat lépés, akár évente két konténert, akár húszat vesz: specifikáció, mérnökség, minta, vizsgálatok, szerszám, gyártás – majd FOB, CIF vagy DDP kiszállítás.'
  items:
    - title: '1. Küldje el a specifikációkat'
      description: 'Egy referencia-deszka, egy vázlat vagy egy versenytárs specifikációi elegendők. A mérnöki elemzés és az ajánlat egy munkanapon belül visszaérkezik.'
    - title: '2. Hagyja jóvá a mintát'
      description: 'Az első fizikai mintája 7–12 nap alatt kerül feladásra, egy jóváhagyási lap kíséretében, amely a szerkezetet, a nyomtatási színeket és a nyomáspróba eredményeit fedi.'
    - title: '3. Gyártás és export'
      description: 'A sorozatok 25–35 nap alatt készülnek el, folyamat közbeni minőségi ellenőrzési pontokkal. A csomagolólista, a számla és a hajójegy megelőzi a hajót.'
    - title: '4. Kiszállítás a raktárába'
      description: '4–6 hét tengeri szállítás Sydney, Melbourne vagy Brisbane kikötőjéig – DDP módban mi intézzük a vámformalitásokat és a házhoz érkezést.'

faq_section:
  tagline: GYIK
  title: 'Az ausztrál import kérdései'
  questions:
    - q: 'Mennyi ideig tart a tengeri szállítás Ausztráliába?'
      a: 'A qingdaói kikötőtől Sydney, Melbourne vagy Brisbane kikötőjéig 4–6 hetet kell számolni, a hajó választásától függően. A DDP projektek a teljes, házhoz szállítástól a házhoz szállításig terjedő határidőt tartalmazzák.'
    - q: 'Mikor rendeljek, hogy a nyár előtt készletem legyen?'
      a: 'A gyártás 25–35 napot vesz igénybe, a szállítás pedig 4–6 hetet, ezért kb. 3–4 hónappal azelőtt rendeljen, mielőtt készletre van szüksége. A december–februári nyári szezonra az év első felében adja le a megrendelést.'
    - q: 'Szállítanak-e DDP-vel Ausztráliába?'
      a: 'Igen. A DDP tartalmazza a tengeri szállítást, a vámformalitásokat, a vámokat és az adókat, valamint a raktárába történő kiszállítást – egyetlen, kiszámítható végleges ár. A FOB Qingdao és a CIF szintén elérhető.'
    - q: 'Mi a private label SUP-import MOQ-ja?'
      a: 'Az MOQ-t a projekt konfigurációja határozza meg: a minta fejlesztése 1–2 darabot, a pilóta tételek 20–50 darabot ölelnek fel meglévő platformokon, a standard tömeggyártás pedig modellenként 90–100+ darabot gyárt egy teljes, 150 m-es drop-stitch tekercsből.'
    - q: 'Milyen dokumentációt adnak az importokhoz?'
      a: 'A jóváhagyott minta a célpiacára elkészített CE- és REACH-dokumentációval együtt kerül feladásra, és minden konténert csomagolólista, számla és hajójegy kísér.'
    - q: 'Hogyan kezdhetek egy projektet Ausztráliából?'
      a: 'Küldjön egy referencia-deszkát, egy vázlatot vagy specifikációkat. A mérnöki elemzés és az ajánlat egy munkanapon belül visszaérkezik, és minden fájlcsere előtt NDA-t írunk alá.'

