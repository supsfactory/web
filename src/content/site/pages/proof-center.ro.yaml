answer:
  label: 'Răspuns direct'
  text: 'Lanțul dintre afirmație și dovadă este următorul: fiecare enunț de pe acest site este susținut de o înregistrare, o certificare, un utilaj, un document sau un proces-verbal de testare — iar fiecare dintre acestea poate fi verificat. iSupfactory este divizia de dezvoltare și producție a produselor SUP a grupului Qingdao Vatrad Group Co., Ltd. (înregistrat în Qingdao din 2012). Uzina de 12,500 m² deține sistemul de management al calității ISO 9001:2015, conformitatea ISO 25649, documentația de conformitate CE, conformitatea socială BSCI (raport de audit la cerere) și documentația materialelor REACH/RoHS pentru fiecare comandă. Fiecare cameră gonflabilă este testată la 18.0 PSI timp de 24 de ore, cu respingere automată la o scădere de peste 0.50 PSI, iar înregistrările de lot sunt păstrate 10 ani în sistemul ERP. Dosarul este publicat sau poate fi pus la dispoziție, iar fabrica este deschisă pentru audituri.'
  verified: 'Septembrie 2026'

