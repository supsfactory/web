traceability:
  tagline: 'Un Lot, Urmărit De La Rolă Până La Tablă'
  title: 'Cum Arată Trasabilitatea În Practică'
  body: |
    Fiecare lot primește un **cod de lot ERP cu valabilitate de 10 ani**. Lanțul înregistrat pentru un singur lot:

    - **Rola primară** — certificat de material, numărul rolei, lot de material testat (tracțiune, sfâșiere, cusătură)
    - **Tăierea** — comandă de tăiere CNC față de fișierul de proiectare, procent de rebut înregistrat
    - **Sudura și laminarea** — linie, operator, parametrii utilajului pentru fiecare cameră
    - **Asamblarea** — număr de serie al tablei, tipul valvei, lotul covorașului de punte
    - **Testarea** — menținere la 18.0 PSI × 24 h pentru fiecare cameră, cu respingere automată la o scădere de peste 0.50 PSI
    - **Eliberarea** — listă de verificare de 100 de puncte pentru fiecare tablă, semnătura Directorului QA pentru fiecare lot
    - **Expedierea** — Certificat de conformitate care însoțește marfa; dreptul de audit rezervat în contract

    Cereți un proces-verbal QC de probă înaintea primei comenzi — este același format pe care îl primiți împreună cu marfa.

faqs:
  tagline: 'Întrebări frecvente'
  title: 'Întrebări despre dovezi pe care le pun cumpărătorii'
  items:
    - q: 'Această pagină este doar pentru verificare și nu înlocuiește diligența obișnuită?'
      a: 'Corect — această pagină arată unde poate fi verificată fiecare afirmație: înregistrarea entității, certificările, utilajele, înregistrările și o fabrică deschisă auditurilor. Pașii dumneavoastră uzuali de verificare (verificarea înregistrării, auditul, inspecția de terță parte) rămân valizi și sunt bineveniți.'
    - q: 'Ce entitate ar trebui să apară pe documentația comenzii mele?'
      a: 'Comenzile se plasează către Qingdao Vatrad Group Co., Ltd., care operează sub numele Vatrad (divizia de producție), având iSupfactory drept linie de produse SUP. Documentele contractuale sunt semnate de Vicepreședintele Vânzărilor, Directorul Tehnic și Directorul QA.'
    - q: 'Pot obține copii ale certificatelor înainte de comandă?'
      a: 'Da — numerele certificatelor și înregistrările de audit sunt furnizate la cerere sau în timpul unui audit. Lista este publicată, niciodată „disponibilă doar la cerere”.'
    - q: 'Cum verific eu însumi înregistrările de test pe lot?'
      a: 'Fiecare cameră este testată la 18.0 PSI timp de 24 de ore, cu respingere automată la o scădere de peste 0.50 PSI; jurnalele de testare sunt legate de numerele de serie și însoțesc Certificatul de conformitate pentru fiecare lot. Inspecția pre-expediție SGS, TÜV, BV sau Intertek conform ISO 2859-1 Nivel II poate fi programată la alegerea dumneavoastră.'
    - q: 'Certificările acoperă și accesoriile?'
      a: 'Documentația materialelor REACH/RoHS se aplică tablelor și accesoriilor livrate în aceeași comandă, iar listele de verificare QC acoperă kitul complet — tablă, vâsla, pompă, centură de siguranță și geantă.'
    - q: 'Ce se întâmplă cu dovezile după comandă?'
      a: 'Trasabilitatea ERP pe lot este păstrată timp de 10 ani. Procedurile SOP ale sistemului de management al calității și standardele de inspecție rămân descărcabile, iar cumpărătorul își rezervă dreptul de audit în timpul producției, conform contractului.'

