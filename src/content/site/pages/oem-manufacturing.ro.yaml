customization:
  tagline: Construit conform specificației dumneavoastră
  title: Punctele de specificație OEM
  subtitle: 'Acestea sunt punctele de specificație pe care le controlați într-un proiect OEM — documentul dumneavoastră de specificație este contractul de producție:'
  items:
    - 'Dimensiunile plăcii — lungime, lățime, grosime, rocker și volum conform desenelor dumneavoastră sau sportivilor țintă'
    - 'Structura de materiale — număr de straturi și calitate de PVC, densitate drop-stitch, rigidizatoare și ranforsări de șină'
    - 'Grafică și culori — artwork-ul dumneavoastră aplicat cu palete cromatice nelimitate, sau cu sprijinul echipei noastre interne de proiectare'
    - 'Suprapuș de tracțiune EVA — suprapușuri de punte, logo-uri și culori de punte decupate la dimensiune, pe fiecare placă'
    - 'Mânere și inele D — poziționare, număr și specificația componentelor pentru cazul dumneavoastră de utilizare'
    - 'Sisteme de aripioare — configurații cu una, două sau trei aripioare și cutii de aripioară conform specificației'
    - 'Vâsle, pompe, lese și accesorii — pachetul dumneavoastră, branding-ul dumneavoastră'
    - 'Ambalaje și prezentare retail — cutii de retail, ambalaje de transport rezistente la apă și display-uri de punct de vânzare sub marca dumneavoastră'
    - 'Etichete și marcaje de conformitate — etichete de serie, logo-uri și documentație pentru fiecare piață, pregătite pentru regiunea dumneavoastră de export'

faq_section:
  tagline: FAQ
  title: Întrebări despre producția OEM
  questions:
    - q: Cum încep un proiect OEM cu propria mea proiectare?
      a: 'Trimiteți desenele, o placă de referință sau o specificație scrisă. Analiza noastră de inginerie confirmă realizabilitatea și returnează o ofertă în decurs de o zi lucrătoare — este angajamentul nostru standard, iar un NDA este semnat înaintea oricărui schimb de fișiere, atunci când este necesar.'
    - q: Care este MOQ-ul pentru SUP gonflabile OEM?
      a: 'MOQ este confirmat în funcție de configurația proiectului — corpul de apă și uneltele, variantele de culoare și PVC, artwork-ul, ambalajele și accesoriile. Producția de volum standard este de 90–100 de bucăți pe lot (o rolă drop-stitch de 150 m), iar loturile pilot încep de la 20–50 de bucăți pe platforme existente. Citiți logica completă de calcul în ghidul nostru MOQ și branding flexibil.'
    - q: Care este termenul tipic pentru o comandă OEM?
      a: 'Producția durează 25–35 de zile de la confirmarea comenzii și a avansului. Dezvoltarea formelor personalizate adaugă 15–20 de zile pentru unelte. Mostrele de prototip se expediază de obicei în 7–12 zile.'
    - q: Puteți fabrica doar din desenele mele existente?
      a: 'Da. OEM construiește conform specificației dumneavoastră, așa cum este — dețineți proiectarea. Inginerii noștri analizează desenele din punctul de vedere al fezabilității în producție, semnalează orice conflict înainte de a începe uneltele sau tăierea, iar mostra aprobată devine referința de producție.'
    - q: Oferiți mostre înainte de producție?
      a: 'Da. O mostră fizică este produsă și aprobată înaintea oricărui lot de producție, de regulă în 7–12 zile, și devine referința pentru toate verificările ulterioare de control al calității.'
    - q: Ce certificări deține fabrica?
      a: 'Sistem de management al calității ISO 9001:2015 (la nivelul fabricii), conformitate socială BSCI (audit de instalație amfori), documentație de conformitate CE pentru configurațiile aplicabile pieței UE (domeniul se confirmă pentru fiecare proiect), REACH (materiale) și RoHS (accesorii electronice). Documentația completă de conformitate este furnizată cu fiecare expediție OEM, pregătită pentru piețele dumneavoastră țintă.'
    - q: Cum este controlată calitatea într-un lot OEM?
      a: 'Producția se desfășoară sub un control al calității în mai multe puncte — materiale la intrare, proces și inspecție finală — cu testare la presiune de 18.0 PSI cu menținere pe 24 de ore (respingere automată la o scădere de peste 0.50 PSI), listă de verificare a asamblării în 100 de puncte și trasabilitate ERP a loturilor pe 10 ani, pentru fiecare număr de serie.'
    - q: Care sunt condițiile dumneavoastră de expediere?
      a: 'FOB Qingdao, CIF către principalele porturi globale sau DDP pentru parteneri calificați. Expediem în peste 50 de țări, pe piețele UE, SU, AU și Asia.'

process:
  title: Procesul OEM — de la specificație la containerul expediat
  subtitle: 'Șapte etape controlate, conduse de o singură echipă a fabricii, astfel încât fiecare pas, de la prima specificație până la containerul împachetat, rămâne documentat și la termen.'
  steps:
    - phase: '01'
      title: Analiza specificației și oferta
      period: 1 zi lucrătoare
      items:
        - 'Partajați desenele, specificația sau plăcile de referință — inginerii noștri verifică realizabilitatea.'
        - 'Primiți o ofertă detaliată și un plan de proiect în decurs de o zi lucrătoare.'
    - phase: '02'
      title: Confirmarea de inginerie
      period: Săptămâna 1
      items:
        - 'Dimensiunile corpului de apă, calitatea drop-stitch, specificațiile PVC și construcția șinei sunt confirmate față de documentul dumneavoastră.'
        - 'Deciziile privind forma sau platforma sunt blocate — aici încep uneltele de formare personalizate, când sunt necesare.'
    - phase: '03'
      title: Prototip și mostră
      period: 7–12 zile
      items:
        - 'Se produce o mostră fizică și se trimite pentru evaluarea dumneavoastră — cu încercări pe apă pentru formele noi.'
        - 'Mostra (1–2 bucăți) validează specificația înainte de orice angajament de volum.'
    - phase: '04'
      title: Testare și validare
      period: În paralel
      items:
        - 'Verificări de reținere a aerului, menținere a presiunii, rezistență a cusăturilor, sarcină și UV, pe fiecare linie de producție.'
        - 'Documentația CE, ISO 9001, BSCI, REACH și RoHS este pregătită pentru piețele dumneavoastră de export.'
    - phase: '05'
      title: Aprobare și confirmare
      period: După semnarea mostrei
      items:
        - 'Dumneavoastră aprobați mostra și artwork-ul; comanda și avansul blochează slotul de producție.'
        - 'Un plan preproducție confirmă datele, cantitățile, ambalajele și portul de încărcare.'
    - phase: '06'
      title: Producție
      period: 25–35 de zile
      items:
        - 'Producția se desfășoară sub un control al calității în mai multe puncte — materiale la intrare, proces și inspecție finală.'
        - 'De la comenzile pilot (20–50 de bucăți) pe platforme existente până la loturile complete dintr-o rolă de 150 m (90–100+ bucăți) pentru producția de volum standard.'
    - phase: '07'
      title: Ambalare și expediție
      period: 1 zi + transport
      items:
        - 'Ambalare de export cu etichete de serie pe model, apoi FOB Qingdao, CIF sau DDP către peste 50 de țări.'
        - 'Documentație vamală, urmărire și sprijin pentru comenzile repetate sunt incluse la fiecare etapă.'

