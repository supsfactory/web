answer:
  label: 'Răspuns direct'
  text: 'Producția OEM pornește de la specificația dumneavoastră. MOQ este confirmat în funcție de configurația proiectului, nu de o cifră fixă: producția de volum standard este de 90–100 de bucăți pe lot dintr-o rolă de țesătură drop-stitch de 150 m, loturile pilot încep de la 20–50 de bucăți pe platforme existente, iar fiecare proiect trece mai întâi prin etapa de mostră (1–2 bucăți). Mostrele se expediază în 7–12 zile; producția durează 25–35 de zile după comanda confirmată și avans, plus 15–20 de zile atunci când sunt necesare unelte noi.'
  verified: 'Septembrie 2026'

