answer:
  label: 'Krótka odpowiedź'
  text: 'Deski budujemy z morskiego PCV 1,680 DTEX z powłoką trójwarstwową i rdzeniem drop-stitch znamionowym do 12–15 PSI. Każda przychodząca partia tkaniny jest niezależnie badana u nas pod kątem wytrzymałości na rozciąganie (ISO 1421), retencji UV po 2,000 godzinach naświetlania łukiem ksenonowym (ISO 4892), ścierania i elastyczności w niskiej temperaturze — żadna partia nie trafia na produkcję wyłącznie na podstawie kart katalogowych dostawcy.'
  verified: 'Wrzesień 2026'

intro: 'Tkanina deski to najważniejszy materiał w nadmuchiwanej desce SUP. Musi wytrzymać ciągłą ekspozycję na UV, powtarzane cykle nadmuchiwania, ścieranie o pomosty i piaszczyste brzeg oraz skoki temperatury — a jednocześnie zachować integralność konstrukcyjną przez lata. W {SITE.name} nasze Laboratorium Tkanin PCV poświęcone jest wyłącznie charakteryzacji, walidacji i ciągłemu doskonaleniu tkanin, których używamy w każdej budowanej desce.'

content_html: |
  <h2>Fundament każdej nadmuchiwanej deski SUP</h2>
  <p>Nie opieramy się wyłącznie na kartach katalogowych dostawców. Każda partia PCV i tkaniny rdzenia drop-stitch, która trafia do naszego warsztatu, jest niezależnie badana u nas. Dzięki temu opublikowana przez nas specyfikacja materiałowa odpowiada rzeczywistym osiągom materiału, które otrzymujesz — partia po partii, rok po roku.</p>

  <h2>Znormalizowany sprzęt badawczy</h2>
  <p>Nasze laboratorium tkanin jest wyposażone w przyrządy przemysłowe zgodne z metodami badawczymi ISO, ASTM i EN:</p>
  <table>
    <thead><tr><th>Urządzenie</th><th>Mierzone parametry</th><th>Norma</th></tr></thead>
    <tbody>
      <tr><td>Uniwersalna maszyna wytrzymałościowa (50 kN)</td><td>Siła zrywająca, wydłużenie przy zerwaniu, propagacja pęknięcia</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Komora starzeniowa z łukiem ksenonowym</td><td>Odporność na UV (zmiana barwy, retencja wytrzymałości po 2000 h)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Tester gięcia w niskiej temperaturze</td><td>Temperatura powstawania pęknięć od -30 °C do -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Tester ścierania Taber</td><td>Utrata masy po 1000 cyklach (koło CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Grubościomierz (cyfrowy, rozdzielczość 0.001 mm)</td><td>Jednorodność wzdłuż szerokości rolki</td><td>ISO 2286-3</td></tr>
      <tr><td>Tester ciśnienia hydrostatycznego</td><td>Odporność na przenikanie wody</td><td>ISO 811</td></tr>
    </tbody>
  </table>
  <p class="text-sm text-gray-500">* Wszystkie urządzenia są kalibrowane co roku przez akredytowane laboratoria zewnętrzne.</p>

  <h2>Od danych do decyzji: typowy przebieg badania</h2>
  <p>Gdy do laboratorium trafia nowy kandydat na tkaninę, przechodzi standaryzowany siedmiostopniowy proces kwalifikacji:</p>
  <ol>
    <li><strong>Kontrola odbiorcza</strong> — wizualna ocena wad powierzchni, dziurek i zgodności wymiarowej.</li>
    <li><strong>Mapowanie grubości</strong> — pomiar w 20 punktach wzdłuż rolki; do przyjęcia wymagane jest CV &lt; 3%.</li>
    <li><strong>Badanie rozciągania</strong> — 5 próbek w kierunku osnowy i w kierunku poprzecznym. Minimum 3500 N/50 mm dla PCV 1100 dtex.</li>
    <li><strong>Kondycjonowanie UV</strong> — 1000 h naświetlania w komorze z łukiem ksenonowym; wymagana minimalna retencja wytrzymałości 80 %.</li>
    <li><strong>Pękanie na zimno</strong> — 4 h w temperaturze -35 °C, następnie zgięcie o 180° na trzpieniu 25 mm. Brak widocznych pęknięć.</li>
    <li><strong>Odporność na ścieranie</strong> — 1000 cykli, utrata masy ≤ 0.05 g.</li>
    <li><strong>Zatwierdzenie</strong> — tkanina jest dopuszczana do produkcji dopiero po przejściu wszystkich siedmiu bramek.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Typowy PCV 1100 dtex — retencja wytrzymałości na rozciąganie po ekspozycji na UV</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 h 100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 h 95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 h 88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 h 82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Konkurent ~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Nasza tkanina PCV 1100 dtex zachowuje &gt; 80 % wytrzymałości na rozciąganie po 2000 h naświetlania łukiem ksenonowym, wobec typowych klas branżowych, które spadają poniżej 70 %.</p>
  </div>

  <h2>Nasz zespół specjalistów</h2>
  <p>Laboratorium obsługują dwaj pełnoetatowi inżynierowie materiałowi, każdy z dyplomem z nauk o polimerach lub inżynierii włókienniczej i co najmniej sześcioletnim doświadczeniem w branży. Wspierają ich trzej technicy zajmujący się bieżącymi badaniami i zapisem danych. Zespół regularnie bierze udział w międzynarodowych badaniach porównawczych organizowanych przez Międzynarodową Organizację Normalizacyjną (ISO), aby potwierdzić dokładność naszych metod badawczych.</p>

  <h2>Rozwiązujemy Twoje najtrudniejsze wyzwania materiałowe</h2>
  <p>Każde środowisko wiosłowania jest inne. Deska pracująca w tropikach spotyka się z zupełnie innymi warunkami UV i temperatury niż deska na skandynawskim jeziorze czy na zbiorniku na pustyni. Nasze Laboratorium Tkanin pomaga Ci dobrać — lub opracować — specyfikację tkaniny zoptymalizowaną dla Twojego profilu pracy.</p>
  <p>Ostatnie rozwiązania na zamówienie obejmują:</p>
  <ul>
    <li>Mieszankę PCV o podwyższonej odporności na ścieranie dla floty wypożyczalni, której deski regularnie kontaktują się z piaszczystymi plażami i betonowymi rampami (+40 % żywotności przy ścieraniu).</li>
    <li>Recepturę niskotemperaturową dla kanadyjskiego programu dealerskiego z zimowym magazynowaniem, przebadaną do -50 °C bez kruchości.</li>
    <li>Pokład w kolorze pomarańczowym stabilizowanym barwnikowo dla floty szkoleniowej ratownictwa i poszukiwań, zachowujący widoczność po 3 latach ekspozycji na tropikalne słońce.</li>
  </ul>
  <p>Nie sprzedajemy tkanin „z półki” i nie mówimy, że na pewno się sprawdzą. Badamy, walidujemy i rekomendujemy — a nawet tworzymy — rozwiązanie dopasowane do Twojego profilu misji. To jest różnica, jaką daje {SITE.name}.</p>

  <h2>Jak możemy Ci pomóc</h2>
  <p>Gdy przyjdziesz do nas z wyzwaniem materiałowym, oto czego możesz oczekiwać:</p>
  <ol>
    <li><strong>Konsultacja</strong> — omawiamy Twoje środowisko pracy, cele wydajnościowe i budżet.</li>
    <li><strong>Propozycja</strong> — przygotowujemy plan badań z jednoznacznymi kryteriami pozytywnego/negatywnego wyniku oraz terminem.</li>
    <li><strong>Realizacja</strong> — nasze laboratorium wykonuje badania i przygotowuje szczegółowy raport z danymi źródłowymi i analizą porównawczą.</li>
    <li><strong>Rekomendacja</strong> — przedstawiamy specyfikację tkaniny, wraz z wariantami alternatywnymi, jeśli kilka materiałów spełnia Twoje wymagania.</li>
    <li><strong>Wsparcie po dostawie</strong> — po dostawie pozostajemy do dyspozycji w sprawach materiałowych pojawiających się podczas eksploatacji.</li>
  </ol>
  <p>Naszym celem nie jest po prostu sprzedać Ci deski. Chcemy zapewnić, że deska, którą otrzymujesz, działa niezawodnie w warunkach, w których pracujesz — a to zaczyna się od tkaniny.</p>

