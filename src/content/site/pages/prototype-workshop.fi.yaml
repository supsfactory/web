answer:
  label: 'Suora vastaus'
  text: 'Muutamme CAD-mallin ajettavaksi, testatuksi näytelautaksi 7–12 päivässä: puhallettavien prototyyppien valmistus, koepajosot vesillä, reunavahvikkeiden ja kärjen iterointi ja sitten tuotantotyökalujen sitominen. Täysin räätälöidyt muotit vievät 15–20 päivää työkalutusta vakiintuneen 25–35 päivän sarjatuotantoajan päälle.'
  verified: 'September 2026'

