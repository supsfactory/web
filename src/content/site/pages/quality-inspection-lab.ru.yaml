answer:
  label: 'Прямой ответ'
  text: 'Каждая доска проверяется до отгрузки на соответствие опубликованным спецификациям: 100% испытание на удержание давления при 18.0 PSI в течение 24 часов (автоматический брак при падении давления более 0.50 PSI), испытания на разрыв и отрыв швов по ISO 1421, а также чек-лист сборки из 100 пунктов. Лаборатория подчиняется генеральному директору, а не производству, и может остановить любую отгрузку.'
  verified: 'Сентябрь 2026'

intro: 'Каждая доска, покидающая нашу мастерскую, несет подтверждение того, что прошла определенный набор проверок качества и испытаний материалов. Наша Лаборатория качества и инспекции — это независимое подразделение в составе организации — она подчиняется напрямую генеральному директору, а не производству — что исключает влияние коммерческого давления на контрольные врата. Если партия материала или готовая доска не соответствует опубликованной спецификации, лаборатория вправе остановить отгрузку до устранения несоответствия.'

content_html: |
  <h2>Доверяйте, но проверяйте</h2>
  <p>Лаборатория работает по системе менеджмента качества, согласованной с принципами ISO 9001, а наши методы испытаний основаны на стандартах ISO, ASTM и EN везде, где это применимо. Мы ведем подробные записи каждого выполненного испытания, формируя полную цепочку прослеживаемости от приемки сырья до поставки готовой доски.</p>

  <h2>Испытательное оборудование и возможности</h2>
  <table>
    <thead><tr><th>Оборудование</th><th>Выполняемые испытания</th><th>Стандарт / метод</th></tr></thead>
    <tbody>
      <tr><td>Универсальная испытательная машина (50 кН)</td><td>Предел прочности при разрыве (ткань), сопротивление отрыву (швы), распространение надрыва</td><td>ISO 1421, ISO 4674</td></tr>
      <tr><td>Стенд испытания на герметичность (программируемый)</td><td>Ресурс на 1000 циклов надувания/сдувания, 30-минутное испытание на удержание давления</td><td>Внутренний (по методу ISO 6185)</td></tr>
      <tr><td>Оснастка для отрыва шва (моторная отрыв 180°)</td><td>Прочность на отрыв сварных и клеевых швов при 100 мм/мин</td><td>ISO 1421 / ASTM D1876</td></tr>
      <tr><td>Испытатель гидростатического давления</td><td>Сопротивление ткани проникновению воды (0–1000 мбар)</td><td>ISO 811</td></tr>
      <tr><td>Цифровой толщиномер и&amp; микрометр</td><td>Толщина ткани, толщина сварного шва, толщина клеевой пленки</td><td>ISO 2286-3</td></tr>
      <tr><td>Климатическая камера</td><td>Температурное кондиционирование (от -40 °C до +80 °C) для испытаний на холодное растрескивание и термостарение</td><td>ISO 188, ISO 4675</td></tr>
      <tr><td>Спектрофотометр для измерения цвета</td><td>Измерение цвета Delta-E после УФ-экспозиции</td><td>ISO 105-A05 / ASTM D2244</td></tr>
    </tbody>
  </table>

  <h2>Контрольные врата — от материала до поставки</h2>
  <p>Каждая доска следует утвержденному плану качества с обязательными контрольными точками. Ни одна доска не может пропустить врата; каждое звено должно быть подписано инспектором по качеству до начала следующего производственного этапа.</p>

  <div class="not-prose my-8">
    <div class="relative">
      <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-blue-200 dark:bg-blue-800"></div>
      <div class="space-y-6 relative">
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Врата 1</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Входной контроль материала</p>
            <p class="text-xs text-gray-500 mt-1">Партия ткани, ядро drop stitch, партия клея, фурнитура — все проверяется на соответствие входной спецификации до выпуска в производство.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Врата 2</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Контроль сварки в процессе</p>
            <p class="text-xs text-gray-500 mt-1">Первый сварной образец-свипел испытывается (отрыв + визуальный контроль) в начале каждой производственной смены.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Врата 3</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Испытание камеры воздухом</p>
            <p class="text-xs text-gray-500 mt-1">Доска нагнетается до 18.0 PSI (рабочее 12–15 PSI) и выдерживается 24 ч. Падение давления &gt; 0.50 PSI — автоматический брак. Данные фиксируются по каждому серийному номеру.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Врата 4</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Инспекция перед поставкой</p>
            <p class="text-xs text-gray-500 mt-1">Полная инспекция доски: все моменты затяжки, адгезия настила, совмещение графики, отсутствие косметических дефектов. Чек-лист из 100 пунктов.</p>
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold z-10">Врата 5</div>
          <div class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-950 border border-gray-200 dark:border-gray-800">
            <p class="text-sm font-semibold">Финальная сертификация</p>
            <p class="text-xs text-gray-500 mt-1">Протоколы испытаний сведены, записи инспекций проверены, выпущен Сертификат соответствия.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <h2>Стандартные проверки каждой партии</h2>
  <div class="not-prose my-8 grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">18 PSI</span>
      <span class="text-xs text-gray-500">18.0 PSI при испытании камеры воздухом, выдержка 24 ч</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">&gt; 5 %</span>
      <span class="text-xs text-gray-500">Падение давления запускает автоматический брак</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">100 %</span>
      <span class="text-xs text-gray-500">Камеры испытываются воздухом до сборки</span>
    </div>
    <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 text-center">
      <span class="block text-2xl font-bold text-blue-600">ISO 9001</span>
      <span class="text-xs text-gray-500">Система менеджмента качества</span>
    </div>
  </div>

  <h2>Наша команда качества</h2>
  <p>В лаборатории работают менеджер по качеству (10 лет в морском обеспечении качества, сертифицированный инженер по качеству ASQ), два инспектора по качеству (каждый с сертификацией NDT уровня 2 по визуальным методам) и техник по материалам, отвечающий за все физические испытания. Команда ежегодно проходит квалификационные испытания у независимого стороннего провайдера, чтобы результаты наших испытаний оставались точными и воспроизводимыми.</p>

  <h2>Независимые испытания для клиентов</h2>
  <p>Наша Лаборатория качества и&amp; инспекции доступна для оказания услуг независимых испытаний. Если вам нужно проверить спецификацию ткани, валидировать новую клеевую систему или получить сторонний протокол испытаний для квалификации поставки, мы можем выполнить испытания по применимому стандарту и выпустить заверенный протокол.</p>
  <p>Примеры недавних сторонних испытаний:</p>
  <ul>
    <li>Сравнение прочности на отрыв пяти конкурентных продуктов в виде клеевой пленки для европейской программы закупок.</li>
    <li>Исследование ускоренного старения (УФ + термоциклирование) для новой оранжевой пигментированной рецептуры PVC с регулярными промежуточными измерениями с интервалом 500 ч.</li>
    <li>Валидация герметичности 50 прототипных клапанных сборок для нового высоконапорного дизайна доски.</li>
  </ul>

  <h2>Наше обязательство перед вами</h2>
  <p>Получая доску {SITE.name}, вы также получаете ее досье качества — сведенный документ с результатами испытаний, применимыми к вашей конкретной доске. Сертификат партии ткани, испытания швов на отрыв, журналы испытания камер воздухом и чек-лист предотгрузочной инспекции. Каждое число прослеживается. Каждый инспектор поименно указан. Это не просто бумажная работа — это наше обещание, что поставленное соответствует заявленному.</p>
  <p>Если у вас когда-либо возникнет вопрос о качестве, вы можете связаться с лабораторией напрямую — контактные данные напечатаны на вашем сертификате соответствия. Мы относимся к каждому обращению серьезно и обязуемся провести официальное расследование в течение 48 часов.</p>

  <h2>Что произойдет, если доска не пройдет инспекцию?</h2>
  <p>Забракованная доска никогда не исчезает тихо. Лаборатория следует фиксированному процессу работы с несоответствиями, чтобы проблема была локализована, устранена и не повторилась:</p>
  <ul>
    <li><strong>Изоляция</strong> — доска помечается, снимается с линии и вносится в реестр несоответствий с указанием имени инспектора и невыполненных критериев.</li>
    <li><strong>Переделка или списание</strong> — исправимые дефекты (например, клапан, сварной шов борта или угол настила) переделываются сертифицированным оператором, а восстановленный участок повторно испытывается по тому же стандарту. Доски, не отвечающие спецификации, списываются, а не понижаются в классе.</li>
    <li><strong>Повторная инспекция</strong> — каждая переделанная доска заново проходит все затронутые врата, прежде чем вернуться на линию упаковки.</li>
    <li><strong>Выпуск</strong> — только доски с подписанными всеми вратами покидают завод. Уровень брака, первопричина и корректирующее действие обобщаются в вашем отчете о качестве партии.</li>
  </ul>

  <h2>Документация по качеству, которую вы получаете</h2>
  <p>Каждая партия отгружается с пакетом документов, по которому ваша служба контроля качества может провести аудит: сертификат партии (номера партий ткани, клея, фурнитуры), записи испытаний швов на отрыв, журналы испытания камер воздухом по каждому серийному номеру, подписанный чек-лист предотгрузочной проверки из 100 пунктов, упаковочный лист и фотографический отчет о ваших досках до погрузки.</p>

