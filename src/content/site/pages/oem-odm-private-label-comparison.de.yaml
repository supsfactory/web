ip_rules:
  tagline: 'Schutz des geistigen Eigentums'
  title: 'So schützen wir Ihre Designs und Ihre Marke'
  subtitle: 'Unabhängig vom Kooperationsmodell bleiben Ihr Artwork, Ihre Formen und Ihre Spezifikationsdateien Ihr Eigentum.'
  body: |
    **NDA vor Dateiaustausch.** Wir unterzeichnen eine Geheimhaltungsvereinbarung vor jedem technischen Dateiaustausch — Standardreaktionszeit innerhalb von 4 Geschäftsstunden.

    **Keine Design-Weiterverwendung.** Ihr Artwork, Ihre Formen und Ihre Spezifikationsdateien werden nie an andere Kunden weitergegeben oder verkauft. OEM-Formen gehören exklusiv Ihnen. ODM-Designs werden von Ihnen vor der Produktion freigegeben. Private-Label-Plattformen sind gemeinsame Strukturen, aber Ihre Grafik und Ihr Branding sind exklusiv.

    **Nur B2B.** Wir fertigen ausschließlich unter den Marken unserer Kunden. Wir verkaufen nicht an Endverbraucher und treten in keinem Markt in Konkurrenz zu unseren Kunden.

    **Formeneigentum.** Vom Käufer bezahlte eigene Formen gehören dem Käufer. Wir lagern und pflegen sie, dürfen sie aber ohne schriftliche Genehmigung nicht für andere Kunden verwenden.

faqs:
  tagline: 'FAQ'
  title: 'Häufige Fragen zu OEM, ODM und Private Label'
  items:
    - q: 'Kann ich später von Private Label auf OEM umsteigen?'
      a: 'Ja. Viele Kunden starten mit einer Private-Label- oder Pilotcharge, um den Markt zu validieren, und investieren dann in eigene Werkzeuge für ein vollständiges OEM-Programm, sobald die Nachfrage bewiesen ist. Dieselbe Fabrik und dasselbe QC-System unterstützen beide Wege.'
    - q: 'Bedeutet ODM, dass die Fabrik meine Marke besitzt?'
      a: 'Nein. Bei ODM besitzen Sie Ihre Marke, Ihre Grafik und Ihre Verpackung. Die Fabrik entwickelt die Board-Struktur aus Ihrem Briefing, und Sie geben das Design vor der Produktion frei. Die Fabrik behält IP des Entwicklungsprozesses, aber die freigegebene Produktspezifikation gehört Ihnen.'
    - q: 'Ist Private Label von geringerer Qualität als OEM?'
      a: 'Nein. Alle drei Wege laufen durch dieselbe Fabrik, dasselbe QC-System und dasselbe Exportteam. Private-Label-Boards werden auf erprobten, validierten Plattformen gebaut, mit vollem 18-PSI-/24-Stunden-Drucktest und derselben 100-Punkte-Montagecheckliste.'
    - q: 'Was, wenn ich nicht sicher bin, welches Modell ich wählen soll?'
      a: 'Kontaktieren Sie uns mit Ihrer Situation — unser Technikteam empfiehlt den praktischsten Weg basierend auf Ihren Produktanforderungen, Ihrem Zeitplan und Ihren Mengenzielen. Vor der Spezifikationsprüfung besteht keine Verpflichtung.'
    - q: 'Kann ich vor einer Modellentscheidung Muster erhalten?'
      a: 'Ja. 1–2 Prototyp-Muster gehen in 7–12 Tagen raus. Die Musterkosten werden auf Ihren Massenauftrag angerechnet. So können Sie Konstruktion und Qualität vor jeder Mengenzusage bewerten.'

