    - title: Spedizione pezzi
      amount: '48h'

fleet_guide:
  title: Guida alle dimensioni della flotta
  subtitle: 'Stima quante tavole servono al tuo operatore in base alla rotazione giornaliera di noleggio.'
  tiers:
    - label: Piccolo chiosco
      boards: '15-20'
      note: 'Fino a 2–3 rotazioni di tavole al giorno in alta stagione'
    - label: Operatore di medie dimensioni
      boards: '30-50'
      note: 'Più punti di partenza o alta affluenza nel fine settimana'
    - label: Grande noleggio da spiaggia
      boards: '50-100'
      note: 'Flotte di noleggio full-service su più stazioni balneari'

content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Approfondisci:</strong> le tavole da noleggio partono dalla tua specifica — scopri il nostro <a href="/it/oem-manufacturing">programma OEM/ODM</a> per personalizzazione, MOQ di test basse e prezzi flotta. Ogni tavola passa attraverso i 12,500 m&sup2; della <a href="/it/factory">linea di produzione</a> e prima della spedizione viene sottoposta al 100 % a un test di pressione.</p>
  </div>

