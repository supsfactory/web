meta:
  title: 'Attrezzature per il noleggio SUP & soluzioni per flotte'
  description: 'Tavole SUP commerciali per il noleggio quotidiano: PVC resistente ai raggi UV, cuciture rinforzate e materiali ad asciugatura rapida per flotte a rotazione ad alta frequenza.'
  dateModified: '2026-08'

hero:
  tagline: Operatori di noleggio
  title: 'Tavole SUP progettate per flotte di noleggio'
  subtitle: 'Specifica una flotta che regga il noleggio quotidiano: tavole a rotazione ad alta frequenza con PVC resistente ai raggi UV, cuciture rinforzate e materiali ad asciugatura rapida — progettate per 365 giorni di utilizzo all''anno.'
  image:
    src: https://assets.supsfactory.com/images/sups/use-cases/supsfactory-family-use-case.webp
    alt: Tavole SUP pronte per il noleggio quotidiano

answer:
  label: 'Risposta breve'
  text: 'Le tavole per flotte di noleggio sono costruite con PVC marino resistente ai raggi UV, con cuciture 3× più resistenti rispetto alle costruzioni standard e nuclei drop-stitch per 15 PSI — testate per oltre 500 cicli di noleggio. La MOQ viene confermata dalla configurazione del progetto: campioni (1–2 unità), pilota (20–50 unità) e volume standard (90–100+ unità per lotto da un rotolo da 150 m); la produzione richiede 25–35 giorni dopo PO e acconto, con condizioni FOB, CIF o DDP.'
  verified: 'Settembre 2026'

features:
  title: Costruite per il quotidiano del noleggio
  subtitle: 'Ogni tavola è progettata per oltre 500 cicli di noleggio con manutenzione minima.'
  items:
    - title: 'Oltre 500 cicli di noleggio'
      description: 'Testate per resistere all''uso quotidiano in acqua salata, sole e sabbia.'
      icon: 'tabler:shield-check'
    - title: 'Tessuto resistente ai raggi UV'
      description: 'Nessuno scolorimento o deterioramento dopo 1 anno di stoccaggio all''aperto.'
      icon: 'tabler:sun'
    - title: 'Cuciture rinforzate'
      description: 'Costruzione di cucitura rinforzata per la rotazione di noleggio quotidiana e i cicli di gonfiaggio ripetuti.'
      icon: 'tabler:layers-intersect'
    - title: 'Materiali ad asciugatura rapida'
      description: 'I materiali ad asciugatura rapida mantengono le tavole pronte all''uso tra un impiego e l''altro.'
      icon: 'tabler:droplet'
    - title: 'Stoccaggio impilabile'
      description: 'Design impilabile che fa risparmiare spazio — più tavole nella stessa area di stoccaggio.'
      icon: 'tabler:stack'
    - title: 'Misure con codice colore'
      description: 'Il personale prende subito la tavola giusta grazie alle misure con codice colore.'
      icon: 'tabler:color-swatch'

stats:
  title: Indicatori operativi
  stats:
    - title: Superficie dello stabilimento
      amount: '12,500 m²'
    - title: Test di pressione
      amount: '18 PSI / 24h'
    - title: Checklist di montaggio
