  description: 'Guia de conformidade para pranchas SUP insufláveis por mercado: CE (UE), CPSIA (EUA), AS/NZS (AU), ISO 9001, BSCI, REACH e RoHS — âmbito e documentos para cada mercado.'
  dateModified: '2026-08-21'
