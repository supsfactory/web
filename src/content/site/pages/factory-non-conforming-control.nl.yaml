nc_severity:
  tagline: Ernst van het defect & autoriteit
  title: Classificatie van de ernst & afhandelingsautoriteit
  subtitle: Niet elke non-conformiteit wordt op hetzelfde niveau afgehandeld — de afhandelingsautoriteit schaalt met de ernst van het defect, van vrijgave op lijnniveau tot de Material Review Board met instemming van de klant.
  headers:
    severity: Ernst
    examples: Typische voorbeelden
    authority: Afhandelings- & controleautoriteit
    control: Vrijgavevoorwaarde
  rows:
    - severity: 'Licht'
      examples: 'Afgesneden hoek van de doos, lichte uitlijning van een niet-kritiek accessoire'
      authority: 'Vrijgave ter plaatse door het sectie-QC-hoofd + lijnsupervisor, met vervanging of vrijgave'
      control: 'Geregistreerd in de NCR; geen impact op de productfunctie of de vereisten van de klant'
    - severity: 'Ernstig'
      examples: 'Langzaam lek van het ventiel, EVA-uitlijning buiten tolerantie (>2 mm), ontbrekend accessoire'
      authority: 'De QC Manager + technisch ingenieur geven een gecontroleerde herbewerkingsinstructie (SRI) uit'
      control: 'Onafhankelijke 100% hertest van de oorspronkelijk niet geslaagde defecten en de beïnvloede kenmerken vóór de vrijgave'
    - severity: 'Kritiek'
      examples: 'Schade aan de drop-stitch kamer, railbel of hogedruk-scheur, foutief gedrukt klantlogo of kleurafwijking'
      authority: 'Besluit van de Material Review Board (MRB); schriftelijke instemming van de klant waar vereist'
      control: 'Geen vrijgave zonder geautoriseerde instemming; anders verplichte begeleide fysieke vernietiging'

nc_matrix:
  tagline: Matrix van de engineeringprotocollen
  title: Beslissingsmatrix voor SUP-defecten & herverificatie
  subtitle: Standaard engineeringprotocollen die worden toegepast op de meest voorkomende productieafwijkingen — dezelfde gekwantificeerde parameters die klanten tijdens audits kunnen verifiëren.
  headers:
    defect: Defectcategorie
    protocol: Gecontroleerd afhandelingsprotocol
    validation: Onafhankelijke herverificatie & validatie
  rows:
    - defect: 'Langzaam lek van het ventiel'
      protocol: 'De plank isoleren. De ventielkern met gekalibreerd momentsgereedschap (25 N·m) demonteren, de binnendraad reinigen, de siliconen O-ring vervangen en opnieuw vastzetten.'
      validation: 'Onderdompelen in zeepoplossing; op 18 PSI oppompen en een volledige hertest van 24u-drukverlies uitvoeren (ΔP ≤ 0.05 PSI).'
    - defect: 'Luchtbellen in de railnaad'
      protocol: 'De ploegpartij blokkeren. Het belgebied met een warmteondersteunde nozzle delamineren, het oppervlak met oplosmiddel reinigen, tweecomponenten PU-lijm onder een druk van 5 bar aanbrengen.'
      validation: '100% visuele en tactiele controle van de naad; structurele verificatie-drukproef (18.0 PSI) naast het 24u-luchtdichtheidsbehoud.'
    - defect: 'Uitlijning van de EVA-pad'
      protocol: 'Warmteondersteunde verwijdering met een gereedschap op geregelde temperatuur (80°C). Nieuwe uitlijning met een precisie-acryl positioneringsmal.'
      validation: 'Verificatie van de speling-tolerantie bij de fabricage (≤ ±1.5 mm), verificatie van de symmetrie van het ruitpatroon, 100% hechtingstest van de randen.'
    - defect: 'Fout in branding/logo'
      protocol: 'Onmiddellijke stop van de printlijn. Alle bedrukte panelen blokkeren. De vectorrevisie met de klant verifiëren; nul niet-geautoriseerde wijzigingen.'
      validation: 'Kleurverificatie met een spectrofotometer (ΔE ≤ 1.5); 100% visuele inspectie van de tekstuitlijning tegen het door de klant ondertekende master vector-PDF.'
    - defect: 'Verpakkingsafwijking / ontbrekende SKU'
      protocol: 'De exportpallet blokkeren. Openen en een 100% positiecontrole volgens de BOM uitvoeren (pomp, vin, leash, peddel, reparatiestaaf).'
      validation: 'Validatie met geïntegreerde elektronische dynamische controleschalen (±30 g variatie); verificatie met optische scanners van 2D-streepjescodes.'

nc_scrap:
  tagline: Nul uitstroom naar de markt
  title: Afkeuren & begeleide vernietiging — anti-diversieprotocol met nuldefecten
  body: |
    Buitenlandse merkpartners hebben de zekerheid nodig dat defecte planken nooit in secundaire retailkanalen, grijze markten of e-commerce belanden. Planken die niet tot conformiteit kunnen worden gebracht, worden vernietigd onder een begeleid en geregistreerd protocol:

    **1. Doorsnijden van onderdelen & accessoires.** Onder toezicht van de QA Director verwijdert een hydraulische schaar alle roestvrijstalen 316 D-ringen, transporthendel-bandjes en bagagesluitingen. De oppompventielgroep en de fin box-basis (US-box / klikvin) worden tot aan de plankenwortel verwijderd, waardoor alle herbruikbare componenten worden geëlimineerd.

    **2. Inkerven van de drop-stitch & doorsnijden van de rail.** De interne drop-stitch kern wordt met diepe kruisdoorsneden door plank en deck gesneden (≥ 50 cm per snede), en de versterkte zijkanten van de rail worden in ten minste 4 segmenten doorgesneden — waardoor afdichtings- en drijfvermogen permanent worden vernietigd.

    **3. Video- & fotovault.** De vernietiging wordt geregistreerd als een ononderbroken 1080p-video met close-ups van de seriële streepjescode, de snede, de inkerving van de kern en de gewogen eindafvalhoop. De video wordt gehasht (SHA-256) en minimaal 5 jaar op een gecontroleerde server opgeslagen.

    **4. Gecertificeerde afvalverwerking.** Alle PVC- en drop-stitch fragmenten worden gewogen, in het uitgangsregister geregistreerd en uitsluitend door gekwalificeerde polymeerrecycling-partners vervoerd — geen residumateriaal verlaat de locatie via andere kanalen.

    > **Merkenbeschermingsgarantie:** QINGDAO VATRAD GROUP CO., LTD. garandeert de 100%-vernietiging van niet-herwerkbare en buiten-specificatie boten. Geen enkele tweede keus of gecompromitteerde plank zal ooit in secundaire retailkanalen, grijze markten of e-commerce belanden. Het afkeur- & vernietigingscertificaat (VAT-QA-SCRAP-CERT-2026) documenteert het product, de partij, de MRB-conclusie, getuigenfoto''s en de dubbele ondertekening van QA Director en fabrieksmanager.

