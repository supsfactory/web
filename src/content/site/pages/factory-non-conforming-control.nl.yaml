answer:
  label: 'Helder antwoord'
  text: 'Niet-conforme producten worden bij QINGDAO VATRAD GROUP.,LTD. nooit verborgen, informeel herbewerkt of zonder verificatie vrijgegeven. Elke geïdentificeerde non-conformiteit wordt geregistreerd tegen het betrokken product, de partij of het component en gekoppeld aan een NCR. Het artikel wordt gemarkeerd (HOLD / QUARANTINE / REJECTED), fysiek gescheiden en de betrokken scope wordt beoordeeld per partij, materiaallot, procesfase en documentrevisie. De beslissing wordt genomen op het autoriteitsniveau dat overeenkomt met de ernst van het defect: lichte problemen worden op lijniveau ondertekend, ernstige problemen vereisen een beslissing van de QC Manager + technisch ingenieur met een gecontroleerde herbewerkingsinstructie en een onafhankelijke herverificatie van 100%, en kritieke problemen vereisen een besluit van de Material Review Board met schriftelijke instemming van de klant waar vereist — anders verplichte begeleide vernietiging. Herwerkte artikelen worden opnieuw geverifieerd tegen de oorspronkelijke acceptatiecriteria, luchtdichtsreparaties krijgen een volledige nieuwe drukproefcyclus en de vrijgave voor verzending vindt alleen plaats na geautoriseerde kwalificatie. Terugkerende of systemische problemen activeren oorzaakanalyse en corrigerende maatregelen (CAPA).'
  verified: 'September 2026'

