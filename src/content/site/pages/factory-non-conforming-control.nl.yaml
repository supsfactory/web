nc_intro:
  tagline: Controle van niet-conforme producten
  title: Wat er gebeurt wanneer een product niet aan de criteria voldoet
  body: |
    Producten of componenten die niet aan de gedefinieerde acceptatiecriteria voldoen, worden geïdentificeerd en gecontroleerd om onbedoeld gebruik, verdere bewerking of verzending te voorkomen. De toepasselijke acceptatiecriteria zijn gebaseerd op het goedgekeurde monster, de technische specificatie, de graphics, de stuklijst, de verpakkingsvereisten en het projectinspectieplan.

    Niet-conforme artikelen worden beoordeeld om de betrokken scope en de juiste afhandeling te bepalen. Afhankelijk van het probleem kan het artikel worden vastgehouden, onder gecontroleerde instructies herbewerkt, vervangen, afgekeurd of via een goedgekeurd proces worden beheerd. Herwerkte of gecorrigeerde artikelen worden vóór de vrijgave opnieuw geïnspecteerd. De vrijgave voor verzending is alleen toegestaan na voltooiing van de relevante kwaliteitsregistraties en de conformiteit van het product met de toepasselijke acceptatiecriteria.

nc_flow:
  tagline: Standaard gesloten cyclus in 7 fases
  title: Van identificatie tot corrigerende maatregel
  subtitle: 'Een gecontroleerde cyclus voor elke non-conformiteit: identificeren, blokkeren, verifiëren, herbewerken of vervangen, hercontroleren, vrijgeven of afkeuren, verbeteren.'
  steps:
    - step: '01'
      title: Identificeren
      desc: 'Elke geïdentificeerde non-conformiteit wordt geregistreerd tegen het betrokken product, de partij of het component en beoordeeld tegen de toepasselijke projectvereisten. De detectie kan plaatsvinden bij de ingang van goederen, de procescontrole, de eindinspectie, de verpakking of de inspectie door de klant/derden.'
    - step: '02'
      title: Blokkeren
      desc: 'De artikelen worden duidelijk geïdentificeerd en onder een gecontroleerde blok- of quarantainestatus geplaatst om onbedoeld gebruik, verdere bewerking of verzending te voorkomen. De HOLD / QUARANTINE / REJECTED-etiketten dragen het NCR-nummer, de SKU, de partij, de hoeveelheid, de defectbeschrijving en de datum.'
    - step: '03'
      title: Verifiëren
      desc: 'De betrokken scope en de juiste afhandeling worden beoordeeld: een enkele eenheid, een ploegpartij, een volledige partij of meerdere partijen — via gemeenschappelijke materiaalloten, graphics-revisies, procesfases en documentrevisies. Indien nodig worden verdere insluiting of versterkte inspectie toegepast.'
    - step: '04'
      title: Herbewerken of vervangen
      desc: 'Toegestane herbewerking volgt goedgekeurde instructies die het betrokken artikel, de methode, de materialen, de inspectiepunten en de herverificatievereisten identificeren. Niet-geautoriseerde wijzigingen aan de productspecificatie, graphics, accessoireconfiguratie of verpakking zijn nooit toegestaan. Vervangende artikelen vallen onder de toepasselijke inspectiepoorten.'
    - step: '05'
      title: Hercontroleren
      desc: 'Herwerkte of gecorrigeerde artikelen worden opnieuw geïnspecteerd tegen de toepasselijke acceptatiecriteria. Het oorspronkelijk niet geslaagde defect en alle bijbehorende kenmerken die mogelijk door de herbewerking zijn beïnvloed, worden vóór de vrijgave geverifieerd — door onafhankelijke QC en, voor luchtdichtsreparaties, met een volledige 24u-drukhertestcyclus.'
    - step: '06'
      title: Vrijgeven of afkeuren
      desc: 'Het product wordt pas vrijgegeven na voltooiing van de vereiste herverificatie, wanneer geautoriseerd kwaliteitspersoneel de conformiteit met de toepasselijke projectvereisten bevestigt. Artikelen die niet tot conformiteit kunnen worden gebracht, worden afgekeurd, vervangen, teruggestuurd of onder gecontroleerde procedures afgehandeld — inclusief begeleide fysieke vernietiging.'
    - step: '07'
      title: Corrigerende maatregel
      desc: 'Terugkerende, significante of systemische non-conformiteiten worden op oorzaak en corrigerende maatregel (CAPA) onderzocht. Verbeteringen kunnen updates van werkinstructies, materiaalcontroles, inspectiepunten, training, leveranciersbeheer of documentbeheer omvatten.'

nc_pillars:
