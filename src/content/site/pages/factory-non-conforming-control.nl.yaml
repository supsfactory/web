faqs:
  tagline: FAQ
  title: FAQ over kwaliteit & defectbeheer voor wereldwijde kopers
  items:
    - q: 'Hoe garanderen jullie dat herwerkte planken aan de volledige veiligheidsnormen voldoen?'
      a: 'Elke herwerkte plank wordt behandeld als een nieuwe eenheid en moet dezelfde volledige testcyclus vanaf nul doorlopen — voor luchtdichtsreparaties een volledige 24u-drukproef. Het zijn de onafhankelijke QC-inspecteurs, niet de herbewerkingsoperators, die de vrijgavevalidatie uitvoeren.'
    - q: 'Zal de fabriek planken met lichte esthetische afwijkingen verzenden zonder ons te informeren?'
      a: 'Nooit. Elke afwijking die van invloed is op door de klant goedgekeurde golden samples, logographics, kleurvarianten of verpakking vereist een formele schriftelijke concessie-overeenkomst, ondertekend door de klant, vóór de vrijgave voor verzending.'
    - q: 'Wat gebeurt er als een herwerkte plank de herverificatie niet doorstaat?'
      a: 'De plank wordt niet vrijgegeven. Hij keert terug naar een nieuwe afhandelingsbeoordeling en wordt, als hij niet tot conformiteit kan worden gebracht, vervangen, afgekeurd of onder het begeleide afkeurprotocol vernietigd. Het herhaaldelijk niet slagen van dezelfde defectklasse activeert een CAPA voor oorzaakanalyse.'
    - q: 'Kunnen defecte planken als tweede keus of via andere kanalen worden verkocht?'
      a: 'Nee. Niet-herwerkbare en buiten-specificatie planken worden fysiek vernietigd onder het begeleide afkeurprotocol — onderdelen doorgesneden, kern en rail doorgesneden, video geregistreerd, gehasht met SHA-256 en minimaal 5 jaar opgeslagen. Het afkeur- & vernietigingscertificaat wordt ondertekend door de QA Director en de fabrieksmanager.'
    - q: 'Hoe wordt de betrokken scope beoordeeld wanneer een defect wordt gevonden?'
      a: 'De scope wordt onderzocht op productidentificatie, productiepartij, materiaal- of componentlot, procesfase en toepasselijke documentrevisie. Is hetzelfde materiaallot, dezelfde graphics-revisie of hetzelfde werkstation betrokken, dan worden de betreffende producten meegenomen en dienovereenkomstig geïnspecteerd.'
    - q: 'Is jullie toestemming nodig vóórdat een concessie wordt verleend?'
      a: 'Ja. Elke gedocumenteerde concessie-acceptatie die van invloed is op de vereisten van de klant — goedgekeurde monsters, specificatie, graphics, verpakking of acceptatiecriteria — vereist de schriftelijke vrijgave van de klant vóór de vrijgave. Zonder die vrijgave wordt het product herbewerkt, vervangen of afgekeurd volgens de oorspronkelijke eis.'
    - q: 'Welke documentatie ontvangen jullie voor een non-conformiteit?'
      a: 'Het NCR-dossier omvat het NCR-nummer, de detectiefase, het product/de SKU, de partij, de toepasselijke documentrevisies, de defectbeschrijving, de insluiting, de afhandeling, de referentie van de herbewerkingsinstructie, het resultaat van de herverificatie en de definitieve vrijgave of sluiting — beschikbaar volgens uw projectkwaliteitsafspraak.'

