  title: 'Как выбрать толщину SUP — инженерный анализ'
  subtitle: '6 мин чтения'

answer:
  label: 'Прямой ответ'
  text: 'Толщина — это компромисс между жесткостью и устойчивостью: 4" (10 см) — самая жесткая, легкая и быстрая — лучший выбор для туринга и гонок; 5" (12,7 см) — универсальный выбор для большинства гребцов; 6" (15,2 см) — максимизирует первичную устойчивость для йоги и более тяжелых гребцов (100+ кг). Более тонкое сечение конструктивно жестче, поэтому доска 4" при 15 PSI прогибается меньше, чем доска 6" при 25 PSI.'
  verified: 'Сентябрь 2026'

content_html: |
  <h2>Три стандартные толщины</h2>

  <h3>4" (10 см) – Туринг и&amp; характеристики</h3>
  <ul>
    <li>Максимальная жесткость – меньший прогиб под нагрузкой</li>
    <li>Минимальный вес – меньше материала, меньший объем воздуха</li>
    <li>Отличная курсовая устойчивость – меньшая боковая качка</li>
    <li>Наивысшая скорость – меньшее сопротивление, более легкое скольжение</li>
    <li>Лучший выбор для: туринга, гонок, фитнес-гребли, опытных гребцов</li>
  </ul>

  <h3>5" (12,7 см) – Универсальная</h3>
  <ul>
    <li>Хорошая жесткость – сбалансированное соотношение прогиба и жесткости</li>
    <li>Умеренный вес – стандартный расход материала</li>
    <li>Хорошая первичная и вторичная устойчивость</li>
    <li>Лучший выбор для: отдыха, начинающих гребцов, спокойных озер и рек</li>
  </ul>

  <h3>6" (15,2 см) – Устойчивость и&amp; йога</h3>
  <ul>
    <li>Максимальная первичная устойчивость – огромная плавучесть</li>
    <li>Наибольший вес – больше материала ПВХ, больший объем воздуха</li>
    <li>Наименьшая скорость – больше сопротивление, сложнее удерживать скольжение</li>
    <li>Лучший выбор для: йоги/фитнеса, тяжелых гребцов (100+ кг), очень неспокойной воды</li>
  </ul>

  <h2>Инженерный анализ</h2>
  <p>Жесткость надувного SUP определяется внутренним давлением воздуха и моментом инерции поперечного сечения доски. При 20 PSI доска 4" показывает примерно на 30% меньший прогиб под нагрузкой, чем доска 6" той же ширины и длины. Первичная устойчивость определяется шириной по ватерлинии и плавучестью; вторичная устойчивость зависит от формы бортов и ширины доски.</p>

  <h2>Толщина в зависимости от веса гребца</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Вес гребца</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Рекомендуемая толщина</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Менее 65 кг (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 кг (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 кг (198 – 253 lbs)</td><td class="p-3 border">5" или 6"</td></tr>
      <tr><td class="p-3 border">Более 115 кг (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Компромисс между толщиной и PSI</h2>
  <p>Распространенное заблуждение — считать, что более высокое давление компенсирует избыточную толщину. При 25 PSI доска 6" прогибается сильнее, чем доска 4" при 15 PSI, потому что геометрический момент инерции доминирует в уравнении жесткости. Для гребцов, ориентированных на характеристики, более тонкая доска при меньшем давлении превосходит более толстую доску при большем давлении.</p>

  <h2>Линейка Vatrad</h2>
  <ul>
    <li><strong>Доски 4":</strong> серия Cheetah Touring – туристические SUP 12' x 30" x 4" для фитнеса и гребли на длинные расстояния</li>
    <li><strong>Доски 5":</strong> серия Cheetah All-Round – 10'6" x 32" x 5" для отдыха</li>
    <li><strong>Доски 6":</strong> серия Cheetah Ultra-Stable – 10' x 34" x 6" для йоги, крупных гребцов и фотоплатформ</li>
  </ul>
  <p>Все доски используют ядра drop stitch 1,680 DTEX с номинальным давлением 15 PSI и ламинаты из ПВХ толщиной 1,2 мм.</p>
  <p>Толщина, PSI и спецификация ткани настраиваются для индивидуальных линеек — посмотрите, как мы <a href="/ru/oem-manufacturing">проектируем доски для OEM- и private-label-брендов</a>, и пройдитесь по конструкции доски на <a href="/ru/factory">производственной площадке завода</a>.</p>

