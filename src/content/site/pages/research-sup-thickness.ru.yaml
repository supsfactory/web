  title: 'Как выбрать толщину SUP — инженерный анализ'
  description: 'Чем отличаются надувные доски SUP толщиной 4", 5" и 6" по жесткости, весу, устойчивости и курсовой устойчивости, с рекомендациями по толщине.'
