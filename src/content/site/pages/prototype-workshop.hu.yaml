answer:
  label: 'Közvetlen válasz'
  text: 'Egy CAD modellt 7–12 nap alatt használható és vizsgált próbadeszkává alakítjuk: felfújható elemekkel végzett prototípizálás, medencés vízpróbák, a szín és az orr iterációi, majd a gyártóeszközök elkészítése. A teljesen testreszabott formák további 15–20 napnyi eszközfejlesztést igényelnek a tömeggyártás 25–35 napos standard határidején felül.'
  verified: '2026. szeptember'

