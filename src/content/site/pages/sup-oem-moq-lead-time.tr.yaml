answer:
  label: 'Doğrudan cevap'
  text: 'MOQ ve teslim süresi projeye özeldir, ancak çerçeve sabittir. Her özel SUP projesi aynı kademeli aşamalardan geçer: numune geliştirme (1–2 board, 7–12 günde hazır), deneme ve pilot siparişleri (20–50 board) ve standart hacimli partiler (150 m drop stitch kumaş rulosu başına 90–100+ board). Üretim teslim süresi, kesinleşen sipariş ve depozitodan itibaren 25–35 gündür; projeniz özel bir gövde gerektiriyorsa, üretim başlamadan önce kalıp geliştirmeye 15–20 gün eklenir. Dolayısıyla tipik bir ilk proje şöyle görünür: numuneler yaklaşık 1–2 haftada, pilot boardlar 4–6 haftada ve ilk tam parti sipariş onayından yaklaşık 6–8 hafta sonra sevk edilir.'
  verified: 'Eylül 2026'

moq_lead_table:
  tagline: Çerçeve
  title: 'Özel SUP MOQ ve Teslim Süresi Kademelerine Genel Bakış'
  subtitle: 'Her aşama bir sonrakini doğrular. Çizimden doğrudan konteynere asla geçmezsiniz — daha fazla boarda taahhüt etmeden önce her kademede gövdeyi, grafikleri ve ambalajı doğrularsınız.'
  headers:
    stage: Sipariş Aşaması
    quantity: Tipik Miktar
    lead_time: Teslim Süresi
    best_for: En Uygun Kullanım
  rows:
    - stage: 'Numune geliştirme'
      quantity: '1–2 board'
      lead_time: '7–12 gün'
      best_for: 'Gövde rijitliğini, EVA kaymaz ped dokusunu, grafik isabetini ve aksesuar uyumunu doğrulama. Numune ücretleri geçerlidir ve sözleşme onayıyla üretim siparişinizden mahsup edilir.'
    - stage: 'Deneme / pilot sipariş'
      quantity: '20–50 board'
      lead_time: '25–35 gün'
      best_for: 'Sezon öncesi ticari test, pazar doğrulaması ve mevcut gövde platformları, stok malzemeleri ile sadeleştirilmiş ambalaj kullanılarak ilk satış denemesi.'
    - stage: 'Standart hacimli parti'
      quantity: '150 m rulo başına 90–100+ board'
      lead_time: '25–35 gün'
      best_for: 'Tam 150 m kumaş rulolarıyla eksiksiz üretim verimliliği — kumaş birleştirme sıfır, düzgün lif gerilimi ve amorti edilmiş hat kurulumu. Özel kalıp formları bu kademede çalışır.'
    - stage: 'Büyük ölçekli program'
      quantity: '300+ board'
      lead_time: 'Parti başına 25–35 gün, kademeli sevkiyat'
      best_for: 'Konteyner ölçekli programlar ve sezonluk filolar; deponuzun ve nakit akışınızın yönetilebilir kalması için birden fazla üretim partisine yayılarak planlanır.'

moq_drivers:
  tagline: 'MOQ Değerini Ne Belirler'
  title: 'Asgari Miktarınızı Belirleyen Altı Faktör'
  subtitle: 'MOQ, bir satış ekibinin keyfi seçtiği rastgele bir sayı değildir. Ürün mimarisinin tamamından hesaplanır — bu bileşenler teklif öncesinde birlikte değerlendirilir.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: H
      icon_bg: blue
      title: 'Gövde Formu ve Kalıplar'
      desc: 'Fabrikada mevcut rocker kalıpları, pilot siparişlerin 20 boarddan başlamasına izin verir. Özel bir gövde, özel CAD kesim kalıpları ve EVA sıcak pres kalıpları gerektirir ve kalıp geliştirme takvime 15–20 gün ekler.'
    - icon: C
      icon_bg: green
      title: 'Renk Seçenekleri ve PVC'
      desc: 'Standart stok renkleri pilot miktarlarda üretilirken, özel Pantone boyanmış PVC levhalar kendi hammadde asgari miktarlarına sahip ayrı kimyasal boyama partileri gerektirir.'
    - icon: A
      icon_bg: purple
      title: 'Grafik ve Baskı Kapsaması'
      desc: 'Bir burun logosu küçük partilerde ekran baskıyla basılabilirken, tam yüzey veya çok panelli grafikler dijital baskı levhası hazırlığı ve kapsam testi gerektirir; bu da pratik parti boyutunu artırır.'
    - icon: B
      icon_bg: orange
      title: 'Markalı Ambalaj'
      desc: 'Özel 5 katlı perakende hediye kutuları, bağımsız bir ofset baskı presi asgarisine tabidir. Daha az kutu sipariş ederseniz fazlayı depolar ve planlanmış sevkiyatlarınıza göre serbest bırakırız.'
    - icon: G
      icon_bg: blue
      title: 'Aksesuar Paketleri'
      desc: 'Standart alüminyum veya naylon kürekler, pompalar ve çantalar alt tedarikçi partilerine tabidir. Tamamen markalı karbon kürekler ve özel pompalar kendi üretim asgari miktarlarına tabidir.'
    - icon: S
      icon_bg: green
      title: 'Sezon ve Ödeme Planlaması'
      desc: 'Sezon öncesi pencerede verilen siparişler kesinleşen üretim kapasitesi alır. 300+ boardluk programlar için kademeli sevkiyat programı, üretimden sonra değil, sözleşme aşamasında kesinleştirilir.'

moq_timeline:
  tagline: Uçtan Uca Zaman Çizelgesi
  title: 'Ürün Brieften Sevk Edilen Boardlara: Gün Gün'
  subtitle: 'Tipik bir özel SUP programının tam programı. Mevcut gövde platformları bu zaman çizelgesinin sol tarafına sıkışır; özel bir gövde kalıp geliştirme aşamasını ekler.'
  steps:
    - step: 'Gün 0'
      title: 'Ürün Brieffinizi Gönderin'
      desc: 'Board modeli, hedef miktar, renk seçenekleri, grafikler ve ambalaj gereksinimleri. Mühendislik incelemesi bir iş günü içinde tamamlanır.'
    - step: 'Gün 1–2'
      title: 'Mühendislik İncelemesi ve Uygulanabilirlik'
      desc: 'Mühendislik ekibimiz gövde geometrisini, malzemeleri ve uyum yolunu kontrol eder ve projenin mevcut platformlara uyup uymadığını veya yeni kalıp gerektirip gerektirmediğini doğrular.'
    - step: 'Gün 3–7'
      title: 'Teknik Özellik ve Kalemli Teklif'
      desc: 'Herhangi bir taahhüt öncesinde MOQ hesabı, teslim süresi dilimleri ve kalem kalem maliyetleri — herhangi bir kalıp ücreti dahil — ile birlikte eksiksiz teknik özellik dosyasını alırsınız.'
    - step: 'Gün 7–12'
      title: 'Numune Geliştirme (1–2 board)'
      desc: 'Üretilen ve test edilen fiziksel numune: gövde rijitliği, EVA kaymaz ped dokusu, grafik isabeti ve aksesuar uyumu. Numune ücretleri onayla birlikte üretim siparişinden mahsup edilir.'
    - step: '+15–20 gün'
      title: 'Özel Kalıp Geliştirme (yalnızca özel gövdeler)'
      desc: 'Yalnızca yeni gövde formu olan projeler için: CNC kesim kalıpları, EVA sıcak pres kalıpları ve kalıp denemeleri, hacimli üretim başlamadan önce tamamlanır.'
    - step: '25–35 gün'
      title: 'Kesinleşen Sipariş ve Depozitodan Sonra Üretim'
      desc: 'Tam 150 m kumaş rulloları, Pantone malzemeleri, markalı ambalaj ve 100 noktalık montaj. Her board 24 saatlik basınç ve hava sızdırmazlık testinden geçer.'
    - step: '300+ board'
      title: 'Kademeli Sevkiyat Planlaması'
      desc: 'Büyük programlar, sezonluk satış temposu, depo kapasitesi ve ödeme kilometre taşlarına uyum sağlamak için planlanmış partiler halinde sevk edilir.'
    - step: 'Gün 0–90'
      title: 'Tipik İlk Sipariş Ufku'
      desc: 'Brieften ilk partinin teslimine: mevcut platformlarla yaklaşık 6–8 hafta, özel kalıpla birlikte 8–12 hafta. Çok rulo ve konteyner programları tasarım gereği bunun ötesine uzanır.'

