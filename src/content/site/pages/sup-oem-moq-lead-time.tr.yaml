  features:
    - icon: S
      icon_bg: blue
      title: 'Numuneler Varsayılan Olarak Hızlıdır'
      desc: 'Numune geliştirme her projede 7–12 gün sürer. Numune turunu teknik özelliklerinizi dondurmak için kullanın; böylece üretim, geç gelen grafik kararlarını hiçbir zaman beklemez.'
    - icon: P
      icon_bg: green
      title: 'Üretim Kapasiteleri Önceden Kesinleşir'
