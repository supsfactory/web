      desc: 'Her kapı — numune onayı, malzeme listesi dondurma, grafik dondurma, sipariş ve depozito — sözleşmede bir tarihle kararlaştırılır. Sayacın hangi gün yeniden başladığını her zaman bilirsiniz.'

scenarios:
  tagline: 'Üç Gerçekçi Giriş Noktası'
  title: 'Hangi Yol Projenize Uyar?'
  subtitle: 'Aynı fabrika, üç farklı giriş yolu. Durumunuza en yakın senaryoyu seçin ve bize ulaştığınızda kullanın.'
  features:
    - icon: A
      icon_bg: orange
      title: 'Girişim Markası: Taahhüt Etmeden Önce Doğrulayın'
      desc: 'Önce 1–2 numune sipariş edin (7–12 gün), sürüş kalitesini ve fotoğrafları test edin, ardından herhangi bir tam parti öncesi satış temposunu ölçmek için 20–50 boardluk bir deneme siparişi verin. İlk sezon toplam riskiniz 50 boardun altında kalır.'
    - icon: B
      icon_bg: blue
      title: 'Tatil Tesisi veya Kiralama Operatörü: Pilot, Sonra Ölçek'
      desc: 'Sadeleştirilmiş ambalajlı 20–50 boardluk bir pilot sipariş sizi sezon öncesinden geçirir. Kullanım verileri döndükten sonra, markalı ambalajla standart 90–100+ boardluk partilere ölçeklenin.'
    - icon: C
      icon_bg: green
      title: 'Kurulmuş Marka: Tam Özel Konteyner Programları'
      desc: 'Kurulmuş markalar, özel gövdeler ve tam yüzey markalamayla 150 m rulo başına 90–100+ board sipariş eder. Özel kalıp imalatı 15–20 gün ekler; 300+ boardluk programlar kademeli programlarla sevk edilir.'

moq_quality:
  tagline: 'Kalite Kontrolü ve Uyumluluk'
  title: 'Her Sipariş Boyutunda Aynı Kalite Sistemi'
  subtitle: '1 boardluk numune ile 300+ boardluk program aynı kalite kapılarından ve aynı uyum belgelerinden geçer. "Düşük MOQ" asla "düşük standart" anlamına gelmez.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: C
      icon_bg: blue
      title: 'Her Ölçekte Uyum Belgeleri'
      desc: 'CE, ISO 9001, BSCI, REACH ve RoHS sertifikasyon belgeleri her siparişle birlikte sağlanır — tek adetlik numuneler dahil — ve talep üzerine sertifika numaraları verilir.'
    - icon: A
      icon_bg: green
      title: '100 Noktalık Montaj Kontrol Listesi'
      desc: 'Parti büyüklüğünden bağımsız olarak her board aynı 100 noktalık montaj kontrol listesinden geçer: malzemeler, kaynaklar, supapozlar, kenar bantları, finler ve aksesuar uyumu satır satır kontrol edilir.'
    - icon: P
      icon_bg: purple
      title: '24 Saatlik Basınç ve Hava Sızdırmazlık Testi'
      desc: 'Her board 18.0 PSI basınca çıkarılır ve 24 saat tutulur. 0.50 PSI üzeri basınç kaybı otomatik ret tetikler — numune için de konteyner için de aynı kapı geçerlidir.'
    - icon: R
      icon_bg: orange
      title: 'RF Kaynak ve Kenar Bant Kaynaşma Doğrulaması'
      desc: 'Üç katmanlı kenar bandı kaynaşması ve RF kaynak dikişleri, herhangi bir üretim partisi başlamadan önce onaylanan numuneye karşı görsel ve boyutsal olarak doğrulanır.'
    - icon: B
      icon_bg: blue
      title: 'ERP Parti İzlenebilirliği (10 Yıl)'
      desc: 'Her board, seri numarası taşıyan üretim kayıtlarıyla gelir — malzemeler, operatörler, testler ve muayene sonuçları — 10 yıl saklanır ve denetimde sunulabilir.'
    - icon: I
      icon_bg: green
      title: 'Üçüncü Taraf Muayeneye Hazır'
      desc: 'Parti üretimi her aşamada üçüncü taraf muayeneye hazırdır. Çoğu müşteri ayrıca 7 aşamalı muayene sistemimizi veya hacimli programlarda sevkiyat öncesi muayeneyi uygular.'

moq_faqs:
  tagline: SSS
  title: 'MOQ ve Teslim Süresi Hakkında Sık Sorulan Sorular'
  items:
    - q: 'Özel bir SUP için asgari sipariş miktarı nedir?'
      a: 'Bu, projenizin aşamasına bağlıdır: numuneler 1–2 boarddur, ortak markalama ile küçük toplu üretim 5–10 adetten başlar, deneme ve pilot siparişler 20–50 board çalışır ve standart hacimli üretim 150 m drop stitch kumaş rulosu başına 90–100+ board çalışır. Özel kalıp formları hacim kademesinde üretilir. Yapılandırmanız için kesin hesabı teklif öncesinde doğrularız.'
    - q: 'Şişirilebilir bir SUP numunesi ne kadar sürer?'
      a: 'Numune geliştirme 7–12 gün sürer. Numune, gövde rijitliğini, EVA kaymaz ped dokusunu, grafik isabetini ve aksesuar uyumunu doğrular. Numune ücretleri geçerlidir ve sözleşme onayıyla üretim siparişinizden mahsup edilir.'
    - q: 'Siparişimi onayladıktan sonra üretim ne kadar sürer?'
      a: 'Üretim teslim süresi, kesinleşen sipariş ve depozitodan itibaren 25–35 gündür. Projeniz özel bir gövde içeriyorsa, özel kalıp geliştirme üretim başlamadan önce 15–20 günlük kalıp süresi ekler.'
    - q: 'MOQ sipariş başına mı, model başına mı yoksa renk seçeneği başına mı hesaplanır?'
      a: 'MOQ; model, renk seçeneği, grafik sürümü, ambalaj yapılandırması veya toplam sipariş başına uygulanabilir. Farklı drop stitch kalınlıkları ve PVC renkleri farklı hammadde rulolarından geldiği için, 50 boardluk siparişi 5 renge bölmek 5 ayrı kumaş rulosu ihtiyacı doğurur. Hesabı SKU matrisinize göre doğrularız.'
    - q: 'Pazarı test etmek için yalnızca 1–2 board ile başlayabilir miyim?'
      a: 'Evet. 1–2 boardluk numune siparişi mümkün olan en düşük maliyetli doğrulamadır: herhangi bir üretim partisine mali taahhüt vermeden önce gövde rijitliği, grafikler ve aksesuar uyumu doğrulanır. Buradan sonra ticari doğrulama için 20–50 boardluk deneme siparişine geçersiniz.'
    - q: '300+ boardluk bir program birden fazla partide sevk edilebilir mi?'
      a: 'Evet. Büyük ölçekli programlar, üretim partilerine yayılmış kademeli sevkiyat olarak planlanabilir; böylece sezonluk filolar ihtiyaç duyulduğunda gelir ve nakit akışı ile depo alanı yönetilebilir kalır. Programlar, üretimden sonra değil, sözleşme aşamasında kesinleştirilir.'

