trust_steps:
  tagline: 'Eine reale Fallstudie'
  title: 'Wie eine nordeuropäische Verleihflotte uns vor der Bestellung verifizierte'
  subtitle: 'Sieben Verifizierungsschritte, die ein gewerblicher Verleiher vor einer Flottenbestellung von 90–100+ Einheiten durchführte — dieselbe Checkliste steht Ihnen offen.'
  steps:
    - step: '01'
      title: 'Verifizierung der offiziellen Entität'
      desc: 'Der Käufer forderte die chinesische Gewerberegistrierung und die Exporthandelslizenz an. Die juristische Person hinter SUPsfactory ist die Qingdao Vatrad Group Co., Ltd., ein seit 2012 in Qingdao, Shandong registrierter Hersteller — über das nationale Register unter NDA verifiziert.'
    - step: '02'
      title: 'Physische Fabrik & Standortaudit'
      desc: 'Ein Fabrikaudit (persönlich und per Video-Durchgang) bestätigte die 12,500 m² große Anlage: vier Spezialwerkstätten, 350+ Mitarbeiter, vier automatisierte Linien und eine Monatsproduktion von etwa 10.000 Boards. Der Auditbericht wird zu den Vertragsunterlagen abgelegt.'
    - step: '03'
      title: 'Menschen: echte Ingenieure, keine Vertriebskripte'
      desc: 'Der Käufer sprach direkt mit dem Technikteam — Rumpfdesign, Materiallabor und QC. Projektspezifikation und NDA wurden innerhalb von 4 Geschäftsstunden ausgetauscht, und eine technische Prüfung kam innerhalb eines Werktages zurück.'
    - step: '04'
      title: 'Papier: QMS, Zertifikate & Drittprüfung'
      desc: 'ISO-9001:2015-, ISO-25649- und CE-Konformitätsdokumentation, BSCI/REACH/RoHS-Aufzeichnungen und die QMS-SOPs wurden geprüft. Der Käufer terminierte eine SGS-Vorversandprüfung nach ISO 2859-1 Level II für den ersten Mengenauftrag — und erhielt pro Charge ein Konformitätszertifikat (Certificate of Conformance).'
    - step: '05'
      title: 'Daten: Testaufzeichnungen je Seriennummer'
      desc: 'Der Käufer prüfte echte Testaufzeichnungen: jede Kammer 24 Stunden bei 18,0 PSI getestet mit automatischer Aussortierung über 0,50 PSI Druckabfall, 100-Punkte-Montagechecklisten und 10-jährige ERP-Chargenrückverfolgbarkeit. Beispiel-QC-Aufzeichnungen wurden vor der Bestellung bereitgestellt.'
    - step: '06'
      title: 'Vertragsschutz'
      desc: 'Der Auftragsvertrag deckte Markenlizenzierung, eine vereinbarte territoriale Exklusivitätsdauer, Formeneigentum und Übernahmebedingungen sowie die mit den Werkzeugen zu übergebenden Daten und Aufzeichnungen ab. Der Käufer gab die Form vor der Produktion in der Fabrik frei.'
    - step: '07'
      title: 'Laufende Governance'
      desc: 'Vierteljährliche Geschäftsbesprechungen mit dem Vertriebs-VP und dem Chefingenieur, ein vorbehaltenes Auditrecht während der Produktion und ein Eskalationspfad zum QA-Direktor bei Qualitätsstreitigkeiten. Die Vereinbarung wurde vom Vertriebs-VP, dem Chefingenieur und dem QA-Direktor gemeinsam unterzeichnet.'

trust_faqs:
  tagline: 'FAQ'
  title: 'Die 12 Bedenken, die Käufer vor der Bestellung stellen'
  items:
    - q: 'Ist SUPsfactory wirklich eine Fabrik oder ein Handelsunternehmen?'
      a: 'SUPsfactory ist die SUP-Produktentwicklungs- und Fertigungsdivision der Qingdao Vatrad Group Co., Ltd. Wir betreiben die 12,500 m² große Anlage in Qingdao selbst — Design, Zuschnitt, Schweißen, Montage und Prüfung finden in einer Einrichtung statt. Es gibt keine Übergaben über Handelsunternehmen: Die Personen, die Ihre Fragen beantworten, sind die Personen, die Ihre Boards bauen.'
    - q: 'Mit wem werde ich während meines Projekts konkret zu tun haben?'
      a: 'Mit einem benannten Projektingenieur und einem benannten QC-Ansprechpartner sowie den Abteilungsleitern, die Ihre Dokumente unterzeichnen. Sie können direkt mit dem Chefingenieur, dem QA-Direktor oder dem Werksleiter sprechen — vor und nach der Bestellung. Zwischen Ihnen und den ausführenden Personen sitzt keine Account-Manager-Ebene.'
    - q: 'Kann ich die Fabrik besuchen oder auditieren?'
      a: 'Ja. Wir empfangen Fabrikbesuche in der Wirtschaftsentwicklungszone Laixi, Qingdao und unterstützen Remote-Audits mit Live-Video-Durchgängen. Audits können unabhängig organisiert werden (durch Ihren Prüfer oder einen Dritten wie SGS, TÜV, BV oder Intertek), und der Auditplan kann in den Vertrag aufgenommen werden.'
    - q: 'Unterzeichnen Sie vor dem Teilen meines Designs eine NDA?'
      a: 'Ja. Unsere Standard-NDA wird innerhalb von 4 Geschäftsstunden nach Ihrer Anfrage unterzeichnet, bevor eine proprietäre Spezifikation, Artwork oder technische Datei geteilt wird. Zweisprachige Fassungen (Englisch/Chinesisch) sind verfügbar, und das Dokument wird vom Werksleiter gegengezeichnet.'
    - q: 'Woher weiß ich, dass Ihre Qualitätsaussagen real sind?'
      a: 'Hinter jeder Aussage auf dieser Website steht ein Dokument: QMS-SOPs und Prüfstandards sind herunterladbar, anonymisierte Qualitätsaufzeichnungs-Muster sind veröffentlicht, und Testdaten werden je Seriennummer mit 10-jähriger ERP-Chargenrückverfolgbarkeit protokolliert. Sie können auch eine Dritt-Vorversandprüfung Ihrer Wahl terminieren.'
    - q: 'Was passiert, wenn meine Boards mit Mängeln ankommen?'
      a: 'Jedes Board wird vor der Verpackung geprüft, und Chargenaufzeichnungen ermöglichen die Ursachenanalyse je Seriennummer. Der Vertrag definiert Prüf-, Ersatz- und Nacharbeitspflichten, und der QA-Direktor unterzeichnet die Chargenfreigabe. Nachgearbeitete Boards werden vollständig erneut geprüft — nie nur teilweise kontrolliert.'
    - q: 'Können Sie wirklich 100% der Boards vor dem Versand testen?'
      a: 'Ja — und die Aufzeichnungen belegen es. Jede Kammer wird auf 18,0 PSI aufgepumpt und mit kontinuierlicher Sensorprotokollierung 24 Stunden gehalten; jede Kammer mit einem Druckabfall über 0,50 PSI über 24 Stunden wird automatisch aussortiert und neu geprüft. Testprotokolle sind mit jeder Seriennummer verknüpft und Teil der Chargendokumentation.'
    - q: 'Welche Zertifizierungen besitzen Sie tatsächlich?'
      a: 'ISO 9001:2015 Qualitätsmanagement, ISO 25649- und CE-Konformität für Inflatable-SUP-Produkte sowie BSCI-, REACH- und RoHS-Konformität für Einrichtung und Materialien. Zertifikatsnummern und Audit-Aufzeichnungen werden auf Anfrage oder bei einem Audit bereitgestellt — die Liste ist veröffentlicht, nicht „nur auf Anfrage verfügbar".'
    - q: 'Ist meine Marke sicher — Design, Formen und Markt?'
      a: 'Ja. Ihre Marke, Ihre Designs und Ihr Werkzeug sind durch NDA, Markenlizenzbedingungen und Formeneigentums- oder Übernahmeklauseln im Vertrag geschützt. Das Werkzeug wird für die Marke aufbewahrt und ist übertragbar. Territorial- und Exklusivitätsbedingungen werden vor Produktionsbeginn schriftlich vereinbart.'
    - q: 'Wie hoch ist Ihr tatsächlicher MOQ?'
      a: 'Der MOQ ist projektspezifisch und in unserem MOQ-Leitfaden erläutert: Muster 1–2 Einheiten, Co-Branding-Kleinserie 5–10 Einheiten, Pilotchargen 20–50 Einheiten und Standardmenge 90–100+ Einheiten pro 150-m-Rolle (ca. 180–220 Boards). Formen für eigene Formen laufen auf der Mengenstufe. Die Berechnung wird vor dem Angebot bestätigt — keine vagen „Low-MOQ"-Zahlen.'
    - q: 'Was passiert, wenn die Produktion zu spät kommt?'
      a: 'Die Lieferzeit wird nach Prüfung von Spezifikation, Artwork und Verpackung bestätigt — nie vorher versprochen. Der Vertrag regelt Planung, Verzögerungsmeldung und den Lösungsweg, und die vierteljährliche Geschäftsbesprechung verfolgt die Lieferleistung gegen den vereinbarten Kalender.'
    - q: 'Wer unterzeichnet auf Ihrer Seite die Vertragsdokumente?'
      a: 'Aufträge und Vereinbarungen werden vom Vertriebs-VP, dem Chefingenieur und dem QA-Direktor gemeinsam unterzeichnet — den drei Personen, die für Handelspolitik, technische Umsetzung bzw. Qualitätsfreigabe verantwortlich sind. Sie erhalten die unterzeichneten Dokumente mit den Vertragsunterlagen.'

governance:
  tagline: 'Verantwortlichkeitsstruktur'
  title: 'Benannte Unterzeichner & vorbehaltene Rechte'
  subtitle: 'Jede Verpflichtung ist an eine benannte Rolle gebunden — nicht an eine Vertriebsabteilung.'
  body: |
    **Gemeinsame Unterzeichnung.** Aufträge, Qualitätspläne und Streitbeilegungen werden von drei Rollen unterzeichnet: dem Vertriebs-VP (Handelspolitik), dem Chefingenieur (technische Umsetzung) und dem QA-Direktor (Qualitätsfreigabe). Zweisprachige SOPs sind versionskontrolliert und tragen dieselbe Unterschriftenstruktur.

    **Vorbehaltene Rechte.** Der Käufer behält das Recht, die Produktion zu auditieren, Testaufzeichnungen zu prüfen und die Chargenfreigabe bis zur Prüffreigabe zurückzuhalten. Nacharbeit erfolgt nur unter einem genehmigten Änderungsprotokoll, und die Freigabe wird von unabhängiger Qualitätskontrolle validiert — nie von den Nacharbeitsoperatoren.

    **Übergebene Aufzeichnungen.** Chargentestprotokolle, Konformitätszertifikate und Prüfberichte werden mit jeder Lieferung geliefert, und die ERP-Chargenrückverfolgbarkeit wird 10 Jahre aufbewahrt. Werkzeugaufzeichnungen und Formenzeichnungen gehen mit dem Werkzeug über, wenn der Vertrag dies vorsieht.

