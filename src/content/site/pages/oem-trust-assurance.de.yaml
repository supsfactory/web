hero:
  tagline: 'Fertigung, die Sie verifizieren können'
  title: 'OEM-Vertrauen & Fabrik-Sicherheit'
  subtitle: 'Jede Aussage auf dieser Website lässt sich verifizieren: offizielle Unternehmensregistrierung, eine physische 12,500 m² große Fabrik, die Sie besuchen oder auditieren können, echte Ingenieure unter NDA, herunterladbare QMS-Dokumente und je Seriennummer erfasste Testdaten. Konstruiert und betrieben von der Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Kurze Antwort'
  text: 'Vertrauen ist kein Versprechen — es ist Dokumentation. Wir sind ein registriertes chinesisches Fertigungsunternehmen (Qingdao Vatrad Group Co., Ltd.) mit einer physischen 12,500 m² großen Anlage in Qingdao, 350+ Mitarbeitern und 120.000+ Boards Jahreskapazität. Sie können die Registrierung verifizieren, die Fabrik auditieren, QMS-SOPs prüfen, Beispiel-Qualitätsaufzeichnungen herunterladen, Drittprüfungen terminieren (SGS, TÜV, BV oder Intertek) und innerhalb von 4 Geschäftsstunden eine NDA unterzeichnet bekommen. Jedes Board wird 24 Stunden bei 18,0 PSI druckgetestet mit automatischer Aussortierung über 0,50 PSI Abfall, und jede Charge behält eine 10-jährige ERP-Rückverfolgbarkeit. Wenn eine Aussage nicht dokumentierbar ist, machen wir sie nicht.'
  verified: 'September 2026'

