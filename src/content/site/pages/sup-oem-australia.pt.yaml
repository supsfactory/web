hero:
  tagline: 'Austrália'
  title: 'SUP insuflável OEM para a Austrália — stock antes da época'
  subtitle: 'Amostras em 7–12 dias, produção em 25–35 dias, transporte marítimo de 4–6 semanas para Sydney, Melbourne ou Brisbane. Os compradores do hemisfério sul planificam com 3–4 meses de antecedência, para que a mercadoria chegue antes da época de dezembro–fevereiro.'

answer:
  label: 'Resposta breve'
  text: 'As marcas australianas encomendam SUP insufláveis à iSupfactory em condições padrão: a MOQ é confirmada pela configuração do projeto: os ciclos de amostras com 1–2 peças validam a construção, as pequenas séries piloto com 20–50 peças testam o mercado em plataformas existentes e a produção de série padrão roda com 90–100+ peças por design a partir de um rolo drop-stitch completo de 150 m. A primeira amostra parte 7–12 dias após a aprovação das especificações, a produção exige 25–35 dias após PO confirmada e sinal e o transporte marítimo acrescenta 4–6 semanas para Sydney, Melbourne ou Brisbane. Com produção mais transporte, encomenda 3–4 meses antes de precisares do stock nas prateleiras; DDP cobre o desalfandegamento e a entrega no teu armazém.'
  verified: 'September 2026'

