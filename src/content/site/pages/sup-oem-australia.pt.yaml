why_australia:
  tagline: 'Porquê os compradores na Austrália'
  title: 'Construído para o mercado australiano'
  subtitle: 'Para as marcas australianas conta o calendário: encomenda na primeira metade do ano, para que os contentores cheguem antes do verão.'
  items:
    - title: 'Planeamento orientado à época'
      description: 'O verão australiano vai de dezembro a fevereiro. Uma produção de 25–35 dias mais 4–6 semanas de transporte significa: uma encomenda em Q1–Q2 coloca a mercadoria nas prateleiras antes da alta época.'
    - title: 'DDP para custos a destino planificáveis'
      description: 'O DDP inclui desalfandegamento, direitos, impostos e entrega no teu armazém — um preço total, porta a porta.'
    - title: 'FOB Qingdao com o teu expedidor'
      description: 'Importador habitual? Escolhe FOB Qingdao e usa o teu parceiro logístico — nós carregamos e documentamos o contentor, tu controlas o resto.'
    - title: 'Uma fábrica, um sistema de qualidade'
      description: 'Desenvolvimento, amostras, produção e QC acontecem todos na fábrica de 12,500 m² — a amostra aprovada é o produto que recebes.'

process_notes:
  tagline: 'Como funciona'
  title: 'Da especificação ao contentor'
  subtitle: 'As mesmas seis fases, quer compres dois contentores por ano ou vinte: especificação, engenharia, amostra, verificação, equipamento, produção — depois entrega FOB, CIF ou DDP.'
  items:
    - title: '1. Envia a tua especificação'
      description: 'Basta uma prancha de referência, um esboço ou uma especificação de concorrente. Verificação técnica e proposta chegam num dia útil.'
    - title: '2. Aprova a amostra'
      description: 'A tua primeira amostra física parte em 7–12 dias com um formulário de aprovação sobre construção, cores de impressão e resultados do teste de pressão.'
    - title: '3. Produção & exportação'
      description: 'Os ciclos ficam concluídos em 25–35 dias com checkpoints QC durante a produção. Packing list, fatura e conhecimento de embarque precedem o navio.'
    - title: '4. Entrega no teu armazém'
      description: '4–6 semanas de transporte marítimo para Sydney, Melbourne ou Brisbane — com DDP tratamos nós do desalfandegamento e da entrega até à tua porta.'

faq_section:
  tagline: FAQ
  title: 'Perguntas sobre a importação na Austrália'
  questions:
    - q: Quanto dura o transporte marítimo para a Austrália?
      a: 'Conta com 4–6 semanas do porto de Qingdao a Sydney, Melbourne ou Brisbane, dependendo do plano de partida. Os projetos DDP incluem a timeline completa porta a porta.'
    - q: Quando devo encomendar para ter stock antes do verão?
      a: 'A produção exige 25–35 dias e o transporte 4–6 semanas, por isso encomenda cerca de 3–4 meses antes de precisares da mercadoria. Para a época de verão de dezembro–fevereiro, emite a PO na primeira metade do ano.'
    - q: Enviam em DDP para a Austrália?
      a: 'Sim. O DDP inclui transporte marítimo, desalfandegamento, direitos e impostos, além da entrega no teu armazém — um preço total planificável. Também estão disponíveis FOB Qingdao e CIF.'
    - q: Qual é a MOQ para uma importação de SUP private label?
      a: 'A MOQ é confirmada pela configuração do projeto: o desenvolvimento das amostras cobre 1–2 peças, as pequenas séries piloto rodam com 20–50 peças em plataformas existentes e a produção de série padrão roda com 90–100+ peças por design a partir de um rolo drop-stitch completo de 150 m.'
    - q: Que documentação fornecem para as importações?
      a: 'A amostra aprovada parte com documentação CE e REACH preparada para os teus mercados-alvo e cada contentor parte com packing list, fatura e conhecimento de embarque.'
    - q: Como inicio um projeto a partir da Austrália?
      a: 'Envia uma prancha de referência, um esboço ou uma especificação. A verificação técnica e a proposta chegam num dia útil e antes de qualquer troca de ficheiros é assinada uma NDA.'

