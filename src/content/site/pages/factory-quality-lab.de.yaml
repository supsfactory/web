answer:
  label: 'Klare Antwort'
  text: '100 % der Einheiten werden 24 Stunden lang bei 18,0 PSI einem Drucktest unterzogen, mit automatischer Ausschleusung ab einem Druckabfall von 0,50 PSI. Rohe Gewebepartien werden nach ASTM D751 und ISO 4674 verifiziert, und Schweißnaht-Schältests laufen alle 50 Einheiten mit AQL-2,5-Endabnahme nach ISO 2859.'
  verified: 'September 2026'

intro: Vatrad betreibt ein eigenes Qualitätskontrolllabor, das unabhängig von der Produktion arbeitet. Jede Charge Rohmaterial und jedes fertige SUP-Board durchläuft dokumentierte Inspektionsprotokolle, bevor es freigegeben wird. Unser QC-Team berichtet direkt an die Geschäftsleitung und gewährleistet dadurch unparteiische Qualitätsentscheidungen.

highlights:
  - value: 100%
    label: Druckgeprüfte Einheiten
    detail: Jede Kammer, jedes Board
  - value: 24 h
    label: Dauer des Luftrückhaltetests
    detail: Bei 18,0 PSI Nenndruck
  - value: '&lt;5%'
    label: Maximal zulässiger Druckabfall
    detail: Über den 24-Stunden-Haltezeitraum
  - value: AQL 2.5
    label: Schwerer Hauptfehlergrenzwert
    detail: Nach ISO-2859-Stichprobenverfahren

test_procedures:
  - title: Rohmaterialprüfung
    description: Jede eingehende Charge PVC, Hypalon, Drop-Stitch-Gewebe und Beschläge wird vor der Annahme geprüft. Zugfestigkeit (ASTM D751), Weiterreißfestigkeit (ISO 4674) und UV-Beständigkeit werden verifiziert. Nichtkonforme Materialien werden gesperrt (quarantäniert) und zurückgesendet.
    standards:
      - ASTM D751 (Zug)
      - ISO 4674 (Weiterreiß)
      - ISO 4892 (UV)
  - title: In-Process-QC-Prüfpunkte
    description: Produktionsmitarbeiter führen in jeder Stufe eine Selbstprüfung durch. QC-Auditoren führen während der gesamten Schicht Stichproben durch. Schweißnaht-Schältests werden alle 50 Einheiten durchgeführt. Maßliche Prüfungen erfolgen an jedem 20. Paneel.
    standards:
      - ASTM D751 (Schäl)
      - Interne 100-Punkte-Checkliste
      - ISO-2859-Stichprobenverfahren
  - title: 24-Stunden-Luftrückhaltetest
    description: Jede Schlauchkammer wird auf 18,0 PSI aufgeblasen und 24 Stunden gehalten. Drucksensoren protokollieren kontinuierlich mit Temperaturkompensation. Jede Kammer, die einen Druckabfall von über 0,50 PSI aufweist, löst eine automatische Wiederholungsprüfung der Charge aus.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Last- & Stabilitätstests
    description: Fertiggestellte Boards werden bei maximaler Nennlast auf Stabilität, Freibord und Handhabung getestet. Jedes Board durchläuft einen Wassertest, bevor es die Endinspektionsfreigabe erhält.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Universalprüfmaschine (Zug)
    spec: '5 kN, konform mit ASTM D751'
  - name: Druckabfall-Prüfgerät
    spec: 'Mehrkanal, 0–50 psi, Datenlogger'
  - name: UV-Bewitterungskammer
    spec: 'ISO 4892, 1.000-h-Zyklen'
  - name: Dickemessgerät (digital)
    spec: '0,01 mm Auflösung'
  - name: Schältester (Schweißnaht)
    spec: 'Motorisiert, 50 N Kapazität'
  - name: Temperaturkammer
    spec: '-40 °C bis +100 °C'
  - name: Leckerkennungstank
    spec: '6 m × 2 m, beleuchtet'

lab_evidence:
  tagline: Testbericht-Dossiers
  title: 'Die tatsächlichen Labortestberichte herunterladen'
  subtitle: 'Dieselben zweisprachigen kontrollierten Aufzeichnungen, gegen die unser Qualitätsteam abschließt — Struktur, Methoden, Kriterien und Ergebnisse, mit entfernten vertraulichen Feldern. Jedes Dossier entspricht einem der sieben Inspektionsgates.'
  items:
    - title: 'IQC — Wareneingangsberichte'
      description: 'Verifizierung von Gewebe, PVC-Rolle, Ventilen und Komponenten gegen die freigegebene Spezifikation.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'IQC-Berichte herunterladen (PDF)'
    - title: 'IPQC — In-Process- & Erstmusterberichte'
      description: 'Erstmuster- und In-Process-Inspektionsaufzeichnungen gegen die gesperrte Revision.'
      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'IPQC-Berichte herunterladen (PDF)'
    - title: 'Luftdichtigkeit — Druck- & Leckaufzeichnungen'
      description: '100 % Naht-Leckerkennung, Ventilintegrität und 24-Stunden-Druckhalte-Verifizierung.'
      icon: tabler:waves
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Luftdichtheitsberichte herunterladen (PDF)'
    - title: 'FQC — Endberichte der Boards'
      description: 'Endprüfung gegen das freigegebene Muster — Maße, Optik und Finbox.'
      icon: tabler:shield-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'FQC-Berichte herunterladen (PDF)'
    - title: 'PSI — Verpackungs- & Versandvorinspektionsberichte'
      description: 'Kit-Vollständigkeit, Barcode-Note, Kartonkennzeichnungen und Sturzsicherungsaufzeichnungen.'
      icon: tabler:package
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'PSI-Berichte herunterladen (PDF)'
    - title: 'Versandfreigabe- & Rückverfolgbarkeitsdossier'
      description: 'Freigabeautorisierung und Chargenrückverfolgbarkeit, zugeordnet zu Spezifikation, Grafik und BOM.'
      icon: tabler:history
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Freigabeberichte herunterladen (PDF)'
    - title: 'Vollständiges Qualitätsdossier'
      description: 'Ein Paket, das das gesamte Dokumentationssystem abdeckt — QIP, Gate-Aufzeichnungen, Rückverfolgbarkeit und NCR-Kontrolle.'
      icon: tabler:books
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'Dokumentationspaket herunterladen (PDF)'

