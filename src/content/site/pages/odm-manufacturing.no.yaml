hero:
  tagline: ODM-produksjon
  title: 'SUP-ODM-produsent — design og produktutvikling'
  subtitle: 'Du trenger ikke en ferdig SUP-design. Start med en produktidé, et marknadskrav eller et ytelsesmål — ingeniørene våre i egen rego designer skrog, konstruksjon, grafikk og emballasje ut fra briefingen din, lager prøveeksemplarer på 7–12 dager og produserer 25–35 dager etter ordrebekreftelse.'

answer:
  label: 'Kort svar'
  text: 'iSupfactory er en SUP-ODM-produsent i Qingdao, Kina. ODM-utviklingen begynner med briefingen din, ikke med tegningene dine: skrogdesignen (lengde, bredde, rocker, volum), materialstrukturen og grafikken designes internt, valideres med prøveeksemplarer på 7–12 dager og produseres i standardantall på 90–100 enheter per rull på 150 m (pilot på 20–50 enheter). Produksjonen tar 25–35 dager etter ordrebekreftelse og depositum; formbyggingen for tilpassede former legger til 15–20 dager. Dokumentasjon for CE, ISO 9001, BSCI, REACH og RoHS følger med hver bestilling.'
  verified: 'September 2026'

features:
  title: ODM-kapasiteter
  subtitle: 'Alt du får når designen skapes i fabrikken — ikke på skrivebordet ditt.'
  items:
    - title: Skrogdesign
      description: 'Lengde, bredde, tykkelse, rocker og volum, utformet for referansebrukerne, bruksområdene og markedene dine — fra et blankt ark eller fra biblioteket vårt med dokumenterte plattformer.'
      icon: 'tabler:waves'
    - title: Strukturell konstruksjon
      description: 'Drop-stitch-tetthet, antall og kvalitet på PVC-lagene, plassering av forsterkninger og railkonstruksjon — spesifisert og validert for designen din.'
      icon: 'tabler:building-factory'
    - title: Grafikk og merkesetting
      description: 'Brettgrafikk, logoplasseringer, EVA-deckpads og kommersielle emballasjer, utviklet av designteamet vårt rundt merket ditt.'
      icon: 'tabler:palette'
    - title: Formutvikling
      description: 'Nye skrogformer starter som formbygging, designet og frest internt — utstyret legger til 15–20 dager i prosjektplanleggingen.'
      icon: 'tabler:shapes'
    - title: Prototypevalidering
      description: 'Et fysisk prototypeeksemplar bygges, testes og sendes til din vurdering med vanntest — normalt innen 7–12 dager.'
      icon: 'tabler:tools'
    - title: Testing og samsvar
      description: 'Lufttetthet, trykkholding og sømstyrke per enhet, med samsvarsdokumentasjon for ISO 9001, BSCI, REACH, RoHS og CE for målmarkedet (omfang bekreftes per prosjekt).'
      icon: 'tabler:certificate'
    - title: Alternativer for eierskap av former
      description: 'Formeierskap eller klausuler om overføring reguleres i kontrakten — designen din forblir din, og formene ligger klare for nytrykk.'
      icon: 'tabler:lock'
    - title: Fra prototype til container
      description: 'En validert ODM-design går rett til standardproduksjon i volum: 90–100+ enheter per rull på 150 m, 25–35 dager etter ordrebekreftelse.'
      icon: 'tabler:package'

customization:
  tagline: 'Designet med deg'
  title: 'Hva vi utvikler ut fra briefingen din'
  subtitle: 'ODM betyr at produktet designes for deg fra grunnen av eller fra biblioteket vårt med plattformer — dette er punktene som briefingen din styrer:'
  items:
    - 'Brukerprofil og marked — posisjonering for nybegynnere, touring, konkurranse, yoga, fiske eller multifunksjonsbruk'
    - 'Brettmål — lengde, bredde, tykkelse og volum, kalibrert for referansebrukere og bruksformål'
    - 'Skrogkarakter — rocker, railprofil, form på nose og stjert, kalibrert for stabilitet eller fart'
    - 'Materialstruktur — drop-stitch-tetthet, antall og kvalitet på PVC-lagene, forsterkninger og railforsterkninger'
    - 'Grafikk og farger — merkefarger, brettgrafikk og logoplasseringer, utviklet internt'
    - 'Sklisikkert EVA-deckpad — oppsett, farger og logointegrasjon på decket'
    - 'Tilbehørspakke — padler, pumper, finner, leash-er og vesker, kalibrert for brettet'
    - 'Kommersiell emballasje og POS-materiale — kommersielle emballasjer, displayer og eksportemballasje under merket ditt'

faq_section:
  tagline: FAQ
  title: Spørsmål om ODM-utvikling
  questions:
    - q: Hva er forskjellen mellom ODM og OEM?
      a: 'ODM (Original Design Manufacturing) begynner med briefingen din — ingeniørene våre utvikler brettets struktur, konstruksjon, grafikk og emballasje, uansett om det tar utgangspunkt i et marknadskonsept, et ytelsesmål eller en videreutvikling av en dokumentert plattform. Du godkjenner designen før produksjonen. OEM (Original Equipment Manufacturing) produserer i henhold til den spesifikasjonen du har godkjent — tegningene, målene, materialene og emballasjen din. Du eier designen og den immaterielle eiendomsretten. Begge sporene går gjennom samme fabrikk, samme QC-system og samme eksportteam; ODM er raskeste vei til et merket brett når du ennå ikke har noen design.'
    - q: Jeg har bare en grov idé — hvor begynner vi?
      a: 'Send en kort briefing: referansebrukere, bruksområder, indikative mål, markeder og antall. Ingeniørene våre svarer innen én arbeidsdag med et konsept, en designretning og en utviklingsplan — en NDA signeres på forespørsel før utveksling av detaljer.'
    - q: Hvor lang tid tar utviklingen av et nytt SUP-brett?
      a: 'Prototypeprøver sendes innen 7–12 dager. Et nytt skrog med egen formbygging legger til 15–20 dagers konstruksjonsarbeid før prøvene. Produksjonen tar 25–35 dager etter bestilling og depositum.'
    - q: Hva er MOQ for et ODM-brett?
      a: 'Produksjon i standardantall skjer med 90–100 enheter per 150 m drop-stitch-rull; pilotkjøringer starter fra 20–50 enheter på eksisterende plattformer. Co-branding for små partier starter fra 5–10 enheter — hele beregningen finner du i guiden vår om MOQ og fleksibel merkesetting.'
    - q: Hvem eier designen og formverktøyet?
      a: 'Briefingen din, designen din og utstyret ditt er beskyttet av NDA, vilkårene for merkelisensen og klauslene om eierskap eller overføring av formverktøy i kontrakten. Formverktøyene oppbevares for merket ditt og kan overføres.'
    - q: Kan dere utvikle en bestemt form (touring, fiske, konkurranse, yoga)?
      a: 'Ja. Skrogkonstruksjonen dekker alle store SUP-kategorier — allround, touring, konkurranse, yoga, fiske og flerpersonersbrett — med validering i den hydrodynamiske testdammen for ytelsesformer.'
    - q: Hvilke sertifiseringer har det utviklede brettet?
      a: 'ISO 9001:2015 kvalitetsledelse (på fabrikknivå), BSCI-samsvar (amfori-fabrikkrevisjon), CE-samsvarsdokumentasjon for konfigurasjonene som omfattes av EU-markedet (direktivet om fritidsbåter — omfang bekreftes per prosjekt), REACH (materiale), RoHS (elektronisk tilbehør) og ISO 25649 for de aktuelle oppblåsbare SUP-modellene. Dokumentasjonen utarbeides per bestilling for eksportmarkedene dine.'

process:
  title: 'ODM-prosessen — fra briefing til produksjon i skala'
  subtitle: 'Seks styrte faser, ledet av samme team som designer, prøver og skalerer opp brettet ditt — alt dokumenteres.'
  steps:
    - phase: '01'
      title: Briefing og konsept
      period: 1 arbeidsdag
      items:
        - 'Del referansebrukere, bruksområder, mål, markeder og antall — eller bare en idé.'
        - 'Ingeniørene våre leverer en konseptretning, plattformalternativer og en utviklingsplan.'
    - phase: '02'
      title: Skrog- og strukturdesign
      period: Uke 1–2
      items:
        - 'Brettmål, skrogkarakter, drop-stitch-tetthet og PVC-struktur — designet internt.'
        - 'Grafikk, EVA-deck-oppsett og emballasjekonsept utviklet rundt merket ditt.'
    - phase: '03'
      title: Formverktøy og utstyr
      period: +15–20 dager (nye formverktøy)
      items:
        - 'Egen formbygging for nye skrogformer; eksisterende plattformer hopper over denne fasen.'
        - 'Vilkårene for formeierskap fastsettes i kontrakten før fresingen begynner.'
    - phase: '04'
      title: Prototype og prøve
      period: 7–12 dager
      items:
        - 'Et fysisk prototypeeksemplar bygges, testes og sendes til din vurdering — inkludert vanntest.'
        - 'Prøveeksemplaret (1–2 enheter) validerer form, konstruksjon og merkesetting før volumet.'
    - phase: '05'
      title: Validering og godkjenning
      period: Parallelt
      items:
        - 'Lufttetthet, trykkholding, sømstyrke, belastnings- og UV-tester for hver produksjonslinje.'
        - 'CE-, ISO 9001-, BSCI-, REACH- og RoHS-dokumentasjon utarbeides for eksportmarkedene dine.'
        - 'Du godkjenner prototypen; bestillingen og depositumet reserverer produksjonsplassen.'
    - phase: '06'
      title: Produksjon og levering
      period: 25–35 dager
      items:
        - 'Standardantall kjøres med 90–100+ enheter per rull på 150 m, pilotkjøringer med 20–50 enheter.'
        - 'Eksportemballasje, levering FOB/CIF/DDP til over 50 land og støtte ved nytrykk inngår.'

