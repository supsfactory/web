    - 'usine sup chine'
hero:
  tagline: Capacité de production
  title: Capacité de fabrication et production annuelle
  subtitle: 'Installation de 12 500 m² produisant plus de 120 000 planches de SUP par an avec de la marge pour évoluer'

answer:
  label: 'Réponse directe'
  text: 'Capacité d''usine : 12 500 m² répartis sur quatre ateliers spécialisés, plus de 120 000 planches de SUP par an, 350+ ouvriers sur deux équipes, export vers plus de 50 pays. Le MOQ est confirmé par la configuration du projet — échantillon (1–2 unités), pilote (20–50 unités) et volume standard (90–100+ unités par rouleau de 150 m) ; consultez notre Guide MOQ et marque flexible pour la logique complète. Délai de 25–35 jours, échantillons en 7–12 jours.'
  verified: '2026-08'

intro: 'Afarer exploite l''une des plus grandes installations de fabrication dédiées de SUP gonflables à Qingdao, en Chine. Notre usine de 12 500 m² est organisée en quatre ateliers spécialisés fonctionnant en parallèle, ce qui nous permet de produire plus de 120 000 planches par an sur les lignes de SUP et d''équipements de sécurité.'

