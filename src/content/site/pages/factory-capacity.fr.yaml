meta:
  title: 'Capacité de production — usine de 12 500 m² | {SITE}'
  description: 'Capacité de l''usine Afarer : installation de 12 500 m² produisant plus de 120 000 planches de SUP par an avec de la marge pour évoluer. Fabrication OEM/ODM de SUP gonflables à grande échelle.'
  dateModified: '2026-08-07'
  keywords:
    - 'capacité de production sup'
    - 'usine sup gonflable'
