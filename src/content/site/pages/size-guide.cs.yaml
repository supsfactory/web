how_to_choose:
  title: Jak vybrat správnou velikost
  cards:
    - title: Desky SUP
      description: Délku vybírejte podle hmotnosti a zamýšleného použití. Širší desky (32"+) poskytují větší stabilitu. Delší desky (11-12 ft) lépe drží směr při turistice. Těžším paddleařům jsou potřeba desky s větším objemem.
    - title: Turistické SUP
      description: Delší desky (11–12 ft) se nejlépe hodí na překonávání vzdáleností a turistiku. Širší desky (32"+) poskytují větší stabilitu. Zkontrolujte nosnost včetně vybavení.
    - title: Univerzální SUP
      description: Délku vybírejte podle hmotnosti jezdce a zamýšleného použití. Univerzální desky se hodí pro odpočinek, fitness a jógu. Menší desky jsou lépe ovladatelné.

