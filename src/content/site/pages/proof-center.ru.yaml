traceability:
  tagline: 'Партия — от рулона до доски'
  title: 'Как выглядит прослеживаемость на практике'
  body: |
    Каждой партии присваивается **код лота с 10-летней ERP-прослеживаемостью**. Цепочка, фиксируемая под одним лотом:

    - **Входящий рулон** — сертификат материала, номер рулона, партия ткани с испытаниями (разрыв, надрыв, шов)
    - **Раскрой** — задание ЧПУ-раскроя относительно файла дизайна, зафиксированный процент отходов
    - **Сварка и ламинирование** — линия, оператор, параметры станка по каждой камере
    - **Сборка** — серийный номер доски, тип клапана, партия настила
    - **Испытание** — удержание 18.0 PSI × 24 ч по каждой камере, автоматический брак при падении более 0.50 PSI
    - **Выпуск** — чек-лист из 100 пунктов по каждой доске, подпись директора по качеству на каждую партию
    - **Далее** — Сертификат соответствия вместе с отгрузкой; право на аудит закреплено в договоре

    Запросите образец записи контроля качества до первого заказа — это тот же формат, который вы получите вместе с отгрузкой.

faqs:
  tagline: 'FAQ'
  title: 'Вопросы покупателей о доказательствах'
  items:
    - q: 'Эта страница предназначена только для проверки и не заменяет due diligence?'
      a: 'Верно — эта страница показывает, где можно проверить каждое заявление: регистрацию юридического лица, сертификаты, станки, записи и открытый для аудита завод. Ваши обычные шаги due diligence (проверка регистрации, аудит, сторонняя инспекция) по-прежнему применимы и приветствуются.'
    - q: 'Какое юридическое лицо должно быть указано в моей документации по заказу?'
      a: 'Заказы оформляются с Qingdao Vatrad Group Co., Ltd., работающей как Vatrad (производственное подразделение), при этом iSupfactory является продуктовой линейкой SUP. Договорные документы подписывают вице-президент по продажам, главный инженер и директор по качеству.'
    - q: 'Могу ли я получить копии сертификатов до заказа?'
      a: 'Да — номера сертификатов и записи аудита предоставляются по запросу или в ходе аудита. Перечень опубликован, а не «доступен только по запросу».'
    - q: 'Как самостоятельно проверить партийные протоколы испытаний?'
      a: 'Каждая камера испытывается при 18.0 PSI в течение 24 часов с автоматическим браком при падении более 0.50 PSI; журналы испытаний связаны с серийными номерами и отправляются вместе с Сертификатом соответствия по каждой партии. Предотгрузочная инспекция SGS, TÜV, BV или Intertek по ISO 2859-1 Level II может быть назначена по вашему выбору.'
    - q: 'Распространяются ли сертификаты на аксессуары?'
      a: 'Документация по материалам REACH/RoHS применяется к доскам и аксессуарам, поставляемым в том же заказе, а чек-листы контроля качества охватывают полный комплект — доска, весло, насос, линь и сумка.'
    - q: 'Что происходит с доказательствами после заказа?'
      a: 'Партийная прослеживаемость ERP хранится 10 лет. SOP системы качества и стандарты инспекции остаются доступными для скачивания, а покупатель сохраняет право на аудит в ходе производства согласно договору.'

