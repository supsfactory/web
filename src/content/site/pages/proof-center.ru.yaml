answer:
  label: 'Прямой ответ'
  text: 'Цепочка «заявление — доказательство» выглядит так: каждое утверждение на этом сайте подтверждено регистрацией, сертификатом, станком, документом или протоколом испытаний — и каждое из них можно проверить. iSupfactory — это подразделение разработки и производства продуктов SUP компании Qingdao Vatrad Group Co., Ltd. (зарегистрирована в Циндао с 2012 года). Площадка 12,500 m² работает по ISO 9001:2015, соответствует ISO 25649, имеет документацию о соответствии CE, социальной ответственности BSCI (отчет об аудите — по запросу) и документацию по материалам REACH/RoHS по каждому заказу. Каждая надувная камера испытывается при 18.0 PSI в течение 24 часов с автоматическим браком при падении более 0.50 PSI, а партийные записи хранятся в рамках 10-летней ERP-прослеживаемости. Документация опубликована или предоставляется по запросу, а завод открыт для аудита.'
  verified: 'Сентябрь 2026'

