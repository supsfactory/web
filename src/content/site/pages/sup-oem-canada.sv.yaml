hero:
  tagline: 'Canada'
  title: 'OEM uppblåsbara SUP för Kanada — från Qingdao till ditt lager'
  subtitle: 'Prover inom 7–12 dagar, tillverkning på 25–35 dagar, sjöfrakt på 4–6 veckor till hamnarna i Vancouver, Toronto eller Montreal. FOB Qingdao, CIF eller DDP — samma fabrik, samma QC, samma sexfasutvecklingsprocess som för alla iSupfactory-kunder.'

answer:
  label: 'Kort svar'
  text: 'Kanadensiska varumärken beställer uppblåsbara SUP hos iSupfactory under standardvillkor: MOQ bekräftas av projektkonfigurationen: provcykler med 1–2 st validerar konstruktionen, små pilotserier med 20–50 st testar marknaden på befintliga plattformar och standardvolymserier går med 90–100+ st per design ur en hel drop-stitch-rulle på 150 m. Det första provet skickas 7–12 dagar efter att specifikationerna godkänts, tillverkningen tar 25–35 dagar efter bekräftad PO och deposition, och sjöfrakten tillkommer med 4–6 veckor till de kanadensiska hamnarna — Vancouver på västkusten, Toronto och Montreal i öst. DDP täcker tullhantering och leverans till ditt lager.'
  verified: 'September 2026'

