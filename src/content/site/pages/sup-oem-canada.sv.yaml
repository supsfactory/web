why_canada:
  tagline: 'Varför köpare i Kanada'
  title: 'Byggd för kanadensisk import'
  subtitle: 'Fabriken besvarar de frågor som kanadensiska varumärken och återförsäljare ställer inför sin första container.'
  items:
    - title: 'DDP för planerbara destinationskostnader'
      description: 'DDP omfattar tullhantering och leverans till ditt lager — införseltull, skatter och frakt i ett totalbelopp i CAD eller USD. Det populäraste valet för nya importörer.'
    - title: 'Anknytning till väst- och östkusten'
      description: 'Vi räknar på sjöfrakt till Vancouver eller till Toronto och Montreal via Suezruten — beroende på vilket som ger bäst balans mellan transitid och destinationskostnad.'
    - title: 'Tvåspråkiga produktdokument'
      description: 'CE-, REACH- och tulldokumentationen upprättas för dina målmarknader, så att dina produktdokument fungerar för förpackningskraven på engelska och franska.'
    - title: 'En fabrik, ett kvalitetssystem'
      description: 'Utveckling, prover, tillverkning och QC sker alla i fabriken på 12 500 m² — inga omvägar via mellanhänder, inget prov som produktionen inte kan reproducera.'

process_notes:
  tagline: 'Så fungerar det'
  title: 'Från specifikation till container'
  subtitle: 'Samma sex faser, oavsett om du köper två eller tjugo containrar per år: specifikation, konstruktion, prov, verifiering, verktygsbyggnad, tillverkning — därefter leverans FOB, CIF eller DDP.'
  items:
    - title: '1. Skicka din specifikation'
      description: 'En referensbräda, en skiss eller en konkurrents specifikation räcker. Teknisk verifiering och offert följer inom en arbetsdag.'
    - title: '2. Godkänn provet'
      description: 'Ditt första fysiska prov skickas inom 7–12 dagar med ett godkännandeformulär för konstruktion, tryckfärger och resultaten av tryckprovningen.'
    - title: '3. Tillverkning & export'
      description: 'Cyklerna slutförs på 25–35 dagar med QC-kontrollpunkter under tillverkningen. Packlista, faktura och konossement går före fartyget.'
    - title: '4. Leverans till ditt lager'
      description: '4–6 veckors sjöfrakt till Vancouver, Toronto eller Montreal — med DDP hanterar vi tullhanteringen och leveransen till din dörr.'

faq_section:
  tagline: Vanliga frågor
  title: 'Frågor om import till Kanada'
  questions:
    - q: Hur lång tid tar sjöfrakten till Kanada?
      a: 'Räkna med 4–6 veckor från Qingdaos hamn till de kanadensiska hamnarna — Vancouver på västkusten, Toronto och Montreal i öst — beroende på destination och avgångsschema. DDP-projekt omfattar hela tidslinjen dörr till dörr.'
    - q: Skickar ni DDP till Kanada?
      a: 'Ja. DDP omfattar sjöfrakt, tullhantering, införseltull och skatter plus leverans till ditt lager — ett planerbart totalpris. Även FOB Qingdao och CIF finns tillgängliga.'
    - q: Vad är MOQ för en private label-SUP-import?
      a: 'MOQ bekräftas av projektkonfigurationen: provutvecklingen omfattar 1–2 st, små pilotserier går med 20–50 st på befintliga plattformar och standardvolymserier går med 90–100+ st per design ur en hel drop-stitch-rulle på 150 m.'
    - q: Stöder ni förpackning på engelska och franska?
      a: 'Ja. Vårt prepress-team förbereder tryckfilerna för dina målmarknaders språk och regler — inklusive tvåspråkig EN/FR-förpackning för den kanadensiska marknaden.'
    - q: Kan jag besöka fabriken före beställningen?
      a: 'Ja. Fabriken på 12 500 m² i Qingdao är öppen för kunder — virtuella fabriksvisningar kan bokas online, och fysiska besök leds längs produktionslinjerna och QC-stationerna.'
    - q: Hur startar jag ett projekt från Kanada?
      a: 'Skicka en referensbräda, en skiss eller en specifikation. Den tekniska verifieringen och offerten kommer inom en arbetsdag, och ett NDA undertecknas före varje filutbyte.'

