      icon: 'tabler:world'

customization:
  tagline: Construído segundo a tua especificação
  title: Pontos de especificação OEM
  subtitle: 'Estes pontos de especificação controlas tu num projeto OEM — o teu documento de especificação é o contrato de produção:'
  items:
    - 'Medidas da prancha — comprimento, largura, espessura, rocker e volume segundo os teus desenhos ou os riders de referência'
    - 'Estrutura dos materiais — número e qualidade das camadas de PVC, densidade do drop-stitch, reforços e robustecimentos dos rails'
    - 'Gráficas e cores — o teu artwork com paletes ilimitadas ou o apoio da nossa equipa de design'
    - 'Tapete antiderrapante em EVA — pads de deck cortados à medida, logótipos e cores do deck em cada prancha'
    - 'Pegas e anéis em D — posicionamento, quantidade e especificação do hardware para o teu uso'
    - 'Sistemas de aletas — aleta única, dupla ou tripla e fin box segundo a tua especificação'
    - 'Pás, bombas, leashes e acessórios — o teu pacote, o teu branding'
    - 'Embalagem e montagem comercial — embalagens comerciais, embalagem de transporte marítimo e expositores point-of-sale sob a tua marca'
    - 'Etiquetas e marcas de conformidade — etiquetas de série, logótipos e documentação específica de mercado para a tua região de exportação'

faq_section:
  tagline: FAQ
  title: Perguntas sobre a produção OEM
  questions:
    - q: Como inicio um projeto OEM com o meu design?
      a: 'Envia os teus desenhos, uma prancha de referência ou uma especificação escrita. A nossa verificação técnica confirma a fabricabilidade e fornece uma proposta num dia útil — é a nossa promessa padrão, e se for preciso assinamos uma NDA antes de qualquer troca de ficheiros.'
    - q: Qual é o MOQ para OEM de SUP insufláveis?
      a: 'O MOQ é confirmado com base no projeto — casco e ferramental, variantes de cor e PVC, artwork, embalagem e acessórios. A produção em quantidades padrão corre com 90–100 unidades por lote (uma bobina drop-stitch de 150 m), enquanto os runs piloto partem das 20–50 unidades em plataformas existentes. A lógica de cálculo completa está no nosso guia de MOQ e branding flexível.'
    - q: Qual é o prazo típico para uma encomenda OEM?
      a: 'A produção prossegue durante 25–35 dias a partir da encomenda confirmada e do sinal. A construção dos moldes acrescenta 15–20 dias. As amostras protótipo partem normalmente em 7–12 dias.'
    - q: Podem produzir apenas com base nos meus desenhos existentes?
      a: 'Sim. O OEM constrói diretamente segundo a tua especificação — o design é teu. Os nossos engenheiros verificam a fabricabilidade dos desenhos, sinalizam os conflitos antes da construção dos moldes ou do corte e a amostra aprovada torna-se a referência de produção.'
    - q: Fornecem amostras antes da produção?
      a: 'Sim. Antes de cada run de produção é produzida e aprovada uma amostra física — normalmente em 7–12 dias — e serve de referência para todos os controlos QC subsequentes.'
    - q: Que certificações tem a fábrica?
      a: 'ISO 9001:2015 gestão da qualidade (ao nível da fábrica), BSCI conformidade social (auditoria de fábrica amfori), documentação de conformidade CE para as configurações aplicáveis ao mercado da UE (âmbito de aplicação confirmado com base no projeto), REACH (materiais) e RoHS (acessórios eletrónicos). Documentação de conformidade completa fornecida com cada entrega OEM para os teus mercados de referência.'
    - q: Como é controlada a qualidade num run OEM?
      a: 'A produção corre sob controlo de qualidade em vários níveis — mercadorias em entrada, controlos em processo e ensaio final — com teste de manutenção de pressão de 18,0 PSI durante 24 horas (rejeição automática para além de 0,50 PSI de queda), uma checklist de montagem de 100 pontos e rastreabilidade de lotes ERP de 10 anos por número de série.'
    - q: Quais são as vossas condições de entrega?
      a: 'FOB Qingdao, CIF para os principais portos mundiais ou DDP para parceiros qualificados. Distribuímos em mais de 50 países nos mercados da UE, EUA, AU e Ásia.'

process:
  title: 'O processo OEM — da especificação ao contentor enviado'
  subtitle: 'Sete fases controladas por uma equipa de fábrica, para que cada passo da tua primeira especificação até ao contentor embalado fique documentado e nos prazos.'
  steps:
    - phase: '01'
      title: Verificação da especificação e proposta
      period: 1 dia útil
      items:
        - 'Partilha os teus desenhos, a especificação ou as pranchas de referência — os nossos engenheiros verificam a fabricabilidade.'
        - 'Recebes uma proposta detalhada e um plano de projeto num dia útil.'
    - phase: '02'
      title: Confirmação técnica
      period: Semana 1
      items:
        - 'Medidas do casco, qualidade do drop-stitch, especificações PVC e construção dos rails são confirmadas contra o teu documento.'
        - 'As decisões sobre molde ou plataforma são fixadas — se for preciso, aqui começa a construção de moldes dedicados.'
    - phase: '03'
      title: Protótipo e amostra
      period: 7–12 dias
      items:
        - 'Uma amostra física é produzida e enviada para a tua avaliação — prova em água para as novas formas incluída.'
        - 'A amostra (1–2 unidades) valida a tua especificação antes de qualquer compromisso de quantidade.'
    - phase: '04'
      title: Testes e validação
      period: Em paralelo
      items:
        - 'Retenção de ar, manutenção de pressão, resistência das soldaduras, provas de carga e UV para cada linha de produção.'
        - 'Documentação CE, ISO-9001, BSCI, REACH e RoHS preparada para os teus mercados de exportação.'
    - phase: '05'
      title: Aprovação e confirmação
      period: Após a aprovação da amostra
      items:
        - 'Aprovas a amostra e o artwork; a encomenda e o sinal asseguram o slot de produção.'
        - 'Um plano de pré-produção confirma datas, quantidades, embalagem e porto de carga.'
    - phase: '06'
      title: Produção
      period: 25–35 dias
      items:
        - 'Produção sob controlo de qualidade em vários níveis — mercadorias em entrada, controlos em processo e ensaio final.'
        - 'Dos pedidos piloto (20–50 unidades) em plataformas existentes até às bobinas completas de 150 m (90–100+ unidades) na produção em quantidades padrão.'
    - phase: '07'
      title: Embalagem e envio
      period: 1 dia + trânsito
      items:
        - 'Embalagem de exportação com etiquetas de série do modelo, depois FOB Qingdao, CIF ou DDP para mais de 50 países.'
        - 'Documentação aduaneira, tracking e apoio às reencomendas incluídos em cada fase.'

