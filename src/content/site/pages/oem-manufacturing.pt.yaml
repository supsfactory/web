hero:
  tagline: Produção OEM
  title: 'Produção SUP OEM personalizada — a tua especificação, a nossa fábrica'
  subtitle: 'Trazes o design, o desenho ou um conceito de plataforma testada — nós produzimos à escala de contentor. Verificação técnica num dia útil, amostras em 7–12 dias, produção 25–35 dias após a confirmação da encomenda e o sinal, enviada sob a tua marca.'

answer:
  label: 'Resposta breve'
  text: 'A produção OEM prossegue segundo a tua especificação. O MOQ é confirmado com base no projeto, não como número fixo: a produção em quantidades padrão corre com 90–100 unidades por lote de uma bobina de tecido drop-stitch de 150 m, os runs piloto partem das 20–50 unidades em plataformas existentes e cada projeto passa por uma amostra (1–2 unidades) antes da quantidade. As amostras partem em 7–12 dias; a produção prossegue durante 25–35 dias após a confirmação da encomenda e o sinal, mais 15–20 dias se for preciso novo ferramental.'
  verified: 'September 2026'

