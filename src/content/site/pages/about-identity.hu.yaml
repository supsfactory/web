answer:
  label: 'Röviden'
  text: 'Jogi entitás: Qingdao Vatrad Group Co., Ltd. Gyártódivízió: VATRAD (az iSupfactory márka). Gyár: Laixi, Qingdao, Shandong, Kína. Tevékenységi kör: felfújható SUP deszkák, evezők és tengeri felfújható termékek OEM-, ODM- és private-label gyártása. Tanúsítások: ISO 9001:2015, CE (EU-r célú modellek), BSCI, REACH, RoHS. Nem értékesítünk saját márkanévvel – minden általunk gyártott deszka a vevő márkáját viseli.'
  verified: '2026. szeptember'

