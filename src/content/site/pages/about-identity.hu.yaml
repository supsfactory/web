manufacturing_scope:
  heading: 'Gyártási tevékenység'
  body: |
    Gyártási tevékenységünk a felfújható SUP és tengeri termékek teljes gyártási láncát lefedi – a beérkező alapanyagok vizsgálatától a végső csomagolásig és az exportdokumentációig.

    - **Termékkategóriák**: felfújható SUP deszkák (all-around, touring, surf, fishing, yoga, race), felfújható kajak, felfújható csónakok, evezők, pumpák és kiegészítők.
    - **Kivitelezési típusok**: egyrétegű PVC, kétrétegű PVC, PVC-bevonatú drop-stitch mag. A kivitelezési specifikációk projektenként testreszabhatók.
    - **Együttműködési modellek**: OEM (vevő által birtokolt terv), ODM (a gyár fejlesztette a vevő briefje alapján), private-label / co-branding (a márka már validált platformokon).
    - **Tanúsítások**: ISO 9001:2015 (gyári minőségirányítás), CE (EU-r célú modellek, a hatókör projektenként meghatározva), BSCI (szociális megfelelőség), REACH (vegyi biztonság), RoHS (korlátozott anyagok).
    - **Gyártási kapacitás**: 120,000+ deszka évente, körülbelül 10.000 darab havonta 4 automata soron. A kapacitás előzetes tervezéssel bővíthető.

brand_positioning:
  heading: 'A márka pozicionálása'
  body: |
    Az iSupfactory egyértelműen körülhatárolt pozíciót tölt be a piacon – nem márka vagyunk, hanem gyártó. Ez a megkülönböztetés minden tevékenységünk aspektusát meghatározza:

    - **Soha nem értékesítünk saját márkanévvel.** Minden általunk gyártott deszka a vevő márkáját viseli. Semmilyen piacon és csatornán nem versenyzünk ügyfeleinkkel. Ez a politika nem tárgyalható meg.
    - **Nem vagyunk kereskedőcég.** Mi működtetjük a gyárat. A minőség-ellenőrzést, a mérnöki munkát, a termelésprogramozást és az exportdokumentációt teljes egészében saját hatáskörünkben kezeljük. Az Ön megrendelése és a gyártócsarnok között nincsenek közvetítők.
    - **A felfújható termékek a specializációink.** Ez nem másodlagos tevékenység, és nem a termékkategóriák egyike. A felfújható SUP platformok és a tengeri termékek jelentik a központi szakértelmünket. Minden gép, minden folyamat és minden minőségi ellenőrzési pont erre a termékkategóriára van optimalizálva.
    - **Professzionális vevőket szolgálunk ki.** Ügyfeleink márkák, forgalmazók, üdülők, klubok és iskolák – nem magánfogyasztók. Áraink, MOQ-struktúránk, dokumentációnk és kommunikációnk B2B-kapcsolatokra vannak kialakítva.

evidence_review:
  tagline: 'Bizonyítékok és ellenőrzés'
  title: 'ELLENŐRZÖTT SPECIFIKÁCIÓK'
  body: 'Az ezen az oldalon szereplő valamennyi szervezeti és gyártási állítás ellenőrizhető. Az ISO 9001-tanúsítvány, a BSCI-jelentés, az üzleti engedély és a gyárbejegyzési dokumentumok kérésre rendelkezésre állnak. A gyárlátogatások szívesen fogadottak. A specifikációkat legutóbb 2026 szeptemberében ellenőriztük.'

faqs:
  tagline: GYIK
  title: 'Márkaidentitás – gyakori kérdések'
  items:
    - q: 'Az iSupfactory különálló vállalat a Qingdao Vatrad Grouptól?'
      a: 'Nem. Az iSupfactory a VATRAD vevőorientált márkája, amely a Qingdao Vatrad Group Co., Ltd. tengeri gyártódivíziója. Minden megrendelés jogi szerződő fele a Qingdao Vatrad Group Co., Ltd. A gyár, a csapat és a minőségügyi rendszer egyetlen működést alkot.'
    - q: 'Értékesítenek deszkát saját márkanévvel?'
      a: 'Nem. Kizárólag ügyfeleink márkái alatt gyártunk, és semmilyen piacon nem versenyzünk velük. Ez alapvető politika, nem átmeneti álláspont. Ha a piacon iSupfactory-jelölésű deszkát talál, az nem a mi gyárunkból származik.'
    - q: 'Meglátogatható a gyár?'
      a: 'Igen. A gyárlátogatásokat szívesen fogadjuk, és strukturált auditot tudunk szervezni, amely a teljes gyártási folyamatot, a minőségi ellenőrzési pontokat, az alapanyagraktárt és a dokumentáció ellenőrzését fogja le. Vegye fel a kapcsolatot egy látogatás időzítéséhez.'
    - q: 'Milyen kapcsolat van a VATRAD és az iSupfactory között?'
      a: 'A VATRAD a Qingdao Vatrad Group gyártódivíziójának elnevezése. Az iSupfactory a vevőorientált nemzetközi márka, amelyet az OEM-, ODM- és private-label gyártási szolgáltatásokhoz használunk. Mindkettő ugyanarra a működésre utal – a laixi (Qingdao) tengeri gyártódivízióra.'

