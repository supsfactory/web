nc_intro:
  tagline: Řízení nevyhovujících výrobků
  title: Co se stane, když výrobek nesplňuje kritéria
  body: |
    Výrobky nebo součástky, které nesplňují stanovená kritéria přijetí, se zjistí a začnou řídit, aby se zabránilo neúměrnému použití, dalšímu zpracování nebo odeslání. Použitelná kritéria přijetí vycházejí ze schváleného vzorku, technické specifikace, grafiky, kusovníku, požadavků na obaly a plánu kontroly projektu.

    Nevyhovující položky se posuzují za účelem určení zasaženého rozsahu a vhodného opatření. Podle konkrétního problému může být položka zadržena, opravena podle řízených pokynů, vyměněna, odmítnuta nebo jinak vyřízena schváleným postupem. Opravené či opravené položky se před uvolněním znovu zkontrolují. Uvolnění zásilky je povoleno až po dokončení příslušných záznamů o kvalitě a potvrzení, že výrobek splňuje použitelná kritéria přijetí.

nc_flow:
  tagline: Standardní uzavřený cyklus o 7 krocích
  title: Od zjištění po nápravnou akci
  subtitle: 'Jeden řízený cyklus pro každý nesoulad: zjištění, karanténa, posouzení, oprava nebo výměna, opětovná kontrola, uvolnění nebo odmítnutí, zlepšení.'
  steps:
    - step: '01'
      title: Zjištění
      desc: 'Každý zjištěný nesoulad se zaznamená vůči dotčenému výrobku, šarži či součástce a posoudí se proti použitelným požadavkům projektu. Zjištění může nastat při vstupní kontrole materiálu, při kontrole během výroby, při konečném zkoušení, při balení nebo při kontrole zákazníkem či třetí stranou.'
    - step: '02'
      title: Karanténa
      desc: 'Položky se jasně označí a převedou do stavu řízené blokace nebo karantény, aby se zabránilo neúměrnému použití, dalšímu zpracování nebo odeslání. Štítky HOLD / QUARANTINE / REJECTED uvádějí číslo NCR, SKU, šarži, množství, popis vady a datum.'
    - step: '03'
      title: Posouzení
      desc: 'Posoudí se zasažený rozsah a vhodné opatření: jednotlivý kus, směnová šarže, celá šarže nebo více šarží — napříč společnými šaržemi materiálu, revizemi grafiky, fázemi procesu a revizemi dokumentů. Podle potřeby se zavádí další izolace nebo přísnější kontrola.'
    - step: '04'
      title: Oprava nebo výměna
      desc: 'Povolená oprava probíhá podle schválených pokynů, které určují dotčenou položku, metodu, materiály, kontrolní body a požadavky na opětovnou kontrolu. Neschválené změny výrobní specifikace, grafiky, konfigurace doplňků či obalů nikdy nejsou přípustné. Náhradní položky znovu vstupují do příslušných kontrolních vrat.'
    - step: '05'
      title: Opětovná kontrola
      desc: 'Opravené či opravené položky se znovu zkontrolují proti použitelným kritériím přijetí. Původní nevyhovující vlastnost a všechny související vlastnosti potenciálně dotčené opravou se ověří před uvolněním — nezávislým QC a u oprav nepropustnosti se zcela novým 24hodinovým cyklem tlakové zkoušky.'
    - step: '06'
      title: Uvolnění nebo odmítnutí
      desc: 'Výrobek se uvolní až po dokončení požadované opětovné kontroly a potvrzení souladu s použitelnými požadavky projektu oprávněnými pracovníky kvality. Položky, které nelze uvést do souladu, se odmítnou, vymění, vrátí nebo vyřídí podle řízených postupů — včetně fyzického zničení za dohledu.'
    - step: '07'
      title: Nápravná akce
      desc: 'Opakované, významné nebo systémové nesoulady se posuzují z hlediska kořene problému a nápravné akce (CAPA). Zlepšení mohou zahrnovat aktualizaci pracovních pokynů, kontrolu materiálu, kontrolní body, školení, řízení dodavatelů nebo řízení dokumentů.'

