faqs:
  tagline: FAQ
  title: Často kladené otázky o kvalitě a řízení vad pro kupující z celého světa
  items:
    - q: 'Jak zaručujete, že opravené desky splňují úplné bezpečnostní normy?'
      a: 'Každá opravená deska se považuje za novou jednotku a musí od nuly absolvovat přesně stejný úplný zkušební cyklus — u oprav nepropustnosti úplnou 24hodinovou tlakovou zkoušku. Uvolňující validaci provádějí nezávislí kontroloři QC, nikoli operátoři oprav.'
    - q: 'Bude továrna odesílat desky s drobnými kosmetickými odchylkami bez upozornění?'
      a: 'Nikdy. Jakákoli odchylka dotýkající se zákazníkem schválených referenčních vzorků, grafiky loga, barevných variant nebo obalů vyžaduje formální písemnou dohodu o výjimce podepsanou zákazníkem před uvolněním zásilky.'
    - q: 'Co se stane, když opravená deska neprojde opětovnou kontrolou?'
      a: 'Deska se neuvolní. Vrátí se k novému posouzení a pokud ji nelze uvést do souladu, je vyměněna, odmítnuta nebo zničena podle protokolu likvidace za dohledu. Opakované selhání téže třídy vady spouští CAPA směřující ke kořeni problému.'
    - q: 'Mohou vadné desky být prodávány jako tovární zmet nebo přes jiné kanály?'
      a: 'Ne. Neopravitelné výrobky mimo specifikaci se fyzicky zničí podle protokolu likvidace za dohledu — kovové části se ustřihnou, jádro a okraje přeříznou, video se zaznamená s hashem SHA-256 a archivuje se nejméně 5 let. Protokol o likvidaci a zničení podepisují ředitel QA a ředitel závodu.'
    - q: 'Jak se při zjištění vady posuzuje zasažený rozsah?'
      a: 'Rozsah se přezkoumává podle identifikace výrobku, výrobní šarže, šarže materiálu nebo součástky, fáze procesu a použitelné revize dokumentu. Pokud je zapojena stejná šarže materiálu, revize grafiky či pracoviště, dotčené výrobky se izolují a příslušně zkontrolují.'
    - q: 'Potřebujeme Vaše schválení, než udělíte výjimku?'
      a: 'Ano. Jakékoli přijetí v rámci zdokumentované výjimky, která se dotýká požadavků zákazníka — schválených vzorků, specifikace, grafiky, obalů nebo kritérií přijetí — vyžaduje písemný souhlas zákazníka před uvolněním. Bez něj je výrobek opraven podle původní požadavky, vyměněn nebo odmítnut.'
    - q: 'Jakou dokumentaci při nesouladu dostaneme?'
      a: 'Záznam NCR zahrnuje číslo NCR, fázi zjištění, výrobek či SKU, šarži, použitelné revize dokumentů, popis vady, izolaci, přijaté opatření, odkaz na pokyn k opravě, výsledek opětovné kontroly a schválení uvolnění či uzavření — k dispozici dle dohody o kvalitě Vašeho projektu.'

