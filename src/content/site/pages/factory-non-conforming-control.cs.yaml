  tagline: Základy důvěry kupujícího
  title: Tři kontroly, které chrání Vaši značku
  subtitle: 'Proces je navržen kolem otázek, které si zahraniční kupující skutečně kladou: budou se problémy skrývat, dostane se oprava z pod kontroly a budou opravené desky znovu ověřeny.'
  features:
    - icon: 1
      icon_bg: blue
      title: Pouze řízené pokyny
      desc: 'Opravu přísně řídí schválené standardní pokyny k opravě (SRI). Neschválené úpravy na místě, změny specifikací nebo úpravy grafiky bez písemného povolení jsou přísně zakázány.'
    - icon: 2
      icon_bg: green
      title: Nezávislá opětovná kontrola
      desc: 'Opravené desky podléhají 100% opětovné kontrole kontrolory QA proti původním kritériím přijetí. Opravy nepropustnosti vyžadují zcela nový, úplný 24hodinový cyklus tlakové zkoušky — nikdy jen částečnou překontrolu.'
    - icon: 3
      icon_bg: purple
      title: Oprávněný podpis a vysledovatelnost
      desc: "Uvolnění zásilky je povoleno výhradně po úplném vyplnění dokumentace NCR a podpisu oprávněného QC, přičemž stav šarže se přesune z HOLD na RELEASED. Systémové nebo opakované odchylky automaticky spouštějí postupy CAPA směřující ke kořeni problému."

