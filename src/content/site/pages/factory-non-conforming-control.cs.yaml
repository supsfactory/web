hero:
  tagline: Řízení nevyhovujících výrobků
  title: 'Proces izolace, opravy a opětovné kontroly nevyhovujících výrobků'
  subtitle: 'V QINGDAO VATRAD GROUP.,LTD. nevyhovující deska nikdy nepokračuje ve výrobě. Jakýkoli výrobek nebo součástka, která nesplní stanovená kritéria přijetí, se zjistí, zapíše do Protokolu o nesouladu (NCR), označí a oddělí, vyhodnotí se zasažený rozsah a rozhodnutí se přijme na příslušné úrovni pravomoci. Povolená oprava probíhá podle řízených pokynů, opravené položky se opětovně kontrolují proti původním kritériím přijetí — včetně úplného přezkoušení tam, kde je to nutné — a výrobek se odesílá až po podpisu kvality. Tato stránka představuje náš řízený standard podle ISO 9001:2015, části 8.7, a důkazy vysledovatelnosti, které za ním stojí.'
  actions:
    - text: Stáhnout SOP řízení NČV (PDF)
      variant: primary
      href: 'https://assets.isupfactory.com/site/downloads/non-conforming-product-control-sop-iso-8-7.pdf?dl=1'
    - text: Stáhnout Protokol o likvidaci a zničení (PDF)
      href: 'https://assets.isupfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf?dl=1'
    - text: Vyžádat posouzení kvality
      href: /cs/contact

answer:
  label: 'Přímá odpověď'
  text: 'Nevyhovující výrobky se v QINGDAO VATRAD GROUP.,LTD. nikdy netají, neopravují neformálně ani neuvolňují bez ověření. Každý zjištěný nesoulad se zaznamená vůči dotčenému výrobku, šarži či součástce a propojí s NCR. Položka se označí (HOLD / QUARANTINE / REJECTED), fyzicky oddělí a zasažený rozsah se posoudí podle šarže, šarže materiálu, fáze procesu a revize dokumentu. O rozhodnutí se rozhodne na úrovni pravomoci odpovídající závažnosti vady: drobné problémy se podepisují na úrovni linky, závažné vyžadují rozhodnutí vedoucího QC a technického inženýra s řízeným pokynem k opravě a 100% nezávislou opětovnou kontrolou a kritické vyžadují rozhodnutí rady pro hodnocení materiálu a písemný souhlas zákazníka tam, kde je nutný — jinak povinné zničení za dohledu. Opravené položky se opětovně kontrolují proti původním kritériím přijetí, opravám nepropustnosti se přidělí zcela nový cyklus tlakové zkoušky a uvolnění zásilky nastane až po podpisu oprávněné osoby odpovědné za kvalitu. Opakované či systémové problémy spouštějí nápravnou akci o kořeni problému (CAPA).'
  verified: 'září 2026'

