nc_severity:
  tagline: Závažnost vady a pravomoc
  title: Klasifikace závažnosti a pravomoc k rozhodování
  subtitle: Ne každý nesoulad se řeší na stejné úrovni — pravomoc k rozhodování roste se závažností vady, od podpisu na úrovni linky až po radu pro hodnocení materiálu a souhlas zákazníka.
  headers:
    severity: Závažnost
    examples: Typické příklady
    authority: Pravomoc k rozhodnutí a kontrola
    control: Podmínka uvolnění
  rows:
    - severity: 'Drobná'
      examples: 'Skládaný roh krabice, drobné nekritické posunutí doplňku'
      authority: 'Podpis na místě vedoucím QC dané dílny a mistrem linky, výměna nebo uvolnění'
      control: 'Zaznamenáno v NCR; bez vlivu na funkci výrobku nebo požadavky zákazníka'
    - severity: 'Závažná'
      examples: 'Pomalý únik přes ventil, posunutí EVA mimo toleranci (>2 mm), chybějící doplněk'
      authority: 'Vedoucí QC a technický inženýr vydají řízený pokyn k opravě (SRI)'
      control: '100% nezávislé přezkoušení původní nevyhovující a dotčených vlastností před uvolněním'
    - severity: 'Kritická'
      examples: 'Poškození komory drop-stitch, bubline nebo prasklina na výztuze okraje pod vysokým tlakem, chybný tisk loga zákazníka nebo odchylka barvy'
      authority: 'Rozhodnutí rady pro hodnocení materiálu (MRB); písemný souhlas zákazníka tam, kde je nutný'
      control: "Bez oprávněného souhlasu není uvolnění možné; jinak povinné fyzické zničení za dohledu"

nc_matrix:
  tagline: Matice konstrukčních protokolů
  title: Matice opatření a opětovné kontroly vad SUP
  subtitle: 'Standardní konstrukční protokoly používané u nejčastějších výrobních odchylek — stejné kvantifikované parametry, které mohou zákazníci ověřit při auditech.'
  headers:
    defect: Kategorie vady
    protocol: Řízený protokol opatření
    validation: Nezávislá opětovná kontrola a validace
  rows:
    - defect: 'Pomalý únik přes ventil'
      protocol: 'Desku izolovat. Rozebrat jádro ventilu kalibrovaným momentovým nástrojem (25 N·m), vyčistit vnitřní závit, vyměnit silikonový O-kroužek a znovu utáhnout momentem.'
      validation: 'Ponorná zkouška v bublinkové kapalině; dofukování na 18 PSI a úplné 24hodinové přezkoušení poklesu tlaku (ΔP ≤ 0,05 PSI).'
    - defect: 'Bubliny ve švu okrajové výztuhy'
      protocol: 'Směnovou šarži dát do karantény. Delaminovat z bublinového místa tryskou s ohřevem, povrch vyčistit rozpouštědlem, nanést dvousložkové lepidlo PU pod tlakem 5 bar.'
      validation: '100% vizuální a hmatová kontrola švu; konstrukční zkouška zkušebním tlakem (18,0 PSI) plus 24hodinové udržení nepropustnosti.'
    - defect: 'Posunutí podložky EVA'
      protocol: 'Sundat nástrojem s regulovanou teplotou s podporou tepla (80°C). Znovu zarovnat pomocí přesného akrylátového polohovacího rámečku.'
      validation: 'Ověření vůle (≤ ±1,5 mm), kontrola souměrnosti kosočtverečného vzoru, 100% zkouška přilnavosti okraje.'
    - defect: 'Překlep v brandingu / logu'
      protocol: 'Okamžitě zastavit tiskovou linku. Zadržet všechny vytištěné díly. Prověřit vektorovou revizi se zákazníkem; žádné neschválené změny.'
      validation: 'Kontrola barvy spektrofotometrem (ΔE ≤ 1,5); 100% vizuální kontrola souososti textu proti reviznímu vektorovému masteru PDF podepsanému zákazníkem.'
    - defect: 'Neshoda obalu / chybějící SKU'
      protocol: 'Exportovou paletu dát do karantény. Vybalit a provést 100% položkovou kontrolu kusovníku (pumpička, žebro, leash, pádlo, opravná hadička).'
      validation: 'Inline dynamická elektronická validace kontrolní váhy (±30 g odchylka); ověření optickým 2D skenerem čárových kódů.'

nc_scrap:
  tagline: Nulový únik na trh
  title: Likvidace a zničení za dohledu — protokol proti odchýlení zmetu
  body: |
    Zahraniční značky potřebují jistotu, že vadné desky nikdy nedosáhnou sekundárního retailu, šedých trhů ani kanálů elektronického obchodování. Desky, které nelze uvést do souladu, se zničí podle protokolu za dohledu a s dokumentací:

    **1. Ustřižení kovových částí a doplňků.** Pod dohledem ředitele QA hydraulickými nůžkami odstraní všechny D-kroužky z nerezové oceli 316, popruhy nosného madla a přezky batohů. Sestava nafukovacího ventilu a základna držáku žebra (US-Box / žebro na zacvaknutí) se vyříznou u kořene desky, čímž se odstraní všechny použitelné součástky.

    **2. Rozříznutí drop-stitch a přeříznutí okrajů.** Vnitřní jádro drop-stitch se prořezne napříč deskou a palubou hlubokými křížovými zářezy (≥ 50 cm na řez) a zesílené boční výztuhy se přeřeznou nejméně na 4 úseky — tím se trvale zničí těsnost a vztlak.

    **3. Video a fotografický trezor.** Zničení se zaznamená jako nestřižené video 1080p se záběry na sériový čárový kód, proces ustřižení, rozříznutí jádra a konečnou zváženou hromadu zmetu. Video se hashuje (SHA-256) a archivuje na řízeném serveru po dobu ≥ 5 let.

    **4. Certifikovaná likvidace odpadu.** Všechny úlomky PVC a drop-stitch se zváží, zapíší do evidence odchozího odpadu a odvezeny výhradně kvalifikovanými partnery v oblasti recyklace polymerů — žádné zbytky neopouštějí závod jiným kanálem.

    > **Záruka ochrany značky:** QINGDAO VATRAD GROUP CO., LTD. garantuje 100% zničení neopravitelných plavidel mimo specifikaci. Žádné zmetové ani poškozené desky z továrny se nikdy nedostanou do sekundárního retailu, na šedé trhy ani do kanálů elektronického obchodování. Protokol o likvidaci a zničení (VAT-QA-SCRAP-CERT-2026) zaznamenává výrobek, šarži, závěr MRB, fotografie z dohledu a dvojitý podpis ředitele QA a ředitele závodu.

