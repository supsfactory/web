  subtitle: '6 min de citire'

answer:
  label: 'Răspuns direct'
  text: 'Grosimea pune rigiditatea în schimbul stabilității: 4" (10 cm) este cea mai rigidă, cea mai ușoară și cea mai rapidă — ideală pentru tură și curse; 5" (12.7 cm) este alegerea potrivită pentru majoritatea vâslașilor; 6" (15.2 cm) maximizează stabilitatea primară pentru yoga și vâslașii mai grei (100+ kg). O secțiune transversală mai subțire este structural mai rigidă, astfel încât o placă de 4" la 15 PSI se îndoaie mai puțin decât o placă de 6" la 25 PSI.'
  verified: 'Septembrie 2026'

content_html: |
  <h2>Cele trei grosimi standard</h2>

  <h3>4" (10 cm) – Tură și performanță</h3>
  <ul>
    <li>Rigiditate maximă – deformare redusă sub sarcină</li>
    <li>Cea mai ușoară – mai puțin material, volum de aer mai mic</li>
    <li>Ținută de direcție excelentă – oscilație laterală redusă</li>
    <li>Cea mai rapidă – rezistență redusă, glisare mai ușoară</li>
    <li>Ideal pentru: tură, curse, vâslere de fitness, vâslași cu experiență</li>
  </ul>

  <h3>5" (12.7 cm) – Uz general</h3>
  <ul>
    <li>Rigiditate bună – raport echilibrat între încovoiere și rigiditate</li>
    <li>Greutate moderată – consum standard de material</li>
    <li>Stabilitate primară și secundară bună</li>
    <li>Ideal pentru: vâslere recreativă, începători, utilizare ocazională pe lacuri și râuri</li>
  </ul>

  <h3>6" (15.2 cm) – Stabilitate și yoga</h3>
  <ul>
    <li>Stabilitate primară maximă – flotabilitate mare</li>
    <li>Cea mai grea – mai mult material PVC, volum de aer mai mare</li>
    <li>Cea mai lentă – rezistență mai mare, glisare mai greu de menținut</li>
    <li>Ideal pentru: yoga/fitness, vâslași grei (100+ kg), condiții foarte agitate</li>
  </ul>

  <h2>Analiză de inginerie</h2>
  <p>Rigiditatea unei plăci SUP gonflabile este determinată de presiunea interioară a aerului și de momentul de inerție al secțiunii transversale a plăcii. La 20 PSI, o placă de 4" prezintă aproximativ 30% deformare mai mică sub sarcină decât o placă de 6" cu aceeași lățime și lungime. Stabilitatea primară rezultă din lățimea la linia de apă și din flotabilitate; stabilitatea secundară este influențată de forma bordurii și de lățimea plăcii.</p>

  <h2>Grosimea în funcție de greutatea vâslașului</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Greutatea vâslașului</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Grosime recomandată</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Sub 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" sau 6"</td></tr>
      <tr><td class="p-3 border">Peste 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Compromisul dintre grosime și PSI</h2>
  <p>O eroare frecventă este aceea că un PSI mai ridicat poate compensa o grosime excesivă. La 25 PSI, o placă de 6" prezintă mai multă încovoiere decât o placă de 4" la 15 PSI, deoarece momentul de inerție geometric domină ecuația rigidității. Pentru vâslașii orientați spre performanță, o placă mai subțire la o presiune mai mică este superioară unei plăci mai groase la o presiune mai mare.</p>

  <h2>Gama Vatrad</h2>
  <ul>
    <li><strong>Plăci de 4":</strong> seria Cheetah Touring – plăci SUP de tură de 12' x 30" x 4" pentru fitness și vâslere pe distanțe lungi</li>
    <li><strong>Plăci de 5":</strong> seria Cheetah All-Round – 10'6" x 32" x 5" pentru utilizare recreativă</li>
    <li><strong>Plăci de 6":</strong> seria Cheetah Ultra-Stable – 10' x 34" x 6" pentru yoga, vâslași de talie mare și platforme foto</li>
  </ul>
  <p>Toate plăcile folosesc miezuri drop-stitch de 1,680 DTEX cu presiune nominală de 15 PSI și învelișuri laminate din PVC de 1.2 mm.</p>
  <p>Grosimea, PSI-ul și specificația materialului sunt complet configurabile pentru linii personalizate — vedeți cum <a href="/ro/oem-manufacturing">proiectăm plăci pentru mărcile OEM și private-label</a> și parcurgeți construcția plăcilor în <a href="/ro/factory">sala de producție</a>.</p>

