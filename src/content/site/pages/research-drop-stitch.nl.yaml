answer:
  label: 'Kort antwoord'
  text: 'Drop-stitch is een stof waarvan polyester draadbrugjes de boven- en onderkant van PVC op een vaste afstand houden — zo maakt de luchtdruk de plank stijf. Vatrad kernen: 1,680 DTEX, 2 draden per vierkante inch, buitenlaminaat in PVC van 1.2 mm, ontworpen voor 15 PSI, gevalideerd met een 24-uurs drukbehoudtest op 18.0 PSI.'
  verified: 'September 2026'

