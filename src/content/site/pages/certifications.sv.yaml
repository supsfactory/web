quality_basis:
  tagline: Kvalitetsgrund
  title: 'Vad som avgör produktacceptansen'
  subtitle: 'De slutliga acceptanskriterierna fastställs före produktionen frigörs. De kontrollerade projektdokumenten definierar vad som ska tillverkas, hur detaljerna verifieras och vad som ska kontrolleras före leverans — godkänt av köparen och låst i kvalitetsinspektionsplanen (QIP). Varje ändringsansökan går en dokumenterad ändringskontroll igenom, aldrig tyst vid linjen.'
  items:
    - title: 'Godkänt prov'
      description: 'Den fysiska referensbräda som köparen godkänt och undertecknat. Varje färdig bräda jämförs med den avseende mått, profil, styvhet och finish.'
      icon: tabler:medal
    - title: 'Teknisk specifikation'
      description: 'Material, konstruktion och måttsatta ritningar, låsta till ett revisionsnummer. FAI verifierar den första artikeln exakt mot denna revision.'
      icon: tabler:file-check
    - title: 'Godkänd grafik'
      description: 'Grafik, tryckoriginal och placering godkända och låsta per version före skärningen — så att varje däck levereras med det utseende varumärket godkänt.'
      icon: tabler:palette
    - title: 'Kundgodkänd BOM'
      description: 'Stycklista — bräda, paddel, pump, leash, väska, manual — bekräftad av köparen. PSI verifierar att satsen är 100 % komplett mot denna BOM.'
      icon: tabler:list-checks
    - title: 'Krav på förpackning och märkning'
      description: 'Kartongstruktur, märkningar, streckkoder, etikettinnehåll och leveransmärkning dokumenterades skriftligt. Streckkodernas läsbarhet och märkningarnas noggrannhet verifieras i PSI.'
      icon: tabler:package
tests:
  - title: Trycktest
    description: De uppblåsbara kammarna utsätts under längre perioder för tryck som överstiger deras rekommenderade driftgränser. Detta verifierar lufttätheten och den strukturella integriteten hos material och sömar och garanterar att produkten tål avsedd användning och eventuell övertryck utan att brista eller läcka.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Uppblåsbar SUP-kammare under trycktest som verifierar lufttätheten
  - title: Slagtest
    description: Produkterna utsätts för kontrollerade slag med olika vikter och vinklar. Detta bedömer materialets motstånd mot perforation, revor och kollisionsskador från hinder i vattnet och visar hållbarhet och livslängd.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Slagtestutrustning som kontrollerar båtarnas materialmotstånd mot perforation
  - title: UV-beständighetstest
    description: Materialprover utsätts för accelererad UV-strålning för att verifiera att de inte gulnar, spricker eller tappar styrka med tiden. Varje PVC-parti testas för solnedbrytning före produktionen.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: PVC-materialprover utsatta för accelererad UV-strålning under beständighetstestet
  - title: Slitstyrketest
    description: Materialprover gnids under kontrollerat tryck över slipande ytor under ett fast antal cykler. Detta mäter materialets förmåga att motstå slitage från upprepad användning och kontakt med sand, sten eller andra ytor, vilket garanterar långsiktig hållbarhet.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Slitstyrkemaskin som gnider ett prov av PVC-tyg för att mäta slitstyrkan
  - title: Prestandatest i låg temperatur
    description: Produkterna testas i kalla miljöer för att bedöma funktionalitet och hållbarhet under varierande temperaturförhållanden och förhindra mjukning eller revor i kallare vatten. Avgörande för båtar avsedda för vinterbruk eller höga latituder.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Uppblåsbar produkt i ett kylrum under prestandatest i låg temperatur
  - title: Flyt- och bärkraftstest
    description: Produkterna testas med olika vikter för att fastställa maximal bärkraft och säkerställa att de bär användare och utrustning på ett säkert sätt. Modellernas nominella kapacitet verifieras före frigörning.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Flyt- och bärkraftstest med vikter på uppblåsbara båtar
  - title: Vändsvärtest
    description: Produkterna testas på sin reaktion på paddel- eller motorinput, där vändradie och hanterbarhet bedöms. Sjöprov validerar att det verkliga beteendet stämmer överens med designspecifikationerna.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Vändsvärtest i vattnet av SUP-skov och uppblåsbara båtar
  - title: Tätningstest
    description: Helt monterade produkter sänks ner eller utsätts för vattenstrålar för att kontrollera läckage i sömar, ventiler eller material. Varje båt genomgår ett obligatoriskt tätningstest före leverans.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Tätningstest genom nedsänkning som kontrollerar sömar och ventiler för läckage
qc_flow:
  tagline: Inspektionsprocessen i 7 faser
  title: 'Sju kontrollerade kvalitetskontrollpunkter, från början till slut'
  subtitle: 'Varje punkt nedan definieras i det projektspecifika kvalitetsinspektionsplanen (QIP) med inspektionsobjekt, metod, acceptanskriterier och dokumentationsoutput. De tvåspråkiga rapporthäftena är verkliga kontrollerade register — öppna ett för att se den faktiska strukturen.'
  obj_label: Inspektionsobjekt
  method_label: Inspektionsmetod
  criteria_label: Acceptanskriterier
  record_label: Dokumentationsoutput
  stages:
    - stage: STAGE 01
      title: 'Projektkvalitetsplanering (PPM)'
      summary: 'Mötet före produktionen fastställer omfattning, baslinje och inspektionsplan före starten på linjen.'
      checks:
        - 'Produktnamn, intern kod, kund-SKU, ordernummer och parti-definition registreras.'
        - 'Brädtyp, drop-stitch-kärna, material, kantband, EVA, ventiler och finsystem specificeras.'
        - 'Grafikfilens namn, version, färger, logotypens placering och tryckyta låsas och godkänns.'
        - 'BOM — varje artikel per sats med antal, färg, artikelnummer och ersättningsregler — är godkänd av kunden.'
        - 'Förpackning, märkning, streckkoder, manualernas språk och villkor för tredjepartsinspektion fastställs skriftligt.'
      object: 'Projektomfång mot kundkrav — material, mått, grafik, förpackning, målmarknad och tillämpliga normer.'
      method: 'Möte före produktion med försäljning, konstruktion och QC; undertecknande av golden sample; utfärdande av kvalitetsinspektionsplanen (QIP) för ordern.'
      criteria: 'Alla fem baslinjerna godkänns och låses före start av serieproduktionen. Olösta punkter blockerar produktionsfrigörningen.'
      record: 'QIP + PPM-protokoll, protokoll från provgodkännandet.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: Möte före produktion med bedömning av golden sample och kvalitetsinspektionsplan för en OEM SUP-order
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Ladda ner QIP (PDF)'
    - stage: STAGE 02
      title: 'Inkommande varukontroll (IQC)'
      summary: 'Råvarorna verifieras mot den godkända leverantörsspecifikationen innan de går in i produktionen.'
      checks:
        - 'Drop-stitch-tyg, PVC-rullar, kantmaterial och EVA deckpad kontrolleras mot det godkända provet — färg, tjocklek, vikt och ytfel.'
        - 'Ventiler, fin box, D-ringar, handtag och tillbehör kontrolleras på typ, mått, yta, rost och korrekt funktion.'
        - 'Pumpar, paddlar, leashar, väskor och reparsatseter verifieras på modell, färg och projektkonfiguration.'
        - 'Leverantörscertifikat (COA), materialdeklarationer och REACH/RoHS-dokumentation undersöks för varje parti.'
        - 'Icke-konformiga partier blockeras och kasseras innan materialet når linjen.'
      object: 'Drop-stitch-tyg, PVC-rullar, ventiler, fenor, tillbehör och förpackningsmaterial mot den godkända specifikationen och leverantörernas kvalitetsintyg.'
      method: 'Visuella kontroller, måttkontroller och viktkontroller; stickprov enligt AQL; materialcertifikat granskade; godkänd leverantörslista tillämpad.'
      criteria: 'Uppfyller den godkända specifikationen och certifikaten. Icke-konformiga partier blockeras och kasseras före frigörning till linjen.'
      record: 'IQC-testrapport med partireferenser och beslut om åtgärd.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Inkommande varukontroll av PVC-tyg och SUP-komponenter i fabriken
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Ladda ner IQC-rapporterna (PDF)'
    - stage: STAGE 03
      title: 'Processkontroll och first article test (IPQC / FAI)'
      summary: 'Konstruktionsmetoder och kontrollpunkter väljs utifrån den godkända brädplattformen och projektkonfigurationen. Det första provet verifieras mot de låsta baslinjerna; varje skift utför stickprovskontroller vid linjen.'
      checks:
        - 'Den första artikeln verifieras mot det godkända provet, teknikritningen, BOM, grafiken och förpackningsfilerna före start av serieproduktionen.'
        - 'Bräddimensioner, omkrets och symmetri mäts; tryck- och logotypriktning, placering, färger och revision bekräftas.'
        - 'Sömar och kantlinjens kontinuitet kontrolleras vid linjen på öppningar, delaminering, veck, föroreningar eller felinriktning.'
        - 'Installationen av ventil, D-ringar, handtag och fin box kontrolleras på placering, antal och montage mot den kundgodkända BOM.'
        - 'FAI-frigörningen låser grafik, mått och BOM per version; avvikelser går igenom beslutsprocessen för omtillverkning — aldrig kvalitetsreparationer vid linjen.'
      object: 'Första artikeln och artiklar under tillverkning — sömar, kant, fin box, ventilbas, grafisk placering, åtdragningsmoment för tillbehör.'
      method: 'First article test på den första enheten; stickprovskontroller per skift; svetsstyrka och söminriktning verifieras vid linjen.'
      criteria: 'FAI-frigörningen låser grafik, mått och BOM per version. Avvikelser går igenom beslutsprocessen för omtillverkning — aldrig kvalitetsreparationer vid linjen.'
      record: 'FAI-register, stickprovsprotokoll per skift, omtillverkningsanteckningar och beslut om åtgärd.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Processinspektion och first article test under SUP-produktionen
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Ladda ner IPQC-rapporterna (PDF)'
    - stage: STAGE 04
      title: 'Uppblåsning- och lufttätningstest'
      summary: 'Varje färdig bräda utsätts före förpackningen för en uppblåsnings- och lufttätningskontroll — 100 % av enheterna, inga stickprov.'
      checks:
        - 'Brädans yta, kantlinjer och ventilområde kontrolleras före uppblåsningen på hål, revor, onormala veck eller delaminering.'
        - 'Kammarna blåses upp till projektets testtryck med en kalibrerad digital manometer och startvärdet registreras.'
        - 'Ventilkärna, ventilbas och sömslutningar kontrolleras runt hela omkretsen — bog, akter och böjda områden.'
        - '24-timmars tryckhållning med kontinuerlig registrering; automatisk uteslutning vid tryckförlust över det tillåtna värdet.'
        - 'Defekta brädor blockeras, omtillverkas enligt instruktion och testas om fullständigt — inte bara kontrolleras på reparationsplatsen.'
      object: '100 % av de uppblåsta kammarna — fullständig läckagedetektering i sömar, ventilintegritet och förmåga att hålla trycket.'
      method: 'Fullständig läckagedetektering i sömmarna, följt av 24-timmars tryckhållning vid 18.0 PSI; automatisk uteslutning vid tryckförlust över 0.50 PSI.'
      criteria: 'Inga läckagepunkter och tryckförlust inom 0.50 PSI per kammer; defekta enheter blockeras och omtillverkas eller kasseras.'
      record: 'Rapport över lufttätningstest, en per kammer, kopplad till partiet.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Uppblåsnings- och lufttätningstest av en uppblåsbar SUP-kammare
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Ladda ner lufttätningsrapporterna (PDF)'
    - stage: STAGE 05
      title: 'Slutproduktinspektion (FQC)'
      summary: 'Färdiga brädor mäts och bedöms optiskt mot det godkända golden sample.'
      checks:
        - 'Huvudmåtten — längd, bredd och tjocklek — mäts vid arbetstryck mot ritningens toleranser.'
        - 'Brädans omkrets, rocker och symmetri verifieras; ingen deformation, vridning eller onormal våguppbyggnad efter uppblåsningen.'
        - 'Optisk bedömning under D65-dagsljuslampor: repor, fläckar, limrester, blåsor, veck, färgavvikelser.'
        - 'Funktionstester: öppna/stänga ventilen och sätta på korken, placera och låsa fenan, D-ringar, handtag och paddelns funktion.'
        - 'Konfigurationen verifieras mot den kundgodkända BOM och SKU — tillbehör, etiketter, streckkoder och serienummer.'
      object: 'Färdig bräda mot golden sample — mått, rocker, profil, utseende, montage av fin box och tillbehörens fullständighet.'
      method: 'Dimensionell verifiering mot ritningens toleranser; optisk bedömning under D65-dagsljuslampor; montagetest av fin box och tillbehör.'
      criteria: 'Mått inom tolerans (t.ex. 3508 × 814 × 150.3 mm), optisk bedömning enligt det godkända provet, alla tillbehör närvarande.'
      record: 'FQC-rapport med inspektörens signatur och beslut om åtgärd.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Slutproduktinspektion av SUP-brädor före förpackning
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Ladda ner FQC-rapporterna (PDF)'
    - stage: STAGE 06
      title: 'Förpackningsinspektion före leverans (PSI)'
      summary: 'Den förpackade satsen kontrolleras avseende fullständighet, märkningsnoggrannhet och leveransberedskap.'
      checks:
        - 'Satsens fullständighet 100 % mot BOM: bräda, paddel, pump, leash, väska, reparsats och manual — en sats i taget.'
        - 'Känsliga delar skyddade (pump- och bladfickor), brädan vikt enligt förpacknings-SOP, tillbehör enligt modell och färg.'
        - 'Kartongbilder, varumärke, varningar och språkversioner kontrolleras mot den godkända grafikrevisionen.'
        - 'Streckkodens typ, nummer, placering och läsbarhet verifieras; leveransmärkningar, SKU, PO, kartongnummer och antal korrekta.'
        - 'Kartongmått, brutto-/nettovikt och innerförpackning enligt förpackningsspecifikationen; resultatet av falltestet registreras vid krav.'
      object: 'Förpackad sats — bräda, paddel, pump, leash, väska, manual — mot den kundgodkända BOM och förpackningsspecifikationen.'
      method: 'Satsens fullständighet 100 % mot BOM; skanning av streckkoder (poäng ≥ B); noggrannhet i kartongetiketter; falltest ISTA-1A på de förpackade kartongerna.'
      criteria: 'Satsen 100 % i enlighet med BOM, läsbara streckkoder, korrekta etiketter och fallbeständig förpackning före lastning.'
      record: 'PSI-checklista och förpackningsprotokoll för varje kartong.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Inspektion före leverans som verifierar den förpackade SUP-satsen mot BOM
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Ladda ner PSI-rapporterna (PDF)'
    - stage: STAGE 07
      title: 'Frigörning inför leverans och spårbarhet'
      summary: 'Kvalitet frigör partiet endast när alla sex föregående punkter är avslutade och alla register är kompletta.'
      checks:
        - 'Produktionsparti, ordernummer, SKU, antal och antal kartonger stämmer med packningslistan och den kommersiella fakturan.'
        - 'Filerna för specifikation, BOM, grafik och förpackning finns alla i aktuell godkänd revision.'
        - 'Registreringarna för IQC, FAI, process, lufttätning, FQC och PSI är kompletta för det parti som ska frigöras.'
        - 'Alla avvikelser är lösta, omtillverkade, omtestade och avslutade — inga öppna punkter vid frigörning.'
        - 'Spårbarhetsfält registrerade för varje parti: projektkod, PO, SKU, revisioner för grafik/BOM/förpackning, produktionsdatum, inspektör och registreringsnummer.'
      object: 'Behörighet att frigöra partiet — alla punkter avslutade, register kompletta, serienummer för partiet tilldelade.'
      method: 'Punktkontroll av Quality på alla sex föregående register; spårbarhetsdossier för partiet sammanställt; register överlämnade till leveransen.'
      criteria: 'Alla punkter frigjorda av QA; partiregister och spårbarhetsdossier överlämnade till köparen eller förvaras på begäran under NDA.'
      record: 'Frigöringsgodkännande inför leverans och spårbarhetsdossier för partiet.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Undertecknande av frigöringsgodkännandet inför leverans och överlämnande av spårbarhetsrapporten för partiet
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Ladda ner frigöringsrapporterna (PDF)'
system_map:
  tagline: Kvalitetssystemet
  title: 'Ett system, fyra kontrollerade standarder'
  subtitle: 'De sju punkterna ovan vilar på fyra dokumenterade standarder, var och en publicerad som en kontrollerad procedur som du kan ladda ner och låta revideras. Tillsammans utgör de QMS bakom varje OEM/ODM-order — inspektionskriterier, ändringskontroll, avvikelser och laboratorietester.'
  items:
    - title: 'Inspektions- och frigöringsstandard'
      description: 'Projektets QIP styr varje punkt: inspektionsobjekt, metod, acceptanskriterier och dokumentationsoutput för varje order. Den omfattar QC-ramverket i fyra faser, spårbarhetskedjan, karantänflödet, defektmatrisen och dokumentregistret 00–15.'
      icon: tabler:clipboard-check
      link: /factory/quality-inspection
      link_label: 'Inspektionsstandard och QMS-nedladdningar'
    - title: 'Ändringskontroll av omtillverkning'
      description: 'Ingen ändring av omtillverkningsparametrar utan dokumenterad kontroll: åtgärdande, riskklassning, ändringscykel i nio faser, frigöringsmatris och validering. Varje ändring av godkända specifikationer, prov, BOM eller acceptanskriterier kräver köparens skriftliga godkännande.'
      icon: tabler:git-branch
      link: /factory/quality-change-control
      link_label: 'Standard för ändringskontroll'
    - title: 'Kontroll av icke-konformiga produkter'
      description: 'En sluten cykel i sju faser enligt ISO 9001:2015 avsnitt 8.7: identifiera, blockera, hantera via NCR, omtillverka eller kassera, kontrollera om, frigöra, korrigera. Den omfattar befogenhet baserad på allvarlighetsgrad, åtgärdsmatrisen för SUP-defekter och kontrollerad destruktion.'
      icon: tabler:alert-triangle
      link: /factory/non-conforming-control
      link_label: 'Standard för icke-konformiga produkter'
    - title: 'Laboratorietester och utrustning'
      description: 'Kvalitetslaboratoriet arbetar oberoende av produktionen: dragprovmaskiner, tryckförlusttester, UV-åldring, svetsdelaminering, läckagedetektering och termiska kamrar — med de kalibrerings- och testprocedurer som ligger till grund för våra publicerade påståenden.'
      icon: tabler:flask
      link: /factory/quality-lab
      link_label: 'Kvalitetslaboratorium och testutrustning'
    - title: 'Materialtestlaboratorium (FoU)'
      description: 'FoU-centrumet utför oberoende materialtester av PVC/Hypalonformuleringar, accelererad åldring och certifieringsstöd och matar de standarder som produktionen använder.'
      icon: tabler:microscope
      link: /randdcenter/quality-inspection-lab
      link_label: 'Materialtestlaboratorium FoU'
intelligence_cards:
  tagline: Dokumentation och spårbarhet
  title: 'Kvalitetsregister som stöder projektets spårbarhet'
  subtitle: 'Inspektionsregister förvaras per produktionsparti och kopplas till den tillämpliga projektdokumentationen — specifikationsrevision, grafikrevision, BOM och förpackningskrav. För att skydda kunduppgifter är exemplen på den här sidan anonymiserade: endast strukturella fält visas (projektkod, produkt/SKU, parti, inspektionsfas, kontrollpunkt, acceptanskriterier, resultat, inspektör, datum och frigöringsstatus).'
  cards:
    - icon: 1
      icon_bg: blue
      title: Protokoll från inkommande varukontroll
      desc: 'Visar att råvaror, drop-stitch-tyg, PVC-rullar och komponenter verifieras mot den godkända specifikationen före produktionen frigörs.'
      metrics:
        - { label: Fas, value: '02 · IQC' }
        - { label: Partireferens, value: 'LOT-DEMO-DS-0814' }
        - { label: Resultat, value: 'Godkänt · frigjort för produktion' }
      link: 'https://assets.isupfactory.com/site/downloads/anonymized-quality-record-samples.pdf#page=1'
      link_label: 'Visa det anonymiserade exemplet (PDF)'
