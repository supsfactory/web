faqs:
  tagline: FAQ
  title: Vanliga frågor om vårt kvalitetssystem
  items:
    - q: 'Kan jag ladda ner de verkliga inspektionsrapporterna?'
      a: 'Ja. De sju tvåspråkiga rapporthäftena på den här sidan — QIP, IQC, IPQC/FAI, lufttätning, FQC, PSI och frigörning inför leverans — är verkliga kontrollerade register med de reserverade fälten borttagna. De visar exakt vilken struktur, metoder och acceptanskriterier som används i varje order.'
    - q: 'Hur tillämpas de sju punkterna på mitt projekt?'
      a: 'Varje projekt får en kvalitetsinspektionsplan (QIP) som definierar vilka punkter som är tillämpliga på din produkt och marknad, inspektionsomfånget vid varje punkt och de register du får. Ladda ner QIP-exemplet på den här sidan för att se strukturen.'
    - q: 'Är de här inspektionsexemplen verkliga?'
      a: 'Ja. Exemplen följer vår faktiska kontrollerade registerstruktur — dokumenthuvud, inspektionschecklista, acceptanskriterier, metod, resultat, inspektörens roll och frigöringsbeslut. Alla identifierande värden har ersatts med demonstrationsvärden (DEMO-*-koder), så att inga kunduppgifter, grafik, order eller priser avslöjas.'
    - q: 'Varför är exemplen anonymiserade?'
      a: 'Köparnas konfidentialitet har företräde. Kundnamn, grafik, orderuppgifter, leverantörsinformation och priser skyddas genom design. Med anonymisering kan varje potentiell köpare verifiera vår registerstruktur och spårbarhet utan att avslöja en annan kunds kommersiella uppgifter.'
    - q: 'Kan vi få de fullständiga inspektionsrapporterna för vårt projekt?'
      a: 'Ja. För godkända projekt delar vi den kvalitetsdokumentation som gäller din order — kvalitetsinspektionsplan, rapporter från inkommande varor, process, lufttätning, slutkontroll och förpackning, plus frigöringsgodkännandet inför leverans — kopplad till spårbarheten för partiet. Känsliga kommersiella uppgifter förblir under NDA enligt överenskommelse.'
    - q: 'Vad innehåller ett inspektionsregister kopplat till ett parti?'
      a: 'Varje register kopplar produktionspartiet till den tillämpliga specifikations- eller ritningsrevisionen, registrerar varje kontrollpunkt mot acceptanskriterierna med metod och använt instrument och avslutas med inspektörens roll, resultatstatus och det av Quality undertecknade frigöringsbeslutet.'
evidence_review:
