hero:
  tagline: Kvalitetskontroll för anpassade projekt
  title: 'Kvalitetskontroll för anpassade uppblåsbara SUP-projekt'
  subtitle: 'Kvaliteten verifieras mot det godkända provet, den tekniska specifikationen, grafiken, stycklistan och förpackningskraven för varje projekt — inte mot en allmän påstående. Från inkommande kontroll till frigörning inför leverans är vår inspektionsprocess strukturerad för att verifiera produktöverensstämmelse i definierade produktionsfaser. Hanterad av QINGDAO VATRAD GROUP, den uppblåsbara SUP-fabriken på 12 500 m² bakom Vatrad.'
