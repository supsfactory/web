traceability:
  tagline: 'Eine Charge, von der Rolle bis zum Board verfolgt'
  title: 'Wie Rückverfolgbarkeit wirklich aussieht'
  body: |
    Jeder Charge wird ein **10-jähriger ERP-Loscode** zugewiesen. Die unter einem Los erfasste Kette:

    - **Eingangsrolle** — Materialzertifikat, Rollennummer, geprüfte Gewebepartie (Zug, Riss, Naht)
    - **Zuschnitt** — CNC-Nesting-Auftrag gegen Design-Datei, Verschnittanteil protokolliert
    - **Schweißen & Laminierung** — Linie, Bediener, Maschinenparameter pro Kammer
    - **Montage** — Board-Seriennummer, Ventiltyp, Deck-Pad-Los
    - **Test** — 18,0 PSI × 24 h Halt pro Kammer, automatische Aussortierung über 0,50 PSI Abfall
    - **Freigabe** — 100-Punkte-Checkliste pro Board, Freigabe durch den QA-Direktor je Charge
    - **Weiter** — Konformitätszertifikat (Certificate of Conformance) mit der Lieferung; Auditrecht vertraglich vorbehalten

    Fordern Sie das QC-Musterprotokoll vor Ihrer ersten Bestellung an — es hat dasselbe Format, das Sie mit Ihrer Lieferung erhalten.

faqs:
  tagline: 'FAQ'
  title: 'Belege-Fragen, die Käufer stellen'
  items:
    - q: 'Dient diese Seite nur der Verifizierung und ersetzt keine Due-Diligence?'
      a: 'Korrekt — diese Seite zeigt, wo jede Aussage verifiziert werden kann: Entitätsregistrierung, Zertifikate, Maschinen, Aufzeichnungen und eine audit-offene Anlage. Ihre üblichen Due-Diligence-Schritte (Registrierungsprüfung, Audit, Drittprüfung) gelten weiterhin und sind willkommen.'
    - q: 'Welche Entität soll auf meiner Auftragsdokumentation erscheinen?'
      a: 'Aufträge werden mit der Qingdao Vatrad Group Co., Ltd. geschlossen, die als Vatrad (Fertigungsdivision) auftritt, mit iSupfactory als SUP-Produktlinie. Vertragsdokumente werden vom Vertriebs-VP, dem Chefingenieur und dem QA-Direktor unterzeichnet.'
    - q: 'Kann ich vor der Bestellung Kopien der Zertifikate erhalten?'
      a: 'Ja — Zertifikatsnummern und Auditunterlagen werden auf Anfrage oder während eines Audits geliefert. Die Liste ist veröffentlicht, nie „nur auf Anfrage verfügbar".'
    - q: 'Wie kann ich die Chargentestprotokolle selbst verifizieren?'
      a: 'Jede Kammer wird 24 Stunden bei 18,0 PSI getestet mit automatischer Aussortierung über 0,50 PSI Abfall; die Testprotokolle sind mit den Seriennummern verknüpft und reisen mit dem Konformitätszertifikat je Charge. Eine SGS-, TÜV-, BV- oder Intertek-Vorversandprüfung nach ISO 2859-1 Level II kann nach Ihrer Wahl terminiert werden.'
    - q: 'Decken die Zertifikate auch das Zubehör ab?'
      a: 'Die REACH/RoHS-Materialdokumentation gilt für Boards und Zubehör aus derselben Bestellung, und die QC-Checklisten decken das komplette Kit ab — Board, Paddel, Pumpe, Leash und Tasche.'
    - q: 'Was passiert mit den Belegen nach dem Auftrag?'
      a: 'Die ERP-Chargenrückverfolgbarkeit wird 10 Jahre aufbewahrt. QMS-SOPs und Prüfstandards bleiben herunterladbar, und der Käufer behält vertraglich ein Auditrecht während der Produktion.'

