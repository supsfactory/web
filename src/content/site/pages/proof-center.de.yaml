hero:
  tagline: 'Fabrik-Belege-Hub'
  title: 'Proof Center —Alles, was wir behaupten, ist hier abgelegt'
  subtitle: 'Eine Seite, die jede Aussage dieser Website ihrem Beleg zuordnet: die registrierte Entität hinter der Fabrik, Zertifikate mit Geltungsbereich, die Maschinen, die die Arbeit erledigen, und die Chargenaufzeichnungen, die jeden Produktionslauf überdauern.'
  actions:
    - { variant: primary, text: 'Verifizierungspaket anfordern', href: '/de/contact#trust-verification' }
    - { variant: ghost, text: 'Das Qualitätssystem erkunden', href: '/de/quality' }

answer:
  label: 'Kurze Antwort'
  text: 'Die Kette von Aussage zu Beleg funktioniert so: Jede Aussage dieser Website stützt sich auf eine Registrierung, ein Zertifikat, eine Maschine, ein Dokument oder ein Testprotokoll — und jedes davon kann eingesehen werden. iSupfactory ist die SUP-Produktentwicklungs- und Fertigungsdivision der Qingdao Vatrad Group Co., Ltd. (seit 2012 in Qingdao registriert). Die 12,500 m² große Anlage verfügt über ISO-9001:2015-Qualitätsmanagement, ISO-25649-Konformität, CE-Konformitätsdokumentation, BSCI-Sozialkonformität (Auditbericht auf Anfrage) und REACH/RoHS-Materialdokumentation pro Auftrag. Jede aufblasbare Kammer wird 24 Stunden bei 18,0 PSI getestet mit automatischer Aussortierung über 0,50 PSI Abfall, und die Chargenaufzeichnungen werden mit 10-jähriger ERP-Rückverfolgbarkeit geführt. Der Papierpfad ist veröffentlicht oder teilbar, und die Fabrik selbst ist audit-offen.'
  verified: 'September 2026'

