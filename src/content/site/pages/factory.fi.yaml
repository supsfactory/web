material_traceability:
  tagline: Jäljitettävyys
  title: Materiaalien seuranta ja eräohjaus
  description: Jokaiselle raaka-aine-erälle annetaan ERP-järjestelmässämme yksilöinen eränumero. Saapumisesta tuotannon kautta lopputuotteeseen jokaisen laudan materiaaliluettelo linkittyy alkuperäiseen toimittajaerään. Tämä mahdollistaa täyden jäljitettävyyden ylöspäin mihin tahansa laatu- tai vaatimustenmukaisuuskysymykseen.
  system: Oma ERP (Qingdao Vatrad Groupin sisäinen järjestelmä) + fyysiset erätunnisteet jokaisessa työtilauksessa
  coverage: 100 % tuotantomateriaaleista —PVC, Hypalon, drop-stitch-kangas, liimat, venttiilit, kiinnikkeet, pakkaus
  records_retained: 10 vuotta (CE 2013/53/EU -vaatimuksen mukaan)
  suppliers:
    - material: Meriluokan PVC
      source: Kiinalaiset ja korealaiset toimittajat
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
