qc_section:
  tagline: Laadunvalvonta
  title: Testaus- ja laadunvarmistusprosessi
  subtitle: Jokainen lauda läpäisee pakollisen testauksen ennen lähetystä. Laadulaboratoriamme toimii tuotannosta riippumatta ja raportoi suoraan johdolle.
  steps:
    - step: '1'
      title: Raaka-aineen tarkastus
      desc: PVC-, Hypalon- ja drop-stitch-kankaille tehdään vetotestit (), repeämän eteneminen ja UV-kestävyyden varmennus ennen kuin yksikään erä siirtyy tuotantoon.
    - step: '2'
      title: 24 tunnin ilman säilymisen testi
      desc: Jokainen putkiosa täytetään 18.0 PSI paineeseen ja pidetään 24 tuntia. Yli 0.50 PSI paineen alenema käynnistää automaattisen hylkäyksen ja sauman uudelleentarkastuksen.
    - step: '3'
      title: Kuormitus- ja tasapainotestaus
      desc: Valmiit laudat täytetään nimellispaineeseen ja tarkistetaan symmetrisen turvotuksen, jäykkyyden 15 PSI paineessa ja vakauden kuormituksen alaisena. Jokainen lauta testataan märissä omassa testialtaassamme ennen lopputarkastusta.

oem_section:
  tagline: OEM-projektit
  title: Brändi- ja OEM-yhteistyön tapaustut
  subtitle: Konseptista tuotantoon — autamme maailmanlaajuisia brändejä lanseeraamaan ja skaalaamaan puhallettavia SUP-tuotelinjojaan.
  cases:
    - challenge: Eurooppalainen ulkoilukauppias tarvitsi private label -SUP-tuotelinjan, jossa on omat kansikuviot, ympäristöystävällinen PVC ja vähittäiskauppaan valmis pakkaus — kaikki 60 päivässä.
      solution: Kehitimme omat digipainotiedostot, hankimme REACH-vaatimustenmukaisen PVC:n ja tiivistimme näytteistyksen 3 kierroksesta 1:een sijoittamalla suunnittelutiimimme Qingdaon tehtaallemme.
      result: Tuotanto 25–35 päivää allekirjoitetusta tilauksesta, ensimmäinen toimitus 60 päivän laskutusikkunan kuluessa. 2,400 yksikköä 4 SKU:ta. Uusintatilaus tehtiin ennen ensimmäisen erän toimituksen valmistumista.
      disclaimer: 'Anonymisoitu projektin yhteenveto — projektin tyyppi ja laajuus ovat edustavia; tiettyjä tuloksia ei voi riippumattomasti todentaa.'
    - challenge: Yhdysvaltain vesilaju startup tarvitsi suorituskykyisen drop-stitch-SUP-laudan, jossa on oma muoto, yhteisbrändätty pakkaus ja BSCI-sertifiointi vähittäiskauppaan sijoittamista varten.
      solution: Muokkasimme olemassa olevaa SUP-muotosta muutetulla ääriviivalla, kehitimme yhteisbrändätyn pakkauksen kuvituksen ja toimitimme täydet BSCI-auditointiin liittyvät asiakirjat.
      result: Tuote sijoitettiin onnistuneesti keskeisiin yhdysvaltalaisiin ulkoilukauppiaisiin, mikä loi vahvan liikkeen yli 5,000 yksikön myynnillä 1. vuonna ja 98 % myyntiasteella.
      disclaimer: 'Anonymisoitu projektin yhteenveto — projektin tyyppi ja laajuus ovat edustavia; tiettyjä tuloksia ei voi riippumattomasti todentaa.'
    - challenge: Australialainen jakelija tarvitsi CE-sertifioidun SUP-valikoiman, jossa on omat värit ja australialaisstandardien vaatimustenmukaisuus.
      solution: Valmistimme esituotantonäytteet 4 värivaihtoehtoa ja koordinoimme kolmannen osapuolen vaatimustenmukaisuustestauksen.
      result: 3-mallinen SUP-valikoima lanseerattiin AU/NZ-markkinoille. Sen jälkeen voitimme valtion tarjouskilpailun 12 valvontaveneen SUP-lautoihin.
      disclaimer: 'Anonymisoitu projektin yhteenveto — projektin tyyppi ja laajuus ovat edustavia; tiettyjä tuloksia ei voi riippumattomasti todentaa.'

faq_section:
  tagline: FAQ
  title: B2B- ja OEM-kysymyksiä
  questions:
    - q: Mikä on OEM-puhallettavien SUP-lautojen minimitilaus (MOQ)?
      a: 'MOQ vahvistetaan projektikonfiguraation mukaan eikä kiinteänä lukuna — runko ja työkalut, väripaletit ja PVC, kuviot, pakkaus ja lisävarusteet. Vakiintunut sarjatuotanto ajaa 90–100+ yksikköä erää kohden täydestä 150 m drop-stitch-rullasta, pienimuotoinen yhteisbrändäys alkaa 5–10 yksiköstä, ja jokainen projekti käy läpi näytevaiheen (1–2 yksikköä) ja pilottivaiheen (20–50 yksikköä). Katso koko laskentalogiikka oppaastamme MOQ & joustava brändäys.'
    - q: Onko Vatradilla BSCI-sertifiointi?
      a: Kyllä. Tehtaamme ylläpitää voimassa olevaa BSCI-yhteiskunnallista vaatimustenmukaisuussertifiointia (auditointiraportti pyydettäessä). Meillä on myös ISO 9001 laadunhallinta. CE-sertifiointi koskee EU-markkinoille tarkoitettuja malleja; laajuus vahvistetaan projekti kohtaisesti. REACH- ja RoHS-vaatimustenmukaisuusasiakirjat toimitetaan jokaisen OEM-tilauksen mukana.
    - q: Mikä on OEM-tilauksen tyypillinen toimitusaika?
      a: Vakiintunut toimitusaika on 25–35 päivää vahvistetusta tilauksesta ja käsirahasta sarja-OEM-tuotannossa. Räätälöity muotokehitys lisää työkalulle 15–20 päivää. Kiireellisiin tilauksiin ja sesongikysyntään on saatavilla kiireellinen tuotanto. Prototyyppinäytteet ovat yleensä valmiit 7–12 päivässä.
    - q: Hoidatteko vientiasiakirjat?
      a: Kyllä. Tiimimme hoitaa vientiasiakirjat ja tulliselvityksen omissa käsissä, ja toimitamme 50+ maahan EU:n, Yhdysvaltain, Australian ja Aasian markkinoille.

b2b_moq: 'MOQ vahvistetaan projektikonfiguraation mukaan: näyte 1–2, pilotti 20–50, sarja 90–100+ (150 m rullaa kohti); pienimuotoinen yhteisbrändäys 5–10 yksiköstä alkaen.'

production_flow:
  tagline: Tuotantovuoto
  title: Materiaalista valmiiseen lautaan
  subtitle: Jokainen lauta käy läpi 6 tuotantovaihetta, joissa jokaisessa vaiheessa on laadunvalvontapiste. Ei pikakujia, ei ohitettuja tarkastuksia.
  stages:
    - stage: '01'
      title: Materiaalin vastaanotto ja saapuvien materiaalien laadunvalvonta
      description: 'Kaikki saapuvat materiaalit kirjataan erä-/lottonumerolla ERP-järjestelmäämme. PVC-kangasrullat, drop-stitch-ytimet, venttiilit, liimat ja kiinnikkeet eristetään, kunnes laadunvalvonta on allekirjoittanut hyväksynnän.'
      qc_check: 'Vetolujuus (ASTM D751), repeämänkestävyys (ISO 4674), paksuusmittari, liiman viskositeetti, silmämääräinen vikojen skannaus'
      qc_threshold: '100 % eristä testataan. Hylätään, jos veto < 90 % määrittelystä, repeämä < määrittelyn vähimmäisarvo tai löytyy silmämääräinen vika'
      responsibility: Saapuvien materiaalien laadunvalvontatiimi (3 tarkastajaa)
    - stage: '02'
      title: CNC-leikkaus ja materiaalin valmistelu
      description: 'Tietokoneella optimoitu sisäkkäisyys asettaa paneelit PVC-ainemateriaalille jätteön vähentämiseksi. Automaattiset CNC-leikkauskoneet säilyttävät 0.1 mm paikkatarkkuuden.'
      qc_check: 'Mittatarkistus CAD-DXF-tiedostoja vasten, reunojen laadun tarkastus, paneelimäärän varmennus'
      qc_threshold: 'Joka 20. paneeli mitataan. Toleranssi ±0.5 mm. Erä hylätään, jos yli 2 % on toleranssin ulkopuolella'
      responsibility: Leikkaustyöpajan esimies
    - stage: '03'
      title: Hitsaus ja drop-stitch-liimaus
      description: 'Drop-stitch-ydinliimataan ulkoisiin PVC-laminaatteihin lämpölaminoinnilla. Putkiosat hitsataan RF-menetelmällä tai kuumailmalla. Reunavahvikkeet liimataan fuusioliimalla kolmikerroksisesti.'
      qc_check: 'Kuorimistesti joka 50 yksikkö (ASTM D751), hitsin leveyden mittaus, kuumailman lämpötilakirjojen tarkistus, saumojen silmämääräinen tarkastus takavaloa vasten'
      qc_threshold: 'Kuorimislujuus vähintään 8 N/cm. Hitsin leveyden toleranssi ±1 mm. Mikä tahansa näkyvä kanavoituminen = hylkäys'
      responsibility: Hitsauksen laadunvalvonta (2 tarkastajaa vuoroa kohden)
    - stage: '04'
      title: Kokoonpano ja varustelu
      description: 'Laudat siirtyvät lopulliseen kokoonpanoon, jossa kaikki komponentit kootaan yhteen: kansi- ja runkopaneelit sulatetaan, venttiilit asennetaan sekä D-renkaat, kahvat, eväkotelot ja kantolaukkukokoonpano tehdään. Jokainen yksikkö käy läpi 100 kohdan kokoonpanotarkistuslistan.'
      qc_check: '100 kohdan tarkistuslistan allekirjoitus yksikköä kohti, venttiilin toimintatesti (10 avaus/sulkukierrosta), kiinnikkeiden kiristysmomentin varmennus, silmämääräinen tarkastus'
      qc_threshold: 'Turvallisuuskriittisissä kohteissa (venttiilit, D-renkaat, kahvat) nollavika-periaate. Pienet kosmeettiset viat: AQL 2.5 (ISO 2859)'
      responsibility: Kokoonpanotiimin esimies + linjan laadunvalvonta
    - stage: '05'
      title: Painetestaus ja laadunpidätys
      description: 'Jokainen osa täytetään 18.0 PSI paineeseen (12–15 PSI nimellispaineiselle SUP-laudalle) ja pidetään 24 tuntia. Paineanturit kirjaavat jatkuvasti. Osat, joiden paine laskee yli 0.50 PSI, hylätään ja lähetetään sauman uudelleentarkastukseen.'
      qc_check: '24 h paineen säilytyksen kirjaus, antureiden kalibroinnin varmennus päivittäin, lämpötilakorjattu paineen lukema, sauman uudelleentesti korjauksen jälkeen'
      qc_threshold: 'Enintään 0.50 PSI paineen alenema 24 h aikana vakaassa lämpötilassa. Yksikin osa, joka ylittää tämän = 100 % koko tuotantoerän uudelleentesti'
      responsibility: Laadulaboratorio (tuotannosta riippumaton, raportoi johdolle)
    - stage: '06'
      title: Lopputarkastus ja pakkaus
      description: 'Lopullinen visuaalinen ja toiminnallinen tarkastus. Pinnan viat, värin yhtenäisyys, etiketin/BIN-tunnistus, pakkauksen eheys ja lisävarusteiden täydellisyys. Yksiköt pakataan tyhjöpakkaamiseen, laatikoidaan ja lavastetaan konttilaitaukseen.'
      qc_check: 'Täysi silmämääräinen tarkastus, lisävarustelista SKU:ta kohden, pakkauksen pudotustesti (1 m, satunnaisnäyte), etiketin/viivakoodin skannauksen varmennus'
      qc_threshold: 'AQL 2.5 isoleille vikoille, AQL 4.0 pienille vikoille. Nolla toleranssi turvallisuusvikoille. 100 % yksiköistä tarkastetaan silmämääräisesti'
      responsibility: Lopputarkastustiimi (4 tarkastajaa) + pakkaustiimin esimies

