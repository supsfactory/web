workshops_section:
  tagline: Työpajat
  title: Valmistuksen työpajat
  workshops:
    - title: PVC-leikkaus ja materiaalin valmistelu
      description: Automaattiset CNC-leikkauskoneet käsittelevät PVC-, Hypalon- ja drop-stitch-kankaita alle millimetrin tarkkuudella. Tietokoneella optimoitu sisäkkäisyys minimoi materiaalihävikin ja varmistaa, että jokainen paneeli täyttää mittamäärittelynsä ennen hitsausta.
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: CNC-PVC-leikkauskone valmistelee puhallettavien SUP-lautojen kangaspaneeleja Qingdaon tehtaalla
    - title: Putkien hitsaus ja lämpösaumaus
      description: Erillinen hitsaustyöpaja, jossa on kuumailmahitsauskoneet ja RF-dielektriset puristimet. Kuumailmahitsaimet liittävät ja sulattavat PVC-putkiosat, kun ta RF-hitsaus tuottaa erittäin lujat tiiviit saumat, jotka ylittävät vaatimukset.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: RF-hitsauskone saumaa puhallettavan veneen putkiosia Qingdaon tehtaalla
    - title: Drop-stitch-ydinten liimaus
      description: SUP-lautojen drop-stitch-ydin liimataan ulkoisiin PVC-laminaatteihin lämpölaminoinnilla. Tuhannet sisäiset polyesterisäikeet yhdistävät ylä- ja alapinnan muodostaen jäykän rakenteen 12-15 PSI paineelle. Reunavahvikkeet liimataan fuusioliimalla kolmikerroksisesti reunan lujuutta varten.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Puhallettavien SUP-lautojen tuotantolinja drop-stitch-ydinten liimauslaitteistolla Qingdaon tehtaalla
    - title: SUP-lautojen painatus ja koristelu
      description: SUP-laudat koristellaan digipainatuksella täysvärisille kuvioille ja silkopainatuksella logoille ja toistuville kuvioille. Digipainokoneet tuottavat valokuvatason laisia kansikuvioita, kun ta silkopainatus antaa kestävät ja elävät bränditunnukset.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Tuotantonosaston sisätilat Qingdaon puhallettavien SUP-lautojen tehtaalla
    - title: Lopullinen kokoonpano ja asennus
      description: Kokoonpanolinja, jossa jokaiselle SUP-laudalle asennetaan venttiilit, D-renkaat, kahvat, eväkotelot ja kansipehmusteet. Jokainen lauta käy läpi 100 kohdan kokoonpanotarkistuslistan, jonka tiimiesimies allekirjoittaa.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Tuotantonosasto kokoonpanopöytien kanssa Qingdaon tehtaalla
    - title: Laadutestaus ja tarkastus
      description: Jokainen valmis lauta läpäisee pakollisen ilman säilymisen testin, sauman kuorimisen varmennuksen ja täyden järjestelmätarkistuksen ennen lähetystä. Laadulaboratoriamme toimii tuotannosta riippumatta ja raportoi suoraan johdolle.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Puhallettavien SUP-lautojen painetestaus ilman säilymisen varmistamiseksi ennen lähetystä Qingdaon tehtaalla

