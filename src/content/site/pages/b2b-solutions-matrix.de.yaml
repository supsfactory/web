answer:
  label: 'Klare Antwort'
  text: 'Eine Fabrik bedient jede B2B-Route: OEM/ODM-Fertigung mit projektbestätigter MOQ (Muster 1–2 Einheiten, Pilot 20–50, Standardmenge 90–100+ pro 150-m-Rolle; Co-Branding ab 5–10 Einheiten), Private Label auf bewährten Plattformen, Wholesale-Distribution und Flottenprogramme für Resorts, Clubs und Schulen. Jeder Kundentyp wird einer bestimmten Lösungssuche zugeordnet — Muster in 7–12 Tagen, Produktion 25–35 Tage nach PO und Anzahlung.'
  verified: 'September 2026'

