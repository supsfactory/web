ip_rules:
  tagline: 'Bescherming van intellectuele eigendom'
  title: 'Hoe we je ontwerpen en merk beschermen'
  subtitle: 'Ongeacht het samenwerkingsmodel blijven je artwork, matrijzen en specificatiebestanden van jou.'
  body: |
    **NDA vóór de bestandsuitwisseling.** We ondertekenen een geheimhoudingsovereenkomst vóór elke uitwisseling van technische bestanden — standaardreactietijd binnen 4 werkuren.

    **Geen hergebruik van ontwerpen.** Je artwork, matrijzen en specificatiebestanden worden nooit gedeeld of verkocht aan andere klanten. OEM-matrijzen zijn exclusief van jou. ODM-ontwerpen worden door jou goedgekeurd vóór de productie. Private Label-platforms zijn gedeelde structuren, maar jouw graphics en branding zijn exclusief.

    **Alleen B2B.** We produceren uitsluitend onder de merken van onze klanten. We verkopen niet aan eindconsumenten en concurreren in geen enkele markt met onze klanten.

    **Eigendom van matrijzen.** Eigen matrijzen die door de koper zijn betaald, zijn van de koper. We bewaren en onderhouden ze, maar mogen ze zonder schriftelijke toestemming niet voor andere klanten gebruiken.

faqs:
  tagline: 'FAQ'
  title: 'Veelgestelde vragen over OEM, ODM en Private Label'
  items:
    - q: 'Kan ik later overstappen van Private Label naar OEM?'
      a: 'Ja. Veel klanten starten met Private Label-productie of een pilot om de markt te valideren en investeren daarna in eigen apparatuur voor een volledig OEM-programma zodra de vraag is bewezen. Dezelfde fabriek en hetzelfde QC-systeem ondersteunen beide trajecten.'
    - q: 'Betekent ODM dat de fabriek mijn merk bezit?'
      a: 'Nee. Bij ODM bezit je je merk, je graphics en je verpakking. De fabriek ontwikkelt de plankstructuur uit jouw briefing en jij keurt het ontwerp vóór de productie goed. De fabriek houdt het IP van het ontwikkelproces, maar de goedgekeurde productspecificatie is van jou.'
    - q: 'Is Private Label van lagere kwaliteit dan OEM?'
      a: 'Nee. Alle drie de trajecten lopen door dezelfde fabriek, hetzelfde QC-systeem en hetzelfde exportteam. Private Label-planken worden gebouwd op beproefde, gevalideerde platforms, met de volledige 18-PSI/24-uurs druktest en dezelfde assemblagechecklist van 100 punten.'
    - q: 'Wat als ik niet zeker weet welk model ik moet kiezen?'
      a: 'Neem contact met ons op over jouw situatie — ons technisch team adviseert het meest praktische traject op basis van je productvereisten, je planning en je kwantiteitsdoelen. Er is geen enkele verplichting vóór de specificatiecontrole.'
    - q: 'Kan ik samples ontvangen voordat ik het model kies?'
      a: 'Ja. 1–2 prototypesamples vertrekken in 7–12 dagen. De samplekosten worden verrekend met je massabestelling. Zo kun je constructie en kwaliteit beoordelen vóór enige kwantiteitsverplichting.'

