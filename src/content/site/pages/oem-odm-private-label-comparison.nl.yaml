hero:
  tagline: 'Kies je samenwerkingsmodel'
  title: 'OEM vs. ODM vs. Private Label — welk model past bij jouw project?'
  subtitle: 'Drie manieren om samen te werken met een SUP-fabriek, elk met een ander eigendom, andere investeringen en een andere snelheidsafweging. Deze gids legt de verschillen uit, zodat je het juiste traject kiest vóór je eerste aanvraag.'

answer:
  label: 'Snelle vergelijking'
  text: 'OEM: jij bezit ontwerp en specificatie — wij produceren volgens jouw tekeningen. ODM: ons technisch team ontwikkelt de plank uit jouw briefing — jij keurt vóór de productie goed. Private Label: jouw merk op een bestaand, beproefd platform zonder structurele wijzigingen — de snelste weg naar de markt. Alle drie de trajecten lopen door dezelfde fabriek, hetzelfde QC-systeem en hetzelfde exportteam in Qingdao, China.'
  verified: 'September 2026'

comparison_table:
  tagline: 'Naast elkaar'
  title: 'OEM / ODM / Private Label vergeleken'
  subtitle: 'Essentiële verschillen in ontwerpeigendom, MOQ, apparatuur, levertijden en intellectuele eigendom.'
  headers:
    dimension: Dimensie
    oem: OEM-productie
    odm: ODM-ontwikkeling
    pl: Private Label
  rows:
    - dimension: 'Wie ontwerpt de plank?'
      oem: 'Jij levert specificatie, tekeningen of een referentieplank'
      odm: 'Het technisch team van de fabriek ontwikkelt uit jouw briefing'
      pl: 'Bestaand fabrieksplatform — geen ontwerpinspanning'
    - dimension: 'Eigendom van ontwerp en IP'
      oem: 'Jij bezit alle ontwerpen, matrijzen en intellectuele eigendom'
      odm: 'Jij bezit het goedgekeurde eindontwerp; de fabriek houdt het IP van het ontwikkelproces'
      pl: 'De fabriek bezit het platformontwerp; jij bezit merk en graphics'
    - dimension: 'Matrijs / apparatuur'
      oem: 'Eigen matrijs nodig voor nieuwe vormen — eenmalige apparatuurkosten, 15–20 dagen extra'
      odm: 'Kan een eigen matrijs vereisen afhankelijk van de specificatie — zelfde apparatuurplanning'
      pl: 'Geen nieuwe matrijs — er wordt gebruikgemaakt van de apparatuur van het bestaande platform'
    - dimension: 'Minimum bestelhoeveelheid'
      oem: '90–100+ eenheden per goedgekeurde configuratie'
      odm: '90–100+ eenheden per goedgekeurde configuratie; pilotpartijen van 20–50'
      pl: '5–10 eenheden (co-branding) of 20–50 (pilotpartij op bestaand platform)'
    - dimension: 'Typische levertijd'
      oem: '25–35 dagen + 15–20 dagen apparatuur bij een nieuwe matrijs'
      odm: '25–35 dagen + ontwikkeliteratie (varieert met de complexiteit)'
      pl: '25–35 dagen (geen apparatuurvertraging)'
    - dimension: 'Mate van aanpassing'
      oem: 'Totaal — vorm, constructie, materialen, graphics, verpakking'
      odm: 'Totaal — de fabriek stelt voor, jij keurt elk element goed'
      pl: 'Alleen graphics en verpakking — geen structurele wijzigingen'
    - dimension: 'Sampleproces'
      oem: '1–2 prototypesamples in 7–12 dagen na specificatiegoedkeuring'
      odm: '1–2 prototypesamples in 7–12 dagen na ontwerpgoedkeuring'
      pl: '1–2 samples in 7–12 dagen — platform al gevalideerd'
    - dimension: 'Ideaal voor'
      oem: 'Kopers met bestaande ontwerpen, referentieplanken of gedetailleerde specificaties'
      odm: 'Kopers met productideeën of marktvereisten, maar zonder gedetailleerde specificatie'
      pl: 'Kopers die snel ge-branded planken willen zonder productontwikkeling'

