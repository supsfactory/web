cc_validation:
  tagline: Teknisk validering
  title: Validerings- og akseptprotokoller — bevis, ikke påstander
  body: |
    En vag akseptformulering som «det reparerte brettet skal være bra» godtas ikke. Den kontrollerte formuleringen lyder:

    > «Det omtillverkede prøveeksemplaret skal oppfylle de samme gjeldende akseptkriteriene for lufttetthet, visuell finish, ventilfunksjon og prosjektspesifikke krav som et samsvarende brett, med mindre en kundengodkjent avvikelse uttrykkelig angir et alternativt kriterium.»

    Valideringsbevisene er kvantitative, og den tekniske baselinen for lufttetthetsreparasjon omfatter:

    - **Eliminering av lekkasjen og trykkholding.** Opprinnelseslekkasjen elimineres uten vedvarende bobler i tooppløsning; brettet holder trykket ved standardtesttrykket 18.0 PSI i 24 timer, med et netto trykktap ΔP ≤ 0.2 PSI etter kompensasjon for temperatur/fuktighet — den strengste baselinen for omtillverkningsvalidering, adskilt fra den automatiske utelukkelsesterskelen på 0.50 PSI som anvendes ved sluttaksept på produksjonslinjen.
    - **Ventilfunksjon.** Tiltrekkingsmomentet for ventilkjernen oppfyller spesifikasjonen 15–20 N·m, uten mikrolekkasje ved forseglingen under høytrykks- og dynamisk trykk ved oppumpingen.
    - **Sømliming og levetid.** Limfugene viser ingen løsgjøring, gulning eller delaminering; etter syklene med termisk/fuktighetsaldring viser limlagret ingen mykgjøring eller børstede riller.
    - **Utseende og finish.** Ingen limutslag, ingen skade på EVA, ingen deformering av brettet og ingen forskyvning av logoen eller riper på trykket overflate.

cc_engineering:
  tagline: Teknisk utførelsematrise
  title: Kvantifiserte parametere for de fire kjerneomtillverkningsprosessene
  subtitle: 'Hver kontrollert omtillverkningsprosess har definerte parametere, metodikk og akseptkriterier — samme tall som våre operatører følger, og som kunder kan verifisere under revisjoner.'
  headers:
    process: Omtillverkningsprosess
    parameters: Kontrollerte parametere
    methodology: Testmetodikk
    acceptance: Akseptkriterier
  rows:
    - process: 'Reparasjon av stinghull/mikrolekkasje'
      parameters: 'Rengjøring med løsemiddel og tørking 3–5 min; varmluftaktivering 60°C ± 5°C; trykkvalg ≥ 0.4 MPa'
      methodology: 'Pumping til 18 PSI; fullstendig senkning i vann eller såpeapplikasjon; observasjon i 10 minutter'
      acceptance: 'Null boble dannelse; 180°-kantbøying uten løsgjøring og uten limutslag'
    - process: 'Omliming av kantbånd/søm'
      parameters: 'Strikt kontrollert blandingsforhold for tokomponentlim; omgivelse 22–28 °C, ≤ 65 % relativ luftfuktighet; klammer i form ≥ 4 t'
      methodology: 'Overtrykkstest ved 22 PSI i 2 t; deretter 6 t herding i ovn ved 50°C og 2 t hvile i romtemperatur'
      acceptance: 'Null separasjon, null rifledannelse; netto trykktap ΔP ≤ 0.1 PSI; limlag uten gulning eller sprøhet'
    - process: 'Løs ventilbase / mikrolekkasje'
      parameters: 'Spesifikt tiltrekkingsmoment 18–20 N·m; plan for forseglingsring uten deformering; kontrollert gjengjaring'
      methodology: 'Pumping til 15 PSI; 20 sykluser oppblåsing/avblåsing; observasjon ved senkning under vann'
      acceptance: 'Null bobler ved ventilkjernen og rundt basen; tiltrekkingsmoment etter syklusene ≥ 16 N·m'
    - process: 'Sluttlig 24-timers trykkholdingstest'
      parameters: 'Referansetrykk for oppumping 18.0 PSI; digitalt manometer klasse 1.0 / ±0.5 %; registrert og kompensert omgivningstemperatur og fuktighet'
      methodology: 'Digital trykkregistrator; kontinuerlig 24-timers trykkurve'
      acceptance: 'Netto trykktap ΔP ≤ 0.20 PSI / 24 t etter kompensasjon; ingen buling eller deformering av brettet'

