faqs:
  tagline: FAQ
  title: Vanlige spørsmål om endringskontroll av omtillverkning
  items:
    - q: 'Kan fabrikken endre omtillverkningsparametere uten å informere oss?'
      a: 'Nei. Hver foreslått endring i godkjente omtillverkningsmaterialer, prosessforhold, utstyr, testmetoder, inspeksjonskriterier eller autorisert personell må først gå gjennom en dokumentert endringskontroll. Endringer som påvirker kundens godkjente spesifikasjoner, prøver, BOM, grafikk eller akseptkriterier krever kundens skriftlige frigjøring.'
    - q: 'Hva regnes som en høyrisikoendring?'
      a: 'Endringer i omtillverkningsmateriale eller leverandør, trykk-/holde- eller herdingsforhold, omtillverkningsmetoder for ventil/kant/søm, inspeksjons- eller akseptkriterier og utvidelse av feilomfanget til strukturelle soner klassifiseres som høy risiko. De krever tverrfunksjonell verifisering, en godkjent valideringsplan og kontrollert pilotinnføring før rutinemessig bruk.'
    - q: 'Kan et midlertidig avvik brukes uten begrensning?'
      a: 'Nei. Hvert midlertidig avvik bærer et definert gyldighetsvindu, et partiomfang, en antallsgrense og valideringskrav med automatisk utløpsdato. Når grensen nås, sperres partiet og avtrykket av gjennomføringstaget sperres til endringen er vurdert formelt.'
    - q: 'Hvordan viser dere at en endret metode fungerer før full bruk?'
      a: 'Høyrisikoendringer krever en valideringsplan: minst 5 representative eksempelbrett som dekker toleransegrensene, testet av 2 uavhengige QC-inspektører mot kvantifiserte akseptkriterier (lekkasjeliminering, trykkholding, ventilfunksjon, sømlivetid, utseende). Frigjøring for validering er ikke frigjøring for anvendelse.'
    - q: 'Må vi frigjøre hver endring?'
      a: 'Ikke hver endring, men hver endring som flytter produktet bort fra kundens godkjente prøveeksemplar, tekniske spesifikasjon, BOM, grafikken, emballasjen eller akseptkriteriene, innføres bare med kundens skriftlige frigjøring. Uten den frigjøringen omtillverkes, erstattes eller kasseres brettene etter det opprinnelige kravet.'
    - q: 'Hva skjer med gamle dokumenter når en endring frigjøres?'
      a: 'De gamle arbeidsinstruksjonene, parameterkortene og inspeksjonsskjemaene rekvireres og ugjøres fysisk (1-in-1-out), merkes OBSOLETE og erstattes av den nye kontrollerte revisjonen etter opplæringen. Gamle og nye versjoner deler aldri en arbeidsstasjon.'
    - q: 'Hvor lenge oppbevares endringskontrollens registre?'
      a: 'Lukningsregistrene — valideringsbevis, dokumentrevisjoner, opplæringsbevis og effektivitetsbevis — oppbevares iht. oppbevaringspolicyen vår (minst 3 år for lukningsregistre), slik at hver endring forblir sporbar for revisjoner og verifiseringer.'

