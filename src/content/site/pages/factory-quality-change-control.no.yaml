cc_pokayoke:
  tagline: Feilforebygging
  title: 'Poka-Yoke: harde sperrer som stopper ukontrollerte endringer'
  subtitle: Standarden anvendes ikke bare gjennom prosedyrer, men med fysiske og systemiske sperrer som gjør ukontrollerte endringer umulige.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR-port for aktivering av verktøy
      desc: 'Omtillverkningsstasjonene leser av en QC-signert ECR-strekkode før de pneumatiske oppumpingsventilene og limblandene aktiveres. Ingen bevis på godkjent endringskontroll, ingen strøm — en retroaktiv signatur («endre først, signere etterpå») sperres fysisk.'
    - icon: 2
      icon_bg: green
      title: Automatisk utløpsdato for midlertidige avvik
      desc: 'Midlertidige avvik er hardkodet som grense i systemet (f.eks. høyest 50 brett eller 7 kalenderdager). Når grensen nås, sperres partiet og avtrykket av avsendelsens gjennomføringstag sperres til endringen er vurdert formelt.'
    - icon: 3
      icon_bg: purple
      title: Minimumsbevis for validering
      desc: 'Høyrisikoendringer krever minst 5 representative eksempelbrett som dekker øvre og nedre toleransegrense, fullstendig testet av 2 uavhengige QC-inspektører før en valideringsrapport kan utleveres — et reparert brett behandles aldri som prosessvalidering.'
    - icon: 4
      icon_bg: orange
      title: Dokumentkontroll 1-in-1-out
      desc: 'De foreldete arbeidsstasjonskortene rekvireres og ugjøres fysisk (perforeres) før det nye kortet utstedes, stemplet med det kontrollerte røde seglet — gamle og nye versjoner deler aldri en arbeidsstasjon.'

