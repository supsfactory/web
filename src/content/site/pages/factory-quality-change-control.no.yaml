cc_intro:
  tagline: Omfang og policy
  title: Kjernestyringsprinsipper
  body: |
    **Dokument:** QMS-SOP-QC-CC-001 — *Standard for endringskontroll av omtillverkningsprosessparametere* (Rev 2.0, offisiell publisering). **Produsent:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Normreferanse:** ISO 9001:2015 Kvalitetsledningssystem.

    - **Ingen ukontrollerte endringer.** Endringer i omtillverkningsparametere må gå gjennom en formell endringskontroll. Operatører i verkstedet, skiftledere eller en enkeltavdeling får aldri endre godkjente omtillverkningsparametere gjennom muntlig avtale eller håndskrevet notat i et omtillverkningsprotokoll.
    - **Fullstendig dekning av elementene.** Det kontrollerte omfanget dekker lufttetthet, ventilseter, kantbånd, sømliming, varmluftsheving og trykkholdingstesten — hver parameter som kan påvirke forsegling, strukturell levetid, utseende, kundens aksept eller sporbarhet.
    - **Kundens frigjøring som sentralt punkt.** Hver endring som flytter et produkt bort fra kundens godkjente prøveeksemplar, tekniske spesifikasjon, BOM, grafikken, emballasjekravet eller akseptkriteriene, innføres bare med kundens skriftlige frigjøring. Uten den frigjøringen omtillverkes, erstattes eller kasseres brettet etter det opprinnelige kravet — aldri «mildnet» av fabrikken alene.

cc_scope:
  tagline: Risikoklassifisering
  title: Endringens omfang og risikoklassifisering
  subtitle: Hver av følgende endringer aktiverer den formelle endringskontrollen — håndteres aldri med et notat i omtillverkningsprotokollen. Risikonivået avgir hvem som frigjør, og hvor mye validering som kreves.
  headers:
    category: Endringskategori
    examples: Typiske eksempler
    risk: Risiko
    requirements: Kontroll- og frigjøringskrav
  rows:
    - category: 'Omtillverkningsmateriale'
      examples: 'Lim, avfetter, reparasjonsmateriale, ventil-tetning, grunnmasse eller bytte av leverandør'
      risk: 'Høy'
      requirements: 'Tverrfunksjonell verifisering + validering av materialkompatibilitet og trykkholding + kundens frigjøring der dette gjelder'
    - category: 'Prosessforhold'
      examples: 'Overflatebehandling, temperatur/fuktighet ved varmluftsheving, pressetrykk, holdetid'
      risk: 'Høy'
      requirements: 'Konstruksjons- og kvalitetsfrigjøring med definert validering av temperatur- og fuktvinduer'
    - category: 'Utstyr og måleinstrumenter'
      examples: 'Manometre, lekkasjedetektorer, varmluftstermometre, ventilverktøy, testprogramvare'
      risk: 'Middels/Høy'
      requirements: 'Verifisering av kalibreringens gyldighet + vurdering av utstyrets egnethet'
    - category: 'Feilomfang'
      examples: 'Utvidelse av omtillverkningsområdet; overflatisk mikroreparasjon som vokser ut til kritiske soner for kant, søm eller ventilsete'
      risk: 'Høy'
      requirements: 'Strukturelt bærende flater: obligatorisk stopp og ny vurdering'
    - category: 'Inspeksjonsmetoder'
      examples: 'Metode for lekkasjedeteksjon, testtrykk (18.0 PSI), lagringstid (24u)'
      risk: 'Høy'
      requirements: 'Kvalitetsfrigjøring + bekreftelse av kundens tekniske samsvar'
    - category: 'Dokumentasjon og autorisering'
      examples: 'Omtillverkningsinstruksjon, inspeksjonsskjema, logikk for NCR-beslut, operatørkvalifisering'
      risk: 'Middels'
      requirements: 'Kontrollert dokumentrevisjon (Rev A → Rev B) + opplæringsbevis'

cc_containment:
  tagline: Stoppregelen
  title: Umiddelbar avgrensning når forholdene blir alvorlige
  body: |
    > «Den eksisterende omtillverkningsmetoden skal underkastes en verifisering og ikke anvendes på flere berørte produkter før endringen er vurdert og autorisert, med mindre en dokumentert midlertidig avvikelse er godkjent av Kvalitet og Konstruksjon.»

    Den pågående omtillverkningsmetoden settes umiddelbart på pause når reverifiseringen av omtillverkningen fortsetter å bli underkjent, når feilen berører strukturelt bærende soner (ventilbase, kant, søm, trykksoner i baugen og hekken), når et erstatningsmateriale ennå ikke er validert, eller når de pågående parameterne kolliderer med den kundengodkjente spesifikasjonen.

    Midlertidige avvikelser blir aldri varig praksis: hvert avvik bærer et definert gyldighetsvindu, et gjeldende partiomfang, en antallsgrense, valideringskrav og en mekanisme for automatisk utløpsdato. Et muntlig unntak er ikke et unntak — dokumenteres det ikke med sin utløpsdato, finnes det ikke.

cc_flow:
  tagline: Kontrollert lukket syklus i ni faser
  title: Fra endringsforespørsel til lukking og oppbevaring
  subtitle: 'En dokumentert syklus for hver parameterendring: foreslå, screene, vurdere, frigjøre, validere, pilote, verifisere, revidere, lukke.'
  steps:
    - step: '01'
      title: Endringsforespørsel (ECR)
      desc: 'Hver avdeling kan levere en forespørsel, men Konstruksjon, Kvalitet eller produksjonsledelsen er sponsor. ECR besvarer hvorfor endringen er nødvendig, hva som endres, hva som berøres og hvordan det skal verifiseres — med et endringskontrollnummer, koblede NCR/CAPA, nåværende mot foreslått parameter, berørte partier og klassifisering som midlertidig/permanent endring.'
    - step: '02'
      title: Første screening og avgrensning
      desc: 'Forespørselen screens først med hensyn til umiddelbar avgrensning: skal den pågående metoden stoppes nå? Hvis et midlertidig avvik tillates, begrenses det av et gyldighetsvindu, partiomfang, antallsgrense og automatisk utløpsdato.'
    - step: '03'
      title: Konsekvens- og risikovurdering
      desc: 'Konstruksjon, Kvalitet, Produksjon, Innkjøp/leverandørkjede og Prosjekt vurderer produktytelse, akseptkriterier, materialkompatibilitet, utseende, prosesskapasitet, utstyr og måleinstrumenter, personellkvalifisering, kundekrav, samsvar og sporbarhetsomfang.'
    - step: '04'
      title: Felles verifisering og frigjøring
      desc: 'Frigjøringen følger den faste autoriseringsmatrisen — ikke «hvem som skriver høyest». Høyrisikoendringer krever tverrfunksjonell frigjøring og, der det trengs, kundens skriftlige frigjøring før hvert forsøk.'
    - step: '05'
      title: Valideringsplan
      desc: 'For høyrisikoendringer kreves en godkjent valideringsplan før rutinemessig anvendelse: representative eksempelbrett, nåværende mot foreslått metode, testmetoder, akseptkriterier, inspeksjonsnivåer, ansvarlige og planlegging.'
    - step: '06'
      title: Kontrollerte piloter og innføring
      desc: 'De nye dokumentene frigjøres, og de foreldete versjonene rekvireres og merkes OBSOLETE; nye materialer og måleinstrumenter verifiseres og kalibreres; operatørene opplæres og kvalifiseres; det første partiet kjøres under forsterket inspeksjon med tydelig statusmerking.'
    - step: '07'
      title: Reverifisering og effektivitetsbevis
      desc: 'Førstegangsprosenten for omtillverkningen, godkjenningsandelen for reverifiseringen, gjentakelsesfrekvensen og aksepten av utseendet måles og verifiseres før endringen vurderes å være effektiv — et reparert brett behandles aldri som prosessvalidering.'
    - step: '08'
      title: Dokumentrevisjon og opplæring
      desc: 'Arbeidsinstruksjoner, inspeksjonsskjema, NCR-beslutsalternativer, parameterkort og opplæringsmateriell oppdateres til den nye revisjonen, med registrert praktisk opplæring og kvalifisering av operatøren.'
    - step: '09'
      title: Lukking og oppbevaring av registrene
      desc: 'Endringen lukkes først når valideringsbevisene, dokumentoppdateringene, opplæringsbevisene og effektiviteten av innføringen er verifisert og frigjort. Oppnås ikke det tilsiktede resultatet, revideres, utvides, settes på pause eller trekkes tilbake endringen.'

