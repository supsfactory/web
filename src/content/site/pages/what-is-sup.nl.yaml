body: |
  <h2>Wat is een opblaasbare SUP?</h2>
  <p>Een opblaasbare SUP (stand-up paddleboard) is een draagbaar watervoertuig van PVC drop-stitch materiaal dat stijf wordt wanneer het op hoge druk wordt opgeblazen (12–15 PSI). In tegenstelling tot traditionele stijve boards van schuim en glasvezel kan een opblaasbare SUP worden leeggeblazen, opgerold en opgeborgen in een opbergtas ter grootte van een rugzak.</p>
  <p>Ondanks het oppompen bereiken moderne SUP''s voor de meeste recreatieve en tourtoepassingen de stijfheid en prestaties van stijve boards. De beslissende innovatie is de <strong>drop-stitch constructie</strong>: duizenden polyesterdraden verbinden de bovenste en onderste laag van het weefsel en voorkomen dat het board onder druk opbolt als een ballon.</p>

  <h2>Hoe het werkt: de drop-stitch technologie</h2>
  <p>Het hart van elke opblaasbare SUP is de drop-stitch stof. Tijdens de productie worden duizenden draden tussen twee lagen PVC-bedekte stof geweven. Wanneer het board wordt opgeblazen:</p>
  <ul>
    <li>houden de draden de boven- en onderpanelen op een vaste afstand</li>
    <li>ontstaat er een plat en stijf platform dat bestand is tegen buigen en doorbuigen</li>
    <li>bereikt het board bij 12–15 PSI een stijfheid die vergelijkbaar is met die van boards met een EPS-schuimkern</li>
  </ul>

  <h2>Belangrijkste onderdelen</h2>
  <ul>
    <li><strong>PVC drop-stitch kern</strong> — de belangrijkste structurele laag voor de stijfheid van de vorm</li>
    <li><strong>Railband</strong> — versterkte randen die beschermen tegen schuren en stoten</li>
    <li><strong>EVA-schuim deck pad</strong> — antislipoppervlak voor comfort en stabiliteit op het board</li>
    <li><strong>Vinsysteem</strong> — verwijderbare vinnen voor directionele stabiliteit (typisch 2+1-configuratie)</li>
    <li><strong>Ventiel</strong> — terugslagventiel voor hoge druk voor oppompen en leeglaten</li>
  </ul>

  <h2>Typische toepassingen</h2>
  <ul>
    <li><strong>Peddelen op plat water</strong> — meren, rustige baaien en rivieren met langzame stroming</li>
    <li><strong>Toeren</strong> — peddelen over lange afstanden in open water, wat een efficiënte glijvlucht vereist</li>
    <li><strong>Surfen</strong> — kleine en middelgrote golven (van beginner tot gevorderde)</li>
    <li><strong>Vissen</strong> — stille toegang tot ondiep water voor vissers</li>
    <li><strong>Fitness</strong> — SUP-yoga, pilates en core-training op het water</li>
    <li><strong>Reizen</strong> — het draagbare design is ideaal voor vluchten en roadtrips</li>
  </ul>

  <h2>Opblaasbare SUP vs. stijve board: de belangrijkste verschillen</h2>
  <table>
    <tr><th>Aspect</th><th>Opblaasbare SUP</th><th>Stijve board (EPS/glasvezel)</th></tr>
    <tr><td>Draagbaarheid</td><td>Past in een rugzak</td><td>Vereist dakdragers of een groot voertuig</td></tr>
    <tr><td>Duurzaamheid</td><td>Bestand tegen stoten, geen deuken</td><td>Kan breken, deuken of delamineren</td></tr>
    <tr><td>Opslag</td><td>Past in een kast of de kofferbak</td><td>Vereist een speciale opslagruimte</td></tr>
    <tr><td>Prestaties</td><td>Uitstekend voor vrije tijd en toeren</td><td>Superieur in wedstrijden en gevorderd surfen</td></tr>
    <tr><td>Geschikt voor beginners</td><td>Zachter deck, minder risico op letsel</td><td>Hard oppervlak, minder tolerant</td></tr>
    <tr><td>Voorbereidingstijd</td><td>3–5 minuten oppompen</td><td>Klaar voor gebruik</td></tr>
  </table>

  <h2>De juiste SUP kiezen</h2>
  <p>Houd bij het kiezen van een opblaasbare SUP rekening met deze factoren:</p>
  <ul>
    <li><strong>Volume (liter)</strong> — bepaalt het drijfvermogen. Een groter volume draagt meer gewicht en biedt stabiliteit.</li>
    <li><strong>Lengte</strong> — langere boards (11–14 ft) glijden beter tijdens tochten; kortere boards (9–10 ft) zijn wendbaarder in de surf.</li>
    <li><strong>Breedte</strong> — bredere boards (32–36 inch) zijn stabieler; smallere boards (28–31 inch) zijn sneller.</li>
    <li><strong>Dikte</strong> — boards van 6 inch bieden de optimale stijfheid; boards van 4,7 inch zijn lichter en draagbaarder.</li>
    <li><strong>Bouwkwaliteit</strong> — kies voor smeltgelamineerde drop-stitch of stof voor een langere levensduur.</li>
  </ul>

  <h2>Veelgestelde vragen</h2>
  <h3>Is een opblaasbare SUP net zo stijf als een stijve board?</h3>
  <p>Bij correct oppompen (12–15 PSI) bereiken moderne drop-stitch SUP''s een vergelijkbare stijfheid voor recreatief peddelen. Stijve boards behouden nog steeds voordelen in wedstrijden en gevorderd surfen vanwege het lagere gewicht en de fijnere buigingseigenschappen.</p>

  <h3>Hoe lang duurt het oppompen?</h3>
  <p>Met een dubbelwerkende pomp bereiken de meeste boards 12–15 PSI in 3–5 minuten. Er zijn elektrische pompen verkrijgbaar die de tijd terugbrengen tot circa 2 minuten.</p>

  <h3>Kan ik een opblaasbare SUP meenemen in het vliegtuig?</h3>
  <p>Ja. Leeggeblazen en opgerold past de meeste SUP''s in een rugzak die voldoet aan de eisen voor ruimbagage. Controleer altijd de afmetings- en gewichtslimieten bij je luchtvaartmaatschappij.</p>

  <h3>Hoe lang gaan opblaasbare SUP''s mee?</h3>
  <p>Opblaasbare SUP''s zijn extreem duurzaam. De constructie van PVC van militaire kwaliteit is bestand tegen stoten, perforaties en UV-schade. Kleine lekken kun je ter plekke repareren met de meegeleverde reparatieset.</p>

  <h3>Welk onderhoud is nodig?</h3>
  <p>Spoel na gebruik in zoutwater af met zoet water. Bewaar op een koele, droge plek, beschermd tegen direct zonlicht. Houd bij langdurige opslag een lichte druk aan om de vorm te behouden zonder de naden te belasten.</p>

