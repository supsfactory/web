faqs:
  - question: 'Qual è più resistente: un SUP gonfiabile o uno rigido?'
    answer: I SUP gonfiabili sono generalmente più resistenti perché sopportano ammaccature, crepe e danni da impatto che danneggerebbero in modo permanente una tavola rigida.
  - question: Un SUP gonfiabile è più adatto ai principianti?
    answer: Sì. I SUP gonfiabili sono consigliati ai principianti perché sono più tolleranti, più facili da trasportare e causano meno spesso infortuni nelle cadute.
  - question: I SUP gonfiabili possono rendere bene quanto le tavole rigide?
    answer: Per la pagaiata ricreativa e i tour, i SUP gonfiabili raggiungono le prestazioni delle tavole rigide. Le tavole rigide restano superiori nelle gare e nel surf impegnativo, perché sono più leggere e offrono una flessione più raffinata.
body: |
  <h2>Le differenze fondamentali</h2>
  <p>I SUP gonfiabili (iSUP) e le tavole rigide soddisfano lo stesso scopo di base — stare in piedi e pagaiare sull'acqua — ma ci arrivano con metodi di costruzione completamente diversi. La scelta giusta dipende da come intendi usare la tavola.</p>

  <table>
    <tr><th>Fattore</th><th>SUP gonfiabile</th><th>SUP rigido</th></tr>
    <tr><td>Costruzione</td><td>PVC drop-stitch, gonfiato a 12–15 PSI</td><td>Nucleo in schiuma EPS, rivestito in fibra di vetro o epossidica</td></tr>
    <tr><td>Peso</td><td>18–28 lbs (solo tavola)</td><td>20–30 lbs (solo tavola)</td></tr>
    <tr><td>Dimensioni da imballato</td><td>Zaino (30 × 15 × 10 pollici)</td><td>Lunghezza intera (10–14 ft)</td></tr>
    <tr><td>Preparazione</td><td>3–5 minuti di gonfiaggio</td><td>Pronta all'uso</td></tr>
    <tr><td>Durata</td><td>5–10 anni con una buona manutenzione</td><td>3–8 anni (tende ad ammaccarsi)</td></tr>
  </table>

  <h2>Trasportabilità</h2>
  <p><strong>Vince il gonfiabile.</strong> Questo è il vantaggio più evidente. Un SUP gonfiabile si ripiega in uno zaino che sta nel bagagliaio di un'auto, in un armadio di casa o nel vano bagagli di un aereo. Chi viaggia, chi vive in appartamento e chiunque non abbia un portapacchi troverà i SUP gonfiabili decisamente più pratici.</p>
  <p>Le tavole rigide richiedono un portapacchi, un veicolo grande o un posto dedicato dove riporle. Sono difficili da trasportare e non possono viaggiare in aereo senza apposite scatole di spedizione.</p>

  <h2>Durata</h2>
  <p><strong>Vince il gonfiabile.</strong> I SUP gonfiabili sono realizzati in PVC di qualità militare che resiste a urti, perforazioni e danni UV. Se si fa cadere una tavola gonfiabile o si colpisce una roccia, questa rimbalza. Una tavola rigida, con lo stesso impatto, si scheggerebbe, si romperebbe o si delaminerebbe.</p>
  <p>Le tavole rigide sono più soggette all'usura quotidiana. Una singola caduta sul cemento può causare un'ammaccatura permanente che compromette le prestazioni e consente l'ingresso di acqua.</p>

  <h2>Prestazioni</h2>
  <p><strong>La tavola rigida vince ai massimi livelli.</strong> Nella pagaiata ricreativa e nei tour a velocità moderate, i due tipi di tavola si comportano in modo simile. Le tavole rigide hanno vantaggi in:</p>
  <ul>
    <li><strong>Velocità</strong> —Le tavole rigide sono più leggere e più rigide, il che si traduce in una migliore planata e una maggiore velocità di punta</li>
    <li><strong>Surf</strong> —Le tavole rigide offrono transizioni rail-to-rail più reattive e un migliore comportamento sulle onde</li>
    <li><strong>Gare</strong> —Nelle gare competitive si usano quasi esclusivamente tavole rigide per il loro vantaggio in termini di peso e rigidità</li>
  </ul>
  <p>Per il paddler ricreativo medio, queste differenze di prestazioni sono marginali. La maggior parte dei paddler non riuscirà a superare i limiti di una tavola gonfiabile di alta qualità.</p>

  <h2>Facilità per i principianti</h2>
  <p><strong>Vince il gonfiabile.</strong> I SUP gonfiabili sono più facili per i principianti perché:</p>
  <ul>
    <li>La superficie del deck più morbida è più comoda e causa meno spesso infortuni nelle cadute</li>
    <li>Le tavole gonfiabili più larghe e spesse offrono una maggiore stabilità primaria</li>
    <li>Il costo di acquisto inferiore rende l'ingresso più accessibile</li>
    <li>Il trasporto più semplice significa più occasioni di pagaiare</li>
  </ul>

  <h2>Stoccaggio e manutenzione</h2>
  <p>I SUP gonfiabili devono essere asciugati e piegati correttamente prima dello stoccaggio. Le tavole rigide possono essere riposte montate, ma richiedono protezione da sole, calore e urti. Entrambe traggono beneficio da un risciacquo con acqua dolce dopo l'uso in acqua salata.</p>

  <h2>Raccomandazione</h2>
  <p><strong>Scegli un SUP gonfiabile se:</strong> viaggi, hai poco spazio di stoccaggio, pagai per svago o sei un principiante. Il 90 % dei paddler è ben servito da una tavola gonfiabile di alta qualità.</p>
  <p><strong>Scegli una tavola rigida se:</strong> partecipi a gare competitive, surfati onde impegnative o metti le prestazioni massime davanti a trasportabilità e durata.</p>

  <h2>FAQ</h2>
  <h3>Qual è più resistente: un SUP gonfiabile o uno rigido?</h3>
  <p>I SUP gonfiabili sono generalmente più resistenti perché sopportano ammaccature, crepe e danni da impatto che danneggerebbero in modo permanente una tavola rigida.</p>

  <h3>Un SUP gonfiabile è più adatto ai principianti?</h3>
  <p>Sì. I SUP gonfiabili sono consigliati ai principianti perché sono più tolleranti, più facili da trasportare e causano meno spesso infortuni nelle cadute.</p>

  <h3>I SUP gonfiabili possono rendere bene quanto le tavole rigide?</h3>
  <p>Per la pagaiata ricreativa e i tour, i SUP gonfiabili raggiungono le prestazioni delle tavole rigide. Le tavole rigide restano superiori nelle gare e nel surf impegnativo, perché sono più leggere e offrono una flessione più raffinata.</p>

