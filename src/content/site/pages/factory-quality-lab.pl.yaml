hero:
  tagline: Laboratorium kontroli jakości
  title: Laboratorium badawcze i zapewnienie jakości
  subtitle: Niezależne laboratorium jakości z procesami zgodnymi z ISO 9001 — każda sztuka badana przed wysyłką

answer:
  label: 'Wprost'
  text: '100% sztuk przechodzi próbę ciśnieniową przy 18.0 PSI przez 24 godziny, z automatycznym odrzuceniem po spadku ciśnienia powyżej 0.50 PSI. Partie surowej tkaniny są weryfikowane wg ASTM D751 i ISO 4674, a próby odrywania spoin wykonujemy co 50 sztuk, z próbkowaniem końcowym AQL 2.5 wg ISO 2859.'
  verified: 'Wrzesień 2026'

intro: Vatrad prowadzi dedykowane laboratorium kontroli jakości, które działa niezależnie od produkcji. Każda partia surowca i każda gotowa deska SUP przech przez udokumentowane protokoły inspekcji przed zatwierdzeniem. Nasz zespół QC raportuje bezpośrednio do zarządu, co zapewnia bezstronność decyzji jakościowych.

highlights:
  - value: 100%
    label: Sztuk poddanych próbom ciśnieniowym
    detail: Każda komora, każda deska
  - value: 24 h
    label: Czas badania retencji powietrza
    detail: Przy ciśnieniu znamionowym 18.0 PSI
  - value: '&lt;5%'
    label: Dopuszczalny maksymalny spadek ciśnienia
    detail: W okresie 24-godzinnego utrzymania
  - value: AQL 2.5
    label: Próg wad istotnych
    detail: Zgodnie z próbkowaniem ISO 2859

test_procedures:
  - title: Inspekcja surowców
    description: Każda partia przychodzącego PCV, Hypalonu, tkaniny drop-stitch i osprzętu jest badana przed odbiorem. Weryfikujemy wytrzymałość na rozciąganie (ASTM D751), odporność na rozdarcie (ISO 4674) i odporność na UV. Materiały niezgodne są izolowane i zwracane.
    standards:
      - ASTM D751 (rozciąganie)
      - ISO 4674 (rozdarcie)
      - ISO 4892 (UV)
  - title: Punkty kontrolne QC w trakcie procesu
    description: Operatorzy produkcji wykonują kontrolę własną na każdym etapie. Audytorzy QC prowadzą losowe pobieranie próbek w trakcie zmiany. Próby odrywania spoin wykonuje się co 50 sztuk. Kontrole wymiarowe wykonuje się co 20. elemencie.
    standards:
      - ASTM D751 (odrywanie)
      - Wewnętrzna lista kontrolna 100 punktów
      - Próbkowanie ISO 2859
  - title: 48-godzinna próba retencji powietrza
    description: Każda komora rury jest pompowana do 18.0 PSI i utrzymywana przez 24 godziny. Czujniki ciśnienia zapisują dane w sposób ciągły z kompensacją temperatury. Każda komora, w której spadek ciśnienia przekroczy 0.50 PSI, uruchamia automatyczną ponowną inspekcję partii.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Badania nośności i równowagi
    description: Gotowe deski bada się przy maksymalnej nośności znamionowej pod kątem stabilności, prześwitu i prowadzenia. Każda deska przechodzi próbę wodną przed zatwierdzeniem inspekcji końcowej.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Uniwersalna maszyna wytrzymałościowa (rozciąganie)
    spec: 5 kN, zgodna z ASTM D751
  - name: Urządzenie do pomiaru spadku ciśnienia
    spec: Wielokanałowe, 0–50 psi, z zapisem danych
  - name: Komora klimatyczna do badań starzeniowych
    spec: ISO 4892, 1,000 h cykli
  - name: Grubościomierz (cyfrowy)
    spec: Rozdzielczość 0.01 mm
  - name: Maszyna do badania odrywania spoin
    spec: Napędzana, udźwig 50 N
  - name: Komora temperaturowa
    spec: od -40 °C do +100 °C
  - name: Wanna do wykrywania przecieków
    spec: 6 m × 2 m, podświetlana

lab_evidence:
  tagline: Pakiety raportów z badań
  title: 'Pobierz rzeczywiste raporty z badań laboratoryjnych'
  subtitle: 'To same dwujęzyczne kontrolowane zapisy, które zamyka nasz zespół jakości — struktura, metody, kryteria i wyniki, z usuniętymi polami poufnymi. Każdy pakiet odpowiada jednej z siedmiu bramek inspekcji.'
  items:
    - title: 'IQC — Raporty z materiałów przychodzących'
      description: 'Weryfikacja tkaniny, rolki PCV, zaworów i komponentów względem zatwierdzonej specyfikacji.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty IQC (PDF)'
    - title: 'IPQC — Raporty z procesu i pierwszego egzemplarza'
      description: 'Zapisy inspekcji pierwszego egzemplarza i w trakcie procesu względem zablokowanej rewizji.'
      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty IPQC (PDF)'
    - title: 'Szczelność powietrzna — zapisy ciśnienia i przecieków'
      description: 'Wykrywanie przecieków na 100% długości szwów, szczelność zaworów i weryfikacja utrzymania ciśnienia 24 h.'
      icon: tabler:waves
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty ze szczelności powietrznej (PDF)'
    - title: 'FQC — Raporty z badań końcowych deski'
      description: 'Inspekcja końcowa względem zatwierdzonej próbki — wymiary, wygląd i gniazdo płetwy.'
      icon: tabler:shield-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty FQC (PDF)'
    - title: 'PSI — Raporty z pakowania i inspekcji przed wysyłką'
      description: 'Zapisy kompletności zestawu, klasy kodu kreskowego, oznaczeń kartonu i bezpieczeństwa przy upuszczaniu.'
      icon: tabler:package
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty PSI (PDF)'
    - title: 'Pakiet zatwierdzenia wysyłki i identyfikowalności'
      description: 'Autoryzacja zatwierdzenia i identyfikowalność partii przypisana do specyfikacji, projektu graficznego i BOM.'
      icon: tabler:history
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Pobierz raporty z zatwierdzenia wysyłki (PDF)'
    - title: 'Kompletny pakiet jakości'
      description: 'Jeden pakiet obejmujący cały system dokumentacji — QIP, zapisy bramek, identyfikowalność i kontrolę NCR.'
      icon: tabler:books
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'Pobierz pakiet dokumentacji (PDF)'

