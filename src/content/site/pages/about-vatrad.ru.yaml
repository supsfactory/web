values_section:
  title: Как завод работает с брендами
  subtitle: 'Три принципа, которыми руководствуется завод Vatrad в каждом проекте.'
  columns: 3
  items:
    - title: Инженерная разработка до производства
      description: 'Каждый проект начинается с требований, чертежей и физического образца: форма корпуса, класс drop-stitch, размещение графики и упаковка согласовываются до запуска производства, а не выявляются на линии.'
      icon: 'tabler:settings'
    - title: Одна команда, одна площадка
      description: 'Проектирование, раскрой, сварка, сборка и испытания происходят на одной площадке 12,500 m². Никаких передач через торговые компании: те, кто отвечает на ваши вопросы, и есть те, кто изготавливает ваши доски.'
      icon: 'tabler:building-factory-2'
    - title: Сначала малые партии
      description: 'Малые партии с ко-брендингом начинаются с 5–10 единиц, а серийное производство выполняется объёмом 90–100+ единиц в партии (один рулон drop-stitch 150 m), поэтому бренды сначала проверяют рынок, а затем масштабируются, сохраняя оснастку и макеты для повторных заказов.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Что предоставляет завод
  subtitle: 'Производственные услуги, доступные клиентам iSupfactory.'
  columns: 2
  items:
    - title: Индивидуальная разработка SUP
      description: 'Оценка требований, спецификация, подбор материалов, графика, прототипирование, утверждение образца и серийное производство индивидуальных надувных изделий SUP.'
      icon: 'tabler:bulb'
    - title: Производство под собственной маркой
      description: 'Ваш логотип, цвета и упаковка на проверенных платформах коммерческого класса: доска, накладка на палубу, аксессуары и короба несут вашу айдентику, без брендирования завода.'
      icon: 'tabler:tag'
    - title: Производство OEM / ODM
      description: 'Полное OEM- и ODM-производство надувных досок SUP по чертежам клиента или совместно разработанным конструкциям, включая нестандартные пресс-формы для новых форм досок.'
      icon: 'tabler:package'
    - title: Оснащение флотов
      description: 'Брендированные партии досок для курортов, клубов, школ и прокатных операторов, с подходящими аксессуарами и партиями, удобными для флотов.'
      icon: 'tabler:users-group'
certifications_section:
  title: 'Сертификация и соответствие требованиям'
  subtitle: 'Заводу документированная система соответствия позволяет поставлять продукцию в ЕС, США и страны Азиатско-Тихоокеанского региона.'
  columns: 2
  items:
    - title: Сертификация CE
      description: 'Линейки надувных досок SUP и плавсредств соответствуют требованиям директив ЕС по безопасности; документация предоставляется для каждого рынка.'
      icon: 'tabler:certificate'
    - title: Система качества ISO 9001
      description: 'Производственная площадка работает по системе менеджмента качества ISO 9001, охватывающей входной контроль материалов, контроль в процессе производства и финальный контроль.'
      icon: 'tabler:badge-check'
    - title: Соответствие BSCI по социальным требованиям
      description: 'Социальная ответственность подтверждена аудитом BSCI, охватывающим условия труда и соответствие завода требованиям.'
      icon: 'tabler:shield-check'
    - title: Соответствие REACH по материалам
      description: 'Материалы соответствуют регламенту ЕС REACH в части химической безопасности.'
      icon: 'tabler:flask'
    - title: Одобрение USCG
      description: 'Производство надувных плавсредств одобрено Береговой охраной США.'
      icon: 'tabler:anchor'
    - title: Испытания продукции
      description: 'Испытания плавучести, грузоподъёмности, прочности швов, устойчивости к УФ-излучению, износостойкости и удержания давления на каждой производственной линии.'
      icon: 'tabler:test-pipe'
