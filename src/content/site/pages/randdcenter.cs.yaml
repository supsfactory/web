pillars:
  - title: Technologický posun
    desc: Průkopnictví v nových materiálech, konstrukcích a výrobních postupech, které zajistí vynikající výkon a životnost produktů.
    icon: tech
  - title: Pokročilé materiály
    desc: Výzkum špičkových PVC, Hypalonu, kompozitů a udržitelných alternativ pro lepší vlastnosti produktů.
    icon: materials
