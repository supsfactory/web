    desc: 'Zásadní závazek: věnujeme se odpovědnému zacházení se životním prostředím prostřednictvím udržitelné výroby a recyklovatelných materiálů.'
    icon: sustainability

capabilities:
  tagline: Schopnosti
  title: Výzkumné a vývojové schopnosti
  subtitle: Čtyři hlavní obory, které nám dávají kompletní kontrolu nad vývojem produktu — od výzkumu suroviny po konečnou certifikaci.
  groups:
    - title: Vědy o materiálech a textilní technologie
      items:
        - Analýza a optimalizace formulací PVC a Hypalonu
        - Vývoj UV stabilizátorů, zpomalovačů hoření a antimikrobiálních přísad
        - Inženýrství vícevrstvého laminování a adheze tkanin
        - Zkoušky urychleného stárnutí (UV, teplota, vlhkost, slaná mlha)
    - title: Návrh trupů a hydrodynamika
      items:
        - Parametrický 3D návrh trupu a optimalizace CFD
        - Metoda konečných prvků pro konstrukční a rázová zatížení
        - Zkoušky tažených modelů a validace výkonových parametrů
        - Vývoj vlastních trupů pro speciální misní profily
    - title: Svařovací a spojovací technologie
      items:
        - Vývoj a optimalizace procesu dielektrického HF svařování
        - Metody svařování horkým vzduchem, horkým klínem a ultrazvukem
        - Kvalifikace lepených spojů a pásky pro švy
        - Modelování pevnosti svarů a předpověď životnosti
    - title: Zkoušení, certifikace a shoda
      items:
        - Zkoušení systému řízení kvality a shoda s CE
        - Nezávislé zkoušky třetí strany a podpora certifikace
        - Vývoj vlastních zkušebních protokolů pro kvalifikaci nákupů
        - Analýza provozních poruch a šetření hlavních příčin

