intro:
  - Výzkumné a vývojové centrum (R&D) společnosti Vatrad je hnací silou naší mise revolučně měnit vybavení pro vodní sporty. Po celém světě dáváme milovníkům vodních sportů bezpečnější, pohodlnější a příjemnější produkty díky vytrvalým inovacím v nafukovacích stojících paddle boardech (SUP) a člunech. Náš oddaný tým inženýrů, designérů a nadšenců vodních sportů utváří budoucnost odvětví a stále posouvá laťku kvality, výkonu a udržitelnosti.
  - Naše výzkumné a vývojové pracoviště shrnuje pod jednu střechu specialisty na materiály, námořní architekty a výrobní inženýry. Od formulace tkanin a simulace trupu přes vývoj svařovacích procesů až po plné námořní zkoušky — každá fáze vývoje produktu je poháněna daty a potvrzována zkouškami.

mission:
