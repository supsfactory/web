vision:
  tagline: Naše vize
  title: Utváříme budoucnost vodních sportů
  body: Vatrad usiluje o vedoucí postavení v oboru nafukovacích člunů a SUP díky průběžným inovacím, nezměnné kvalitě a pevné oddanosti bezpečnosti a udržitelnosti — a tím obohacuje zážitky milovníků vodních sportů po celém světě. Výzkumné a vývojové centrum Vatrad je místem, kde se potká vášeň s inovací a kde se nastavují nové standardy pro obor vodních sportů.

labs_section:
  tagline: Laboratoře
  title: Naše laboratoře
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: Laboratoř tkanin PVC
      description: Průběžný výzkum a zkoušení trubkových tkanin z PVC a Hypalonu z hlediska pevnosti v tahu, odolnosti vůči UV, oděru a mrazuvzdornosti, aby byla zajištěna dlouhodobá spolehlivost v námořním prostředí.
      href: /cs/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Ateliér návrhu trupů
      description: Návrh založený na CAD a metoda konečných prvků pro trupy z HDPE, hliníku a skelného laminátu. Každý trup se digitálně simuluje z hlediska rozložení napětí a odolnosti proti nárazům, než se postaví první prototyp.
      href: /cs/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: Centrum HF svařování
      description: Specializované pracoviště pro vysokofrekvenční svařování s přesnou kontrolou teploty a tlaku, které vyrábí pevné a vzduchotěsné švy splňující oborové normy pro nafukovací plavidla.
      href: /cs/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hydrodynamická zkušební nádrž
      description: Zkoušky zmenšených modelů v naší vlastní zkušební nádrži za účelem optimalizace tvaru trupu, rychlosti na skluzu, stability a spotřeby paliva při různých zatíženích a mořských podmínkách.
      href: /cs/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypová dílna
      description: Pracoviště pro prototypování a vybavení v plné velikosti, kde se nové modely vyrábějí, vyladí a zkoušejí na moři. Každý prototyp před schválením výroby absolvuje nejméně 20hodinový program zkoušek ve vodě.
      href: /cs/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Laboratoř kvality a inspekce
      description: Specializovaná laboratoř zabezpečení kvality, která provádí zkoušky tahem, cyklické zkoušky těsnosti, zkoušky odolnosti švů a certifikaci materiálů, aby každý člun opouštějící dílnu odpovídal našim publikovaným specifikacím.
      href: /cs/randdcenter/quality-inspection-lab
