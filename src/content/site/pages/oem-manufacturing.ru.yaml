hero:
  tagline: OEM-производство
  title: 'OEM-производство SUP на заказ — ваша спецификация, наш завод'
  subtitle: 'Вы предоставляете дизайн, чертёж или проверенную платформу — мы производим её в контейнерных объёмах. Инженерная проверка в течение одного рабочего дня, образцы за 7–12 дней, производственные серии за 25–35 дней после подтверждения заказа и задатка, отгрузка под вашим брендом.'

answer:
  label: 'Короткий ответ'
  text: 'OEM-производство ведётся по вашей спецификации. MOQ подтверждается конфигурацией проекта, а не фиксированной цифрой: стандартные серии составляют 90–100 шт. на партию с рулона ткани drop-stitch 150 m, пилотные партии начинаются с 20–50 шт. на готовых платформах, и каждый проект проходит через этап образца (1–2 шт.) перед серией. Образцы отгружаются за 7–12 дней; производственные серии занимают 25–35 дней после подтверждения заказа и задатка, плюс 15–20 дней при необходимости новой оснастки.'
  verified: 'Сентябрь 2026'

features:
  title: Возможности OEM
  subtitle: 'Всё необходимое, чтобы превратить вашу спецификацию, чертёж или платформу в отгруженный контейнер.'
  items:
    - title: Производство по вашей спецификации
      description: 'Ваши чертежи, габариты, марки материалов и графика выполняются в точности по переданному — наши инженеры проверяют спецификацию на технологичность до расчёта цены.'
      icon: 'tabler:file-check'
    - title: Адаптация платформы
      description: 'Проверенные производственные платформы можно адаптировать под ваши изменения формы, спецификацию бортов, расположение клапанов и аксессуары — без полной разработки пресс-формы.'
      icon: 'tabler:arrows-diff'
    - title: Специальные пресс-формы
      description: 'Новые формы досок по вашим чертежам или CAD — проектирование и изготовление пресс-форм собственными силами. Оснастка добавляет 15–20 дней к сроку проекта.'
      icon: 'tabler:shapes'
    - title: Прототип и образец
      description: 'Физический образец изготавливается и утверждается до любой серии, как правило в течение 7–12 дней, с проведением испытаний на воде для новых форм.'
      icon: 'tabler:tools'
    - title: Производство в контейнерных объёмах
      description: 'Стандартные серии по 90–100 шт. на дизайн (один полный рулон ткани 150 m), пилотные партии от 20–50 шт., срок изготовления 25–35 дней после подтверждения заказа.'
      icon: 'tabler:package'
    - title: CE и соответствие требованиям рынков
      description: 'Документация о соответствии CE доступна для применимых конфигураций для рынка ЕС — область действия подтверждается по каждому проекту. Документация по ISO 9001, BSCI, REACH и RoHS готовится для каждого рынка, куда вы поставляете.'
      icon: 'tabler:certificate'
    - title: Контроль и прослеживаемость
      description: 'Испытание на удержание давления 18.0 PSI в течение 24 часов с автоматическим браком при падении более 0.50 PSI, чек-лист сборки из 100 пунктов и 10-летняя прослеживаемость партий по ERP.'
      icon: 'tabler:shield-check'
    - title: Мировая логистика
      description: 'FOB Циндао, CIF и DDP более чем в 50 стран, при этом экспортная упаковка и таможенное оформление берёт на себя наша логистическая команда.'
      icon: 'tabler:world'

customization:
  tagline: Изготовление по вашей спецификации
  title: Точки спецификации OEM
  subtitle: 'Это точки спецификации, которые вы контролируете в проекте OEM — ваш документ спецификации является производственным договором:'
  items:
    - 'Габариты доски — длина, ширина, толщина, rocker и объём по вашим чертежам или целевым пользователям'
    - 'Структура материала — число слоёв и марка PVC, плотность drop-stitch, стабилизаторы жёсткости и усиления бортов'
    - 'Графика и цвета — ваша графика с неограниченным числом палитр либо поддержка нашей внутренней дизайнерской команды'
    - 'EVA-коврик — накладки на палубу, вырезанные по вашему эскизу, логотипы и цвета палубы на каждой доске'
    - 'Ручки и D-кольца — расположение, количество и спецификация фурнитуры под ваш сценарий использования'
    - 'Системы плавников — конфигурации с одним, двумя или тремя плавниками и коробки под вашу спецификацию'
    - 'Вёсла, насосы, липы и аксессуары — ваш комплект, ваш брендинг'
    - 'Упаковка и розничная презентация — розничные коробки, транспортная упаковка для морской доставки и стойки для торговли под вашим брендом'
    - 'Этикетки и знаки соответствия — серийные этикетки, логотипы и документация по каждому рынку, подготовленная для вашего региона экспорта'

faq_section:
  tagline: FAQ
  title: Вопросы об OEM-производстве
  questions:
    - q: Как начать OEM-проект со своим дизайном?
      a: 'Пришлите ваши чертежи, образец для ориентира или письменную спецификацию. Наша инженерная проверка подтверждает технологичность и возвращает коммерческое предложение в течение одного рабочего дня — это наш стандартный норматив, а при необходимости NDA подписывается до любого обмена файлами.'
    - q: Каков MOQ для надувных SUP по OEM?
      a: 'MOQ подтверждается конфигурацией проекта — корпус и оснастка, сочетания цветов и PVC, графика, упаковка и аксессуары. Стандартное серийное производство выполняется партиями по 90–100 шт. (один рулон drop-stitch 150 m), тогда как пилотные партии начинаются с 20–50 шт. на готовых платформах. Полную логику расчёта см. в нашем руководстве по MOQ и гибкому брендингу.'
    - q: Каков типичный срок изготовления заказа OEM?
      a: 'Производственные серии занимают 25–35 дней от подтверждения заказа и задатка. Разработка специальной пресс-формы добавляет 15–20 дней на оснастку. Прототипы обычно отгружаются в течение 7–12 дней.'
    - q: Можете ли вы производить только по моим существующим чертежам?
      a: 'Да. OEM работает по вашей спецификации как есть — дизайн принадлежит вам. Наши инженеры проверяют чертежи на технологическую реализуемость и указывают на любые противоречия в спецификации до начала оснастки или раскроя, а утверждённый образец становится эталоном производства.'
    - q: Предоставляете ли вы образцы до начала производства?
      a: 'Да. Физический образец изготавливается и утверждается до любой производственной серии, как правило в течение 7–12 дней, и служит эталоном для всех последующих проверок качества.'
    - q: Какими сертификатами располагает завод?
      a: 'ISO 9001:2015 — менеджмент качества (на уровне всего завода), BSCI — социальная ответственность (аудит площадки amfori), документация о соответствии CE для применимых конфигураций для рынка ЕС (область действия подтверждается по каждому проекту), REACH (материалы) и RoHS (электронные аксессуары). Полный комплект документации о соответствии предоставляется с каждой отгрузкой OEM, подготовленный под ваши целевые рынки.'
    - q: Как обеспечивается контроль качества в серии OEM?
      a: 'Производство ведётся при многоточечном контроле качества — входной контроль материалов, операционный и финальный контроль — с испытанием на удержание давления 18.0 PSI в течение 24 часов (автоматический брак при падении более 0.50 PSI), чек-листом сборки из 100 пунктов и 10-летней прослеживаемостью партий по ERP с присвоением серийного номера.'
    - q: Каковы ваши условия поставки?
      a: 'FOB Циндао, CIF в основные мировые порты либо DDP для квалифицированных партнёров. Мы отгружаем более чем в 50 стран на рынках ЕС, США, Австралии и Азии.'

process:
  title: Процесс OEM — от спецификации до отгруженного контейнера
  subtitle: 'Семь контролируемых этапов выполняет одна заводская команда, поэтому каждый шаг от вашей первой спецификации до загруженного контейнера остаётся задокументированным и в графике.'
  steps:
    - phase: '01'
      title: Проверка спецификации и расчёт цены
      period: 1 рабочий день
      items:
        - 'Вы предоставляете чертежи, спецификацию или образцы для ориентира — наши инженеры проверяют технологичность.'
        - 'В течение одного рабочего дня вы получаете подробное коммерческое предложение и план проекта.'
    - phase: '02'
      title: Инженерное подтверждение
      period: Неделя 1
      items:
        - 'Габариты корпуса, марка drop-stitch, спецификации PVC и конструкция бортов подтверждаются по вашему документу.'
        - 'Решения по пресс-форме или платформе фиксируются — изготовление специальной оснастки начинается здесь, когда это требуется.'
    - phase: '03'
      title: Прототип и образец
      period: 7–12 дней
      items:
        - 'Изготавливается физический образец, который отправляется вам на рассмотрение — для новых форм включены испытания на воде.'
        - 'Образец (1–2 шт.) подтверждает вашу спецификацию до любых обязательств по объёму.'
    - phase: '04'
      title: Испытания и валидация
      period: Параллельно
      items:
        - 'Проверки герметичности, удержания давления, прочности швов, нагрузки и УФ-стойкости для каждой производственной линии.'
        - 'Документация по CE, ISO 9001, BSCI, REACH и RoHS готовится для ваших рынков экспорта.'
    - phase: '05'
      title: Утверждение и подтверждение
      period: После приёмки образца
      items:
        - 'Вы утверждаете образец и графику; заказ и задаток фиксируют слот под производство.'
        - 'Предпроизводственный план подтверждает даты, количество, упаковку и порт отгрузки.'
    - phase: '06'
      title: Производство
      period: 25–35 дней
      items:
        - 'Производство ведётся при многоточечном контроле качества — входной контроль материалов, операционный и финальный контроль.'
        - 'От пилотных заказов (20–50 шт.) на готовых платформах до полных партий по рулону 150 m (90–100+ шт.) для стандартного серийного производства.'
    - phase: '07'
      title: Упаковка и отгрузка
      period: 1 день + доставка
      items:
        - 'Экспортная упаковка с серийными этикетками моделей, затем FOB Циндао, CIF или DDP более чем в 50 стран.'
        - 'Таможенная документация, отслеживание и поддержка повторных заказов включены на каждом этапе.'

