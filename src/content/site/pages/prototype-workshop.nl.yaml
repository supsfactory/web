answer:
  label: 'Kort antwoord'
  text: 'We zetten een CAD-model om in een vaar- en testbare monsterplank in 7–12 dagen: opblaasbare prototyping, watertests met golfslag, iteraties op rail en neus, en daarna de beslissing over het productiegereedschap. De complete bouw van maatmatrijzen kost 15–20 dagen bovenop de standaard productiedoorlooptijd van 25–35 dagen.'
  verified: 'September 2026'

