nc_severity:
  tagline: Severitatea defectului și autoritatea
  title: Clasificarea severității și autoritatea de eliminare
  subtitle: Nu orice neconformitate este tratată la același nivel — autoritatea de eliminare crește odată cu severitatea defectului, de la semnarea la nivel de linie până la Consiliul de Analiză a Materialelor și aprobarea clientului.
  headers:
    severity: Severitate
    examples: Exemple tipice
    authority: Autoritate de eliminare și control
    control: Condiție de eliberare
  rows:
    - severity: 'Minoră'
      examples: 'Cmot de carton, ușoară abatere de poziționare a unui accesoriu necritic'
      authority: 'Semnare la fața locului de către responsabilul de secție al calității și supervizorul de linie, înlocuire sau eliberare'
      control: 'Înregistrat în NCR; fără impact asupra funcționării produsului sau a cerințelor clientului'
    - severity: 'Majoră'
      examples: 'Scurgere lentă a supapei, abatere a padscai EVA peste toleranță (>2 mm), accesoriu lipsă'
      authority: 'Managerul de Control al Calității și Inginerul Tehnic emit o instrucțiune de reprocesare controlată (SRI)'
      control: 'Retestare independentă la 100% a caracteristicii inițiale eșuate și a caracteristicilor afectate, înainte de eliberare'
    - severity: 'Critică'
      examples: 'Deteriorarea camerei drop-stitch, bule sau fisură pe margine sub presiune ridicată, tipărire greșită a logo-ului clientului sau abatere de culoare'
      authority: 'Decizie a Consiliului de Analiză a Materialelor (MRB); aprobare scrisă din partea clientului unde este necesară'
      control: 'Fără eliberare fără o aprobare autorizată; altfel, distrugere fizică obligatorie în prezența martorilor'

nc_matrix:
  tagline: Matricea protocoalelor de inginerie
  title: Matricea eliminării și reinspecției defectelor SUP
  subtitle: 'Protocoale tehnice standard aplicate celor mai frecvente abateri de producție — aceiași parametri cuantificați pe care clienții îi pot verifica în cadrul auditurilor.'
  headers:
    defect: Categorie de defect
    protocol: Protocol de eliminare controlat
    validation: Reinspecție și validare independentă
  rows:
    - defect: 'Scurgere lentă la supapă'
      protocol: 'Izolați placa. Demontați miezul supapei cu o cheie dinamometrică calibrată (25 N·m), curățați filetele interioare, înlocuiți inelul din silicon și reaplicați cuplul.'
      validation: 'Scufundați în soluție cu bule; reumflați la 18 PSI pentru un retest complet de 24 de ore al scăderii de presiune (ΔP ≤ 0.05 PSI).'
    - defect: 'Bule de aer la cusătura marginii'
      protocol: 'Puneți în carantină lotul de tură. Delaminați zona cu bule folosind un duz cu aport termic, curățați suprafața cu solvent, aplicați adeziv PU bicomponent la presiune de 5 bar.'
      validation: 'Inspecție vizuală și tactilă a 100% dintre cusături; încercare de presiune de verificare structurală (18.0 PSI) plus menținere a etanșeității la aer pe 24 de ore.'
    - defect: 'Abaterea padscai EVA'
      protocol: 'Dezlipire cu aport termic folosind o unealtă cu temperatură reglată (80°C). Realiniați cu o șablu de poziționare precis din acrilic.'
      validation: 'Verificarea toleranțelor de joc (≤ ±1,5 mm), controlul simetriei modelului romboidal, test de adeziune al marginilor la 100%.'
    - defect: 'Eroră de branding / logo'
      protocol: 'Oprire imediată a liniei de tipărire. Rețineți toate panourile tipărite. Analizați revizia vectorială împreună cu clientul; zero modificări neaprobate.'
      validation: 'Verificare a culorii cu spectrofotometrul (ΔE ≤ 1,5); verificare vizuală a alinierii textului la 100%, față de fișierul PDF vectorial master semnat de client.'
    - defect: 'Nepotrivire de ambalare / SKU lipsă'
      protocol: 'Puneți în carantină paletul de export. Deschideți ambalajele și efectuați o verificare punctuală a listei de materiale la 100% (pompa, aripioara, cordonul, vâsla, tubul de reparații).'
      validation: 'Validarea cântăririi electronice dinamice integrate (±30 g abatere); verificare cu scanner optic de coduri de barej 2D.'

nc_scrap:
  tagline: Scurgere zero către piață
  title: 'Rebut și distrugere în prezența martorilor — protocol anti-deviere cu zero defecte'
  body: |
    Partenerii de marcă internaționali au nevoie de certitudinea că plăcile defecte nu vor ajunge niciodată în retail secundar, pe piețe paralele sau prin canale de comerț electronic. Plăcile care nu pot fi aduse la conformitate sunt distruse conform unui protocol atestat, cu martori și înregistrări:

    **1. Tăierea componentelor metalice și a accesoriilor.** Sub supravegherea Directorului QA, o foarfecă hidraulică îndepărtează toate inelele în D din inox 316, benzile mânerelor de transport și catramele de bagaj. Ansamblul supapei de umflare și baza cutiei pentru aripioare (US-Box / aripioară cu fixare rapidă) sunt tăiate la rădăcina plăcii, eliminând orice componentă recuperabilă.

    **2. Sectionarea miezului drop-stitch și a marginilor.** Miezul intern drop-stitch este tăiat transversal, prin placă și deck, cu tăieturi adânci în cruce (≥ 50 cm pe tăietură), iar marginile laterale ranforsate sunt secționate în cel puțin 4 segmente — distrugând definitiv capacitatea de etanșeitate și flotabilitate.

    **3. Seif video și foto.** Distrugerea este înregistrată ca un video 1080p nemonțat, cu planuri de detaliu ale codului de barej serial, ale procesului de tăiere, al sectionării miezului și al grămezii finale de rebut cântărită. Video-ul este amprentat (SHA-256) și arhivat pe un server controlat, pentru ≥ 5 ani.

    **4. Eliminare certificată a deșeurilor.** Toate fragmentele de PVC și drop-stitch sunt cântărite, înregistrate în registrul de ieșiri și transportate exclusiv de parteneri calificați de reciclare a polimerilor — niciun rest nu părăsește instalația pe altă cale.

    > **Garanție de protecție a mărcii:** QINGDAO VATRAD GROUP CO., LTD. garantează distrugerea în proporție de 100% a ambarcatiunilor neconforme, nereparabile. Nicio secundă de fabrică și nicio placă compromise nu vor ajunge vreodată în retail secundar, pe piețe paralele sau prin canale de comerț electronic. Certificatul de Rebut și Distrugere (VAT-QA-SCRAP-CERT-2026) consemnează produsul, lotul, concluzia MRB, fotografiile cu martori și dubla semnătură a Directorului QA și a Directorului de Fabrică.

