answer:
  label: 'Răspuns direct'
  text: 'Produsele neconforme nu sunt niciodată ascunse, reprocesate informal sau eliberate fără verificare la QINGDAO VATRAD GROUP.,LTD. Fiecare neconformitate identificată este înregistrată pentru produsul, lotul sau componenta afectată și legată de un NCR. Articolul este etichetat (HOLD / QUARANTINE / REJECTED), separat fizic, iar domeniul afectat este evaluat după lot, lot de material, etapă de proces și revizie de document. Decizia de eliminare se ia la nivelul de autoritate corespunzător severității defectului: problemele minore se semnează la nivel de linie, problemele majore necesită o decizie a Managerului de Control al Calității împreună cu un Inginer Tehnic, o instrucțiune de reprocesare controlată și reinspecție independentă la 100%, iar problemele critice necesită o decizie a Consiliului de Analiză a Materialelor, cu aprobare scrisă din partea clientului unde este cazul — altfel, distrugere obligatorie în prezența martorilor. Articolele reprocesate sunt reinspectate față de criteriile de acceptare inițiale, reparațiile de etanșeitate la aer primesc un ciclu complet nou de încercare la presiune, iar eliberarea expediției are loc numai după semnarea autorizată a calității. Problemele repetate sau sistemice declanșează acțiuni corective de cauză rădăcină (CAPA).'
  verified: 'Septembrie 2026'

