nc_intro:
  tagline: Controlul produselor neconforme
  title: Ce se întâmplă atunci când un produs nu respectă criteriile
  body: |
    Produsele sau componentele care nu respectă criteriile de acceptare stabilite sunt identificate și controlate, pentru a preveni utilizarea neintenționată, prelucrarea suplimentară sau expediția. Criteriile de acceptare aplicabile se bazează pe mostra aprobată, specificația tehnică, grafică, lista de materiale, cerințele de ambalare și planul de inspecție al proiectului.

    Articolele neconforme sunt evaluate pentru a stabili domeniul afectat și eliminarea corespunzătoare. În funcție de problemă, articolul poate fi reținut, reprocesat conform instrucțiunilor controlate, înlocuit, respins sau tratat altfel printr-un proces aprobat. Articolele reprocesate sau corectate sunt reinspectate înainte de eliberare. Eliberarea expediției este permisă numai după completarea înregistrărilor de calitate relevante și după ce produsul respectă criteriile de acceptare aplicabile.

nc_flow:
  tagline: Standard în buclă închisă, în 7 pași
  title: De la identificare la acțiune corectivă
  subtitle: 'O buclă controlată unică pentru fiecare neconformitate: identificare, carantină, analiză, reprocesare sau înlocuire, reinspecție, eliberare sau respingere, îmbunătățire.'
  steps:
    - step: '01'
      title: Identificare
      desc: 'Orice neconformitate identificată este înregistrată pentru produsul, lotul sau componenta afectată și evaluată față de cerințele proiectului aplicabile. Detectarea poate avea loc la recepția materialelor, în controlul în curs de proces, la testarea finală, la ambalare sau la inspecția efectuată de client sau de o parte terță.'
    - step: '02'
      title: Carantină
      desc: 'Articolele sunt identificate clar și plasate într-o stare controlată de reținere sau carantină, pentru a preveni utilizarea neintenționată, prelucrarea suplimentară sau expediția. Etichetele HOLD / QUARANTINE / REJECTED conțin numărul NCR, SKU-ul, lotul, cantitatea, descrierea defectului și data.'
    - step: '03'
      title: Analiză
      desc: 'Domeniul afectat și eliminarea corespunzătoare sunt evaluate: unitate individuală, lot de tură, lot complet sau mai multe loturi — inclusiv la nivelul loturilor de material partajate, al reviziilor graficii, al etapelor de proces și al reviziilor documentelor. Se aplică măsuri suplimentare de limitare a efectelor sau inspecții stricate, acolo unde este necesar.'
    - step: '04'
      title: Reprocesare sau înlocuire
      desc: 'Reprocesarea permisă urmează instrucțiuni aprobate care identifică articolul afectat, metoda, materialele, punctele de inspecție și cerințele de reinspecție. Modificările neaprobate ale specificației de produs, ale graficii, ale configurației accesoriilor sau ale ambalării nu sunt niciodată permise. Articolele de înlocuire reintră în punctele de inspecție aplicabile.'
    - step: '05'
      title: Reinspecție
      desc: 'Articolele reprocesate sau corectate sunt reinspectate față de criteriile de acceptare aplicabile. Caracteristica care a eșuat inițial și orice caracteristici conexe care ar putea fi afectate de reprocesare sunt verificate înainte de eliberare — de către controlul calității independent, și cu un ciclu complet nou de încercare la presiune pe 24 de ore pentru reparațiile de etanșeitate la aer.'
    - step: '06'
      title: Eliberare sau respingere
      desc: 'Produsul este eliberat numai după finalizarea reinspecției necesare și după ce personalul autorizat al calității confirmă conformitatea cu cerințele proiectului aplicabile. Articolele care nu pot fi aduse la conformitate sunt respinse, înlocuite, returnate sau eliminate conform procedurilor controlate — inclusiv prin distrugere fizică în prezența martorilor.'
    - step: '07'
      title: Acțiune corectivă
      desc: 'Neconformitățile repetate, semnificative sau sistemice sunt analizate din perspectiva cauzei rădăcină și a acțiunii corective (CAPA). Îmbunătățirile pot include actualizarea instrucțiunilor de lucru, a controalelor materialelor, a punctelor de inspecție, a instruirii, a managementului furnizorilor sau a controlului documentelor.'

nc_pillars:
  tagline: Pilonii încrederii cumpărătorului
  title: Trei mecanisme de control care protejează marca dumneavoastră
  subtitle: 'Procesul este conceput în jurul întrebărilor pe care cumpărătorii internaționali le adună în practică: problemele vor fi ascunse, reprocesarea va scăpa de sub control și plăcile reparate vor fi reverificate.'
  features:
    - icon: 1
      icon_bg: blue
      title: Numai instrucțiuni controlate
      desc: 'Reprocesarea este strict reglementată de Instrucțiunile Standard de Reprocesare (SRI) autorizate. Modificările neaprobate efectuate pe teren, schimbarea specificațiilor sau modificarea graficii fără autorizare scrisă sunt strict interzise.'
    - icon: 2
      icon_bg: green
      title: Reinspecție independentă
      desc: 'Plăcile reprocesate sunt supuse unei reinspecții la 100% de către inspectori QA, față de criteriile de acceptare inițiale. Reparațiile de etanșeitate la aer necesită un ciclu complet, nou, de încercare la presiune pe 24 de ore — niciodată o reverificare parțială.'
    - icon: 3
      icon_bg: purple
      title: Semnare autorizată și trasabilitate
      desc: 'Eliberarea expediției este permisă exclusiv după completarea documentației NCR și semnarea autorizată a controlului calității, starea lotului trecând de la HOLD la RELEASED. Abaterile sistemice sau repetate declanșează automat fluxuri CAPA de analiză a cauzei rădăcină.'

