faqs:
  tagline: FAQ
  title: 'Întrebări frecvente privind calitatea și controlul defectelor pentru cumpărătorii internaționali'
  items:
    - q: 'Cum garantați că plăcile reprocesate respectă standardele complete de siguranță?'
      a: 'Orice placă reprocesată este tratată ca o unitate nouă și trebuie să parcurgă exact același ciclu complet de încercări, de la zero — pentru reparațiile de etanșeitate la aer, o încercare completă la presiune pe 24 de ore. Validarea pentru eliberare este realizată de inspectori de control al calității independenți, nu de operatorii care au efectuat reprocesarea.'
    - q: 'Fabrica va expedia plăci cu abateri cosmetice minore fără să ne anunțeze?'
      a: 'Niciodată. Orice abatere care afectează mostrele de referință aprobate de client, grafica logo-ului, variantele de culoare sau ambalarea necesită un Acord de Concesie formal, scris, semnat de client, înainte de eliberarea expediției.'
    - q: 'Ce se întâmplă dacă o placă reprocesată nu trece reinspecția?'
      a: 'Placa nu este eliberată. Revine la o nouă analiză a eliminării, iar dacă nu poate fi adusă la conformitate, este înlocuită, respinsă sau distrusă conform protocolului de rebut în prezența martorilor. Eșecul repetat al aceleiași clase de defecte declanșează o acțiune CAPA de cauză rădăcină.'
    - q: 'Pot fi vândute plăcile defecte ca secuse de fabrică sau prin alte canale?'
      a: 'Nu. Plăcile neconforme, nereparabile, sunt distruse fizic conform protocolului de rebut în prezența martorilor — componentele metalice sunt tăiate, miezul și marginile sunt secționate, procesul este înregistrat video cu amprentă SHA-256 și arhivat timp de cel puțin 5 ani. Certificatul de Rebut și Distrugere este semnat de Directorul QA și de Directorul de Fabrică.'
    - q: 'Cum este evaluat domeniul afectat atunci când se descoperă un defect?'
      a: 'Domeniul este analizat după identificarea produsului, lotul de producție, lotul de material sau componentă, etapa de proces și revizia documentului aplicabil. Dacă este implicat același lot de material, aceeași revizie a graficii sau aceeași post de lucru, produsele afectate sunt limitate și verificate în consecință.'
    - q: 'Aveți nevoie de aprobarea noastră înainte de a acorda o concesie?'
      a: 'Da. Orice acceptare printr-o concesie documentată care afectează cerințele clientului — mostre aprobate, specificații, grafică, ambalare sau criterii de acceptare — necesită aprobarea scrisă a clientului înainte de eliberare. Fără aceasta, produsul este reprocesat conform cerinței inițiale, înlocuit sau respins.'
    - q: 'Ce documentație primim pentru o neconformitate?'
      a: 'Înregistrarea NCR cuprinde numărul NCR, etapa de detecție, produsul/SKU-ul, lotul, reviziile documentelor aplicabile, descrierea defectului, limitarea efectelor, eliminarea adoptată, referința instrucțiunii de reprocesare, rezultatul reinspecției și aprobarea de eliberare sau de închidere — disponibilă în funcție de acordul dumneavoastră de calitate a proiectului.'

