answer:
  label: 'Прямой ответ'
  text: 'Мы превращаем CAD-модель в пригодную для катания испытанную образцовую доску за 7–12 дней: надувное прототипирование, испытания на воде в небольшой волне, итерации по бортам и носу, затем запуск в производственную оснастку. Полностью индивидуальные пресс-формы требуют дополнительно 15–20 дней на оснастку поверх стандартного срока серийного производства 25–35 дней.'
  verified: 'Сентябрь 2026'

hero:
  tagline: 'Лаборатория 05'
  title: 'Прототипная мастерская'
  subtitle: 'От CAD-модели до испытанного образца доски — изготовлено, подогнано и подтверждено'
  image: 'https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp'
  image_alt: 'Изготовление досок SUP в прототипной мастерской Vatrad'

intro: 'CAD-модель, какой бы детальной она ни была, не покажет, как доска будет ощущаться на деле, пока ее не накачают, не встанут и не покатаются. Поэтому наша Прототипная мастерская спроектирована так, чтобы максимально быстро и точно переводить инженерные данные в физическую, пригодную для катания доску. Каждая новая модель {SITE.name} — и каждая значимая индивидуальная сборка — проходит через эту мастерскую до запуска производственной оснастки.'

content_html: |
  <h2>Где дизайн становится реальностью</h2>
  <p>Мастерская оснащена для одновременного изготовления панелей, ядер drop stitch и бортов. Такой параллельный рабочий процесс сокращает срок изготовления прототипа до 7–12 дней с момента передачи из инженерии. Когда ваше применение требует специализированного решения, мы можем пройти путь от концепции до подтверждения на воде менее чем за три недели.</p>

  <h2>Возможности мастерской</h2>
  <table>
    <thead><tr><th>Рабочий пост</th><th>Оборудование</th><th>Назначение</th></tr></thead>
    <tbody>
      <tr><td>Раскрой панелей</td><td>Станок раскроя ткани ЧПУ, ПО для раскладки, библиотека лекал панелей</td><td>Прецизионный раскрой панелей деки, корпуса и бортов для любого размера доски</td></tr>
      <tr><td>Сборка ядра</td><td>Стол ламинирования ядер drop stitch, валики для нанесения клея</td><td>Склейка ядра drop stitch между обшивками из PVC с равномерным покрытием клеем</td></tr>
      <tr><td>Сварка</td><td>Пресс для ВЧ-сварки, станция горячего воздуха для прихватки, оснастка для испытания надувом</td><td>Сварка швов сборок полного размера с клапанами, ручками и коробками под плавник</td></tr>
      <tr><td>Подгонка и&amp; отделка</td><td>Нанесение настила, стол для ламинирования графики, верстак фурнитуры</td><td>Полная комплектация: настил, логотипы, крепление ручки, линь, коробки под плавники</td></tr>
      <tr><td>Блок измерений</td><td>Манометры, регистратор данных, оснастка для измерения прогиба</td><td>Испытание образцов: циклы надувания, прогиб деки, измерение герметичности</td></tr>
    </tbody>
  </table>

  <h2>Путь прототипа — шаг за шагом</h2>
  <ol>
    <li><strong>Передача из инженерии</strong> — Пакет конструкции (3D-модель, отчет FEA, спецификация материалов, план раскладки панелей) формально рассматривается руководителем мастерской и проектным инженером. Все производственные замечания отмечаются и устраняются до начала раскроя.</li>
    <li><strong>Производство панелей</strong> — Доска изготавливается в соответствии с инженерной спецификацией. Панели раскраиваются на ЧПУ, ядро drop stitch ламинируется между обшивками из PVC, а дека и корпус собираются с утвержденным набором материалов.</li>
    <li><strong>Сварка</strong> — Панели свариваются ВЧ-сваркой в форму готовой доски. Камера накачивается до испытательного давления и остается на 24 ч для первичной стабилизации.</li>
    <li><strong>Сборка и&amp; отделка</strong> — Устанавливаются настил, графика, ручка, линь и коробки под плавники. Все элементы оснастки монтируются и проверяются на соответствие спецификации.</li>
    <li><strong>Статические испытания</strong> — До выхода доски на воду она проходит: циклы надувания, испытание на удержание воздуха, измерение прогиба деки при номинальном давлении и проверку моментов затяжки фурнитуры.</li>
    <li><strong>Программа испытаний на воде</strong> — 10 часов испытаний в воде, подробно описанных ниже.</li>
    <li><strong>Приемка прототипа</strong> — Проводится формальная совещание по подписанию с участием инженерной, производственной команды и службы качества. Все необходимые изменения в конструкции документируются и включаются в выпуск на производство.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">10-часовая программа испытаний на воде — график испытаний</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">1 ч</span>
        <span class="flex-1">Проверка устойчивости — баланс стоя, устойчивость к боковой нагрузке</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 ч</span>
        <span class="flex-1">Ходовая проба — скольжение, курсовая устойчивость и поворот на 3 скоростях; комфорт при гребле</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 ч</span>
        <span class="flex-1">Испытание под нагрузкой райдера — устойчивость и прогиб при массе райдера 60 / 80 / 100 / 120 кг</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 ч</span>
        <span class="flex-1">Испытание в волне — повторные проходы через кильватерную волну; брызги из носа, прогиб бортов</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 ч</span>
        <span class="flex-1">Испытание на выносливость — непрерывная гребля с периодическими проверками давления; регистрация герметичности</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">1 ч</span>
        <span class="flex-1">Финальный осмотр — осмотр швов, фурнитуры и графики после испытаний; документирование результатов</span>
      </div>
    </div>
  </div>

  <h2>Индивидуальное прототипирование для нестандартных применений</h2>
  <p>Прототипная мастерская — это место, где мы решаем задачи, с которыми не справляются стандартные серийные доски. Недавние примеры:</p>
  <ul>
    <li>Туристическая доска 14'' для европейского бренда дальних переходов, с утопленным грузовым настилом и усиленным носом —изготовлена, подогнана и испытана на нашей площадке.</li>
    <li>Доска для йоги 10'6'' с настилом во всю длину и дополнительной толщиной для жесткости, подтвержденная в ходе 4-недельного пробного прокатного сезона.</li>
    <li>Флотовая доска под собственным брендом с индивидуальной графикой на деке и двумя ручками, где прототип использовался для подтверждения цвета, расположения логотипа и упаковки до того, как клиент принял решение о заказе контейнера.</li>
  </ul>

  <h2>Наша команда прототипирования</h2>
  <p>В мастерской работают восемь универсальных производственных техников, каждый из которых перекрестно обучен как минимум по двум из трех основных дисциплин (раскрой, сварка, подгонка). Руководитель команды — мастер с 16-летним опытом, охватывающим и индивидуальные единичные сборки, и серийные партии. За каждым прототипом закреплен выделенный проектный инженер, который выступает единой точкой контакта для клиента на всем протяжении изготовления и испытаний.</p>

  <h2>Участие клиента</h2>
  <p>Мы активно призываем клиентов присутствовать на ключевых этапах изготовления прототипа —особенно на первичной приемке и на испытаниях на воде. Ваши эксплуатационные отзывы на этих этапах бесценны для доводки доски до запуска в производство. Мы не строим в вакууме; мы строим в партнерстве с вами.</p>
  <p>Программа испытаний на воде — это также возможность для вашей команды ознакомиться с особенностями управления доской и требованиями к ее обслуживанию, чтобы переход к производству прошел гладко при поставке финальных досок.</p>

