meta:
  title: 'Teknologi — Drop Stitch & marine PVC | {SITE}'
  description: 'Vatrad-teknologier: drop-stitch-konstruktion, marint PVC, tolagsopbyg og højt tryk. Innovation fra en professionel producent af oppustelige SUP.'
  dateModified: '2026-08'
  keywords:
    - 'sup teknologi'
    - 'drop-stitch konstruktion'
