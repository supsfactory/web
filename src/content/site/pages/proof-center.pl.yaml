answer:
  label: 'Krótka odpowiedź'
  text: 'Łańcuch twierdzenie–dowód wygląda następująco: każde zdanie na tej witrynie jest poparte rejestrem, certyfikatem, maszyną, dokumentem lub zapisem badania — a każdy z tych elementów można zweryfikować. iSupfactory jest działem rozwoju i produkcji produktów SUP spółki Qingdao Vatrad Group Co., Ltd. (zarejestrowanej w Qingdao od 2012 roku). Zakład o powierzchni 12,500 m² posiada certyfikat zarządzania jakością ISO 9001:2015, zgodność z ISO 25649, dokumentację zgodności CE, społeczną zgodność BSCI (raport z audytu na żądanie) oraz dokumentację materiałową REACH/RoHS dla każdego zamówienia. Każda nadmuchiwana komora jest badana przy 18.0 PSI przez 24 godziny z automatycznym odrzuceniem przy spadku powyżej 0.50 PSI, a zapisy partii są przechowywane w ramach 10-letniej identyfikowalności w systemie ERP. Dokumentacja jest publikowana lub udostępniana na żądanie, a fabryka jest otwarta na audyty.'
  verified: 'Wrzesień 2026'

