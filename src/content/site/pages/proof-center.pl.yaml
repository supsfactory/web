traceability:
  tagline: 'Partia śledzona od rolki do deski'
  title: 'Jak identyfikowalność naprawdę wygląda'
  body: |
    Każda partia otrzymuje **10-letni kod partii w systemie ERP**. Łańcuch rejestrowany pod jednym numerem partii:

    - **Rolka przychodząca** — certyfikat materiału, numer rolki, badana partia tkaniny (rozciąganie, rozdarcie, szew)
    - **Cięcie** — zlecenie nestingu CNC wobec pliku projektu, odnotowany procent odpadu
    - **Zgrzewanie i laminowanie** — linia, operator, parametry maszyny dla każdej komory
    - **Montaż** — numer seryjny deski, typ zaworu, partia dokładki pokładowej
    - **Badanie** — 18.0 PSI × 24 h utrzymania dla każdej komory, automatyczne odrzucenie przy spadku powyżej 0.50 PSI
    - **Dopuszczenie** — 100-punktowa lista kontrolna dla każdej deski, podpis dyrektora QA dla każdej partii
    - **Dalej** — Świadectwo Zgodności dołączane do przesyłki; prawo do audytu zastrzeżone w umowie

    Poproś o próbkę zapisu QC przed pierwszym zamówieniem — to dokładnie ten sam format, który otrzymujesz wraz z przesyłką.

faqs:
  tagline: 'Najczęstsze pytania'
  title: 'Pytania kupujących o dowody'
  items:
    - q: 'Czy ta strona służy wyłącznie do weryfikacji i nie zastępuje due diligence?'
      a: 'Dokładnie — ta strona pokazuje, gdzie można zweryfikować każde twierdzenie: rejestrację podmiotu, certyfikaty, maszyny, zapisy oraz zakład otwarty na audyty. Twoje standardowe kroki due diligence (weryfikacja rejestracji, audyt, inspekcja firmy trzeciej) nadal obowiązują i są mile widziane.'
    - q: 'Który podmiot powinien figurować w dokumentacji mojego zamówienia?'
      a: 'Zamówienia składa się w spółce Qingdao Vatrad Group Co., Ltd., działającej jako Vatrad (dział produkcyjny), z iSupfactory jako linią produktową SUP. Dokumenty umowne podpisują wiceprezes sprzedaży, główny inżynier i dyrektor QA.'
    - q: 'Czy mogę otrzymać kopie certyfikatów przed zamówieniem?'
      a: 'Tak — numery certyfikatów i zapisy audytowe są udostępniane na żądanie lub podczas audytu. Lista jest publikowana, nigdy „tylko na żądanie”.'
    - q: 'Jak samodzielnie zweryfikować zapisy badań partii?'
      a: 'Każda komora jest badana przy 18.0 PSI przez 24 godziny z automatycznym odrzuceniem przy spadku powyżej 0.50 PSI; logi badań są powiązane z numerami seryjnymi i dołączane do Świadectwa Zgodności dla każdej partii. Inspekcja przedwysyłkowa SGS, TUV, BV lub Intertek wg ISO 2859-1 poziom II może zostać zaplanowana według Twojego wyboru.'
    - q: 'Czy certyfikaty obejmują również akcesoria?'
      a: 'Dokumentacja materiałowa REACH/RoHS dotyczy desek i akcesoriów dostarczanych w tym samym zamówieniu, a listy kontrolne QC obejmują cały zestaw — deska, wiosło, pompka, linka i torba.'
    - q: 'Co dzieje się z dowodami po złożeniu zamówienia?'
      a: 'Identyfikowalność partii w ERP jest przechowywana przez 10 lat. Procedury SOP systemu QMS i normy inspekcyjne pozostają do pobrania, a kupujący zastrzega sobie prawo do audytu w trakcie produkcji zgodnie z umową.'

