certifications:
  tagline: 'Certyfikaty i zakres'
  title: 'Co posiadamy, co obejmuje i jak to zweryfikować'
  subtitle: 'Opublikowana lista — nigdy „tylko na żądanie”. Numery certyfikatów i zapisy audytowe są udostępniane na żądanie lub podczas audytu.'
  headers:
    certificate: 'Certyfikat / norma'
    scope: 'Zakres'
    verify: 'Jak zweryfikować'
  rows:
    - certificate: 'ISO 9001:2015'
      scope: 'Zarządzanie jakością projektu i produkcji SUP'
      verify: 'Numer certyfikatu i zapisy audytowe na żądanie lub podczas audytu'
    - certificate: 'ISO 25649'
      scope: 'Bezpieczeństwo i zgodność konstrukcyjna jednostek nadmuchiwanych (Europa)'
      verify: 'Dokumentacja zgodności dla każdej rodziny produktów'
    - certificate: 'CE'
      scope: 'Zgodność z wymogami UE dla produktów SUP nadmuchiwanych'
      verify: 'Dokumentacja CE przekazywana wraz z zamówieniami'
    - certificate: 'BSCI'
      scope: 'Społeczna zgodność zakładu i załogi'
      verify: 'Raport z audytu dostępny na żądanie'
    - certificate: 'REACH & RoHS'
      scope: 'Substancje ograniczone i dokumentacja materiałowa'
      verify: 'Dokumentacja materiałowa do każdego zamówienia'
    - certificate: 'Inspekcja firmy trzeciej (opcja)'
      scope: 'Inspekcja przedwysyłkowa SGS, TUV, BV lub Intertek'
      verify: 'ISO 2859-1 poziom II, termin według Twojego wyboru'

