services:
  - title: Terméktervezés és mérnöki munka
    description: Belső kutatási-fejlesztő csapatunk az Ön konceptjével vagy specifikációjával együtt dolgozik CAD rajzok, 3D modellek és prototípusok kidolgozásán. Matricatervezést, testforma-optimalizálást és anyagválasztási tanácsadást kínálunk.
  - title: Egyedi márkázás és grafika
    description: Teljes színű digitális nyomtatás, szitanyomás, domborítás és címkeopciók. A márkához igazított fedélzeti grafikát, csőmárkázást és kiskereskedelmi csomagolást fejlesztünk.
  - title: Az anyagok és a specifikációk testreszabása
    description: Válasszon a PVC (standard, környezetbarát, lángmentes), Hypalon/CSM, drop-stitch és hibrid kivitelezések közül. Egyedi színek csövekre, szövetsúlyok és megerősítési opciók.
  - title: Csomagolás és logisztika
    description: Egyedi kiskereskedelmi csomagolás, private label dobozok, vákuumcsomagolás, palettázás és exportminőségű csomagolás, saját üzemünkben készítve.

moq_table:
  - product: Felfújható SUP deszkák
    standard_moq: 'Minta 1–2 | Pilóta 20–50'
    custom_moq: 'Térfogat 90–100+ (150 m tekercsenként)'
    lead_time: 25–35 nap

why_us:
  - title: Vertikális integráció
    description: A gyár, a matricák és az ellátási lánc a tulajdonunkban – nincs közvetítő, nincs alvállalkozó. Ez kontrollt ad nekünk a minőség, a költség és a szállítás felett.
  - title: Kettős tanúsítás
    description: ISO 9001 minőségirányítás és BSCI szociális megfelelőségi tanúsítás. A gyáraudit-jelentések kérésre rendelkezésre állnak.
  - title: CE-megfelelőség
    description: A CE-tanúsítás az Európai Unió piacaira szánt modellekre vonatkozik (a hatókör projektenként megerősítendő). Az egyedi modellek a már kialakult folyamatunkon keresztül CE-tanúsíthatók.
  - title: A projekthez igazított MOQ
    description: 'Az MOQ-t a projekt konfigurációja alapján erősítjük meg – a közös márkájú kis sorozatok gyártása 5–10 darabbal indul, a standard térfogat pedig soronként 90–100+ darabbal fut. Segítünk a kialakulóban lévő márkáknak úgy indulni, hogy túlzott raktárkészletbe ne kötődjenek.'

