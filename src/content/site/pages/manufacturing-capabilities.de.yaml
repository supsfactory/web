hero:
  tagline: Fertigungskapazitäten
  title: 'SUP-Fertigungskapazitäten'
  subtitle: 'Jeder Prozess — Rumpftechnik, Drop-stitch-Kernverarbeitung, Hochfrequenzschweißen, Druck, Formenbau, Montage, Prüfung und Verpackung — läuft hausintern in unserem 12,500 m² großen Werk in Qingdao. Ein verantwortliches Team führt Ihr Projekt vom ersten Entwurf bis zum verschifften Container durch.'

answer:
  label: 'Kurze Antwort'
  text: 'Die SUP-Fertigung ist vollständig hausintern in unserem Werk in Qingdao: Rumpfkonstruktion und Maßtechnik mit 0,1 mm CNC-Präzision; Verarbeitung des Drop-stitch-Materials und Hochfrequenzschweißen auf 4 automatisierten Linien; Grafikdruck; EVA-Pad-Stanzen; eigener Formenbau (+15–20 Tage für neue Formen); Montage nach einer 100-Punkte-Checkliste und ein 24-Stunden-Druckhalttest mit 18,0 PSI und automatischer Aussortierung bei einem Druckabfall über 0,50 PSI. Die Jahreskapazität liegt bei 120.000+ Boards (ca. 10.000/Monat) in 4 Spezialwerkstätten mit 350+ Mitarbeitern, geliefert in über 50 Länder unter Ihrer Marke.'
  verified: 'September 2026'

