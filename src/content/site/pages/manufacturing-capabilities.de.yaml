faq_section:
  tagline: FAQ
  title: Fragen zu den SUP-Fertigungskapazitäten
  questions:
    - q: Welche Fertigungsprozesse laufen hausintern?
      a: 'Alle Kernprozesse laufen hausintern: Rumpftechnik, Drop-stitch-Kernverarbeitung, Hochfrequenzschweißen, Druck, EVA-Stanzen, Montage, Prüfung und Verpackung. Zubehör und einige Rohstoffe stammen von zertifizierten Lieferanten; die Endmontage des Sets erfolgt hausintern für eine vollständige Rückverfolgbarkeit.'
    - q: Wie hoch ist Ihre Produktionskapazität?
      a: '120.000+ Boards pro Jahr (ca. 10.000/Monat) auf 4 automatisierten Linien und in 4 Spezialwerkstätten auf 12,500 m² mit über 350 Mitarbeitern.'
    - q: Welche Mindestbestellmenge gilt für diese Kapazitäten?
      a: 'Die Standardmenge liegt bei 90–100+ Einheiten pro freigegebener Konfiguration (eine 150-m-Rolle Drop-stitch-Gewebe); Pilotläufe starten bei 20–50 Einheiten auf bestehenden Plattformen; Reine-Logo-Aufträge ab 5–10 Einheiten.'
    - q: Welche Lieferzeiten sollten wir einplanen?
      a: 'Prototyp-Muster in 7–12 Tagen; Produktion 25–35 Tage nach bestätigtem Auftrag und Anzahlung; der Formenbau für individuelle Formen addiert 15–20 Tage.'
    - q: Wie wirken sich die Kapazitäten auf die Qualität aus?
      a: 'Jeder Prozess speist das 7-stufige Qualitätssystem: 100-Punkte-Montagecheckliste, 18,0 PSI 24-Stunden-Druckhalt mit automatischer Aussortierung über 0,50 PSI Abfall, Stichprobenprüfung nach ISO 2859-1 Level II und 10-jährige ERP-Chargenrückverfolgbarkeit.'

