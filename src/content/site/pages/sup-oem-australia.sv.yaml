hero:
  tagline: 'Australien'
  title: 'OEM uppblåsbara SUP för Australien — lager före säsongen'
  subtitle: 'Prover inom 7–12 dagar, tillverkning på 25–35 dagar, sjöfrakt på 4–6 veckor till Sydney, Melbourne eller Brisbane. Köpare på södra halvklotet planerar 3–4 månader i förväg, så att varorna hinner komma före säsongen december–februari.'

answer:
  label: 'Kort svar'
  text: 'Australiska varumärken beställer uppblåsbara SUP hos iSupfactory under standardvillkor: MOQ bekräftas av projektkonfigurationen: provcykler med 1–2 st validerar konstruktionen, små pilotserier med 20–50 st testar marknaden på befintliga plattformar och standardvolymserier går med 90–100+ st per design ur en hel drop-stitch-rulle på 150 m. Det första provet skickas 7–12 dagar efter att specifikationerna godkänts, tillverkningen tar 25–35 dagar efter bekräftad PO och deposition, och sjöfrakten tillkommer med 4–6 veckor till Sydney, Melbourne eller Brisbane. Med tillverkning plus frakt beställer du 3–4 månader innan du behöver brädorna i lager; DDP täcker tullhantering och leverans till ditt lager.'
  verified: 'September 2026'
