faqs:
  title: 'FAQ produkcji wiosł OEM'
  subtitle: 'Odpowiedzi na najczęstsze pytania marek, które uruchamiają własne wiosła.'
  items:
    - title: 'Jak stworzyć własną markę wiosła?'
      description: 'Uruchom markę: brief, projekt, prototyp z certyfikatem CE, produkcja seryjna i dostawa. Próbki w 7–12 dni, produkcja w 25–35 dni od zamówienia i zaliczki. Zobacz nasze pakiety OEM.'
    - title: 'Ile trwa czas realizacji produkcji?'
      description: 'Próbka jest gotowa w 7–12 dni, produkcja seryjna w 25–35 dni po zamówieniu i zaliczce, w zależności od wolumenu.'
    - title: 'Czy wiosło będzie miało nasze logo?'
      description: 'Tak — pełny private label: nadruk logo, własne kolory, opakowanie i etykiety w Twojej marce.'
    - title: 'Czy mogę kupić hurtowo od pierwszego dnia?'
      description: 'MOQ potwierdzamy wg konfiguracji projektu — próbka (1–2 szt.), seria pilotażowa (20–50 szt.) i standardowa produkcja seryjna (90–100+ szt. na partię), z rabatami hurtowymi rosnącymi wraz z wolumenem.'

