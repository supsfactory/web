answer:
  label: 'Wprost'
  text: 'Minimalną ilość zamówienia (MOQ) potwierdzamy wg konfiguracji projektu: próbka (1–2 szt.), seria pilotażowa (20–50 szt.) i standardowa produkcja seryjna (90–100+ szt. na partię z rolki drop-stitch 150 m), plus współmarkowanie w małej serii od 5–10 szt. Próbki wysyłamy w 7–12 dni; produkcję seryjną realizujemy w 25–35 dni po zamówieniu i zaliczce. Certyfikacja CE dla modeli na rynek UE i pełna dokumentacja zgodności dołączane do każdego zamówienia.'
  verified: 'Wrzesień 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Nadmuchiwane wiosło OEM na zamówienie z logo marki
  actions:
    - text: 'Rozpocznij mój projekt OEM'
      href: /pl/contact
      variant: primary
    - text: 'Zobacz pakiety OEM'
      href: /pl/oem-manufacturing
      variant: secondary
