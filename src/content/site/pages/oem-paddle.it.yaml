faqs:
  title: 'FAQ sulla produzione di pagaie OEM'
  subtitle: 'Risposte alle domande più frequenti dei marchi che lanciano la propria pagaia.'
  items:
    - title: 'Come creo il mio marchio di pagaie?'
      description: 'Lancia il tuo marchio: briefing, design, prototipo certificato CE, produzione di massa e consegna. Campioni in 7–12 giorni, produzione in 25–35 giorni dall''ordine e dall''acconto. Scopri i nostri pacchetti OEM.'
    - title: 'Qual è il lead time di produzione?'
      description: 'Il campione è pronto in 7–12 giorni, la produzione di massa in 25–35 giorni dopo l''ordine e l''acconto, a seconda della quantità.'
    - title: 'La pagaia porta il nostro logo?'
      description: 'Sì — private label completo: stampa del logo, colori personalizzati, imballaggio ed etichette a marchio.'
    - title: 'Posso acquistare grandi quantità fin dal primo giorno?'
      description: 'Il MOQ viene confermato in base al progetto — campione (1–2 unità), pilota (20–50 unità) e volume standard (90–100+ unità per lotto), con scaglioni di prezzo all''ingrosso che crescono con la quantità.'

