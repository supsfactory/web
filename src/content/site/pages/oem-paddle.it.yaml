answer:
  label: 'Risposta breve'
  text: 'La quantità minima d''ordine viene confermata in base al progetto: campione (1–2 unità), pilota (20–50 unità) e volume standard (90–100+ unità per lotto da un rotolo di drop-stitch da 150 m), con co-branding per piccoli lotti a partire da 5–10 unità. I campioni partono in 7–12 giorni; la produzione in serie prosegue per 25–35 giorni dopo l''ordine e l''acconto. La certificazione CE per i modelli destinati al mercato UE e la documentazione di conformità completa sono incluse in ogni ordine.'
  verified: 'September 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
