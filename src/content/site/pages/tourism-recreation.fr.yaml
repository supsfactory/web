faqs:
  - question: 'Quels types de SUP gonflables pour tourisme et loisirs Afarer fabrique-t-il ?'
    answer: 'Afarer fabrique des SUP de touring, des SUP tout-terrain, des SUP de yoga, des SUP de pêche et des SUP gonflables de loisir généraux. Tous les modèles sont disponibles en fabrication OEM/ODM avec marque personnalisée.'
  - question: 'Quels matériaux Afarer utilise-t-il pour les SUP de grade tourisme ?'
    answer: 'Nous utilisons un PVC de grade marine à haute résistance tensile avec revêtements multicouche pour une résistance UV, une résistance à l''abrasion et une longévité supérieures. Tous les tissus proviennent de fournisseurs mondiaux réputés et subissent une inspection entrante rigoureuse.'
  - question: 'Afarer fournit-il la certification CE pour les SUP de loisir ?'
    answer: 'Oui. Les modèles standard portent le marquage CE selon la Directive 2013/53/UE pour l''accès au marché UE. Les modèles personnalisés peuvent être certifiés CE via notre processus établi, et une documentation de marché supplémentaire (USCG, AS 1799, et autres) peut être fournie pour les partenaires OEM/ODM.'
  - question: 'Afarer peut-il personnaliser les graphismes et la marque pour les exploitants touristiques ?'
    answer: 'Oui — services OEM/ODM complets incluant l''impression de logo personnalisé sur les planches, l''emballage marqué, les graphismes de flotte et les solutions de marque privée. Nous offrons l''impression numérique pour les graphismes pleine couleur et la sérigraphie pour des logos durables.'
  - question: 'Quelle est la garantie sur les SUP tourisme et loisirs Afarer ?'
    answer: 'Les SUP gonflables Afarer bénéficient d''une garantie limitée fabricant de 3 ans couvrant les produits défectueux et la main-d''œuvre. Des options de garantie étendue sont disponibles pour les exploitants de flotte commerciale.'

body: |
  <h2>La norme Afarer — un engagement de fabrication marine sans défaut</h2>
  <p>Dans le vaste et dynamique monde de la récréation et de l'utilité marine, le SUP gonflable se dresse comme une preuve de polyvalence, de convenance et d'accessibilité. Des expéditions de pêche tranquilles sur lacs sereins aux croisières côtières tranquilles, les SUP gonflables servent une multitude d'usages.</p>
  <p>Cependant, tous les SUP gonflables ne se valent pas. La vraie mesure d'un SUP gonflable réside non pas seulement dans son application prévue, mais dans l'intégrité de sa construction, la qualité de ses matériaux et la précision de sa conception. Afarer se distingue comme un concepteur et fabricant de premier plan, produisant des SUP gonflables conçus pour l'excellence à travers chaque segment de tourisme et de loisirs.</p>

  <h2>Science des matériaux : le fondement de la durabilité</h2>
  <p>Le choix des matériaux est le facteur le plus critique pour déterminer la longévité et la performance d'un SUP gonflable. Afarer investit des ressources considérables pour identifier, tester et se procurer les meilleurs tissus et composants disponibles mondialement.</p>
  <ul>
    <li><strong>Approvisionnement de tissu supérieur :</strong> PVC de grade marine, à haute résistance tensile, avec revêtements multicouche, sélectionné pour une durabilité, une résistance UV et une résistance à l'abrasion renforcées.</li>
    <li><strong>Construction Drop-Stitch :</strong> Des milliers de fils de polyester internes relient les couches supérieure et inférieure, créant une structure rigide à 12–15 PSI.</li>
    <li><strong>Coutures thermo-soudées :</strong> Nos constructions PVC utilisent exclusivement des coutures thermo-soudées (soudure RF) qui produisent des liaisons étanches à l'air haute résistance dépassant les exigences ISO.</li>
    <li><strong>Protection UV étendue :</strong> Tissus PVC avec garanties de protection UV pour les SUP fréquemment exposés à la lumière du soleil intense.</li>
  </ul>

  <h2>Philosophie de conception : ingénierie de précision pour chaque segment</h2>
  <p>Notre équipe de conception comprend des architectes navals expérimentés et des spécialistes de la technologie gonflable qui exploitent un logiciel CAD avancé et des tests réels pour créer des coques hydrodynamiquement efficaces, exceptionnellement stables et robustes.</p>

  <h3>SUP de pêche</h3>
  <p>Conçus pour la stabilité et l'opération silencieuse. Les configurations spécifiques à la pêche incluent des supports de porte-canne, des points d'attache de matériel et des plateformes silencieuses et stables qui minimisent la perturbation des poissons.</p>

  <h3>SUP tender de yacht</h3>
  <p>Des conceptions compactes et légères qui se rangent facilement à bord des navires mères tout en offrant un transport fiable et confortable vers le rivage. Construction drop-stitch pour une performance et une maniabilité supérieures.</p>

  <h3>SUP tout-terrain & touring</h3>
  <p>Construction drop-stitch haute densité avec PVC de grade militaire, classée à 15 PSI pour une rigidité exceptionnelle. Kits d'accessoires complets incluant pompe, sac à dos, laisse, kit de réparation et pagaie.</p>

  <h2>Excellence de fabrication : précision à chaque étape</h2>
  <p>Afarer emploie des techniciens hautement qualifiés qui maîtrisent leur art. Notre installation de production est équipée d'une machinerie à la pointe de la technologie, incluant des machines de découpe CNC automatiques, des soudeuses diélectriques RF, des thermosoudeuses à air chaud et des imprimantes numériques. Chaque SUP suit des procédures documentées avec traçabilité.</p>
  <p>Notre système de contrôle qualité multicouche inclut des vérifications rigoureuses à chaque étape de fabrication, culminant en des tests complets de chaque planche finie avant l'expédition. Cet engagement pour la qualité est intégré dès le début, pas simplement inspecté à la fin.</p>

  <h2>Contrôle qualité & tests</h2>
  <ul>
    <li><strong>Test de rétention d'air à 100 % :</strong> Chaque chambre est testée en pression au-delà des limites de fonctionnement pour vérifier l'étanchéité à l'air.</li>
    <li><strong>Vérification de pelage de couture :</strong> La résistance de soudure et de colle est vérifiée par un test de pelage physique.</li>
    <li><strong>Validation de résistance UV :</strong> Les matériaux sont exposés à un ensoleillement simulé pour évaluer la résistance à la dégradation.</li>
    <li><strong>Test d'abrasion :</strong> Des échantillons de matériau sont testés contre des surfaces abrasives pour la résistance à l'usure.</li>
    <li><strong>Contrôle complet des systèmes :</strong> Chaque SUP subit une inspection finale avant approbation d'expédition.</li>
  </ul>

  <h2>Pourquoi choisir Afarer pour votre flotte de tourisme & loisirs</h2>
  <p>Avec notre usine de 12 500 m² certifiée ISO & CE à Qingdao, Chine, Afarer offre aux exploitants touristiques, flottes de location et marques de loisirs un partenaire de fabrication fiable. Nos services OEM/ODM incluent la marque personnalisée, la marque privée, l'emballage et le support logistique. MOQ de volume standard dès 90–100+ unités par rouleau de 150 m (séries pilotes dès 20–50 unités) avec délais de 25–35 jours.</p>
  <p>Chaque SUP Afarer est un investissement dans une qualité, une durabilité et une performance inégalées — assurant à vos clients des expériences sûres et mémorables sur l'eau.</p>

  <div class="not-prose my-10">
    <div class="rounded-2xl border border-sky-200 bg-sky-50 p-6 text-center dark:border-sky-900 dark:bg-sky-950">
      <h3 class="font-display text-lg font-bold">Équipez votre flotte avec un système qualité documenté</h3>
      <p class="mt-2 text-sm text-fg-2">La durabilité de grade location vient du système d'inspection en 7 étapes derrière chaque planche — auditez-le, ou parlez à l'ingénierie pour votre flotte.</p>
