  headline: 'SUP gonflables pour le tourisme & loisirs — fabrication OEM Afarer'
  description: 'Afarer conçoit et fabrique des SUP gonflables premium pour le tourisme et les loisirs : planches de touring, de pêche et de yoga. Fabrication OEM/ODM avec certification CE. Paliers MOQ : pilote dès 20–50 unités ; volume standard dès 90–100+ unités par rouleau de 150 m.'
