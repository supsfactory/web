answer:
  label: 'Közvetlen válasz'
  text: 'A drop stitch olyan szövet, amelyben poliészterszálak tartják fix távolságban a felső és alsó PVC réteget, így a levegőnyomás merevíti a deszkát. A Vatrad magjai: 1,680 DTEX, 2 szál / hüvelyknyi felület, 1.2 mm-es külső PVC borítás, 15 PSI-re minősítve és 18.0 PSI-en 24 órás nyomástartási próbával validálva.'
