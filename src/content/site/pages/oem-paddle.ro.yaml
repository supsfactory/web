answer:
  label: 'Răspuns direct'
  text: 'Cantitatea minimă de comandă este confirmată în funcție de configurația proiectului: mostră (1–2 bucăți), lot pilot (20–50 bucăți) și volum standard (90–100+ bucăți pe lot dintr-o rolă drop-stitch de 150 m), cu posibilitatea de co-branding în loturi mici începând de la 5–10 bucăți. Mostrele se expediază în 7–12 zile; producția de serie durează 25–35 zile după emiterea comenzii și primirea avansului. Certificarea CE pentru modelele destinate pieței UE și documentația completă de conformitate sunt incluse în fiecare comandă.'
  verified: 'Septembrie 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Vâslă gonflabilă OEM personalizată cu logo de marcă
