faqs:
  title: 'Întrebări frecvente despre producția OEM de vâsle'
  subtitle: 'Răspunsuri la cele mai frecvente întrebări ale mărcilor care își lansează propria vâslă.'
  items:
    - title: 'Cum îmi creez propria marcă de vâsle?'
      description: 'Lansați-vă marca: brief, design, prototip cu certificare CE, producție de masă și livrare. Mostre în 7–12 zile, producție în 25–35 zile de la comandă și avans. Explorați pachetele noastre OEM.'
    - title: 'Care este termenul de producție?'
      description: 'Mostra este gata în 7–12 zile, iar producția de serie durează 25–35 zile după comanda și avansul, în funcție de volum.'
    - title: 'Vâsla poartă logo-ul nostru?'
      description: 'Da — private label complet: imprimarea logo-ului, culori personalizate, ambalaje și etichete în marca dumneavoastră.'
    - title: 'Pot cumpăra en-gros încă de la început?'
      description: 'MOQ este confirmat în funcție de configurația proiectului — mostră (1–2 bucăți), lot pilot (20–50 bucăți) și volum standard (90–100+ bucăți pe lot), cu niveluri de preț en-gros care scad pe măsură ce volumul crește.'

