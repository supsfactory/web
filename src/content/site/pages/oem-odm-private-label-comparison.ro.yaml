ip_rules:
  tagline: 'Protecția proprietății intelectuale'
  title: 'Cum protejăm proiectările și marca dumneavoastră'
  subtitle: 'Indiferent de modelul de colaborare, artwork-ul, uneltele și fișierele de specificație rămân proprietatea dumneavoastră.'
  body: |
    **NDA înaintea schimbului de fișiere.** Semnăm un acord de confidențialitate înainte de orice schimb de fișiere tehnice — timpul standard de răspuns este de cel mult 4 ore lucrătoare.

    **Fără reutilizarea proiectărilor.** Artwork-ul, uneltele și fișierele de specificație nu sunt niciodată partajate cu alți clienți și nici vândute acestora. Formele OEM vă aparțin în exclusivitate. Proiectările ODM sunt aprobate de dumneavoastră înainte de producție. Platformele Private Label sunt structuri comune, însă grafica și branding-ul dumneavoastră sunt exclusive.

    **Doar B2B.** Fabricăm exclusiv sub mărcile clienților noștri. Nu vindem consumatorilor finali și nu concurăm cu clienții noștri pe nicio piață.

    **Proprietatea formelor.** Formele personalizate plătite de cumpărător aparțin cumpărătorului. Noi le depozităm și le întreținem, dar nu le putem folosi pentru alți clienți fără autorizare scrisă.

faqs:
  tagline: 'FAQ'
  title: 'Întrebări frecvente despre OEM, ODM și Private Label'
  items:
    - q: 'Pot trece ulterior de la private label la OEM?'
      a: 'Da. Mulți clienți încep cu un lot private label sau pilot pentru a valida piața, apoi investesc în unelte personalizate pentru un program OEM complet, după ce cererea este demonstrată. Aceeași uzină și același sistem de control al calității susțin ambele trasee.'
    - q: 'Înseamnă ODM că fabrica deține marca mea?'
      a: 'Nu. În modelul ODM, dumneavoastră dețineți marca, grafica și ambalajele. Fabrica dezvoltă structura plăcii pornind de la fișa dumneavoastră, iar dumneavoastră aprobați proiectarea înainte de producție. Fabrica păstrează drepturile de proprietate intelectuală ale procesului de dezvoltare, dar specificația de produs aprobată vă aparține.'
    - q: 'Este private label de calitate mai scăzută decât OEM?'
      a: 'Nu. Toate cele trei trasee trec prin aceeași uzină, același sistem de control al calității și aceeași echipă de export. Plăcile private label sunt construite pe platforme dovedite și validate, cu testare completă la presiune de 18 PSI / 24 h și cu aceeași listă de verificare a asamblării în 100 de puncte.'
    - q: 'Ce fac dacă nu sunt sigur ce model să aleg?'
      a: 'Contactați-ne cu situația dumneavoastră — echipa noastră de inginerie vă va recomanda traseul cel mai practic, în funcție de cerințele produsului, termen și obiectivele de volum. Nu se cere niciun angajament înainte de analiza specificațiilor.'
    - q: 'Pot primi mostre înainte de a m angaja la vreun model?'
      a: 'Da. 1–2 mostre de prototip se expediază în 7–12 zile. Costul mostrelor este creditat la comanda dumneavoastră de volum. Astfel puteți evalua construcția și calitatea înainte de orice angajament de volum.'

