answer:
  label: 'Přímá odpověď'
  text: 'Řetězec „tvrzení — důkaz“ vypadá takto: každé tvrzení na tomto webu je podloženo registrací, certifikátem, strojem, dokumentem, nebo protokolem o zkoušce — a každý z nich lze ověřit. iSupfactory je divize pro vývoj a výrobu produktů SUP společnosti Qingdao Vatrad Group Co., Ltd. (registrována v Qingdao od roku 2012). Provozovna o ploše 12 500 m² pracuje podle ISO 9001:2015, splňuje ISO 25649, má dokumentaci o shodě CE, sociální odpovědnosti BSCI (zpráva z auditu na vyžádání) a dokumentaci k materiálům REACH/RoHS pro každou objednávku. Každá nafukovací komora se zkouší při 18,0 PSI po dobu 24 hodin s automatickým vyřazením při poklesu větším než 0,50 PSI a šaržové záznamy se uchovávají v rámci 10leté sledovatelnosti v ERP. Dokumentace je zveřejněná, nebo se poskytne na vyžádání, a továrna je otevřená pro audity.'
  verified: 'září 2026'

