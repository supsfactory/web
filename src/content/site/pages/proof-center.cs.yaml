  dateModified: '2026-08-16'
  keywords:
    - 'důkazy továrny sup'
    - 'seznam certifikátů továrny'
    - 'sledovatelnost šarží sup'
    - 'ověření továrny sup'
    - 'výrobní důkazy čína'

hero:
  tagline: 'Centrum důkazů k továrně'
  title: 'Centrum důkazů — všechna naše tvrzení shromážděna zde'
  subtitle: 'Jedna stránka, která přiřazuje každé tvrzení na tomto webu jeho důkaz: registrovanou právnickou osobu stojící za továrnou, certifikace s rozsahem platnosti, stroje, které práci vykonávají, a šaržové záznamy, které se po každé výrobní dávce uchovávají.'
