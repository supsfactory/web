    - certificate: 'REACH & RoHS'
      scope: 'Omezené látky a dokumentace k materiálům'
      verify: 'Dokumentace k materiálům ke každé objednávce'
    - certificate: 'Nezávislá inspekce (volitelné)'
      scope: 'Přednákladní inspekce SGS, TÜV, BV, nebo Intertek'
      verify: 'ISO 2859-1 úroveň II, podle Vašeho výběru'

