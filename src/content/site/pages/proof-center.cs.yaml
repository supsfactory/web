traceability:
  tagline: 'Šarže — od role po desku'
  title: 'Jak sledovatelnost vypadá v praxi'
  body: |
    Každé šarži se přiděluje **kód dávky s 10letou sledovatelností v ERP**. Řetězec zaznamenávaný pod jednou dávkou:

    - **Přijatá role** — certifikát materiálu, číslo role, šarže tkaniny se zkouškami (trhání, roztržení, šev)
    - **Krájení** — zadání pro CNC krájení podle návrhového souboru, zaznamenané procento odpadu
    - **Svařování a laminování** — linka, operátor, parametry stroje pro každou komoru
    - **Montáž** — sériové číslo desky, typ ventilku, šarže povrchu
    - **Zkouška** — udržení 18,0 PSI po 24 h pro každou komoru, automatické vyřazení při poklesu větším než 0,50 PSI
    - **Výdej** — kontrolní seznam se 100 body pro každou desku, podpis ředitele pro jakost u každé šarže
    - **Dále** — Certifikát shody spolu s dodávkou; právo na audit je sjednáno ve smlouvě

    Vyžádejte si vzorek záznamu kontroly kvality ještě před první objednávkou — je to stejný formát, který dostanete s dodávkou.

faqs:
  tagline: 'FAQ'
  title: 'Dotazy nakupujících k důkazům'
  items:
    - q: 'Je tato stránka určena jen k ověření a nenahrazuje due diligence?'
      a: 'Správně — tato stránka ukazuje, kde lze ověřit každé tvrzení: registraci právnické osoby, certifikáty, stroje, záznamy a továrnu otevřenou k auditu. Vaše běžné kroky due diligence (ověření registrace, audit, nezávislá inspekce) zůstávají platné a jsou vítány.'
    - q: 'Jaká právnická osoba má být uvedena v mé objednávkové dokumentaci?'
      a: 'Objednávky jsou vystavovány na Qingdao Vatrad Group Co., Ltd., která působí jako Vatrad (výrobní divize), přičemž iSupfactory je řadou produktů SUP. Smluvní dokumenty podepisují viceprezident prodeje, hlavní inženýr a ředitel pro jakost.'
    - q: 'Mohu získat kopie certifikátů ještě před objednávkou?'
      a: 'Ano — čísla certifikátů a auditní záznamy poskytneme na vyžádání, nebo během auditu. Seznam je zveřejněný, nikoli „dostupný jen na vyžádání".'
    - q: 'Jak si mohu sám ověřit šaržové protokoly o zkouškách?'
      a: 'Každá komora se zkouší při 18,0 PSI po dobu 24 hodin s automatickým vyřazením při poklesu větším než 0,50 PSI; záznamy o zkouškách jsou svázány se sériovými čísly a zasílány spolu s Certifikátem shody každé šarže. Přednákladní inspekce SGS, TÜV, BV, nebo Intertek podle ISO 2859-1 úrovně II může být naplánována podle Vašeho výběru.'
    - q: 'Vztahují se certifikace i na příslušenství?'
      a: 'Dokumentace k materiálům REACH/RoHS se vztahuje na desky i na příslušenství dodané v téže objednávce a kontrolní seznamy kvality zahrnují celou soupravu — desku, veslo, pumpu, lanko a tašku.'
    - q: 'Co se s důkazy stane po objednávce?'
      a: 'Sledovatelnost šarží v ERP se uchovává 10 let. SOP systému kvality a inspekční normy zůstávají ke stažení a odběrateli zůstává právo na audit během výroby podle smlouvy.'

