certifications:
  tagline: 'Certifikace a rozsah platnosti'
  title: 'Co máme, čeho to platí a jak se to ověřuje'
  subtitle: 'Zveřejněný seznam — nikdy „jen na vyžádání“. Čísla certifikátů a auditní záznamy poskytneme na vyžádání, nebo během auditu.'
  headers:
    certificate: 'Certifikát / standard'
    scope: 'Rozsah'
    verify: 'Jak ověřit'
  rows:
    - certificate: 'ISO 9001:2015'
      scope: 'Řízení kvality při návrhu a výrobě SUP'
