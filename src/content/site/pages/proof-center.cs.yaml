      link: '/cs/about/isupfactory-entity'
      link_label: 'Stránka právnické osoby na webu'
    - icon: A
      icon_bg: green
      title: 'Vatrad — výrobní divize'
      desc: 'Námořní výrobní divize stojící za provozovnou: desky SUP, nafukovací čluny a RIB vyráběné ve stejné provozovně v Qingdao. Produkty a dokumentace kvality vydávané pod tímto názvem.'
      link: '/cs/factory'
      link_label: 'Více o továrně'
    - icon: V
      icon_bg: orange
      title: 'Qingdao Vatrad Group Co., Ltd. — právnická osoba'
      desc: 'Registrovaný výrobce (od roku 2012), který provozuje provozovnu o ploše 12 500 m² v zóně ekonomického rozvoje Laixi v Qingdao. Registrační údaje, vývozní licence a auditní záznamy poskytneme po podpisu NDA, nebo během auditu.'
