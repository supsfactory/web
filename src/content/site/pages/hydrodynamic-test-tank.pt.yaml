answer:
  label: 'Resposta clara'
  text: 'Testamos as formas dos cascos SUP no vaso de prova à escala de modelo 1:3 até 1:5 — perfil de proa, raio do rail, rocker e superfície molhada — e medimos resistência, eficiência de planagem e estabilidade, antes de nos comprometermos com um protótipo à escala real. Uma semana no vaso fornece os dados de desempenho que de outra forma exigiriam meses de tentativa e erro à escala real.'
