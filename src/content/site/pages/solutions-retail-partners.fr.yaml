meta:
  title: 'Production SUP personnalisée & en marque privée pour détaillants | {SITE}'
  description: 'Production SUP personnalisée et en marque privée pour les marques de détail : spécifications de planche, graphismes de marque, MOQ d''essai bas et QC d''usine — de l''échantillon au vrac.'
  dateModified: '2026-08'

hero:
  tagline: Marques de détail
  title: 'Production SUP personnalisée pour marques de détail'
  subtitle: 'Les marques de détail lancent leur propre gamme de planches à pagaie avec notre usine : spécifications de planche développées à partir de vos besoins, votre marque sur le produit, et le contrôle qualité géré de bout en bout.'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-ocean-voyager-1.webp
    alt: Planches SUP Afarer produites pour une marque de détail

answer:
  label: 'Réponse directe'
  text: 'Le MOQ est confirmé par la configuration du projet : les marques de détail démarrent avec un échantillon (1–2 unités) ou un lot pilote (20–50 unités, échantillons en 7–12 jours), passent à un run OEM de volume standard de 90–100+ unités par design (25–35 jours après PO et acompte), ou investissent dans un moule personnalisé pour des gammes entièrement sur mesure (l''outillage ajoute 15–20 jours). Chaque planche est testée en pression avant expédition, avec conditions FOB, CIF ou DDP depuis Qingdao.'
  verified: '2026-08'

margin_section:
  title: 'Étapes de production pour les marques de détail'
  subtitle: 'Démarrez avec un échantillon, validez en pilote, passez à un run de volume standard, ou investissez dans un moule personnalisé — le MOQ et les délais sont fixés par le chemin de production, pas par estimation.'
  items:
    - tier: 'Étape échantillon'
      moq: '1–2 unités'
      margin_note: 'Délai échantillon 7–12 jours'
      features:
        - 'Développement des visuels à partir de vos éléments de marque'
        - 'Échantillon physique pour approbation'
        - 'QC plateforme standard'
    - tier: 'Étape pilote'
      moq: '20–50 unités'
      margin_note: 'Validation marché sur plateformes en stock'
      features:
        - 'Graphismes, logo et disposition EVA de la planche complète'
        - 'Réapprovisionnements sur les mêmes plateformes vérifiées'
        - 'Documentation d''export incluse'
    - tier: 'Moule personnalisé'
      moq: 'Confirmé par config projet'
      margin_note: 'L''outillage ajoute 15–20 jours'
      features:
        - 'Nouvelle forme de planche et développement de moule'
        - 'Contrôle complet de la spécification'
        - 'Allocation de production prioritaire'

