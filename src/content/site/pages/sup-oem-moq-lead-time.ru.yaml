answer:
  label: 'Прямой ответ'
  text: 'MOQ и сроки зависят от проекта, но сама схема фиксирована. Каждый проект по индивидуальным SUP проходит одни и те же поэтапные уровни: разработка образца (1–2 доски, готовы за 7–12 дней), пробные и пилотные заказы (20–50 досок) и стандартные серийные тиражи (90–100+ досок с 150-метрового рулона ткани drop stitch). Производственный срок составляет 25–35 дней с момента подтвержденного PO и задатка; если проекту нужен индивидуальный корпус, разработка пресс-формы добавляет 15–20 дней до начала производства. Типичный первый проект выглядит так: образцы примерно за 1–2 недели, пилотные доски за 4–6 недель и первая полная партия с отгрузкой примерно через 6–8 недель после подтверждения заказа.'
  verified: 'Сентябрь 2026'

moq_lead_table:
  tagline: 'Схема'
  title: 'Уровни MOQ и сроков индивидуальных SUP — кратко'
  subtitle: 'Каждый этап подтверждает следующий. Вы никогда не переходите сразу от чертежа к контейнеру — на каждом уровне вы подтверждаете форму корпуса, графику и упаковку, прежде чем брать на себя обязательства по большей партии.'
  headers:
    stage: 'Этап заказа'
    quantity: 'Типичный объем'
    lead_time: 'Срок'
    best_for: 'Лучше всего подходит для'
  rows:
    - stage: 'Разработка образца'
      quantity: '1–2 доски'
      lead_time: '7–12 дней'
      best_for: 'Проверки жесткости корпуса, текстуры EVA-коврика, точности графики и совместимости аксессуаров. Стоимость образцов взимается и зачитывается в ваш производственный заказ после подписания договора.'
    - stage: 'Пробный / пилотный заказ'
      quantity: '20–50 досок'
      lead_time: '25–35 дней'
      best_for: 'Предсезонных коммерческих тестов, валидации рынка и первых продаж на существующих платформах корпуса, складских материалах и упрощенной упаковке.'
    - stage: 'Стандартный серийный тираж'
      quantity: '90–100+ досок с 150-метрового рулона'
      lead_time: '25–35 дней'
      best_for: 'Полной производственной эффективности на целых 150-метровых рулонах ткани — без соединений ткани внахлест, с равномерным натяжением волокон и амортизированной настройкой линии. Формы собственной пресс-формы выпускаются на этом уровне.'
    - stage: 'Крупномасштабная программа'
      quantity: '300+ досок'
      lead_time: '25–35 дней на партию, отгрузка частями'
      best_for: 'Контейнерных программ и сезонных парков, распределенных по нескольким производственным партиям, чтобы ваш склад и денежный поток оставались управляемыми.'

moq_drivers:
  tagline: 'Что определяет ваш MOQ'
  title: 'Шесть факторов, определяющих ваш минимальный объем'
  subtitle: 'MOQ — это не случайное число, выбранное отделом продаж. Он рассчитывается по всей архитектуре продукта — эти компоненты оцениваются вместе до формирования предложения.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: H
      icon_bg: blue
      title: 'Форма корпуса и оснастка'
      desc: 'Существующие заводские пресс-формы корпуса позволяют выполнять пилотные заказы от 20 досок. Индивидуальный корпус требует собственных режущих оснасток CAD и термопрессовой оснастки EVA, а ее разработка добавляет 15–20 дней к графику.'
    - icon: C
      icon_bg: green
      title: 'Цветовые сочетания и ПВХ'
      desc: 'Стандартные складские цвета выпускаются пилотными тиражами, тогда как собственные листы ПВХ, окрашенные по Pantone, требуют отдельных химических партий крашения со своими минимальными объемами сырья.'
    - icon: A
      icon_bg: purple
      title: 'Графика и охват печати'
      desc: 'Логотип на носу можно напечатать шелкографией небольшим тиражом, тогда как полноцветная графика на всю поверхность или многопанельная композиция требует подготовки печатных форм для цифровой печати и тестов покрытия, что повышает практический размер партии.'
    - icon: B
      icon_bg: orange
      title: 'Брендированная упаковка'
      desc: 'Индивидуальные 5-слойные подарочные коробки для розницы имеют независимый минимум офсетной печати. Если заказать меньше коробок, мы храним излишки и отгружаем их вместе с вашими запланированными отгрузками.'
    - icon: G
      icon_bg: blue
      title: 'Комплекты аксессуаров'
      desc: 'Стандартные алюминиевые или нейлоновые весла, насосы и сумки выпускаются партиями поставщиков соответствующего подуровня. Полностью брендированные весла из карбона и индивидуальные насосы имеют собственные производственные минимумы.'
    - icon: S
      icon_bg: green
      title: 'Сезон и график платежей'
      desc: 'Заказы, размещенные в предсезонное окно, получают подтвержденные производственные слоты. Графики отгрузки частями для программ 300+ досок согласуются на этапе договора, а не после производства.'

moq_timeline:
  tagline: 'Полный график'
  title: 'От брифа продукта до отгруженных досок: по дням'
  subtitle: 'Полный график типичной программы индивидуальных SUP. Существующие платформы корпуса сжимаются в левую часть этого графика; индивидуальный корпус добавляет этап разработки пресс-формы.'
  steps:
    - step: 'День 0'
      title: 'Отправьте бриф продукта'
      desc: 'Модель доски, целевой объем, цветовые сочетания, графика и требования к упаковке. Инженерная проверка завершается в течение одного рабочего дня.'
    - step: 'Дни 1–2'
      title: 'Инженерная проверка и осуществимость'
      desc: 'Наша инженерная команда проверяет геометрию корпуса, материалы и путь соответствия требованиям и подтверждает, подходит ли проект под существующие платформы или требует новой оснастки.'
    - step: 'Дни 3–7'
      title: 'Спецификация и коммерческое предложение по позициям'
      desc: 'Вы получаете полную спецификацию с расчетом MOQ, этапами сроков и затратами по позициям — включая любые сборы за пресс-форму — до принятия каких-либо обязательств.'
    - step: 'Дни 7–12'
      title: 'Разработка образца (1–2 доски)'
      desc: 'Физический образец изготавливается и испытывается: жесткость корпуса, текстура EVA-коврика, точность графики и совместимость аксессуаров. Стоимость образцов зачитывается в производственный заказ после подписания.'
    - step: '+15–20 дней'
      title: 'Разработка индивидуальной пресс-формы (только для индивидуальных корпусов)'
      desc: 'Только для проектов с новой формой корпуса: фрезерные режущие оснастки CNC, термопрессовая оснастка EVA и испытания пресс-формы завершаются до начала серийного производства.'
    - step: '25–35 дней'
      title: 'Производство после подтвержденного PO и задатка'
      desc: 'Целые 150-метровые рулоны ткани, материалы по Pantone, брендированная упаковка и сборка по 100 пунктам. Каждая доска проходит 24-часовое испытание давлением и герметичности.'
    - step: '300+ досок'
      title: 'Планирование отгрузки частями'
      desc: 'Крупные программы отгружаются партиями по графику с учетом сезонных продаж, вместимости склада и платежных этапов.'
    - step: 'Дни 0–90'
      title: 'Типичный горизонт первого заказа'
      desc: 'От брифа до поставленной первой партии: примерно 6–8 недель при использовании существующих платформ, 8–12 недель с учетом индивидуальной пресс-формы. Программы на несколько рулонов и контейнерные программы выходят за эти рамки по определению.'

expedite:
  tagline: 'Сократите график'
  title: 'Что позволяет удерживать сроки'
  subtitle: 'Три рычага позволяют сжать график, не меняя основ физики рулона.'
  features:
    - icon: S
      icon_bg: blue
      title: 'Образцы делаются быстро по умолчанию'
      desc: 'Разработка образца занимает 7–12 дней в каждом проекте. Используйте цикл образца, чтобы зафиксировать спецификацию, чтобы производство никогда не ждало запоздалых решений по графике.'
    - icon: P
      icon_bg: green
      title: 'Производственные слоты подтверждаются заранее'
      desc: 'Предсезонные заказы фиксируют подтвержденные производственные слоты. Когда несколько клиентов бронируют один и тот же слот, именно поэтому более ранние задатки дают более ранние очереди.'
    - icon: T
      icon_bg: purple
      title: 'Прозрачные контрольные этапы'
      desc: 'Каждый этап — утверждение образца, заморозка BOM, заморозка графики, PO и задаток — согласуется на этапе договора с указанием даты. Вы всегда знаете, в какой день отсчет начинается заново.'

scenarios:
  tagline: 'Три реалистичных варианта старта'
  title: 'Какой маршрут подходит вашему проекту?'
  subtitle: 'Тот же завод, три разных способа начать. Выберите сценарий, наиболее близкий к вашей ситуации, и используйте его, когда свяжетесь с нами.'
  features:
    - icon: A
      icon_bg: orange
      title: 'Стартап-бренд — проверить, прежде чем брать обязательства'
      desc: 'Сначала закажите 1–2 образца (7–12 дней), оцените качество гребли и фотографии, затем разместите пробный заказ 20–50 досок, чтобы проверить продажи до полного тиража. Общий объем первого сезона остается менее 50 досок.'
    - icon: B
      icon_bg: blue
      title: 'Курорт или прокатный оператор — пилот, затем масштабирование'
      desc: 'Пилотный заказ 20–50 досок с упрощенной упаковкой покрывает ваш предсезон. После получения данных об интенсивности использования переходите к стандартным тиражам 90–100+ досок с брендированной упаковкой.'
    - icon: C
      icon_bg: green
      title: 'Зрелый бренд — полностью индивидуальные контейнерные программы'
      desc: 'Существующие бренды заказывают 90–100+ досок с 150-метрового рулона с индивидуальными корпусами и полноцветным брендингом. Разработка индивидуальной оснастки добавляет 15–20 дней; программы 300+ досок отгружаются по графику частями.'

moq_quality:
  tagline: 'QC и соответствие требованиям'
  title: 'Та же система качества при любом объеме заказа'
  subtitle: 'Образец на 1 доску и программа на 300+ досок проходят одни и те же контрольные ворота качества и одну и ту же документацию о соответствии. «Низкий MOQ» никогда не означает «низкий стандарт».'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: C
      icon_bg: blue
      title: 'Документы о соответствии в любом масштабе'
      desc: 'Документация по сертификации CE, ISO 9001, BSCI, REACH и RoHS предоставляется с каждым заказом — включая единичные образцы; номера сертификатов выдаются по запросу.'
    - icon: A
      icon_bg: green
      title: 'Чек-лист сборки по 100 пунктам'
      desc: 'Каждая доска проходит один и тот же чек-лист сборки по 100 пунктам независимо от размера партии: материалы, сварка, клапаны, борта, плавники и совместимость аксессуаров проверяются построчно.'
    - icon: P
      icon_bg: purple
      title: '24-часовое испытание давлением и герметичности'
      desc: 'Каждая доска накачивается до 18.0 PSI и выдерживается 24 часа. Падение давления более 0,50 PSI приводит к автоматическому браку — то же ворота и для образца, и для контейнера.'
    - icon: R
      icon_bg: orange
      title: 'Проверка ВЧ-сварки и сварки бортов'
      desc: 'Сварка трехслойной бортовой ленты и швы ВЧ-сварки визуально и по размерам проверяются на соответствие утвержденному образцу до начала любого серийного тиража.'
    - icon: B
      icon_bg: blue
      title: 'Прослеживаемость партий в ERP (10 лет)'
      desc: 'Каждая доска имеет производственные записи с серийным номером — материалы, операторы, испытания и результаты инспекции, — которые хранятся 10 лет и доступны для аудита.'
    - icon: I
      icon_bg: green
      title: 'Готово к сторонней инспекции'
      desc: 'Партия готова к сторонней инспекции на любом этапе. Большинство клиентов также применяют нашу 7-этапную систему инспекции или предотгрузочную инспекцию на серийных программах.'

moq_faqs:
  tagline: FAQ
  title: 'Часто задаваемые вопросы о MOQ и сроках'
  items:
    - q: 'Каков минимальный объем заказа для индивидуального SUP?'
      a: 'Это зависит от этапа вашего проекта: образцы — 1–2 доски, совместный брендинг небольшим тиражом начинается с 5–10 единиц, пробные и пилотные заказы выполняются в объеме 20–50 досок, а стандартное серийное производство — 90–100+ досок с 150-метрового рулона ткани drop stitch. Формы собственной пресс-формы выпускаются на серийном уровне. Точный расчет для вашей конфигурации мы подтверждаем до формирования предложения.'
    - q: 'Сколько занимает изготовление образца надувного SUP?'
      a: 'Разработка образца занимает 7–12 дней. Образец подтверждает жесткость корпуса, текстуру EVA-коврика, точность графики и совместимость аксессуаров. Стоимость образцов взимается и зачитывается в ваш производственный заказ после подписания договора.'
    - q: 'Сколько занимает производство после подтверждения заказа?'
      a: 'Производственный срок составляет 25–35 дней с момента подтвержденного PO и задатка. Если проект включает индивидуальный корпус, разработка пресс-формы добавляет 15–20 дней на оснастку до начала производства.'
    - q: 'MOQ рассчитывается на заказ, на модель или на цветовое сочетание?'
      a: 'MOQ может применяться на модель, цветовое сочетание, версию графики, конфигурацию упаковки или на весь заказ. Поскольку разная толщина drop stitch и разные цвета ПВХ поступают из отдельных рулонов сырья, заказ 50 досок с разбивкой на 5 цветов создает 5 отдельных требований к рулонам ткани. Мы подтверждаем расчет по вашей матрице SKU.'
    - q: 'Могу ли я начать с 1–2 досок, чтобы проверить рынок?'
      a: 'Да. Заказ образца на 1–2 доски — самая дешевая возможная проверка: жесткость корпуса, графика и совместимость аксессуаров подтверждаются до любых финансовых обязательств по тиражу. Далее вы переходите к пробному заказу 20–50 досок для коммерческой валидации.'
    - q: 'Может ли программа 300+ досок отгружаться несколькими партиями?'
      a: 'Да. Крупномасштабные программы планируются как отгрузки частями по производственным партиям, чтобы сезонные парки поступали вовремя, а денежный поток и складские площади оставались управляемыми. Графики согласуются на этапе договора, а не после производства.'

