faqs:
  - question: 'Welke soorten opblaasbare SUP''s voor toerisme en vrije tijd produceert Vatrad?'
    answer: 'Vatrad produceert touring SUP''s, allround SUP''s, yoga-SUP''s, vis-SUP''s en algemene recreatieve opblaasbare SUP''s. Alle modellen zijn beschikbaar voor OEM/ODM-productie met gepersonaliseerde branding.'
  - question: 'Welke materialen gebruikt Vatrad voor opblaasbare SUP''s van toeristische kwaliteit?'
    answer: 'Wij gebruiken marien PVC met hoge scheurweerstand en meerlaagse coatings voor superieure UV-bestendigheid, slijtvastheid en een lange levensduur. Alle stoffen komen van gerenommeerde wereldwijde leveranciers en doorlopen een strenge inkomende controle.'
  - question: 'Levert Vatrad CE-certificering voor recreatieve SUP''s?'
    answer: 'Ja. De standaardmodellen dragen de CE-markering volgens richtlijn 2013/53/EU voor toegang tot de EU-markt. Aangepaste modellen kunnen via ons gevestigde proces CE-gecertificeerd worden en voor OEM/ODM-partners kan aanvullende marktdocumentatie worden ondersteund (USCG, AS 1799 en andere).'
  - question: 'Kan Vatrad graphics en branding voor toeristische operators personaliseren?'
    answer: 'Ja — volledige OEM/ODM-diensten, inclusief het printen van gepersonaliseerde logo''s op de boards, verpakking met het merk, vlootgraphics en private label oplossingen. Wij bieden digitaal printen voor full-colour graphics en zeefdruk voor duurzame logo''s.'
  - question: 'Welke garantie geldt voor de toerisme- en vrijetijds-SUP''s van Vatrad?'
    answer: 'Opblaasbare SUP''s van Vatrad worden geleverd met een beperkte fabrieksgarantie van 3 jaar op product- en fabricagefouten. Voor commerciële vlotenexploitanten zijn verlengde garantieopties beschikbaar.'

body: |
  <h2>De Vatrad-standaard — een toewijding aan onberispelijk maritiem vakmanschap</h2>
  <p>In de uitgestrekte en dynamische wereld van vrije tijd en maritiem gebruik is de opblaasbare SUP een getuigenis van veelzijdigheid, gemak en toegankelijkheid. Van de rustige visuitstapjes op stille meren tot de ontspannen kusttour: opblaasbare SUP's vervullen een veelheid aan doelen.</p>
  <p>Maar niet alle opblaasbare SUP's zijn gelijk. De echte maatstaf van een opblaasbare SUP ligt niet alleen in het beoogde gebruik, maar in de integriteit van de constructie, de kwaliteit van de materialen en de precisie van het design. Vatrad onderscheidt zich als eersteklas ontwikkelaar en producent en maakt opblaasbare SUP's die zijn ontworpen voor maximale prestaties in elk toeristisch en recreatief segment.</p>

  <h2>Materiaalwetenschap: de basis van levensduur</h2>
  <p>De materiaalkeuze is de meest kritische factor voor de levensduur en prestaties van een opblaasbare SUP. Vatrad investeert aanzienlijke middelen in het identificeren, testen en inkopen van de beste stoffen en componenten ter wereld.</p>
  <ul>
    <li><strong>Superieure stofinkoop:</strong> marien PVC met hoge scheurweerstand en meerlaagse coatings, geselecteerd op verbeterde duurzaamheid, UV-bestendigheid en slijtvastheid.</li>
    <li><strong>Drop-stitch constructie:</strong> duizenden interne polyesterdraden verbinden de bovenste en onderste laag en creëren een stijve structuur op 12–15 PSI.</li>
    <li><strong>Thermisch gelaste naden:</strong> onze PVC-constructies gebruiken uitsluitend thermisch gelaste naden (HF-lassen), die sterkteverbindingen met luchtvastheid creëren die de ISO-vereisten overtreffen.</li>
    <li><strong>Uitgebreide UV-bescherming:</strong> PVC-stof met UV-beschermingsgarantie voor SUP's die vaak worden blootgesteld aan sterke zonnestraling.</li>
  </ul>

  <h2>Designfilosofie: precisietechniek voor elk segment</h2>
  <p>Ons designteam bestaat uit ervaren scheepsarchitecten en specialisten in opblaastechnologie die geavanceerde CAD-software en echte tests gebruiken om hydrodynamisch efficiënte, uitzonderlijk stabiele en robuuste rompen te ontwikkelen.</p>

  <h3>Vis-SUP</h3>
  <p>Ontworpen voor stabiliteit en stille werking. De visvriendelijke uitrustingen omvatten hengelsteunen, bevestigingspunten voor materiaal en stabiele, stille platforms die verstoring van de vissen minimaliseren.</p>

  <h3>SUP-tender voor jachten</h3>
  <p>Compacte en lichte designs die gemakkelijk aan boord van het moederschip stuwbaar zijn en tegelijkertijd betrouwbaar en comfortabel vervoer naar de wal bieden. Drop-stitch constructie voor superieure prestaties en wendbaarheid.</p>

  <h3>Allround- & touring-SUP</h3>
  <p>Drop-stitch constructie met hoge dichtheid en PVC van militaire kwaliteit, ontworpen voor 15 PSI voor uitzonderlijke stijfheid. De complete accessoiresets omvatten pomp, rugzak, leash, reparatieset en peddel.</p>

  <h2>Productie-excellentie: precisie in elke stap</h2>
  <p>Vatrad stelt hooggekwalificeerde technici te werk, meesters van hun vak. Onze fabriek is uitgerust met geavanceerde machines, waaronder automatische CNC-snijmachines, HF-dielectrische lasmachines, heteluchtlassers en digitale printers. Elke SUP volgt gedocumenteerde procedures met traceerbaarheid.</p>
  <p>Ons gelaagde kwaliteitscontrolesysteem omvat strenge controles in elke productiefase en mondt uit in volledige tests van elk afgewerkt board vóór verzending. Deze toewijding aan kwaliteit is vanaf het begin ingebouwd, niet pas aan het einde geverifieerd.</p>

  <h2>Kwaliteitscontrole & tests</h2>
  <ul>
    <li><strong>100% luchtdichtheidstest:</strong> elke kamer wordt bij een druk boven de operationele limieten getest om de dichtheid te controleren.</li>
    <li><strong>Tractiecheck van de naden:</strong> de sterkte van lassen en lijmverbindingen wordt met fysieke trektests geverifieerd.</li>
    <li><strong>Validatie van de UV-bestendigheid:</strong> de materialen worden blootgesteld aan gesimuleerd zonlicht om de verouderingsweerstand te beoordelen.</li>
    <li><strong>Slijtvastheidstest:</strong> materiaalmonsters worden tegen schurende oppervlakken getest op slijtweerstand.</li>
    <li><strong>Volledige systeemtest:</strong> elke SUP doorloopt een eindcontrole vóór de vrijgave voor verzending.</li>
  </ul>

  <h2>Waarom Vatrad voor jouw toeristische & recreatieve vloot</h2>
  <p>Met onze ISO- en CE-gecertificeerde fabriek van 12.500 m² in Qingdao, China, biedt Vatrad toeristische operators, verhuurvloten en recreatieve merken een betrouwbare productiepartner. Onze OEM/ODM-diensten omvatten gepersonaliseerde branding, private label, verpakking en logistieke ondersteuning. Standaardvolume-MOQ vanaf 90–100+ eenheden per rol van 150 m (pilootcycli van 20–50 eenheden) met levertijden van 25–35 dagen.</p>
  <p>Elke Vatrad-SUP is een investering in ongeëvenaarde kwaliteit, duurzaamheid en prestaties — en garandeert dat jouw gasten veilige en onvergetelijke ervaringen op het water beleven.</p>

