traceability:
  tagline: 'Et parti, fulgt fra rulle til bræt'
  title: 'Sådan ser sporing i praksis ud'
  body: |
    Ethvert parti tildeles en **10-årig ERP-lotkode**. Kæden, der registreres under et lot:

    - **Indgående rulle** — materialecertifikat, rullenummer, stofbatch testet (træk, revne, søm)
    - **Skæring** — CNC-nesting-job mod designfil, spildprocent registreret
    - **Svejse og laminering** — linje, operatør, maskinparametre pr. kammer
    - **Montering** — brættets serienummer, ventiltype, dækpudebatch
    - **Test** — 18.0 PSI × 24 timers hold pr. kammer, automatisk kassering ved fald på over 0.50 PSI
    - **Godkendelse** — tjekliste med 100 punkter pr. bræt, godkendelse fra QA-chefen pr. parti
    - **Videre** — overensstemmelsescertifikat med forsendelsen; auditret reserveret i kontrakten

    Bed om et eksempel på en QC-registrering, inden din første ordre — det er samme format, du modtager med din forsendelse.

faqs:
  tagline: 'FAQ'
  title: 'Dokumentationsspørgsmål, købere stiller'
  items:
    - q: 'Er denne side kun til verificering og erstatter den ikke due diligence?'
      a: 'Korrekt — denne side viser, hvor enhver påstand kan verificeres: enhedsregistrering, certifikater, maskiner, registreringer og et anlæg, der er åbent for audits. Dine sædvanlige due diligence-trin (registreringstjek, audit, tredjepartsinspektion) gælder stadig og er velkomne.'
    - q: 'Hvilken enhed skal stå på min ordredokumentation?'
      a: 'Ordrer afgives til Qingdao Vatrad Group Co., Ltd., der opererer som Vatrad (produktionsafdelingen), med iSupfactory som SUP-produktlinje. Kontraktdokumenter underskrives af salgsdirektøren, chief ingeniøren og QA-chefen.'
    - q: 'Kan jeg få kopier af certifikaterne inden bestilling?'
      a: 'Ja — certifikatnumre og auditregistreringer leveres på forespørgsel eller ved en audit. Listen er offentliggjort, aldrig "kun tilgængelig på forespørgsel".'
    - q: 'Hvordan verificerer jeg selv testregistreringer for partier?'
      a: 'Ethvert kammer testes ved 18.0 PSI i 24 timer med automatisk kassering ved et fald på over 0.50 PSI; testlogge kobles til serienumre og følger med overensstemmelsescertifikatet pr. parti. Forhåndsinspektion før afsendelse fra SGS, TÜV, BV eller Intertek i henhold til ISO 2859-1 Level II kan planlægges efter dit ønske.'
    - q: 'Dækker certifikaterne også tilbehør?'
      a: 'REACH/RoHS-materialedokumentationen gælder brætter og tilbehør, der leveres i samme ordre, og QC-tjeklisterne dækker det komplette sæt — bræt, pagaj, pumpe, leash og taske.'
    - q: 'Hvad sker der med dokumentationen efter ordren?'
      a: 'ERP-sporing af partier opbevares i 10 år. QMS-SOP’er og inspektionsstandarder forbliver tilgængelige at hente ned, og køberen reserverer auditret under produktionen i henhold til kontrakten.'

