answer:
  label: 'Det korte svar'
  text: 'Kæden fra påstand til dokumentation er: ethvert udsagn på denne site er underbygget af en registrering, et certifikat, en maskine, et dokument eller en testregistrering — og hver af dem kan gennemgås. iSupfactory er SUP-produktudviklings- og produktionsafdelingen i Qingdao Vatrad Group Co., Ltd. (registreret i Qingdao siden 2012). Anlægget på 12,500 m² har ISO 9001:2015 kvalitetsstyring, ISO 25649-overensstemmelse, CE-overensstemmelsesdokumentation, BSCI social ansvarlighed (auditrapport på forespørgsel) samt REACH/RoHS-materialedokumentation pr. ordre. Ethvert oppusteligt kammer testes ved 18.0 PSI i 24 timer med automatisk kassering ved et fald på over 0.50 PSI, og partiregisteringer opbevares med 10 års ERP-sporing. Dokumentationen er offentliggjort eller kan deles, og selve fabrikken er åben for audits.'
  verified: 'September 2026'

