faqs:
  tagline: Distribütör SSS
  title: 'Toptan Dağıtım Programı — Sık Sorulan Sorular'
  items:
    - q: 'Yeni distribütör için asgari sipariş nedir?'
      a: 'Yeni dağıtım ortakları genellikle bir numune ve ön üretim onay siparişiyle başlar, ardından sezonlarına programlanmış ilk konteyner gelir. Kesin asgari değerler bölge büyüklüğüne ve seçilen ürün hattına bağlıdır; hesap yöneticiniz açılış hacmini ürün hattı ve marka planlaması sırasında doğrular.'
    - q: 'Boardları kendi markamız altında satabilir miyiz?'
      a: 'Evet. Özel marka buradaki standart modeldir: boardlar kendi görselleriniz, ambalajınız ve teknik özelliklerinizle sizin markanız altında üretilir. iSupfactory yalnızca kendi müşterileri için üretim yapar ve hiçbir pazarda onlarla rekabet etmez.'
    - q: 'Bölgeler münhasır mı?'
      a: 'Evet. Distribütör programları münhasır bölgeler üzerine kuruludur — her toptan ortağı belirli bir ülkeyi veya bölgeyi kapsar ve ticari anlaşmada belirtildiği şekilde o pazar için fiyatlandırma ve program desteği alır.'
    - q: 'Drop-ship desteği veriyor musunuz?'
      a: 'Drop-ship kabiliyeti programa dahildir. Numune, ambalaj ve işleme süreçleri numune onay aşamasında doğrulanır; böylece drop-ship siparişleri ilk günden itibaren sorunsuz işler.'
    - q: 'Hangi modelleri sipariş edebiliriz?'
      a: 'Üretim kataloğu; genel amaçlı, tur ve sörf formlarında şişirilebilir SUP boardları, şişirilebilir kayaklar, pompalar, kürekler, can yelekleri ve bakım aksesuarlarını, ayrıca mühendislik ekibimizle geliştirilmiş özel formları kapsar. Çoğu ortak en çok satan 4–8 SKU ile başlar ve sonraki sezonlarda genişletir.'
    - q: 'Siparişler nasıl sevk edilir?'
      a: 'Siparişler planlanmış seferlerle fabrikadan çıkar; navlun maliyetlerini stabilize etmek için ileri tarihli sipariş verme imkanı sunulur. Ayrılmış hesap yöneticiniz üretim ve sevkiyatı tahmininiz ile sezon takvimine göre planlar.'
    - q: 'Nasıl başvururum?'
      a: 'Bu sayfadaki başvuru formunu kullanın veya doğrudan bize ulaşın. Başvurular dağıtım ekibi tarafından incelenir ve birkaç iş günü içinde, bölge haritalaması ve taslak anlaşma dahil olmak üzere sonraki adımlarla yanıt veririz.'

