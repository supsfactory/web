answer:
  label: 'Kort svar'
  text: 'Europeiske merker bestiller oppblåsbare SUP hos iSupfactory under standardvilkår: MOQ bekreftes av prosjektkonfigurasjonen: prøvesykluser med 1–2 stk validerer konstruksjonen, små pilotserier med 20–50 stk tester markedet på eksisterende plattformer, og standardvolumserier går med 90–100+ stk per design fra en hel drop-stitch-rull på 150 m. Den første prøven sendes 7–12 dager etter at spesifikasjonene er godkjent, produksjonen tar 25–35 dager etter bekreftet PO og depositum, og sjøfrakten kommer i tillegg med 4–6 uker til Rotterdam eller Hamburg. CE- og REACH-dokumentasjonen utarbeides parallelt med den godkjente prøven, og DDP dekker tollbehandling og levering til lageret ditt.'
  verified: 'September 2026'

