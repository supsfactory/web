qc_section:
  tagline: Kontrola kvality
  title: Proces zkoušek a zabezpečování kvality
  subtitle: Každá deska před odesláním projde povinnými zkouškami. Naše laboratoř kvality pracuje nezávisle na výrobě a hlásí se přímo vedení.
  steps:
    - step: '1'
      title: Kontrola surovin
      desc: Tkaniny PVC, Hypalon a drop-stitch podléhají tahové zkoušce, zkoušce šíření trhliny a ověření odolnosti proti UV záření dřív, než se do výroby dostane jakákoli šarže.
    - step: '2'
      title: 24hodinová zkouška nepropustnosti
      desc: Každá trubková komora se dofukuje na 18,0 PSI a udržuje 24 hodin. Pokles tlaku nad 0,50 PSI vede k automatickému odmítnutí a opětovnému přezkoušení švů.
    - step: '3'
      title: Zkoušky zatížení a stability
      desc: Hotové desky se dofukují na jmenovitý tlak a kontrolují na souměrné nabobtnání, tuhost při 15 PSI a stabilitu pod zatížením. Každá deska se před konečnou kontrolou otestuje v naší zkušební nádrži.

oem_section:
  tagline: Projekty OEM
  title: Případové studie spolupráce se značkami a OEM
  subtitle: Od konceptu po výrobu — tak pomáháme globálním značkám uvést své řady nafukovacích SUP na trh a rozšířit je.
  cases:
    - challenge: Evropský outdoorový retailer potřeboval řadu SUP pod vlastní značkou s jedinečnou grafikou na palubě, ekologickým PVC a obaly připravenými pro retail — vše dodáno za 60 dní.
      solution: Vyvinuli jsme vlastní soubory pro digitální tisk, zajistili PVC splňující REACH a zkrátili počet vzorkovacích kol z 3 na 1 tím, že jsme tým designu umístili přímo do naší továrny v Qingdao.
      result: 25–35 dní výroby od podepsané objednávky, s prvním dodáním v 60denném okně. 2 400 kusů ve 4 SKU. Objednávka na další dávku byla zadána dřív, než byla první dávka zcela dodána.
      disclaimer: 'Anonymizované shrnutí projektu — typ a rozsah projektu jsou reprezentativní; konkrétní výsledky nelze nezávisle ověřit.'
    - challenge: Americký startup ve vodních sportech potřeboval výkonnou desku SUP drop-stitch s vlastním tvarem, obaly s co-brandingem a certifikací BSCI pro umístění v retailu.
      solution: Upravili jsme existující formu SUP se změněným obrysem, vyvinuli obalovou grafiku s co-brandingem a poskytli úplnou dokumentaci auditu BSCI.
      result: 'Úspěšné umístění u klíčových amerických outdoorových prodejců, které přineslo silný náskup: v prvním roce se prodalo přes 5 000 kusů při 98% míře prodeje skladových zásob.'
      disclaimer: 'Anonymizované shrnutí projektu — typ a rozsah projektu jsou reprezentativní; konkrétní výsledky nelze nezávisle ověřit.'
    - challenge: Australský distributor potřeboval řadu SUP s certifikací CE, vlastními barvami a souladem s australskými normami.
      solution: Vyrobili jsme předsériové vzorky ve 4 barevných variantách a zkoordinovali zkoušky souladu s třetí stranou.
      result: Řada SUP se 3 modely byla uvedena na trh AU/NZ. Následně jsme zvítězili ve vládní tendru na 12 hlídkových SUP.
      disclaimer: 'Anonymizované shrnutí projektu — typ a rozsah projektu jsou reprezentativní; konkrétní výsledky nelze nezávisle ověřit.'

faq_section:
  tagline: FAQ
  title: Často kladené otázky k B2B a OEM
  questions:
    - q: Jaké je minimální objednávkové množství (MOQ) pro OEM nafukovací desky SUP?
      a: 'MOQ se určuje podle konfigurace projektu, nikoli podle pevného čísla — podle trupu a nástrojů, barevných variant a PVC, grafiky, obalů a příslušenství. Sériová výroba běží v dávkách 90–100+ kusů z plné 150 m role drop-stitch, malé série s co-brandingem začínají na 5–10 kusech a každý projekt projde fází vzorku (1–2 kusy) a pilotní série (20–50 kusů). Úplnou výpočtovou logiku najdete v našem průvodci MOQ a flexibilního brandingu.'
    - q: Má Vatrad certifikaci BSCI?
      a: Ano. Naše továrna má platnou certifikaci společenské odpovědnosti BSCI (zpráva z auditu je k dispozici na vyžádání). Dále máme ISO 9001 pro řízení kvality. Certifikace CE se vztahuje na modely určené pro evropské trhy; rozsah se potvrzuje u každého projektu. Dokumentaci o souladu s REACH a RoHS předkládáme s každou objednávkou OEM.
    - q: Jaká je obvyklá dodací lhůta pro objednávku OEM?
      a: Standardní dodací lhůta je 25–35 dní od potvrzené objednávky a zálohy pro sériovou výrobu OEM. Vývoj zakázkové formy přidává 15–20 dní na nástroje. Pro urgentní objednávky a sezónní nápor je k dispozici urychlená výroba. Prototypové vzorky bývají hotové do 7–12 dní.
    - q: Zajišťujete vývozní dokumentaci?
      a: Ano. Náš tým zajišťuje vývozní dokumentaci a celní odbavení vlastními silami a dodáváme do více než 50 zemí v Evropě, USA, Austrálii a Asii.

b2b_moq: 'MOQ podle konfigurace projektu: vzorek 1–2, pilotní 20–50, objem 90–100+ (na 150 m rol); malé série s co-brandingem od 5–10 kusů.'

production_flow:
  tagline: Výrobní průběh
  title: Od materiálu po hotovou desku
  subtitle: Každá deska projde 6 výrobních fázemi s kontrolními body na každém kroku. Žádné zkratky, žádné přeskočené kontroly.
  stages:
    - stage: '01'
      title: Příjem materiálu a vstupní kontrola
      description: 'Všechny vstupní materiály se zaznamenávají podle čísla šarže v našem ERP systému. Role tkaniny PVC, jádra drop-stitch, ventily, lepidla a kovové části jsou v karanténě, dokud je neodsouhlasí kontrola kvality.'
      qc_check: 'Pevnost v tahu (ASTM D751), odolnost proti trhání (ISO 4674), měření tloušťky, viskozita lepidla, vizuální prohlídka vad'
      qc_threshold: 'Zkoušeno 100 % šarží. Odmítnutí při pevnosti v tahu < 90 % specifikace, trhání < minimální specifikace nebo při jakékoli vizuální vadě'
      responsibility: Tým vstupní kontroly kvality (3 kontroloři)
    - stage: '02'
      title: CNC řezání a příprava materiálu
      description: 'Počítačově optimalizované rozvržení rozmísťuje díly na plochu PVC tak, aby se odpad zminimalizoval. Automatické CNC řezací stroje udržují polohovou přesnost 0,1 mm.'
      qc_check: 'Rozměrová kontrola podle souborů CAD DXF, kontrola kvality hrany, ověření počtu dílů'
      qc_threshold: 'Měří se každý 20. díl. Tolerance ±0,5 mm. Šarže se odmítne, pokud je mimo toleranci více než 2 %'
      responsibility: Vedoucí řezné dílny
    - stage: '03'
      title: Svařování a spojování jádra drop-stitch
      description: 'Jádra drop-stitch se lepí k vnějším vrstvám PVC pomocí tepelné laminace. Trubkové komory se svařují vysokofrekvenčně nebo horkovzdušně. Výztuhy okrajů se spojují fúzí ve třech vrstvách.'
      qc_check: 'Zkouška odtrhu každých 50 kusů (ASTM D751), měření šířky svaru, kontrola záznamu teplot horkovzdušného svařování, vizuální prohlídka švů s prosvětlením'
      qc_threshold: 'Minimální pevnost v odtrhu 8 N/cm. Tolerance šířky svaru ±1 mm. Jakékoli viditelné kanálkování = odmítnutí'
      responsibility: Kontrola kvality svařování (2 kontroloři na směnu)
    - stage: '04'
      title: Montáž a osazení
      description: 'Desky postupují na závěrečnou montáž, kde se spojuje všechno: palubní a trupové díly se taví k sobě, montují se ventily, D-kroužky, madla, držáky žebra a nosná taška. Každý kus projde kontrolním listem sestavení o 100 bodech.'
      qc_check: 'Podpis kontrolního listu o 100 bodech pro každý kus, funkční zkouška ventilu (10 cyklů otevření a zavření), kontrola momentu utažení kovových částí, vizuální kontrola'
      qc_threshold: 'Politika nuly vad u položek kritických pro bezpečnost (ventily, D-kroužky, madla). Drobné kosmetické vady: AQL 2,5 (ISO 2859)'
      responsibility: Vedoucí montážního týmu + kontrola kvality linky
    - stage: '05'
      title: Tlaková zkouška a kvalitní pozdržení
      description: 'Každá komora se dofukuje na 18,0 PSI (pro SUP s jmenovitými 12–15 PSI) a udržuje 24 hodin. Tlakové snímače zapisují průběžně. Komory s poklesem tlaku nad 0,50 PSI se odmítnou a odešlou na opětovnou kontrolu švů.'
      qc_check: 'Záznam 24hodinového udržení tlaku, denní ověření kalibrace snímačů, tlak odečítaný s teplotní kompenzací, opětovná zkouška švů po opravě'
      qc_threshold: 'Maximální pokles tlaku 0,50 PSI za 24 h při stabilní teplotě. Překročení u kteréhokoli komory = 100% opětovná zkouška celé výrobní šarže'
      responsibility: Laboratoř kvality (nezávisle na výrobě, hlásí se vedení)
    - stage: '06'
      title: Konečná kontrola a balení
      description: 'Konečná vizuální a funkční kontrola. Vady povrchu, jednotnost barvy, ověření etikety a BINu, neporušenost obalů a kompletnost příslušenství. Kusy se vakuově zabalí, uloží do krabic a naloží na palety pro nakládku do kontejneru.'
      qc_check: 'Úplná vizuální kontrola, kontrolní list příslušenství pro každé SKU, pádová zkouška obalu (1 m, náhodný výběr), ověření čitelnosti etiket a čárových kódů'
      qc_threshold: 'AQL 2,5 pro závažné vady, AQL 4,0 pro drobné. Nulová tolerance u bezpečnostních vad. Vizuálně se zkontroluje 100 % kusů'
      responsibility: Tým konečné kontroly kvality (4 kontroloři) + vedoucí balení

