workshops_section:
  tagline: Dílny
  title: Výrobní dílny
  workshops:
    - title: Řezání PVC a příprava materiálu
      description: 'Automatické CNC řezací stroje zpracovávají tkaniny PVC, Hypalon a drop-stitch s přesností na setiny milimetru. Počítačově optimalizované rozvržení minimalizuje odpad materiálu a zajišťuje, že každý díl splňuje svou rozměrovou specifikaci ještě před svařováním.'
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: CNC stroj na řezání PVC připravuje díly tkaniny nafukovací desky SUP v továrně v Qingdao
    - title: Svařování trubek a tepelné tavení
      description: 'Specializovaná svařovací dílna s teplotními svařovacími stroji a vysokofrekvenčními dielektrickými lisy. Horkovzdušné svařovačky spojují a taví trubkové komory z PVC, zatímco vysokofrekvenční svařování vytváří vysoce pevné nepropustné švy, které překračují požadavky.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Stroj na vysokofrekvenční svařování těsní trubkové komory nafukovacího člunu v továrně v Qingdao
    - title: Spojování jádra drop-stitch
      description: 'Jádra drop-stitch desek SUP se lepí k vnějším vrstvám PVC pomocí tepelné laminace. Tisíce vnitřních polyesterových vláken spojuje horní a dolní vrstvu a vytváří tuhou konstrukci při 12-15 PSI. Výztuhy okrajů jsou spojeny fúzí ve třech vrstvách pro pevnost hrany.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Výrobní linka nafukovacích SUP s technikou pro spojování jádra drop-stitch v továrně v Qingdao
    - title: Tisk a dekorování SUP
      description: 'Desky SUP se dekorují digitálním tiskem pro barevnou grafiku a sítliskem pro loga a opakující se vzory. Digitální tiskárny zajišťují návrh palub v kvalitě fotografie, zatímco sítlisk dodává trvalé a výrazné značkové prvky.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Interiér výrobní dílny v továrně nafukovacích SUP v Qingdao
    - title: Závěrečná montáž a osazení
      description: 'Montážní linka, kde se na každou desku SUP montují ventily, D-kroužky, madla, držáky žebra a palubní podložky. Každá deska projde kontrolním listem sestavení o 100 bodech, který podepíše vedoucí týmu.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Výrobní dílna s montážními pracovišti v továrně v Qingdao
    - title: Zkoušky a kontrola kvality
      description: 'Každá hotová deska před odesláním projde povinnou zkouškou nepropustnosti, kontrolou odolnosti švu v odtrhu a úplnou kontrolou systémů. Naše laboratoř kvality pracuje nezávisle na výrobě a hlásí se přímo vedení.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Tlakové zkoušení nepropustnosti nafukovací desky SUP před odesláním v továrně v Qingdao

