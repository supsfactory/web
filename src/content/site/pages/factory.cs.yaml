material_traceability:
  tagline: Vysledovatelnost
  title: Sledování materiálu a řízení šarží
  description: Každé šarži surovin se v našem ERP systému přiřadí jedinečné číslo šarže. Od příchodu přes výrobu až po hotový výrobek vede kusovník každé desky zpět k původní šarži dodavatele. Tím je zajištěna úplná vysledovatelnost protiupstreamově pro jakoukoli dotaz týkající se kvality nebo compliance.
  system: Vlastní ERP (vnitřní systém Qingdao Vatrad Group) + fyzické štítky šarží na každém výrobním příkazu
  coverage: 100 % výrobních materiálů — PVC, Hypalon, tkanina drop-stitch, lepidla, ventily, kovové části, obaly
  records_retained: 10 let (podle požadavku CE 2013/53/EU)
  suppliers:
    - material: PVC marine třídy
      source: Dodavatelé z Číny a Koreje
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Dodavatel z Japonska
      certified: ISO 9001, REACH
    - material: Tkanina drop-stitch
      source: Vlastní tkaní + externí partner
      certified: Vnitřní kontrola kvality + ISO 9001 dodavatele
    - material: Ventily a kovové části
      source: Čínští dodavatelé OEM
      certified: ISO 9001, materiálové certifikáty pro každou šarži

