hero:
  tagline: Továrna
  title: Továrna a výroba
  subtitle: Továrna SUP o ploše 12 500 m² v Číně, Qingdao — individuální výroba SUP od surovinového PVC až po hotovou nafukovací desku

answer:
  label: 'Přímá odpověď'
  text: 'Certifikovaná továrna nafukovacích desek SUP v Číně, Qingdao: ISO 9001, ISO 25649, BSCI, CE, REACH a RoHS. Závod o ploše 12 500 m² se 4 specializovanými dílnami, 350+ pracovníků, ročně vyrobí 120 000+ desek (10 000 desek měsíčně na 4 automatizovaných linkách). Každá deska projde 24hodinovou tlakovou zkouškou při 18,0 PSI, kontrolní list sestavení o 100 bodech a má 10letou vysledovatelnost materiálu.'
  verified: 'září 2026'

intro:
  - Jako výrobní divize **Qingdao Vatrad Group Co., Ltd.** hlídá Vatrad každý stupeň výroby nafukovacích SUP — od příchodu surovinového PVC až po finální kontrolu hotové desky před dodáním. Náš výrobní závod v hospodářské rozvojové zóně Qingdao zabírá 12 500 čtverečních metrů a zahrnuje samostatné dílny pro řezání PVC, spojování jádra drop-stitch, digitální tisk SUP, závěrečnou montáž a zkoušky kvality.
  - Spojením návrhu, konstrukce, prototypování, výroby a zkoušek pod jednou střechou odstraňujeme neefektivitu smluvní výroby a udržujeme přímou kontrolu nad kvalitou provedení, výběrem materiálu a dodacími lhůtami. Každá deska SUP, která opouští naši dílnu, je vyrobena našimi lidmi, na našem zařízení a podle našich standardů.

