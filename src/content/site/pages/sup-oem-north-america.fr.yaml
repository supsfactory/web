why_north_america:
  tagline: 'Pourquoi les acheteurs aux US et au Canada'
  title: 'Conçu pour les importations nord-américaines'
  subtitle: 'L''usine répond aux questions que se posent les marques américaines et canadiennes avant leur premier conteneur.'
  items:
    - title: 'DDP pour un coût rendu prévisible'
      description: 'Le DDP inclut le dédouanement et la livraison à votre entrepôt — droits, taxes et fret dans un total. Le choix le plus populaire pour les importateurs débutants.'
    - title: 'Documentation pour votre marché cible'
      description: 'La documentation CE, REACH et douane est préparée pour vos marchés cibles avec l''échantillon approuvé, donc votre fichier produit est prêt pour l''export.'
    - title: 'FOB Qingdao avec votre propre transitaire'
      description: 'Importateur régulier ? Prenez le FOB Qingdao et utilisez votre propre partenaire logistique — nous chargeons et documentons le conteneur, vous contrôlez le reste.'
    - title: 'Une usine, un système qualité'
      description: 'Le développement, l''échantillonnage, la production et le contrôle qualité ont tous lieu dans l''usine de 12 500 m² — pas d''allers-retours par courtier, pas d''échantillons que la production ne peut pas reproduire.'

process_notes:
  tagline: 'Comment ça marche'
  title: 'De la spéc. au conteneur'
  subtitle: 'Les mêmes six étapes que vous achetiez deux conteneurs ou vingt par an : spécification, ingénierie, échantillonnage, tests, outillage, production — puis livraison FOB, CIF ou DDP.'
  items:
    - title: '1. Envoyez votre spéc.'
      description: 'Une planche de référence, un croquis ou une spécification concurrent suffisent. La revue d''ingénierie et un devis reviennent sous un jour ouvré.'
    - title: '2. Approuvez l''échantillon'
      description: 'Votre premier échantillon physique part en 7–12 jours avec une fiche d''approbation couvrant la construction, les couleurs d''impression et les résultats de test de pression.'
    - title: '3. Production & export'
      description: 'Les séries se terminent en 25–35 jours avec des points de contrôle QC en cours de processus. La liste de colisage, la facture et le connaissement partent avant le navire.'
    - title: '4. Livraison à votre entrepôt'
      description: '4–6 semaines de fret maritime vers les ports US ou canadiens — en DDP, nous gérons le dédouanement et la livraison à votre porte.'

faq_section:
  tagline: FAQ
  title: 'Questions d''importation nord-américaine'
  questions:
    - q: 'Combien de temps le fret maritime prend-il vers les US ou le Canada ?'
      a: 'Prévoir 4–6 semaines du port de Qingdao vers les ports US ou canadiens, selon la destination et les rotations. Les projets DDP incluent le calendrier complet porte-à-porte.'
    - q: 'Expédiez-vous en DDP vers les US et le Canada ?'
      a: 'Oui. Le DDP inclut le fret maritime, le dédouanement, les droits et taxes, et la livraison à votre entrepôt — un prix total prévisible. Le FOB Qingdao et le CIF sont également disponibles.'
    - q: 'Quel est le MOQ pour un import de SUP en marque privée ?'
      a: 'Le MOQ est confirmé par la configuration du projet : le développement d''échantillon couvre 1–2 pcs, les lots pilotes s''exécutent à 20–50 pcs sur les plateformes existantes, et la production standard en volume s''exécute à 90–100+ pcs par design à partir d''un rouleau complet de drop-stitch de 150 m.'
    - q: 'Quelle documentation fournissez-vous pour les importations ?'
      a: 'L''échantillon approuvé part avec la documentation CE et REACH préparée pour vos marchés cibles, et chaque conteneur part avec liste de colisage, facture et connaissement.'
    - q: 'Quels documents de conformité US fournissez-vous pour les SUP ?'
      a: 'Les SUP gonflables adultes ne sont pas des produits pour enfants, aussi les règles CPSIA sur les produits de consommation ne s''appliquent généralement pas. California Prop 65 est une évaluation à votre discrétion d''étiquetage — notre documentation matière REACH/RoHS par commande la soutient. Une documentation conforme USCG peut être fournie là où votre catégorie de produit l''exige, et votre ingénieur de projet nommé confirme les documents exacts que votre avocat ou détaillant demande avant le début de la production.'
    - q: 'Puis-je visiter l''usine avant de commander ?'
      a: 'Oui. L''usine de 12 500 m² de Qingdao est ouverte aux clients — des visites virtuelles peuvent être organisées en ligne, et des visites sur place guidées à travers les lignes de production et les postes QC.'
    - q: 'Comment démarrer un projet depuis les US ou le Canada ?'
      a: 'Envoyez une planche de référence, un croquis ou une spécification. La revue d''ingénierie et le devis reviennent sous un jour ouvré, et un NDA est signé avant tout échange de fichier.'

