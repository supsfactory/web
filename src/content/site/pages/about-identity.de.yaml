hero:
  tagline: 'Markenidentität'
  title: 'Wer ist iSupfactory?'
  subtitle: 'iSupfactory ist die kundenorientierte Fertigungsmarke von Vatrad, der Marine-Fertigungssparte der Qingdao Vatrad Group Co., Ltd. — ein Hersteller von aufblasbaren SUPs und Marine-Inflatables in Laixi, Qingdao, China. Wir fertigen ausschließlich unter den Marken unserer Kunden und konkurrieren auf keinem Markt mit ihnen.'

answer:
  label: 'Kurz gesagt'
  text: 'Rechtsträger: Qingdao Vatrad Group Co., Ltd. Fertigungssparte: Vatrad (Marke iSupfactory). Fabrik: Laixi, Qingdao, Shandong, China. Umfang: OEM-, ODM- und Private-Label-Fertigung von aufblasbaren SUP-Boards, Paddeln und Marine-Inflatables. Zertifizierungen: ISO 9001:2015, CE (für den EU-Markt bestimmte Modelle), BSCI, REACH, RoHS. Wir verkaufen nicht unter eigener Marke — jedes Board, das wir produzieren, trägt die Marke des Käufers.'
  verified: 'September 2026'

