manufacturing_scope:
  heading: 'Fertigungsumfang'
  body: |
    Unser Fertigungsumfang deckt die gesamte Produktionskette für aufblasbare SUP- und Marine-Produkte ab — von der Eingangsprüfung der Rohmaterialien bis zur Endverpackung und Exporthandelsdokumentation.

    - **Produktkategorien**: Aufblasbare SUP-Boards (Allround, Touring, Surf, Fishing, Yoga, Racing), aufblasbare Kajaks, Schlauchboote, Paddel, Pumpen und Zubehör.
    - **Konstruktionstypen**: Einlagiges PVC, doppellagiges PVC, Drop-Stitch-Kern mit PVC-Hülle. Kundenspezifische Konstruktionsspezifikationen je Projekt.
    - **Kooperationsmodelle**: OEM (kundeneigenes Design), ODM (in der Fabrik nach Kundenbriefing entwickelt), Private Label/Co-Branding (Marke auf bewährten Plattformen).
    - **Zertifizierungen**: ISO 9001:2015 (Qualitätsmanagement der Fabrik), CE (für den EU-Markt bestimmte Modelle, Umfang je Projekt), BSCI (soziale Konformität), REACH (chemische Sicherheit), RoHS (beschränkte Stoffe).
    - **Produktionskapazität**: 120.000+ Boards pro Jahr, ca. 10,000 Einheiten Monatsausstoß auf 4 automatisierten Linien. Skalierung nach vorheriger Terminplanung möglich.

brand_positioning:
  heading: 'Markenpositionierung'
  body: |
    iSupfactory nimmt eine besondere Position im Markt ein — wir sind keine Marke, wir sind ein Hersteller. Diese Unterscheidung prägt jeden Aspekt unserer Arbeitsweise:

    - **Wir verkaufen nie unter eigener Marke.** Jedes Board, das wir produzieren, trägt die Marke des Käufers. Wir konkurrieren auf keinem Markt und in keinem Kanal mit unseren Kunden. Diese Politik ist unverhandelbar.
    - **Wir sind kein Handelsunternehmen.** Wir betreiben die Fabrik. Qualitätskontrolle, Konstruktion, Produktionsplanung und Exporthandelsdokumentation werden allesamt hausintern verwaltet. Es gibt keine Zwischenhändler zwischen Ihrer Bestellung und der Produktionsfläche.
    - **Wir sind auf aufblasbare Produkte spezialisiert.** Das ist kein Nebengeschäft und keine Produktkategorie unter vielen. Aufblasbare SUP- und Marine-Produkte sind unsere Kernkompetenz. Jede Maschine, jeder Prozess, jedes QC-Tor ist auf diese Produktkategorie optimiert.
    - **Wir bedienen professionelle Käufer.** Unsere Kunden sind Marken, Distributoren, Resort-Betreiber, Clubs und Schulen — keine Endverbraucher. Unsere Preisgestaltung, MOQ-Struktur, Dokumentation und Kommunikation sind auf B2B-Beziehungen ausgelegt.

evidence_review:
  tagline: 'Nachweise & Verifizierung'
  title: 'SPEZIFIKATIONEN VERIFIZIERT'
  body: 'Alle organisatorischen und fertigungsbezogenen Aussagen auf dieser Seite sind verifizierbar. ISO-9001-Zertifikat, BSCI-Bericht, Gewerbeschein und Fabrikregistrierungsdokumente sind auf Anfrage erhältlich. Werksbesuche willkommen. Spezifikationen zuletzt verifiziert im September 2026.'

faqs:
  tagline: FAQ
  title: 'Markenidentität — Häufig gestellte Fragen'
  items:
    - q: 'Ist iSupfactory ein separates Unternehmen von der Qingdao Vatrad Group?'
      a: 'Nein. iSupfactory ist die kundenorientierte Marke von Vatrad, der Marine-Fertigungssparte der Qingdao Vatrad Group Co., Ltd. Vertragspartner für alle Bestellungen ist die Qingdao Vatrad Group Co., Ltd. Die Fabrik, das Team und das Qualitätssystem bilden einen einzigen Betrieb.'
    - q: 'Verkaufen Sie Boards unter eigener Marke?'
      a: 'Nein. Wir fertigen ausschließlich unter den Marken unserer Kunden und konkurrieren auf keinem Markt mit ihnen. Das ist eine Kernrichtlinie — keine vorübergehende Position. Wenn Sie ein Board mit der Marke iSupfactory auf dem Markt finden, stammt es nicht aus unserer Fabrik.'
    - q: 'Kann ich die Fabrik besuchen?'
      a: 'Ja. Wir begrüßen Werksbesuche und können ein strukturiertes Audit arrangieren, das den gesamten Produktionsprozess, die QC-Tore, das Materiallager und die Dokumentenprüfung abdeckt. Kontaktieren Sie uns, um einen Besuch zu vereinbaren.'
    - q: 'Wie ist die Beziehung zwischen Vatrad und iSupfactory?'
      a: 'Vatrad ist der Name der Fertigungssparte innerhalb der Qingdao Vatrad Group. iSupfactory ist die internationale, kundenorientierte Marke für OEM-, ODM- und Private-Label-Fertigungsdienstleistungen. Beide beziehen sich auf denselben Betrieb — die Marine-Fertigungssparte in Laixi, Qingdao.'

