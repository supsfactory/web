key_factors:
  heading: 'Konstrüksiyon Türünün Ötesindeki Temel Faktörler'
  body: |
    Konstrüksiyon türü, board performansı içindeki bir değişkendir. Üç ek faktör en az o kadar veya daha fazla önemlidir:

    - **Drop stitch yoğunluğu** — İnç başına ip sayısı, boardun basınç altında şeklini ne kadar homojen koruduğunu belirler. Standart olarak inç başına 96 ip, performans üretimleri için ise 140 ip kullanırız. Daha yüksek yoğunluk = daha düz board = daha iyi kayma.
    - **PVC sınıfı ve kalınlığı** — Her PVC aynı değildir. Kore'den ithal edilen 0,7 mm PVC, daha ince alternatiflere göre daha yüksek yırtılma mukavemeti ve UV dayanımına sahiptir. Malzeme sınıfını proje bazında belirtiriz.
    - **Kenar konstrüksiyonu** — Tek katmanlı kenarlar, ucuz boardlarda en sık görülen arıza noktasıdır. Çift katman ve takviyeli kenar bandı, kenar delinme riskini belirgin biçimde azaltır. Konstrüksiyon segmentinden bağımsız olarak tüm boardlarımız takviyeli kenar bandı kullanır.

faqs:
  tagline: SSS
  title: 'SUP Konstrüksiyonu — Sık Sorulan Sorular'
  items:
    - q: 'Markam için hangi konstrüksiyon türünü seçmeliyim?'
      a: 'Bu, hedef pazarınıza ve fiyat konumlandırmanıza bağlıdır. Giriş seviyesi ve büyük mağaza perakendesi: tek katman. Kiralama filoları, kulüpler ve orta segment markalar: çift katman. Performans, tur ve premium: drop stitch çekirdek. Çoğu marka, maliyet, dayanıklılık ve kullanıcı deneyimi arasındaki en iyi denge olduğu için çift katmanla başlar. Uygulanabilirlik incelemesi sırasında belirli pazarınıza göre öneri sunarız.'
    - q: 'Tek bir marka altında birden fazla konstrüksiyon segmenti sunabilir miyim?'
      a: 'Evet — birçok marka iki veya üç segment sunar. Üç konstrüksiyonun üçünü de aynı hatta ve aynı kalite kontrolü kapılarıyla üretiyoruz; böylece tek bir sipariş içinde konstrüksiyon türlerini birleştirebilirsiniz. Gövde formu ve grafikler segmentler arasında aynı olabilir; yalnızca konstrüksiyon ve malzemeler değişir.'
    - q: 'Tüm konstrüksiyonlar için basınç testi standardı nedir?'
      a: 'Konstrüksiyon türünden bağımsız olarak her board, 24 saatte 0,50 PSI üzeri basınç kaybında otomatik ret uygulamasıyla 18.0 PSI tutma testinden geçer. Tek katmanlı boardlar 12–15 PSI sürüş basıncı, çift katmanlı boardlar 15–18 PSI, drop stitch çekirdekli boardlar ise 18–25 PSI için anma değerlidir. Test basıncı tüm tiplerde anma basıncının üzerindedir.'
    - q: 'Konstrüksiyon garanti taleplerini nasıl etkiler?'
      a: 'Kenar ve delinme maruziyeti nedeniyle tek katmanlı boardların ticari ve kiralama kullanımında garanti talep oranları bir ölçüde daha yüksektir. Çift katman ve drop stitch çekirdek konstrüksiyonlarda talep oranları belirgin biçimde daha düşüktür. Teklif aşamasında üretim kayıtlarımızdan segment bazında garanti verileri sunarız.'

