hero:
  tagline: 'Руководство по соответствию'
  title: 'Соответствие требованиям SUP по рынкам'
  subtitle: 'У каждого целевого рынка свои требования к сертификации, маркировке и документации. Это руководство показывает требования соответствия для надувных досок SUP на основных рынках — ЕС, Северная Америка, Австралия и другие — чтобы вы могли задать правильный объем требований на этапе запроса цены, а не после производства.'

answer:
  label: 'Краткий ответ'
  text: 'Для ЕС: маркировка CE обязательна для досок, продаваемых на территории Европейского экономического пространства — мы сертифицируем модели, предназначенные для рынков ЕС, объем подтверждается по каждому проекту. Для США: применяются CPSIA и региональные нормы по ЛОС. Для Австралии: соответствие AS/NZS 1586. Для всех рынков: ISO 9001 (завод), BSCI (социальный аудит), REACH и RoHS (материалы) — стандартны для нашего производства независимо от назначения. Объем требований и затраты на соответствие расписаны по позициям в вашем коммерческом предложении — никаких неожиданностей после производства.'
  verified: 'Сентябрь 2026'

