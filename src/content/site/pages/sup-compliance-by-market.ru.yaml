    - icon: 3
      icon_bg: purple
      title: 'Этап 7: Пакет документации'
      desc: 'Каждый производственный заказ отгружается с пакетом документов о соответствии: сертификатами соответствия, протоколами испытаний, записями отслеживаемости партий, паспортами безопасности материалов и подтверждением маркировки. Документация специфична для каждого рынка.'

faqs:
  tagline: FAQ
  title: 'Соответствие требованиям SUP — часто задаваемые вопросы'
  items:
    - q: 'Нужна ли всем доскам SUP маркировка CE?'
      a: 'Маркировка CE требуется только для досок, продаваемых на территории Европейского экономического пространства. Мы сертифицируем модели, предназначенные для рынков ЕС, с объемом, подтвержденным по каждому проекту. Доски, отгружаемые на рынки вне ЕС, не маркируются CE, если вы не запросите это явно.'
    - q: 'Соответствуют ли ваши материалы требованиям REACH и RoHS?'
      a: 'Да. Все материалы ПВХ, клеевые и покрывающие составы соответствуют REACH. Все электронные аксессуары (насосы с двигателями, светодиодные аксессуары) соответствуют RoHS. Материалы конструкции досок по своей природе соответствуют RoHS. Документация по веществам и протоколы испытаний доступны по партиям по запросу.'
    - q: 'Можете ли вы обеспечить сертификацию для рынка, которого здесь нет?'
      a: 'Да. Мы отгружали более чем в 50 стран и можем координировать сертификацию и документацию для большинства рынков. Укажите страну назначения при запросе, и мы подтвердим конкретный объем требований и любые дополнительные испытания или документы.'
    - q: 'Как учитываются затраты на соответствие требованиям?'
      a: 'Объем требований и связанные затраты (сторонние лабораторные испытания, сборы за сертификацию) расписываются по позициям в вашем коммерческом предложении в ходе проверки осуществимости. Никаких платежей за соответствие после производства. Стандартные сертификаты (ISO 9001, BSCI) относятся к уровню завода и не увеличивают стоимость единицы продукции.'

