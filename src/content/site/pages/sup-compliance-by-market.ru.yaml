certifications_detail:
  heading: 'Наш объем сертификации'
  body: |
    Следующие сертификаты имеются или доступны для нашего производства. Конкретный объем сертификации для вашего проекта подтверждается в ходе проверки осуществимости и расписывается по позициям в вашем коммерческом предложении.

    - **ISO 9001:2015** — Система менеджмента качества на заводе, ежегодно проверяемая аккредитованной сторонней организацией. Охватывает весь производственный процесс от входного контроля материалов до финальной упаковки.
    - **Маркировка CE** — Применяется к моделям, предназначенным для рынков ЕС. Испытания и документация в соответствии с применимой директивой ЕС. Объем подтверждается по каждому проекту — не для всех моделей требуется одинаковый объем CE.
    - **BSCI** — Аудит инициативы социального соответствия бизнеса. Охватывает трудовые права, безопасность на рабочем месте, экологическое соответствие и деловую этику. Доступен для всех рынков.
    - **REACH** — Регламент ЕС о химической безопасности. Все материалы ПВХ, клеевые и покрывающие составы соответствуют REACH. Документация по веществам и протоколы испытаний доступны по партиям.
    - **RoHS** — Директива об ограничении опасных веществ. Все электронные аксессуары (насосы с двигателями, светодиодные аксессуары) соответствуют RoHS. Материалы досок по своей природе соответствуют требованиям.

compliance_process:
  tagline: 'Как соответствие требованиям реализовано в вашем заказе'
  title: 'Соответствие требованиям в процессе подключения'
  subtitle: 'Соответствие требованиям — не дополнение, а неотъемлемая часть каждого этапа процесса подключения.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: 1
      icon_bg: blue
      title: 'Этап 1: Подтверждение объема'
      desc: 'При запросе вы указываете целевые рынки. Мы подтверждаем, какие сертификаты, испытания и документы применяются к вашему конкретному продукту и стране назначения. Объем требований и связанные затраты расписываются по позициям в коммерческом предложении.'
    - icon: 2
      icon_bg: green
      title: 'Этап 3: Сертификация образца'
