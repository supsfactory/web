faqs:
  tagline: FAQ per i distributori
  title: 'Programma di distribuzione all''ingrosso — Domande frequenti'
  items:
    - q: 'Qual è l''ordine minimo per un nuovo distributore?'
      a: 'I nuovi partner di distribuzione partono in genere con un ordine di approvazione campioni e pre-produzione, seguito da un primo container calibrato sulla loro stagione. I quantitativi minimi esatti dipendono dall''ampiezza del territorio e dall''assortimento scelto; il tuo account manager conferma il quantitativo iniziale durante la pianificazione di assortimento e branding.'
    - q: 'Possiamo vendere le tavole con il nostro marchio?'
      a: 'Sì. Il private label è il modello standard qui: le tavole vengono prodotte a marchio proprio con le tue grafiche, il tuo imballaggio e le tue specifiche. SUPsfactory produce esclusivamente per i propri clienti e non compete con loro in nessun mercato.'
    - q: 'I territori sono esclusivi?'
      a: 'Sì. I programmi per distributori si basano su territori esclusivi — ogni partner all''ingrosso copre un paese o una regione definiti e riceve supporto sui prezzi e sul programma per quel mercato, come stabilito nell''accordo commerciale.'
    - q: 'Supportate il drop-shipping?'
      a: 'La capacità drop-ship è inclusa nel programma. Campioni, imballaggio e gestione vengono validati nella fase di approvazione dei campioni, così gli ordini drop-ship funzionano senza intoppi fin dal primo giorno.'
    - q: 'Quali modelli possiamo ordinare?'
      a: 'Il catalogo di produzione comprende tavole SUP gonfiabili in forme Allround, Touring e Surf, kayak gonfiabili, pompe, pagaie, giubbotti di salvataggio e accessori per la cura, oltre a sagome personalizzate sviluppate con il nostro team di ingegneri. La maggior parte dei partner parte con 4–8 SKU bestseller ed espande nelle stagioni successive.'
    - q: 'Come vengono spediti gli ordini?'
      a: 'Gli ordini lasciano la fabbrica con partenze pianificate, con possibilità di preordine per stabilizzare i costi di trasporto. Il tuo account manager dedicato pianifica produzione e spedizione attorno alle tue previsioni e al calendario stagionale.'
    - q: 'Come faccio a candidarmi?'
      a: 'Usa il modulo di candidatura presente in questa pagina oppure contattaci direttamente. Le candidature vengono esaminate dal team vendite e rispondiamo entro pochi giorni lavorativi con i passi successivi, inclusa l''assegnazione del territorio e una bozza di contratto.'

