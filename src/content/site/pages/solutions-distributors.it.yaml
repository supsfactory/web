steps:
  tagline: Come funziona
  title: 'Dalla candidatura al primo container'
  subtitle: 'Un processo di onboarding chiaro e strutturato in più fasi, affinché il tuo programma a marchio proprio parta puntuale nella prima stagione.'
  steps:
    - step: 1
      title: Invia la candidatura
      desc: 'Invia la candidatura da distributore con il profilo della tua azienda, il tuo fatturato all''ingrosso pregresso e il tuo territorio.'
    - step: 2
      title: Assegnazione del territorio
      desc: 'Confermiamo quali paesi o regioni copre il tuo programma a marchio proprio e se il territorio è esclusivo.'
    - step: 3
      title: Piano assortimento & branding
      desc: 'Scegli i tuoi modelli base dal catalogo di produzione, congela le specifiche e finalizza le grafiche del tuo marchio per la produzione.'
    - step: 4
      title: Approvazione campioni & qualità
      desc: 'Ordina campioni di certificazione per verificare qualità, imballaggio e gestione drop-ship. I campioni vengono approvati prima dell''avvio della produzione in serie.'
    - step: 5
      title: Riordino stagionale
      desc: 'Il tuo account manager pianifica produzione e rifornimenti attorno alle tue previsioni e al calendario stagionale.'

