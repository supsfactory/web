faqs:
  - question: Kun je staan en vissen op een opblaasbare SUP?
    answer: Ja. De bredere opblaasbare SUP''s (33 inch of meer) bieden voldoende stabiliteit om te staan en te werpen. De volledige EVA-deckpads garanderen een veilige grip, ook als ze nat zijn.
  - question: Is een opblaasbare SUP geschikt om te vissen?
    answer: Opblaasbare SUP''s zijn uitstekende visplatforms, vooral voor het vissen in ondiep water en het verkennen van ondiepten. De brede ontwerpen bieden gemakkelijke toegang tot uitrusting en tackle.
  - question: Hoeveel uitrusting kan ik meenemen op een opblaasbare SUP?
    answer: De meeste opblaasbare SUP''s ondersteunen een totale capaciteit van 220–300 lbs (peddelaar plus uitrusting). Een typische visopstelling met tackle, koelbox en veiligheidsuitrusting voegt 20–40 lbs toe. Controleer de volume-aanduiding van de plank om voldoende capaciteit te garanderen.
body: |
  <h2>Waarom vissen vanaf een opblaasbare plank?</h2>
  <p>Opblaasbare SUP''s bieden vissers unieke voordelen die traditionele boten niet kunnen bieden. Hun geringe diepgang geeft toegang tot water dat motorvaren niet kan bereiken, terwijl de stille nadering de verstoring van vissen minimaliseert. De draagbaarheid betekent dat je afgelegen meren, rivieren en kustgebieden kunt bevissen zonder trailer of helling.</p>
  <p>De belangrijkste voordelen zijn:</p>
  <ul>
    <li><strong>Stilte</strong> —Geen motorgeluid betekent dat je vissen kunt benaderen zonder ze te laten schrikken</li>
    <li><strong>Toegang tot ondiep water</strong> —Een diepgang van enkele centimeters maakt vissen in moerassen, kreken en ondiepe zones mogelijk</li>
    <li><strong>Draagbaarheid</strong> —Neem je plank mee naar afgelegen plekken die onbereikbaar zijn per boot</li>
    <li><strong>Staan op de plank</strong> —SUP-planken laten je rechtop staan voor een beter zicht op het water</li>
  </ul>

  <h2>Stabiliteitseisen</h2>
  <p>Vissen vereist een stabiel platform. Kies je een opblaasbare plank voor de visserij, geef dan prioriteit aan:</p>
  <ul>
    <li><strong>Breedte</strong> —De bredere planken (33–36 inch) bieden betere stabiliteit om te staan en te werpen</li>
    <li><strong>Dikte</strong> —Planken van 6 inch bieden meer stijfheid en gewichtscapaciteit voor de uitrusting</li>
    <li><strong>Volume</strong> —Een groter volume (300+ liter) draagt het gecombineerde gewicht van visser en uitrusting</li>
    <li><strong>Deckoppervlak</strong> —Het volledige EVA-schuim deckpad biedt antislipgrip, ook wanneer het nat is</li>
  </ul>

  <h2>Compatibiliteit met uitrusting</h2>
  <p>Typische visopstellingen op opblaasbare planken omvatten:</p>
  <ul>
    <li><strong>Hengelhouder</strong> —Clip- of deck gemonteerde hengelhouders om handsfree te peddelen</li>
    <li><strong>Koelbox of tas</strong> —Stevig aan het deck bevestigd met elastische koorden, voor tackle en vangst</li>
    <li><strong>Ankersysteem</strong> —Licht verstelbaar anker of stake-out paal om positie te houden in de stroming</li>
    <li><strong>Peddel leash</strong> —Houdt de peddel vast wanneer beide handen nodig zijn om te vissen</li>
    <li><strong>Reddingsvest (PFD)</strong> —Onmisbare veiligheidsuitrusting voor alle vissers</li>
  </ul>

  <h2>Aanbevolen planktypes voor de visserij</h2>
  <p>Verschillende vis-scenario''s passen bij verschillende planktypen:</p>

  <h3>SUP-vissersplanken</h3>
  <p>Ideaal voor: vissen in ondiep water, baarsvissen op meren en sight fishing in ondiep water. De verhoogde rechtopstaande positie biedt een uitstekend zicht. Kies voor de stabiliteit een bredere touring- of allround-SUP.</p>

  <h3>SUP-vissersplanken</h3>
  <p>Ideaal voor: visuitjes met meerdere personen, het vervoeren van zware uitrusting en beschutte kustwateren. SUP''s bieden deckruimte en gewichtscapaciteit terwijl ze draagbaar blijven.</p>

  <h2>Veiligheidsnotities</h2>
  <ul>
    <li>Draag altijd een reddingsvest —vissen houdt staan, werpen en het verplaatsen van uitrusting in, wat het risico op vallen vergroot</li>
    <li>Controleer de weer- en wateromstandigheden vóór vertrek</li>
    <li>Neem een fluitje, een telefoon in een waterdichte hoes en een basis-reparatieset mee</li>
    <li>Laat iemand weten waar je vist en wanneer je verwacht terug te keren</li>
  </ul>

  <h2>FAQ</h2>
  <h3>Kun je staan en vissen op een opblaasbare SUP?</h3>
  <p>Ja. De bredere opblaasbare SUP''s (33 inch of meer) bieden voldoende stabiliteit om te staan en te werpen. De volledige EVA-deckpads garanderen een veilige grip, ook als ze nat zijn.</p>

  <h3>Hoeveel uitrusting kan ik meenemen op een opblaasbare SUP?</h3>
  <p>De meeste opblaasbare SUP''s ondersteunen een totale capaciteit van 220–300 lbs (peddelaar plus uitrusting). Een typische visopstelling met tackle, koelbox en veiligheidsuitrusting voegt 20–40 lbs toe. Controleer de volume-aanduiding van de plank om voldoende capaciteit te garanderen.</p>

