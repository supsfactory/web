faqs:
  tagline: FAQ дистрибьютора
  title: 'Оптовая программа дистрибуции — часто задаваемые вопросы'
  items:
    - q: 'Каков минимальный заказ для нового дистрибьютора?'
      a: 'Новые партнеры по дистрибуции обычно стартуют с заказа образцов и предпроизводственного согласования, за которым следует первый контейнер, привязанный к их сезону. Точные минимумы зависят от размера территории и выбранного ассортимента; ваш менеджер подтверждает стартовый объем на этапе планирования ассортимента и брендинга.'
    - q: 'Можем ли мы продавать доски под собственным брендом?'
      a: 'Да. Private label — стандартная модель здесь: доски производятся под вашим брендом с вашей графикой, упаковкой и характеристиками. iSupfactory производит исключительно для своих клиентов и не конкурирует с ними ни на одном рынке.'
    - q: 'Территории эксклюзивны?'
      a: 'Да. Дистрибьюторские программы строятся на эксклюзивных территориях — каждый оптовый партнер покрывает определенную страну или регион и получает цены и поддержку программы для этого рынка, как указано в коммерческом соглашении.'
    - q: 'Вы поддерживаете прямую доставку?'
      a: 'Возможность прямой доставки включена в программу. Образцы, упаковка и обработка заказов валидируются на этапе утверждения образцов, поэтому заказы с прямой доставкой выполняются без сбоев с первого дня.'
    - q: 'Какие модели мы можем заказать?'
      a: 'Производственный каталог охватывает надувные доски SUP всех форм — универсальные, туристические и сёрф-модели, надувные каяки, насосы, весла, спасательные жилеты и аксессуары для ухода, а также индивидуальные формы, разработанные совместно с нашей инженерной командой. Большинство партнеров стартуют с 4–8 самых продаваемых SKU и расширяют ассортимент в последующие сезоны.'
    - q: 'Как отгружаются заказы?'
      a: 'Заказы покидают завод по расписанию рейсов, при этом доступно предварительное заказание для фиксации стоимости фрахта. Ваш выделенный менеджер планирует производство и отгрузку с учетом вашего прогноза и сезонного календаря.'
    - q: 'Как подать заявку?'
      a: 'Используйте форму заявки на этой странице или свяжитесь с нами напрямую. Заявки рассматривает команда дистрибуции, и мы отвечаем с следующими шагами, включая определение территории и проект соглашения, в течение нескольких рабочих дней.'

