meta:
  title: 'Verificați fabrica noastră de plăci SUP | Vizită, audit și inspecție în Qingdao'
  description: 'Cum să verificați fabrica de plăci SUP înainte de a vă angaja: programați o vizită în fabrică, desfășurați un audit sau o inspecție independentă și consultați înregistrările de control al calității, trasabilitatea pe lot și certificările din Qingdao, China.'
  dateModified: '2026-09-23'
  keywords:
    - 'verificare fabrică SUP'
    - 'vizită fabrică SUP Qingdao'
    - 'audit fabrică SUP'
    - 'inspecție independentă SUP'
    - 'verificare fabrică plăci de vâslă gonflabile'

hero:
  tagline: 'Verificarea fabricii'
  title: 'Verificați fabrica de plăci SUP înainte de a vă angaja'
  subtitle: 'Nu trebuie să luați o fabrică încredere la ochi. Programați o vizită, desfășurați un audit sau o inspecție independentă și consultați certificatele, înregistrările de control al calității și trasabilitatea pe lot înainte de prima comandă — toate acestea sunt puse la dispoziție pentru cumpărătorii serioși.'

answer:
  label: 'Răspuns direct'
  text: 'Fabrica iSupfactory este o facilitate de 12,500 m² din Qingdao, Shandong, China, cu 350+ de lucrători, 4 linii automate de producție și 4 ateliere specializate. Cumpărătorii o pot verifica în patru moduri: vizitând fabrica pe tot parcursul anului, găzduind sau solicitând audituri (BSCI, ISO 9001), desfășurând o inspecție independentă (SGS, TÜV, BV, Intertek; eșantionare ISO 2859-1 Nivel II) sau consultând dovezile documentate — certificate, checklist-uri de asamblare în 100 de puncte, rapoarte de menținere la presiune de 24 de ore la 18.0 PSI și trasabilitate ERP pe lot timp de 10 ani, pentru fiecare etichetă de serie.'
  verified: 'Septembrie 2026'

features:
  title: 'Modalități de a verifica fabrica'
  subtitle: 'Patru trasee de verificare, fiecare aranjat de specialistul dumneavoastră de proiect — alegeți unul sau combinați-le.'
  items:
    - title: 'Programați o vizită în fabrică'
      description: 'Găzduim vizitele cumpărătorilor în Qingdao pe tot parcursul anului, cu preluare de la aeroport și vizitare pe planul de producție organizate în funcție de datele dumneavoastră. Un NDA este binevenit în orice moment.'
      icon: 'tabler:map-pin'
    - title: 'Audit independent'
      description: 'Rapoartele de audit BSCI și ISO 9001 sunt disponibile la cerere, iar auditurile găzduite sunt binevenite, astfel încât să puteți parcurge sala alături de auditor.'
      icon: 'tabler:clipboard-check'
    - title: 'Inspecție independentă'
      description: 'Inspecție înainte de expediție sau în mijlocul producției cu SGS, TÜV, BV sau Intertek, conform eșantionării ISO 2859-1 Nivel II — pe costul dumneavoastră, aranjată de noi, raportată direct către dumneavoastră.'
      icon: 'tabler:zoom-check'
    - title: 'Revizuirea documentației'
      description: 'Copii de certificate, înregistrări de inspecție la recepție, în proces și finală, rapoarte de menținere la presiune și dosare de trasabilitate pe lot, puse la dispoziție înainte de a vă angaja.'
      icon: 'tabler:file-search'
    - title: 'Vizitare live prin video'
      description: 'Încă nu puteți călători? Parcurgem planul de producție într-un apel live — prelucrarea drop-stitch, sudarea, tipărirea, asamblarea, încercările și ambalarea — înainte de a plasa o comandă.'
      icon: 'tabler:device-camera-phone'

faq_section:
  tagline: 'Întrebări de verificare'
  title: 'Verificarea fabricii și întrebări despre inspecție'
  questions:
    - q: 'Unde se află fabrica?'
      a: 'Fabrica se află în Qingdao, Shandong, China — o facilitate de 12,500 m² cu 350+ de lucrători, 4 linii automate și 4 ateliere specializate. Adresa și harta sunt transmise cumpărătorilor verificați atunci când programăm o vizită, iar adresa de expediție apare în contracte, în auditul BSCI și în documentația de export.'
    - q: 'Ce produce fabrica?'
      a: 'Plăci SUP gonflabile — de la ingineria carenei și prelucrarea miezului drop-stitch până la grafică, asamblare, încercări și ambalare pentru export. Toate procesele de bază pentru SUP se desfășoară sub același acoperiș.'
    - q: 'Ce procese se realizează intern?'
      a: 'Proiectarea carenei, inginerie dimensională, prelucrarea miezului drop-stitch, sudarea RF, tipărirea graficii, decuparea platformelor EVA cu matriță, matrițele personalizate, asamblarea, încercările și ambalarea sunt toate realizate intern. Accesoriile și unele materii prime provin de la furnizori certificați și sunt ambalate intern pentru trasabilitate.'
    - q: 'Pot cumpărătorii vizita fabrica?'
      a: 'Da. Vizitele cumpărătorilor sunt găzduite tot anul în Qingdao. Preluarea de la Aeroportul Internațional Qingdao Jiaodong și vizitarea completă a planului de producție sunt aranjate de specialistul dumneavoastră de proiect.'
    - q: 'Pot cumpărătorii aranja o inspecție independentă?'
      a: 'Da. Inspecțiile SGS, TÜV, BV și Intertek sunt binevenite înainte sau în timpul producției. Inspecția înainte de expediție folosește eșantionarea ISO 2859-1 Nivel II, iar raportul este trimis direct către dumneavoastră de către organismul de inspecție.'
    - q: 'Pot cumpărătorii solicita documentația de control al calității?'
      a: 'Da. Copiile certificatelor, înregistrările de inspecție la recepție, în proces și finală, rapoartele de menținere la presiune de 24 de ore la 18.0 PSI și checklist-ul de asamblare în 100 de puncte sunt emise pe lot, la cerere.'
    - q: 'Cum este gestionată trasabilitatea pe lot?'
      a: 'Fiecare placă poartă o etichetă de serie. Loturile sunt înregistrate într-un registru ERP păstrat 10 ani, care leagă rola de material, materialele, data producției, operatorii și rezultatele încercărilor de fiecare număr de serie.'
    - q: 'Cum este utilizată mostra aprobată?'
      a: 'Mostra aprobată devine referința de producție. Materialele, dimensiunile, grafica, accesoriile și finisajul sunt verificate față de ea la fiecare etapă de control al calității, astfel încât producția să corespundă a ceea ce ați semnat.'
    - q: 'Cum este controlată calitatea producției?'
      a: 'Un sistem de calitate în 7 etape (Nodul 01–07) aplică etapele de inspecție la recepția materialelor, în proces și finale, cu testare de menținere la presiune de 24 de ore la 18.0 PSI (respingere automată la o cădere de peste 0.50 PSI) și eliberare la finalul liniei conform eșantionării ISO 2859-1 Nivel II.'

