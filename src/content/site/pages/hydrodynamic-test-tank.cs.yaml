  label: 'Přímá odpověď'
  text: 'Tvary trupu SUP testujeme v nádrži v měřítku 1:3 až 1:5 — profil přídě, poloměr výztuhy, pružinování a smáčený povrch — a měříme odpor, účinnost klouzání a stabilitu ještě před závazkem k prototypu v plné velikosti. Týden v nádrži vám vrátí výkonnostní data, která by si vyžádala měsíce zkoušek v plné velikosti.'
