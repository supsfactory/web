faqs:
  - question: 'Que tipos de SUP insufláveis para turismo e lazer produz a Vatrad?'
    answer: 'A Vatrad produz SUP touring, SUP allround, SUP yoga, SUP de pesca e SUP recreativos insufláveis gerais. Todos os modelos estão disponíveis para a produção OEM/ODM com branding personalizado.'
  - question: 'Que materiais usa a Vatrad para os SUP insufláveis de qualidade turística?'
    answer: 'Utilizamos PVC marinho de alta resistência ao rasgamento com revestimentos multicamada para uma resistência superior aos raios UV, à abrasão e uma longa duração. Todos os tecidos provêm de fornecedores globais de renome e passam um rigoroso controlo à entrada.'
  - question: 'A Vatrad fornece a certificação CE para os SUP recreativos?'
    answer: 'Sim. Os modelos padrão transportam a marcação CE segundo a diretiva 2013/53/UE para o acesso ao mercado UE. Os modelos personalizados podem ser certificados CE através do nosso processo consolidado e, para os parceiros OEM/ODM, pode ser apoiada documentação de mercado adicional (USCG, AS 1799 e outras).'
  - question: 'A Vatrad pode personalizar gráficas e branding para os operadores turísticos?'
    answer: 'Sim — serviços OEM/ODM completos, incluindo impressão de logótipos personalizados nas pranchas, embalagem com a marca, gráficas de frota e soluções private label. Oferecemos impressão digital para gráficas a cores completas e serigrafia para logótipos duráveis.'
  - question: 'Qual garantia vale para os SUP Vatrad de turismo e lazer?'
    answer: 'Os SUP insufláveis Vatrad são fornecidos com uma garantia limitada do produtor de 3 anos para defeitos de produto e de fabrico. Para os operadores comerciais de frotas estão disponíveis opções de garantia alargada.'

body: |
  <h2>O padrão Vatrad — um compromisso com uma mestria marítima impecável</h2>
  <p>No vasto e dinâmico mundo do lazer e do uso marinho, o SUP insuflável representa um testemunho de versatilidade, comodidade e acessibilidade. Das tranquilas sessões de pesca nos lagos silenciosos ao relaxado tour costeiro, os SUP insufláveis cumprem uma multiplicidade de fins.</p>
  <p>Mas nem todos os SUP insufláveis são iguais. O verdadeiro critério de um SUP insuflável não está apenas no uso previsto, mas na integridade da sua construção, na qualidade dos seus materiais e na precisão do seu design. A Vatrad destaca-se como desenvolvedor e produtor de primeira linha, fabricando SUP insufláveis projetados para as máximas prestações em cada segmento turístico e recreativo.</p>

  <h2>Ciência dos materiais: o fundamento da longevidade</h2>
  <p>A escolha dos materiais é o fator mais crítico para a longevidade e as prestações de um SUP insuflável. A Vatrad investe recursos notáveis na identificação, nos testes e no aprovisionamento dos melhores tecidos e componentes do mundo.</p>
  <ul>
    <li><strong>Aprovisionamento superior do tecido:</strong> PVC marinho de alta resistência ao rasgamento com revestimentos multicamada, selecionado para uma durabilidade, resistência aos raios UV e à abrasão melhoradas.</li>
    <li><strong>Construção drop-stitch:</strong> milhares de fios internos em poliéster ligam a camada superior e inferior, criando uma estrutura rígida a 12–15 PSI.</li>
    <li><strong>Costuras termosoldadas:</strong> as nossas construções em PVC usam exclusivamente costuras termosoldadas (soldadura HF), que criam juntas de alta resistência e estanques ao ar que ultrapassam os requisitos ISO.</li>
    <li><strong>Proteção UV alargada:</strong> tecido em PVC com garantia de proteção UV para SUP expostos com frequência a forte radiação solar.</li>
  </ul>

  <h2>Filosofia de design: engenharia de precisão para cada segmento</h2>
  <p>A nossa equipa de design é composta por arquitetos navais experientes e especialistas da tecnologia insuflável que utilizam software CAD avançado e testes reais para desenvolver cascos hidrodinamicamente eficientes, excecionalmente estáveis e robustos.</p>

  <h3>SUP de pesca</h3>
  <p>Projetados para estabilidade e funcionamento silencioso. Os preparos adequados à pesca desportiva incluem suportes para canas, pontos de fixação para o equipamento e plataformas estáveis e silenciosas que minimizam as perturbações para os peixes.</p>

  <h3>SUP tender para barcos</h3>
  <p>Designs compactos e leves que se arrumam facilmente a bordo dos navios-mãe oferecendo ao mesmo tempo um transporte fiável e cómodo até à margem. Construção drop-stitch para prestações e manobrabilidade superiores.</p>

  <h3>SUP Allround & Touring</h3>
  <p>Construção drop-stitch de alta densidade e PVC de qualidade militar, projetados para 15 PSI para uma rigidez excecional. Os conjuntos de acessórios completos incluem bomba, mochila, leash, kit de reparação e pá.</p>

  <h2>Excelência produtiva: precisão em cada passagem</h2>
  <p>A Vatrad emprega técnicos altamente qualificados, mestres do seu ofício. A nossa fábrica está equipada com maquinaria de ponta, incluindo máquinas automáticas de corte CNC, soldadoras dielétricas HF, soldadoras de ar quente e impressoras digitais. Cada SUP segue procedimentos documentados com rastreabilidade.</p>
  <p>O nosso sistema de controlo de qualidade em vários níveis compreende controlos rigorosos em cada fase de produção e culmina em testes completos de cada prancha acabada antes do envio. Este compromisso com a qualidade está integrado desde o início, não apenas verificado no final.</p>

  <h2>Controlo de qualidade & provas</h2>
  <ul>
    <li><strong>Prova de estanquicidade ao ar 100 %:</strong> cada câmara é testada a pressão além dos limites operacionais para verificar a estanquicidade.</li>
    <li><strong>Verificação de tração da costura:</strong> a resistência das soldaduras e colagens é verificada com provas físicas de tração.</li>
    <li><strong>Validação da resistência UV:</strong> os materiais são expostos a luz solar simulada para avaliar a resistência ao envelhecimento.</li>
    <li><strong>Prova de abrasão:</strong> as amostras de material são testadas contra superfícies abrasivas para a resistência ao desgaste.</li>
    <li><strong>Prova completa do sistema:</strong> cada SUP passa um controlo final antes da libertação para envio.</li>
  </ul>

  <h2>Porque escolher a Vatrad para a tua frota turística & recreativa</h2>
  <p>Com a nossa fábrica de 12,500 m² certificada ISO e CE em Qingdao, na China, a Vatrad oferece aos operadores turísticos, às frotas de aluguer e às marcas recreativas um parceiro de produção fiável. Os nossos serviços OEM/ODM incluem branding personalizado, private label, embalagem e apoio logístico. MOQ de volume padrão de 90–100+ unidades por rolo de 150 m (ciclos piloto de 20–50 unidades) com prazos de entrega de 25–35 dias.</p>
  <p>Cada SUP Vatrad é um investimento em qualidade, durabilidade e prestações sem paralelo — e garante que os teus hóspedes vivam experiências seguras e inesquecíveis na água.</p>

