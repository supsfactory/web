faqs:
  tagline: FAQ voor distributeurs
  title: 'Groothandelsdistributieprogramma — Veelgestelde vragen'
  items:
    - q: 'Wat is de minimale order voor een nieuwe distributeur?'
      a: 'Nieuwe distributiepartners starten doorgaans met een monster- en pre-productiegoedkeuringsorder, gevolgd door een eerste container die is afgestemd op hun seizoen. De exacte minimumhoeveelheden hangen af van de omvang van het territorium en het gekozen assortiment; jouw accountmanager bevestigt de initiële hoeveelheid tijdens de assortiments- en brandingplanning.'
    - q: 'Kunnen we de boards onder ons eigen merk verkopen?'
      a: 'Ja. Private label is hier het standaardmodel: de boards worden onder eigen merk geproduceerd met jouw graphics, jouw verpakking en jouw specificaties. SUPsfactory produceert uitsluitend voor de eigen klanten en concurreert in geen enkele markt met hen.'
    - q: 'Zijn de territoria exclusief?'
      a: 'Ja. De distributeursprogramma''s zijn gebaseerd op exclusieve territoria — elke groothandelspartner bestrijkt een vastgesteld land of een vastgestelde regio en ontvangt prijs- en programmasteun voor die markt, zoals vastgelegd in de commerciële overeenkomst.'
    - q: 'Ondersteunen jullie dropshipping?'
      a: 'De dropship-capaciteit is in het programma inbegrepen. Monsters, verpakking en afhandeling worden gevalideerd in de fase van monstergoedkeuring, zodat dropship-orders vanaf dag één zonder problemen werken.'
    - q: 'Welke modellen kunnen we bestellen?'
      a: 'De productiecatalogus omvat opblaasbare SUP-boards in Allround-, Touring- en Surf-vormen, opblaasbare kayaks, pompen, peddels, reddingsdrijvers en verzorgingsaccessoires, naast aangepaste vormen die met ons engineeringteam zijn ontwikkeld. De meeste partners starten met 4–8 bestseller-SKU''s en breiden uit in de volgende seizoenen.'
    - q: 'Hoe worden de orders verzonden?'
      a: 'De orders verlaten de fabriek met geplande vertrekken, met de mogelijkheid van voorbestelling om de transportkosten te stabiliseren. Jouw toegewijde accountmanager plant productie en verzending rondom jouw prognoses en de seizoenskalender.'
    - q: 'Hoe meld ik me aan?'
      a: 'Gebruik het aanmeldformulier op deze pagina of neem rechtstreeks contact met ons op. De aanmeldingen worden door het salesteam beoordeeld en wij reageren binnen enkele werkdagen met de vervolgstappen, inclusief de territoriumtoewijzing en een conceptcontract.'

