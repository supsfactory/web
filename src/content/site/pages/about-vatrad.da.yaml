intro: |
  <p><strong>Vatrad</strong> er den marine produktionsdivision i <strong>Qingdao Vatrad Group Co., Ltd.</strong>, beliggende i den økonomiske udviklingszone i Laixi, Qingdao, Shandong, Kina. Virksomheden blev grundlagt i 2012 og startede som et specialiseret fartøjsværksted med et engagement i maritimt håndværk, og er i dag vokset til en certificeret fabrik, der betjener OEM- og ODM-kunder i over 50 lande.</p>
  <p>iSupfactory er Vatrad-fabrikkenes B2B-afdeling for specialudvikling. Hvert iSupfactory-projekt — fra en første prøve eller en lille co-branded serie til en fuld private label-produktlinje — fremstilles i samme anlæg, af de samme teams og under det samme kvalitetssystem, som er beskrevet her.</p>
  <p>Fabrikken dækker 12,500 m² med dedikerede værksteder til PVC-skæring, samling af drop-stitch-kerner, højfrekvenssvejsning, brætmontering samt et testområde til luftfastholdning, trykholdning og sømstyrketest. Produktionskapaciteten overstiger 120,000 oppustelige enheder om året, og anlægget drives under ISO 9001-kvalitetsledelse med CE-, BSCI- og REACH-overensstemmelse samt USCG-godkendelse for eksporterede produkter.</p>
  <p>Mere end 350 kvalificerede arbejdere og 14+ R&amp;D-ingeniører understøtter de to arbejdsområder, der betyder noget for SUP-mærker: konstruktion (skrogdesign, materialevalg, prototyper) og produktion (påførsel af grafik, samling, inspektion, eksportpakning). Et eget R&amp;D-center med PVC-duglaboratorium og testbassin håndterer specialforme og validering af konstruktioner, før serieproduktionen sætter gang.</p>
