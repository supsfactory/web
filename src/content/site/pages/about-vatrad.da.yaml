values_section:
  title: Sådan arbejder fabrikken med mærker
  subtitle: 'Tre principper, der præger ethvert projekt, der bygges af Vatrad-fabrikken.'
  columns: 3
  items:
    - title: Konstruktion før produktion
      description: 'Hvert projekt starter med krav, tegninger og en fysisk prøve — skrogform, drop-stitch-klasse, placering af grafik og emballage valideres, før nogen produktion sættes i gang, ikke når det opdages på linjen.'
      icon: 'tabler:settings'
    - title: Samlet team, samlet anlæg
      description: 'Design, skæring, svejsning, samling og test sker i samme anlæg på 12,500 m². Ingen overdragelser via handelsselskaber: de, der svarer på dine spørgsmål, er dem, der bygger dine brætter.'
      icon: 'tabler:building-factory-2'
    - title: Små første serier
      description: 'Co-branding i minimale partier starter ved 5–10 stk., og standardserieproduktion kører 90–100+ stk. pr. batch (en drop-stitch-rulle på 150 m), så mærker validerer markedet, før de skalerer — med værktøj og artwork bevaret til genbestillinger.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Hvad fabrikken leverer
  subtitle: 'De produktionsydelser, iSupfactory-kunder har adgang til.'
  columns: 2
  items:
    - title: Specialudvikling af SUP
      description: 'Kravanalyse, specifikation, materialevalg, grafik, prototyper, prøvegodkendelse og produktion af specialfremstillede oppustelige SUP-produkter.'
      icon: 'tabler:bulb'
    - title: Private label-produktion
      description: 'Dit logo, dine farver og din emballage på gennemprøvede platforme i kommerciel kvalitet — bræt, dækpude, tilbehør og kartoner bærer alle din identitet, uden fabrikkens branding.'
      icon: 'tabler:tag'
    - title: OEM / ODM-produktion
      description: 'Fuld OEM- og ODM-produktion af oppustelige SUP-brætter ud fra kundens tegninger eller fællesudviklede designs, inklusive specialforme til nye brætformer.'
      icon: 'tabler:package'
    - title: Flådeleverance
      description: 'Mærkede brætflåder til resorts, klubber, skoler og udlejningsvirksomheder, med matchende tilbehør og produktionsserier tilpasset flåder.'
      icon: 'tabler:users-group'
certifications_section:
  title: Certificering & overensstemmelse
  subtitle: 'Fabrikken sender til EU, USA og Asien-Stillehavs-området under et dokumenteret overensstemmelsessystem.'
  columns: 2
  items:
    - title: CE-certificering
      description: 'Produktlinjerne af oppustelige SUP-brætter og fartøjer overholder EU’s sikkerhedsdirektiver, med dokumentation til hvert marked.'
      icon: 'tabler:certificate'
    - title: ISO 9001-kvalitetssystem
      description: 'Produktionsanlægget drives under et ISO 9001-kvalitetsledelsessystem, der dækker indgående materialer, processen og slutinspektion.'
      icon: 'tabler:badge-check'
    - title: BSCI social overensstemmelse
      description: 'Social ansvarlighed auditeret efter BSCI, med dækning af arbejdsforhold og fabrikoverholdelse.'
      icon: 'tabler:shield-check'
    - title: REACH-materialeoverensstemmelse
      description: 'Materialerne overholder EU’s REACH-forordning om kemisk sikkerhed.'
      icon: 'tabler:flask'
    - title: USCG-godkendelse
      description: 'Produktion godkendt af US Coast Guard til produktlinjer af oppustelige fartøjer.'
      icon: 'tabler:anchor'
    - title: Produkttest
      description: 'Prøvning af flydeevne, bæreevne, sømstyrke, UV-modstand, slidstyrke og trykholdning på hver produktionslinje.'
      icon: 'tabler:test-pipe'
