      title: Area di test di tenuta all''aria
      desc: 'Le tavole gonfiate vengono mantenute nell''area di test QC sotto illuminazione industriale; gli strumenti di misura pressione digitali monitorano il test di mantenimento della pressione rilasciato su base valvola, cuciture dei rail, prua e poppa e punti altamente sollecitati. Le registrazioni vengono mantenute per lotto e collegate al controllo finale.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
