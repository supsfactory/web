answer:
  label: 'Risposta chiara'
  text: 'QINGDAO VATRAD GROUP.,LTD. controlla la qualità dei SUP gonfiabili tramite un sistema di verifica in 4 fasi: controllo ingresso merci (IQC), controllo qualità di processo (IPQC), verifica finale della tavola e di gonfiaggio (FQC) nonché pre-rilascio di imballaggio e spedizione (OQC). Ogni ordine viene verificato contro il campione rilasciato, la specifica tecnica, la prova di artwork, la BOM e gli standard di imballaggio — inclusa la verifica di tenuta all''aria, i controlli visivi e dimensionali, la conferma degli accessori e la rintracciabilità dei lotti. Le unità che non soddisfano i criteri di accettazione vengono bloccate o poste in quarantena in modo controllato, rilavorate esclusivamente secondo istruzioni rilasciate e nuovamente verificate prima del rilascio autorizzato.'
  verified: 'September 2026'

intro: 'Il nostro sistema qualità è costruito per i progetti OEM/ODM: i criteri di ispezione vengono definiti, documentati e seguiti per ordine dal team di produzione e qualità, dall''ingresso merci all''imballaggio. Così l''aspettativa di qualità resta allineata tra fabbrica e vostro marchio, dal primo campione alle consegne complete in container.'

scope_note:
  tagline: Ambito
  title: Criteri di ispezione specifici per progetto
  body: |
    Le specifiche di qualità possono variare in base alla costruzione della tavola (es. a uno/due strati, drop-stitch in tessuto, rail incollato), all''uso previsto, alle normative del mercato di destinazione e ai parametri approvati dal cliente. Il rilascio finale si basa rigorosamente sui criteri di ispezione documentati concordati per l''ordine.

stages:
  tagline: Quadro qualità
  title: Il nostro sistema di verifica qualità in 4 fasi
  subtitle: Un ciclo QC completo dall''ingresso delle materie prime al rilascio in spedizione.
  steps:
    - title: '1. Controllo ingresso merci (IQC)'
      desc: 'I materiali principali e i componenti acquistati vengono verificati contro specifiche rilasciate e campioni di riferimento prima di entrare nella linea di produzione. Materiale drop-stitch e PVC vengono verificati per identificazione materiale, lotto fornitore, peso/densità, spessore, corrispondenza colore contro i campioni rilasciati e difetti superficiali. I pad di trazione EVA vengono controllati per motivo, colore, spessore, precisione di taglio e compatibilità dell''adesivo. Valvole e raccordi passano test funzionali, di filettatura, di integrità della guarnizione e di accoppiamento. Accessori e imballaggio (pompe, paddle, pinne, leash, borse, cartoni) vengono confrontati per quantità, colore, branding, accuratezza del codice a barre e versione artwork contro la BOM rilasciata.'
    - title: '2. Controllo qualità di processo (IPQC)'
      desc: 'Le fasi produttive critiche vengono ispezionate per individuare le non conformità prima che le tavole raggiungano le postazioni a valle. Taglio e stampa vengono verificati per dimensioni dei pannelli, layout artwork, orientamento a specchio e pulizia dei bordi contro i disegni tecnici rilasciati. Assemblaggio della tavola e incollaggio del rail vengono controllati per simmetria dello scafo, continuità della sovrapposizione delle cuciture e assenza di vuoti o bolle d''aria lungo le aree altamente sollecitate. Il fissaggio di valvole e accessori, le grafiche e il branding vengono verificati per posizione, orientamento, copertura adesiva, grafia del logo e versione artwork.'
    - title: '3. Verifica finale della tavola & di gonfiaggio (FQC)'
      desc: 'Le tavole completate attraversano test fisici e strutturali vincolanti prima del rilascio all''imballaggio. Le tavole vengono gonfiate e mantenute alla pressione di prova rilasciata per il progetto per verificare rigidità strutturale e stabilità della pressione. Le scansioni di tenuta all''aria coprono l''alloggiamento della valvola, le cuciture dei rail, i coni di prua/poppa e i giunti di tensione utilizzando metodi calibrati di rilevamento delle perdite (monitoraggio del calo di pressione o test a bolle). L''ispezione estetica e dimensionale verifica dimensioni, profilo rocker e allineamento del pad EVA (tolleranza ±2 mm) in condizioni di luce diurna standard.'
    - title: '4. Imballaggio & pre-rilascio spedizione (OQC)'
      desc: 'La pre-verifica di spedizione completa assicura una corrispondenza di configurazione SKU e marcature di spedizione con zero deviazioni. Il controllo di completezza del kit confronta tavola, pinna, leash, paddle, pompa, borsa, kit di riparazione e manuale di istruzioni contro la BOM dell''ordine. I controlli di imballaggio e codice a barre verificano le marcature del cartone, le etichette SKU, la leggibilità del codice a barre, la lingua del manuale e l''integrità strutturale del cartone. Gli ordini vengono rilasciati solo dopo il controllo di imballaggio finale firmato dal personale qualità autorizzato.'

inspection_points:
  tagline: Copertura dell''ispezione
  title: Punti di controllo di ispezione principali
  subtitle: Ogni punto di controllo viene eseguito contro criteri di accettazione documentati e concordati per ordine.
  features:
    - icon: A
      icon_bg: blue
      title: Verifica di tenuta all''aria
      desc: 'Le tavole completate vengono gonfiate alla pressione di prova rilasciata e controllate per mantenimento della pressione, stato della base valvola, cuciture dei rail, zone di prua e poppa e punti altamente sollecitati. Dove previsto dalla procedura di ispezione, le aree di sospetta perdita vengono esaminate con metodi di rilevamento rilasciati.'
    - icon: B
      icon_bg: green
      title: Controllo visivo & dimensionale
      desc: 'Le tavole vengono controllate con illuminazione adeguata per stato della superficie del materiale, errori di stampa, scarti cromatici, allineamento EVA, pieghe, graffi, impurità e ottica di incollaggio. Le dimensioni chiave e le posizioni degli accessori vengono verificate contro i disegni o le specifiche rilasciate.'
    - icon: C
      icon_bg: purple
      title: Verifica di accessori & imballaggio
      desc: 'Prima della spedizione viene verificata la configurazione completa del prodotto: modello di tavola, sistema di pinne, paddle, pompa, leash, borsa di trasporto, kit di riparazione, manuale di istruzioni e accessori personalizzati — ciascuno confrontato contro il campione rilasciato, i disegni e la BOM.'
    - icon: D
      icon_bg: orange
      title: Imballaggio & rilascio in spedizione
      desc: 'Le unità imballate vengono controllate per configurazione SKU, completezza degli accessori, etichette di prodotto, informazioni del codice a barre, versione del manuale di istruzioni, marcatura del cartone, quantità di imballaggio e stato del cartone. Il rilascio in spedizione viene autorizzato solo dopo il completamento di tutti i requisiti di ispezione e imballaggio.'

traceability_intro:
  tagline: Rintracciabilità dei lotti
  title: Sistema di rintracciabilità di progetto & lotti
  body: |
    Ogni ordine SUP personalizzato viene gestito sotto un codice di progetto unificato che collega specifiche tecniche, BOM rilasciata, revisioni artwork, numeri di lotto materiale, riferimenti di imballaggio e registrazioni di ispezione. Le registrazioni di produzione e ispezione vengono mantenute per progetto e lotto di produzione applicabili, e ogni lotto può essere ricondotto alla specifica di prodotto rilasciata, BOM, artwork e riferimenti di imballaggio.

    Questo supporta la verifica efficiente di configurazione del prodotto, stato di ispezione e ambito interessato nel caso venga sollevata una preoccupazione di qualità — dal prodotto finito alle registrazioni di origine tramite l''identificazione di tavola o cartone.

traceability_chain:
  tagline: Catena di rintracciabilità
  title: Dal codice di progetto al rilascio in spedizione
  subtitle: Una catena di riferimenti controllati dalla conferma d''ordine alla spedizione autorizzata.
  steps:
    - step: '01'
      title: Codice di progetto
      desc: Riferimento di progetto unificato che collega ogni documento controllato all''ordine.
    - step: '02'
      title: Revisioni documentali
      desc: Livelli di revisione correnti di specifica, BOM, artwork e imballaggio — solo le versioni rilasciate sono valide per la produzione.
    - step: '03'
      title: Lotto & materiali
      desc: I lotti di materiale e componenti vengono registrati contro il lotto di produzione.
    - step: '04'
      title: Registrazioni di ispezione
      desc: Risultati di ispezione IQC, di processo, tenuta all''aria, finali e di imballaggio per lotto.
    - step: '05'
      title: Imballaggio & rilascio
      desc: Lotto di imballaggio, stato di chiusura NCR e panoramica del rilascio in spedizione autorizzato.

traceability_sample:
  tagline: Esempio anonimizzato
  title: Registrazione di controllo della rintracciabilità (Demo)
  body: |
    I valori dimostrativi servono solo per illustrazione — nome del cliente, numeri d''ordine, artwork personalizzato, dati fornitore e informazioni commerciali sono stati rimossi a tutela della riservatezza.

    - **Produttore:** QINGDAO VATRAD GROUP, LTD.
    - **Codice di progetto:** DEMO-SUP-2026-01
    - **Riferimento SKU:** DEMO-TR-126
    - **Lotto di produzione:** BATCH-AUG-01
    - **Specifica / BOM / Revisione artwork:** Rev B / Rev C / Rev B
    - **Registrazione di tenuta all''aria:** PASS —conservata per lotto
    - **Stato ispezione:** PASS
    - **Stato spedizione:** RILASCIATO

quarantine_intro:
  tagline: Controllo di non conformità
  title: Controllo dei prodotti non conformi & quarantena
  body: |
    I prodotti o componenti che non soddisfano i criteri di accettazione definiti vengono chiaramente marcati e bloccati o posti in quarantena in modo controllato. Possono arrivare allo stadio di produzione successivo, all''imballaggio o alla spedizione solo dopo il completamento di una disposizione autorizzata. La rilavorazione avviene secondo istruzioni rilasciate ed è collegata al relativo verbale di non conformità; le unità rilavorate vengono nuovamente verificate contro i requisiti di progetto applicabili prima del rilascio qualità.

quarantine_flow:
  tagline: Flusso di controllo in 7 fasi
  title: Cosa succede quando viene trovata una non conformità
  subtitle: Identificare, bloccare, correggere, verificare — poi rilasciare o respingere. I prodotti non conformi non tornano mai alla produzione o all''imballaggio senza verifica.
  steps:
    - step: '01'
      title: Identificare
      desc: La non conformità viene registrata contro il prodotto, la SKU, il lotto o la fase di processo interessati.
    - step: '02'
      title: Marcare
      desc: Le unità interessate vengono chiaramente marcate con etichette di stato controllate —HOLD, in quarantena o respinte.
    - step: '03'
      title: Quarantena
      desc: Le unità vengono separate in un''area di quarantena fisicamente controllata o gestita dal sistema, per prevenire uso o spedizione involontari.
    - step: '04'
      title: Valutare l''ambito
      desc: L''ambito interessato viene esaminato per lotto, fase di processo, lotto materiale e revisione documentale.
    - step: '05'
      title: Rilavorare / Sostituire
      desc: Una correzione è consentita solo tramite disposizione rilasciata e istruzione di lavoro controllata.
    - step: '06'
      title: Verificare di nuovo
      desc: Le unità corrette vengono nuovamente verificate contro i criteri di accettazione applicabili prima del rilascio.
    - step: '07'
      title: Rilasciare o respingere
      desc: Solo il prodotto autorizzato e conforme raggiunge l''imballaggio o il rilascio in spedizione.

