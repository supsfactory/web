rework_intro:
  tagline: Governance della rilavorazione
  title: Non conformità di tenuta all''aria controllata & governance della rilavorazione
  body: |
    Presso QINGDAO VATRAD GROUP.,LTD. la rilavorazione è strettamente definita come ripristino di un''unità non conforme alla piena conformità con la sua specifica tecnica originale — non come una toppa veloce. Ogni tavola con una non conformità di tenuta all''aria viene bloccata in modo controllato e collegata a un verbale di non conformità (NCR) prima di qualsiasi ulteriore lavorazione; la fonte della perdita viene localizzata e registrata con il metodo diagnostico rilasciato.

    La rilavorazione può procedere solo se il difetto rientra nell''ambito di rilavorazione rilasciato e se è disponibile un metodo autorizzato. L''istruzione di rilavorazione identifica prodotto, lotto, posizione del difetto, materiale rilasciato, metodo, condizioni richieste e ambito della verifica ripetuta. Dopo la fase di polimerizzazione o stabilizzazione richiesta, la tavola viene nuovamente verificata contro gli stessi criteri di accettazione applicabili di una tavola conforme — la rilavorazione non abbassa mai lo standard di accettazione. Se la verifica ripetuta fallisce, è richiesta una nuova disposizione di ingegneria e qualità; la rilavorazione ripetuta non è consentita senza rilascio documentato.

rework_decision:
  tagline: Flusso interattivo
  title: Flusso decisionale della rilavorazione — clicca ogni nodo
  subtitle: Segui come una non conformità di tenuta all''aria viene gestita dal rilevamento al rilascio o alla rottamazione. Clicca su un nodo per espandere i requisiti di controllo in quel passaggio.
  nodes:
    - id: detect
      type: start
      label: Perdita rilevata
      detail: 'Durante l''ispezione viene riscontrata una non conformità di tenuta all''aria — errore di mantenimento pressione, perdita visibile o un errore correlato del sistema aria.'
    - id: hold
      type: step
      label: Fermare la linea · etichetta HOLD · NCR
      detail: 'La lavorazione viene fermata. ID tavola, codice prodotto, lotto, postazione di lavoro, data e ispettore vengono registrati; viene apposta un''etichetta HOLD / quarantena e viene aperto un NCR contro la revisione di specifica applicabile.'
    - id: locate
      type: step
      label: Localizzare la fonte della perdita
      detail: 'La tavola viene gonfiata alla pressione diagnostica rilasciata per il progetto e la fonte viene localizzata con un metodo rilasciato — mantenimento della pressione, test a bolle calibrato, dispositivo acustico o di rilevamento perdite.'
    - id: classify
      type: step
      label: Classificare il difetto (A–G)
      detail: 'Il difetto viene classificato contro la matrice di rilascio: A interfaccia valvola, B cucitura base valvola, C foro di spillo superficiale, D cucitura locale del rail, E danno esteso al rail, F perdita ricorrente, G danno strutturale.'
    - id: authorize
      type: decision
      label: Rilavorazione autorizzata?
      yes: rework
      no: escalate
      detail: 'Il QC conferma la categoria del difetto e l''ingegneria verifica se la tavola può essere riportata alla sua specifica originale. L''autorizzazione documenta scheda metodo, materiali, condizioni e ambito della verifica ripetuta — oppure porta a sostituzione, respinta, rottamazione o concessione al cliente.'
    - id: rework
      type: step
      label: Rilavorazione controllata
      detail: 'Eseguita esclusivamente entro il limite di difetto rilasciato utilizzando la scheda metodo, il lotto di materiale e gli attrezzi rilasciati — senza mai modificare dimensioni, costruzione, grafiche, accessori o requisiti di imballaggio.'
    - id: cure
      type: step
      label: Polimerizzazione & stabilizzazione
      detail: 'La tavola resta su HOLD durante la fase di polimerizzazione e stabilizzazione definita dall''istruzione di materiale e processo rilasciata, quindi riceve una pre-verifica visiva e di lavorazione.'
    - id: reinspect
      type: decision
      label: Verifica ripetuta superata?
      yes: release
      no: escalate
      detail: 'La tavola viene gonfiata alla pressione di verifica ripetuta rilasciata per il progetto e il difetto originale insieme a tutte le caratteristiche potenzialmente interessate vengono nuovamente verificati — punto di perdita, valvola, rail, cuciture, aree altamente sollecitate, accessori e aspetto. La rilavorazione non abbassa mai lo standard di accettazione.'
    - id: release
      type: release
      label: Rilascio qualità
      detail: 'La Qualità verifica l''NCR chiuso, la registrazione di rilavorazione e l''esito della verifica ripetuta e autorizza il rilascio. Nessuna tavola rilavorata viene imballata o spedita senza rilascio qualità autorizzato.'
    - id: escalate
      type: escalate
      label: Escalation — sostituire / rottamare / concessione
      detail: 'Nessuna rilavorazione ripetuta senza rilascio documentato. La tavola viene sostituita, respinta, rottamata o al cliente viene offerta una concessione scritta se la specifica originale non può essere ripristinata.'

defect_matrix:
  tagline: Classificazione dei difetti
  title: Classificazione dei difetti di tenuta all''aria & matrice di rilascio
  subtitle: Non ogni perdita viene rilavorata — ogni difetto viene classificato e la sua disposizione viene rilasciata al livello giusto, dall''ispettore QC al capo stabilimento.
  headers:
    category: Categoria di difetto
    area: Area tipica
    eligibility: Idoneità alla rilavorazione
    approval: Rilascio richiesto
  rows:
    - category: 'Classe A — Interfaccia valvola'
      area: 'Nucleo valvola, guarnizione del cappuccio, tenuta, interfaccia pompa'
      eligibility: 'Rilavorazione standard autorizzata'
      approval: 'Ispettore QC'
    - category: 'Classe B — Cucitura base valvola'
      area: 'Micro-perdita lungo il bordo della valvola'
      eligibility: 'Rilavorazione valutata secondo la scheda metodo rilasciata'
      approval: 'QC + Ingegneria'
    - category: 'Classe C — Foro di spillo superficiale'
      area: 'Micro foro di spillo locale su una superficie non sollecitata'
      eligibility: 'Autorizzata solo se conforme alle specifiche del cliente'
      approval: 'QC + Ingegneria'
    - category: 'Classe D — Cucitura locale del rail'
      area: 'Perdita locale di sovrapposizione sul rail band'
      eligibility: 'Rischio elevato; disposizione ingegneristica rigorosa richiesta'
      approval: 'Ingegneria + Capo QA'
    - category: 'Classe E — Danno esteso al rail'
      area: 'Guasto continuo della cucitura in zone altamente sollecitate'
      eligibility: 'Rilavorazione standard non autorizzata — sostituzione o verifica della causa radice'
      approval: 'Capo QA + concessione cliente'
    - category: 'Classe F — Perdita ricorrente'
      area: 'Perdita non localizzabile o errore nel nuovo test'
      eligibility: 'Nessuna rilavorazione ripetuta; sostituzione, rottamazione o analisi ingegneristica della causa radice'
      approval: 'QA / Ingegneria senior'
    - category: 'Classe G — Danno strutturale'
      area: 'Danno al materiale, delaminazione, deformazione della tavola'
      eligibility: 'Rilascio di rilavorazione non autorizzato — sostituzione, rottamazione o concessione scritta del cliente'
      approval: 'Quality Manager + rilascio cliente'

rework_flow:
  tagline: Ciclo chiuso in 7 fasi
  title: Workflow di rilavorazione controllata — dal rilevamento al rilascio o alla rottamazione
  subtitle: 'Ogni rilavorazione di tenuta all''aria segue lo stesso ciclo controllato: rilevare, mettere in quarantena, diagnosticare, autorizzare, rilavorare, verificare di nuovo, rilasciare.'
  steps:
    - step: '01'
      title: Rilevamento, stop di linea & quarantena
      desc: 'La lavorazione della tavola interessata si ferma immediatamente. ID tavola, codice prodotto, lotto, postazione di lavoro, data e ispettore vengono registrati, viene apposta un''etichetta HOLD / quarantena e viene aperto un NCR contro la revisione di specifica applicabile.'
    - step: '02'
      title: Diagnosi sistematica della perdita
      desc: 'La tavola viene gonfiata alla pressione diagnostica rilasciata per il progetto e la fonte della perdita viene localizzata con un metodo rilasciato — mantenimento della pressione, test a bolle calibrato, dispositivo acustico o di rilevamento perdite. Il punto sospetto viene marcato senza danneggiare la tavola.'
    - step: '03'
      title: Disposizione di ingegneria & autorizzazione
      desc: 'Il QC conferma la categoria del difetto e l''ingegneria verifica se la tavola può essere riportata alla sua specifica originale. Un''autorizzazione di rilavorazione che fa riferimento all''NCR documenta metodo rilasciato, materiali, condizioni e ambito della verifica ripetuta — oppure assegna sostituzione, respinta, rottamazione o concessione al cliente.'
    - step: '04'
      title: Esecuzione controllata della rilavorazione
      desc: 'La rilavorazione viene eseguita esclusivamente entro il limite di difetto rilasciato con la scheda metodo, il lotto di materiale e gli attrezzi rilasciati. Dimensioni della tavola, costruzione, grafiche, configurazione accessori e requisiti di imballaggio non vengono mai modificati.'
    - step: '05'
      title: Polimerizzazione, stabilizzazione & pre-verifica
      desc: 'La tavola rilavorata resta in stato HOLD durante la fase di polimerizzazione e stabilizzazione definita dall''istruzione di materiale e processo rilasciata e riceve una pre-verifica visiva e di lavorazione prima della verifica ripetuta.'
    - step: '06'
      title: Verifica ripetuta & test di prova
      desc: 'La tavola viene gonfiata alla pressione di verifica ripetuta rilasciata per il progetto e il difetto originale insieme a tutte le caratteristiche potenzialmente interessate vengono nuovamente verificati: punto di perdita e zona circostante, valvola, rail, cuciture, aree altamente sollecitate, accessori e aspetto. La rilavorazione non abbassa mai lo standard di accettazione.'
    - step: '07'
      title: Rilascio QA o disposizione finale
      desc: 'La Qualità verifica l''NCR chiuso, la registrazione di rilavorazione e l''esito della verifica ripetuta e quindi autorizza il rilascio — oppure scala a sostituzione, respinta, rottamazione o concessione al cliente. Nessuna tavola rilavorata viene imballata o spedita senza rilascio qualità autorizzato.'

quality_safeguards:
  tagline: Garanzie di qualità
  title: Regole anti-errore che proteggono il vostro marchio
  subtitle: Controlli rigidi che prevengono cicli di riparazione non controllati — una rilavorazione documentata per difetto, soglie di allarme sui lotti, strumenti di misura calibrati e condizioni di test controllate.
  features:
    - icon: 1
      icon_bg: blue
      title: Una rilavorazione per difetto
      desc: 'Un singolo punto può essere rilavorato una volta sotto un''istruzione autorizzata. Se la verifica ripetuta continua a fallire, la tavola viene scalata a sostituzione, respinta, rottamazione o concessione al cliente — la rilavorazione ripetuta senza rilascio documentato non è consentita.'
    - icon: 2
      icon_bg: green
      title: Allarme sul lotto & stop di linea
      desc: 'Se la non conformità di un lotto di produzione supera la soglia fissata dall''ingegneria, la linea viene fermata e l''ingegneria indaga la causa — lotto materiale, condizioni di processo e registrazioni — prima di riprendere la produzione.'
    - icon: 3
      icon_bg: purple
      title: Strumenti di misura calibrati
      desc: 'Gli strumenti di misura pressione, i manometri digitali e i cronometri per le prove di tenuta all''aria vengono verificati e calibrati da laboratori terzi entro il loro periodo di validità; lo stato di calibrazione è visibile nell''area di ispezione.'
    - icon: 4
      icon_bg: orange
      title: Condizioni di test controllate
      desc: 'Le aree di test di tenuta all''aria e di polimerizzazione vengono mantenute in un ambiente controllato, così i risultati non vengono influenzati dalle fluttuazioni di temperatura tra giorno e notte.'

rework_boundaries:
  tagline: Ambito & limiti
  title: Cosa non copre questo sistema
  body: |
    Il sistema di controllo della rilavorazione si applica ai SUP gonfiabili finiti o in lavorazione in cui vengono rilevate perdite d''aria, errori di mantenimento pressione o errori correlati del sistema aria prima del rilascio in spedizione. Non autorizza modifiche a costruzione rilasciata, materiali, grafiche, configurazione di prodotto o requisiti del cliente e non copre:

    - Prodotti già spediti o presenti nei sistemi dei clienti.
    - Danni strutturali o deformazioni della tavola non valutati dall''ingegneria.
    - Difetti estesi di rail o cuciture, danni al materiale del nucleo o difetti che possono compromettere la sicurezza.
    - Progetti in cui la rilavorazione non è consentita: campioni approvati dal cliente, unità di certificazione o test.
    - Progetti con processi proprietari del cliente, materiali speciali o requisiti di riparazione particolari.
    - Perdite ricorrenti che non possono essere localizzate, o tavole che falliscono di nuovo dopo la rilavorazione.

    Ogni deviazione dalle specifiche del cliente richiede una verifica ingegneristica documentata e, ove applicabile, il rilascio scritto del cliente. Le tavole che non possono essere riportate alla loro specifica originale vengono rilasciate solo sotto una concessione espressa del cliente — mai dalla sola produzione.

method_cards:
  tagline: Sistema di schede metodo
  title: Indice delle schede metodo di rilavorazione controllate
  subtitle: 'L''istruzione generale controlla il processo; le schede metodo controllano l''esecuzione. L''istruzione di rilavorazione (WI-QC-AT-001) fa riferimento alle schede metodo MC-RW-01 fino a MC-RW-06 oltre a MC-RW-00 per la rottamazione e la respinta vincolanti.'
  headers:
    code: Scheda metodo
    defect: Classe di difetto
    scope: Ambito di applicazione
    controls: Controlli di ingegneria principali
    approval: Autorità di firma
  rows:
    - code: MC-RW-01
      defect: Classe A (interfaccia valvola)
      scope: 'Manutenzione del nucleo valvola, pulizia della tenuta e riassemblaggio'
      controls: 'Chiave dinamometrica calibrata, sede guarnizione pulita, nessun danno alla filettatura della valvola'
      approval: 'Ispettore QC'
    - code: MC-RW-02
      defect: Classe B (circonferenza valvola)
      scope: 'Sigillatura della flangia di base valvola e serraggio controllato'
      controls: 'Preparazione superficiale controllata, materiale adesivo rilasciato, dispositivo di pressione circolare'
      approval: 'QC + Ingegneria'
    - code: MC-RW-03
      defect: Classe C (micro-perdita superficiale)
      scope: 'Sigillatura di fori di spillo non strutturali'
      controls: 'Adesivo bicomponente rilasciato, nessun trabocco su grafiche o EVA'
      approval: 'QC + Ingegneria'
    - code: MC-RW-04
      defect: Classe D (cucitura locale del rail)
      scope: 'Ri-incollaggio di cuciture locali di sovrapposizione del rail'
      controls: 'Attivazione a caldo a temperatura controllata, rullo di pressatura, dispositivo anti-arricciamento'
      approval: 'Ingegneria + Capo QA'
    - code: MC-RW-05
      defect: Classe B/C (bordo accessori)
      scope: 'Riparazione della fin box e sigillatura della base di montaggio accessori'
      controls: 'Primer di adesione superficiale, blocco di serraggio sagomato, tempo di mantenimento definito'
      approval: 'QC + Ingegneria'
    - code: MC-RW-06
      defect: Classe D (cucitura prua/poppa)
      scope: 'Intervento sulle cuciture curve altamente sollecitate'
      controls: 'Materiale adesivo ad alta resistenza al taglio rilasciato, tempo di polimerizzazione prolungato prima del nuovo test'
      approval: 'Ingegnere capo'
    - code: MC-RW-00
      defect: Classe E/F/G (critico / rottura)
      scope: 'Rottamazione e distruzione fisica vincolanti'
      controls: 'Taglio fisico per prevenire la miscelazione, protocollo di rottamazione, verifica interfunzionale della causa radice'
      approval: 'Capo stabilimento'

inspector_friendly:
  tagline: Ispezione di terze parti
  title: Protocollo a misura di ispettore
  body: |
    Forniamo un''area di ispezione dedicata con strumenti di misura pressione calibrati, tavoli luminosi standardizzati per la verifica di cuciture e grafiche e brief di ispezione precompilati, così le organizzazioni terze (SGS, BV, Intertek, QIMA) possono eseguire la loro ispezione pre-spedizione in modo efficiente — questo vi fa risparmiare overhead di ispezione.

    Ogni brief riassume le revisioni documentali applicabili, il riferimento del campione rilasciato, i controlli di rilevanza critica per la qualità, il livello di campionamento concordato, i test funzionali e i requisiti di imballaggio e codice a barre per la PO. Quantità specificate, qualità, imballaggio e aspetti di sicurezza fondamentali vengono verificati contro i riferimenti di progetto rilasciati — nessuna ricerca frenetica di documenti sul posto.

