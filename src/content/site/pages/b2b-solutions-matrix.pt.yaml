content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p>Cada percurso desta matriz parte das mesmas duas coisas: o nosso <a href="/oem-manufacturing">programa de produção OEM/ODM</a> e a <a href="/factory">fábrica que está por trás</a> — uma instalação de 12,500 m&sup2;, um único conjunto de padrões de qualidade, todos os canais servidos.</p>
  </div>