hero:
  tagline: Fabrication OEM
  title: 'Fabrication OEM de SUP personnalisée — votre spéc., notre usine'
  subtitle: 'Vous apportez le design, le dessin ou la plateforme éprouvée — nous la fabriquons à l''échelle du conteneur. Revue d''ingénierie sous un jour ouvré, échantillons en 7–12 jours, production en 25–35 jours après bon de commande confirmé et acompte, expédié sous votre marque.'

answer:
  label: 'Réponse directe'
  text: 'La production OEM s''exécute à partir de votre spécification. Le MOQ est confirmé par la configuration du projet plutôt que par un chiffre fixe : la production en volume standard s''exécute à 90–100 unités par lot à partir d''un rouleau de tissu drop-stitch de 150 m, les séries pilotes démarrent à 20–50 unités sur les plateformes existantes, et chaque projet passe par un échantillon (1–2 unités) avant le volume. Les échantillons partent en 7–12 jours ; la production s''exécute en 25–35 jours après bon de commande confirmé et acompte, plus 15–20 jours quand un nouvel outillage est requis.'
  verified: '2026-08'

