meta:
  title: 'Fabriksaudit-checklista — vad du ska kontrollera innan du väljer en SUP-tillverkare | iSupfactory'
  description: 'Fabriksaudit-checklista för köpare av uppblåsbara SUP-brädor: kvalitetssystem, kapacitet, materialspårbarhet, tryckprov, social överensstämmelse och dokumentation.'
  dateModified: '2026-08-21'
  keywords:
    - 'sup fabrik audit checklista'
    - 'audit tillverkare uppblåsbara paddle boards'
    - 'sup fabrik verifiering'
    - 'oem fabrik inspektion'
    - 'sup kvalitetsaudit'
    - 'sup leverantör due diligence'
