content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Lue lisää:</strong> vuokrauslaudat lähtevät omista määrityksistäsi — tutustu <a href="/fi/oem-manufacturing">OEM/ODM-ohjelmaamme</a> räätälöinnin, matalien kokeilumulujen ja laivastohintojen osalta. Jokainen lauta kulkee 12,500 m&sup2; <a href="/fi/factory">tuotantolinjan</a> läpi ja paineistetaan ja testataan 100 % ennen lähetystä.</p>
  </div>

