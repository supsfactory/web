fleet_guide:
  title: Laivaston mitoitusopas
  subtitle: 'Arvioi, kuinka monta lautta toimintasi tarvitsee päivittäisen vuokrauskierron perusteella.'
  tiers:
    - label: Pieni kioski
      boards: '15-20'
