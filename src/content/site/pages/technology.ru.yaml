meta:
  title: 'Технологии — Drop Stitch и морской PVC | {SITE}'
  description: 'Технологии Vatrad: конструкция drop stitch, морской PVC, двухслойные сборки и высокое давление. Инновации от профессионального производителя надувных SUP-досок.'
  dateModified: '2026-08'
  keywords:
    - 'технологии sup'
    - 'конструкция drop stitch'
    - 'sup высокого давления'
    - 'материалы надувных sup'
hero:
  tagline: Технологии
  title: Создано для высоких характеристик
  subtitle: Каждый надувной SUP Vatrad сконструирован по технологии drop stitch из морского PVC —точные материалы и производственные методы, проверенные в сложных морских условиях.

sections:
  - title: Ядро Drop-Stitch
    description: Тысячи внутренних полиэфирных нитей соединяют верхний и нижний слои, создавая жесткую конструкцию при 12-15 PSI. Это та же технология, которая используется в профессиональных гребных SUP-досках и надувных гоночных SUP.
    imageAlt: Схема ядра DS
  - title: Морской PVC
    description: Многослойный ламинированный PVC-материал, рассчитанный на морскую среду. Каждый слой соединяется термосваркой, а не клеем, что исключает риск расслоения. Проверено на стойкость к УФ-излучению, коррозию в соленой воде и истирание.
    imageAlt: Слой PVC
  - title: PVC военного класса
    description: 'Используется во всех моделях SUP: премиальный PVC обеспечивает повышенную стойкость к УФ-излучению и химическим воздействиям. Сохраняет гибкость при экстремальных температурах и не поддается разрушению.'
    imageAlt: PVC
  - title: Надувный настил
    description: Надувная высоконапорная конструкция drop stitch, обеспечивающая исключительную жесткость для стояния, рыбалки и йоги. Сокращает время подготовки, общий вес и объем хранения.
    imageAlt: Надувный настил

