    - 'Embalaje y presentación retail — cajas retail, displays y embalaje de exportación bajo tu marca'

faq_section:
  tagline: FAQ
  title: Preguntas sobre desarrollo ODM
  questions:
    - q: '¿En qué se diferencia ODM de OEM?'
      a: 'ODM (fabricación con diseño original) parte de tu brief o simplemente de una idea — nuestros ingenieros diseñan el casco, la estructura, la gráfica y el embalaje, y luego muestrean y producen. OEM (fabricación con equipo original) construye desde tu propio diseño o planos tal cual. Ambas rutas pasan por la misma planta, el mismo sistema de QC y el mismo equipo de exportación; ODM es la vía más rápida hacia una tabla con tu marca cuando todavía no tienes un diseño.'
    - q: 'Solo tengo una idea aproximada — ¿por dónde empezamos?'
      a: 'Envía un brief corto: riders objetivo, casos de uso, tamaño aproximado, mercados y volúmenes. Nuestros ingenieros vuelven con un concepto, una dirección de tablas de referencia y un plan de desarrollo en un día laborable — se firma un NDA antes de cualquier intercambio detallado cuando lo pidas.'
    - q: '¿Cuánto tarda el desarrollo de una tabla SUP nueva?'
      a: 'Las muestras de prototipo salen en 7–12 días. Un casco nuevo con utillaje de molde a medida añade 15–20 días de ingeniería antes de las muestras. La producción corre en 25–35 días tras el pedido y el depósito.'
    - q: '¿Cuál es el MOQ de una tabla ODM?'
      a: 'La producción de volumen estándar corre de 90–100 unidades por lote de rollo de drop-stitch de 150 m; los pilotos parten de 20–50 unidades sobre plataformas existentes. El co-branding de lotes pequeños parte de menos de 20 unidades — consulta nuestra Guía de MOQ y branding flexible para el cálculo completo.'
    - q: '¿Quién es el dueño del diseño y del molde?'
      a: 'Tu brief, tu diseño y el utillaje están protegidos por NDA, términos de licencia de marca y cláusulas de propiedad o compra del molde escritas en el contrato. El utillaje se conserva para tu marca y es transferible.'
    - q: '¿Podéis desarrollar una forma específica (travesía, pesca, carrera, yoga)?'
      a: 'Sí. La ingeniería de cascos cubre todas las categorías principales de SUP — all-around, travesía, carrera, yoga, pesca y tablas multipersona — con validación en tanque hidrodinámico disponible para formas de rendimiento.'
    - q: '¿Qué certificaciones llevará la tabla desarrollada?'
      a: 'Gestión de calidad ISO 9001:2015 (a nivel de fábrica), cumplimiento social BSCI (auditoría de instalación amfori), documentación de conformidad CE para configuraciones aplicables al mercado de la UE (directiva de embarcaciones de recreo — alcance confirmado por proyecto), REACH (materiales), RoHS (accesorios electrónicos) y conformidad ISO 25649 para los modelos de SUP hinchables aplicables. Los documentos de certificación se preparan por pedido para tus mercados de exportación.'

process:
  title: 'El proceso ODM — Del brief a la producción escalada'
  subtitle: 'Seis fases controladas dirigidas por el mismo equipo interno que diseña, muestrea y escala tu tabla — todo queda documentado.'
  steps:
    - phase: '01'
      title: Brief y concepto
      period: 1 día laborable
      items:
        - 'Comparte riders objetivo, casos de uso, tamaños, mercados y volúmenes — o solo una idea.'
        - 'Nuestros ingenieros devuelven una dirección de concepto, opciones de plataforma y un plan de desarrollo.'
    - phase: '02'
      title: Diseño de casco y estructura
      period: Semana 1–2
      items:
        - 'Dimensiones de la tabla, carácter del casco, densidad del drop-stitch y estructura de PVC diseñados en casa.'
        - 'Gráfica, diseño de la cubierta EVA y concepto de embalaje desarrollados alrededor de tu marca.'
    - phase: '03'
      title: Molde y utillaje
      period: +15–20 días (formas nuevas)
      items:
        - 'Utillaje de molde a medida diseñado y cortado para formas nuevas; las plataformas existentes omiten esta fase.'
        - 'Los términos de propiedad del utillaje se fijan en el contrato antes de empezar el corte.'
    - phase: '04'
      title: Prototipo y muestra
      period: 7–12 días
      items:
        - 'Se construye un prototipo físico, se prueba y se envía para tu revisión — pruebas en el agua incluidas.'
        - 'La muestra (1–2 unidades) valida forma, estructura y branding antes del volumen.'
    - phase: '05'
      title: Validación y aprobación
      period: En paralelo
      items:
        - 'Controles de retención de aire, presión, resistencia de costuras, carga y UV por línea de producción.'
        - 'Documentación CE, ISO 9001, BSCI, REACH y RoHS preparada para tus mercados de exportación.'
        - 'Apruebas el prototipo; el pedido y el depósito bloquean el cupo de producción.'
    - phase: '06'
      title: Producción y entrega
      period: 25–35 días
      items:
        - 'Los lotes de volumen estándar corren de 90–100+ unidades por rollo de 150 m; los pilotos desde 20–50 unidades.'
        - 'Embalaje de exportación, envío FOB/CIF/DDP a más de 50 países y soporte de reordenes incluidos.'

