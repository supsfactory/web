hero:
  tagline: Fabricación ODM
  title: 'Fabricante SUP ODM — Diseño & Desarrollo de Producto'
  subtitle: 'No necesitas un diseño SUP terminado. Empieza con un concepto de producto, un requisito de mercado o un objetivo de rendimiento — nuestros ingenieros diseñan el casco, la estructura, la gráfica y el embalaje alrededor de tu brief, prototipan en 7–12 días y producen en 25–35 días tras confirmar el pedido.'

answer:
  label: 'Respuesta directa'
  text: 'SUPsfactory es un fabricante ODM de SUP en Qingdao, China. El desarrollo ODM parte de tu brief, no de tus planos: el diseño del casco (largo, ancho, rocker, volumen), la estructura del material y la gráfica se ingenian en casa, se validan con muestras de prototipo en 7–12 días y se producen con un MOQ de volumen estándar de 90–100 unidades por lote de rollo de 150 m (pilotos desde 20–50 unidades). La producción corre en 25–35 días tras confirmar el pedido y el depósito; el utillaje de molde a medida añade 15–20 días. Con cada pedido se envía documentación CE, ISO 9001, BSCI, REACH y RoHS.'
  verified: 'September 2026'

