checklist:
  heading: 'Wat je moet voorbereiden vóór de briefing van je project'
  body: |
    Hoe completer je briefing, hoe sneller en nauwkeuriger de offerte. Zo bereid je je voor:

    - **Plankspecificaties** — doellengte, breedte en dikte, gewichtsbereik van de gebruiker en beoogd gebruik (touring, allround, surf, vissen, yoga enz.). Heb je referentieafmetingen of een model van een concurrent, voeg die dan toe.
    - **Ontwerpbestanden** — vector-artwork (AI, SVG of PDF) voor de plankgraphics, het logo van het EVA-deckpad en de secundaire branding. Is de artwork nog niet klaar, dan volstaan voor de eerste haalbaarheid een moodboard of referentieafbeeldingen.
    - **Hoeveelheid & planning** — je doelhoeveelheid voor de eerste bestelling en het seizoenstijdschema dat je moet halen. Ook een ruw bereik (bijv. "20–50 planken tegen maart") helpt om de haalbaarheid en de beschikbaarheid van slots te bevestigen.
    - **Conformiteitsvereisten** — doelmarkten (EU, Noord-Amerika, Australië enz.) en eventuele certificerings- of testvereisten boven onze standaard (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Budget** — een indicatief budget per plank of een doelwaarde kost op locatie helpt ons het juiste platform en bouwniveau te adviseren. De exacte prijs wordt pas na de technische controle bevestigd — nooit eerder.

    Heb je nog niet alles, stuur dan wat je hebt. Wij begeleiden de rest.

evidence_review:
  tagline: 'Bewijs & verificatie'
  title: 'GECONTROLEERDE SPECIFICATIES'
  body: 'Alle productieclaims op deze pagina zijn geverifieerd door ons Manufacturing Engineering-team in de fabriek in Laixi, Qingdao. Certificaten, QC-inspectieprotocollen, druk- en structuurtests en partijtraceerbaarheidsregisters zijn op aanvraag beschikbaar. Specificaties voor het laatst geverifieerd: september 2026.'

faqs:
  tagline: FAQ
  title: 'OEM-onboarding — veelgestelde vragen'
  items:
    - q: 'Hoe lang duurt het hele onboardingproces?'
      a: 'De samplegoedkeuring duurt doorgaans 2–4 weken (inclusief de sampleproductie in 7–12 dagen en jouw reviewfase). De eerste productiecyclus duurt 6–8 weken vanaf de bevestigde bestelling en de aanbetaling. Een nieuwe rompmatrijs voegt 15–20 dagen matrijzenbouw toe. Elke poort heeft een vooraf afgesproken doorlooptijd.'
    - q: 'Moet ik een NDA ondertekenen voordat ik mijn ontwerp deel?'
      a: 'Een NDA is direct op aanvraag beschikbaar — vóór het delen van eigendoms-technische specificaties of artwork. We produceren uitsluitend onder de merken van onze klanten en concurreren met hen in geen enkele markt. Hetzelfde beleid geldt voor een enkel sample als voor een containerprogramma.'
    - q: 'Wat is de minimum bestelhoeveelheid voor een eerste OEM-cyclus?'
      a: 'De instap is getrapt: eerst 1–2 samples (beschikbaar in 7–12 dagen), daarna een proef- of pilotorder van 20–50 planken (productie in 25–35 dagen), vervolgens standaardhoeveelheden van 90–100+ planken per goedgekeurde configuratie. Co-branding in kleine partijen start vanaf 5–10 stuks als er geen ontwikkelfase nodig is. De samplekosten worden verrekend met de productiebestelling.'
    - q: 'Hoe wordt de IP-bescherming tijdens de onboarding geregeld?'
      a: 'Je ontwerpen en specificaties worden beschermd door de NDA die vóór de uitwisseling van eigendomsinformatie is ondertekend. Alle artwork, BOM-gegevens en technische bestanden worden bewaard in systemen met toegangscontrole en audittrail. In de OEM-modus bezit je alle IP. In de ODM-modus is het IP van het aangepaste platform gedeeld zoals overeengekomen. In de Private Label-modus is het IP van SUPsfactory en verkrijg je een licentie voor de merkbepaling.'
    - q: 'Welke kwaliteitsgaranties gelden voor een eerste bestelling?'
      a: 'Elke plank — sample, proef- of volumehoeveelheid — doorloopt hetzelfde systeem van 7 inspectiepoorten: binnenkomende controle, controle van het drop-stitch weefsel, lassen & assemblage, druk- en dichtheidstest van 24 uur (18,0 PSI standhouden, automatische afkeur boven 0,50 PSI), montage van EVA-deckpad & accessoires, grafische & branding-QC, eindverpakking & documentatie. De kwaliteit wordt nooit verlaagd voor kleinere bestellingen.'
    - q: 'Wat is de eerste praktische stap?'
      a: 'Vul /nl/contact#project-brief in met de planspecificaties, de doelhoeveelheid en de planning. We reageren binnen één werkdag met de haalbaarheidscheck en een post-voor-post offerte. Al het andere in het proces is poort-voor-poort gedocumenteerd, van de NDA tot de levering.'

