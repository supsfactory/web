answer:
  label: 'Kort antwoord'
  text: 'Een typische OEM-onboarding duurt 2–4 weken voor de samplegoedkeuring en 6–8 weken voor de eerste productiecyclus vanaf de orderbevestiging. Je begint met een projectbriefing (plankspecificaties, hoeveelheid, conformiteitsvereisten). We reageren binnen één werkdag, bieden een NDA aan vóór de uitwisseling van eigendomsgegevens en produceren 1–2 fysieke samples in 7–12 dagen voor jouw beoordeling en goedkeuring. Zodra het sample bevroren is, volgen de productieplanning en de productie met vaste QC-poorten in elke fase. Elke stap is gedocumenteerd en traceerbaar.'
  verified: 'September 2026'

process_steps:
  tagline: De zeven poorten
  title: 'Onboardingtraject — zeven poorten van briefing tot levering'
  subtitle: 'Elke poort heeft een gedefinieerde input, een gedefinieerde output en een vooraf afgesproken doorlooptijd. Je passeert geen enkele poort zonder expliciete goedkeuring.'
  steps:
    - step: 'Poort 1'
      title: 'Eerste aanvraag & NDA (dag 0)'
      desc: 'Stuur via /contact een projectbriefing met je doelplankspecificaties, de bestelhoeveelheid, de conformiteitsvereisten en het schema. Een NDA is onmiddellijk beschikbaar — vóór het delen van eigendoms-technische specificaties of artwork. Reactie binnen één werkdag.'
    - step: 'Poort 2'
      title: 'Haalbaarheidscheck & offerte (dag 1–5)'
      desc: 'De engineering controleert jouw briefing op productiecapaciteit, materiaalbeschikbaarheid en conformiteitsbereik. Je ontvangt een post-voor-post offerte met MOQ-berekening, samplekosten (verrekend met de productie) en een specificatie van doorlooptijden — geen ruwe intervallen, maar een poort-voor-poort planning.'
    - step: 'Poort 3'
      title: 'Sampleproductie (dag 6–17)'
      desc: '1–2 fysieke planken volgens jouw specificatie: rompstijfheid, hechting van het antislip EVA-deckpad, grafische getrouwheid, pasvorm van de accessoires. Jij test en beoordeelt de plank voordat je je op iets definitiefs vastlegt. De samplekosten worden bij ondertekening van het contract verrekend met de productiebestelling.'
    - step: 'Poort 4'
      title: 'Samplereview & goedkeuring (dag 18–21)'
      desc: 'Je beoordeelt het sample tegen jouw specificatie — vaargevoel, grafische getrouwheid, verpakking, accessoires. Wijzigingen worden verwerkt in een herziene BOM en een artworkgoedkeuring. De bevroren specificatie wordt het productiereferentie voor alle volgende cycli.'
    - step: 'Poort 5'
      title: 'Pre-productieplanning (dag 22–28)'
      desc: 'Materiaalinkoop, instellen van de matrijzen, bevestiging van de verpakking en reservering van het productieslot. Alle materialen worden bij binnenkomst gecontroleerd tegen de bevroren BOM. Vóór de start van de productie wordt een productieplan met de data van de QC-poorten uitgebracht.'
    - step: 'Poort 6'
      title: 'Productie & QC-poorten (dag 29–55)'
      desc: 'De productie doorloopt het systeem van 7 inspectiepoorten: binnenkomende controle, controle van het drop-stitch weefsel, lassen & assemblage, druk- en dichtheidstest (24 uur standhouden op 18,0 PSI, automatische afkeur boven 0,50 PSI), montage van EVA-deckpad & accessoires, grafische & branding-QC, eindverpakking & documentatie. Elke poort heeft geslaagd/niet-geslaagd-criteria en traceerbaarheidsprotocollen.'
    - step: 'Poort 7'
      title: 'Verzending & evaluatie na levering (dag 56–63)'
      desc: 'Exportklare verpakking, conformiteitsdocumentatie (CE, ISO 9001, BSCI, REACH, RoHS) en coördinatie van de zeevracht naar meer dan 50 landen. Een evaluatie na levering vangt de leerpunten en verbeteringen op voor de volgende ordercyclus.'

