hero:
  tagline: 'Výroba, kterou lze ověřit'
  title: 'Důvěra a záruky závodu OEM'
  subtitle: 'Každé tvrzení na tomto webu lze ověřit: oficiální registrace společnosti, fyzická výrobní plocha 12 500 m², kterou můžete navštívit nebo nechat zauditovat, skuteční inženýři pod NDA, dokumenty QMS ke stažení a naměřená data u každého sériového čísla. Vyvinuto a provozováno Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Přímá odpověď'
  text: 'Důvěra není slib — je to dokumentace. Jsme registrovaný čínský výrobní subjekt (Qingdao Vatrad Group Co., Ltd.) s fyzickým závodem o ploše 12 500 m² v Qingdao, 350+ pracovníky a roční kapacitou 120 000+ desek. Můžete ověřit registraci, nechat zauditovat závod, projít interní postupy QMS, stáhnout vzorkové záznamy o kvalitě, objednat inspekci třetí stranou (SGS, TÜV, BV nebo Intertek) a podepsat NDA do 4 pracovních hodin. Každá deska se zkouší tlakem 18,0 PSI po dobu 24 hodin s automatickým odmítnutím při poklesu nad 0,50 PSI a každá dávka si drží 10letou stopovatelnost v ERP. Pokud tvrzení nelze doložit, neříkáme ho.'
  verified: 'září 2026'

