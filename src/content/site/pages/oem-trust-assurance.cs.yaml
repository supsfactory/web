trust_steps:
  tagline: 'Skutečná případová studie'
  title: 'Jak nás před objednávkou ověřila severská půjčovací flotila'
  subtitle: 'Sedm ověřovacích kroků, které komerční provozovatel půjčoven dokončil před objednávkou flotily 90–100+ kusů — stejný kontrolní seznam je otevřen i vám.'
  steps:
    - step: '01'
      title: 'Ověření oficiální entity'
      desc: 'Kupující požádal o čínský živnostenský list a licenci pro zahraniční obchod. Právní entitou stojící za iSupfactory je Qingdao Vatrad Group Co., Ltd., výrobce registrovaný od roku 2012 v Qingdao v provincii Shandong — ověřeno podle národního rejstříku pod NDA.'
    - step: '02'
      title: 'Fyzický závod a audit areálu'
      desc: 'Audit závodu (osobně a prostřednictvím video prohlídky) potvrdil závod o ploše 12 500 m²: čtyři specializované dílny, 350+ pracovníků, čtyři automatizované linky a měsíční výstup přibližně 10 000 desek. Auditní zpráva je uložena v záznamech smlouvy.'
    - step: '03'
      title: 'Lidé: skuteční inženýři, ne prodejní texty'
      desc: 'Kupující mluvil přímo s inženýrským týmem — návrh trupu, materiálová laboratoř a QC. Specifikace projektu a NDA byly vyměněny do 4 pracovních hodin a posouzení inženýringem dorazilo do jednoho pracovního dne.'
    - step: '04'
      title: 'Papíry: QMS, certifikáty a inspekce třetí stranou'
      desc: 'Byly posouzeny dokumentace souladu ISO 9001:2015, ISO 25649 a CE, záznamy BSCI/REACH/RoHS a interní postupy QMS. Kupující naplánoval kontrolní prohlídku SGS před odesláním podle ISO 2859-1 Level II u první sériové objednávky — a obdržel Certifikát shody pro každou dávku.'
    - step: '05'
      title: 'Data: záznamy ze zkoušek podle sériového čísla'
      desc: 'Kupující zauditoval skutečné záznamy ze zkoušek: každá komora zkoušena při 18,0 PSI po 24 hodiny s automatickým odmítnutím při poklesu tlaku nad 0,50 PSI, kontrolní listy montáže o 100 bodech a 10letá stopovatelnost dávek v ERP. Vzorkové záznamy QC byly předloženy před objednávkou.'
    - step: '06'
      title: 'Ochrana smluvními podmínkami'
      desc: 'Smlouva o objednávce upravovala licenci značky, dohodnutou dobu výlučnosti na území, vlastnictví formy a podmínky výkupu a definovala data a záznamy, které se převádějí spolu s nástrojem. Kupující formu odsouhlasil v závodě před výrobou.'
    - step: '07'
      title: 'Průběžná správa'
      desc: 'Čtvrtletní obchodní porady s VP Sales a hlavním inženýrem, rezervované právo auditu během výroby a eskalační cesta k řediteli QA při jakémkoli sporu o kvalitu. Dohodu společně podepsali VP Sales, hlavní inženýr a ředitel QA.'

trust_faqs:
  tagline: 'FAQ'
  title: '12 obav, které mají nakupující před objednávkou'
  items:
    - q: 'Je iSupfactory skutečně závod, nebo obchodní společnost?'
      a: 'iSupfactory je divize pro vývoj a výrobu produktů SUP společnosti Qingdao Vatrad Group Co., Ltd. Závod o ploše 12 500 m² v Qingdao provozujeme sami — design, řezání, svařování, montáž i zkoušení probíhají v jednom zařízení. Žádné předávání přes obchodní společnost: lidé, kteří odpovídají na vaše otázky, jsou ti, kdo vaše desky staví.'
    - q: 'S kým přesně budu během projektu jednat?'
      a: 'S jmenovaným projektovým inženýrem a jmenovaným kontaktem QC, plus vedoucími oddělení, kteří podepisují vaše dokumenty. Můžete si přímo vyžádat rozhovor s hlavním inženýrem, ředitelem QA nebo ředitelem závodu — a to před objednávkou i po ní. Mezi vámi a lidmi, kteří práci vykonávají, nesedí žádná vrstva obchodního ředitele.'
    - q: 'Mohu závod navštívit nebo zauditovat?'
      a: 'Ano. Pořádáme návštěvy závodu v hospodářské rozvojové zóně Laixi v Qingdao a podporujeme vzdálené audity s živým video streamem. Audity lze sjednat nezávisle (váš inspektor nebo třetí strana jako SGS, TÜV, BV či Intertek) a termín auditu lze zapsat do smlouvy.'
    - q: 'Podepíšete NDA, než sdělím svůj návrh?'
      a: 'Ano. Naše standardní NDA podepíšeme do 4 pracovních hodin od vaší žádosti, ještě před sdílením jakékoli proprietární specifikace, grafiky nebo technického souboru. K dispozici jsou dvojjazyčné verze (angličtina/čínština) a dokument podepisuje i ředitel závodu.'
    - q: 'Jak poznám, že jsou vaše tvrzení o kvalitě pravdivá?'
      a: 'Za každým tvrzením na tomto webu stojí dokument: interní postupy QMS a kontrolní normy jsou ke stažení, publikovány jsou anonymizované vzorky záznamů o kvalitě a naměřená data se zaznamenávají podle sériového čísla s 10letou stopovatelností dávek v ERP. Můžete si také naplánovat kontrolní prohlídku třetí stranou podle vlastního výběru.'
    - q: 'Co když dorazí desky s vadami?'
      a: 'Každá deska se zkouší před zabalením a záznamy na úrovni dávky umožňují dohledat příčinu podle sériového čísla. Smlouva stanoví povinnosti ohledně kontroly, výměny a přepracování a uvolnění dávky podepisuje ředitel QA. Přepracované desky se znovu zkoušejí v plném rozsahu — nikdy jen částečně.'
    - q: 'Opravdu zkoušíte 100 % desek před odesláním?'
      a: 'Ano — a dokazují to záznamy. Každá komora se nafukuje na 18,0 PSI a udržuje 24 hodin s průběžným zaznamenáváním ze senzorů; každá komora s poklesem tlaku nad 0,50 PSI za 24 hodin je automaticky odmítnuta a znovu zkontrolována. Zkušební protokoly jsou propojeny s každým sériovým číslem a jsou součástí dokumentace dávky.'
    - q: 'Jaké certifikace skutečně máte?'
      a: 'Řízení kvality ISO 9001:2015, soulad ISO 25649 a CE pro produkty z nafukovacích SUP, dále soulad BSCI, REACH a RoHS pro závod a materiály. Čísla certifikátů a auditní záznamy dodáme na vyžádání nebo při auditu — seznam je zveřejněný, nikoli „k dispozici jen na vyžádání“.'
    - q: 'Bude má značka v bezpečí — návrh, formy i trh?'
      a: 'Ano. Vaše značka, návrhy a nástroje jsou chráněny NDA, podmínkami licencování značky a ujednáním o vlastnictví nebo výkupu forem zapsanými do smlouvy. Nástroj se uchovává pro značku a je převoditelný. Územní a exkluzivní podmínky se dohodnou písemně před zahájením výroby.'
    - q: 'Jaké je vaše skutečné MOQ?'
      a: 'MOQ je specifické pro projekt a vysvětlené v našem průvodci MOQ: vzorky 1–2 kusy, malý velkoobchod ve spolupráci na značce 5–10 kusů, pilotní dávky 20–50 kusů a standardní sériové MOQ 90–100+ kusů na 150m roli (přibližně 180–220 desek). Zákazkové tvary s formou běží na objemové úrovni. Výpočet potvrdíme před nabídkou — žádné vágné hodnoty „nízkého MOQ“.'
    - q: 'Co když bude výroba pozdě?'
      a: 'Dodací lhůta se potvrzuje po posouzení specifikace, grafiky a obalů — nikdy se neslibuje předem. Smlouva pokrývá plánování, oznamování zpoždění a cestu řešení a čtvrtletní obchodní porada sleduje výkonnost dodávky proti dohodnutému kalendáři.'
    - q: 'Kdo podepíše smluvní dokumenty na vaší straně?'
      a: 'Objednávky a dohody podepisují společně VP Sales, hlavní inženýr a ředitel QA — tři osoby odpovědné za obchodní podmínky, technické provedení a uvolnění kvality. Podepsané dokumenty obdržíte spolu se záznamy smlouvy.'

governance:
  tagline: Struktura odpovědnosti
  title: 'Jmenovaní signatáři a rezervovaná práva'
  subtitle: 'Každý závazek je navázán na konkrétní roli — nikoli na prodejní oddělení.'
  body: |
    **Společné podepsání.** Objednávky, plány kvality a řešení sporů podepisují tři role: VP Sales (obchodní podmínky), hlavní inženýr (technické provedení) a ředitel QA (uvolnění kvality). Dvojjazyčné interní postupy jsou řízené verzemi a mají stejnou strukturu podpisů.

    **Rezervovaná práva.** Kupující si ponechává právo auditu výroby, kontrolu záznamů ze zkoušek a blokovat uvolnění dávky do podpisu kontroly. Přepracování probíhá pouze na základě schváleného záznamu o změně a uvolnění validuje nezávislá QC — nikdy operátoři, kteří přepracování provedli.

    **Záznamy, které se převádějí.** Zkušební protokoly dávek, certifikáty shody a inspekční zprávy se dodávají s každou zásilkou a stopovatelnost dávek v ERP se uchovává 10 let. Záznamy k nástroji a výkresy formy se převádějí spolu s nástrojem, pokud to smlouva stanoví.

