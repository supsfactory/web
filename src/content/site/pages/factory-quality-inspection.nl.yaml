    - **Luchtdichtheidsregistratie:** GESLAAGD —bewaard per lot
    - **Inspectiestatus:** GESLAAGD
    - **Verzendstatus:** VRIJGEGEVEN

quarantine_intro:
  tagline: Controle van non-conformiteit
  title: Controle van niet-conforme producten & quarantaine
  body: |
    Producten of componenten die niet aan de gedefinieerde acceptatiecriteria voldoen, worden duidelijk gemarkeerd en geblokkeerd of op een gecontroleerde manier in quarantaine geplaatst. Ze mogen pas naar de volgende productiefase, de verpakking of de verzending na voltooiing van een geautoriseerde beslissing. Herbewerking vindt plaats volgens goedgekeurde instructies en is gekoppeld aan de betreffende non-conformiteitsmelding; herwerkte eenheden worden opnieuw geverifieerd tegen de toepasselijke projectvereisten vóór de kwaliteitsvrijgave.

quarantine_flow:
  tagline: Controleflow in 7 fases
  title: Wat er gebeurt wanneer een non-conformiteit wordt gevonden
  subtitle: Identificeren, blokkeren, corrigeren, verifiëren — dan vrijgeven of afkeuren. Niet-conforme producten gaan nooit terug naar productie of verpakking zonder verificatie.
  steps:
    - step: '01'
      title: Identificeren
      desc: De non-conformiteit wordt geregistreerd tegen het betrokken product, de SKU, het lot of de procesfase.
    - step: '02'
      title: Markeren
      desc: De betrokken eenheden worden duidelijk gemarkeerd met gecontroleerde statusetiketten —HOLD, in quarantaine of afgekeurd.
    - step: '03'
      title: Quarantaine
      desc: De eenheden worden gescheiden in een fysiek gecontroleerd of door het systeem beheerd quarantainegebied, om onbedoeld gebruik of verzending te voorkomen.
    - step: '04'
      title: Scope beoordelen
      desc: De betrokken scope wordt onderzocht per lot, procesfase, materiaallot en documentrevisie.
    - step: '05'
      title: Herbewerken / Vervangen
      desc: Een correctie is alleen toegestaan via een goedgekeurde beslissing en een gecontroleerde werkinstructie.
    - step: '06'
      title: Opnieuw verifiëren
      desc: De gecorrigeerde eenheden worden opnieuw geverifieerd tegen de toepasselijke acceptatiecriteria vóór de vrijgave.
    - step: '07'
      title: Vrijgeven of afkeuren
      desc: Alleen geautoriseerde en conforme producten bereiken de verpakking of de vrijgave voor verzending.

