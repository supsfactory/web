answer:
  label: 'Helder antwoord'
  text: 'QINGDAO VATRAD GROUP.,LTD. controleert de kwaliteit van opblaasbare SUP''s via een verificatiesysteem in 4 fases: ingangsinspectie van goederen (IQC), kwaliteitscontrole tijdens het proces (IPQC), eindcontrole van de plank en oppomptest (FQC) en pre-release van verpakking en verzending (OQC). Elke order wordt geverifieerd tegen het goedgekeurde monster, de technische specificatie, de artwork-proef, de BOM en de verpakkingsnormen — inclusief de luchtdichtheidscontrole, visuele en maatcontroles, bevestiging van accessoires en lot-traceerbaarheid. Eenheden die niet aan de acceptatiecriteria voldoen, worden geblokkeerd of op een gecontroleerde manier in quarantaine geplaatst, uitsluitend volgens goedgekeurde instructies herbewerkt en opnieuw geverifieerd vóór de geautoriseerde vrijgave.'
  verified: 'September 2026'

intro: 'Ons kwaliteitssysteem is gebouwd voor OEM/ODM-projecten: de inspectiecriteria worden per order gedefinieerd, gedocumenteerd en gevolgd door het productie- en kwaliteitsteam, van de ingang van goederen tot het verpakken. Zo blijft de kwaliteitsverwachting afgestemd tussen fabriek en jouw merk, van het eerste monster tot de volledige containerleveringen.'

scope_note:
  tagline: Omvang
  title: Per project gespecificeerde inspectiecriteria
  body: |
    Kwaliteitsspecificaties kunnen variëren afhankelijk van de plankconstructie (bijv. één/twee lagen, drop-stitch weefsel, verlijmde rail), het beoogde gebruik, de regelgeving van de doelmarkt en de door de klant goedgekeurde parameters. De uiteindelijke vrijgave is strikt gebaseerd op de voor de order overeengekomen gedocumenteerde inspectiecriteria.

stages:
  tagline: Kwaliteitskader
  title: Ons kwaliteitsverificatiesysteem in 4 fases
  subtitle: Een complete QC-cyclus van de ingang van grondstoffen tot de vrijgave voor verzending.
  steps:
    - title: '1. Ingangsinspectie goederen (IQC)'
      desc: 'De kernmaterialen en ingekochte componenten worden vóór toelating tot de productielijn geverifieerd tegen de goedgekeurde specificaties en referentiemonsters. Drop-stitch-materiaal en PVC worden gecontroleerd op materiaalidentificatie, leverancierslot, gewicht/dichtheid, dikte, kleurovereenkomst met de goedgekeurde monsters en oppervlaktedefecten. EVA-tractionpads worden gecontroleerd op patroon, kleur, dikte, snijnauwkeurigheid en lijmcompatibiliteit. Ventielen en fittingen doorlopen functionele, draad-, pakkingintegriteits- en koppelingstests. Accessoires en verpakking (pompen, peddels, vinnen, leash, tassen, dozen) worden vergeleken op aantal, kleur, branding, streepjescodenauwkeurigheid en artwork-versie tegen de goedgekeurde BOM.'
    - title: '2. Kwaliteitscontrole tijdens het proces (IPQC)'
      desc: 'De kritieke productiefases worden geïnspecteerd om non-conformiteiten te vinden vóórdat de planken de stroomafwaartse stations bereiken. Snijden en printen worden geverifieerd op paneelafmetingen, artwork-layout, spiegeloriëntatie en randreinheid tegen de goedgekeurde technische tekeningen. De assemblage van de plank en het verlijmen van de rail worden gecontroleerd op rompsymmetrie, continuïteit van de naad-overlapping en afwezigheid van holtes of luchtbellen langs de zwaar belaste zones. De bevestiging van ventielen en accessoires, de graphics en de branding worden geverifieerd op positie, oriëntatie, lijmdekking, logo-belettering en artwork-versie.'
    - title: '3. Eindcontrole van de plank & oppomptest (FQC)'
      desc: 'De afgewerkte planken doorlopen bindende fysieke en structurele tests vóór de vrijgave voor verpakking. De planken worden opgepompt en op de voor het project goedgekeurde testdruk gehouden om structurele stijfheid en drukstabiliteit te verifiëren. De luchtdichtheidscontroles bestrijken de ventielbehuizing, de railnaden, de boeg-/achterstevenkegels en de spanningsvoegen met behulp van gekalibreerde lekdetectiemethoden (drukverliesmonitoring of bellenproef). De esthetische en maatcontrole verifieert afmetingen, rocker-profiel en uitlijning van de EVA-pad (tolerantie ±2 mm) onder standaard daglichtomstandigheden.'
    - title: '4. Verpakking & pre-release verzending (OQC)'
      desc: 'De complete pre-verzendingscontrole verzekert een SKU-configuratie- en verzendmarkeringsmatch met nul afwijkingen. De kit-volledigheidscontrole vergelijkt plank, vin, leash, peddel, pomp, tas, reparatieset en handleiding tegen de order-BOM. De verpakkings- en streepjescodescontroles verifiëren de markeringen op de doos, de SKU-etiketten, de leesbaarheid van de streepjescode, de taal van de handleiding en de structurele integriteit van de doos. Orders worden pas vrijgegeven na de uiteindelijke verpakkingscontrole, ondertekend door geautoriseerd kwaliteitspersoneel.'

inspection_points:
  tagline: Inspectiedekking
  title: Belangrijkste inspectiecontrolepunten
  subtitle: Elk controlepunt wordt uitgevoerd tegen gedocumenteerde, per order overeengekomen acceptatiecriteria.
  features:
    - icon: A
      icon_bg: blue
      title: Luchtdichtheidscontrole
      desc: 'De afgewerkte planken worden opgepompt tot de goedgekeurde testdruk en gecontroleerd op drukbehoud, de staat van de ventielbasis, de railnaden, de boeg- en achterstevenzones en de zwaar belaste punten. Waar de inspectieprocedure dat voorschrijft, worden verdachte lekzones onderzocht met goedgekeurde detectiemethoden.'
    - icon: B
      icon_bg: green
      title: Visuele & maatcontrole
      desc: 'De planken worden onder adequate verlichting gecontroleerd op de staat van het materiaaloppervlak, printfouten, kleurafwijkingen, EVA-uitlijning, vouwen, krassen, onzuiverheden en legwerk-optiek. De belangrijkste afmetingen en de posities van de accessoires worden geverifieerd tegen de goedgekeurde tekeningen of specificaties.'
    - icon: C
      icon_bg: purple
      title: Controle van accessoires & verpakking
      desc: 'Vóór de verzending wordt de volledige productconfiguratie geverifieerd: plankmodel, vinsysteem, peddel, pomp, leash, transporttas, reparatieset, handleiding en op maat gemaakte accessoires — elk vergeleken tegen het goedgekeurde monster, de tekeningen en de BOM.'
    - icon: D
      icon_bg: orange
      title: Verpakking & vrijgave voor verzending
      desc: 'De verpakte eenheden worden gecontroleerd op SKU-configuratie, volledigheid van accessoires, productetiketten, streepjescode-informatie, versie van de handleiding, markering van de doos, verpakkingshoeveelheid en de staat van de doos. De vrijgave voor verzending wordt pas geautoriseerd na voltooiing van alle inspectie- en verpakkingsvereisten.'

traceability_intro:
  tagline: Lot-traceerbaarheid
  title: Project- & lottraceerbaarheidssysteem
  body: |
    Elke op maat gemaakte SUP-order wordt beheerd onder een uniforme projectcode die de technische specificaties, de goedgekeurde BOM, de artwork-revisies, de materiaallotnummers, de verpakkingsreferenties en de inspectieregistraties met elkaar verbindt. De productie- en inspectieregistraties worden bewaard per project en toepasselijk productielot, en elk lot kan worden herleid tot de goedgekeurde productspecificatie, BOM, artwork en verpakkingsreferenties.

    Dit ondersteunt een efficiënte verificatie van de productconfiguratie, de inspectiestatus en de betrokken scope wanneer er een kwaliteitszorg wordt gemeld — van het afgewerkte product tot de oorsprongsregistraties via de identificatie van de plank of de doos.

traceability_chain:
  tagline: Traceerbaarheidsketen
  title: Van projectcode tot vrijgave voor verzending
  subtitle: Een keten van gecontroleerde referenties van de orderbevestiging tot de geautoriseerde verzending.
  steps:
    - step: '01'
      title: Projectcode
      desc: Uniforme projectreferentie die elk gecontroleerd document aan de order koppelt.
    - step: '02'
      title: Documentrevisies
      desc: Huidige revisieniveaus van specificatie, BOM, artwork en verpakking — alleen goedgekeurde versies zijn geldig voor de productie.
    - step: '03'
      title: Lot & materialen
      desc: De materiaal- en componentloten worden geregistreerd tegen het productielot.
    - step: '04'
      title: Inspectieregistraties
      desc: IQC-, proces-, luchtdichtheids-, eind- en verpakkingsinspectieresultaten per lot.
    - step: '05'
      title: Verpakking & vrijgave
      desc: Verpakkingslot, NCR-sluitingsstatus en overzicht van de geautoriseerde vrijgave voor verzending.

traceability_sample:
  tagline: Geanonimiseerd voorbeeld
  title: Traceerbaarheidscontrolegistratie (Demo)
  body: |
    De demonstratiewaarden dienen uitsluitend ter illustratie — de klantnaam, ordernummers, op maat gemaakte artwork, leveranciersgegevens en commerciële informatie zijn verwijderd ter bescherming van de vertrouwelijkheid.

    - **Producent:** QINGDAO VATRAD GROUP, LTD.
