rework_intro:
  tagline: Governance van herbewerking
  title: Gecontroleerde luchtdichtheidsnon-conformiteit & herbewerkingsgovernance
  body: |
    Bij QINGDAO VATRAD GROUP.,LTD. wordt herbewerking strikt gedefinieerd als het herstellen van een niet-conforme eenheid tot volledige conformiteit met de oorspronkelijke technische specificatie — niet als een snelle oplossing. Elke plank met een luchtdichtheidsnon-conformiteit wordt op een gecontroleerde manier geblokkeerd en gekoppeld aan een non-conformiteitsmelding (NCR) vóór enige verdere bewerking; de bron van het lek wordt gelokaliseerd en geregistreerd met de goedgekeurde diagnostische methode.

    Herbewerking mag alleen doorgaan als het defect binnen de goedgekeurde herbewerkingsscope valt en er een geautoriseerde methode beschikbaar is. De herbewerkingsinstructie identificeert het product, het lot, de positie van het defect, het goedgekeurde materiaal, de methode, de vereiste omstandigheden en de scope van de herhaalde verificatie. Na de vereiste uithard- of stabilisatiefase wordt de plank opnieuw geverifieerd tegen dezelfde toepasselijke acceptatiecriteria als een conforme plank — herbewerking verlaagt nooit de acceptatienorm. Als de herhaalde verificatie faalt, is een nieuw engineering- en kwaliteitsbesluit vereist; herhaalde herbewerking is niet toegestaan zonder gedocumenteerde vrijgave.

rework_decision:
  tagline: Interactieve flow
  title: Beslisflow voor herbewerking — klik op elk knooppunt
  subtitle: Volg hoe een luchtdichtheidsnon-conformiteit wordt beheerd van detectie tot vrijgave of vernietiging. Klik op een knooppunt om de controlevereisten in die stap uit te vouwen.
  nodes:
    - id: detect
      type: start
      label: Lek gedetecteerd
      detail: 'Tijdens de inspectie wordt een luchtdichtheidsnon-conformiteit geconstateerd — een drukbehoudfout, een zichtbaar lek of een gerelateerde fout van het luchtsysteem.'
    - id: hold
      type: step
      label: Lijn stoppen · HOLD-etiket · NCR
      detail: 'De bewerking wordt gestopt. Plank-ID, productcode, lot, werkstation, datum en inspecteur worden geregistreerd; er wordt een HOLD-/quarantaine-etiket aangebracht en een NCR geopend tegen de toepasselijke specificatierevisie.'
    - id: locate
      type: step
      label: De bron van het lek lokaliseren
      detail: 'De plank wordt opgepompt tot de voor het project goedgekeurde diagnostische druk en de bron wordt gelokaliseerd met een goedgekeurde methode — drukbehoud, gekalibreerde bellenproef, akoestisch of lekdetectieapparaat.'
    - id: classify
      type: step
      label: Het defect classificeren (A–G)
      detail: 'Het defect wordt geclassificeerd tegen de vrijgavematrix: A ventielinterface, B ventielbasisnaad, C oppervlakkig speldenprikgaatje, D lokale railnaad, E uitgebreide railschade, F terugkerend lek, G structurele schade.'
    - id: authorize
      type: decision
      label: Herbewerking geautoriseerd?
      yes: rework
      no: escalate
      detail: 'QC bevestigt de defectcategorie en engineering controleert of de plank naar de oorspronkelijke specificatie kan worden teruggebracht. De autorisatie documenteert de methodkaart, materialen, omstandigheden en scope van de herhaalde verificatie — of leidt tot vervanging, afkeuring, vernietiging of een concessie aan de klant.'
    - id: rework
      type: step
      label: Gecontroleerde herbewerking
      detail: 'Uitsluitend uitgevoerd binnen de goedgekeurde defectlimiet met de goedgekeurde methodkaart, het materiaallot en de goedgekeurde gereedschappen — zonder ooit afmetingen, constructie, graphics, accessoires of verpakkingsvereisten te wijzigen.'
    - id: cure
      type: step
      label: Uitharden & stabiliseren
      detail: 'De plank blijft op HOLD tijdens de uithard- en stabilisatiefase die is gedefinieerd door de goedgekeurde materiaal- en procesinstructie en ontvangt daarna een visuele en bewerkingspre-controle.'
    - id: reinspect
      type: decision
      label: Herhaalde verificatie geslaagd?
      yes: release
      no: escalate
      detail: 'De plank wordt opgepompt tot de voor het project goedgekeurde herverificatiedruk en het oorspronkelijke defect samen met alle potentieel beïnvloede kenmerken wordt opnieuw geverifieerd — lekpunt, ventiel, rail, naden, zwaar belaste zones, accessoires en uiterlijk. Herbewerking verlaagt nooit de acceptatienorm.'
    - id: release
      type: release
      label: Kwaliteitsvrijgave
      detail: 'Kwaliteit controleert de gesloten NCR, de herbewerkingsregistratie en het resultaat van de herhaalde verificatie en autoriseert de vrijgave. Geen enkele herwerkte plank wordt verpakt of verzonden zonder geautoriseerde kwaliteitsvrijgave.'
    - id: escalate
      type: escalate
      label: Escalatie — vervangen / vernietigen / concessie
      detail: 'Geen herhaalde herbewerking zonder gedocumenteerde vrijgave. De plank wordt vervangen, afgekeurd, vernietigd of aan de klant wordt een schriftelijke concessie aangeboden wanneer de oorspronkelijke specificatie niet kan worden hersteld.'

defect_matrix:
  tagline: Defectclassificatie
  title: Classificatie van luchtdichtheidsdefecten & vrijgavematrix
  subtitle: Niet elk lek wordt herbewerkt — elk defect wordt geclassificeerd en de beslissing wordt op het juiste niveau vrijgegeven, van de QC-inspecteur tot de fabrieksmanager.
  headers:
    category: Defectcategorie
    area: Typisch gebied
    eligibility: Geschiktheid voor herbewerking
    approval: Vereiste vrijgave
  rows:
    - category: 'Klasse A — Ventielinterface'
      area: 'Ventielkern, dopafsluiting, afdichting, pompinterface'
      eligibility: 'Standaard herbewerking geautoriseerd'
      approval: 'QC-inspecteur'
    - category: 'Klasse B — Ventielbasisnaad'
      area: 'Micro-lek langs de rand van het ventiel'
      eligibility: 'Herbewerking beoordeeld volgens de goedgekeurde methodkaart'
      approval: 'QC + Engineering'
    - category: 'Klasse C — Oppervlakkig speldenprikgaatje'
      area: 'Lokaal micro-speldenprikgaatje op een niet-belast oppervlak'
      eligibility: 'Alleen geautoriseerd als het aan de specificaties van de klant voldoet'
      approval: 'QC + Engineering'
    - category: 'Klasse D — Lokale railnaad'
      area: 'Lokaal lek in de overlapping op de railband'
      eligibility: 'Hoog risico; strikt engineeringbesluit vereist'
      approval: 'Engineering + QA-hoofd'
    - category: 'Klasse E — Uitgebreide railschade'
      area: 'Doorlopende naadfout in zwaar belaste zones'
      eligibility: 'Standaard herbewerking niet geautoriseerd — vervanging of oorzaakanalyse'
      approval: 'QA-hoofd + concessie van de klant'
    - category: 'Klasse F — Terugkerend lek'
      area: 'Lek dat niet kan worden gelokaliseerd of fout bij het hertesten'
      eligibility: 'Geen herhaalde herbewerking; vervanging, vernietiging of technische oorzaakanalyse'
      approval: 'Senior QA / Engineering'
    - category: 'Klasse G — Structurele schade'
      area: 'Materiaalschade, delaminatie, vervorming van de plank'
      eligibility: 'Herbewerkingsvrijgave niet geautoriseerd — vervanging, vernietiging of schriftelijke concessie van de klant'
      approval: 'Quality Manager + vrijgave van de klant'

rework_flow:
  tagline: Gesloten cyclus in 7 fases
  title: Gecontroleerde herbewerkingsworkflow — van detectie tot vrijgave of vernietiging
  subtitle: 'Elke luchtdichtheidsherbewerking volgt dezelfde gecontroleerde cyclus: detecteren, in quarantaine plaatsen, diagnosticeren, autoriseren, herbewerken, opnieuw verifiëren, vrijgeven.'
  steps:
    - step: '01'
      title: Detectie, lijnstop & quarantaine
      desc: 'De bewerking van de betrokken plank stopt onmiddellijk. Plank-ID, productcode, lot, werkstation, datum en inspecteur worden geregistreerd, er wordt een HOLD-/quarantaine-etiket aangebracht en een NCR geopend tegen de toepasselijke specificatierevisie.'
    - step: '02'
      title: Systematische lekdiagnose
      desc: 'De plank wordt opgepompt tot de voor het project goedgekeurde diagnostische druk en de bron van het lek wordt gelokaliseerd met een goedgekeurde methode — drukbehoud, gekalibreerde bellenproef, akoestisch of lekdetectieapparaat. Het verdachte punt wordt gemarkeerd zonder de plank te beschadigen.'
    - step: '03'
      title: Engineeringbesluit & autorisatie
      desc: 'QC bevestigt de defectcategorie en engineering controleert of de plank naar de oorspronkelijke specificatie kan worden teruggebracht. Een herbewerkingsautorisatie die naar de NCR verwijst, documenteert de goedgekeurde methode, materialen, omstandigheden en scope van de herhaalde verificatie — of wijst vervanging, afkeuring, vernietiging of concessie aan de klant toe.'
    - step: '04'
      title: Gecontroleerde uitvoering van de herbewerking
      desc: 'De herbewerking wordt uitsluitend uitgevoerd binnen de goedgekeurde defectlimiet met de goedgekeurde methodkaart, het materiaallot en de goedgekeurde gereedschappen. De plankafmetingen, constructie, graphics, accessoireconfiguratie en verpakkingsvereisten worden nooit gewijzigd.'
    - step: '05'
      title: Uitharden, stabiliseren & pre-controle
      desc: 'De herwerkte plank blijft in HOLD-status tijdens de uithard- en stabilisatiefase die is gedefinieerd door de goedgekeurde materiaal- en procesinstructie en ontvangt een visuele en bewerkingspre-controle vóór de herhaalde verificatie.'
    - step: '06'
      title: Herhaalde verificatie & testproef
      desc: 'De plank wordt opgepompt tot de voor het project goedgekeurde herverificatiedruk en het oorspronkelijke defect samen met alle potentieel beïnvloede kenmerken wordt opnieuw geverifieerd: het lekpunt en de omgeving, het ventiel, de rail, de naden, de zwaar belaste zones, de accessoires en het uiterlijk. Herbewerking verlaagt nooit de acceptatienorm.'
    - step: '07'
      title: QA-vrijgave of eindbesluit
      desc: 'Kwaliteit controleert de gesloten NCR, de herbewerkingsregistratie en het resultaat van de herhaalde verificatie en autoriseert daarna de vrijgave — of escaleert naar vervanging, afkeuring, vernietiging of concessie aan de klant. Geen enkele herwerkte plank wordt verpakt of verzonden zonder geautoriseerde kwaliteitsvrijgave.'

quality_safeguards:
  tagline: Kwaliteitsborgingen
  title: Anti-foutregels die jouw merk beschermen
  subtitle: Strikte controles die ongecontroleerde reparatiecycli voorkomen — een gedocumenteerde herbewerking per defect, alarmdrempels op loten, gekalibreerde meetinstrumenten en gecontroleerde testomstandigheden.
  features:
    - icon: 1
      icon_bg: blue
      title: Eén herbewerking per defect
      desc: 'Een enkel punt mag één keer worden herbewerkt onder een geautoriseerde instructie. Blijft de herhaalde verificatie falen, dan wordt de plank geëscaleerd naar vervanging, afkeuring, vernietiging of concessie aan de klant — herhaalde herbewerking zonder gedocumenteerde vrijgave is niet toegestaan.'
    - icon: 2
      icon_bg: green
      title: Lotalarm & lijnstop
      desc: 'Wanneer de non-conformiteit van een productielot de door de engineering vastgestelde drempel overschrijdt, wordt de lijn gestopt en onderzoekt de engineering de oorzaak — materiaallot, procesomstandigheden en registraties — vóórdat de productie wordt hervat.'
    - icon: 3
      icon_bg: purple
      title: Gekalibreerde meetinstrumenten
      desc: 'De drukmeetinstrumenten, digitale manometers en chronometers voor de luchtdichtheidstests worden binnen hun geldigheidsperiode geverifieerd en gekalibreerd door externe laboratoria; de kalibratiestatus is zichtbaar in het inspectiegebied.'
    - icon: 4
      icon_bg: orange
      title: Gecontroleerde testomstandigheden
      desc: 'De luchtdichtheids- en uithardtestgebieden worden in een gecontroleerde omgeving bewaard, zodat de resultaten niet worden beïnvloed door temperatuurschommelingen tussen dag en nacht.'

rework_boundaries:
  tagline: Scope & grenzen
  title: Wat dit systeem niet dekt
  body: |
    Het herbewerkingscontrolesysteem is van toepassing op afgewerkte of in bewerking zijnde opblaasbare SUP''s waar luchtlekken, drukbehoudfouten of gerelateerde fouten van het luchtssysteem worden gedetecteerd vóór de vrijgave voor verzending. Het autoriseert geen wijzigingen aan de goedgekeurde constructie, materialen, graphics, productconfiguratie of klantvereisten en dekt niet:

    - Producten die al zijn verzonden of zich in de systemen van klanten bevinden.
    - Structurele schade of vervorming van de plank die niet door de engineering is beoordeeld.
    - Uitgebreide rail- of naaddefecten, schade aan het kernmateriaal of defecten die de veiligheid in gevaar kunnen brengen.
    - Projecten waarin herbewerking niet is toegestaan: door de klant goedgekeurde samples, certificerings- of testeenheden.
    - Projecten met eigen processen van de klant, speciale materialen of bijzondere reparatievereisten.
    - Terugkerende lekken die niet kunnen worden gelokaliseerd, of planken die na herbewerking opnieuw falen.

    Elke afwijking van de specificaties van de klant vereist een gedocumenteerde technische verificatie en, waar toepasselijk, de schriftelijke vrijgave van de klant. Planken die niet naar hun oorspronkelijke specificatie kunnen worden teruggebracht, worden alleen vrijgegeven onder een uitdrukkelijke concessie van de klant — nooit uitsluitend door de productie.

method_cards:
  tagline: Methodkaartsysteem
  title: Index van gecontroleerde herbewerkingsmethodkaarten
  subtitle: 'De algemene instructie stuurt het proces; de methodkaarten sturen de uitvoering. De herbewerkingsinstructie (WI-QC-AT-001) verwijst naar de methodkaarten MC-RW-01 tot en met MC-RW-06, plus MC-RW-00 voor de bindende vernietiging en afkeuring.'
  headers:
    code: Methodkaart
    defect: Defectklasse
    scope: Toepassingsgebied
    controls: Belangrijkste engineeringcontroles
    approval: Ondertekenningsautoriteit
  rows:
    - code: MC-RW-01
      defect: Klasse A (ventielinterface)
      scope: 'Onderhoud van de ventielkern, reinigen van de afdichting en herassemblage'
      controls: 'Gekalibreerde momentsleutel, schone afdichtingszitting, geen schade aan de ventieldraad'
      approval: 'QC-inspecteur'
    - code: MC-RW-02
      defect: Klasse B (ventielomtrek)
      scope: 'Verzegelen van de ventielbasisfundering en gecontroleerd vastzetten'
      controls: 'Gecontroleerde oppervlaktevoorbereiding, goedgekeurd lijmmateriaal, circulair drukapparaat'
      approval: 'QC + Engineering'
    - code: MC-RW-03
      defect: Klasse C (oppervlakkig micro-lek)
      scope: 'Verzegelen van niet-structurele speldenprikgaatjes'
      controls: 'Goedgekeurde tweecomponentenlijm, geen overloop op graphics of EVA'
      approval: 'QC + Engineering'
    - code: MC-RW-04
      defect: Klasse D (lokale railnaad)
      scope: 'Opnieuw verlijmen van lokale overlappingsnaden van de rail'
      controls: 'Op temperatuur gecontroleerde hitteactivatie, drukrol, anti-krulapparaat'
      approval: 'Engineering + QA-hoofd'
    - code: MC-RW-05
      defect: Klasse B/C (rand accessoires)
      scope: 'Reparatie van de fin box en verzegeling van de montagebasis van accessoires'
      controls: 'Oppervlakteprimer voor hechting, gevormd klemblok, gedefinieerde houdtijd'
      approval: 'QC + Engineering'
    - code: MC-RW-06
      defect: Klasse D (boeg-/achterstevennaad)
      scope: 'Ingreep op zwaar belaste gebogen naden'
      controls: 'Goedgekeurd afschuifsterk lijmmateriaal, verlengde uithardtijd vóór het hertesten'
      approval: 'Hoofdingenieur'
    - code: MC-RW-00
      defect: Klasse E/F/G (kritiek / breuk)
      scope: 'Bindende vernietiging en fysieke vernieling'
      controls: 'Fysieke doorsnijding om vermenging te voorkomen, vernietigingsprotocol, interfunctionele oorzaakanalyse'
      approval: 'Fabrieksmanager'

inspector_friendly:
  tagline: Inspectie door derden
  title: Inspecteurvriendelijk protocol
  body: |
    Wij bieden een speciaal inspectiegebied met gekalibreerde drukmeetinstrumenten, gestandaardiseerde lichttafels voor de verificatie van naden en graphics en vooraf ingevulde inspectiebriefings, zodat externe organisaties (SGS, BV, Intertek, QIMA) hun pre-verzendingsinspectie efficiënt kunnen uitvoeren — dit bespaart jou inspectie-overhead.

    Elke briefing vat de toepasselijke documentrevisies samen, de referentie van het goedgekeurde monster, de kritieke kwaliteitsrelevante controles, het overeengekomen bemonsteringsniveau, de functionele tests en de verpakkings- en streepjescodesvereisten voor de PO. Gespecificeerde hoeveelheden, kwaliteit, verpakking en essentiële veiligheidsaspecten worden geverifieerd tegen de goedgekeurde projectreferenties — geen haastig zoeken naar documenten ter plaatse.

