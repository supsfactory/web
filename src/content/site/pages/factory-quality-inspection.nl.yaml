      title: Luchtdichtheidstestgebied
      desc: 'De opgepompte planken worden in het QC-testgebied bewaard onder industriële verlichting; de digitale drukmeetinstrumenten bewaken de goedgekeurde drukbehoudtest op de ventielbasis, de railnaden, de boeg en achtersteven en de zwaar belaste punten. De registraties worden per lot bewaard en gekoppeld aan de eindcontrole.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
      alt: Kwaliteitscontrolebladen en gecontroleerde HOLD-statusetiketten bij het inspectiestation van de fabriek
