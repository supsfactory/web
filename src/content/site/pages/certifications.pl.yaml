meta:
  title: 'Kontrola jakości desek SUP na zamówienie: inspekcja w 7 etapach | iSupfactory'
  description: 'Jak kontrolowane jest każde zamówienie na nadmuchiwane deski SUP na zamówienie: 7 bramek inspekcji od planowania przedprodukcyjnego do zatwierdzenia wysyłki, z możliwością pobrania dwujęzycznych raportów.'
  dateModified: '2026-08-15'
  keywords:
    - 'kontrola jakości sup'
    - 'inspekcja w fabryce sup'
    - 'plan inspekcji jakościowej oem'
    - 'inspekcja przed wysyłką sup'
    - 'certyfikacja ce sup'
    - 'iso 9001 sup'
hero:
  tagline: Kontrola jakości projektów na zamówienie
  title: 'Kontrola jakości niestandardowych projektów nadmuchiwanych desek SUP'
  subtitle: 'Jakość weryfikujemy względem zatwierdzonej próbki, specyfikacji technicznej, projektu graficznego, specyfikacji materiałowej (BOM) oraz wymagań dotyczących opakowania każdego projektu — a nie względem ogólnych deklaracji. Od materiałów przychodzących do zatwierdzenia wysyłki nasz proces inspekcji jest tak zbudowany, aby weryfikować zgodność produktu na zdefiniowanych etapach produkcji. Za tym wszystkim stoi QINGDAO VATRAD GROUP — fabryka nadmuchiwanych desek SUP o powierzchni 12,500 m², w której działa Vatrad.'
stats:
  - value: 100%
    label: Sztuk poddanych próbom ciśnieniowym
  - value: '7'
    label: Kontrolowanych bramek inspekcji
  - value: 18.0 PSI
    label: 24-godzinne utrzymanie ciśnienia
  - value: ISO 9001
    label: Certyfikowana jakość
quality_basis:
  tagline: Podstawa jakości
  title: 'Co decyduje o odbiorze produktu'
  subtitle: 'Kryteria odbioru końcowego ustala się przed zwolnieniem produkcji. Te kontrolowane dokumenty projektu określają, co ma zostać wyprodukowane, jak weryfikować kluczowe szczegóły i co trzeba sprawdzić przed wysyłką — zatwierdzone wspólnie z kupującym i zamrożone w Planie Inspekcji Jakości (QIP). Każda prośba o zmianę przechodzi udokumentowaną kontrolę zmian, nigdy po cichu przez linię produkcyjną.'
  items:
    - title: 'Zatwierdzona próbka'
      description: 'Fizyczna deska wzorcowa zaakceptowana przez kupującego. Każda gotowa deska jest z nią porównywana pod kątem wymiarów, profilu, sztywności i wykończenia.'
      icon: tabler:medal
    - title: 'Specyfikacja techniczna'
      description: 'Materiały, konstrukcja i rysunki wymiarowe przypięte do numeru rewizji. FAI weryfikuje pierwszy egzemplarz względem dokładnie tej rewizji.'
      icon: tabler:file-check
    - title: 'Zatwierdzony projekt graficzny'
      description: 'Projekt graficzny, kolory nadruku i rozmieszczenie zatwierdzone i zablokowane wersją przed cięciem, aby każda deska trafiała do klienta w wyglądzie zaakceptowanym przez markę.'
      icon: tabler:palette
    - title: 'BOM zatwierdzony przez klienta'
      description: 'Specyfikacja materiałowa (BOM) — deska, wiosło, pompka, smycz, worek, instrukcja — potwierdzona przez kupującego. PSI sprawdza kompletność zestawu 100% względem tej BOM.'
      icon: tabler:list-checks
    - title: 'Wymagania dotyczące opakowania i etykiet'
      description: 'Konstrukcja kartona, oznaczenia, kody kreskowe, treść etykiety i znaki wysyłkowe ustalone na piśmie. Czytelność kodów kreskowych i poprawność oznaczeń są weryfikowane w PSI.'
      icon: tabler:package
tests:
  - title: Próby ciśnieniowe
    description: Komory nadmuchiwane poddaje się ciśnieniom przekraczającym zalecane limity robocze przez dłuższy czas. Weryfikuje to szczelność oraz integralność strukturalną materiału i szwów, dzięki czemu produkt wytrzyma przewidziane użycie oraz możliwe nadmierne napompowanie bez uszkodzeń i przecieków.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Komora nadmuchiwanej deski SUP podczas próby ciśnieniowej weryfikującej szczelność
  - title: Próby udarowe
    description: Produkty poddaje się kontrolowanym uderzeniom o różnych ciężarach i kątach. Ocenia to odporność materiału na przebicie, rozdarcie i uszkodzenia w wyniku zderzeń z przeszkodami w wodzie, pokazując trwałość i żywotność.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Stanowisko do prób udarowych oceniające odporność materiału nadmuchiwanej łodzi na przebicie
  - title: Badania odporności na UV
    description: Próbki materiału poddaje się przyspieszonemu promieniowaniu UV, aby potwierdzić, że nie żółkną, nie pękną i nie stracą wytrzymałości wraz z upływem czasu. Każda partia PCV jest sprawdzana pod kątem degradacji słonecznej przed użyciem w produkcji.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: Próbki materiału PCV pod przyspieszonym promieniowaniem UV podczas badania odporności
  - title: Badania odporności na ścieranie
    description: Próbki materiału ściera się o powierzchnie ścierne przez określoną liczbę cykli pod kontrolowanym naciskiem. Mierzy to zdolność materiału do wytrzymywania zużycia wynikającego z powtarzalnego użycia oraz kontaktu z piaskiem, skałami czy innymi powierzchniami, zapewniając długoterminową trwałość.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Maszyna do badań ścieralnych ścierająca próbkę tkaniny PCV w celu zmierzenia odporności na zużycie
  - title: Badania w niskiej temperaturze
    description: Produkty bada się w chłodnym otoczeniu, aby ocenić ich działanie i trwałość w różnych warunkach temperaturowych i zapobiec sztywnieniu lub pękaniu w zimnej wodzie. Niezbędne dla łodzi przeznaczonych na sezon zimowy lub wysokie szerokości geograficzne.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Produkt nadmuchiwany w komorze chłodniczej podczas badania w niskiej temperaturze
  - title: Próby wyporności i nośności
    description: Produkty bada się z różnymi obciążeniami, aby ustalić ich maksymalną nośność i potwierdzić, że bezpiecznie podpierają użytkownika oraz sprzęt. Udźwig każdego modelu jest weryfikowany przed zatwierdzeniem.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Badanie wyporności i nośności z obciążeniem na nadmuchiwanej jednostce pływającej
  - title: Badania manewrowości
    description: Produkty bada się pod kątem reakcji na ruch wiosła lub napędu, oceniając promień zawracania i łatwość prowadzenia. Próby na wodzie potwierdzają, że rzeczywiste prowadzenie odpowiada specyfikacjom projektowym.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Badanie manewrowości nadmuchiwanych desek SUP i kadłubów łodzi na wodzie
  - title: Badania szczelności wodnej
    description: W pełni złożone produkty zanurzamy lub poddajemy rozpylaniu wody, aby sprawdzić ewentualne przecieki przez szwy, zawory lub materiał. Każda łódź przechodzi obowiązkową kontrolę szczelności przed wysyłką.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Badanie szczelności przez zanurzenie sprawdzające szwy i zawory pod kątem przecieków
qc_flow:
  tagline: Przebieg inspekcji w 7 etapach
  title: 'Siedem kontrolowanych bramek jakości, od początku do końca'
  subtitle: 'Każda z poniższych bramek jest zdefiniowana w Planie Inspekcji Jakości projektu wraz z obiektem inspekcji, metodą, kryteriami akceptacji i dokumentem wynikowym. Dwujęzyczne pakiety raportów to rzeczywiste kontrolowane zapisy — otwórz dowolny, aby zobaczyć faktyczną strukturę.'
  obj_label: Obiekt inspekcji
  method_label: Metoda inspekcji
  criteria_label: Kryteria akceptacji
  record_label: Dokument wynikowy
  stages:
    - stage: ETAP 01
      title: 'Planowanie jakości projektu (PPM)'
      summary: 'Spotkanie przedprodukcyjne ustala zakres, linie odniesienia i plan inspekcji przed uruchomieniem linii.'
      checks:
        - 'Rejestrowane są: nazwa produktu, kod wewnętrzny, SKU klienta, numer zamówienia i definicja partii.'
        - 'Określone są: typ deski, rdzeń drop-stitch, materiały, listwy krawędziowe, EVA, zawory i system płetw.'
        - 'Zablokowane i zatwierdzone: nazwa pliku projektu graficznego, wersja, kolory, położenie logo i pole nadruku.'
        - 'BOM — każda pozycja w zestawie wraz z ilością, kolorem, numerem części i regułami zamienników — zatwierdzona przez klienta.'
        - 'Opakowanie, etykietowanie, kody kreskowe, język instrukcji i ustalenia dotyczące inspekcji podmiotu trzeciego ustalone na piśmie.'
      object: 'Zakres projektu względem wymagań klienta — materiały, wymiary, projekt graficzny, opakowanie, rynek docelowy i obowiązujące normy.'
      method: 'Spotkanie przedprodukcyjne z udziałem sprzedaży, inżynierii i QC; podpisanie próbki wzorcowej; wydanie Planu Inspekcji Jakości (QIP) dla zamówienia.'
      criteria: 'Wszystkie pięć linii odniesienia zatwierdzone i zamrożone przed startem produkcji seryjnej. Nierozstrzygnięte punkty blokują zwolnienie produkcji.'
      record: 'QIP + notatki z PPM, zapisy zatwierdzonej próbki.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: Spotkanie przedprodukcyjne z przeglądem próbki wzorcowej i planu inspekcji jakości dla zamówienia OEM SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Pobierz QIP (PDF)'
    - stage: ETAP 02
      title: 'Inspekcja materiałów przychodzących (IQC)'
      summary: 'Surowce są weryfikowane względem zatwierdzonej specyfikacji dostawcy, zanim wejdą na produkcję.'
      checks:
        - 'Tkanina drop-stitch, rolki PCV, materiał listew krawędziowych i pokłady EVA sprawdzane względem zatwierdzonej próbki — kolor, grubość, gramatura i wady powierzchni.'
        - 'Zawory, gniazda płetw, D-ringi, uchwyty i osprzęt sprawdzane pod kątem typu, rozmiaru, wykończenia, rdzy i prawidłowego działania.'
        - 'Pompki, wiosła, smycze, worki i zestawy naprawcze weryfikowane pod kątem modelu, koloru i konfiguracji projektu.'
        - 'Świadectwa dostawców (COA), deklaracje materiałowe i dokumenty zgodności REACH/RoHS sprawdzane dla każdej partii.'
        - 'Partie niezgodne są izolowane i zwracane, zanim jakikolwiek materiał trafi na linię.'
      object: 'Tkanina drop-stitch, rolki PCV, zawory, płetwy, akcesoria i materiały opakowaniowe względem zatwierdzonej specyfikacji i świadectw badań dostawców.'
      method: 'Kontrola wizualna, wymiarowa i wagowa; pobieranie próbek partii wg AQL; przegląd świadectw materiałowych; egzekwowanie listy zatwierdzonych dostawców.'
      criteria: 'Zgodność ze zatwierdzoną specyfikacją i świadectwami. Partie niezgodne są izolowane i odrzucane przed dopuszczeniem na linię.'
      record: 'Raporty IQC z numerami partii i decyzjami.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Inspekcja materiałów przychodzących — tkaniny PCV i komponentów desek SUP w fabryce
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty IQC (PDF)'
    - stage: ETAP 03
      title: 'Kontrola w trakcie procesu i pierwszy egzemplarz (IPQC / FAI)'
      summary: 'Metody konstrukcji i punkty kontrolne dobiera się do zatwierdzonej platformy deski oraz konfiguracji projektu. Pierwszy egzemplarz sprawdza się względem zablokowanych linii odniesienia, a na każdej zmianie prowadzi się obchody kontrolne na linii.'
      checks:
        - 'Pierwszy egzemplarz weryfikowany względem zatwierdzonej próbki, rysunku technicznego, BOM, projektu graficznego i plików opakowania przed startem produkcji seryjnej.'
        - 'Mierzone wymiary, obrys i symetria deski; potwierdzany kierunek nadruku i logo, położenie, kolory oraz rewizja.'
        - 'Szwy i ciągłość listew krawędziowych sprawdzane pod kątem szczelin, delaminacji, zmarszczeń, zanieczyszczeń i przesunięć na linii.'
        - 'Montaż zaworu, D-ringu, uchwytu i gniazda płetwy sprawdzany pod kątem położenia, ilości i dopasowania względem BOM zatwierdzonego przez klienta.'
        - 'Zatwierdzenie FAI blokuje wersją projekt graficzny, wymiary i BOM; odchylenia trafiają do procedury decyzji o naprawie — nigdy do łatania na linii.'
      object: 'Pierwszy egzemplarz i zespoły w trakcie procesu — szwy, listwy, gniazdo płetwy, podstawa zaworu, położenie nadruku, moment dokręcania osprzętu.'
      method: 'Inspekcja pierwszego egzemplarza na pierwszej sztuce; obchody kontrolne na każdej zmianie; wytrzymałość spoin i geometria szwów weryfikowane przy linii.'
      criteria: 'Zatwierdzenie FAI blokuje wersją projekt graficzny, wymiary i BOM. Odchylenia trafiają do procedury decyzji o naprawie — nigdy do łatania na linii.'
      record: 'Zapis FAI, dzienniki obchodów zmianowych, notatki z napraw i decyzji.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Inspekcja w trakcie procesu i kontrola pierwszego egzemplarza podczas produkcji desek SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty IPQC (PDF)'
    - stage: ETAP 04
      title: 'Pompowanie i badanie szczelności powietrznej'
      summary: 'Każda gotowa deska przechodzi pompowanie i weryfikację szczelności przed pakowaniem — 100% sztuk, a nie próbka.'
      checks:
        - 'Powierzchnia deski, listwy krawędziowe i okolica zaworu sprawdzane pod kątem dziurek, pęknięć, nieprawidłowych zafałdowań i delaminacji przed pompowaniem.'
        - 'Komory pompowane do ciśnienia próbnego projektu skalibrowanym cyfrowym manometrem; odczyt początkowy zapisywany.'
        - 'Wkład zaworu, podstawa zaworu i szwy listew sprawdzane na całym obwodzie — dziób, ogon i obszary krzywizny.'
        - '24-godzinne utrzymanie ciśnienia z ciągłym rejestrowaniem; automatyczne odrzucenie po przekroczeniu dopuszczalnego spadku ciśnienia.'
        - 'Wadliwe deski są izolowane, naprawiane zgodnie z instrukcją i w pełni badane ponownie — a nie tylko ponownie sprawdzane w punkcie naprawy.'
      object: '100% pompowanych komór — wykrywanie przecieków na całej długości szwów, szczelność zaworów i utrzymanie ciśnienia.'
      method: 'Wykrywanie przecieków na całym obwodzie szwów, następnie 24-godzinne utrzymanie ciśnienia przy 18.0 PSI; automatyczne odrzucenie przy spadku powyżej 0.50 PSI.'
      criteria: 'Zero punktów przecieku i spadek ciśnienia w granicach 0.50 PSI na komorę; wadliwe sztuki są izolowane i naprawiane albo utylizowane.'
      record: 'Raporty z badań szczelności powietrznej, jeden na komorę, powiązany z partią.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Pompowanie i badanie szczelności powietrznej komory nadmuchiwanej deski SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty ze szczelności powietrznej (PDF)'
    - stage: ETAP 05
      title: 'Inspekcja produktu końcowego (FQC)'
      summary: 'Gotowe deski są mierzone i oceniane wizualnie względem zatwierdzonej próbki wzorcowej.'
      checks:
        - 'Wymiary krytyczne — długość, szerokość i grubość — mierzone przy ciśnieniu roboczym względem tolerancji rysunku.'
        - 'Weryfikowany obrys, rocker deski i symetria; po napompowaniu brak nieprawidłowych odkształceń, skrętów lub wykrzywienia.'
        - 'Ocena wizualna przy lampach dziennych D65: rysy, zabrudzenia, ślady kleju, pęcherze, zmarszczenia, odchylenie koloru.'
        - 'Kontrola funkcjonalna: otwieranie i zamykanie zaworu oraz dopasowanie korka, montaż i blokowanie płetwy, D-ringi, uchwyty i działanie wiosła.'
        - 'Konfiguracja zweryfikowana względem BOM i SKU zatwierdzonych przez klienta — akcesoria, etykiety, kody kreskowe i numery seryjne.'
      object: 'Gotowa deska względem próbki wzorcowej — wymiary, rocker, profil, wygląd, dopasowanie gniazda płetwy i kompletność akcesoriów.'
      method: 'Weryfikacja wymiarów względem tolerancji rysunku; ocena wizualna przy lampach dziennych D65; próby dopasowania gniazda płetwy i osprzętu.'
      criteria: 'Wymiary w granicach tolerancji (np. 3508 × 814 × 150.3 mm), ocena wizualna zgodna z zatwierdzoną próbką, wszystkie akcesoria obecne.'
      record: 'Raporty FQC z podpisem inspektora i decyzją.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Inspekcja produktu końcowego gotowych desek SUP przed pakowaniem
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty FQC (PDF)'
    - stage: ETAP 06
      title: 'Opakowanie i inspekcja przed wysyłką (PSI)'
      summary: 'Zapakowany zestaw sprawdza się pod kątem kompletności, poprawności oznaczeń i gotowości do wysyłki.'
      checks:
        - 'Kompletność zestawu 100% względem BOM: deska, wiosło, pompka, smycz, worek, zestaw naprawczy i instrukcja — po jednym zestawie.'
        - 'Elementy wrażliwe zabezpieczone (woreczki na pompkę i śmigło), deska złożona zgodnie ze SOP pakowania, akcesoria zgodne z modelem i kolorem.'
        - 'Grafika kartonu, marka, ostrzeżenia i wersje językowe zweryfikowane względem zatwierdzonej rewizji projektu graficznego.'
        - 'Typ, numer, położenie i czytelność kodu kreskowego zweryfikowane; znaki wysyłkowe, SKU, numer zamówienia, numer kartonu i ilość poprawne.'
        - 'Rozmiar kartonu, masa brutto i netto oraz opakowanie wewnętrzne zgodne ze specyfikacją pakowania; wynik próby upuszkowej zapisywany, gdy jest wymagany.'
      object: 'Zapakowany zestaw — deska, wiosło, pompka, smycz, worek, instrukcja — względem BOM zatwierdzonego przez klienta i specyfikacji opakowania.'
      method: 'Kompletność zestawu 100% względem BOM; skan kodów kreskowych (Grade ≥ B); poprawność oznaczeń kartonu; próba upuszkowa ISTA-1A na zapakowanych kartonach.'
      criteria: '100% zgodność zestawu z BOM, czytelne kody kreskowe, poprawne oznaczenia i opakowanie odporne na upuszczanie przed załadunkiem.'
      record: 'Listy kontrolne PSI i zapisy pakowania dla każdego kartonu.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Inspekcja przed wysyłką zgodności zapakowanego zestawu SUP z BOM
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Pobierz raporty PSI (PDF)'
    - stage: ETAP 07
      title: 'Zatwierdzenie wysyłki i identyfikowalność'
      summary: 'Zespół jakości podpisuje partię dopiero wtedy, gdy wszystkie sześć wcześniejszych bramek jest zamkniętych i kompletna jest dokumentacja.'
      checks:
        - 'Partia produkcyjna, numer zamówienia, SKU, ilość i liczba kartonów zgodne z listą pakunkową i fakturą handlową.'
        - 'Specyfikacja, BOM, projekt graficzny i pliki opakowania są na bieżącej zatwierdzonej rewizji.'
        - 'Zapisy IQC, FAI, z trakcie procesu, ze szczelności powietrznej, FQC i PSI są kompletne dla partii, która jest zatwierdzana.'
        - 'Wszystkie niezgodności są rozwiązane, naprawione, ponownie sprawdzone i zamknięte — przy zatwierdzeniu nie ma żadnej otwartej pozycji.'
        - 'Pola identyfikowalności zapisywane dla partii: kod projektu, numer zamówienia, SKU, rewizje projektu graficznego/BOM/opakowania, data produkcji, inspektor i numery dokumentów.'
      object: 'Autoryzacja zatwierdzenia partii — wszystkie bramki zamknięte, dokumentacja kompletna, numery seryjne przypisane do partii.'
      method: 'Przegląd wszystkich sześciu poprzednich dokumentów przez zespół jakości; zebranie pakietu identyfikowalności partii; przekazanie dokumentów razem z wysyłką.'
      criteria: 'Wszystkie bramki zatwierdzone przez QA; zapisy partii i pakiet identyfikowalności przekazane kupującemu lub przechowywane pod NDA na żądanie.'
      record: 'Autoryzacja zatwierdzenia wysyłki i pakiet identyfikowalności partii.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Podpisanie zatwierdzenia wysyłki i przekazanie dokumentacji identyfikowalności partii
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Pobierz raporty z zatwierdzenia wysyłki (PDF)'
system_map:
  tagline: System jakości
  title: 'Jeden system, cztery kontrolowane standardy'
  subtitle: 'Powyższe siedem bramek działa w oparciu o cztery udokumentowane standardy, każdy opublikowany jako kontrolowana procedura, którą możesz pobrać i poddać audytowi. Razem tworzą QMS stojący za każdym zamówieniem OEM/ODM — kryteria inspekcji, kontrola zmian, niezgodności i badania laboratoryjne.'
  items:
    - title: 'Standardy inspekcji i zatwierdzania'
      description: 'Plan Inspekcji Jakości (QIP) danego projektu napędza każdą bramkę: obiekt inspekcji, metodę, kryteria akceptacji i dokument wynikowy dla każdego zamówienia. Zawiera 4-etapowy model QC, łańcuch identyfikowalności, procedurę izolacji, macierz wad i rejestr dokumentacji 00–15.'
      icon: tabler:clipboard-check
      link: /pl/factory/quality-inspection
      link_label: 'Standardy inspekcji i pliki QMS'
    - title: 'Kontrola zmian przy naprawach'
      description: 'Żadna zmiana parametru naprawy bez udokumentowanej kontroli: izolacja, klasyfikacja ryzyka, 9-etapowa pętla zmian, macierz zatwierdzeń i walidacja. Każda zmiana zatwierdzonych specyfikacji, próbek, list BOM lub kryteriów akceptacji wymaga pisemnej zgody klienta.'
      icon: tabler:git-branch
      link: /pl/factory/quality-change-control
      link_label: 'Standard kontroli zmian'
    - title: 'Kontrola produktów niezgodnych'
      description: 'Zamknięta 7-etapowa pętla zgodnie z ISO 9001:2015 punkt 8.7: identyfikacja, izolacja, decyzja wg NCR, naprawa lub odrzucenie, ponowna inspekcja, zatwierdzenie, korekta. Zawiera uprawnienia decyzyjne według wagi, macierz decyzji dla wad desek SUP i niszczenie w asyście świadków.'
      icon: tabler:alert-triangle
      link: /pl/factory/non-conforming-control
      link_label: 'Standard kontroli produktów niezgodnych'
    - title: 'Badania laboratoryjne i sprzęt'
      description: 'Laboratorium jakości działa niezależnie od produkcji: próby rozciągania, spadek ciśnienia, starzenie UV, odrywanie spoin, wykrywanie przecieków i komory temperaturowe — wraz z kalibracją i procedurami badań stojącymi za naszymi opublikowanymi deklaracjami.'
      icon: tabler:flask
      link: /pl/factory/quality-lab
      link_label: 'Laboratorium jakości i sprzęt badawczy'
    - title: 'Laboratorium badań materiałowych (R&D)'
      description: 'Centrum R&D prowadzi niezależne badania materiałowe receptur PCV/Hypalon, przyspieszone starzenie i wsparcie certyfikacji, dostarczając standardy wykorzystywane w produkcji.'
      icon: tabler:microscope
      link: /pl/randdcenter/quality-inspection-lab
      link_label: 'Laboratorium badań materiałowych R&D'
intelligence_cards:
