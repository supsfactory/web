traceability:
  tagline: Identyfikowalność na poziomie partii
  title: 'Cztery pytania, na które odpowiada każda partia'
  subtitle: 'Zapisy jakości prowadzimy dla każdej partii produkcyjnej i wiążemy z właściwą specyfikacją produktu, projektem graficznym, BOM i wymaganiami pakowania. Umożliwia to dochodzenie i kontrolowane działania w przypadku stwierdzenia problemu jakościowego. Podczas audytu kupującego nasz zespół jakości odpowiada na hali na te cztery pytania — każda odpowiedź wskazuje na kontrolowany zapis.'
  items:
    - title: 'Co zostało wyprodukowane?'
      description: 'Produkt, model, konfiguracja i rewizja są powiązane z numerem zamówienia i zatwierdzoną rewizją specyfikacji.'
      icon: '1'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobacz pakiet identyfikowalności (PDF)'
    - title: 'Jakie materiały zostały użyte?'
      description: 'Każda partia materiału trafiająca do danej partii jest zapisywana wraz z dostawcą, świadectwem i decyzją IQC.'
      icon: '2'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobacz pakiet identyfikowalności (PDF)'
    - title: 'Kto przeprowadził inspekcję i kiedy?'
      description: 'Każdy zapis zawiera rolę inspektora, datę, użyte narzędzia i wynik — bez anonimowych podpisów.'
      icon: '3'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobacz pakiet identyfikowalności (PDF)'
    - title: 'Jak partia została zatwierdzona?'
      description: 'Zatwierdzenie jest autoryzowane przez zespół jakości dopiero po zamknięciu wszystkich bramek; decyzja jest udokumentowana w zapisie.'
      icon: '4'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobacz pakiet identyfikowalności (PDF)'
non_conformance:
  tagline: Kontrola produktów niezgodnych
  title: 'Gdy wykryto wadę: zatrzymaj, zdecyduj, udokumentuj'
  subtitle: 'Produkty lub komponenty, które nie spełniają zdefiniowanych kryteriów akceptacji, są identyfikowane i umieszczane w kontrolowanym zatrzymaniu. Naprawa lub wymiana są dopuszczalne wyłącznie zgodnie z właściwą procedurą jakości, a następnie wymagają ponownej inspekcji przed zatwierdzeniem.'
  items:
    - title: 'Wykryj i odseparuj'
      description: 'Wadliwe sztuki są oznaczane czerwonym tagiem i przenoszone do stacji izolacji — bez dalszego przetwarzania i pakowania do czasu decyzji.'
      icon: tabler:alert-triangle
    - title: 'Decyzja wg NCR'
      description: 'Zespół jakości wystawia Raport Niezgodności (NCR) i kieruje sztukę do naprawy, ponownej inspekcji, odrzucenia lub utylizacji zgodnie z macierzą decyzji.'
      icon: tabler:git-branch
      link: /pl/factory/non-conforming-control
      link_label: 'Standard kontroli produktów niezgodnych'
    - title: 'Zweryfikuj i zatwierdź'
      description: 'Naprawione sztuki są ponownie sprawdzane według tych samych kryteriów; NCR jest zamykany dopiero po pozytywnej weryfikacji.'
      icon: tabler:shield-check
    - title: 'Kontrola utylizacji'
      description: 'Zutylizowany materiał jest niszczony z podpisanym świadectwem utylizacji, więc nigdy nie wraca do magazynu ani na rynek.'
      icon: tabler:trash
      link: https://assets.isupfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Świadectwo utylizacji i zniszczenia (PDF)'
    - title: 'Sprzężenie zwrotne o przyczynach'
      description: 'Powtarzające się wady uruchamiają działanie korygujące u odpowiedzialnego procesu lub dostawcy — zamknięte w pętli, a nie na papierze.'
      icon: tabler:refresh
      link: https://assets.isupfactory.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'SOP kontroli zmian przy naprawie (PDF)'
third_party:
  tagline: Wsparcie dla inspekcji kupującego i inspekcji niezależnych
