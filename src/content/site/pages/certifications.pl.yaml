content_certifications:
  tagline: Certyfikacje i normy
  title: 'Certyfikowana jakość, uznana na świecie'
  subtitle: 'Certyfikacja jest warta tyle, ile obejmuje. Poniżej znajdziesz zakres certyfikacji, posiadacza certyfikatu oraz sposób weryfikacji lub pozyskania dokumentów dla swojego projektu.'
  items:
    - title: 'Oznakowanie CE'
      description: 'Dokumentacja zgodności CE jest dostępna dla właściwych konfiguracji na rynek UE zgodnie z Dyrektywą 2013/53/EU (rekreacyjne jednostki pływające); zakres potwierdza się dla każdego projektu. Numery certyfikatów i raporty z badań dostępne na żądanie.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'System zarządzania jakością certyfikowany zgodnie z ISO 9001:2015, obejmujący projektowanie, produkcję i dystrybucję nadmuchiwanych jednostek pływających oraz wyposażenia morskiego. Zakres certyfikacji i raport z audytu dostępne na żądanie.'
      icon: tabler:clipboard-check
    - title: 'Zgodność społeczna BSCI'
      description: 'Zauditowane wg BSCI (Business Social Compliance Initiative), obejmujące warunki pracy i zgodność fabryki. Raport z audytu dostępny na żądanie.'
      icon: tabler:heart-handshake
    - title: 'Zgodność materiałowa REACH'
      description: 'Materiały spełniają unijne rozporządzenie REACH w zakresie bezpieczeństwa chemicznego. Deklaracje materiałowe dołączamy do dokumentacji produkcyjnej każdej wysyłki.'
      icon: tabler:flask
    - title: 'Zgodność RoHS'
      description: 'Zgodność w zakresie substancji niebezpiecznych ograniczonych udokumentowana zgodnie z RoHS dla właściwych komponentów i materiałów.'
      icon: tabler:flame
    - title: 'Badania materiałowe'
      description: 'Tkaniny bada się pod kątem wytrzymałości na rozciąganie, odporności na rozdarcie, degradacji UV i pękania na zimno. Z każdej partii produkcyjnej pobiera się próbki i weryfikuje je zgodnie z opublikowanym protokołem badań.'
      icon: tabler:test-pipe
faqs:
  tagline: FAQ
  title: Najczęściej zadawane pytania o nasz system jakości
  items:
    - q: 'Czy mogę pobrać rzeczywiste raporty z inspekcji?'
      a: 'Tak. Siedem dwujęzycznych pakietów raportów na tej stronie — QIP, IQC, IPQC/FAI, szczelność powietrzna, FQC, PSI i zatwierdzenie wysyłki — to rzeczywiste kontrolowane zapisy z usuniętymi polami poufnymi. Pokazują dokładną strukturę, metody i kryteria akceptacji stosowane w każdym zamówieniu.'
    - q: 'Jak siedem bramek przekłada się na mój projekt?'
      a: 'Każdy projekt otrzymuje Plan Inspekcji Jakości (QIP), który określa bramki właściwe dla Twojego produktu i rynku, zakres inspekcji na każdej bramce oraz dokumenty, które otrzymasz. Pobierz próbkę QIP z tej strony, aby zobaczyć jej strukturę.'
    - q: 'Czy te próbki zapisów inspekcyjnych są prawdziwe?'
      a: 'Tak. Próbki odpowiadają naszej rzeczywistej strukturze kontrolowanych zapisów — nagłówek dokumentu, lista kontrolna inspekcji, kryteria akceptacji, metoda, wyniki, rola inspektora i decyzja o zatwierdzeniu. Wszystkie wartości identyfikujące są zastąpione wartościami demonstracyjnymi (kody DEMO-*), więc żadne dane klienta, projektu graficznego, zamówienia ani ceny nie są ujawniane.'
    - q: 'Dlaczego próbki są zanonimizowane?'
      a: 'Poufność klienta jest na pierwszym miejscu. Nazwy klientów, projekt graficzny, szczegóły zamówień, informacje o dostawcach i ceny są chronione z założenia. Anonimizacja pozwala każdemu potencjalnemu kupującemu zweryfikować naszą strukturę zapisów i identyfikowalność, nie ujawniając przy tym działalności innego klienta.'
    - q: 'Czy możemy otrzymać pełne raporty z inspekcji naszego projektu?'
      a: 'Tak. Dla zatwierdzonych projektów udostępniamy dokumentację jakości właściwą dla Twojego zamówienia — plan inspekcji jakości, raporty z inspekcji materiałów przychodzących, w trakcie procesu, ze szczelności powietrznej, końcowej i pakowania oraz autoryzację zatwierdzenia wysyłki — powiązane z identyfikowalnością Twojej partii. Wrażliwe dane handlowe pozostają objęte NDA zgodnie z ustaleniami.'
    - q: 'Co zawiera zapis inspekcji na poziomie partii?'
      a: 'Każdy zapis wiąże partię produkcyjną z właściwą rewizją specyfikacji lub rysunku, rejestruje każdy punkt kontrolny wobec jego kryteriów akceptacji wraz z metodą i użytym narzędziem, a kończy rolą inspektora, statusem wyniku i decyzją o zatwierdzeniu podpisaną przez zespół jakości.'
evidence_review:
  tagline: 'Dowody i weryfikacja'
  title: 'ZWERYFIKOWANE SPECYFIKACJE'
  body: 'Wszystkie deklaracje produkcyjne na tej stronie są weryfikowane przez nasz Zespół Inżynierii Produkcji w zakładzie w Laixi, w Qingdao. Certyfikaty, zapisy kontroli jakości, raporty z prób ciśnieniowych i wytrzymałościowych oraz zapisy identyfikowalności partii są dostępne na żądanie. Specyfikacje zweryfikowano ostatnio we wrześniu 2026.'

cta:
  title: 'Potrzebujesz wymagań jakościowych dla swojego projektu SUP?'
  subtitle: 'Podaj kategorię produktu, rynek docelowy, szacunkową ilość oraz ewentualne wymagania dotyczące inspekcji, dokumentacji lub opakowania. Zweryfikujemy obowiązujące dane wejściowe projektu i wskażemy kolejny krok w kierunku opracowania próbki lub planowania produkcji. Przed udostępnieniem niepublicznych specyfikacji, projektu graficznego lub wymagań jakościowych możemy omówić NDA.'
