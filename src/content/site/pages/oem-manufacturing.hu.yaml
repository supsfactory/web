hero:
  tagline: OEM gyártás
  title: 'Testreszabott SUP OEM gyártás – az Ön specifikációja, a mi gyárunk'
  subtitle: 'Ön hozza a kivitelt, a rajzokat vagy egy jól validált platformot – mi konténer-skálán gyártjuk. Mérnöki elemzés egy munkanapon belül, 7–12 napos minták, 25–35 napos gyártás a megerősített megrendelés és előleg után, az Ön márkájában feladva.'

answer:
  label: 'Közvetlen válasz'
  text: 'Az OEM gyártás az Ön specifikációjából indul ki. A MOQ-t a projekt konfigurációja erősíti meg, nem egy rögzített szám: a standard térfogatú gyártás 90–100 darab szállítmányonként, 150 m-es drop-stitch szövettekercsénként, a pilótaszállítmányok 20–50 darabtól indulnak meglévő platformokon, és minden projekt először átmegy a minta szakaszán (1–2 darab). A mintákat 7–12 nap alatt adjuk fel; a gyártás a megerősített megrendelés és előleg után 25–35 napot tart, új szerszámok szükségessége esetén további 15–20 nappal.'
  verified: '2026. szeptember'

features:
  title: OEM képességek
  subtitle: 'Minden, ami ahhoz szükséges, hogy a specifikációból, a rajzokból vagy egy meglévő platformból egy feladott konténer legyen.'
  items:
    - title: Gyártás az Ön specifikációja szerint
