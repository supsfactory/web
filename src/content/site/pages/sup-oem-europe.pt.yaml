answer:
  label: 'Resposta breve'
  text: 'As marcas europeias encomendam SUP insufláveis à SUPsfactory em condições padrão: a MOQ é confirmada pela configuração do projeto: os ciclos de amostras com 1–2 peças validam a construção, as pequenas séries piloto com 20–50 peças testam o mercado em plataformas existentes e a produção de série padrão roda com 90–100+ peças por design a partir de um rolo drop-stitch completo de 150 m. A primeira amostra parte 7–12 dias após a aprovação das especificações, a produção exige 25–35 dias após PO confirmada e sinal e o transporte marítimo acrescenta 4–6 semanas para Roterdão ou Hamburgo. A documentação CE e REACH é criada em paralelo à amostra aprovada e DDP cobre o desalfandegamento e a entrega no teu armazém.'
  verified: 'September 2026'

