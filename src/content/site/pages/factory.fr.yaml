qc_section:
  tagline: Contrôle qualité
  title: Processus d'essais et d'assurance qualité
  subtitle: Chaque planche subit des essais obligatoires avant expédition. Notre laboratoire qualité fonctionne indépendamment de la production et relève directement de la direction.
  steps:
    - step: '1'
      title: Inspection des matières premières
      desc: Les tissus PVC, Hypalon et drop-stitch subissent des essais de traction, de propagation de déchirure et de résistance aux UV avant que tout lot n'entre en production.
    - step: '2'
      title: Test de rétention d'air de 24 heures
      desc: Chaque chambre de tube est gonflée à 18,0 PSI et maintenue 24 heures. Une chute de pression supérieure à 0,50 PSI déclenche le rejet automatique et la ré-inspection de la couture.
    - step: '3'
      title: Essai de charge et d'équilibre
      desc: Les planches terminées sont gonflées à la pression nominale et vérifiées pour le gonflement symétrique, la rigidité à 15 PSI et la stabilité sous charge. Chaque planche est testée à l'eau dans notre bassin d'essai avant l'inspection finale.

oem_section:
  tagline: Projets OEM
  title: Études de cas de partenariats de marques et OEM
  subtitle: Du concept à la production — comment nous aidons les marques mondiales à lancer et développer leurs gammes de SUP gonflables.
  cases:
    - challenge: Un détaillant européen de plein air avait besoin d'une gamme de SUP en marque privée avec des graphismes de pont uniques, du PVC écologique et un emballage prêt pour le retail — le tout livré en 60 jours.
      solution: Nous avons développé des fichiers d'impression numérique personnalisés, sourcé un PVC conforme REACH et réduit l'échantillonnage de 3 tours à 1 en installant l'équipe de conception à notre usine de Qingdao.
      result: 'Production en 25–35 jours à partir du bon de commande signé, avec première livraison dans la fenêtre de 60 jours. 2 400 unités sur 4 SKU. Une commande renouvelée a été passée avant la livraison complète du premier lot.'
      disclaimer: 'Résumé de projet anonymisé — le type et le périmètre du projet sont représentatifs ; les résultats spécifiques ne sont pas vérifiables de manière indépendante.'
    - challenge: Une startup américaine de sports nautiques avait besoin d'un SUP drop-stitch haute performance avec une forme personnalisée, un emballage co-marqué et une certification BSCI pour le placement en retail.
      solution: Adaptation du moule SUP existant avec un contour modifié, développement des visuels d'emballage co-marqués et fourniture de la documentation complète d'audit BSCI.
      result: Placement réussi dans les principaux détaillants de plein air américains, générant une forte dynamique avec plus de 5 000 unités vendues en première année et un taux d'écoulement de 98 %.
      disclaimer: 'Résumé de projet anonymisé — le type et le périmètre du projet sont représentatifs ; les résultats spécifiques ne sont pas vérifiables de manière indépendante.'
    - challenge: Un distributeur australien avait besoin d'une gamme de SUP certifiée CE avec des couleurs personnalisées et une conformité aux normes australiennes.
      solution: Production d'échantillons de pré-production avec 4 variantes de couleur et coordination des essais de conformité par une tierce partie.
      result: Gamme de SUP à 3 modèles lancée sur le marché AU/NZ. Suivie d'une victoire à un appel d'offres gouvernemental pour 12 SUP de patrouille.
      disclaimer: 'Résumé de projet anonymisé — le type et le périmètre du projet sont représentatifs ; les résultats spécifiques ne sont pas vérifiables de manière indépendante.'

faq_section:
  tagline: FAQ
  title: Questions fréquentes B2B et OEM
  questions:
    - q: Quelle est la quantité minimale de commande (MOQ) pour les planches de SUP gonflables OEM ?
      a: 'Le MOQ est confirmé par la configuration du projet plutôt que par un chiffre fixe — coque et outillage, coloris et PVC, graphismes, emballage et accessoires. La production standard en volume s''exécute en 90–100+ unités par lot à partir d''un rouleau drop-stitch complet de 150 m, le co-marquage en petits lots commence à 5–10 unités, et chaque projet passe par les étapes d''échantillon (1–2 unités) et de pilote (20–50 unités). Consultez notre Guide MOQ et marque flexible pour la logique de calcul complète.'
    - q: Afarer détient-elle la certification BSCI ?
      a: 'Oui. Notre usine maintient une certification BSCI valide de conformité sociale (rapport d''audit disponible sur demande). Nous détenons également l''ISO 9001 pour le management de la qualité. La certification CE s''applique aux modèles destinés aux marchés de l''UE ; le périmètre est confirmé par projet. La documentation de conformité REACH et RoHS est fournie avec chaque commande OEM.'
    - q: Quel est le délai habituel pour une commande OEM ?
      a: 'Le délai standard est de 25–35 jours à partir du bon de commande confirmé et de l''acompte pour la production OEM en volume. Le développement de moules personnalisés ajoute 15–20 jours pour l''outillage. Une production accélérée est disponible pour les commandes urgentes et les périodes de pointe saisonnières. Les échantillons de prototype sont généralement prêts en 7–12 jours.'
    - q: Gérez-vous la documentation d'export ?
      a: 'Oui. Notre équipe gère la documentation d''export et le dédouanement en interne, et nous livrons dans plus de 50 pays sur les marchés UE, US, AU et Asie.'

b2b_moq: 'MOQ confirmé par la configuration du projet : échantillon 1–2, pilote 20–50, volume 90–100+ (par rouleau de 150 m) ; co-marquage en petits lots à partir de 5–10 unités.'

production_flow:
  tagline: Flux de production
  title: De la matière à la planche finie
  subtitle: Chaque planche passe par 6 étapes de production avec des points de contrôle qualité à chaque étape. Pas de raccourcis, pas d'inspections sautées.
  stages:
    - stage: '01'
      title: Réception des matières et QC entrant
      description: 'Toutes les matières entrantes sont enregistrées par lot/numéro de lot dans notre système ERP. Les rouleaux de tissu PVC, noyaux drop-stitch, valves, adhésifs et quincaillerie sont mis en quarantaine jusqu''à l''approbation QC.'
      qc_check: 'Résistance à la traction (ASTM D751), résistance à la déchirure (ISO 4674), jauge d''épaisseur, viscosité de l''adhésif, recherche de défauts visuels'
      qc_threshold: '100 % des lots testés. Rejet si traction < 90 % de la spécification, déchirure < minimum de spécification, ou tout défaut visuel'
      responsibility: Équipe QC entrante (3 inspecteurs)
    - stage: '02'
      title: Découpe CNC et préparation des matériaux
      description: 'Le placement optimisé par ordinateur dispose les panneaux sur le stock PVC pour minimiser le gaspillage. Les machines de découpe CNC automatiques maintiennent une précision de positionnement de 0,1 mm.'
      qc_check: 'Contrôle dimensionnel par rapport aux fichiers CAD DXF, inspection de la qualité des bords, vérification du nombre de panneaux'
      qc_threshold: 'Chaque 20e panneau mesuré. Tolérance ±0,5 mm. Rejet du lot si >2 % hors tolérance'
      responsibility: Responsable de l'atelier de découpe
    - stage: '03'
      title: Soudage et assemblage drop-stitch
      description: 'Les noyaux drop-stitch sont liés aux laminés PVC extérieurs par lamination thermique. Les chambres de tubes sont soudées par RF ou à l''air chaud. Les bandes de rail sont fusionnées en triple couche.'
      qc_check: 'Test de pelage toutes les 50 unités (ASTM D751), mesure de la largeur de soudure, revue du journal de température de l''air chaud, inspection visuelle des coutures sous contre-jour'
      qc_threshold: 'Résistance au pelage min. 8 N/cm. Tolérance de largeur de soudure ±1 mm. Tout canal visible = rejet'
      responsibility: QC soudage (2 inspecteurs par équipe)
    - stage: '04'
      title: Assemblage et équipement
      description: 'Les planches passent à l''assemblage final où tous les composants sont réunis : panneaux de pont et de coque fusionnés, valves installées, anneaux en D, poignées, boîtiers d''ailerons et fixation du sac de transport. Chaque unité suit une liste de contrôle d''assemblage de 100 points.'
      qc_check: 'Signature de la liste de contrôle à 100 points par unité, test de fonction de la valve (10 cycles ouvert/fermé), vérification du couple de serrage de la quincaillerie, inspection visuelle'
      qc_threshold: 'Politique zéro défaut sur les éléments critiques pour la sécurité (valves, anneaux en D, poignées). Cosmétique mineur : AQL 2,5 (ISO 2859)'
      responsibility: Chef d'équipe d'assemblage + QC de ligne
    - stage: '05'
      title: Test de pression et blocage qualité
      description: 'Chaque chambre est gonflée à 18,0 PSI (pour un SUP nominal de 12–15 PSI) et maintenue 24 heures. Les capteurs de pression enregistrent en continu. Les chambres dépassant 0,50 PSI de chute de pression sont rejetées et envoyées en ré-inspection de couture.'
      qc_check: 'Journal de maintien de pression de 24 h, étalonnage du capteur vérifié quotidiennement, lecture de pression compensée en température, re-test de couture après réparation'
      qc_threshold: 'Max 0,50 PSI de chute de pression sur 24 h à température stable. Toute chambre dépassant ce seuil = re-test à 100 % de tout le lot de production'
      responsibility: Laboratoire qualité (indépendant de la production, relève de la direction)
    - stage: '06'
      title: Inspection finale et conditionnement
      description: 'Inspection visuelle et fonctionnelle finale. Défauts de surface, cohérence des couleurs, vérification des étiquettes/BIN, intégrité de l''emballage et complétude des accessoires. Les unités sont mises sous vide, cartonnées et palettisées pour le chargement du conteneur.'
      qc_check: 'Inspection visuelle complète, liste de contrôle des accessoires par SKU, test de chute de l''emballage (1 m, échantillon aléatoire), vérification par scan des étiquettes/codes-barres'
      qc_threshold: 'AQL 2,5 pour les défauts majeurs, AQL 4,0 pour les mineurs. Tolérance zéro sur les défauts de sécurité. 100 % des unités inspectées visuellement'
      responsibility: Équipe QC finale (4 inspecteurs) + responsable du conditionnement

