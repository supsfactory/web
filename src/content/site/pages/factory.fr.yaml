material_traceability:
  tagline: Traçabilité
  title: Suivi des matériaux et contrôle des lots
  description: Chaque lot de matière première reçoit un numéro de lot unique dans notre système ERP. De l'arrivée à la production jusqu'au produit fini, la nomenclature de chaque planche renvoie au lot fournisseur d'origine. Cela permet une traçabilité amont complète pour toute enquête qualité ou conformité.
  system: 'ERP personnalisé (système interne de Qingdao Vatrad Group) + étiquettes de lot physiques sur chaque ordre de travail'
  coverage: '100 % des matériaux de production — PVC, Hypalon, tissu drop-stitch, adhésifs, valves, quincaillerie, emballage'
  records_retained: '10 ans (selon l''exigence CE 2013/53/UE)'
  suppliers:
    - material: PVC de qualité marine
      source: Fournisseurs chinois et coréens
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Fournisseur japonais
      certified: ISO 9001, REACH
    - material: Tissu drop-stitch
      source: Tissage interne + partenaire externe
      certified: QC interne + fournisseur ISO 9001
    - material: Valves et quincaillerie
      source: Fournisseurs OEM chinois
      certified: ISO 9001, certificats matériaux par lot

