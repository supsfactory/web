intro: |
  <p><strong>Vatrad</strong> är den marina produktionsdivisionen inom <strong>Qingdao Vatrad Group Co., Ltd.</strong>, belägen i den ekonomiska utvecklingszonen i Laixi, Qingdao, Shandong, Kina. Grundat 2012 började företaget som en specialiserad båtverkstad med inriktning på marint hantverk och växte till en certifierad fabrik som betjänar OEM- och ODM-kunder i över 50 länder.</p>
  <p>iSupfactory är B2B-divisionen för Vatrad-fabrikens anpassade utvecklingsprojekt. Varje iSupfactory-projekt — från det första provet eller en liten co-branding-serie till en komplett private label-produktlinje — realiseras i samma fabrik, av samma team och med samma kvalitetssystem som beskrivs på den här sidan.</p>
  <p>Fabriken omfattar 12 500 m² med verkstäder för PVC-skärning, montering av drop-stitch-kärnan, högfrekvenssvetsning, brädmontering samt ett testområde för luftretention, tryckhållning och sömshållfasthet. Produktionskapaciteten uppgår till mer än 120 000 uppblåsbara enheter per år och fabriken arbetar med ett kvalitetsledningssystem enligt ISO 9001, med CE-, BSCI- och REACH-överensstämmelse samt USCG-godkännande för exporterade produkter.</p>
  <p>Mer än 350 kvalificerade medarbetare och över 14 FoU-ingenjörer stöder de två arbetsområden som är viktiga för SUP-varumärken: konstruktion (skrovform, materialval, prototyper) och produktion (grafisk applicering, montage, inspektion, exportförpackning). En intern FoU-avdelning med PVC-textillaboratorium och testdamm tar fram anpassade former och strukturell validering innan serieproduktionen startar.</p>
