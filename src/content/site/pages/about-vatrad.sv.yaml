values_section:
  title: Så arbetar fabriken med varumärken
  subtitle: 'Tre principer som präglar varje projekt som byggs av Vatrad-fabriken.'
  columns: 3
  items:
    - title: Konstruktion före produktion
      description: 'Varje projekt börjar med krav, ritningar och ett fysiskt prov — skrovform, drop-stitch-täthet, grafisk placering och förpackning valideras före varje produktionscykel, inte först vid linjen.'
      icon: 'tabler:settings'
    - title: Ett team, en fabrik
      description: 'Design, skärning, svetsning, montage och testning sker i en enda fabrik på 12 500 m². Ingen vidareförsäljning via handelsföretag: personerna som besvarar dina frågor är de som bygger dina brädor.'
      icon: 'tabler:building-factory-2'
    - title: Små första serier
      description: 'Co-branding i små serier börjar på 5–10 enheter och standardserieproduktionen går med 90–100+ enheter per lot (en rulle på 150 m drop-stitch) — så validerar ett varumärke marknaden före uppskalering, med bibehållna formverktyg och grafik för återbeställningar.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Vad fabriken erbjuder
  subtitle: 'De produktionstjänster som finns tillgängliga för iSupfactory-kunder.'
  columns: 2
  items:
    - title: Anpassad SUP-utveckling
      description: 'Kravanalys, specifikationer, materialval, grafik, prototyper, provgodkännande och produktion av skräddarsydda uppblåsbara SUP-produkter.'
      icon: 'tabler:bulb'
    - title: Private label-produktion
      description: 'Din logotyp, dina färger och din förpackning på bevisade kommersiella plattformar: bräda, deckpad, tillbehör ochkartonger bär alla din identitet, utan fabrikens märkning.'
      icon: 'tabler:tag'
    - title: OEM/ODM-produktion
      description: 'Komplett OEM- och ODM-produktion av uppblåsbara SUP-brädor enligt kundens ritningar eller gemensamt utvecklade designs, inklusive anpassade formverktyg för nya brädformer.'
      icon: 'tabler:package'
    - title: Flottleveranser
      description: 'Flottor av märkta brädor för resorts, klubbar, skolor och uthyrningscentrum, med koordinerade tillbehör och produktionscykler anpassade till flottorna.'
      icon: 'tabler:users-group'
certifications_section:
  title: Certifiering och överensstämmelse
  subtitle: 'Fabriken levererar till EU, USA och Asien-Pacific-regionen inom ett dokumenterat system för överensstämmelse.'
  columns: 2
  items:
    - title: CE-certifiering
      description: 'Produktlinjerna för uppblåsbara SUP-brädor och båtar uppfyller EU:s säkerhetsdirektiv, med dokumentation för varje marknad.'
      icon: 'tabler:certificate'
    - title: Kvalitetssystem ISO 9001
      description: 'Produktionsanläggningen arbetar med ett kvalitetsledningssystem enligt ISO 9001 som täcker inkommande kontroll, processkontroll och slutkontroll.'
      icon: 'tabler:badge-check'
    - title: Social överensstämmelse BSCI
      description: 'Socialt ansvar revideras enligt BSCI och omfattar arbetsförhållandena och fabrikens överensstämmelse.'
      icon: 'tabler:shield-check'
    - title: Materialöverensstämmelse REACH
      description: 'Materialen uppfyller EU-förordningen REACH för kemisk säkerhet.'
      icon: 'tabler:flask'
    - title: USCG-godkännande
      description: 'Produktion godkänd av amerikanska kustbevakningen för produktlinjerna av uppblåsbara båtar.'
      icon: 'tabler:anchor'
    - title: Produkttestning
      description: 'Flödes- och bärkraftstester, sömshållfasthet, UV-beständighet, slitagebeständighet och tryckhållning på varje produktionslinje.'
      icon: 'tabler:test-pipe'
