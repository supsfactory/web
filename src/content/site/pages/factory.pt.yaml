material_traceability:
  tagline: Rastreabilidade
  title: Rastreamento de materiais & controlo de lotes
  description: Cada lote de matéria-prima recebe um número de lote único no nosso sistema ERP. Da entrada até à produção e ao produto final, a lista de materiais de cada prancha remete para o lote original do fornecedor. Isto permite uma rastreabilidade total a montante para qualquer pedido de qualidade ou conformidade.
  system: ERP personalizado (sistema interno do Qingdao Vatrad Group) + marcações físicas dos lotes em cada ordem de trabalho
  coverage: '100% do material de produção — PVC, Hypalon, tecido drop-stitch, adesivos, válvulas, acessórios, embalagem'
  records_retained: 10 anos (segundo requisito CE 2013/53/UE)
  suppliers:
    - material: PVC de qualidade marítima
      source: Fornecedores chineses e coreanos
      certified: ISO 9001, REACH, RoHS
    - material: 'Hypalon (CSM)'
      source: Fornecedor japonês
      certified: ISO 9001, REACH
    - material: Tecido drop-stitch
      source: Tecedeira própria + parceiro externo
      certified: QC interno + fornecedor ISO 9001
    - material: Válvulas & acessórios
      source: Fornecedores OEM chineses
      certified: ISO 9001, certificados de materiais por lote

