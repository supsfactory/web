hero:
  tagline: Fábrica
  title: Fábrica & produção
  subtitle: 'Fábrica de SUP de 12,500 m2 em Qingdao, China — produção de SUP à medida, da matéria-prima PVC à prancha de paddle insuflável acabada'

answer:
  label: 'Resposta clara'
  text: 'Fábrica certificada de SUP insufláveis em Qingdao, China: ISO 9001, ISO 25649, BSCI, CE, REACH e RoHS. Instalação de 12,500 m² em 4 oficinas especializadas, mais de 350 colaboradores, mais de 120,000 pranchas produzidas por ano (10,000 pranchas/mês em 4 linhas automatizadas). Cada prancha é testada em pressão durante 24 horas a 18.0 PSI, passa numa checklist de montagem de 100 pontos e tem uma rastreabilidade de materiais de 10 anos.'
  verified: 'September 2026'

intro:
  - 'Como divisão de produção da **Qingdao Vatrad Group Co., Ltd.**, a Vatrad controla cada fase da produção de SUP insufláveis — desde a entrada das matérias-primas em PVC até à inspeção final pré-embarque da prancha de paddle acabada. As nossas instalações de produção na zona de desenvolvimento económico de Qingdao cobrem 12,500 metros quadrados e albergam oficinas dedicadas ao corte do PVC, à laminação do núcleo drop-stitch, à impressão digital dos SUP, à montagem final e ao controlo de qualidade.'
  - 'Ao integrar design, engenharia, prototipagem, produção e teste sob o mesmo teto, eliminamos as ineficiências da produção por encomenda e mantemos o controlo direto sobre a qualidade de construção, a seleção de materiais e os prazos de entrega. Cada SUP que sai das nossas instalações é construído pelas nossas pessoas, com o nosso equipamento, de acordo com os nossos padrões.'

