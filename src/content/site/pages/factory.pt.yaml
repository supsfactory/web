qc_section:
  tagline: Controlo de qualidade
  title: Processo de teste e garantia de qualidade
  subtitle: Cada prancha passa, antes da expedição, num teste obrigatório. O nosso laboratório de qualidade opera de forma independente da produção e reporta diretamente à direção.
  steps:
    - step: '1'
      title: Controlo de matérias-primas
      desc: Os tecidos de PVC, Hypalon e drop-stitch são submetidos a provas de resistência à tração, teste de rasgamento e verificação da resistência aos raios UV antes de um lote entrar na produção.
    - step: '2'
      title: Teste de retenção de ar de 24 horas
      desc: Cada câmara é insuflada a 18.0 PSI e mantida durante 24 horas. Uma queda de pressão superior a 0.50 PSI ativa a rejeição automática e o re-controlo das costuras.
    - step: '3'
      title: Teste de carga e balanceamento
      desc: As pranchas acabadas são insufladas à pressão nominal e controladas quanto a enchimento simétrico, rigidez a 15 PSI e estabilidade sob carga. Cada prancha é testada em água no nosso vaso de prova antes do controlo final.

oem_section:
  tagline: Projetos OEM
  title: Casos de estudo de parcerias com marcas & OEM
  subtitle: Do conceito à produção — como ajudamos marcas globais a lançar e escalar as suas linhas de SUP insufláveis.
  cases:
    - challenge: Um retalhista outdoor europeu precisava de uma linha de SUP de marca própria com gráficas de deck únicas, PVC eco-friendly e embalagem pronta para o retalho — tudo entregue em 60 dias.
      solution: Desenvolvimento de ficheiros de impressão digital personalizados, fornecimento de PVC conforme REACH e compressão da fase de amostra de 3 rounds para 1 graças à equipa de design alojada na nossa fábrica de Qingdao.
      result: 'Produção em 25–35 dias a partir da encomenda assinada, com a primeira entrega dentro da janela dos 60 dias. 2,400 unidades em 4 SKU. Encomenda repetida antes de o primeiro lote estar totalmente entregue.'
      disclaimer: 'Resumo de projeto anonimizado — o tipo e o âmbito do projeto são representativos; os resultados concretos não são verificáveis de forma independente.'
    - challenge: Uma startup americana de desportos aquáticos precisava de um SUP drop-stitch de alto desempenho com forma personalizada, embalagem em co-branding e certificação BSCI para o retalho.
      solution: Adaptação de uma forma SUP existente com contorno modificado, desenvolvimento de gráficas de embalagem em co-branding e fornecimento da documentação completa de auditoria BSCI.
      result: 'Posicionamento bem-sucedido junto dos principais retalhistas outdoor dos EUA, com forte impulso graças a mais de 5,000 unidades vendidas no primeiro ano e uma taxa de conclusão de 98%.'
      disclaimer: 'Resumo de projeto anonimizado — o tipo e o âmbito do projeto são representativos; os resultados concretos não são verificáveis de forma independente.'
    - challenge: Um distribuidor australiano precisava de uma série SUP certificada CE com cores personalizadas e conformidade com os padrões australianos.
      solution: Produção de amostras de pré-série com 4 variantes de cor e coordenação dos testes de conformidade de terceiros.
      result: 'Lançamento de uma série SUP de 3 modelos no mercado AU/NZ. Seguido de um sucesso em contrato governamental para 12 SUP de patrulha.'
      disclaimer: 'Resumo de projeto anonimizado — o tipo e o âmbito do projeto são representativos; os resultados concretos não são verificáveis de forma independente.'

faq_section:
  tagline: FAQ
  title: Perguntas frequentes sobre B2B & OEM
  questions:
    - q: Qual é a quantidade mínima de encomenda (MOQ) para pranchas SUP insufláveis OEM?
      a: 'O MOQ é confirmado com base na configuração do projeto e não num número fixo — casco e equipamento, variantes de cor e PVC, gráficas, embalagem e acessórios. A produção padrão em série roda com 90–100+ unidades por lote a partir de uma bobina completa de drop-stitch de 150 m, o co-branding em pequenos lotes começa em 5–10 unidades e cada projeto passa pelas fases de amostra (1–2 unidades) e piloto (20–50 unidades). Consulta o nosso guia MOQ & branding flexível para a lógica completa de cálculo.'
    - q: A Vatrad possui certificação BSCI?
      a: 'Sim. A nossa fábrica detém uma certificação de conformidade social BSCI válida (relatório de auditoria disponível a pedido). Mantemos também ISO 9001 para a gestão da qualidade. A certificação CE aplica-se aos modelos destinados ao mercado da UE; o âmbito é confirmado para cada projeto. A documentação de conformidade REACH e RoHS é fornecida com cada encomenda OEM.'
    - q: Qual é o prazo de entrega típico para uma encomenda OEM?
      a: 'O prazo de entrega padrão é de 25–35 dias a partir da PO e do sinal confirmados para a produção OEM em volume. O design de formas personalizadas acrescenta 15–20 dias para a criação do molde. A produção expressa está disponível para encomendas urgentes e picos sazonais. As amostras de protótipo ficam normalmente prontas em 7–12 dias.'
    - q: Gerem a documentação comercial de exportação?
      a: 'Sim. A nossa equipa gere internamente a documentação comercial de exportação e o desalfandegamento, e expedimos para mais de 50 países nos mercados da UE, EUA, AU e asiáticos.'

b2b_moq: 'MOQ confirmado com base na configuração do projeto: amostra 1–2, piloto 20–50, quantidade 90–100+ (por bobina de 150 m); co-branding em pequenos lotes a partir de 5–10 unidades.'

production_flow:
  tagline: Fluxo de produção
  title: Do material à prancha acabada
  subtitle: Cada prancha passa por 6 fases de produção com pontos de controlo QC em cada passo. Sem atalhos, sem inspeções saltadas.
  stages:
    - stage: '01'
      title: Entrada de mercadorias & QC de entrada
      description: 'Todos os materiais de entrada são registados no nosso sistema ERP com número de lote. As bobinas de tecido PVC, os núcleos drop-stitch, as válvulas, os adesivos e os acessórios são mantidos em quarentena até à libertação QC.'
      qc_check: 'Resistência à tração (ASTM D751), resistência ao rasgamento (ISO 4674), medição de espessura, viscosidade dos adesivos, leitura de defeitos visuais'
      qc_threshold: '100% dos lotes testados. Rejeição se resistência à tração < 90% da especificação, resistência ao rasgamento < mínimo de spec. ou presença de um defeito visual'
      responsibility: Equipa QC de entrada (3 inspetores)
    - stage: '02'
      title: Corte CNC & preparação de materiais
      description: 'O aninhamento otimizado por computador dispõe os painéis sobre a matéria-prima PVC para minimizar os desperdícios. As cortadoras automáticas CNC mantêm uma precisão de posicionamento de 0.1 mm.'
      qc_check: 'Verificação dimensional contra os ficheiros CAD-DXF, inspeção da qualidade dos bordos, verificação do número de painéis'
      qc_threshold: 'Medido a cada 20.º painel. Tolerância ±0.5 mm. Rejeitar o lote se >2% fora de tolerância'
      responsibility: Chefe da oficina de corte
    - stage: '03'
      title: Soldadura & colagem drop-stitch
      description: 'Os núcleos drop-stitch são colados aos laminados externos em PVC através de laminação a quente. As câmaras são soldadas com HF ou ar quente. As bandas de rail são coladas por fusão de três camadas.'
      qc_check: 'Teste de peeling a cada 50 unidades (ASTM D751), medição da largura da soldadura, verificação do log de temperatura do ar quente, inspeção visual das costuras à contraluz'
      qc_threshold: 'Resistência ao peeling mín. 8 N/cm. Tolerância da largura da soldadura ±1 mm. Ranhura visível = rejeição'
      responsibility: QC de soldadura (2 inspetores por turno)
    - stage: '04'
      title: Montagem & equipamento
      description: 'As pranchas entram na montagem final onde convergem todos os componentes: painéis de deck e casco soldados, válvulas instaladas, argolas em D, pegas, fin boxes e bolsa de transporte montados. Cada unidade segue uma checklist de montagem de 100 pontos.'
      qc_check: 'Libertação da checklist de 100 pontos por unidade, teste funcional da válvula (10 ciclos abertura/fecho), verificação do torque dos acessórios, inspeção visual'
      qc_threshold: 'Política de zero defeitos nos componentes críticos para a segurança (válvulas, argolas em D, pegas). Cosmética menor: AQL 2.5 (ISO 2859)'
      responsibility: Chefe de equipa de montagem + QC de linha
    - stage: '05'
      title: Teste de pressão & bloqueio de qualidade
      description: 'Cada câmara é insuflada a 18.0 PSI (para um SUP com rating de 12–15 PSI) e mantida durante 24 horas. Os sensores de pressão registam em modo contínuo. As câmaras com uma queda de pressão superior a 0.50 PSI são rejeitadas e enviadas ao re-controlo das costuras.'
      qc_check: 'Registo da manutenção de pressão 24h, calibração dos sensores verificada diariamente, medição de pressão compensada em temperatura, teste das costuras após reparação'
      qc_threshold: 'Máx. 0.50 PSI de queda de pressão em 24h a temperatura estável. Cada câmara que exceda isto = novo teste a 100% de todo o lote de produção'
      responsibility: Laboratório de qualidade (independente da produção, reporta à direção)
    - stage: '06'
      title: Controlo final & embalagem
      description: 'Controlo visual e funcional final. Defeitos superficiais, coerência da cor, verificação de etiquetas/BIN, integridade da embalagem e completude dos acessórios. As unidades são embaladas a vácuo, colocadas em cartões e paletizadas em camadas para o carregamento em contentor.'
      qc_check: 'Inspeção visual completa, checklist de acessórios por SKU, drop test de embalagem (1 m, amostra), verificação da leitura de etiquetas/códigos de barras'
      qc_threshold: 'AQL 2.5 para defeitos graves, AQL 4.0 para defeitos ligeiros. Tolerância zero para defeitos de segurança. 100% das unidades inspecionadas visualmente'
      responsibility: Equipa QC final (4 inspetores) + chefe de equipa de embalagem

