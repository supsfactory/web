answer:
  label: 'Suora vastaus'
  text: 'Drop-stitch on kangas, jonka polyesterilankojen pilarit pitävät ylä- ja alimmaiset PVC-kerrokset kiinteällä etäisyydellä toisistaan, jolloin ilmanpaine tekee laudasta jäykän. Vatradin ytimet: 1,680 DTEX, 2 lankaa neliötuumessa, 1.2 mm PVC-ulko-laminointi, mitoitettu 15 PSI:iin ja validoitu 24 tunnin pitotestillä 18.0 PSI:n paineella.'
  verified: 'September 2026'

