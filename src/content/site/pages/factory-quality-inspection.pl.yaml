  title: Pobierz przykładowy pakiet jakości i szablony protokołów
  subtitle: 'Standardowe kontrolowane szablony stosowane w projektach OEM/ODM — zorganizowane jako rejestr dokumentów 00–15 (indeks projektu, zatwierdzona specyfikacja, BOM, odwołania do projektu graficznego i pakowania, QIP, zapisy inspekcji, NCR, kontrola zmian, brief dla strony trzeciej, podsumowanie zatwierdzenia).'
  features:
    - icon: P
      icon_bg: blue
      title: Pakiet dokumentacji jakościowej (PDF)
      desc: 'Pełna kontrolowana struktura dokumentów 00–15: indeks projektu, specyfikacja, BOM, odwołania do projektu graficznego i pakowania, Plan Kontroli Jakości (QIP), zapisy inspekcji, NCR, kontrola zmian, brief dla strony trzeciej i podsumowanie zatwierdzenia przed wysyłką.'
      link: 'https://assets.isupfactory.com/site/downloads/Qingdao_Vatrad_Group_SUP_Quality_Documentation_Pack.pdf?dl=1'
