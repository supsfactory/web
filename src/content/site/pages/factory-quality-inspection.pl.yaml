      icon_bg: green
      title: Brief dla inspekcji strony trzeciej (PDF)
      desc: 'Jednostronicowy brief dla inspektorów SGS / BV / Intertek / QIMA: ilość zamówienia, poziom próbkowania AQL, obowiązujące rewizje oraz punkty kontrolne o kluczowym znaczeniu dla jakości, w tym weryfikacja zapisu szczelności powietrznej, próba utrzymania ciśnienia, kompletność zestawu, skan kodu kreskowego i próba upadkowa kartonu.'
      link: 'https://assets.isupfactory.com/site/downloads/Third_Party_Inspection_Brief_Template.pdf?dl=1'
