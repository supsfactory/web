      link: 'https://assets.isupfactory.com/site/downloads/air-tightness-rework-instruction-wi-qc-at-001.pdf?dl=1'
      link_label: Pobierz PDF
    - icon: M
      icon_bg: green
      title: Indeks kart metod (PDF)
