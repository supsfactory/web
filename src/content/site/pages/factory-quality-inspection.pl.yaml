      desc: 'Formalna kontrola zmian wg ISO 9001 dla parametrów naprawy: ECR, klasyfikacja ryzyka, międzydziałowa macierz zatwierdzeń, 9-etapowa pętla zamknięta, ilościowa walidacja inżynierska i zabezpieczenia Poka-Yoke — z dwujęzycznym SOP QMS-SOP-QC-CC-001 Rev 2.0.'
      link: '/pl/factory/quality-change-control'
      link_label: Zobacz stronę
    - icon: N
      icon_bg: blue
      title: Kontrola produktów niezgodnych (strona)
      desc: 'Kontrola produktów niezgodnych wg ISO 9001:2015 punkt 8.7: rejestracja NCR, izolacja, uprawnienia do decyzji zależne od wagi wady, kontrolowana naprawa według SRI, niezależna ponowna inspekcja i niszczenie w asyście świadków archiwizowane w formie skrótów SHA-256 — z możliwością pobrania dwujęzycznego SOP i świadectwa utylizacji.'
      link: '/pl/factory/non-conforming-control'
      link_label: Zobacz stronę

faqs:
  tagline: FAQ
  title: Najczęstsze pytania o kontrolę jakości SUP
  items:
    - q: 'Jak QINGDAO VATRAD GROUP.,LTD. kontroluje jakość nadmuchiwanych desek SUP?'
      a: 'Jakość jest kontrolowana poprzez inspekcję materiałów przychodzących, punkty kontrolne procesu produkcji, weryfikację produktu końcowego, inspekcję opakowania oraz identyfikowalność produkcji —każdy element realizowany względem zatwierdzonych dla projektu próbek, specyfikacji i kryteriów inspekcji.'
    - q: 'Jakie kontrole jakości są wykonywane podczas produkcji SUP?'
      a: 'Kontrole obejmują weryfikację materiałów, sprawdzenie cięcia i druku, inspekcję budowy deski, weryfikację montażu zaworu, inspekcję akcesoriów, badania szczelności powietrznej, kontrolę wyglądu oraz weryfikację opakowania.'
    - q: 'Czy klienci OEM mogą żądać zapisów inspekcji SUP?'
      a: 'Tak. Zapisy inspekcji i dokumentacja jakościowa mogą być udostępniane zgodnie z wymaganiami projektu i umową jakościową klienta, w tym przykładowe raporty z inspekcji przed wysyłką.'
    - q: 'Jak fabryka zapewnia powtarzalność produkcji OEM?'
      a: 'Powtarzalność produkcji jest utrzymywana dzięki zatwierdzonym próbkom, specyfikacjom technicznym, punktom kontrolnym produkcji, procedurom inspekcji oraz udokumentowanym procesom kontroli jakości powiązanym z każdym zamówieniem.'
    - q: 'Czy mogę zorganizować inspekcję strony trzeciej przez SGS, BV, Intertek lub QIMA?'
      a: 'Tak. Zapraszamy inspektorów zewnętrznych, zapewniając dedykowany obszar inspekcji, wzorcowane manometry, wcześniej wypełnione briefy inspekcyjne i dostępne zapisy. Prześlij swoją specyfikację, zatwierdzoną próbkę, projekt graficzny, wymagania opakowaniowe i kryteria wad —lub skorzystaj z naszego szablonu Briefu dla inspekcji strony trzeciej.'
    - q: 'Jak obsługiwane są zmiany projektu graficznego, BOM lub opakowania w trakcie produkcji?'
      a: 'Zmiany są rejestrowane w naszym Rejestrze kontroli zmian wraz z narażoną rewizją dokumentu, podsumowaniem zmiany, powodem, oceną skutków, statusem zgody klienta i partią obowiązującą. Nieaktualne wersje są wycofywane, aby produkcja i inspekcja zawsze korzystały z bieżących zatwierdzonych dokumentów.'
    - q: 'Czy fabryka obsługuje zindywidualizowane projekty nadmuchiwanych desek SUP?'
      a: 'Tak. Zindywidualizowane projekty OEM/ODM nadmuchiwanych desek SUP są realizowane na podstawie specyfikacji klienta, wymagań dotyczących projektu graficznego, konfiguracji akcesoriów i potrzeb opakowaniowych, przy czym kryteria inspekcji właściwe dla projektu są uzgadniane przed produkcją.'
    - q: 'Czy przeciekającą deskę SUP można naprawić w fabryce?'
      a: 'Tak —w warunkach kontrolowanych. Deska jest umieszczana w statusie HOLD i powiązana z NCR, przeciek lokalizuje się zatwierdzoną metodą diagnostyczną, a naprawa przebiega dopiero po autoryzacji QC/Inżynierii i wyłącznie w obrębie klas wad zatwierdzonych do naprawy. Następnie deska jest ponownie sprawdzana względem tych samych kryteriów akceptacji, co deska zgodna, przed zatwierdzeniem.'
    - q: 'Ile razy fabryka może naprawić deskę?'
      a: 'Pojedyncze miejsce można naprawić raz według autoryzowanej instrukcji. Jeśli ponowna inspekcja nadal zawodzi, deska jest kierowana do wymiany, odrzucenia, utylizacji lub uzgodnienia z klientem —powtarzająca się naprawa bez udokumentowanego zatwierdzenia nie jest dozwolona.'

