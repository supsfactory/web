      desc: 'Rejestr kontroli zmian obejmujący projekt graficzny, zatwierdzony przez klienta BOM oraz rewizje oznaczeń kartonu —z podsumowaniem zmiany, powodem, oceną skutków, statusem zgody klienta, partią obowiązującą i wycofaniem nieaktualnych dokumentów.'
      link: 'https://assets.isupfactory.com/site/downloads/Change_Control_Protocol_Bilingual.pdf?dl=1'
