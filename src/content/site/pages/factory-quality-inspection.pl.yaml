      title: Podsumowanie zatwierdzenia przed wysyłką (PDF)
      desc: 'Jednostronicowy podpis zatwierdzenia: weryfikacja bramek jakości (IQC, IPQC, szczelność powietrzna, inspekcja końcowa, pakowanie), status otwartych NCR oraz autoryzowana decyzja o zatwierdzeniu podpisana przez jakość i operacje.'
      link: 'https://assets.isupfactory.com/site/downloads/Pre_Shipment_Release_Summary_Bilingual.pdf?dl=1'
      link_label: Pobierz PDF
    - icon: W
