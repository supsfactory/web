intro: |
  <p><strong>Vatrad</strong> toimii <strong>Qingdao Vatrad Group Co., Ltd.</strong> meriteollisuuden valmistusdivisioonana ja sijaitsee Laixin talouskehitysvyöhykkeessä, Qingdaossa, Shandongissa, Kiinassa. Yritys perustettiin vuonna 2012 erikoistuneena vesilliketehtaana, joka oli sitoutunut meriteollisuuden käsityöhön, ja on kasvanut sertifioiduksi tehdasksi, joka palvelee OEM- ja ODM-asiakkaita yli 50 maassa.</p>
  <p>iSupfactory on Vatrad-tehtaan B2B-kehitysosasto. Jokainen iSupfactoryn projekti — aina ensimmäisestä näytteestä tai pienestä yhteisbrändätystä erästä aina täyteen private label -tuotelinjaan — valmistetaan samassa laitoksessa, samoilla tiimeillä ja saman laadunhallintajärjestelmän alaisuudessa, joka tässä kuvataan.</p>
  <p>Tehdas kattaa 12,500 m² ja siellä on erilliset työpajat PVC-leikkausta, drop-stitch-ydinten kokoonpanoa, korkeataajuushitsausta, lautojen kokoonpanoa sekä testialue ilman säilymisen, paineen säilymisen ja sauman lujuuden tarkistuksiin. Tuotantokapasiteetti ylittää 120,000 puhallettavaa yksikköä vuodessa, ja laitos toimii ISO 9001 -laadunhallinnan alaisena, vietävissä tuotteissa CE-, BSCI- ja REACH-vaatimustenmukaisuudella sekä Yhdysvaltain rannikkoviraston (USCG) hyväksynnällä.</p>
  <p>Yli 350 taitavaa työntekijää ja 14+ R&amp;D-insinööriä tukevat kahta SUP-brändeille tärkeää työaluetta: suunnittelua (runkomuotoilu, materiaalien valinta, prototyypit) ja tuotantoa (kuvioiden paino, kokoonpano, tarkastus, vientipakkaus). Tehtaan sisäinen tuotantokehityskeskus, jossa on PVC-kangaslaboratorio ja testiallas, käsittelee räätälöidyt muotit ja rakenteiden validoinnin ennen sarjatuotannon aloittamista.</p>
