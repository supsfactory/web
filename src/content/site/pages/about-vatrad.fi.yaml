values_section:
  title: Näin tehdas toimii brändien kanssa
  subtitle: 'Kolme periaatetta, jotka muovaavat jokaisen Vatrad-tehtaan rakentaman projektin.'
  columns: 3
  items:
    - title: Suunnittelu ennen tuotantoa
      description: 'Jokainen projekti alkaa vaatimuksilla, piirustuksilla ja fyysisellä näytteellä — runkomuoto, drop-stitch-luokka, kuvioiden sijainti ja pakkaus validoidaan ennen mitään tuotantoerää, eivät havaita linjalla.'
      icon: 'tabler:settings'
    - title: Yksi tiimi, yksi laitos
      description: 'Suunnittelu, leikkaus, hitsaus, kokoonpano ja testit tapahtuvat yhdessä 12,500 m² laitoksessa. Ei kauppaa käyvän yhtiön välikkeitä: kysymyksiisi vastaavat samat henkilöt, jotka rakentavat lautoasi.'
      icon: 'tabler:building-factory-2'
    - title: Pienet ensierät
      description: 'Pienimuotoinen yhteisbrändäys alkaa 5–10 kpl, ja vakiintunut sarjatuotanto ajaa 90–100+ kpl erää kohden (yksi 150 m drop-stitch-rulla), joten brändit validoivat markkinat ennen skaalausta — työkalut ja kuviot säilytetään uusintatilauksia varten.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Mitä tehdas toimittaa
  subtitle: iSupfactoryn asiakkaille saatavilla olevat valmistuspalvelut.
  columns: 2
  items:
    - title: Räätälöity SUP-kehitys
      description: 'Vaatimusten arviointi, määrittely, materiaalien valinta, kuviot, prototyypit, näytteen hyväksyntä ja tuotanto räätälöityjen puhallettavien SUP-tuotteiden osalta.'
      icon: 'tabler:bulb'
    - title: Private label -tuotanto
      description: 'Oma logosi, värisi ja pakkauksesi vakiintuneilla kaupallisilla tuotepohjilla — lauta, kansi, lisävarusteet ja pakkilaatikot kantavat yrityksesi identiteettiä, ilman tehtaan brändiä.'
      icon: 'tabler:tag'
    - title: OEM / ODM-valmistus
      description: 'Täysi OEM- ja ODM-valmistus puhallettavista SUP-laudoista asiakkaan piirustusten tai yhteisesti kehitettyjen mallien mukaan, mukaan lukien räätälöidyt muotit uusiin lautumuotoihin.'
      icon: 'tabler:package'
    - title: Kalustotilausten toimitus
      description: 'Brändätyt lauttakannukset resorteille, seuroille, kouluille ja vuokraustoimijoille, sovituslisävarustein ja lauttakannukoille soveltuvin tuotantoerillä.'
      icon: 'tabler:users-group'
certifications_section:
  title: 'Sertifiointi ja vaatimustenmukaisuus'
  subtitle: 'Tehdas vie tavaroita EU:hun, Yhdysvaltoihin ja Aasian ja Tyynenmeren alueelle dokumentoidun vaatimustenmukaisuusjärjestelmän alaisena.'
  columns: 2
  items:
    - title: CE-sertifiointi
      description: 'Puhallettavien SUP-lautojen ja vesillikkeiden tuotelinot noudattavat EU:n turvallisuusdirektiivejä, ja dokumentit toimitetaan jokaiselle markkinalle.'
      icon: 'tabler:certificate'
    - title: ISO 9001 -laadunjärjestelmä
      description: 'Valmistuslaitos toimii ISO 9001 -laadunhallintajärjestelmän alaisena, joka kattaa saapuvat materiaalit, valmistuksen aikaiset tarkastukset ja lopputarkastuksen.'
      icon: 'tabler:badge-check'
    - title: BSCI-yhteiskunnallinen vaatimustenmukaisuus
      description: 'Yhteiskuntavastuu auditoidaan BSCI:n mukaisesti, kattaen työolot ja tehtään vaatimustenmukaisuuden.'
      icon: 'tabler:shield-check'
    - title: REACH-materiaalivaatimustenmukaisuus
      description: 'Materiaalit täyttävät EU:n REACH-asetuksen kemikaaliturvallisuutta koskevat vaatimukset.'
      icon: 'tabler:flask'
    - title: USCG-hyväksyntä
      description: 'Yhdysvaltain rannikkoviraston hyväksymä tuotanto puhallettavien vesillikkeiden tuotelinjoille.'
      icon: 'tabler:anchor'
    - title: Tuotetestaus
      description: 'Kantavuus, kuormituskyky, sauman lujuus, UV-kestävyys, hankauskestävyys ja paineen säilyminen testataan jokaisella tuotantolinjalla.'
      icon: 'tabler:test-pipe'
