answer:
  label: 'Közvetlen válasz'
  text: 'A nem megfelelő termékeket a QINGDAO VATRAD GROUP.,LTD.-nél soha nem rejtjük el, nem dolgozzuk fel informálisan, és nem engedélyezzük ellenőrzés nélkül. Minden azonosított nem megfelelést nyilvántartásba vesszük az érintett termékhez, lothoz vagy alkatrészhez, és NCR-hez kötjük. A tételt címkezzük (HOLD / QUARANTINE / REJECTED), fizikailag elkülönítjük, és az érintett hatókör értékelése lot, anyaglot, folyamatlépés és dokumentumrevízió szerint történik. A kivétel intézkedését a hiba súlyosságának megfelelő hatósági szinten hozzuk meg: a kisebb problémákat soron írjuk alá, a súlyosabbaknál a Minőségbiztosítási Vezető és egy Műszaki Mérnök döntése, ellenőrzött újrafeldolgozási utasítás és 100%-os független újraellenőrzés szükséges, a kritikusaknál pedig az Anyagvizsgálati Tanács döntése, szükség esetén az ügyfél írásbeli jóváhagyásával – ellenkező esetben kötelező megsemmisítés tanúk jelenlétében. Az újrafeldolgozott tételeket az eredeti elfogadási kritériumokhoz képest újraellenőrizzük, a légtömörségi javítások teljesen új 24 órás nyomáspróbát kapnak, és a szállítási engedélyezés csak a minőségügy jóváhagyó aláírása után történik. Az ismétlődő vagy rendszerszintű problémák gyökérok alapú korrekciós intézkedéseket (CAPA) váltanak ki.'
  verified: '2026. szeptember'

