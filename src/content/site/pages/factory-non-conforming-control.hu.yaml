faqs:
  tagline: GYIK
  title: 'Gyakori kérdések a minőségről és a hibakezelésről a nemzetközi vevők részére'
  items:
    - q: 'Hogyan garantálják, hogy az újrafeldolgozott deszkák megfelelnek a teljes biztonsági szabványoknak?'
      a: 'Minden újrafeldolgozott deszkát új egységként kezelünk, és pontosan ugyanazt a teljes vizsgálati ciklust kell végigjárnia, nulláról – a légtömörségi javításoknál ez egy teljes, 24 órás nyomáspróbát jelent. Az engedélyezési validációt független minőség-ellenőrző vizsgálók végzik, nem azok a kezelők, akik az újrafeldolgozást végezték.'
    - q: 'A gyár kisebb kozmetikai eltérésekkel rendelkező deszkákat szállít-e anélkül, hogy értesítenének minket?'
      a: 'Soha. Bármely eltérés, amely érinti az ügyfél által jóváhagyott referenciamintákat, a logó grafikáját, a színváltozatokat vagy a csomagolást, formális, írásbeli, ügyfél által aláírt Engedélyezési Megállapodást (Concession Agreement) igényel a szállítási engedélyezés előtt.'
    - q: 'Mi történik, ha egy újrafeldolgozott deszka nem felel meg az újraellenőrzésnek?'
      a: 'A deszkát nem engedélyezzük. Visszatér egy új intézkedési elemzéshez, és ha nem tehető megfelelővé, akkor a roncskezelési protokoll szerint, tanúk jelenlétében cseréljük, elutasítjuk vagy megsemmisítjük. Ugyanazon hibacsoport ismétlődő meghibásodása gyökérok alapú CAPA intézkedést indít.'
    - q: 'Értékesíthetők-e a hibás deszkák gyári túladásként vagy más csatornákon?'
      a: 'Nem. A nem megfelelő, nem javítható deszkákat a roncskezelési protokoll szerint, tanúk jelenlétében fizikailag megsemmisítjük – a fémalkatrészeket levágjuk, a magot és az éleket átvágjuk, a folyamatot SHA-256 pecsételt videóval rögzítjük, és legalább 5 évre archiváljuk. A Roncs- és Megsemmisítési Bizonylatot a QA-igazgató és a Gyár-igazgató írja alá.'
    - q: 'Hogyan értékelik ki az érintett hatókört, amikor hibát találnak?'
      a: 'A hatókört a termék azonosítása, a gyártólot, az anyaglot vagy alkatrész, a folyamatlépés és az alkalmazandó dokumentumrevízió alapján elemezzük. Ha ugyanaz az anyaglot, ugyanaz a grafikai revízió vagy ugyanaz a munkahely érintett, az érintett termékeket ennek megfelelően korlátozzuk és ellenőrizzük.'
    - q: 'Szükséges-e a jóváhagyásunk egy engedély megadása előtt?'
      a: 'Igen. Bármely, a vevő igényeit érintő dokumentált engedélyezés – jóváhagyott minták, specifikációk, grafika, csomagolás vagy elfogadási kritériumok – az ügyfél írásbeli jóváhagyását igényli az engedélyezés előtt. Ennek hiányában a terméket az eredeti igény szerint újrafeldolgozzuk, cseréljük vagy elutasítjuk.'
    - q: 'Milyen dokumentációt kapunk egy nem megfelelésről?'
      a: 'Az NCR-nyilvántartás tartalmazza az NCR-számot, az észlelés szakaszát, a terméket/SKU-t, a lótot, az alkalmazandó dokumentumok revízióit, a hiba leírását, a hatáscsökkentést, a fogadott intézkedést, az újrafeldolgozási utasítás hivatkozását, az újraellenőrzés eredményét és az engedélyezési vagy lezárási jóváhagyást – elérhető a projekt minőségi megállapodása szerinti hatókörben.'

