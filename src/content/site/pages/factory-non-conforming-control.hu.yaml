nc_intro:
  tagline: Nem megfelelő termékek kezelése
  title: Mi történik, ha egy termék nem felel meg a kritériumoknak
  body: |
    Azokat a termékeket és alkatrészeket, amelyek nem felelnek meg a meghatározott elfogadási kritériumoknak, azonosítjuk és kezeljük, hogy megakadályozzuk a nem szándékolt felhasználást, a további feldolgozást vagy a szállítást. Az alkalmazandó elfogadási kritériumok a jóváhagyott mintán, a műszaki specifikáción, a grafikán, az anyaglista-hoz, a csomagolási igényeken és a projekt vizsgálati tervén alapulnak.

    A nem megfelelő tételeket értékeljük az érintett hatókör és a megfelelő intézkedés meghatározásához. A problémától függően a tétel visszatartható, a jóváhagyott utasítások szerint újra feldolgozható, cserélhető, elutasítható vagy másképpen kezelhető egy jóváhagyott folyamat szerint. Az újrafeldolgozott vagy kijavított tételeket engedélyezés előtt újraellenőrizzük. A szállítási engedélyezés csak a releváns minőségi nyilvántartások kitöltése és a termék alkalmazandó elfogadási kritériumoknak való megfelelése után engedélyezett.

nc_flow:
  tagline: A 7 lépéses zárt kör szabványa
  title: Az azonosítástól a korrekciós intézkedésig
  subtitle: 'Minden nem megfeleléshez egyetlen szabályozott kör: azonosítás, karantén, elemzés, újrafeldolgozás vagy csere, újraellenőrzés, engedélyezés vagy elutasítás, fejlesztés.'
  steps:
    - step: '01'
      title: Azonosítás
      desc: 'Minden azonosított nem megfelelést nyilvántartásba vesszük az érintett termékhez, lothoz vagy alkatrészhez, és értékeljük a projekt alkalmazandó igényeihez képest. Az észlelés történhet az anyagok átvételekor, a folyamatközi ellenőrzéskor, a végső vizsgálatkor, csomagoláskor, illetve az ügyfél vagy harmadik fél által végzett vizsgálat során.'
    - step: '02'
      title: Karantén
      desc: 'A tételeket egyértelműen azonosítjuk és ellenőrzött visszatartási vagy karantén állapotba helyezzük, hogy megakadályozzuk a nem szándékolt felhasználást, a további feldolgozást vagy a szállítást. A HOLD / QUARANTINE / REJECTED címkék tartalmazzák az NCR-számot, az SKU-t, a lótot, a mennyiséget, a hiba leírását és a dátumot.'
    - step: '03'
      title: Elemzés
      desc: 'Értékeljük az érintett hatókört és a megfelelő intézkedést: egyedi darab, fordulólot, teljes lot vagy több lot – beleértve a megosztott anyaglombok, a grafikai revíziók, a folyamatlépések és a dokumentumrevíziók szintjén. Ahol szükséges, további hatáscsökkentő intézkedéseket vagy szigorított vizsgálatot alkalmazunk.'
    - step: '04'
      title: Újrafeldolgozás vagy csere
      desc: 'Az engedélyezett újrafeldolgozás a jóváhagyott utasítások szerint zajlik, amelyek meghatározzák az érintett tételt, a módszert, az anyagokat, az ellenőrzési pontokat és az újraellenőrzési igényeket. A termékspecifikáció, a grafika, a kiegészítőkonfiguráció vagy a csomagolás jóváhagyatlan módosítása soha nem engedélyezett. A cserélt tételekek visszakerülnek az alkalmazandó ellenőrzési pontokhoz.'
    - step: '05'
      title: Újraellenőrzés
      desc: 'Az újrafeldolgozott vagy kijavított tételeket az alkalmazandó elfogadási kritériumokhoz képest újraellenőrizzük. Az eredetileg meghibásodott jellemzőt és az újrafeldolgozás által esetlegesen érintett kapcsolódó jellemzőket engedélyezés előtt ellenőrizzük – a független minőség-ellenőrzés részéről, és a légtömörségi javításoknál teljesen új, 24 órás nyomáspróbával.'
    - step: '06'
      title: Engedélyezés vagy elutasítás
      desc: 'A termék csak a szükséges újraellenőrzés befejezése és az engedélyezett minőségi személyzet megfelelés-megerősítése után engedélyezhető. Azokat a tételeket, amelyeket nem lehet megfelelővé tenni, a szabályozott eljárások szerint elutasítjuk, cseréljük, visszaküldjük vagy kivesszük – beleértve a tanúk jelenlétében végzett fizikai megsemmisítést.'
    - step: '07'
      title: Korrekciós intézkedés
      desc: 'Az ismétlődő, jelentős vagy rendszerszintű nem megfeleléseket gyökérok és korrekciós intézkedés (CAPA) szempontjából elemezzük. A fejlesztések magukban foglalhatják a munkautasítások, az anyagellenőrzések, az ellenőrzési pontok, a képzés, a beszállítókezelés vagy a dokumentumkezelés frissítését.'

