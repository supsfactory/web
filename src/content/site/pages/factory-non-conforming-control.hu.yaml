nc_matrix:
  tagline: 'A mérnöki protokollok mátrixa'
  title: A SUP hibák intézkedési és újraellenőrzési mátrixa
  subtitle: 'A leggyakoribb gyártási eltérésekre alkalmazott szabványos technikai protokollok – ugyanazok a számszerű paraméterek, amelyeket az ügyfelek az auditok során ellenőrizhetnek.'
  headers:
    defect: Hibakategória
    protocol: 'Szabályozott intézkedési protokoll'
    validation: 'Újraellenőrzés és független validáció'
  rows:
    - defect: 'Lassú szivárgás a szelepnél'
      protocol: 'Válassza le a deszkát. Szerelje le a szelepmagot kalibrált nyomatékkulccsal (25 N·m), tisztítsa meg a belső meneteket, cserélje ki a szilikongyűrűt, és alkalmazza újra a nyomatékot.'
      validation: 'Merítse buborékkalépbe; fújja újra 18 PSI-re a nyomáscsökkenés teljes, 24 órás újrateszteléséhez (ΔP ≤ 0.05 PSI).'
    - defect: 'Légbuborék az élvarratnál'
      protocol: 'Helyezze karanténba a fordulólotot. Válassza le a buborékos területet hőbeadásos fúvókával, tisztítsa meg a felületet oldószerrel, vigye fel kétkomponensű PU ragasztót 5 bar nyomáson.'
      validation: 'A varratok 100%-os vizuális és tapintásos vizsgálata; szerkezeti ellenőrző nyomáspróba (18.0 PSI) és 24 órás légtömörségi nyomástartás.'
    - defect: 'Az EVA pad eltérése'
      protocol: 'Hőbeadásos leválasztás szabályozott hőmérsékletű szerszámmal (80°C). Igazítsa be pontos akril pozicionálósablonnal.'
      validation: 'A hézagtűrések ellenőrzése (≤ ±1,5 mm), a rombos minta szimmetriájának ellenőrzése, 100%-os élragasztási próba.'
    - defect: 'Márkázási / logóhiba'
      protocol: 'A nyomtatósor azonnali leállítása. Vezessen vissza minden kinyomtott panelt. Elemezze a vektoros revíziót az ügyféllel együtt; nulla jóváhagyatlan módosítás.'
      validation: 'Színellenőrzés spektrofotométerrel (ΔE ≤ 1,5); a szövegillesztés 100%-os vizuális ellenőrzése az ügyfél által aláírt mester vektoros PDF-fájlhoz képest.'
    - defect: 'Csomagolási nem megfelelés / hiányzó SKU'
      protocol: 'Helyezze karanténba az exportraklapot. Bontsa ki a csomagokat, és végezzen 100%-os tételes anyaglista-ellenőrzést (pumpa, uszony, kötél, ezenyél, javítócső).'
      validation: 'Beépített dinamikus elektronikus mérleg validációja (±30 g eltérés); ellenőrzés 2D vonalkódolvasóval.'

nc_scrap:
  tagline: 'Nulla szivárgás a piac felé'
  title: 'Roncs és megsemmisítés tanúk jelenlétében – nulla hibát eredményező anti-divergencia protokoll'
  body: |
    A nemzetközi márkapartnereknek biztosaknak kell lenniük abban, hogy a hibás deszkák soha nem kerülnek másodlagos kiskereskedelembe, párhuzamos piacokra vagy elektronikus kereskedelmi csatornákon. Azokat a deszkákat, amelyeket nem lehet megfelelővé tenni, tanúsított protokoll szerint, tanúkkal és nyilvántartással semmisítjük meg:

    **1. A fémalkatrészek és kiegészítők levágása.** A QA-igazgató felügyelete alatt egy hidraulikus olló eltávolítja az összes 316 rozsdamentes acél D-gyűrűt, a szállítófogantyú pántjait és a csomagpántokat. A felfújt szelepegységet és az usnyszám dobozát (US-Box / gyorsrögzítő uszony) a deszka tövénél levágjuk, így egyetlen visszanyerhető alkatrész sem marad.

    **2. A drop-stitch mag és az élek átvágása.** A belső drop-stitch magot keresztben, a deszkán és a fedélzeten át vágjuk, mély, keresztben futó vágásokkal (≥ 50 cm vágásonként), a megerősített oldaléleket pedig legalább 4 szegmensre bontjuk – véglegesen megszüntetve a tömörségi és lebegőképességi képességet.

    **3. Videó- és fényképeszaf. A megsemmisítést 1080p, nem vágott videóval rögzítjük, amely a sorozatszám részleteiről, a vágási folyamatról, a mag átvágásáról és a lemért végső roncs halomról készült részletes felvételeket tartalmazza. A videót pecsételjük (SHA-256), és ≥ 5 évre egy ellenőrzött kiszolgálón őrizzük.

    **4. Tanúsított hulladékkezelés.** Minden PVC- és drop-stitch-törmeléket lemérünk, a kimeneti nyilvántartásba vezetünk, és kizárólag minősített polimer-újrahasznosító partnerek szállítják – egyetlen maradék sem távozik más úton az üzemből.

    > **Márkavédelmi garancia:** a QINGDAO VATRAD GROUP CO., LTD. garantálja a nem megfelelő, nem javítható járművek 100%-os megsemmisítését. Sem egyetlen gyári másodperc, sem egyetlen károsodott deszka nem jut el valaha másodlagos kiskereskedelembe, párhuzamos piacokra vagy elektronikus kereskedelmi csatornákon. a Roncs- és Megsemmisítési Bizonylat (VAT-QA-SCRAP-CERT-2026) rögzíti a terméket, a lótot, az MRB következtetését, a tanúkkal készült fényképeket, valamint a QA-igazgató és a Gyár-igazgató kettős aláírását.

