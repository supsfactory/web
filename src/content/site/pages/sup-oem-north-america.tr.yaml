answer:
  label: 'Doğrudan cevap'
  text: 'Kuzey Amerikalı markalar şişirilebilir SUPyi iSupfactoryden standart koşullarla sipariş eder: MOQ, proje yapılandırmasıyla belirlenir — 1–2 adetlik numune partileri yapıyı doğrular, mevcut platformlarda 20–50 adetlik pilot partiler pazarı test eder, standart hacimli üretim ise tam 150 m drop stitch rulosundan tasarım başına 90–100+ adet çalışır. İlk numune, teknik özellik onayından 7–12 gün sonra sevk edilir; üretim, kesinleşen sipariş ve depozitodan 25–35 gün sonra tamamlanır, deniz navlunu ise ABD veya Kanada limanlarına 4–6 hafta ekler. DDP, gümrükleme ve deponuza teslimi kapsar.'
  verified: 'Eylül 2026'

