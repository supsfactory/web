why_north_america:
  tagline: 'ABD ve Kanada alıcıları neden tercih ediyor'
  title: 'Kuzey Amerika İthalatı İçin Tasarlandı'
  subtitle: 'Fabrika, Amerikalı ve Kanadalı markaların ilk konteynerlerinden önce sorduğu sorulara yanıt verir.'
  items:
    - title: 'Öngörülebilir maliyet için DDP'
      description: 'DDP, gümrükleme ve deponuza teslimi kapsar — gümrük vergileri, vergiler ve navlun tek bir toplamda. İlk kez ithalat yapanlar için en popüler seçenek.'
    - title: 'Hedef pazarınıza yönelik belgeler'
      description: 'CE, REACH ve gümrük belgeleri onaylanan numuneyle birlikte hedef pazarlarınız için hazırlanır; böylece ürün dosyanız ihracata hazır olur.'
    - title: 'Kendi nakliye ortağınızla FOB Qingdao'
      description: 'Düzenli ithalat mı yapıyorsunuz? FOB Qingdao seçeneğini kullanın ve kendi lojistik ortağınızdan yararlanın — konteyneri biz yükler ve belgelerini düzenleriz, geri kalanı siz kontrol edersiniz.'
    - title: 'Tek fabrika, tek kalite sistemi'
      description: 'Geliştirme, numune, üretim ve kalite kontrolün tamamı 12.500 m² tesis içinde gerçekleşir — aracıya dönüş yok, üretimin karşılayamadığı numune yok.'

process_notes:
  tagline: 'Nasıl çalışır'
  title: 'Teknik Özellikten Konteynere'
  subtitle: 'Yılda iki konteyner de alsanız yirmi de alsanız aynı altı aşama: teknik özellik, mühendislik, numune, test, kalıp, üretim — ardından FOB, CIF veya DDP teslim.'
  items:
    - title: '1. Teknik özelliklerinizi gönderin'
      description: 'Bir referans board, bir taslak çizim veya bir rakip teknik özellik yeterlidir. Mühendislik incelemesi ve teklif bir iş günü içinde döner.'
    - title: '2. Numuneyi onaylayın'
      description: 'İlk fiziksel numuneniz, konstrüksiyon, baskı renkleri ve basınç testi sonuçlarını kapsayan onay formuyla 7–12 günde sevk edilir.'
    - title: '3. Üretim ve ihracat'
      description: 'Partiler süreç içi kalite kontrolü kontrol noktalarıyla 25–35 günde tamamlanır. Paket listesi, fatura ve konşe mektubu gemiden önce yola çıkar.'
    - title: '4. Deponuza teslim'
      description: 'ABD veya Kanada limanlarına 4–6 haftalık deniz navlunu — DDP kapsamında gümrükleme ve kapınıza teslimi biz üstleniriz.'

faq_section:
  tagline: SSS
  title: 'Kuzey Amerika İthalatı Soruları'
  questions:
    - q: ABD veya Kanada için deniz navlunu ne kadar sürer?
      a: 'Sefer programına ve hedefe bağlı olarak Qingdao limanından ABD veya Kanada limanlarına 4–6 hafta öngörün. DDP projeleri eksiksiz kapıdan kapıya zaman çizelgesini içerir.'
    - q: ABD ve Kanada için DDP gönderiyor musunuz?
      a: 'Evet. DDP, deniz navlununu, gümrükleme, gümrük vergileri ve vergileri ve deponuza teslimi kapsar — öngörülebilir tek bir toplam fiyat. FOB Qingdao ve CIF seçenekleri de mevcuttur.'
    - q: Özel marka SUP ithalatı için MOQ nedir?
      a: 'MOQ, proje yapılandırmasıyla belirlenir: numune geliştirme 1–2 adedi kapsar, mevcut platformlarda pilot partiler 20–50 adet çalışır ve standart hacimli üretim tam 150 m drop stitch rulosundan tasarım başına 90–100+ adet çalışır.'
    - q: İthalat için hangi belgeleri sağlıyorsunuz?
      a: 'Onaylanan numune, hedef pazarlarınız için hazırlanmış CE ve REACH belgeleriyle sevk edilir ve her konteyner paket listesi, fatura ve konşe mektubu ile gönderilir.'
    - q: SUP için hangi ABD uyumluluk belgelerini sağlıyorsunuz?
      a: 'Yetişkin şişirilebilir SUPler çocuk ürünü olmadığından CPSIA tüketici ürünü kuralları genel olarak uygulanmaz. Kaliforniya Prop 65, etiketleme tercihinize bağlı bir değerlendirmedir — sipariş başına sunduğumuz REACH/RoHS malzeme belgeleri buna destek olur. Ürün kategoriniz gerektirdiğinde USCG uyumlu belgeler desteklenebilir ve adlandırılmış proje mühendisiniz, üretim başlamadan önce avukatınızın veya perakendecinizin istediği belgelerin tam olarak hangileri olduğunu doğrular.'
    - q: Sipariş öncesi fabrikayı ziyaret edebilir miyim?
      a: 'Evet. Qingdao şehrindeki 12.500 m² tesis müşterilere açıktır — çevrimiçi sanal fabrika turları düzenlenebilir ve üretim hatları ile kalite kontrol istasyonlarında rehberli yerinde ziyaretler gerçekleştirilebilir.'
    - q: ABD veya Kanada üzerinden bir proje nasıl başlatırım?
      a: 'Bir referans board, taslak çizim veya teknik özellik gönderin. Mühendislik incelemesi ve teklif bir iş günü içinde döner ve her dosya alışverişinden önce NDA imzalanır.'

