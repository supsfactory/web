answer:
  label: 'Risposta breve'
  text: 'I marchi europei ordinano SUP gonfiabili a iSupfactory a condizioni standard: la MOQ viene confermata dalla configurazione del progetto: i cicli di campioni con 1–2 pezzi validano la costruzione, le piccole serie pilota con 20–50 pezzi testano il mercato su piattaforme esistenti e la produzione di serie standard gira con 90–100+ pezzi per design da un rotolo drop-stitch completo da 150 m. Il primo campione parte 7–12 giorni dopo l''approvazione delle specifiche, la produzione richiede 25–35 giorni dopo PO confermata e acconto e il trasporto marittimo aggiunge 4–6 settimane verso Rotterdam o Amburgo. La documentazione CE e REACH viene creata in parallelo al campione approvato e DDP copre sdoganamento e consegna al tuo magazzino.'
  verified: 'Settembre 2026'

