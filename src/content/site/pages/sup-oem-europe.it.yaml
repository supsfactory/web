why_europe:
  tagline: 'Perché gli acquirenti in Europa'
  title: 'Costruito per le importazioni europee'
  subtitle: 'La fabbrica risponde alle domande che i marchi europei si pongono prima del loro primo container — certificazione per prima.'
  items:
    - title: 'Documentazione CE e REACH'
      description: 'Il campione approvato parte con documentazione CE e REACH per il mercato UE, così il tuo fascicolo tecnico e i documenti doganali sono pronti prima del container.'
    - title: 'DDP per costi a destino pianificabili'
      description: 'Il DDP include sdoganamento, dazi, tasse e consegna al tuo magazzino — un prezzo totale, porta a porta in tutta l''UE.'
    - title: 'FOB Qingdao con il tuo spedizioniere'
      description: 'Importatore abituale? Scegli FOB Qingdao e usa il tuo partner logistico — noi carichiamo e documentiamo il container, tu controlli il resto.'
    - title: 'Una fabbrica, un sistema di qualità'
      description: 'Sviluppo, campioni, produzione e QC avvengono tutti nello stabilimento di 12,500 m² — il campione approvato è il prodotto che ricevi.'

process_notes:
  tagline: 'Come funziona'
  title: 'Dalla specifica al container'
  subtitle: 'Le stesse sei fasi, sia che tu compri due container l''anno o venti: specifica, ingegneria, campione, verifica, attrezzaggio, produzione — poi consegna FOB, CIF o DDP.'
  items:
    - title: '1. Invia la tua specifica'
      description: 'Basta una tavola di riferimento, uno schizzo o una specifica concorrente. Verifica tecnica e offerta arrivano entro un giorno lavorativo.'
    - title: '2. Approva il campione'
      description: 'Il tuo primo campione fisico parte in 7–12 giorni con un modulo di approvazione su costruzione, colori di stampa e risultati del test di pressione.'
    - title: '3. Produzione & export'
      description: 'I cicli vengono completati in 25–35 giorni con checkpoint QC durante la produzione. Packing list, fattura e polizza di carico precedono la nave.'
    - title: '4. Consegna al tuo magazzino'
      description: '4–6 settimane di trasporto marittimo verso Rotterdam o Amburgo — con DDP ci occupiamo noi di sdoganamento e consegna fino alla tua porta.'

faq_section:
  tagline: FAQ
  title: 'Domande sull''importazione in Europa'
  questions:
    - q: La documentazione CE è inclusa nel mio ordine?
      a: 'Sì. La documentazione CE e REACH viene creata per il mercato UE in parallelo al tuo campione approvato, prima che la produzione inizi — i documenti viaggiano con il container.'
    - q: Quanto dura il trasporto marittimo verso l'Europa?
      a: 'Prevedi 4–6 settimane dal porto di Qingdao a Rotterdam o Amburgo, a seconda del piano di partenza. I progetti DDP includono la timeline completa porta a porta.'
    - q: Spedite in DDP verso i paesi UE?
      a: 'Sì. Il DDP include trasporto marittimo, sdoganamento, dazi e tasse oltre alla consegna al tuo magazzino — un prezzo totale pianificabile. Sono disponibili anche FOB Qingdao e CIF.'
    - q: Qual è la MOQ per un'importazione di SUP private label?
      a: 'La MOQ viene confermata dalla configurazione del progetto: lo sviluppo dei campioni copre 1–2 pezzi, le piccole serie pilota girano con 20–50 pezzi su piattaforme esistenti e la produzione di serie standard gira con 90–100+ pezzi per design da un rotolo drop-stitch completo da 150 m.'
    - q: Quale documentazione fornite per le importazioni?
      a: 'Il campione approvato parte con documentazione CE e REACH preparata per il tuo mercato target e ogni container parte con packing list, fattura e polizza di carico.'
    - q: Come avvio un progetto dall'Europa?
      a: 'Invia una tavola di riferimento, uno schizzo o una specifica. La verifica tecnica e l''offerta arrivano entro un giorno lavorativo e prima di ogni scambio di file viene firmata una NDA.'

