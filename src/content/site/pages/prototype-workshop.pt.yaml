answer:
  label: 'Resposta breve'
  text: 'Transformamos um modelo CAD numa prancha de amostra navegável e testável em 7–12 dias: prototipagem insuflável, provas em água com ondas, iterações em rail e nose, depois a decisão sobre o equipamento de produção. A construção completa de moldes personalizados exige 15–20 dias, além do lead time padrão da produção em série de 25–35 dias.'
  verified: 'September 2026'

