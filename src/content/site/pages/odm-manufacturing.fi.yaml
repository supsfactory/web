      icon: 'tabler:building-factory'
    - title: Kuvitus ja brändäys
      description: 'Laudan kansikuviot, putkiston brändäys, EVA-patjat ja vähittäispakkaus kehitetään omassa suunnittelutiimissämme brändisi ympärille.'
      icon: 'tabler:palette'
    - title: Muotin kehittäminen
      description: 'Uudet runkomuodot alkavat muotityökalustosta, joka suunnitellaan ja leikataan omissa tiloissamme — työkalusto lisää 15–20 päivää projektin aikatauluun.'
      icon: 'tabler:shapes'
    - title: Prototyypin validointi
      description: 'Fyysinen prototyyppi rakennetaan, testataan ja lähetetään arvioitavaksesi radakkokokeineen — yleensä 7–12 päivän kuluessa.'
