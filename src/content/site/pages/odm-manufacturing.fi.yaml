hero:
  tagline: ODM-valmistus
  title: 'SUP ODM -valmistaja — tuotesuunnittelu ja tuotekehitys'
  subtitle: 'Sinun ei tarvitse olla valmis SUP-suunnitelma. Aloita tuotekonseptista, markkinavaatimuksesta tai suorituskykytavoitteesta — omat insinöörimme suunnittelevat rungon, rakenteen, kuvituksen ja pakkauksen toimeksiantosi ympärille, sitten prototyyppi 7–12 päivässä ja tuotanto 25–35 päivää vahvistetun tilauksen jälkeen.'

answer:
  label: 'Suora vastaus'
  text: 'iSupfactory on SUP ODM -valmistaja Qingdaossa, Kiinassa. ODM-kehitys lähtee toimeksiannostasi, ei piirustuksistasi: runkosuunnittelu (pituus, leveys, kaarevuus, tilavuus), materiaalirakenne ja kuvitus suunnitellaan omissa tiloissamme, validoidaan prototyyppinäyttein 7–12 päivässä ja valmistetaan vakiintuneella volyymierän vähimmäismäärällä 90–100 kpl 150 m rullaerää kohti (pilotti 20–50 kpl:stä). Tuotanto vie 25–35 päivää vahvistetun tilauksen ja käsirahajan jälkeen; räätälöity muotityökalusto lisää 15–20 päivää. CE-, ISO 9001-, BSCI-, REACH- ja RoHS-asiakirjat toimitetaan jokaisen tilauksen mukana.'
  verified: 'Syyskuu 2026'

