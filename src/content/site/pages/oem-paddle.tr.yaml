answer:
  label: 'Doğrudan yanıt'
  text: 'Minimum sipariş miktarı proje konfigürasyonuyla teyit edilir: numune (1–2 adet), pilot (20–50 adet) ve standart hacim (150 m rulo drop-stitch kumaştan parti başına 90–100+ adet), ayrıca 5–10 adetten başlayan küçük partili ortak markalama. Numuneler 7–12 günde sevk edilir; toplu üretim sipariş ve depozitodan sonra 25–35 gün sürer. AB pazarı modelleri için CE sertifikası ve eksiksiz uyumluluk dokümantasyonu her siparişle birlikte sunulur.'
  verified: 'Eylül 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Marka logosuyla özel OEM şişirilebilir kürek
  actions:
    - text: 'OEM Projemi Başlat'
      href: /tr/contact
      variant: primary
    - text: 'OEM Paketlerini İnceleyin'
      href: /tr/oem-manufacturing
      variant: secondary
