faqs:
  title: 'OEM Kürek Üretimi SSS'
  subtitle: 'Kendi küreğini kuran markalardan gelen en sık soruların yanıtları.'
  items:
    - title: 'Kendi kürek markamı nasıl kurarım?'
      description: 'Markanızı başlatın: brifing, tasarım, CE sertifikalı prototip, seri üretim ve teslimat. Sipariş ve depozitodan itibaren numuneler 7–12 günde, üretim 25–35 günde. OEM paketlerimizi inceleyin.'
    - title: 'Üretim teslim süresi nedir?'
      description: 'Numune 7–12 günde hazırdır, toplu üretim hacme bağlı olarak sipariş ve depozitodan sonra 25–35 gün sürer.'
    - title: 'Kürekler bizim logomuzu taşır mı?'
      description: 'Evet — tam private label: kendi markanızda logo baskısı, özel renkler, ambalaj ve etiketler.'
    - title: 'İlk günden toptan alabilir miyim?'
      description: 'MOQ, proje konfigürasyonuyla teyit edilir — numune (1–2 adet), pilot (20–50 adet) ve standart hacim (parti başına 90–100+ adet); hacim arttıkça toptan fiyat kademeleri devreye girer.'

content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
