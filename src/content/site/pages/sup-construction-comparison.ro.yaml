hero:
  tagline: 'Ghid de construcție'
  title: 'Comparația construcțiilor SUP'
  subtitle: 'Trei tipuri de construcție, o singură linie de producție. Înțelegeți compromisurile de rigiditate, greutate, durabilitate și cost dintre plăcile SUP din PVC cu un strat, PVC cu două straturi și cu miez drop-stitch — și care dintre ele se potrivește vâslașului țintă și poziționării dumneavoastră de piață.'

answer:
  label: 'Comparație rapidă'
  text: 'PVC-ul cu un strat este cel mai ușor și cel mai accesibil — ideal pentru vâslași ocazionali și piețe sensibile la preț. PVC-ul cu două straturi adaugă un al doilea strat de PVC pentru rigiditate și durabilitate la o greutate moderată — alegerea standard a industriei pentru flote de închiriere și mărci de segment mediu. Miezul drop-stitch cu înveliș PVC oferă rigiditatea și toleranța la presiune maxime — preferat pentru aplicațiile de performanță, surf și vâslași de talie mare. Toate cele trei construcții sunt produse pe aceeași linie de producție, cu aceleași etape de control al calității; diferența constă în materiale și în etapele de laminare.'
  verified: 'Septembrie 2026'

