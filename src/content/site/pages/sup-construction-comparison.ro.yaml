key_factors:
  heading: 'Factori-cheie dincolo de tipul de construcție'
  body: |
    Tipul de construcție este o variabilă în performanța plăcii. Alți trei factori contează la fel de mult sau mai mult:

    - **Densitatea drop-stitch** — firele pe inch determină cât de uniform își păstrează placa forma sub presiune. Folosim 96 fire/inch în standard și 140 fire/inch pentru construcțiile de performanță. Densitate mai mare = placă mai plată = glisare mai bună.
    - **Calitatea și grosimea PVC-ului** — Nu toate tipurile de PVC sunt egale. PVC-ul de 0.7 mm importat din Coreea are o rezistență la sfâșiere și la UV mai mare decât alternativele mai subțiri. Specificăm calitatea materialului proiect cu proiect.
    - **Construcția bordurii** — Bordurile cu un singur strat reprezintă punctul de cedare cel mai frecvent pe plăcile ieftine. Benzile de bordură armate, la două straturi, reduc dramatic riscul de perforare a bordurii. Toate plăcile noastre folosesc borduri armate, indiferent de nivelul de construcție.

faqs:
  tagline: FAQ
  title: 'Construcția SUP — întrebări frecvente'
  items:
    - q: 'Ce tip de construcție ar trebui să aleg pentru marca mea?'
      a: 'Depinde de piața țintă și de poziționarea prețului. Nivel de intrare și retail de mare suprafață: un strat. Flote de închiriere, cluburi și mărci de segment mediu: două straturi. Performanță, tură și premium: miez drop-stitch. Majoritatea mărcilor pornesc cu două straturi, ca cel mai bun echilibru între cost, durabilitate și experiența vâslașului. Vă recomandăm în funcție de piața dumneavoastră specifică în etapa de analiză a fezabilității.'
    - q: 'Pot oferi mai multe niveluri de construcție sub aceeași marcă?'
      a: 'Da — multe mărci oferă două sau trei niveluri. Noi producem toate cele trei construcții pe aceeași linie, cu aceleași etape de control al calității, astfel încât puteți combina tipuri de construcție într-o singură comandă. Forma carenei și grafica pot fi identice în toate nivelurile; se schimbă doar construcția și materialele.'
    - q: 'Care este standardul de test de presiune pentru toate construcțiile?'
      a: 'Fiecare placă, indiferent de tipul de construcție, trece un test de menținere la 18.0 PSI cu respingere automată la o cădere de presiune de peste 0.50 PSI în 24 de ore. Plăcile cu un strat sunt nominale pentru o presiune de vâslire de 12–15 PSI, cele cu două straturi pentru 15–18 PSI, iar cele cu miez drop-stitch pentru 18–25 PSI. Presiunea de test depășește presiunea nominală pentru toate tipurile.'
    - q: 'Cum influențează construcția cererile de garanție?'
      a: 'Plăcile cu un singur strat au rate de cereri de garanție ușor mai mari în utilizare comercială sau la închiriere, din cauza expunerii bordurii și a perforărilor. Construcțiile cu două straturi și cu miez drop-stitch au rate de cereri semnificativ mai mici. Furnizăm date de garanție pe nivel, extrase din înregistrările noastre de producție, în etapa de ofertare.'

