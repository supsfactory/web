meta:
  title: "Сертификация надувных SUP — CE, REACH, RoHS и руководство по соответствию"
  description: "Область сертификации при производстве надувных SUP: CE (модели для ЕС), BSCI, ISO 9001, REACH, RoHS. Номера сертификатов предоставляются по запросу для каждого проекта."
  dateModified: "2026-08-20"

sections:
  - title: "Прямой ответ"
    directAnswer:
      answer: "iSupfactory имеет сертификаты BSCI, ISO 9001, ISO 25649, CE, REACH и RoHS. CE применим к моделям, предназначенным для рынков ЕС, — а не безусловно ко «всем продуктам»."
      condition: "Область сертификации различается в зависимости от целевого рынка и конфигурации изделия. Номера сертификатов, срок действия и органы выдачи предоставляются по запросу для каждого проекта."
      value: "BSCI · ISO 9001 · ISO 25649 · CE · REACH · RoHS"
      verifiedDate: "Сентябрь 2026"
      sourceType: "certificate"
    body: |
      Сертификация — ключевой вопрос при закупках, и её необходимо излагать точно.
      Общие заявления вроде «CE на всю продукцию» могут вызвать проблемы с доверием, если покупатель
      позднее обнаружит, что область действия уже, чем предполагалось.

  - title: "Сведения о сертификатах"
    body: |
      | Сертификат | Область | Орган | Применимость |
      |---------------|-------|-----------|------------|
      | BSCI | Аудит социальной ответственности | amfori BSCI | Производственная площадка |
      | ISO 9001 | Система менеджмента качества | Орган по сертификации (предоставляется по запросу) | Производственная площадка |
      | ISO 25649 | Безопасность надувных водных судов | ISO | Применимые модели SUP по рынкам |
      | CE | Соответствие требованиям рынка ЕС (EN ISO 6185 / 10087 / 10240) | Уполномоченный орган ЕС | Модели, предназначенные для рынка ЕС |
      | REACH | Химическая безопасность ЕС | ECHA | Материалы, используемые в производстве |
      | RoHS | Ограничение опасных веществ | Директива ЕС | Электронные аксессуары (насосы) |

  - title: "Важные примечания об области действия"
    body: |
      - **CE** применим к моделям, сконфигурированным для продажи на рынке ЕС. Доска, изготовленная для
        дистрибуции в США или Австралии, не маркируется знаком CE, если это не запрошено отдельно.
      - **ISO 9001** распространяется на систему менеджмента качества производственной площадки, а не на
        сертификацию отдельных изделий.
      - **Соответствие REACH** охватывает материалы, используемые в производстве, — документация
        предоставляется импортёрам, которые обязаны регистрировать вещества.
      - Номера сертификатов, даты действия и органы выдачи предоставляются по запросу для каждого проекта.
        Мы не публикуем номера сертификатов в открытом доступе из соображений безопасности.
      - Сторонний контроль доступен через SGS, TÜV, BV или Intertek для любой отгрузки.

  - title: "Как запросить сертификаты"
    body: |
      В ходе запроса укажите целевые рынки, и мы подтвердим, какие
      сертификаты применимы к вашей конкретной конфигурации изделия. Копии сертификатов
      (с удалением коммерческих деталей там, где это необходимо) предоставляются в составе
      пакета документации по проекту.

evidence_review:
  tagline: 'Подтверждение и проверка'
  title: 'ПОДТВЕРЖДЁННЫЕ ХАРАКТЕРИСТИКИ'
  body: 'Все заявления о производстве на этой странице подтверждены нашей инженерной службой производства на площадке в Лайси, Циндао. Сертификаты, записи контроля ОКК, отчёты об испытаниях давлением и прочностью, а также записи прослеживаемости партий предоставляются по запросу. Характеристики последний раз подтверждены в сентябре 2026.'
