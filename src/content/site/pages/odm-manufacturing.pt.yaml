  subtitle: 'Tudo o que obténs quando o design nasce na fábrica — não na tua secretária.'
  items:
    - title: Design do casco
      description: 'Comprimento, largura, espessura, rocker e volume, projetados para os teus riders de referência, os usos e os mercados — de página em branco ou da nossa biblioteca de plataformas testadas.'
