      icon: 'tabler:building-factory'
    - title: Gráficas e branding
      description: 'Gráficas do deck da prancha, branding no tubo, pad EVA e embalagens comerciais, desenvolvidos pela nossa equipa de design em torno da tua marca.'
      icon: 'tabler:palette'
    - title: Desenvolvimento dos moldes
      description: 'As novas formas de casco começam como construção de moldes, projetada e fresada internamente — o ferramental acrescenta 15–20 dias ao planeamento do projeto.'
      icon: 'tabler:shapes'
    - title: Validação do protótipo
      description: 'É construído um protótipo físico, testado e enviado para a tua avaliação com uma prova em água — normalmente em 7–12 dias.'
      icon: 'tabler:tools'
    - title: Testes e conformidade
      description: 'Retenção de ar, manutenção de pressão e resistência das soldaduras por unidade, com documentação de conformidade ISO-9001, BSCI, REACH, RoHS e CE para o mercado de destino (âmbito de aplicação confirmado com base no projeto).'
      icon: 'tabler:certificate'
