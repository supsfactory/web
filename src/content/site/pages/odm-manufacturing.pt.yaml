hero:
  tagline: Produção ODM
  title: 'Produtor SUP ODM — design e desenvolvimento de produto'
  subtitle: 'Não precisas de um design SUP pronto. Começa com um conceito de produto, um requisito de mercado ou um objetivo de desempenho — os nossos engenheiros internos projetam casco, estrutura, gráficas e embalagem com base no teu briefing, criam os protótipos em 7–12 dias e produzem 25–35 dias após a confirmação da encomenda.'

answer:
  label: 'Resposta breve'
  text: 'A SUPsfactory é um produtor SUP ODM em Qingdao, China. O desenvolvimento ODM parte do teu briefing, não dos teus desenhos: o design do casco (comprimento, largura, rocker, volume), a estrutura dos materiais e as gráficas são projetados internamente, validados com amostras protótipo em 7–12 dias e produzidos em quantidades padrão de 90–100 unidades por bobina de 150 m (piloto de 20–50 unidades). A produção dura 25–35 dias após a confirmação da encomenda e o sinal; a construção dos moldes para formas personalizadas acrescenta 15–20 dias. A documentação CE, ISO-9001, BSCI, REACH e RoHS é fornecida com cada encomenda.'
  verified: 'September 2026'

features:
