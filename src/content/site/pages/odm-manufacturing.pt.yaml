      description: 'A propriedade dos moldes ou as cláusulas de sub-rogação estão no contrato — o teu design continua a ser teu e os moldes ficam prontos para reencomendas.'
      icon: 'tabler:lock'
    - title: Do protótipo ao contentor
      description: 'Um design ODM validado passa diretamente à produção em quantidades padrão: 90–100+ unidades por bobina de 150 m, 25–35 dias após a confirmação da encomenda.'
      icon: 'tabler:package'

customization:
  tagline: Projetado contigo
  title: O que desenvolvemos em torno do teu briefing
  subtitle: 'ODM significa que o produto é projetado para ti do zero ou a partir da nossa biblioteca de plataformas — estes são os pontos de regulação que o teu briefing controla:'
  items:
    - 'Perfil do rider e mercado — posicionamento para principiantes, touring, competição, yoga, pesca ou uso multiusos'
    - 'Medidas da prancha — comprimento, largura, espessura e volume, calibrados para riders de referência e uso'
    - 'Carácter do casco — rocker, perfil dos rails, forma do nose e do tail, calibrado para estabilidade ou velocidade'
    - 'Estrutura dos materiais — densidade do drop-stitch, número e qualidade das camadas de PVC, reforços e robustecimentos dos rails'
    - 'Gráficas e cores — cores da marca, gráficas do deck e branding no tubo, desenvolvidos internamente'
    - 'Tapete antiderrapante em EVA — layout, cores e integração do logótipo no deck'
    - 'Pacote de acessórios — pás, bombas, aletas, leashes e bolsas, calibrados para a prancha'
    - 'Embalagem e montagem comercial — embalagens comerciais, expositores e embalagem de exportação sob a tua marca'

faq_section:
  tagline: FAQ
  title: Perguntas sobre o desenvolvimento ODM
  questions:
    - q: Em que é que o ODM se diferencia do OEM?
      a: 'ODM (Original Design Manufacturing) parte do teu briefing — os nossos engenheiros desenvolvem a estrutura da prancha, a construção, as gráficas e a embalagem, seja a partir de um conceito de mercado, de um objetivo de desempenho ou de uma adaptação de uma plataforma testada. Aprovas o design antes da produção. OEM (Original Equipment Manufacturing) produz segundo a tua especificação aprovada — os teus desenhos, as medidas, os materiais e a tua embalagem. És dono do design e da propriedade intelectual. Ambos os percursos passam pela mesma fábrica, o mesmo sistema QC e a mesma equipa de exportação; o ODM é a forma mais rápida de chegar a uma prancha com marca quando ainda não tens um design.'
    - q: Só tenho uma ideia vaga — por onde começamos?
      a: 'Envia um briefing curto: rider de referência, usos, dimensão indicativa, mercados e quantidade. Os nossos engenheiros respondem num dia útil com um conceito, uma direção de referência e um plano de desenvolvimento — mediante pedido é assinada uma NDA antes de qualquer troca de detalhes.'
    - q: Quanto tempo exige o desenvolvimento de uma nova prancha SUP?
      a: 'As amostras protótipo partem em 7–12 dias. Um novo casco com construção de molde dedicada acrescenta 15–20 dias de engenharia antes das amostras. A produção prossegue 25–35 dias após a encomenda e o sinal.'
    - q: Qual é o MOQ para uma prancha ODM?
      a: 'A produção em quantidades padrão corre com 90–100 unidades por bobina drop-stitch de 150 m; os runs piloto partem das 20–50 unidades em plataformas existentes. O co-branding para pequenos lotes parte das 5–10 unidades — o cálculo completo está no nosso guia de MOQ e branding flexível.'
    - q: A quem pertencem o design e o molde?
      a: 'O teu briefing, o teu design e o teu ferramental são protegidos por NDA, condições de licença da marca e cláusulas de propriedade ou sub-rogação dos moldes no contrato. Os moldes ficam conservados para a tua marca e são transferíveis.'
    - q: Podem desenvolver uma forma específica (touring, pesca, competição, yoga)?
      a: 'Sim. A engenharia do casco cobre todas as principais categorias SUP — allround, touring, competição, yoga, pesca e pranchas para várias pessoas — com validação em tanque hidrodinâmico de ensaio para as formas de performance.'
    - q: Que certificações tem a prancha desenvolvida?
      a: 'ISO 9001:2015 gestão da qualidade (ao nível da fábrica), BSCI conformidade social (auditoria de fábrica amfori), documentação de conformidade CE para as configurações aplicáveis ao mercado da UE (diretiva das embarcações de recreio — âmbito de aplicação confirmado com base no projeto), REACH (materiais), RoHS (acessórios eletrónicos) e ISO 25649 para os modelos SUP insufláveis aplicáveis. Os documentos de certificação são preparados caso a caso para os teus mercados de exportação.'

process:
  title: 'O processo ODM — do briefing à produção em escala'
  subtitle: 'Seis fases controladas, conduzidas pela mesma equipa que projeta, amostra e escala a tua prancha — tudo fica documentado.'
  steps:
    - phase: '01'
      title: Briefing e conceito
      period: 1 dia útil
      items:
        - 'Partilha riders de referência, usos, medidas, mercados e quantidade — ou apenas uma ideia.'
        - 'Os nossos engenheiros fornecem uma direção de conceito, opções de plataforma e um plano de desenvolvimento.'
    - phase: '02'
      title: Design de casco e estrutura
      period: Semana 1–2
      items:
        - 'Medidas da prancha, carácter do casco, densidade do drop-stitch e estrutura PVC — projetados internamente.'
        - 'Gráficas, layout do deck EVA e conceito de embalagem desenvolvidos em torno da tua marca.'
    - phase: '03'
      title: Moldes e ferramental
      period: +15–20 dias (novos moldes)
      items:
        - 'Construção de molde dedicada para novas formas de casco; as plataformas existentes saltam esta fase.'
        - 'As condições de propriedade dos moldes são fixadas no contrato antes do início da fresagem.'
    - phase: '04'
      title: Protótipo e amostra
      period: 7–12 dias
      items:
        - 'É construído um protótipo físico, testado e enviado para a tua avaliação — prova em água incluída.'
        - 'A amostra (1–2 unidades) valida a forma, a estrutura e o branding antes da quantidade.'
    - phase: '05'
      title: Validação e aprovação
      period: Em paralelo
      items:
        - 'Retenção de ar, manutenção de pressão, resistência das soldaduras, provas de carga e UV para cada linha de produção.'
        - 'Documentação CE, ISO-9001, BSCI, REACH e RoHS preparada para os teus mercados de exportação.'
        - 'Aprovas o protótipo; a encomenda e o sinal asseguram o slot de produção.'
    - phase: '06'
      title: Produção e entrega
      period: 25–35 dias
      items:
        - 'As quantidades padrão correm com 90–100+ unidades por bobina de 150 m, os runs piloto das 20–50 unidades.'
        - 'Embalagem de exportação, envio FOB/CIF/DDP para mais de 50 países e apoio às reencomendas incluídos.'

