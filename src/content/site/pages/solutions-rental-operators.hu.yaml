fleet_guide:
  title: Útmutató a flotta méretezéséhez
  subtitle: 'Becsülje meg, hány deszkára van szüksége a működésének a napi bérbeadási forgás alapján.'
  tiers:
    - label: Kis stand
      boards: '15-20'
      note: 'Legfeljebb napi 2–3 deszkaforgat a csúcsszezonban'
    - label: Közepes méretű működés
      boards: '30-50'
      note: 'Több indulási pont vagy intenzív hétvégi forgalom'
    - label: Nagy parti bérbeadás
      boards: '50-100'
      note: 'Teljes szolgáltatású bérlőflották több parti állomáson'

