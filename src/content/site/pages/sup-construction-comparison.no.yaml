key_factors:
  heading: 'Viktige faktorer utover konstruksjonstypen'
  body: |
    Konstruksjonstypen er én av flere variabler når det gjelder brettets ytelse. Tre andre faktorer er like viktige eller viktigere:

    - **Drop-stitch-tetthet** — Trådene per tomme avgjør hvor jevnt brettet beholder formen under trykk. Vi bruker standarder på 96 tråd/tomme og 140 tråd/tomme for prestasjonsbygg. Høyere tetthet = flatere brett = bedre glidning.
    - **PVC-kvalitet og -tykkelse** — Ikke all PVC er lik. PVC på 0,7 mm importert fra Sør-Korea har overlegen spreholdfasthet og UV-beskyttelse sammenlignet med tynnere alternativer. Vi spesifiserer materialkvaliteten per prosjekt.
    - **Railkonstruksjon** — Enlags-rails er den vanligste bruddpunktet på billige brett. Tolags-rails og forsterkede railbånd reduserer risikoen for railskader drastisk. Alle brettene våre bruker forsterkede rails, uansett konstruksjonsnivå.

faqs:
  tagline: Vanlige spørsmål
  title: 'SUP-konstruksjon — vanlige spørsmål'
  items:
    - q: 'Hvilken konstruksjonstype bør jeg velge for varemerket mitt?'
      a: 'Det avhenger av målmarkedet og prisposisjoneringen din. Inngangssegment og stord distribusjon: ettlag. Utleieflåter, foreninger og merker i mellomsegmentet: tolag. Prestasjon, tour og premium: drop-stitch-kjerne. De fleste merker starter med tolag som beste kompromiss mellom kostnad, holdbarhet og padleopplevelse. Under gjennomførbarhetskontrollen rådgir vi ut fra det spesifikke markedet ditt.'
    - q: 'Kan jeg tilby flere konstruksjonsnivåer under ett varemerke?'
      a: 'Ja — mange merker tilbyr to eller tre nivåer. Vi produserer alle tre konstruksjonene på samme linje med samme QC-kontroller, slik at du kan blande konstruksjonstyper innenfor én enkelt ordre. Skrogform og grafikk kan være identiske på alle nivåer; kun konstruksjonen og materialene skiller seg.'
    - q: 'Hvilken standard for trykktesting gjelder for alle konstruksjoner?'
      a: 'Hvert brett, uansett konstruksjonstype, består en tetthetstest ved 18.0 PSI med automatisk avvisning ved trykktap på mer enn 0.50 PSI i løpet av 24 timer. Ettlagsbrett er dimensjonert for 12–15 PSI i bruk, tolagsbrett for 15–18 PSI og drop-stitch-kjernebrett for 18–25 PSI. Testtrykket overstiger alle typenes nominelle trykk.'
    - q: 'Hvordan påvirker konstruksjonen garantikravene?'
      a: 'Ettlagsbrett har noe høyere andel garantikrav ved kommersiell/utleiebruk på grunn av rails og lekkasjer. Tolags- og drop-stitch-kjernekonstruksjoner har betydelig lavere andel krav. Under tilbudsfasen leverer vi garantidata per nivå fra produksjonsregistrene våre.'

