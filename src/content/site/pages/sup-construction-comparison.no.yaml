hero:
  tagline: 'Konstruksjonsguide'
  title: 'Sammenligning av SUP-konstruksjoner'
  subtitle: 'Tre konstruksjonstyper, én produksjonslinje. Forstå avveiningene mellom stivhet, vekt, holdbarhet og kostnad for ettlag PVC, tolag PVC og drop-stitch-kjerne — og hvilken som passer målgruppen din og markedsposisjoneringen din.'

answer:
  label: 'Hurtig sammenligning'
  text: 'Ettlag PVC er lettest og billigst — ideelt for rekreasjonspadlere og prissensitive markeder. Tolag PVC tilfører et annet PVC-lag for stivhet og holdbarhet med moderat vekt — bransjens standardvalg for utleieflåter og modeller i mellomsegmentet. Drop-stitch-kjernen med PVC-finish gir maksimal stivhet og trykkfasthet — favoritten for prestasjon, surf og tunge padlere. Alle tre konstruksjoner produseres på samme linje med samme QC-kontroller; forskjellen ligger i materialene og lamineringstrinnene.'
  verified: 'September 2026'

