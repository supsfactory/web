rd_services:
  tagline: R&D personalizat
  title: Servicii R&D pentru parteneri
  services:
    - title: Dezvoltare personalizată de materiale
      desc: Dezvoltăm formulări personalizate de țesătură, stive laminate și sisteme adezive adaptate mediului dumneavoastră de exploatare și obiectivelor de performanță.
    - title: Inginerie de produs OEM / ODM
      desc: Dezvoltăm soluții de inginerie de produs pentru proiectele OEM și ODM, de la selecția materialelor și proiectarea corpului de apă până la optimizarea uneltelor de producție.
    - title: Încercări și certificări de terți
      desc: Folosiți facilitățile noastre de încercare conforme ISO pentru încercarea independentă a materialelor, validarea produselor și sprijinul în certificare.
  cta: Discutați cerințele dumneavoastră de cercetare și dezvoltare →
  cta_link: /ro/contact

vision:
  tagline: Viziunea noastră
  title: Conturăm viitorul sporturilor nautice
  body: Vatrad urmărește să conducă industria bărilor și plăcilor SUP gonflabile prin inovație continuă, calitate constantă și un angajament ferm față de siguranță și sustenabilitate — îmbogățind astfel experiențele pasionaților de sporturi nautice din întreaga lume. Centrul R&D Vatrad este locul în care pasiunea întâlnește inovația, stabilind noi repere pentru industria sporturilor nautice.

labs_section:
  tagline: Laboratoare
  title: Laboratoarele noastre
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: Laborator de țesături PVC
      description: Cercetare și încercare continuă a țesăturilor tubulare din PVC și Hypalon pentru rezistență la tracțiune, rezistență la UV, abraziune și flexibilitate la temperaturi joase, asigurând fiabilitate pe termen lung în medii marine.
      href: /ro/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Studio de inginerie pentru plăci
      description: Proiectare bazată pe CAD și analiză a elementelor finite pentru corpurile de apă din HDPE, aluminiu și fibră de sticlă. Fiecare corp de apă este simulat digital pentru distribuția tensiunilor și rezistența la impact, înainte de construirea primului prototip.
      href: /ro/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: Centrul de sudare RF
      description: Instalație dedicată de sudare cu frecvență radio, cu control precis al temperaturii și presiunii, care produce cusături de înaltă rezistență și etanșe, conform standardelor industriei marine pentru ambarcatiuni gonflabile.
      href: /ro/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Bazin de încercări hidrodinamice
      description: Încercări cu modele la scară în bazinul nostru intern, pentru optimizarea formei corpului de apă, a performanței de planare, a stabilității și a eficienței energetice într-o gamă variată de condiții de încărcare și de mare.
      href: /ro/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Atelierul de prototipuri
      description: Instalație pentru prototipizare și echipare la scară reală, unde modelele noi sunt construite, montate și supuse încercărilor maritime. Fiecare prototip parcurge un program minim de încercare de 20 de ore în apă înainte de aprobarea pentru producție.
      href: /ro/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Laborator de calitate și inspecție
      description: Laborator dedicat de asigurarea calității, care realizează încercări la tracțiune, cicluri de reținere a aerului, încercări de decojire a cusăturilor și certificarea materialelor, astfel încât fiecare placă care părăsește atelierul să respecte specificațiile noastre publicate.
      href: /ro/randdcenter/quality-inspection-lab
