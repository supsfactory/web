hero:
  tagline: Centrul R&D
  title: Centrul R & D
  subtitle: Focus pe progres

intro:
  - Centrul de Cercetare și Dezvoltare (R&D) al Vatrad este forța motrice a misiunii noastre de a transforma echipamentul pentru sporturi nautice. Îi împuternicim pe pasionații de sporturi nautice din întreaga lume cu produse mai sigure, mai confortabile și mai plăcute de folosit, prin inovație neîncetată în plăcile SUP gonflabile și bărcile pentru vâslit în picioare. Echipa noastră dedicată de ingineri, proiectanți și experți pasionați de sporturi nautice conturează viitorul industriei, ridicând constant standardele de calitate, performanță și sustenabilitate.
  - Instalația noastră de cercetare și dezvoltare reunește sub același acoperiș oameni de știință în domeniul materialelor, arhitecți navali și ingineri de producție. De la formularea materialelor și simularea corpului de apă până la dezvoltarea proceselor de sudare și la încercările maritime la scară reală, fiecare etapă a dezvoltării produsului este susținută de date și validată prin încercări.

mission:
  tagline: Misiunea noastră
  title: Inovăm viitorul sporturilor nautice
  pillars:
    - icon: lightning
      title: Progres tehnologic
      desc: Deschiderea de noi materiale, forme și metode de fabricare pentru o performanță și o durată de viață superioare a produselor.
    - icon: design
      title: Proiectare orientată către utilizator
      desc: Înțelegerea profundă a nevoilor utilizatorilor și depășirea lor prin produse ergonomice și intuitive.
    - icon: globe
      title: Practici sustenabile
      desc: Minimizarea impactului asupra mediului prin utilizarea materialelor și proceselor prietenoase cu mediul.
    - icon: shield
      title: Siguranță fără compromisuri
      desc: Asigurarea celor mai înalte standarde de siguranță prin încercări și certificări riguroase.

pillars:
  - title: Progres tehnologic
    desc: Deschiderea de noi materiale, forme și procese de fabricare pentru a obține o performanță și o durată de viață superioare a produselor.
    icon: tech
  - title: Materiale avansate
    desc: Investigarea materialelor PVC, Hypalon, a materialelor compozite și a alternativelor sustenabile de vârf, pentru caracteristici superioare ale produsului.
    icon: materials
  - title: Sustenabilitate
    desc: 'Un angajament esențial: ne dedicăm gestionării responsabile a mediului prin producție sustenabilă și materiale reciclabile.'
    icon: sustainability

capabilities:
  tagline: Capabilități
  title: Capabilitățile R&D
  subtitle: Patru discipline de bază care ne oferă control integral asupra dezvoltării produsului — de la cercetarea materiilor prime până la certificarea finală.
  groups:
    - title: Știința materialelor și tehnologia țesăturilor
      items:
        - Analiza și optimizarea formulărilor de PVC și Hypalon
        - Dezvoltarea stabilizatorilor UV, a retardanților de flacără și a aditivilor antimicrobieni
        - Laminarea țesăturilor în mai multe straturi și ingineria adeziunii
        - Încercări de îmbătrânire accelerată (UV, termică, umiditate, ceață salină)
    - title: Ingineria corpului de apă și hidrodinamica
      items:
        - Proiectare parametrică 3D a corpului de apă și optimizare CFD
        - Analiza elementelor finite pentru încărcările structurale și de impact
        - Încercări în bazin de remorcare cu modele la scară și validarea performanței
        - Dezvoltarea corpurilor de apă personalizate pentru profiluri de misiune speciale
    - title: Tehnologia sudării și îmbinării
      items:
        - Dezvoltarea și optimizarea proceselor de sudare dielectrică RF
        - Metode de sudare cu aer cald, cu pană fierbinte și ultrasunete
        - Calificarea lipirii cu adezivi și a benzilor pentru cusături
        - Modelarea rezistenței cusăturilor și estimarea duratei de viață
    - title: Încercare, certificare și conformitate
      items:
        - Managementul calității și încercările de conformitate CE
        - Sprijin pentru încercări și certificări independente de terți
        - Dezvoltarea de protocoale de încercare personalizate pentru calificarea furnizorilor
        - Analiza defectelor în exploatare și investigarea cauzelor rădăcină

