faq_section:
  tagline: Vanliga frågor
  title: 'Vanliga frågor om SUP-utveckling'
  questions:
    - q: Kan ni utveckla en SUP-produkt från en idé?
      a: 'Ja. Vi följer hela vägen från produktspecifikation och konstruktion, via prototyputveckling och anpassning, till serietillverkning utifrån dina krav. En skiss, en referensbräda eller till och med en konkurrents specifikation räcker för konstruktionskontrollen.'
    - q: Vad kostar SUP-produktutveckling?
      a: 'Specifikationskontrollen och konstruktionsbedömningen är gratis och kommer tillbaka inom en arbetsdag. Provtagning av prototyper offereras per projekt när specifikationen är låst; tillverkningspriser beror på material, antal och om egna verktyg behövs.'
    - q: Hur lång tid tar SUP-produktutveckling?
      a: 'Det första provet skickas 7–12 dagar efter att specifikationen godkänts, med 3–7 dagar per revisionsomgång. Tillverkningen löper 25–35 dagar efter order och deposition. En egen form innebär 15–20 dagar extra i förväg, och sjötransport tar för de flesta destinationer ytterligare 4–6 veckor.'
    - q: Vad kommer först — prov eller tillverkning?
      a: 'Alltid provet. En fysisk prototyp tillverkas, mäts och godkänns mot specifikationen innan en produktionskörning startar. Vi tillverkar inga antal baserat på ej godkända designer.'
    - q: Undertecknar ni ett NDA för produktutveckling?
      a: 'Ja. Ett NDA undertecknas före varje filutbyte och dina designer, din artwork och dina verktyg förblir dina genom hela utvecklingen och tillverkningen.'
    - q: Kan ni skydda min SUP-design och min specifikation?
      a: 'Kunders designer, specifikationer och produktidéer hanteras konfidentiellt under utveckling och tillverkning. Dina verktygsfiler återanvänds aldrig, säljs vidare eller visas för andra kunder.'

