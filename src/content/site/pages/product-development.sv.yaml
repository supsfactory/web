hero:
  tagline: Produktutveckling
  title: 'Anpassad SUP-produktutveckling, från idé till container'
  subtitle: 'Sex faser gör om din idé till produktionsklara SUP-brädor — specifikation, konstruktion, prototyper, tester, verktygsbyggnad och serietillverkning, allt i en enda fabrik med ett ansvarligt kvalitetssystem.'

answer:
  label: 'Kort svar'
  text: 'SUP-produktutveckling hos iSupfactory genomgår sex faser — produktspecifikation, strukturell konstruktion, provtagning av prototyper, test & validering, byggnad av anpassade verktyg och serietillverkning. Det första fysiska provet skickas 7–12 dagar efter att specifikationen godkänts; tillverkningen löper 25–35 dagar efter bekräftad order och deposition; en ny formstämpel innebär ytterligare 15–20 dagar.'
  verified: 'September 2026'

stages:
  title: 'De sex faserna av SUP-produktutveckling'
  subtitle: 'Varje fas har ett tydligt resultat — så att du alltid vet var ditt projekt står — och vad som händer sedan.'
  items:
    - title: '1. Idé & produktspecifikation'
      description: 'Brädgeometri, användarens viktklass, volym, konstruktionsmål och tillbehörspaket. En referensbräda, en skiss eller en konkurrents specifikation räcker för att komma igång.'
      icon: 'tabler:bulb'
    - title: '2. Konstruktion & 3D-design'
      description: 'Strukturell konstruktion, drop-stitch-tjocklek och val av PVC-klass, plus en tillverkningsbarhetskontroll och en offert — inom en arbetsdag.'
      icon: 'tabler:blueprint'
    - title: '3. Provtagning av prototyper'
      description: 'Ditt första fysiska prov skickas inom 7–12 dagar, dokumenterat med ett godkännandeformulär för konstruktion, tryckfärger och tryckprovningsresultat.'
      icon: 'tabler:tools'
    - title: '4. Test & validering'
      description: 'Tryckhållning, svetsstyrka och måttkontroll mot det godkända provet, med CE- och REACH-dokumentation för dina målmarknader.'
      icon: 'tabler:test-pipe'
    - title: '5. Verktyg & serietillverkning'
      description: 'Byggnad av anpassade formverktyg på 15–20 dagar vid behov; tillverkningen löper 25–35 dagar med QC-kontrollpunkter i flödet och spårbarhet per parti.'
      icon: 'tabler:settings'
    - title: '6. Leverans & skalbarhet'
      description: 'Logistik FOB, CIF eller DDP till över 50 länder — därefter återbeställningar på din etablerade linje med stabila leveranstider och arkiverad, godkänd artwork.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Varför utveckling i fabrik slår ett mellanled'
  subtitle: 'Utveckling direkt i produktionsanläggningen förändrar vad du får i varje fas.'
  items:
    - title: Inga överlämningspunkter i designen
      description: 'Konstruktions- och ritningsteamet arbetar på samma plan som svetslinjen — en designändring når produktionen samma vecka, inte efter en kommersiell tur och retur.'
      icon: 'tabler:handshake'
    - title: Prover som matchar produktionen
      description: 'Provkörningen och produktionskörningen delar samma maskiner, material och QC-stationer — det godkända provet är alltså exakt vad du får i containerformat.'
      icon: 'tabler:stack-2'
    - title: Konstruktion som inte säljer
      description: 'Beslut fattas utifrån målkostnad, vikt och livslängd — inte utifrån vinstmarginal, eftersom detta är en fabrik och produktionen är den enda intäktskällan.'
      icon: 'tabler:scale'
    - title: Ansvarsskyldighet som bestående åtagande'
      description: 'Ett NDA undertecknas före varje filutbyte och din artwork, dina verktyg och dina specifikationsfiler förblir dina — de återanvänds aldrig, säljs vidare eller visas för andra kunder.'
      icon: 'tabler:lock'

