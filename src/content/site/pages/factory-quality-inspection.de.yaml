    - category: 'Klasse G — Struktureller Schaden'
      area: 'Materialschaden, Delamination, Boardverformung'
      eligibility: 'Nacharbeitsfreigabe nicht autorisiert — Ersatz, Verschrottung oder schriftliche Kundenkonzession'
      approval: 'Qualitätsmanager + Kundenfreigabe'

rework_flow:
  tagline: 7-stufiger geschlossener Kreislauf
  title: Kontrollierter Nacharbeits-Workflow — von der Erkennung bis zur Freigabe oder Verschrottung
  subtitle: 'Jede Luftdichtigkeitsnacharbeit folgt demselben kontrollierten Kreislauf: erkennen, in Quarantäne nehmen, diagnostizieren, autorisieren, nacharbeiten, erneut prüfen, freigeben.'
  steps:
    - step: '01'
      title: Erkennung, Linienstopp & Quarantäne
      desc: 'Die Verarbeitung des betroffenen Boards stoppt sofort. Board-ID, Produktcode, Charge, Arbeitsstation, Datum und Inspektor werden aufgezeichnet, ein HOLD- / Quarantäneetikett wird angebracht und ein NCR gegen die geltende Spezifikationsrevision eröffnet.'
    - step: '02'
      title: Systematische Leckdiagnose
      desc: 'Das Board wird auf den projektfreigegebenen Diagnosedruck aufgeblasen und die Leckquelle mit einer freigegebenen Methode lokalisiert — Druckhaltung, kalibrierter Blasentest, akustisches oder Leckerkennungsgerät. Die vermutete Stelle wird ohne Beschädigung des Boards markiert.'
    - step: '03'
      title: Engineering-Disposition & Autorisierung
      desc: 'QC bestätigt die Fehlerkategorie, und Engineering prüft, ob das Board auf seine ursprüngliche Spezifikation zurückgeführt werden kann. Eine den NCR referenzierende Nacharbeitsautorisierung dokumentiert freigegebene Methode, Materialien, Bedingungen und erneuten Prüfumfang — oder weist Ersatz, Rückweisung, Verschrottung oder Kundenkonzession zu.'
    - step: '04'
      title: Kontrollierte Nacharbeitsausführung
      desc: 'Die Nacharbeit wird ausschließlich innerhalb der freigegebenen Fehlergrenze mit der freigegebenen Methodenkarte, Materialcharge und Werkzeugen ausgeführt. Boardmaße, Konstruktion, Grafiken, Zubehörkonfiguration und Verpackungsanforderungen werden niemals verändert.'
    - step: '05'
      title: Aushärtung, Stabilisierung & Vorprüfung
      desc: 'Das nachgearbeitete Board bleibt während der durch die freigegebene Material- und Prozessanweisung definierten Aushärte- und Stabilisierungsphase im HOLD-Status und erhält vor der erneuten Prüfung eine visuelle und verarbeitungsbezogene Vorprüfung.'
    - step: '06'
      title: Erneute Prüfung & Nachweistest
      desc: 'Das Board wird auf den projektfreigegebenen erneuten Prüfdruck aufgeblasen, und der ursprüngliche Fehler sowie alle potenziell betroffenen Merkmale werden erneut verifiziert: Leckstelle und umgebender Bereich, Ventil, Rails, Nähte, hochbeanspruchte Bereiche, Zubehör und Erscheinungsbild. Nacharbeit senkt den Annahmestandard nie.'
    - step: '07'
      title: QA-Freigabe oder endgültige Disposition
      desc: 'Qualität prüft den abgeschlossenen NCR, die Nacharbeitsaufzeichnung und das Ergebnis der erneuten Prüfung und autorisiert dann die Freigabe — oder eskaliert zu Ersatz, Rückweisung, Verschrottung oder Kundenkonzession. Kein nachgearbeitetes Board wird ohne autorisierte Qualitätsfreigabe verpackt oder versendet.'

quality_safeguards:
  tagline: Qualitätssicherungen
  title: Anti-Fehler-Regeln, die Ihre Marke schützen
  subtitle: Harte Kontrollen, die unkontrollierte Reparaturkreisläufe verhindern —eine dokumentierte Nacharbeit pro Fehler, Chargen-Alarmschwellen, kalibrierte Messtechnik und kontrollierte Testbedingungen.
  features:
    - icon: 1
      icon_bg: blue
      title: Eine Nacharbeit pro Fehler
      desc: 'Eine einzelne Stelle darf unter einer autorisierten Anweisung einmal nachgearbeitet werden. Schlägt die erneute Prüfung weiterhin fehl, wird das Board auf Ersatz, Rückweisung, Verschrottung oder Kundenkonzession eskaliert — wiederholte Nacharbeit ohne dokumentierte Freigabe ist nicht zulässig.'
    - icon: 2
      icon_bg: green
      title: Chargen-Alarm & Linienstopp
      desc: 'Überschreitet die Nichtkonformität einer Produktionscharge die vom Engineering festgelegte Schwelle, wird die Linie gestoppt und das Engineering untersucht die Ursache — Materiallos, Prozessbedingungen und Aufzeichnungen — bevor die Produktion wieder aufgenommen wird.'
    - icon: 3
      icon_bg: purple
      title: Kalibrierte Messtechnik
      desc: 'Druckmessgeräte, digitale Manometer und Zeitmesser für Luftdichtigkeitsprüfungen werden von Drittlabors innerhalb ihres Gültigkeitszeitraums kontrolliert und kalibriert; der Kalibrierstatus ist im Inspektionsbereich sichtbar.'
    - icon: 4
      icon_bg: orange
      title: Kontrollierte Testbedingungen
      desc: 'Luftdichtigkeitstest- und Aushärtebereiche werden in einer kontrollierten Umgebung gehalten, damit Ergebnisse nicht durch Temperaturschwankungen zwischen Tag und Nacht beeinflusst werden.'

rework_boundaries:
  tagline: Umfang & Grenzen
  title: Was dieses System nicht abdeckt
  body: |
    Das Nacharbeitskontrollsystem gilt für fertiggestellte oder in Arbeit befindliche aufblasbare SUP-Boards, bei denen vor der Versandfreigabe Luftleckage, Druckhaltefehler oder verwandte Luftsystemfehler festgestellt werden. Es autorisiert keine Änderungen an freigegebener Konstruktion, Materialien, Grafiken, Produktkonfiguration oder Kundenanforderungen und deckt Folgendes nicht ab:

    - Bereits versendete oder in Kundensystemen befindliche Produkte.
    - Strukturelle Schäden oder Boardverformungen, die nicht vom Engineering bewertet wurden.
    - Weitverbreitete Rail- oder Nahtfehler, Kernmaterialschäden oder Fehler, die die Sicherheit beeinträchtigen können.
    - Projekte, bei denen Nacharbeit nicht zulässig ist: kundenfreigegebene Muster, Zertifizierungs- oder Testeinheiten.
    - Projekte mit proprietären Kundenprozessen, Sondermaterialien oder besonderen Reparaturanforderungen.
    - Wiederkehrende Leckage, die nicht lokalisiert werden kann, oder Boards, die nach der Nacharbeit erneut ausfallen.

    Jede Abweichung von den Kundenspezifikationen erfordert eine dokumentierte Engineering-Prüfung und, wo anwendbar, die schriftliche Kundenfreigabe. Boards, die nicht auf ihre ursprüngliche Spezifikation zurückgeführt werden können, werden nur unter einer ausdrücklichen Kundenkonzession freigegeben — niemals allein durch die Produktion.

method_cards:
  tagline: Methodenkarten-System
  title: Index der kontrollierten Nacharbeitsmethodenkarten
  subtitle: 'Die allgemeine Anweisung steuert den Prozess; Methodenkarten steuern die Ausführung. Die Nacharbeitsanweisung (WI-QC-AT-001) referenziert die Methodenkarten MC-RW-01 bis MC-RW-06 sowie MC-RW-00 für die verbindliche Verschrottung und Rückweisung.'
  headers:
    code: Methodenkarte
    defect: Fehlerklasse
    scope: Anwendungsumfang
    controls: Wichtigste Engineering-Kontrollen
    approval: Zeichnungsbefugnis
  rows:
    - code: MC-RW-01
      defect: Klasse A (Ventilschnittstelle)
      scope: 'Ventilkernservice, Dichtungsreinigung und Wiederzusammenbau'
      controls: 'Kalibrierter Drehmomentschlüssel, sauberer Dichtungssitz, keine Beschädigung des Ventilgewindes'
      approval: 'QC-Inspektor'
    - code: MC-RW-02
      defect: Klasse B (Ventilumfang)
      scope: 'Abdichtung des Ventilbasisflanschs und kontrolliertes Klemmen'
      controls: 'Kontrollierte Oberflächenvorbereitung, freigegebenes Klebematerial, kreisförmige Druckvorrichtung'
      approval: 'QC + Engineering'
    - code: MC-RW-03
      defect: Klasse C (Oberflächenmikroleck)
      scope: 'Abdichtung von nicht strukturellen Nadelstichen'
      controls: 'Freigegebener Zweikomponenten-Klebstoff, kein Überlaufen in Grafiken oder EVA'
      approval: 'QC + Engineering'
    - code: MC-RW-04
      defect: Klasse D (Lokale Railnaht)
      scope: 'Neue Verklebung lokaler Rail-Überlappungsnähte'
      controls: 'Temperaturkontrollierte Hitzeaktivierung, Druckrolle, Anti-Aufroll-Vorrichtung'
      approval: 'Engineering + QA-Leiter'
    - code: MC-RW-05
      defect: Klasse B/C (Zubehörrand)
      scope: 'Finbox-Flicken und Abdichtung der Zubehör-Montagebasis'
      controls: 'Oberflächen-Haftvermittler, profilierter Klemmblock, definierte Haltezeit'
      approval: 'QC + Engineering'
    - code: MC-RW-06
      defect: Klasse D (Bug-/Hecknaht)
      scope: 'Intervention an hochbeanspruchten Krümmungsnähten'
      controls: 'Freigegebenes Hochscher-Klebematerial, verlängerte Aushärtezeit vor dem Nachtest'
      approval: 'Chefingenieur'
    - code: MC-RW-00
      defect: Klasse E/F/G (Kritisch / Bruch)
      scope: 'Verbindliche Verschrottung und physische Zerstörung'
      controls: 'Physisches Durchtrennen zur Verhinderung von Vermischung, Verschrottungsprotokoll, abteilungsübergreifende Root-Cause-Prüfung'
      approval: 'Werksleiter'

inspector_friendly:
  tagline: Drittprüfung
  title: Prüferfreundliches Protokoll
  body: |
    Wir stellen einen eigenen Prüfbereich mit kalibrierten Druckmessgeräten, standardisierten Leuchttischen für Naht- und Grafikprüfungen sowie vorbefüllten Inspektionskurzbriefen bereit, damit Drittorganisationen (SGS, BV, Intertek, QIMA) ihre Versandvorinspektion effizient durchführen können — das spart Ihnen Inspektions-Overhead.

    Jeder Kurzbrief fasst die geltenden Dokumentrevisionen, die freigegebene Musterreferenz, die kritisch-qualitätsrelevanten Prüfungen, das vereinbarte Stichprobenniveau, Funktionstests sowie die Verpackungs- und Barcodeanforderungen für die PO zusammen. Spezifizierte Mengen, Qualität, Verpackung und grundlegende Sicherheitsaspekte werden gegen die freigegebenen Projektreferenzen verifiziert — kein hektisches Dokumentensuchen vor Ort.

