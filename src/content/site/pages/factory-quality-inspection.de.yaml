    - **Versandstatus:** FREIGEGEBEN

quarantine_intro:
  tagline: Nichtkonformitätskontrolle
  title: Kontrolle nichtkonformer Produkte & Quarantäne
  body: |
    Produkte oder Komponenten, die die definierten Annahmekriterien nicht erfüllen, werden klar gekennzeichnet und kontrolliert gesperrt oder unter Quarantäne gestellt. Sie dürfen erst nach Abschluss einer autorisierten Disposition in die nächste Produktionsstufe, die Verpackung oder den Versand gelangen. Nacharbeit erfolgt nach freigegebenen Anweisungen und wird mit dem zugehörigen Nichtkonformitätsnachweis verknüpft; nachgearbeitete Einheiten werden vor der Qualitätsfreigabe gegen die geltenden Projektanforderungen erneut geprüft.

quarantine_flow:
  tagline: 7-stufiger Kontrollablauf
  title: Was passiert, wenn eine Nichtkonformität gefunden wird
  subtitle: Identifizieren, sperren, korrigieren, verifizieren —dann freigeben oder zurückweisen. Nichtkonforme Produkte fließen niemals ungeprüft in die Produktion oder Verpackung zurück.
  steps:
    - step: '01'
      title: Identifizieren
      desc: Die Nichtkonformität wird gegen das betroffene Produkt, die SKU, die Charge oder die Prozessstufe erfasst.
    - step: '02'
      title: Kennzeichnen
      desc: Betroffene Einheiten werden klar mit kontrollierten Statuseitiketten gekennzeichnet —HOLD, quarantäniert oder zurückgewiesen.
    - step: '03'
      title: Quarantäne
      desc: Einheiten werden in einem physisch kontrollierten Quarantänebereich oder systemgesteuert separiert, um unbeabsichtigte Verwendung oder Versand zu verhindern.
    - step: '04'
      title: Umfang bewerten
      desc: Der betroffene Umfang wird nach Charge, Prozessstufe, Materiallos und Dokumentrevision geprüft.
    - step: '05'
      title: Nacharbeiten / Ersetzen
      desc: Eine Korrektur ist nur über eine freigegebene Disposition und eine kontrollierte Arbeitsanweisung zulässig.
    - step: '06'
      title: Erneut prüfen
      desc: Korrigierte Einheiten werden vor der Freigabe gegen die geltenden Annahmekriterien erneut geprüft.
    - step: '07'
      title: Freigeben oder zurückweisen
      desc: Nur autorisiertes, konformes Produkt gelangt zur Verpackung oder Versandfreigabe.

