answer:
  label: 'Klare Antwort'
  text: 'QINGDAO VATRAD GROUP.,LTD. steuert die Qualität aufblasbarer SUPs über ein 4-stufiges Verifikationssystem: Wareneingangskontrolle (IQC), In-Prozess-Qualitätskontrolle (IPQC), finale Boardprüfung und Aufblasverifizierung (FQC) sowie Verpackungs- und Versandvorfreigabe (OQC). Jede Bestellung wird gegen das freigegebene Muster, die technische Spezifikation, den Artwork-Proof, die BOM und die Verpackungsstandards geprüft — einschließlich Luftdichtigkeitsverifizierung, Sicht- und Maßprüfungen, Zubehörbestätigung und Chargenrückverfolgbarkeit. Einheiten, die die Annahmekriterien nicht erfüllen, werden kontrolliert gesperrt oder unter Quarantäne gestellt, ausschließlich nach freigegebenen Anweisungen nachgearbeitet und vor der autorisierten Freigabe erneut geprüft.'
  verified: 'September 2026'

intro: 'Unser Qualitätssystem ist für OEM/ODM-Projekte aufgebaut: Inspektionskriterien werden pro Bestellung definiert, dokumentiert und vom Produktions- und Qualitätsteam vom Wareneingang bis zur Verpackung befolgt. Dadurch bleibt die Qualitätserwartung zwischen Fabrik und Ihrer Marke vom ersten Muster bis zu vollständigen Containerlieferungen abgestimmt.'

scope_note:
  tagline: Umfang
  title: Projektspezifische Inspektionskriterien
  body: |
    Die Qualitätsspezifikationen können je nach Boardkonstruktion (z. B. ein-/zweilagig, gewebebasierte Drop-Stitch, verklebtes Rail), vorgesehenem Einsatzweck, Zielmarkt-Vorschriften und kundenfreigegebenen Parametern variieren. Die endgültige Freigabe basiert strikt auf den dokumentierten Inspektionskriterien, die für die Bestellung vereinbart wurden.

stages:
  tagline: Qualitätsrahmen
  title: Unser 4-stufiges Qualitätsverifikationssystem
  subtitle: Ein vollständiger QC-Kreislauf vom Rohmaterialeingang bis zur Versandfreigabe.
  steps:
    - title: '1. Wareneingangskontrolle (IQC)'
      desc: 'Hauptmaterialien und zugekaufte Komponenten werden vor dem Eintritt in die Produktionslinie gegen freigegebene Spezifikationen und Referenzmuster geprüft. Drop-Stitch- und PVC-Material werden auf Materialidentifikation, Lieferantencharge, Gewicht/Dichte, Dicke, Farbabgleich gegen freigegebene Muster sowie Oberflächenfehler verifiziert. EVA-Traktionspads werden auf Muster, Farbe, Dicke, Schnittgenauigkeit und Klebstoffkompatibilität geprüft. Ventile und Beschläge durchlaufen Funktions-, Gewinde-, Dichtungsintegritäts- und Passungstests. Zubehör und Verpackung (Pumpen, Paddel, Finnen, Leinen, Taschen, Kartons) werden nach Menge, Farbe, Branding, Barcode-Genauigkeit und Artwork-Version gegen die freigegebene BOM abgeglichen.'
    - title: '2. In-Prozess-Qualitätskontrolle (IPQC)'
      desc: 'Kritische Fertigungsschritte werden inspiziert, um Nichtkonformitäten zu erkennen, bevor Boards zu nachgelagerten Arbeitsstationen gelangen. Zuschnitt und Druck werden auf Panelmaße, Artwork-Layout, Spiegelorientierung und Kantensauberkeit gegen freigegebene technische Zeichnungen verifiziert. Boardmontage und Railverklebung werden auf Rumpfsymmetrie, Nahtüberlappungskontinuität und die Vermeidung von Hohlräumen oder Lufttaschen entlang hochbeanspruchter Bereiche geprüft. Ventil- und Zubehörbefestigung, Grafiken und Branding werden auf Position, Ausrichtung, Klebstoffabdeckung, Logo-Schreibweise und Artwork-Version verifiziert.'
    - title: '3. Finale Boardprüfung & Aufblasverifizierung (FQC)'
      desc: 'Fertiggestellte Boards durchlaufen vor der Verpackungsfreigabe verbindliche physische und strukturelle Tests. Die Boards werden auf den projektfreigegebenen Prüfdruck aufgeblasen und gehalten, um strukturelle Steifigkeit und Druckstabilität zu verifizieren. Luftdichtigkeits-Scans decken das Ventilgehäuse, die Railnähte, Bug-/Heckkegel und Spannungsfugen unter Verwendung kalibrierter Leckerkennungsmethoden (Druckabfallüberwachung oder Blasentest) ab. Kosmetische und maßliche Inspektion verifiziert Maße, Rockerprofil und EVA-Pad-Ausrichtung (Toleranz ±2 mm) unter Normallicht-Tageslichtbedingungen.'
    - title: '4. Verpackung & Versandvorfreigabe (OQC)'
      desc: 'Umfassende Versandvorverifizierung stellt einen Abgleich von SKU-Konfiguration und Versandkennzeichnungen mit Null Abweichung sicher. Die Kit-Vollständigkeitsprüfung gleicht Board, Finne, Leine, Paddel, Pumpe, Tasche, Reparaturset und Bedienungsanleitung gegen die Bestell-BOM ab. Verpackungs- und Barcode-Prüfungen verifizieren Kartonkennzeichnungen, SKU-Etiketten, Barcode-Lesbarkeit, Sprache der Anleitung und strukturelle Integrität des Kartons. Bestellungen werden erst nach der abschließenden, von autorisiertem Qualitätspersonal unterzeichneten Verpackungsprüfung freigegeben.'

inspection_points:
  tagline: Inspektionsabdeckung
  title: Wichtige Inspektions-Kontrollpunkte
  subtitle: Jeder Kontrollpunkt wird gegen dokumentierte, pro Bestellung vereinbarte Annahmekriterien ausgeführt.
  features:
    - icon: A
      icon_bg: blue
      title: Luftdichtigkeitsverifizierung
      desc: 'Fertiggestellte Boards werden auf den freigegebenen Prüfdruck aufgeblasen und auf Druckhaltung, Ventilbasiszustand, Railnähte, Bug- und Heckbereiche sowie hochbeanspruchte Stellen geprüft. Wo es das Inspektionsverfahren vorsieht, werden vermutete Leckagebereiche mit freigegebenen Leckerkennungsmethoden untersucht.'
    - icon: B
      icon_bg: green
      title: Sicht- & Maßkontrolle
      desc: 'Boards werden unter geeigneter Beleuchtung auf Materialoberflächenzustand, Druckfehler, Farbabweichungen, EVA-Ausrichtung, Falten, Kratzer, Verunreinigungen und Verklebungsoptik geprüft. Schlüsselmaße und Zubehörpositionen werden gegen freigegebene Zeichnungen oder Spezifikationen verifiziert.'
    - icon: C
      icon_bg: purple
      title: Zubehör- & Verpackungsverifizierung
      desc: 'Vor dem Versand wird die vollständige Produktkonfiguration verifiziert: Boardmodell, Finnen-System, Paddel, Pumpe, Leine, Tragetasche, Reparaturset, Bedienungsanleitung und kundenspezifisches Zubehör — jeweils abgeglichen gegen das freigegebene Muster, die Zeichnungen und die BOM.'
    - icon: D
      icon_bg: orange
      title: Verpackung & Versandfreigabe
      desc: 'Verpackte Einheiten werden auf SKU-Konfiguration, Zubehörvollständigkeit, Produktetiketten, Barcode-Informationen, Version der Bedienungsanleitung, Kartonkennzeichnung, Verpackungsmenge und Kartonzustand geprüft. Die Versandfreigabe wird nur nach Abschluss aller Inspektions- und Verpackungsanforderungen autorisiert.'

traceability_intro:
  tagline: Chargenrückverfolgbarkeit
  title: Projekt- & Chargenrückverfolgbarkeitssystem
  body: |
    Jede kundenspezifische SUP-Bestellung wird unter einem einheitlichen Projektcode verwaltet, der technische Spezifikationen, die freigegebene BOM, Artwork-Revisionen, Materiallosenummern, Verpackungsreferenzen und Inspektionsaufzeichnungen verknüpft. Produktions- und Inspektionsaufzeichnungen werden je anwendbarem Projekt und Produktionscharge geführt, und jede Charge kann auf die freigegebene Produktspezifikation, BOM, Artwork und Verpackungsreferenzen zurückgeführt werden.

    Dies unterstützt die effiziente Prüfung von Produktkonfiguration, Inspektionsstatus und betroffenem Umfang, falls ein Qualitätsbedenken festgestellt wird — vom fertigen Produkt zurück zu den Ursprungsaufzeichnungen über die Board- oder Kartonidentifikation.

traceability_chain:
  tagline: Rückverfolgbarkeitskette
  title: Vom Projektcode zur Versandfreigabe
  subtitle: Eine Kette kontrollierter Referenzen von der Auftragsbestätigung bis zum autorisierten Versand.
  steps:
    - step: '01'
      title: Projektcode
      desc: Einheitliche Projektreferenz, die jedes kontrollierte Dokument mit der Bestellung verknüpft.
    - step: '02'
      title: Dokumentrevisionen
      desc: Aktuelle Revisionsstände von Spezifikation, BOM, Artwork und Verpackung —nur freigegebene Versionen sind für die Produktion gültig.
    - step: '03'
      title: Charge & Materialien
      desc: Material- und Komponentenlose werden gegen die Produktionscharge aufgezeichnet.
    - step: '04'
      title: Inspektionsaufzeichnungen
      desc: IQC-, In-Prozess-, Luftdichtigkeits-, Final- und Verpackungsinspektionsergebnisse je Charge.
    - step: '05'
      title: Verpackung & Freigabe
      desc: Verpackungscharge, NCR-Abschlussstatus und autorisierte Versandfreigabe-Übersicht.

traceability_sample:
  tagline: Anonymisiertes Beispiel
  title: Rückverfolgbarkeits-Kontrollaufzeichnung (Demo)
  body: |
    Die Demonstrationswerte dienen nur zur Veranschaulichung — Kundenname, Bestellnummern, kundenspezifisches Artwork, Lieferantendaten und kommerzielle Informationen wurden zum Schutz der Vertraulichkeit entfernt.

