rework_intro:
  tagline: Nacharbeits-Governance
  title: Kontrollierte Luftdichtigkeits-Nichtkonformität & Nacharbeits-Governance
  body: |
    Bei QINGDAO VATRAD GROUP.,LTD. ist Nacharbeit strikt als Wiederherstellung einer nichtkonformen Einheit zur vollständigen Konformität mit ihrer ursprünglichen technischen Spezifikation definiert — nicht als schnelle Flick-Lösung. Jedes Board mit einer Luftdichtigkeits-Nichtkonformität wird kontrolliert gesperrt und vor jeder weiteren Verarbeitung mit einem Nichtkonformitätsbericht (NCR) verknüpft; die Leckquelle wird mit der freigegebenen Diagnosemethode lokalisiert und aufgezeichnet.

    Nacharbeit darf nur fortgesetzt werden, wenn der Fehler innerhalb des freigegebenen Nacharbeitsumfangs liegt und eine autorisierte Methode verfügbar ist. Die Nacharbeitsanweisung identifiziert Produkt, Charge, Fehlerstelle, freigegebenes Material, Methode, erforderliche Bedingungen und den erneuten Prüfumfang. Nach der erforderlichen Aushärte- oder Stabilisierungsphase wird das Board gegen dieselben geltenden Annahmekriterien wie ein konformes Board erneut geprüft — Nacharbeit senkt den Annahmestandard nie. Scheitert die erneute Prüfung, ist eine erneute Engineering- und Qualitätsdisposition erforderlich; wiederholte Nacharbeit ist ohne dokumentierte Freigabe nicht zulässig.

rework_decision:
  tagline: Interaktiver Ablauf
  title: Nacharbeits-Entscheidungsablauf — jeden Knoten anklicken
  subtitle: Verfolgen Sie, wie eine Luftdichtigkeits-Nichtkonformität von der Erkennung bis zur Freigabe oder Verschrottung behandelt wird. Klicken Sie einen Knoten an, um die Kontrollanforderungen in diesem Schritt zu erweitern.
  nodes:
    - id: detect
      type: start
      label: Leck erkannt
      detail: 'Während der Inspektion wird eine Luftdichtigkeits-Nichtkonformität festgestellt — Druckhaltefehler, sichtbare Leckage oder ein verwandter Lufft-Systemfehler.'
    - id: hold
      type: step
      label: Linie stoppen · HOLD-Etikett · NCR
      detail: 'Die Verarbeitung wird gestoppt. Board-ID, Produktcode, Charge, Arbeitsstation, Datum und Inspektor werden aufgezeichnet; ein HOLD- / Quarantäneetikett wird angebracht und ein NCR gegen die geltende Spezifikationsrevision eröffnet.'
    - id: locate
      type: step
      label: Leckquelle lokalisieren
      detail: 'Das Board wird auf den projektfreigegebenen Diagnosedruck aufgeblasen und die Quelle mit einer freigegebenen Methode lokalisiert — Druckhaltung, kalibrierter Blasentest, akustisches oder Leckerkennungsgerät.'
    - id: classify
      type: step
      label: Fehler klassifizieren (A–G)
      detail: 'Der Fehler wird gegen die Freigabematrix klassifiziert: A Ventilschnittstelle, B Ventilbasisnaht, C Oberflächen-Nadelstich, D lokale Railnaht, E großer Railschaden, F wiederkehrende Leckage, G struktureller Schaden.'
    - id: authorize
      type: decision
      label: Nacharbeit autorisiert?
      yes: rework
      no: escalate
      detail: 'QC bestätigt die Fehlerkategorie, und Engineering prüft, ob das Board auf seine ursprüngliche Spezifikation zurückgeführt werden kann. Die Autorisierung dokumentiert Methodenkarte, Materialien, Bedingungen und erneuten Prüfumfang — oder führt zu Ersatz, Rückweisung, Verschrottung oder Kundenkonzession.'
    - id: rework
      type: step
      label: Kontrollierte Nacharbeit
      detail: 'Wird ausschließlich innerhalb der freigegebenen Fehlergrenze unter Verwendung der freigegebenen Methodenkarte, Materialcharge und Werkzeuge ausgeführt — ohne jemals Maße, Konstruktion, Grafiken, Zubehör oder Verpackungsanforderungen zu verändern.'
    - id: cure
      type: step
      label: Aushärtung & Stabilisierung
      detail: 'Das Board bleibt während der durch die freigegebene Material- und Prozessanweisung definierten Aushärte- und Stabilisierungsphase auf HOLD und erhält anschließend eine visuelle und verarbeitungsbezogene Vorprüfung.'
    - id: reinspect
      type: decision
      label: Erneute Prüfung bestanden?
      yes: release
      no: escalate
      detail: 'Das Board wird auf den projektfreigegebenen erneuten Prüfdruck aufgeblasen, und der ursprüngliche Fehler sowie alle potenziell betroffenen Merkmale werden erneut verifiziert — Leckstelle, Ventil, Rails, Nähte, hochbeanspruchte Bereiche, Zubehör und Erscheinungsbild. Nacharbeit senkt den Annahmestandard nie.'
    - id: release
      type: release
      label: Qualitätsfreigabe
      detail: 'Qualität prüft den abgeschlossenen NCR, die Nacharbeitsaufzeichnung und das Ergebnis der erneuten Prüfung und autorisiert die Freigabe. Kein nachgearbeitetes Board wird ohne autorisierte Qualitätsfreigabe verpackt oder versendet.'
    - id: escalate
      type: escalate
      label: Eskalation — ersetzen / verschrotten / Konzession
      detail: 'Keine wiederholte Nacharbeit ohne dokumentierte Freigabe. Das Board wird ersetzt, zurückgewiesen, verschrottet oder dem Kunden eine schriftliche Konzession angeboten, wenn die ursprüngliche Spezifikation nicht wiederhergestellt werden kann.'

defect_matrix:
  tagline: Fehlerklassifizierung
  title: Luftdichtigkeits-Fehlerklassifizierung & Freigabematrix
  subtitle: Nicht jedes Leck wird nachgearbeitet — jeder Fehler wird klassifiziert und seine Disposition auf der richtigen Ebene freigegeben, vom QC-Inspektor bis zum Werksleiter.
  headers:
    category: Fehlerkategorie
    area: Typischer Bereich
    eligibility: Nacharbeits-Eignung
    approval: Erforderliche Freigabe
  rows:
    - category: 'Klasse A — Ventilschnittstelle'
      area: 'Ventilkern, Kappendichtung, Dichtung, Pumpenschnittstelle'
      eligibility: 'Standardnacharbeit autorisiert'
      approval: 'QC-Inspektor'
    - category: 'Klasse B — Ventilbasisnaht'
      area: 'Mikroleckage entlang des Ventilrands'
      eligibility: 'Bewertete Nacharbeit nach der freigegebenen Methodenkarte'
      approval: 'QC + Engineering'
    - category: 'Klasse C — Oberflächen-Nadelstich'
      area: 'Lokaler Mikro-Nadelstich auf einer nicht beanspruchten Oberfläche'
      eligibility: 'Nur autorisiert, wenn konform mit den Kundenspezifikationen'
      approval: 'QC + Engineering'
    - category: 'Klasse D — Lokale Railnaht'
      area: 'Lokale Überlappungsleckage am Railband'
      eligibility: 'Hohes Risiko; strenge Engineering-Disposition erforderlich'
      approval: 'Engineering + QA-Leiter'
    - category: 'Klasse E — Großer Railschaden'
      area: 'Durchgehender Nahtausfall in hochbeanspruchten Zonen'
      eligibility: 'Standardnacharbeit nicht autorisiert — Ersatz oder Root-Cause-Prüfung'
      approval: 'QA-Leiter + Kundenkonzession'
    - category: 'Klasse F — Wiederkehrende Leckage'
      area: 'Nicht lokalisierbares Leck oder Fehler im Nachtest'
      eligibility: 'Keine wiederholte Nacharbeit; Ersatz, Verschrottung oder Engineering-Root-Cause-Analyse'
