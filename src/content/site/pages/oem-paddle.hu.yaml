answer:
  label: 'Közvetlen válasz'
  text: 'A minimális megrendelési mennyiséget a projekt konfigurációja erősíti meg: minta (1–2 darab), pilótaszállítmány (20–50 darab) és standard térfogat (90–100+ darab szállítmányonként, egy 150 m-es drop-stitch tekercsből), kis szállítmányú közös márkázás lehetőségével 5–10 darabtól. A mintákat 7–12 nap alatt adjuk fel; a sorozatgyártás a megrendelés kiadása és az előleg beérkezése után 25–35 napot tart. Az EU-piacra szánt modellek CE-tanúsítása és a teljes megfelelőségi dokumentáció minden megrendelés része.'
  verified: '2026. szeptember'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Testreszabott OEM felfújható evező márkalogóval
  actions:
