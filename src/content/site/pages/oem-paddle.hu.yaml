faqs:
  title: 'Gyakori kérdések a felfújható evezők OEM gyártásáról'
  subtitle: 'Válaszok azoknak a márkáknak a leggyakoribb kérdéseire, amelyek saját evezőt indítanak.'
  items:
    - title: 'Hogyan hozhatok létre saját evezőmárkát?'
      description: 'Indítsa el a márkáját: specifikációs lap, design, CE-tanúsított prototípus, tömeggyártás és kiszállítás. Minták 7–12 nap alatt, gyártás 25–35 nap alatt a megrendelés és az előleg után. Fedezze fel OEM csomagjainkat.'
    - title: 'Mennyi a gyártási határidő?'
      description: 'A minta 7–12 nap alatt kész, a sorozatgyártás pedig a megrendelés és az előleg után térfogattól függően 25–35 napot tart.'
    - title: 'Rákerülhet az evezőre a logónk?'
      description: 'Igen – teljes private label: a logó nyomtatása, testreszabott színek, csomagolás és címkék az Ön márkájában.'
    - title: 'Nagykereskedelmi mennyiséget már az elején rendelhetek?'
      description: 'A MOQ-t a projekt konfigurációja erősíti meg – minta (1–2 darab), pilótaszállítmány (20–50 darab) és standard térfogat (90–100+ darab szállítmányonként), nagykereskedelmi árszintekkel, amelyek a térfogat növekedésével csökkennek.'

