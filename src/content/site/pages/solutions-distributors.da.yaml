faqs:
  tagline: FAQ for distributører
  title: 'Engrosdistributionsprogram — ofte stillede spørgsmål'
  items:
    - q: 'Hvad er minimumsordren for en ny distributør?'
      a: 'Nye distributionspartnere åbner typisk med en prøve- og førproduktionsgodkendelsesordre efterfulgt af en første container, der planlægges til deres sæson. De præcise minimums afhænger af områdets størrelse og det valgte sortiment; din kontaktansvarlige bekræfter åbningsvolumen under planlægningen af sortiment og branding.'
    - q: 'Kan vi sælge brætterne under vores eget mærke?'
      a: 'Ja. Private label er standardmodellen her: brætterne produceres under dit mærke med dit artwork, din emballage og dine specifikationer. iSupfactory producerer udelukkende for sine kunder og konkurrerer ikke med dem på noget marked.'
    - q: 'Er områderne eksklusive?'
      a: 'Ja. Distributionsprogrammer bygges på eksklusive områder — hver engrospartner dækker et afgrænset land eller en region og modtager priser og programstøtte til det marked, som det er fastlagt i den kommercielle aftale.'
    - q: 'Støtter I drop-shipping?'
      a: 'Drop-ship-mulighed er en del af programmet. Prøver, emballage og håndtering valideres under prøvegodkendelsen, så drop-ship-ordrer kører problemfrit fra dag et.'
    - q: 'Hvilke modeller kan vi bestille?'
      a: 'Produktionskataloget dækker oppustelige SUP-brætter i alle former for allround, touring og surf, oppustelige kajakker, pumper, pagaj, redningsveste og plejetilbehør samt specialformer udviklet sammen med vores konstruktionsteam. De fleste partnere åbner med 4–8 bedst sælgende SKU’er og udvider i de senere sæsoner.'
    - q: 'Hvordan sendes ordrer?'
      a: 'Ordrer forlader fabrikken med planlagte afsejlinger, og fremadstilling af ordrer er mulig for at stabilisere fragtomkostningerne. Din dedikerede kontaktansvarlige planlægger produktion og afsendelse ud fra din prognose og sæsonkalenderen.'
    - q: 'Hvordan ansøger jeg?'
      a: 'Brug ansøgningsformularen på denne side, eller kontakt os direkte. Ansøgningerne gennemgås af distributionsteamet, og vi svarer med de næste skridt, herunder kortlægning af områder og et udkast til aftale, inden for få arbejdsdage.'

