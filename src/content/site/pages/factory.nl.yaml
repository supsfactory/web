hero:
  tagline: Fabriek
  title: Fabriek & productie
  subtitle: 'SUP-fabriek van 12.500 m² in Qingdao, China — op maat gemaakte SUP-productie van PVC-grondstof tot afgewerkte opblaasbare paddle board'

answer:
  label: 'Helder antwoord'
  text: 'Gecertificeerde fabriek van opblaasbare SUP''s in Qingdao, China: ISO 9001, ISO 25649, BSCI, CE, REACH en RoHS. Productielocatie van 12.500 m² met 4 gespecialiseerde werkplaatsen, meer dan 350 medewerkers, meer dan 120.000 planken per jaar geproduceerd (10.000 planken/maand op 4 geautomatiseerde lijnen). Elke plank wordt 24 uur op 18.0 PSI getest op druk, doorloopt een 100-punts assemblagechecklist en draagt een materialentraceerbaarheid van 10 jaar.'
  verified: 'September 2026'

intro:
  - 'Als productiedivisie van de **Qingdao Vatrad Group Co., Ltd.** controleert Vatrad elke fase van de productie van opblaasbare SUP''s — van de ingang van de ruwe PVC-materialen tot de uiteindelijke pre-verzendingsinspectie van de afgewerkte paddle board. Onze productielocatie in de economische ontwikkelingszone van Qingdao beslaat 12.500 vierkante meter en huisvest werkplaatsen voor het snijden van PVC, het lamineren van de drop-stitch kern, het digitaal printen van SUP''s, de eindassemblage en de kwaliteitscontrole.'
  - 'Door design, engineering, prototyping, productie en testen onder één dak te integreren, elimineren we de inefficiënties van productie op bestelling en behouden we directe controle over bouwkwaliteit, materiaalkeuze en levertijden. Elke SUP die onze locatie verlaat, wordt gebouwd door onze mensen, met onze apparatuur, volgens onze normen.'

