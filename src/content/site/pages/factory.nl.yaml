qc_section:
  tagline: Kwaliteitscontrole
  title: Testproces & kwaliteitsborging
  subtitle: Elke plank doorstaat vóór de verzending een verplichte test. Ons kwaliteitslaboratorium werkt onafhankelijk van de productie en rapporteert rechtstreeks aan de directie.
  steps:
    - step: '1'
      title: Controle van grondstoffen
      desc: De PVC-, Hypalon- en drop-stitch weefsels worden onderworpen aan treksterkteproeven, scheurtests en verificatie van de UV-bestendigheid vóórdat een partij de productie ingaat.
    - step: '2'
      title: 24-uurs luchtdichtheidstest
      desc: Elke kamer wordt opgepompt tot 18.0 PSI en 24 uur behouden. Een drukverlies van meer dan 0.50 PSI activeert automatische afkeuring en hercontrole van de naden.
    - step: '3'
      title: Belasting- & balanstest
      desc: De afgewerkte planken worden opgepompt tot de nominale druk en gecontroleerd op symmetrische vulling, stijfheid bij 15 PSI en stabiliteit onder belasting. Elke plank wordt in ons testbassin in het water getest vóór de eindcontrole.

oem_section:
  tagline: OEM-projecten
  title: Casestudies van partnerschappen met merken & OEM
  subtitle: Van concept tot productie — hoe wij wereldwijde merken helpen hun lijnen opblaasbare SUP''s te lanceren en op te schalen.
  cases:
    - challenge: Een Europese outdoordetailhandelaar had een private label SUP-lijn nodig met unieke deck-graphics, eco-vriendelijk PVC en retail-ready verpakking — alles binnen 60 dagen geleverd.
      solution: Ontwikkeling van op maat gemaakte digitale printbestanden, inkoop van REACH-conform PVC en compressie van de monsterfase van 3 rondes naar 1 dankzij het design-team dat in onze fabriek in Qingdao is gehuisvest.
      result: 'Productie in 25–35 dagen na de ondertekende order, met de eerste levering binnen het venster van 60 dagen. 2.400 eenheden op 4 SKU''s. Herhalingsorder vóórdat de eerste partij volledig was geleverd.'
      disclaimer: 'Geanonimiseerde projectsamenvatting — het projecttype en de -omvang zijn representatief; de concrete resultaten zijn niet onafhankelijk verifieerbaar.'
    - challenge: Een Amerikaanse watersport-startup had een hoogwaardige drop-stitch SUP nodig met een aangepaste vorm, co-branding verpakking en BSCI-certificering voor de retail.
      solution: Aanpassing van een bestaande SUP-vorm met een gewijzigde contour, ontwikkeling van co-branding verpakkingsgraphics en levering van de volledige BSCI-auditdocumentatie.
      result: 'Succesvolle positionering bij toonaangevende Amerikaanse outdoordetailhandelaren, met sterke opwaartse beweging dankzij meer dan 5.000 verkochte eenheden in het eerste jaar en een completionspercentage van 98%.'
      disclaimer: 'Geanonimiseerde projectsamenvatting — het projecttype en de -omvang zijn representatief; de concrete resultaten zijn niet onafhankelijk verifieerbaar.'
    - challenge: Een Australische distributeur had een CE-gecertificeerde SUP-serie nodig met aangepaste kleuren en conformiteit met de Australische normen.
      solution: Productie van pre-serie monsters met 4 kleurvarianten en coördinatie van conformiteitstests door derden.
      result: 'Lancering van een SUP-serie met 3 modellen op de AU/NZ-markt. Gevolgd door een succesvolle overheidsaanbesteding voor 12 patrouille-SUP''s.'
      disclaimer: 'Geanonimiseerde projectsamenvatting — het projecttype en de -omvang zijn representatief; de concrete resultaten zijn niet onafhankelijk verifieerbaar.'

faq_section:
  tagline: FAQ
  title: Veelgestelde vragen over B2B & OEM
  questions:
    - q: Wat is de minimale bestelhoeveelheid (MOQ) voor OEM-opblaasbare SUP-planken?
      a: 'De MOQ wordt bevestigd op basis van de projectconfiguratie en niet door een vast getal — romp en uitrusting, kleur- en PVC-varianten, graphics, verpakking en accessoires. De standaard serieproductie draait met 90–100+ eenheden per partij vanaf een volledige drop-stitch rol van 150 m, co-branding in kleine loten start vanaf 5–10 eenheden en elk project doorloopt de fases van monster (1–2 eenheden) en pilot (20–50 eenheden). Raadpleeg onze gids voor flexibele MOQ & branding voor de volledige berekeningslogica.'
    - q: Heeft Vatrad een BSCI-certificering?
      a: 'Ja. Onze fabriek beschikt over een geldige BSCI-certificering voor sociale conformiteit (auditrapport op aanvraag beschikbaar). Daarnaast handhaven wij ISO 9001 voor kwaliteitsbeheer. De CE-certificering is van toepassing op modellen die bestemd zijn voor de EU-markt; de scope wordt per project bevestigd. REACH- en RoHS-conformiteitsdocumentatie wordt met elke OEM-order meegeleverd.'
    - q: Wat is de typische levertijd voor een OEM-order?
      a: 'De standaard levertijd is 25–35 dagen na bevestigde PO en aanbetaling voor volume-OEM-productie. Het ontwerp van aangepaste vormen voegt 15–20 dagen toe voor de realisatie van de matrijs. Express-productie is beschikbaar voor spoedorders en seizoenspieken. Prototypemonsters zijn doorgaans klaar binnen 7–12 dagen.'
    - q: Behandelen jullie de commerciële exportdocumentatie?
      a: 'Ja. Ons team behandelt in-house de commerciële exportdocumentatie en de douaneafhandeling, en wij verzenden naar meer dan 50 landen in de EU-, VS-, AU- en Aziatische markten.'

b2b_moq: 'MOQ bevestigd op basis van de projectconfiguratie: monster 1–2, pilot 20–50, hoeveelheid 90–100+ (per rol van 150 m); co-branding in kleine loten vanaf 5–10 eenheden.'

production_flow:
  tagline: Productie-flow
  title: Van materiaal tot afgewerkte plank
  subtitle: Elke plank doorloopt 6 productiefases met QC-controlepunten bij elke stap. Geen shortcuts, geen overgeslagen inspecties.
  stages:
    - stage: '01'
      title: Ingang goederen & ingangs-QC
      description: 'Alle binnenkomende materialen worden in ons ERP-systeem geregistreerd met een lotnummer. De rollen PVC-weefsel, drop-stitch kernen, ventielen, lijmen en onderdelen worden in quarantaine gehouden tot de QC-vrijgave.'
      qc_check: 'Treksterkte (ASTM D751), scheurvastheid (ISO 4674), diktemeting, lijmviscositeit, scan op visuele defecten'
      qc_threshold: '100% van de loten getest. Afkeuring als de treksterkte < 90% van de specificatie is, de scheurvastheid < het spec-minimum of er een visueel defect aanwezig is'
      responsibility: Ingangs-QC-team (3 inspecteurs)
    - stage: '02'
      title: CNC-snijden & materiaalvoorbereiding
      description: 'De computergeoptimaliseerde nestindeling plaatst de panelen op het PVC-uitgangsmateriaal om afval te minimaliseren. De automatische CNC-snijmachines behouden een positioneringsnauwkeurigheid van 0.1 mm.'
      qc_check: 'Maatscontrole tegen de CAD-DXF-bestanden, inspectie van de randkwaliteit, controle van het aantal panelen'
      qc_threshold: 'Gemeten om de 20e paneel. Tolerantie ±0.5 mm. Partij afkeuren als >2% buiten tolerantie is'
      responsibility: Hoofd van de snijwerkplaats
    - stage: '03'
      title: Lassen & drop-stitch verlijmen
      description: 'De drop-stitch kernen worden via heetlamineren aan de externe PVC-lagen verlijmd. De kamers worden gelast met HF of hete lucht. De railbanden worden verlijmd via drielaagse fusie.'
      qc_check: 'Peelingtest elke 50 eenheden (ASTM D751), meting van de lasbreedte, controle van het hetelucht-temperatuurlogboek, visuele inspectie van de naden tegen het licht'
      qc_threshold: 'Peelsterkte min. 8 N/cm. Tolerantie lasbreedte ±1 mm. Zichtbare groef = afkeuring'
      responsibility: Las-QC (2 inspecteurs per ploeg)
    - stage: '04'
      title: Assemblage & afmontage
      description: 'De planken gaan de eindassemblage in waar alle componenten samenkomen: gelaste deck- en romppanelen, geïnstalleerde ventielen, D-ringen, handvatten, fin boxen en gemonteerde transporttas. Elke eenheid volgt een 100-punts assemblagechecklist.'
      qc_check: 'Vrijgave van de 100-punts checklist per eenheid, functionele ventieltest (10 open-/sluitcycli), controle van het aanhaalmoment van de onderdelen, visuele inspectie'
      qc_threshold: 'Nuldefectenbeleid op veiligheidskritieke componenten (ventielen, D-ringen, handvatten). Kleine cosmetische fouten: AQL 2.5 (ISO 2859)'
      responsibility: Assemblage-ploegleider + lijn-QC
    - stage: '05'
      title: Drukproef & kwaliteitspoort
      description: 'Elke kamer wordt opgepompt tot 18.0 PSI (voor een SUP met een rating van 12–15 PSI) en 24 uur behouden. De druksensoren registreren continu. Kamers met een drukverlies van meer dan 0.50 PSI worden afgekeurd en naar de hercontrole van de naden gestuurd.'
      qc_check: 'Registratie van 24-u drukbehoud, dagelijkse verificatie van de sensorkalibratie, temperatuurgecompenseerde drukmetering, naadtest na reparatie'
      qc_threshold: 'Max. 0.50 PSI drukverlies in 24u bij stabiele temperatuur. Elke kamer die dit overschrijdt = 100% hertest van de volledige productiepartij'
      responsibility: Kwaliteitslaboratorium (onafhankelijk van productie, rapporteert aan de directie)
    - stage: '06'
      title: Eindcontrole & verpakking
      description: 'Definitieve visuele en functionele controle. Oppervlaktedefecten, kleurconsistentie, verificatie van etiketten/streepjescodes, verpakkingsintegriteit en volledigheid van accessoires. De eenheden worden vacuüm verpakt, in dozen geplaatst en laagsgewijs gepalletiseerd voor het laden van de container.'
      qc_check: 'Volledige visuele inspectie, accessoirechecklist per SKU, verpakkings-valuproef (1 m, steekproef), verificatie van etiket-/streepjescode-scans'
      qc_threshold: 'AQL 2.5 voor ernstige defecten, AQL 4.0 voor lichte defecten. Nultolerantie op veiligheidsdefecten. 100% van de eenheden visueel geïnspecteerd'
      responsibility: Eind-QC-team (4 inspecteurs) + verpakkings-ploegleider

