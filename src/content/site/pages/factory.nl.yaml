  title: 'Fabriek & productie — OEM van opblaasbare SUP''s'
  description: 'Bezoek de Vatrad-fabriek: een productielocatie van 12.500 m² met snijden, hogefrequentielassen, lamineren, assemblage en een kwaliteitslaboratorium voor de OEM/ODM-productie van opblaasbare SUP''s.'
