material_traceability:
  tagline: Traceerbaarheid
  title: Materiaal tracking & lotcontrole
  description: Elke partij grondstof ontvangt een uniek lotnummer in ons ERP-systeem. Van de ingang tot de productie en het eindproduct verwijst de stuklijst van elke plank terug naar het oorspronkelijke leverancierslot. Dit maakt volledige upstream-traceerbaarheid mogelijk voor elke kwaliteits- of compliance-aangelegenheid.
  system: ERP op maat (intern systeem van de Qingdao Vatrad Group) + fysieke lotmarkeringen op elke werkopdracht
  coverage: '100% van het productiemateriaal — PVC, Hypalon, drop-stitch weefsel, lijmen, ventielen, onderdelen, verpakking'
  records_retained: 10 jaar (volgens vereiste CE 2013/53/UE)
  suppliers:
    - material: Marine-grade PVC
      source: Chinese en Koreaanse leveranciers
      certified: ISO 9001, REACH, RoHS
    - material: 'Hypalon (CSM)'
      source: Japanse leverancier
      certified: ISO 9001, REACH
    - material: Drop-stitch weefsel
      source: Eigen weverij + externe partner
      certified: Interne QC + ISO 9001-leverancier
    - material: Ventielen & onderdelen
      source: Chinese OEM-leveranciers
      certified: ISO 9001, materiaalcertificaten per lot

