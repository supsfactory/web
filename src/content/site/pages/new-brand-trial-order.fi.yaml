scale_path:
  tagline: Koepiloinnin jälkeen
  title: 'Mitä tulee onnistuneen koepilottitilauksen jälkeen'
  subtitle: 'Koepilottitilaus on tarkoituksella suunniteltu pidemman suhteen ensimmäiseksi askeleeksi. Tämä on reitti, jonka sovimme ennen ensimmäisen laudan lähetystä.'
  steps:
    - step: 'Vaihe 1'
      title: 'Koepilotti toimitettu ja arvioitu'
      desc: '20–50 lautaa saapuu kaudelle, ja myyntidata palaa kanavaltasi — vuokrauksesta, vähittäiskaupasta tai suoramyynnistä.'
    - step: 'Vaihe 2'
      title: 'Palaute ja hienosäätö'
      desc: 'Väriversioita, kuvitusta, pakkausta ja lisävarustevalikoimaa säädetään todellisen markkinavasteen mukaan. Artwork ja materiaaliluettelo jäädytetään seuraavaa erää varten.'
    - step: 'Vaihe 3'
      title: 'Volyymierä (90–100+ lautaa)'
      desc: 'Vakiintuneet 150 m:n kankarullan sarjat täydellä tuotantotehokkuudella, brändätyllä vähittäiskauppapakkauksella ja volyymihinnalla — näytekreditiit on jo vähennetty.'
    - step: 'Vaihe 4'
