answer:
  label: 'Suora vastaus'
  text: 'Kyllä — voit aloittaa puhallettavien SUPien brändin matalan MOQ:n koepilottitilauksella. Lähtöpiste on porrastettu, ei kaikki-tai-ei-lainkään: tilaa ensin 1–2 näytettä (valmiina 7–12 päivässä) jäättääksesi rungon, kuvituksen ja pakkauksen jäädytetyiksi; tee sitten 20–50 laudan koepilottitilaus (tuotanto 25–35 päivässä) testataksesi todellista myyntiä; ja skaalaa lopulta vakiintuneisiin 90–100+ laudan sarjoihin 150 m:n drop-stitch-kankaarulla, kun formaatti on todennettu. Pien-erän co-branding alkaa jo 5–10 kpl:stä operaattoreille, jotka haluavat brändättyjä lautoja ilman mitään kehitysvaihetta. Ensimmäinen kontillisi tulee vasta, kun data sen kertoo.'
  verified: 'Syyskuu 2026'

trial_included:
  tagline: Mitä koepilottitilaus kattaa
  title: 'Kaikki, mitä lanseeraus tarvitsee, ilman ylimääräistä kustannuksia'
  subtitle: 'Koepilottitilaus ei ole pienennetty lasku — se on sama tehdasprosessi mitoitettuna lanseeraavalle brändille. Tässä on, mitä jokainen koepilottiohjelma sisältää.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Laudaplatforma ja rakenne'
      desc: 'Kentältestatut retkeily- ja all-around-rungot drop-stitch-rakenteella, kolmikerroksisella kiskonauhan fuusiolla ja 12–15 PSI:n jäykkyydellä — samat alustat, joita volyymiasiakkaamme käyttävät, varastokokoina 10 ft–11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Oma brändäys aidosti käyttöön'
      desc: 'Koko pinnan digitaalinen tai silk screen -artwork, EVA-koostumatyyny logollasi sekä toissijainen brändäys keulassa tai sivukiskoilla. Pien-erän co-brandingissa käytetään iSupfactoryn keskistä brändäystä ja logosi keulassa tai kiskoilla.'
    - icon: P
      icon_bg: purple
      title: 'Pakkausvaihtoehdot, jotka skaaloituvat'
      desc: 'Aloita yleisillä laatikolla ja viivakooditarroilla ja siirry myöhemmissä erissä täysvärisiin 5-kerroksisiin brändättyihin vähittäiskauppapakkauksiin. Mukautettu pakkaus kantaa oman painolaitteensa vähimmäismäärän; ylimääräiset laatikot varastoidaan ja luovutetaan aikataulussa.'
    - icon: Q
      icon_bg: orange
      title: 'Tehdastason laadunvalvonta'
      desc: 'Jokainen lauta läpäisee saman 100 pisteen kokoonpanotarkistuslistan ja 24 tunnin paine- ja ilmatiiviystestauksen (18.0 PSI:n pito, automaattinen hylkäys yli 0.50 PSI:n laskun yli), joka koskee kaikkia tilauksia, näytteitä ja kontillisia lähetyksiä.'
    - icon: D
      icon_bg: blue
      title: 'Vienti ja dokumentaatio'
      desc: 'CE-, ISO 9001-, BSCI-, REACH- ja RoHS-vaatimustenmukaisuusdokumentaatio, vientiluokan pakkaus ja merirahtiyhteistyö yli 50 maahan — aina 1 laudan näytteestä täysiin ohjelmiin.'
    - icon: T
      icon_bg: green
      title: 'Aikataulu, jolle voi suunnitella'
      desc: 'Näytteet 7–12 päivässä, koepilottituotanto 25–35 päivässä vahvistetun tilauksen ja talletuksen jälkeen sekä vahvistetut tuotantopaikat ennen kauden alkua — jotta lanseeraus osuu kausiin eikä sen jälkeen.'

trial_steps:
  tagline: Lanseeraus roadmap
  title: 'Ideasta ensimmäiseen myyntiin kuudessa portissa'
  subtitle: 'Tyypillinen ensimmäinen lanseeraus kestää 8–12 viikkoa briefistä toimitettuun koepilottitilaukseen käyttäen olemassa olevia alustoja — pidempään, kun räätälöity runko tuo mukanaan muotin kehittämisen. Jokaisella portilla on etukäteen sovittu päivämäärä.'
  steps:
    - step: 'Portti 1'
      title: 'Tuotebrief ja tuotetekninen katselus (päivät 0–2)'
      desc: 'Kerrot tavoitellun laudamallin, tilausmäärän, artworkin ja pakkauksen suunnan. Tuotetekninen katselus valmistuu yhden arkipäivän kuluessa, ja NDA on saatavilla ennen kuin jaat luottamukselliset määritykset.'
    - step: 'Portti 2'
      title: 'Määritys, MOQ ja tarjous (päivät 3–7)'
      desc: 'Kohdekohtainen tarjous täsmällisellä MOQ-laskelmalla, näytemaksuilla ja toimitusajan vaiheilla. Näytemaksut vähennetään tuotantotilauksestasi sopimuksen allekirjoituksen yhteydessä.'
    - step: 'Portti 3'
      title: 'Näytteet 7–12 päivässä'
      desc: '1–2 fyysistä lautaa varmennavat rungon jäykkyyden, EVA-koostumatyynyn pinnan, kuvituksen tarkkuuden ja lisävarusteiden istuvuuden. Koet lauta ennen kuin sitoudut mihinkään muuhun.'
    - step: 'Portti 4'
      title: '20–50 laudan koepilottitilaus (25–35 päivää)'
      desc: 'Tuotanto olemassa olevilla runkoalustoilla, varastomateriaaleilla ja yksinkertaisella pakkauksella — pienin kaupallinen testi, joka vastaa todellisia varastotilanteita.'
    - step: 'Portti 5'
      title: 'Myynti ja palautteen ikkuna'
      desc: 'Tärkein portti on sinun markkinoillasi, ei meidän tehtaallamme: vuokraajat ja asiakkaat vahvistavat laudan formaatin, kuvituksen ja hintatason ennen kuin skaalaat.'
    - step: 'Portti 6'
      title: 'Skaalaus volyymisarjoihin (90–100+ lautaa)'
      desc: 'Kun formaatti on todennettu, vakiintuneet 150 m:n kankarullan sarjat tuovat täyden tuotantotehokkuuden, brändätyn pakkauksen ja volyymihinnat. Kontillinen ohjelma on tavoite, ei vaatimus.'

