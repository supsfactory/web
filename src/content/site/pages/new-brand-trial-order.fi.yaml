      desc: '300+ laudan ohjelmat porrastettuina lähetyksinä, omilla Pantone-materiaaleilla ja koko kehityspuolella — sama tehdas, nyt täydessä mittakaavassa.'

trial_faqs:
  tagline: FAQ
  title: 'Usein kysytyt kysymykset lanseerauksesta koepilottitilauksella'
  items:
    - q: 'Voinko todella aloittaa SUP-brändin ilman kontillitilausta?'
      a: 'Kyllä. Lähtöpiste on porrastettu: 1–2 näytettä varmennavat laudan (valmiina 7–12 päivässä), 20–50 laudan koepilottitilaus varmennattaa markkinat (tuotanto 25–35 päivässä), ja 90–100+ laudan volyymierät seuraavat vasta, kun myynti todentaa formaatin. Pien-erän co-branding alkaa jo 5–10 kpl:stä, kun haluat brändättyjä lautoja ilman mitään kehitysvaihetta.'
    - q: 'Miten kauan koko lanseeraus kestää alusta loppuun?'
      a: 'Olemassa olevia runkoalustoja käyttäen tyypillinen ensimmäinen lanseeraus kestää 8–12 viikkoa tuotebriefistä toimitettuun koepilottitilaukseen: näytteet 7–12 päivässä, koepilottituotanto 25–35 päivässä vahvistetun tilauksen ja talletuksen jälkeen. Räätälöity runko lisää 15–20 päivää muotin kehittämiseen.'
    - q: 'Mitä hinta sisältää — ja mitä se ei sisällä?'
      a: 'Viitteelliset hintarajat ovat EXW Qingdao itse lautoihin, mukaan lukien brändäyksen levitys ja vakiintunut laadunvalvonta. Ne ovat suuntaa-antavia: lopullinen tarjous vahvistetaan konfigaatiosi mukaan — runko, PVC, artworkin peittävyys, pakkaus ja lisävarusteet — ennen mitään sitoumusta. Rahti, tullit ja tulliselvitys määräpaikassa tarjotaan erikseen.'
    - q: 'Onko minun ostettava 100 tai 500 lautaa saadakseni logoni lautoihin?'
      a: 'Ei. Pien-erän co-branding asettaa logosi keulaan tai sivukiskoille jo 5–10 kpl:stä, ja 20–50 laudan koepilottitilaukset mahdollistavat koko artworkin levityksen samalla laadulla kuin volyymituotanto. Määrä muuttaa yksikköhintaa, ei saatavuutta.'
    - q: 'Mitä tapahtuu, jos haluan muuttaa suunnittelua koepiloinnin jälkeen?'
      a: 'Koepilotin ja volyymierän väliset muutokset ovat normaaleja ja tervetulleita — siinä on koepilotin tarkoitus. Väriversiot, artwork, pakkaus ja lisävarusteet hinnoitellaan uudelleen uutta kokoonpanoa vasten, minkä jälkeen ne jäädytetään artwork- ja materiaaliluetteloallekirjoituksella ennen volyymierää. Silk screen -painatuksen muottimaksut poistetaan uusintatilauksissa, joissa käytetään samaa artwork-mittaa.'
    - q: 'Allekirjoitatteko NDA:n ennen kuin jaan suunnitteluni?'
      a: 'Kyllä. Salassapitosopimus on saatavilla ennen kuin jaat luottamukselliset tekniset määritykset tai artworkin. Valmistamme yksinomaan asiakkaidemme brändeillä emmekäkä koskaan kilpaile niiden kanssa millään markkinoilla — sama käytäntö koskee 1 laudan näytettä ja kontillisen suuruista ohjelmaa.'

