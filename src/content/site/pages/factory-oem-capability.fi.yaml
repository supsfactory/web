answer:
  label: 'Suora vastaus'
  text: 'Vähimmäiseräkoko vahvistetaan projektin konfiguroinnin eikä kiinteän luvun mukaan: jokainen projekti käy läpi näytevaiheen (1–2 kpl) ja pilottisarjavaiheen (20–50 kpl), ja vakiintunut sarjatuotanto toimii 90–100+ kpl erää kohti koko 150 m drop-stitch-rullasta. Näytteet ovat valmiit 7–12 päivässä; vakiintunut tuotanto vie 25–35 päivää vahvistetun tilauksen ja käsirahajan jälkeen.'
  verified: 'Syyskuu 2026'

intro: 'Vatrad tarjoaa kattavat OEM- ja ODM-palvelut brändeille, jakelijoille ja julkisille viranomaisille ympäri maailman. Yli 10 vuoden vientikokemuksen ja 12,500 m²:n ISO 9001- sekä BSCI-sertifioidun tehtaan ansiosta hoidamme kaiken tuotesuunnittelusta ja muotin kehittelystä täysmittaiseen tuotantoon, pakkaukseen ja vientijohtoon.'

