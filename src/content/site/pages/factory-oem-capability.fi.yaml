services:
  - title: Tuotesuunnittelu ja tuotekehitys
    description: 'Omat tuotekehitystiimimme työskentelee ideasi tai määrityksesi pohjalta ja kehittää CAD-piirustukset, 3D-mallit ja prototyypit. Tarjoamme muottisuunnittelua, laudan muodon optimointia ja materiaalivalinnan ohjausta.'
  - title: Räätälöity brändäys ja kuvitus
    description: 'Täysvärikordinen digitaalipainatus, silk screen, kohopainatus ja etikkavaihtoehdot. Kehitämme brändikohtaiset kansikuviot, putkiston brändäyksen ja myyntivalmiin pakkauksen.'
  - title: Materiaalien ja määritysten räätälöinti
    description: 'Valitse PVC (vakio, ympäristöystävällinen, palosuojattu), Hypalon/CSM, drop-stitch ja hybridirakenteet. Räätälöidyt putkiston värit, kankaiden painot ja vahvistusvaihtoehdot.'
  - title: Pakkaus ja logistiikka
    description: 'Räätälöity vähittäispakkaus, private label -laatikot, tyhjiöpakkaus, lavaus ja vientivalmiste pakkaaminen omissa tiloissamme.'

moq_table:
  - product: Puhallettavat SUP-laudat
    standard_moq: 'Näyte 1–2 | Pilotti 20–50'
    custom_moq: 'Volyymi 90–100+ (150 m rullaa kohti)'
    lead_time: 25–35 päivää

why_us:
  - title: Vertikaalinen integraatio
    description: 'Omistamme tehtaan, muotit ja toimitusketjun — ei välikettä, ei aliurakoitsijoita. Näin hallitsemme laatua, kustannuksia ja toimituksia.'
  - title: Kaksoissertifiointi
    description: 'ISO 9001 -laadunhallinta ja BSCI -yhteiskuntavastuu. Tehtaan auditointiraportit pyydettäessä.'
  - title: CE-vaatimustenmukaisuus
    description: 'CE-sertifiointi koskee EU-markkinoille tarkoitettuja malleja (laajuus vahvistetaan projekti kohtaisesti). Räätälöidut mallit voidaan CE-sertifioida vakiintuneen prosessimme kautta.'
  - title: Projektikohtainen vähimmäiseräkoko
    description: 'Vähimmäiseräkoko vahvistetaan projektisi konfiguroinnin mukaan — pienet co-branding-erät alkavat 5–10 kpl:stä, vakiintunut volyymituotanto 90–100+ kpl erää kohti. Autamme uusia brändejä markkinoille ilman, että sitoutuu liikaa varastoon.'

cta:
  title: 'Oma brändisi todistetulle laudalle'
  subtitle: 'Määritysten tarkastuksesta lähetettyyn konttiin — lähetä toimeksiantoasi tänään ja saat yksityiskohtaisen OEM-tarjouksen yhden arkipäivän kuluessa. Todenna tehdas ja sen laadunhallintajärjestelmä ennen sitoutumista.'
