workshops_section:
  tagline: Ütemrészek
  title: 'Gyártási ütemrészek'
  workshops:
    - title: PVC vágás és alapanyag-előkészítés
      description: CNC automata vágógépeink a PVC, a Hypalon és a drop-stitch szöveteket egymás alatti pontossággal dolgozzák fel. A számítógéppel optimalizált elrendezés minimalizálja az anyagpazarlást, és biztosítja, hogy minden panel hegesztés előtt megfeleljen a méretbeli specifikációjának.
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: CNC PVC vágógép, amely szövetpaneleket készít a qingdaói gyárban felfújható SUP deszkákhoz
    - title: Csőhegesztés és termikus tömítés
      description: Külön hegesztőüzem termikus tömítőgépekkel és RF dielektromos sajtókkal. A meleglevegős termikus tömítők ragasztják és olvasztják a PVC csőkamrákat, míg az RF varratok nagy szilárdságú, légtömör varratokat eredményeznek, amelyek megfelelnek az előírásoknak.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: RF hegesztőgép, amely légtömörré teszi a felfújható vízi eszközök csőkamráit a qingdaói gyárban
    - title: A drop-stitch mag ragasztása
      description: A SUP deszkák drop-stitch magjait meleg laminálással ragasztjuk a külső PVC rétegekhez. A több ezer belső poliészterszál köti össze a felső és az alsó réteget, így 12-15 PSI nyomáson merev szerkezet jön létre. A sínszalagokat háromrétegű olvasztással ragasztjuk az él tartóssága érdekében.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Felfújható SUP deszkák gyártósora drop-stitch magragasztó berendezéssel a qingdaói gyárban
    - title: A SUP deszkák nyomtatása és díszítése
      description: A SUP deszkákat digitális nyomtatással, teljes színű grafikával, szitanyomással pedig emblémák és ismétlődő minták készítésével díszítjük. A digitális nyomtatók fényképezőminőségű fedélzeti mintákat állítanak elő, a szitanyomás pedig tartós és élénk megjelenést biztosít.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: A qingdaói felfújható SUP deszka gyár gyártási részlegének belső tere
    - title: Összeállítás és végső szerelés
      description: Összeállítósor, amelyen minden SUP deszkára szelepeket, D-gyűrűket, markolatokat, uszonydobozokat és fedélzeti felületeket szerelünk. Minden deszka 100 pontos összeállítási ellenőrzőlistát követ, amelyet a csapatvezető aláír.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Gyártási részleg összeállítóállásokkal a qingdaói gyárban
    - title: Vizsgálat és minőségellenőrzés
      description: Minden befejezett deszka kötelező légtartási vizsgálaton, a varratok leválásának ellenőrzésén és a rendszerek teljes átvizsgálásán megy át a szállítás előtt. Minőségi laboratóriumunk a gyártástól függetlenül működik, és közvetlenül a vezetőségnek jelenti.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Felfújható SUP deszka nyomáspróbája a lég megtartására a qingdaói gyárban, szállítás előtt

