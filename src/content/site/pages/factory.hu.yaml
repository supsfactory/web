oem_section:
  tagline: OEM projektek
  title: 'Márka- és OEM partnerségi esettanulmányok'
  subtitle: 'Az ötlettől a gyártásig — így segítjük a globális márkákat a felfújható SUP deszka terméksoruk bevezetésében és bővítésében.'
  cases:
    - challenge: 'Egy európai outdoor kiskereskedőnek egyedi fedélzeti grafikával, környezetbarát PVC-vel és eladásra kész csomagolással rendelkező private-label SUP deszka termékvonalra volt szüksége — mindez 60 napon belül szállítva.'
      solution: 'Egyedi digitális nyomtatási fájlokat fejlesztettünk, REACH-megfelelő PVC-t szereztünk be, és a mintavételi fordulókat 3-ról 1-re csökkentettük azzal, hogy a tervezőcsapatot a qingdaói gyárunkba helyeztük.'
      result: '25–35 napos gyártás az aláírt megrendeléstől számítva, az első szállítás a 60 napos ablakon belül. 2 400 darab 4 SKU-ban. Az ismételt megrendelés az első lot teljes kiszállítása előtt lett leadva.'
      disclaimer: 'Anonimizált projektösszefoglaló — a projekt típusa és terjedelme reprezentatív; a konkrét eredmények függetlenül nem ellenőrizhetők.'
    - challenge: 'Egy amerikai vizes sport startupnak nagy teljesítményű, drop-stitch SUP deszkára volt szüksége, egyedi formával, közös márkázású csomagolással és a retailbe helyezéshez BSCI-tanúsítással.'
      solution: 'Módosított kontúrral adaptáltuk a meglévő SUP formát, kifejlesztettük a közös márkázású csomagolást, és teljes BSCI-auditdokumentációt bocsátottunk rendelkezésre.'
      result: 'Sikeres elhelyezés kulcsfontosságú amerikai outdoor kiskereskedőknél, erős lökést generálva, több mint 5 000 eladott darabbal az első évben és 98%-os értékesítési aránnyal.'
      disclaimer: 'Anonimizált projektösszefoglaló — a projekt típusa és terjedelme reprezentatív; a konkrét eredmények függetlenül nem ellenőrizhetők.'
    - challenge: 'Egy ausztrál disztribútor CE-tanúsított SUP deszka sorozatot kért egyedi színekkel és ausztrál szabványoknak való megfeleléssel.'
      solution: '4 színváltozatú gyártás előtti mintákat készítettünk, és koordináltuk a harmadik fél általi megfelelőségi vizsgálatot.'
      result: '3 modellből álló SUP deszka sorozat indult az AU/NZ piacon. Ezt követően 12 SUP patrol deszkára megnyertünk egy kormányzati pályázatot.'
      disclaimer: 'Anonimizált projektösszefoglaló — a projekt típusa és terjedelme reprezentatív; a konkrét eredmények függetlenül nem ellenőrizhetők.'

faq_section:
  tagline: GYIK
  title: 'B2B és OEM gyakori kérdések'
  questions:
    - q: 'Mi az OEM felfújható SUP deszkák minimális rendelési mennyisége (MOQ)?'
      a: 'Az MOQ-t a projekt konfigurációja határozza meg, nem egy rögzített szám — a légkamra és a szerszámok, a színváltozatok és a PVC, a grafika, a csomagolás és a tartozékok függvényében. A standard tömeggyártás 90–100+ darabot jelent lotonként egy teljes, 150 m-es drop-stitch szövettekercsből, a közös márkázás kis lottákban 5–10 darabtól indul, és minden projekt átesik a minta- (1–2 darab) és pilot- (20–50 darab) szakaszokon. A teljes számítási logikát a MOQ- és rugalmas márkázási útmutatókban találja.'
    - q: 'Bír-e a Vatrad BSCI-tanúsítvánnyal?'
      a: 'Igen. Gyárunk érvényes BSCI társadalmi megfelelési tanúsítványt tart fenn (az auditjelentés kérésre rendelkezésre áll). Emellett ISO 9001 minőségirányítási tanúsítvánnyal is rendelkezünk. A CE-tanúsítvány az EU-piacokra szánt modellekre vonatkozik; a hatókör projektenként kerül megerősítésre. A REACH- és RoHS-megfelelőségi dokumentációt minden OEM megrendeléshez mellékeljük.'
    - q: 'Mi a szokásos szállítási határidő egy OEM megrendeléshez?'
      a: 'A standard határidő 25–35 nap a megerősített megrendeléstől és az előlegtől számítva tömeg OEM-gyártás esetén. Az egyedi formák fejlesztése további 15–20 napot ad a szerszámokhoz. Sürgős megrendelésekhez és szezonális csúcsidőszakokhoz gyorsított gyártás is rendelkezésre áll. A prototípusminták rendszerint 7–12 nap alatt készen állnak.'
    - q: 'Intézik az exportdokumentációt?'
      a: 'Igen. Csapatunk belsőleg kezeli az exportdokumentációt és a vámügyi eljárásokat, és 50+ országba szállítunk az EU-, az USA-, az AU- és az ázsiai piacokról.'

b2b_moq: 'A projekt konfigurációja által megerősített MOQ: minta 1–2, pilot 20–50, tömeg 90–100+ (150 m-es tekercsenként); kis lottájú közös márkázás 5–10 darabtól.'

production_flow:
  tagline: 'A gyártási folyamat'
  title: 'Az alapanyagtól a kész deszkáig'
  subtitle: 'Minden deszka 6 gyártási szakaszon megy át, minden lépésen minőségi ellenőrzési pontokkal. Nincs rövidítés, nincs kihagyott ellenőrzés.'
  stages:
    - stage: '01'
      title: 'Anyagfogadás és belépő QC'
      description: 'Minden beérkező anyagot lottagszámmal rögzítünk az ERP-rendszerünkben. A PVC szövettekercseket, a drop-stitch magokat, a szelepeket, a ragasztókat és a szerelvényeket a QC aláírásáig karanténba helyezzük.'
      qc_check: 'Húzási szilárdság (ASTM D751), szakadási ellenállás (ISO 4674), vastagságmérő, a ragasztó viszkozitása, a hibák vizuális átvizsgálása'
      qc_threshold: 'A lottagok 100%-a vizsgált. Elutasítás, ha a húzás < a specifikáció 90%-a, a szakadás < a specifikáció minimuma vagy bármely látható hiba'
      responsibility: Belépő QC csapat (3 ellenőr)
    - stage: '02'
      title: 'CNC vágás és alapanyag-előkészítés'
      description: 'A számítógéppel optimalizált elrendezés a paneleket a PVC-készletre rendezi a hulladék minimalizálása érdekében. A CNC automata vágógépek 0.1 mm-es helyzeti pontosságot tartanak.'
      qc_check: 'Méretellenőrzés a CAD DXF fájlok alapján, élminőségi vizsgálat, a panelek számának ellenőrzése'
      qc_threshold: 'Minden 20. panel mérése. ±0.5 mm tűrés. A lot elutasítása, ha több mint 2% kívül esik a tűrésen'
      responsibility: A vágóüzem vezetője
    - stage: '03'
      title: 'Hegesztés és a drop-stitch mag ragasztása'
      description: 'A drop-stitch magokat meleg laminálással ragasztjuk a külső PVC rétegekhez. A csőkamrákat RF-hegesztéssel vagy meleg levegővel forrasztjuk. A sínszalagokat háromrétegű olvasztással ragasztjuk.'
      qc_check: 'Leválási próba 50 darabonként (ASTM D751), a varrátszélesség mérése, a meleg levegő hőmérsékleti naplójának ellenőrzése, a varratok vizuális vizsgálata kontrasztmegvilágításban'
      qc_threshold: 'Leválási szilárdság legalább 8 N/cm. Varrátszélesség-tűrés ±1 mm. Bármely látható csatorna = elutasítás'
      responsibility: Hegesztési QC (2 ellenőr műszakonként)
    - stage: '04'
      title: 'Összeállítás és szerelés'
      description: 'A deszkák a végső összeállításra kerülnek, ahol minden alkatrész összekapcsolódik: az olvasztott fedélzeti és hajótest-panelek, a beépített szelepek, a D-gyűrűk, a markolatok, az uszonydobozok és a szállítótáska. Minden egység 100 pontos összeállítási ellenőrzőlistát követ.'
      qc_check: 'A 100 pontos ellenőrzőlista aláírása egységenként, a szelep működési próbája (10 nyitási/zárási ciklus), a szerelvények meghúzási nyomatékának ellenőrzése, vizuális vizsgálat'
      qc_threshold: 'Nulla hiba politika a biztonsági szempontból kritikus tételeknél (szelep, D-gyűrűk, markolatok). Kis esztétikai hiba: AQL 2.5 (ISO 2859)'
      responsibility: 'Az összeállító csapat vezetője + sor QC'
    - stage: '05'
      title: 'Nyomásvizsgálat és minőségi megtartás'
      description: 'Minden légkamrát 18.0 PSI nyomásra fújjuk (egy 12–15 PSI névleges értékű SUP deszkánál), és 24 órán át megtartjuk. A nyomásérzékelők folyamatosan rögzítenek. Azokat a kamrákat, ahol a nyomáscsökkenés meghaladja a 0.50 PSI-t, elutasítjuk, és a varratok újraellenőrzésére küldjük.'
      qc_check: '24 órás nyomástartási napló, a szenzorok napi ellenőrzött kalibrálása, hőmérséklet-kompenzált nyomásleolvasás, a varratok újratesztelése a javítás után'
      qc_threshold: 'Legfeljebb 0.50 PSI nyomáscsökkenés 24 órán át, állandó hőmérsékleten. Bármely küszöböt meghaladó kamra = a teljes gyártási lot 100%-os újratesztelése'
      responsibility: 'Minőségi laboratórium (a gyártástól független, a vezetőségnek jelenti)'
    - stage: '06'
      title: 'Végső ellenőrzés és csomagolás'
      description: 'Végső vizuális és funkcionális ellenőrzés. Felületi hibák, a színek egyenletessége, a címke/BIN ellenőrzése, a csomagolás épsége és a tartozékok teljessége. Az egységeket vákuumcsomagoljuk, dobozba helyezzük és konténerbe rakodásra palettázzuk.'
      qc_check: 'Teljes vizuális vizsgálat, SKU-nkénti tartozék-ellenőrzőlista, csomagolási ejtésvizsgálat (1 m, véletlenszerű minta), a címke/vonalkód beolvasásának ellenőrzése'
      qc_threshold: 'AQL 2.5 súlyos hibákra, AQL 4.0 kisebb hibákra. Nulla tűrés a biztonsági hibákra. Az egységek 100%-a vizuális vizsgálaton esik át'
      responsibility: 'Végső QC csapat (4 ellenőr) + a csomagolócsapat vezetője'

