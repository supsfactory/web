  title: 'A vizsgálati és minőségbiztosítási folyamat'
  subtitle: 'Minden deszka kötelező vizsgálaton megy át a szállítás előtt. Minőségi laboratóriumunk a gyártástól függetlenül működik, és közvetlenül a vezetőségnek jelenti.'
