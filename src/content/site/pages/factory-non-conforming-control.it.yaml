answer:
  label: 'Risposta chiara'
  text: 'I prodotti non conformi non vengono mai nascosti, rilavorati informalmente o rilasciati senza verifica presso QINGDAO VATRAD GROUP.,LTD. Ogni non conformità identificata viene registrata contro il prodotto, la partita o il componente interessato e collegata a un NCR. L''articolo viene marcato (HOLD / QUARANTINE / REJECTED), fisicamente separato e l''ambito interessato viene valutato per partita, lotto di materiale, fase di processo e revisione documentale. La disposizione viene decisa al livello di autorità corrispondente alla gravità del difetto: i problemi lievi vengono firmati a livello di linea, i problemi gravi richiedono una disposizione di QC Manager + Ingegnere tecnico con istruzione di rilavorazione controllata e nuova verifica indipendente al 100%, e i problemi critici richiedono una decisione del Material Review Board con consenso scritto del cliente ove richiesto — altrimenti distruzione accompagnata obbligatoria. Gli articoli rilavorati vengono nuovamente verificati contro i criteri di accettazione originali, le riparazioni di tenuta all''aria ricevono un ciclo completo di nuovo test di pressione e il rilascio in spedizione avviene solo dopo la qualifica qualità autorizzata. I problemi ricorrenti o sistemici attivano analisi delle cause e azioni correttive (CAPA).'
  verified: 'September 2026'

