nc_severity:
  tagline: Gravità del difetto & autorità
  title: Classificazione della gravità & autorità di disposizione
  subtitle: Non ogni non conformità viene gestita allo stesso livello — l''autorità di disposizione scala con la gravità del difetto, dal rilascio a livello di linea al Material Review Board con consenso del cliente.
  headers:
    severity: Gravità
    examples: Esempi tipici
    authority: Autorità di disposizione & controllo
    control: Condizione di rilascio
  rows:
    - severity: 'Lieve'
      examples: 'Rifilo dell''angolo del cartone, leggero disallineamento di un accessorio non critico'
      authority: 'Rilascio in loco a cura del capo QC di sezione + supervisore di linea, con sostituzione o rilascio'
      control: 'Registrato nell''NCR; nessun impatto su funzione del prodotto o requisiti del cliente'
    - severity: 'Grave'
      examples: 'Lenta perdita della valvola, disallineamento EVA fuori tolleranza (>2 mm), accessorio mancante'
      authority: 'La QC Manager + Ingegnere tecnico emettono un''istruzione di rilavorazione controllata (SRI)'
      control: 'Nuovo test di conformità indipendente al 100% dei difetti originariamente non superati e delle caratteristiche interessate prima del rilascio'
    - severity: 'Critico'
      examples: 'Danno alla camera drop-stitch, bolla del rail o lacerazione ad alta pressione, stampa errata del logo cliente o scarto cromatico'
      authority: 'Decisione del Material Review Board (MRB); consenso scritto del cliente ove richiesto'
      control: 'Nessun rilascio senza consenso autorizzato; altrimenti distruzione fisica accompagnata obbligatoria'

nc_matrix:
  tagline: Matrice dei protocolli di ingegneria
  title: Matrice di disposizione dei difetti & nuova verifica SUP
  subtitle: Protocolli di ingegneria standard applicati alle deviazioni di produzione più comuni — gli stessi parametri quantificati che i clienti possono verificare durante gli audit.
  headers:
    defect: Categoria di difetto
    protocol: Protocollo di disposizione controllata
    validation: Nuova verifica & validazione indipendente
  rows:
    - defect: 'Lenta perdita della valvola'
      protocol: 'Isolare la tavola. Smontare il nucleo valvola con utensile di coppia calibrato (25 N·m), pulire la filettatura interna, sostituire l''O-ring in silicone e serrare di nuovo.'
      validation: 'Immergere in soluzione saponosa; gonfiare a 18 PSI ed eseguire un nuovo test completo di perdita di pressione di 24h (ΔP ≤ 0.05 PSI).'
    - defect: 'Bolle d''aria nella cucitura del rail'
      protocol: 'Bloccare la partita di turno. Delaminare l''area della bolla con ugello a caldo assistito, pulire la superficie con solvente, applicare adesivo PU bicomponente sotto pressione di 5 bar.'
      validation: 'Ispezione visiva e tattile della cucitura al 100%; prova strutturale di pressione di verifica (18.0 PSI) oltre al mantenimento di tenuta all''aria di 24h.'
    - defect: 'Disallineamento del pad EVA'
      protocol: 'Rimozione a caldo assistita con utensile a temperatura regolata (80°C). Nuovo allineamento con dima di posizionamento acrilica di precisione.'
      validation: 'Verifica della tolleranza di fabbricazione dei giochi (≤ ±1.5 mm), verifica di simmetria del motivo a rombi, test di adesione dei bordi al 100%.'
    - defect: 'Errore di branding/logo'
      protocol: 'Arresto immediato della linea di stampa. Bloccare tutti i pannelli stampati. Verificare la revisione vettoriale con il cliente; zero modifiche non autorizzate.'
      validation: 'Verifica colore con spettrofotometro (ΔE ≤ 1.5); ispezione visiva al 100% dell''allineamento del testo contro il PDF master vettoriale firmato dal cliente.'
    - defect: 'Deviazione di imballaggio / SKU mancante'
      protocol: 'Bloccare il pallet di esportazione. Aprire e svolgere una verifica di posizione al 100% secondo la BOM (pompa, pinna, leash, paddle, tubo di riparazione).'
      validation: 'Validazione con bilance di controllo dinamiche elettroniche integrate (±30 g di varianza); verifica con scanner ottici di codici a barre 2D.'

nc_scrap:
  tagline: Zero fuoriuscita sul mercato
  title: Rottamazione & distruzione accompagnata — protocollo anti-diversione a zero difetti
  body: |
    I partner di marca esteri hanno bisogno della certezza che le tavole difettose non finiscano mai nei canali di retail secondario, mercati grigi o e-commerce. Le tavole che non possono essere portate a conformità vengono distrutte sotto un protocollo accompagnato e registrato:

    **1. Taglio di raccordi & accessori.** Sotto la supervisione del QA Director, una cesoia idraulica rimuove tutti gli anelli a D in acciaio inox 316, le cinghie delle maniglie di trasporto e le fibbie dei bagagli. Il gruppo valvola di gonfiaggio e la base della fin box (US-box / pinna a scatto) vengono asportati alla radice della tavola, eliminando così tutti i componenti riutilizzabili.

    **2. Incisione del drop-stitch & sezionamento del rail.** Il nucleo drop-stitch interno viene tagliato attraverso tavola e deck con tagli incrociati profondi (≥ 50 cm per taglio), e i rail laterali rinforzati vengono recisi in almeno 4 segmenti — distruggendo in modo permanente capacità di sigillatura e galleggiamento.

    **3. Video- & fotovault.** La distruzione viene registrata come video 1080p non tagliato con primi piani del codice a barre di serie, del taglio, dell''incisione del nucleo e del cumulo di scarto finale pesato. Il video viene sottoposto a hash (SHA-256) e archiviato per ≥ 5 anni su un server controllato.

    **4. Smaltimento dei rifiuti certificato.** Tutti i frammenti in PVC e drop-stitch vengono pesati, registrati nel registro di uscita e trasportati solo da partner qualificati di riciclo polimeri — nessun materiale residuo lascia l''impianto tramite altri canali.

    > **Garanzia di protezione del marchio:** QINGDAO VATRAD GROUP CO., LTD. garantisce la distruzione al 100% delle imbarcazioni non rilavorabili e fuori specifica. Nessun articolo di seconda scelta o tavola compromessa finirà mai nei canali di retail secondario, mercati grigi o e-commerce. Il certificato di scarto & distruzione (VAT-QA-SCRAP-CERT-2026) documenta prodotto, partita, conclusione del MRB, foto testimone e la doppia firma di QA Director e capo stabilimento.

