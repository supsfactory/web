nc_intro:
  tagline: Controllo dei prodotti non conformi
  title: Cosa succede quando un prodotto non soddisfa i criteri
  body: |
    I prodotti o componenti che non soddisfano i criteri di accettazione definiti vengono identificati e controllati per prevenire l''uso involontario, l''ulteriore lavorazione o la spedizione. I criteri di accettazione applicabili si basano sul campione rilasciato, sulla specifica tecnica, sulla grafica, sulla distinta base, sui requisiti di imballaggio e sul piano di ispezione di progetto.

    Gli articoli non conformi vengono valutati per determinare l''ambito interessato e la disposizione appropriata. A seconda del problema, l''articolo può essere trattenuto, rilavorato sotto istruzioni controllate, sostituito, respinto o gestito tramite un processo rilasciato. Gli articoli rilavorati o corretti vengono nuovamente ispezionati prima del rilascio. Il rilascio in spedizione è consentito solo dopo il completamento delle registrazioni di qualità pertinenti e la conformità del prodotto ai criteri di accettazione applicabili.

nc_flow:
  tagline: Ciclo chiuso standard in 7 fasi
  title: Dall''identificazione all''azione correttiva
  subtitle: 'Un ciclo controllato per ogni non conformità: identificare, bloccare, verificare, rilavorare o sostituire, ricontrollare, rilasciare o respingere, migliorare.'
  steps:
    - step: '01'
      title: Identificare
      desc: 'Ogni non conformità identificata viene registrata contro il prodotto, la partita o il componente interessato e valutata contro i requisiti applicabili del progetto. Il rilevamento può avvenire all''ingresso merci, nel controllo di processo, nell''ispezione finale, nell''imballaggio o nell''ispezione del cliente/di terze parti.'
    - step: '02'
      title: Bloccare
      desc: 'Gli articoli vengono chiaramente identificati e posti sotto stato di blocco o quarantena controllata per prevenire uso, ulteriore lavorazione o spedizione involontari. Le etichette HOLD / QUARANTINE / REJECTED portano numero NCR, SKU, partita, quantità, descrizione del difetto e data.'
    - step: '03'
      title: Verificare
      desc: 'Vengono valutati l''ambito interessato e la disposizione appropriata: unità singola, partita di turno, partita completa o più partite — attraverso lotti di materiale comuni, revisioni grafiche, fasi di processo e revisioni documentali. Se necessario si applicano ulteriore contenimento o ispezione rinforzata.'
    - step: '04'
      title: Rilavorazione o sostituzione
      desc: 'La rilavorazione consentita segue istruzioni rilasciate che identificano l''articolo interessato, il metodo, i materiali, i punti di ispezione e i requisiti di nuova verifica. Non sono mai consentite modifiche non autorizzate a specifica di prodotto, grafica, configurazione accessori o imballaggio. Gli articoli sostitutivi rientrano nei gate di ispezione applicabili.'
    - step: '05'
      title: Ricontrollare
      desc: 'Gli articoli rilavorati o corretti vengono nuovamente ispezionati contro i criteri di accettazione applicabili. Il difetto originariamente non superato e tutte le caratteristiche associate potenzialmente interessate dalla rilavorazione vengono verificate prima del rilascio — da QC indipendente e, per le riparazioni di tenuta all''aria, con un ciclo completo di nuovo test di pressione di 24h.'
    - step: '06'
      title: Rilasciare o respingere
      desc: 'Il prodotto viene rilasciato solo dopo il completamento della nuova verifica richiesta, quando il personale qualità autorizzato conferma la conformità ai requisiti applicabili del progetto. Gli articoli che non possono essere portati a conformità vengono respinti, sostituiti, rispediti o disposti sotto procedure controllate — inclusa la distruzione fisica accompagnata.'
    - step: '07'
      title: Azione correttiva
      desc: 'Le non conformità ricorrenti, significative o sistemiche vengono investigate per causa e azione correttiva (CAPA). I miglioramenti possono includere aggiornamenti di istruzioni di lavoro, controlli dei materiali, punti di ispezione, formazione, gestione fornitori o controllo documentale.'

nc_pillars:
  tagline: Pilastri della fiducia dell''acquirente
  title: Tre controlli che proteggono il vostro marchio
  subtitle: 'Il processo è costruito attorno alle domande che gli acquirenti esteri pongono realmente: i problemi vengono nascosti, la rilavorazione sfugge al controllo e le tavole riparate vengono nuovamente verificate.'
  features:
    - icon: 1
      icon_bg: blue
      title: Solo istruzioni controllate
      desc: 'La rilavorazione è regolata rigorosamente da Standard Rework Instructions (SRI) autorizzati. Le modifiche sul campo non approvate, le variazioni di specifica o le modifiche grafiche senza autorizzazione scritta sono severamente vietate.'
    - icon: 2
      icon_bg: green
      title: Nuova verifica indipendente
      desc: 'Le tavole rilavorate vengono sottoposte a nuova verifica al 100% da parte degli ispettori QA contro i criteri di accettazione originali. Le riparazioni di tenuta all''aria richiedono un ciclo completo di nuovo test di pressione di 24h — mai una verifica parziale.'
    - icon: 3
      icon_bg: purple
      title: Rilascio autorizzato & rintracciabilità
      desc: 'Il rilascio in spedizione è consentito esclusivamente dopo documentazione NCR completa e autorizzazione QC, con lo stato della partita che passa da HOLD a RELEASED. Le deviazioni sistemiche o ricorrenti attivano automaticamente i workflow CAPA per l''analisi delle cause.'

