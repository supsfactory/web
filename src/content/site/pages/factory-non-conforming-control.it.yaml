faqs:
  tagline: FAQ
  title: FAQ su qualità & controllo dei difetti per acquirenti globali
  items:
    - q: 'Come garantite che le tavole rilavorate soddisfino gli standard di sicurezza completi?'
      a: 'Ogni tavola rilavorata viene trattata come una nuova unità e deve percorrere lo stesso ciclo di test completo da zero — per le riparazioni di tenuta all''aria un test di pressione completo di 24h. Sono gli ispettori QC indipendenti, non gli operatori di rilavorazione, a condurre la validazione di rilascio.'
    - q: 'La fabbrica spedirà tavole con lievi deviazioni estetiche senza informarci?'
      a: 'Mai. Ogni deviazione che interessa golden samples approvati dal cliente, grafiche di logo, varianti di colore o imballaggio richiede un accordo formale di concessione scritto firmato dal cliente prima del rilascio in spedizione.'
    - q: 'Cosa succede se una tavola rilavorata non supera la nuova verifica?'
      a: 'La tavola non viene rilasciata. Torna a una nuova valutazione di disposizione e, se non può essere portata a conformità, viene sostituita, respinta o distrutta sotto il protocollo di scarto accompagnato. Il mancato superamento ripetuto della stessa classe di difetto attiva un CAPA per l''analisi delle cause.'
    - q: 'Le tavole difettose possono essere vendute come articoli di seconda scelta o tramite altri canali?'
      a: 'No. Le tavole non rilavorabili e fuori specifica vengono distrutte fisicamente sotto il protocollo di scarto accompagnato — raccordi tagliati, nucleo e rail recisi, video registrato con hash SHA-256 e archiviato per almeno 5 anni. Il certificato di scarto & distruzione viene firmato dal QA Director e dal capo stabilimento.'
    - q: 'Come viene valutato l''ambito interessato quando viene trovato un difetto?'
      a: 'L''ambito viene esaminato per identificazione del prodotto, partita di produzione, partita di materiale o componente, fase di processo e revisione documentale applicabile. Se lo stesso lotto di materiale, la stessa revisione grafica o la stessa postazione di lavoro è interessata, i prodotti coinvolti vengono inclusi e ispezionati di conseguenza.'
    - q: 'È necessario il nostro consenso prima di concedere una concessione?'
      a: 'Sì. Ogni accettazione sotto concessione documentata che interessa i requisiti del cliente — campioni rilasciati, specifica, grafica, imballaggio o criteri di accettazione — richiede il rilascio scritto del cliente prima della liberazione. Senza di esso, il prodotto viene rilavorato, sostituito o respinto secondo il requisito originale.'
    - q: 'Quale documentazione riceviamo per una non conformità?'
      a: 'Il record NCR include numero NCR, fase di rilevamento, prodotto/SKU, partita, revisioni documentali applicabili, descrizione del difetto, contenimento, disposizione, riferimento dell''istruzione di rilavorazione, esito della nuova verifica e rilascio o chiusura finale — disponibile secondo il vostro accordo di qualità di progetto.'

