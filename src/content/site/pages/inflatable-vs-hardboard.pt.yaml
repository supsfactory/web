faqs:
  - question: 'Qual é mais resistente: um SUP insuflável ou um rígido?'
    answer: Os SUP insufláveis são geralmente mais resistentes porque suportam amolgadelas, fissuras e danos de impacto que danificariam permanentemente uma prancha rígida.
  - question: Um SUP insuflável é mais adequado para principiantes?
    answer: Sim. Os SUP insufláveis são recomendados para principiantes porque são mais tolerantes, mais fáceis de transportar e causam menos vezes lesões nas quedas.
  - question: Os SUP insufláveis podem render tanto quanto as pranchas rígidas?
    answer: Para a pagaiada recreativa e os tours, os SUP insufláveis atingem o desempenho das pranchas rígidas. As pranchas rígidas permanecem superiores nas competições e no surf exigente, porque são mais leves e oferecem uma flexão mais refinada.
body: |
  <h2>As diferenças fundamentais</h2>
  <p>Os SUP insufláveis (iSUP) e as pranchas rígidas cumprem o mesmo propósito básico — estar de pé e pagaiar na água — mas chegam lá com métodos de construção completamente diferentes. A escolha certa depende de como pretendes usar a prancha.</p>

  <table>
    <tr><th>Fator</th><th>SUP insuflável</th><th>SUP rígido</th></tr>
    <tr><td>Construção</td><td>PVC drop-stitch, insuflado a 12–15 PSI</td><td>Núcleo em espuma EPS, revestido em fibra de vidro ou epóxi</td></tr>
    <tr><td>Peso</td><td>18–28 lbs (só a prancha)</td><td>20–30 lbs (só a prancha)</td></tr>
    <tr><td>Dimensões quando embalado</td><td>Mochila (30 × 15 × 10 polegadas)</td><td>Comprimento total (10–14 ft)</td></tr>
    <tr><td>Preparação</td><td>3–5 minutos de insuflagem</td><td>Pronta a usar</td></tr>
    <tr><td>Durabilidade</td><td>5–10 anos com boa manutenção</td><td>3–8 anos (tende a amolgar)</td></tr>
  </table>

  <h2>Transportabilidade</h2>
  <p><strong>Ganha o insuflável.</strong> Esta é a vantagem mais evidente. Um SUP insuflável dobra-se numa mochila que cabe na bagageira de um carro, num armário de casa ou na bagagem de um avião. Quem viaja, quem vive em apartamento e quem não tem um suporte de tejadilho achará os SUP insufláveis decisivamente mais práticos.</p>
  <p>As pranchas rígidas exigem um suporte de tejadilho, um veículo grande ou um lugar dedicado para as guardar. São difíceis de transportar e não podem viajar de avião sem caixas de expedição próprias.</p>

  <h2>Durabilidade</h2>
  <p><strong>Ganha o insuflável.</strong> Os SUP insufláveis são fabricados em PVC de qualidade militar que resiste a impactos, perfurações e danos UV. Se deixares cair uma prancha insuflável ou bateres numa rocha, ela ressalta. Uma prancha rígida, com o mesmo impacto, lascaria, partir-se-ia ou delaminaria.</p>
  <p>As pranchas rígidas estão mais sujeitas ao desgaste diário. Uma única queda no cimento pode causar uma amolgadela permanente que compromete o desempenho e permite a entrada de água.</p>

  <h2>Desempenho</h2>
  <p><strong>A prancha rígida ganha nos níveis máximos.</strong> Na pagaiada recreativa e nos tours a velocidades moderadas, os dois tipos de prancha comportam-se de forma semelhante. As pranchas rígidas têm vantagens em:</p>
  <ul>
    <li><strong>Velocidade</strong> —As pranchas rígidas são mais leves e mais rígidas, o que se traduz numa melhor planagem e numa maior velocidade de ponta</li>
    <li><strong>Surf</strong> —As pranchas rígidas oferecem transições rail-to-rail mais reagentes e um melhor comportamento nas ondas</li>
    <li><strong>Competições</strong> —Nas competições de alto nível usam-se quase exclusivamente pranchas rígidas pela sua vantagem em termos de peso e rigidez</li>
  </ul>
  <p>Para o paddler recreativo médio, estas diferenças de desempenho são marginais. A maioria dos paddlers não conseguirá ultrapassar os limites de uma prancha insuflável de alta qualidade.</p>

  <h2>Facilidade para principiantes</h2>
  <p><strong>Ganha o insuflável.</strong> Os SUP insufláveis são mais fáceis para principiantes porque:</p>
  <ul>
    <li>A superfície do deck mais macia é mais confortável e causa menos vezes lesões nas quedas</li>
    <li>As pranchas insufláveis mais largas e espessas oferecem uma maior estabilidade primária</li>
    <li>O custo de compra inferior torna a entrada mais acessível</li>
    <li>O transporte mais simples significa mais oportunidades de pagaiar</li>
  </ul>

  <h2>Armazenamento e manutenção</h2>
  <p>Os SUP insufláveis devem ser secos e dobrados corretamente antes do armazenamento. As pranchas rígidas podem ser guardadas montadas, mas exigem proteção contra sol, calor e impactos. Ambas beneficiam de um enxaguamento com água doce após o uso em água salgada.</p>

  <h2>Recomendação</h2>
  <p><strong>Escolhe um SUP insuflável se:</strong> viajas, tens pouco espaço de armazenamento, pagaias por lazer ou és principiante. 90 % dos paddlers ficam bem servidos com uma prancha insuflável de alta qualidade.</p>
  <p><strong>Escolhe uma prancha rígida se:</strong> participas em competições de alto nível, surfas ondas exigentes ou colocas o desempenho máximo à frente da transportabilidade e da durabilidade.</p>

  <h2>FAQ</h2>
  <h3>Qual é mais resistente: um SUP insuflável ou um rígido?</h3>
  <p>Os SUP insufláveis são geralmente mais resistentes porque suportam amolgadelas, fissuras e danos de impacto que danificariam permanentemente uma prancha rígida.</p>

  <h3>Um SUP insuflável é mais adequado para principiantes?</h3>
  <p>Sim. Os SUP insufláveis são recomendados para principiantes porque são mais tolerantes, mais fáceis de transportar e causam menos vezes lesões nas quedas.</p>

  <h3>Os SUP insufláveis podem render tanto quanto as pranchas rígidas?</h3>
  <p>Para a pagaiada recreativa e os tours, os SUP insufláveis atingem o desempenho das pranchas rígidas. As pranchas rígidas permanecem superiores nas competições e no surf exigente, porque são mais leves e oferecem uma flexão mais refinada.</p>

