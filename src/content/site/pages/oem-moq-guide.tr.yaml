moq_stages:
  tagline: 'Numune · Pilot · Hacim'
  title: 'Üç Farklı Miktar Aşaması'
  subtitle: 'Numune, pilot ve hacimli üretim miktarları farklıdır. Taahhüt etmeden önce doğrulama yapmanız için her proje üç ayrı kademeye ayrılır.'
  steps:
    - step: '01'
      title: 'Numune Geliştirme (1–2 adet)'
      desc: 'Herhangi bir mali taahhütten önce gövde rijitliğinin, EVA kayma pad dokusunun, grafik doğruluğunun ve aksesuar uyumunun fiziksel doğrulaması. Numune ücretleri uygulanır ve sözleşme onayıyla üretim siparişinize mahsup edilir.'
    - step: '02'
      title: 'Pilot Sipariş (20–50 adet)'
      desc: 'Kurulum sürtünmesini en aza indirmek için mevcut gövde platformları, stok malzemeler ve sadeleştirilmiş ambalajla sezon öncesi ticari test ve bölgesel pazar doğrulaması.'
    - step: '03'
      title: 'Hacimli Üretim (90–100+ adet)'
      desc: 'Dondurulmuş BOM, kesinleştirilmiş grafikler, özel ambalaj ve planlanmış teslimat programı sonrası teyit edilir — tam 150 m kumaş ruloları, özel Pantone kumaşlar, özel ambalaj, hacim indirimleri ve tam zincir parti izlenebilirliği.'

