moq_faqs:
  tagline: SSS
  title: 'MOQ Hakkında Sık Sorulan Sorular'
  items:
    - q: 'MOQ sipariş, model veya renk varyantı başına mı hesaplanır?'
      a: 'MOQ model, renk varyantı, grafik versiyonu, ambalaj konfigürasyonu veya toplam sipariş başına uygulanabilir. Farklı drop-stitch kalınlıkları (12 cm veya 15 cm) ve PVC renkleri ayrı hammadde rulolarından geldiği için, 5 renge bölünmüş 50 tahtalık sipariş 5 ayrı kumaş rulosu ihtiyacı doğurur. Karmaınızı net planlayabilmeniz için teklif öncesi kesin hesabı SKU matrisinize göre teyit ederiz.'
    - q: 'Toplu üretimden önce numune sipariş edebilir miyim?'
      a: 'Evet. Numune geliştirme (1–2 adet), seri üretime sevk öncesi gövde rijitliğini, EVA kayma pad dokusunu, grafik doğruluğunu ve aksesuar uyumunu doğrular. Numune ücretleri uygulanır ve sözleşme onayıyla üretim siparişinize mahsup edilir.'
    - q: 'Neden özel perakende ambalajının bağımsız bir MOQ su vardır?'
      a: 'Özel fleksografik veya ofset koli baskı pressleri en az 500+ adetlik üretim kurulumu gerektirir. Hibrit Ambalaj Depolama Çözümü sunuyoruz: 500 adet özel baskılı koliyi üretir, fazlasını temiz depomuzda saklar ve programlanan tahta sevkiyatlarınıza göre serbest bırakırız — böylece daha küçük bir tahta siparişi de tam markalı perakende ambalajıyla sevk edilebilir.'
    - q: 'Neden standart hacimli MOQ 90–100 adettir?'
      a: 'Standart hacimli MOQ hammaddeyi izler: yüksek kaliteli drop-stitch kumaşın 150 m ana rulosu, standart bir touring veya all-around gövde için yaklaşık 90–100 bitmiş tahta verir. Tam rulo çalıştırmak kumaş eklemesini ortadan kaldırır, lif gerilimini tekdüze tutar ve 2 saatlik kaynak ile laminasyon hattı kalibrasyonunu amorti eder — mümkün olan en düşük birim maliyeti sağlar.'
    - q: 'Daha yüksek miktar birim maliyeti düşürür mü?'
      a: 'Çoğu projede evet. Daha yüksek miktarlar malzeme verimini iyileştirir, sabit üretim hattı kurulum yükünü daha çok tahtaya yayar ve tahta başına ambalaj maliyetini düşürür.'
    - q: 'Ortak markalama kalıp ücretleri yeniden siparişlerde tekrar uygulanır mı?'
      a: 'Hayır. Ekran baskı kalıp ücretleri ilk kurulumda bir kez alınır ve aynı grafik ölçüsüyle yeniden siparişlerde alınmaz. Yalnızca tahta başına 1.00 ABD Doları tutarındaki fabrika işleme ve baskı ücretini ödersiniz.'
    - q: 'MOQ rehberi istemek beni bir siparişe bağlıyor mu?'
      a: 'Hayır. Proje MOQ rehberi istemek, yalnızca Qingdao Vatrad Group Co., Ltd. şirketindeki mühendislik ekibimizin teknik brifinginizi inceleyip en maliyet etkili üretim yolunu tavsiye etmesine olanak tanır. Gizli teknik spesifikasyonlarınızı veya grafiklerinizi paylaşmadan önce bir Gizlilik Anlaşması (NDA) imzalanabilir.'

evidence_review:
  tagline: 'Kanıt ve Doğrulama'
  title: 'DOĞRULANMIŞ SPESİFİKASYONLAR'
  body: 'Bu sayfadaki tüm üretim iddiaları, Laixi, Qingdao tesisimizdeki Üretim Mühendisliği Ekibimiz tarafından doğrulanmıştır. Sertifikalar, kalite kontrol inceleme kayıtları, basınç ve yapısal test raporları ve parti izlenebilirliği kayıtları talep üzerine mevcuttur. Spesifikasyonlar en son Eylül 2026 tarihinde doğrulanmıştır.'

