process_steps:
  tagline: The Process
  title: 'From Brief to Delivered Boards — Five Steps'
  subtitle: 'Every step has a defined timeline, a documented deliverable, and a go/no-go checkpoint. You proceed only when you are ready.'
  steps:
    - step: 'Step 1'
      title: 'Submit Your Project Brief'
      desc: 'Tell us about your board — target specs, volume, compliance needs and timeline. The brief takes 5–10 minutes. If you are not sure about every detail, share what you have and we will guide the rest. An NDA is available before you share proprietary designs.'
    - step: 'Step 2'
      title: 'NDA & Feasibility Review (1–5 Days)'
      desc: 'We sign an NDA if requested, then engineering reviews your brief against manufacturing capability, material availability and compliance scope. You receive an itemized quotation with MOQ calculation, sample fees and a gate-by-gate timeline.'
    - step: 'Step 3'
      title: 'Sample & Approval (7–21 Days)'
      desc: '1–2 physical boards produced to your specification. You ride and evaluate — hull rigidity, graphic accuracy, accessory fitment. Adjustments are captured in a revised BOM. The frozen sample becomes the production reference. Sample fees are credited toward production.'
    - step: 'Step 4'
      title: 'Pre-Production Planning (7 Days)'
      desc: 'Materials procurement, tooling setup, packaging confirmation and production slot reservation. All materials are incoming-inspected against the frozen BOM. A production schedule with QC gate dates is issued before manufacturing begins.'
    - step: 'Step 5'
      title: 'Production, QC & Shipping (4–6 Weeks)'
      desc: 'Manufacturing runs through the 7-stage inspection gate system with pass/fail criteria at each gate. Export-grade packing, compliance documentation and ocean freight coordination to 50+ countries. Post-delivery review captures refinements for the next order.'

