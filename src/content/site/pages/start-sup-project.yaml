what_we_need:
  heading: 'What to Prepare Before Your Brief'
  body: |
    A complete brief accelerates the process. Here is what helps:

    - **Board specs** — Target length, width, thickness, rider weight, use-case. Reference board dimensions or competitor models are useful.
    - **Design files** — Vector artwork (AI, SVG, PDF) for graphics and logos. If not ready, mood boards or reference images work for initial feasibility.
    - **Volume & timeline** — Target quantity and season schedule. Even a rough range ("20–50 boards by March") is enough to start.
    - **Compliance needs** — Target markets and any specific certification requirements beyond CE, ISO 9001, BSCI, REACH, RoHS.
    - **Budget range** — An indicative per-board budget or target landed cost helps us recommend the right platform.

    **Not ready with everything?** Submit what you have. We will guide the rest.

faqs:
  tagline: FAQ
  title: 'Starting a SUP Project — Frequently Asked Questions'
  items:
    - q: 'What is the minimum order to start?'
      a: 'The entry point is tiered: 1–2 samples first (7–12 days), a trial order of 20–50 boards (25–35 days), then standard volume runs of 90–100+ boards per approved configuration. Private label co-branding starts from 5–10 units with no development stage.'
    - q: 'How long does it take to get samples?'
      a: 'Physical samples are produced in 7–12 days from confirmed spec and deposit. Using existing hull platforms, the full cycle from brief to delivered trial order typically runs 8–12 weeks. A bespoke hull adds 15–20 days of mould development.'
    - q: 'Is my design protected?'
      a: 'Yes. An NDA is available immediately — before you share any proprietary information. We manufacture exclusively under our clients'' brands and never compete with them. All technical files are stored in access-controlled systems with audit trails.'
    - q: 'What does the project brief form ask for?'
      a: 'The brief asks for your business type, company name, target board specifications, order quantity range, timeline and any compliance requirements. It takes about 5–10 minutes. You can attach design files (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) up to 10 MB. If you are unsure about any field, skip it — we will follow up.'
    - q: 'What happens after I submit the brief?'
      a: 'You receive a response within one business day. Engineering reviews your brief and returns an itemized quotation with MOQ, sample fees and a gate-by-gate timeline. No commitment is required until you review and sign the contract. Sample fees are credited toward your production order.'

