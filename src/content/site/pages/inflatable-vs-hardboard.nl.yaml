body: |
  <h2>De fundamentele verschillen</h2>
  <p>Opblaasbare SUP''s (iSUP) en stijve boards dienen hetzelfde basisdoel — op het water staan en peddelen — maar bereiken dat met volledig verschillende constructiemethoden. De juiste keuze hangt af van hoe je het board wilt gebruiken.</p>

  <table>
    <tr><th>Factor</th><th>Opblaasbare SUP</th><th>Stijve SUP</th></tr>
    <tr><td>Constructie</td><td>PVC drop-stitch, opgeblazen tot 12–15 PSI</td><td>EPS-schuimkern, bekleed met glasvezel of epoxy</td></tr>
    <tr><td>Gewicht</td><td>18–28 lbs (alleen board)</td><td>20–30 lbs (alleen board)</td></tr>
    <tr><td>Afmetingen ingepakt</td><td>Rugzak (30 × 15 × 10 inch)</td><td>Volledige lengte (10–14 ft)</td></tr>
    <tr><td>Voorbereiding</td><td>3–5 minuten oppompen</td><td>Klaar voor gebruik</td></tr>
    <tr><td>Levensduur</td><td>5–10 jaar bij goed onderhoud</td><td>3–8 jaar (deukt snel)</td></tr>
  </table>

  <h2>Draagbaarheid</h2>
  <p><strong>De opblaasbare wint.</strong> Dit is het meest voor de hand liggende voordeel. Een opblaasbare SUP vouwt zich op in een rugzak die past in de kofferbak van een auto, in een kast thuis of in de bagageruimte van een vliegtuig. Wie reist, in een appartement woont of geen dakdragers heeft, zal opblaasbare SUP''s duidelijk praktischer vinden.</p>
  <p>Stijve boards vereisen dakdragers, een groot voertuig of een speciale opslagplaats. Ze zijn moeilijk te vervoeren en kunnen niet per vliegtuig mee zonder speciale verzendkisten.</p>

  <h2>Duurzaamheid</h2>
  <p><strong>De opblaasbare wint.</strong> Opblaasbare SUP''s zijn gemaakt van PVC van militaire kwaliteit dat bestand is tegen stoten, perforaties en UV-schade. Laat je een opblaasbaar board vallen of raak je een rots, dan veert het terug. Een stijve board zou bij dezelfde impact versplinteren, breken of delamineren.</p>
  <p>Stijve boards zijn gevoeliger voor dagelijkse slijtage. Een enkele val op beton kan een permanente deuk veroorzaken die de prestaties aantast en water laat binnendringen.</p>

  <h2>Prestaties</h2>
  <p><strong>De stijve board wint op het hoogste niveau.</strong> Bij recreatief peddelen en toeren op gematigde snelheden gedragen de twee boardtypes zich vergelijkbaar. Stijve boards hebben voordelen bij:</p>
  <ul>
    <li><strong>Snelheid</strong> — Stijve boards zijn lichter en stijver, wat zich vertaalt in een betere glijvlucht en een hogere topsnelheid</li>
    <li><strong>Surfen</strong> — Stijve boards bieden meer responsieve rail-to-rail-transities en een beter gedrag op de golven</li>
    <li><strong>Wedstrijden</strong> — In competitieve wedstrijden worden vrijwel uitsluitend stijve boards gebruikt vanwege hun voordeel in gewicht en stijfheid</li>
  </ul>
  <p>Voor de gemiddelde recreatieve paddler zijn deze prestatieverschillen marginaal. De meeste paddlers zullen de limieten van een hoogwaardige opblaasbare board niet overschrijden.</p>

  <h2>Geschikt voor beginners</h2>
  <p><strong>De opblaasbare wint.</strong> Opblaasbare SUP''s zijn makkelijker voor beginners omdat:</p>
  <ul>
    <li>Het zachtere deck-oppervlak comfortabeler is en minder vaak letsel veroorzaakt bij vallen</li>
    <li>De bredere en dikkere opblaasbare boards een grotere primaire stabiliteit bieden</li>
    <li>De lagere aanschafkosten de instap toegankelijker maken</li>
    <li>Eenvoudiger vervoer meer kansen om te peddelen betekent</li>
  </ul>

  <h2>Opslag en onderhoud</h2>
  <p>Opblaasbare SUP''s moeten vóór de opslag correct worden gedroogd en opgevouwen. Stijve boards kunnen gemonteerd worden opgeslagen, maar vereisen bescherming tegen zon, hitte en stoten. Beide hebben baat bij een spoeling met zoet water na gebruik in zoutwater.</p>

  <h2>Aanbeveling</h2>
  <p><strong>Kies een opblaasbare SUP als:</strong> je reist, weinig opslagruimte hebt, recreatief peddelt of beginner bent. 90% van de paddlers wordt prima geholpen door een hoogwaardige opblaasbare board.</p>
  <p><strong>Kies een stijve board als:</strong> je deelneemt aan competitieve wedstrijden, uitdagende golven surft of maximale prestaties belangrijker vindt dan draagbaarheid en duurzaamheid.</p>

  <h2>FAQ</h2>
  <h3>Wat is duurzamer: een opblaasbare SUP of een stijve?</h3>
  <p>Opblaasbare SUP''s zijn over het algemeen duurzamer omdat zij deuken, scheuren en impacts schade doorstaan die een stijve board permanent zouden beschadigen.</p>

  <h3>Is een opblaasbare SUP geschikter voor beginners?</h3>
  <p>Ja. Opblaasbare SUP''s worden aanbevolen aan beginners omdat ze vergevingsgezinder, makkelijker te vervoeren zijn en minder vaak letsel veroorzaken bij vallen.</p>

  <h3>Kunnen opblaasbare SUP''s net zo goed presteren als stijve boards?</h3>
  <p>Voor recreatief peddelen en toeren bereiken opblaasbare SUP''s de prestaties van stijve boards. Stijve boards blijven superieur in wedstrijden en veeleisend surfen, omdat ze lichter zijn en een verfijndere buiging bieden.</p>

