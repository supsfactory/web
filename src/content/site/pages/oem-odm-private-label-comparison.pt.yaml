ip_rules:
  tagline: 'Proteção da propriedade intelectual'
  title: 'Como protegemos os teus designs e a tua marca'
  subtitle: 'Independentemente do modelo de colaboração, o teu artwork, os teus moldes e os teus ficheiros de especificação continuam a ser teus.'
  body: |
    **NDA antes da troca de ficheiros.** Assinamos um acordo de não divulgação antes de qualquer troca de ficheiros técnicos — tempo de resposta padrão dentro de 4 horas úteis.

    **Nenhum reutilizar dos designs.** O teu artwork, os teus moldes e os teus ficheiros de especificação nunca são partilhados ou vendidos a outros clientes. Os moldes OEM pertencem exclusivamente a ti. Os designs ODM são por ti aprovados antes da produção. As plataformas Private Label são estruturas partilhadas, mas as tuas gráficas e o teu branding são exclusivos.

    **Apenas B2B.** Produzimos exclusivamente sob as marcas dos nossos clientes. Não vendemos a consumidores finais e não entramos em concorrência com os nossos clientes em nenhum mercado.

    **Propriedade dos moldes.** Os moldes dedicados pagos pelo comprador pertencem ao comprador. Armazenamo-los e mantemo-los, mas não podemos usá-los para outros clientes sem autorização escrita.

faqs:
  tagline: 'FAQ'
  title: 'Perguntas frequentes sobre OEM, ODM e Private Label'
  items:
    - q: 'Posso passar do Private Label para o OEM mais tarde?'
      a: 'Sim. Muitos clientes começam com uma produção Private Label ou piloto para validar o mercado, e depois investem em ferramental dedicado para um programa OEM completo uma vez demonstrada a procura. A mesma fábrica e o mesmo sistema QC suportam ambos os percursos.'
    - q: 'ODM significa que a fábrica possui a minha marca?'
      a: 'Não. Com o ODM és dono da tua marca, das tuas gráficas e da tua embalagem. A fábrica desenvolve a estrutura da prancha a partir do teu briefing e tu aprovas o design antes da produção. A fábrica mantém a PI do processo de desenvolvimento, mas a especificação de produto aprovada é tua.'
    - q: 'O Private Label é de qualidade inferior ao OEM?'
      a: 'Não. Os três percursos passam pela mesma fábrica, o mesmo sistema QC e a mesma equipa de exportação. As pranchas Private Label são construídas em plataformas testadas e validadas, com o teste completo de pressão de 18-PSI/24 horas e a mesma checklist de montagem de 100 pontos.'
    - q: 'E se não tiver a certeza de qual modelo escolher?'
      a: 'Contacta-nos com a tua situação — a nossa equipa técnica aconselha o percurso mais prático com base nos teus requisitos de produto, no teu calendário e nos teus objetivos de quantidade. Não há qualquer obrigação antes da verificação da especificação.'
    - q: 'Posso receber amostras antes de decidir o modelo?'
      a: 'Sim. 1–2 amostras protótipo partem em 7–12 dias. Os custos das amostras são creditados na tua encomenda de massa. Assim podes avaliar a construção e a qualidade antes de qualquer compromisso de quantidade.'

