hero:
  tagline: 'Escolhe o teu modelo de colaboração'
  title: 'OEM vs. ODM vs. Private Label — qual o modelo adequado ao teu projeto?'
  subtitle: 'Três formas de colaborar com uma fábrica de SUP, cada uma com propriedade, investimentos e compromissos de velocidade diferentes. Este guia explica as diferenças, para escolheres o percurso certo antes do teu primeiro pedido.'

answer:
  label: 'Comparação rápida'
  text: 'OEM: és dono do design e da especificação — produzimos segundo os teus desenhos. ODM: a nossa equipa técnica desenvolve a prancha a partir do teu briefing — aprovas antes da produção. Private Label: a tua marca numa plataforma existente testada sem alterações estruturais — o percurso mais rápido para o mercado. Os três percursos passam pela mesma fábrica, o mesmo sistema QC e a mesma equipa de exportação em Qingdao, China.'
  verified: 'September 2026'

comparison_table:
  tagline: 'Lado a lado'
  title: 'OEM / ODM / Private Label em comparação'
  subtitle: 'Diferenças essenciais na propriedade do design, MOQ, ferramental, prazos de entrega e propriedade intelectual.'
  headers:
    dimension: Dimensão
    oem: Produção OEM
    odm: Desenvolvimento ODM
    pl: Private Label
  rows:
    - dimension: 'Quem projeta a prancha?'
      oem: 'Forneces a especificação, os desenhos ou uma prancha de referência'
      odm: 'A equipa técnica da fábrica desenvolve a partir do teu briefing'
      pl: 'Plataforma de fábrica existente — nenhum esforço de design'
    - dimension: 'Propriedade do design e PI'
      oem: 'És dono de todos os designs, moldes e propriedade intelectual'
      odm: 'És dono do design final aprovado; a fábrica detém a PI do processo de desenvolvimento'
      pl: 'A fábrica possui o design da plataforma; tu possuis a marca e as gráficas'
    - dimension: 'Molde / ferramental'
      oem: 'Molde dedicado necessário para novas formas — taxa única de ferramental, 15–20 dias adicionais'
      odm: 'Pode exigir um molde dedicado consoante a especificação — mesmo planeamento de ferramental'
      pl: 'Nenhum molde novo — utiliza-se o ferramental da plataforma existente'
    - dimension: 'Quantidade mínima de encomenda'
      oem: '90–100+ unidades por configuração aprovada'
      odm: '90–100+ unidades por configuração aprovada; lotes piloto de 20–50'
      pl: '5–10 unidades (co-branding) ou 20–50 (lote piloto em plataforma existente)'
    - dimension: 'Prazo de entrega típico'
      oem: '25–35 dias + 15–20 dias de ferramental se for novo molde'
      odm: '25–35 dias + iteração de desenvolvimento (varia com a complexidade)'
      pl: '25–35 dias (sem atrasos de ferramental)'
    - dimension: 'Grau de personalização'
      oem: 'Total — forma, construção, materiais, gráficas, embalagem'
      odm: 'Total — a fábrica propõe, tu aprovas cada elemento'
      pl: 'Apenas gráficas e embalagem — nenhuma alteração estrutural'
    - dimension: 'Processo de amostra'
      oem: '1–2 amostras protótipo em 7–12 dias após a aprovação da especificação'
      odm: '1–2 amostras protótipo em 7–12 dias após a aprovação do design'
      pl: '1–2 amostras em 7–12 dias — plataforma já validada'
    - dimension: 'Ideal para'
      oem: 'Compradores com designs existentes, pranchas de referência ou especificações detalhadas'
      odm: 'Compradores com ideias de produto ou requisitos de mercado, mas sem especificação detalhada'
      pl: 'Compradores que querem pranchas com marca rapidamente sem desenvolvimento de produto'

