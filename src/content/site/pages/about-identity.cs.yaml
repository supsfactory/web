hero:
  tagline: 'Identita značky'
  title: 'Kdo je iSupfactory?'
  subtitle: 'iSupfactory je značka výroby Vatrad orientovaná na kupující, tedy námořní výrobní divize společnosti Qingdao Vatrad Group Co., Ltd. — výrobce nafukovacích desek SUP a nafukovacích námořních výrobků v Laixi, Čína (Qingdao). Vyrábíme výhradně pod značkami našich klientů a nikdy s nimi na žádném trhu nesoutěžíme.'

answer:
  label: 'Ve zkratce'
  text: 'Právní subjekt: Qingdao Vatrad Group Co., Ltd. Výrobní divize: Vatrad (značka iSupfactory). Továrna: Laixi, Qingdao, Shandong, Čína. Oblast činnosti: OEM, ODM a private-label výroba nafukovacích desek SUP, paddleboardových pádel a nafukovacích námořních výrobků. Certifikace: ISO 9001:2015, CE (modely pro evropský trh), BSCI, REACH, RoHS. Neprodáváme pod vlastní značkou — každá vyrobená deska nese značku kupujícího.'
  verified: 'září 2026'

