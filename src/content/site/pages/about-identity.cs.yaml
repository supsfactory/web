manufacturing_scope:
  heading: 'Výrobní profil'
  body: |
    Náš výrobní profil zahrnuje celý výrobní řetězec nafukovacích SUP a námořních výrobků — od vstupní kontroly surovin až po konečné balení a vývozní dokumentaci.

    - **Kategorie výrobků**: nafukovací desky SUP (all-around, touring, surf, fishing, yoga, racing), nafukovací kajaky, nafukovací čluny, pádla, pumpičky a příslušenství.
    - **Typy konstrukce**: jednovrstvý PVC, dvojvrstvý PVC, jádro drop-stitch s povlakem z PVC. Konstrukční specifikace na míru pro každý projekt.
    - **Modely spolupráce**: OEM (vlastní design kupujícího), ODM (vyvinuto továrnou podle zadání kupujícího), private-label / co-branding (značka na již ověřených platformách).
    - **Certifikace**: ISO 9001:2015 (řízení kvality v továrně), CE (modely pro evropský trh, rozsah dle projektu), BSCI (společenská odpovědnost), REACH (chemická bezpečnost), RoHS (ograněné látky).
    - **Výrobní kapacita**: více než 120 000 desek ročně, zhruba 10 000 kusů měsíčně na 4 automatizovaných linkách. Navýšení kapacity je možné při předběžném plánování.

brand_positioning:
  heading: 'Pozicionování značky'
  body: |
    iSupfactory zaujímá na trhu konkrétní pozici — nejsme značka, jsme výrobce. Toto rozlišení formuje každý aspekt našeho fungování:

    - **Nikdy neprodáváme pod vlastní značkou.** Každá vyrobená deska nese značku kupujícího. Na žádném trhu ani v žádném kanálu se svými klienty nesoutěžíme. Tato zásada není přípustná k jednání.
    - **Nejsme obchodní společností.** Provozujeme továrnu. Kontrola kvality, konstrukční vývoj, plánování výroby i vývozní dokumentaci zajišťujeme vlastními silami. Mezi Vaší objednávkou a výrobním podlahem nejsou žádní zprostředkovatelé.
    - **Specializujeme se na nafukovací výrobky.** Nejde o vedlejším sortiment ani o jednu z mnoha kategorií. Nafukovací SUP a námořní výrobky jsou naší hlavní odborností. Každý stroj, každý proces a každý kontrolní bod kvality je optimalizován právě pro tuto kategorii výrobků.
    - **Obsluhujeme profesionální kupující.** Našimi klienty jsou značky, distributoři, provozovatelé resortů, kluby a školy — nikoli jednotliví spotřebitelé. Naše ceny, struktura MOQ, dokumentace i komunikace jsou navrženy pro B2B vztahy.

evidence_review:
  tagline: 'Důkazy a ověření'
  title: 'SPECIFIKACE OVĚŘENY'
  body: 'Všechna organizační a výrobní tvrzení na této stránce jsou ověřitelná. Certifikát ISO 9001, zpráva BSCI, živnostenské oprávnění a registrace továrny jsou k dispozici na vyžádání. Návštěvy továrny jsou vítány. Specifikace naposledy ověřeny v září 2026.'

faqs:
  tagline: FAQ
  title: 'Identita značky — často kladené otázky'
  items:
    - q: 'Je iSupfactory samostatnou společností oddělenou od Qingdao Vatrad Group?'
      a: 'Ne. iSupfactory je značka Vatrad orientovaná na kupující; Vatrad je námořní výrobní divizí společnosti Qingdao Vatrad Group Co., Ltd. Právním subjektem všech objednávek je Qingdao Vatrad Group Co., Ltd. Továrna, tým a systém kvality tvoří jediný celek.'
    - q: 'Prodáváte desky pod vlastní značkou?'
      a: 'Ne. Vyrábíme výhradně pod značkami našich klientů a nikdy s nimi na žádném trhu nesoutěžíme. Jde o zásadní politiku, nikoli o dočasné stanovisko. Pokud na trhu najdete desku se značkou iSupfactory, není z naší továrny.'
    - q: 'Mohu navštívit továrnu?'
      a: 'Ano. Návštěvy továrny vítáme a můžeme zorganizovat strukturovaný audit pokrývající celý výrobní proces, kontrolní body kvality, sklad materiálů a kontrolu dokumentace. Ozvěte se nám a dohodneme termín.'
    - q: 'Jaký je vztah mezi Vatrad a iSupfactory?'
      a: 'Vatrad je název výrobní divize uvnitř Qingdao Vatrad Group. iSupfactory je mezinárodní značka orientovaná na kupující, používaná pro služby výroby OEM, ODM a private-label. Obě označení se vztahují k téže činnosti — k námořní výrobní divizi v Laixi, Qingdao.'

