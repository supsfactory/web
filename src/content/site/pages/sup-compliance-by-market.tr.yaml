certifications_detail:
  heading: 'Sertifikasyon Kapsamımız'
  body: |
    Aşağıdaki sertifikasyonlar üretimimizde mevcuttur veya sunulabilir. Projenize özgü belirli sertifikasyon kapsamı, uygulanabilirlik incelemesi sırasında doğrulanır ve teklifinizde kalem kalem yer alır.

    - **ISO 9001:2015** — Fabrika kalite yönetim sistemi, akredite üçüncü taraf tarafından yıllık denetlenir. Gelen malzeme muayenesinden son ambalajlama kadar tüm üretim sürecini kapsar.
    - **CE işaretlemesi** — AB pazarlarına yönelik modellere uygulanır. Geçerli AB direktifine göre test ve belgeler. Kapsam proje başına doğrulanır — tüm modeller aynı CE kapsamını gerektirmez.
    - **BSCI** — İş Etiği Sosyal Uyum Girişimi denetimi. Çalışan hakları, iş güvenliği, çevresel uyum ve iş etiğini kapsar. Tüm pazarlar için mevcuttur.
    - **REACH** — AB kimyasal güvenlik düzenlemesi. Tüm PVC, yapıştırıcı ve kaplama malzemeleri REACH uyumludur. Madde belgeleri ve test raporları parti başına mevcuttur.
    - **RoHS** — Tehlikeli Maddelerin Kısıtlanması direktifi. Tüm elektronik aksesuarlar (motorlu pompalar, LED aksesuarlar) RoHS uyumludur. Board malzemeleri zaten uyumludur.

compliance_process:
  tagline: 'Siparişinizde Uyumluluk Nasıl İşler'
  title: 'Devreye Alma Akışında Uyumluluk'
  subtitle: 'Uyumluluk bir ek özellik değildir — devreye alma sürecinin her kapısına entegre edilmiştir.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: 1
      icon_bg: blue
      title: 'Kapı 1: Kapsam Doğrulaması'
      desc: 'Sorgu aşamasında hedef pazarları belirtirsiniz. Belirli ürününüz ve hedefiniz için hangi sertifikasyon, test ve belgelerin geçerli olduğunu doğrularız. Uyumluluk kapsamı ve ilgili maliyetler teklifte kalem kalem yer alır.'
    - icon: 2
      icon_bg: green
      title: 'Kapı 3: Numune Sertifikasyonu'
      desc: 'Numuneler doğrulanmış uyumluluk kapsamına göre üretilir. Üçüncü taraf laboratuvar testi gerekiyorsa (CE, CPSIA, AS/NZS), testleri akredite laboratuvarlar üzerinden koordine ederiz. Test raporları numuneyle birlikte teslim edilir.'
    - icon: 3
      icon_bg: purple
      title: 'Kapı 7: Belge Paketi'
      desc: 'Her üretim siparişi uyumluluk belge paketiyle sevk edilir: uygunluk belgeleri, test raporları, parti izlenebilirlik kayıtları, malzeme güvenlik bilgileri ve etiketleme uyumluluğu. Belgeler pazara özeldir.'

faqs:
  tagline: SSS
  title: 'SUP Uyumluluğu — Sık Sorulan Sorular'
  items:
    - q: 'Tüm SUP boardlar CE işaretlemesi gerektirir mi?'
      a: 'CE işaretlemesi yalnızca Avrupa Ekonomik Alanında satılan boardlar için gereklidir. AB pazarlarına yönelik modelleri, kapsam proje başına doğrulanarak sertifikalandırıyoruz. AB dışı pazarlara gönderilen boardlar, siz özellikle talep etmedikçe CE işareti taşımaz.'
    - q: 'Malzemeleriniz REACH ve RoHS uyumlu mu?'
      a: 'Evet. Tüm PVC, yapıştırıcı ve kaplama malzemeleri REACH uyumludur. Tüm elektronik aksesuarlar (motorlu pompalar, LED aksesuarlar) RoHS uyumludur. Board konstrüksiyon malzemeleri zaten RoHS uyumludur. Madde belgeleri ve test raporları talep üzerine parti başına mevcuttur.'
    - q: 'Burada listelenmeyen bir pazar için sertifikasyonu halledebilir misiniz?'
      a: 'Evet. 50 ülkeye sevkiyat yaptık ve çoğu pazar için sertifikasyon ve belge hazırlığını koordine edebiliriz. Sorgu sırasında hedef ülkenizi belirtin; belirli uyumluluk kapsamını ve gereken ek test veya belgeleri doğrulayalım.'
    - q: 'Uyumluluk maliyetleri nasıl ele alınır?'
      a: 'Uyumluluk kapsamı ve ilgili maliyetler (üçüncü taraf laboratuvar testleri, sertifikasyon ücretleri) uygulanabilirlik incelemesi sırasında teklifinizde kalem kalem yer alır. Üretim sonrası uyumluluk ücreti yoktur. Standart sertifikasyonlar (ISO 9001, BSCI) fabrika düzeyindedir ve birim başına maliyet eklemez.'

