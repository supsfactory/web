hero:
  tagline: 'Uyumluluk Rehberi'
  title: 'Pazara Göre SUP Uyumluluğu'
  subtitle: 'Her hedef pazarın kendine özgü sertifikasyon, etiketleme ve belge gereksinimleri vardır. Bu rehber, şişirilebilir SUP boardlarının uyumluluk alanını başlıca pazarlar — AB, Kuzey Amerika, Avustralya ve ötesi — boyunca haritalar; böylece teklif aşamasında, üretimden sonra değil, doğru kapsamı baştan belirleyebilirsiniz.'

answer:
  label: 'Hızlı cevap'
  text: 'AB için: Avrupa Ekonomik Alanında satılan boardlar için CE işaretlemesi zorunludur — AB pazarlarına yönelik modelleri sertifikalandırıyoruz, kapsam proje bazında doğrulanır. ABD için: CPSIA ve eyalet düzeyindeki VOC mevzuatı geçerlidir. Avustralya için: AS/NZS 1586 uyumluluğu. Tüm pazarlar için: ISO 9001 (fabrika), BSCI (sosyal denetim), REACH ve RoHS (malzemeler) üretimimizde hedef pazardan bağımsız olarak standarttır. Uyumluluk kapsamı ve maliyetleri teklifinizde kalem kalem yer alır — üretim sonrası sürprizler olmaz.'
  verified: 'Eylül 2026'

