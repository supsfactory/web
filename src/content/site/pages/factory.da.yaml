qc_section:
  tagline: Kvalitetskontrol
  title: Test- og kvalitetssikringsproces
  subtitle: Hvert bræt gennemgår obligatorisk test før afsendelse. Vores kvalitetslaboratorium drives uafhængigt af produktionen og rapporterer direkte til ledelsen.
  steps:
    - step: '1'
      title: Kontrol af råmateriale
      desc: 'PVC, Hypalon og drop-stitch-dug gennemgår trækprøvning (), rivetekst og UV-modstandskontrol, før noget parti går i produktion.'
    - step: '2'
      title: 24 timers luftholdningsprøvning
      desc: 'Hvert kammer pumpes op til 18.0 PSI og holdes i 24 timer. Et trykfald på over 0.50 PSI udløser automatisk kassering og ny inspektion af sømmene.'
    - step: '3'
      title: Belastnings- og balancetest
      desc: 'Færdige brætter pumpes op til nominelt tryk og kontrolleres for symmetrisk hævelse, stivhed ved 15 PSI og stabilitet under belastning. Hvert bræt vådtestes i vores testbassin før slutinspektionen.'
oem_section:
  tagline: OEM-projekter
  title: Cases for brand- og OEM-samarbejder
  subtitle: Fra ide til produktion — sådan hjælper vi globale brands med at lancere og skalere deres oppustelige SUP-linjer.
  cases:
    - challenge: Europæisk outdoor-forretning havde brug for en private-label SUP-linje med unik dækgrafik, miljøvenligt PVC og detailklar emballage — alt leveret på 60 dage.
      solution: Udviklede egne digitale trykfiler, sourcede REACH-overholdende PVC og pressede prøvetræk fra 3 runder ned til 1 ved at placere designteamet på vores fabrik i Qingdao.
      result: 25–35 dages produktion fra underskrevet PO, med første levering inden for detailhandlerens 60-dages tidsfrist. 2,400 enheder på tværs af 4 SKU’er. Gentbestilling blev afgivet, før den første batch var fuldt leveret.
      disclaimer: 'Anonymiseret projektresume — projekttype og omfang er repræsentative; konkrete resultater kan ikke verificeres uafhængigt.'
    - challenge: Amerikansk vandsportsstartup havde brug for et højtydende drop-stitch-SUP med specialform, fælles branding på emballage og BSCI-certificering til salg i detailhandlen.
      solution: Tilpassede en eksisterende SUP-form med ændret kontur, udviklede artwork til fælles branding og leverede fuld BSCI-auditdokumentation.
      result: Blev succesfuldt placeret i ledende amerikanske outdoor-forretninger og skabte stærkt momentum med over 5,000 solgte enheder i år 1 og en udsolgningsrate på 98%.
      disclaimer: 'Anonymiseret projektresume — projekttype og omfang er repræsentative; konkrete resultater kan ikke verificeres uafhængigt.'
    - challenge: Australsk distributør krævede et CE-certificeret SUP-sortiment med specialfarver og overholdelse af australske standarder.
      solution: Fremstillede prøveproduktion i 4 farvevarianter og koordinerede tredjeparts-overholdelsestest.
      result: 'SUP-sortiment på 3 modeller lanceret på AU/NZ-markedet. Efterfulgt af en vinder af offentligt udbud på 12 patrulje-SUP.'
      disclaimer: 'Anonymiseret projektresume — projekttype og omfang er repræsentative; konkrete resultater kan ikke verificeres uafhængigt.'
faq_section:
  tagline: FAQ
  title: Ofte stillede spørgsmål om B2B og OEM
  questions:
    - q: Hvad er minimumsordremængden (MOQ) for OEM-oppustelige SUP-brætter?
      a: 'MOQ bestemmes ud fra projektkonfigurationen frem for et fast tal — skrog og værktøj, farvevarianter og PVC, artwork, emballage og tilbehør. Standard serieproduktion kører 90–100+ enheder pr. batch ud fra en fuld 150 m drop-stitch-rulle, småserier med fælles branding starter ved 5–10 enheder, og ethvert projekt gennemgår prøvefasen (1–2 enheder) og pilotfasen (20–50 enheder). Se vores guide om MOQ og fleksibel branding for hele beregningslogikken.'
    - q: Har Vatrad BSCI-certificering?
      a: 'Ja. Vores fabrik har en gyldig BSCI-certificering for social ansvarlighed (auditrapport på forespørgsel). Vi har også ISO 9001 for kvalitetsstyring. CE-certificering gælder modeller til EU-markeder; omfanget bekræftes pr. projekt. Dokumentation for REACH- og RoHS-overholdelse leveres med hver OEM-ordre.'
    - q: Hvad er den typiske leveringstid for en OEM-ordre?
      a: 'Standardleveringstiden er 25–35 dage fra bekræftet PO og depositum til serie-OEM-produktion. Udvikling af specialform tilføjer 15–20 dage til værktøjet. Ekspederet produktion er mulig ved hastesager og sæsonpres. Prototypesprøver er typisk klar inden for 7–12 dage.'
    - q: Tager I jer af eksportdokumentationen?
      a: 'Ja. Vores team håndterer eksportdokumentation og toldbehandling in-house, og vi leverer til 50+ lande på tværs af EU, USA, AU og Asien.'
b2b_moq: 'MOQ bestemmes ud fra projektkonfigurationen: prøve 1–2, pilot 20–50, volumen 90–100+ (pr. 150 m rulle); småserier med fælles branding fra 5–10 enheder.'
production_flow:
  tagline: Produktionsforløb
  title: Fra materiale til færdigt bræt
  subtitle: Hvert bræt gennemgår 6 produktionstrin med QC-kontrolpunkter i hvert step. Ingen genveje, ingen overskippede inspektioner.
  stages:
    - stage: '01'
      title: 'Modtagelse af materialer & indgående QC'
      description: 'Alle indgående materialer registreres med batch-/lotnummer i vores ERP-system. PVC-dugsruller, drop-stitch-kerner, ventiler, lim og beslag karantænes, indtil QC har godkendt dem.'
      qc_check: 'Trækstyrke (ASTM D751), rivemodstand (ISO 4674), tykkelsesmåling, limviskositet, visuel fejlscanning'
      qc_threshold: '100 % af partierne testes. Kasser hvis trækstyrke < 90 % af spec, revne < min. spec, eller ved enhver visuel fejl'
      responsibility: Indgående QC-team (3 inspektører)
    - stage: '02'
      title: 'CNC-skæring & materialeforberedelse'
      description: 'Computeroptimeret nesting placerer paneler på PVC-ravet for at minimere spild. Automatiske CNC-skæremaskiner holder en positionsnøjagtighed på 0.1 mm.'
      qc_check: 'Målekontrol mod CAD-DXF-filer, kantkvalitetsinspektion, optælling af paneler'
      qc_threshold: 'Hver 20. måles. Tolerance ±0.5 mm. Kasser batchen, hvis >2 % er uden for tolerancen'
      responsibility: Leder af skæreværkstedet
    - stage: '03'
      title: 'Svejsning & binding af drop-stitch-kerner'
      description: 'Drop-stitch-kerner bindes til de ydre PVC-laminater ved varmelamination. Kammer RF-svejses eller varmluftssvejses. Kantbånd er trelags-fusionsbundne.'
      qc_check: 'Skråningsprøvning hver 50. enhed (ASTM D751), måling af søjlebredde, gennemgang af varmluftstemperaturlog, visuel søminspektion i gennemlysning'
      qc_threshold: 'Min. skråningsstyrke 8 N/cm. Tolerance for søjlebredde ±1 mm. Enhver synlig kanalisering = kasser'
      responsibility: 'Svejse-QC (2 inspektører pr. skift)'
    - stage: '04'
      title: 'Samling & rigging'
      description: 'Brætterne går videre til endelig samling, hvor alle komponenter mødes: dæk- og skrogpaneler fusioneres, ventiler monteres, og D-ringe, håndtag, finnekasser og bæretaske tilpasses. Hver enhed følger en montagecheckliste med 100 punkter.'
      qc_check: 'Sign-off på tjekliste med 100 punkter pr. enhed, ventilfunktionstest (10 åbne/lukke-cyklusser), momentkontrol af beslag, visuel inspektion'
      qc_threshold: 'Nuldefektpolitik på sikkerhedskritiske dele (ventiler, D-ringe, håndtag). Mindre kosmetiske fejl: AQL 2.5 (ISO 2859)'
      responsibility: Leder af samlingsteam + linje-QC
    - stage: '05'
      title: 'Trykprøvning & kvalitetshold'
      description: 'Hvert kammer pumpes op til 18.0 PSI (til et 12–15 PSI-rangeret SUP) og holdes i 24 timer. Tryksensorer logger kontinuerligt. Kamre, der overskrider et trykfald på 0.50 PSI, kasseres og sendes til ny inspektion af sømmene.'
      qc_check: 'Log for 24 timers trykholdning, sensorkalibrering kontrolleret dagligt, temperaturkompenseret trykaflæsning, ny sømtest efter reparation'
      qc_threshold: 'Maks. 0.50 PSI trykfald over 24 timer ved stabil temperatur. Ethvert kammer, der overskrider dette = 100 % gentest af hele produktionsbatchen'
      responsibility: 'Kvalitetslaboratorium (uafhængigt af produktionen, rapporterer til ledelsen)'
    - stage: '06'
      title: 'Slutinspektion & pakning'
      description: 'Slutvisuel og funktionel inspektion. Overfladefejl, farvekonsistens, kontrol af etiket/BIN, emballageintegritet og tilbehørskomplethed. Enhederne vakuumpakkes, sættes i kasser og paletteres til containerindlæsning.'
      qc_check: 'Fuld visuel inspektion, tilbehørstjekliste pr. SKU, drop-test af emballage (1 m, tilfældigt udvalg), kontrolscanning af etiket/stregkode'
      qc_threshold: 'AQL 2.5 for større fejl, AQL 4.0 for mindre. Nultolerance for sikkerhedsfejl. 100 % af enhederne inspiceres visuelt'
      responsibility: 'Slut-QC-team (4 inspektører) + leder af pakketeam'
