workshops_section:
  tagline: Værksteder
  title: Produktionsværksteder
  workshops:
    - title: 'PVC-skæring & materialeforberedelse'
      description: 'Automatiske CNC-skæremaskiner bearbejder PVC, Hypalon og drop-stitch-dug med millimeternøjagtighed. Computeroptimeret nesting minimerer materialespild og sikrer, at hvert panel overholder sin målespecifikation, før det svejses.'
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: CNC-PVC-skæremaskine, der klargør paneler i oppusteligt SUP-dug på fabrikken i Qingdao
    - title: 'Svejsning af kamre & varmeforsegling'
      description: 'Dedikeret svejsehal med varmluftsforseglingsmaskiner og RF-dielektriske presser. Varmluftsforsegler binder og smelter PVC-kammer, mens RF-svejsninger producerer stærke, lufttætte sømme, der overgår kravene.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: RF-svejsemaskine, der forsegler kamre i oppustelige både på fabrikken i Qingdao
    - title: 'Binding af drop-stitch-kerner'
      description: 'Drop-stitch-kerner til SUP-brætter bindes til de ydre PVC-laminater ved varmelamination. Tusindvis af indvendige polyestertråde forbinder over- og underlaget og skaber en stiv konstruktion ved 12-15 PSI. Kantbånd er trelags-fusionsbundne for at give styrke i kanten.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Produktionslinje for oppustelige SUP med udstyr til binding af drop-stitch-kerner på fabrikken i Qingdao
    - title: 'Trykning & dekoration af SUP'
      description: 'SUP-brætter dekoreres med digital trykning til fuldfarvegrafik og silketrykning til logoer og gentagne mønstre. Digitale printere giver dækdesign i fotokvalitet, mens silketrykning leverer holdbare, farverige brandmærker.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Interiør fra produktionsafdelingen i fabrikken for oppustelige SUP i Qingdao
    - title: 'Endelig samling & montering'
      description: 'Samlebane, hvor ventiler, D-ringe, håndtag, finnekasser og dækpuder monteres på hvert SUP-bræt. Hvert bræt følger en montagecheckliste med 100 punkter, der signeres af holdlederen.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Produktionsafdeling med montagearbejdspladser på fabrikken i Qingdao
    - title: 'Kvalitetstest & inspektion'
      description: 'Hvert færdigt bræt gennemgår obligatorisk luftholdningsprøvning, verifikation af sømmenes skråningsstyrke og en fuld systemkontrol før afsendelse. Vores kvalitetslaboratorium drives uafhængigt af produktionen og rapporterer direkte til ledelsen.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Trykprøvning af oppusteligt SUP for luftholdning før afsendelse på fabrikken i Qingdao
