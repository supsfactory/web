  system: 'Custom ERP (Qingdao Vatrad Groups interne system) + fysiske batchmærkater på hver arbejdsordre'
  coverage: 100 % af produktionsmaterialerne — PVC, Hypalon, drop-stitch-dug, lim, ventiler, beslag, emballage
  records_retained: 10 år (i henhold til CE 2013/53/EU-kravet)
  suppliers:
