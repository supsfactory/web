hero:
  tagline: Fabrik
  title: Fabrik & produktion
  subtitle: 12,500 m2 SUP-fabrik i Qingdao, Kina — specialproduktion af oppustelige SUP fra rå PVC-materiale til færdigt paddleboard
answer:
  label: 'Det korte svar'
  text: 'Certificeret fabrik for oppustelige SUP i Qingdao, Kina: ISO 9001, ISO 25649, BSCI, CE, REACH og RoHS. 12,500 m² anlæg fordelt på 4 specialiserede værksteder, 350+ ansatte, 120,000+ brætter produceret om året (10,000 brætter pr. måned på 4 automatiserede linjer). Alle brætter trykprøves ved 18.0 PSI i 24 timer, består en montagecheckliste med 100 punkter og har 10 års materialesporbarhed.'
  verified: 'September 2026'
intro:
  - 'Som produktionsafdeling i **Qingdao Vatrad Group Co., Ltd.** kontrollerer Vatrad hvert eneste trin i produktionen af oppustelige SUP — fra ankomsten af rå PVC-materialer til den sidste inspektion af det færdige paddleboard før levering. Vores produktionsanlæg i Qingdao Economic Development Zone dækker 12,500 kvadratmeter og huser dedikerede værksteder til PVC-skæring, binding af drop-stitch-kerner, digital trykning af SUP, endelig samling og kvalitetstest.'
  - 'Når design, konstruktion, prototyping, produktion og test er samlet under samme tag, fjerner vi ineffektiviteten i kontraktfremstilling og bevarer direkte kontrol over byggekvalitet, materialevalg og leveringsplaner. Hvert SUP, der forlader vores værksted, er bygget af vores egne folk, på vores eget udstyr og efter vores egne standarder.'
