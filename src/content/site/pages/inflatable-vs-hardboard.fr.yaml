faqs:
  - question: 'Lequel est le plus durable : le SUP gonflable ou rigide ?'
    answer: 'Les SUP gonflables sont généralement plus durables car ils résistent aux impacts, fissures et dommages de choc qui endommageraient définitivement une planche rigide.'
  - question: Un SUP gonflable est-il meilleur pour les débutants ?
    answer: 'Oui. Les SUP gonflables sont recommandés aux débutants car ils sont plus indulgents, plus faciles à transporter et moins susceptibles de causer des blessures lors des chutes.'
  - question: Les SUP gonflables peuvent-ils performer aussi bien que les planches rigides ?
    answer: 'Pour la pagaie récréative et la randonnée, les SUP gonflables égalent la performance des planches rigides. Les planches rigides excellent toujours en course et en surf avancé grâce à leur poids plus léger et leur flexion affinée.'
body: |
  <h2>Différences fondamentales</h2>
  <p>Les SUP gonflables (iSUP) et les planches rigides servent le même but fondamental —se tenir debout et pagayer sur l''eau —mais ils l''atteignent par des méthodes de construction complètement différentes. Le bon choix dépend de la façon dont vous prévoyez utiliser la planche.</p>

  <table>
    <tr><th>Facteur</th><th>SUP gonflable</th><th>SUP rigide</th></tr>
    <tr><td>Construction</td><td>Drop-stitch PVC, gonflé à 12-15 PSI</td><td>Noyau de mousse EPS enveloppé de fibre de verre ou d''époxy</td></tr>
    <tr><td>Poids</td><td>18-28 lbs (planche seule)</td><td>20-30 lbs (planche seule)</td></tr>
    <tr><td>Taille repliée</td><td>Sac à dos (30 x 15 x 10 po)</td><td>Pleine longueur (10-14 ft)</td></tr>
    <tr><td>Montage</td><td>3-5 minutes de gonflage</td><td>Prêt à l''emploi</td></tr>
    <tr><td>Durée de vie</td><td>5-10 ans avec entretien</td><td>3-8 ans (sujette aux impacts)</td></tr>
  </table>

  <h2>Portabilité</h2>
  <p><strong>Le gonflable gagne.</strong> C''est l''avantage le plus net. Un SUP gonflable se replie dans un sac à dos qui tient dans le coffre d''une voiture, un placard d''appartement ou un compartiment à bagages d''avion. Les voyageurs, les habitants d''appartements et quiconque sans espace de rangement sur le toit trouveront les SUP gonflables bien plus pratiques.</p>
  <p>Les planches rigides exigent une galerie de toit, un grand véhicule ou un espace de rangement dédié. Elles sont difficiles à transporter et ne peuvent pas être prises en avion sans caisses d''expédition spécialisées.</p>

  <h2>Durabilité</h2>
  <p><strong>Le gonflable gagne.</strong> Les SUP gonflables sont fabriqués en PVC de qualité militaire qui résiste aux impacts, perforations et dommages UV. Quand vous laissez tomber une planche gonflable ou heurtez un rocher, elle rebondit. Une planche rigide s''ébrécherait, se fissurerait ou se délaminerait sous le même impact.</p>
  <p>Les planches rigides sont plus sensibles à l''usure quotidienne. Une seule chute sur du béton peut causer un impact permanent qui affecte la performance et l''infiltration d''eau.</p>

  <h2>Performance</h2>
  <p><strong>La planche rigide gagne au haut de gamme.</strong> Pour la pagaie récréative et la randonnée à vitesses modérées, les deux types de planches performent de manière similaire. Les planches rigides ont l''avantage dans :</p>
  <ul>
    <li><strong>Vitesse</strong> —Les planches rigides sont plus légères et plus rigides, se traduisant par une meilleure glisse et une vitesse de pointe plus élevée</li>
    <li><strong>Surf</strong> —Les planches rigides offrent des transitions rail-à-rail plus réactives et une meilleure performance de vague</li>
    <li><strong>Course</strong> —La course de compétition utilise presque exclusivement des planches rigides pour leurs avantages de poids et de rigidité</li>
  </ul>
  <p>Pour le pagayeur récréatif moyen, ces différences de performance sont marginales. La plupart des pagayeurs ne surpasseront pas une planche gonflable de qualité.</p>

  <h2>Convivialité débutants</h2>
  <p><strong>Le gonflable gagne.</strong> Les SUP gonflables sont plus faciles pour les débutants car :</p>
  <ul>
    <li>La surface de pont plus douce est plus confortable et moins susceptible de causer des blessures lors des chutes</li>
    <li>Les planches gonflables plus larges et plus épaisses offrent plus de stabilité primaire</li>
    <li>Un coût d''investissement plus bas rend l''entrée plus accessible</li>
    <li>Le transport facile signifie plus d''occasions de pagayer</li>
  </ul>

  <h2>Stockage et entretien</h2>
  <p>Les SUP gonflables exigent séchage et pliage correct avant stockage. Les planches rigides peuvent être stockées assemblées mais ont besoin de protection contre le soleil, la chaleur et les impacts. Les deux bénéficient d''un rinçage à l''eau douce après usage en eau salée.</p>

  <h2>Recommandation</h2>
  <p><strong>Choisissez un SUP gonflable si :</strong> Vous voyagez, avez un stockage limité, pagayez en récréatif ou êtes débutant. 90 % des pagayeurs seront parfaitement servis par une planche gonflable de qualité.</p>
  <p><strong>Choisissez une planche rigide si :</strong> Vous courez en compétition, surfez des vagues avancées ou priorisez la performance maximale sur la portabilité et la durabilité.</p>

  <h2>FAQ</h2>
  <h3>Lequel est le plus durable : le SUP gonflable ou rigide ?</h3>
  <p>Les SUP gonflables sont généralement plus durables car ils résistent aux impacts, fissures et dommages de choc qui endommageraient définitivement une planche rigide.</p>

  <h3>Un SUP gonflable est-il meilleur pour les débutants ?</h3>
  <p>Oui. Les SUP gonflables sont recommandés aux débutants car ils sont plus indulgents, plus faciles à transporter et moins susceptibles de causer des blessures lors des chutes.</p>

  <h3>Les SUP gonflables peuvent-ils performer aussi bien que les planches rigides ?</h3>
  <p>Pour la pagaie récréative et la randonnée, les SUP gonflables égalent la performance des planches rigides. Les planches rigides excellent toujours en course et en surf avancé grâce à leur poids plus léger et leur flexion affinée.</p>

