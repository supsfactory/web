hero:
  tagline: Produkcja OEM
  title: 'Produkcja SUP OEM na zamówienie — Twoja specyfikacja, nasza fabryka'
  subtitle: 'Ty dostarczasz projekt, rysunek lub sprawdzoną platformę — my wytwarzamy ją w skali kontenerowej. Przegląd inżynieryjny w ciągu jednego dnia roboczego, próbki w 7–12 dni, produkcja w 25–35 dni po potwierdzeniu zamówienia i zaliczce, wysyłka pod Twoją marką.'

answer:
  label: 'Wprost'
  text: 'Produkcja OEM przebiega według Twojej specyfikacji. MOQ potwierdzamy wg konfiguracji projektu, a nie jako sztywna liczba: standardowa produkcja seryjna to 90–100 szt. na partię z rolki tkaniny drop-stitch 150 m, serie pilotażowe startują od 20–50 szt. na gotowych platformach, a każdy projekt przechodzi etap próbki (1–2 szt.) przed wolumenem. Próbki wysyłamy w 7–12 dni; produkcja trwa 25–35 dni po potwierdzeniu zamówienia i zaliczki, plus 15–20 dni przy potrzebie wykonania nowych narzędzi.'
  verified: 'Wrzesień 2026'

features:
