      icon: 'tabler:file-check'
    - title: Adaptacja platformy
      description: 'Sprawdzone platformy produkcyjne można zaadaptować do Twoich zmian kształtu, specyfikacji krawędzi, rozmieszczenia zaworów i akcesoriów — bez pełnego opracowywania formy.'
      icon: 'tabler:arrows-diff'
    - title: Formy na zamówienie
      description: 'Nowe kształty desek z Twoich rysunków lub modeli CAD — własny projekt form i inżynieria. Wykonanie narzędzi dodaje 15–20 dni do czasu realizacji projektu.'
      icon: 'tabler:shapes'
    - title: Prototyp i próbka
      description: 'Przed każdą serią wolumenową wykonujemy fizyczną próbkę i przedmiotowo ją zatwierdzamy, zwykle w 7–12 dni, z testami na wózku dla nowych kształtów.'
      icon: 'tabler:tools'
    - title: Produkcja w skali kontenerowej
      description: 'Standardowe partie seryjne 90–100 szt. na projekt (jedna pełna rolka tkaniny 150 m), serie pilotażowe od 20–50 szt., czas realizacji 25–35 dni po potwierdzeniu zamówienia.'
      icon: 'tabler:package'
    - title: Zgodność CE i rynkowa
      description: 'Dokumentacja zgodności CE dostępna dla konfiguracji objętych rynek UE — zakres potwierdzany dla każdego projektu. Dokumentację ISO 9001, BSCI, REACH i RoHS przygotowujemy dla każdego rynku, na który wysyłasz.'
      icon: 'tabler:certificate'
    - title: Inspekcja i identyfikowalność
      description: 'Próba ciśnieniowa 18.0 PSI przez 24 godziny z automatycznym odrzuceniem przy spadku powyżej 0.50 PSI, lista kontrolna montażu w 100 punktach i 10-letnia identyfikowalność partii w ERP.'
      icon: 'tabler:shield-check'
    - title: Globalna logistyka
      description: 'FOB Qingdao, CIF i DDP do ponad 50 krajów, z opakowaniem eksportowym i odprawą celną obsłużonymi przez nasz zespół logistyczny.'
      icon: 'tabler:world'

customization:
  tagline: Zbudowane według Twojej specyfikacji
  title: Punkty specyfikacji w projekcie OEM
  subtitle: 'To są punkty specyfikacji, które kontrolujesz w projekcie OEM — Twój dokument specyfikacji jest umową produkcyjną:'
  items:
    - 'Wymiary deski — długość, szerokość, grubość, rocker i objętość zgodnie z Twoimi rysunkami lub docelowymi pływakami'
    - 'Konstrukcja materiałowa — liczba warstw i gatunek PCV, gęstość drop-stitch, wzmocnienia i wstawki krawędziowe'
    - 'Grafika i kolory — Twój projekt graficzny w nieograniczonej liczbie palet albo wsparcie naszego wewnętrznego zespołu projektowego'
    - 'Nakładka antypoślizgowa EVA — pokłady wycinane na wymiar, logotypy i kolory pokładu na każdej desce'
    - 'Uchwyty i oczka D-ring — rozmieszczenie, liczba i specyfikacja osprzętu pod Twoje zastosowanie'
    - 'Systemy płetw — konfiguracje jednopłetwowe, dwupłetwowe lub trójpłetwowe oraz gniazda płetw wg Twojej specyfikacji'
    - 'Wiosła, pompy, smycze i akcesoria — Twój zestaw, Twój branding'
    - 'Opakowanie i prezentacja detaliczna — pudełka detaliczne, opakowanie eksportowe na długą podróż morską i ekspozytory POS pod Twoją marką'
    - 'Etykiety i znaki zgodności — etykiety seryjne, logotypy i dokumentacja dla danego rynku przygotowana dla Twojego regionu eksportu'

faq_section:
  tagline: FAQ
  title: Pytania o produkcję OEM
  questions:
    - q: Jak rozpocząć projekt OEM z własnym projektem?
      a: 'Wyślij rysunki, deskę wzorcową lub pisemną specyfikację. Nasz przegląd inżynieryjny potwierdza możliwość wykonania i zwraca wycenę w ciągu jednego dnia roboczego — to nasze standardowe zobowiązanie, a w razie potrzeby NDA podpisujemy przed jakąkolwiek wymianą plików.'
    - q: Jakie jest MOQ dla nadmuchiwanych SUP w modelu OEM?
      a: 'MOQ potwierdzamy wg konfiguracji projektu — kadłub i narzędzia, kolorystyka i PCV, projekt graficzny, opakowanie i akcesoria. Standardowa produkcja seryjna to 90–100 szt. na partię (jedna rolka drop-stitch 150 m), a serie pilotażowe startują od 20–50 szt. na gotowych platformach. Pełną logikę obliczeń znajdziesz w naszym Przewodniku MOQ i elastycznego brandingu.'
    - q: Jaki jest typowy czas realizacji zamówienia OEM?
      a: 'Produkcja trwa 25–35 dni od potwierdzenia zamówienia i zaliczki. Opracowanie formy na zamówienie dodaje 15–20 dni na narzędzia. Próbki prototypowe wysyłamy zwykle w 7–12 dni.'
    - q: Czy możecie produkować wyłącznie na podstawie moich rysunków?
      a: 'Tak. OEM realizuje produkcję dokładnie według Twojej specyfikacji — projekt należy do Ciebie. Nasi inżynierzy sprawdzają rysunki pod kątem możliwości produkcji i wskazują każdą kolizję specyfikacji przed rozpoczęciem narzędzi lub cięcia, a zatwierdzona próbka staje się wzorcem produkcyjnym.'
    - q: Czy dostarczacie próbki przed produkcją?
      a: 'Tak. Przed każdą serią produkcyjną wykonujemy fizyczną próbkę i przedmiotowo ją zatwierdzamy, zwykle w 7–12 dni, i jest ona wzorcem dla wszystkich późniejszych kontroli QC.'
    - q: Jakie certyfikaty posiada fabryka?
      a: 'ISO 9001:2015 zarządzanie jakością (cały zakład), zgodność społeczna BSCI (audyt zakładu amfori), dokumentacja zgodności CE dla właściwych konfiguracji na rynek UE (zakres potwierdzany dla każdego projektu), REACH (materiały) i RoHS (akcesoria elektroniczne). Pełną dokumentację zgodności dostarczamy z każdą wysyłką OEM, przygotowaną pod Twoje rynki docelowe.'
    - q: Jak kontrolowana jest jakość w serii OEM?
      a: 'Produkcja przebiega pod wielopunktową kontrolą QC — materiał przychodzący, kontrola w toku i inspekcja końcowa — z próbą ciśnieniową 18.0 PSI przez 24 godziny (automatyczne odrzucenie przy spadku powyżej 0.50 PSI), listą kontrolną montażu w 100 punktach i 10-letnią identyfikowalnością partii w ERP według numeru seryjnego.'
    - q: Jakie są warunki wysyłki?
      a: 'FOB Qingdao, CIF do głównych portów na świecie lub DDP dla kwalifikowanych partnerów. Wysyłamy do ponad 50 krajów na rynki UE, USA, AU i Azji.'

process:
  title: Proces OEM — od specyfikacji do załadowanego kontenera
  subtitle: 'Siedem kontrolowanych etapów prowadzonych przez jeden zespół fabryczny, dzięki czemu każdy krok od pierwszej specyfikacji po zapakowany kontener pozostaje udokumentowany i zgodny z terminem.'
  steps:
    - phase: '01'
      title: Przegląd specyfikacji i wycena
      period: 1 dzień roboczy
      items:
        - 'Udostępnij rysunki, specyfikację lub deski wzorcowe — nasi inżynierzy sprawdzają możliwość wykonania.'
        - 'Otrzymujesz szczegółową wycenę i plan projektu w ciągu jednego dnia roboczego.'
    - phase: '02'
      title: Potwierdzenie inżynieryjne
      period: Tydzień 1
      items:
        - 'Wymiary kadłuba, gatunek drop-stitch, specyfikacje PCV i konstrukcja krawędzi są potwierdzane względem Twojego dokumentu.'
        - 'Decyzje dotyczące formy lub platformy są zamykane — w razie potrzeby tutaj rozpoczyna się wykonanie formy na zamówienie.'
    - phase: '03'
      title: Prototyp i próbka
      period: 7–12 dni
      items:
        - 'Wykonujemy fizyczną próbkę i wysyłamy ją do Twojego przeglądu — z testami na wózku dla nowych kształtów.'
        - 'Próbka (1–2 szt.) potwierdza Twoją specyfikację przed jakimkolwiek zobowiązaniem wolumenowym.'
    - phase: '04'
      title: Badania i walidacja
      period: Równolegle
      items:
        - 'Kontrole retencji powietrza, utrzymania ciśnienia, wytrzymałości szwów, obciążenia i UV dla każdej linii produkcyjnej.'
        - 'Dokumentacja CE, ISO 9001, BSCI, REACH i RoHS przygotowana dla Twoich rynków eksportu.'
    - phase: '05'
      title: Zatwierdzenie i potwierdzenie
      period: Po akceptacji próbki
      items:
        - 'Zatwierdzasz próbkę i projekt graficzny; zamówienie i zaliczka blokują termin produkcyjny.'
        - 'Plan przedprodukcyjny potwierdza daty, ilości, opakowanie i port załadunku.'
    - phase: '06'
      title: Produkcja
      period: 25–35 dni
      items:
        - 'Produkcja przebiega pod wielopunktową kontrolą QC — materiał przychodzący, kontrola w toku i inspekcja końcowa.'
        - 'Od zamówień pilotażowych (20–50 szt.) na gotowych platformach po pełne partie z rolki 150 m (90–100+ szt.) dla standardowej produkcji seryjnej.'
    - phase: '07'
      title: Pakowanie i wysyłka
      period: 1 dzień + transport
      items:
        - 'Opakowanie eksportowe z etykietami seryjnymi modelu, następnie FOB Qingdao, CIF lub DDP do ponad 50 krajów.'
        - 'Dokumentacja celna, śledzenie przesyłki i wsparcie przy zamówieniach powtarzalnych w każdym etapie.'

