hero:
  tagline: Développement ODM
  title: 'Développement SUP ODM — de votre idée à une planche prête pour le marché'
  subtitle: 'Pas encore de dessins ? Nos ingénieurs internes conçoivent la coque, la structure, les graphismes et l''emballage autour de votre brief — puis la construisent, la testent et la produisent en masse. Prototypes en 7–12 jours, production en 25–35 jours après bon de commande confirmé.'

answer:
  label: 'Réponse directe'
  text: 'Le développement ODM part de votre brief, pas de vos dessins : la conception de la coque (longueur, largeur, rocker, volume), la structure des matériaux et les graphismes sont conçus en interne, validés par des prototypes en 7–12 jours, et produits au MOQ de volume standard de 90–100 unités par lot de rouleau de 150 m (pilote dès 20–50 unités). La production s''exécute en 25–35 jours après bon de commande confirmé et acompte ; l''outillage de moule personnalisé ajoute 15–20 jours. La documentation CE, ISO 9001, BSCI, REACH et RoHS part avec chaque commande.'
  verified: '2026-08'

