why_australia:
  tagline: 'Pourquoi les acheteurs en Australie'
  title: 'Conçu pour le marché australien'
  subtitle: 'Pour les marques australiennes, le calendrier compte : passez commande au premier semestre pour que les conteneurs soient dédouanés avant l''été.'
  items:
    - title: 'Planification prioritaire à la saison'
      description: 'L''été australien s''étend de décembre à février. Une production de 25–35 jours plus 4–6 semaines de fret signifie qu''une commande au T1–T2 met le stock en rayon avant les pics.'
    - title: 'DDP pour un coût rendu prévisible'
      description: 'Le DDP inclut le dédouanement, les droits, les taxes et la livraison à votre entrepôt — un prix total, porte-à-porte.'
    - title: 'FOB Qingdao avec votre propre transitaire'
      description: 'Importateur régulier ? Prenez le FOB Qingdao et utilisez votre propre partenaire logistique — nous chargeons et documentons le conteneur, vous contrôlez le reste.'
    - title: 'Une usine, un système qualité'
      description: 'Le développement, l''échantillonnage, la production et le contrôle qualité ont tous lieu dans l''usine de 12 500 m² — l''échantillon que vous approuvez est le produit que vous recevez.'

process_notes:
  tagline: 'Comment ça marche'
  title: 'De la spéc. au conteneur'
  subtitle: 'Les mêmes six étapes que vous achetiez deux conteneurs ou vingt par an : spécification, ingénierie, échantillonnage, tests, outillage, production — puis livraison FOB, CIF ou DDP.'
  items:
    - title: '1. Envoyez votre spéc.'
      description: 'Une planche de référence, un croquis ou une spécification concurrent suffisent. La revue d''ingénierie et un devis reviennent sous un jour ouvré.'
    - title: '2. Approuvez l''échantillon'
      description: 'Votre premier échantillon physique part en 7–12 jours avec une fiche d''approbation couvrant la construction, les couleurs d''impression et les résultats de test de pression.'
    - title: '3. Production & export'
      description: 'Les séries se terminent en 25–35 jours avec des points de contrôle QC en cours de processus. La liste de colisage, la facture et le connaissement partent avant le navire.'
    - title: '4. Livraison à votre entrepôt'
      description: '4–6 semaines de fret maritime vers Sydney, Melbourne ou Brisbane — en DDP, nous gérons le dédouanement et la livraison à votre porte.'

faq_section:
  tagline: FAQ
  title: 'Questions d''importation australienne'
  questions:
    - q: 'Combien de temps le fret maritime prend-il vers l''Australie ?'
      a: 'Prévoir 4–6 semaines du port de Qingdao vers Sydney, Melbourne ou Brisbane, selon les rotations. Les projets DDP incluent le calendrier complet porte-à-porte.'
    - q: 'Quand dois-je commander pour avoir du stock avant l''été ?'
      a: 'La production prend 25–35 jours et le fret 4–6 semaines, donc commandez environ 3–4 mois avant d''avoir besoin du stock. Pour la saison estivale de décembre–février, passez le bon de commande au premier semestre.'
    - q: 'Expédiez-vous en DDP vers l''Australie ?'
      a: 'Oui. Le DDP inclut le fret maritime, le dédouanement, les droits et taxes, et la livraison à votre entrepôt — un prix total prévisible. Le FOB Qingdao et le CIF sont également disponibles.'
    - q: 'Quel est le MOQ pour un import de SUP en marque privée ?'
      a: 'Le MOQ est confirmé par la configuration du projet : le développement d''échantillon couvre 1–2 pcs, les lots pilotes s''exécutent à 20–50 pcs sur les plateformes existantes, et la production standard en volume s''exécute à 90–100+ pcs par design à partir d''un rouleau complet de drop-stitch de 150 m.'
    - q: 'Quelle documentation fournissez-vous pour les importations ?'
      a: 'L''échantillon approuvé part avec la documentation CE et REACH préparée pour vos marchés cibles, et chaque conteneur part avec liste de colisage, facture et connaissement.'
    - q: 'Comment démarrer un projet depuis l''Australie ?'
      a: 'Envoyez une planche de référence, un croquis ou une spécification. La revue d''ingénierie et le devis reviennent sous un jour ouvré, et un NDA est signé avant tout échange de fichier.'

