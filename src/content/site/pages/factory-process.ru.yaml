answer:
  label: 'Прямой ответ'
  text: 'Доски проходят пять контролируемых этапов: контроль материалов (1–2 дня), автоматический раскрой на ЧПУ (отходы менее 5%, 2–4 часа на комплект), термосваривание трубок с усилением швов методом ВЧ-сварки (1–2 дня на доску), соединение сердцевины drop-stitch и финальная сборка с проверкой герметичности и нагрузки 100% перед упаковкой.'
  verified: 'Сентябрь 2026'

intro: В отличие от брендов, передающих производство сторонним заводам, Vatrad владеет и эксплуатирует всю производственную цепочку. Такая вертикальная интеграция позволяет нам поддерживать строгий контроль качества на каждом этапе, быстро реагировать на индивидуальные требования и обеспечивать стабильное качество изделия от партии к партии. Вот как изготавливается доска SUP на нашей площадке.

steps:
  - step: '01'
    title: Приёмка и контроль материалов
    description: Каждая входящая партия ткани PVC, стеклохолста, смолы и фурнитуры проверяется на соответствие спецификации. Образцы ткани испытываются на разрывное усилие, однородность толщины и устойчивость к УФ-излучению до выпуска в производство. Несоответствующие материалы помещаются на карантин и возвращаются.
    duration: 1–2 дня
  - step: '02'
    title: Автоматический раскрой PVC
    description: <p>Утверждённые ткани укладываются на автоматический раскройный станок с ЧПУ и режутся с точностью до долей миллиметра. Компьютерная оптимизация раскладки размещает панели с минимальным отходом — как правило, менее 5%. Раскроенные панели маркируются по модели SUP и камере, затем комплектуются в пачки для передачи в сварочный цех.</p>
    duration: 2–4 часа на комплект доски
  - step: '03'
    title: Термосваривание и сварка трубок
    description: Панели соединяются прихваткой и сплавлением на машинах термосваривания с термовоздушной сваркой при контролируемых температурах 200–300 °C. Основные швы усиливаются методом ВЧ-диэлектрической сварки для получения герметичных высокопрочных соединений. Готовые камеры накачиваются до 18.0 PSI для первичной проверки герметичности перед 24-часовой выдержкой давления.
    duration: 1–2 дня на доску SUP
  - step: '04'
    title: Соединение сердцевины Drop-Stitch
    description: Сердцевины drop-stitch досок SUP соединяются с наружными слоями PVC методом термоламинации. Тысячи внутренних полиэфирных нитей соединяют верхний и нижний слои, создавая жёсткую конструкцию при 12-15 PSI. Усилители борта соединяются в три слоя для прочности кромки.
    duration: 1–2 дня на доску
  - step: '05'
    title: Печать и нанесение изображений на SUP
    description: Графика на палубе досок SUP наносится цифровой печатью для полноцветных дизайнов фотографического качества и трафаретной печатью для стойких логотипов и повторяющихся рисунков. Отпечатки проходят отверждение и лакировку для устойчивости к УФ-излучению и износу.
    duration: 1–2 дня
  - step: '06'
    title: Финальная сборка и оснастка
    description: Клапаны, D-кольца, ручки, крепления для плавника и накладки на палубу устанавливаются на сборочной линии. Каждая доска проходит чек-лист сборки из 100 пунктов с обязательной подписью на каждом этапе.
    duration: 1–2 дня
  - step: '07'
    title: Испытания и контроль качества
    description: 'Каждая готовая доска проходит обязательные контрольные операции: испытание камеры на герметичность, проверку функционирования фурнитуры, контроль момента затяжки крепежа и осмотр внешнего вида. Индивидуальные и прототипные изделия дополнительно проходят испытания на воде на устойчивость и управляемость.'
    duration: 1–2 дня
  - step: '08'
    title: Упаковка и отгрузка
    description: Доски сдуваются, складываются согласно процедуре, упаковываются в прочные тканевые мешки или розничные короба и готовятся к отгрузке. Каждая упаковка маркируется моделью, серийным номером и пунктом назначения. Мы координируем перевозчиками перевозку полными (FCL) и сборными (LCL) контейнерами по всему миру.
    duration: 1 день

evidence_gates:
  tagline: Подтверждение контроля
  title: 'Каждый этап оставляет запись — фотографии и отчёты'
  subtitle: 'Ниже приведены реальные фотографии контроля и комплекты протоколов испытаний с наших семи контролируемых этапов контроля качества. Каждый PDF представляет собой настоящий двуязычный документ, который можно скачать и проверить, — те же записи, на которые опирается каждая партия в 10-летнем архиве прослеживаемости ERP. Полная схема из 7 этапов доступна на /ru/quality.'
  items:
    - title: 'PPM — планирование качества проекта'
      description: 'Совещание перед запуском производства фиксирует объём работ, эталонный образец и План контроля качества до старта линии. Нерезолвённые вопросы блокируют запуск производства.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Скачать QIP (PDF)'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: 'Совещание перед производством: проверка эталонного образца и плана контроля качества для заказа OEM SUP'
    - title: 'IQC — входной контроль материалов'
      description: 'Каждая входящая партия PVC, ткани и фурнитуры проверяется относительно утверждённой спецификации. Несоответствующие партии помещаются на карантин и отклоняются до выпуска на линию.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты IQC (PDF)'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Входной контроль ткани PVC и компонентов SUP на заводе
    - title: 'IPQC / FAI — контроль в процессе производства'
      description: 'Первое изделие сверяется с зафиксированными базовыми показателями, и каждая смена проводит обходные проверки на линии. Утверждение FAI фиксирует версию макетов, размеров и спецификации материалов.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты IPQC (PDF)'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Внутрипроизводственный контроль и проверка первого изделия при выпуске SUP
    - title: 'Накачивание и испытание на герметичность'
      description: '100% готовых досок, а не выборка, проходят 24-часовую выдержку давления при 18.0 PSI с автоматическим браком при падении более 0.50 PSI. По одному документу на камеру.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты по герметичности (PDF)'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Накачивание и испытание на герметичность надувной камеры SUP
    - title: 'FQC — финальный контроль продукции'
      description: 'Готовые доски измеряются относительно допусков по чертежу, а их внешний вид оценивается при дневном свете D65 относительно утверждённого эталонного образца.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты FQC (PDF)'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Финальный контроль готовых досок SUP перед упаковкой
    - title: 'PSI — упаковка и предотгрузочный контроль'
      description: 'Упакованный комплект проверяется на 100% соответствие спецификации материалов, утверждённой заказчиком, — сканирование штрихкодов (класс не ниже B), маркировка коробов и тест на падение ISTA-1A до погрузки.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Скачать отчёты PSI (PDF)'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Предотгрузочный контроль упакованного комплекта SUP по спецификации материалов
    - title: 'Выпуск отгрузки и прослеживаемость'
      description: 'Служба качества подписывает партию только тогда, когда закрыты все шесть предыдущих этапов. Серийные номера сопоставляются с партией, а досье передаётся вместе с отгрузкой.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Скачать отчёты о выпуске (PDF)'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Подписание разрешения на отгрузку и передача документов прослеживаемости партии
