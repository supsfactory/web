checklist:
  heading: 'Proje Brifinginizden Önce Hazır Olması Gerekenler'
  body: |
    Brifinginiz ne kadar eksiksiz olursa teklif de o kadar hızlı ve isabetli olur. Hazır bulundurmanız gerekenler şunlardır:

    - **Tahta spesifikasyonları** — Hedef uzunluk, genişlik, kalınlık, kullanıcı ağırlık aralığı ve amaçlanan kullanım (touring, all-around, surf, balıkçılık, yoga vb.). Referans tahta ölçüleri veya rakip bir modeliniz varsa bunları da ekleyin.
    - **Tasarım dosyaları** — Tahta grafikleri, EVA pad logosu ve her türlü ikincil markalama için vektör grafikler (AI, SVG veya PDF). Grafikler hazır değilse başlangıç uygulanabilirliği için bir mood board veya referans görseller yeterlidir.
    - **Sipariş hacmi ve zaman çizelgesi** — İlk sipariş için hedef miktarınız ve ulaşmanız gereken sezon programınız. Kabaca bir aralık bile ("Mart ayına kadar 20–50 tahta") uygulanabilirliği ve slot uygunluğunu teyit etmek için yeterlidir.
    - **Uyumluluk gereksinimleri** — Hedef pazarlar (AB, Kuzey Amerika, Avustralya vb.) ve standart kapsamımızın (CE, ISO 9001, BSCI, REACH, RoHS) ötesinde belirli sertifika veya test gereksinimleri.
    - **Bütçe aralığı** — Tahta başına yaklaşık bütçe veya hedef maliyet, doğru platform ve yapı kademesini önermemize yardımcı olur. Kesin fiyat mühendislik incelemesinden sonra teyit edilir — asla önceden değil.

    Tüm bunlara henüz sahip değilseniz, elinizdekini gönderin. Kalanını yönlendiririz.

evidence_review:
  tagline: 'Kanıt ve Doğrulama'
  title: 'SPESİFİKASYONLAR DOĞRULANDI'
  body: 'Bu sayfadaki tüm üretim iddiaları, Laixi, Qingdao fabrikamızdaki üretim mühendisliği ekibimiz tarafından doğrulanmıştır. Sertifikalar, kalite kontrol inceleme kayıtları, basınç ve yapısal test raporları ve parti izlenebilirliği kayıtları talep üzerine mevcuttur. Spesifikasyonlar en son Eylül 2026 tarihinde doğrulanmıştır.'

faqs:
  tagline: SSS
  title: 'OEM Katılımı — Sık Sorulan Sorular'
  items:
    - q: 'Eksiksiz katılım süreci ne kadar sürer?'
      a: 'Numune onayı genellikle 2–4 hafta sürer (7–12 günde numune üretimi ve sizin inceleme süreniz de dahil). İlk üretim, onaylanan sipariş ve depozitodan itibaren 6–8 hafta sürer. Özel gövde şekli 15–20 gün kalıp geliştirme süresi ekler. Her kapının önceden üzerinde anlaştığınız sabit bir zaman çizelgesi vardır.'
    - q: 'Tasarımımı paylaşmadan önce NDA imzalamam gerekiyor mu?'
      a: 'Bir NDA talep üzerine anında imzalanabilir — herhangi bir gizli teknik spesifikasyonu veya grafikleri paylaşmadan önce. Yalnızca müşterilerimizin markaları adına üretim yaparız ve hiçbir pazarda onlarla rekabet etmeyiz. Aynı politika tek tahtalık numune için de konteyner programı için de geçerlidir.'
    - q: 'İlk OEM üretimi için minimum sipariş nedir?'
      a: 'Giriş noktası kademelidir: önce 1–2 numune (7–12 günde hazır), ardından 20–50 tahtalık bir deneme veya pilot sipariş (25–35 günde üretim), sonra onaylanan konfigürasyon başına 90–100+ tahtalık standart hacimli üretimler. Geliştirme aşaması gerekmediğinde küçük partili ortak markalama 5–10 adetten başlar. Numune ücretleri üretim siparişinize mahsup edilir.'
    - q: 'Katılım sırasında fikri mülkiyet koruması nasıl ele alınıyor?'
      a: 'Tasarımlarınız ve spesifikasyonlarınız, herhangi bir gizli bilgi paylaşılmadan önce imzalanan NDA ile korunur. Tüm grafikler, BOM verileri ve teknik dosyalar erişimi denetim izleri olan sistemlerde saklanır. OEM modunda tüm fikri mülkiyet hakkı sizindir. ODM modunda uyarlanmış platformun fikri mülkiyet hakkı anlaşmaya bağlı olarak paylaşılır. Private Label modunda fikri mülkiyet iSupfactory şirketinde kalır ve siz marka uygulaması için lisans alırsınız.'
    - q: 'İlk sipariş için hangi kalite güvenceleri geçerlidir?'
      a: 'Numune, deneme veya hacim fark etmeksizin her tahta aynı 7 aşamalı inceleme kapı sisteminden geçer: gelen malzeme incelemesi, drop-stitch kumaş incelemesi, kaynak ve montaj, 24 saatlik basınç ve hava sızdırmazlık testi (18.0 PSI tutma, 0.50 PSI üzeri düşüşte otomatik ret), EVA pad ve aksesuar montajı, grafik ve markalama kalite kontrolü ve son ambalaj ile dokümantasyon. Kalite, küçük siparişler için asla düşürülmez.'

