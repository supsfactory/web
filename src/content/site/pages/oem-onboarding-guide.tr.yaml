answer:
  label: 'Doğrudan yanıt'
  text: 'Tipik bir OEM katılımı, numune onayı için 2–4 hafta ve onaylanan siparişten itibaren ilk üretim için 6–8 hafta sürer. Bir proje brifingi göndererek başlarsınız (tahta spesifikasyonları, hacim, uyumluluk gereksinimleri). Bir iş günü içinde yanıt verir, gizli ayrıntıları paylaşmadan önce bir NDA öneririz ve incelemeniz ve onayınız için 7–12 günde 1–2 fiziksel numune üretiriz. Numune dondurulduktan sonra üretim planlaması ve imalat, her aşamada sabit kalite kontrol kapılarıyla yürür. Her adım belgeli ve izlenebilirdir.'
  verified: 'Eylül 2026'

process_steps:
  tagline: Yedi Kapı
  title: 'Katılım Akışı — Brifingden Teslimata Yedi Kapı'
  subtitle: 'Her kapının tanımlı bir girdisi, tanımlı bir çıktısı ve önceden üzerinde anlaştığınız bir zaman çizelgesi vardır. Açık onay olmadan hiçbir kapıdan ilerlemezsiniz.'
  steps:
    - step: 'Kapı 1'
      title: 'İlk Talep ve NDA (Gün 0)'
      desc: 'Hedef tahta spesifikasyonlarınızı, sipariş hacminizi, uyumluluk gereksinimlerinizi ve zaman çizelgenizi /contact üzerinden bir proje brifingiyle gönderin. Bir NDA anında imzalanabilir — herhangi bir gizli teknik spesifikasyonu veya grafikleri paylaşmadan önce. Bir iş günü içinde yanıt verilir.'
    - step: 'Kapı 2'
      title: 'Uygulanabilirlik İncelemesi ve Teklif (Gün 1–5)'
      desc: 'Mühendislik, brifinginizi üretim kapasitesi, malzeme bulunabilirliği ve uyumluluk kapsamı açısından inceler. MOQ hesaplaması, numune ücretleri (üretime mahsup edilen) ve teslim süresi dilimleriyle kalem kalem teklif alırsınız — kaba bir aralık değil, kapı kapı bir takvim.'
    - step: 'Kapı 3'
      title: 'Numune Üretimi (Gün 6–17)'
      desc: 'Spesifikasyonunuza göre 1–2 fiziksel tahta üretilir: gövde rijitliği, EVA kayma pad dokusu, grafik doğruluğu, aksesuar uyumu. Başka hiçbir şeye taahhüt etmeden önce tahtayı kullanır ve değerlendirirsiniz. Numune ücretleri sözleşme onayıyla üretim siparişinize mahsup edilir.'
    - step: 'Kapı 4'
      title: 'Numune İncelemesi ve Onayı (Gün 18–21)'
      desc: 'Numuneyi spesifikasyonlarınıza göre değerlendirirsiniz — kullanım kalitesi, grafik sadakati, ambalaj, aksesuarlar. Yapılan düzenlemeler revize edilmiş BOM ve grafik onayında kayıt altına alınır. Dondurulan spesifikasyon, sonraki tüm üretimler için üretim referansı olur.'
    - step: 'Kapı 5'
      title: 'Üretim Öncesi Planlama (Gün 22–28)'
      desc: 'Malzeme tedariği, kalıp kurulumu, ambalaj teyidi ve üretim slotu ayrılması. Tüm malzemeler dondurulmuş BOM’a karşı giriş kontrolünden geçirilir. İmalat başlamadan önce kalite kontrol kapı tarihleriyle bir üretim takvimi yayımlanır.'
    - step: 'Kapı 6'
      title: 'Üretim ve Kalite Kontrol Kapıları (Gün 29–55)'
      desc: 'İmalat 7 aşamalı inceleme kapı sisteminden geçer: gelen malzeme incelemesi, drop-stitch kumaş incelemesi, kaynak ve montaj, basınç ve hava sızdırmazlık testi (18.0 PSI tutma, 0.50 PSI üzeri düşüşte otomatik ret), EVA pad ve aksesuar montajı, grafik ve markalama kalite kontrolü, son ambalaj ve dokümantasyon. Her kapının geçer / kalır kriterleri ve izlenebilirlik kayıtları vardır.'
    - step: 'Kapı 7'
      title: 'Sevkiyat ve Teslimat Sonrası Değerlendirme (Gün 56–63)'
      desc: 'İhracat kalitesinde ambalaj, uyumluluk dokümantasyonu (CE, ISO 9001, BSCI, REACH, RoHS) ve 50 üzeri ülkeye denizyolu taşıma koordinasyonu. Teslimat sonrası değerlendirme, öğrenilen dersleri ve sonraki sipariş döngüsü için iyileştirmeleri kayda geçirir.'

