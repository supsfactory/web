hero:
  tagline: ODM gyártás
  title: 'SUP ODM gyártó – terméktervezés és fejlesztés'
  subtitle: 'Nincs szükség kész SUP kivitelre. Induljon egy termékkonceptből, piaci igényből vagy teljesítménycélból – belső mérnökeink az Ön specifikációs lapjáról kiindulva tervezik meg a víztestet, a szerkezetet, a grafikát és a csomagolást, majd 7–12 nap alatt elkészítik a prototípust, és 25–35 nap alatt gyártják le a megerősített megrendelést.'

answer:
  label: 'Közvetlen válasz'
  text: 'Az iSupfactory a kínai Qingdaoban működő SUP ODM gyártó. Az ODM fejlesztés az Ön specifikációs lapjáról indul, nem az Ön rajzaiból: a víztest tervezése (hosszúság, szélesség, rocker, térfogat), az anyagszerkezet és a grafika belsőleg készül, 7–12 napos prototípusmintákkal validáljuk, és 90–100 darab szállítmányonként, 150 m-es tekercsenként standard térfogatú MOQ-val gyártjuk (pilóta 20–50 darabtól). A gyártás a megerősített megrendelés és előleg után 25–35 napot tart; az egyedi formázószerszámok további 15–20 napot adnak hozzá. A CE, ISO 9001, BSCI, REACH és RoHS dokumentációt minden megrendeléssel együtt adjuk fel.'
  verified: '2026. szeptember'

features:
  title: ODM képességek
  subtitle: 'Minden, amit akkor kap, amikor a tervezőmunka a gyárban, nem pedig az Ön irodájában zajlik.'
  items:
    - title: A víztest tervezése
      description: 'A célzott sportolókhoz, felhasználási esetekhez és piacokhoz mérnökölt hosszúság, szélesség, vastagság, rocker és térfogat – egy üres lapon vagy validált platformkönyvtárunkból kiindulva.'
      icon: 'tabler:waves'
    - title: Szerkezeti mérnökség
      description: 'A drop-stitch sűrűség, a PVC rétegszáma és minősége, a merevítők elhelyezkedése és a szín szerkezete az Ön kiviteléhez specifikálva és validálva.'
      icon: 'tabler:building-factory'
    - title: Grafika és márkázás
      description: 'Deszkahíd grafikája, csőmárkázás, EVA fedelek és kiskereskedelmi csomagolás, amelyet tervezőcsapatunk az Ön márkája köré fejleszt.'
      icon: 'tabler:palette'
    - title: Formafejlesztés
      description: 'Az új víztestformák belsőleg tervezett és vágott formázószerszámként indulnak – a szerszámok 15–20 napot adnak hozzá a projekt határidejéhez.'
      icon: 'tabler:shapes'
    - title: Prototípus-validálás
      description: 'Fizikai prototípust építünk, tesztelünk és Önnek értékelésre megküldünk, vízi próbával együtt – általában 7–12 nap alatt.'
      icon: 'tabler:tools'
    - title: Tesztelés és megfelelőség
      description: 'Lezárás-, nyomástartási és varrásteherbírás-próba minden darabbal, a célpiacra vonatkozó ISO 9001, BSCI, REACH, RoHS és CE megfelelőségi dokumentációval (a hatókör minden projektnél megerősítésre kerül).'
      icon: 'tabler:certificate'
    - title: Szerszámtulajdonosi opciók
      description: 'A szerződésben rögzített szerszámtulajdonosi vagy visszavásárlási feltételek – a kivitel az Ön marad, a szerszámokat pedig megőrizzük az ismétlődő megrendelésekhez.'
      icon: 'tabler:lock'
    - title: A prototípustól a konténerig
      description: 'A validált ODM kivitel közvetlenül a standard térfogatú gyártásba vezet: 90–100+ darab szállítmányonként, 150 m-es tekercsenként, 25–35 nap alatt a megerősített megrendeléstől számítva.'
      icon: 'tabler:package'

customization:
  tagline: Önnel közösen tervezve
  title: Mit fejlesztünk az Ön specifikációs lapjáról
  subtitle: 'Az ODM azt jelenti, hogy a terméket Önnek tervezzük nulláról vagy saját platformkönyvtárunkból – ezek azok a fogantyúk, amelyeket az Ön specifikációs lapja kezel:'
  items:
    - 'A sportoló profilja és a piac – pozicionálás kezdők, touring, verseny, yoga, horgászat vagy vegyes használat számára'
    - 'A deszka méretei – a célzott sportolóhoz és felhasználási esethez igazított hosszúság, szélesség, vastagság és térfogat'
    - 'A víztest jellege – rocker, színprofil, borda- és farokforma a stabilitás vagy a sebesség kedvéért hangolva'
    - 'Az anyagszerkezet – drop-stitch sűrűség, a PVC rétegszáma és minősége, merevítők és szín-megerősítések'
    - 'Grafika és színek – a márka színei, a híd grafikája és a csőmárkázás, belsőleg fejlesztve'
    - 'EVA csúszásgátló fedelem – konfiguráció, színek és a logó beépítése a teljes hídon'
    - 'Tartozékcsomag – a deszkához igazított evezők, pumpák, stabilizátorok, kötelékek és hátizsák'
    - 'Csomagolás és kiskereskedelmi bemutató – kiskereskedelmi dobozok, displayek és exportcsomagolás az Ön márkájában'

faq_section:
  tagline: GYIK
  title: 'Kérdések az ODM fejlesztésről'
  questions:
    - q: Miben különbözik az ODM az OEM-től?
      a: 'Az ODM (Original Design Manufacturing) az Ön specifikációs lapjáról indul – mérnökeink kifejlesztik a deszka szerkezetét, az összeállítást, a grafikát és a csomagolást, akár egy piaci koncepcióból, akár egy teljesítménycélból, akár egy validált platform adaptálásából. Ön jóváhagyja a kivitelt a gyártás előtt. Az OEM (Original Equipment Manufacturing) az Ön jóváhagyott specifikációja szerint gyárt – az Ön rajzai, méretei, anyagai és csomagolása. Ön birtokolja a kivitelt és a szellemi tulajdont. Mindkét út ugyanazon a gyáron, ugyanazzal a minőségellenőrzési rendszerrel és ugyanazzal az exportcsapattal halad; az ODM a leggyorsabb út egy márkás deszkához akkor, ha még nincs kivitelének.'
    - q: Csak egy homályos ötletem van – hol kezdjük?
      a: 'Küldjön egy rövid specifikációs lapot: célzott sportolók, felhasználási esetek, hozzávetőleges méretek, piacok és térfogatok. Mérnökeink egy munkanapon belül visszatérnek egy koncepttel, a referencia-deszka iránymutatásával és a fejlesztési tervvel – és kérésre NDA-t írunk alá minden részletes egyeztetés előtt.'
    - q: Meddig tart egy új SUP deszka fejlesztése?
      a: 'A prototípusmintákat 7–12 nap alatt adjuk fel. Az új víztest egyedi formázószerszámokkal további 15–20 nap mérnöki időt ad a minták elé. A gyártás a megrendelés és az előleg után 25–35 napot tart.'
    - q: Mi az MOQ egy ODM deszkánál?
      a: 'A standard térfogatú gyártás 90–100 darab szállítmányonként, 150 m-es drop-stitch szövetből; a pilótaszállítmányok 20–50 darabtól indulnak meglévő platformokon. A kis szállítmányú közös márkázás már 5–10 darabtól indul – a teljes számításért tekintse meg a MOQ és rugalmas márkázás útmutatónkat.'
    - q: Kié a kivitel és a forma?
      a: 'Az Ön specifikációs lapja, kivitele és szerszámai NDA-val, a márka licencfeltételeivel és a szerződésben rögzített szerszámtulajdonosi vagy visszavásárlási záradékokkal védettek. A szerszámokat az Ön márkája részére megőrizzük, és átadhatók.'
    - q: Kifejleszthetnek egy adott formát (touring, horgászat, verseny, yoga)?
      a: 'Igen. A víztest mérnöksége minden fő SUP kategóriát lefed – all-around, touring, verseny, yoga, horgászat és többfőleges deszkák –, a teljesítményorientált formáknál pedig lehetőség van a hidrodinamikai mérőmedencében történő validálásra.'
    - q: Milyen tanúsításokat visz a kifejlesztett deszka?
      a: 'ISO 9001:2015 minőségirányítási rendszer (gyárszinten), BSCI szociális megfelelőség (amfori telephelyaudit), CE megfelelőségi dokumentáció az EU-piacra vonatkozó konfigurációkhoz (a szabadidőjármű-irányelv – a hatókör minden projektnél megerősítésre kerül), REACH (anyagok), RoHS (elektronikus tartozékok) és a felfújható SUP modellekre vonatkozó ISO 25649 megfelelőség. A tanúsító dokumentumok minden megrendeléshez az Ön exportpiacai alapján készülnek.'

process:
  title: Az ODM folyamat – a specifikációs laptól a fokozott gyártásig
  subtitle: 'Hat ellenőrzött szakasz, amelyet ugyanaz a belső csapat vezet, amely az Ön deszkáját tervezi, mintázza és fokozza – minden lépés dokumentált marad.'
  steps:
    - phase: '01'
      title: 'Specifikáció és koncept'
      period: 1 munkanap
      items:
        - 'Ossza meg a célzott sportolókat, a felhasználási eseteket, a méreteket, a piacokat és a térfogatokat – vagy csak egy ötletet.'
        - 'Mérnökeink egy koncept iránymutatással, platformopciókkal és fejlesztési tervvel térnek vissza.'
    - phase: '02'
      title: 'A víztest és a szerkezet tervezése'
      period: 1–2. hét
      items:
        - 'A deszka méretei, a víztest jellege, a drop-stitch sűrűsége és a PVC szerkezete belsőleg készül.'
        - 'A grafika, az EVA hídkonfiguráció és a csomagolási koncept az Ön márkája köré fejlődik.'
    - phase: '03'
      title: 'Forma és szerszámok'
      period: +15–20 nap (új formák)
      items:
        - 'Egyedi, az új víztestformákhoz tervezett és vágott formázószerszámok; a meglévő platformok kihagyják ezt a lépést.'
        - 'A szerszámtulajdon feltételeit a szerződésben rögzítjük a vágás megkezdése előtt.'
    - phase: '04'
      title: 'Prototípus és minta'
      period: 7–12 nap
      items:
        - 'Fizikai prototípust építünk, tesztelünk és Önnek értékelésre megküldünk – vízi próbával együtt.'
        - 'A minta (1–2 darab) a térfogat előtt validálja a formát, a szerkezetet és a márkázást.'
    - phase: '05'
      title: 'Validálás és jóváhagyás'
      period: Párhuzamosan
      items:
        - 'Lezárási, nyomástartási, varrásteherbírási, terhelési és UV-próbák minden gyártósoron.'
        - 'A CE, ISO 9001, BSCI, REACH és RoHS dokumentáció előkészül az Ön exportpiacaira.'
        - 'Ön jóváhagyja a prototípust; a megrendelés és az előleg rögzíti a gyártási kapacitást.'
    - phase: '06'
      title: 'Gyártás és kiszállítás'
      period: 25–35 nap
      items:
        - 'A standard térfogatszállítmányok 90–100+ darabok 150 m-es tekercsenként, a pilótaszállítmányok pedig 20–50 darabtól indulnak.'
        - 'A csomag tartalmazza az exportcsomagolást, a FOB/CIF/DDP feladást több mint 50 országba és az ismétlődő megrendelések támogatását.'

