hero:
  tagline: 'Produksjon du kan verifisere'
  title: 'OEM-tillit & fabrikgarantier'
  subtitle: 'Hvert påstand på denne nettsiden er verifiserbart: offisiell bedriftsregistrering, en fysisk fabrik på 12 500 m² som du kan besøke eller auditere, ekte ingeniører under NDA, nedlastbare QMS-dokumenter og testdata registrert per serienummer. Utviklet og drevet av Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Kort svar'
  text: 'Tillit er ikke et løfte: det er dokumentasjon. Vi er et registrert kinesisk produksjonsforetak (Qingdao Vatrad Group Co., Ltd.) med en fysisk fabrik på 12 500 m² i Qingdao, 350+ ansatte og en årskapasitet på 120 000+ brett. Du kan verifisere registreringen, auditere fabrikken, ta del av QMS-SOP-ene, laste ned eksempler på kvalitetsregistreringer, bestille inspeksjon av tredjepart (SGS, TÜV, BV eller Intertek) og få en signert NDA innen 4 arbeidstimer. Hvert brett testes i 24 timer ved 18.0 PSI med automatisk avvisning over 0.50 PSI trykktap, og hvert parti har 10 års ERP-sporbarhet. Hvis et påstand ikke kan dokumenteres, gjør vi det ikke.'
  verified: 'September 2026'

