trust_steps:
  tagline: 'En virkelig referansecase'
  title: 'Hvordan en nordisk utleieflåte verifiserte oss før bestillingen'
  subtitle: 'Sju verifiseringstrinn gjennomført av en kommersiell utleier før en bestilling på 90–100+ enheter — samme sjekkliste er tilgjengelig for deg.'
  steps:
    - step: '01'
      title: 'Verifisering av den offisielle enheten'
      desc: 'Kjøperen ba om kinesisk bedriftsregister og utenrikshandelsstillatelse. Det juridiske selskapet bak iSupfactory er Qingdao Vatrad Group Co., Ltd., en produsent registrert i Qingdao, Shandong, siden 2012 — verifisert via det nasjonale registeret under NDA.'
    - step: '02'
      title: 'Fysisk fabrikk & stedsrevisjon'
      desc: 'En fabrikkrevisjon (på sted og via videoomvisning) bekreftet anlegget på 12 500 m²: fire spesialiserte verksteder, 350+ ansatte, fire automatiserte linjer og en månedlig produksjon på rundt 10 000 brett. Revisjonsrapporten arkiveres i kontraktsdokumentasjonen.'
    - step: '03'
      title: 'Mennesker: ekte ingeniører, ingen kommersielle manus'
      desc: 'Kjøperen snakket direkte med det tekniske teamet — skipsbygging, materiallaboratorium og QC. Prosjektspesifikasjon og NDA ble utvekslet innen 4 arbeidstimer, og en teknisk gjennomgang forelå innen én arbeidsdag.'
    - step: '04'
      title: 'Papirarbeid: QMS, sertifikater & inspeksjon av tredjepart'
      desc: 'Samsvarsdokumentasjonen for ISO 9001:2015, ISO 25649 og CE, BSCI/REACH/RoHS-registreringene og QMS-SOP-ene ble gjennomgått. Kjøperen planla en SGS-inspeksjon før levering iht. ISO 2859-1 Nivå II for den første seriebestillingen — og fikk for hvert parti et samsvarsbevis (Certificate of Conformance).'
    - step: '05'
      title: 'Data: testregistreringer per serienummer'
      desc: 'Kjøperen gjennomgikk ekte testregistreringer: hver luftkammer testet i 24 timer ved 18.0 PSI med automatisk avvisning over 0.50 PSI trykktap, en kontrolliste med 100 punkter for montering og 10 års ERP-sporbarhet per parti. Eksempler på QC-registreringer ble gjort tilgjengelige før bestillingen.'
    - step: '06'
      title: 'Kontraktuell beskyttelse'
      desc: 'Ordrekontrakten omfattet varemerkelisensen, en avtalt periode med territoriell eksklusivitet, eierskap til formen og leveringsvilkårene, samt opplysningene og registreringene som følger med utstyret. Kjøperen godkjente formen i fabrikken før produksjonen.'
    - step: '07'
      title: 'Løpende styring'
      desc: 'Kvartalsmøter med VP Sales og sjefingeniøren, en forbeholdt revisjonsrett under produksjonen og en eskaleringsvei til QA-sjefen for kvalitetstvister. Avtalen ble signert samlet av VP Sales, sjefingeniøren og QA-sjefen.'

trust_faqs:
  tagline: 'Vanlige spørsmål'
  title: 'De 12 spørsmålene kjøpere stiller før bestillingen'
  items:
    - q: 'Er iSupfactory en ekte fabrikk eller et trading company?'
      a: 'iSupfactory er produktutviklings- og SUP-produksjonsdivisjonen i Qingdao Vatrad Group Co., Ltd. Vi driver fabrikken på 12 500 m² i Qingdao direkte — design, kutt, sveising, montering og testing skjer på ett og samme anlegg. Det finnes ingen omveis via trading companies: personene som svarer på spørsmålene dine er de som bygger brettene dine.'
    - q: 'Hvem samarbeider jeg konkret med i prosjektet mitt?'
      a: 'Med en dedikert prosjektingeniør og en dedikert QC-kontakt, i tillegg til avdelingssjefene som signerer dokumentene dine. Du kan snakke direkte med sjefingeniøren, QA-sjefen eller fabrikksjefen — før og etter bestillingen. Det ligger intet account manager-lag mellom deg og dem som utfører jobben.'
    - q: 'Kan jeg besøke eller auditere fabrikken?'
      a: 'Ja. Vi ønsker velkommen til fabrikkbesøk i Laixis økonomiske utviklingssone i Qingdao og støtter eksterne revisjoner med direkte videoomvisning. Revisjoner kan arrangeres uavhengig (av din egen inspektør eller en tredjepart som SGS, TÜV, BV eller Intertek), og revisjonsplanen kan tas inn i kontrakten.'
    - q: 'Signerer dere en NDA før jeg deler designen min?'
      a: 'Ja. Vår standard-NDA signeres innen 4 arbeidstimer etter forespørselen din, før noe eierskap, spesifikasjon, artwork eller teknisk fil deles. Tospråkige versjoner (engelsk/kinesisk) er tilgjengelige, og dokumentet signeres samlet av fabrikksjefen.'
    - q: 'Hvordan vet jeg at kvalitetspåstandene deres er ekte?'
      a: 'Bak hvert påstand på denne nettsiden ligger et dokument: QMS-SOP-ene og teststandardene er nedlastbare, eksempler på anonymiserte kvalitetsregistreringer er publisert, og testdata registreres per serienummer med 10 års ERP-sporbarhet per parti. Du kan også bestille inspeksjon før levering av tredjepart etter eget valg.'
    - q: 'Hva skjer hvis brettene mine kommer med mangler?'
      a: 'Hvert brett inspiseres før pakking, og partiregistreringene muliggjør årsaksanalyse per serienummer. Kontrakten definerer forpliktelser rundt inspeksjon, erstatning og nyproduksjon, og QA-sjefen frigir partiet. Nyproduserte brett testes på nytt fra bunnen av — aldri bare stikkprøve kontrollert.'
    - q: 'Kan dere virkelig teste 100 % av brettene før levering?'
      a: 'Ja — og registreringene beviser det. Hver luftkammer pumpes til 18.0 PSI og holdes i 24 timer med kontinuerlig sensorregistrering; hver kammer med et trykktap på mer enn 0.50 PSI i løpet av 24 timene avvises automatisk og kontrolleres på nytt. Testprotokollene er koblet til hvert serienummer og inngår i partiets dokumentasjon.'
    - q: 'Hvilke sertifiseringer har dere faktisk?'
      a: 'Kvalitetsledelse iht. ISO 9001:2015, samsvar iht. ISO 25649 og CE for oppblåsbare SUP-produkter, samt samsvar iht. BSCI, REACH og RoHS for fabrikk og materialer. Sertifikatnumre og revisjonsprotokoller gjøres tilgjengelige på forespørsel eller i forbindelse med en revisjon — listen er publisert, ikke «kun tilgjengelig på forespørsel».'
    - q: 'Er varemerket mitt beskyttet — design, former og marked?'
      a: 'Ja. Varemerket ditt, designene dine og utstyret ditt beskyttes via NDA-en, vilkårene for varemerkelisensen og klausuler om eierskap eller overføring av formene i kontrakten. Utstyret oppbevares for varemerket og kan overføres. Territorielle vilkår og eksklusivitet avtales skriftlig før produksjonsstart.'
    - q: 'Hva er deres faktiske MOQ?'
      a: 'MOQ avhenger av prosjektet og forklares i MOQ-guiden vår: prøve 1–2 enheter, co-branding i små volumer 5–10 enheter, pilotpartier 20–50 enheter og standardvolumer 90–100+ enheter per rull på 150 m (ca. 180–220 brett). Egne former går på volumnivå. Beregningen bekreftes før tilbudet — ingen uklare «lav MOQ»-tall.'
    - q: 'Hva skjer hvis produksjonen forsinkes?'
      a: 'Leveringstiden bekreftes etter gjennomgang av spesifikasjon, artwork og emballasje — aldri lovet på forhånd. Kontrakten regulerer planleggingen, rapporteringen av forsinkelser og løsningsveien, og kvartalsmøtet følger leveranseprestasjonen mot den avtalte kalenderen.'
    - q: 'Hvem signerer kontraktsdokumentene på deres side?'
      a: 'Bestillinger og avtaler signeres samlet av VP Sales, sjefingeniøren og QA-sjefen — de tre personene som er ansvarlige for henholdsvis kommersiell policy, teknisk utførelse og kvalitetsfrigivelse. Du får de signerte dokumentene sammen med kontraktsdokumentasjonen.'

governance:
  tagline: 'Ansvarsstruktur'
  title: 'Utpekte signatarer & forbeholdte rettigheter'
  subtitle: 'Hvert forpliktelse er knyttet til en utpektet rolle — ikke til en salgsavdeling.'
  body: |
    **Felles signering.** Bestillinger, kvalitetsplaner og tvisteløsning signeres av tre roller: VP Sales (kommersiell policy), sjefingeniøren (teknisk utførelse) og QA-sjefen (kvalitetsfrigivelse). De tospråkige SOP-ene er under versjonskontroll og har samme signeringsstruktur.

    **Forbeholdte rettigheter.** Kjøperen beholder retten til å revidere produksjonen, ta del av testregistreringene og holde tilbake partifrigivelse til inspeksjonen er godkjent. Nyproduksjon skjer kun under et godkjent endringsprotokoll, og frigivelsen valideres av en uavhengig kvalitetskontroll — aldri av operatørene som utførte nyproduksjonen.

    **Overførte registreringer.** Partiets testprotokoller, samsvarsbevis og inspeksjonsrapporter følger med hver levering, og ERP-sporbarheten per parti lagres i 10 år. Registreringer for utstyret og formtegninger følger med utstyret dersom kontrakten sier det.

