customization:
  tagline: Met jou ontworpen
  title: Wat we rond jouw briefing ontwikkelen
  subtitle: 'ODM betekent dat het product voor jou wordt ontworpen vanaf nu of vanuit onze platformbibliotheek — dit zijn de punten die jouw briefing beheert:'
  items:
    - 'Gebruikersprofiel en markt — positionering voor beginners, touring, wedstrijd, yoga, visserij of multifunctioneel gebruik'
    - 'Plankafmetingen — lengte, breedte, dikte en volume, gekalibreerd op referentiegebruikers en gebruik'
    - 'Karakter van de romp — rocker, railprofiel, vorm van neus en staart, gekalibreerd op stabiliteit of snelheid'
    - 'Materiaalstructuur — drop-stitch dichtheid, aantal en kwaliteit van de PVC-lagen, versterkingen en rail-verstevigingen'
    - 'Graphics en kleuren — merkkleuren, plankgraphics en logo-doorvoeringen, intern ontwikkeld'
    - 'Antislip EVA-deckpad — lay-out, kleuren en logo-integratie op het deck'
    - 'Accessoirepakket — peddels, pompen, vinnen, leashes en tassen, gekalibreerd op de plank'
    - 'Commerciële en POS-verpakking — commerciële verpakkingen, displays en exportverpakking onder jouw merk'

faq_section:
  tagline: FAQ
  title: Vragen over ODM-ontwikkeling
  questions:
    - q: Wat is het verschil tussen ODM en OEM?
      a: 'ODM (Original Design Manufacturing) begint bij jouw briefing — onze ingenieurs ontwikkelen de plankstructuur, de constructie, de graphics en de verpakking, of het nu uit een marktconcept, een prestatiedoel of een bewerking van een beproefd platform komt. Je keurt het ontwerp vóór de productie goed. OEM (Original Equipment Manufacturing) produceert volgens jouw goedgekeurde specificatie — je tekeningen, afmetingen, materialen en verpakking. Je bezit ontwerp en intellectuele eigendom. Beide trajecten lopen door dezelfde fabriek, hetzelfde QC-systeem en hetzelfde exportteam; ODM is de snelste weg naar een ge-branded plank wanneer je nog geen ontwerp hebt.'
    - q: Ik heb alleen een ruw idee — waar beginnen we?
      a: 'Stuur een korte briefing: referentiegebruikers, toepassingen, indicatieve afmeting, markten en hoeveelheden. Onze ingenieurs reageren binnen één werkdag met een concept, een ontwerprichting en een ontwikkelingsplan — op aanvraag wordt een NDA ondertekend vóór elke uitwisseling van details.'
    - q: Hoe lang duurt de ontwikkeling van een nieuwe SUP-plank?
      a: 'Prototypesamples vertrekken in 7–12 dagen. Een nieuwe romp met een eigen matrijzenbouw voegt 15–20 dagen engineering toe vóór de samples. De productie loopt 25–35 dagen na bestelling en aanbetaling.'
    - q: Wat is het MOQ voor een ODM-plank?
      a: 'De productie in standaardhoeveelheden draait op 90–100 eenheden per 150 m drop-stitch rol; pilotruns starten vanaf 20–50 eenheden op bestaande platforms. Co-branding voor kleine partijen start vanaf 5–10 eenheden — de volledige berekening vind je in onze gids voor MOQ en flexibele branding.'
    - q: Van wie zijn ontwerp en matrijs?
      a: 'Je briefing, je ontwerp en je apparatuur worden beschermd door de NDA, de voorwaarden van de merkenlicentie en de clausules over eigendom of overname van de matrijzen in het contract. De matrijzen blijven voor jouw merk bewaard en zijn overdraagbaar.'
    - q: Kunnen jullie een specifieke vorm ontwikkelen (touring, vissen, wedstrijd, yoga)?
      a: 'Ja. De rompengineering bestrijkt alle grote SUP-categorieën — allround, touring, wedstrijd, yoga, vissen en planken voor meerdere personen — met validatie in de hydrodynamische testtank voor prestatievormen.'
    - q: Welke certificeringen heeft de ontwikkelde plank?
      a: 'ISO 9001:2015 kwaliteitsbeheer (op fabrieksniveau), BSCI sociale conformiteit (amfori-fabrieksaudit), CE-conformiteitsdocumentatie voor de configuraties die van toepassing zijn op de EU-markt (richtlijn pleziervaartuigen — toepassingsbereik per project bevestigd), REACH (materialen), RoHS (elektronische accessoires) en ISO 25649 voor de van toepassing zijnde opblaasbare SUP-modellen. De certificatiedocumenten worden per bestelling klaargezet voor jouw exportmarkten.'

process:
  title: 'Het ODM-proces — van briefing tot productie op schaal'
  subtitle: 'Zes beheerde fasen, geleid door hetzelfde team dat je plank ontwerpt, bemonstert en opschaalt — alles blijft gedocumenteerd.'
  steps:
    - phase: '01'
      title: Briefing en concept
      period: 1 werkdag
      items:
        - 'Deel referentiegebruikers, toepassingen, afmetingen, markten en hoeveelheden — of alleen een idee.'
        - 'Onze ingenieurs leveren een conceptrichting, platformopties en een ontwikkelingsplan.'
    - phase: '02'
      title: Romp- en structuurontwerp
      period: Week 1–2
      items:
        - 'Plankafmetingen, rompkarakter, drop-stitch dichtheid en PVC-structuur — intern ontworpen.'
        - 'Graphics, EVA-decklay-out en verpakkingsconcept ontwikkeld rond jouw merk.'
    - phase: '03'
      title: Matrijzen en apparatuur
      period: +15–20 dagen (nieuwe matrijzen)
      items:
        - 'Eigen matrijzenbouw voor nieuwe rompvormen; bestaande platformen slaan deze fase over.'
        - 'De voorwaarden van het matrijseigendom worden vóór de start van het frezen in het contract vastgelegd.'
    - phase: '04'
      title: Prototype en sample
      period: 7–12 dagen
      items:
        - 'Er wordt een fysiek prototype gebouwd, getest en naar jouw beoordeling gestuurd — inclusief watertest.'
        - 'Het sample (1–2 eenheden) valideert vorm, structuur en branding vóór de hoeveelheid.'
    - phase: '05'
      title: Validatie en goedkeuring
      period: Parallel
      items:
        - 'Luchtdichtheid, drukbehoud, lassterkte, belasting- en UV-tests voor elke productielijn.'
        - 'CE-, ISO-9001-, BSCI-, REACH- en RoHS-documentatie klaargezet voor je exportmarkten.'
        - 'Je keurt het prototype goed; de bestelling en de aanbetaling reserveren het productieslot.'
    - phase: '06'
      title: Productie en levering
      period: 25–35 dagen
      items:
        - 'Standaardhoeveelheden draaien op 90–100+ eenheden per rol van 150 m, pilotruns van 20–50 eenheden.'
        - 'Exportverpakking, verzending FOB/CIF/DDP naar meer dan 50 landen en ondersteuning bij herdrukken inbegrepen.'

