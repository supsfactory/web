hero:
  tagline: ODM-productie
  title: 'SUP-ODM-fabrikant — ontwerp en productontwikkeling'
  subtitle: 'Je hebt geen kant-en-klaar SUP-ontwerp nodig. Begin met een productconcept, een marktvereiste of een prestatiedoel — onze ingenieurs in eigen huis ontwerpen romp, structuur, graphics en verpakking op basis van jouw briefing, maken prototypes in 7–12 dagen en produceren 25–35 dagen na de orderbevestiging.'

answer:
  label: 'Kort antwoord'
  text: 'SUPsfactory is een SUP-ODM-fabrikant in Qingdao, China. De ODM-ontwikkeling begint bij jouw briefing, niet bij jouw tekeningen: het rompontwerp (lengte, breedte, rocker, volume), de materiaalstructuur en de graphics worden intern ontworpen, gevalideerd met prototypesamples in 7–12 dagen en geproduceerd in standaardhoeveelheden van 90–100 eenheden per rol van 150 m (piloot van 20–50 eenheden). De productie duurt 25–35 dagen na orderbevestiging en aanbetaling; de matrijzenbouw voor aangepaste vormen voegt 15–20 dagen toe. De documentatie voor CE, ISO-9001, BSCI, REACH en RoHS wordt bij elke bestelling geleverd.'
  verified: 'September 2026'

