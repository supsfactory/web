trust_steps:
  tagline: 'Prawdziwe studium przypadku'
  title: 'Jak północnoeuropejska flota wypożyczalni zweryfikowała nas przed zamówieniem'
  subtitle: 'Siedem etapów weryfikacji, które komerencyjny operator wypożyczalni przeszedł przed złożeniem zamówienia na flotę 90–100+ szt. — ta sama checklista jest dostępna także dla Ciebie.'
  steps:
    - step: '01'
      title: 'Weryfikacja podmiotu oficjalnego'
      desc: 'Kupujący poprosił o chińską rejestrację działalności i licencję na handel zagraniczny. Podmiotem prawnym stojącym za iSupfactory jest Qingdao Vatrad Group Co., Ltd., producent zarejestrowany w Qingdao w prowincji Shandong od 2012 roku — zweryfikowany w krajowym rejestrze pod NDA.'
    - step: '02'
      title: 'Fizyczna fabryka i audyt terenu'
      desc: 'Audyt fabryki (na miejscu i w formie spaceru wideo) potwierdził zakład o powierzchni 12,500 m²: cztery wyspecjalizowane warsztaty, ponad 350 pracowników, cztery zautomatyzowane linie i miesięczna wydajność około 10,000 desek. Raport z audytu jest dołączany do dokumentacji umowy.'
    - step: '03'
      title: 'Ludzie: prawdziwi inżynierowie, a nie scenariusze sprzedaży'
      desc: 'Kupujący porozmawiał bezpośrednio z zespołem inżynierskim — projektowanie kadłubów, laboratorium materiałów i QC. Specyfikację projektu oraz NDA wymieniono w ciągu 4 godzin roboczych, a przegląd techniczny otrzymano w ciągu jednego dnia roboczego.'
    - step: '04'
      title: 'Papiery: QMS, certyfikaty i inspekcja firmy trzeciej'
      desc: 'Zweryfikowano dokumentację zgodności ISO 9001:2015, ISO 25649 i CE, zapisy BSCI/REACH/RoHS oraz SOP-y QMS. Kupujący zaplanował inspekcję SGS przed wysyłką zgodnie z ISO 2859-1 poziom II przy pierwszym zamówieniu wolumenowym — i otrzymał świadectwo zgodności dla każdej partii.'
    - step: '05'
      title: 'Dane: zapisy testowe dla każdego numeru seryjnego'
      desc: 'Kupujący sprawdził rzeczywiste zapisy testowe: każda komora testowana przy 18.0 PSI przez 24 godziny z automatycznym odrzuceniem przy spadku ciśnienia powyżej 0.50 PSI, 100-punktowe listy kontrolne montażu oraz 10-letnia identyfikowalność partii w ERP. Przykładowe zapisy QC przekazano przed zamówieniem.'
    - step: '06'
      title: 'Ochrona umowna'
      desc: 'Umowa na zamówienie obejmowała licencję marki, uzgodniony okres wyłączności terytorialnej, własność formy i warunki jej odkupu oraz określała dane i dokumenty przechodzące razem z narzędziami. Kupujący zatwierdził formę w fabryce przed produkcją.'
    - step: '07'
      title: 'Bieżący nadzór'
      desc: 'Kwartalne przeglądy biznesowe z wiceprezesem ds. sprzedaży i głównym inżynierem, zastrzeżone prawo do audytu w trakcie produkcji oraz ścieżka eskalacji do dyrektora QA w sprawie każdego sporu jakościowego. Umowę podpisali wspólnie wiceprezes ds. sprzedaży, główny inżynier i dyrektor QA.'

trust_faqs:
  tagline: 'Najczęstsze pytania'
  title: '12 obaw, które kupujący mają przed zamówieniem'
  items:
    - q: 'Czy iSupfactory to naprawdę fabryka, czy firma handlowa?'
      a: 'iSupfactory to dział rozwoju produktów SUP i produkcji w strukturze Qingdao Vatrad Group Co., Ltd. Sami prowadzimy zakład o powierzchni 12,500 m² w Qingdao — projektowanie, cięcie, zgrzewanie, montaż i testy odbywają się w jednym obiekcie. Nie ma przekazywania przez pośrednika handlowego: osoby, które odpowiadają na Twoje pytania, to osoby, które budują Twoje deski.'
    - q: 'Z kim dokładnie będę pracował w trakcie projektu?'
      a: 'Z wyznaczonym inżynierem projektu i wyznaczonym kontaktem QC, a także z kierownikami działów, którzy podpisują Twoje dokumenty. Możesz poprosić o rozmowę bezpośrednio z głównym inżynierem, dyrektorem QA lub dyrektorem fabryki — przed zamówieniem i po nim. Między Tobą a ludźmi wykonującymi pracę nie ma warstwy opiekunów klienta.'
    - q: 'Czy mogę odwiedzić fabrykę lub poddać ją audytowi?'
      a: 'Tak. Zapraszamy do wizyt w fabryce w Strefie Rozwoju Gospodarczego Laixi w Qingdao i wspieramy zdalne audyty z transmisją na żywo. Audyt można zorganizować niezależnie (przez Twojego inspektora lub firmę trzecią, np. SGS, TUV, BV lub Intertek), a harmonogram audytu można wpisać do umowy.'
    - q: 'Czy podpiszecie NDA, zanim udostępnię mój projekt?'
      a: 'Tak. Nasze standardowe NDA podpisujemy w ciągu 4 godzin roboczych od Twojego wniosku, zanim udostępnimy jakąkolwiek chronioną specyfikację, grafikę lub plik techniczny. Dostępne są wersje dwujęzyczne (angielski/chiński), a dokument jest podpisywany przez dyrektora fabryki.'
    - q: 'Skąd mam wiedzieć, że Twoje twierdzenia o jakości są prawdziwe?'
      a: 'Za każdym twierdzeniem na tej stronie stoi dokument: SOP-y QMS i normy inspekcyjne można pobrać, publikujemy zanonimizowane próbki zapisów jakościowych, a dane testowe są rejestrowane dla każdego numeru seryjnego z 10-letnią identyfikowalnością partii w ERP. Możesz też zamówić inspekcję przed wysyłką przez firmę trzecią według własnego wyboru.'
    - q: 'Co się stanie, jeśli moje deski dotrą z wadami?'
      a: 'Każda deska jest sprawdzana przed pakowaniem, a zapisy na poziomie partii pozwalają prześledzić przyczynę na poziomie numeru seryjnego. Umowa określa obowiązki dotyczące inspekcji, wymiany i poprawek, a partię zwalnia dyrektor QA. Deski po poprawkach są badane w całości — nigdy tylko punktowo.'
    - q: 'Czy naprawdę da się zbadać 100% desek przed wysyłką?'
      a: 'Tak — i dokumenty to potwierdzają. Każda komora jest nadmuchiwana do 18.0 PSI i utrzymywana przez 24 godziny z ciągłym zapisem z czujników; każda komora ze spadkiem ciśnienia powyżej 0.50 PSI w ciągu 24 godzin jest automatycznie odrzucana i ponownie badana. Logi testowe są powiązane z każdym numerem seryjnym i wchodzą w skład dokumentacji partii.'
    - q: 'Jakie certyfikaty faktycznie posiadacie?'
      a: 'Zarządzanie jakością ISO 9001:2015, zgodność ISO 25649 i CE dla produktów w postaci nadmuchiwanych desek SUP, a także zgodność BSCI, REACH i RoHS dla zakładu i materiałów. Numery certyfikatów i zapisy z audytów udostępniamy na prośbę lub podczas audytu — lista jest jawna, a nie „dostępna wyłącznie na prośbę”.'
    - q: 'Czy moja marka będzie bezpieczna — projekt, formy i rynek?'
      a: 'Tak. Twoja marka, projekty i narzędzia są chronione przez NDA, warunki licencji marki oraz zapisy o własności lub odkupie form wpisane do umowy. Narzędzia przechowujemy dla marki i można je przenieść. Warunki terytorialne i wyłączności ustalamy na piśmie przed rozpoczęciem produkcji.'
    - q: 'Jakie jest Twoje realne MOQ?'
      a: 'MOQ zależy od projektu i jest wyjaśnione w naszym przewodniku o MOQ: próbka 1–2 szt., współmarkowanie w małej serii 5–10 szt., serie pilotażowe 20–50 szt. oraz standardowy wolumen 90–100+ szt. na rolkę 150 m (około 180–220 desek). Niestandardowe kształty w formie wytłoczonej realizujemy na poziomie wolumenowym. Kalkulację potwierdzamy przed wyceną — bez mglistych liczb typu „niskie MOQ”.'
    - q: 'Co się stanie, jeśli produkcja się opóźni?'
      a: 'Czas realizacji potwierdzamy po przeglądzie specyfikacji, grafiki i opakowania — nigdy nie obiecujemy go wcześniej. Umowa reguluje harmonogram, zgłaszanie opóźnień i ścieżkę rozwiązania, a kwartalny przegląd biznesowy śledzi terminowość dostaw względem uzgodnionego kalendarza.'
    - q: 'Kto podpisuje dokumenty umowy po Waszej stronie?'
      a: 'Zamówienia i umowy podpisują wspólnie wiceprezes ds. sprzedaży, główny inżynier i dyrektor QA — trzej ludzie odpowiedzialni odpowiednio za warunki handlowe, realizację techniczną i dopuszczenie jakościowe. Otrzymujesz podpisane dokumenty razem z dokumentacją umowy.'

governance:
  tagline: 'Struktura odpowiedzialności'
  title: 'Wskazani sygnatariusze i prawa zastrzeżone'
  subtitle: 'Każde zobowiązanie jest przypisane do konkretnej roli — a nie do działu sprzedaży.'
  body: |
    **Wspólna akceptacja.** Zamówienia, plany jakości i rozstrzygnięcia sporów podpisują trzy role: wiceprezes ds. sprzedaży (warunki handlowe), główny inżynier (realizacja techniczna) i dyrektor QA (dopuszczenie jakościowe). Dwujęzyczne SOP-y podlegają kontroli wersji i mają tę samą strukturę podpisów.

    **Prawa zastrzeżone.** Kupujący zachowuje prawo do audytu produkcji, wglądu w zapisy testowe oraz do wstrzymania dopuszczenia partii do czasu zatwierdzenia inspekcji. Poprawki wykonuje się wyłącznie na podstawie zatwierdzonego rekordu zmiany, a dopuszczenie potwierdza niezależna kontrola jakości — nigdy operatorzy wykonujący poprawki.

    **Przekazywane dokumenty.** Logi testowe partii, świadectwa zgodności i raporty z inspekcji są przekazywane z każdą dostawą, a identyfikowalność partii w ERP jest przechowywana przez 10 lat. Dokumentacja narzędzi i rysunki form przechodzą razem z narzędziami, jeżeli przewiduje to umowa.

