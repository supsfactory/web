values_section:
  title: Slik jobber fabrikken med merker
  subtitle: 'Tre prinsipper som preger alle prosjekter som bygges av Vatrad-fabrikken.'
  columns: 3
  items:
    - title: Konstruksjon før produksjon
      description: 'Hvert prosjekt starter med krav, tegninger og et fysisk prøveeksempel — skrogform, drop-stitch-tetthet, grafisk plassering og emballasje valideres før hver produksjonssyklus, ikke først ved linja.'
      icon: 'tabler:settings'
    - title: Ett team, én fabrikk
      description: 'Design, kapping, sveising, montering og testing skjer i én enkelt fabrikk på 12 500 m². Ingen videresalg via handelsselskaper: personene som svarer på spørsmålene dine er de som bygger brettene dine.'
      icon: 'tabler:building-factory-2'
    - title: Små første serier
      description: 'Co-branding i små serier starter på 5–10 enheter, og standardserieproduksjonen går med 90–100+ enheter per rull (én rull på 150 m drop-stitch) — slik validerer et merke markedet før oppskalering, med beholdte formverktøy og grafikk for gjentakende bestillinger.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Hva fabrikken tilbyr
  subtitle: 'De produksjonstjenestene som er tilgjengelige for iSupfactory-kunder.'
  columns: 2
  items:
    - title: Tilpasset SUP-utvikling
      description: 'Kravanalyse, spesifikasjoner, materialvalg, grafikk, prototyper, prøvegodkjenning og produksjon av skreddersydde oppblåsbare SUP-produkter.'
      icon: 'tabler:bulb'
    - title: Private label-produksjon
      description: 'Din logo, dine farger og din emballasje på dokumenterte kommersielle plattformer: brett, deckpad, tilbehør og kartonger bærer alle din identitet, uten fabrikkens merking.'
      icon: 'tabler:tag'
    - title: OEM/ODM-produksjon
      description: 'Komplett OEM- og ODM-produksjon av oppblåsbare SUP-brett etter kundens tegninger eller fellesutviklede design, inkludert tilpassede formverktøy for nye brettformer.'
      icon: 'tabler:package'
    - title: Flåteleveranser
      description: 'Flåter av merkede brett for resorts, klubber, skoler og utleiecentre, med koordinert tilbehør og produksjonssykluser tilpasset flåtene.'
      icon: 'tabler:users-group'
certifications_section:
  title: Sertifisering og samsvar
  subtitle: 'Fabrikken leverer til EU, USA og Asia-Pacific-regionen innenfor et dokumentert system for samsvar.'
  columns: 2
  items:
    - title: CE-sertifisering
      description: 'Produktlinjene for oppblåsbare SUP-brett og båter oppfyller EUs sikkerhetsdirektiver, med dokumentasjon for hvert marked.'
      icon: 'tabler:certificate'
    - title: Kvalitetssystem ISO 9001
      description: 'Produksjonsanlegget jobber etter et kvalitetsstyringssystem i henhold til ISO 9001 som dekker innkommende kontroll, prosesskontroll og sluttkontroll.'
      icon: 'tabler:badge-check'
    - title: Sosialt samsvar BSCI
      description: 'Sosialt ansvar revideres i henhold til BSCI og omfatter arbeidsforholdene og fabrikkens samsvar.'
      icon: 'tabler:shield-check'
    - title: Materialsamsvar REACH
      description: 'Materialene oppfyller EU-forordningen REACH for kjemikalisikkerhet.'
      icon: 'tabler:flask'
    - title: USCG-godkjenning
      description: 'Produksjon godkjent av amerikansk kystvakt for produktlinjene av oppblåsbare båter.'
      icon: 'tabler:anchor'
    - title: Produkttesting
      description: 'Flyte- og bæreevnetester, sømholdfasthet, UV-bestandighet, slitasjebestandighet og trykkhold på hver produksjonslinje.'
      icon: 'tabler:test-pipe'
