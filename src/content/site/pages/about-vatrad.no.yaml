intro: |
  <p><strong>Vatrad</strong> er den marine produksjonsdivisjonen innen <strong>Qingdao Vatrad Group Co., Ltd.</strong>, lokalisert i den økonomiske utviklingssonen i Laixi, Qingdao, Shandong, Kina. Etablert 2012 begynte selskapet som en spesialisert båtverksted med fokus på marint håndverk og vokste til en sertifisert fabrikk som betjener OEM- og ODM-kunder i over 50 land.</p>
  <p>iSupfactory er B2B-divisjonen for Vatrad-fabrikkens tilpassede utviklingsprosjekter. Alle iSupfactory-prosjekter — fra det første prøveeksemplaret eller en liten co-branding-serie til en komplett private label-produktlinje — realiseres i samme fabrikk, av samme team og med samme kvalitetssystem som beskrevet på denne siden.</p>
  <p>Fabrikken omfatter 12 500 m² med verksteder for PVC-kapping, montering av drop-stitch-kjernen, høyfrekvenssveising, brettmontering samt et testområde for lufttetthet, trykkhold og sømholdfasthet. Produksjonskapasiteten er på over 120 000 oppblåsbare enheter per år, og fabrikken jobber etter et kvalitetsstyringssystem i henhold til ISO 9001, med CE-, BSCI- og REACH-samsvar samt USCG-godkjenning for eksporterte produkter.</p>
  <p>Mer enn 350 kvalifiserte medarbeidere og over 14 FoU-ingeniører støtter de to arbeidsområdene som er viktige for SUP-merker: konstruksjon (skrogform, materialvalg, prototyper) og produksjon (grafisk applikasjon, montering, inspeksjon, eksportemballasje). En intern FoU-avdeling med PVC-tekstillaboratorium og testdam utvikler tilpassede former og strukturell validering før serieproduksjonen starter.</p>
