faqs:
  title: 'FAQ zur OEM-Paddelproduktion'
  subtitle: 'Antworten auf die häufigsten Fragen von Marken, die ihr eigenes Paddel starten.'
  items:
    - title: 'Wie gründe ich meine eigene Paddelmarke?'
      description: 'Starten Sie Ihre Marke: Briefing, Design, CE-zertifizierter Prototyp, Massenproduktion und Lieferung. Muster in 7–12 Tagen, Produktion in 25–35 Tagen ab Auftrag und Anzahlung. Entdecken Sie unsere OEM-Pakete.'
    - title: 'Wie ist die Produktionsvorlaufzeit?'
      description: 'Das Muster ist in 7–12 Tagen fertig, die Massenproduktion in 25–35 Tagen nach Auftrag und Anzahlung, je nach Menge.'
    - title: 'Trägt das Paddel unser Logo?'
      description: 'Ja — vollständiges Private Label: Logodruck, individuelle Farben, Verpackung und Etiketten in Ihrer Marke.'
    - title: 'Kann ich ab dem ersten Tag in großen Mengen kaufen?'
      description: 'Der MOQ wird projektbezogen bestätigt — Muster (1–2 Einheiten), Pilot (20–50 Einheiten) und Standardmenge (90–100+ Einheiten pro Charge), mit Großhandelspreisstufen, die mit der Menge steigen.'

