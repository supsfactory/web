answer:
  label: 'Kurze Antwort'
  text: 'Die Mindestbestellmenge wird projektbezogen bestätigt: Muster (1–2 Einheiten), Pilot (20–50 Einheiten) und Standardmenge (90–100+ Einheiten pro Charge aus einer 150-m-Drop-stitch-Rolle), mit Kleinserien-Co-Branding ab 5–10 Einheiten. Muster gehen in 7–12 Tagen raus; die Produktion läuft 25–35 Tage nach Auftrag und Anzahlung. CE-Zertifizierung für EU-Marktmodelle und vollständige Konformitätsdokumentation sind in jeder Bestellung enthalten.'
  verified: 'September 2026'
  image:
    src: https://assets.supsfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Individuelles OEM-Paddel mit Markenlogo
