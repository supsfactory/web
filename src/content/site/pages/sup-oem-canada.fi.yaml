  subtitle: 'Näyte 7–12 päivässä, tuotanto 25–35 päivässä, merirahti 4–6 viikkoa Vancouverin, Toronton tai Montrealin satamiin. FOB Qingdao, CIF tai DDP — sama tehdas, sama laadunvalvonta, sama kuusivaiheinen kehittelyprosessi kuin jokaiselle iSupfactoryn asiakkaalle.'

answer:
  label: 'Suora vastaus'
  text: 'Kanadalaiset brändit tilaavat puhallettavia SUP-laudoja iSupfactorylta vakiosehdoilla: MOQ vahvistetaan projektin konfiguraation perusteella: 1–2 kpl:n näyte-erät varmistavat rakenteen, 20–50 kpl:n pilottierät testaavat markkinaa olemassa olevilla alustoilla, ja vakiomääräinen tuotanto 90–100+ kpl per malli täydestä 150 m drop-stitch-rullasta. Ensimmäinen näyte lähetetään 7–12 päivää määritysten hyväksynnän jälkeen, tuotanto 25–35 päivää vahvistetun tilauksen ja käsirahan jälkeen, ja merirahti lisää 4–6 viikkoa Kanadan satamiin — Vancouver länsirannikolla, Toronto ja Montreal idässä. DDP kattaa tulliselvityksen ja toimituksen varastoosi.'
  verified: 'September 2026'

