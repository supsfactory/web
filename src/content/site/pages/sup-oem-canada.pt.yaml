why_canada:
  tagline: 'Porquê os compradores no Canadá'
  title: 'Construído para as importações canadianas'
  subtitle: 'A fábrica responde às perguntas que marcas e retalhistas canadianos fazem antes do seu primeiro contentor.'
  items:
    - title: 'DDP para custos a destino planificáveis'
      description: 'O DDP inclui desalfandegamento e entrega no teu armazém — direitos, impostos e transporte num montante total em CAD ou USD. A escolha mais popular para os primeiros importadores.'
    - title: 'Ligação com a costa oeste e leste'
      description: 'Calculamos o transporte marítimo para Vancouver ou para Toronto e Montreal via rota de Suez — conforme o que equilibra melhor tempos de trânsito e custos a destino.'
    - title: 'Documentos de produto utilizáveis em duas línguas'
      description: 'A documentação CE, REACH e aduaneira é preparada para os teus mercados-alvo, para que os teus documentos de produto funcionem para os requisitos de embalagem em inglês e francês.'
    - title: 'Uma fábrica, um sistema de qualidade'
      description: 'Desenvolvimento, amostras, produção e QC acontecem todos na fábrica de 12,500 m² — nenhuma passagem por intermediários, nenhuma amostra que a produção não consiga replicar.'

process_notes:
  tagline: 'Como funciona'
  title: 'Da especificação ao contentor'
  subtitle: 'As mesmas seis fases, quer compres dois contentores por ano ou vinte: especificação, engenharia, amostra, verificação, equipamento, produção — depois entrega FOB, CIF ou DDP.'
  items:
    - title: '1. Envia a tua especificação'
      description: 'Basta uma prancha de referência, um esboço ou uma especificação de concorrente. Verificação técnica e proposta chegam num dia útil.'
    - title: '2. Aprova a amostra'
      description: 'A tua primeira amostra física parte em 7–12 dias com um formulário de aprovação sobre construção, cores de impressão e resultados do teste de pressão.'
    - title: '3. Produção & exportação'
      description: 'Os ciclos ficam concluídos em 25–35 dias com checkpoints QC durante a produção. Packing list, fatura e conhecimento de embarque precedem o navio.'
    - title: '4. Entrega no teu armazém'
      description: '4–6 semanas de transporte marítimo para Vancouver, Toronto ou Montreal — com DDP tratamos nós do desalfandegamento e da entrega até à tua porta.'

faq_section:
  tagline: FAQ
  title: 'Perguntas sobre a importação no Canadá'
  questions:
    - q: Quanto dura o transporte marítimo para o Canadá?
      a: 'Conta com 4–6 semanas do porto de Qingdao aos portos canadianos — Vancouver na costa oeste, Toronto e Montreal a leste — conforme o destino e o plano de partida. Os projetos DDP incluem a timeline completa porta a porta.'
    - q: Enviam em DDP para o Canadá?
      a: 'Sim. O DDP inclui transporte marítimo, desalfandegamento, direitos e impostos, além da entrega no teu armazém — um preço total planificável. Também estão disponíveis FOB Qingdao e CIF.'
    - q: Qual é a MOQ para uma importação de SUP private label?
      a: 'A MOQ é confirmada pela configuração do projeto: o desenvolvimento das amostras cobre 1–2 peças, as pequenas séries piloto rodam com 20–50 peças em plataformas existentes e a produção de série padrão roda com 90–100+ peças por design a partir de um rolo drop-stitch completo de 150 m.'
    - q: Apoiam a embalagem em inglês e francês?
      a: 'Sim. A nossa equipa de pré-impressão prepara os dados de impressão para as línguas e regulamentos dos teus mercados-alvo — incluindo a embalagem bilingue EN/FR para o mercado canadiano.'
    - q: Posso visitar a fábrica antes da encomenda?
      a: 'Sim. A fábrica de 12,500 m² em Qingdao está aberta aos clientes — as visitas virtuais à fábrica podem ser agendadas online e as visitas presenciais são guiadas pelas linhas de produção e estações QC.'
    - q: Como inicio um projeto a partir do Canadá?
      a: 'Envia uma prancha de referência, um esboço ou uma especificação. A verificação técnica e a proposta chegam num dia útil e antes de qualquer troca de ficheiros é assinada uma NDA.'

