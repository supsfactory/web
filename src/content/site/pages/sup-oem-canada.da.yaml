hero:
  tagline: 'Canada'
  title: 'Oppustelig SUP OEM til Canada — fra Qingdao til dit lager'
  subtitle: 'Prøve på 7–12 dage, produktion på 25–35 dage, søfragt på 4–6 uger til havnene i Vancouver, Toronto eller Montreal. FOB Qingdao, CIF eller DDP — samme fabrik, samme QC, samme seksfasede udviklingsproces som alle iSupfactory-kunder.'

answer:
  label: 'Kort svar'
  text: 'Canadiske mærker bestiller oppustelig SUP hos iSupfactory på standardvilkår: minimumsordren (MOQ) fastlægges ud fra projektkonfigurationen: prøvekørsler på 1–2 stk. validerer bygningen, pilotbatcher på 20–50 stk. tester markedet på eksisterende platforme, og serieproduktion kører 90–100+ stk. pr. design ud fra en fuld drop-stitch-rulle på 150 m. Den første prøve afsendes 7–12 dage efter specifikationsgodkendelse, produktionen kører 25–35 dage efter bekræftet ordre og depositum, og søfragten tilføjer 4–6 uger til canadiske havne — Vancouver på vestkysten, Toronto og Montreal i øst. DDP dækker toldbehandling og levering til dit lager.'
  verified: 'September 2026'

