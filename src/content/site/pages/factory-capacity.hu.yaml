workshops:
  - title: SUP deszkák gyártása
    description: '4 automata összeállítósor felfújható SUP deszkákhoz, havi összesen körülbelül 10.000 deszka teljesítménnyel. A digitális nyomtatóállások és a szitanyomás egyszerre működnek. Éves SUP kapacitás: 120,000+ deszka.'
    output: '120,000+ SUP/év'
  - title: SUP deszkák gyártása – bővítő sorok
    description: 'Kiegészítő automata sorok SUP deszkákhoz, amelyek a volumen növekedésével aktiválódnak. A drop-stitch magok ragasztása, a digitális nyomtatás és az összeállítóállások egyszerre működnek.'
    output: 'Az éves 120,000+ SUP deszkakapacitás egy része'
  - title: SUP kiegészítők és vegyes összeállítás
    description: 'Többfunkciós összeállítósorok SUP kiegészítőkhöz – evezők, uszonyok, biztonsági kötelek, táskák és készletek. A meleglevegős hegesztőállások, az RF dielektromos sajtók és az összeállítóállások a megrendeléskombinációhoz igazítva állnak át. Éves kiegészítőkapacitás: 5,000+ darab.'
    output: '5,000+ kiegészítő/év'
  - title: Biztonsági felszerelés
    description: 'Külön, magas tisztaságú gyártási terület mentőmellényekhez és biztonsági felszereléshez. Dedikált varró-, habbetöltő- és tesztállások. Éves mentőmellény-kapacitás: 50,000+ darab.'
    output: '50,000+ mentőmellény/év'

oem_capacity:
  moq: 'SUP: minta 1–2 | pilóta 20–50 | térfogat 90–100+ (150 m tekercsenként)'
  lead_time: 'Standard 25–35 nap. Minta 7–12 nap. Sürgős kivitelezés lehetséges.'
  payment: 'T/T 30% előleg + 70% fennmaradó érték. L/C és Western Union is elfogadott.'

lead_time_explainer:
  tagline: 'Tervezés és ütemezés'
  title: 'Hogyan alakul a kapacitás az Ön átfutási idejévé'
  subtitle: 'A kapacitás nem egyetlen szám – így osztjuk ki valójában az átfutási időket.'
  items:
    - title: 'A kapacitás a specifikációktól függ'
      body: 'A rendelkezésre álló kapacitás a deszka típusától, a kivitelezés összetettségétől, a csomagolástól és a szezonális kereslettől függ. A tavaszi és nyári csúcsidőszakban a sorok közel maximális kapacitáson működnek, és a mintahelyek foglalnak el elsőként.'
    - title: 'Tervezzen az indulási szezon előtt'
      body: 'Foglaljon időben a mintajóváhagyásra és a grafika befagyasztására. Az ismétlődő megrendelések a referencia-minta archiválásakor megállapított ismétlődő időablakba kerülnek.'
    - title: 'Három ütemezési út'
      body: 'A minták először a prototípussorra kerülnek, az első megrendelések a legközelebbi szabad összeállítási időablakba vannak ütemezve, az ismétlődő megrendelések pedig a saját ismétlődő időablakukban teljesülnek.'
    - title: 'Vállalt átfutási idő csak értékelés után'
      body: 'A szállítási határidőt csak a specifikációk, a grafika, a csomagolás és a mennyiség értékelése után erősítjük meg – soha előre rögzített ígéretként.'

cta:
  title: 'Ellenőrizze a gyártási kapacitást az Ön indulási dátumára'
  subtitle: 'Küldje el a deszka típusát, a mennyiséget és a tervezett szállítási dátumot – válaszul megadjuk a következő szabad gyártási időablakot és az átfutási idő firmán ajánlatát.'
  actions:
