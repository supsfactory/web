manufacturing_scope:
  heading: 'Üretim Kapsamı'
  body: |
    Üretim kapsamımız, şişirilebilir SUP ve deniz ürünlerinin tüm üretim zincirini kapsar — hammadde giriş denetiminden son ambalajlama ve ihracat belgelerine kadar.

    - **Ürün kategorileri**: Şişirilebilir SUP tahtaları (all-around, touring, surf, fishing, yoga, yarış), şişirilebilir kayaklar, şişirilebilir tekneler, kürekler, pompalar ve aksesuarlar.
    - **Yapı tipleri**: Tek katman PVC, çift katman PVC, PVC kabuklu drop-stitch çekirdek. Proje bazında özel yapı teknik şartnameleri.
    - **İş birliği modelleri**: OEM (alıcıya ait tasarım), ODM (fabrika tarafından alıcı brifinginden geliştirilen), özel marka / ortak marka (kanıtlanmış platformlara marka uygulaması).
    - **Sertifikalar**: ISO 9001:2015 (fabrika kalite yönetimi), CE (AB’ye yönelik modeller, kapsam proje bazında), BSCI (sosyal uyum), REACH (kimyasal güvenlik), RoHS (kısıtlı maddeler).
    - **Üretim kapasitesi**: Yılda 120.000+ tahta, 4 otomatik hatta aylık yaklaşık 10.000 adet çıktı. Önceden planlanarak kapasite artışı mümkündür.

brand_positioning:
  heading: 'Marka Konumlandırması'
  body: |
    iSupfactory pazarda belirli bir konum işgal eder — bir marka değil, bir üreticiyiz. Bu ayrım faaliyet biçimimizin her boyutunu şekillendirir:

    - **Kendi markamızla asla satış yapmayız.** Ürettiğimiz her tahta alıcının markasını taşır. Hiçbir pazarda, hiçbir kanalda müşterilerimizle rekabet etmeyiz. Bu politika pazarlık konusu değildir.
    - **Bir ticaret şirketi değiliz.** Fabrikayı kendimiz işletiyoruz. Kalite kontrol, mühendislik, üretim planlaması ve ihracat belgelerinin tamamı içeride yürütülür. Siparişiniz ile üretim hattı arasında aracı yoktur.
    - **Şişirilebilir ürünlerde uzmanlaşıyoruz.** Bu, ikincil bir faaliyet ya da çok sayıda kategori arasındaki tek bir ürün grubu değildir. Şişirilebilir SUP ve deniz ürünleri bizim temel yetkinliğimizdir. Her makine, her süreç ve her QC kapısı bu ürün kategorisi için optimize edilmiştir.
    - **Profesyonel alıcılara hizmet veriyoruz.** Müşterilerimiz markalar, distribütörler, tesis işletmecileri, kulüpler ve okullardır — bireysel tüketiciler değil. Fiyatlandırmamız, MOQ yapımız, belgelerimiz ve iletişimimiz B2B ilişkiler için tasarlanmıştır.

evidence_review:
  tagline: 'Kanıt ve Doğrulama'
  title: 'DOĞRULANMIŞ TEKNİK ŞARTNAMELER'
  body: 'Bu sayfadaki tüm kurumsal ve üretim iddiaları doğrulanabilir durumdadır. ISO 9001 sertifikası, BSCI raporu, işletme ruhsatı ve fabrika tescil belgeleri talep üzerine sunulur. Fabrika ziyaretlerine memnuniyetle karşı veriyoruz. Teknik şartnameler en son Eylül 2026’da doğrulanmıştır.'

faqs:
  tagline: SSS
  title: 'Marka Kimliği — Sıkça Sorulan Sorular'
  items:
    - q: 'iSupfactory, Qingdao Vatrad Group’dan ayrı bir şirket mi?'
      a: 'Hayır. iSupfactory, Qingdao Vatrad Group Co., Ltd.’nin deniz ürünleri üretim birimi olan Vatrad’ın alıcıya dönük markasıdır. Tüm siparişler için sözleşme tarafı Qingdao Vatrad Group Co., Ltd.’dir. Fabrika, ekip ve kalite sistemi tek bir işletmedir.'
    - q: 'Tahtaları kendi markanızla satıyor musunuz?'
      a: 'Hayır. Üretimi yalnızca müşterilerimizin markalarıyla yaparız ve hiçbir pazarda onlarla rekabet etmeyiz. Bu, geçici bir konum değil temel bir politikadır. Piyasada iSupfactory markalı bir tahta görürseniz, o ürün bizim fabrikamızdan değildir.'
    - q: 'Fabrikayı ziyaret edebilir miyim?'
      a: 'Evet. Fabrika ziyaretlerine memnuniyetle karşı veriyoruz ve tüm üretim sürecini, QC kapılarını, malzeme deposunu ve belge incelemesini kapsayan yapılandırılmış bir denetim planlayabiliriz. Ziyaret planlamak için bizimle iletişime geçin.'
    - q: 'Vatrad ile iSupfactory arasındaki ilişki nedir?'
      a: 'Vatrad, Qingdao Vatrad Group içindeki üretim birimi adıdır. iSupfactory ise OEM, ODM ve özel marka üretim hizmetleri için kullanılan uluslararası alıcıya dönük markadır. İkisi de aynı işletmeyi ifade eder — Qingdao, Laixi’deki deniz ürünleri üretim birimi.'

