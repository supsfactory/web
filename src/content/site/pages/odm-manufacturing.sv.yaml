hero:
  tagline: ODM-produktion
  title: 'SUP-ODM-tillverkare — design och produktutveckling'
  subtitle: 'Du behöver ingen färdig SUP-design. Börja med en produktidé, ett marknadskrav eller ett prestandemål — våra ingenjörer i egen regi designar skalp, konstruktion, grafik och förpackning utifrån din briefing, tar fram prover på 7–12 dagar och producerar 25–35 dagar efter orderbekräftelse.'

answer:
  label: 'Kort svar'
  text: 'iSupfactory är en SUP-ODM-tillverkare i Qingdao, Kina. ODM-utvecklingen börjar med din briefing, inte med dina ritningar: skalpdesignen (längd, bredd, rocker, volym), materialstrukturen och grafiken designas internt, valideras med prover på 7–12 dagar och tillverkas i standardmängder på 90–100 enheter per rulle med 150 m (pilot på 20–50 enheter). Produktionen tar 25–35 dagar efter orderbekräftelse och handpengar; formbygget för anpassade former lägger till 15–20 dagar. Dokumentation för CE, ISO 9001, BSCI, REACH och RoHS medföljer varje beställning.'
  verified: 'September 2026'

