      icon: 'tabler:waves'
    - title: Strukturell konstruktion
      description: 'Drop-stitch-densitet, antal och kvalitet på PVC-lagren, placering av förstärkningar och railkonstruktion — specificerat och validerat för din design.'
      icon: 'tabler:building-factory'
    - title: Grafik och varumärkessättning
      description: 'Brädgrafik, logotypplaceringar, EVA-deckpads och kommersiella förpackningar, utvecklade av vårt designteam kring ditt varumärke.'
      icon: 'tabler:palette'
    - title: Formutveckling
      description: 'Nya skalpformer startar som formbygge, internt designat och fräst — utrustningen lägger till 15–20 dagar i projektplaneringen.'
      icon: 'tabler:shapes'
    - title: Prototypvalidering
      description: 'Ett fysiskt prototype byggs, testas och skickas till din bedömning med vattentest — normalt inom 7–12 dagar.'
      icon: 'tabler:tools'
    - title: Test och överensstämmelse
      description: 'Lufttätning, tryckhållning och svetsstyrka per enhet, med överensstämmelsedokumentation för ISO 9001, BSCI, REACH, RoHS och CE för målmarknaden (omfattning bekräftas per projekt).'
      icon: 'tabler:certificate'
    - title: Alternativ för formägande
      description: 'Formägande eller klausuler om överlåtelse regleras i kontraktet — din design förblir din och formerna ligger redo för återtryck.'
      icon: 'tabler:lock'
    - title: Från prototype till container
      description: 'En validerad ODM-design går direkt till standardproduktion i volym: 90–100+ enheter per rulle med 150 m, 25–35 dagar efter orderbekräftelse.'
      icon: 'tabler:package'

customization:
  tagline: 'Designad med dig'
  title: 'Vad vi utvecklar utifrån din briefing'
  subtitle: 'ODM betyder att produkten designas för dig från grunden eller från vår plattformsbibliotek — detta är punkterna som din briefing styr:'
  items:
    - 'Användarprofil och marknad — positionering för nybörjare, touring, tävling, yoga, fiske eller multifunktionell användning'
    - 'Brädmått — längd, bredd, tjocklek och volym, kalibrerade för referensanvändare och användning'
    - 'Skalpens karaktär — rocker, railprofil, form på nos och stjärta, kalibrerad för stabilitet eller fart'
    - 'Materialstruktur — drop-stitch-densitet, antal och kvalitet på PVC-lagren, förstärkningar och railförstärkningar'
    - 'Grafik och färger — varumärkesfärger, brädgrafik och logotypplaceringar, internt utvecklade'
    - 'Halksäkert EVA-deckpad — layout, färger och logotypintegration på decket'
    - 'Tillbehörspaket — paddlar, pumpar, fenor, leashar och väskor, kalibrerade för brädan'
    - 'Kommersiell förpackning & POS-material — kommersiella förpackningar, displayer och exportförpackning under ditt varumärke'

faq_section:
  tagline: FAQ
  title: Frågor om ODM-utveckling
  questions:
    - q: Vad är skillnaden mellan ODM och OEM?
      a: 'ODM (Original Design Manufacturing) börjar med din briefing — våra ingenjörer utvecklar brädans struktur, konstruktion, grafik och förpackning, oavsett om det utgår från ett marknadskoncept, ett prestandemål eller en vidareutveckling av en bevisad plattform. Du godkänner designen före produktionen. OEM (Original Equipment Manufacturing) tillverkar enligt din godkända specifikation — dina ritningar, mått, material och förpackning. Du äger designen och den immateriella äganderätten. Båda spåren går genom samma fabrik, samma QC-system och samma exportteam; ODM är snabbaste vägen till en märkt bräda när du ännu inte har någon design.'
    - q: Jag har bara en grov idé — var börjar vi?
      a: 'Skicka en kort briefing: referensanvändare, användningsområden, indikativt mått, marknader och antal. Våra ingenjörer svarar inom en arbetsdag med ett koncept, en designriktning och en utvecklingsplan — ett NDA undertecknas på begäran före varje utbyte av detaljer.'
    - q: Hur länge tar utvecklingen av en ny SUP-bräda?
      a: 'Prototyprover skickas inom 7–12 dagar. En ny skalp med eget formbygge lägger till 15–20 dagars konstruktionsarbete före proverna. Produktionen tar 25–35 dagar efter beställning och handpengar.'
    - q: Vad är MOQ för en ODM-bräda?
      a: 'Produktion i standardmängder sker med 90–100 enheter per 150 m drop-stitch-rulle; pilotkörningar startar från 20–50 enheter på befintliga plattformar. Co-branding för små partier startar från 5–10 enheter — hela beräkningen finns i vår guide om MOQ och flexibel varumärkessättning.'
    - q: Vem äger designen och formverktyget?
      a: 'Din briefing, din design och din utrustning skyddas av NDA, villkoren för varumärkeslicensen och klausulerna om ägande eller överlåtelse av formverktyg i kontraktet. Formverktygen förvaras för ditt varumärke och är överlåtbara.'
    - q: Kan ni utveckla en specifik form (touring, fiske, tävling, yoga)?
      a: 'Ja. Skalpkonstruktionen täcker alla stora SUP-kategorier — allround, touring, tävling, yoga, fiske och flerpersonersbrädor — med validering i den hydrodynamiska testdammen för prestandaformer.'
    - q: Vilka certifieringar har den utvecklade brädan?
      a: 'ISO 9001:2015 kvalitetsledning (på fabriksnivå), BSCI social efterlevnad (amfori-fabriksrevision), CE-överensstämmelsedokumentation för de konfigurationer som omfattas av EU-marknaden (direktivet om fritidsbåtar — omfattning bekräftas per projekt), REACH (material), RoHS (elektroniska tillbehör) och ISO 25649 för de tillämpliga uppblåsbara SUP-modellerna. Intygshandlingarna tas fram per beställning för dina exportmarknader.'

process:
  title: 'ODM-processen — från briefing till produktion i skala'
  subtitle: 'Sex styrda faser, ledda av samma team som designar, provtar och skalar upp din bräda — allt dokumenteras.'
  steps:
    - phase: '01'
      title: Briefing och koncept
      period: 1 arbetsdag
      items:
        - 'Dela referensanvändare, användningsområden, mått, marknader och antal — eller bara en idé.'
        - 'Våra ingenjörer levererar en konceptriktning, plattformsalternativ och en utvecklingsplan.'
    - phase: '02'
      title: Skalp- och strukturdesign
      period: Vecka 1–2
      items:
        - 'Brädmått, skalpkaraktär, drop-stitch-densitet och PVC-struktur — internt designat.'
        - 'Grafik, EVA-decklayout och förpackningskoncept utvecklade kring ditt varumärke.'
    - phase: '03'
      title: Formverktyg och utrustning
      period: +15–20 dagar (nya formverktyg)
      items:
        - 'Eget formbygge för nya skalpformer; befintliga plattformar hoppar över denna fas.'
        - 'Villkoren för formägande fastställs i kontraktet innan fräsningen påbörjas.'
    - phase: '04'
      title: Prototyp och prov
      period: 7–12 dagar
      items:
        - 'Ett fysiskt prototype byggs, testas och skickas till din bedömning — inklusive vattentest.'
        - 'Provet (1–2 enheter) validerar form, konstruktion och varumärkessättning före volymen.'
    - phase: '05'
      title: Validering och godkännande
      period: Parallellt
      items:
        - 'Lufttätning, tryckhållning, svetsstyrka, belastnings- och UV-tester för varje produktionslinje.'
        - 'CE-, ISO 9001-, BSCI-, REACH- och RoHS-dokumentation tas fram för dina exportmarknader.'
        - 'Du godkänner prototypen; beställningen och handpengen reserverar produktionsplatsen.'
    - phase: '06'
      title: Produktion och leverans
      period: 25–35 dagar
      items:
        - 'Standardmängder körs med 90–100+ enheter per rulle på 150 m, pilotkörningar med 20–50 enheter.'
        - 'Exportförpackning, leverans FOB/CIF/DDP till över 50 länder och stöd vid återtryck ingår.'

