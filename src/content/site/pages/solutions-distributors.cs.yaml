answer:
  label: 'Přímá odpověď'
  text: 'Distributoři a značky jednají přímo s továrnou: desky SUP white-label pod Vaší značkou, velkoobchodní ceny přímo z továrny, exkluzivní teritorium v rámci každého programu, 3–8 SKU na start a platební lhůtu 45–60 dnů (všechny podmínky dle obchodní dohody), přičemž 100% skladového zboží projde tlakovou zkouškou před odesláním. Minimální startovní objemy a podmínky nákladu se dohodnou pro každé teritorium, dodání FOB Qingdao, nebo CIF.'
  verified: 'září 2026'

intro:
  tagline: 'O programu'
  title: 'Distribuce private label založená na výrobních kapacitách'
  body: |
    iSupfactory navrhuje, vyrábí a kontroluje kvalitu každého nafukovacího SUP, kajaku a doplňku ve vlastní provozovně v Laixi v Qingdao. Dohoda o private label s námi znamená, že zdroj dodávek je zabudován do Vaší značky: dostáváte desky vyrobené továrnou pod Vaším jménem, a nikoli přeprodávaný zásobník jiného distributora.

    Protože plánujeme výrobu podle předpovědí klientů, dokážeme navázat velké dávky na začátek sezóny na severní polokouli, zafixovat náklady na dopravu díky předobjednávkám a uvolnit pracovní kapitál díky transparentním velkoobchodním podmínkám a dohodnutému platebnímu kalendáři. Konstrukční řešení, vzorkování, kontrola kvality a vývozní dokumentaci zajišťujeme vlastními silami — v řetězci není žádný zprostředkovatel ani obchodník.

    Tento program je jedním ze dvou způsobů, jak s továrnou pracovat. Pokud rozvíjíte vlastní velkoobchodní značku a chcete, aby ji vyrobili pro Vás, je tato stránka určena právě Vám. Resorty, školy a půjčovny, které nakupují přímo pro vlastní potřebu, by si místo toho měly prostudovat výrobu OEM/ODM a flotové programy.

