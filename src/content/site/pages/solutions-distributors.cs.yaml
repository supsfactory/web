faqs:
  tagline: FAQ distributora
  title: 'Velkoobchodní distribuční program — časté dotazy'
  items:
    - q: 'Jaké je minimální množství objednávky pro nového distributora?'
      a: 'Noví partneři v distribuci obvykle začínají objednávkou vzorků a předprodukčním odsouhlasením, po němž následuje první kontejner navázaný na jejich sezónu. Přesné minimy závisí na velikosti teritoria a zvoleném sortimentu; Váš manažer potvrdí startovní objem při plánování sortimentu a brandingu.'
    - q: 'Můžeme prodávat desky pod vlastní značkou?'
      a: 'Ano. Private label je zde standardní model: desky se vyrábějí pod Vaší značkou s Vaší grafikou, obalem a parametry. iSupfactory vyrábí výhradně pro své klienty a s nimi na žádném trhu nesoutěží.'
    - q: 'Jsou teritoria exkluzivní?'
      a: 'Ano. Distribuční programy stojí na exkluzivních teritoriích — každý velkoobchodní partner pokrývá určitou zemi, nebo region a získává ceny a podporu programu pro daný trh, jak je uvedeno v obchodní dohodě.'
    - q: 'Podporujete přímou dodávku?'
      a: 'Možnost přímé dodávky je součástí programu. Vzorky, obal a zpracování objednávek se validují ve fázi schvalování vzorků, takže objednávky s přímou dodávkou běží bez problémů od prvního dne.'
    - q: 'Jaké modely můžeme objednat?'
      a: 'Výrobní katalog zahrnuje nafukovací desky SUP všech tvarů — univerzální, turistické a surfovací modely, nafukovací kajaky, pumpy, vesla, záchranné vesty a příslušenství pro údržbu, stejně jako vlastní formy vyvinuté spolu s naším konstrukčním týmem. Většina partnerů začíná s 4–8 nejprodávanějšími SKU a sortiment v následujících sezónách rozšiřuje.'
    - q: 'Jak se objednávky odesílají?'
      a: 'Objednávky opouštějí továrnu podle plánu plaveb, přičemž je k dispozici předobjednávka pro zafixování nákladu na dopravu. Váš vyčleněný manažer naplánuje výrobu a odeslání podle Vaší předpovědi a sezónního kalendáře.'
    - q: 'Jak podat žádost?'
      a: 'Použijte žádostní formulář na této stránce, nebo se na nás obraťte přímo. Žádosti posuzuje distribuční tým a do několika pracovních dnů vám odpovíme s dalšími kroky, včetně určení teritoria a návrhu dohody.'

