hero:
  tagline: Teknologia
  title: Suunniteltu suorituskykyä varten
  subtitle: Jokainen Vatradin puhallettava SUP on suunniteltu drop stitch -rakenteella ja meriluokan PVC:llä — tarkat materiaalit ja valmistusmenetelmät, jotka on testattu vaativissa meriympäristöissä.

sections:
  - title: Drop-stitch-ydin
    description: Tuhansia sisäisiä polyesterisäikeitä yhdistää ylä- ja ala kerroksen muodostaen jäyän rakenteen 12-15 PSI:n paineella. Tämä on sama tekniikka, jota käytetään ammattilaisen meloissa ja puhallettavissa kilpailu-SUP-laudoissa.
    imageAlt: DS-ydinkaavio
  - title: Meriluokan PVC
    description: Monikerroksinen laminoitu PVC-kangas, joka on mitoitettu meriympäristöihin. Jokainen kerros sulahitsataan liimauksen sijaan, mikä poistaa delaminaation riskin. Testattu UV-kestävyyteen, suolavesikorroosioon ja hankautumiseen.
    imageAlt: PVC-kerros
  - title: Sotilasluokan PVC
    description: 'Käytetään kaikissa SUP-malleissa: premium-PVC tarjoaa ylivertaisen UV- ja kemiallisen kestävyyden. Säilyttää joustavuuden äärimmäisissä lämpötiloissa ja kestää kunnon heikkenemistä.'
    imageAlt: PVC
  - title: Ilmakansi
    description: Korkean paineen puhallettava drop-stitch-rakenne, joka tarjoaa poikkeuksellisen jäykkyyden seisomiseen, kalastukseen ja joogaan. Lyhentää pystytysaikaa ja vähentää kokonaispainoa ja säilytystilavuutta.
    imageAlt: Ilmakansi

