meta:
  title: 'Teknologia — drop stitch ja meri-PVC | {SITE}'
  description: 'Vatradin teknologiat: drop stitch -rakenne, meri-PVC, kaksikerroksiset rakenteet ja korkea paine. Innovaatiota ammattilaiselta puhallettavien SUP-lautojen valmistajalta.'
  dateModified: '2026-08'
  keywords:
    - 'sup-teknologia'
    - 'drop stitch -rakenne'
