answer:
  label: 'Přímá odpověď'
  text: 'MOQ se potvrzuje podle konfigurace projektu: maloobchodní značky začínají vzorkem (1–2 kusy), nebo pilotní dávkou (20–50 kusů, vzorky za 7–12 dnů), pokračují standardní sériovou OEM dávkou 90–100+ kusů na každý návrh (25–35 dnů po PO a záloze), nebo investují do vlastní formy pro zcela bespoke řady (nástroje přidávají 15–20 dnů). Každá deska projde tlakovou zkouškou před odesláním, s podmínkami FOB, CIF, nebo DDP z Qingdao.'
  verified: 'září 2026'

margin_section:
  title: 'Výrobní fáze pro maloobchodní značky'
  subtitle: 'Začněte vzorkem, proveďte pilotáž pro validaci, přejděte na standardní sériovou dávku, nebo investujte do vlastní formy — MOQ a termíny určuje výrobní trasa, nikoli odhady.'
  items:
    - tier: 'Fáze vzorku'
      moq: '1–2 ks'
      margin_note: 'Výroba vzorku trvá 7–12 dnů'
      features:
        - 'Vývoj grafiky podle materiálů Vaší značky'
        - 'Fyzický vzorek k odsouhlasení'
        - 'Kontrola kvality na standardní platformě'
    - tier: 'Pilotní fáze'
      moq: '20–50 ks'
      margin_note: 'Validace trhu na skladových platformách'
      features:
        - 'Grafika na celou desku, logo a rozložení EVA'
        - 'Opakované objednávky na stejných ověřených platformách'
        - 'Vývozní dokumentace v ceně'
    - tier: 'Vlastní forma'
      moq: 'Potvrzuje se podle konfigurace projektu'
      margin_note: 'Nástroje přidávají 15–20 dnů'
      features:
        - 'Nový tvar desky a vývoj formy'
        - 'Úplná kontrola specifikací'
        - 'Prioritní rozdělení výrobních kapacit'

