faqs:
  - question: 'Care este mai durabilă: o placă gonflabilă sau una rigidă?'
    answer: Plăcile SUP gonflabile sunt, în general, mai durabile, deoarece rezistă la lovituri, fisuri și deteriorări mecanice care ar afecta ireversibil o placă rigidă.
  - question: Este o placă SUP gonflabilă mai potrivită pentru începători?
    answer: Da. Plăcile SUP gonflabile sunt recomandate începătorilor, deoarece sunt mai tolerante la erori, mai ușor de transportat și mai puțin probabil să provoace răni în cazul unei căderi.
  - question: Pot plăcile SUP gonflabile să performeze la fel ca plăcile rigide?
    answer: Pentru vâsli recreational și pe distanțe lungi, plăcile SUP gonflabile egalează performanța plăcilor rigide. Plăcile rigide rămân superioare în cursă și în surfingul avansat, datorită masei mai mici și a elasticității mai bine calibrate.
body: |
  <h2>Diferențe esențiale</h2>
  <p>Plăcile SUP gonflabile (iSUP) și plăcile rigide îndeplinesc același scop fundamental — starea în picioare și vâslirea pe apă — dar prin metode de construcție complet diferite. Alegerea corectă depinde de modul în care intenționați să folosiți placa.</p>

  <table>
    <tr><th>Factor</th><th>SUP gonflabil</th><th>SUP rigid</th></tr>
    <tr><td>Construcție</td><td>PVC drop-stitch, umflat la 12-15 PSI</td><td>Miez de spumă EPS învelit în fibră de sticlă sau epoxid</td></tr>
    <tr><td>Greutate</td><td>18-28 lbs (doar placa)</td><td>20-30 lbs (doar placa)</td></tr>
    <tr><td>Volum împachetat</td><td>Rucsac (30 x 15 x 10 in)</td><td>Lungime completă (10-14 ft)</td></tr>
    <tr><td>Pregătire</td><td>Umflare în 3-5 minute</td><td>Pregătită pentru folosire</td></tr>
    <tr><td>Durată de viață</td><td>5-10 ani cu întreținere corespunzătoare</td><td>3-8 ani (predispusă la lovituri)</td></tr>
  </table>

  <h2>Portabilitate</h2>
  <p><strong>Placa gonflabilă câștigă.</strong> Aceasta este cea mai clară avantaj. O placă SUP gonflabilă încape într-un rucsac care se introduce în portbagajul unui autoturism, în dulapul unui apartament sau în compartimentul de bagaje de la bordul avionului. Călătorii, locuitorii urbani și oricine nu are spațiu de depozitare pe acoperișul vehiculului vor considera plăcile SUP gonflabile mult mai practice.</p>
  <p>Plăcile rigide necesită un suport de acoperiș, un vehicul mare sau un spațiu de depozitare dedicat. Sunt greu de transportat și nu pot fi duse cu avionul fără cazuri speciale de transport.</p>

  <h2>Durabilitate</h2>
  <p><strong>Placa gonflabilă câștigă.</strong> Plăcile SUP gonflabile sunt realizate din PVC de calitate militară, care rezistă la impacturi, perforări și deteriorări produse de radiațiile UV. Când o placă gonflabilă este lovită de sol sau de o piatră, ea ricoșează. O placă rigidă s-ar ciocni, s-ar fisura sau s-ar delamina la același impact.</p>
  <p>Plăcile rigide sunt mai vulnerabile la uzura zilnică. O singură lovitură pe beton poate produce o adâncitură permanentă, care afectează performanța și favorizează pătrunderea apei.</p>

  <h2>Performanță</h2>
  <p><strong>Placa rigidă câștigă în segmentul de performanță maximă.</strong> Pentru vâsli recreativă și pe distanțe lungi la viteze moderate, ambele tipuri de plăci se comportă similar. Plăcile rigide au avantaj în:</p>
  <ul>
    <li><strong>Viteză</strong> —Plăcile rigide sunt mai ușoare și mai rigide, ceea ce se traduce printr-o glisare mai bună și o viteză maximă mai mare</li>
    <li><strong>Surfing</strong> —Plăcile rigide oferă tranziții mai receptive de la șină la șină și o performanță mai bună pe val</li>
    <li><strong>Cursă</strong> —Cursele competitive folosesc aproape exclusiv plăci rigide, datorită avantajelor de masă și rigiditate</li>
  </ul>
  <p>Pentru sportivul recreativ obișnuit, aceste diferențe de performanță sunt nesemnificative. Majoritatea vâsliților nu vor depăși în performanță o placă gonflabilă de calitate.</p>

  <h2>Accesibilitate pentru începători</h2>
  <p><strong>Placa gonflabilă câștigă.</strong> Plăcile SUP gonflabile sunt mai ușor de folosit de începători, deoarece:</p>
  <ul>
    <li>Suprafața mai moale a punții este mai confortabilă și mai puțin probabil să provoace răni în cazul unei căderi</li>
    <li>Plăcile gonflabile mai late și mai groase oferă o stabilitate primară mai bună</li>
    <li>Costul de investiție mai redus face accesul la această activitate mai ușor</li>
    <li>Transportul simplu înseamnă mai multe ocazii de a vâsli</li>
  </ul>

  <h2>Depozitare și întreținere</h2>
  <p>Plăcile SUP gonflabile trebuie uscate și pliate corect înainte de depozitare. Plăcile rigide pot fi depozitate asamblate, dar trebuie protejate de soare, căldură și impacturi. Ambele categorii beneficiază de clătirea cu apă dulce după utilizarea în apă sărată.</p>

  <h2>Recomandare</h2>
  <p><strong>Alegeți o placă SUP gonflabilă dacă:</strong> călătoriți, aveți spațiu de depozitare limitat, vâsliți recreativ sau sunteți începător. 90% dintre vâsliți vor fi bine deserviți de o placă gonflabilă de calitate.</p>
  <p><strong>Alegeți o placă rigidă dacă:</strong> participați la curse competitive, practicați surfing pe valuri avansate sau prioritizați performanța maximă față de portabilitate și durabilitate.</p>

  <h2>Întrebări frecvente</h2>
  <h3>Care este mai durabilă: o placă gonflabilă sau una rigidă?</h3>
  <p>Plăcile SUP gonflabile sunt, în general, mai durabile, deoarece rezistă la lovituri, fisuri și deteriorări mecanice care ar afecta ireversibil o placă rigidă.</p>

  <h3>Este o placă SUP gonflabilă mai potrivită pentru începători?</h3>
  <p>Da. Plăcile SUP gonflabile sunt recomandate începătorilor, deoarece sunt mai tolerante la erori, mai ușor de transportat și mai puțin probabil să provoace răni în cazul unei căderi.</p>

  <h3>Pot plăcile SUP gonflabile să performeze la fel ca plăcile rigide?</h3>
  <p>Pentru vâsli recreativă și pe distanțe lungi, plăcile SUP gonflabile egalează performanța plăcilor rigide. Plăcile rigide rămân superioare în cursă și în surfingul avansat, datorită masei mai mici și a elasticității mai bine calibrate.</p>

