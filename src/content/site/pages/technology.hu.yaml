meta:
  title: 'Technológia — drop-stitch és tengeri PVC | {SITE}'
  description: 'A Vatrad technológiái: drop-stitch szerkezet, tengeri PVC, kétrétegű és nagy nyomású szerkezetek. Innováció egy professzionális felfújható SUP deszkagyárból.'
  dateModified: '2026-08'
  keywords:
    - 'sup technológia'
    - 'drop stitch szerkezet'
    - 'nagy nyomású sup'
