hero:
  tagline: 'Europe'
  title: 'SUP gonflable OEM pour l''Europe — documenté CE depuis Qingdao'
  subtitle: 'Échantillon en 7–12 jours, production en 25–35 jours, fret maritime 4–6 semaines vers Rotterdam ou Hambourg. Documentation CE et REACH préparée avec votre échantillon approuvé — livraison FOB Qingdao, CIF ou DDP.'

answer:
  label: 'Réponse directe'
  text: 'Les marques européennes commandent des SUP gonflables à SUPsfactory selon des conditions standard : le MOQ est confirmé par la configuration du projet : des séries d''échantillons de 1–2 pcs valident la fabrication, des lots pilotes de 20–50 pcs testent le marché sur les plateformes existantes, et la production standard en volume s''exécute à 90–100+ pcs par design à partir d''un rouleau complet de drop-stitch de 150 m. Le premier échantillon part en 7–12 jours après approbation de la spéc., la production s''exécute en 25–35 jours après bon de commande confirmé et acompte, et le fret maritime ajoute 4–6 semaines vers Rotterdam ou Hambourg. La documentation CE et REACH est préparée avec l''échantillon approuvé, et le DDP couvre le dédouanement et la livraison à votre entrepôt.'
  verified: '2026-08'

