answer:
  label: 'Kort svar'
  text: 'Oppblåsbare SUP omfattes av EU-direktivet om fritidsbåter 2013/53/EU når skrog lengden overstiger 2.5 m, eller av direktivet om generell produktsikkerhet dersom de er mindre. For et første produkt koster sertifiseringen rundt 13 000&ndash;31 000 EUR og tar 8&ndash;14 uker: teknisk dokumentasjon, typeprøving hos et meldt organ, fabrikkrevisjon og deretter en samsvarserklæring.'
  verified: 'September 2026'

content_html: |
  <h2>Hva er CE-sertifisering?</h2>
  <p>CE-merkingen (Conformit&eacute; Europ&eacute;enne) viser at et produkt oppfyller EUs krav til helse, sikkerhet og miljø. For oppblåsbare båter avhenger gjeldende regelverk av produktkategorien.</p>

  <h2>Direktiver som gjelder</h2>

  <h3>Direktivet om fritidsbåter (2013/53/EU)</h3>
  <p>Det viktigste direktivet for de fleste oppblåsbare båter, SUP-er og kajaker. Det gjelder fritidsbåter med en skroglengde på 2.5 m til 24 m, for delvis bygde båter (for OEM-leveranse) og for vannmotorer.</p>

  <h3>Forordningen om personlig verneutstyr (2016/425)</h3>
  <p>Flytebunner, livvester og sikkerhetsutstyr som leveres til båter, må oppfylle kravene i PBM-forordningen, inkludert typeprøving (modul B) hos et meldt organ og kvalitetssikring i produksjonen (modul D eller E).</p>

  <h2>Sertifiseringsprosessen</h2>
  <ol>
    <li>Produktklassifisering: fastsett båtens designkategori (A – D iht. ISO 8666)</li>
    <li>Standarder som gjelder: EN ISO 6185 (del 1 – 4), EN ISO 10087 (HIN), EN ISO 14945 (fabrikkmerkeplaten)</li>
    <li>Utarbeidelse av teknisk dokumentasjon: konstruksjonstegninger, BOM, materialsertifikater, risikovurdering</li>
    <li>Typeprøving: bæreevne, stabilitet, lastkapasitet, materialtester, sømstyrke, lufttetthet</li>
    <li>Produksjonskontroll i fabrikken: revisjon av produksjonsprosessene av et meldt organ</li>
    <li>Samsvarserklæring: produsenten undertegner DoC og påfører CE-merkingen</li>
  </ol>

  <h2>Meldte organer for oppblåsbare båter</h2>
  <p>Vanlige meldte organer er Bureau Veritas (Frankrike), DNV GL (Tyskland), RINA (Italia), T&Uuml;V Rheinland / T&Uuml;V S&Uuml;D (Tyskland).</p>

  <h2>Gjennomkjøringstider og kostnader</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Fase</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Varighet</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Typiske kostnader (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Utarbeidelse av teknisk dokumentasjon</td><td class="p-3 border">2 – 4 uker</td><td class="p-3 border">2 000 – 5 000</td></tr>
      <tr><td class="p-3 border">Typeprøving</td><td class="p-3 border">4 – 8 uker</td><td class="p-3 border">8 000 – 20 000</td></tr>
      <tr><td class="p-3 border">Fabrikkrevisjon</td><td class="p-3 border">1 – 2 dager (på stedet)</td><td class="p-3 border">3 000 – 6 000</td></tr>
      <tr><td class="p-3 border">Totalt (første produktet)</td><td class="p-3 border">8 – 14 uker</td><td class="p-3 border">13 000 – 31 000</td></tr>
    </tbody>
  </table>

  <h2>Hva det betyr for kjøpere</h2>
  <p>Når du kjøper CE-sertifiserte oppblåsbare brett, skal du alltid kontrollere at CE-merkingen sitter på fabikkmerkeplaten, at en gyldig DoC er tilgjengelig, at nummeret til det meldte organet er oppgitt, og at brukerhåndboken inneholder sikkerhetsadvarsler på ditt språk. Alle produkter fra Vatrad er CE-sertifiserte med full sporbarhet til revisjonsrapportene fra de meldte organene.</p>
  <p>Sertifiseringen er en del av hver produksjonssyklus i fabrikken vår i Qingdao — se <a href="/no/factory">fabrikkflyten for kvalitet &amp; testing</a> og hvordan vi <a href="/no/oem-manufacturing">støtter CE-samsvar for OEM/private label-partnerskap</a>.</p>

