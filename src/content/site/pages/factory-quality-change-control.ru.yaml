cc_intro:
  tagline: Область действия и политика
  title: Основные принципы управления
  body: |
    **Документ:** QMS-SOP-QC-CC-001 — *Стандарт управления изменениями параметров процесса доработки* (Rev 2.0, официальный выпуск). **Изготовитель:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Ссылка на стандарт:** ISO 9001:2015 Системы менеджмента качества.

    - **Никаких неконтролируемых изменений.** Изменения параметров доработки должны проходить через формальное управление изменениями. Операторы на площадке, бригадиры смены или отдельное подразделение никогда не вправе изменять утверждённые параметры доработки по устной договорённости или записи от руки в журнале доработки.
    - **Покрытие всех элементов.** Контролируемая область охватывает герметичность, седла клапанов, усилители борта, соединение швов, термовоздушное отверждение и испытания с выдержкой давления — каждый параметр, способный повлиять на герметизацию, конструктивную долговечность, внешний вид, приёмку заказчиком или прослеживаемость.
    - **Одобрение заказчика — решающее условие.** Любое изменение, отводящее изделие от утверждённого заказчиком образца, технической спецификации, спецификации материалов, макетов, требований к упаковке или критериев приёмки, внедряется только с письменного одобрения заказчика. Без него доска дорабатывается по исходному требованию, заменяется или отклоняется — завод никогда не «смягчает» требования в одностороннем порядке.

cc_scope:
  tagline: Классификация рисков
  title: Область изменений и классификация рисков
  subtitle: 'Любой из перечисленных ниже случаев запускает формальное управление изменениями — он никогда не решается записью в журнале доработки. Уровень риска определяет, кто согласовывает и сколько валидации требуется.'
  headers:
    category: Категория изменения
    examples: Типичные примеры
    risk: Риск
    requirements: Требования к контролю и согласованию
  rows:
    - category: 'Материалы для доработки'
      examples: 'Клей, растворитель, материал заплаты, уплотнение клапана, грунт или смена поставщика'
      risk: 'Высокий'
      requirements: 'Межотдельное рассмотрение + валидация совместимости материалов и выдержки давления + одобрение заказчика там, где это применимо'
    - category: 'Технологические условия'
      examples: 'Подготовка поверхности, температура и влажность термовоздушного отверждения, давление прижима, длительность выдержки'
      risk: 'Высокий'
      requirements: 'Согласование инженерной службы и качества с валидацией окна температуры и влажности'
    - category: 'Оснастка и измерительные приборы'
      examples: 'Манометры, детекторы протечек, тепловые горелки, инструменты для клапанов, испытательное ПО'
      risk: 'Средний/высокий'
      requirements: 'Проверка действительности калибровки + оценка пригодности оборудования'
    - category: 'Область дефекта'
      examples: 'Расширение зоны доработки; рост поверхностной микропротечки в критические зоны усилителя борта, шва или седла клапана'
      risk: 'Высокий'
      requirements: 'Конструктивные несущие поверхности: обязательная остановка и переоценка'
    - category: 'Методы контроля'
      examples: 'Метод выявления протечек, испытательное давление (18.0 PSI), длительность выдержки (24h)'
      risk: 'Высокий'
      requirements: 'Согласование качества + подтверждение технического согласия с заказчиком'
    - category: 'Документация и авторизация'
      examples: 'Инструкция по доработке, контрольные листы, логика решений по NCR, квалификация оператора'
      risk: 'Средний'
      requirements: 'Контролируемая ревизия документа (Rev A → Rev B) + записи об обучении'

cc_containment:
  tagline: Правило обязательной остановки
  title: Немедленная локализация, когда условия становятся серьёзными
  body: |
    > "Существующий метод доработки должен быть поставлен на рассмотрение и не должен применяться к дополнительной затронутой продукции до тех пор, пока изменение не будет оценено и согласовано, если только документированное временное отступление не одобрено службой качества и инженерной службой."

    Текущий метод доработки должен быть немедленно приостановлен, если повторный контроль после доработки продолжает давать брак, если дефект затрагивает конструктивные несущие зоны (основание клапана, усилители борта, швы, зоны давления в носовой и кормовой частях), если заменяющий материал ещё не валидирован или если текущие параметры противоречат утверждённой заказчиком спецификации.

    Временные отступления никогда не становятся постоянной практикой: каждое из них имеет определённый срок действия, применимую область партий, ограничение по количеству, требования к валидации и механизм автоматического истечения. Устное исключение не является исключением — если оно не задокументировано со сроком окончания, его не существует.

cc_flow:
  tagline: Стандартный замкнутый цикл из 9 шагов
  title: От запроса на изменение до закрытия и хранения
  subtitle: 'Единый документированный цикл для каждого изменения параметра: предложить, отсеять, оценить, согласовать, валидировать, опробовать, проверить, пересмотреть, закрыть.'
  steps:
    - step: '01'
      title: Запрос на изменение (ECR)
      desc: 'Запрос может подать любое подразделение, но спонсором выступает руководство инженерной службы, качества или производства. В ECR фиксируются причины предлагаемого изменения, суть изменений, затронутая область и способ проверки, а также номер управления изменениями, связанный NCR или CAPA, текущий и предлагаемый параметры, затронутые партии и классификация как временного или постоянного изменения.'
    - step: '02'
      title: Первичная отсевка и локализация
      desc: 'Запрос прежде всего отсеивается на предмет немедленной локализации: нужно ли немедленно остановить текущий метод? Если временное отступление допускается, оно ограничено сроком действия, областью партий, предельным количеством и автоматическим истечением.'
    - step: '03'
      title: Оценка воздействия и рисков
      desc: 'Инженерная служба, качество, производство, закупки и цепочка поставок, а также проектный отдел оценивают эксплуатационные характеристики изделия, критерии приёмки, совместимость материалов, внешний вид, технологическую способность, оборудование и измерительные приборы, квалификацию персонала, требования заказчика, объём комплаенса и прослеживаемости.'
    - step: '04'
      title: Совместное рассмотрение и согласование
      desc: 'Согласование следует фиксированной матрице полномочий, а не принципу «кто громче говорит». Высокорисковые изменения требуют межотдельного согласования и, где это необходимо, письменного одобрения заказчика до любых опытных работ.'
    - step: '05'
      title: План валидации
      desc: 'Для высокорисковых изменений до штатного применения требуется утверждённый план валидации: репрезентативные образцы досок, сопоставление текущего и предлагаемого методов, методы испытаний, критерии приёмки, этапы контроля, ответственные лица и график.'
    - step: '06'
      title: Контролируемое опробование и внедрение
      desc: 'Новые документы выпускаются, а устаревшие версии изымаются и помечаются OBSOLETE; новые материалы и измерительные приборы проверяются и калибруются; операторы обучаются и аттестуются; первая партия выполняется при ужесточённом контроле с чёткой идентификацией статуса.'
    - step: '07'
      title: Повторный контроль и анализ результативности
      desc: 'Измеряются и анализируются доля годных изделий после первой доработки, доля успешного повторного контроля, частота повторов и приёмка по внешнему виду — до того, как изменение может считаться результативным; одна отремонтированная доска никогда не рассматривается как валидация процесса.'
    - step: '08'
      title: Ревизия документов и обучение
      desc: 'Рабочие инструкции, контрольные листы, варианты решений по NCR, карточки параметров и учебные материалы обновляются до новой ревизии с зафиксированным практическим обучением и квалификацией операторов.'
    - step: '09'
      title: Закрытие и хранение документов
      desc: '''Изменение закрывается только после рассмотрения и утверждения подтверждений валидации, обновлений документов, записей об обучении и результативности внедрения. Если ожидаемый результат не достигнут, изменение пересматривается, продлевается, приостанавливается или отменяется.'

