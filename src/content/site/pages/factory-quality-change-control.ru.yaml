faqs:
  tagline: FAQ
  title: Часто задаваемые вопросы об управлении изменениями при доработке
  items:
    - q: 'Может ли завод изменить параметры доработки, не сообщив нам об этом?'
      a: 'Нет. Любое предлагаемое изменение утверждённых материалов для доработки, технологических условий, оснастки, методов испытаний, критериев контроля или уполномоченных сотрудников должно сначала пройти документированное управление изменениями. Изменения, затрагивающие утверждённые заказчиком спецификации, образцы, спецификации материалов, макеты или критерии приёмки, требуют письменного одобрения заказчика.'
    - q: 'Какие изменения считаются высокорисковыми?'
      a: 'К высокорисковым относятся изменения материалов для доработки или поставщиков, условий давления, выдержки или отверждения, методов доработки клапанов, усилителей борта и швов, методов контроля или критериев приёмки, а также расширение области дефекта на конструктивные зоны. Они требуют межотдельного рассмотрения, утверждённого плана валидации и контролируемого пилотного внедрения до штатного применения.'
    - q: 'Можно ли использовать временное отступление бессрочно?'
      a: 'Нет. Каждое временное отступление имеет определённый срок действия, область партий, предельное количество и требования к валидации, а также автоматическое истечение. Достижение предела блокирует партию и останавливает печать пропускной бирки до формальной оценки изменения.'
    - q: 'Как доказывается работоспособность изменённого метода до полного применения?'
      a: 'Высокорисковые изменения требуют плана валидации: не менее 5 репрезентативных образцов досок, охватывающих пределы допуска, проверенных 2 независимыми инспекторами ОКК по количественным критериям приёмки (устранение протечки, удержание давления, функционирование клапана, долговечность шва, внешний вид). Согласование на валидацию не означает согласования на применение.'
    - q: 'Нужно ли наше одобрение каждого изменения?'
      a: 'Не каждого, но любое изменение, отводящее изделие от утверждённого заказчиком образца, технической спецификации, спецификации материалов, макетов, упаковки или критериев приёмки, внедряется только с письменного одобрения заказчика. Без него доски дорабатываются по исходному требованию, заменяются или отклоняются.'
    - q: 'Что происходит со старыми документами после утверждения изменения?'
      a: 'Старые рабочие инструкции, карточки параметров и контрольные листы физически изымаются и погашаются по принципу 1-In-1-Out, помечаются OBSOLETE и заменяются новой контролируемой ревизией после обучения. Старая и новая версии никогда не находятся на одном рабочем месте.'
    - q: 'Как долго хранятся записи об управлении изменениями?'
      a: 'Записи о закрытии — подтверждения валидации, ревизии документов, записи об обучении и анализ результативности — хранятся в соответствии с нашей политикой хранения документов (минимум 3 года для записей о закрытии), чтобы каждое изменение оставалось прослеживаемым для аудитов и проверок прослеживаемости.'

