cc_validation:
  tagline: Инженерная валидация
  title: Протокол валидации и приёмки — подтверждения вместо заявлений
  body: |
    Расплывчатые формулировки критериев приёмки вида *«отремонтированная доска должна быть хорошей»* не принимаются. Контролируемая формулировка звучит так:

    > "Отремонтированный образец должен соответствовать тем же применимым критериям герметичности, визуального качества изготовления, функционирования клапана и проекта, что и годная доска, если только одобренное заказчиком отступление не устанавливает альтернативный критерий."

    Подтверждения валидации носят количественный характер, а инженерная база для доработки герметичности включает:

    - **Устранение протечки и удержание давления.** Исходная протечка устраняется без устойчивого пузырения при проверке в мыльном растворе; доска удерживает стандартное испытательное давление 18.0 PSI в течение 24 часов, с чистым падением давления ΔP ≤ 0.2 PSI после компенсации температуры и влажности, — это более жёсткая база для валидации доработки, отличающаяся от порога автоматического брака 0.50 PSI, применяемого при финальной приёмке на производственной линии.
    - **Функционирование клапана.** Момент затяжки сердцевины клапана соответствует спецификации 15–20 N·m, без микропротечек на уплотнении при накачивании высоким давлением и динамическом нажатии.
    - **Прочность соединения шва.** На кромках соединения нет отслоений, побеления или расслоения; после циклов старения при повышенных температуре и влажности клеевой слой не размягчается и не растрескивается.
    - **Внешний вид и качество работы.** Нет следов вытекания клея, повреждений EVA, деформации доски, смещения логотипа или царапин на печатной поверхности.

cc_engineering:
  tagline: Матрица инженерного исполнения
  title: Количественные параметры четырёх ключевых процессов доработки
  subtitle: 'Каждый контролируемый процесс доработки имеет определённые параметры, методику и критерии приёмки — те же значения, которым следуют наши операторы и которые наши заказчики могут проверить во время аудита.'
  headers:
    process: Процесс доработки
    parameters: Контролируемые параметры
    methodology: Методика испытаний
    acceptance: Критерии приёмки
  rows:
    - process: 'Ремонт прокола и микропротечки'
      parameters: 'Очистка растворителем и сушка 3–5 мин; активация горячим воздухом 60°C ± 5°C; прикатный валик ≥ 0.4 MPa'
      methodology: 'Накачивание до 18 PSI; полное погружение в воду или нанесение мыльного раствора; наблюдение в течение 10 минут'
      acceptance: 'Нулевое выделение пузырьков; отрыв кромки на 180° без отслоения и следов вытекания клея'
    - process: 'Повторное соединение усилителя борта и шва'
      parameters: 'Строгий контроль соотношения двухкомпонентного клея; окружающая среда 22–28°C, ≤ 65% RH; зажим в приспособлении ≥ 4 ч'
      methodology: 'Испытание избыточным давлением 22 PSI в течение 2 ч; затем выдержка в термошкафу при 50°C 6 ч и 2 ч при комнатной температуре'
      acceptance: 'Нулевое расслоение, нулевое растрескивание; чистое падение давления ΔP ≤ 0.1 PSI; клеевой слой без побеления и хрупкости'
    - process: 'Ослабление основания клапана и микропротечка'
      parameters: 'Момент затяжки специальным ключом 18–20 N·m; уплотнительное кольцо укладывается плоско без деформации; подтверждена чистота резьбы'
      methodology: 'Накачивание до 15 PSI; 20 циклов накачивания и стравливания; наблюдение при погружении под воду'
      acceptance: 'Нулевые пузырьки у сердцевины клапана и по периметру основания; момент после циклов ≥ 16 N·m'
    - process: 'Финальное 24-часовое испытание с выдержкой давления'
      parameters: 'Контрольное накачивание 18.0 PSI; цифровой манометр класса 1.0 с допуском ±0.5%; температура и влажность в помещении фиксируются и компенсируются'
      methodology: 'Цифровой регистратор давления; непрерывная кривая давления за 24 ч'
      acceptance: 'Чистое падение давления ΔP ≤ 0.20 PSI за 24 ч после компенсации; отсутствие выпучивания или деформации доски'

