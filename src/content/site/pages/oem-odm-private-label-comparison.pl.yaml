      pl: '5–10 szt. (współmarkowanie) lub 20–50 szt. (partia pilotażowa na istniejącej platformie)'
    - dimension: 'Typowy czas realizacji'
      oem: '25–35 dni + 15–20 dni na narzędzia przy nowej formie'
      odm: '25–35 dni + czas iteracji rozwojowych (zależnie od złożoności)'
      pl: '25–35 dni (bez opóźnienia na narzędzia)'
    - dimension: 'Poziom personalizacji'
      oem: 'Pełny — kształt, konstrukcja, materiały, grafika, opakowanie'
      odm: 'Pełny — fabryka proponuje, Ty zatwierdzasz każdy element'
      pl: 'Tylko grafika i opakowanie — bez zmian konstrukcyjnych'
    - dimension: 'Proces próbki'
      oem: '1–2 próbki prototypowe w 7–12 dni po zatwierdzeniu specyfikacji'
      odm: '1–2 próbki prototypowe w 7–12 dni po zatwierdzeniu projektu'
      pl: '1–2 próbki w 7–12 dni — platforma już zwalidowana'
    - dimension: 'Najlepsze dla'
      oem: 'Kupujących z gotowymi projektami, deskami wzorcowymi lub szczegółowymi specyfikacjami'
      odm: 'Kupujących z pomysłami na produkt lub wymaganiami rynkowymi, ale bez szczegółowej specyfikacji'
      pl: 'Kupujących, którym szybko potrzebne są deski z marką, bez rozwoju produktu'

