ip_rules:
  tagline: 'Ochrona własności intelektualnej'
  title: 'Jak chronimy Twoje projekty i markę'
  subtitle: 'Niezależnie od modelu współpracy Twoje pliki graficzne, narzędzia i dokumenty specyfikacji pozostają Twoją własnością.'
  body: |
    **NDA przed wymianą plików.** Podpisujemy umowę poufności przed jakąkolwiek wymianą plików technicznych — standardowy czas reakcji to 4 godziny robocze.

    **Brak ponownego wykorzystania projektów.** Twoje pliki graficzne, narzędzia i dokumenty specyfikacji nigdy nie są udostępniane innym klientom ani im sprzedawane. Formy OEM należą wyłącznie do Ciebie. Projekty ODM zatwierdzasz przed produkcją. Platformy Private Label są konstrukcjami współdzielonymi, ale Twoja grafika i identyfikacja wizualna pozostają wyłączne.

    **Tylko B2B.** Produkujemy wyłącznie pod markami naszych klientów. Nie sprzedajemy do klientów indywidualnych i nie konkurujemy z naszymi klientami na żadnym rynku.

    **Własność formy.** Formy na zamówienie opłacone przez kupującego należą do kupującego. Przechowujemy je i utrzymujemy, ale nie możemy używać ich dla innych klientów bez pisemnej zgody.

faqs:
  tagline: 'FAQ'
  title: 'Częste pytania o OEM, ODM i private label'
  items:
    - q: 'Czy mogę później przejść z private label na OEM?'
      a: 'Tak. Wiele firm zaczyna od private label lub partii pilotażowej, aby zweryfikować rynek, a następnie inwestuje w dedykowane narzędzia w ramach pełnego programu OEM, gdy popyt jest potwierdzony. Ten sam zakład i system QC obsługuje obie ścieżki.'
    - q: 'Czy ODM oznacza, że fabryka jest właścicielem mojej marki?'
      a: 'Nie. W modelu ODM to Ty dysponujesz marką, grafiką i opakowaniem. Fabryka opracowuje konstrukcję deski na podstawie Twojego briefu, a Ty zatwierdzasz projekt przed produkcją. Fabryka zachowuje IP procesu rozwojowego, ale zatwierdzona specyfikacja produktu jest Twoja.'
    - q: 'Czy private label jest niższej jakości niż OEM?'
      a: 'Nie. Wszystkie trzy ścieżki przechodzą przez ten sam zakład, system QC i zespół eksportowy. Deski private label powstają na sprawdzonych, zwalidowanych platformach z pełnym badaniem ciśnieniowym 18 PSI / 24h i tą samą listą kontrolną montażu w 100 punktach.'
    - q: 'Co jeśli nie wiem, który model wybrać?'
      a: 'Skontaktuj się z nami i opisz swoją sytuację — nasz zespół inżynierów zarekomenduje najbardziej praktyczną ścieżkę na podstawie Twoich wymagań produktowych, harmonogramu i celów wolumenowych. Przegląd specyfikacji nie wymaga żadnego zobowiązania.'
    - q: 'Czy mogę otrzymać próbki przed zobowiązaniem się do jakiegokolwiek modelu?'
      a: 'Tak. 1–2 próbki prototypowe wysyłamy w 7–12 dni. Koszt próbki zalicza się na poczet zamówienia hurtowego. Dzięki temu ocenisz konstrukcję i jakość przed jakimkolwiek zobowiązaniem wolumenowym.'

