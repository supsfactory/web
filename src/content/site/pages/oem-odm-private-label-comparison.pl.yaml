      pl: 'Istniejąca platforma fabryki — bez prac projektowych'
    - dimension: 'Własność projektu i IP'
      oem: 'To Ty dysponujesz wszystkimi projektami, formami i własnością intelektualną'
      odm: 'To Ty dysponujesz zatwierdzonym projektem końcowym; fabryka zachowuje IP procesu rozwojowego'
      pl: 'Fabryka dysponuje projektem platformy; to Ty dysponujesz marką i grafiką'
    - dimension: 'Forma / narzędzia'
      oem: 'Nowe kształty wymagają formy na zamówienie — opłata jednorazowa, dodatkowe 15–20 dni'
      odm: 'W zależności od specyfikacji może wymagać formy na zamówienie — ten sam harmonogram narzędzi'
      pl: 'Bez nowej formy — używane narzędzia istniejącej platformy'
    - dimension: 'Minimalna ilość zamówienia (MOQ)'
