faq_section:
  tagline: Verification Questions
  title: Factory Verification & Inspection Q&A
  questions:
    - q: Where is the factory?
      a: 'The plant is in Qingdao, Shandong, China — a 12,500 m² facility with 350+ workers, 4 automated lines and 4 specialized workshops. The address and map are shared with verified buyers when we schedule a visit, and the call-off address appears in contracts, the BSCI audit and export documentation.'
    - q: What does the factory manufacture?
      a: 'Inflatable SUP boards — from hull engineering and drop-stitch core processing to graphics, assembly, testing and export packing. All core SUP processes run under one roof.'
    - q: What processes are performed in-house?
      a: 'Hull design, dimensional engineering, drop-stitch core processing, RF welding, graphics printing, EVA pad die-cutting, custom mould tooling, assembly, testing and packing are all in-house. Accessories and some raw materials come from certified suppliers and are kitted in-house for traceability.'
    - q: Can buyers visit the factory?
      a: 'Yes. Buyer visits are hosted year-round in Qingdao. Airport pickup from Qingdao Jiaodong International Airport and a full factory-floor walk-through are arranged by your project specialist.'
    - q: Can buyers arrange third-party inspection?
      a: 'Yes. SGS, TÜV, BV and Intertek inspections are welcome before or during production. Pre-shipment inspection uses ISO 2859-1 Level II sampling, and the report is sent directly to you from the inspection body.'
    - q: Can buyers request QC documentation?
      a: 'Yes. Certificate copies, incoming/in-process/final inspection records, 18.0 PSI 24-hour pressure-hold reports and the 100-point assembly checklist are issued per batch on request.'
    - q: How is batch traceability managed?
      a: 'Every board carries a serial label. Batches are logged in a 10-year ERP record that links fabric roll, materials, production date, operators and test results to each serial number.'
    - q: How is the approved sample used?
      a: 'The approved sample becomes the production reference. Materials, dimensions, graphics, accessories and finish are matched against it at every QC gate, so production matches what you signed off.'
    - q: How is production quality controlled?
      a: 'A 7-stage quality system (Node 01–07) runs incoming-material, in-process and final inspection gates, with 18.0 PSI 24-hour pressure-hold testing (auto-reject above 0.50 PSI drop) and end-of-line release against ISO 2859-1 Level II sampling.'

