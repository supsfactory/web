hero:
  tagline: Factory Verification
  title: 'Verify the SUP Factory Before You Commit'
  subtitle: 'You should not take a factory on trust. Schedule a visit, run an independent audit or inspection, and review certificates, QC records and batch traceability before your first order — all of it is open to serious buyers.'

answer:
  label: 'Straight answer'
  text: 'The SUPsfactory plant is a 12,500 m² facility in Qingdao, Shandong, China with 350+ workers, 4 automated production lines and 4 specialized workshops. Buyers can verify it four ways: visit the plant year-round, co-host or request audits (BSCI, ISO 9001), run third-party inspection (SGS, TÜV, BV, Intertek; ISO 2859-1 Level II sampling), or review documented evidence — certificates, 100-point assembly checklists, 18.0 PSI 24-hour pressure-hold reports and 10-year ERP batch traceability per serial label.'
  verified: 'September 2026'

