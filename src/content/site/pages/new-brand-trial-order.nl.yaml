answer:
  label: 'Kort antwoord'
  text: 'Ja — je kunt een merk opblaasbare SUP''s lanceren met een proeforder tegen een laag MOQ. De instap is getrapt, niet alles-of-niets: eerst bestel je 1–2 samples (beschikbaar in 7–12 dagen) om romp, graphics en verpakking vast te leggen; daarna een proeforder van 20–50 planken (productie in 25–35 dagen) om de echte verkoop te testen; ten slotte kun je opschalen naar standaardpartijen van 90–100+ planken per rol van 150 m drop-stitch weefsel, zodra het formaat zich heeft bewezen. Co-branding voor kleine partijen start vanaf slechts 5–10 eenheden voor operators die ge-branded planken willen zonder enige ontwikkelfase. Je eerste container komt pas als de data het zeggen.'
  verified: 'September 2026'

trial_included:
  tagline: Wat de proeforder dekt
  title: 'Alles wat een lancering nodig heeft — zonder overhead'
  subtitle: 'Een proeforder is geen kleinere factuur — het gebruikt hetzelfde fabrieksproces, op maat gemaakt voor een merk dat opstart. Dit dekt elk proefprogramma.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Platform en plankconstructie'
      desc: 'Beproefde Touring- en Allround-rompen met drop-stitch constructie, drie-laags railbandlas en stijfheid van 12–15 PSI — dezelfde platforms die we voor onze grootvolume-klanten gebruiken, in de standaardafmetingen van 10 ft tot 11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Jouw branding, echt uitgevoerd'
      desc: 'Volledige digitale of zeefdrukgraphics, antislip EVA-deckpad met jouw logo en secundaire branding op neus of zijrails. Co-branding voor kleine partijen gebruikt de primaire SUPsfactory-branding met jouw logo op neus of rails.'
    - icon: P
      icon_bg: purple
      title: 'Verpakkingsopties die meeschalen'
      desc: 'Je begint met standaarddozen en barcode-etiketten en stapt daarna over op ge-branded commerciële 5-laags kleurendozen. Aangepaste verpakkingen hebben een eigen minimaal drukvolume; overtollige dozen worden opgeslagen en op het juiste moment vrijgegeven.'
    - icon: Q
      icon_bg: orange
      title: 'Kwaliteitscontrole op fabrieksniveau'
      desc: 'Elke plank doorloopt dezelfde assemblagechecklist van 100 punten en een druk- en dichtheidstest van 24 uur (standhouden op 18,0 PSI, automatische afkeur boven 0,50 PSI drukval) — net als bij elke bestelling, of het nu een sample of een container is.'
    - icon: D
      icon_bg: blue
      title: 'Export en documentatie'
      desc: 'Conformiteitsdocumentatie voor CE, ISO-9001, BSCI, REACH en RoHS, exportgeschikte verpakking en coördinatie van de zeevracht naar meer dan 50 landen — van een enkel sample tot volledige programma''s.'
    - icon: T
      icon_bg: green
      title: 'Planbare doorlooptijden'
      desc: 'Samples in 7–12 dagen, proefproductie in 25–35 dagen na orderbevestiging en aanbetaling, plus bevestigde productieslots voor pre-seizoensorders — zodat de lancering in het seizoen valt in plaats van het te missen.'

trial_steps:
  tagline: De lanceringsroadmap
  title: 'Van idee naar eerste verkopen in zes poorten'
  subtitle: 'De eerste typische lancering duurt 8–12 weken van briefing tot levering van de proeforder op bestaande platforms — langer als een eigen romp matrijzenbouw vereist. Elke poort heeft een datum die je vooraf afspreekt.'
  steps:
    - step: 'Poort 1'
      title: 'Productbriefing en technische controle (dag 0–2)'
      desc: 'Deel doelmodel, orderhoeveelheid, ontwerp en verpakkingsintenties. De technische controle vindt plaats binnen één werkdag, met een NDA vóór de uitwisseling van eigendomspecificaties.'
    - step: 'Poort 2'
      title: 'Specificatie, MOQ en offerte (dag 3–7)'
      desc: 'Post-voor-post offerte met een exacte MOQ-berekening, samplekosten en doorlooptijdposten. De samplekosten worden na ondertekening van het contract verrekend met de productiebestelling.'
    - step: 'Poort 3'
      title: 'Samples in 7–12 dagen'
      desc: '1–2 fysieke planken valideren de rompstijfheid, de hechting van het EVA-deckpad, de grafische precisie en de pasvorm van de accessoires. Je test de plank vóór je je op iets anders vastlegt.'
    - step: 'Poort 4'
      title: 'Proeforder met 20–50 planken (25–35 dagen)'
      desc: 'Productie op bestaande rompplatforms met standaardmaterialen en vereenvoudigde verpakking — de minimale commerciële test die de echte retailomstandigheden weerspiegelt.'
    - step: 'Poort 5'
      title: 'Verkoopvenster en feedback'
      desc: 'De belangrijkste poort ligt in jouw markt, niet in onze fabriek: verhuurders en klanten bevestigen plankformaat, graphics en prijsniveau vóór je op opschalen mikt.'
    - step: 'Poort 6'
      title: 'Opschalen naar hoeveelheidsproductie (90–100+ planken)'
      desc: 'Zodra het formaat zich heeft bewezen, bieden standaardrollen van 150 m volledige productie-efficiëntie, ge-branded verpakking en kwantiteitsprijzen. Een containerprogramma is een doel, geen verplichting.'

