trial_faqs:
  tagline: FAQ
  title: 'Veelgestelde vragen over lanceren met een proeforder'
  items:
    - q: 'Kan ik echt een SUP-merk lanceren zonder containorder?'
      a: 'Ja. De instap is getrapt: 1–2 samples valideren de plank (beschikbaar in 7–12 dagen), een proeforder van 20–50 planken valideert de markt (productie in 25–35 dagen) en hoeveelheidspartijen van 90–100+ planken volgen pas als de verkopen het formaat bewijzen. Co-branding voor kleine partijen start vanaf slechts 5–10 eenheden als je zonder ontwikkelfase ge-branded planken wilt.'
    - q: 'Hoe lang duurt een volledige lancering van begin tot eind?'
      a: 'Met bestaande rompplatforms duurt een eerste typische lancering 8–12 weken van productbriefing tot levering van de proeforder: samples in 7–12 dagen, proefproductie in 25–35 dagen na orderbevestiging en aanbetaling. Een eigen romp voegt 15–20 dagen matrijzenbouw toe.'
    - q: 'Wat is in de prijs inbegrepen — en wat niet?'
      a: 'De referentieprijzen gelden EXW Qingdao voor de planken zelf, inclusief branding en standaard-QC. Het zijn indicatieve waarden: de definitieve offerte wordt bevestigd op jouw configuratie — romp, PVC, grafische dekking, verpakking en accessoires — vóór iets bindend wordt. Transport, douanerechten en inklaring op bestemming worden apart geoffreerd.'
    - q: 'Moet ik 100 of 500 planken kopen om mijn logo op de plank te krijgen?'
      a: 'Nee. Co-branding voor kleine partijen zet je logo op neus of zijrails vanaf slechts 5–10 eenheden, en proeforders van 20–50 planken ondersteunen volledige grafische toepassing met dezelfde kwaliteit als de grootproductie. Wat met de hoeveelheid verandert is de prijs per eenheid — niet de beschikbaarheid.'
    - q: 'Wat gebeurt er als ik het ontwerp na de proef wil wijzigen?'
      a: 'Wijzigingen tussen proef en hoeveelheid zijn normaal en welkom — daar dient de proef precies voor. Kleurvarianten, artwork, verpakking en accessoires worden opnieuw berekend voor de nieuwe configuratie en bevroren vóór de hoeveelheidsrun met goedkeuring van artwork en BOM. De matrijkosten voor de zeefdruk vervallen voor volgende orders met hetzelfde artworkformaat.'
    - q: 'Ondertekenen jullie een NDA voordat ik mijn ontwerpen deel?'
      a: 'Ja. Er is een geheimhoudingsovereenkomst (NDA) beschikbaar voordat je eigendoms-technische specificaties of artwork deelt. We produceren uitsluitend onder de merken van onze klanten en concurreren in geen enkele markt met jou — hetzelfde beleid geldt voor een enkel sample als voor een containerprogramma.'

