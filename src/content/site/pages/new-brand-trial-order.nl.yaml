  title: 'Vier manieren waarop een proeforder je lancering veiligstelt'
  subtitle: 'De meeste merklanceringen mislukken op de voorraad, niet op de productkwaliteit. Een proeforder maakt de vermijdbare fouten onmogelijk.'
  features:
    - icon: I
      icon_bg: blue
      title: 'Geen zware magazijnverplichting'
      desc: 'Je eerste seizoensrisico blijft onder de 50 planken. Moet het formaat worden aangepast, dan doe je dat vóór de grote investering — niet erna.'
    - icon: C
      icon_bg: green
      title: 'Cashflow blijft planbaar'
      desc: 'Kleinere orders betekenen kleinere aanbetalingen, gefaseerde betalingen en geen geblokkeerd kapitaal in de voorraad. Kwantiteitsprijzen wachten tot ze echt zijn verdiend.'
    - icon: Q
      icon_bg: purple
      title: 'Kwaliteit wordt nooit verlaagd'
      desc: 'Een proeforder van 20 planken doorloopt dezelfde checklist van 100 punten en dezelfde druktest als een containerprogramma — geen compromis van het type "eerst proeven, dan kwaliteit".'
    - icon: G
      icon_bg: orange
