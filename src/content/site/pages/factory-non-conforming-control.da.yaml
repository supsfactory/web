nc_severity:
  tagline: 'Fejlens alvorgrad og bemyndigelse'
  title: 'Klassificering efter alvorgrad og dispositionsbemyndigelse'
  subtitle: 'Ikke alle afvigelser håndteres på samme niveau — dispositionsbemyndigelsen skalerer med fejlens alvor, fra signatur på linjeniveau til Material Review Board og kundens dispensation.'
  headers:
    severity: Alvorgrad
    examples: 'Typiske eksempler'
    authority: 'Dispositionsbemyndigelse & kontrol'
    control: 'Frigivelsesbetingelse'
  rows:
    - severity: 'Mindre'
      examples: 'Krakeleret kartonhjørne, lettere forkert placering af ikke-kritisk tilbehør'
      authority: 'QA-ansvarlig for sektion + linjeleder signerer på stedet, erstatter eller frigiver'
      control: 'Registreres i NCR’en; ingen påvirkning af produktets funktion eller kundens krav'
    - severity: 'Større'
      examples: 'Langsom lækage fra ventil, EVA-forkert placering ud over tolerancen (>2 mm), manglende tilbehør'
      authority: 'QC-chef + teknisk ingeniør udsteder en kontrolleret genbearbejdningsinstruktion (SRI)'
      control: '100 % uafhængig gentest af den oprindeligt fejlede og de berørte egenskaber før frigivelse'
    - severity: 'Kritisk'
      examples: 'Skade på drop-stitch-kammer, boble eller revne i kant under højt tryk, forkert tryk eller farveafvigelse i kundens logo'
      authority: 'Beslutning i Material Review Board (MRB); skriftlig dispensation fra kunden, hvor det kræves'
      control: 'Ingen frigivelse uden autoriseret dispensation; ellers obligatorisk overværet fysisk ødelæggelse'

nc_matrix:
  tagline: 'Ingeniørmæssig protokolmatrix'
  title: 'Matrix for disposition og geninspektion af SUP-fejl'
  subtitle: 'Standardiserede ingeniørmæssige protokoller til de mest almindelige afvigelser i produktionen — de samme kvantificerede parametre, kunder kan efterprøve ved audits.'
  headers:
    defect: 'Fejlkategori'
    protocol: 'Kontrolleret dispositionsprotokol'
    validation: 'Uafhængig geninspektion og validering'
  rows:
    - defect: 'Langsom lækage fra ventil'
      protocol: 'Adskil brættet. Afmonter ventilkernen med kalibreret momentværktøj (25 N·m), rengør de indvendige gevind, udskift silikon-O-ringen og tilspænd igen med korrekt moment.'
      validation: 'Dyp i bobleopløsning; pump op til 18 PSI igen for en fuld trykfaldstest på 24 t (ΔP ≤ 0.05 PSI).'
    - defect: 'Luftbobler i kantsøm'
      protocol: 'Sæt skiftepartiet i karantæne. Delaminer boblezonen med en varmluftdyse, rens overflaten med opløsningsmiddel og påfør tokomponent PU-lim under 5 bar tryk.'
      validation: '100 % visuel og haptisk inspektion af sømmene; strukturel prøvningstest (18.0 PSI) plus 24 t lufttæthedsprøvning.'
    - defect: 'Forkert placering af EVA-flade'
      protocol: 'Skræl med varmluftassistance med et temperaturreguleret værktøj (80°C). Juster med en præcisionsanordning i akryl til positionering.'
      validation: 'Kontrol af spillerummets tolerancer (≤ ±1.5 mm), kontrol af diametermønsters symmetri, 100 % limprøvning af kanterne.'
    - defect: 'Fejl i branding / logo'
      protocol: 'Stop tryklinjen med det samme. Hold alle trykte paneler. Gennemgå vektorrevisionen med kunden; nul ugodkendte ændringer.'
      validation: 'Farvekontrol med spektrofotometer (ΔE ≤ 1.5); 100 % visuel kontrol af tekstens placering mod den kundesignerede vektor-PDF.'
    - defect: 'Forkert emballage / manglende SKU'
      protocol: 'Sæt eksportpallen i karantæne. Pak ud og foretag en 100 % varespecifik BOM-kontrol (pumpe, finne, sikkerhedsline, pagaj, reparationsslange).'
      validation: 'Validering af inline dynamisk elektronisk kontrolvægt (±30 g afvigelse); optisk verifikation med 2D-barcode-scanner.'

nc_scrap:
  tagline: 'Ingen lækage til markedet'
  title: 'Overværet skroting og ødelæggelse — protokol mod varedivertering med nul fejl'
  body: |
    Vores brandpartnere i udlandet har brug for sikkerhed for, at fejlede brætter aldrig når sekundær detailhandel, grå markeder eller e-handelskanaler. Brætter, der ikke kan bringes i overensstemmelse, ødelægges efter en overvåret og registreret protokol:

    **1. Afskæring af beslag og tilbehør.** Under opsyn af QA-chefen fjerner en hydraulisk saks alle D-ringe i 316-rustfrit stål, bærestropper og spænder. Ventilenheden og finnekassens base (US-Box / snap-in finne) skæres ud ved brættets rod, så ingen dele kan genbruges.

    **2. Opskæring af drop-stitch og deling af kant.** Den indvendige drop-stitchkerne skæres på kryds gennem bund og dæk med dybe krydssnit (≥ 50 cm pr. snit), og de forstærkede sidekanter deles i mindst 4 dele — hvilket permanent ødelægger tætningsevnen og opdriftskraften.

    **3. Video- og fotoregistrering.** Ødelæggelsen registreres som en ubeskåret 1080p-video med nærbilleder af serienummerbarcoden, afskæringen, opskæringen af kernen og den endelige, vejede skrothob. Videoen hashes (SHA-256) og arkiveres på en kontrolleret server i ≥ 5 år.

    **4. Certificeret affaldsbortskaffelse.** Alle PVC- og drop-stitch-fragmenter vejes, registreres i udgående bogholderi og transporteres udelukkende af kvalificerede genbrugspartnere for polymerer — intet restmateriale forlader anlægget gennem nogen anden kanal.

    > **Garantier for beskyttelse af brandet:** QINGDAO VATRAD GROUP CO., LTD. garanterer 100 % ødelæggelse af vandfartøjer uden for specifikationen, der ikke kan genbearbejdes. Fabrikens egne brætter eller kompromitterede brætter vil aldrig nogen gang komme ud i sekundær detailhandel, grå markeder eller e-handelskanaler. Skrotnings- og ødelæggelsesbeviset (VAT-QA-SCRAP-CERT-2026) registrerer produktet, batchen, MRBs konklusion, billeder fra overværelsen og dobbelt signatur fra QA-chefen og fabrikschefen.

