nc_intro:
  tagline: 'Kontrol af afvigende produkter'
  title: 'Hvad der sker, når et produkt ikke opfylder kriterierne'
  body: |
    Produkter eller enheder, der ikke opfylder de fastsatte acceptkriterier, identificeres og kontrolleres for at hindre utilsigtet anvendelse, videre bearbejdning eller afsendelse. De gældende acceptkriterier bygger på det godkendte prøveeksemplar, den tekniske specifikation, artwork, styklisten, emballagekrav og projektets inspektionsplan.

    Afvigende varer evalueres for at fastslå det berørte omfang og den passende disposition. Afhængigt af problemet kan varen blive holdt, genbearbejdet efter kontrollerede instruktioner, erstattet, kasseret eller håndteret på anden vis via en godkendt proces. Genbearbejdede eller korrigerede varer geninspekteres, før de frigives. Frigivelse til afsendelse er kun tilladt, når de relevante kvalitetsrekorder er udfyldt, og produktet opfylder de gældende acceptkriterier.

nc_flow:
  tagline: 'Standardiseret lukket løkke i 7 trin'
  title: 'Fra identifikation til korrigerende foranstaltning'
  subtitle: 'En kontrolleret løkke for hver afvigelse: identificer, karantæne, gennemgå, genbearbejd eller erstat, geninspekter, frigiv eller kasser, forbedr.'
  steps:
    - step: '01'
      title: Identificer
      desc: 'Enhver identificeret afvigelse registreres mod det berørte produkt, batch eller den berørte enhed og vurderes mod de gældende projektkrav. Opdagelsen kan ske ved modtagne materialer, under proceskontrol, ved endelig test, ved emballage eller ved kundens/tredjepartsinspektion.'
    - step: '02'
      title: 'Karantæne'
      desc: 'Varer identificeres tydeligt og placeres under kontrolleret hold eller karantænestatus for at hindre utilsigtet anvendelse, videre bearbejdning eller afsendelse. Etiketterne HOLD / KARANTÆNE / KASSERET indeholder NCR-nummer, SKU, batch, antal, fejlbeskrivelse og dato.'
    - step: '03'
      title: Gennemgå
      desc: 'Det berørte omfang og den passende disposition evalueres: enkeltstk. hold, skifteparti, helt batch eller flere batcher — på tværs af fælles materialepartier, artworkrevisioner, procestrin og dokumentrevisioner. Yderligere inddæmming eller skærpet inspektion anvendes, hvor det kræves.'
    - step: '04'
      title: 'Genbearbejd eller erstat'
      desc: 'Tilladt genbearbejdning følger godkendte instruktioner, der identificerer den berørte vare, metoden, materialerne, kontrolpunkterne og kravene til geninspektion. Ugodkendte ændringer af produktspecifikation, artwork, tilbehørskonfiguration eller emballage er aldrig tilladt. Erstatningsvarer gennemgår de gældende inspektionstrin igen.'
    - step: '05'
      title: Geninspektion
      desc: 'Genbearbejdede eller korrigerede varer geninspekteres mod de gældende acceptkriterier. Den oprindeligt fejlede egenskab og alle relaterede egenskaber, der berøres af genbearbejdningen, verificeres før frigivelse — af uafhængig QC og med en helt ny trykprøvningscyklus på 24 t ved reparationer af lufttæthed.'
    - step: '06'
      title: 'Frigiv eller kasser'
      desc: 'Produktet frigives først, når den krævede geninspektion er gennemført, og autoriseret kvalitetspersonale bekræfter overensstemmelse med de gældende projektkrav. Varer, der ikke kan bringes i overensstemmelse, kasseres, erstattes, returneres eller disponeres efter kontrollerede procedurer — herunder overværet fysisk ødelæggelse.'
    - step: '07'
      title: 'Korrigerende foranstaltning'
      desc: 'Gentagne, betydelige eller systematiske afvigelser gennemgås for årsag og korrigerende foranstaltning (CAPA). Forbedringer kan omfatte opdatering af arbejdsinstruktioner, materialekontrol, kontrolpunkter, oplæring, leverandørstyring eller dokumentkontrol.'

