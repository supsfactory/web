answer:
  label: 'Det korte svar'
  text: 'Afvigende produkter skjules aldrig, genbearbejdes uformelt eller frigives uden verifikation hos QINGDAO VATRAD GROUP.,LTD. Hver identificeret afvigelse registreres mod det berørte produkt, batch eller den berørte enhed og knyttes til en NCR. Varen mærkes (HOLD / KARANTÆNE / KASSERET), adskilles fysisk, og det berørte omfang vurderes pr. batch, materialeparti, procestrin og dokumentrevision. Dispositionen besluttes på det niveau af bemyndigelse, der svarer til fejlens alvor: Mindre problemer signeres på linjeniveau, større problemer kræver disposition fra QC-chef + teknisk ingeniør med en kontrolleret genbearbejdningsinstruktion og 100 % uafhængig geninspektion, og kritiske problemer kræver en beslutning i Material Review Board med skriftlig dispensation fra kunden, hvor det kræves — ellers obligatorisk overværet ødelæggelse. Genbearbejdede varer geninspekteres mod de oprindelige acceptkriterier, reparationer af lufttæthed gennemgår en helt ny trykprøvningscyklus, og frigivelse til afsendelse sker først efter autoriseret kvalitetssignatur. Gentagne eller systematiske problemer udløser korrigerende årsagsanalyse (CAPA).'
  verified: 'September 2026'

