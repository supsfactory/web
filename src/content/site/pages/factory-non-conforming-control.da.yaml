faqs:
  tagline: FAQ
  title: 'Kvalitets- og fejlkontrol for globale købere'
  items:
    - q: 'Hvordan garanterer I, at genbearbejdede brætter opfylder alle sikkerhedskrav?'
      a: 'Ethvert genbearbejdet bræt behandles som en ny enhed og skal gennemføre præcis den samme fulde testcyklus fra nul — for reparationer af lufttæthed en komplet trykprøvning på 24 t. Uafhængige QC-inspektører, ikke genbearbejdningsoperatørerne, foretager frigivelsesvalideringen.'
    - q: 'Vil fabrikken afsende brætter med mindre kosmetiske afvigelser uden at fortælle os det?'
      a: 'Aldrig. Enhver afvigelse, der påvirker kundens godkendte referenceeksemplarer, logoartwork, farvevarianter eller emballage, kræver en formel, skriftlig dispensationsoverenskomst, som kunden underskriver, før frigivelse til afsendelse.'
    - q: 'Hvad sker der, hvis et genbearbejdet bræt fejler i geninspektionen?'
      a: 'Brættet frigives ikke. Det gennemgår en ny dispositionsgennemgang, og hvis det ikke kan bringes i overensstemmelse, erstattes det, kasseres eller ødelægges efter den overværede skrotningsprotokol. Gentagen fejl i samme fejlklasse udløser CAPA med årsagsanalyse.'
    - q: 'Kan fejlede brætter sælges som fabrikens egne eller gennem andre kanaler?'
      a: 'Nej. Afvigende brætter, der ikke kan genbearbejdes, ødelægges fysisk efter den overværede skrotningsprotokol — beslag afskåret, kerne og kanter gennemskåret, video registreret med SHA-256-hash og arkiveret i mindst 5 år. Skrotnings- og ødelæggelsesbeviset underskrives af QA-chefen og fabrikschefen.'
    - q: 'Hvordan vurderes det berørte omfang, når en fejl opdages?'
      a: 'Omfanget gennemgås pr. produktidentifikation, produktionsbatch, materiale- eller enhedsparti, procestrin og gældende dokumentrevision. Hvis det samme materialeparti, artworkrevision eller den samme arbejdsplads er involveret, inddæmmes og kontrolleres de berørte produkter tilsvarende.'
    - q: 'Kræver I vores godkendelse, før I giver en dispensation?'
      a: 'Ja. Enhver accept under en dokumenteret dispensation, der påvirker kundens krav — godkendte prøveeksemplarer, specifikation, artwork, emballage eller acceptkriterier — kræver skriftlig godkendelse fra kunden, før der frigives. Uden denne genbearbejdes produktet efter det oprindelige krav, erstattes eller kasseres.'
    - q: 'Hvilken dokumentation modtager vi ved en afvigelse?'
      a: 'NCR-registreringen omfatter NCR-nummer, opdagelsestrin, produkt/SKU, batch, gældende dokumentrevisioner, fejlbeskrivelse, inddæmming, disposition, reference til genbearbejdningsinstruktion, resultat af geninspektion samt godkendelse af frigivelse eller lukning — tilgængelig i henhold til jeres kvalitetsaftale for projektet.'

