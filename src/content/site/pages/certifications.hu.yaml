meta:
  title: 'Minőség-ellenőrzés egyedi SUP deszkákhoz: 7 vizsgálati kapu | iSupfactory'
  description: 'Hogyan ellenőrzünk minden egyedi SUP megrendelést: 7 vizsgálati kapu az előkészítőtől a szállításiengedélyig, letölthető kétnyelvű jegyzőkönyvekkel.'
  dateModified: '2026-08-15'
  keywords:
    - 'SUP minőség-ellenőrzés'
    - 'SUP gyárinspekció'
    - 'OEM minőségvizsgálati terv'
    - 'SUP szállítás előtti inspekció'
    - 'CE-tanúsítás SUP'
    - 'ISO 9001 SUP'
hero:
  tagline: Minőség-ellenőrzés egyedi projektekhez
  title: 'Minőség-ellenőrzés egyedi felfújható SUP deszkás projektekhez'
  subtitle: 'A minőséget minden projektnél a jóváhagyott mintához, a műszaki specifikációhoz, a grafikához, az anyaglista-hoz és a csomagolási igényekhez viszonyítva ellenőrizzük – nem egy általános állításhoz. A beérkező anyagoktól a szállítási engedélyig terjedő vizsgálati folyamatunk úgy van felépítve, hogy a meghatározott gyártási szakaszokban ellenőrizze a termék megfelelőségét. A QINGDAO VATRAD GROUP támogatásával, amely a Vatrad mögött álló 12,500 m²-es felfújható SUP deszkagyár.'
stats:
  - value: 100%
    label: Nyomáspróbának alávetett darabok
  - value: '7'
    label: Felügyelt vizsgálati kapu
  - value: 18.0 PSI
    label: 24 órás nyomástartás
  - value: ISO 9001
    label: Minőségtanúsítvány
quality_basis:
  tagline: A minőség alapja
  title: 'Mi határozza meg a termék elfogadását'
  subtitle: 'A végső elfogadási kritériumokat a gyártás engedélyezése előtt rögzítjük. Ezek a felügyelt projekt dokumentumai határozzák meg, mit kell gyártani, hogyan ellenőrzik a lényeges részleteket, és mit kell ellenőrizni szállítás előtt – a vevővel együtt jóváhagyva, és a Minőségvizsgálati Tervbe (QIP) beépítve. Bármely módosítási kérés a dokumentált változtatáskezelésen megy keresztül, soha nem csendben a gyártósoron.'
  items:
    - title: 'Jóváhagyott minta'
      description: 'A vevő által aláírt fizikai referencia-deszka. Minden kész deszkát összevetünk vele a méretek, a profil, a merevség és a kidolgozás szempontjából.'
      icon: tabler:medal
    - title: 'Műszaki specifikáció'
      description: 'Az anyagok, a kivitelezés és a méretrajzok egy rögzített revíziószámon. Az FAI az első darabot pontosan ehhez a revízióhoz hasonlítja.'
      icon: tabler:file-check
    - title: 'Jóváhagyott grafika'
      description: 'A grafika, a nyomtatási színek és az elhelyezés vágás előtt verzióként rögzítve és jóváhagyva, hogy minden darab a márka által jóváhagyott megjelenésben kerüljön szállításra.'
      icon: tabler:palette
    - title: 'Ügyfél által jóváhagyott BOM'
      description: 'Az anyaglista – deszka, ezenyél, pumpa, zsinór, hátizsák, kézikönyv –, amelyet a vevő megerősít. A PSI 100%-ban ellenőrzi a készlet teljességét a BOM alapján.'
      icon: tabler:list-checks
    - title: 'Csomagolási és címkézési igények'
      description: 'A doboz szerkezete, a jelölések, a vonalkódok, a címkék tartalma és a szállítási jelölések írásban rögzítve. A vonalkód olvashatóságát és a jelölések pontosságát a PSI ellenőrzi.'
      icon: tabler:package
tests:
  - title: Nyomáspróba
    description: A felfújható rekeszek ajánlott üzemi határaikat meghaladó nyomásnak vannak kitéve, huzamosabb ideig. Ez ellenőrzi a levegőtömörséget, valamint az anyag és a varratok szerkezeti épségét, biztosítva, hogy a termék elviselje a rendeltetésszerű használatot és az esetleges túlfújást törés vagy szivárgás nélkül.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Nyomáspróbának alávetett felfújható SUP rekesz a levegőtömörség ellenőrzésére
  - title: Ütési vizsgálat
    description: A termékeket különböző súlyokból és szögekből végzett szabályozott ütések érik. Ez értékeli az anyag perforációval, szakadással és a vízben lévő akadályokkal való ütközésből eredő sérülésekkel szembeni ellenállását, demonstrálva a tartósságot és az élettartamot.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Ütésvizsgáló állás, amely a felfújható csónakok anyagának perforációval szembeni ellenállását értékeli
  - title: UV-sugárzással szembeni ellenállás vizsgálata
    description: Anyagmintákat gyorsított UV-sugárzásnak tesszük ki annak ellenőrzésére, hogy nem sárgulnak el, nem repedeznek, és nem veszítenek szilárdságot az idő során. Minden PVC-lotot ellenőrzünk a napfény okozta bomlásra a gyártásban való felhasználás előtt.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: PVC-anyagminták gyorsított UV-sugárzás alatt az ellenállás vizsgálatakor
  - title: Kopásállóság vizsgálata
    description: Anyagmintákat meghatározott számú ciklusban, szabályozott nyomás alatt dörzsölünk dörzsölő felületekhez. Ez méri az anyag kopással szembeni ellenállását az ismételt használat, a homokkal, kővel vagy más felületekkel való érintkezés során, biztosítva a hosszú távú tartósságot.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Kopásvizsgáló gép, amely egy PVC-anyagmintát dörzöl a kopással szembeni ellenállás mérésére
  - title: Alacsony hőmérsékleti teljesítményvizsgálat
    description: A termékeket hideg környezetben vizsgáljuk, hogy értékeljük működőképességüket és tartósságukat változó hőmérsékleti viszonyok között, megelőzve a merevséget vagy a repedést a hidegebb vízben. Alapvető a hideg évszakban vagy magas szélességi körökben használatra szánt csónakoknál.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Felfújható termék hidegkamrában az alacsony hőmérsékleti teljesítmény vizsgálatához
  - title: Lebegőképesség és teherbíró képesség vizsgálata
    description: A termékeket különböző súlyokkal vizsgáljuk a maximális teherbíró képesség meghatározására és annak biztosítására, hogy a felhasználókat és a felszerelést biztonságosan megtartják. Minden típus névleges kapacitását engedélyezés előtt ellenőrizzük.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Lebegőképesség- és teherbíróképesség-vizsgálat súlyokkal egy felfújható vízi járművön
  - title: Kezelhetőség vizsgálata
    description: A termékeket evezési vagy motoros műveletekre adott válaszukra vizsgáljuk, értékelve a fordulási sugarat és a kezelés egyszerűségét. A vízi próbák validálják, hogy a tényleges kezelés megfelel a tervezési specifikációknak.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Víz kezelhetőségi vizsgálat felfújható SUP deszkákkal és csónaktörzsekkel
  - title: Vízállóság vizsgálata
    description: A teljesen összeállított termékeket bemerítjük vagy vízzel permetezzük, hogy ellenőrizzük a varratokon, szelepeken vagy az anyagon keresztüli szivárgásokat. Minden csónak kötelező vízállósági ellenőrzésen megy keresztül szállítás előtt.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Beméréses tömörségi vizsgálat, amely a varratokat és a szelepeket ellenőrzi szivárgásra
qc_flow:
  tagline: A 7 szakasz vizsgálati folyamata
  title: 'Hét felügyelt minőségi kapu egyik végétől a másikig'
  subtitle: 'Az alábbi minden kapu definíva van a projekt Minőségvizsgálati Tervében, a vizsgálat tárgyával, a módszerrel, az elfogadási kritériumokkal és a nyilvántartás eredményével. A kétnyelvű jegyzőkönyvdossziék valódi felügyelt nyilvántartások – nyisson meg bármelyiket a tényleges struktúra megtekintéséhez.'
  obj_label: A vizsgálat tárgya
  method_label: Vizsgálati módszer
  criteria_label: Elfogadási kritériumok
  record_label: A nyilvántartás eredménye
  stages:
    - stage: 01. SZAKASZ
      title: 'A projekt minőségtervezése (PPM)'
      summary: 'Az előkészítő ülés rögzíti a hatókört, a kiindulási alapokat és a vizsgálati tervet a sor indítása előtt.'
      checks:
        - 'A termék neve, a belső kód, az ügyfél SKU-ja, a megrendelés száma és a lot meghatározása nyilvántartásba kerül.'
        - 'A deszka típusa, a drop-stitch mag, az anyagok, a sínek, az EVA, a szelepek és az uszonyrendszer meghatározásra kerül.'
        - 'A grafikafájl neve, a verzió, a színek, a logó helyzete és a nyomtatási terület rögzítve és jóváhagyva.'
        - 'A BOM – a készlet minden eleme mennyiséggel, színnel, alkatrészkóddal és helyettesítési szabályokkal – az ügyfél által jóváhagyva.'
        - 'A csomagolás, a címkézés, a vonalkódok, a kézikönyvek nyelve és a harmadik fél vizsgálatának elrendezése írásban rögzítve.'
      object: 'A projekt hatóköre az ügyfél igényeihez képest – anyagok, méretek, grafika, csomagolás, célpiac és az alkalmazandó szabványok.'
      method: 'Előkészítő ülés az értékesítéssel, a mérnökséggel és a minőségbiztosítással; az Aranyminta aláírása; a Minőségvizsgálati Terv (QIP) kiállítása a megrendeléshez.'
      criteria: 'Mind az öt kiindulási alap jóváhagyva és beépítve, mielőtt a tömeggyártás megkezdődik. A rendezetlen tételek blokkolják a gyártás engedélyezését.'
      record: 'QIP + PPM jegyzőkönyv, a jóváhagyott minta nyilvántartásai.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: Előkészítő ülés, amely egy OEM SUP megrendelés aranymintáját és minőségvizsgálati tervét vizsgálja
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'QIP letöltése (PDF)'
    - stage: 02. SZAKASZ
      title: 'Beérkező anyagok vizsgálata (IQC)'
      summary: 'Az alapanyagokat a beszállító jóváhagyott specifikációjához viszonyítva ellenőrizzük, mielőtt gyártásba kerülnének.'
      checks:
        - 'A drop-stitch szövetet, a PVC-tekercseket, a sínek anyagát és az EVA felületeket a jóváhagyott mintához viszonyítva ellenőrizzük – szín, vastagság, súly és felületi hibák.'
        - 'A szelepeket, usnyonzsámokat, D-gyűrűket, fogantyúkat és szerelvényeket ellenőrizzük típus, méret, kidolgozás, korrózió és megfelelő működés szempontjából.'
        - 'A pumpákat, evezőket, köteleket, táskákat és javítókészleteket modell, szín és projektkonfiguráció szempontjából ellenőrizzük.'
        - 'A beszállítói tanúsítványokat (COA), az anyagnyilatkozatokat és a REACH/RoHS megfelelőségi dokumentumokat minden lothoz elemezzük.'
        - 'A nem megfelelő lotokat karanténba helyezzük és visszaküldjük, mielőtt bármilyen anyag sorra kerülne.'
      object: 'A drop-stitch szövet, a PVC-tekercsek, a szelepek, az uszonyok, a kiegészítők és a csomagolóanyagok a jóváhagyott specifikációhoz és a beszállítói vizsgálati tanúsítványokhoz képest.'
      method: 'Vizuális, méret- és súlyellenőrzés; AQL szerinti lottmintavétel; anyagtanúsítványok elemzése; a jóváhagyott beszállítói lista kötelező.'
      criteria: 'Megfelel a specifikációnak és a jóváhagyott tanúsítványoknak. A nem megfelelő lotokat karanténba helyezzük és a sorra engedélyezés előtt elutasítjuk.'
      record: 'IQC vizsgálati jelentések lotreferenciákkal és rendelkezésekkel.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: A PVC-szövet és a SUP alkatrészek beérkező anyagvizsgálata a gyárban
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'IQC jelentések letöltése (PDF)'
    - stage: 03. SZAKASZ
      title: 'Folyamatközi ellenőrzés és első darab (IPQC / FAI)'
      summary: 'A kivitelezési módszereket és az ellenőrzési pontokat a jóváhagyott deszkaplatform és a projekt konfigurációja alapján választjuk ki. Az első darabot a beépített kiindulási alapokhoz viszonyítva ellenőrizzük; minden forduló fenntartja a soron végzett járőri ellenőrzéseket.'
      checks:
        - 'Az első darabot a jóváhagyott mintához, a műszaki rajzhoz, a BOM-hoz, a grafikához és a csomagolási fájlokhoz viszonyítva ellenőrizzük a tömeggyártás megkezdése előtt.'
        - 'A deszka méreteit, körvonalát és szimmetriáját mérjük; a mag és a logó irányát, helyzetét, színeit és revízióját megerősítjük.'
        - 'A varratokat és a sínek folytonosságát hézagok, delamináció, gyűrődés, szennyeződés vagy sorbeli eltolódás szempontjából ellenőrizzük.'
        - 'A szelep, a D-gyűrű, a fogantyú és az usnyszám beépítését helyzet, mennyiség és az ügyfél által jóváhagyott BOM szerinti egyezés szempontjából ellenőrizzük.'
        - 'Az FAI jóváhagyása verzióként rögzíti a grafikát, a méreteket és a BOM-ot; az eltérések a javítási döntési folyamatba kerülnek – soha nem ad hoc csomagolásba a soron.'
      object: 'Az első darab és a folyamatban lévő összeállítások – varratok, sínek, usnyszám, szelepalap, a grafika helyzete, a szerelvény illeszkedése.'
      method: 'Első darab vizsgálata az első egységen; járőri ellenőrzések minden fordulóban; a varratok szilárdságának és illeszkedésének ellenőrzése a soron.'
      criteria: 'Az FAI jóváhagyása verzióként rögzíti a grafikát, a méreteket és a BOM-ot. Az eltérések a javítási döntési folyamatba kerülnek – soha nem ad hoc csomagolásba a soron.'
      record: 'FAI nyilvántartás, fordulónkénti járőri naplók, javítási és rendelkezési jegyzetek.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Folyamatközi ellenőrzés és elsődarab-ellenőrzés a SUP deszkák gyártása során
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'IPQC jelentések letöltése (PDF)'
    - stage: 04. SZAKASZ
      title: 'Felfújás és levegőtömörségi vizsgálat'
      summary: 'Minden elkészült deszkát felfújunk és levegőtömörségi ellenőrzésnek vetünk alá csomagolás előtt – a darabok 100%-át, nem egy mintát.'
      checks:
        - 'A deszka felületét, a síneket és a szelepterületet mik perforáció, repedés, rendelleni gyűrődés vagy delamináció szempontjából ellenőrizzük felfújás előtt.'
        - 'A rekeszeket kalibrált digitális nyomásmérővel a projekt vizsgálati nyomásáig fújjuk, és a kezdeti leolvasást rögzítjük.'
        - 'A szelepmagot, a szelepalapot és a sínvarratokat a teljes kerület mentén ellenőrizzük – orr-, far- és ívelt területek.'
        - '24 órás nyomástartás folyamatos nyilvántartással; automatikus elutasítás a megengedett nyomáscsökkenés felett.'
        - 'A hibás deszkákat karanténba helyezzük, az utasítás szerint kijavítjuk, és teljes egészükben újrateszteljuk – nem csupán újraellenőrizzük a javítási ponton.'
      object: 'A felfújt rekeszek 100%-a – a teljes varrat menti szivárgásfelismerés, a szelep épsége és a nyomáscsökkenés megtartása.'
      method: 'A teljes varrat menti szivárgásfelismerés, majd 24 órás nyomástartás 18.0 PSI-en; automatikus elutasítás 0.50 PSI-nél nagyobb csökkenés esetén.'
      criteria: 'Nulla szivárgási pont és a rekeszenkénti nyomáscsökkenés a 0.50 PSI-es határon belül; a hibás darabokat karanténba helyezzük és kijavítjuk vagy megsemmisítjük.'
      record: 'Levegőtömörségi vizsgálati jelentések, rekeszenként egy, a lothoz kötve.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Felfújható SUP rekesz felfújása és levegőtömörségi vizsgálata
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Légtömörségi jelentések letöltése (PDF)'
    - stage: 05. SZAKASZ
      title: 'Késztermék-vizsgálat (FQC)'
      summary: 'A kész deszkákat megmérjük és kozmetikailag minősítjük a jóváhagyott aranymintához képest.'
      checks:
        - 'A lényeges méreteket – hossz, szélesség, vastagság – üzemi nyomáson mérjük, a rajz szerinti tűréseknek megfelelően.'
        - 'A deszka körvonalát, rockerét és szimmetriáját ellenőrizzük; felfújás után nincs deformáció, elcsavarodás vagy rendelleni görbület.'
        - 'A megjelenést D65 természetes fényű lámpák alatt minősítjük: karcolások, foltok, ragasztónyomok, buborékok, gyűrődések, színeltérés.'
        - 'Funkcionális ellenőrzések: a szelep nyitása/zárása és a sapka rögzítése, az uszony behelyezése és reteszelése, a D-gyűrűk, a fogantyúk és az ezenyél működése.'
        - 'A konfigurációt az ügyfél által jóváhagyott BOM-hoz és SKU-hoz viszonyítva ellenőrizzük – kiegészítők, címkék, vonalkódok és sorozatszámok.'
      object: 'A kész deszka az aranymintához képest – méretek, rocker, profil, megjelenés, az usnyszám illeszkedése és a kiegészítők teljessége.'
      method: 'Méretellenőrzés a rajz szerinti tűréseknek megfelelően; a megjelenés minősítése D65 természetes fényű lámpák alatt; az usnyszám és a szerelvények illeszkedési próbái.'
      criteria: 'A méretek tűrésen belül (pl. 3508 × 814 × 150.3 mm), a megjelenési osztály megfelel a jóváhagyott mintának, minden kiegészítő jelen van.'
      record: 'FQC jelentések az ellenőr aláírásával és a rendelkezéssel.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: A kész SUP deszkák késztermék-vizsgálata csomagolás előtt
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'FQC jelentések letöltése (PDF)'
    - stage: 06. SZAKASZ
      title: 'Csomagolás és szállítás előtti vizsgálat (PSI)'
      summary: 'A csomagolt készletet ellenőrizzük a teljesség, a jelölések pontossága és a szállítás előkészítése szempontjából.'
      checks:
        - 'A készlet 100%-os teljessége a BOM alapján: deszka, ezenyél, pumpa, kötél, hátizsák, javítókészlet és kézikönyv – sorban egy-egy készlet.'
        - 'A kényes alkatrészeket védjük (pumpa- és ezenyéltasak), a deszkát a csomagolási SOP szerint hajtogatjuk, a kiegészítők megfelelnek a modellnek és a színnek.'
        - 'A doboz grafikáját, márkajelölését, figyelmeztetéseit és nyelvi változatait a jóváhagyott grafikai revízióhoz viszonyítva ellenőrizzük.'
        - 'A vonalkód típusát, számát, helyét és olvashatóságát ellenőrizzük; a szállítási jelölések, az SKU, a PO, a dobozszám és a mennyiség helyes.'
        - 'A doboz méretei, a bruttó/nettó súly és a belső csomagolás megfelel a csomagolási specifikációnak; az ejtési vizsgálat eredményét rögzítjük, ha kért.'
      object: 'A csomagolt készlet – deszka, ezenyél, pumpa, kötél, hátizsák, kézikönyv – az ügyfél által jóváhagyott BOM-hoz és a csomagolási specifikációhoz képest.'
      method: 'A készlet 100%-os teljessége a BOM alapján; vonalkódolvasás (Grade ≥ B); a dobozjelölések pontossága; ISTA-1A ejtési vizsgálat a csomagolt dobozokon.'
      criteria: 'A készlet 100%-ban megfelel a BOM-nak, olvasható vonalkódok, helyes jelölések és a rakodás előtti ejtésálló csomagolás.'
      record: 'PSI ellenőrzőlisták és csomagolási nyilvántartások minden dobozon.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Szállítás előtti vizsgálat, amely a csomagolt SUP készletet ellenőrzi a BOM alapján
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'PSI jelentések letöltése (PDF)'
    - stage: 07. SZAKASZ
      title: 'Szállítási engedély és követhetőség'
      summary: 'A minőség csak akkor írja alá a lót, ha mind a hat korábbi kapu lezárult, és minden nyilvántartás teljes.'
      checks:
        - 'A gyártólot, a megrendelés száma, az SKU, a mennyiség és a dobozszám megegyezik a csomagolási jegyzékkel és a kereskedelmi számlával.'
        - 'A specifikáció-, BOM-, grafika- és csomagolási fájlok mind a jelenleg jóváhagyott revízión vannak.'
        - 'Az IQC-, FAI-, folyamatközi, légtömörségi, FQC- és PSI-nyilvántartások teljesek az engedélyezett lotra.'
        - 'Minden nem megfelelés rendezve, kijavítva, újraellenőrizve és lezárva – az engedélyezéskor nincs nyitott tétel.'
        - 'A követhetőségi mezők lotonként rögzülnek: projektkód, PO, SKU, a grafika/BOM/csomagolás revíziói, gyártási dátum, ellenőr és a nyilvántartások száma.'
      object: 'A lot engedélyezésének jóváhagyása – minden kapu lezárva, teljes nyilvántartás, a sorozatszámok a lothoz rendelve.'
      method: 'Mind a hat korábbi nyilvántartás kapuszemléletű felülvizsgálata a minőségbiztosítás részéről; a lot összeállított követhetőségi dossziéja; a nyilvántartások átadása a szállítással együtt.'
      criteria: 'Minden kapu QA-jóváhagyva; a lot nyilvántartásai és a követhetőségi dosszié átadva a vevőnek, vagy kérésre NDA alatt megőrizve.'
      record: 'A szállítási engedély és a lot követhetőségi dossziéja.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: A szállítási engedély aláírása és a lot követhetőségi nyilvántartásának átadása
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Engedélyezési jelentések letöltése (PDF)'
system_map:
  tagline: A minőségügyi rendszer
  title: 'Egy rendszer, négy felügyelt szabvány'
  subtitle: 'A fenti hét kapu négy dokumentált szabványon működik, amelyek mindegyike letölthető és auditálható felügyelt eljárásként publikálva. Együtt alkotják azt a minőségirányítási rendszert, amely minden OEM/ODM megrendelés mögött áll – vizsgálati kritériumok, változtatáskezelés, nem megfelelőség és laboratóriumi tesztelés.'
  items:
    - title: 'Vizsgálati és engedélyezési szabványok'
      description: 'A projekt QIP-je vezeti minden kaput: a vizsgálat tárgyát, a módszert, az elfogadási kritériumokat és a nyilvántartás eredményét minden megrendeléshez. Tartalmazza a 4 szakaszos QC keretrendszert, a követhetőségi láncot, a karantén folyamatot, a hibamátrixot és a 00–15 közötti dokumentációs nyilvántartást.'
      icon: tabler:clipboard-check
      link: /hu/factory/quality-inspection
      link_label: 'Vizsgálati szabványok és QMS letöltések'
    - title: 'Változtatáskezelés a javításban'
      description: 'Nincs dokumentálatlan változtatás a javítási paraméterekben: elszigetelés, kockázatbesorolás, 9 lépéses változtatási kör, jóváhagyási és validációs mátrix. A jóváhagyott specifikációk, minták, BOM-ok vagy elfogadási kritériumok bármely változtatásához az ügyfél írásbeli jóváhagyása szükséges.'
      icon: tabler:git-branch
      link: /hu/factory/quality-change-control
      link_label: 'A változtatáskezelés szabványa'
    - title: 'Nem megfelelő termékek kezelése'
      description: 'Az ISO 9001:2015 8.7 pontjának megfelelő 7 lépéses zárt kör: azonosítás, karantén, NCR szerinti rendelkezés, javítás vagy elutasítás, újraellenőrzés, engedélyezés, korrekció. Tartalmazza a súlyosság szerinti hatáskört, a SUP hibák rendelkezési mátrixát és a felügyelt megsemmisítést.'
      icon: tabler:alert-triangle
      link: /hu/factory/non-conforming-control
      link_label: 'A nem megfelelő termékek kezelésének szabványa'
    - title: 'Laboratóriumi tesztelés és eszközök'
      description: 'A minőségi laboratórium a gyártástól függetlenül működik: szakítás, nyomáscsökkenés, UV-öregítés, varratházasodás, szivárgásfelismerés és hőmérsékleti kamrák – a publikált állításaink mögött álló kalibrációs és vizsgálati eljárásokkal.'
      icon: tabler:flask
      link: /hu/factory/quality-lab
      link_label: 'A minőségi laboratórium és a vizsgálóeszközök'
    - title: 'Anyagvizsgáló laboratórium (C&D)'
      description: 'A C&D központ független anyagvizsgálatot végez PVC/Hypalon formulákra, gyorsított öregítésre, és támogatja a tanúsításokat, feltáplálva a gyártásban használt szabványokat.'
      icon: tabler:microscope
      link: /hu/randdcenter/quality-inspection-lab
      link_label: 'A C&D anyagvizsgáló laboratórium'
