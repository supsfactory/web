non_conformance:
  tagline: Nem megfelelő termékek kezelése
  title: 'Hibát találunk: elkülönítjük, eldöntjük, dokumentáljuk'
  subtitle: 'Azokat a termékeket vagy alkatrészeket, amelyek nem felelnek meg a meghatározott elfogadási kritériumoknak, azonosítjuk és ellenőrzött visszatartás alá helyezzük. A javítás vagy a csere csak az alkalmazandó minőségi eljárás szerint engedélyezett, és ezt engedélyezés előtti újraellenőrzés követi.'
  items:
    - title: 'Észlelés és elkülönítés'
      description: 'A hibás darabokat piros címkével jelöljük és a karanténállomásra helyezzük át – további feldolgozás vagy csomagolás nem történhet rendelkezésig.'
      icon: tabler:alert-triangle
    - title: 'Rendelkezés NCR szerint'
      description: 'A minőségügy Nemmegfelelési Jelentést állít ki, és a rendelkezési mátrix szerint irányítja a darabot a javításra, újraellenőrzésre, elutasításra vagy megsemmisítésre.'
      icon: tabler:git-branch
      link: /hu/factory/non-conforming-control
      link_label: 'A nem megfelelő termékek kezelésének szabványa'
    - title: 'Ellenőrzés és engedélyezés'
      description: 'A kijavított darabokat ugyanazokkal a kritériumokkal vizsgáljuk újra; az NCR csak az újraellenőrzés megfelelő eredménye után zárul le.'
      icon: tabler:shield-check
    - title: 'Hulladékkezelés-ellenőrzés'
      description: 'A megsemmisített anyagot aláírt hulladékbizonylattal semmisítjük meg, hogy soha ne kerülhessen vissza a raktárba vagy a piacra.'
      icon: tabler:trash
      link: https://assets.isupfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Hulladék- és megsemmisítési bizonylat (PDF)'
    - title: 'Visszacsatolás a gyökérokhoz'
      description: 'Az ismétlődő hibák korrekciós intézkedéseket váltanak ki az érintett folyamattal vagy beszállítóval együtt – zárt kör, nem csupán papírmunka.'
      icon: tabler:refresh
      link: https://assets.isupfactory.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'Javítási változtatáskezelési SOP (PDF)'
third_party:
  tagline: 'Támogatás a vevő által kijelölt és a független vizsgálathoz'
  title: 'Az Ön vizsgálója szívesen jön a sorra'
  subtitle: 'A vevő által kijelölt vagy független harmadik fél vizsgálatról (SGS, TÜV, Bureau Veritas, vámügynökségek) a gyártás engedélyezése előtt tárgyalhatunk. A vizsgálat hatókörét, a mintavételi szintet, az elfogadási kritériumokat, az ütemezést és a jelentési követelményeket a gyártás megkezdése előtt erősítsük meg. Ahol ez indokolt, a megállapodott vizsgálati terv szerint koordináljuk a hozzáférést a releváns gyártási, végső vizsgálati és csomagolási szakaszokhoz.'
  items:
    - title: 'A vizsgálat időzítése'
      description: 'A belső vagy harmadik fél vizsgálatok a hét kapu bármelyikén megszervezhetők, az Ön vizsgálati terve alkalmazva elfogadási alapként.'
      icon: tabler:calendar-clock
      link: /hu/factory/quality-inspection
      link_label: 'Vizsgálati szabványok és QMS letöltések'
    - title: 'Szállítás előtti brief sablon'
      description: 'Az a tájékoztató sablon, amelyet az ellenőrök a szállítás előtti vizsgálat bejelentésére, ütemezésére és jelentésére használnak az üzemünkben.'
      icon: tabler:file-report
      link: https://assets.isupfactory.com/site/downloads/Third_Party_Inspection_Brief_Template.pdf
      link_label: 'A brief sablon letöltése (PDF)'
    - title: 'PSI ellenőrzőlista'
      description: 'A soron használt szállítás előtti ellenőrzőlista – készletteljesség, vonalkód-minősítés, jelölések és ejtésállóság.'
      icon: tabler:clipboard-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_SUP_Pre_Shipment_Inspection_Checklist.pdf
      link_label: 'PSI ellenőrzőlista letöltése (PDF)'
    - title: 'Teljes minőségi dokumentációs csomag'
      description: 'Egy dosszié, amely a teljes dokumentációs rendszert lefedi – QIP, a kapuk nyilvántartásai, követhetőség és NCR-kezelés.'
      icon: tabler:books
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'A dokumentációs csomag letöltése (PDF)'
    - title: 'OEM projekt megvalósíthatósági és minőségi útmutató'
      description: 'Hogyan jut el egy projekt az igénytől a jóváhagyott aranymintáig – a mérnöki és minőségi lépések a tömeggyártás előtt.'
      icon: tabler:route
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_OEM_PROJECT_FEASIBILITY_AND_QUALITY_GUIDE.pdf
      link_label: 'A projekt útmutató letöltése (PDF)'
content_certifications:
  tagline: Tanúsítások és szabványok
  title: 'Tanúsított minőség, amelyet globálisan elismernek'
  subtitle: 'A tanúsítások csak annyit érnek, amennyit lefednek. Alább található a tanúsítás hatókörje, a tanúsítvány birtokosa, valamint hogyan ellenőrizheti vagy kérheti a dokumentumokat saját projektjéhez.'
  items:
    - title: 'CE-jelölés'
      description: 'A CE megfelelőségi dokumentáció rendelkezésre áll az EU piacára vonatkozó konfigurációkhoz a 2013/53/EU irányelv szerint (szabadidős vízi járművek); a hatókört minden projektnél megerősítjük. A tanúsítványok számai és a vizsgálati jelentések kérésre rendelkezésre állnak.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Az ISO 9001:2015 szerint tanúsított minőségirányítási rendszer, amely a felfújható vízi járművek és tengeri felszerelések tervezését, gyártását és forgalmazását lefedi. A tanúsítás hatókörte és az auditjelentés kérésre rendelkezésre áll.'
      icon: tabler:clipboard-check
    - title: 'BSCI szociális megfelelőség'
      description: 'A BSCI (Business Social Compliance Initiative) auditált, lefedve a munkafeltételeket és a gyár megfelelőségét. Az auditjelentés kérésre rendelkezésre áll.'
      icon: tabler:heart-handshake
    - title: 'REACH anyagmegfelelőség'
      description: 'Az anyagok megfelelnek az EU vegyi biztonságról szóló REACH-rendeletének. Az anyagnyilatkozatokat minden szállítással együtt a gyártási dokumentáció részeként szolgáltatjuk.'
      icon: tabler:flask
    - title: 'RoHS megfelelőség'
      description: 'A korlátozott veszélyes anyagokkal való megfelelés dokumentált a RoHS szerint az alkalmazandó alkatrészekre és anyagokra.'
      icon: tabler:flame
    - title: 'Anyagvizsgálat'
      description: 'A szöveteket szakítási szilárdságra, szakadási ellenállásra, UV-bomlásra és hidegben történő repedésre vizsgáljuk. Minden gyártólot a közzétett vizsgálati protokoll szerint mintavételezünk és ellenőrzünk.'
      icon: tabler:test-pipe
faqs:
  tagline: GYIK
  title: Gyakori kérdések a minőségügyi rendszerünkről
  items:
    - q: 'Letölthetők a tényleges vizsgálati jelentések?'
      a: 'Igen. Az ezen az oldalon lévő hét kétnyelvű jegyzőkönyvdosszié – QIP, IQC, IPQC/FAI, légtömörség, FQC, PSI és szállítási engedélyezés – valódi felügyelt nyilvántartások, a bizalmas mezők eltávolításával. Ezek feltüntetik a pontos struktúrát, módszereket és elfogadási kritériumokat, amelyeket minden megrendelésnél használunk.'
    - q: 'Hogyan rendelik a hét kaput az én projektemhez?'
      a: 'Minden projekt kap egy Minőségvizsgálati Tervet (QIP), amely meghatározza a termékére és piacára vonatkozó kapukat, az egyes kapuk vizsgálati hatókörét és azokat a nyilvántartásokat, amelyeket Ön kap. Töltse le a QIP mintáját ezen az oldalon a struktúra megtekintéséhez.'
    - q: 'Valósak ezek a vizsgálati nyilvántartás-minták?'
      a: 'Igen. A minták valós felügyelt nyilvántartási struktúránkat követik – dokumentumfejléc, vizsgálati ellenőrzőlista, elfogadási kritériumok, módszer, eredmények, az ellenőr szerepe és az engedélyezési rendelkezés. Az azonosító adatok helyett bemutató értékek (DEMO-* kódok) szerepelnek, így egyetlen ügyfél adatai, grafikája, megrendelése vagy ára sem kerül nyilvánosságra.'
    - q: 'Miért anonimizáltak a minták?'
      a: 'A vevő bizalmas jellege mindenekelőtt. Az ügyfélnevek, a grafika, a megrendelési adatok, a beszállítói információk és az árak tervezéssel védettek. Az anonimizáció lehetővé teszi, hogy bármelyik lehetséges vevő áttekintse a nyilvántartások struktúráját és a követhetőségünket anélkül, hogy másik ügyfél üzleti adatait kitenné.'
    - q: 'Kaphatunk-e teljes vizsgálati jelentéseket a saját projektünkhöz?'
      a: 'Igen. A jóváhagyott projekteknél rendelkezésre bocsátjuk az Ön megrendelésére vonatkozó minőségi dokumentációt – minőségvizsgálati terv, beérkező, folyamatközi, légtömörségi, végső és csomagolási vizsgálati jelentések, valamint a szállítási engedély – az Ön lotjának követhetőségéhez kötve. Az érzékeny üzleti adatok a megállapodottak szerint NDA alatt maradnak.'
    - q: 'Mit tartalmaz egy lot szintű vizsgálati nyilvántartás?'
      a: 'Minden nyilvántartás összeköti a gyártólotot az alkalmazandó specifikáció- vagy rajzrevízióval, rögzíti az egyes vizsgálati tételeket a saját elfogadási kritériumukhoz képest a használt módszerrel és eszközzel együtt, és az ellenőr szerepével, az eredmény állapotával, valamint a minőségügy által aláírt engedélyezési rendelkezéssel zárul.'
evidence_review:
  tagline: 'Bizonyítékok és ellenőrzés'
  title: 'ELLENŐRZÖTT SPECIFIKÁCIÓK'
  body: 'Az ezen az oldalon szereplő valamennyi gyártási állítást a laixi (Qingdao) üzemünk termelésmérnöki csapata ellenőriz. A tanúsítványok, a minőség-ellenőrzési vizsgálatok nyilvántartásai, a nyomás- és szerkezeti vizsgálati jelentések, valamint a lotok követhetőségi nyilvántartásai kérésre rendelkezésre állnak. A specifikációkat legutóbb 2026 szeptemberében ellenőriztük.'

