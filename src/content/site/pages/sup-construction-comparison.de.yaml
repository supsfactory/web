key_factors:
  heading: 'Wichtige Faktoren über die Konstruktionsart hinaus'
  body: |
    Die Konstruktionsart ist eine Variable der Board-Performance. Drei weitere Faktoren sind genauso wichtig oder wichtiger:

    - **Drop-Stitch-Dichte** — Die Fäden pro Zoll bestimmen, wie gleichmäßig das Board unter Druck seine Form hält. Wir verwenden standardmäßig 96 Fäden/Zoll und 140 Fäden/Zoll für Performance-Builds. Höhere Dichte = flacheres Board = besseres Gleiten.
    - **PVC-Güte und -Dicke** — Nicht jedes PVC ist gleich. Koreanisch importiertes 0.7-mm-PVC hat eine höhere Reißfestigkeit und UV-Beständigkeit als dünnere Alternativen. Wir spezifizieren die Materialgüte pro Projekt.
    - **Rail-Konstruktion** — Einlagige Rails sind der häufigste Ausfallpunkt bei Billig-Boards. Doppellagige Rails und verstärktes Rail-Tape reduzieren das Risiko von Rail-Durchstichen drastisch. Alle unsere Boards verwenden unabhängig von der Konstruktionsstufe verstärkte Rails.

faqs:
  tagline: FAQ
  title: 'SUP-Konstruktion — Häufig gestellte Fragen'
  items:
    - q: 'Welche Konstruktionsart sollte ich für meine Marke wählen?'
      a: 'Das hängt von Ihrem Zielmarkt und Ihrer Preispositionierung ab. Einstieg und Big-Box-Handel: einlagig. Verleihflotten, Vereine und mittlere Marken: doppellagig. Performance, Touren und Premium: Drop-Stitch-Kern. Die meisten Marken starten mit doppellagig als bestem Kompromiss aus Kosten, Haltbarkeit und Fahrerlebnis. Wir empfehlen auf Basis Ihres konkreten Markts während der Machbarkeitsprüfung.'
    - q: 'Kann ich mehrere Konstruktionsstufen unter einer Marke anbieten?'
      a: 'Ja — viele Marken bieten zwei oder drei Stufen an. Wir produzieren alle drei Konstruktionen auf derselben Linie mit denselben QC-Gates, sodass Sie Konstruktionsarten innerhalb einer einzelnen Bestellung mischen können. Rumpfform und Grafiken können über alle Stufen identisch sein; nur Konstruktion und Materialien ändern sich.'
    - q: 'Welcher Drucktest-Standard gilt für alle Konstruktionen?'
      a: 'Jedes Board besteht unabhängig von der Konstruktionsart einen 18.0-PSI-Halttest mit automatischer Aussonderung bei einem Druckabfall über 0.50 PSI über 24 Stunden. Einlagige Boards sind für 12–15 PSI Fahrdruck ausgelegt, doppellagige für 15–18 PSI und Drop-Stitch-Kern für 18–25 PSI. Der Testdruck übersteigt den Nenndruck aller Arten.'
    - q: 'Wie wirkt sich die Konstruktion auf Garantieansprüche aus?'
      a: 'Einlagige Boards haben bei gewerblicher/Verleihnutzung eine geringfügig höhere Garantieanspruchsquote wegen Rail- und Durchstichbelastung. Doppellagige und Drop-Stitch-Kern-Konstruktionen haben deutlich niedrigere Anspruchsquoten. Wir stellen pro Stufe Garantiedaten aus unseren Produktionsaufzeichnungen während der Angebotsphase bereit.'

