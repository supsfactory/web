hero:
  tagline: 'Konstruktionsleitfaden'
  title: 'SUP-Konstruktionsvergleich'
  subtitle: 'Drei Konstruktionsarten, eine Fertigungslinie. Verstehen Sie die Kompromisse zwischen Steifigkeit, Gewicht, Haltbarkeit und Kosten von einlagiger PVC, doppellagiger PVC und Drop-Stitch-Kern — und welche zu Ihrem Zielfahrer und Ihrer Marktposition passt.'

answer:
  label: 'Kurzer Vergleich'
  text: 'Einlagige PVC ist am leichtesten und günstigsten — ideal für Gelegenheitsfahrer und preissensible Märkte. Doppellagige PVC ergänzt eine zweite PVC-Haut für Steifigkeit und Haltbarkeit bei moderatem Gewicht — die Branchenstandard-Wahl für Verleihflotten und Modelle im mittleren Preissegment. Drop-Stitch-Kern mit PVC-Hülle bietet die höchste Steifigkeit und Drucktoleranz — bevorzugt für Performance, Surf und schwere Fahrer. Alle drei Konstruktionen werden auf derselben Produktionslinie mit denselben QC-Gates gefertigt; der Unterschied liegt in Materialien und Laminierungsschritten.'
  verified: 'September 2026'

