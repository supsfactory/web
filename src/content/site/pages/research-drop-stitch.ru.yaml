  title: 'Как работает drop stitch — инженерия жестких ядер надувных досок'
  subtitle: '8 мин чтения'

content_html: |
  <h2>Что такое drop stitch?</h2>
  <p>Drop stitch (также называемая «ткань drop stitch» или «ядро drop stitch») — это метод конструкции, при котором тысячи отдельных полиэфирных нитей соединяют верхний и нижний слои тканевой оболочки. При накачивании оболочки эти нити работают как внутренние тяговые элементы — они не дают верхней и нижней панелям выгибаться наружу в цилиндрическую форму, заставляя панель оставаться плоской и жесткой.</p>
  <p>Результат — легкая переносимая конструкция, выдерживающая 15 – 20 PSI внутреннего давления — сопоставимая по жесткости с жесткокорпусной доской, но полностью сдуваемая для хранения и транспортировки.</p>

  <h2>Как это работает: физика</h2>
  <p>В обычной надувной конструкции (например, шарике или надувном матрасе) внутреннее давление воздуха действует одинаково во все стороны. Без внутренних связей конструкция становится цилиндрической или сферической. Drop stitch решает эту задачу за счет введения армирующего тягового слоя:</p>
  <ul>
    <li>Тысячи нитей соединяют верхний и нижний слои ткани</li>
    <li>При накачивании давление воздуха стремится раздвинуть верх и низ</li>
    <li>Нити сопротивляются этому разделению, передавая нагрузку в виде растяжения вдоль оси нити</li>
    <li>Результат — плоская жесткая панель, сопротивляющаяся изгибу</li>
  </ul>

  <h2>Процесс изготовления</h2>
  <ol>
    <li><strong>Ткачество:</strong> Полиэфирные нити одновременно вплетаются в два отдельных слоя основной ткани (как правило, ПВХ-покрытый полиэстер 1,100 DTEX или 1,680 DTEX). Нити соединяются петлевым переплетением между слоями под углом 90&deg;.</li>
    <li><strong>Покрытие:</strong> Сотканная основа покрывается ПВХ (реже TPU) методом ножевого или каландрового нанесения. Это герметизирует нити и создает воздухонепроницаемую мембрану.</li>
    <li><strong>Склейка слоев:</strong> Ядро drop stitch соединяется с внешними ламинированными слоями (как правило, ПВХ 0,9 мм или 1,2 мм) термоламинированием или клеем.</li>
    <li><strong>Сварка:</strong> Бортовые ленты свариваются по краям горячим воздухом, методом ВЧ-сварки или высокочастотной сваркой, формируя боковые стенки доски.</li>
    <li><strong>Установка клапана:</strong> Устанавливаются клапаны Boston или Halkey-Roberts, как правило с предохранительным механизмом, предотвращающим избыточное накачивание.</li>
  </ol>

  <h2>Ключевые показатели качества</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Параметр</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Начальный уровень</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Премиум</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Плотность нитей</td><td class="p-3 border">1 нить / кв. дюйм</td><td class="p-3 border">2 нити / кв. дюйм</td></tr>
      <tr><td class="p-3 border">Основная ткань</td><td class="p-3 border">1,100 DTEX</td><td class="p-3 border">1,680 DTEX</td></tr>
      <tr><td class="p-3 border">Максимальное давление</td><td class="p-3 border">12 – 15 PSI</td><td class="p-3 border">18 – 22 PSI</td></tr>
      <tr><td class="p-3 border">Толщина ПВХ</td><td class="p-3 border">0.6 – 0.9 мм</td><td class="p-3 border">1.0 – 1.2 мм</td></tr>
      <tr><td class="p-3 border">Конструкция борта</td><td class="p-3 border">Сложен и&amp; склеен</td><td class="p-3 border">Сварен и&amp; термосклеен</td></tr>
    </tbody>
  </table>

  <h2>Применение</h2>
  <ul>
    <li><strong>Доски SUP:</strong> толщина 4" – 6", 15 – 20 PSI, 1 – 2 нити/кв. дюйм</li>
    <li><strong>Каяки:</strong> Настил drop stitch + надувные боковые камеры, настил 10 – 15 PSI</li>
    <li><strong>Настилы RIB:</strong> Настилы drop stitch для легких складываемых бортовых лодок RIB, 12 – 18 PSI</li>
    <li><strong>Бампы для лодок:</strong> Низконапорный drop stitch для формованных бампов с плоскими гранями</li>
  </ul>

  <h2>Drop stitch против надувного настила (стеклопластик или деревянный сердцевины)</h2>
  <p>Жесткокорпусные доски используют пенополистирольные сердцевины с армированием стеклопластиком или деревянной стрингером. Они легче, жестче и отзывчивее — но их нельзя сдуть. Drop stitch идет на компромисс между жесткостью и полной переносимостью. Для большинства любителей активного отдыха современные SUP на drop stitch при 20 PSI по жесткости неотличимы от жестких досок начального уровня.</p>

  <h2>Как Vatrad применяет drop stitch</h2>
  <p>Vatrad использует ядро drop stitch 1,680 DTEX во всей линейке SUP, с 2 нитями на квадратный дюйм и наружным ламинатом ПВХ 1,2 мм. Доски рассчитаны на 15 PSI и до отгрузки проходят 24-часовое испытание на удержание давления при 18.0 PSI. Бортовые ленты свариваются горячим воздухом с трехслойным термосоединением, а предохранительные клапаны устанавливаются на всех моделях.</p>
  <p>Drop stitch — основа нашего производства SUP — ознакомьтесь со <a href="/ru/technology/drop-stitch-core">страницей о технологии ядра drop stitch</a> и о том, как ядро соединяется на <a href="/ru/factory">производственной линии завода</a>.</p>

