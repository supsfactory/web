answer:
  label: 'Прямой ответ'
  text: 'Drop stitch — это ткань, в которой столбики из полиэфирной нити удерживают верхний и нижний слои ПВХ на фиксированном расстоянии, поэтому давление воздуха делает доску жесткой. Ядра Vatrad: 1,680 DTEX, 2 нити на квадратный дюйм, наружный ламинат ПВХ 1,2 мм, расчет на 15 PSI, подтверждено 24-часовым испытанием на удержание при 18.0 PSI.'
  verified: 'Сентябрь 2026'

hero:
