material_traceability:
  tagline: Sporbarhet
  title: Materialsporing og partikontroll
  description: 'Hvert parti råmateriale får et unikt partinummer i ERP-systemet vårt. Fra mottak til produksjon og ferdig produkt viser hvert bretts strukturliste (BOM) tilbake til det opprinnelige leverandørpartiet. Dette gjør fullstendig oppstrøms sporing mulig i alle kvalitets- eller compliance-spørsmål.'
  system: 'Skreddersydd ERP-system (internt system for Qingdao Vatrad Group) + fysiske partietiketter på hver arbeidsordre'
  coverage: '100 % av produksjonsmaterialet — PVC, Hypalon, drop-stitch-stoff, lim, ventiler, deler, emballasje'
  records_retained: 10 år (i henhold til kravet i CE 2013/53/EG)
  suppliers:
    - material: Marint PVC
      source: Kinesiske og koreanske leverandører
      certified: ISO 9001, REACH, RoHS
    - material: 'Hypalon (CSM)'
      source: Japansk leverandør
      certified: ISO 9001, REACH
    - material: Drop-stitch-stoff
      source: Eget veveri + eksterne partnere
