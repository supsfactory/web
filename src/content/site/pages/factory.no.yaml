qc_section:
  tagline: Kvalitetskontroll
  title: Testprosess og kvalitetssikring
  subtitle: Hvert brett gjennomgår før levering et obligatorisk test. Kvalitetslaboratoriet vårt arbeider uavhengig av produksjonen og rapporterer direkte til ledelsen.
  steps:
    - step: '1'
      title: Kontroll av råvarer
      desc: 'PVC-, Hypalon- og drop-stitch-stoff gjennomgår prøving av strekkstyrke, riveprøving og verifisering av UV-bestandighet før et parti slippes inn i produksjonen.'
    - step: '2'
      title: 24-timers lufttetthetstest
      desc: 'Hvert kammer pumpes opp til 18.0 PSI og holdes i 24 timer. Et trykktap på mer enn 0.50 PSI utløser automatisk kassering og kontroll av sømmene på nytt.'
    - step: '3'
      title: Belastnings- og balansetest
      desc: 'De ferdige brettene pumpes opp til nominelt trykk og kontrolleres for symmetrisk fylling, stivhet ved 15 PSI og stabilitet under belastning. Hvert brett testes i vannet i testbassenget vårt før sluttkontrollen.'

oem_section:
  tagline: OEM-prosjekter
  title: Case studies om partnerskap med merker og OEM
  subtitle: 'Fra idé til produksjon — slik hjelper vi globale merker med å lansere og oppskalere seriene sine av oppblåsbare SUP-er.'
  cases:
    - challenge: En europeisk kjede av friluftsbutikker trengte en egen SUP-serie med unike deck-trykk, miljøvennlig PVC og butikkklare emballasjer — alt levert innen 60 dager.
      solution: 'Utvikling av skreddersydde digitale trykkfiler, innkjøp av REACH-godkjent PVC og komprimering av prøvefasen fra 3 runder til 1 takket være designteamet som finnes i fabrikken vår i Qingdao.'
      result: 'Produksjon på 25–35 dager etter signert ordre, med første leveranse innen 60-dagersvinduet. 2 400 enheter i 4 SKU-er. Bestillinger før det første partiet var fullt levert.'
      disclaimer: 'Anonymisert prosjektsammendrag — prosjekttype og omfang er representative; de konkrete resultatene er ikke uavhengig verifiserbare.'
    - challenge: 'En amerikansk vannsportsstartup trengte en drop-stitch-SUP av høy kvalitet med tilpasset form, co-branding-emballasje og BSCI-sertifisering for detaljhandelen.'
      solution: 'Tilpasning av en eksisterende SUP-form med endret kontur, utvikling av co-branding-emballasjegrafikk og levering av fullstendig BSCI-revisjonsdokumentasjon.'
      result: 'Suksessfull plassering hos ledende amerikanske friluftsbutikker, med sterk opptrapp takket være over 5 000 solgte enheter i løpet av det første året og en fullstendighetsgrad på 98 %.'
      disclaimer: 'Anonymisert prosjektsammendrag — prosjekttype og omfang er representative; de konkrete resultatene er ikke uavhengig verifiserbare.'
    - challenge: 'En australsk distributør trengte en CE-sertifisert SUP-serie med tilpassede farger og samsvar med australske standarder.'
      solution: 'Produksjon av seriemønstre med 4 fargevarianter og koordinering av samsvarstesting gjennom tredjepart.'
      result: 'Lansering av en SUP-serie med 3 modeller på AU/NZ-markedet. Deretter en vellykket offentlig anbudsinnkjøp av 12 patrulje-SUP-er.'
      disclaimer: 'Anonymisert prosjektsammendrag — prosjekttype og omfang er representative; de konkrete resultatene er ikke uavhengig verifiserbare.'

faq_section:
  tagline: FAQ
  title: Vanlige spørsmål om B2B og OEM
  questions:
    - q: Hva er minste bestillingsmengde (MOQ) for OEM-produksjon av oppblåsbare SUP-brett?
      a: 'MOQ fastsettes ut fra prosjektkonfigurasjonen og ikke fra et fast tall — skrog og utstyr, farge- og PVC-varianter, grafikk, emballasje og tilbehør. Standardserieproduksjon skjer med 90–100+ enheter per parti fra en hel drop-stitch-rull på 150 m, co-branding i små partier starter fra 5–10 enheter, og hvert prosjekt går gjennom fasene prøve (1–2 enheter) og pilot (20–50 enheter). Se guiden vår om fleksibel MOQ og branding for hele beregningslogikken.'
    - q: Har Vatrad en BSCI-sertifisering?
      a: 'Ja. Fabrikken vår har en gyldig BSCI-sertifisering for sosial etterlevelse (revisjonsrapporter tilgjengelige på forespørsel). I tillegg bruker vi ISO 9001 for kvalitetsledelse. CE-sertifiseringen gjelder modeller beregnet for EU-markedet, og omfanget bekreftes prosjekt for prosjekt. Dokumentasjon for REACH- og RoHS-samsvar følger med hver OEM-bestilling.'
    - q: Hva er den vanlige leveringstiden for en OEM-bestilling?
      a: 'Standardleveringstid er 25–35 dager etter bekreftet PO og depositum for volum-OEM-produksjon. Design av tilpassede former gir 15–20 ekstra dager til utvikling av formen. Ekspressproduksjon er tilgjengelig for hastesaker og sesongtopper. Prøveeksemplarer er vanligvis klare innen 7–12 dager.'
    - q: Håndterer dere den kommersielle eksportdokumentasjonen?
      a: 'Ja. Teamet vårt håndterer kommersiell eksportdokumentasjon og tollbehandling internt, og vi sender til over 50 land i EU, USA, AU og asiatiske markeder.'

b2b_moq: 'MOQ fastsettes ut fra prosjektkonfigurasjonen: prøve 1–2, pilot 20–50, serie 90–100+ (per rull på 150 m); co-branding i små partier fra 5–10 enheter.'

production_flow:
  tagline: Produksjonsflyt
  title: Fra materiale til ferdig brett
  subtitle: Hvert brett går gjennom 6 produksjonsfaser med QC-kontrollpunkter i hvert trinn. Ingen snarveier, ingen utelatte inspeksjoner.
  stages:
    - stage: '01'
      title: Varemottak og innkommende QC
      description: 'Alt innkommende materiale registreres i ERP-systemet vårt med et partinummer. Ruller med PVC-stoff, drop-stitch-kjerner, ventiler, lim og deler holdes i karantene til QC har frigjort dem.'
      qc_check: 'Strekkstyrke (ASTM D751), riveholdfasthet (ISO 4674), tykkelsesmåling, limviskositet, skanning etter visuelle defekter'
      qc_threshold: '100 % av partiene testes. Kassering hvis strekkstyrken er < 90 % av spesifikasjonen, riveholdfastheten er under spesifikasjonsminimum, eller det finnes en visuell defekt'
      responsibility: Innkommende QC-team (3 inspektører)
    - stage: '02'
      title: CNC-kapping og materialforberedelse
      description: 'Datamaskinoptimalisert nesting plasserer panelene på PVC-utgangsmaterialet for å minimere avfall. De automatiske CNC-skjæremaskinene opprettholder en plasseringsnøyaktighet på 0.1 mm.'
      qc_check: 'Målekontroll mot CAD-DXF-filene, kontroll av kantkvalitet, kontroll av antall paneler'
      qc_threshold: 'Måles for hvert 20. panel. Toleranse ±0.5 mm. Partiet kassereres hvis >2 % ligger utenfor toleransen'
      responsibility: Leder for kappeverkstedet
    - stage: '03'
      title: Sveising og liming av drop-stitch
      description: 'Drop-stitch-kjernene limes til de ytre PVC-lagene gjennom varmlaminering. Kamrene sveises med HF eller varm luft. Kantlistene limes gjennom tresjiktsfusjon.'
      qc_check: 'Delamineringsprøve for hver 50. enhet (ASTM D751), måling av sømbredde, kontroll av varmluftstemperaturloggen, visuell inspeksjon av sømmene mot lys'
      qc_threshold: 'Minimum rivestyrke 8 N/cm. Toleranse for sømbredde ±1 mm. Synlig sprekk = kassering'
      responsibility: Sveise-QC (2 inspektører per skift)
    - stage: '04'
      title: Montering og ferdigstilling
      description: 'Brettene går inn i sluttmonteringen der alle komponenter samles: sveiste deck- og skrogpaneler, monterte ventiler, D-ringer, håndtak, finneholdere og montert transportveske. Hver enhet følger en 100-punkts montasjeliste.'
      qc_check: 'Frigjøring av 100-punktslisten per enhet, funksjonstest av ventiler (10 åpnings-/lukkingssykluser), kontroll av tiltrekkingsmoment på deler, visuell inspeksjon'
      qc_threshold: 'Nulldefektpolitikk for sikkerhetskritiske komponenter (ventiler, D-ringer, håndtak). Mindre kosmetiske feil: AQL 2.5 (ISO 2859)'
      responsibility: Montasjeskiftleder + linje-QC
    - stage: '05'
      title: Trykktesting og kvalitetsport
      description: 'Hvert kammer pumpes opp til 18.0 PSI (for en SUP merket 12–15 PSI) og holdes i 24 timer. Trykksensorene registrerer kontinuerlig. Kamre med trykktap på mer enn 0.50 PSI kasseres og sendes til ny kontroll av sømmene.'
      qc_check: 'Registrering av 24-timers trykkholding, daglig verifisering av sensorkalibreringen, temperaturkompensert trykkmåling, sømprøve etter reparasjon'
      qc_threshold: 'Maks 0.50 PSI trykktap på 24 t ved stabil temperatur. Hvert kammer som overskrider dette = 100 % ny testing av hele produksjonspartiet'
      responsibility: Kvalitetslaboratorium (uavhengig av produksjonen, rapporterer til ledelsen)
    - stage: '06'
      title: Sluttkontroll og emballasje
      description: 'Endelig visuell og funksjonell kontroll. Overflatedefekter, fargekonsistens, verifisering av etiketter/strekkode, emballasjeintegritet og fullstendighet i tilbehøret. Enhetene vakuumpakkes, plasseres i kartonger og palleteres på lager før containerlasting.'
      qc_check: 'Fullstendig visuell inspeksjon, tilbehørsliste per SKU, fallprøving av emballasjen (1 m, stikkprøve), verifisering av etikett- og strekkodeskanninger'
      qc_threshold: 'AQL 2.5 for alvorlige defekter, AQL 4.0 for lette defekter. Nulltoleranse for sikkerhetsdefekter. 100 % av enhetene visuelt inspisert'
      responsibility: Slutt-QC-team (4 inspektører) + emballasjeskiftleder

