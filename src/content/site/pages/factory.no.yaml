hero:
  tagline: Fabrikk
  title: Fabrikk & produksjon
  subtitle: 'SUP-fabrikk på 12 500 m² i Qingdao, Kina — skreddersydd SUP-produksjon fra PVC-råvare til ferdig oppblåsbare padlebrett'

answer:
  label: 'Tydelig svar'
  text: 'Sertifisert fabrikk for oppblåsbare SUP-er i Qingdao, Kina: ISO 9001, ISO 25649, BSCI, CE, REACH og RoHS. Produksjonsareal på 12 500 m² med 4 spesialiserte verksteder, over 350 medarbeidere, over 120 000 brett produsert per år (10 000 brett/måned på 4 automatiserte linjer). Hvert brett trykktestes i 24 timer ved 18.0 PSI, går gjennom en 100-punkts montasjeliste og har 10 års materialsporbarhet.'
  verified: 'September 2026'

intro:
  - 'Som produksjonsdivisjon i **Qingdao Vatrad Group Co., Ltd.** kontrollerer Vatrad hver fase i produksjonen av oppblåsbare SUP-er — fra mottak av PVC-råmaterialet til sluttinspeksjonen før levering av det ferdige padlebrettet. Vårt produksjonsanlegg i Qindaos økonomiske utviklingssone omfatter 12 500 kvadratmeter og rommer verksteder for PVC-kapping, laminering av drop-stitch-kjernen, digital trykking av SUP-er, sluttmontering og kvalitetskontroll.'
  - 'Ved å integrere design, konstruksjon, prototyping, produksjon og testing under ett tak eliminerer vi ineffektiviteten i orderbasert produksjon og beholder direkte kontroll over byggekvalitet, materialvalg og leveringstider. Hver SUP som forlater anlegget vårt, er bygget av våre mennesker, med vårt utstyr, etter våre standarder.'

