workshops_section:
  tagline: Verksteder
  title: Produksjonsverksteder
  workshops:
    - title: PVC-kapping og materialforberedelse
      description: 'Automatiske CNC-skjæremaskiner bearbeider PVC-, Hypalon- og drop-stitch-stoffer med submillimeternøyaktighet. Datamaskinoptimalisert nesting minimerer materialavfall og garanterer at hvert panel oppfyller de spesifiserte målene før sveising.'
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: CNC-skjæremaskin for PVC som forbereder stoffpanelene på en oppblåsbar SUP i fabrikken i Qingdao
    - title: Kammersveising og termisk sveising
      description: 'Spesialavdeling for sveising med varmluftssveiemaskiner og høyfrekvente dielektriske presser. Varmluftssveiemaskinene føyer og sveier sammen kamrene på de oppblåsbare brettene, mens HF-sveisingen skaper lufttette sømmer med høy styrke som overstiger kravene.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: HF-sveiemaskin som forsegler kamrene på oppblåsbare brett i fabrikken i Qingdao
    - title: Laminering av drop-stitch-kjernen
      description: 'Drop-stitch-kjernen i SUP-brettene limes til de ytre PVC-lagene gjennom varmlaminering. Tusenvis av polyestertråder forbinder over- og underlaget og skaper en stiv konstruksjon ved 12–15 PSI. Kantlistene limes gjennom tresjiktsfusjon for å gi kantene styrke.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Produksjonslinje for oppblåsbare SUP-er med laminering av drop-stitch-kjernen i fabrikken i Qingdao
    - title: Trykking og dekorasjon av SUP
      description: 'SUP-brettene dekoreres med digital trykking for grafikk i full farge og silkeskjermtrykk for logoer og gjentakende mønstre. De digitale skriverne produserer fotorealistiske deck-design, mens silkeskjermtrykken gir holdbare og fremtredende varemerker.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Interiør fra produksjonsavdelingen i fabrikken for oppblåsbare SUP-er i Qingdao
    - title: Sluttmontering og ferdigstilling
      description: 'Montasjelinje der ventiler, D-ringer, håndtak, finneholdere og deckpads monteres på hvert SUP-brett. Hvert brett følger en 100-punkts montasjeliste som undertegnes av skiftlederen.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Produksjonsavdeling med montasjestasjoner i fabrikken i Qingdao
    - title: Kvalitetskontroll og inspeksjon
      description: 'Hvert ferdig brett gjennomgår før levering et obligatorisk lufttetthetstest, en kontroll av sømdelaminering og en fullstendig systemkontroll. Kvalitetslaboratoriet vårt arbeider uavhengig av produksjonen og rapporterer direkte til ledelsen.'
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Trykktesting av en oppblåsbar SUP for lufttetthet før levering i fabrikken i Qingdao

