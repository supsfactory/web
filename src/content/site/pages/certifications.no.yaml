faqs:
  tagline: FAQ
  title: Vanlige spørsmål om kvalitetssystemet vårt
  items:
    - q: 'Kan jeg laste ned de faktiske inspeksjonsrapportene?'
      a: 'Ja. De sju tospråkige rapportheftene på denne siden — QIP, IQC, IPQC/FAI, lufttetthet, FQC, PSI og frigjøring før levering — er reelle kontrollerte registre med de reserverte feltene fjernet. De viser nøyaktig hvilken struktur, metoder og akseptkriterier som brukes i hver bestilling.'
    - q: 'Hvordan anvendes de sju punktene på prosjektet mitt?'
      a: 'Hvert prosjekt får en kvalitetsinspeksjonsplan (QIP) som definerer hvilke punkter som gjelder for produktet og markedet ditt, inspeksjonsomfanget ved hvert punkt og registre du får. Last ned QIP-eksemplet på denne siden for å se strukturen.'
    - q: 'Er disse inspeksjonseksemplene ekte?'
      a: 'Ja. Eksemplene følger vår faktiske kontrollerte registerstruktur — dokumenthode, inspeksjonssjekkliste, akseptkriterier, metode, resultat, inspektørens rolle og frigjøringsvedtak. Alle identifiserende verdier er erstattet med demoverdier (DEMO-*-koder), slik at ingen kundeopplysninger, grafikk, bestillinger eller priser avsløres.'
    - q: 'Hvorfor er eksemplene anonymisert?'
      a: 'Kjøpernes konfidensialitet har fortrang. Kundenavn, grafikk, bestillingsopplysninger, leverandørinformasjon og priser beskyttes med design. Med anonymisering kan enhver potensielle kjøper verifisere vår registerstruktur og sporbarhet uten å avsløre en annen kjopers kommersielle opplysninger.'
    - q: 'Kan vi få de komplette inspeksjonsrapportene for prosjektet vårt?'
      a: 'Ja. For godkjente prosjekter deler vi kvalitetsdokumentasjonen som gjelder bestillingen din — kvalitetsinspeksjonsplan, rapporter fra inngående varer, prosess, lufttetthet, sluttkontroll og emballasje, pluss frigjøringsgodkjenningen før levering — koblet til sporbarheten for partiet. Følsomme kommersielle opplysninger forblir under NDA iht. avtale.'
    - q: 'Hva inneholder et inspeksjonsregister koblet til et parti?'
      a: 'Hvert register kobler produksjonspartiet til den gjeldende spesifikasjons- eller tegningsrevisjonen, registrerer hvert kontrollpunkt mot akseptkriteriene med metode og brukt instrument, og avsluttes med inspektørens rolle, resultatstatus og frigjøringsvedtaket signert av Quality.'
evidence_review:
