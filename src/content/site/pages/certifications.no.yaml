hero:
  tagline: Kvalitetskontroll for tilpassede prosjekter
  title: 'Kvalitetskontroll for tilpassede oppblåsbare SUP-prosjekter'
  subtitle: 'Kvaliteten verifiseres mot det godkjente prøveeksemplaret, den tekniske spesifikasjonen, grafikken, stykklista og emballasjekravene for hvert prosjekt — ikke mot en generell påstand. Fra inngående kontroll til frigjøring før levering er inspeksjonsprosessen vår strukturert for å verifisere produktsamsvar i definerte produksjonsfaser. Driftet av QINGDAO VATRAD GROUP, oppblåsbar SUP-fabrikken på 12 500 m² bak Vatrad.'
