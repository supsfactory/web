  subtitle: 'Del produktkategorien, målmarkedet, estimert antall og eventuelle inspeksjons-, dokumentasjons- eller emballasjekrav. Vi verifiserer de gjeldende prosjektgrunnlagene og anbefaler neste steg for prøveutvikling eller produksjonsplanlegging. Et NDA-møte er mulig før ikke-offentlige spesifikasjoner, grafikk eller kvalitetskrav deles.'
