capabilities:
  tagline: Capaciteiten
  title: R&D-capaciteiten
  subtitle: Vier kerndisciplines geven ons end-to-end controle over productontwikkeling — van grondstofonderzoek tot de eindcertificering.
  groups:
    - title: Materiaalwetenschap & stoftechnologie
      items:
        - Analyse en optimalisatie van PVC- en Hypalon-formuleringen
        - Ontwikkeling van UV-stabilisatie, vlamvertragers en antimicrobiële additieven
        - Meerlaagse stoflaminering en techniek van lijmverbindingen
        - Versnelde verouderingstests (UV, thermisch, vocht, zoutsproeimist)
    - title: Romptechniek & hydrodynamica
      items:
        - Parametrisch 3D-rompontwerp en CFD-optimalisatie
        - Eindige-elementenanalyse voor structurele- en impactbelastingen
        - Sleeptankproeven met modellen en prestatievalidatie
        - Aangepaste rompontwikkeling voor speciale gebruiksprofielen
    - title: Lastechnologie & verbindingstechniek
      items:
        - Ontwikkeling en optimalisatie van het diëlektrische HF-lasproces
        - Hetelucht-, warmkegel- en ultrasoon lasprocessen
        - Kwalificatie van lijmverbindingen en naadtape
        - Modellering van lassterkte en levensduurvoorspelling
    - title: Testen, certificering & conformiteit
      items:
        - Kwaliteitsbeheer en CE-conformiteitstesten
        - Ondersteuning voor onafhankelijke partijtesten en -certificering door derden
        - Ontwikkeling van aangepaste testprotocollen voor inkoopkwalificatie
        - Veldstoringsanalyse en oorzaakonderzoek

