vision:
  tagline: Onze visie
  title: Vorm geven aan de toekomst van watersport
  body: Vatrad streeft ernaar de sector van rubberboten en SUP's te leiden door continue innovatie, standvastige kwaliteit en een sterk engagement voor veiligheid en duurzaamheid — en zo de ervaringen van watersportliefhebbers over de hele wereld te verrijken. Het R&D-centrum van Vatrad is de plaats waar passie innovatie ontmoet en waar nieuwe referentienormen voor de watersportsector worden vastgesteld.

labs_section:
  tagline: Laboratoria
  title: Onze laboratoria
  labs:
    - image: https://assets.supsfactory.com/images/sups/randd/supsfactory-pvc-material-lab.webp
      title: Laboratorium PVC-stoffen
      description: Doorlopend onderzoek en testen van opblaasbare PVC- en Hypalon-materialen op treksterkte, UV-bestendigheid, slijtage en koudeflexibiliteit, voor betrouwbaarheid op lange termijn in maritieme omgevingen.
      href: /nl/randdcenter/pvc-fabric-lab
    - image: https://assets.supsfactory.com/images/sups/factory/supsfactory-design-discussion-2.webp
      title: Studio romptechniek
      description: CAD-ondersteund ontwerp en eindige-elementenanalyse van rompen in HDPE, aluminium en glasvezel. Elke romp wordt digitaal gesimuleerd op spanningsverdeling en impactsterkte voordat het eerste prototype wordt gebouwd.
      href: /nl/randdcenter/hull-engineering
    - image: https://assets.supsfactory.com/images/sups/factory/supsfactory-sup-manufacturing-3.webp
      title: HF-lascentrum
      description: Speciale hoogfrequente lasfaciliteit met nauwkeurige controle van temperatuur en druk, die hoogsterke, luchtdichte naden produceert volgens branchenormen voor opblaasbare boten.
      href: /nl/randdcenter/rf-welding
    - image: https://assets.supsfactory.com/images/sups/factory/supsfactory-design-discussion-original.webp
      title: Hydrodynamische sleeptank
      description: Modelproeven in onze sleeptank om rompvorm, planeren, stabiliteit en rendement te optimaliseren over een reeks belastings- en golfcondities.
      href: /nl/randdcenter/hydrodynamic-test-tank
    - image: https://assets.supsfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypewerkplaats
      description: Faciliteit op ware grootte voor prototyping en afbouw, waar nieuwe modellen worden gebouwd, afgewerkt en beproefd op het water. Elk prototype doorloopt een watertestprogramma van minimaal 20 uur voordat het voor productie wordt goedgekeurd.
      href: /nl/randdcenter/prototype-workshop
    - image: https://assets.supsfactory.com/images/sups/factory/supsfactory-uv-resistance-testing.webp
      title: Kwaliteits- & testlaboratorium
      description: Toegewijd kwaliteitslaboratorium voor trektests, luchtdichtheidscycli, naadpeeltests en materiaalcertificering, om te garanderen dat elke boot die de werkplaats verlaat voldoet aan onze gepubliceerde specificaties.
      href: /nl/randdcenter/quality-inspection-lab