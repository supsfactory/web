faqs:
  tagline: Jakelijoiden UKK
  title: 'Tukkujakeluohjelma — usein kysytyt kysymykset'
  items:
    - q: 'Mikä on uuden jakelijan vähimmäistilaus?'
      a: 'Uudet jakelukumppanit aloittavat yleensä näyte- ja esituotantohyväksyntätilauksella, minkä jälkeen ensimmäinen kontti ajoitetaan heidän kaudelleen. Tarkat vähimmäismäärät riippuvat alueen koosta ja valitusta valikoimasta; tilinhoitajasi vahvistaa aloitusmäärän valikoima- ja brändisuunnittelun yhteydessä.'
    - q: 'Voimmeko myydä laudat omalla brändillämme?'
      a: 'Kyllä. Private label on tässä vakiomalli: laudat valmistetaan brändisi alla omilla asiakkuaineillasi, pakkauksillasi ja määrityksilläsi. iSupfactory valmistaa yksinomaan asiakkailleen eikä kilpaile heidän kanssaan millään markkina-alueella.'
    - q: 'Ovatko alueet yksinoikeutettuja?'
      a: 'Kyllä. Jakeluohjelmat rakentuvat yksinoikeusalueille — jokainen tukkukumppani vastaa määritetystä maasta tai alueesta ja saa kyseiselle markkinalle hinnoittelun ja ohjelmatuen kaupallisen sopimuksen mukaisesti.'
    - q: 'Tuketteko suoratoimitusta?'
      a: 'Suoratoimitusmahdollisuus kuuluu ohjelmaan. Näytteet, pakkaus ja käsittely validoidaan näytehyväksymisvaiheessa, jotta suoratoimitustilaukset toimivat suoraan alusta asti.'
    - q: 'Mitä malleja voimme tilata?'
      a: 'Valmistusluettelo kattaa puhallettavat SUP-laudat allround-, touring- ja surf-muodoissa, puhallettavat kajakit, pumput, melanat, pelastusliivit ja hoitoon liittyvät lisävarusteet sekä insinööritiimimme kanssa kehitetyt muodot. Useimmat kumppanit aloittavat 4–8 myydyimmästä SKU:sta ja laajentavat valikoimaa myöhemmin kausina.'
    - q: 'Miten tilaukset lähetetään?'
      a: 'Tilaukset lähtevät tehtaalta ajastetuin laivavuoroin, ja ennakkotilaus on mahdollista rahtikustannusten vakauttamiseksi. Omistettu tilinhoitajasi suunnittelee tuotannon ja lähetyksen ennusteesi ja kausikalenterin mukaan.'
    - q: 'Miten haen?'
      a: 'Käytä tämän sivun hakemuslomaketta tai ota yhteyttä suoraan. Jakelutiimi käsittelee hakemukset, ja vastaamme seuraavilla toimilla, mukaan lukien alueen kartoituksen ja sopimusluonnoksen, muutaman työpäivän kuluessa.'

