hero:
  tagline: 'Проверка завода'
  title: 'Проверьте завод по производству SUP до принятия решения'
  subtitle: 'Принимать завод на веру не следует. Организуйте визит, проведите независимый аудит или инспекцию и изучите сертификаты, записи QC и отслеживаемость партий до первого заказа — все это открыто для серьезных покупателей.'

answer:
  label: 'Прямой ответ'
  text: 'Площадка iSupfactory — это производство площадью 12,500 m² в Циндао, провинция Шаньдун, Китай, с 350+ сотрудниками, 4 автоматизированными производственными линиями и 4 специализированными цехами. Покупатели могут проверить его четырьмя способами: посетить площадку в любое время года, провести аудит самостоятельно или совместно (BSCI, ISO 9001), заказать стороннюю инспекцию (SGS, TÜV, BV, Intertek; выборка уровня II по ISO 2859-1) или изучить задокументированные подтверждения — сертификаты, чек-листы сборки по 100 пунктам, протоколы 24-часового испытания удержанием давлением 18.0 PSI и 10-летнюю прослеживаемость партий в ERP по каждой серийной этикетке.'
  verified: 'Сентябрь 2026'

features:
  title: 'Способы проверки завода'
  subtitle: 'Четыре маршрута проверки, каждый из которых организует ваш специалист по проекту — выберите один или скомбинируйте.'
  items:
    - title: 'Запланировать визит на завод'
      description: 'Мы принимаем визиты покупателей в Циндао круглый год, организуя встречу в аэропорту и обход производственных площадок в удобные для вас даты. NDA доступен в любой момент.'
      icon: 'tabler:map-pin'
    - title: 'Сторонний аудит'
      description: 'Отчеты аудита BSCI и ISO 9001 доступны по запросу, а совместные аудиты приветствуются, чтобы вы могли пройти по цехам вместе с аудитором.'
      icon: 'tabler:clipboard-check'
    - title: 'Независимая инспекция'
      description: 'Предотгрузочная или инспекция в процессе производства от SGS, TÜV, BV или Intertek по выборке уровня II ISO 2859-1 — за ваш счет, с нашей организацией, отчет направляется напрямую вам.'
      icon: 'tabler:zoom-check'
    - title: 'Проверка документации'
      description: 'Копии сертификатов, записи входного, операционного и финального контроля, протоколы испытания удержанием давлением и файлы отслеживаемости партий предоставляются до принятия решения.'
      icon: 'tabler:file-search'
    - title: 'Видеообход в реальном времени'
      description: 'Пока не можете приехать? Мы покажем производственные цеха в режиме реального времени — обработка drop stitch, сварка, печать, сборка, испытания и упаковка — до размещения заказа.'
      icon: 'tabler:device-camera-phone'

faq_section:
  tagline: 'Вопросы о проверке'
  title: 'Проверка и инспекция завода — вопросы и ответы'
  questions:
    - q: Где находится завод?
      a: 'Площадка находится в Циндао, провинция Шаньдун, Китай — производство площадью 12,500 m² с 350+ сотрудниками, 4 автоматизированными линиями и 4 специализированными цехами. Адрес и карта предоставляются проверенным покупателям при планировании визита, а адрес производственной площадки указывается в договорах, аудите BSCI и экспортной документации.'
    - q: Что производит завод?
      a: 'Надувные доски SUP — от проектирования корпуса и обработки ядра drop stitch до графики, сборки, испытаний и экспортной упаковки. Все ключевые процессы по SUP выполняются под одной крышей.'
    - q: Какие процессы выполняются собственными силами?
      a: 'Проектирование корпуса, габаритная инженерия, обработка ядра drop stitch, ВЧ-сварка, печать графики, раскрой EVA-ковриков, изготовление индивидуальной пресс-формы, сборка, испытания и упаковка выполняются собственными силами. Аксессуары и часть сырья поступают от сертифицированных поставщиков и комплектуются на площадке для прослеживаемости.'
    - q: Могут ли покупатели посетить завод?
      a: 'Да. Визиты покупателей принимаются в Циндао круглый год. Встречу в аэропорту Циндао Цзяодун и полный обход производственных цехов организует ваш специалист по проекту.'
    - q: Могут ли покупатели организовать стороннюю инспекцию?
      a: 'Да. Инспекции SGS, TÜV, BV и Intertek приветствуются до производства или во время него. Предотгрузочная инспекция проводится по выборке уровня II ISO 2859-1, а отчет направляется вам напрямую от инспекционной организации.'
    - q: Могут ли покупатели запросить документацию QC?
      a: 'Да. Копии сертификатов, записи входного, операционного и финального контроля, протоколы 24-часового испытания удержанием давлением 18.0 PSI и чек-лист сборки по 100 пунктам выдаются по каждой партии по запросу.'
    - q: Как ведется отслеживаемость партий?
      a: 'Каждая доска имеет серийную этикетку. Партии вносятся в 10-летний реестр ERP, который связывает рулон ткани, материалы, дату производства, операторов и результаты испытаний с каждым серийным номером.'
    - q: Как используется утвержденный образец?
      a: 'Утвержденный образец становится эталоном производства. Материалы, размеры, графика, аксессуары и отделка сверяются с ним на каждом контрольном вороте QC, поэтому производство соответствует тому, что вы утвердили.'
    - q: Как контролируется качество производства?
      a: '7-этапная система качества (Node 01–07) охватывает входной контроль материалов, контроль в процессе и финальную инспекцию, включая 24-часовой тест удержания давлением 18.0 PSI (автоматический брак при падении более 0,50 PSI) и выпуск на конечной линии по выборке уровня II ISO 2859-1.'

