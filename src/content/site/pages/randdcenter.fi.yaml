  title: T&K-keskus
  subtitle: Keskittyy edistykseen

intro:
  - Vatradin tutkimus- ja kehityskeskus (T&K) on moottori missionamme mullistaa vesiurheiluvälineet. Annamme vesiurheilun harrastajille ympäri maailmaa turvallisempia, mukavampia ja nautinnollisempia tuotteita jatkuvalla innovoinnilla puhallettavissa seisulaut SUP-laudoissa ja veneissä. Omistautunut insinööri-, suunnittelija- ja intohimoisten vesiurheilun asiantuntijatiimimme muokkaa alan tulevaisuutta ja nostaa jatkuvasti laatua, suorituskykyä ja kestävyyttä.
  - T&k-tilamme kokoaa samat katokseen materiaalitieteilijät, laivanrakentajat ja tuotantoinsinöörit. Kankaan muotoilusta ja rungon simuloinnista hitsausprosessien kehittelyyn ja täysmittakaavaiseen merikokeeseen — jokainen tuotekehityksen vaihe nojaa dataan ja varmennetaan testeillä.

mission:
