    - icon: shield
      title: Kompromissiton turvallisuus
      desc: Korkeimpien turvallisuusstandardien varmistaminen tiukkojen testien ja sertifioinnin kautta.

pillars:
  - title: Teknologinen edistyminen
    desc: Uusien materiaalien, suunnittelujen ja tuotantoprosessien edelläkävöinti erinomaisen tuotesuorituskyvyn ja kestävyyden saavuttamiseksi.
    icon: tech
  - title: Edistyneet materiaalit
    desc: Huippuluokan PVC:n, Hypalonin, komposiittien ja kestävien vaihtoehtojen tutkiminen tuotteen ominaisuuksien parantamiseksi.
    icon: materials
