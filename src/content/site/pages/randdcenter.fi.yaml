vision:
  tagline: Näkymämme
  title: Muokkaamme vesiurheilun tulevaisuutta
  body: Vatrad pyrkii johtamaan puhallettavien veneiden ja SUP-laautojen alaa jatkuvalla innovoinnilla, horjumattomalla laadulla sekä vakaalla sitoumuksella turvallisuuteen ja kestävyyteen — mikä rikastuu lopulta vesiurheilun harrastajien kokemuksia ympäri maailmaa. Vatradin T&K-keskus on paikka, jossa intohimo kohtaa innovaation ja alalle asetetaan uudet standardit.

labs_section:
  tagline: Laboratoriot
  title: Laboratoriotemme
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: PVC-kangaslaboratorio
      description: Jatkuva PVC- ja Hypalon-putkikankaiden tutkimus ja testaus vetolujuuden, UV-kestävyyden, hankauksen ja matalan lämpötilan taivutuksen osalta pitkäikäisyyden varmistamiseksi meriympäristöissä.
      href: /fi/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Rungon suunnittelustudio
      description: CAD-ohjattu suunnittelu ja HDPE-, alumiini- ja lasikuiturunkojen elementtimenetelmäanalyysi. Jokainen runko simuloidaan digitaalisesti jännityksen jakauman ja iskunkestävyyden osalta ennen ensimmäisen prototyypin rakentamista.
      href: /fi/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: RF-hitsauskeskus
      description: Omistettu radiotaajuushitsauslaitos, jossa on tarkka lämpötila- ja paineohjaus ja joka tuottaa suuren lujuuden omaavia, ilmatiiviitä saumoja, jotka täyttävät puhallettavien alusten teollisuusstandardit.
      href: /fi/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hydrodynaaminen testialta
      description: Pienmallitestit omassa testialtaassamme rungon muodon, liikkeelle lähtö- ja vakausominaisuuksien sekä polttoaineen kulutuksen optimointiin eri kuormitus- ja meriolosuhteissa.
      href: /fi/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototyyppiverstas
      description: Täysmittakaavainen prototypointi- ja varustelutila, jossa uudet mallit rakennetaan, sovitetaan ja testataan merellä. Jokainen prototyyppi käy läpi vähintään 20 tunnin vesitestin ennen tuotantohyväksyntää.
      href: /fi/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Laatu- ja tarkastuslaboratorio
      description: Omistettu laadunvarmistuslaboratorio, joka suorittaa vetotestejä, ilman säilymisen syklejä, saumojen kuorimisen testejä ja materiaalisertifiointia varmistaakseen, että jokainen verstasta lähtevä vene vastaa julkaistuja spesifikaatioitamme.
      href: /fi/randdcenter/quality-inspection-lab
