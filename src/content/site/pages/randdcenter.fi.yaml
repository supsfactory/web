capabilities:
  tagline: Osaaminen
  title: T&k-osaaminen
  subtitle: Neljä ydinosa-aluetta, jotka antavat meille päästä päähän tuotekehityksessä — raaka-ainetutkimuksesta loppusertifiointiin.
  groups:
    - title: Materiaalitiede ja kangastekniikka
      items:
        - PVC:n ja Hypalonin muotoilun analyysi ja optimointi
        - UV-stabilointi, palonestoaineet ja antimikrobisten lisäaineiden kehittäminen
        - monikerroksisen kankaan laminointi ja tarttumisen insinööriys
        - Kiihdytetyt vanhenemistestit (UV, lämpö, kosteus, suolasumu)
    - title: Rungon suunnittelu ja hydrodynamiikka
      items:
        - Parametristen 3D-runkojen suunnittelu ja CFD-optimointi
        - Elementtimenetelmäanalyysi rakenteellisille ja iskuille kohdistuville kuormille
        - Pienmallin vetoallastestit ja suorituskyvyn validointi
        - Runkojen kehittely erikois käyttötarkoituksiin
    - title: Hitsaus- ja liitäntätekniikka
      items:
        - RF-dielektrisen hitsausprosessin kehittäminen ja optimointi
        - Kuumailma-, kuumakiilä- ja ultraäänihitsausmenetelmät
        - Liimautus ja saumanauhan kelpuutus
        - Hitsin lujuuden mallintaminen ja eliniän ennustaminen
    - title: Testaus, sertifiointi ja vaatimustenmukaisuus
      items:
        - Laadunjohto ja CE-vaatimustenmukaisuustestit
        - Riippumattomat kolmansen osapuolen testit ja sertifiointituki
        - Hankintakelpoisuutta varten kehitettävät räätälöidyt testimenetelmät
        - Käytönaikainen vika-analyysi ja juurisyyn selvitys

