answer:
  label: 'Kort svar'
  text: 'Drop-stitch er et stoff der polyestertrådbroer holder oversiden og undersiden av PVC-et på et bestemt avstand — lufttrykket gjør deretter brettet stivt. Vatrads kjerner: 1 680 DTEX, 2 tråder per kvadrattomme, overflatelaminat av PVC på 1.2 mm, dimensjonert for 15 PSI og validert med 24 timers trykkholdetest ved 18.0 PSI.'
  verified: 'September 2026'

