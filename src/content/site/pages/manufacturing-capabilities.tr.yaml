faq_section:
  tagline: SSS
  title: SUP Üretim Yeteneği Soruları
  questions:
    - q: Hangi üretim süreçleri şirket içindedir?
      a: 'Tüm çekirdek süreçler şirket içindedir: gövde mühendisliği, drop-stitch çekirdek işleme, RF kaynak, baskı, EVA kalıp kesimi, montaj, test ve ambalajlama. Aksesuarlar ve bazı hammaddeler belgeli tedarikçilerden gelir; eksiksiz izlenebilirlik için nihai set hazırlama şirket içinde yapılır.'
    - q: Üretim kapasiteniz nedir?
      a: '12.500 m²lik tesiste, 350+ işçiyle 4 otomatik hatta ve 4 uzmanlaşmış atölyede yılda 120.000+ tahta (ayda yaklaşık 10.000).'
    - q: Bu yetenekler için hangi MOQ geçerlidir?
      a: 'Standart hacim, onaylı yapılandırma başına 90–100+ birim (tek bir 150 m drop-stitch kumaş rulosu); mevcut platformlarda pilot üretimler 20–50 birimden başlar; yalnızca logo içeren siparişler 5–10 birimden başlar.'
    - q: Hangi teslim sürelerini planlamalıyız?
      a: 'Prototip numuneler 7–12 günde; onaylanmış PO ve depozitodan sonra üretim 25–35 günde; özel kalıp geliştirme aparat için 15–20 gün ekler.'
    - q: Yetenekler kaliteye nasıl dönüşür?
      a: 'Her süreç 7 aşamalı kalite sistemini besler: 100 maddelik montaj kontrol listesi, 0.50 PSI düşümün üzerinde otomatik ret uygulanan 18.0 PSI 24 saatlik basınç tutma, ISO 2859-1 Seviye II örnekleme ve 10 yıllık ERP parti izlenebilirliği.'

