hero:
  tagline: Üretim Yetenekleri
  title: 'SUP Üretim Yetenekleri'
  subtitle: 'Her süreç — gövde mühendisliği, drop-stitch çekirdek işleme, RF kaynak, baskı, kalıp aparatı, montaj, test ve ambalajlama — 12.500 m²lik Qingdao tesisimizde şirket içinde yürütülür; böylece tek bir sorumlu ekip projenizi ilk çizimden sevk edilmiş konteynere kadar yönetir.'

answer:
  label: 'Net cevap'
  text: 'SUP üretimi Qingdao tesisimizde tamamen şirket içindedir: 0,1 mm CNC hassasiyetinde gövde tasarımı ve ölçü mühendisliği; 4 otomatik hatta drop-stitch malzeme işleme ve RF kaynak; grafik baskısı; EVA ped kalıp kesimi; özel kalıp aparatı (yeni biçimler için +15–20 gün); 100 maddeli kontrol listesine göre montaj; ve 0,50 PSI üzerindeki düşümde otomatik ret uygulanan 18.0 PSI 24 saatlik basınç tutma testi. Yıllık kapasite, 350+ işçilik 4 uzmanlaşmış atölyeden 120.000+ tahtadır (ayda ~10.000), kendi markanız altında 50+ ülkeye sevk edilir.'
  verified: 'Eylül 2026'

