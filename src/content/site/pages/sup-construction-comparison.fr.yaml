hero:
  tagline: 'Guide de construction'
  title: 'Comparaison de construction SUP'
  subtitle: 'Trois types de construction, une seule ligne de production. Comprenez les compromis de rigidité, poids, durabilité et coût entre les planches SUP mono-couche PVC, double-couche PVC et noyau drop-stitch — et laquelle correspond à votre pagayeur cible et positionnement marché.'

answer:
  label: 'Comparaison rapide'
  text: 'Le mono-couche PVC est le plus léger et abordable — idéal pour les pagayeurs occasionnels et les marchés sensibles au prix. Le double-couche PVC ajoute une seconde peau PVC pour rigidité et durabilité à poids modéré — le choix standard du secteur pour les flottes de location et marques milieu de gamme. Le noyau drop-stitch avec coque PVC offre la plus haute rigidité et tolérance de pression — privilégié pour performance, surf et gros pagayeurs. Les trois constructions sont fabriquées sur la même ligne avec les mêmes portes QC ; la différence est dans les matériaux et étapes de lamination.'
  verified: '2026-08'

