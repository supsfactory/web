key_factors:
  heading: 'Facteurs clés au-delà du type de construction'
  body: |
    Le type de construction est une variable de la performance de la planche. Trois facteurs additionnels comptent autant ou plus :

    - **Densité drop-stitch** — Le nombre de fils par pouce détermine à quel point la planche garde sa forme uniformément sous pression. Nous utilisons 96 fils/pouce en standard et 140 fils/pouce pour les builds performance. Densité plus élevée = planche plus plate = meilleure glisse.
    - **Qualité et épaisseur du PVC** — Tout le PVC n''est pas égal. Le PVC coréen importé de 0,7 mm a une meilleure résistance à la déchirure et aux UV que les alternatives plus fines. Nous spécifions le grade du matériau par projet.
    - **Construction de rail** — Les rails mono-couche sont le point de défaillance le plus courant sur les planches bon marché. Le ruban de rail double-couche et renforcé réduit drastiquement le risque de perforation de rail. Toutes nos planches utilisent des rails renforcés quel que soit le niveau de construction.

faqs:
  tagline: FAQ
  title: 'Construction SUP — Questions fréquentes'
  items:
    - q: 'Quel type de construction choisir pour ma marque ?'
      a: 'Cela dépend de votre marché cible et positionnement prix. Entrée de gamme et grande distribution : mono-couche. Flottes de location, clubs et marques milieu de gamme : double-couche. Performance, touring et premium : noyau drop-stitch. La plupart des marques démarrent en double-couche comme meilleur équilibre coût, durabilité et expérience pagayeur. Nous recommandons selon votre marché spécifique lors de la revue de faisabilité.'
    - q: 'Puis-je offrir plusieurs niveaux de construction sous une seule marque ?'
      a: 'Oui — beaucoup de marques offrent deux ou trois niveaux. Nous produisons les trois constructions sur la même ligne avec les mêmes portes QC, donc vous pouvez mélanger les types de construction dans une seule commande. La forme de la carène et les graphismes peuvent être identiques entre niveaux ; seule la construction et les matériaux changent.'
    - q: 'Quelle est la norme de test de pression pour toutes les constructions ?'
      a: 'Chaque planche, quel que soit le type de construction, passe un test de maintien 18,0 PSI avec rejet automatique au-delà d''une chute de 0,50 PSI sur 24 heures. Les planches mono-couche sont cotées pour 12–15 PSI de pression de ride, double-couche pour 15–18 PSI, et noyau drop-stitch pour 18–25 PSI. La pression de test excède la pression cotée pour tous les types.'
    - q: 'Comment la construction affecte-t-elle les réclamations de garantie ?'
      a: 'Les planches mono-couche ont un taux de réclamation de garantie marginalement plus élevé en usage commercial/locatif dû à l''exposition rail et perforation. Les constructions double-couche et noyau drop-stitch ont des taux de réclamation significativement plus bas. Nous fournissons les données de garantie par niveau depuis nos registres de production lors de la phase de devis.'

