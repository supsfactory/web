moq_faqs:
  tagline: FAQ
  title: Usein kysytyt kysymykset MOQ:sta
  items:
    - q: 'Lasketaanko MOQ tilauksen, mallin vai väriversion mukaan?'
      a: 'MOQ voi koskea mallia, väriversiota, artwork-versiota, pakkauskokoonpanoa tai kokonaismäärää. Koska eri drop-stitch-paksuudet (12 cm ja 15 cm) ja PVC-värit tulevat eri raaka-aineeräistä, 50 laudan tilaaminen 5 värillä jakautuu 5 erilliseksi kangasrullatarpeeksi. Vahvistamme tarkan laskelman SKU-matriisiasi mukaan ennen tarjousta, jotta voit suunnitella sekoituksesi selvästi.'
    - q: 'Voinko tilata näytteen ennen massatuotantoa?'
      a: 'Kyllä. Näytteen kehittely (1–2 kpl) varmennaa rungon jäykkyyden, EVA-koostumatyynyn pinnan, kuvituksen tarkkuuden ja lisävarusteiden istuvuuden ennen massatuotannon vapauttamista. Näytemaksut koskevat ja vähennetään tuotantotilauksestasi sopimuksen allekirjoituksen yhteydessä.'
    - q: 'Miksillä räätälöidyllä vähittäiskauppapakkauksella on oma MOQ?'
      a: 'Räätälöidut fleksopaino- ja offset-laatikkopainolaitteet vaativat vähimmäistuotannon 500+ kpl. Tarjoamme Hybrid Packaging Storage Solution -ratkaisun: valmistamme 500 räätälöityä painettua laatikkoa, säilytämme ylijäämän puhtaassa varastossamme ja luovutamme ne lautaerien aikataulussa — pienempi lautaerä voidaan siis lähettää täysin brändätyissä vähittäiskauppapakkauksissa.'
    - q: 'Miksi vakiintunut volyymi-MOQ on 90–100 kpl?'
      a: 'Vakiintunut volyymi-MOQ seuraa raaka-ainetta: korkealaatuisen drop-stitch-kankaan 150 m:n päälask roll tuottaa noin 90–100 valmista lautaa vakiintuneelle retkeily- tai all-around-rungolle. Täysien rullien ajo eliminoi kangasliitokset, pitää kuitujännitteen tasaisena ja poistaa 2 tunnin hitsaus- ja laminointilinjan kalibroinnin kustannukset erän yli — ja tuottaa matalimman mahdollisen yksikkökustannuksen.'
    - q: 'Pienentääkö suurempi määrä yksikkökustannusta?'
      a: 'Useimmissa projekteissa kyllä. Suuremmat määrät parantavat materiaalisaantoa, jakavat tuotantolinjan kiinteät asennuskulut useammalle laudalle ja pienentävät yksikkökohtaista pakkauskustannusta.'
    - q: 'Soveltuuko co-brandingin muottimaksu uudelleen uusintatilauksissa?'
      a: 'Ei. Silk screen -painatuksen muottimaksut laskutetaan kerran perustamisvaiheessa ja poistetaan uusintatilauksista, joissa käytetään samaa artwork-mittaa. Maksat vain tehtaan käsittely- ja painatusmaksun, joka on $1.00 USD lautaa kohti.'
    - q: 'Sitouduinko tilaukseen pyytämällä MOQ-opastusta?'
      a: 'Ei. Projektin MOQ-opastuksen pyytäminen antaa Qingdao Vatrad Group Co., Ltd.:n tuotetekniikan tiimille mahdollisuuden käydä tekninen briefisi läpi ja neuvoa kustannustehokkaimman tuotantoradan. Salassapitosopimus (NDA) on saatavilla ennen kuin jaat luottamukselliset tekniset määritykset tai artworkin.'

evidence_review:
  tagline: 'Näyttö ja todentaminen'
  title: 'TODENNETUT MÄÄRITYKSET'
