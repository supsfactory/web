      impact: 'Olemassa olevat alustat: pilottitilaukset 20 kpl:stä. Räätälöidyt rungot: vaatii oman työkaluston poistamisen.'
    - component: 'Väriversiot ja PVC'
      driver: 'Yksittäiset vakiintuneet varasovärit vai omat Pantone-väreillä värjätyt PVC-levyt'
