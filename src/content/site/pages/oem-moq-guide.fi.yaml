moq_stages:
  tagline: Näyte · Pilotti · Volyymi
  title: 'Kolme erillistä määrävaihetta'
  subtitle: 'Näyte-, pilotti- ja volyymituotannon määrät eroavat toisistaan. Jokainen projekti luokitellaan kolmeen erilliseen tasoon, jotta varmennat ennen kuin sitoudut.'
  steps:
    - step: '01'
      title: 'Näytteen kehittely (1–2 kpl)'
      desc: 'Fyysinen vahvistus rungon jäykkyydestä, EVA-koostumatyynyn pinnasta, kuvituksen tarkkuudesta ja lisävarusteiden istuvuudesta ennen mitään taloudellista sitoumusta. Näytemaksut koskevat ja vähennetään tuotantotilauksestasi sopimuksen allekirjoituksen yhteydessä.'
    - step: '02'
      title: 'Pilottitilaus (20–50 kpl)'
      desc: 'Esikauden kaupallinen testaus ja alueellinen markkinavarmennus olemassa olevilla runkoalustoilla, varastomateriaaleilla ja yksinkertaisella pakkauksella, jotta asennuskitka pysyy minimaalisena.'
    - step: '03'
      title: 'Volyymituotanto (90–100+ kpl)'
      desc: 'Vahvistetaan jäädytetyn materiaaliluettelon, lopullisen artworkin, räätälöidyn pakkauksen ja aikataulutetun toimitussuunnitelman jälkeen — täydet 150 m:n kangasrullat, omat Pantone-kankaat, räätälöity pakkaus, volyymialennukset ja koko ketjun eräjäljitettävyys.'

