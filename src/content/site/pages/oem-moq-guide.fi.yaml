hero:
  tagline: 'Läpinäkyvä ja projektikohtainen'
  title: 'Joustavan brändäyksen ja valmistuksen MOQ-opas'
  subtitle: 'Ymmärrä se drop-stitch-raaka-aineen fysiikka, joka määrää SUP-tuotannon eräkoot — ja miten matalan kynnyksen co-branding-ohjelmamme toimii vuokrausoperaattoreille, seuroille, lomakeskuksille ja kasvaville vesiliikuntabrändeille. Suunnittelee ja toteuttaa Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Suora vastaus'
  text: 'MOQ ei ole kaikille sama luku. Jokainen MOQ vahvistetaan projektin konfiguraation mukaan: rungon muoto ja työkalusto, väriversiot ja PVC, artworkin monimutkaisuus, pakkaus ja lisävarustevalikoima. Täysin räätälöity volyymituotanto toimii 90–100 kpl eräkokoina vakiintuneelta 150 m:n drop-stitch-kankaarullalta; pien-erän co-branding alkaa 5–10 kpl:stä; ja jokainen projekti jaetaan kolmeen erilliseen vaiheeseen — näytteen kehittely (1–2 kpl), pilottitilaus (20–50 kpl) ja volyymituotanto (90–100+ kpl). Vahvistamme tarkan laskelman SKU-sekoituksellesi ennen tarjousta — ei epämääräisiä "matalan MOQ:n" lupauksia, ei piilotettuja kompromisseja.'
  verified: 'Syyskuu 2026'

moq_principle:
  tagline: Tuotetekninen logiikka
  title: 'Miksi vakiintunut volyymi-MOQ on 90–100 kpl: raaka-aineen rullafysiikka'
  subtitle: 'Tuotantoerien koko ei ole myyntitiimin keksimä luku — ne määräytyvät drop-stitch-kankaan rullapituuksista ja linjan vaihtojen fysiikasta.'
  body: |
    **150 metrin raakakankaan perustaso.** Suuren vetolujuuden kudottu drop-stitch-kangas valmistetaan ja päällystetään jatkuville päälaskeille. Vakiintunut yhden erän teollisuusrullan pituus on 150 metriä jatkuvaa materiaalia.

    **Saantolaskelma (90–100 lautaa).** Vakiintuneen retkeily- tai all-around-SUP-rungon (10 ft 6 in–11 ft 6 in) tapauksessa yksi täydellinen 150 m:n päälaskerulla tuottaa noin 90–100 valmista paddle boardia.

    **Nolla kangasliitospolitiikka.** Täydet kangasrullat varmistavat rakenteellisen jatkuvuuden — ei poikittaisia korkean riskin kangasliitoksia eikä epätasaista kuitujännitettä laudan ylä- ja alapinnoilla.

    **Lämpö- ja liimakalibrointi.** Automatisoitu korkeataajuuksinen kuumailmahitsaus- ja meriliimalaminointilinja vaatii 2 tuntia esilämmitystä, lämpötilaprofiilia ja painekalibrointia. Täysi 90–100 kpl:n erä jakaa nämä kiinteät asennuskustannukset ja tuottaa matalimman mahdollisen yksikkökustannuksen.

