faqs:
  tagline: FAQ
  title: Domande frequenti sul controllo delle modifiche di rilavorazione
  items:
    - q: 'La fabbrica può modificare i parametri di rilavorazione senza informarci?'
      a: 'No. Ogni modifica proposta a materiali di rilavorazione rilasciati, condizioni di processo, attrezzature, metodi di prova, criteri di ispezione o personale autorizzato deve prima passare attraverso un controllo delle modifiche documentato. Le modifiche che interessano specifiche approvate dal cliente, campioni, BOM, grafiche o criteri di accettazione richiedono il rilascio scritto del cliente.'
    - q: 'Cosa conta come modifica ad alto rischio?'
      a: 'Le modifiche a materiali o fornitori di rilavorazione, condizioni di pressione/mantenimento o polimerizzazione, metodi di rilavorazione di valvole/rail/cuciture, criteri di ispezione o accettazione e l''estensione dell''ambito del difetto verso zone strutturali sono classificate ad alto rischio. Richiedono verifica interfunzionale, un piano di validazione rilasciato e implementazione pilota controllata prima dell''uso di routine.'
    - q: 'Una deviazione temporanea può essere usata senza limiti?'
      a: 'No. Ogni deviazione temporanea porta una finestra di validità definita, un ambito di partita, un tetto di quantità e requisiti di validazione con scadenza automatica. Il raggiungimento del tetto blocca la partita e blocca la stampa del tag di passaggio finché la modifica non è formalmente valutata.'
    - q: 'Come si dimostra che un metodo modificato è funzionante prima dell''uso pieno?'
      a: 'Le modifiche ad alto rischio richiedono un piano di validazione: almeno 5 tavole campione rappresentative che coprono i limiti di tolleranza, testate da 2 ispettori QC indipendenti contro criteri di accettazione quantificati (eliminazione perdite, mantenimento pressione, funzione valvola, durata delle cuciture, aspetto). Il rilascio alla validazione non è un rilascio per l''applicazione.'
    - q: 'Dobbiamo rilasciare ogni modifica?'
      a: 'Non ogni modifica, ma ogni modifica che allontana il prodotto dal campione approvato dal cliente, dalla specifica tecnica, dalla BOM, dalla grafica, dall''imballaggio o dai criteri di accettazione viene implementata solo con il rilascio scritto del cliente. Senza di esso, le tavole vengono rilavorate, sostituite o respinte secondo il requisito originale.'
    - q: 'Cosa succede ai vecchi documenti quando una modifica viene rilasciata?'
      a: 'Le vecchie istruzioni di lavoro, le schede parametri e i fogli di ispezione vengono fisicamente ritirati e invalidati (1-in-1-out), marcati OBSOLETE e sostituiti dalla nuova revisione controllata dopo la formazione. Le versioni vecchie e nuove non condividono mai una postazione di lavoro.'
    - q: 'Per quanto tempo vengono conservate le registrazioni del controllo modifiche?'
      a: 'Le registrazioni di chiusura — evidenze di validazione, revisioni documentali, evidenze di formazione e prove di efficacia — vengono conservate secondo la nostra politica di conservazione (almeno 3 anni per le registrazioni di chiusura), così ogni modifica rimane ricostruibile per audit e verifiche di rintracciabilità.'

