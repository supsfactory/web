cc_intro:
  tagline: Ambito & politica
  title: Principi di governance core
  body: |
    **Documento:** QMS-SOP-QC-CC-001 — *Standard del controllo delle modifiche per i parametri di processo di rilavorazione* (Rev 2.0, pubblicazione ufficiale). **Produttore:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Riferimento standard:** ISO 9001:2015 Sistemi di gestione per la qualità.

    - **Niente modifiche non controllate.** Le modifiche ai parametri di rilavorazione devono passare attraverso un controllo formale delle modifiche. Gli operatori sul campo, i capi turno o un singolo reparto non devono mai modificare i parametri di rilavorazione rilasciati con un accordo verbale o una registrazione manoscritta in un verbale di rilavorazione.
    - **Copertura completa degli elementi.** L''ambito controllato comprende tenuta all''aria, sedi delle valvole, rail band, incollaggio delle cuciture, polimerizzazione ad aria calda e test di mantenimento della pressione — ogni parametro che può influenzare sigillatura, durata strutturale, aspetto, accettazione del cliente o rintracciabilità.
    - **Il rilascio del cliente come punto centrale.** Ogni modifica che allontana un prodotto dal campione approvato dal cliente, dalla specifica tecnica, dalla BOM, dalla grafica, dal requisito di imballaggio o dai criteri di accettazione viene implementata solo con il rilascio scritto del cliente. Senza di esso, la tavola viene rilavorata, sostituita o respinta secondo il requisito originale — mai "allentata" solo dalla fabbrica.

cc_scope:
  tagline: Classificazione del rischio
  title: Ambito delle modifiche & classificazione del rischio
  subtitle: Ognuna delle seguenti modifiche attiva il controllo formale delle modifiche — non viene mai gestita con una nota nel verbale di rilavorazione. Il livello di rischio determina chi rilascia e quanta validazione è richiesta.
  headers:
    category: Categoria di modifica
    examples: Esempi tipici
    risk: Rischio
    requirements: Requisiti di controllo & rilascio
  rows:
    - category: 'Materiali di rilavorazione'
      examples: 'Adesivo, sgrassante, materiale di riparazione, guarnizione valvola, primer o cambio fornitore'
      risk: 'Alto'
      requirements: 'Verifica interfunzionale + validazione di compatibilità materiali & mantenimento pressione + rilascio del cliente ove applicabile'
    - category: 'Condizioni di processo'
      examples: 'Preparazione della superficie, temperatura/umidità di polimerizzazione ad aria calda, pressione di pressatura, durata del mantenimento'
      risk: 'Alto'
      requirements: 'Rilascio di progettazione + qualità con validazione definita delle finestre di temperatura & umidità'
    - category: 'Attrezzature & strumenti di misura'
      examples: 'Manometri, rilevatori di perdite, termoelementi ad aria calda, attrezzi per valvole, software di test'
      risk: 'Medio/Alto'
      requirements: 'Verifica di validità della calibrazione + valutazione dell''idoneità dell''attrezzatura'
    - category: 'Ambito del difetto'
      examples: 'Estensione dell''area di rilavorazione; micro-riparazione superficiale che cresce verso zone critiche di rail, cucitura o sede valvola'
      risk: 'Alto'
      requirements: 'Superfici strutturalmente portanti: stop obbligatorio e nuova valutazione'
    - category: 'Metodi di ispezione'
      examples: 'Metodo di rilevamento perdite, pressione di prova (18.0 PSI), durata del mantenimento (24h)'
      risk: 'Alto'
      requirements: 'Rilascio qualità + conferma dell''accordo tecnico del cliente'
    - category: 'Documentazione & autorizzazione'
      examples: 'Istruzione di rilavorazione, fogli di ispezione, logica di disposizione NCR, qualifica operatori'
      risk: 'Medio'
      requirements: 'Revisione documentale controllata (Rev A → Rev B) + evidenze di formazione'

cc_containment:
  tagline: Regola dello stop rigido
  title: Contenimento immediato quando le condizioni si fanno serie
  body: |
    > "Il metodo di rilavorazione esistente deve essere sottoposto a verifica e non applicato a ulteriori prodotti interessati finché la modifica non è valutata e autorizzata, a meno che una deviazione temporanea documentata sia stata approvata da Qualità e Progettazione."

    Il metodo di rilavorazione corrente deve essere sospeso immediatamente se la nuova verifica della rilavorazione continua a fallire, se il difetto interessa zone strutturalmente portanti (base valvola, rail, cuciture, aree di pressione di prua/prua-poppa), se un materiale sostitutivo non è ancora validato o se i parametri correnti collidono con la specifica approvata dal cliente.

    Le deviazioni temporanee non diventano mai prassi permanente: ognuna porta una finestra di validità definita, un ambito di partita applicabile, un tetto di quantità, requisiti di validazione e un meccanismo di scadenza automatica. Un''eccezione verbale non è un''eccezione — se non è documentata con la sua scadenza, non esiste.

cc_flow:
  tagline: Ciclo chiuso standard in 9 fasi
  title: Dalla richiesta di modifica alla chiusura e alla conservazione
  subtitle: 'Un ciclo documentato per ogni modifica dei parametri: proporre, screenare, valutare, rilasciare, validare, pilotare, verificare, rivedere, chiudere.'
  steps:
    - step: '01'
      title: Richiesta di modifica (ECR)
      desc: 'Ogni reparto può presentare una richiesta, ma la sponsorizzano Progettazione, Qualità o la direzione di produzione. L''ECR risponde al perché della modifica, a cosa cambia, cosa è interessato e come verrà verificato — con numero di controllo modifiche, NCR/CAPA collegato, parametro attuale vs. proposto, partite interessate e classificazione modifica temporanea/permanente.'
    - step: '02'
      title: Screening iniziale & contenimento
      desc: 'La richiesta viene prima screentata per il contenimento immediato: il metodo corrente deve essere fermato ora? Se è consentita una deviazione temporanea, viene limitata da finestra di validità, ambito di partita, tetto di quantità e scadenza automatica.'
    - step: '03'
      title: Valutazione di impatto & rischio
      desc: 'Progettazione, Qualità, Produzione, Approvvigionamento/supply chain e Progetto valutano prestazioni del prodotto, criteri di accettazione, compatibilità dei materiali, aspetto, capacità di processo, attrezzature e strumenti di misura, qualifica del personale, requisiti del cliente, conformità e ambito di rintracciabilità.'
    - step: '04'
      title: Verifica congiunta & rilascio
      desc: 'Il rilascio segue la matrice di autorizzazione fissa — non "chi parla più forte". Le modifiche ad alto rischio richiedono il rilascio interfunzionale e, ove necessario, il rilascio scritto del cliente prima di qualsiasi tentativo.'
    - step: '05'
      title: Piano di validazione
      desc: 'Per le modifiche ad alto rischio è richiesto un piano di validazione rilasciato prima dell''applicazione di routine: tavole campione rappresentative, metodo attuale vs. proposto, metodi di prova, criteri di accettazione, livelli di ispezione, responsabili e tempistica.'
    - step: '06'
      title: Pilot controllati & implementazione
      desc: 'I nuovi documenti vengono rilasciati e le versioni obsolete ritirate e marcate OBSOLETE; nuovi materiali e strumenti di misura vengono verificati e calibrati; gli operatori vengono formati e qualificati; la prima partita gira sotto ispezione rinforzata con chiara marcatura di stato.'
    - step: '07'
      title: Nuova verifica & prova di efficacia
      desc: 'Il tasso di primo passaggio della rilavorazione, il tasso di superamento della nuova verifica, il tasso di ripetizione e l''accettazione dell''aspetto vengono misurati e verificati prima che la modifica sia considerata efficace — una tavola riparata non è mai trattata come validazione di processo.'
    - step: '08'
      title: Revisione documentale & formazione
      desc: 'Istruzioni di lavoro, fogli di ispezione, opzioni di disposizione NCR, schede parametri e materiali di formazione vengono aggiornati alla nuova revisione, con formazione pratica registrata e qualifica dell''operatore.'
    - step: '09'
      title: Chiusura & conservazione delle registrazioni
      desc: 'La modifica viene chiusa solo dopo che evidenze di validazione, aggiornamenti documentali, evidenze di formazione ed efficacia dell''implementazione sono stati verificati e rilasciati. Se il risultato previsto non viene raggiunto, la modifica viene rivista, estesa, sospesa o ritirata.'

