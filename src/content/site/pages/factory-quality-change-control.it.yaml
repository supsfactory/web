cc_validation:
  tagline: Validazione di ingegneria
  title: Protocollo di validazione & accettazione — evidenze, non affermazioni
  body: |
    Una formulazione di accettazione vaga come *"la tavola riparata deve essere buona"* non è accettata. La formulazione controllata è:

    > "Il campione rilavorato deve soddisfare gli stessi criteri di accettazione applicabili di tenuta all''aria, lavorazione visiva, funzione valvola e specifici del progetto di una tavola conforme, a meno che una deviazione approvata dal cliente non definisca espressamente un criterio alternativo."

    Le evidenze di validazione sono quantitative e la baseline tecnica per la rilavorazione di tenuta all''aria comprende:

    - **Eliminazione della perdita & mantenimento della pressione.** La perdita originale viene eliminata senza bolle persistenti nel rilevamento con acqua saponata; la tavola mantiene la pressione alla pressione di prova standard di 18.0 PSI per 24 ore, con calo di pressione netto ΔP ≤ 0.2 PSI dopo compensazione di temperatura/umidità — la baseline più severa per la validazione della rilavorazione, separata dalla soglia di esclusione automatica di 0.50 PSI applicata all''accettazione finale della linea di produzione.
    - **Funzione valvola.** La coppia del nucleo valvola soddisfa la specifica di 15–20 N·m, senza micro-perdite alla guarnizione sotto gonfiaggio ad alta pressione e pressione dinamica.
    - **Incollaggio delle cuciture & durata.** I bordi di incollaggio non mostrano sollevamenti, sbiancamenti o delaminazione; dopo i cicli di invecchiamento termico/umidità lo strato adesivo non mostra rammollimento o screpolature fragili.
    - **Aspetto & lavorazione.** Nessuna sbavatura di adesivo, nessun danno all''EVA, nessuna deformazione della tavola e nessuno spostamento del logo o graffio sulla superficie stampata.

cc_engineering:
  tagline: Matrice di esecuzione di ingegneria
  title: Parametri quantificati per i quattro processi di rilavorazione core
  subtitle: 'Ogni processo di rilavorazione controllato porta parametri definiti, metodologia e criteri di accettazione — gli stessi numeri che seguono i nostri operatori e che i clienti possono verificare durante gli audit.'
  headers:
    process: Processo di rilavorazione
    parameters: Parametri controllati
    methodology: Metodologia di test
    acceptance: Criteri di accettazione
  rows:
    - process: 'Riparazione di fori di spillo/micro-perdite'
      parameters: 'Pulizia con solvente & asciugatura 3–5 min; attivazione ad aria calda 60°C ± 5°C; rullo di pressatura ≥ 0.4 MPa'
      methodology: 'Gonfiare a 18 PSI; immersione completa in acqua o applicazione di sapone; osservare per 10 minuti'
      acceptance: 'Emissione di bolle pari a zero; abduzione del bordo a 180° senza sollevamenti e senza sbavature di adesivo'
    - process: 'Ri-incollaggio rail band/cucitura'
      parameters: 'Rapporto adesivo bicomponente strettamente controllato; ambiente 22–28°C, ≤ 65% umidità relativa; morsa della dima ≥ 4 h'
      methodology: 'Test di sovrapressione a 22 PSI per 2 h; poi 6 h di cottura in forno a caldo a 50°C e 2 h di riposo a temperatura ambiente'
      acceptance: 'Separazione pari a zero, screpolature pari a zero; calo di pressione netto ΔP ≤ 0.1 PSI; strato adesivo senza sbiancamenti o infragilimento'
    - process: 'Allentamento della base valvola / micro-perdita'
      parameters: 'Coppia dedicata della chiave 18–20 N·m; anello di tenuta piatto senza deformazioni; pulizia della filettatura confermata'
      methodology: 'Gonfiare a 15 PSI; 20 cicli di gonfiaggio/sfiatamento; osservazione durante l''immersione sott''acqua'
      acceptance: 'Bolle pari a zero al nucleo valvola e nell''intorno della base; coppia dopo i cicli ≥ 16 N·m'
    - process: 'Test finale di mantenimento pressione di 24h'
      parameters: 'Gonfiaggio di riferimento 18.0 PSI; manometro digitale classe 1.0 / ±0.5%; temperatura & umidità ambiente registrate e compensate'
      methodology: 'Registratore di pressione digitale; curva di pressione continua di 24h'
      acceptance: 'Calo di pressione netto ΔP ≤ 0.20 PSI / 24 h dopo compensazione; nessuna bombatura o deformazione della tavola'

cc_photos:
  tagline: Nell''area produttiva
  title: Riparazione, ritest, rilascio — documentati in ogni passaggio
  subtitle: Le foto della nostra officina di Qingdao mostrano ogni processo di rilavorazione controllato con i suoi strumenti di misura calibrati, i parametri definiti e le registrazioni in loco — le stesse evidenze che gli ispettori possono richiedere in qualsiasi momento.
  grid: 'sm:grid-cols-2'
  features:
    - image: https://assets.isupfactory.com/site/quality/cc-pinhole-repair.avif
      alt: Tecnico ripara una micro-perdita da foro di spillo su un SUP gonfiabile con pistola ad aria calda e rullo di pressatura
      title: Riparazione di fori di spillo
      desc: 'Un tecnico tratta una micro-perdita marcata con una pistola ad aria calda impostata sulla specifica di 60°C e un rullo di pressatura; l''acqua saponata conferma la posizione della perdita e il modulo ECR firmato da QC sul bancone mostra il gate di controllo modifiche (Poka-Yoke n. 1).'
    - image: https://assets.isupfactory.com/site/quality/cc-rail-seam-bonding.avif
      alt: Tecnico applica adesivo PU bicomponente con pennello di precisione su una cucitura del rail sotto clima controllato
      title: Incollaggio cucitura del rail
      desc: 'L''adesivo PU bicomponente viene applicato con un pennello di precisione sulla cucitura del rail mentre la tavola è tenuta in una morsa della dima; il termometro/igrometro in loco mostra la finestra controllata di 24°C / 55% umidità relativa.'
    - image: https://assets.isupfactory.com/site/quality/cc-valve-base-integrity.avif
      alt: Chiave dinamometrica digitale impostata a 19 N·m che serra il nucleo valvola contro il materiale drop-stitch
      title: Integrità della base valvola
      desc: 'Una chiave dinamometrica digitale, impostata sulla specifica di 19 N·m, esegue il serraggio finale del nucleo valvola e sigilla la base contro il materiale drop-stitch — lo strumento porta l''etichetta verde CALIBRATED.'
    - image: https://assets.isupfactory.com/site/quality/cc-pressure-hold-testing.avif
      alt: SUP gonfiabili finiti collegati a registratori di pressione digitali nell''area di test finale di mantenimento pressione
      title: Verifica finale di mantenimento pressione
      desc: 'Le tavole finite vengono collegate a registratori di pressione digitali ad alta precisione; il manometro master mostra il riferimento di 18.00 PSI e tutti i dati di test vengono caricati automaticamente e collegati al sistema di rintracciabilità contrattuale.'

cc_pokayoke:
  tagline: Protezione a prova di errore
  title: 'Poka-Yoke: blocchi rigidi che fermano le modifiche non controllate'
  subtitle: Lo standard viene applicato non solo tramite procedure ma con blocchi fisici e sistemici che rendono impossibili le modifiche non controllate.
  features:
    - icon: 1
      icon_bg: blue
      title: Gate ECR per l''attivazione degli attrezzi
      desc: 'Le postazioni di rilavorazione leggono un codice a barre ECR firmato da QA prima che le valvole di gonfiaggio pneumatiche e i miscelatori di adesivo si attivino. Nessuna evidenza di controllo modifiche rilasciato, nessuna alimentazione — la firma retroattiva ("prima cambia, poi firma") è fisicamente bloccata.'
    - icon: 2
      icon_bg: green
      title: Scadenza automatica delle deviazioni temporanee
      desc: 'Le deviazioni temporanee sono cap hard-coded nel sistema (es. massimo 50 tavole o 7 giorni di calendario). Il raggiungimento del tetto blocca la partita e blocca la stampa del tag di passaggio di spedizione finché la modifica non è formalmente valutata.'
    - icon: 3
      icon_bg: purple
      title: Evidenza minima di validazione
      desc: 'Le modifiche ad alto rischio richiedono almeno 5 tavole campione rappresentative che coprono il limite di tolleranza superiore e inferiore, completamente testate da 2 ispettori QC indipendenti prima che possa essere emesso un report di validazione — una tavola riparata non è mai trattata come validazione di processo.'
    - icon: 4
      icon_bg: orange
      title: Controllo documentale 1-in-1-out
      desc: 'Le schede obsolete delle postazioni di lavoro vengono fisicamente ritirate e invalidate (perforate) prima che la nuova scheda venga emessa timbrata con il sigillo rosso controllato — vecchie e nuove versioni non condividono mai una postazione di lavoro.'

