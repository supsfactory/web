what_we_need:
  heading: 'Hva du forbereder før briefen'
  body: |
    En komplett brief fremskynder prosessen. Dette hjelper:

    - **Brettspesifikasjoner** — mållengde, -bredde og -tykkelse, padlerens vekt, tiltenkt bruk. Referansemål på brett eller konkurrentmodeller er nyttige.
    - **Designfiler** — vektorgrafikk (AI, SVG, PDF) for grafikk og logoer. Er de ikke klare ennå, holder moodboards eller referansebilder for den første gjennomførbarhetskontrollen.
    - **Antall & tidsplan** — måltall og sesongplan. En grov anslag («20–50 brett før mars») er nok for å komme i gang.
    - **Samsvarskrav** — målmarkeder og spesifikke sertifiseringskrav utover CE, ISO 9001, BSCI, REACH, RoHS.
    - **Budsjettrammer** — en indikativ budsjett per brett eller en målkostnad hjelper oss med å anbefale riktig plattform.

    **Ikke alt klart ennå?** Send det du har. Vi veileder deg gjennom resten.

faqs:
  tagline: Vanlige spørsmål
  title: 'Starte et SUP-prosjekt — vanlige spørsmål'
  items:
    - q: 'Hva er minste ordre for å komme i gang?'
      a: 'Nivåene er trinnvise: først 1–2 prøver (7–12 dager), deretter en prøveordre på 20–50 brett (25–35 dager), og så standardseriekjøringer på 90–100+ brett per godkjent konfigurasjon. Private label co-branding starter fra 5–10 enheter uten utviklingsfase.'
    - q: 'Hvor lang tid tar det før jeg får prøvene?'
      a: 'De fysiske prøvene produseres 7–12 dager fra bekreftelse av spesifikasjon og depositum. Med eksisterende skrogplattformer tar hele syklusen fra brief til levert prøveordre normalt 8–12 uker. En tilpasset brettform gir 15–20 dager ekstra formutvikling.'
    - q: 'Er designen min beskyttet?'
      a: 'Ja. En NDA er tilgjengelig umiddelbart — før du deler fortrolig informasjon. Vi produserer utelukkende under kundenes varemerker og konkurrerer aldri med dem. Alle tekniske filer lagres i systemer med tilgangskontroll og revisjonsspor.'
    - q: 'Hva spør prosjektbriefen om?'
      a: 'Briefen spør om aktivitetstype, bedriftsnavn, målspesifikasjoner for brettet, spennet for ordreantall, tidsplan og eventuelle samsvarskrav. Det tar omtrent 5–10 minutter. Du kan legge ved designfiler (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) opptil 10 MB. Er du usikker på noe felt, hopp over det — vi tar kontakt.'
    - q: 'Hva skjer etter at jeg har sendt inn briefen?'
      a: 'Du får svar innen én arbeidsdag. Vårt tekniske kontor gjennomgår briefen din og leverer et detaljert tilbud med MOQ, prøvekostnader og en trinnvis plan. Ingen forpliktelse oppstår før du har lest og signert kontrakten. Prøvekostnadene trekkes fra produksjonsordren.'

