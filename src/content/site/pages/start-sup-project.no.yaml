answer:
  label: 'Hva som skjer deretter'
  text: 'Når du har sendt inn en prosjektbrief får du svar innen én arbeidsdag. En NDA er tilgjengelig før du deler fortrolige opplysninger. Vårt tekniske kontor gjennomgår briefen din og leverer et detaljert tilbud med MOQ, prøvekostnader og en trinnvis plan — normalt 7–12 dager for prøvene og 6–8 uker for den første produksjonen fra bekreftet PO. Prøvekostnadene trekkes fra produksjonsordren. Ingen forpliktelser før du signerer.'
  verified: 'September 2026'

process_steps:
  tagline: Prosessen
  title: 'Fra brief til levererte brett — fem trinn'
  subtitle: 'Hvert trinn har en fast lengde, et dokumentert resultat og en go/no-go-milepæl. Gå videre først når du er klar.'
  steps:
    - step: 'Trinn 1'
      title: 'Send inn prosjektbriefen din'
      desc: 'Fortell om brettet ditt — målspesifikasjoner, antall, samsvarskrav og tidsplaner. Briefen tar 5–10 minutter. Er du usikker på noe, del det du har, så veileder vi deg gjennom resten. En NDA er tilgjengelig før du deler fortrolige design.'
    - step: 'Trinn 2'
      title: 'NDA & gjennomførbarhetskontroll (1–5 dager)'
      desc: 'På forespørsel signerer vi en NDA, deretter kontrollerer vårt tekniske kontor briefen din med hensyn til produksjonskapasitet, materialtilgjengelighet og samsvarsomfang. Du får et detaljert tilbud med MOQ-beregning, prøvekostnader og en trinnvis plan.'
    - step: 'Trinn 3'
      title: 'Prøve & godkjenning (7–21 dager)'
      desc: '1–2 fysiske brett iht. spesifikasjonen din. Du padler og vurderer — skrogstivhet, grafisk presisjon, passform for tilbehøret. Endringer registreres i en revidert BOM. Den godkjente prøven blir produksjonsreferansen. Prøvekostnadene trekkes fra produksjonen.'
    - step: 'Trinn 4'
      title: 'Forproduksjonsplanlegging (7 dager)'
      desc: 'Materialinnkjøp, forberedelse av formverktøy, bekreftelse av emballasjen og reservasjon av produksjonsplass. Alle materialer inspiseres ved mottak mot den låste BOM-en. Før produksjonsstart levereres en plan med QC-kontrolldata.'
    - step: 'Trinn 5'
      title: 'Produksjon, QC & frakt (4–6 uker)'
      desc: 'Produksjonen går gjennom inspeksjonssystemets sju nivåer, med kriterier for godkjenning/avvisning ved hver kontroll. Eksportklare emballasjer, samsvarsdokumentasjon og koordinering av sjøtransport til over 50 land. En analyse etter leveransen samler forbedringspunkter til neste ordre.'

