hero:
  tagline: Produzione OEM
  title: 'Produzione SUP OEM personalizzata — la tua specifica, la nostra fabbrica'
  subtitle: 'Porti design, disegno o un concetto di piattaforma collaudato — noi produciamo a scala container. Verifica tecnica entro un giorno lavorativo, campioni in 7–12 giorni, produzione 25–35 giorni dopo conferma dell''ordine e acconto, spediti sotto il tuo marchio.'

answer:
  label: 'Risposta breve'
  text: 'La produzione OEM prosegue secondo la tua specifica. Il MOQ viene confermato in base al progetto, non come numero fisso: la produzione in quantità standard gira con 90–100 unità per lotto da una bobina di tessuto drop-stitch da 150 m, i run pilota partono da 20–50 unità su piattaforme esistenti e ogni progetto passa da un campione (1–2 unità) prima della quantità. I campioni partono in 7–12 giorni; la produzione prosegue per 25–35 giorni dopo la conferma dell''ordine e l''acconto, più 15–20 giorni se serve nuova attrezzatura.'
  verified: 'Settembre 2026'

