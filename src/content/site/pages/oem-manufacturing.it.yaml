customization:
  tagline: Costruito secondo la tua specifica
  title: Punti di specifica OEM
  subtitle: 'Questi punti di specifica li controlli tu in un progetto OEM — il tuo documento di specifica è il contratto di produzione:'
  items:
    - 'Misure della tavola — lunghezza, larghezza, spessore, rocker e volume secondo i tuoi disegni o i rider di riferimento'
    - 'Struttura dei materiali — numero e qualità degli strati PVC, densità del drop-stitch, rinforzi e irrobustimenti dei rail'
    - 'Grafica e colori — il tuo artwork con palette illimitate o il supporto del nostro team di design'
    - 'Tappetino antiscivolo in EVA — pad da deck tagliati su misura, loghi e colori del deck su ogni tavola'
    - 'Maniglie e D-ring — posizionamento, quantità e specifica dell''hardware per il tuo uso'
    - 'Sistemi di pinne — pinna singola, doppia o tripla e fin box secondo la tua specifica'
    - 'Pagaie, pompe, leash e accessori — il tuo pacchetto, il tuo branding'
    - 'Imballaggio e allestimento commerciale — imballaggi commerciali, imballaggio da spedizione marittima ed espositori point-of-sale sotto il tuo marchio'
    - 'Etichette e marchi di conformità — etichette seriali, loghi e documentazione specifica per mercato nella tua regione di export'

faq_section:
  tagline: FAQ
  title: Domande sulla produzione OEM
  questions:
    - q: Come avvio un progetto OEM con il mio design?
      a: 'Invia i tuoi disegni, una tavola di riferimento o una specifica scritta. La nostra verifica tecnica conferma la producibilità e fornisce un''offerta entro un giorno lavorativo — è la nostra promessa standard, e se serve firma una NDA prima di ogni scambio di file.'
    - q: Qual è il MOQ per gli OEM di SUP gonfiabili?
      a: 'Il MOQ viene confermato in base al progetto — scafo e attrezzatura, varianti di colore e PVC, artwork, imballaggio e accessori. La produzione in quantità standard gira con 90–100 unità per lotto (una bobina drop-stitch da 150 m), mentre i run pilota partono da 20–50 unità su piattaforme esistenti. La logica di calcolo completa è nella nostra guida a MOQ e branding flessibile.'
    - q: Qual è il tempo di consegna tipico per un ordine OEM?
      a: 'La produzione prosegue per 25–35 giorni dall''ordine confermato e dall''acconto. La costruzione degli stampi aggiunge 15–20 giorni. I campioni prototipo partono di solito entro 7–12 giorni.'
    - q: Potete produrre solo in base ai miei disegni esistenti?
      a: 'Sì. L''OEM costruisce direttamente secondo la tua specifica — il design è tuo. I nostri ingegneri verificano la producibilità dei disegni, segnalano i conflitti prima della costruzione degli stampi o del taglio e il campione approvato diventa riferimento di produzione.'
    - q: Fornite campioni prima della produzione?
      a: 'Sì. Prima di ogni run di produzione viene prodotto e approvato un campione fisico — di solito entro 7–12 giorni — e funge da riferimento per tutti i successivi controlli QC.'
    - q: Quali certificazioni ha la fabbrica?
      a: 'ISO 9001:2015 gestione della qualità (a livello di fabbrica), BSCI conformità sociale (audit di fabbrica amfori), documentazione di conformità CE per le configurazioni applicabili al mercato UE (ambito di applicazione confermato in base al progetto), REACH (materiali) e RoHS (accessori elettronici). Documentazione di conformità completa fornita con ogni consegna OEM per i tuoi mercati di riferimento.'
    - q: Come viene controllata la qualità in un run OEM?
      a: 'La produzione gira sotto controllo qualità a più livelli — merci in ingresso, controlli in processo e collaudo finale — con test di tenuta di pressione 18,0 PSI per 24 ore (scarto automatico oltre 0,50 PSI di caduta), una checklist di montaggio a 100 punti e tracciabilità dei lotti ERP di 10 anni per numero di serie.'
    - q: Quali sono le vostre condizioni di consegna?
      a: 'FOB Qingdao, CIF verso i principali porti mondiali o DDP per partner qualificati. Distribuiamo in oltre 50 paesi nei mercati UE, USA, AU e Asia.'

process:
  title: 'Il processo OEM — dalla specifica al container spedito'
  subtitle: 'Sette fasi controllate da un team di fabbrica, così ogni passaggio dalla tua prima specifica fino al container imballato resta documentato e nei tempi.'
  steps:
    - phase: '01'
      title: Verifica della specifica e offerta
      period: 1 giorno lavorativo
      items:
        - 'Condividi i tuoi disegni, la specifica o le tavole di riferimento — i nostri ingegneri verificano la producibilità.'
        - 'Ricevi un''offerta dettagliata e un piano di progetto entro un giorno lavorativo.'
    - phase: '02'
      title: Conferma tecnica
      period: Settimana 1
      items:
        - 'Misure dello scafo, qualità del drop-stitch, specifiche PVC e costruzione dei rail vengono confermate contro il tuo documento.'
        - 'Le decisioni su stampo o piattaforma vengono fissate — se serve, qui parte la costruzione di stampi dedicati.'
    - phase: '03'
      title: Prototipo e campione
      period: 7–12 giorni
      items:
        - 'Un campione fisico viene prodotto e inviato alla tua valutazione — prova in acqua per le nuove forme inclusa.'
        - 'Il campione (1–2 unità) valida la tua specifica prima di qualsiasi impegno sulla quantità.'
    - phase: '04'
      title: Test e validazione
      period: In parallelo
      items:
        - 'Ritenzione d''aria, tenuta di pressione, resistenza delle saldature, prove di carico e UV per ogni linea di produzione.'
        - 'Documentazione CE, ISO-9001, BSCI, REACH e RoHS predisposta per i tuoi mercati di export.'
    - phase: '05'
      title: Approvazione e conferma
      period: Dopo l'approvazione del campione
      items:
        - 'Approvi campione e artwork; ordine e acconto assicurano lo slot di produzione.'
        - 'Un piano di pre-produzione conferma date, quantità, imballaggio e porto di carico.'
    - phase: '06'
      title: Produzione
      period: 25–35 giorni
      items:
        - 'Produzione sotto controllo qualità a più livelli — merci in ingresso, controlli in processo e collaudo finale.'
        - 'Dagli ordini pilota (20–50 unità) su piattaforme esistenti fino alle bobine complete da 150 m (90–100+ unità) nella produzione in quantità standard.'
    - phase: '07'
      title: Imballaggio e spedizione
      period: 1 giorno + transito
      items:
        - 'Imballaggio export con etichette seriali del modello, poi FOB Qingdao, CIF o DDP in oltre 50 paesi.'
        - 'Documentazione doganale, tracking e supporto ai riordini inclusi in ogni fase.'

