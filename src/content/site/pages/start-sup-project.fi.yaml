what_we_need:
  heading: 'Mitä valmistella ennen briefiä'
  body: |
    Täydellinen briefi nopeuttaa prosessia. Seuraavat asiat auttavat:

    - **Laudan määritykset** — Tavoitepituus, leveys, paksuus, melojan paino, käyttötarkoitus. Vertailulaudan mitat tai kilpailijamallit ovat hyödyllisiä.
    - **Suunnittelutiedostot** — Vektoriomaakkuaineet (AI, SVG, PDF) kuvioille ja logoille. Jos ne eivät ole valmiina, moodboardit tai vertailukuvat riittävät alustavaan toteutettavuusarvioon.
    - **Määrä ja aikataulu** — Tavoitemäärä ja kausiaikataulu. Jopa karkea väli ("20–50 lautaa maaliskuuhen mennessä") riittää aloittamiseen.
    - **Vaatimustenmukaisuustarpeet** — Kohdemarkkinat ja mahdolliset erityiset sertifiointivaatimukset CE:n, ISO 9001:n, BSCI:n, REACHin ja RoHS:n lisäksi.
    - **Budjettiraja** — Suuntaa-antava budjetti lautaa kohti tai tavoitearvo lopputoimituskustannuksesta auttaa suosittelemaan oikean alustan.

    **Ei valmista kaikkea?** Lähetä mitä sinulla on. Me opastamme lopun.

faqs:
  tagline: UKK
  title: 'SUP-projektin aloittaminen — usein kysytyt kysymykset'
  items:
    - q: 'Mikä on vähimmäistilaus aloittaakseen?'
      a: 'Aloitusporras on porrastettu: ensin 1–2 näytettä (7–12 päivää), sitten kokeilutilaus 20–50 lautaa (25–35 päivää), ja sitten vakiomääräiset tuotantoerät 90–100+ lautaa hyväksytyn konfiguraation mukaan. Private label -yhteisbrändäys alkaa jo 5–10 kpl:sta ilman kehittelyvaihetta.'
    - q: 'Miten kauan näytteiden saaminen kestää?'
      a: 'Fyysiset näytteet valmistetaan 7–12 päivässä vahvistetun määrityksen ja käsirahan jälkeen. Käyttäessä olemassa olevia runkoalustoja koko sykli briefistä toimitettuun kokeilutilaukseen kestää tyypillisesti 8–12 viikkoa. Räätälöity runko lisää 15–20 päivää muotin kehittelyyn.'
    - q: 'Onko suunnitteluni suojattu?'
      a: 'Kyllä. NDA voidaan tehdä heti — ennen kuin jaat mitään luottamuksellista tietoa. Me valmistamme yksinomaan asiakkaidemme brändeille emmekä kilpaile heidän kanssaan. Kaikki tekniset tiedostot säilytetään kulunvalvotuissa järjestelmissä auditoinnin jäljitettävyyden kanssa.'
    - q: 'Mitä projektibriefin lomake kysyy?'
      a: 'Briefi kysyy liiketoimintatyyppisi, yrityksesi nimen, tavoitellut laudan määritykset, tilamäärän vaihteluvälin, aikataulun ja mahdolliset vaatimustenmukaisuusvaatimukset. Se kestää noin 5–10 minuuttia. Voit liittää suunnittelutiedostoja (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) enintään 10 MB. Jos jokin kenttä on epäselvä, jätä se väliin — palaamme siihen.'
    - q: 'Mitä tapahtuu, kun lähetän briefin?'
      a: 'Saat vastauksen yhden arkipäivän kuluessa. Suunnitteluosasto käy briefisi läpi ja palauttaa erillisen tarjouksen, jossa on MOQ, näytemaksut ja portti portilta etenevä aikataulu. Sitoumuksia ei vaadita, ennen kuin olet tutustunut sopimukseen ja allekirjoittanut sen. Näytemaksut vähennetään tuotantotilauksestasi.'

