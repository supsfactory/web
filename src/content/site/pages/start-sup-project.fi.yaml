answer:
  label: 'Mitä tapahtuu seuraavaksi'
  text: 'Kun lähetät projektibriefin, saat vastauksen yhden arkipäivän kuluessa. NDA:n voi tehdä ennen kuin jaat mitään luottamuksellisia yksityiskohtia. Suunnitteluosasto käy briefisi läpi ja palauttaa erillisen tarjouksen, jossa on MOQ, näytemaksut ja portti portilta etenevä aikataulu — tyypillisesti 7–12 päivää näytteisiin ja 6–8 viikkoa ensimmäiseen tuotantoon vahvistetun tilauksen jälkeen. Näytemaksut vähennetään tuotantotilauksestasi. Ei sitoumuksia ennen allekirjoitusta.'
  verified: 'September 2026'

process_steps:
  tagline: Prosessi
  title: 'Briefistä toimitettuihin lautoihin — viisi vaihetta'
  subtitle: 'Jokaisella vaiheella on määritetty aikataulu, dokumentoitu toimitettava sekä jatka/pysähdyt-tarkistuspiste. Etenet vain, kun olet valmis.'
  steps:
    - step: 'Vaihe 1'
      title: 'Lähetä projektibriefisi'
      desc: 'Kerro laudastasi — tavoitemääritykset, määrä, vaatimustenmukaisuustarpeet ja aikataulu. Briefin täyttäminen kestää 5–10 minuuttia. Jos et ole varma jokaisesta yksityiskohdasta, jaa mitä sinulla on ja me opastamme lopun. NDA:n voi tehdä ennen kuin jaat luottamukselliset suunnittelut.'
    - step: 'Vaihe 2'
      title: 'NDA ja toteutettavuuskatsaus (1–5 päivää)'
      desc: 'Allekirjoitamme NDA:n pyydettäessä, ja sitten suunnitteluosasto käy briefisi läpi valmistuskapasiteetin, materiaalien saatavuuden ja vaatimustenmukaisuuden laajuuden näkökulmasta. Saat erillisen tarjouksen, jossa on MOQ-laskelma, näytemaksut ja portti portilta etenevä aikataulu.'
    - step: 'Vaihe 3'
      title: 'Näyte ja hyväksyntä (7–21 päivää)'
      desc: '1–2 fyysistä lautaa valmistetaan määrityksesi mukaan. Meloi ja arvioi — runkon jäykkyys, kuvioiden tarkkuus, lisävarusteiden sopivuus. Muutokset kirjataan päivitettyyn BOM-asiakirjaan. Hyväksytty näyte toimii tuotannon vertailukohtana. Näytemaksut vähennetään tuotannosta.'
    - step: 'Vaihe 4'
      title: 'Esituotannon suunnittelu (7 päivää)'
      desc: 'Materiaalien hankinta, muottien valmistelu, pakkauksen vahvistus ja tuotantopaikkojen varaus. Kaikki materiaalit tarkastetaan vastaanotossa jäätyneen BOM-asiakirjan mukaan. Ennen valmistuksen alkua annetaan tuotantoaikataulu laadunvalvonnan porttien päivämäärineen.'
    - step: 'Vaihe 5'
      title: 'Tuotanto, laadunvalvonta ja lähetys (4–6 viikkoa)'
      desc: 'Valmistus kulkee 7-vaiheisen tarkastusporttijärjestelmän läpi, jossa jokaisella portilla on hyväksyty/hylätty-kriteerit. Vientiluokan pakkaus, vaatimustenmukaisuusasiakirjat ja merirahtiyhteistyö yli 50 maahan. Toimituksen jälkeinen katselu kerää parannukset seuraavaa tilausta varten.'

