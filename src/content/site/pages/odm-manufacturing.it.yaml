hero:
  tagline: Produzione ODM
  title: 'Produttore SUP ODM — design e sviluppo prodotto'
  subtitle: 'Non ti serve un design SUP già pronto. Inizia con un concetto di prodotto, un requisito di mercato o un obiettivo di prestazioni — i nostri ingegneri interni progettano scafo, struttura, grafica e imballaggio in base al tuo briefing, creano i prototipi in 7–12 giorni e producono 25–35 giorni dopo la conferma dell''ordine.'

answer:
  label: 'Risposta breve'
  text: 'SUPsfactory è un produttore SUP ODM a Qingdao, Cina. Lo sviluppo ODM parte dal tuo briefing, non dai tuoi disegni: il design dello scafo (lunghezza, larghezza, rocker, volume), la struttura dei materiali e la grafica vengono progettati internamente, validati con campioni prototipo in 7–12 giorni e prodotti in quantità standard di 90–100 unità per bobina da 150 m (pilota da 20–50 unità). La produzione dura 25–35 giorni dopo la conferma dell''ordine e l''acconto; la costruzione degli stampi per forme personalizzate aggiunge 15–20 giorni. La documentazione CE, ISO-9001, BSCI, REACH e RoHS viene fornita con ogni ordine.'
  verified: 'Settembre 2026'

features:
  title: Capacità ODM
  subtitle: 'Tutto ciò che ottieni quando il design nasce in fabbrica — non alla tua scrivania.'
  items:
    - title: Design dello scafo
      description: 'Lunghezza, larghezza, spessore, rocker e volume, progettati per i tuoi rider di riferimento, gli usi e i mercati — da pagina bianca o dalla nostra libreria di piattaforme collaudate.'
      icon: 'tabler:waves'
    - title: Ingegneria della struttura
      description: 'Densità del drop-stitch, numero e qualità degli strati PVC, posizionamento dei rinforzi e costruzione dei rail — specificati e validati per il tuo design.'
      icon: 'tabler:building-factory'
    - title: Grafica e branding
      description: 'Grafica del deck della tavola, branding sul tubo, pad EVA e imballaggi commerciali, sviluppati dal nostro team di design attorno al tuo marchio.'
      icon: 'tabler:palette'
    - title: Sviluppo degli stampi
      description: 'Le nuove forme di scafo partono come costruzione di stampi, progettata e fresata internamente — l''attrezzatura aggiunge 15–20 giorni alla pianificazione del progetto.'
      icon: 'tabler:shapes'
    - title: Validazione del prototipo
      description: 'Viene costruito un prototipo fisico, testato e inviato alla tua valutazione con una prova in acqua — di solito entro 7–12 giorni.'
      icon: 'tabler:tools'
    - title: Test e conformità
      description: 'Ritenzione d''aria, tenuta di pressione e resistenza delle saldature per unità, con documentazione di conformità ISO-9001, BSCI, REACH, RoHS e CE per il mercato di destinazione (ambito di applicazione confermato in base al progetto).'
      icon: 'tabler:certificate'
    - title: Opzioni di proprietà degli stampi
      description: 'La proprietà degli stampi o le clausole di subentro sono nel contratto — il tuo design resta di tua proprietà e gli stampi restano pronti per i riordini.'
      icon: 'tabler:lock'
    - title: Dal prototipo al container
      description: 'Un design ODM validato passa direttamente alla produzione in quantità standard: 90–100+ unità per bobina da 150 m, 25–35 giorni dopo la conferma dell''ordine.'
      icon: 'tabler:package'

customization:
  tagline: Progettato con te
  title: Cosa sviluppiamo attorno al tuo briefing
  subtitle: 'ODM significa che il prodotto viene progettato per te da zero o dalla nostra libreria di piattaforme — questi sono i punti di regolazione che il tuo briefing controlla:'
  items:
    - 'Profilo del rider e mercato — posizionamento per principianti, touring, gara, yoga, pesca o uso multiuso'
    - 'Misure della tavola — lunghezza, larghezza, spessore e volume, calibrati su rider di riferimento e uso'
    - 'Carattere dello scafo — rocker, profilo dei rail, forma di nose e tail, calibrato su stabilità o velocità'
    - 'Struttura dei materiali — densità del drop-stitch, numero e qualità degli strati PVC, rinforzi e irrobustimenti dei rail'
    - 'Grafica e colori — colori del marchio, grafica del deck e branding sul tubo, sviluppati internamente'
    - 'Tappetino antiscivolo in EVA — layout, colori e integrazione del logo sul deck'
    - 'Pacchetto accessori — pagaie, pompe, pinne, leash e borse, calibrati sulla tavola'
    - 'Imballaggio e allestimento commerciale — imballaggi commerciali, espositori e imballaggio export sotto il tuo marchio'

faq_section:
  tagline: FAQ
  title: Domande sullo sviluppo ODM
  questions:
    - q: In cosa si differenzia l'ODM dall'OEM?
      a: 'ODM (Original Design Manufacturing) parte dal tuo briefing — i nostri ingegneri sviluppano struttura della tavola, costruzione, grafica e imballaggio, sia da un concetto di mercato, da un obiettivo di prestazioni o da un''adattamento di una piattaforma collaudata. Approvi il design prima della produzione. OEM (Original Equipment Manufacturing) produce secondo la tua specifica approvata — i tuoi disegni, le misure, i materiali e il tuo imballaggio. Possiedi design e proprietà intellettuale. Entrambi i percorsi passano per la stessa fabbrica, lo stesso sistema QC e lo stesso team export; l''ODM è il modo più rapido per arrivare a una tavola brandizzata quando non hai ancora un design.'
    - q: Ho solo un'idea approssimativa — da dove iniziamo?
      a: 'Invia un briefing breve: rider di riferimento, usi, dimensione indicativa, mercati e quantità. I nostri ingegneri rispondono entro un giorno lavorativo con un concetto, una direzione di riferimento e un piano di sviluppo — su richiesta viene firmata una NDA prima di qualsiasi scambio di dettagli.'
    - q: Quanto tempo richiede lo sviluppo di una nuova tavola SUP?
      a: 'I campioni prototipo partono in 7–12 giorni. Un nuovo scafo con costruzione stampi dedicata aggiunge 15–20 giorni di ingegneria prima dei campioni. La produzione prosegue 25–35 giorni dopo ordine e acconto.'
    - q: Qual è il MOQ per una tavola ODM?
      a: 'La produzione in quantità standard gira con 90–100 unità per bobina drop-stitch da 150 m; i run pilota partono da 20–50 unità su piattaforme esistenti. Il co-branding per piccoli lotti parte da 5–10 unità — il calcolo completo lo trovi nella nostra guida a MOQ e branding flessibile.'
    - q: A chi appartengono design e stampo?
      a: 'Il tuo briefing, il tuo design e la tua attrezzatura sono protetti da NDA, condizioni di licenza del marchio e clausole di proprietà o subentro degli stampi nel contratto. Gli stampi restano conservati per il tuo marchio e sono trasferibili.'
    - q: Potete sviluppare una forma specifica (touring, pesca, gara, yoga)?
      a: 'Sì. L''ingegneria dello scafo copre tutte le principali categorie SUP — allround, touring, gara, yoga, pesca e tavole per più persone — con validazione in vasca idrodinamica di prova per le forme performance.'
    - q: Quali certificazioni ha la tavola sviluppata?
      a: 'ISO 9001:2015 gestione della qualità (a livello di fabbrica), BSCI conformità sociale (audit di fabbrica amfori), documentazione di conformità CE per le configurazioni applicabili al mercato UE (direttiva sulle imbarcazioni da diporto — ambito di applicazione confermato in base al progetto), REACH (materiali), RoHS (accessori elettronici) e ISO 25649 per i modelli SUP gonfiabili applicabili. I documenti di certificazione vengono di volta in volta predisposti per i tuoi mercati di export.'

process:
  title: 'Il processo ODM — dal briefing alla produzione su scala'
  subtitle: 'Sei fasi controllate, guidate dallo stesso team che progetta, campiona e scala la tua tavola — tutto resta documentato.'
  steps:
    - phase: '01'
      title: Briefing e concetto
      period: 1 giorno lavorativo
      items:
        - 'Condividi rider di riferimento, usi, misure, mercati e quantità — o solo un''idea.'
        - 'I nostri ingegneri forniscono una direzione di concetto, opzioni di piattaforma e un piano di sviluppo.'
    - phase: '02'
      title: Design di scafo e struttura
      period: Settimana 1–2
      items:
        - 'Misure della tavola, carattere dello scafo, densità del drop-stitch e struttura PVC — progettate internamente.'
        - 'Grafica, layout del deck EVA e concetto di imballaggio sviluppati attorno al tuo marchio.'
    - phase: '03'
      title: Stampi e attrezzatura
      period: +15–20 giorni (nuovi stampi)
      items:
        - 'Costruzione stampi dedicata per nuove forme di scafo; le piattaforme esistenti saltano questa fase.'
        - 'Le condizioni di proprietà degli stampi vengono fissate nel contratto prima dell''inizio della fresatura.'
    - phase: '04'
      title: Prototipo e campione
      period: 7–12 giorni
      items:
        - 'Viene costruito un prototipo fisico, testato e inviato alla tua valutazione — prova in acqua inclusa.'
        - 'Il campione (1–2 unità) valida forma, struttura e branding prima della quantità.'
    - phase: '05'
      title: Validazione e approvazione
      period: In parallelo
      items:
        - 'Ritenzione d''aria, tenuta di pressione, resistenza delle saldature, prove di carico e UV per ogni linea di produzione.'
        - 'Documentazione CE, ISO-9001, BSCI, REACH e RoHS predisposta per i tuoi mercati di export.'
        - 'Approvi il prototipo; ordine e acconto assicurano lo slot di produzione.'
    - phase: '06'
      title: Produzione e consegna
      period: 25–35 giorni
      items:
        - 'Le quantità standard girano con 90–100+ unità per bobina da 150 m, i run pilota da 20–50 unità.'
        - 'Imballaggio export, spedizione FOB/CIF/DDP in oltre 50 paesi e supporto ai riordini inclusi.'

