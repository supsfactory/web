answer:
  label: 'Vad som händer sedan'
  text: 'När du skickat in en projektbrief får du svar inom en arbetsdag. Ett NDA finns tillgängligt innan du delar konfidentiella uppgifter. Vårt tekniska kontor granskar din brief och levererar en detaljerad offert med MOQ, provkostnader och en stegvis plan — normalt 7–12 dagar för proverna och 6–8 veckor för den första tillverkningen från bekräftad PO. Provkostnaderna räknas av mot din produktionsorder. Inga förpliktelser förrän du undertecknar.'
  verified: 'September 2026'

process_steps:
  tagline: Processen
  title: 'Från brief till levererade brädor — fem steg'
  subtitle: 'Varje steg har en fast tidslängd, ett dokumenterat resultat och en go/no-go-milstolpe. Gå vidare först när du är redo.'
  steps:
    - step: 'Steg 1'
      title: 'Skicka in din projektbrief'
      desc: 'Berätta om din bräda — målspecifikationer, antal, konformitetskrav och tidsplaner. Briefen tar 5–10 minuter. Om du är osäker på något, dela det du har så guidar vi dig genom resten. Ett NDA finns tillgängligt innan du delar konfidentiella designer.'
    - step: 'Steg 2'
      title: 'NDA & genomförbarhetskontroll (1–5 dagar)'
      desc: 'På begäran undertecknar vi ett NDA, därefter kontrollerar vårt tekniska kontor din brief avseende tillverkningskapacitet, materialtillgänglighet och konformitetsomfång. Du får en detaljerad offert med MOQ-beräkning, provkostnader och en stegvis plan.'
    - step: 'Steg 3'
      title: 'Prov & godkännande (7–21 dagar)'
      desc: '1–2 fysiska brädor enligt din specifikation. Du paddlar och bedömer — skeppsstyvhet, grafisk precision, passform för tillbehören. Ändringar registreras i en reviderad BOM. Det godkända provet blir produktionsreferensen. Provkostnaderna räknas av mot tillverkningen.'
    - step: 'Steg 4'
      title: 'Förproduktionsplanering (7 dagar)'
      desc: 'Materialinköp, förberedelse av formverktyg, bekräftelse av förpackningen och reservering av produktionsplatsen. Alla material inspekteras vid mottagandet mot den låsta BOM:en. Före produktionsstart lämnas en plan med QC-grinddata ut.'
    - step: 'Steg 5'
      title: 'Tillverkning, QC & frakt (4–6 veckor)'
      desc: 'Tillverkningen går genom inspektionssystemets sju nivåer med kriterier för godkänt/underkänt vid varje grind. Exportkonform förpackning, konformitetsdokumentation och koordinering av sjötransport till över 50 länder. En analys efter leveransen samlar förbättringspunkter för nästa order.'

