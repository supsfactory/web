hero:
  tagline: 'Börja här'
  title: 'Starta ditt SUP-projekt'
  subtitle: 'Oavsett om du vill lansera ett nytt varumärke, utvidga en produktserie eller köpa brädor under ditt varumärke för ditt företag — varje projekt börjar på samma sätt: med en projektbrief, ett NDA, ett prov och en tydlig väg till tillverkning. Här får du veta vad som händer efter att du klickat på "Starta".'
