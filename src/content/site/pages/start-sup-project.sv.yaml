what_we_need:
  heading: 'Vad du förbereder före briefen'
  body: |
    En komplett brief snabbar på processen. Det här hjälper:

    - **Brädspecifikationer** — mållängd, -bredd och -tjocklek, paddlarens vikt, avsett bruk. Referensmått på brädor eller konkurrentmodeller är användbara.
    - **Designfiler** — vektorgrafik (AI, SVG, PDF) för grafik och logotyper. Om de ännu inte är klara räcker moodboards eller referensbilder för den första genomförbarhetskontrollen.
    - **Antal & tidsplan** — målantal och säsongsplan. En grov uppskattning ("20–50 brädor före mars") räcker för att komma igång.
    - **Konformitetskrav** — målmarknader och specifika certifieringskrav utöver CE, ISO 9001, BSCI, REACH, RoHS.
    - **Budgetram** — en indikativ budget per bräda eller en målkostnad hjälper oss att rekommendera rätt plattform.

    **Inte allt klart ännu?** Skicka det du har. Vi guidar dig genom resten.

faqs:
  tagline: Vanliga frågor
  title: 'Starta ett SUP-projekt — vanliga frågor'
  items:
    - q: 'Vad är minsta order för att komma igång?'
      a: 'Nivåerna är trappstegsformade: först 1–2 prov (7–12 dagar), sedan en provorder på 20–50 brädor (25–35 dagar), därefter standardseriekörningar på 90–100+ brädor per godkänd konfiguration. Private label co-branding startar från 5–10 enheter utan utvecklingsfas.'
    - q: 'Hur lång tid tar det innan jag får proverna?'
      a: 'De fysiska proverna tillverkas på 7–12 dagar från bekräftelse av specifikation och deposition. Med befintliga skeppsplattformar tar hela cykeln från brief till levererad provorder normalt 8–12 veckor. En anpassad formform ger 15–20 dagars extra formutveckling.'
    - q: 'Är min design skyddad?'
      a: 'Ja. Ett NDA finns tillgängligt direkt — innan du delar konfidentiell information. Vi tillverkar enbart under våra kunders varumärken och konkurrerar aldrig med dem. Alla tekniska filer lagras i system med åtkomstkontroll och revisionsspår.'
    - q: 'Vad frågar projektbriefen efter?'
      a: 'Briefen frågar efter aktivitetstyp, företagsnamn, brädans målspecifikationer, spannet för beställningsantal, tidsplan och eventuella konformitetskrav. Det tar cirka 5–10 minuter. Du kan bifoga designfiler (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) upp till 10 MB. Om du är osäker på något fält, hoppa över det — vi kontaktar dig.'
    - q: 'Vad händer efter att jag skickat in briefen?'
      a: 'Du får svar inom en arbetsdag. Vårt tekniska kontor granskar din brief och levererar en detaljerad offert med MOQ, provkostnader och en stegvis plan. Ingen förpliktelse uppstår förrän du har läst och undertecknat kontraktet. Provkostnaderna räknas av mot din produktionsorder.'

