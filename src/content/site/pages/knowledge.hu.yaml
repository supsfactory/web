meta:
  title: 'Tudásbázis — útmutatók a felfújható SUP-ről és az OEM-ről | {SITE}'
  description: 'A Vatrad tudásbázisa: útmutatók a felfújható SUP-khez, a paddle deszka alapanyagokhoz, a deszka kiválasztásához és az iparági perspektívákhoz márkák és szakemberek számára.'
  dateModified: '2026-08'
  keywords:
    - 'sup tudásbázis'
    - 'felfújható sup útmutató'
    - 'paddle deszka alapanyagok'
    - 'sup iparági perspektívák'
hero:
  tagline: 'Tudáscentrum'
  title: 'SUP tudáscentrum'
  subtitle: |
    Strukturált tudásbázis, amely a felfújható SUP-k technológiáját, 
    a hajózási biztonságot, a deszkák mérnökségét és a kalandtervezést fedi le.
  taglineSection: 'Fedezze fel. Tanuljon. Induljon magabiztosan.'

clusters:
