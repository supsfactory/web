how_to_choose:
  title: Как выбрать правильный размер
  cards:
    - title: Доски SUP
      description: Выбирайте длину по весу и предполагаемому использованию. Более широкие доски (32"+) обеспечивают большую устойчивость. Более длинные доски (11-12 ft) лучше держат курс на туринге. Более тяжелым гребцам нужны доски большего объема.
    - title: Туристические SUP
      description: Более длинные доски (11–12 ft) лучше всего подходят для преодоления расстояний и туринга. Более широкие доски (32"+) обеспечивают большую устойчивость. Проверьте грузоподъемность с учетом снаряжения.
    - title: Универсальные SUP
      description: Выбирайте длину по весу райдера и предполагаемому использованию. Универсальные доски подходят для отдыха, фитнеса и йоги. Меньшие доски более маневренны.

