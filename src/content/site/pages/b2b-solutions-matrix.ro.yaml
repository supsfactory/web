content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p>Fiecare traseu din această matrice pornește de la aceleași două elemente: <a href="/ro/oem-manufacturing">programul nostru de producție OEM/ODM</a> și <a href="/ro/factory">fabrica din spatele său</a> — o singură instalație de 12,500 m&sup2;, un singur set de standarde de calitate, toate canalele deservite.</p>
  </div>
