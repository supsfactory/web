answer:
  label: 'Răspuns direct'
  text: 'Mărcile australiene comandă SUP gonflabil de la iSupfactory în condiții standard: MOQ este confirmat în funcție de configurația proiectului: seriile de mostre de 1–2 bucăți validează construcția, loturile pilot de 20–50 bucăți testează piața pe platforme existente, iar producția standard de volum rulează 90–100+ bucăți pe model dintr-o rolă completă de drop-stitch de 150 m. Prima mostră se expediază în 7–12 zile după aprobarea specificațiilor, producția durează 25–35 de zile după confirmarea PO și a avansului, iar transportul maritim adaugă 4–6 săptămâni până la Sydney, Melbourne sau Brisbane. Luând în calcul producția și transportul, comandați cu 3–4 luni înainte de a avea nevoie de stoc pe raft; DDP include formalitățile vamale și livrarea la depozitul dumneavoastră.'
  verified: 'Septembrie 2026'

