moq_faqs:
  tagline: FAQ
  title: 'Häufig gestellte Fragen zum MOQ'
  items:
    - q: 'Wird der MOQ pro Auftrag, pro Modell oder pro Farbvariante berechnet?'
      a: 'Der MOQ kann pro Modell, Farbvariante, Artwork-Version, Verpackungskonfiguration oder Gesamtauftrag gelten. Da unterschiedliche Drop-stitch-Dicken (12 cm vs. 15 cm) und PVC-Farben aus getrennten Rohstoffrollen stammen, erfordert eine Bestellung von 50 Boards auf 5 Farben verteilt 5 separate Geweberollen. Wir bestätigen die exakte Berechnung gegen Ihre SKU-Matrix vor dem Angebot, damit Sie Ihre Mischung planen können.'
    - q: 'Kann ich vor der Massenproduktion ein Muster bestellen?'
      a: 'Ja. Die Musterentwicklung (1–2 Einheiten) prüft Rumpfsteifigkeit, EVA-Antirutschpad-Griffigkeit, Grafikgenauigkeit und Zubehörpassform vor der Freigabe zur Massenproduktion. Mustergebühren gelten und werden nach Vertragsunterzeichnung auf den Produktionsauftrag angerechnet.'
    - q: 'Warum hat individuelle Handelsverpackung einen eigenen MOQ?'
      a: 'Individuelle Flexodruck- oder Offsetdruckpressen für Kartons erfordern ein Mindestrüstvolumen von 500+ Einheiten. Wir bieten eine Hybrid-Verpackungslagerlösung: Wir produzieren die 500 individuell bedruckten Kartons, lagern den Überschuss in unserem sauberen Lager und geben ihn über Ihre geplanten Board-Lieferungen frei — so kann auch eine kleinere Board-Bestellung vollständig gebrandet im Handelskarton versendet werden.'
    - q: 'Warum beträgt der Standard-MOQ 90–100 Einheiten?'
      a: 'Der Standard-MOQ folgt dem Rohmaterial: Eine 150-m-Masterrolle hochwertigen Drop-stitch-Gewebes ergibt ca. 90–100 fertige Boards für einen Standard-Touring- oder Allround-Rumpf. Volle Rollen eliminieren Gewebestückung, halten die Faserspannung gleichmäßig und amortisieren die 2-stündige Schweiß- und Laminierlinien-Kalibrierung — bei den niedrigstmöglichen Stückkosten.'
    - q: 'Senkt eine höhere Menge den Stückpreis?'
      a: 'Bei den meisten Projekten ja. Höhere Mengen verbessern die Materialausbeute, verteilen die Fixkosten der Produktionslinienrüstung auf mehr Boards und senken die Verpackungskosten pro Einheit.'
    - q: 'Fallen Co-Branding-Formkosten bei Nachbestellungen erneut an?'
      a: 'Nein. Siebdruck-Formkosten werden einmalig bei der Ersteinrichtung erhoben und für Nachbestellungen mit derselben Artwork-Abmessung erlassen. Sie zahlen nur die $1.00-USD-Werksbearbeitungs- und Druckgebühr pro Board.'
    - q: 'Verpflichtet mich eine MOQ-Beratungsanfrage zu einem Auftrag?'
      a: 'Nein. Eine projektbezogene MOQ-Beratungsanfrage erlaubt lediglich unserem Technikteam bei der Qingdao Vatrad Group Co., Ltd., Ihr technisches Briefing zu prüfen und den wirtschaftlichsten Produktionsweg zu empfehlen. Eine Geheimhaltungsvereinbarung (NDA) ist verfügbar, bevor Sie proprietäre technische Spezifikationen oder Artwork teilen.'

