moq_stages:
  tagline: Muster · Pilot · Menge
  title: 'Drei klar getrennte Mengenstufen'
  subtitle: 'Muster-, Pilot- und Mengenproduktionsmengen sind unterschiedlich. Jedes Projekt wird in drei getrennte Stufen eingeteilt, damit Sie vor der Zusage validieren.'
  steps:
    - step: '01'
      title: 'Musterentwicklung (1–2 Einheiten)'
      desc: 'Physische Bestätigung von Rumpfsteifigkeit, EVA-Antirutschpad-Griffigkeit, Grafikgenauigkeit und Zubehörpassform vor jeder finanziellen Verpflichtung. Mustergebühren gelten und werden nach Vertragsunterzeichnung auf den Produktionsauftrag angerechnet.'
    - step: '02'
      title: 'Pilotauftrag (20–50 Einheiten)'
      desc: 'Kommerzielle Tests vor der Saison und regionale Marktvalidierung mit bestehenden Rumpfplattformen, Standardmaterialien und vereinfachter Verpackung, um den Rüstaufwand zu minimieren.'
    - step: '03'
      title: 'Mengenproduktion (90–100+ Einheiten)'
      desc: 'Bestätigt nach eingefrorenem BOM, finalisiertem Artwork, individueller Verpackung und geplanten Lieferterminen — volle 150-m-Geweberollen, individuelle Pantone-Gewebe, maßgeschneiderte Verpackung, Mengenrabatte und vollständige Chargenrückverfolgbarkeit über die gesamte Kette.'

moq_factors:
  tagline: Was Ihren MOQ bestimmt
  title: 'Warum der vollindividuelle MOQ immer projektspezifisch ist'
  subtitle: 'Für 100 % maßgeschneiderte Fertigung wird der MOQ aus der vollständigen Produktarchitektur berechnet — diese vier Komponenten werden vor dem Angebot gemeinsam bewertet.'
  headers:
    component: Projektkomponente
    driver: Fertigungstreiber
    impact: Auswirkung auf die Mindestmenge
  rows:
    - component: 'Rumpfform & Werkzeug'
      driver: 'Bestehende Factory-Rocker-Formen vs. individuelle CAD-Schnittwerkzeuge und EVA-Heißpresswerkzeuge'
      impact: 'Bestehende Plattformen: Pilotaufträge ab 20 Stück. Eigene Rümpfe: Amortisation des dedizierten Werkzeugs erforderlich.'
    - component: 'Farbvarianten & PVC'
      driver: 'Einzelne Standard-Lagerfarben vs. proprietäre Pantone-gefärbte PVC-Bahnen'
      impact: 'Individuelles Pantone-PVC erfordert dedizierte chemische Färbeläufe mit eigenen Rohstoff-Mindestmengen.'
    - component: 'Gebrandete Verpackung'
      driver: 'Standardkartons mit Barcode-Aufklebern vs. ganzfarbige 5-lagige Handelsgeschenkboxen und gebrandete Handbücher'
      impact: 'Individuelle Farbkartons haben ein eigenes Offsetdruck-Mindestvolumen (in der Regel 500+ Kartons).'
    - component: 'Zubehörpakete'
      driver: 'Standard-Alu- oder Nylonpaddel vs. individuell passende Carbonpaddel und gebrandete Pumpen'
      impact: 'Vollständig gebrandetes Zubehör folgt den Produktionslosen der Sub-Lieferanten.'

