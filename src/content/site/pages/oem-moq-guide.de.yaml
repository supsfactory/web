hero:
  tagline: 'Transparent & projektbezogen'
  title: 'Flexible Markenbildung & Fertigungs-MOQ-Leitfaden'
  subtitle: 'Verstehen Sie die Physik des Drop-stitch-Rohmaterials, die SUP-Produktionsläufe steuert — und wie unser Co-Branding-Programm mit niedriger Einstiegshürde für Verleiher, Clubs, Resorts und wachsende Wassersportmarken funktioniert. Konstruiert und betrieben von der Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Kurze Antwort'
  text: 'Der MOQ ist keine Einheitsgröße. Jeder MOQ wird projektbezogen bestätigt: Rumpfform und Werkzeug, Farbvarianten und PVC, Artwork-Komplexität, Verpackung und Zubehörmix. Die vollständige Eigenfertigung in Standardmenge läuft mit 90–100 Einheiten pro Charge aus einer standardmäßigen 150-m-Drop-stitch-Geweberolle; Kleinserien-Co-Branding startet ab 5–10 Einheiten; und jedes Projekt gliedert sich in drei klar getrennte Stufen — Musterentwicklung (1–2 Einheiten), Pilotauftrag (20–50 Einheiten) und Mengenproduktion (90–100+ Einheiten). Wir bestätigen die exakte Berechnung für Ihre SKU-Mischung vor dem Angebot — keine vagen „Low-MOQ"-Versprechen, keine versteckten Kompromisse.'
  verified: 'September 2026'

moq_principle:
  tagline: Die technische Logik
  title: 'Warum der Standard-MOQ 90–100 Einheiten beträgt: Rollenphysik des Rohmaterials'
  subtitle: 'Produktionslosgrößen sind keine willkürlichen Zahlen von einer Vertriebsabteilung — sie ergeben sich aus den Rollenlängen des Drop-stitch-Rohgewebes und der Physik der Linienumstellung.'
  body: |
    **Die 150-Meter-Rohgewebe-Basislinie.** Hochfestes gewebtes Drop-stitch-Gewebe wird auf durchgehenden Masterrollen produziert und beschichtet. Die standardmäßige Industriestoßlänge für eine Einzelcharge beträgt 150 Meter durchgehendes Material.

    **Die Ertragsberechnung (90 bis 100 Boards).** Bei einem Standard-Touring- oder Allround-SUP-Rumpf (10 ft 6 in bis 11 ft 6 in) ergeben 150 m Masterrolle etwa 90 bis 100 fertige Paddle Boards.

    **Null-Gewebestückung.** Volle Geweberollen gewährleisten vollständige strukturelle Kontinuität — keine querverlaufende, risikoreiche Gewebestückung und gleichmäßige Faserspannung über Ober- und Unterseite des Boards.

    **Thermische und Kleber-Kalibrierung.** Automatisierte Hochfrequenz-Heißluftschweiß- und Marinekleber-Laminierlinien benötigen 2 Stunden Vorheizen, Temperaturprofilierung und Druckkalibrierung. Eine volle Charge mit 90–100 Einheiten amortisiert diese Fixkosten der Rüstung und erzielt so die niedrigstmöglichen Stückkosten.

