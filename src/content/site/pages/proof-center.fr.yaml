traceability:
  tagline: 'Un lot, suivi du rouleau à la planche'
  title: 'À quoi ressemble réellement la traçabilité'
  body: |
    Chaque lot reçoit un **code de lot ERP sur 10 ans**. La chaîne enregistrée sous un lot :

    - **Rouleau entrant** — certificat de matériau, numéro de rouleau, lot de tissu testé (traction, déchirure, soudure)
    - **Découpe** — travail de nidification CNC contre le fichier de design, pourcentage de déchets journalisé
    - **Soudure et laminage** — ligne, opérateur, paramètres machine par chambre
    - **Assemblage** — numéro de série de la planche, type de vanne, lot de tapis de pont
    - **Test** — maintien de 18,0 PSI × 24 h par chambre, rejet automatique au-delà d''une chute de 0,50 PSI
    - **Libération** — liste de contrôle de 100 points par planche, signature du directeur QA par lot
    - **Suite** — Certificat de Conformité avec l''expédition ; droit d''audit réservé dans le contrat

    Demandez l''enregistrement QC d''échantillon avant votre première commande — c''est le même format que vous recevez avec votre expédition.

faqs:
  tagline: 'FAQ'
  title: 'Questions de preuves que les acheteurs posent'
  items:
    - q: 'Cette page est-elle uniquement pour la vérification, et ne remplace-t-elle pas la due diligence ?'
      a: 'Correct — cette page montre où chaque allégation peut être vérifiée : enregistrement de l''entité, certificats, machines, enregistrements et une usine ouverte à l''audit. Vos étapes habituelles de due diligence (vérification de l''enregistrement, audit, inspection tierce partie) s''appliquent toujours et sont bienvenues.'
    - q: 'Quelle entité doit apparaître sur ma documentation de commande ?'
      a: 'Les commandes sont passées avec Qingdao Vatrad Group Co., Ltd., opérant sous le nom d''Afarer (division de fabrication), avec SUPsfactory comme ligne de produits SUP. Les documents contractuels sont signés par le VP des ventes, l''ingénieur en chef et le directeur QA.'
    - q: 'Puis-je obtenir des copies des certificats avant de commander ?'
      a: 'Oui — les numéros de certificat et les enregistrements d''audit sont fournis sur demande ou pendant un audit. La liste est publiée, jamais « disponible sur demande uniquement ».'
    - q: 'Comment puis-je vérifier moi-même les enregistrements de test de lot ?'
      a: 'Chaque chambre est testée à 18,0 PSI pendant 24 heures avec rejet automatique au-delà d''une chute de 0,50 PSI ; les journaux de test sont liés aux numéros de série et partent avec le Certificat de Conformité par lot. Une inspection avant expédition SGS, TÜV, BV ou Intertek selon ISO 2859-1 Niveau II peut être planifiée à votre choix.'
    - q: 'Les certificats couvrent-ils aussi les accessoires ?'
      a: 'La documentation matériaux REACH/RoHS s''applique aux planches et aux accessoires fournis dans la même commande, et les listes de contrôle QC couvrent le kit complet — planche, pagaie, pompe, laisse et sac.'
    - q: 'Que devient la preuve après la commande ?'
      a: 'La traçabilité de lot ERP est conservée pendant 10 ans. Les SOP QMS et les normes d''inspection restent téléchargeables, et l''acheteur réserve un droit d''audit pendant la production selon le contrat.'

