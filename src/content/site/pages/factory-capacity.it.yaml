workshops:
  - title: Produzione SUP
    description: '4 linee di assemblaggio automatizzate per SUP gonfiabili con una produzione combinata di circa 10,000 tavole al mese. Le postazioni di stampa digitale e serigrafica operano in parallelo. Capacità SUP annua: oltre 120,000 tavole.'
    output: '120,000+ SUP/anno'
  - title: Produzione SUP — linee di ampliamento
    description: 'Ulteriori linee di assemblaggio automatizzate per SUP, attivate non appena i volumi crescono. L''incollaggio del nucleo drop-stitch, la stampa digitale e le postazioni di assemblaggio operano in parallelo.'
    output: 'Parte della capacità annua di oltre 120,000 SUP'
  - title: Accessori SUP & assemblaggio misto
    description: 'Linee di assemblaggio multifunzionali per accessori SUP — paddle, pinne, leash, borse e kit. Postazioni di saldatura ad aria calda, presse dielettriche HF e banchi di assemblaggio vengono riconfigurati in base al mix di ordini. Capacità annua accessori: oltre 5,000 unità.'
    output: '5,000+ accessori/anno'
  - title: Attrezzatura di sicurezza
    description: 'Area di produzione separata in camera pulita per giubbotti di salvataggio e attrezzatura di sicurezza. Postazioni dedicate di cucitura, inserimento schiuma e collaudo. Capacità annua giubbotti di salvataggio: oltre 50,000 unità.'
    output: '50,000+ giubbotti di salvataggio/anno'

oem_capacity:
  moq: 'SUP: campione 1–2 | pilota 20–50 | quantità 90–100+ (per bobina da 150 m)'
  lead_time: 'Standard 25–35 giorni. Campioni 7–12 giorni. Express disponibile.'
  payment: 'T/T 30% acconto + 70% saldo. L/C, Western Union accettati.'

lead_time_explainer:
  tagline: 'Pianificazione & schedulazione'
  title: 'Come la capacità si traduce nella vostra consegna'
  subtitle: 'La capacità non è un singolo numero — ecco come vengono realmente assegnati i tempi di consegna.'
  items:
    - title: 'La capacità varia con la vostra specifica'
      body: 'Gli slot disponibili si spostano con il tipo di tavola, la complessità costruttiva, l''imballaggio e la domanda stagionale. Durante il build-up primaverile/estivo le linee girano quasi a pieno regime e gli slot per i campioni si esauriscono per primi.'
    - title: 'Pianificate prima della vostra stagione di lancio'
      body: 'Definite in anticipo la conferma del campione e il freeze grafico. Gli ordini di ripetizione vengono schedulati nel vostro slot di ripetizione concordato non appena il golden sample viene archiviato.'
    - title: 'Tre corsie di schedulazione'
      body: 'I campioni vengono immessi per primi nella linea prototipi, gli ordini iniziali finiscono nella prossima finestra di assemblaggio libera e gli ordini di ripetizione girano nel loro slot di ripetizione.'
    - title: 'Tempi di consegna vincolanti dopo verifica'
      body: 'Confermiamo un tempo di consegna vincolante solo dopo che specifica, grafica, imballaggio e quantità sono stati verificati — mai come promessa fissa in anticipo.'

cta:
  title: 'Verifica la disponibilità produttiva per la tua data di lancio'
  subtitle: 'Invia tipo di tavola, quantità e data di spedizione target — rispondiamo con la prossima finestra produttiva libera e una stima di consegna vincolante.'
  actions:
    - variant: primary
      text: Verifica la disponibilità
