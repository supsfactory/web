how_to_choose:
  title: Come trovare la misura giusta
  cards:
    - title: Tavole SUP
      description: Scegli la lunghezza in base al tuo peso e all'uso previsto. Le tavole più larghe (32"+ – 81 cm+) offrono più stabilità. Le tavole più lunghe (11-12 ft) tengono meglio la rotta nei tour. I paddler più pesanti necessitano di tavole con volume maggiore.
    - title: SUP Touring
      description: Le tavole più lunghe (11–12 ft) sono le più adatte al paddling di distanza e ai tour. Le tavole più larghe (32"+ – 81 cm+) offrono più stabilità. Controlla la capacità di peso per il peso totale incluso l'attrezzatura.
    - title: SUP Allround
      description: Scegli la lunghezza in base al peso del rider e all'uso previsto. Le tavole Allround sono adatte a tempo libero, fitness e yoga. Le tavole più piccole sono più manovrabili.

