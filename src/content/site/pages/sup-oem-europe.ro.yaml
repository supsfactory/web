why_europe:
  tagline: 'De ce cumpărătorii din Europa'
  title: 'Construit pentru importurile în Europa'
  subtitle: 'Fabrica răspunde întrebărilor pe care mărcile europene le pun înainte de primul container — certificarea întâi.'
  items:
    - title: 'Documentație CE și REACH'
      description: 'Mostra aprobată se expediază împreună cu documentația CE și REACH pregătită pentru piața UE, astfel încât dosarul tehnic și documentele vamale să fie pregătite înainte de container.'
    - title: 'DDP pentru un cost final previzibil'
      description: 'DDP include formalitățile vamale, taxele vamale, impozitele și livrarea la depozitul dumneavoastră — un singur preț total, de la ușă la ușă, pe întreaga UE.'
    - title: 'FOB Qingdao cu propriul dumneavoastră comisionar'
      description: 'Importați regulat? Alegeți FOB Qingdao și folosiți propriul partener logistic — noi încărcăm și documentăm containerul, dumneavoastră controlați restul.'
    - title: 'O singură fabrică, un singur sistem de calitate'
      description: 'Dezvoltarea, mostrele, producția și controlul calității au loc toate în interiorul fabricii de 12,500 m² — mostra pe care o aprobați este produsul pe care îl primiți.'

process_notes:
  tagline: 'Cum funcționează'
  title: 'De la specificații la container'
  subtitle: 'Aceleași șase etape, indiferent dacă cumpărați două containere pe an sau douăzeci: specificații, inginerie, mostre, încercări, matriță, producție — apoi livrare FOB, CIF sau DDP.'
  items:
    - title: '1. Trimiteți specificațiile'
      description: 'O placă de referință, o schiță sau specificațiile unui concurent sunt suficiente. Analiza de inginerie și oferta revin în termen de o zi lucrătoare.'
    - title: '2. Aprobați mostra'
      description: 'Prima dumneavoastră mostră fizică se expediază în 7–12 zile, însoțită de o fișă de aprobare care acoperă construcția, culorile de imprimare și rezultatele testului de presiune.'
    - title: '3. Producție și export'
      description: 'Seriile se finalizează în 25–35 de zile, cu puncte de control al calității în proces. Lista de ambalare, factura și certificatul de transport maritim călătoresc înaintea vasului.'
    - title: '4. Livrare la depozitul dumneavoastră'
      description: '4–6 săptămâni de transport maritim până la Rotterdam sau Hamburg — în regim DDP ne ocupăm de formalitățile vamale și de livrare la ușa dumneavoastră.'

faq_section:
  tagline: FAQ
  title: 'Întrebări despre importul în Europa'
  questions:
    - q: 'Documentația CE este inclusă în comanda mea?'
      a: 'Da. Documentația CE și REACH este pregătită pentru piața UE împreună cu mostra dumneavoastră aprobată, înainte de începerea producției — documentele se expediază împreună cu containerul.'
    - q: 'Cât durează transportul maritim până în Europa?'
      a: 'Alocați 4–6 săptămâni de la portul Qingdao până la Rotterdam sau Hamburg, în funcție de programul plecărilor. Proiectele DDP includ întregul termen de la ușă la ușă.'
    - q: 'Livrați DDP către țările UE?'
      a: 'Da. DDP include transportul maritim, formalitățile vamale, taxele vamale și impozitele, precum și livrarea la depozitul dumneavoastră — un singur preț total, previzibil. Sunt disponibile și FOB Qingdao și CIF.'
    - q: 'Care este MOQ-ul pentru un import SUP private label?'
      a: 'MOQ este confirmat în funcție de configurația proiectului: dezvoltarea mostrei acoperă 1–2 bucăți, loturile pilot sunt de 20–50 bucăți pe platforme existente, iar producția standard de volum rulează 90–100+ bucăți pe model dintr-o rolă completă de drop-stitch de 150 m.'
    - q: 'Ce documentație furnizați pentru importuri?'
      a: 'Mostra aprobată se expediază împreună cu documentația CE și REACH pregătită pentru piața dumneavoastră țintă, iar fiecare container se expediază cu listă de ambalare, factură și certificat de transport maritim.'
    - q: 'Cum încep un proiect din Europa?'
      a: 'Trimiteți o placă de referință, o schiță sau specificații. Analiza de inginerie și oferta revin în termen de o zi lucrătoare, iar un NDA este semnat înainte de orice schimb de fișiere.'

