  items:
    - title: 'IQC — Rapport ingang goederen'
      description: 'Verificatie van weefsel, PVC-rol, ventielen en componenten tegen de goedgekeurde specificatie.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Download de IQC-rapporten (PDF)'
    - title: 'IPQC — Rapport proces & eerste artikel'
