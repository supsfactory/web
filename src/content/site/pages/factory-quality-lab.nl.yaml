      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Download de IPQC-rapporten (PDF)'
    - title: 'Luchtdichtheid — Druk- & lekregistraties'
      description: '100% naadlekdetectie, ventielintegriteit en verificatie van het 24-uurs drukbehoud.'
      icon: tabler:waves
