traceability:
  tagline: Rintracciabilità per lotto
  title: 'Quattro domande a cui ogni lotto risponde'
  subtitle: 'Le registrazioni di qualità vengono conservate per lotto di produzione e collegate alla specifica di prodotto, alla grafica, alla BOM e ai requisiti di imballaggio applicabili. Questo supporta l''indagine e l''azione controllata quando viene identificato un problema di qualità. In un audit dell''acquirente, il nostro team qualità risponde a queste quattro domande sul campo — ogni risposta rimanda a una registrazione controllata.'
  items:
    - title: 'Cosa è stato prodotto?'
      description: 'Prodotto, modello, configurazione e revisione sono collegati al numero d''ordine e alla revisione di specifica approvata.'
      icon: '1'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Visualizza il dossier di rintracciabilità (PDF)'
    - title: 'Quali materiali sono stati utilizzati?'
      description: 'Ogni lotto di materiale che confluisce nel lotto viene registrato con il suo fornitore, il suo certificato e la sua disposizione IQC.'
      icon: '2'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Visualizza il dossier di rintracciabilità (PDF)'
    - title: 'Chi ha ispezionato e quando?'
      description: 'Ogni registrazione riporta ruolo dell''ispettore, data, strumenti utilizzati e risultato — nessuna firma anonima.'
      icon: '3'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Visualizza il dossier di rintracciabilità (PDF)'
    - title: 'Come è stato rilasciato il lotto?'
      description: 'Il rilascio viene autorizzato dalla Quality solo quando tutti i punti sono chiusi; la disposizione viene documentata nella registrazione.'
      icon: '4'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Visualizza il dossier di rintracciabilità (PDF)'
non_conformance:
  tagline: Controllo dei prodotti non conformi
  title: 'Quando viene rilevato un difetto: contenere, decidere, documentare'
  subtitle: 'I prodotti o i componenti che non soddisfano i criteri di accettazione definiti vengono identificati e posti sotto controllo. Rilavorazione o sostituzione sono ammesse solo tramite la procedura di qualità applicabile, seguite da una nuova verifica prima del rilascio autorizzato.'
  items:
    - title: 'Rilevare e isolare'
      description: 'Le unità difettose vengono etichettate in rosso e portate alla stazione di quarantena — nessun ulteriore trattamento o imballaggio fino alla disposizione.'
      icon: tabler:alert-triangle
    - title: 'Disposizione tramite NCR'
      description: 'La Quality emette un Non-Conformance Report e indirizza l''unità secondo la matrice di disposizione a rilavorazione, ricontrollo, rifiuto o rottamazione.'
      icon: tabler:git-branch
      link: /factory/non-conforming-control
      link_label: 'Standard per i prodotti non conformi'
    - title: 'Verificare e rilasciare'
      description: 'Le unità rilavorate vengono ricontrollate contro gli stessi criteri; l''NCR viene chiuso solo dopo il superamento della nuova verifica.'
      icon: tabler:shield-check
    - title: 'Controllo della rottamazione'
      description: 'Il materiale rottamato viene distrutto con un certificato di rottamazione firmato, così non può mai più rientrare in magazzino o sul mercato.'
      icon: tabler:trash
      link: https://assets.supsfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Certificato di rottamazione e distruzione (PDF)'
    - title: 'Feedback sulla causa principale'
      description: 'I difetti ricorrenti attivano azioni correttive con il processo o il fornitore responsabile — un ciclo chiuso, non semplici pratiche.'
      icon: tabler:refresh
      link: https://assets.supsfactory.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'SOP di controllo modifiche per rilavorazione (PDF)'
