  items:
    - title: '00 · Piano di ispezione della qualità del progetto (QIP)'
      description: 'Il contratto di qualità per l''ordine: punti, ambito di ispezione, metodi, criteri di accettazione e le registrazioni che riceverai.'
      icon: '00'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
