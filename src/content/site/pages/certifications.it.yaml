quality_basis:
  tagline: Base di qualità
  title: 'Cosa definisce l''accettazione del prodotto'
  subtitle: 'I criteri finali di accettazione vengono definiti prima del rilascio della produzione. Questi documenti di progetto controllati definiscono cosa deve essere realizzato, come vengono verificati i dettagli chiave e cosa deve essere controllato prima della spedizione — approvati dall''acquirente e congelati nel Piano di Ispezione della Qualità (QIP). Ogni richiesta di modifica passa da un controllo delle modifiche documentato, mai in modo tacito in linea.'
  items:
    - title: 'Campione approvato'
      description: 'La tavola fisica di riferimento approvata e firmata dall''acquirente. Ogni tavola finita viene confrontata con essa per dimensioni, profilo, rigidità e finitura.'
      icon: tabler:medal
    - title: 'Specifica tecnica'
      description: 'Materiali, costruzione e disegni quotati, fissati a un numero di revisione. La FAI verifica il primo articolo esattamente contro questa revisione.'
      icon: tabler:file-check
    - title: 'Grafiche approvate'
      description: 'Grafiche, inchiostri di stampa e posizionamento approvati e bloccati per versione prima del taglio — così ogni deck viene spedito con l''aspetto approvato dal marchio.'
      icon: tabler:palette
    - title: 'BOM approvata dal cliente'
      description: 'Distinta base — tavola, pagaia, pompa, leash, borsa, manuale — confermata dall''acquirente. La PSI verifica la completezza del kit al 100% rispetto a questa BOM.'
      icon: tabler:list-checks
    - title: 'Requisiti di imballaggio ed etichettatura'
      description: 'Struttura della scatola, marcature, codici a barre, contenuti delle etichette e marcature di spedizione fissati per iscritto. La leggibilità dei codici a barre e la precisione delle marcature vengono verificate in PSI.'
      icon: tabler:package
tests:
  - title: Test di pressione
    description: Le camere gonfiabili vengono esposte per periodi prolungati a pressioni superiori ai loro limiti operativi consigliati. Questo verifica l''ermeticità e l''integrità strutturale di materiale e cuciture, garantendo che il prodotto resista all''uso previsto e a un eventuale sovragonfiaggio senza cedimenti o perdite.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-pressure-testing.webp
    alt: Camera SUP gonfiabile in test di pressione per la verifica dell''ermeticità
  - title: Test d''impatto
    description: I prodotti vengono sottoposti a impatti controllati con diversi pesi e angolazioni. Questo valuta la resistenza del materiale a perforazioni, strappi e danni da collisione con ostacoli in acqua e ne dimostra la durabilità e la longevità.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-production-department.webp
    alt: Dispositivo di test d''impatto che verifica la resistenza alla perforazione del materiale dei gommoni
  - title: Test di resistenza ai raggi UV
    description: I campioni di materiale vengono esposti a radiazione UV accelerata per verificare che non ingialliscano, non si strappino o non perdano resistenza nel tempo. Ogni lotto di PVC viene testato per il degrado solare prima della produzione.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-uv-resistance-testing.webp
    alt: Campioni di materiale PVC esposti a radiazione UV accelerata nel test di resistenza
  - title: Test di resistenza all''abrasione
    description: I campioni di materiale vengono strofinati su superfici abrasive per un numero definito di cicli sotto pressione controllata. Questo misura la capacità del materiale di resistere all''usura dovuta all''uso ripetuto e al contatto con sabbia, pietre o altre superfici, garantendo la durabilità a lungo termine.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-pvc-material-testing.webp
    alt: Macchina di prova dell''abrasione che strofina un campione di tessuto PVC per misurare la resistenza all''usura
  - title: Test di prestazioni a bassa temperatura
    description: I prodotti vengono testati in ambienti freddi per valutare funzionalità e durabilità in diverse condizioni di temperatura, prevenendo rigidità o crepe nelle acque più fredde. Essenziale per imbarcazioni destinate all''uso invernale o ad alte latitudini.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-factory-exterior.webp
    alt: Prodotto gonfiabile in cella frigorifera per il test di prestazioni a bassa temperatura
  - title: Test di galleggiabilità e capacità di carico
    description: I prodotti vengono testati con diversi pesi per determinare la capacità di carico massima e garantire che sostengano in sicurezza utenti e attrezzatura. La capacità nominale di ogni modello viene verificata prima del rilascio.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-stock-boat-inventory.webp
    alt: Test di galleggiabilità e capacità di carico con pesi su imbarcazioni gonfiabili
  - title: Test di manovrabilità
    description: I prodotti vengono testati per la risposta agli input di pagaiata o motore, valutando raggio di virata e maneggevolezza. Le prove in acqua validano che il comportamento reale corrisponda alle specifiche di progettazione.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-sup-manufacturing.webp
    alt: Test di manovrabilità in acqua di scafi SUP e imbarcazioni gonfiabili
  - title: Test di tenuta
    description: I prodotti completamente assemblati vengono immersi o esposti a getti d''acqua per verificare la presenza di perdite su cuciture, valvole o materiali. Ogni imbarcazione supera un test di tenuta obbligatorio prima della spedizione.
    image: https://assets.supsfactory.com/images/sups/factory/supsfactory-production-department-2.webp
    alt: Test di tenuta per immersione che verifica cuciture e valvole alla ricerca di perdite
qc_flow:
  tagline: Il flusso di ispezione in 7 fasi
  title: 'Sette punti di controllo qualità controllati, end-to-end'
  subtitle: 'Ogni punto qui sotto è definito nel Piano di Ispezione della Qualità specifico del progetto con il suo oggetto di ispezione, il metodo, i criteri di accettazione e l''output documentale. I dossier di report bilingue sono registrazioni controllate reali — aprine uno per vedere la struttura effettiva.'
  obj_label: Oggetto di ispezione
  method_label: Metodo di ispezione
  criteria_label: Criteri di accettazione
  record_label: Output documentale
  stages:
    - stage: STAGE 01
      title: 'Pianificazione qualità di progetto (PPM)'
      summary: 'La riunione di pre-produzione fissa ambito, baseline e piano di ispezione prima dell''avvio della linea.'
      checks:
        - 'Nome del prodotto, codice interno, SKU cliente, numero d''ordine e definizione del lotto vengono registrati.'
        - 'Tipo di tavola, nucleo drop-stitch, materiali, rail band, EVA, valvole e sistema di alette vengono specificati.'
        - 'Nome file grafico, versione, colori, posizione del logo e area di stampa vengono bloccati e approvati.'
        - 'La BOM — ogni articolo per set con quantità, colore, numero di parte e regole di sostituzione — è approvata dal cliente.'
        - 'Imballaggio, etichettatura, codici a barre, lingua dei manuali e disposizioni per le ispezioni di terze parti sono fissati per iscritto.'
      object: 'Ambito del progetto vs. requisiti del cliente — materiali, dimensioni, grafiche, imballaggio, mercato di destinazione e norme applicabili.'
      method: 'Riunione di pre-produzione con vendite, progettazione e QC; firma del golden sample; emissione del Piano di Ispezione della Qualità (QIP) per l''ordine.'
      criteria: 'Tutte le cinque baseline vengono approvate e congelate prima dell''avvio della produzione in serie. I punti irrisolti bloccano il rilascio della produzione.'
      record: 'QIP + verbale PPM, verbali di approvazione del campione.'
      image: https://assets.supsfactory.com/site/quality/node01-ppm.avif
      alt: Riunione di pre-produzione per l''esame del golden sample e del piano di ispezione qualità per un ordine SUP OEM
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Scarica il QIP (PDF)'
    - stage: STAGE 02
      title: 'Controllo di ingresso merci (IQC)'
      summary: 'Le materie prime vengono verificate contro la specifica approvata del fornitore prima di entrare in produzione.'
      checks:
        - 'Tessuto drop-stitch, bobine di PVC, materiale per rail e deck pad in EVA vengono controllati contro il campione approvato — colore, spessore, peso e difetti superficiali.'
        - 'Valvole, fin box, anelli a D, maniglie e raccordi vengono controllati per tipo, dimensione, superficie, ruggine e funzionamento corretto.'
        - 'Pompe, pagaie, leash, borse e kit di riparazione vengono verificati per modello, colore e configurazione di progetto.'
        - 'I certificati dei fornitori (COA), le dichiarazioni dei materiali e i documenti di conformità REACH/RoHS vengono esaminati per ogni lotto.'
        - 'I lotti non conformi vengono bloccati e respinti prima che il materiale raggiunga la linea.'
      object: 'Tessuto drop-stitch, bobine di PVC, valvole, alette, accessori e materiali di imballaggio contro la specifica approvata e i certificati di collaudo dei fornitori.'
      method: 'Controlli visivi, dimensionali e di peso; campionamento dei lotti secondo AQL; certificati dei materiali esaminati; elenco fornitori approvati applicato.'
      criteria: 'Rispetta la specifica e i certificati approvati. I lotti non conformi vengono bloccati e respinti prima del rilascio in linea.'
      record: 'Report di prova IQC con riferimenti ai lotti e disposizioni.'
      image: https://assets.supsfactory.com/site/quality/node02-iqc.avif
      alt: Controllo di ingresso merci di tessuto PVC e componenti SUP in fabbrica
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Scarica i report IQC (PDF)'
    - stage: STAGE 03
      title: 'Controllo di processo e test del primo articolo (IPQC / FAI)'
      summary: 'I metodi di costruzione e i punti di controllo vengono scelti in base alla piattaforma di tavola approvata e alla configurazione del progetto. Il primo campione viene verificato contro le baseline bloccate; ogni turno mantiene controlli a campione in linea.'
      checks:
        - 'Il primo articolo viene verificato contro campione approvato, disegno tecnico, BOM, grafiche e file di imballaggio prima dell''avvio della produzione in serie.'
        - 'Dimensioni della tavola, contorno e simmetria vengono misurati; direzione di inchiostro e logo, posizione, colori e revisione vengono confermati.'
        - 'Cuciture e continuità del rail vengono controllate in linea per gap, delaminazione, pieghe, contaminazione o disallineamento.'
        - 'L''installazione di valvola, anelli a D, maniglie e fin box viene controllata per posizione, quantità e montaggio rispetto alla BOM approvata dal cliente.'
        - 'Il rilascio FAI blocca per versione grafiche, dimensioni e BOM; le deviazioni passano dal flusso decisionale di rilavorazione — mai ritocchi in linea.'
      object: 'Primo articolo e assemblaggi in lavorazione — cuciture, rail, fin box, base valvola, posizione grafica, coppia dei raccordi.'
      method: 'Test del primo articolo sul primo pezzo; controlli a campione per turno; resistenza della saldatura e allineamento delle cuciture verificati in linea.'
      criteria: 'Il rilascio FAI blocca per versione grafiche, dimensioni e BOM. Le deviazioni passano dal flusso decisionale di rilavorazione — mai ritocchi in linea.'
      record: 'Registrazione FAI, verbali a campione per turno, note di rilavorazione e disposizione.'
      image: https://assets.supsfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Ispezione di processo e test del primo articolo durante la produzione SUP
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Scarica i report IPQC (PDF)'
    - stage: STAGE 04
      title: 'Test di gonfiaggio e tenuta all''aria'
      summary: 'Ogni tavola completata viene sottoposta a verifica di gonfiaggio e tenuta all''aria prima dell''imballaggio — 100% delle unità, non un campione.'
      checks:
        - 'La superficie della tavola, i rail e l''area della valvola vengono controllati prima del gonfiaggio per fori di spillo, crepe, pieghe anomale o delaminazione.'
        - 'Le camere vengono gonfiate alla pressione di test del progetto con un manometro digitale calibrato e il valore iniziale viene bloccato.'
        - 'Nucleo valvola, base valvola e cuciture del rail vengono controllati su tutta la circonferenza — prua, poppa e aree curve.'
        - 'Mantenimento della pressione di 24 ore con registrazione continua; espulsione automatica oltre la caduta di pressione consentita.'
        - 'Le tavole difettose vengono bloccate, rilavorate secondo istruzione e testate di nuovo completamente — non solo ricontrollate nel punto di riparazione.'
      object: '100% delle camere gonfiate — rilevamento completo delle perdite sulle cuciture, integrità delle valvole e capacità di mantenimento della pressione.'
      method: 'Rilevamento completo delle perdite sulle cuciture, seguito da un mantenimento della pressione di 24 ore a 18,0 PSI; espulsione automatica oltre una caduta di 0,50 PSI.'
      criteria: 'Zero punti di perdita e caduta di pressione entro 0,50 PSI per camera; le unità difettose vengono bloccate e rilavorate o rottamate.'
      record: 'Report di test di tenuta all''aria, uno per camera, con collegamento al lotto.'
      image: https://assets.supsfactory.com/site/quality/node04-airtightness.avif
      alt: Test di gonfiaggio e tenuta all''aria di una camera SUP gonfiabile
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Scarica i report di tenuta all''aria (PDF)'
    - stage: STAGE 05
      title: 'Ispezione del prodotto finito (FQC)'
      summary: 'Le tavole finite vengono misurate e valutate otticamente contro il golden sample approvato.'
      checks:
        - 'Le dimensioni chiave — lunghezza, larghezza e spessore — vengono misurate alla pressione di esercizio contro le tolleranze di disegno.'
        - 'Contorno della tavola, rocker e simmetria vengono verificati; nessuna deformazione, torsione o ondulazione anomala dopo il gonfiaggio.'
        - 'Valutazione ottica sotto lampade di luce diurna D65: graffi, macchie, residui di adesivo, bolle, pieghe, deviazioni di colore.'
        - 'Test funzionali: apertura/chiusura valvola e montaggio del tappo, inserimento e blocco dell''aletta, anelli a D, maniglie e funzionamento della pagaia.'
        - 'La configurazione viene verificata contro la BOM e lo SKU approvati dal cliente — accessori, etichette, codici a barre e numeri di serie.'
      object: 'Tavola finita vs. golden sample — dimensioni, rocker, profilo, aspetto, montaggio della fin box e completezza degli accessori.'
      method: 'Verifica dimensionale contro le tolleranze di disegno; valutazione ottica sotto lampade di luce diurna D65; test di montaggio fin box e raccordi.'
      criteria: 'Dimensioni entro tolleranza (es. 3508 × 814 × 150,3 mm), valutazione ottica secondo il campione approvato, tutti gli accessori presenti.'
      record: 'Report FQC con firma dell''ispettore e disposizione.'
      image: https://assets.supsfactory.com/site/quality/node05-fqc.avif
      alt: Ispezione del prodotto finito delle tavole SUP prima dell''imballaggio
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Scarica i report FQC (PDF)'
    - stage: STAGE 06
      title: 'Ispezione di imballaggio pre-spedizione (PSI)'
      summary: 'Il kit imballato viene controllato per completezza, precisione dell''etichettatura e prontezza alla spedizione.'
      checks:
        - 'Completezza del kit al 100% vs. BOM: tavola, pagaia, pompa, leash, borsa, kit di riparazione e manuale — un set alla volta.'
        - 'Parti delicate protette (tasche pompa e lama), tavola piegata secondo la SOP di imballaggio, accessori conformi a modello e colore.'
        - 'Grafiche della scatola, marchio, avvertenze e versioni linguistiche vengono controllati contro la revisione grafica approvata.'
        - 'Tipo, numero, posizione e scansionabilità del codice a barre verificati; marcature di spedizione, SKU, PO, numero di cartone e quantità corretti.'
        - 'Dimensioni della scatola, peso lordo/netto e imballaggio interno conformi alla specifica di imballaggio; risultato del drop test registrato se richiesto.'
      object: 'Kit imballato — tavola, pagaia, pompa, leash, borsa, manuale — contro la BOM e la specifica di imballaggio approvate dal cliente.'
      method: 'Completezza del kit al 100% vs. BOM; scansione dei codici a barre (voto ≥ B); precisione delle etichette dei cartoni; drop test ISTA-1A sui cartoni imballati.'
      criteria: 'Abbinamento kit al 100% con la BOM, codici a barre leggibili, etichette corrette e imballaggio a prova di caduta prima del caricamento.'
      record: 'Checklist PSI e verbali di imballaggio per ogni cartone.'
      image: https://assets.supsfactory.com/site/quality/node06-psi.avif
      alt: Ispezione pre-spedizione che verifica il kit SUP imballato contro la BOM
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Scarica i report PSI (PDF)'
    - stage: STAGE 07
      title: 'Rilascio per la spedizione e rintracciabilità'
      summary: 'La Quality rilascia il lotto solo quando tutti i sei punti precedenti sono chiusi e tutte le registrazioni sono complete.'
      checks:
        - 'Lotto di produzione, numero d''ordine, SKU, quantità e numero di cartoni corrispondono alla packing list e alla fattura commerciale.'
        - 'I file di specifica, BOM, grafiche e imballaggio sono tutti nella revisione approvata corrente.'
        - 'Le registrazioni IQC, FAI, di processo, di tenuta all''aria, FQC e PSI sono complete per il lotto da rilasciare.'
        - 'Tutte le non conformità sono risolte, rilavorate, testate di nuovo e chiuse — nessun punto aperto al rilascio.'
        - 'Campi di rintracciabilità registrati per ogni lotto: codice progetto, PO, SKU, revisioni di grafiche/BOM/imballaggio, data di produzione, ispettore e numeri di registrazione.'
      object: 'Autorizzazione al rilascio del lotto — tutti i punti chiusi, registrazioni complete, numeri di serie del lotto assegnati.'
      method: 'Verifica dei punti da parte della Quality su tutte le sei registrazioni precedenti; dossier di rintracciabilità del lotto compilato; registrazioni consegnate alla spedizione.'
      criteria: 'Tutti i punti rilasciati dalla QA; registrazioni del lotto e dossier di rintracciabilità consegnati all''acquirente o mantenuti sotto NDA su richiesta.'
      record: 'Autorizzazione al rilascio per la spedizione e dossier di rintracciabilità del lotto.'
      image: https://assets.supsfactory.com/site/quality/node07-shipment-release.avif
      alt: Firma del rilascio per la spedizione e consegna del verbale di rintracciabilità del lotto
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Scarica i report di rilascio (PDF)'
system_map:
  tagline: Il sistema qualità
  title: 'Un sistema, quattro standard controllati'
  subtitle: 'I sette punti sopra si basano su quattro standard documentati, pubblicati ciascuno come procedura controllata che puoi scaricare e sottoporre ad audit. Insieme formano il QMS dietro ogni ordine OEM/ODM — criteri di ispezione, controllo delle modifiche, non conformità e test di laboratorio.'
  items:
    - title: 'Standard di ispezione e rilascio'
      description: 'Il QIP di progetto guida ogni punto: oggetto di ispezione, metodo, criteri di accettazione e output documentale per ogni ordine. Include il framework QC a 4 fasi, la catena di rintracciabilità, il flusso di quarantena, la matrice dei difetti e il registro documentale 00–15.'
      icon: tabler:clipboard-check
      link: /factory/quality-inspection
      link_label: 'Standard di ispezione e download QMS'
    - title: 'Controllo delle modifiche di rilavorazione'
      description: 'Nessuna modifica dei parametri di rilavorazione senza controllo documentato: contenimento, classificazione del rischio, ciclo di modifica in 9 fasi, matrice di rilascio e validazione. Ogni modifica a specifiche approvate, campioni, BOM o criteri di accettazione richiede l''approvazione scritta del cliente.'
      icon: tabler:git-branch
      link: /factory/quality-change-control
      link_label: 'Standard di controllo delle modifiche'
    - title: 'Controllo dei prodotti non conformi'
      description: 'Un ciclo chiuso in 7 fasi secondo ISO 9001:2015 sezione 8.7: identificare, bloccare, disporre tramite NCR, rilavorare o respingere, ricontrollare, rilasciare, correggere. Include l''autorità in base alla gravità, la matrice di disposizione dei difetti SUP e la distruzione assistita.'
      icon: tabler:alert-triangle
      link: /factory/non-conforming-control
      link_label: 'Standard per i prodotti non conformi'
    - title: 'Test di laboratorio e attrezzatura'
      description: 'Il laboratorio qualità opera in modo indipendente dalla produzione: macchine di trazione, caduta di pressione, invecchiamento UV, peeling delle saldature, rilevamento perdite e camere termiche — con le procedure di calibrazione e test alla base delle nostre dichiarazioni pubblicate.'
      icon: tabler:flask
      link: /factory/quality-lab
      link_label: 'Laboratorio qualità e attrezzatura di test'
    - title: 'Laboratorio di prova materiali (R&S)'
      description: 'Il centro R&S esegue test indipendenti sui materiali per formulazioni PVC/Hypalon, invecchiamento accelerato e supporto alla certificazione, alimentando gli standard usati dalla produzione.'
      icon: tabler:microscope
      link: /randdcenter/quality-inspection-lab
      link_label: 'Laboratorio di prova materiali R&S'
intelligence_cards:
  tagline: Documentazione e rintracciabilità
  title: 'Registrazioni qualità a supporto della rintracciabilità di progetto'
  subtitle: 'Le registrazioni di ispezione vengono conservate per lotto di produzione e collegate alla documentazione di progetto applicabile — revisione di specifica, revisione grafica, BOM e requisiti di imballaggio. Per proteggere i dati dei clienti, i campioni in questa pagina sono anonimizzati: vengono mostrati solo i campi strutturali (codice progetto, prodotto/SKU, lotto, fase di ispezione, punto di controllo, criteri di accettazione, risultato, ispettore, data e stato di rilascio).'
  cards:
    - icon: 1
      icon_bg: blue
      title: Verbale di controllo di ingresso merci
      desc: 'Dimostra che materie prime, tessuto drop-stitch, bobine di PVC e componenti vengono verificati contro la specifica approvata prima del rilascio della produzione.'
      metrics:
        - { label: Fase, value: '02 · IQC' }
        - { label: Riferimento lotto, value: 'LOT-DEMO-DS-0814' }
        - { label: Risultato, value: 'Superato · rilasciato per la produzione' }
      link: 'https://assets.supsfactory.com/site/downloads/anonymized-quality-record-samples.pdf#page=1'
      link_label: 'Visualizza il campione anonimizzato (PDF)'
