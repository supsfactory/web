content_certifications:
  tagline: Certificazioni e standard
  title: 'Qualità certificata, riconosciuta a livello mondiale'
  subtitle: 'Le certificazioni valgono quanto ciò che coprono. Di seguito trovi l''ambito di certificazione, il titolare del certificato e come richiedere o verificare i documenti per il tuo progetto.'
  items:
    - title: 'Marcatura CE'
      description: 'La documentazione di conformità CE è disponibile per le configurazioni applicabili al mercato UE secondo la direttiva 2013/53/UE (imbarcazioni da diporto); l''ambito viene confermato per ogni progetto. Numeri di certificato e rapporti di prova disponibili su richiesta.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Sistema di gestione della qualità certificato ISO 9001:2015, che copre sviluppo, produzione e vendita di imbarcazioni gonfiabili e attrezzatura nautica. Ambito di certificazione e report di audit disponibili su richiesta.'
      icon: tabler:clipboard-check
    - title: 'Conformità sociale BSCI'
      description: 'Valutato secondo BSCI (Business Social Compliance Initiative), che copre le condizioni di lavoro e la conformità della fabbrica. Report di audit disponibile su richiesta.'
      icon: tabler:heart-handshake
    - title: 'Conformità materiali REACH'
      description: 'I materiali rispettano il regolamento REACH dell''UE sulla sicurezza chimica. Le dichiarazioni dei materiali vengono fornite con la documentazione di produzione di ogni spedizione.'
      icon: tabler:flask
    - title: 'Conformità RoHS'
      description: 'La restrizione delle sostanze pericolose viene documentata secondo RoHS per i componenti e i materiali applicabili.'
      icon: tabler:flame
    - title: 'Test dei materiali'
      description: 'I tessuti vengono testati per resistenza alla trazione, resistenza allo strappo, degrado UV e comportamento a frattura a freddo. Ogni lotto di produzione viene campionato e verificato contro il protocollo di prova pubblicato.'
      icon: tabler:test-pipe
faqs:
  tagline: FAQ
  title: Domande frequenti sul nostro sistema qualità
  items:
    - q: 'Posso scaricare i report di ispezione reali?'
      a: 'Sì. I sette dossier di report bilingue in questa pagina — QIP, IQC, IPQC/FAI, tenuta all''aria, FQC, PSI e rilascio per la spedizione — sono registrazioni controllate reali con i campi riservati rimossi. Mostrano la struttura esatta, i metodi e i criteri di accettazione utilizzati in ogni ordine.'
    - q: 'Come si applicano i sette punti al mio progetto?'
      a: 'Ogni progetto riceve un Piano di Ispezione della Qualità (QIP) che definisce i punti applicabili al tuo prodotto e mercato, l''ambito di ispezione in ogni punto e le registrazioni che riceverai. Scarica il campione QIP in questa pagina per vedere la struttura.'
    - q: 'Questi campioni di ispezione sono reali?'
      a: 'Sì. I campioni seguono la nostra struttura di registrazione controllata effettiva — intestazione del documento, checklist di ispezione, criteri di accettazione, metodo, risultati, ruolo dell''ispettore e disposizione di rilascio. Tutti i valori identificativi sono sostituiti con valori dimostrativi (codici DEMO-*), così non vengono divulgati dati di clienti, grafiche, ordini o prezzi.'
    - q: 'Perché i campioni sono anonimizzati?'
      a: 'La riservatezza degli acquirenti ha priorità. Nomi dei clienti, grafiche, dettagli degli ordini, informazioni sui fornitori e prezzi sono protetti by design. L''anonimizzazione consente a ogni potenziale acquirente di verificare la nostra struttura di registrazione e rintracciabilità senza divulgare i dati commerciali di un altro cliente.'
    - q: 'Possiamo ricevere i report di ispezione completi per il nostro progetto?'
      a: 'Sì. Per i progetti approvati condividiamo la documentazione qualità applicabile al tuo ordine — piano di ispezione qualità, report di ingresso merci, di processo, di tenuta all''aria, finali e di imballaggio, oltre all''autorizzazione di rilascio per la spedizione — collegata alla rintracciabilità del lotto. I dati commerciali sensibili restano sotto NDA come concordato.'
    - q: 'Cosa contiene una registrazione di ispezione legata al lotto?'
      a: 'Ogni registrazione collega il lotto di produzione alla revisione di specifica o disegno applicabile, registra ogni punto di controllo contro i suoi criteri di accettazione con metodo e strumento utilizzati e si chiude con ruolo dell''ispettore, stato del risultato e disposizione di rilascio firmata dalla Quality.'
evidence_review:
  tagline: 'Prove e verifica'
  title: 'SPECIFICHE VERIFICATE'
  body: 'Tutte le dichiarazioni di produzione in questa pagina vengono verificate dal nostro Manufacturing Engineering Team nel sito di Laixi, Qingdao. Certificati, registrazioni di ispezione QC, report di test di pressione e strutturali e registrazioni di rintracciabilità dei lotti sono disponibili su richiesta. Specifiche verificate per l''ultima volta a settembre 2026.'

