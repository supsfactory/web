hero:
  tagline: ODM-produktion
  title: 'ODM-producent af SUP — produktdesign og udvikling'
  subtitle: 'Du behøver ikke et færdigt SUP-design. Start med et produktkoncept, et markedskrav eller et ydeevnemål — vores egne ingeniører designer skrog, konstruktion, grafik og emballage ud fra dit brief, bygger derefter en prototype på 7–12 dage og producerer på 25–35 dage efter bekræftet PO.'

answer:
  label: 'Det korte svar'
  text: 'iSupfactory er en ODM-producent af SUP i Qingdao, Kina. ODM-udvikling starter fra dit brief, ikke dine tegninger: skrogdesign (længde, bredde, rocker, volumen), materialestruktur og grafik konstrueres i eget hus, valideres med prototypeprøvebrætter på 7–12 dage og produceres ved et standard volumen på 90–100 stk. pr. 150 m rulle (pilot fra 20–50 stk.). Produktion kører 25–35 dage efter bekræftet PO og depositum; eget værktøj til specialform lægger 15–20 dage til. Dokumentation for CE, ISO 9001, BSCI, REACH og RoHS følger med hver ordre.'
  verified: 'September 2026'

features:
  title: ODM-kapaciteter
  subtitle: 'Alt, du får, når designarbejdet sker på fabrikken og ikke ved dit skrivebord.'
  items:
    - title: Skrogdesign
      description: 'Længde, bredde, tykkelse, rocker og volumen konstrueres efter dine målryttere, anvendelsesformål og markeder — fra en blank side eller fra vores gennemprøvede bibliotek af platforme.'
      icon: 'tabler:waves'
    - title: 'Konstruktionsteknisk projektering'
      description: 'Drop-stitchdensitet, antal og kvalitet af PVC-lag, placering af forstærkninger og kantkonstruktion specificeres og valideres til dit design.'
      icon: 'tabler:building-factory'
    - title: 'Grafik & branding'
      description: 'Grafik på brættets dæk, branding på slangen, EVA-flader og salgsemballage udviklet af vores eget designteam omkring dit mærke.'
      icon: 'tabler:palette'
    - title: 'Udvikling af form'
      description: 'Nye skrogformer starter som formværktøj, der designs og skæres i eget hus — værktøjet lægger 15–20 dage til projektets tidsplan.'
      icon: 'tabler:shapes'
    - title: 'Prototypevalidering'
      description: 'En fysisk prototype bygges, testes og sendes til din gennemgang med prøvesejlads — normalt inden for 7–12 dage.'
      icon: 'tabler:tools'
    - title: 'Test & overholdelse'
      description: 'Test af luftfastholdelse, trykhold og sømstyrke pr. enhed, med dokumentation for ISO 9001, BSCI, REACH, RoHS og CE-overensstemmelse, der er relevant for målmarkedet (omfanget bekræftes pr. projekt).'
      icon: 'tabler:certificate'
    - title: 'Valgmuligheder for ejerskab af værktøj'
      description: 'Klausuler om ejerskab eller overtagelse af formen skrives ind i kontrakten — dit design forbliver dit, og værktøjet opbevares til gentbestillinger.'
      icon: 'tabler:lock'
    - title: 'Fra prototype til container'
      description: 'Et valideret ODM-design går direkte videre til standardvolumenproduktion: 90–100+ stk. pr. 150 m rulle, 25–35 dage efter bekræftet PO.'
      icon: 'tabler:package'

customization:
  tagline: 'Udviklet sammen med dig'
  title: 'Hvad vi udvikler omkring dit brief'
  subtitle: 'ODM betyder, at produktet designes til dig fra bunden eller fra vores bibliotek af platforme — dette er de håndtag, dit brief styrer:'
  items:
    - 'Rytterprofil og marked — begynder, touring, racing, yoga, fiskeri eller flerbrugspositionering'
    - 'Brættets mål — længde, bredde, tykkelse og volumen tilpasset målrytteren og anvendelsen'
    - 'Skrogkarakter — rocker, kantprofil, nese- og haleform afstemt efter stabilitet eller fart'
    - 'Materialestruktur — drop-stitchdensitet, antal og kvalitet af PVC-lag, forstærkninger og kantforstærkninger'
    - 'Grafik og farver — brandfarver, dækillustrationer og branding på slangen udviklet i eget hus'
    - 'EVA-gripflade — placering, farver og logoplacering på tværs af dækket'
    - 'Tilbehørspakke — pagajer, pumper, finner, sikkerhedsliner og tasker tilpasset brættet'
    - 'Emballage og salgspresentation — salgskasser, displays og eksportemballage under dit mærke'

faq_section:
  tagline: FAQ
  title: 'Spørgsmål om ODM-udvikling'
  questions:
    - q: Hvordan adskiller ODM sig fra OEM?
      a: 'ODM (Original Design Manufacturing) starter fra dit brief — vores ingeniører udvikler brættets struktur, konstruktion, grafik og emballage, hvad enten udgangspunktet er et markedskoncept, et ydeevnemål eller en tilpasning af en gennemprøvet platform. Du godkender designet, før der produceres. OEM (Original Equipment Manufacturing) fremstiller efter din godkendte specifikation — dine tegninger, mål, materialer og emballage. Du ejer designet og de intellektuelle rettigheder. Begge veje løber gennem samme anlæg, QC-system og eksportteam; ODM er den hurtigste vej til et mærket bræt, når du endnu ikke har et design.'
    - q: Jeg har kun en løs ide — hvor starter vi?
      a: 'Send et kort brief: målryttere, anvendelsesformål, omtrentlige mål, markeder og volumen. Vores ingeniører vender tilbage med et koncept, en retning for et referencebræt og en udviklingsplan inden for en arbejdsdag — der underskrives en NDA inden detaljeret udveksling, hvis du ønsker det.'
    - q: Hvor lang tid tager det at udvikle et nyt SUP-bræt?
      a: 'Prototypeprøvebrætter afsendes på 7–12 dage. Et nyt skrog med eget værktøj lægger 15–20 dages konstruktionsarbejde til, før prøvebrætterne. Produktion kører 25–35 dage efter PO og depositum.'
    - q: Hvad er minimumsordrestørrelsen for et ODM-bræt?
      a: 'Standardvolumenproduktion kører 90–100 stk. pr. 150 m rulle drop-stitch; pilotserier starter ved 20–50 stk. på eksisterende platforme. Co-branding i små serier starter ved 5–10 stk. — se vores guide til minimumsordrer og fleksibelt branding for hele beregningen.'
    - q: Hvem ejer designet og formen?
      a: 'Dit brief, dit design og dit værktøj er beskyttet af NDA, vilkår for brandlicens og klausuler om ejerskab eller overtagelse af formen, som skrives ind i kontrakten. Værktøjet opbevares til dit mærke og kan overdrages.'
    - q: Kan I udvikle en bestemt form (touring, fiskeri, racing, yoga)?
      a: 'Ja. Skrogkonstruktionen dækker alle vigtige SUP-kategorier — allround, touring, racing, yoga, fiskeri og flerpersoners brætter — med hydrodynamisk validering i testbassin tilgængelig for ydeevneformer.'
    - q: Hvilke certificeringer vil det udviklede bræt have?
      a: 'ISO 9001:2015 kvalitetsstyring (fabriksdækkende), BSCI social ansvarlighed (amfori-anlægsaudit), CE-overensstemmelsesdokumentation for gældende konfigurationer til EU-markedet (recreational craft directive — omfanget bekræftes pr. projekt), REACH (materialer), RoHS (elektronisk tilbehør) og overholdelse af ISO 25649 for gældende modeller af oppustelige SUP. Certificeringsdokumenter udarbejdes pr. ordre til dine eksportmarkeder.'

process:
  title: 'ODM-processen — fra brief til opskaleret produktion'
  subtitle: 'Seks kontrollerede trin gennemført af det samme team, der designer, bygger prøver og skalerer dit bræt — alt forbliver dokumenteret.'
  steps:
    - phase: '01'
      title: 'Brief & koncept'
      period: 1 arbejdsdag
      items:
        - 'Del målryttere, anvendelsesformål, mål, markeder og volumen — eller blot en ide.'
        - 'Vores ingeniører vender tilbage med en konceptretning, platformmuligheder og en udviklingsplan.'
    - phase: '02'
      title: 'Design af skrog og konstruktion'
      period: Uge 1–2
      items:
        - 'Brættets mål, skrogkarakter, drop-stitchdensitet og PVC-struktur konstrueres i eget hus.'
        - 'Grafik, layout af EVA-dæk og emballagekoncept udvikles omkring dit mærke.'
    - phase: '03'
      title: 'Form & værktøj'
      period: +15–20 dage (nye former)
      items:
        - 'Specialformværktøj designs og skæres til nye skrogformer; eksisterende platforme springer dette trin over.'
        - 'Vilkårene for ejerskab af værktøj fastlægges i kontrakten, før skæringen begynder.'
    - phase: '04'
      title: 'Prototype og prøvebræt'
      period: 7–12 dage
      items:
        - 'En fysisk prototype bygges, testes og sendes til din gennemgang — prøvesejlads er inkluderet.'
        - 'Prøvebrættet (1–2 stk.) validerer form, konstruktion og branding, før volumen.'
    - phase: '05'
      title: 'Validering & godkendelse'
      period: Parallelt
      items:
        - 'Kontrol af luftfastholdelse, trykhold, sømstyrke, belastning og UV pr. produktionslinje.'
        - 'Dokumentation for CE, ISO 9001, BSCI, REACH og RoHS klargøres til dine eksportmarkeder.'
        - 'Du godkender prototypen; PO og depositum låser produktionspladsen.'
    - phase: '06'
      title: 'Produktion & levering'
      period: 25–35 dage
      items:
        - 'Standardbatches kører 90–100+ stk. pr. 150 m rulle, pilotserier fra 20–50 stk.'
        - 'Eksportemballage, FOB/CIF/DDP-afsendelse til 50+ lande og support ved gentbestilling er inkluderet.'

