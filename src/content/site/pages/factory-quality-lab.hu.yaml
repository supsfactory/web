meta:
  title: 'A minőségi laboratórium — vizsgálat és minőségbiztosítás | {SITE}'
  description: 'Független minőségi laboratórium a VATRAD-nél ISO 9001 folyamatokkal: minden darabot szállítás előtt vizsgálunk, hogy garantáljuk a felfújható SUP deszkák minőségét.'
  dateModified: '2026-08-07'
  keywords:
    - 'SUP minőség-ellenőrzés'
    - 'paddle deszka vizsgálólaboratórium'
    - 'ISO 9001 SUP gyár'
    - 'felfújható SUP minősége'
hero:
  tagline: Minőség-ellenőrző laboratórium
  title: Vizsgáló- és minőségbiztosító laboratórium
  subtitle: 'Független minőségi laboratórium ISO 9001 folyamatokkal — minden darabot szállítás előtt vizsgálunk'

answer:
  label: 'Közvetlen válasz'
  text: 'A darabok 100%-át 18.0 PSI nyomáson, 24 órán át nyomáspróbázzuk, 0.50 PSI-nél nagyobb nyomáscsökkenés esetén automatikus elutasítással. A nyers szövetlotokat az ASTM D751 és az ISO 4674 szerint ellenőrizzük, a varratleválasztási próbákat pedig 50 darabonként végezzük el, az ISO 2859 szerinti végső AQL 2.5 mintavétellel.'
  verified: '2026. szeptember'

intro: A VATRAD elkülönített minőség-ellenőrző laboratóriumot működtet, amely a gyártástól függetlenül dolgozik. Minden alapanyaglot és minden befejezett SUP deszkát dokumentált vizsgálati protokollokon megy keresztül az engedélyezés előtt. Minőség-ellenőrző csapatunk közvetlenül a vezetőségnek jelenti, ami pártatlan minőségi döntéseket biztosít.

highlights:
  - value: 100%
    label: Nyomáspróbázott darabok
    detail: Minden légkamra, minden deszka
  - value: 24 h
    label: A légtömörségi próba időtartama
    detail: 18.0 PSI névleges nyomáson
  - value: '&lt;5%'
    label: Megengedett maximális nyomáscsökkenés
    detail: A 24 órás nyomástartási időszakban
  - value: AQL 2.5
    label: A súlyos hibák küszöbértéke
    detail: Az ISO 2859 szerinti mintavételnek megfelelően

test_procedures:
  - title: Alapanyag-vizsgálat
    description: Minden beérkező PVC-, Hypalon-, drop-stitch szövet- és szerelvényszállítmány elfogadás előtt vizsgálatot kap. Ellenőrizzük a szakítási szilárdságot (ASTM D751), a szakadási ellenállást (ISO 4674) és az UV-sugárzással szembeni ellenállást. A nem megfelelő anyagokat karanténba helyezzük és visszaküldjük.
    standards:
      - ASTM D751 (húzás)
      - ISO 4674 (szakadás)
      - ISO 4892 (UV)
  - title: 'Folyamatközi minőségi ellenőrzési pontok'
    description: A gyártói kezelők minden szakaszban önellenőrzést végeznek. A minőség-ellenőrző auditorok a műszak során véletlenszerű mintát vesznek. A varratleválasztási próbákat 50 darabonként végzik el. A méretellenőrzés minden 20. panelen történik.
    standards:
      - ASTM D751 (leválás)
      - Belső 100 pontos ellenőrzőlista
      - ISO 2859 mintavétel
  - title: '48 órás légtömörségi próba'
    description: Minden csőrekeszt 18.0 PSI-re fújunk, és 24 órán át tartjuk. A nyomásérzékelők folyamatosan rögzítenek, hőmérséklet-korrekcióval. Az 0.50 PSI-nél nagyobb csökkenést mutató rekesz automatikusan elindítja a lot újraellenőrzését.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Terhelési és egyensúlyvizsgálat
    description: A befejezett deszkákat a maximális névleges kapacitáson vizsgáljuk, a stabilitás, a szabad villódás és a kezelhetőség szempontjából. Minden deszkát vízi próbának vetünk alá a végső vizsgálat jóváhagyása előtt.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Univerzális vizsgálógép (húzás)
    spec: 5 kN, az ASTM D751 szerint
  - name: Nyomásesés-vizsgáló készülék
    spec: Többcsatornás, 0–50 psi, adatnyilvántartással
  - name: UV-öregítő kamra
    spec: ISO 4892, 1,000 ciklus
  - name: Vastagságmérő stopperóra (digitális)
    spec: 0,01 mm felbontás
  - name: Leválási vizsgáló készülék (hegesztés)
    spec: Motorizált, 50 N kapacitás
  - name: Hőmérsékleti kamra
    spec: -40 °C-tól +100 °C-ig
  - name: Szivárgásérzékelő medence
    spec: 6 m × 2 m, megvilágított

lab_evidence:
  tagline: Vizsgálati jegyzőkönyvdossziék
  title: 'Töltse le a laboratórium valódi vizsgálati jegyzőkönyveit'
  subtitle: 'Ugyanazok a felügyelt kétnyelvű nyilvántartások, amelyeket minőségi csapatunk lezár – struktúra, módszerek, kritériumok és eredmények, a bizalmas mezők eltávolításával. Minden dosszié a hét vizsgálati ellenőrzési pont egyikének felel meg.'
  items:
    - title: 'IQC – Beérkező anyagokról szóló jelentések'
      description: 'A szövet, a PVC-tekercs, a szelepek és az alkatrészek ellenőrzése a jóváhagyott specifikációkkal szemben.'
      icon: tabler:file-certificate
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'IQC jelentések letöltése (PDF)'
    - title: 'IPQC – Folyamat- és elsődarab-jelentések'
      description: 'Az első darab és a folyamatközi vizsgálat nyilvántartásai, a rögzített revízióhoz viszonyítva.'
      icon: tabler:file-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'IPQC jelentések letöltése (PDF)'
    - title: 'Légtömörség – nyomás- és szivárgásnyilvántartások'
      description: 'A varratok menti szivárgásfelismerés a deszkák 100%-ánál, a szelepek épsége és a 24 órás nyomástartás ellenőrzése.'
      icon: tabler:waves
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Tömörségi jelentések letöltése (PDF)'
    - title: 'FQC – A végleges deszkák vizsgálati jegyzőkönyvei'
      description: 'A végső vizsgálat a jóváhagyott mintához képest – méretek, esztétikai megjelenés és az uszonydoboz.'
      icon: tabler:shield-check
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'FQC jelentések letöltése (PDF)'
    - title: 'PSI – Csomagolási és szállítás előtti vizsgálati jelentések'
      description: 'A készlet teljessége, a vonalkódok olvashatósági foka, a dobozjelölések és az ejtésállósági nyilvántartások.'
      icon: tabler:package
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'PSI jelentések letöltése (PDF)'
    - title: 'Szállítási engedélyezési és követhetőségi dosszié'
      description: 'Az engedélyezési engedély és a lot követhetősége, a specifikációkhoz, a grafikához és az anyaglistához rendelve.'
      icon: tabler:history
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Engedélyezési jelentések letöltése (PDF)'
    - title: 'A teljes minőségi dosszié'
      description: 'Egyetlen csomag, amely a teljes dokumentációs rendszert lefedi – QIP, a kapuk nyilvántartásai, követhetőség és a nem megfelelés kezelése.'
      icon: tabler:books
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'A dokumentációs csomag letöltése (PDF)'

