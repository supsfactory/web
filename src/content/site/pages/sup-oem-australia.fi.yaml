why_australia:
  tagline: 'Miksi australialaiset ostajat'
  title: 'Rakennettu Australian markkinalle'
  subtitle: 'Australialaisille brändeille aikataulu ratkaisee: tee tilaukset vuoden alkupuolella, jotta kontit ehtivät selvitykseen ennen kesää.'
  items:
    - title: 'Kausisuunnittelu ensin'
      description: 'Australian kesä kestää joulukuusta helmikuuhun. 25–35 päivän tuotanto plus 4–6 viikon rahti tarkoittaa, että tilaus Q1–Q2:n aikana tuo varaston hyllyillesi ennen huippukautta.'
    - title: 'DDP ennustettavaa lopputoimituskustannusta varten'
      description: 'DDP sisältää tulliselvityksen, tullit, verot ja toimituksen varastoosi — yksi kokonaishinta ovelta ovelle.'
    - title: 'FOB Qingdao omalla huolitsijallasi'
      description: 'Säännöllinen maahantuoja? Ota FOB Qingdao ja käytä omaa logistiikkakumppaniasi — me lastaamme ja dokumentoimme kontin, sinä hallitset loput.'
    - title: 'Yksi tehdas, yksi laatujärjestelmä'
      description: 'Kehittely, näytteenotto, tuotanto ja laadunvalvonta tapahtuvat kaikki 12,500 m² laitoksessa — hyväksymäsi näyte on tuote, jonka saat.'

process_notes:
  tagline: 'Näin se toimii'
  title: 'Määrityksestä konttiin'
  subtitle: 'Samat kuusi vaihetta riippumatta siitä, ostatko kaksi konttia vuodessa vai kaksikymmentä: määritykset, suunnittelu, näytteenotto, testaus, muottityö, tuotanto — sitten FOB-, CIF- tai DDP-toimitus.'
  items:
    - title: '1. Lähetä määrityksesi'
      description: 'Riittää vertailulauta, piirros tai kilpailijan määritys. Suunnittelukatsaus ja tarjous palautetaan yhden arkipäivän kuluessa.'
    - title: '2. Hyväksy näyte'
      description: 'Ensimmäinen fyysinen näyte lähetetään 7–12 päivässä mukana hyväksymislomake, joka kattaa rakenteen, painovärit ja painetestitulokset.'
    - title: '3. Tuotanto ja vienti'
      description: 'Erat valmistuvat 25–35 päivässä prosessin sisäisillä laadunvalvontatarkistuspisteillä. Pakkausluettelo, lasku ja konossaintti lähtevät ennen alusta.'
    - title: '4. Toimitus varastoosi'
      description: '4–6 viikkoa merirahtia Sydneyhin, Melbourneen tai Brisbaneen — DDP-ehdoilla hoidamme selvityksen ja toimituksen ovelle asti.'

faq_section:
  tagline: UKK
  title: 'Australian tuonnin kysymykset'
  questions:
    - q: Kuinka kauan merirahti Australiaan kestää?
      a: 'Varauta 4–6 viikkoa Qingdaon satamasta Sydneyn, Melbourneen tai Brisbaneen laivavuoroaikataulun mukaan. DDP-projekteissa mukana on koko ovelta ovelle -aikataulu.'
    - q: Milloin minun pitää tilata, jotta varasto on valmis ennen kesää?
      a: 'Tuotanto kestää 25–35 päivää ja rahti 4–6 viikkoa, joten tilaa noin 3–4 kuukautta ennen kuin tarvitset varastoa. Joulukuun–helmikuun kesäkaudella tee tilaus vuoden alkupuolella.'
    - q: Lähetättekö DDP:ta Australiaan?
      a: 'Kyllä. DDP sisältää merirahdin, tulliselvityksen, tullit ja verot sekä toimituksen varastoosi — yksi ennustettava kokonaishinta. FOB Qingdao ja CIF ovat myös saatavilla.'
    - q: Mikä on private label -SUP-tuonnin MOQ?
      a: 'MOQ vahvistetaan projektin konfiguraation perusteella: näytekehitys kattaa 1–2 kpl, pilottierät 20–50 kpl olemassa olevilla alustoilla, ja vakiomääräinen tuotanto 90–100+ kpl per malli täydestä 150 m drop-stitch-rullasta.'
    - q: Mitä asiakirjoja toimitatte tuonnin varten?
      a: 'Hyväksytty näyte lähetetään mukana kohdemarkkinoillesi laaditut CE- ja REACH-asiakirjat, ja jokaisen kontin mukana kulkee pakkausluettelo, lasku ja konossaintti.'
    - q: Miten aloitan projektin Australiasta?
      a: 'Lähetä vertailulauta, piirros tai määritys. Suunnittelukatsaus ja tarjous palautetaan yhden arkipäivän kuluessa, ja NDA allekirjoitetaan ennen tiedostojen vaihtoa.'

