what_we_need:
  heading: 'Что подготовить перед отправкой брифа'
  body: |
    Полный бриф ускоряет процесс. Вот что поможет:

    - **Характеристики доски** — Целевые длина, ширина, толщина, вес райдера, сценарий использования. Полезны референсные размеры досок или модели конкурентов.
    - **Дизайн-файлы** — Векторная графика (AI, SVG, PDF) для изображений и логотипов. Если они не готовы, для первоначальной оценки осуществимости подойдут мудборды или референсные изображения.
    - **Объем и сроки** — Целевое количество и сезонный график. Даже примерный диапазон («20–50 досок к марту») достаточно, чтобы начать.
    - **Требования к соответствию** — Целевые рынки и любые конкретные требования по сертификации помимо CE, ISO 9001, BSCI, REACH, RoHS.
    - **Диапазон бюджета** — Ориентировочный бюджет на одну доску или целевая себестоимость с доставкой помогает нам предложить подходящую платформу.

    **Не готовы предоставить все сразу?** Отправьте то, что есть. Остальное мы подскажем.

faqs:
  tagline: FAQ
  title: 'Начало проекта по изготовлению SUP — часто задаваемые вопросы'
  items:
    - q: 'Каков минимальный заказ для старта?'
      a: 'Старт разделен на этапы: сначала 1–2 образца (7–12 дней), затем пробный заказ 20–50 досок (25–35 дней), после чего стандартные серийные тиражи 90–100+ досок на каждую утвержденную конфигурацию. Private Label с совместным брендингом начинается с 5–10 единиц без этапа разработки.'
    - q: 'Сколько времени занимает получение образцов?'
      a: 'Физические образцы изготавливаются за 7–12 дней с момента подтверждения спецификации и внесения задатка. При использовании существующих платформ корпуса полный цикл от брифа до поставки пробного заказа обычно занимает 8–12 недель. Индивидуальный корпус добавляет 15–20 дней на разработку пресс-формы.'
    - q: 'Защищен ли мой дизайн?'
      a: 'Да. NDA доступен сразу — до того, как вы раскроете какую-либо конфиденциальную информацию. Мы производим исключительно под брендами наших клиентов и никогда не конкурируем с ними. Все технические файлы хранятся в системах с контролируемым доступом и журналом аудита.'
    - q: 'Что запрашивает форма брифа проекта?'
      a: 'Бриф запрашивает тип вашей деятельности, название компании, целевые характеристики доски, диапазон количества, сроки и любые требования к соответствию. Заполнение занимает около 5–10 минут. Вы можете приложить дизайн-файлы (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) объемом до 10 MB. Если вы не уверены в каком-либо поле, пропустите его — мы вернемся к нему позже.'
    - q: 'Что происходит после того, как я отправлю бриф?'
      a: 'Вы получите ответ в течение одного рабочего дня. Инженерная команда изучает ваш бриф и возвращает детализированное ценовое предложение с MOQ, стоимостью образцов и графиком по этапам. Никаких обязательств не возникает, пока вы не ознакомитесь с договором и не подпишете его. Стоимость образцов зачитывается в ваш производственный заказ.'

