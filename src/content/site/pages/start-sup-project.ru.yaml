answer:
  label: 'Что будет дальше'
  text: 'После того как вы отправите бриф проекта, вы получите ответ в течение одного рабочего дня. NDA доступен до того, как вы раскроете какие-либо конфиденциальные детали. Инженерная команда изучает ваш бриф и возвращает детализированное ценовое предложение с расчетом MOQ, стоимостью образцов и графиком по этапам — как правило, 7–12 дней на образцы и 6–8 недель на первое производство с момента подтвержденного PO. Стоимость образцов зачитывается в ваш производственный заказ. Никаких обязательств до подписания.'
  verified: 'Сентябрь 2026'

process_steps:
  tagline: 'Процесс'
  title: 'От брифа до поставки досок — пять шагов'
  subtitle: 'У каждого шага есть определенный срок, задокументированный результат и контрольная точка «да/нет». Вы переходите дальше, только когда будете готовы.'
  steps:
    - step: 'Шаг 1'
      title: 'Отправьте бриф проекта'
      desc: 'Расскажите нам о своей доске — целевые характеристики, объем, требования к соответствию и сроки. Заполнение брифа занимает 5–10 минут. Если вы не уверены в каких-то деталях, пришлите то, что уже есть, а остальное мы подскажем. NDA доступен до того, как вы поделитесь конфиденциальными дизайнами.'
    - step: 'Шаг 2'
      title: 'NDA и проверка осуществимости (1–5 дней)'
      desc: 'При необходимости мы подписываем NDA, затем инженерная команда изучает ваш бриф с точки зрения производственных возможностей, наличия материалов и объема требований к соответствию. Вы получаете детализированное ценовое предложение с расчетом MOQ, стоимостью образцов и графиком по этапам.'
    - step: 'Шаг 3'
      title: 'Образец и утверждение (7–21 день)'
      desc: 'Изготавливаются 1–2 физические доски по вашей спецификации. Вы тестируете и оцениваете — жесткость корпуса, точность графики, совместимость аксессуаров. Корректировки фиксируются в пересмотренной спецификации (BOM). Утвержденный образец становится эталоном для производства. Стоимость образцов зачитывается в производственный заказ.'
    - step: 'Шаг 4'
      title: 'Планирование перед производством (7 дней)'
      desc: 'Закупка материалов, подготовка оснастки, подтверждение упаковки и резервирование производственного слота. Все материалы проходят входной контроль на соответствие замороженной BOM. График производства с датами контрольных точек QC выпускается до начала изготовления.'
    - step: 'Шаг 5'
      title: 'Производство, QC и отгрузка (4–6 недель)'
      desc: 'Изготовление проходит через 7-этапную систему контрольных ворот с критериями «прошел/не прошел» на каждом этапе. Упаковка экспортного класса, документация по соответствию и координация морской доставки более чем в 50 стран. Анализ после поставки фиксирует улучшения для следующего заказа.'

