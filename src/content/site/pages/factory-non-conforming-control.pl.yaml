nc_intro:
  tagline: Kontrola produktów niezgodnych
  title: Co się dzieje, gdy produkt nie spełnia kryteriów
  body: |
    Produkty lub komponenty, które nie spełniają zdefiniowanych kryteriów akceptacji, są identyfikowane i poddawane kontroli, aby zapobiec nieprzeznaczonemu użyciu, dalszemu przetwarzaniu lub wysyłce. Obowiązujące kryteria akceptacji opierają się na zatwierdzonej próbce, specyfikacji technicznej, projekcie graficznym, specyfikacji materiałowej, wymaganiach opakowaniowych i planie inspekcji projektu.

    Niezgodne elementy ocenia się w celu ustalenia zakresu skutków i odpowiedniej decyzji. W zależności od problemu element może zostać zatrzymany, naprawiony według kontrolowanych instrukcji, wymieniony, odrzucony albo obsłużony inaczej w zatwierdzonym procesie. Elementy naprawione lub skorygowane sprawdza się ponownie przed zatwierdzeniem. Zatwierdzenie wysyłki jest możliwe dopiero po uzupełnieniu właściwej dokumentacji jakościowej i potwierdzeniu, że produkt spełnia obowiązujące kryteria akceptacji.

nc_flow:
  tagline: Standardowa 7-etapowa pętla zamknięta
  title: Od identyfikacji do działania korygującego
  subtitle: 'Jedna kontrolowana pętla dla każdej niezgodności: identyfikacja, izolacja, przegląd, naprawa lub wymiana, ponowna inspekcja, zatwierdzenie lub odrzucenie, poprawa.'
  steps:
    - step: '01'
      title: Identyfikacja
      desc: 'Każda stwierdzona niezgodność jest rejestrowana dla konkretnego produktu, partii lub komponentu i oceniana względem obowiązujących wymagań projektu. Wykrycie może nastąpić na etapie materiałów przychodzących, kontroli w trakcie procesu, badań końcowych, pakowania albo inspekcji klienta lub podmiotu trzeciego.'
    - step: '02'
      title: Izolacja
      desc: 'Elementy są jednoznacznie oznaczone i objęte kontrolowanym statusem wstrzymania lub izolacji, aby zapobiec nieprzeznaczonemu użyciu, dalszemu przetwarzaniu lub wysyłce. Etykiety HOLD / QUARANTINE / REJECTED zawierają numer NCR, SKU, partię, ilość, opis wady i datę.'
    - step: '03'
      title: Przegląd
      desc: 'Ocenia się zakres skutków i odpowiednią decyzję: pojedyncza sztuka, partia zmianowa, cała partia lub wiele partii — wraz ze wspólnymi partiami materiału, rewizjami projektu graficznego, etapami procesu i rewizjami dokumentów. Tam, gdzie jest to wymagane, stosuje się dodatkowe działania ograniczające lub zaostrza kontrolę.'
    - step: '04'
      title: Naprawa lub wymiana
      desc: 'Dopuszczona naprawa odbywa się według zatwierdzonych instrukcji określających konkretny element, metodę, materiały, punkty kontrolne i wymagania ponownej inspekcji. Niedozwolone są jakiekolwiek zmiany specyfikacji produktu, projektu graficznego, konfiguracji akcesoriów lub opakowania bez zatwierdzenia. Elementy wymienione ponownie przechodzą przez właściwe bramki inspekcji.'
    - step: '05'
      title: Ponowna inspekcja
      desc: 'Elementy naprawione lub skorygowane sprawdza się ponownie względem obowiązujących kryteriów akceptacji. Przed zatwierdzeniem weryfikuje się pierwotną wadliwą cechę oraz wszystkie cechy powiązane, na które naprawa mogła wpłynąć — przez niezależny QC, a dla napraw szczelności powietrznej z pełnym nowym cyklem próby ciśnieniowej 24h.'
    - step: '06'
      title: Zatwierdzenie lub odrzucenie
      desc: 'Produkt jest zatwierdzany dopiero po zakończeniu wymaganej ponownej inspekcji i potwierdzeniu zgodności z obowiązującymi wymaganiami projektu przez upoważniony personel jakości. Elementy, których nie da się doprowadzić do zgodności, są odrzucane, wymieniane, zwracane albo kierowane do utylizacji w kontrolowanych procedurach — w tym do fizycznego zniszczenia w asyście świadków.'
    - step: '07'
      title: Działanie korygujące
      desc: 'Powtarzające się, istotne lub systemowe niezgodności są analizowane pod kątem przyczyny źródłowej i działania korygującego (CAPA). Poprawy mogą obejmować aktualizację instrukcji roboczych, kontroli materiałów, punktów kontrolnych, szkoleń, zarządzania dostawcami lub kontroli dokumentów.'

nc_pillars:
  tagline: Filarzy zaufania kupującego
  title: Trzy kontrole, które chronią Twoją markę
  subtitle: 'Proces jest zaprojektowany wokół pytań, które zadają zagraniczni kupujący: czy problemy będą ukrywane, czy naprawy wymkną się spod kontroli i czy naprawione deski zostaną ponownie zweryfikowane.'
  features:
    - icon: 1
      icon_bg: blue
      title: Wyłącznie instrukcje kontrolowane
      desc: 'Naprawę ściśle regulują zatwierdzone Standardowe Instrukcje Naprawy (SRI). Niedozwolone są jakiekolwiek zmiany na hali bez zatwierdzenia, modyfikacje specyfikacji czy ingerencja w projekt graficzny bez pisemnej autoryzacji.'
    - icon: 2
      icon_bg: green
      title: Niezależna ponowna inspekcja
      desc: 'Naprawione deski przechodzą 100% ponownej inspekcji przez inspektorów QA względem pierwotnych kryteriów akceptacji. Naprawy szczelności powietrznej wymagają całkowicie nowego, pełnego cyklu próby ciśnieniowej 24h — nigdy częściowego sprawdzenia.'
    - icon: 3
      icon_bg: purple
      title: Autoryzowany podpis i identyfikowalność
      desc: 'Zatwierdzenie wysyłki jest możliwe wyłącznie po ukończeniu dokumentacji NCR i autoryzowanym podpisie QC, przy czym status partii zmienia się z HOLD na RELEASED. Systemowe lub powtarzające się odchylenia automatycznie uruchamiają procedury CAPA o przyczynie źródłowej.'

