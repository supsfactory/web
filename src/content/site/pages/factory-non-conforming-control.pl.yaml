answer:
  label: 'Wprost'
  text: 'Produkty niezgodne nigdy nie są ukrywane, naprawiane nieformalnie ani zatwierdzane bez weryfikacji w QINGDAO VATRAD GROUP.,LTD. Każda stwierdzona niezgodność jest rejestrowana dla konkretnego produktu, partii lub komponentu i powiązana z NCR. Element otrzymuje etykietę (HOLD / QUARANTINE / REJECTED), jest fizycznie odseparowany, a zakres skutków ocenia się według partii, partii materiału, etapu procesu i rewizji dokumentu. Decyzję podejmuje się na szczeblu uprawnień odpowiadającym wadze wady: drobne sprawy podpisuje kierownik zmiany QC, poważne wymagają decyzji kierownika QC i inżyniera technicznego wraz z kontrolowaną instrukcją naprawy i 100% niezależną ponowną inspekcją, a krytyczne — decyzji Material Review Board, czyli zespołu ds. oceny materiałowej, z pisemnym uzgodnieniem z klientem, jeśli jest wymagane — w przeciwnym razie obowiązuje niszczenie w asyście świadków. Naprawione elementy sprawdza się ponownie względem pierwotnych kryteriów akceptacji, naprawy szczelności powietrznej przechodzą całkowity nowy cykl próby ciśnieniowej, a zatwierdzenie wysyłki następuje dopiero po autoryzowanym podpisie jakości. Powtarzające się lub systemowe problemy uruchamiają działanie korygujące o przyczynie (CAPA).'
  verified: 'Wrzesień 2026'

