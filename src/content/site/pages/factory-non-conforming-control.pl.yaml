faqs:
  tagline: FAQ
  title: Pytania o jakość i kontrolę wad dla kupujących na całym świecie
  items:
    - q: 'Jak gwarantujecie, że naprawione deski spełniają pełne normy bezpieczeństwa?'
      a: 'Każdą naprawioną deskę traktujemy jak nową sztukę i musi ona przejść dokładnie ten sam pełny cykl badań od zera — w przypadku napraw szczelności powietrznej całkowitą próbę ciśnieniową 24h. Walidację do zatwierdzenia wykonują niezależni inspektorzy QC, a nie operatorzy wykonujący naprawę.'
    - q: 'Czy fabryka wyśle deski z drobnymi odchyleniami wizualnymi, nie informując nas?'
      a: 'Nigdy. Każde odchylenie wpływające na zatwierdzone próbki wzorcowe, projekt logo, warianty kolorystyczne lub opakowanie wymaga formalnego pisemnego Porozumienia o Odstępstwie podpisanego przez klienta przed zatwierdzeniem wysyłki.'
    - q: 'Co się stanie, jeśli naprawiona deska nie zda ponownej inspekcji?'
      a: 'Deska nie zostaje zatwierdzona. Wraca do kolejnego przeglądu decyzji, a jeśli nie da się jej doprowadzić do zgodności, zostaje wymieniona, odrzucona albo zniszczona zgodnie z protokołem utylizacji w asyście świadków. Powtarzające się awarie tej samej klasy wad uruchamiają CAPA o przyczynie źródłowej.'
    - q: 'Czy wadliwe deski można sprzedawać jako sztuki drugiej jakości lub innymi kanałami?'
      a: 'Nie. Niezgodne deski, których nie da się naprawić, są fizycznie niszczone zgodnie z protokołem utylizacji w asyście świadków — osprzęt wycinany, rdzeń i listwy przecinane, wideo rejestrowane z hashem SHA-256 i archiwizowane przez co najmniej 5 lat. Świadectwo Utylizacji i Zniszczenia podpisują Dyrektor QA i Kierownik Zakładu.'
    - q: 'Jak ocenia się zakres skutków, gdy stwierdzono wadę?'
      a: 'Zakres przegląda się według identyfikacji produktu, partii produkcyjnej, partii materiału lub komponentu, etapu procesu i obowiązującej rewizji dokumentu. Jeśli zaangażowana jest ta sama partia materiału, rewizja projektu graficznego lub stanowisko pracy, produkty objęte skutkami są izolowane i odpowiednio sprawdzane.'
    - q: 'Czy potrzebujecie naszej zgody przed udzieleniem odstępstwa?'
      a: 'Tak. Każde przyjęcie na podstawie udokumentowanego odstępstwa, które wpływa na wymagania klienta — zatwierdzone próbki, specyfikację, projekt graficzny, opakowanie lub kryteria akceptacji — wymaga pisemnej zgody klienta przed zatwierdzeniem. Bez niej produkt jest naprawiany zgodnie z pierwotnym wymaganiem, wymieniany albo odrzucany.'
    - q: 'Jaką dokumentację otrzymujemy w przypadku niezgodności?'
      a: 'Zapis NCR obejmuje numer NCR, etap wykrycia, produkt/SKU, partię, obowiązujące rewizje dokumentów, opis wady, działania ograniczające, decyzję, odniesienie do instrukcji naprawy, wynik ponownej inspekcji oraz zatwierdzenie wypuszczenia lub zamknięcia — udostępniany zgodnie z Twoją umową jakościową projektu.'

