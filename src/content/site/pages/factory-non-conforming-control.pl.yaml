nc_severity:
  tagline: Waga wady i uprawnienia
  title: Klasyfikacja wagi wady i uprawnienia do decyzji
  subtitle: Nie każda niezgodność jest obsługiwana na tym samym szczeblu — uprawnienia do decyzji rosną wraz z wagą wady, od podpisu na poziomie zmiany po Material Review Board i uzgodnienie z klientem.
  headers:
    severity: Waga wady
    examples: Typowe przykłady
    authority: Uprawnienia do decyzji i kontrola
    control: Warunek zatwierdzenia
  rows:
    - severity: 'Drobna'
      examples: 'Zagięty róg kartonu, niewielkie przesunięcie akcesorium niewymagającego krytyczności'
      authority: 'Podpis na miejscu przez kierownika sekcji QC i przełożonego zmiany: wymiana lub zatwierdzenie'
      control: 'Zapisane w NCR; brak wpływu na działanie produktu ani wymagania klienta'
    - severity: 'Poważna'
      examples: 'Powolne przeciekanie przez zawór, przesunięcie EVA poza tolerancję (>2 mm), brak akcesorium'
      authority: 'Kierownik QC i inżynier techniczny wydają kontrolowaną instrukcję naprawy (SRI)'
      control: '100% niezależne badanie pierwotnie wadliwych i naruszonych cech przed zatwierdzeniem'
    - severity: 'Krytyczna'
      examples: 'Uszkodzenie komory drop-stitch, pęcherz lub pęknięcie listwy krawędziowej pod wysokim ciśnieniem, błędny nadruk logo klienta lub odchylenie koloru'
      authority: 'Decyzja Material Review Board (MRB); pisemne uzgodnienie z klientem, jeśli wymagane'
      control: 'Bez zatwierdzenia nie ma uzgodnienia; w przeciwnym razie obowiązkowe fizyczne zniszczenie w asyście świadków'

nc_matrix:
  tagline: Macierz protokołów inżynierskich
  title: Macierz decyzji i ponownej inspekcji dla wad desek SUP
  subtitle: Standardowe protokoły inżynierskie stosowane do najczęstszych odchyleń produkcyjnych — te same, ilościowo ujęte parametry, które klienci mogą zweryfikować podczas audytu.
  headers:
    defect: Kategoria wady
    protocol: Kontrolowany protokół decyzji
    validation: Niezależna ponowna inspekcja i walidacja
  rows:
    - defect: 'Powolne przeciekanie przez zawór'
      protocol: 'Odizoluj deskę. Zdejmij wkład zaworu skalibrowanym kluczem dynamometrycznym (25 N·m), wyczyść gwint wewnętrzny, wymień silikonową O-ring i dokręć ponownie.'
      validation: 'Zanurz w roztworze mydlanym; napompuj ponownie do 18 PSI i wykonaj pełną próbę spadku ciśnienia 24h (ΔP ≤ 0.05 PSI).'
    - defect: 'Pęcherze powietrzne przy szwie listwy'
      protocol: 'ZIzoluj partię zmianową. Rozdziel strefę pęcherzy dyszą z podgrzewaniem, wyczyść powierzchnię rozpuszczalnikiem, nałóż dwuskładnikowy klej PU pod ciśnieniem 5 bar.'
      validation: '100% inspekcja wizualna i dotykowa szwów; próba ciśnieniowa wytrzymałości strukturalnej (18.0 PSI) oraz utrzymanie szczelności powietrznej 24h.'
    - defect: 'Przesunięcie pokładu EVA'
      protocol: 'Odklej z podgrzewaniem narzędziem z regulacją temperatury (80°C). Ustaw precyzyjnie, używając akrylowego przyrządu pozycjonującego.'
      validation: 'Weryfikacja tolerancji luzów (≤ ±1.5 mm), kontrola symetrii wzoru rombowego, 100% badanie przyczepności krawędzi.'
    - defect: 'Literówka w brandingu lub logo'
      protocol: 'Natychmiastowe zatrzymanie linii druku. Wstrzymaj wszystkie zadrukowane elementy. Zweryfikuj rewizję pliku wektorowego z klientem; żadnych zmian bez zatwierdzenia.'
      validation: 'Kontrola koloru spektrofotometrem (ΔE ≤ 1.5); 100% wizualna kontrola wyrównania tekstu względem wzorcowego PDF podpisanego przez klienta.'
    - defect: 'Niezgodność opakowania / brak SKU'
      protocol: 'ZIzoluj paletę eksportową. Rozpakuj i wykonaj 100% kontrolę zawartości według BOM (pompka, płetwa, smycz, wiosło, łata naprawcza).'
      validation: 'Kontrola walidacji dynamicznego wagi elektronicznej w linii (odchyłka ±30 g); weryfikacja optycznym czytnikiem kodów kreskowych 2D.'

nc_scrap:
  tagline: Zero przecieków na rynek
  title: Utylizacja i niszczenie w asyście świadków — protokół antydiversji bez wad
  body: |
    Zagraniczni partnerzy marki potrzebują pewności, że wadliwe deski nigdy nie trafią do sprzedaży wtórnej, na rynku szarym ani do kanałów e-commerce. Deski, których nie da się doprowadzić do zgodności, są niszczone według protokołu z rejestrem i w asyście świadków:

    **1. Wycinanie osprzętu i akcesoriów.** Pod nadzorem Dyrektora QA tłoczk hydrauliczny usuwa wszystkie D-ringi ze stali nierdzewnej 316, taśmy uchwytów nośnych i klamry bagażowe. Zespół zaworu i podstawa gniazda płetwy (US-Box / płetwa snap-in) są wycinane u nasady deski, co eliminuje wszystkie elementy możliwe do odzyskania.

    **2. Nacinanie rdzenia drop-stitch i cięcie listew.** Wewnętrzny rdzeń drop-stitch jest przecinany w poprzek deski i pokładu głębokimi nacięciami krzyżowymi (≥ 50 cm na cięcie), a wzmocnione listwy boczne są przecinane w co najmniej 4 segmentach — trwale niszcząc szczelność i wyporność.

    **3. Magazyn wideo i zdjęć.** Niszczenie jest rejestrowane jako nieprzycinane wideo 1080p z zbliżeniami na kod kreskowy z numerem seryjnym, proces wycinania, nacinanie rdzenia i końcowy zważony stos odpadów. Wideo jest hashowane (SHA-256) i archiwizowane na kontrolowanym serwerze przez ≥ 5 lat.

    **4. Certyfikowane utylizowanie odpadów.** Wszystkie fragmenty PCV i drop-stitch są ważone, wpisywane do rejestru wyjściowego i transportowane wyłącznie przez kwalifikowanych partnerów recyklingujących tworzywa sztuczne — żaden odpad nie opuszcza zakładu inną drogą.

    > **Gwarancja ochrony marki:** QINGDAO VATRAD GROUP CO., LTD. gwarantuje 100% zniszczenie jednostek pływających niezgodnych ze specyfikacją, których nie da się naprawić. Żadne sztuki drugiej jakości ani deski z wadą kompromitującą nigdy nie trafią do sprzedaży wtórnej, na rynek szary ani do kanałów e-commerce. Świadectwo Utylizacji i Zniszczenia (VAT-QA-SCRAP-CERT-2026) odnotowuje produkt, partię, wniosek MRB, zdjęcia z asystą świadków oraz podpisy Dyrektora QA i Kierownika Zakładu.

