key_factors:
  heading: 'Klíčové faktory vedle typu konstrukce'
  body: |
    Typ konstrukce je pouze jednou z proměnných parametrů desky. Další tři faktory mají stejnou nebo větší váhu:

    - **Hustota drop stitch** — Počet vláken na palec určuje, jak rovnoměrně deska drží tvar pod tlakem. Používáme standard 96 vláken na palec a 140 vláken na palec pro výkonné sestavy. Vyšší hustota = rovnější deska = lepší klouzání.
    - **Druh a tloušťka PVC** — Ne každé PVC je stejné. Do Koreje importované PVC o tloušťce 0,7 mm má vyšší pevnost v tahu a odolnost vůči UV záření než tenčí alternativy. Druh materiálu stanovujeme pro každý projekt.
    - **Konstrukce boků** — Jednovrstvé boky jsou nejčastějším místem poruchy u levných desek. Dvojvrstvé boky a zesílený boční pás výrazně snižují riziko propíchnutí boku. Všechny naše desky používají zesílené boky bez ohledu na konstrukční segment.

faqs:
  tagline: FAQ
  title: 'Konstrukce SUP — časté dotazy'
  items:
    - q: 'Jaký typ konstrukce zvolit pro moji značku?'
      a: 'Záleží na Vašem cílovém trhu a cenovém pozicionování. Začáteční úroveň a velký maloobchod: jednovrstvé. Půjčovny, kluby a značky střední třídy: dvojvrstvé. Vysoké parametry, pádlování na dlouhé vzdálenosti a prémiová třída: jádro drop stitch. Většina značek začíná dvojvrstvou konstrukcí jako nejlepším kompromisem mezi cenou, životností a zážitkem z pádlování. Variantu doporučíme podle Vašeho konkrétního trhu při prověření proveditelnosti.'
    - q: 'Mohu nabízet několik konstrukčních segmentů pod jednou značkou?'
      a: 'Ano — mnoho značek nabízí dva, nebo tři segmenty. Všechny tři konstrukce vyrábíme na jedné lince se stejnými kontrolními branami QC, takže v rámci jedné objednávky můžete kombinovat typy konstrukce. Tvar trupu a grafika mohou být ve všech segmentech stejné; liší se pouze konstrukce a materiály.'
    - q: 'Jaký je standard tlakové zkoušky pro všechny konstrukce?'
      a: 'Každá deska bez ohledu na typ konstrukce projde zkouškou udržením tlaku 18,0 PSI s automatickým vyřazením při poklesu tlaku více než o 0,50 PSI za 24 hodin. Jednovrstvé desky jsou dimenzované na pádlovací tlak 12–15 PSI, dvojvrstvé na 15–18 PSI a desky s jádrem drop stitch na 18–25 PSI. Zkušební tlak převyšuje jmenovitý tlak u všech typů.'
    - q: 'Jak konstrukce ovlivňuje reklamace?'
      a: 'Jednovrstvé desky mají při komerčním použití a v půjčovnách o něco vyšší podíl reklamací kvůli namáhání boků a riziku propíchnutí. Dvojvrstvé konstrukce a konstrukce s jádrem drop stitch mají výrazně nižší podíl reklamací. Údaje o záruce v členění podle segmentů poskytujeme z naší výrobní evidence při žádosti o nabídku.'

