hero:
  tagline: 'Průvodce konstrukcí'
  title: 'Porovnání konstrukcí SUP'
  subtitle: 'Tři typy konstrukce, jedna výrobní linka. Pochopte kompromisy mezi tuhostí, hmotností, životností a cenou u jednovrstvého PVC, dvojvrstvého PVC a desek s jádrem drop stitch — a zjistěte, která konstrukce odpovídá Vašemu cílovému jezdci a pozicionování na trhu.'

answer:
  label: 'Stručné porovnání'
  text: 'Jednovrstvé PVC je nejlehčí a nejdostupnější: ideální pro méně časté jezdce a trhy citlivé na cenu. Dvojvrstvé PVC přidává druhou vrstvu PVC pro tuhost a životnost při mírné hmotnosti — oborový standard pro půjčovny a značky střední třídy. Jádro drop stitch v obalu z PVC poskytuje maximální tuhost a odolnost vůči tlaku — přednostně pro vysoké parametry, surfing a těžší jezdce. Všechny tři konstrukce vyrábíme na jedné lince se stejnými kontrolními branami QC; rozdíl je v materiálech a fázích laminace.'
  verified: 'září 2026'

