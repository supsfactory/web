  text: 'Drop-stitch er et stof, hvor søjler af polyestertråd holder de øverste og nederste PVC-lag en fast afstand fra hinanden, så lufttrykket gør brættet stift. Vatrad-kerner: 1,680 DTEX, 2 tråde pr. kvadrattomme, 1.2 mm PVC-ydre laminat, dimensioneret til 15 PSI og valideret med en 24-timers holdprøvning ved 18.0 PSI.'
