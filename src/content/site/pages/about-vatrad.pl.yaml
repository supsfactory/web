intro: |
  <p><strong>Vatrad</strong> to morski dział produkcji w strukturze <strong>Qingdao Vatrad Group Co., Ltd.</strong>, zlokalizowany w Strefie Rozwoju Gospodarczego w Laixi, w Qingdao, w prowincji Shandong, w Chinach. Założona w 2012 roku firma zaczynała jako wyspecjalizowana stocznia związana z rzemiosłem morskim, a dziś jest certyfikowaną fabryką obsługującą klientów OEM i ODM w ponad 50 krajach.</p>
  <p>iSupfactory to dział rozwoju produktów na zamówienie (B2B) fabryki Vatrad. Każdy projekt iSupfactory — od pierwszej próbki lub małej współmarkowanej serii po pełną linię produktową private label — powstaje w tym samym zakładzie, w tych samych zespołach i w tym samym systemie jakości, które opisano tutaj.</p>
  <p>Fabryka zajmuje 12,500 m² i obejmuje wydzielone oddziały cięcia PVC, składania rdzenia drop-stitch, zgrzewania wysokoczęstotliwościowego, montażu desek oraz strefę badawczą do prób szczelności powietrznej, utrzymania ciśnienia i wytrzymałości szwów. Zdolność produkcyjna przekracza 120,000 nadmuchiwanych sztuk rocznie, a zakład działa w oparciu o system zarządzania jakością ISO 9001, zgodność z CE, BSCI i REACH oraz dopuszczenie USCG dla produktów eksportowanych.</p>
  <p>Ponad 350 wykwalifikowanych pracowników i ponad 14 inżynierów R&amp;D wspierają dwa obszary pracy, które mają znaczenie dla marek SUP: inżynieria (projekt kadłuba, dobór materiałów, prototypowanie) i produkcja (nakładanie grafiki, montaż, inspekcja, pakowanie eksportowe). Dział R&amp;D z własnym laboratorium tkanin PCV i basenem próbowym opracowuje niestandardowe formy i weryfikuje konstrukcję przed rozpoczęciem produkcji seryjnej.</p>
