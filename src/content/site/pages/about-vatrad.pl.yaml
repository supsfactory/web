values_section:
  title: Jak fabryka współpracuje z markami
  subtitle: 'Trzy zasady, które kształtują każdy projekt realizowany przez fabrykę Vatrad.'
  columns: 3
  items:
    - title: Inżynieria przed produkcją
      description: 'Każdy projekt zaczyna się od wymagań, rysunków i fizycznej próbki — kształt kadłuba, klasa drop-stitch, rozmieszczenie grafiki i opakowanie są weryfikowane przed jakąkolwiek serią produkcyjną, a nie odkrywane na linii.'
      icon: 'tabler:settings'
    - title: Jeden zespół, jeden zakład
      description: 'Projektowanie, cięcie, zgrzewanie, montaż i badania odbywają się w jednym zakładzie o powierzchni 12,500 m². Bez przekazywania przez pośrednika handlowego: osoby, które odpowiadają na Twoje pytania, to osoby, które budują Twoje deski.'
      icon: 'tabler:building-factory-2'
    - title: Małe pierwsze serie
      description: 'Współmarkowanie w małej serii startuje od 5–10 sztuk, a standardowa produkcja seryjna to 90–100+ sztuk na partię (jedna rolka drop-stitch 150 m), więc marki weryfikują rynek przed skalowaniem — z zachowaniem narzędzi i wzorów na powtórne zamówienia.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Co dostarcza fabryka
  subtitle: 'Usługi produkcyjne dostępne dla klientów iSupfactory.'
  columns: 2
  items:
    - title: Rozwój desek SUP na zamówienie
      description: 'Analiza wymagań, specyfikacja, dobór materiałów, grafika, prototypowanie, akceptacja próbki i produkcja niestandardowych produktów nadmuchiwanych desek SUP.'
      icon: 'tabler:bulb'
    - title: Produkcja private label
      description: 'Twoje logo, kolory i opakowanie na sprawdzonych platformach klasy komercyjnej — deska, pokład, akcesoria i kartony są zawsze z Twoją identyfikacją, bez oznaczeń fabryki.'
      icon: 'tabler:tag'
    - title: Produkcja OEM / ODM
      description: 'Pełna produkcja nadmuchiwanych desek SUP w modelu OEM i ODM na podstawie rysunków klienta lub projektów opracowanych wspólnie, w tym niestandardowe formy dla nowych kształtów desek.'
      icon: 'tabler:package'
    - title: Zaopatrzenie flot
      description: 'Markowane floty desek dla ośrodków wypoczynkowych, klubów, szkół i wypożyczalni, z dopasowanymi akcesoriami i serią produkcyjną przygotowaną pod flotę.'
      icon: 'tabler:users-group'
certifications_section:
  title: Certyfikacja i zgodność
  subtitle: 'Fabryka dostarcza produkty do UE, USA i regionu Azji i Pacyfiku w ramach udokumentowanego systemu zgodności.'
  columns: 2
  items:
    - title: Certyfikacja CE
      description: 'Linie nadmuchiwanych desek SUP i łodzi są zgodne z unijnymi dyrektywami bezpieczeństwa, a dokumentacja jest dostępna dla każdego rynku.'
      icon: 'tabler:certificate'
    - title: System jakości ISO 9001
      description: 'Zakład produkcyjny działa w oparciu o system zarządzania jakością ISO 9001 obejmujący kontrolę materiałów przychodzących, kontrolę w trakcie procesu i inspekcję końcową.'
      icon: 'tabler:badge-check'
    - title: Zgodność społeczna BSCI
      description: 'Odpowiedzialność społeczna audytowana wg BSCI, obejmująca warunki pracy i zgodność fabryki.'
      icon: 'tabler:shield-check'
    - title: Zgodność materiałowa REACH
      description: 'Materiały spełniają wymagania unijnego rozporządzenia REACH w zakresie bezpieczeństwa chemicznego.'
      icon: 'tabler:flask'
    - title: Dopuszczenie USCG
      description: 'Produkcja nadmuchiwanych łodzi z dopuszczeniem US Coast Guard dla linii produktowych nadmuchiwanych jednostek wodnych.'
      icon: 'tabler:anchor'
    - title: Badania produktowe
      description: 'Próby wyporności, nośności, wytrzymałości szwów, odporności na UV, odporności na ścieranie i utrzymania ciśnienia na każdej linii produkcyjnej.'
      icon: 'tabler:test-pipe'
cta:
  title: 'Zbuduj swój projekt SUP razem z fabryką Vatrad'
  subtitle: 'Wyślij wymagania — typ deski, rozmiar, ilość i grafikę — a otrzymasz szczegółową ofertę w ciągu jednego dnia roboczego.'
  actions:
