how_to_choose:
  title: 'Sådan vælger du den rette størrelse'
  cards:
    - title: 'SUP-brætter'
      description: 'Vælg længde efter din vægt og den tilsigtede anvendelse. Bredere brætter (32"+) giver mere stabilitet. Længere brætter (11-12 ft) sporer bedre til touring. Tungere paddlere skal bruge brætter med større volumen.'
    - title: 'Touring-SUP'
      description: 'Længere brætter (11–12 ft) er bedst til at dække distancer og touring. Bredere brætter (32"+) giver mere stabilitet. Kontroller vægtkapaciteten for den samlede last inklusive udstyr.'
    - title: 'Allround-SUP'
      description: 'Vælg længde efter rytterens vægt og den tilsigtede anvendelse. Allround-brætter passer til fritid, fitness og yoga. Mindre brætter er mere manøvredygtige.'

