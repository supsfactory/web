faqs:
  tagline: FAQ distributeur
  title: 'Programme de distribution en gros — Questions fréquentes'
  items:
    - q: 'Quelle est la commande de gros minimale pour un nouveau distributeur ?'
      a: 'Les nouveaux partenaires de distribution ouvrent généralement avec une commande d''échantillons suivie d''un premier conteneur planifié selon leur saison. Les minimums exacts dépendent de la taille du territoire et de la gamme choisie ; votre responsable de compte confirme le volume d''ouverture lors de la sélection du catalogue.'
    - q: 'Les territoires sont-ils exclusifs ?'
      a: 'Oui. Le programme de distribution Afarer repose sur des territoires exclusifs — chaque partenaire de gros couvre un pays ou une région défini et reçoit les prix et le support de programme pour ce marché.'
    - q: 'Proposez-vous le drop-shipping ?'
      a: 'La capacité de drop-ship est incluse dans le programme distributeur. Les échantillons, l''emballage produit et la manutention sont validés lors de l''étape de commande d''échantillons afin que les commandes drop-ship fonctionnent parfaitement dès le premier jour.'
    - q: 'Quels produits les distributeurs peuvent-ils commander ?'
      a: 'Le catalogue complet Afarer : planches SUP gonflables toutes catégories (tout-terrain, touring, surf), kayaks gonflables, pompes, pagaies, gilets et accessoires d''entretien. La plupart des partenaires ouvrent avec 4–8 SKU les plus vendus et étendent les saisons suivantes.'
    - q: 'Comment les commandes sont-elles expédiées ?'
      a: 'Les commandes quittent notre usine sur des départs programmés, avec commande anticipée disponible pour stabiliser les coûts de fret. Votre responsable de compte dédié planifie la production et l''expédition autour de votre prévision et du calendrier saisonnier.'
    - q: 'Comment postuler ?'
      a: 'Utilisez le formulaire de candidature de cette page ou contactez-nous directement. Les candidatures sont examinées par l''équipe distribution, et nous répondons avec les prochaines étapes, incluant la cartographie du territoire et un projet d''accord, sous quelques jours ouvrables.'

