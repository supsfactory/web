answer:
  label: 'Réponse directe'
  text: 'Conditions de distribution en gros : territoire exclusif, 3–8 SKU par programme, paiement à 45–60 jours, et 100 % du stock testé en pression à l''usine avant expédition. Les distributeurs achètent au prix de gros direct usine avec un responsable de compte dédié ; la commande d''ouverture minimale et les conditions de fret sont convenues par territoire, expédiées FOB Qingdao ou CIF.'
  verified: '2026-08'

intro:
  tagline: À propos du programme
  title: 'Distribution en gros de SUP, bâtie autour d''un partenariat long terme'
  body: |
    Afarer planifie, construit et contrôle qualité chaque SUP gonflable, kayak et accessoire dans sa propre usine — donc un accord de distribution en gros avec nous inclut la source d''approvisionnement intégrée. Les distributeurs ne revendent pas une gamme tierce éloignée : ils reçoivent le catalogue complet de produits Afarer, les prix direct usine et un responsable de compte dédié qui planifie le réapprovisionnement saisonnier autour de leurs ventes.

    La plupart de nos partenaires de distribution opèrent sur un territoire exclusif et portent une gamme concentrée de 4–8 modèles les plus vendus — planches tout-terrain en trois tailles, un modèle touring, et la pompe, la pagaie et les accessoires d''entretien assortis. Parce que nous contrôlons toute la ligne de production, nous pouvons planifier de grands runs pour le début de saison de l''hémisphère nord, stabiliser les coûts de fret par des commandes anticipées, et libérer du fonds de roulement avec des conditions de gros transparentes et des échéanciers de paiement convenus.

    Le programme de distribution est l''une des deux façons d''acheter les produits Afarer en gros. Si vous exploitez déjà un canal de gros, cette page est pour vous. Les marques, stations, écoles de formation et flottes de location achetant en direct pour leur propre usage doivent plutôt consulter les programmes OEM/ODM et flottes.

