answer:
  label: 'Kort svar'
  text: 'En typisk OEM-onboarding tar 2–4 uker til prøvegodkjenning og 6–8 uker for den første produksjonssyklusen, regnet fra ordrebekreftelsen. Du begynner med en prosjektbriefing (brettspesifikasjoner, antall, samsvarskrav). Vi svarer innen én arbeidsdag, tilbyr en NDA før utveksling av egne data og produserer 1–2 fysiske prøver på 7–12 dager til din vurdering og godkjenning. Når prøven er frossen, følger produksjonsplanleggingen og produksjonen med faste QC-porter i hver fase. Hvert trinn er dokumentert og sporbart.'
  verified: 'September 2026'

process_steps:
  tagline: 'De sju portene'
  title: 'Onboardingforløp — sju porter fra briefing til levering'
  subtitle: 'Hver port har en definert input, en definert output og en på forhånd avtalt gjennomgangstid. Du passerer ingen port uten uttrykkelig godkjenning.'
  steps:
    - step: 'Port 1'
      title: 'Første forespørsel og NDA (dag 0)'
      desc: 'Send via /contact en prosjektbriefing med målbrettspesifikasjonene dine, bestillingsantallet, samsvarskravene og tidsplanen. En NDA er umiddelbart tilgjengelig — før deling av egne tekniske spesifikasjoner eller artwork. Svar innen én arbeidsdag.'
    - step: 'Port 2'
      title: 'Gjennomførbarhetskontroll og tilbud (dag 1–5)'
      desc: 'Konstruksjonsavdelingen kontrollerer briefingen din med hensyn til produksjonskapasitet, materialtilgjengelighet og samsvarsomfang. Du får et tilbudsforslag post for post med MOQ-beregning, prøvekostnader (som trekkes fra produksjonen) og en spesifikasjon av gjennomgangstider — ingen grove intervaller, men en planlegging port for port.'
    - step: 'Port 3'
      title: 'Prøveproduksjon (dag 6–17)'
      desc: '1–2 fysiske brett i henhold til spesifikasjonen din: skrogets stivhet, det sklisikre EVA-deckpadets vedheft, grafikkens trofasthet, tilbehørets passform. Du tester og vurderer brettet før du binder deg til noe endelig. Prøvekostnadene trekkes fra produksjonsbestillingen ved signert kontrakt.'
    - step: 'Port 4'
      title: 'Prøvegjennomgang og godkjenning (dag 18–21)'
      desc: 'Du vurderer prøven mot spesifikasjonen din — følelsen, grafikkens trofasthet, emballasje, tilbehør. Endringer tas inn i en revidert BOM og en godkjenning av artwork. Den frosne spesifikasjonen blir produksjonsreferansen for alle etterfølgende sykluser.'
    - step: 'Port 5'
      title: 'Planlegging før produksjon (dag 22–28)'
      desc: 'Materialinnkjøp, installasjon av formverktøy, bekreftelse av emballasjen og reservasjon av produksjonsplassen. Alle materialer kontrolleres ved mottak mot den frosne BOM-en. Før produksjonsstart utstedes en produksjonsplan med datoene for QC-portene.'
    - step: 'Port 6'
      title: 'Produksjon og QC-porter (dag 29–55)'
      desc: 'Produksjonen går gjennom systemet med 7 inspeksjonsporter: varemottakskontroll, kontroll av drop-stitch-stoffet, sveising og montering, trykk- og lufttetthetstest (24 timers holding ved 18.0 PSI, automatisk kassering over 0.50 PSI), montering av EVA-deckpad og tilbehør, grafikk- og merke-QC, sluttemballasje og dokumentasjon. Hver port har godkjent/underkjent-kriterier og sporbarhetsprotokoll.'
    - step: 'Port 7'
      title: 'Levering og oppfølging (dag 56–63)'
      desc: 'Eksportklare emballasje, samsvarsdokumentasjon (CE, ISO 9001, BSCI, REACH, RoHS) og koordinering av sjøfrakt til over 50 land. En oppfølging etter levering henter inn lærdom og forbedringer til neste ordresyklus.'

