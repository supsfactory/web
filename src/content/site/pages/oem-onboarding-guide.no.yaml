checklist:
  heading: 'Hva du bør forberede før prosjektbriefingen'
  body: |
    Jo mer komplett briefingen din er, desto raskere og mer presist blir tilbudet. Slik forbereder du deg:

    - **Brettspesifikasjoner** — mållengde, bredde og tykkelse, brukerens vektintervall og tiltenkt bruk (touring, allround, surf, fiske, yoga osv.). Har du referansemål eller en modell fra en konkurrent, legg dem ved.
    - **Designfiler** — vektorgrafikk (AI, SVG eller PDF) for brettgrafikken, logoen på EVA-deckpadene og den sekundære merkesettingen. Er grafikken ikke klar, holder et moodboard eller referansebilder for den første gjennomførbarhetskontrollen.
    - **Antall og planlegging** — din målmengde for den første bestillingen og sesongplanen du må holde. Selv et grovt intervall (f.eks. «20–50 brett før mars») hjelper oss med å bekrefte gjennomførbarheten og tilgangen til produksjonsplasser.
    - **Samsvarskrav** — målmarkeder (EU, Nord-Amerika, Australia osv.) og eventuelle sertifiserings- eller testkrav utover standardene våre (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Budsjett** — et veiledende budsjett per brett eller en målverdi på stedet hjelper oss med å anbefale riktig plattform og nivå. Eksakt pris bekreftes først etter den tekniske gjennomgangen — aldri tidligere.

    Har du ikke alt, send det du har. Vi veileder deg gjennom resten.

evidence_review:
  tagline: 'Bevis og verifisering'
  title: 'KONTROLLERTE SPESIFIKASJONER'
  body: 'Alle produksjonspåstander på denne siden er verifisert av Manufacturing Engineering-teamet vårt i fabrikken i Laixi, Qingdao. Sertifikater, QC-inspeksjonsprotokoller, trykk- og strukturtester og registre over partisporbarhet er tilgjengelige på forespørsel. Spesifikasjonene ble sist verifisert i september 2026.'

faqs:
  tagline: FAQ
  title: 'OEM-onboarding — vanlige spørsmål'
  items:
    - q: 'Hvor lang tid tar hele onboardingprosessen?'
      a: 'Prøvegodkjenningen tar normalt 2–4 uker (inkludert prøveproduksjon på 7–12 dager og din gjennomgangs fase). Den første produksjonssyklusen tar 6–8 uker fra bekreftet bestilling og depositum. En ny skrogform legger til 15–20 dagers formbygging. Hver port har en på forhånd avtalt gjennomgangstid.'
    - q: 'Må jeg signere en NDA før jeg deler designen min?'
      a: 'En NDA er tilgjengelig direkte på forespørsel — før deling av egne tekniske spesifikasjoner eller artwork. Vi produserer utelukkende under kundenes merker og konkurrerer ikke med dem i noe marked. Samme policy gjelder for en enkelt prøve som for et containerprogram.'
    - q: 'Hva er minste bestillingsmengde for en første OEM-syklus?'
      a: 'Oppstarten er trinnvis: først 1–2 prøver (tilgjengelig innen 7–12 dager), deretter en prøve- eller pilotbestilling på 20–50 brett (produksjon på 25–35 dager), og så standardmengder på 90–100+ brett per godkjent konfigurasjon. Co-branding i små partier starter fra 5–10 stykker hvis det ikke trengs en utviklingsfase. Prøvekostnadene trekkes fra produksjonsbestillingen.'
    - q: 'Hvordan er beskyttelsen av den immaterielle eiendomsretten regulert under onboarding?'
      a: 'Designene og spesifikasjonene dine er beskyttet av NDA-en som signeres før utveksling av egne opplysninger. Alt artwork, BOM-data og tekniske filer oppbevares i systemer med tilgangskontroll og sporbart revisjonslogg. I OEM-modus eier du all IP. I ODM-modus er IP-en til den tilpassede plattformen delt slik det er avtalt. I Private Label-modus tilhører IP-en iSupfactory, og du får en lisens til merkesettingen.'
    - q: 'Hvilke kvalitetsgarantier gjelder for en første bestilling?'
      a: 'Hvert brett — prøve, prøveparti eller volum — går gjennom samme system med 7 inspeksjonsporter: varemottakskontroll, kontroll av drop-stitch-stoffet, sveising og montering, 24-timers trykk- og lufttetthetstest (18.0 PSI holding, automatisk kassering over 0.50 PSI), montering av EVA-deckpad og tilbehør, grafikk- og merke-QC, sluttemballasje og dokumentasjon. Kvaliteten senkes aldri for mindre bestillinger.'
    - q: 'Hva er det første praktiske trinnet?'
      a: 'Fyll ut /no/contact#project-brief med planlagte spesifikasjoner, målmengde og planlegging. Vi svarer innen én arbeidsdag med gjennomførbarhetskontrollen og et tilbudsforslag post for post. Alt annet i prosessen er dokumentert port for port, fra NDA til levering.'

