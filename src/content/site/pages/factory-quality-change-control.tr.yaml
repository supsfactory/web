cc_intro:
  tagline: Kapsam ve Politika
  title: Çekirdek Yönetişim İlkeleri
  body: |
    **Belge:** QMS-SOP-QC-CC-001 — *Yeniden İşleme Süreç Parametresi Değişiklik Kontrolü Standardı* (Rev 2.0, Resmi Sürüm). **Üretici:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Standart referansı:** ISO 9001:2015 Kalite Yönetim Sistemleri.

    - **Kontrolsüz değişiklik yoktur.** Yeniden işleme parametresi değişiklikleri resmi değişiklik kontrolünden geçirilmelidir. Saha operatörleri, vardiya şefleri veya tek bir departman, onaylanmış yeniden işleme parametrelerini sözlü anlaşmayla ya da yeniden işleme kaydına el yazısıyla ekleyerek değiştiremez.
    - **Tüm öğeler kapsama alınır.** Kontrollü kapsam; hava sızdırmazlığı, supap yuvaları, ray bantları, dikiş yapıştırma, sıcak hava kürleme ve basınç tutma testini kapsar — sızdırmazlığı, yapısal dayanıklılığı, görünümü, müşteri kabulünü veya izlenebilirliği etkileyebilecek her parametre.
    - **Müşteri onayı son çizgi.** Ürünü müşteri tarafından onaylanan numune, teknik şartname, BOM, görsel sanat, ambalajlama gereksinimi veya kabul kriterlerinden uzaklaştıran her değişiklik yalnızca yazılı müşteri onayıyla uygulanır. Onay olmadan tahta özgün gereksinime göre yeniden işlenir, değiştirilir veya reddedilir — asla yalnızca fabrika tarafından “gevşetilmez”.

cc_scope:
  tagline: Risk Sınıflandırması
  title: Değişiklik Kapsamı ve Risk Sınıflandırması
  subtitle: 'Aşağıdakilerden herhangi biri resmi değişiklik kontrolünü tetikler — asla yeniden işleme kaydına bir not düşerek ele alınmaz. Risk seviyesi, kimin onaylayacağını ve ne kadar doğrulama gerektiğini belirler.'
  headers:
    category: Değişiklik Kategorisi
    examples: Tipik Örnekler
    risk: Risk
    requirements: Kontrol ve Onay Gereksinimleri
  rows:
    - category: 'Yeniden İşleme Malzemeleri'
      examples: 'Yapıştırıcı, temizleyici, yama malzemesi, supap contası, astar veya tedarikçi değişikliği'
      risk: 'Yüksek'
      requirements: 'Fonksiyonlar arası inceleme + malzeme uyumluluk ve basınç tutma doğrulaması + uygun olduğunda müşteri imzası'
    - category: 'Süreç Koşulları'
      examples: 'Yüzey hazırlığı, sıcak hava kürleme sıcaklığı/nemliliği, kelepçe basıncı, tutma süresi'
      risk: 'Yüksek'
      requirements: 'Tanımlı sıcaklık ve nem penceresi doğrulamasıyla Mühendislik + Kalite onayı'
    - category: 'Aparatlar ve Ölçüm Gereçleri'
      examples: 'Basınç göstergeleri, sızıntı dedektörleri, sıcak hava tabancaları, supap aletleri, test yazılımı'
      risk: 'Orta/Yüksek'
      requirements: 'Kalibrasyon geçerlilik kontrolü + ekipman uygunluk değerlendirmesi'
    - category: 'Kusur Kapsamı'
      examples: 'Yeniden işleme alanının genişlemesi; yüzey mikro sızıntısının ray, dikiş veya supap yuvası kritik bölgelerine ilerlemesi'
      risk: 'Yüksek'
      requirements: 'Yapısal yük taşıma yüzeyleri: zorunlu durdurma ve yeniden değerlendirme'
    - category: 'Denetim Yöntemleri'
      examples: 'Sızıntı tespit yöntemi, test basıncı (18.0 PSI), tutma süresi (24h)'
      risk: 'Yüksek'
      requirements: 'Kalite onayı + müşteri teknik anlaşmasının teyidi'
    - category: 'Belgeler ve Yetkilendirme'
      examples: 'Yeniden işleme talimatı, denetim formları, NCR karar mantığı, operatör yeterliliği'
      risk: 'Orta'
      requirements: 'Kontrollü belge revizyonu (Rev A → Rev B) + eğitim kayıtları'

cc_containment:
  tagline: Zorunlu Durdurma Kuralı
  title: Durumlar Ciddileştiğinde Anlık İçe Katma
  body: |
    > “Mevcut yeniden işleme yöntemi incelemeye alınmalı ve değişiklik değerlendirilip onaylanana kadar ek etkilenen ürüne uygulanmamalıdır; Kalite ve Mühendislik tarafından onaylanmış belgelenmiş bir geçici sapma istisna olabilir.”

    Yeniden işleme sonrası denetim tekrarlı olarak başarısız olduğunda, kusur yapısal yük taşıma bölgelerini içerdiğinde (supap tabanı, raylar, dikişler, burun/kuyruk basınç bölgeleri), ikame bir malzeme henüz doğrulanmamış olduğunda veya mevcut parametreler müşteri tarafından onaylanan şartnameyle çeliştiğinde, mevcut yeniden işleme yöntemi derhal durdurulmalıdır.

    Geçici sapmalar asla kalıcı uygulamaya dönüşmez: her biri tanımlı bir geçerlilik penceresi, uygulanabilir parti kapsamı, adet üst sınırı, doğrulama gereksinimleri ve otomatik sona erme mekanizması taşır. Sözlü istisna istisna değildir — sona erme tarihiyle belgelenmemişse mevcut değildir.

cc_flow:
  tagline: Standart 9 Adımlı Kapalı Döngü
  title: Değişiklik Talebinden Kapatma ve Saklamaya
  subtitle: 'Her parametre değişikliği için tek bir belgelenmiş döngü: öner, ele, değerlendir, onayla, doğrula, pilot uygula, doğrula, revize et, kapat.'
  steps:
    - step: '01'
      title: Değişiklik Talebi (ECR)
      desc: 'Herhangi bir departman talepte bulunabilir, ancak talebi Mühendislik, Kalite veya Üretim yönetimi üstlenir. ECR, değişikliğin neden önerildiğini, neyin değiştiğini, neyin etkilendiğini ve nasıl doğrulanacağını yanıtlar — değişiklik kontrol numarası, ilgili NCR/CAPA, mevcut ile önerilen parametre, etkilenen partiler ve geçici/kalıcı sınıflandırması ile.'
    - step: '02'
      title: İlk Eleme ve İçe Katma
      desc: 'Talep önce anlık içe katma için elenir: mevcut yöntemin hemen durdurulması gerekiyor mu? Geçici bir sapmaya izin veriliyorsa, bu geçerlilik penceresi, parti kapsamı, adet üst sınırı ve otomatik sona erme ile sınırlanır.'
    - step: '03'
      title: Etki ve Risk Değerlendirmesi
      desc: 'Mühendislik, Kalite, Üretim, Satın Alma/Tedarik Zinciri ve Proje; ürün performansını, kabul kriterlerini, malzeme uyumluluğunu, görünümü, süreç yetkinliğini, ekipman ve ölçüm gereçlerini, personel yeterliliğini, müşteri gereksinimlerini, uyumu ve izlenebilirlik kapsamını değerlendirir.'
    - step: '04'
      title: Ortak İnceleme ve Onay
      desc: 'Onay, sabit yetki matrisine göre ilerler — “kimi bağırdıysa onaylar” değil. Yüksek riskli değişiklikler fonksiyonlar arası onay ve gerektiğinde herhangi bir denemeden önce yazılı müşteri onayı gerektirir.'
    - step: '05'
      title: Doğrulama Planı
      desc: 'Yüksek riskli değişiklikler için rutin uygulamadan önce onaylı bir doğrulama planı gereklidir: temsili örnek tahtalar, mevcut ile önerilen yöntem, test yöntemleri, kabul kriterleri, denetim aşamaları, sorumlu kişiler ve program.'
    - step: '06'
      title: Kontrollü Pilot ve Uygulama
      desc: 'Yeni belgeler yayımlanır, kullanımdan kalkan sürümler geri çekilir ve OBSOLETE olarak işaretlenir; yeni malzemeler ve ölçüm gereçleri doğrulanır ve kalibre edilir; operatörler eğitilir ve nitelendirilir; ilk parti sıkılaştırılmış denetimle ve net durum tanımlamasıyla üretilir.'
    - step: '07'
      title: Yeniden Denetim ve Etkinlik Gözden Geçirmesi
      desc: 'İlk seferde geçme oranı, yeniden denetim geçme oranı, tekrar oranı ve görünüm kabulü ölçülür ve değişiklik etkili kabul edilmeden önce gözden geçirilir — onarılmış tek bir tahta asla süreç doğrulaması olarak değerlendirilmez.'
    - step: '08'
      title: Belge Revizyonu ve Eğitim
      desc: 'İş talimatları, denetim formları, NCR karar seçenekleri, parametre kartları ve eğitim materyalleri yeni revizyona güncellenir; uygulamalı eğitim ve operatör yeterliliği kayıt altına alınır.'
    - step: '09'
      title: Kapatma ve Kayıt Saklama
      desc: 'Değişiklik, yalnızca doğrulama kanıtı, belge güncellemeleri, eğitim kayıtları ve uygulama etkinliği gözden geçirilip onaylandıktan sonra kapatılır. Amaçlanan sonuç elde edilmezse değişiklik revize edilir, genişletilir, askıya alınır veya geri çekilir.'

