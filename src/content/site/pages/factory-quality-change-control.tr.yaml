cc_validation:
  tagline: Mühendislik Doğrulaması
  title: Doğrulama ve Kabul Protokolü — İfade Değil Kanıt
  body: |
    *“Onarılan tahta iyi olmalıdır”* gibi belirsiz kabul ifadeleri kabul edilmez. Kontrollü ifade şudur:

    > “Yeniden işlenen örnek, müşteri tarafından onaylanmış bir sapma özellikle alternatif bir kriter tanımlamadıkça, uygun bir tahtayla aynı geçerli hava sızdırmazlığı, görsel işçilik, supap işlevi ve projeye özgü kabul kriterlerini karşılamalıdır.”

    Doğrulama kanıtı niceldir ve hava sızdırmazlığı yeniden işlemesi için mühendislik temel değerleri şunları içerir:

    - **Sızıntı giderme ve basınç tutma.** Özgün sızıntı, köpük suyu sızıntı tespitinde sürekli kabarcık oluşmadan giderilir; tahta, sıcaklık/nem telafisi sonrası net basınç düşümü ΔP ≤ 0.2 PSI ile 24 saat boyunca standart test basıncı 18.0 PSI’da tutulur — üretim hattı son kabulünde uygulanan 0.50 PSI otomatik ret eşiğinden ayrı olarak, daha sıkı olan yeniden işleme doğrulama temel değeridir.
    - **Supap işlevi.** Supap çekirdeği torku 15–20 N·m şartnamesini karşılar; conta, yüksek basınçlı şişirme ve dinamik basma altında mikro sızıntı göstermez.
    - **Dikiş yapıştırma ve dayanıklılık.** Yapıştırma kenarlarında kalkma, beyazlama veya ayrışma görülmez; sıcaklık-nem yaşlandırma döngülerinden sonra yapıştırıcı tabakasında yumuşama veya gevrek çatlak oluşmaz.
    - **Görünüm ve işçilik.** Yapıştırıcı akıntı izi, EVA hasarı, tahta deformasyonu, logo kayması veya baskı yüzeyi çizilmesi bulunmaz.

cc_engineering:
  tagline: Mühendislik Uygulama Matrisi
  title: Dört Çekirdek Yeniden İşleme Sürecinin Nicel Parametreleri
  subtitle: 'Her kontrollü yeniden işleme süreci tanımlı parametreler, yöntem ve kabul kriterleri taşır — operatörlerimizin izlediği ve müşterilerimizin denetimlerde doğrulayabileceği aynı sayılar.'
  headers:
    process: Yeniden İşleme Süreci
    parameters: Kontrollü Parametreler
    methodology: Test Yöntemi
    acceptance: Kabul Kriterleri
  rows:
    - process: 'Delik / Mikro Sızıntı Yama Onarımı'
      parameters: 'Çözücü ile temizleme ve 3–5 dk kurutma; sıcak hava aktivasyonu 60°C ± 5°C; basınç merdanesi ≥ 0.4 MPa'
      methodology: '18 PSI’ye şişir; tam su altına batırma veya köpük uygulaması; 10 dakika gözlemle'
      acceptance: 'Sıfır kabarcık çıkışı; 180° kenar soyma testinde kalkma ve yapıştırıcı akıntı izi yok'
    - process: 'Ray Bandı / Dikiş Yeniden Yapıştırma'
      parameters: 'İki bileşenli yapıştırıcı oranı katı biçimde kontrollü; ortam 22–28°C, ≤ %65 RH; fikstür kelepçesi ≥ 4 saat'
      methodology: '2 saat 22 PSI aşırı basınç testi; ardından 50°C ısı kutusunda 6 saat pişirme ve 2 saat oda sıcaklığında dinlendirme'
      acceptance: 'Sıfır ayrışma, sıfır çatlak; net basınç düşümü ΔP ≤ 0.1 PSI; yapıştırıcı tabakasında beyazlama veya gevrekleşme yok'
    - process: 'Supap Tabanı Gevşemesi / Mikro Sızıntı'
      parameters: 'Özel anahtar torku 18–20 N·m; conta contası deforme olmadan düz; diş temizliği teyit edildi'
      methodology: '15 PSI’ye şişir; 20 şişirme/indirme döngüsü; su altı batırma gözlemi'
      acceptance: 'Supap çekirdeğinde ve taban çevresinde sıfır kabarcık; döngü sonrası tork ≥ 16 N·m'
    - process: 'Nihai 24h Basınç Tutma Testi'
      parameters: 'Referans şişirme 18.0 PSI; dijital gösterge Sınıf 1.0 / ±0.5%; ortam sıcaklığı ve nemliliği kaydedilir ve telafi edilir'
      methodology: 'Dijital basınç kaydedici; kesintisiz 24 saat basınç eğrisi'
      acceptance: 'Telafi sonrası net basınç düşümü ΔP ≤ 0.20 PSI / 24 saat; tahtada şişlik veya deformasyon yok'

