faqs:
  tagline: SSS
  title: 'Yeniden İşleme Değişiklik Kontrolü Hakkında Sıkça Sorulan Sorular'
  items:
    - q: 'Fabrika bize söylemeden yeniden işleme parametrelerini değiştirebilir mi?'
      a: 'Hayır. Onaylanmış yeniden işleme malzemeleri, süreç koşulları, aparatlar, test yöntemleri, denetim kriterleri veya yetkili personelde önerilen her değişiklik önce belgelenmiş değişiklik kontrolünden geçmelidir. Müşteri tarafından onaylanan şartnameleri, numuneleri, BOM’ları, görsel sanatları veya kabul kriterlerini etkileyen değişiklikler yazılı müşteri onayı gerektirir.'
    - q: 'Yüksek riskli değişiklik nedir?'
      a: 'Yeniden işleme malzemesi veya tedarikçisi, basınç/tutma veya kürleme koşulları, supap/ray/dikiş yeniden işleme yöntemleri, denetim veya kabul kriterleri ve kusur kapsamının yapısal bölgelere genişlemesi değişiklikleri yüksek riskli olarak sınıflandırılır. Rutin kullanım öncesinde fonksiyonlar arası inceleme, onaylı doğrulama planı ve kontrollü pilot uygulama gerektirirler.'
    - q: 'Geçici bir sapma süresiz kullanılabilir mi?'
      a: 'Hayır. Her geçici sapma tanımlı bir geçerlilik penceresi, parti kapsamı, adet üst sınırı ve doğrulama gereksinimiyle birlikte otomatik sona erme taşır. Sınıra ulaşıldığında parti kilitlenir ve değişiklik resmen değerlendirilene kadar geçiş fişi basılması engellenir.'
    - q: 'Değiştirilen yöntemin tam kullanım öncesinde çalıştığı nasıl kanıtlanır?'
      a: 'Yüksek riskli değişiklikler bir doğrulama planı gerektirir: tolerans sınırlarını kapsayan en az 5 temsili örnek tahta, nicel kabul kriterlerine (sızıntı giderme, basınç tutma, supap işlevi, dikiş dayanıklılığı, görünüm) karşı 2 bağımsız QC denetçisi tarafından test edilir. Doğrulamayı onaylamak uygulamayı onaylamak değildir.'
    - q: 'Her değişikliği onaylamamız gerekiyor mu?'
      a: 'Her değişiklik değil, ancak ürünü müşteri tarafından onaylanan numune, teknik şartname, BOM, görsel sanat, ambalajlama veya kabul kriterlerinden uzaklaştıran her değişiklik yalnızca yazılı müşteri onayıyla uygulanır. Onay olmadan tahtalar özgün gereksinime göre yeniden işlenir, değiştirilir veya reddedilir.'
    - q: 'Bir değişiklik onaylandığında eski belgelere ne olur?'
      a: 'Eski iş talimatları, parametre kartları ve denetim formları fiziksel olarak toplanır ve iptal edilir (1-çıkış-1-giriş), OBSOLETE olarak işaretlenir ve eğitim sonrasında yeni kontrollü revizyonla değiştirilir. Eski ve yeni sürümler asla aynı çalışma istasyonunu paylaşmaz.'
    - q: 'Değişiklik kontrol kayıtları ne kadar süre saklanır?'
      a: 'Kapatma kayıtları — doğrulama kanıtı, belge revizyonları, eğitim kayıtları ve etkinlik gözden geçirmeleri — kayıt saklama politikamıza göre saklanır (kapatma kayıtları için en az 3 yıl); böylece her değişiklik denetimler ve izlenebilirlik incelemeleri için izlenebilir kalır.'

