faqs:
  tagline: FAQ
  title: Veelgestelde vragen over het wijzigingsbeheer van herbewerking
  items:
    - q: 'Kan de fabriek herbewerkingsparameters wijzigen zonder ons te informeren?'
      a: 'Nee. Elke voorgestelde wijziging aan goedgekeurde herbewerkingsmaterialen, procesomstandigheden, apparatuur, testmethoden, inspectiecriteria of geautoriseerd personeel moet eerst door een gedocumenteerd wijzigingsbeheer. Wijzigingen die van invloed zijn op door de klant goedgekeurde specificaties, monsters, BOM, graphics of acceptatiecriteria vereisen de schriftelijke vrijgave van de klant.'
    - q: 'Wat geldt als een hoog-risicowijziging?'
      a: 'Wijzigingen aan herbewerkingsmaterialen of -leveranciers, druk-/behoud- of uithardingsomstandigheden, herbewerkingsmethoden van ventiel/rail/naden, inspectie- of acceptatiecriteria en de uitbreiding van de defectscope naar structurele zones worden geclassificeerd als hoog risico. Ze vereisen interfunctionele verificatie, een goedgekeurd validatieplan en een gecontroleerde pilootimplementatie vóór routinematig gebruik.'
    - q: 'Kan een tijdelijke afwijking onbeperkt worden gebruikt?'
      a: 'Nee. Elke tijdelijke afwijking draagt een gedefinieerd geldigheidsvenster, een partijscope, een hoeveelheidsplafond en validatievereisten met automatische vervaldatum. Het bereiken van het plafond blokkeert de partij en blokkeert het afdrukken van de doorgangstag totdat de wijziging formeel is beoordeeld.'
    - q: 'Hoe toont u aan dat een gewijzigde methode werkt vóór volledig gebruik?'
      a: 'Hoog-risicowijzigingen vereisen een validatieplan: minimaal 5 representatieve voorbeeldplanken die de tolerantielimieten bestrijken, getest door 2 onafhankelijke QC-inspecteurs tegen gekwantificeerde acceptatiecriteria (lekeliminatie, drukbehoud, ventielfunctie, naadlevensduur, uiterlijk). De vrijgave voor validatie is geen vrijgave voor toepassing.'
    - q: 'Moeten wij elke wijziging vrijgeven?'
      a: 'Niet elke wijziging, maar elke wijziging die het product verwijdert van het door de klant goedgekeurde monster, de technische specificatie, de BOM, de graphics, de verpakking of de acceptatiecriteria wordt alleen geïmplementeerd met de schriftelijke vrijgave van de klant. Zonder die vrijgave worden de planken herbewerkt, vervangen of afgekeurd volgens de oorspronkelijke eis.'
    - q: 'Wat gebeurt er met oude documenten wanneer een wijziging wordt vrijgegeven?'
      a: 'De oude werkinstructies, parameterkaarten en inspectiebladen worden fysiek ingetrokken en ongeldig gemaakt (1-in-1-out), gemarkeerd als OBSOLETE en vervangen door de nieuwe gecontroleerde revisie na de training. Oude en nieuwe versies delen nooit een werkstation.'
    - q: 'Hoe lang worden de registraties van het wijzigingsbeheer bewaard?'
      a: 'De sluitingsregistraties — validatiebewijzen, documentrevisies, trainingsbewijzen en effectiviteitsbewijzen — worden bewaard volgens ons bewaarbeleid (minimaal 3 jaar voor sluitingsregistraties), zodat elke wijziging traceerbaar blijft voor audits en verificaties.'

