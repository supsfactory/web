cc_validation:
  tagline: Technische validatie
  title: Validatie- & acceptatieprotocol — bewijzen, geen beweringen
  body: |
    Een vage acceptatieformulering als *"de gerepareerde plank moet goed zijn"* wordt niet geaccepteerd. De gecontroleerde formulering luidt:

    > "Het herbewerkte monster moet voldoen aan dezelfde toepasselijke acceptatiecriteria voor luchtdichtheid, visuele afwerking, ventielfunctie en projectspecifieke eisen als een conforme plank, tenzij een door de klant goedgekeurde afwijking uitdrukkelijk een alternatief criterium definieert."

    De validatiebewijzen zijn kwantitatief en de technische baseline voor de luchtdichtheidsherbewerking omvat:

    - **Eliminatie van het lek & drukbehoud.** Het oorspronkelijke lek wordt geëlimineerd zonder aanhoudende bellen in de zeepwater-detectie; de plank houdt de druk bij de standaard testdruk van 18.0 PSI gedurende 24 uur, met een netto drukverlies ΔP ≤ 0.2 PSI na compensatie van temperatuur/vochtigheid — de strengste baseline voor de validatie van herbewerking, gescheiden van de automatische uitsluitingsdrempel van 0.50 PSI die wordt toegepast bij de uiteindelijke acceptatie van de productielijn.
    - **Ventijlfunctie.** Het aanhaalmoment van de ventielkern voldoet aan de specificatie van 15–20 N·m, zonder micro-lekken aan de afdichting onder hogedruk- en dynamische druk bij het oppompen.
    - **Naadverlijming & levensduur.** De verlijmingsranden vertonen geen loslating, witverkleuring of delaminatie; na de cycli van thermische/vochtigheid-veroudering vertoont de lijmlaag geen verzachting of brosse scheuren.
    - **Uiterlijk & afwerking.** Geen lijmuitloop, geen schade aan het EVA, geen vervorming van de plank en geen verschuiving van het logo of krassen op het bedrukte oppervlak.

cc_engineering:
  tagline: Technische uitvoeringsmatrix
  title: Gekwantificeerde parameters voor de vier kernherbewerkingsprocessen
  subtitle: 'Elk gecontroleerd herbewerkingsproces draagt gedefinieerde parameters, methodiek en acceptatiecriteria — dezelfde cijfers die onze operators volgen en die klanten tijdens audits kunnen verifiëren.'
  headers:
    process: Herbewerkingsproces
    parameters: Gecontroleerde parameters
    methodology: Testmethodiek
    acceptance: Acceptatiecriteria
  rows:
    - process: 'Reparatie van speldenprikgaatjes/micro-lekken'
      parameters: 'Reinigen met oplosmiddel & drogen 3–5 min; hetelucht-activatie 60°C ± 5°C; drukrol ≥ 0.4 MPa'
      methodology: 'Oppompen tot 18 PSI; volledige onderdompeling in water of zeepapplicatie; observeren gedurende 10 minuten'
      acceptance: 'Nul bellenvorming; 180°-randafbuiging zonder loslating en zonder lijmuitloop'
    - process: 'Opnieuw verlijmen railband/naad'
      parameters: 'Strikt gecontroleerde verhouding van tweecomponentenlijm; omgeving 22–28°C, ≤ 65% relatieve luchtvochtigheid; klem in de mal ≥ 4 u'
      methodology: 'Overdruktest bij 22 PSI gedurende 2 u; daarna 6 u uitharden in de oven op 50°C en 2 u rusten op kamertemperatuur'
      acceptance: 'Nul scheiding, nul scheurvorming; netto drukverlies ΔP ≤ 0.1 PSI; lijmlaag zonder witverkleuring of verbrossing'
    - process: 'Loskomen van de ventielbasis / micro-lek'
      parameters: 'Specifiek aanhaalmoment van de sleutel 18–20 N·m; vlakke afdichtring zonder vervorming; bevestigde schroefdraadreiniging'
      methodology: 'Oppompen tot 15 PSI; 20 cycli van opblazen/afblazen; observatie tijdens onderdompeling onder water'
      acceptance: 'Nul bellen bij de ventielkern en rond de basis; aanhaalmoment na de cycli ≥ 16 N·m'
    - process: 'Definitieve 24u-drukbehoudtest'
      parameters: 'Referentie-oppompdruk 18.0 PSI; digitale manometer klasse 1.0 / ±0.5%; geregistreerde en gecompenseerde omgevingstemperatuur & vochtigheid'
      methodology: 'Digitale drukrecorder; continue 24u-drukcurve'
      acceptance: 'Netto drukverlies ΔP ≤ 0.20 PSI / 24 u na compensatie; geen uitstulping of vervorming van de plank'

cc_photos:
  tagline: In de productiehal
  title: Reparatie, hertest, vrijgave — bij elke stap gedocumenteerd
  subtitle: De foto''s uit onze werkplaats in Qingdao tonen elk gecontroleerd herbewerkingsproces met zijn gekalibreerde meetinstrumenten, gedefinieerde parameters en registraties ter plaatse — dezelfde bewijzen die inspecteurs op elk moment kunnen opvragen.
  grid: 'sm:grid-cols-2'
  features:
    - image: https://assets.supsfactory.com/site/quality/cc-pinhole-repair.avif
      alt: Technicus repareert een speldenprikgaatje-micro-lek op een opblaasbare SUP met een heteluchtpistool en drukrol
      title: Reparatie van speldenprikgaatjes
      desc: 'Een technicus behandelt een gemarkeerd micro-lek met een heteluchtpistool dat is ingesteld op de specificatie van 60°C en een drukrol; het zeepwater bevestigt de positie van het lek en het door QC ondertekende ECR-formulier op het werkblad toont de wijzigingsbeheerpoort (Poka-Yoke nr. 1).'
    - image: https://assets.supsfactory.com/site/quality/cc-rail-seam-bonding.avif
      alt: Technicus brengt tweecomponenten PU-lijm met een precisiekwast aan op een railnaad onder gecontroleerd klimaat
      title: Verlijming van de railnaad
      desc: 'De tweecomponenten PU-lijm wordt met een precisiekwast op de railnaad aangebracht terwijl de plank in een malklem wordt gehouden; de thermometer/hygrometer ter plaatse toont het gecontroleerde venster van 24°C / 55% relatieve luchtvochtigheid.'
    - image: https://assets.supsfactory.com/site/quality/cc-valve-base-integrity.avif
      alt: Digitale momentsleutel ingesteld op 19 N·m die de ventielkern tegen het drop-stitch materiaal vastzet
      title: Integriteit van de ventielbasis
      desc: 'Een digitale momentsleutel, ingesteld op de specificatie van 19 N·m, voert het definitieve aandraaien van de ventielkern uit en verzegelt de basis tegen het drop-stitch materiaal — het instrument draagt het groene CALIBRATED-etiket.'
    - image: https://assets.supsfactory.com/site/quality/cc-pressure-hold-testing.avif
      alt: Afgewerkte opblaasbare SUP''s aangesloten op digitale drukrecorders in het definitieve drukbehoudtestgebied
      title: Definitieve drukbehoudverificatie
      desc: 'De afgewerkte planken worden aangesloten op digitale hogeprecisie-drukrecorders; de master-manometer toont de referentie van 18.00 PSI en alle testgegevens worden automatisch geüpload en gekoppeld aan het contracttraceerbaarheidssysteem.'

cc_pokayoke:
  tagline: Foutpreventie
  title: 'Poka-Yoke: harde blokkeringen die ongecontroleerde wijzigingen stoppen'
  subtitle: De standaard wordt niet alleen via procedures toegepast, maar met fysieke en systemische blokkeringen die ongecontroleerde wijzigingen onmogelijk maken.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR-poort voor de activering van het gereedschap
      desc: 'De herbewerkingsstations lezen een door QA ondertekende ECR-streepjescode vóórdat de pneumatische oppompventielen en de lijmmengers worden geactiveerd. Geen bewijs van een goedgekeurd wijzigingsbeheer, geen stroom — de handtekening met terugwerkende kracht ("eerst wijzigen, dan tekenen") wordt fysiek geblokkeerd.'
    - icon: 2
      icon_bg: green
      title: Automatische vervaldatum van tijdelijke afwijkingen
      desc: 'Tijdelijke afwijkingen zijn hard-coded als plafond in het systeem (bijv. maximaal 50 planken of 7 kalenderdagen). Het bereiken van het plafond blokkeert de partij en blokkeert het afdrukken van de doorgangstag van de verzending totdat de wijziging formeel is beoordeeld.'
    - icon: 3
      icon_bg: purple
      title: Minimumbewijs van validatie
      desc: 'Hoog-risicowijzigingen vereisen minimaal 5 representatieve voorbeeldplanken die de bovenste en onderste tolerantielimiet bestrijken, volledig getest door 2 onafhankelijke QC-inspecteurs vóórdat een validatierapport mag worden uitgebracht — een gerepareerde plank wordt nooit behandeld als procesvalidatie.'
    - icon: 4
      icon_bg: orange
      title: 1-in-1-out documentcontrole
      desc: 'De verouderde werkstationkaarten worden fysiek ingetrokken en ongeldig gemaakt (geperforeerd) vóórdat de nieuwe kaart wordt uitgebracht, gestempeld met het gecontroleerde rode zegel — oude en nieuwe versies delen nooit een werkstation.'

