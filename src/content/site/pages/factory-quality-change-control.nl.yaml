answer:
  label: 'Helder antwoord'
  text: 'Wijzigingen aan herbewerkingsparameters worden bij QINGDAO VATRAD GROUP.,LTD. nooit mondeling of met terugwerkende kracht besloten. Elke voorgestelde wijziging aan goedgekeurde herbewerkingsmaterialen, procesomstandigheden, apparatuur, testmethoden, inspectiecriteria of geautoriseerd personeel moet vóór de implementatie door een formeel wijzigingsbeheer: een gedocumenteerde Engineering Change Request (ECR), impact- en risicobeoordeling, interfunctionele verificatie van ontwerp, kwaliteit, productie, inkoop en project, vrijgave op het niveau dat is vastgelegd in onze autorisatiematrix, een goedgekeurd validatieplan voor hoog-risicowijzigingen, gecontroleerde pilootimplementatie, herverificatie en effectiviteitsbewijs, en sluiting uitsluitend na documentrevisie en training. Elke wijziging die van invloed is op door de klant goedgekeurde specificaties, monsters, BOM, graphics of acceptatiecriteria vereist bovendien de schriftelijke vrijgave van de klant.'
  verified: 'September 2026'

