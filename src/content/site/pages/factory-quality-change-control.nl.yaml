cc_intro:
  tagline: Scope & beleid
  title: Kernprincipes van governance
  body: |
    **Document:** QMS-SOP-QC-CC-001 — *Standaard van het wijzigingsbeheer voor herbewerkingsprocesparameters* (Rev 2.0, officiële publicatie). **Producent:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Normreferentie:** ISO 9001:2015 Kwaliteitsmanagementsystemen.

    - **Geen ongecontroleerde wijzigingen.** Wijzigingen aan herbewerkingsparameters moeten door een formeel wijzigingsbeheer gaan. Operators op de werkvloer, ploegleiders of een individuele afdeling mogen goedgekeurde herbewerkingsparameters nooit wijzigen met een mondelinge overeenkomst of een handgeschreven registratie in een herbewerkingsverslag.
    - **Volledige elementdekking.** De gecontroleerde scope omvat luchtdichtheid, ventielzittingen, railband, naadverlijming, hetelucht-uitharden en de drukbehoudtest — elke parameter die de afdichting, structurele levensduur, het uiterlijk, de acceptatie door de klant of de traceerbaarheid kan beïnvloeden.
    - **De vrijgave van de klant als centraal punt.** Elke wijziging die een product verwijdert van het door de klant goedgekeurde monster, de technische specificatie, de BOM, de graphics, de verpakkingsvereiste of de acceptatiecriteria wordt alleen geïmplementeerd met de schriftelijke vrijgave van de klant. Zonder die vrijgave wordt de plank herbewerkt, vervangen of afgekeurd volgens de oorspronkelijke eis — nooit "verzacht" uitsluitend door de fabriek.

cc_scope:
  tagline: Risicoclassificatie
  title: Wijzigingsscope & risicoclassificatie
  subtitle: Elk van de volgende wijzigingen activeert het formele wijzigingsbeheer — nooit afgehandeld met een notitie in het herbewerkingsverslag. Het risiconiveau bepaalt wie vrijgeeft en hoeveel validatie vereist is.
  headers:
    category: Wijzigingscategorie
    examples: Typische voorbeelden
    risk: Risico
    requirements: Controle- & vrijgavevereisten
  rows:
    - category: 'Herbewerkingsmaterialen'
      examples: 'Lijm, ontvetter, reparatiemateriaal, ventieldichting, primer of leverancierswissel'
      risk: 'Hoog'
      requirements: 'Interfunctionele verificatie + validatie van materiaalcompatibiliteit & drukbehoud + vrijgave van de klant waar toepasselijk'
    - category: 'Procesomstandigheden'
      examples: 'Oppervlaktevoorbereiding, temperatuur/vochtigheid van het hetelucht-uitharden, drukdruk, houdduur'
      risk: 'Hoog'
      requirements: 'Vrijgave van ontwerp + kwaliteit met gedefinieerde validatie van de temperatuur- & vochtigheidsvensters'
    - category: 'Apparatuur & meetinstrumenten'
      examples: 'Manometers, lekdetectoren, hetelucht-thermokoppels, ventielgereedschappen, testsoftware'
      risk: 'Gemiddeld/Hoog'
      requirements: 'Verificatie van de kalibratiegeldigheid + beoordeling van de geschiktheid van de apparatuur'
    - category: 'Defectscope'
      examples: 'Uitbreiding van het herbewerkingsgebied; oppervlakkige micro-reparatie die uitgroeit naar kritieke rail-, naad- of ventielzittingzones'
      risk: 'Hoog'
      requirements: 'Structureel dragende oppervlakken: verplichte stop en herbeoordeling'
    - category: 'Inspectiemethoden'
      examples: 'Lekdetectiemethode, testdruk (18.0 PSI), bewaarperiode (24u)'
      risk: 'Hoog'
      requirements: 'Kwaliteitsvrijgave + bevestiging van de technische overeenstemming van de klant'
    - category: 'Documentatie & autorisatie'
      examples: 'Herbewerkingsinstructie, inspectiebladen, logica van de NCR-beslissing, kwalificatie van operators'
      risk: 'Gemiddeld'
      requirements: 'Gecontroleerde documentrevisie (Rev A → Rev B) + trainingsbewijzen'

cc_containment:
  tagline: Regel van de harde stop
  title: Onmiddellijke insluiting wanneer de omstandigheden ernstig worden
  body: |
    > "De bestaande herbewerkingsmethode moet worden onderworpen aan een verificatie en niet worden toegepast op verdere betrokken producten totdat de wijziging is beoordeeld en geautoriseerd, tenzij een gedocumenteerde tijdelijke afwijking is goedgekeurd door Kwaliteit en Ontwerp."

    De huidige herbewerkingsmethode moet onmiddellijk worden opgeschort wanneer de herverificatie van de herbewerking blijft falen, wanneer het defect structureel dragende zones betreft (ventielbasis, rail, naden, drukzones van boeg/achtersteven), wanneer een vervangend materiaal nog niet is gevalideerd of wanneer de huidige parameters botsen met de door de klant goedgekeurde specificatie.

    Tijdelijke afwijkingen worden nooit blijvende praktijk: elke afwijking draagt een gedefinieerd geldigheidsvenster, een toepasselijke partijscope, een hoeveelheidsplafond, validatievereisten en een mechanisme voor automatische vervaldatum. Een mondelinge uitzondering is geen uitzondering — wordt die niet gedocumenteerd met zijn vervaldatum, dan bestaat hij niet.

cc_flow:
  tagline: Standaard gesloten cyclus in 9 fases
  title: Van wijzigingsverzoek tot sluiting en bewaring
  subtitle: 'Een gedocumenteerde cyclus voor elke parameterwijziging: voorstellen, screenen, beoordelen, vrijgeven, valideren, piloot draaien, verifiëren, reviseren, sluiten.'
  steps:
    - step: '01'
      title: Wijzigingsverzoek (ECR)
      desc: 'Elke afdeling kan een verzoek indienen, maar Ontwerp, Kwaliteit of de productieleiding sponsort het. De ECR beantwoordt waarom de wijziging nodig is, wat er verandert, wat er is getroffen en hoe het wordt geverifieerd — met een wijzigingsbeheernummer, gekoppelde NCR/CAPA, huidige vs. voorgestelde parameter, betrokken partijen en de classificatie tijdelijke/permanente wijziging.'
    - step: '02'
      title: Eerste screening & insluiting
      desc: 'Het verzoek wordt eerst gescreend op onmiddellijke insluiting: moet de huidige methode nu worden gestopt? Is een tijdelijke afwijking toegestaan, dan wordt die begrensd door een geldigheidsvenster, partijscope, hoeveelheidsplafond en automatische vervaldatum.'
    - step: '03'
      title: Impact- & risicobeoordeling
      desc: 'Ontwerp, Kwaliteit, Productie, Inkoop/leveringsketen en Project beoordelen de productprestaties, acceptatiecriteria, materiaalcompatibiliteit, het uiterlijk, de procescapaciteit, apparatuur en meetinstrumenten, personeelskwalificatie, klantvereisten, conformiteit en de traceerbaarheidsscope.'
    - step: '04'
      title: Gezamenlijke verificatie & vrijgave
      desc: 'De vrijgave volgt de vaste autorisatiematrix — niet "wie het hardst schreeuwt". Hoog-risicowijzigingen vereisen de interfunctionele vrijgave en, waar nodig, de schriftelijke vrijgave van de klant vóór enige poging.'
    - step: '05'
      title: Validatieplan
      desc: 'Voor hoog-risicowijzigingen is een goedgekeurd validatieplan vereist vóór de routinematige toepassing: representatieve voorbeeldplanken, huidige vs. voorgestelde methode, testmethoden, acceptatiecriteria, inspectieniveaus, verantwoordelijken en planning.'
    - step: '06'
      title: Gecontroleerde pilots & implementatie
      desc: 'De nieuwe documenten worden vrijgegeven en de verouderde versies worden ingetrokken en gemarkeerd als OBSOLETE; nieuwe materialen en meetinstrumenten worden geverifieerd en gekalibreerd; de operators worden getraind en gekwalificeerd; de eerste partij draait onder versterkte inspectie met duidelijke statusmarkering.'
    - step: '07'
      title: Herverificatie & effectiviteitsbewijs
      desc: 'Het first-pass percentage van de herbewerking, het slagingspercentage van de herverificatie, het herhalingspercentage en de acceptatie van het uiterlijk worden gemeten en geverifieerd vóórdat de wijziging als effectief wordt beschouwd — een gerepareerde plank wordt nooit behandeld als procesvalidatie.'
    - step: '08'
      title: Documentrevisie & training
      desc: 'Werkinstructies, inspectiebladen, NCR-beslissingsopties, parameterkaarten en trainingsmateriaal worden bijgewerkt naar de nieuwe revisie, met geregistreerde praktische training en kwalificatie van de operator.'
    - step: '09'
      title: Sluiting & bewaring van registraties
      desc: 'De wijziging wordt pas gesloten nadat de validatiebewijzen, documentupdates, trainingsbewijzen en de effectiviteit van de implementatie zijn geverifieerd en vrijgegeven. Wordt het beoogde resultaat niet bereikt, dan wordt de wijziging herzien, uitgebreid, opgeschort of ingetrokken.'

