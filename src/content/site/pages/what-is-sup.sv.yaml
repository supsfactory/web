  text: 'En uppblåsbar SUP är en stand-up paddleboard av PVC drop-stitch-tyg som blir styv när den pumpas till 12–15 PSI. För de flesta rekreativa och touringtillämpningar når den stela brädornas prestanda, väger den cirka 8–10 kg och kan den vikas ihop och förvaras i en ryggsäck för lagring och resor.'
