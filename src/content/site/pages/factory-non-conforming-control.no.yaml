faqs:
  tagline: FAQ
  title: FAQ om kvalitet og feilhåndtering for kjøpere over hele verden
  items:
    - q: 'Hvordan sikrer dere at omtillverkede brett oppfyller hele sikkerhetsstandarden?'
      a: 'Hvert omtillverket brett behandles som en ny enhet og må gjennomgå den samme komplette testsyklusen fra starten — for lufttetthetsreparasjoner en fullstendig 24-timers trykkeprøve. Det er de uavhengige QC-inspektørene, ikke omtillverkningsoperatørene, som utfører frigjøringsvalideringen.'
    - q: 'Sender fabrikken brett med mindre kosmetiske avvikelser uten å informere oss?'
      a: 'Aldri. Hver avvikelse som påvirker kundens godkjente golden samples, logografikk, fargevarianter eller emballasje krever en formell skriftlig avvikstillatelse, undertegnet av kunden, før frigjøring før levering.'
    - q: 'Hva skjer hvis et omtillverket brett ikke består reverifiseringen?'
      a: 'Brettet frigjøres ikke. Det går tilbake til en ny tiltaksvurdering og erstattes, kasseres eller destrueres etter den overvåkede kasseringsprotokollen dersom det ikke kan bringes til samsvar. Gjentakende feil i samme feilklasse aktiverer en CAPA for rotorsaksanalyse.'
    - q: 'Kan defekte brett selges som andrehånds eller via andre kanaler?'
      a: 'Nei. Ikke-omtillverkbare og utenfor-spesifikasjon-brett destrueres fysisk etter den overvåkede kasseringsprotokollen — deler kappes, kjerne og kant kappes, video registreres, hashes med SHA-256 og lagres i minst 5 år. Kasserings- og destruksjonssertifikatet signeres av QA-sjefen og fabrikksjefen.'
    - q: 'Hvordan vurderes det berørte omfanget når en feil oppdages?'
      a: 'Omfanget undersøkes ut fra produktidentifisering, produksjonsparti, material- eller komponentparti, prosessfase og gjeldende dokumentrevisjon. Hvis samme materialparti, samme grafikkrevisjon eller samme arbeidsstasjon berøres, tas de aktuelle produktene med og inspiseres i samsvar med dette.'
    - q: 'Krever dere tillatelse før en avvikstillatelse innvilges?'
      a: 'Ja. Hver dokumentert avvikstillatelse som påvirker kundens krav — godkjente prøver, spesifikasjon, grafikk, emballasje eller akseptkriterier — krever kundens skriftlige frigjøring før selve frigjøringen. Uten denne frigjøringen omtillverkes, erstattes eller kasseres produktet etter det opprinnelige kravet.'
    - q: 'Hvilken dokumentasjon får dere for en avvikelse?'
      a: 'NCR-dossieret omfatter NCR-nummeret, deteksjonsfasen, produktet/SKU, partiet, de gjeldende dokumentrevisjonene, feilbeskrivelsen, avgrensningen, tiltaket, referansen til omtillverkningsinstruksjonen, resultatet av reverifiseringen og den endelige frigjøringen eller lukkingen — tilgjengelig iht. prosjektets kvalitetsavtale.'

