nc_severity:
  tagline: Feilens alvorlighetsgrad og myndighet
  title: Klassifisering av alvorlighetsgrad og tiltaksmyndighet
  subtitle: 'Ikke alle avvikelser håndteres på samme nivå — tiltaksmyndigheten skalerer med feilens alvorlighetsgrad, fra frigjøring på linjenivå til Material Review Board med kundens samtykke.'
  headers:
    severity: Alvorlighetsgrad
    examples: Typiske eksempler
    authority: Tiltaks- og kontrollmyndighet
    control: Vilkår for frigjøring
  rows:
    - severity: 'Mindre'
      examples: 'Avkortet kartonghjørne, lett feiljustering av et ikke-kritisk tilbehør'
      authority: 'Frigjøring på stedet av seksjons-QC-sjefen og linjesupervisor, med utskifting eller frigjøring'
      control: 'Registrert i NCR; ingen påvirkning på produktets funksjon eller kundens krav'
    - severity: 'Alvorlig'
      examples: 'Langsom lekkasje fra ventilen, EVA-feiljustering utenfor toleranse (>2 mm), manglende tilbehør'
      authority: 'QC-sjefen og teknisk ingeniør utsteder en kontrollert omtillverkningsinstruksjon (SRI)'
      control: 'Uavhengig ny prøve på 100 % av de opprinnelige feilene og de påvirkede egenskapene før frigjøringen'
    - severity: 'Kritisk'
      examples: 'Skade på drop-stitch-kammeret, kantrem eller høytrykksrev, feiltrykket kundelogo eller fargeavvikelse'
      authority: 'Beslutning av Material Review Board (MRB); kundens skriftlige samtykke der dette kreves'
      control: 'Ingen frigjøring uten autorisert samtykke; ellers obligatorisk overvåket fysisk destruksjon'

nc_matrix:
  tagline: Matrise over ingeniørprotokollene
  title: Beslutningsmatrise for SUP-feil og reverifisering
  subtitle: Standardiserte ingeniørprotokoller som anvendes på de vanligste produksjonsavvikelsene — samme kvantifiserte parametere som kunder kan verifisere under revisjoner.
  headers:
    defect: Feilkategori
    protocol: Kontrollert tiltaksprotokoll
    validation: Uavhengig reverifisering og validering
  rows:
    - defect: 'Langsom lekkasje fra ventilen'
      protocol: 'Isoler brettet. Demonter ventilskjernen med kalibrert momentnøkkel (25 N·m), rengjør gjengene, bytt ut silikonens O-ring og trekk til igjen.'
      validation: 'Dypp ned i tooppløsning; pump opp til 18 PSI og gjennomfør en fullstendig ny prøve på 24-timers trykktap (ΔP ≤ 0.05 PSI).'
    - defect: 'Luftbobler i kantsøm'
      protocol: 'Blokker skiftpartiet. Delaminer båndregionen med varmestøttet dyse, rengjør overflaten med løsemiddel og påfør to-komponent PU-lim under 5 bar trykk.'
      validation: '100 % visuell og taktil kontroll av sømmen; strukturell verifiseringstrykkeprøve (18.0 PSI) i tillegg til 24-timers lufttetthet.'
    - defect: 'Feiljustering av EVA-pute'
      protocol: 'Varmestøttet fjerning med verktøy i regulert temperatur (80°C). Ny justering med en presisjonsform for tilbehør for posisjonering.'
      validation: 'Verifisering av spilleromtoleransen ved produksjon (≤ ±1.5 mm), verifisering av rutens symmetri, 100 % vedheftstest av kantene.'
    - defect: 'Feil i merking/logo'
      protocol: 'Umiddelbar stopp i trykklinjen. Blokker alle trykkede paneler. Verifiser vektorrevisjonen med kunden; null uautorisert endringer.'
      validation: 'Fargeverifisering med spektrofotometer (ΔE ≤ 1.5); 100 % visuell inspeksjon av tekstjusteringen mot kundens signerte master-vektor-PDF.'
    - defect: 'Emballasjeavvikelse / manglende SKU'
      protocol: 'Blokker eksportpalleten. Åpne og utfør en 100 % posisjonskontroll iht. BOM (pumpe, finne, leash, åre, reparasjonsstav).'
      validation: 'Validering med integrerte elektroniske dynamiske kontrollvekter (±30 g variasjon); verifisering med optiske skannere for 2D-strekkoder.'

nc_scrap:
  tagline: Null utslipp til markedet
  title: Kassering og overvåket destruksjon — anti-divideringsprotokoll med nulldefekter
  body: |
    Utenlandske merkepartnere trenger forsikring om at defekte brett aldri havner i sekundære detaljhandelskanaler, grå markeder eller netthandel. Brett som ikke kan bringes til samsvar, destrueres etter en overvåket og registrert protokoll:

    **1. Kapping av deler og tilbehør.** Under oppsyn av QA-sjefen kutter en hydraulisk saks bort alle D-ringer i rustfritt stål 316, transporthåndtakets bånd og bagasjelåsene. Ventilgruppen og finnebokbasen (US-boks / klikkfinne) fjernes helt ned til brettets fot, noe som eliminerer alle gjenbrukbare komponenter.

    **2. Kapping av drop-stitch og kanten.** Den indre drop-stitch-kjernen skjæres med dype kryssnitt gjennom brett og dekkslise (≥ 50 cm per kutt), og kantens forsterkede sider kappes i minst 4 segmenter — slik at forseglingsegenskaper og flyteevne ødelegges permanent.

    **3. Video- og fotovault.** Destruksjonen registreres som en sammenhengende 1080p-video med nærbilder av den serielle strekkoden, kuttet, rivingen av kjernen og det veide sluttavfallet. Videoen hashes (SHA-256) og lagres i minst 5 år på en kontrollert server.

    **4. Sertifisert avfallshåndtering.** Alle PVC- og drop-stitch-fragmenter veies, registreres i utgangsregisteret og transporteres kun av kvalifiserte partnere for gjenvinning av polymerer — ingenting restmateriale forlater anlegget via andre kanaler.

    > **Merkeskyddsgaranti:** QINGDAO VATRAD GROUP CO., LTD. garanterer 100 % destruksjon av ikke-omtillverkbare og utenfor-spesifikasjon-båter. Ingen brett av andrehåndskvalitet eller kompromitterte brett vil noen gang havne i sekundære detaljhandelskanaler, grå markeder eller netthandel. Kasserings- og destruksjonssertifikatet (VAT-QA-SCRAP-CERT-2026) dokumenterer produktet, partiet, MRB-konklusjonen, vitnebilder og dobbeltsignaturen fra QA-sjefen og fabrikksjefen.

