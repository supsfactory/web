nc_intro:
  tagline: Kontroll av ikke-samsvarlende produkter
  title: Hva som skjer når et produkt ikke oppfyller kriteriene
  body: |
    Produkter eller komponenter som ikke oppfyller de definerte akseptkriteriene identifiseres og settes under kontroll for å hindre utilsiktet bruk, videre bearbeiding eller levering. De gjeldende akseptkriteriene bygger på det godkjente prøveeksemplaret, den tekniske spesifikasjonen, grafikken, stykklista, emballasjekravene og prosjektets inspeksjonsplan.

    Ikke-samsvarlende enheter vurderes for å fastslå det berørte omfanget og riktig tiltak. Avhengig av problemet kan enheten holdes tilbake, omtillverkes etter kontrollerte instruksjoner, byttes ut, kasseres eller håndteres etter en godkjent prosess. Omtillverkede eller korrigerte enheter inspiseres om før frigjøringen. Frigjøring før levering er bare tillatt når de relevante kvalitetsregistrene er komplette og produktet samsvarer med de gjeldende akseptkriteriene.

nc_flow:
  tagline: Kontrollert lukket syklus i sju faser
  title: Fra identifisering til korrigerende tiltak
  subtitle: 'En kontrollert syklus for hver avvikelse: identifiser, blokker, verifiser, omtillverk eller bytt ut, kontroller på nytt, frigjør eller kasser, forbedre.'
  steps:
    - step: '01'
      title: Identifiser
      desc: 'Hver identifisert avvikelse registreres mot den berørte produktet, partiet eller komponenten og vurderes mot de gjeldende prosjektkravene. Detekteringen kan skje ved vareinngang, prosesskontroll, sluttinspeksjon, pakking eller ved kundens eller tredjeparts inspeksjon.'
    - step: '02'
      title: Blokker
      desc: 'Enhetene identifiseres tydelig og settes under kontrollert blokkerings- eller karantenesstatus for å hindre utilsiktet bruk, videre bearbeiding eller levering. Etikettene HOLD / QUARANTINE / REJECTED inneholder NCR-nummer, SKU, parti, antall, feilbeskrivelse og dato.'
    - step: '03'
      title: Verifiser
      desc: 'Det berørte omfanget og riktig tiltak vurderes: én enhet, et skiftparti, et helt parti eller flere partier — via felles materialpartier, grafikkrevusjoner, prosessfaser og dokumentrevisjoner. Ved behov iverksettes ytterligere avgrensning eller forsterket inspeksjon.'
    - step: '04'
      title: Omtillverk eller bytt ut
      desc: 'Tillatt omtillverkning skjer etter godkjente instruksjoner som identifiserer den berørte enheten, metoden, materialene, kontrollpunktene og kravene til reverifisering. Uautorisert endring av produktspesifikasjon, grafikk, tilbehørskonfigurasjon eller emballasje er aldri tillatt. Erstatningsenheter omfattes av de gjeldende inspeksjonsportene.'
    - step: '05'
      title: Kontroller på nytt
      desc: 'Omtillverkede eller korrigerte enheter inspiseres på nytt mot de gjeldende akseptkriteriene. Den opprinnelige feilen og alle tilhørende egenskaper som kan ha blitt påvirket av omtillverkningen verifiseres før frigjøringen — av uavhengig QC og, for lufttetthetsreparasjoner, med en fullstendig 24-timers trykkeprøvesyklus.'
    - step: '06'
      title: Frigjør eller kasser
      desc: 'Produktet frigjøres først når den krevde reverifiseringen er fullført og autorisert kvalitetspersonell bekrefter samsvar med de gjeldende prosjektkravene. Enheter som ikke kan bringes til samsvar kasseres, byttes ut, returneres eller håndteres etter kontrollerte prosedyrer — inkludert overvåket fysisk destruksjon.'
    - step: '07'
      title: Korrigerende tiltak
      desc: 'Gjentakende, vesentlige eller systematiske avvikelser undersøkes med hensyn til årsak og korrigerende tiltak (CAPA). Forbedringer kan omfatte oppdateringer av arbeidsinstruksjoner, materialkontroller, kontrollpunkter, opplæring, leverandørhåndtering eller dokumenthåndtering.'

