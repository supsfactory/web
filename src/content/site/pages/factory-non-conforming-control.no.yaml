answer:
  label: 'Tydelig svar'
  text: 'Ikke-samsvarlende produkter skjules aldri, omtillverkes uformelt eller frigjøres uten verifisering hos QINGDAO VATRAD GROUP.,LTD. Hver identifisert avvikelse registreres mot den berørte produktet, partiet eller komponenten og kobles til et NCR. Enheten merkes (HOLD / QUARANTINE / REJECTED), skilles fysisk ut, og det berørte omfanget vurderes per parti, materialparti, prosessfase og dokumentrevisjon. Beslutningen tas på det myndighetsnivå som tilsvarer feilens alvorlighetsgrad: mindre problemer signeres på linjenivå, alvorlige problemer krever en beslutning fra QC-sjefen og teknisk ingeniør med kontrollert omtillverkningsinstruksjon og uavhengig reverifisering på 100 %, og kritiske problemer krever en beslutning fra Material Review Board med kundens skriftlige samtykke der dette kreves — ellers obligatorisk overvåket destruksjon. Omtillverkede enheter reverifiseres mot de opprinnelige akseptkriteriene, lufttetthetsreparasjoner får en fullstendig ny trykkeprøvesyklus, og frigjøring før levering skjer først etter autorisert kvalifisering. Gjentakende eller systematiske problemer aktiverer rotorsaksanalyse og korrigerende tiltak (CAPA).'
  verified: 'September 2026'

