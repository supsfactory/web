content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p>Każda ścieżka w tej macierzy zaczyna się od tych samych dwóch elementów: naszego <a href="/pl/oem-manufacturing">programu produkcji OEM/ODM</a> i <a href="/pl/factory">stojącej za nim fabryki</a> — jednego zakładu o powierzchni 12,500 m&sup2;, jednego zestawu standardów jakości i obsługi każdego kanału.</p>
  </div>
