  text: 'Distribuitorii și mărcile lucrează direct cu fabrica: plăci SUP white-label produse sub marca dumneavoastră, prețuri en-gros direct de la fabrică, teritoriu exclusiv pentru fiecare program, 3–8 SKU-uri pentru pornire și termene de plată de 45–60 de zile (toate sub rezerva unui acord comercial), cu 100% din stoc testat la presiune înainte de expediție. Volumele minime de pornire și condițiile de transport se stabilesc de comun acord pentru fiecare teritoriu, cu livrare FOB Qingdao sau CIF.'
