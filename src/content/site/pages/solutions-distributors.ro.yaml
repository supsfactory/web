faqs:
  tagline: Întrebări frecvente pentru distribuitori
  title: 'Programul de distribuție en-gros — întrebări frecvente'
  items:
    - q: 'Care este comanda minimă pentru un distribuitor nou?'
      a: 'Partenerii noi de distribuție pornesc, de regulă, cu o comandă de mostre și de aprobare a preproduției, urmată de un prim container programat pentru sezonul lor. Minimele exacte depind de dimensiunea teritoriului și de gama aleasă; managerul dumneavoastră de cont confirmă volumul de pornire în etapa de planificare a gamei și a brandingului.'
    - q: 'Putem vinde plăcile sub marca noastră proprie?'
      a: 'Da. Private label este modelul standard aici: plăcile sunt produse sub marca dumneavoastră, cu grafica, ambalajul și specificațiile dumneavoastră. iSupfactory produce exclusiv pentru clienții săi și nu concurează cu ei pe nicio piață.'
    - q: 'Teritoriile sunt exclusive?'
      a: 'Da. Programele de distribuitor se bazează pe teritorii exclusive — fiecare partener en-gros acoperă o țară sau o regiune definită și beneficiază de prețuri și de suport de program pentru acea piață, conform prevederilor acordului comercial.'
    - q: 'Oferiți suport pentru livrări drop-ship?'
      a: 'Capabilitatea drop-ship este inclusă în program. Mostrele, ambalajul și manipularea sunt validate în etapa de aprobare a mostrelor, astfel încât comenzile drop-ship să fie executate fără probleme încă de la început.'
    - q: 'Ce modele putem comanda?'
      a: 'Catalogul de producție cuprinde plăci SUP gonflabile cu forme all-around, de tură și de surf, kayacuri gonflabile, pompe, vâsle, salvete și accesorii de îngrijire, plus forme personalizate dezvoltate împreună cu echipa noastră de inginerie. Majoritatea partenerilor pornesc cu 4–8 SKU-uri cu cea mai bună vânzare și se extind în sezoanele următoare.'
    - q: 'Cum se expediază comenzile?'
      a: 'Comenzile pleacă din fabrică pe plecări programate, cu posibilitatea de a comanda în avans pentru a stabiliza costurile de transport. Managerul dumneavoastră de cont dedicat planifică producția și expediția în funcție de previziuni și de calendarul sezonului.'
    - q: 'Cum aplic?'
      a: 'Folosiți formularul de aplicație de pe această pagină sau contactați-ne direct. Aplicațiile sunt analizate de echipa de distribuție și răspundem cu pașii următori, inclusiv cartografierea teritoriului și o variantă de acord, în câteva zile lucrătoare.'

