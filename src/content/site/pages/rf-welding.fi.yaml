  text: 'Käytämme 15 kW:n dielektrisiä RF-puristimia, jotka sitovat PVC-saumat molekulaarisesti 200–600 °C:n kuumailmaekvivalentissa, ja validoimme sitten jokaisen hitsin: kuorimistestit ASTM D751:n mukaisesti, ilman säilymisen testit 18.0 PSI:n paineella, ja saumat dokumentoidaan sekä jäljitetään lauta kohti.'
