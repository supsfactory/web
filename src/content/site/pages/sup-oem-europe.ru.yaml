why_europe:
  tagline: 'Почему покупатели в Европе'
  title: 'Создано для импорта в Европу'
  subtitle: 'Завод отвечает на вопросы, которые европейские бренды задают до получения первого контейнера — и в первую очередь на вопрос сертификации.'
  items:
    - title: 'Документация по CE и REACH'
      description: 'Утвержденный образец отгружается с документацией по CE и REACH, подготовленной для рынка ЕС, поэтому ваше техническое досье и таможенные документы готовы еще до прибытия контейнера.'
    - title: 'DDP для предсказуемой конечной стоимости'
      description: 'DDP включает таможенное оформление, пошлины, налоги и доставку на ваш склад — одна итоговая цена от двери до двери по всему ЕС.'
    - title: 'FOB Циндао с вашим экспедитором'
      description: 'Регулярно импортируете? Возьмите FOB Циндао и работайте со своим логистическим партнером — мы загружаем и документируем контейнер, а остальное под вашим контролем.'
    - title: 'Один завод, одна система качества'
      description: 'Разработка, изготовление образцов, производство и QC происходят на одной площадке 12,500 m² — утвержденный вами образец и есть продукт, который вы получите.'

process_notes:
  tagline: 'Как это работает'
  title: 'От спецификации до контейнера'
  subtitle: 'Одни и те же шесть этапов независимо от того, покупаете ли вы два контейнера в год или двадцать: спецификация, инженерная разработка, образцы, испытания, оснастка, производство — затем доставка FOB, CIF или DDP.'
  items:
    - title: '1. Отправьте спецификацию'
      description: 'Достаточно референсной доски, эскиза или спецификации конкурента. Инженерная проверка и коммерческое предложение возвращаются в течение одного рабочего дня.'
    - title: '2. Утвердите образец'
      description: 'Ваш первый физический образец отгружается за 7–12 дней с листом утверждения, охватывающим конструкцию, цвета печати и результаты испытания давлением.'
    - title: '3. Производство и экспорт'
      description: 'Партии завершаются за 25–35 дней с контрольными точками QC в процессе. Упаковочный лист, счет-фактура и коносамент отправляются до выхода судна.'
    - title: '4. Доставка на ваш склад'
      description: '4–6 недель морской доставки в Роттердам или Гамбург — на условиях DDP мы берем на себя оформление и доставку до ваших дверей.'

faq_section:
  tagline: FAQ
  title: 'Вопросы об импорте в Европу'
  questions:
    - q: Входит ли документация по CE в мой заказ?
      a: 'Да. Документация по CE и REACH готовится для рынка ЕС вместе с вашим утвержденным образцом, до начала производства — документы отправляются вместе с контейнером.'
    - q: Сколько занимает морская доставка в Европу?
      a: 'Заложите 4–6 недель от порта Циндао до Роттердама или Гамбурга в зависимости от расписания рейсов. Проекты DDP включают полный срок от двери до двери.'
    - q: Вы отгружаете DDP в страны ЕС?
      a: 'Да. DDP включает морской фрахт, таможенное оформление, пошлины и налоги, а также доставку на ваш склад — одна предсказуемая итоговая цена. Также доступны FOB Циндао и CIF.'
    - q: Каков MOQ для импорта SUP под собственным брендом?
      a: 'MOQ подтверждается конфигурацией проекта: разработка образца охватывает 1–2 единицы, пилотные партии выполняются в объеме 20–50 единиц на существующих платформах, а стандартное серийное производство — 90–100+ единиц на каждый дизайн из полного 150 m рулона drop stitch.'
    - q: Какие документы вы предоставляете для импорта?
      a: 'Утвержденный образец отгружается с документацией по CE и REACH, подготовленной для вашего целевого рынка, а каждый контейнер сопровождается упаковочным листом, счет-фактурой и коносаментом.'
    - q: Как начать проект из Европы?
      a: 'Отправьте референсную доску, эскиз или спецификацию. Инженерная проверка и коммерческое предложение возвращаются в течение одного рабочего дня, а NDA подписывается до обмена файлами.'

