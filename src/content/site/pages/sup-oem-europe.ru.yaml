answer:
  label: 'Прямой ответ'
  text: 'Европейские бренды заказывают надувные SUP у iSupfactory на стандартных условиях: MOQ подтверждается конфигурацией проекта: образцы 1–2 единицы подтверждают конструкцию, пилотные партии 20–50 единиц тестируют рынок на существующих платформах, а стандартное серийное производство выполняется тиражами 90–100+ единиц на каждый дизайн из полного 150 m рулона drop stitch. Первый образец отгружается через 7–12 дней после утверждения спецификации, производство занимает 25–35 дней после подтвержденного PO и задатка, а морская доставка добавляет 4–6 недель до Роттердама или Гамбурга. Документация по CE и REACH готовится вместе с утвержденным образцом, а DDP покрывает таможенное оформление и доставку на ваш склад.'
