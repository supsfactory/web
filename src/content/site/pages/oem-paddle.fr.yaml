faqs:
  title: 'FAQ sur la production de pagaies OEM'
  subtitle: 'Réponses aux questions les plus courantes des marques qui lancent leur propre pagaie.'
  items:
    - title: 'Comment créer ma propre marque de pagaie ?'
      description: 'Lancez votre marque : brief, design, prototype certifié CE, production de masse et livraison. Échantillons en 7–12 jours, production en 25–35 jours à partir du bon de commande et de l''acompte. Explorez nos packs OEM.'
    - title: 'Quel est le délai de production ?'
      description: 'L''échantillon est prêt en 7–12 jours, la production en gros en 25–35 jours après le bon de commande et l''acompte selon le volume.'
    - title: 'La pagaie porte-t-elle notre logo ?'
      description: 'Oui — marque privée complète : impression du logo, couleurs personnalisées, emballage et étiquettes à votre marque.'
    - title: 'Puis-je acheter en gros dès le premier jour ?'
      description: 'Le MOQ est confirmé par la configuration du projet — échantillon (1–2 unités), pilote (20–50 unités) et volume standard (90–100+ unités par lot), avec des paliers de tarification gros à mesure que le volume augmente.'

