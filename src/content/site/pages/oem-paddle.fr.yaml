answer:
  label: 'Réponse directe'
  text: 'La quantité minimale de commande est confirmée par la configuration du projet : échantillon (1–2 unités), pilote (20–50 unités) et volume standard (90–100+ unités par lot à partir d''un rouleau de drop-stitch de 150 m), avec co-marquage en petits lots dès 5–10 unités. Les échantillons partent en 7–12 jours ; la production en gros s''exécute en 25–35 jours après bon de commande et acompte. Certification CE pour les modèles destinés au marché de l''UE et documentation de conformité complète incluse avec chaque commande.'
  verified: '2026-08'
  image:
    src: https://assets.afarer.com/images/afarer/products/sup-series/sup-medusa-glow-1.webp
