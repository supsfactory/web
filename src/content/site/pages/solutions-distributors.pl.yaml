faqs:
  tagline: 'FAQ dystrybutora'
  title: 'Program dystrybucji hurtowej — najczęściej zadawane pytania'
  items:
    - q: 'Jaki jest minimalne zamówienie dla nowego dystrybutora?'
      a: 'Nowi partnerzy dystrybucyjni zwykle zaczynają od zamówienia próbek i akceptacji przedprodukcji, a następnie od pierwszego kontenera zaplanowanego na ich sezon. Dokładne minima zależą od wielkości terytorium i wybranego asortymentu; Twój opiekun konta potwierdza wolumen startowy podczas planowania asortymentu i brandingu.'
    - q: 'Czy możemy sprzedawać deski pod własną marką?'
      a: 'Tak. Private label to tutaj standardowy model: deski są produkowane pod Twoją marką, z Twoją grafiką, opakowaniem i specyfikacjami. iSupfactory produkuje wyłącznie na rzecz swoich klientów i nie konkuruje z nimi na żadnym rynku.'
    - q: 'Czy terytoria są ekskluzywne?'
      a: 'Tak. Programy dystrybucyjne opierają się na ekskluzywnych terytoriach — każdy partner hurtowy obsługuje określony kraj lub region i otrzymuje cennik oraz wsparcie programu dla tego rynku, zgodnie z umową handlową.'
    - q: 'Czy wspieracie dropshipping?'
      a: 'Możliwość dropshippingu jest wbudowana w program. Próbki, opakowanie i obsługa są walidowane na etapie akceptacji próbek, aby zamówienia dropshippingowe przebiegały sprawnie od pierwszego dnia.'
    - q: 'Jakie modele możemy zamawiać?'
      a: 'Katalog produkcyjny obejmuje nadmuchiwane deski SUP o kształtach uniwersalnych, turystycznych i surfingowych, nadmuchiwane kajaki, pompki, wiosła, kamizelki ratunkowe i akcesoria do pielęgnacji, a także niestandardowe kształty opracowane z naszym zespołem inżynierskim. Większość partnerów zaczyna od 4–8 najlepiej sprzedających się SKU i rozwija asortyment w kolejnych sezonach.'
    - q: 'Jak wysyłane są zamówienia?'
      a: 'Zamówienia opuszczają fabrykę kursami według ustalonego harmonogramu, a zamówienia z wyprzedzeniem są dostępne w celu ustabilizowania kosztów transportu. Twój dedykowany opiekun konta planuje produkcję i wysyłkę wokół Twojej prognozy i kalendarza sezonów.'
    - q: 'Jak się zgłosić?'
      a: 'Użyj formularza aplikacyjnego na tej stronie lub skontaktuj się z nami bezpośrednio. Wnioski są oceniane przez zespół dystrybucji, a w ciągu kilku dni roboczych odpowiadamy z kolejnymi krokami, w tym mapowaniem terytorium i projektem umowy.'

