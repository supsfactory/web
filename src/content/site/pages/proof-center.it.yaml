traceability:
  tagline: 'Un lotto, tracciato dal rotolo alla tavola'
  title: 'Come appare davvero la tracciabilità'
  body: |
    A ogni lotto viene assegnato un **codice lotto ERP di 10 anni**. La catena registrata sotto un lotto:

    - **Rotolo in ingresso** — certificato del materiale, numero del rotolo, partita di tessuto verificata (trazione, taglio, saldatura)
    - **Taglio** — ordine di nesting CNC rispetto al file di design, percentuale di scarto registrata
    - **Saldatura & laminazione** — linea, operatore, parametri macchina per camera
    - **Assemblaggio** — numero di serie della tavola, tipo di valvola, lotto del deck pad
    - **Test** — 18,0 PSI × 24 h di tenuta per camera, scarto automatico oltre 0,50 PSI di caduta
    - **Rilascio** — checklist a 100 punti per tavola, rilascio del Direttore QA per lotto
    - **Avanti** — certificato di conformità (Certificate of Conformance) con la consegna; diritto di audit riservato contrattualmente

    Richiedi il protocollo QC di esempio prima del tuo primo ordine — ha lo stesso formato che riceverai con la consegna.

faqs:
  tagline: 'FAQ'
  title: 'Domande sulle prove che gli acquirenti pongono'
  items:
    - q: 'Questa pagina serve solo alla verifica e non sostituisce la due diligence?'
      a: 'Esatto — questa pagina mostra dove ogni affermazione può essere verificata: registrazione dell''entità, certificati, macchine, registrazioni e un impianto aperto agli audit. I tuoi consueti passaggi di due diligence (verifica della registrazione, audit, ispezione di terze parti) restano validi e sono benvenuti.'
    - q: 'Quale entità deve comparire sulla mia documentazione d''ordine?'
      a: 'Gli ordini vengono conclusi con la Qingdao Vatrad Group Co., Ltd., che opera come Vatrad (divisione di produzione), con iSupfactory come linea prodotto SUP. I documenti contrattuali vengono firmati dal VP Vendite, dall''ingegnere capo e dal Direttore QA.'
    - q: 'Posso ricevere copie dei certificati prima dell''ordine?'
      a: 'Sì — i numeri di certificato e i documenti di audit vengono forniti su richiesta o durante un audit. L''elenco è pubblicato, mai "disponibile solo su richiesta".'
    - q: 'Come posso verificare da solo i protocolli di test dei lotti?'
      a: 'Ogni camera viene testata per 24 ore a 18,0 PSI con scarto automatico oltre 0,50 PSI di caduta; i protocolli di test sono collegati ai numeri di serie e viaggiano con il certificato di conformità di ogni lotto. Un''ispezione pre-spedizione SGS, TÜV, BV o Intertek secondo ISO 2859-1 Livello II può essere programmata a tua scelta.'
    - q: 'I certificati coprono anche gli accessori?'
      a: 'La documentazione materiali REACH/RoHS vale per tavole e accessori dello stesso ordine e le checklist QC coprono il kit completo — tavola, pagaia, pompa, leash e borsa.'
    - q: 'Cosa succede alle prove dopo l''ordine?'
      a: 'La tracciabilità ERP dei lotti viene conservata per 10 anni. Le SOP QMS e gli standard di prova restano scaricabili e l''acquirente mantiene contrattualmente un diritto di audit durante la produzione.'

