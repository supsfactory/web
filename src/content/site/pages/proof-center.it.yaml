hero:
  tagline: 'Hub delle prove di fabbrica'
  title: 'Proof Center — tutto ciò che affermiamo è archiviato qui'
  subtitle: 'Una pagina che associa ogni affermazione di questo sito alla sua prova: l''entità registrata dietro la fabbrica, i certificati con ambito di applicazione, le macchine che svolgono il lavoro e le registrazioni di lotto che sopravvivono a ogni run di produzione.'
