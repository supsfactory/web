answer:
  label: 'Risposta breve'
  text: 'La catena da affermazione a prova funziona così: ogni affermazione di questo sito si basa su una registrazione, un certificato, una macchina, un documento o un protocollo di test — e ognuno di questi può essere consultato. iSupfactory è la divisione di sviluppo prodotto e produzione SUP della Qingdao Vatrad Group Co., Ltd. (registrata a Qingdao dal 2012). L''impianto di 12,500 m² dispone di gestione qualità ISO-9001:2015, conformità ISO-25649, documentazione di conformità CE, conformità sociale BSCI (rapporto di audit su richiesta) e documentazione materiali REACH/RoHS per ogni ordine. Ogni camera gonfiabile viene testata per 24 ore a 18,0 PSI con scarto automatico oltre 0,50 PSI di caduta e le registrazioni di lotto vengono conservate con tracciabilità ERP di 10 anni. Il percorso cartaceo è pubblicato o condivisibile e la fabbrica stessa è aperta agli audit.'
  verified: 'September 2026'

