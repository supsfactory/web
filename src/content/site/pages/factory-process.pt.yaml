  tagline: Processo
  title: Processo de produção
  subtitle: Da matéria-prima ao SUP pronto para a água — cada passo sob o nosso controlo
  back_label: Voltar à fábrica
  back_link: /factory

answer:
  label: 'Resposta clara'
  text: 'As pranchas passam por cinco fases controladas: controlo dos materiais (1–2 dias), corte CNC automático (<5% de refugo, 2–4 horas por kit), termosoldadura das câmaras com costuras reforçadas em RF (1–2 dias por prancha), colagem do núcleo drop-stitch e montagem final com teste de retenção de ar e de carga a 100% antes da embalagem.'
  verified: 'September 2026'

intro: Ao contrário das marcas que subcontratam a produção a fábricas terceiras, a Vatrad é dona e gere toda a cadeia produtiva. Esta integração vertical permite-nos manter um controlo de qualidade rigoroso em cada fase, responder rapidamente aos requisitos personalizados dos clientes e garantir uma qualidade de produto constante partida após partida. Eis como é construída uma prancha SUP nas nossas instalações.

steps:
  - step: '01'
    title: Entrada de materiais & controlo
    description: Cada partida de entrada de tecido PVC, esteira em fibra de vidro, resina e encaixes é controlada contra a especificação. As amostras de tecido são testadas quanto à resistência à tração, uniformidade da espessura e resistência aos raios UV antes da libertação para a produção. Os materiais não conformes são bloqueados e devolvidos.
    duration: 1–2 dias
  - step: '02'
    title: Corte PVC automático
    description: <p>Os tecidos libertados são estendidos na cortadeira CNC automática e cortados com precisão submilimétrica. O aninhamento otimizado por computador organiza os painéis para minimizar os refugos — tipicamente abaixo de 5%. Os painéis cortados são etiquetados por modelo SUP e câmara, depois agrupados e transferidos para a oficina de soldadura.</p>
    duration: 2–4 horas por kit de prancha
  - step: '03'
    title: Termosoldadura & soldadura de câmaras
    description: Os painéis são alinhavados e unidos com termosoldadoras a temperaturas de ar quente controladas entre 200–300 °C. As costuras principais são reforçadas com soldadura dieletrica RF para junções estanques e de alta resistência. As câmaras acabadas são infladas a 18.0 PSI para a manutenção de 24 horas como primeiro controlo de estanquicidade ao ar.
    duration: 1–2 dias por SUP
  - step: '04'
    title: Colagem do núcleo drop-stitch
    description: Os núcleos drop-stitch das pranchas SUP são colados aos laminados exteriores em PVC através de laminação a quente. Milhares de fios internos em poliéster ligam as camadas superior e inferior, criando uma estrutura rígida a 12-15 PSI. Os rail bands são colados por fusão em três camadas para a resistência dos bordos.
    duration: 1–2 dias por prancha
  - step: '05'
    title: Impressão & decoração SUP
    description: As gráficas do deck das pranchas SUP são aplicadas através de impressão digital para designs fotorrealistas a cores plenas e serigrafia para logótipos duráveis e padrões repetidos. As impressões são polimerizadas e seladas para a resistência a UV e abrasão.
    duration: 1–2 dias
  - step: '06'
    title: Montagem final & equipamento
    description: Válvulas, anéis em D, pegas, fin box e deck pads são instalados na linha de montagem. Cada prancha segue uma checklist de montagem de 100 pontos com libertação vinculativa em cada fase.
    duration: 1–2 dias
  - step: '07'
    title: Controlo de qualidade & inspeção
    description: 'Cada prancha concluída passa por um gate de qualidade vinculativo: teste de retenção de ar da câmara, prova funcional dos encaixes, verificação do aperto e inspeção estética. As construções personalizadas e os protótipos recebem ainda provas em água, que cobrem estabilidade e manobrabilidade.'
    duration: 1–2 dias
  - step: '08'
    title: Embalagem & envio
    description: As pranchas são desinfladas, dobradas segundo procedimento, embaladas em sacos de tecido resistente ou cartões comerciais e carregadas para o envio. Cada pacote é etiquetado com o modelo, o número de série e o destino. Coordenamos com os transitários o transporte em contentores FCL e LCL para todo o mundo.
    duration: 1 dia

evidence_gates:
  tagline: Evidências de inspeção
  title: 'Cada fase deixa uma evidência — fotos & relatórios'
  subtitle: 'Abaixo encontras as fotos de inspeção reais e os dossiers dos relatórios de ensaio dos nossos sete gates de qualidade controlados. Cada PDF é um documento bilingue autêntico que podes descarregar e auditar — os mesmos registos que suportam cada partida no arquivo de rastreabilidade ERP de 10 anos. Vê o fluxo completo em 7 fases em /quality.'
  items:
    - title: 'PPM — Planeamento de qualidade do projeto'
      description: 'A reunião de pré-série fixa o âmbito, o golden sample e o plano de inspeção de qualidade antes de a linha arrancar. Os pontos por resolver bloqueiam a libertação da produção.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Descarregar o QIP (PDF)'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: Reunião de pré-série para verificar o golden sample e o plano de inspeção de qualidade de uma encomenda SUP OEM
    - title: 'IQC — Controlo de entrada de mercadorias'
      description: 'Cada partida de entrada de PVC, tecido e encaixes é controlada contra a especificação libertada. As partidas não conformes são bloqueadas e rejeitadas antes da libertação para a linha.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios IQC (PDF)'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Controlo de entrada de mercadorias de tecido PVC e componentes SUP na fábrica
    - title: 'IPQC / FAI — Controlo de processo'
      description: 'O primeiro exemplar é verificado contra as baselines bloqueadas e cada turno mantém os controlos por amostragem na linha. A libertação FAI bloqueia as versões de gráficas, dimensões e BOM.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios IPQC (PDF)'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Inspeção de processo e verificação do primeiro exemplar durante a produção SUP
    - title: 'Prova de inflagem & estanquicidade ao ar'
      description: '100% das pranchas acabadas — não apenas uma amostra — recebem uma manutenção de pressão de 24 horas a 18.0 PSI com exclusão automática para além de uma queda de 0,50 PSI. Uma evidência por câmara.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios de estanquicidade ao ar (PDF)'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Prova de inflagem e estanquicidade ao ar de uma câmara de SUP insuflável
    - title: 'FQC — Controlo do produto final'
      description: 'As pranchas acabadas são medidas contra as tolerâncias do desenho e avaliadas visualmente sob lâmpadas de luz diurna D65 contra o golden sample libertado.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios FQC (PDF)'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Controlo do produto final das pranchas SUP acabadas antes da embalagem
    - title: 'PSI — Inspeção pré-envio de embalagem'
      description: 'O kit embalado é verificado a 100% contra a BOM aprovada pelo cliente — leitura do código de barras (nota ≥ B), marcações da caixa e teste de queda ISTA-1A antes da carga.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descarregar os relatórios PSI (PDF)'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Inspeção pré-envio a verificar o kit SUP embalado contra a BOM
    - title: 'Libertação para envio & rastreabilidade'
      description: 'A Qualidade liberta a partida apenas quando os seis gates anteriores estão fechados. Os números de série são atribuídos à partida e o dossier é entregue com o envio.'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descarregar os relatórios de libertação (PDF)'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Assinatura da libertação para envio e entrega do protocolo de rastreabilidade da partida
