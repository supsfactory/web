hero:
  tagline: 'Fremstilling, du kan verificere'
  title: 'OEM-tillid og fabriksverifikation'
  subtitle: 'Enhver påstand på denne side kan verificeres: officiel virksomhedsregistrering, et fysisk anlæg på 12,500 m², du kan besøge eller auditere, rigtige ingeniører under NDA, QMS-dokumenter, du kan hente ned, og testdata registreret pr. serienummer. Udviklet og drevet af Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Det korte svar'
  text: 'Tillid er ikke et løfte — det er dokumentation. Vi er en registreret kinesisk produktionsenhed (Qingdao Vatrad Group Co., Ltd.) med et fysisk anlæg på 12,500 m² i Qingdao, 350+ ansatte og en årlig kapacitet på 120,000+ brætter. Du kan verificere registreringen, auditere fabrikken, gennemgå QMS-SOP’er, hente eksempler på kvalitetsdokumentation, bestille tredjepartsinspektioner (SGS, TÜV, BV eller Intertek) og få underskrevet en NDA inden for 4 arbejdstimer. Ethvert bræt trykprøves ved 18.0 PSI i 24 timer med automatisk kassering ved et fald på over 0.50 PSI, og hvert parti har 10 års ERP-sporbarhed. Hvis en påstand ikke kan dokumenteres, fremsætter vi den ikke.'
  verified: 'September 2026'

