trust_steps:
  tagline: 'Et rigtigt casestudie'
  title: 'Sådan verificerede en nordisk udlejningsflåde os, før den bestilte'
  subtitle: 'Syv verificeringstrin, som en kommerciel udlejningsaktør gennemførte, før den afgav en ordre på 90–100+ enheder — samme tjekliste står åben for dig.'
  steps:
    - step: '01'
      title: 'Verifikation af den officielle enhed'
      desc: 'Køberen bad om den kinesiske virksomhedsregistrering og eksporthandelslicensen. Den juridiske enhed bag iSupfactory er Qingdao Vatrad Group Co., Ltd., en producent registreret siden 2012 i Qingdao, Shandong — verificeret i det nationale register under NDA.'
    - step: '02'
      title: 'Fysisk fabrik og audit af arealet'
      desc: 'En fabriksaudit (fysisk fremmøde og via videovandring) bekræftede anlægget på 12,500 m²: fire specialiserede værksteder, 350+ ansatte, fire automatiserede linjer og en månedsproduktion på ca. 10,000 brætter. Auditrapporten arkiveres sammen med kontraktpapirerne.'
    - step: '03'
      title: 'Mennesker: rigtige ingeniører, ikke salgstekster'
      desc: 'Køberen talte direkte med ingeniørteamet — skrogdesign, materialelaboratorium og QC. Projektspecifikation og NDA blev udvekslet inden for 4 arbejdstimer, og en ingeniørgennemgang kom retur inden for en arbejdsdag.'
    - step: '04'
      title: 'Papirer: QMS, certifikater og tredjepartsinspektion'
      desc: 'ISO 9001:2015, ISO 25649 og CE-dokumentation for overensstemmelse samt BSCI/REACH/RoHS-registreringer og QMS-SOP’er blev gennemgået. Køberen bestilte en SGS-forhåndsinspektion i henhold til ISO 2859-1 Level II på den første volumenordre — og modtog et overensstemmelsescertifikat for hvert parti.'
    - step: '05'
      title: 'Data: testregistreringer pr. serienummer'
      desc: 'Køberen auditerede faktiske testregistreringer: hvert kammer testet ved 18.0 PSI i 24 timer med automatisk kassering ved et trykfald på over 0.50 PSI, tjeklister med 100 punkter for montagen og 10 års ERP-sporing af partier. Eksempler på QC-registreringer blev leveret inden ordren.'
    - step: '06'
      title: 'Beskyttelse i kontrakten'
      desc: 'Ordrekontrakten dækkede licensering af mærket, en aftalt periode med eksklusivitet på et område, ejerskab af og købsret til formene samt hvilke data og registreringer der følger med værktøjet. Køberen godkendte formen på fabrikken inden produktionen.'
    - step: '07'
      title: 'Løbende styring'
      desc: 'Kvartalsvise forretningsgennemgange med salgsdirektøren og chief ingeniøren, en reserveret ret til at auditere under produktionen og en eskaleringsvej til QA-chefen ved kvalitetsstridigheder. Aftalen blev underskrevet i fællesskab af salgsdirektøren, chief ingeniøren og QA-chefen.'

trust_faqs:
  tagline: 'FAQ'
  title: 'De 12 bekymringer, købere har, før de bestiller'
  items:
    - q: 'Er iSupfactory virkelig en fabrik eller et handelsselskab?'
      a: 'iSupfactory er SUP-produktudviklings- og produktionsafdelingen i Qingdao Vatrad Group Co., Ltd. Vi driver selv anlægget på 12,500 m² i Qingdao — design, skæring, svejsning, montering og test sker i en facilitet. Der er ingen overdragelse via handelsselskab: de mennesker, der besvarer dine spørgsmål, er dem, der bygger dine brætter.'
    - q: 'Hvem præcist kommer jeg i kontakt med under mit projekt?'
      a: 'En navngiven projektingeniør og en navngiven QC-kontakt samt de afdelingsledere, der underskriver dine dokumenter. Du kan bede om at tale direkte med chief ingeniøren, QA-chefen eller fabrikdirektøren — både før og efter ordren. Der ligger intet kontolag mellem dig og dem, der udfører arbejdet.'
    - q: 'Kan jeg besøge eller auditere fabrikken?'
      a: 'Ja. Vi tager imod fabriksbesøg i Laixi Economic Development Zone, Qingdao, og støtter fjernaudits med direkte videovandringer. Audits kan arrangeres uafhængigt (din inspektør eller en tredjepart som SGS, TÜV, BV eller Intertek), og auditplanen kan skrives ind i kontrakten.'
    - q: 'Underskriver I en NDA, før jeg deler mit design?'
      a: 'Ja. Vores standard-NDA underskrives inden for 4 arbejdstimer efter din anmodning og før nogen proprietær specifikation, artwork eller teknisk fil deles. To-sprogete versioner (engelsk/kinesisk) er tilgængelige, og dokumentet modunderskrives af fabrikdirektøren.'
    - q: 'Hvordan ved jeg, at jeres kvalitetspåstande er reelle?'
      a: 'Enhver påstand på denne side har et dokument bag sig: QMS-SOP’er og inspektionsstandarder kan downloades, anonymiserede eksempler på kvalitetsregistreringer er offentliggjort, og testdata logges pr. serienummer med 10 års ERP-sporing af partier. Du kan også bestille en tredjepartsinspektion før afsendelse efter dit ønske.'
    - q: 'Hvad sker der, hvis mine brætter ankommer med fejl?'
      a: 'Ethvert bræt testes før pakning, og registreringer på partiniveau gør det muligt at spore årsagen pr. serienummer. Kontrakten fastlægger forpligtelser vedrørende inspektion, udskiftning og oparbejdning, og QA-chefen underskriver partigodkendelsen. Oparbejdede brætter testes på nytt i fuld udstrækning — aldrig kun delvist kontrolleret.'
    - q: 'Kan I virkelig teste 100 % af brætterne før afsendelse?'
      a: 'Ja — og registreringerne dokumenterer det. Ethvert kammer pustes op til 18.0 PSI og holdes i 24 timer med kontinuerlig sensorlogning; ethvert kammer, der overstiger et trykfald på 0.50 PSI over 24 timer, kasseres automatisk og inspiceres igen. Testloggene er koblet til hvert serienummer og er en del af partedokumentationen.'
    - q: 'Hvilke certificeringer har I faktisk?'
      a: 'ISO 9001:2015 kvalitetsstyring, ISO 25649 og CE-overensstemmelse for oppustelige SUP-produkter samt BSCI-, REACH- og RoHS-overensstemmelse for faciliteten og materialerne. Certifikatnumre og auditregistreringer leveres på forespørgsel eller ved en audit — listen er offentliggjort, ikke "kun tilgængelig på forespørgsel".'
    - q: 'Er mit mærke i sikkerhed — design, forme og marked?'
      a: 'Ja. Dit mærke, dine designs og dit værktøj beskyttes af NDA, licensbetingelser for mærket samt klausuler om ejerskab af eller købsret til formene, som indgår i kontrakten. Værktøjet opbevares til mærkets gavn og kan overdrages. Område- og eksklusivitetsbetingelser aftales skriftligt, før produktionen starter.'
    - q: 'Hvad er jeres reelle minimumsordre (MOQ)?'
      a: 'MOQ er projektspecifik og forklaret i vores MOQ-guide: prøver 1–2 stk., co-branding i små partier 5–10 stk., pilotserier 20–50 stk. og standardvolumen 90–100+ stk. pr. 150 m rulle (cirka 180–220 brætter). Specialformer produceres på det relevante volumeniveau. Beregningen bekræftes, før der gives tilbud — ingen vage "lav MOQ"-tal.'
    - q: 'Hvad sker der, hvis produktionen er forsinket?'
      a: 'Leveringstiden bekræftes, efter at specifikation, artwork og emballage er gennemgået — aldrig lovet på forhånd. Kontrakten dækker tidsplan, varsel om forsinkelse og løsningsveje, og den kvartalsvise forretningsgennemgang følger leveringsperformance mod den aftalte kalender.'
    - q: 'Hvem underskriver kontraktpapirerne på jeres side?'
      a: 'Ordrer og aftaler underskrives i fællesskab af salgsdirektøren, chief ingeniøren og QA-chefen — de tre personer, der hver især er ansvarlige for kommercielle vilkår, teknisk udførelse og kvalitetsgodkendelse. Du modtager de underskrevne dokumenter sammen med kontraktpapirerne.'

governance:
  tagline: 'Ansvarsstruktur'
  title: 'Navngivne underskrivere og reserverede rettigheder'
  subtitle: 'Hver forpligtelse er knyttet til en navngiven rolle — ikke til en salgsafdeling.'
  body: |
    **Fælles godkendelse.** Ordrer, kvalitetsplaner og tvistløsninger underskrives af tre roller: salgsdirektøren (kommercielle vilkår), chief ingeniøren (teknisk udførelse) og QA-chefen (kvalitetsgodkendelse). Tosprogete SOP’er er versionsstyrede og har den samme underskriftsstruktur.

    **Reserverede rettigheder.** Køberen bevarer retten til at auditere produktionen, gennemgå testregistreringer og tilbageholde partigodkendelsen, indtil inspektionen er godkendt. Oparbejdning sker kun efter en godkendt ændringsregistrering, og godkendelsen valideres af uafhængig QC — aldrig af dem, der laver oparbejdningen.

    **Registreringer der følger med.** Batchtestlogge, overensstemmelsescertifikater og inspektionsrapporter leveres med hver forsendelse, og ERP-sporing af partier opbevares i 10 år. Værktøjsregistreringer og formtegninger følger med værktøjet, når kontrakten siger det.

