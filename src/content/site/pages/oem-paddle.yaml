  text: 'Minimum order quantity is confirmed by project configuration: sample (1–2 units), pilot (20–50 units) and standard volume (90–100+ units per batch from a 150 m drop-stitch roll), with small-batch co-branding from under 20 units. Samples ship in 7–12 days; bulk production runs 25–35 days after PO and deposit. CE certification and full compliance documentation included with every order.'
