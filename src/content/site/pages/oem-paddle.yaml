  title: 'OEM Paddle Production FAQ'
  subtitle: 'Answers to the most common questions from brands launching their own paddle.'
  items:
    - title: 'How do I create my own paddle brand?'
      description: 'Launch your brand: brief, design, CE-certified prototype, mass production, and delivery. Samples in 7–12 days, production in 25–35 days from PO and deposit. Explore our OEM packages.'
    - title: 'What is the production lead time?'
      description: 'The sample is ready in 7–12 days, bulk production in 25–35 days after PO and deposit depending on volume.'
    - title: 'Does the paddle carry our logo?'
      description: 'Yes — full private label: logo printing, custom colors, packaging, and labels in your brand.'
    - title: 'Can I buy in bulk from day one?'
      description: 'MOQ is confirmed by project configuration — sample (1–2 units), pilot (20–50 units) and standard volume (90–100+ units per batch), with wholesale pricing tiers as volume increases.'

