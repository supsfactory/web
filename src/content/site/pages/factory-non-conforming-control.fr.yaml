nc_intro:
  tagline: Contrôle des produits non conformes
  title: Que se passe-t-il quand un produit ne respecte pas les critères
  body: |
    Les produits ou composants qui ne respectent pas les critères d''acceptation définis sont identifiés et contrôlés pour empêcher toute utilisation involontaire, transformation ultérieure ou expédition. Les critères d''acceptation applicables sont basés sur l''échantillon approuvé, la spécification technique, les graphismes, la nomenclature (BOM), les exigences d''emballage et le plan d''inspection du projet.

    Les articles non conformes sont évalués pour déterminer le périmètre affecté et la disposition appropriée. Selon le problème, l''article peut être maintenu, repris sous instructions contrôlées, remplacé, rejeté ou autrement traité par un processus approuvé. Les articles repris ou corrigés sont ré-inspectés avant libération. L''autorisation d''expédition n''est permise qu''après la complétion des enregistrements qualité concernés et la conformité du produit aux critères d''acceptation applicables.

nc_flow:
  tagline: Boucle fermée standard en 7 étapes
  title: De l''identification à l''action corrective
  subtitle: 'Une boucle contrôlée pour chaque non-conformité : identifier, mettre en quarantaine, revoir, reprendre ou remplacer, ré-inspecter, libérer ou rejeter, améliorer.'
  steps:
    - step: '01'
      title: Identifier
      desc: 'Toute non-conformité identifiée est enregistrée contre le produit, le lot ou le composant affecté et évaluée par rapport aux exigences de projet applicables. La détection peut se produire à l''entrée des matières, au contrôle en cours de fabrication, au test final, au conditionnement ou à l''inspection client/tierce partie.'
    - step: '02'
      title: Mettre en quarantaine
      desc: 'Les articles sont clairement identifiés et placés sous statut de blocage ou de quarantaine contrôlé pour empêcher toute utilisation involontaire, transformation ultérieure ou expédition. Les étiquettes HOLD / QUARANTINE / REJECTED portent le numéro NCR, le SKU, le lot, la quantité, la description du défaut et la date.'
    - step: '03'
      title: Revoir
      desc: 'Le périmètre affecté et la disposition appropriée sont évalués : unité unique, lot d''équipe, lot complet ou plusieurs lots — entre les lots de matériaux partagés, les révisions de graphismes, les étapes de processus et les révisions de documents. Des mesures de confinement ou une inspection renforcée supplémentaires sont appliquées là où requis.'
    - step: '04'
      title: Reprendre ou remplacer
      desc: 'La reprise autorisée suit des instructions approuvées qui identifient l''article affecté, la méthode, les matériaux, les points d''inspection et les exigences de ré-inspection. Les modifications non approuvées de la spécification produit, des graphismes, de la configuration des accessoires ou de l''emballage ne sont jamais autorisées. Les articles de remplacement réintègrent les portes d''inspection applicables.'
    - step: '05'
      title: Ré-inspecter
      desc: 'Les articles repris ou corrigés sont ré-inspectés selon les critères d''acceptation applicables. La caractéristique ayant échoué à l''origine et toute caractéristique connexe potentiellement affectée par la reprise sont vérifiées avant libération — par une QC indépendante, avec un cycle complet de test de pression de 24 h neuf pour les réparations d''étanchéité à l''air.'
    - step: '06'
      title: Libérer ou rejeter
      desc: 'Le produit n''est libéré qu''après la complétion de la ré-inspection requise et la confirmation par un personnel qualité autorisé de la conformité aux exigences de projet applicables. Les articles qui ne peuvent pas être mis en conformité sont rejetés, remplacés, retournés ou dispositionnés sous procédures contrôlées — y compris la destruction physique attestée.'
    - step: '07'
      title: Action corrective
      desc: 'Les non-conformités répétées, significatives ou systémiques sont revues pour la cause racine et l''action corrective (CAPA). Les améliorations peuvent inclure des mises à jour des instructions de travail, des contrôles de matériaux, des points d''inspection, de la formation, de la gestion des fournisseurs ou du contrôle documentaire.'

nc_pillars:
  tagline: Piliers de confiance acheteur
  title: Trois contrôles qui protègent votre marque
  subtitle: 'Le processus est conçu autour des questions que les acheteurs internationaux posent réellement : les problèmes seront-ils cachés, la reprise échappera-t-elle au contrôle, et les planches réparées seront-elles re-vérifiées.'
  features:
    - icon: 1
      icon_bg: blue
      title: Instructions contrôlées uniquement
      desc: 'La reprise est strictement régie par des Instructions de Reprise Standard (SRI) autorisées. Les altérations de champ non approuvées, la modification des spécifications ou la modification des graphismes sans autorisation écrite sont strictement interdites.'
    - icon: 2
      icon_bg: green
      title: Ré-inspection indépendante
      desc: 'Les planches reprises subissent une ré-inspection à 100 % par les inspecteurs QA selon les critères d''acceptation d''origine. Les réparations d''étanchéité à l''air exigent un cycle complet de test de pression neuf de 24 h — jamais un re-contrôle partiel.'
    - icon: 3
      icon_bg: purple
      title: Signature autorisée et traçabilité
      desc: 'L''autorisation d''expédition n''est permise qu''après documentation complète du NCR et signature QC autorisée, le statut du lot passant de HOLD à RELEASED. Les écarts systémiques ou répétés déclenchent automatiquement des flux de travail CAPA à la cause racine.'

