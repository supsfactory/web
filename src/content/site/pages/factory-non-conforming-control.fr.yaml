answer:
  label: 'Réponse directe'
  text: 'Les produits non conformes ne sont jamais cachés, repris de manière informelle ou libérés sans vérification chez QINGDAO VATRAD GROUP.,LTD. Chaque non-conformité identifiée est enregistrée contre le produit, le lot ou le composant affecté et reliée à un NCR. L''article est étiqueté (HOLD / QUARANTINE / REJECTED), physiquement séparé, et le périmètre affecté est évalué par lot, par lot de matériau, par étape de processus et par révision de document. La disposition est décidée au niveau d''autorité correspondant à la gravité du défaut : les problèmes mineurs sont validés au niveau de la ligne, les problèmes majeurs exigent une disposition du Responsable QC + Ingénieur technique avec une instruction de reprise contrôlée et une ré-inspection indépendante à 100 %, et les problèmes critiques exigent une décision du Material Review Board avec concession écrite du client là où requis — sinon destruction attestée obligatoire. Les articles repris sont ré-inspectés selon les critères d''acceptation d''origine, les réparations d''étanchéité à l''air reçoivent un cycle complet de test de pression neuf, et l''autorisation d''expédition n''a lieu qu''après signature qualité autorisée. Les problèmes répétés ou systémiques déclenchent une action corrective à la cause racine (CAPA).'
  verified: '2026-08'

