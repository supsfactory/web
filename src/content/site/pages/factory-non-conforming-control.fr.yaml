nc_severity:
  tagline: Gravité du défaut et autorité
  title: Classification de gravité et autorité de disposition
  subtitle: Toutes les non-conformités ne sont pas traitées au même niveau — l''autorité de disposition croît avec la gravité du défaut, de la validation de ligne au Material Review Board et à la concession client.
  headers:
    severity: Gravité
    examples: Exemples typiques
    authority: Autorité et contrôle de disposition
    control: Condition de libération
  rows:
    - severity: 'Mineur'
      examples: 'Plissure du coin du carton, léger désalignement d''accessoire non critique'
      authority: 'Chef QC de section + superviseur de ligne : validation sur site, remplacement ou libération'
      control: 'Enregistré sur le NCR ; aucun impact sur la fonction du produit ni les exigences client'
    - severity: 'Majeur'
      examples: 'Fuite lente de valve, désalignement EVA au-delà de la tolérance (>2 mm), accessoire manquant'
      authority: 'Le Responsable QC + l''Ingénieur technique émettent une instruction de reprise contrôlée (SRI)'
      control: 'Re-test indépendant à 100 % des caractéristiques ayant échoué et affectées avant libération'
    - severity: 'Critique'
      examples: 'Dommage à la chambre drop-stitch, bulle ou fissure de rail sous haute pression, erreur d''impression du logo client ou écart de couleur'
      authority: 'Décision du Material Review Board (MRB) ; concession écrite du client là où requis'
      control: 'Pas de libération sans concession autorisée ; sinon destruction physique attestée obligatoire'

nc_matrix:
  tagline: Matrice de protocole d''ingénierie
  title: Matrice de disposition des défauts SUP et de ré-inspection
  subtitle: Protocoles d''ingénierie standard appliqués aux écarts de fabrication les plus courants — les mêmes paramètres quantifiés que les clients peuvent vérifier lors des audits.
  headers:
    defect: Catégorie de défaut
    protocol: Protocole de disposition contrôlée
    validation: Ré-inspection et validation indépendantes
  rows:
    - defect: 'Fuite lente de valve'
      protocol: 'Isoler la planche. Démonter le noyau de valve avec un outil de couple calibré (25 N·m), nettoyer les filetages internes, remplacer le joint torique en silicone et re-serrer au couple.'
      validation: 'Immerger dans une solution de bulles ; re-gonfler à 18 PSI pour un re-test complet de chute de pression de 24 h (ΔP ≤ 0,05 PSI).'
    - defect: 'Bulles d''air au rail'
      protocol: 'Mettre en quarantaine le lot d''équipe. Délaminer la zone de bulles avec une buse assistée par chaleur, nettoyer la surface au solvant, appliquer de l''adhésif PU bicomposant sous pression de 5 bar.'
      validation: 'Inspection visuelle et tactile à 100 % de la couture ; test de pression de preuve structurelle (18,0 PSI) plus maintien d''étanchéité à l''air de 24 h.'
    - defect: 'Désalignement du tapis EVA'
      protocol: 'Décollage assisté par chaleur avec un outil à température régulée (80 °C). Re-aligner à l''aide d''un gabarit de positionnement acrylique de précision.'
      validation: 'Vérification de la tolérance d''espacement (≤ ±1,5 mm), contrôle de symétrie du motif en losange, test d''adhérence de liaison des bords à 100 %.'
    - defect: 'Erreur de marque / logo'
      protocol: 'Arrêt immédiat de la ligne d''impression. Blocage de tous les panneaux imprimés. Revue de la révision vectorielle avec le client ; zéro altération non approuvée.'
      validation: 'Contrôle couleur au spectrophotomètre (ΔE ≤ 1,5) ; vérification visuelle de l''alignement du texte à 100 % contre le PDF maître vectoriel signé par le client.'
    - defect: 'Écart d''emballage / SKU manquant'
      protocol: 'Mettre en quarantaine la palette d''export. Déballer et effectuer un contrôle BOM détaillé à 100 % (pompe, aileron, leash, pagaie, tube de réparation).'
      validation: 'Validation par balance électronique dynamique en ligne (±30 g de variance) ; vérification par scanner optique de code-barres 2D.'

nc_scrap:
  tagline: Zéro fuite sur le marché
  title: Mise au rebut et destruction attestées — protocole anti-détournement zéro défaut
  body: |
    Les partenaires de marque internationaux ont besoin de l''assurance que les planches défaillantes n''atteindront jamais le retail secondaire, les marchés gris ou les canaux e-commerce. Les planches qui ne peuvent pas être mises en conformité sont détruites sous un protocole attesté et enregistré :

    **1. Cisaillement de la quincaillerie et des accessoires.** Sous la supervision du Directeur QA, une cisaille hydraulique retire tous les anneaux en D en acier inoxydable 316, la sangle de poignée de transport et les boucles de bagage. L''ensemble de valve de gonflage et la base de boîtier d''aileron (US-Box / aileron à enclenchement) sont découpés à la racine de la planche, éliminant tout composant récupérable.

    **2. Fendage du drop-stitch et sectionnement du rail.** Le noyau drop-stitch interne est découpé en travers de la planche et du pont avec des fentes entrecroisées profondes (≥ 50 cm par coupe), et les rails latéraux renforcés sont sectionnés en au moins 4 segments — détruisant définitivement la capacité d''étanchéité et la flottabilité.

    **3. Coffre vidéo et photo.** La destruction est enregistrée en vidéo 1080p non coupée avec des gros plans du code-barres de série, du processus de cisaillement, du fendage du noyau et du tas de rebut pesé final. La vidéo est hachée (SHA-256) et archivée sur un serveur contrôlé pendant au moins 5 ans.

    **4. Élimination certifiée des déchets.** Tous les fragments de PVC et de drop-stitch sont pesés, enregistrés dans le registre de sortie et transportés uniquement par des partenaires qualifiés de recyclage de polymères — aucun résidu ne quitte l''installation par un autre canal.

    > **Garantie de protection de marque :** QINGDAO VATRAD GROUP CO., LTD. garantit la destruction à 100 % des embarcations hors spécification non reparables. Aucun second choix d''usine ni planche compromise n''entrera jamais dans le retail secondaire, les marchés gris ou les canaux e-commerce. Le Certificat de rebut et de destruction (VAT-QA-SCRAP-CERT-2026) enregistre le produit, le lot, la conclusion MRB, les photos témoins et la double signature du Directeur QA et du Directeur d''usine.

