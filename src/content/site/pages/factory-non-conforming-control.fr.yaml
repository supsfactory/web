faqs:
  tagline: FAQ
  title: FAQ qualité et contrôle des défauts pour les acheteurs mondiaux
  items:
    - q: 'Comment garantissez-vous que les planches reprises respectent les normes de sécurité complètes ?'
      a: 'Toute planche reprise est traitée comme une unité neuve et doit compléter exactement le même cycle de test complet à partir de zéro — pour les réparations d''étanchéité à l''air, un test de pression complet de 24 h. Ce sont les inspecteurs QC indépendants, et non les opérateurs de reprise, qui effectuent la validation de libération.'
    - q: 'L''usine expédiera-t-elle des planches avec des écarts cosmétiques mineurs sans nous en informer ?'
      a: 'Jamais. Tout écart affectant les échantillons dorés approuvés par le client, les graphismes de logo, les coloris ou l''emballage exige un Accord de Concession écrit formel signé par le client avant l''autorisation d''expédition.'
    - q: 'Que se passe-t-il si une planche reprise échoue à la ré-inspection ?'
      a: 'La planche n''est pas libérée. Elle revient à une nouvelle revue de disposition, et si elle ne peut pas être mise en conformité, elle est remplacée, rejetée ou détruite sous le protocole de mise au rebut attestée. L''échec répété de la même classe de défaut déclenche une CAPA à la cause racine.'
    - q: 'Les planches défaillantes peuvent-elles être vendues comme seconds choix d''usine ou par d''autres canaux ?'
      a: 'Non. Les planches hors spécification non reparables sont physiquement détruites sous le protocole de mise au rebut attestée — quincaillerie cisaillée, noyau et rails sectionnés, vidéo enregistrée avec hachage SHA-256 et archivée pendant au moins 5 ans. Le certificat de rebut et de destruction est signé par le Directeur QA et le Directeur d''usine.'
    - q: 'Comment le périmètre affecté est-il évalué lorsqu''un défaut est trouvé ?'
      a: 'Le périmètre est revu par identification du produit, lot de production, lot de matériau ou de composant, étape de processus et révision de document applicable. Si le même lot de matériau, la même révision de graphismes ou le même poste de travail est impliqué, les produits affectés sont contenus et contrôlés en conséquence.'
    - q: 'Avez-vous besoin de notre approbation avant d''accorder une concession ?'
      a: 'Oui. Toute acceptation sous concession documentée qui affecte les exigences client — échantillons approuvés, spécification, graphismes, emballage ou critères d''acceptation — exige une approbation écrite du client avant libération. Sans elle, le produit est repris selon l''exigence d''origine, remplacé ou rejeté.'
    - q: 'Quelle documentation recevons-nous pour une non-conformité ?'
      a: 'L''enregistrement NCR couvre le numéro NCR, l''étape de détection, le produit/SKU, le lot, les révisions de documents applicables, la description du défaut, le confinement, la disposition, la référence de l''instruction de reprise, le résultat de ré-inspection et l''approbation de libération ou de clôture — disponible selon votre accord qualité de projet.'

