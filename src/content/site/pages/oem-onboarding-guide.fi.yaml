answer:
  label: 'Suora vastaus'
  text: 'Tyypillinen OEM-käynnistys kestää 2–4 viikkoa näytteen hyväksyntään ja 6–8 viikkoa ensimmäiseen tuotantosarjaan vahvistetun tilauksen jälkeen. Aloitat jättämällä projektibriefin (laudan määritykset, volyymi, vaatimustenmukaisuus). Vastaamme yhden arkipäivän kuluessa, tarjoamme NDA:n ennen kuin jaat luottamukselliset tiedot, ja valmistamme 1–2 fyysistä näytettä 7–12 päivässä tarkastelusi ja hyväksyntääsi varten. Kun näyte on jäädytetty, tuotannon suunnittelu ja valmistus jatkuvat kiinteillä laadunvalvontaporteilla jokaisessa vaiheessa. Jokainen vaihe on dokumentoitu ja jäljitettävä.'
  verified: 'Syyskuu 2026'

process_steps:
  tagline: Seitsemän porttia
  title: 'Käynnistyksen kulku — seitsemän porttia briefistä toimitukseen'
  subtitle: 'Jokaisella portilla on määritelty syöte, määritelty tuotos ja etukäteen sovittu aikataulu. Et etene portista eteenpäin ilman nimenomaista hyväksyntää.'
  steps:
    - step: 'Portti 1'
      title: 'Aloitusyhteydenotto ja NDA (päivä 0)'
      desc: 'Lähetä projektibriefi sivun /fi/contact kautta mukanasi tavoiteltavat laudan määritykset, tilauksen volyymi, vaatimustenmukaisuusvaatimukset ja aikataulu. NDA on saatavilla heti — ennen kuin jaat mitään luottamuksellista teknistä määritystä tai artworkia. Vastaus yhden arkipäivän kuluessa.'
    - step: 'Portti 2'
      title: 'Toteutettavuusarvio ja tarjous (päivät 1–5)'
      desc: 'Tuotetekniikka käy briefisi läpi suhteessa valmistuskapasiteettiin, materiaalien saatavuuteen ja vaatimustenmukaisuuden laajuuteen. Saat kohdekohtaisen tarjouksen, jossa on vähimmäiserälaskelma, näytemaksut (vähennetään tuotannosta) ja toimitusajan vaiheet — ei arvattua aluetta, vaan portti portilta etenevä aikataulu.'
    - step: 'Portti 3'
      title: 'Näytetuotanto (päivät 6–17)'
      desc: '1–2 fyysistä lautaa valmistetaan määrityksesi mukaisesti: runkojen jäykkyys, EVA-koostumatyynyn pinta, kuvituksen tarkkuus, lisävarusteiden istuvuus. Koet laudalla ja arvioit sen ennen kuin sitoudut mihinkään muuhun. Näytemaksut vähennetään tuotantotilauksestasi sopimuksen allekirjoituksen yhteydessä.'
    - step: 'Portti 4'
      title: 'Näytteen tarkastus ja hyväksyntä (päivät 18–21)'
      desc: 'Arvioit näytettä määrityksiäsi vasten — ajoitus, kuvituksen vastaavuus, pakkaus, lisävarusteet. Muutokset kirjataan päivitettyyn BOM-asiakirjaan ja artworkin hyväksyntään. Jäädytetty määritys muuttuu tuotannon viiteasiakirjaksi kaikkiin myöhempiin sarjoihin.'
    - step: 'Portti 5'
      title: 'Tuotannon esivalmistelu (päivät 22–28)'
      desc: 'Materiaalien hankinta, työkaluston valmistelu, pakkauksen vahvistus ja tuotantopaikkojen varaus. Kaikki materiaalit tarkastetaan vastaanotossa jäädytetyn BOM-asiakirjan mukaisesti. Ennen valmistuksen alkua annetaan tuotantoaikataulu laadunvalvonnan porttien päivämäärineen.'
    - step: 'Portti 6'
      title: 'Tuotanto ja laadunvalvontaportit (päivät 29–55)'
      desc: 'Valmistus kulkee 7-vaiheisen tarkastusporttijärjestelmän läpi: saapuvien materiaalien tarkastus, drop-stitch-kankaan tarkastus, hitsaus ja kokoonpano, paine- ja ilmatiiviystestaus (18.0 PSI pysäytys, automaattinen hylkäys yli 0.50 PSI:n laskun yli), EVA-alustan ja lisävarusteiden asennus, kuvituksen ja brändäyksen laadunvalvonta sekä lopullinen pakkaus ja dokumentaatio. Jokaisella portilla on hyväksy/hylkää-kriteerit ja jäljitettävyyskirjaukset.'
    - step: 'Portti 7'
      title: 'Lähetys ja toimituksen jälkeinen katselu (päivät 56–63)'
      desc: 'Vientiluokan pakkaus, vaatimustenmukaisuusdokumentaatio (CE, ISO 9001, BSCI, REACH, RoHS) ja merirahtiyhteistyö yli 50 maahan. Toimituksen jälkeinen katselu kirjaa opitut asiat ja parannukset seuraavaa tilaussykliä varten.'

