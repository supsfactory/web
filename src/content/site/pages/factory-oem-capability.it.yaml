services:
  - title: Design di prodotto & costruzione
    description: Il nostro team R&S interno lavora sul vostro concept o specifica per sviluppare disegni CAD, modelli 3D e prototipi. Offriamo design di stampi, ottimizzazione della forma dello scafo e consulenza sulla scelta dei materiali.
  - title: Branding & grafiche personalizzate
    description: Stampa digitale a pieni colori, serigrafia, goffratura e opzioni di etichette. Sviluppiamo grafiche del deck specifiche del marchio, branding delle camere e imballaggio pronto per il retail.
  - title: Personalizzazione di materiali & specifiche
    description: Scegliete tra PVC (standard, eco-friendly, ignifugo), Hypalon/CSM, drop-stitch e costruzioni ibride. Colori delle camere personalizzati, grammature del tessuto e opzioni di rinforzo.
  - title: Imballaggio & logistica
    description: Imballaggio commerciale personalizzato, cartoni private label, imballaggio sottovuoto, pallettizzazione e stivaggio pronto per l''export preparati in-house.

moq_table:
  - product: SUP gonfiabili
    standard_moq: 'Campione 1–2 | Pilota 20–50'
    custom_moq: 'Quantità 90–100+ (per bobina da 150 m)'
    lead_time: 25–35 giorni

why_us:
  - title: Integrazione verticale
    description: Possediamo la nostra fabbrica, i nostri stampi e la nostra catena di fornitura — nessun intermediario, nessun subappaltatore. Questo ci dà il controllo su qualità, costi e consegna.
  - title: Doppia certificazione
    description: Gestione qualità ISO 9001 e certificazione di conformità sociale BSCI. Rapporti di audit della fabbrica disponibili su richiesta.
  - title: Conformità CE
    description: La certificazione CE si applica ai modelli destinati ai mercati UE (ambito confermato per progetto). I modelli personalizzati possono essere certificati CE tramite il nostro processo consolidato.
  - title: MOQ specifico per progetto
    description: 'Il MOQ viene confermato dalla vostra configurazione di progetto — il co-branding in piccoli lotti parte da 5–10 unità, la produzione standard in serie gira con 90–100+ unità per partita. Aiutiamo i nuovi marchi a partire senza sovra-impegni di inventario.'

