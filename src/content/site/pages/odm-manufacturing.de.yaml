answer:
  label: 'Kurze Antwort'
  text: 'iSupfactory ist ein SUP-ODM-Hersteller in Qingdao, China. Die ODM-Entwicklung startet mit Ihrem Briefing, nicht mit Ihren Zeichnungen: Rumpfdesign (Länge, Breite, Rocker, Volumen), Materialstruktur und Grafik werden hausintern konstruiert, durch Prototypen-Muster in 7–12 Tagen validiert und in Standard-Mengen von 90–100 Einheiten pro 150-m-Rolle produziert (Pilot ab 20–50 Einheiten). Die Produktion dauert 25–35 Tage nach bestätigtem Auftrag und Anzahlung; der Formenbau für individuelle Formen addiert 15–20 Tage. CE-, ISO-9001-, BSCI-, REACH- und RoHS-Dokumentation wird mit jeder Bestellung geliefert.'
  verified: 'September 2026'

