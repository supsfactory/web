  text: 'Varje bräda testas före leverans mot de publicerade specifikationerna: 100 % tryckhållningstest vid 18.0 PSI i 24 timmar (automatiskt underkännande över 0.50 PSI tryckfall), dragprovning och svetsfogsprovning enligt ISO 1421 samt en 100-punktars montagechecklista. Laboratoriet rapporterar direkt till företagsledningen, inte till produktionen, och kan stoppa varje leverans.'
