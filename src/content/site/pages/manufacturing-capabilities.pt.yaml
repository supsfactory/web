faq_section:
  tagline: FAQ
  title: Perguntas sobre as capacidades de produção SUP
  questions:
    - q: Que processos de produção acontecem internamente?
      a: 'Todos os processos-chave são internos: engenharia do casco, processamento do núcleo drop-stitch, soldadura de alta frequência, impressão, corte de EVA, montagem, ensaio e embalagem. Acessórios e algumas matérias-primas vêm de fornecedores certificados; a composição final do kit acontece internamente para uma rastreabilidade completa.'
    - q: Qual é a vossa capacidade produtiva?
      a: '120.000+ pranchas por ano (cerca de 10.000/mês) em 4 linhas automatizadas e 4 oficinas especializadas em 12,500 m² com mais de 350 colaboradores.'
    - q: Qual é a quantidade mínima de encomenda aplicável a estas capacidades?
      a: 'A quantidade padrão começa em 90–100+ unidades por configuração aprovada (um rolo de 150 m de tecido drop-stitch); os lotes piloto começam em 20–50 unidades em plataformas existentes; as encomendas só-logo começam em 5–10 unidades.'
    - q: Que prazos devemos ter em conta?
      a: 'Amostras de protótipo em 7–12 dias; produção 25–35 dias após encomenda confirmada e sinal; o equipamento para formas à medida acrescenta 15–20 dias.'
    - q: De que forma as capacidades influenciam a qualidade?
      a: 'Cada processo alimenta o sistema de qualidade em 7 fases: checklist de montagem de 100 pontos, retenção de pressão 18,0 PSI por 24 horas com rejeição automática acima de 0,50 PSI de queda, amostragem segundo ISO 2859-1 Nível II e rastreabilidade dos lotes ERP por 10 anos.'

