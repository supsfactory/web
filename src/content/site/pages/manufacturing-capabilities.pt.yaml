hero:
  tagline: Capacidades de produção
  title: 'Capacidades de produção SUP'
  subtitle: 'Cada processo — engenharia do casco, processamento do núcleo drop-stitch, soldadura de alta frequência, impressão, equipamento, montagem, ensaio e embalagem — acontece internamente nas nossas instalações de 12,500 m² em Qingdao. Uma única equipa responsável gere o teu projeto desde o primeiro desenho até ao contentor expedido.'

answer:
  label: 'Resposta breve'
  text: 'A produção SUP é totalmente interna nas nossas instalações de Qingdao: conceção do casco e engenharia dimensional com precisão CNC de 0,1 mm; processamento do material drop-stitch e soldadura de alta frequência em 4 linhas automatizadas; impressão gráfica; corte dos pads de EVA; equipamento interno (+15–20 dias para novas formas); montagem segundo uma checklist de 100 pontos e um teste de retenção de pressão de 24 horas a 18,0 PSI com rejeição automática em caso de queda superior a 0,50 PSI. A capacidade anual é de 120.000+ pranchas (cerca de 10.000/mês) em 4 oficinas especializadas com 350+ colaboradores, entregues em mais de 50 países com a tua marca.'
  verified: 'September 2026'

