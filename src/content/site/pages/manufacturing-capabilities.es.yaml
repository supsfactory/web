faq_section:
  tagline: FAQ
  title: Preguntas sobre las capacidades de fabricación
  questions:
    - q: ¿Qué procesos de fabricación son internos?
      a: 'Todos los procesos clave están integrados: ingeniería de casco, procesado del tejido drop-stitch, soldadura HF, impresión, corte EVA, ensamblaje, pruebas y embalaje. Los accesorios y algunas materias primas provienen de proveedores certificados; el kitting final se realiza internamente para una trazabilidad completa.'
    - q: ¿Cuál es su capacidad de producción?
      a: '120 000+ tablas al año (unas 10 000/mes) en 4 líneas automatizadas y 4 talleres especializados dentro de una planta de 12 500 m² con más de 350 trabajadores.'
    - q: ¿Qué MOQ aplica a estas capacidades?
      a: 'La producción de volumen estándar comienza en 90–100+ unidades por configuración aprobada (un rollo de tejido drop-stitch de 150 m); los pilotos comienzan en 20–50 unidades en plataformas existentes; pedidos solo logo desde 5–10 unidades.'
    - q: ¿Qué plazos debemos prever?
      a: 'Muestras prototipo en 7–12 días; producción en 25–35 días tras confirmar el pedido y el depósito; el desarrollo de molde a medida añade 15–20 días.'
    - q: ¿Cómo se traducen las capacidades en calidad?
      a: 'Cada etapa alimenta el sistema de calidad en 7 etapas: checklist de ensamblaje de 100 puntos, sujeción de presión 18,0 PSI 24 h con rechazo automático por encima de 0,50 PSI, muestreo ISO 2859-1 nivel II y trazabilidad ERP de lote a 10 años.'

