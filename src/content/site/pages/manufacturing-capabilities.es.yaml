hero:
  tagline: Capacidades de fabricación
  title: 'Capacidades de fabricación de SUP'
  subtitle: 'Cada etapa — ingeniería de casco, procesado del tejido drop-stitch, soldadura de alta frecuencia, impresión, moldes, ensamblaje, pruebas y embalaje — se realiza internamente en nuestra planta de 12 500 m² en Qingdao: un solo equipo responsable desde el primer dibujo hasta el contenedor enviado.'

answer:
  label: 'Respuesta directa'
  text: 'La fabricación de SUP está completamente integrada en nuestra planta de Qingdao: diseño e ingeniería dimensional de casco con precisión CNC de 0,1 mm; procesado del tejido drop-stitch y soldadura HF en 4 líneas automatizadas; impresión de gráficas; corte de tapetes EVA; moldes a medida (+15–20 días para formas nuevas); ensamblaje según checklist de 100 puntos; y prueba de presión de 18,0 PSI durante 24 horas con rechazo automático por encima de una caída de 0,50 PSI. La capacidad anual es de 120 000+ tablas (unas 10 000/mes) desde 4 talleres especializados con 350+ trabajadores, enviadas a más de 50 países bajo tu marca.'
  verified: 'September 2026'

