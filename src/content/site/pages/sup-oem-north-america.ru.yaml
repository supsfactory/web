why_north_america:
  tagline: 'Почему покупатели в США и Канаде'
  title: 'Создано для импорта в Северную Америку'
  subtitle: 'Завод отвечает на вопросы, которые американские и канадские бренды задают до получения первого контейнера.'
  items:
    - title: 'DDP для предсказуемой конечной стоимости'
      description: 'DDP включает таможенное оформление и доставку на ваш склад — пошлины, налоги и фрахт одной итоговой суммой. Самый популярный вариант для импортеров-новичков.'
    - title: 'Документация для вашего целевого рынка'
      description: 'Документация по CE, REACH и таможенным требованиям готовится для ваших целевых рынков вместе с утвержденным образцом, поэтому ваш продуктовый файл готов к экспорту.'
    - title: 'FOB Циндао с вашим экспедитором'
      description: 'Регулярно импортируете? Возьмите FOB Циндао и работайте со своим логистическим партнером — мы загружаем и документируем контейнер, а остальное под вашим контролем.'
    - title: 'Один завод, одна система качества'
      description: 'Разработка, изготовление образцов, производство и QC происходят на одной площадке 12,500 m² — без поездок через брокеров и без образцов, которые производство не сможет повторить.'

process_notes:
  tagline: 'Как это работает'
  title: 'От спецификации до контейнера'
  subtitle: 'Одни и те же шесть этапов независимо от того, покупаете ли вы два контейнера в год или двадцать: спецификация, инженерная разработка, образцы, испытания, оснастка, производство — затем доставка FOB, CIF или DDP.'
  items:
    - title: '1. Отправьте спецификацию'
      description: 'Достаточно референсной доски, эскиза или спецификации конкурента. Инженерная проверка и коммерческое предложение возвращаются в течение одного рабочего дня.'
    - title: '2. Утвердите образец'
      description: 'Ваш первый физический образец отгружается за 7–12 дней с листом утверждения, охватывающим конструкцию, цвета печати и результаты испытания давлением.'
    - title: '3. Производство и экспорт'
      description: 'Партии завершаются за 25–35 дней с контрольными точками QC в процессе. Упаковочный лист, счет-фактура и коносамент отправляются до выхода судна.'
    - title: '4. Доставка на ваш склад'
      description: '4–6 недель морской доставки в порты США или Канады — на условиях DDP мы берем на себя оформление и доставку до ваших дверей.'

faq_section:
  tagline: FAQ
  title: 'Вопросы об импорте в Северную Америку'
  questions:
    - q: Сколько занимает морская доставка в США или Канаду?
      a: 'Заложите 4–6 недель от порта Циндао до портов США или Канады в зависимости от пункта назначения и расписания рейсов. Проекты DDP включают полный срок от двери до двери.'
    - q: Вы отгружаете DDP в США и Канаду?
      a: 'Да. DDP включает морской фрахт, таможенное оформление, пошлины и налоги, а также доставку на ваш склад — одна предсказуемая итоговая цена. Также доступны FOB Циндао и CIF.'
    - q: Каков MOQ для импорта SUP под собственным брендом?
      a: 'MOQ подтверждается конфигурацией проекта: разработка образца охватывает 1–2 единицы, пилотные партии выполняются в объеме 20–50 единиц на существующих платформах, а стандартное серийное производство — 90–100+ единиц на каждый дизайн из полного 150 m рулона drop stitch.'
    - q: Какие документы вы предоставляете для импорта?
      a: 'Утвержденный образец отгружается с документацией по CE и REACH, подготовленной для ваших целевых рынков, а каждый контейнер сопровождается упаковочным листом, счет-фактурой и коносаментом.'
    - q: Какие документы о соответствии в США вы предоставляете для SUP?
      a: 'Взрослые надувные SUP не являются детскими товарами, поэтому правила CPSIA о потребительских товарах, как правило, не применяются. California Prop 65 — это оценка на ваше усмотрение по маркировке; наша документация по материалам REACH/RoHS по каждому заказу ее поддерживает. Там, где этого требует категория вашей продукции, может быть подготовлена документация, соответствующая USCG, а ваш назначенный инженер проекта до начала производства подтверждает точный перечень документов, которые запросит ваш юрист или ритейлер.'
    - q: Могу ли я посетить завод до заказа?
      a: 'Да. Площадка 12,500 m² в Циндао открыта для клиентов — виртуальные экскурсии по заводу можно организовать онлайн, а личные визиты проводятся с сопровождением по производственным линиям и станциям QC.'
    - q: Как начать проект из США или Канады?
      a: 'Отправьте референсную доску, эскиз или спецификацию. Инженерная проверка и коммерческое предложение возвращаются в течение одного рабочего дня, а NDA подписывается до обмена файлами.'

