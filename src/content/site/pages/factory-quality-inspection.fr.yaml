rework_intro:
  tagline: Gouvernance de la reprise
  title: Gouvernance contrôlée des non-conformités et de la reprise d''étanchéité à l''air
  body: |
    Chez QINGDAO VATRAD GROUP.,LTD., la reprise est définie strictement comme la restauration d''une unité non conforme à la pleine conformité avec sa spécification d''ingénierie d''origine — pas comme un correctif rapide. Toute planche identifiée avec une non-conformité d''étanchéité à l''air est placée sous blocage contrôlé et reliée à un Rapport de Non-Conformité (NCR) avant tout traitement ultérieur ; la source de la fuite est localisée et enregistrée en utilisant la méthode de diagnostic approuvée.

    La reprise ne peut avoir lieu que lorsque le défaut est dans le périmètre de reprise approuvé et qu''une méthode autorisée est disponible. L''instruction de reprise identifie le produit, le lot, l''emplacement du défaut, le matériau approuvé, la méthode, les conditions requises et le périmètre de ré-inspection. Après la période de durcissement ou de stabilisation requise, la planche est ré-inspectée selon les mêmes critères d''acceptation applicables qu''une planche conforme — la reprise ne réduit jamais la norme d''acceptation. L''échec de la ré-inspection exige une nouvelle disposition d''ingénierie et de qualité ; la reprise répétée n''est pas permise sans approbation documentée.

rework_decision:
  tagline: Flux interactif
  title: Flux de décision de reprise — cliquez sur n''importe quel nœud
  subtitle: Suivez comment une non-conformité d''étanchéité à l''air est traitée de la détection à la libération ou à la mise au rebut. Cliquez sur un nœud pour développer les exigences de contrôle à cette étape.
  nodes:
    - id: detect
      type: start
      label: Fuite détectée
      detail: 'Une non-conformité d''étanchéité à l''air est identifiée lors de l''inspection — échec de rétention de pression, fuite visible ou défaut connexe du système d''air.'
    - id: hold
      type: step
      label: Arrêt de ligne · étiquette HOLD · NCR
      detail: 'Le traitement s''arrête. L''identifiant de la planche, le code produit, le lot, le poste de travail, la date et l''inspecteur sont enregistrés ; une étiquette HOLD / QUARANTINE est apposée et un NCR est ouvert contre la révision de spécification applicable.'
    - id: locate
      type: step
      label: Localiser la source de la fuite
      detail: 'La planche est gonflée à la pression de diagnostic approuvée par le projet et la source est localisée avec une méthode approuvée — rétention de pression, test de bulles calibré, équipement acoustique ou de détection de fuite.'
    - id: classify
      type: step
      label: Classifier le défaut (A–G)
      detail: 'Le défaut est classé contre la matrice d''approbation : A interface de valve, B couture de base de valve, C trou d''épingle de surface, D couture de rail locale, E défaillance de rail importante, F fuite récurrente, G dommage structurel.'
    - id: authorize
      type: decision
      label: Reprise autorisée ?
      yes: rework
      no: escalate
      detail: 'La QC confirme la catégorie de défaut et l''Ingénierie examine si la planche peut être restaurée à sa spécification d''origine. L''autorisation enregistre la carte de méthode, les matériaux, les conditions et le périmètre de ré-inspection — ou achemine vers le remplacement, le rejet, la mise au rebut ou la concession client.'
    - id: rework
      type: step
      label: Reprise contrôlée
      detail: 'Exécutée uniquement dans la limite de défaut approuvée en utilisant la carte de méthode, le lot de matériau et l''outillage approuvés — sans jamais modifier les dimensions, la construction, les graphismes, les accessoires ou les exigences d''emballage.'
    - id: cure
      type: step
      label: Durcissement et stabilisation
      detail: 'La planche reste sur HOLD pendant la période de durcissement et de stabilisation définie par l''instruction de matériau et de processus approuvée, puis reçoit un pré-contrôle visuel et de finition.'
    - id: reinspect
      type: decision
      label: Ré-inspection réussie ?
      yes: release
      no: escalate
      detail: 'La planche est gonflée à la pression de ré-inspection approuvée par le projet et l''échec d''origine plus toutes les caractéristiques potentiellement affectées sont re-vérifiés — emplacement de fuite, valve, rails, coutures, zones à haute contrainte, accessoires et apparence. La reprise ne réduit jamais la norme d''acceptation.'
    - id: release
      type: release
      label: Libération qualité
      detail: 'La Qualité revoit le NCR clôturé, l''enregistrement de reprise et le résultat de ré-inspection et autorise la libération. Aucune planche reprise n''est conditionnée ou expédiée sans libération qualité autorisée.'
    - id: escalate
      type: escalate
      label: Escalader — remplacer / mettre au rebut / concession
      detail: 'Pas de reprise répétée sans approbation documentée. La planche achemine vers le remplacement, le rejet, la mise au rebut ou une concession écrite du client lorsqu''elle ne peut pas être restaurée à la spécification d''origine.'

defect_matrix:
  tagline: Classification des défauts
  title: Matrice de classification des défauts d''étanchéité à l''air et d''approbation
  subtitle: Toutes les fuites ne sont pas reprises — chaque défaut est classé et sa disposition approuvée au bon niveau, de l''inspecteur QC au directeur d''usine.
  headers:
    category: Catégorie de défaut
    area: Zone typique
    eligibility: Éligibilité à la reprise
    approval: Approbation requise
  rows:
    - category: 'Classe A — Interface de valve'
      area: 'Noyau de valve, joint de bouchon, joint d''étanchéité, interface de pompe'
      eligibility: 'Reprise standard autorisée'
      approval: 'Inspecteur QC'
    - category: 'Classe B — Couture de base de valve'
      area: 'Micro-fuite le long du rebord de la valve'
      eligibility: 'Reprise évaluée selon la carte de méthode approuvée'
      approval: 'QC + Ingénierie'
    - category: 'Classe C — Trou d''épingle de surface'
      area: 'Micro trou d''épingle local sur une surface non soumise à contrainte'
      eligibility: 'Autorisé uniquement quand conforme aux spécifications client'
      approval: 'QC + Ingénierie'
    - category: 'Classe D — Couture de rail locale'
      area: 'Fuite de recouvrement locale sur la bande de rail'
      eligibility: 'Haut risque ; disposition d''ingénierie stricte requise'
      approval: 'Ingénierie + Responsable QA'
    - category: 'Classe E — Défaillance de rail importante'
      area: 'Défaillance de couture continue dans les zones à haute contrainte'
      eligibility: 'Reprise standard non autorisée — remplacement ou revue de cause racine'
      approval: 'Responsable QA + Concession client'
    - category: 'Classe F — Fuite récurrente'
      area: 'Fuite non localisable ou échec de re-test'
      eligibility: 'Pas de reprise répétée ; remplacement, mise au rebut ou analyse de cause racine d''ingénierie'
      approval: 'QA principal / Ingénierie'
    - category: 'Classe G — Dommage structurel'
      area: 'Dommage du matériau, délamination, déformation de planche'
      eligibility: 'Libération de reprise non autorisée — remplacement, mise au rebut ou concession écrite du client'
      approval: 'Responsable qualité + Approbation client'

rework_flow:
  tagline: Boucle fermée en 7 étapes
  title: Flux de travail de reprise contrôlée — de la détection à la libération ou à la mise au rebut
  subtitle: 'Chaque reprise d''étanchéité à l''air suit la même boucle contrôlée : détecter, mettre en quarantaine, diagnostiquer, autoriser, reprendre, ré-inspecter, libérer.'
  steps:
    - step: '01'
      title: Détection, arrêt de ligne et quarantaine
      desc: 'Le traitement s''arrête immédiatement sur la planche affectée. L''identifiant de la planche, le code produit, le lot, le poste de travail, la date et l''inspecteur sont enregistrés, une étiquette HOLD / QUARANTINE est apposée et un NCR est ouvert contre la révision de spécification applicable.'
    - step: '02'
      title: Diagnostic systématique de fuite
      desc: 'La planche est gonflée à la pression de diagnostic approuvée par le projet et la source de la fuite est localisée avec une méthode approuvée — rétention de pression, test de bulles calibré, équipement acoustique ou de détection de fuite. L''emplacement suspect est marqué sans endommager la planche.'
    - step: '03'
      title: Disposition et autorisation d''ingénierie
      desc: 'La QC confirme la catégorie de défaut et l''Ingénierie examine si la planche peut être restaurée à sa spécification d''origine. Une autorisation de reprise référençant le NCR enregistre la méthode, les matériaux, les conditions et le périmètre de ré-inspection approuvés — ou assigne le remplacement, le rejet, la mise au rebut ou la concession client.'
    - step: '04'
      title: Exécution de la reprise contrôlée
      desc: 'La reprise est exécutée uniquement dans la limite de défaut approuvée, en utilisant la carte de méthode, le lot de matériau et l''outillage approuvés. Les dimensions de la planche, la construction, les graphismes, la configuration des accessoires et les exigences d''emballage ne sont jamais modifiées.'
    - step: '05'
      title: Stabilisation de durcissement et pré-contrôle
      desc: 'La planche reprise reste en statut HOLD pendant la période de durcissement et de stabilisation définie par l''instruction de matériau et de processus approuvée, puis reçoit un pré-contrôle visuel et de finition avant la ré-inspection.'
    - step: '06'
      title: Ré-inspection et test de preuve
      desc: 'La planche est gonflée à la pression de ré-inspection approuvée par le projet et l''échec d''origine plus toutes les caractéristiques potentiellement affectées sont re-vérifiés : l''emplacement de fuite et la zone environnante, la valve, les rails, les coutures, les zones à haute contrainte, les accessoires et l''apparence. La reprise ne réduit jamais la norme d''acceptation.'
    - step: '07'
      title: Libération QA ou disposition finale
      desc: 'La Qualité revoit le NCR complété, l''enregistrement de reprise et le résultat de ré-inspection, puis autorise la libération — ou escalade vers le remplacement, le rejet, la mise au rebut ou la concession client. Aucune planche reprise n''est conditionnée ou expédiée sans libération qualité autorisée.'

quality_safeguards:
  tagline: Garde-fous qualité
  title: Règles anti-erreur qui protègent votre marque
  subtitle: Contrôles durs qui empêchent les boucles de réparation non contrôlées — une reprise documentée par défaut, des seuils d''alerte au niveau du lot, une instrumentation calibrée et des conditions de test contrôlées.
  features:
    - icon: 1
      icon_bg: blue
      title: Une reprise par défaut
      desc: 'Un emplacement unique peut être repris une fois sous une instruction autorisée. Si la ré-inspection échoue encore, la planche est escaladée pour remplacement, rejet, mise au rebut ou concession client — la reprise répétée sans approbation documentée n''est pas permise.'
    - icon: 2
      icon_bg: green
      title: Alerte de lot et arrêt de ligne
      desc: 'Lorsque la non-conformité dans un lot de production dépasse le seuil fixé par l''ingénierie, la ligne est arrêtée et l''Ingénierie examine la cause — lot de matériau, conditions de processus et enregistrements — avant la reprise de la production.'
    - icon: 3
      icon_bg: purple
      title: Instrumentation calibrée
      desc: 'Les manomètres, manomètres numériques et minuteries utilisés pour les tests d''étanchéité à l''air sont contrôlés et calibrés par des laboratoires tiers dans leur période de validité, avec le statut d''étalonnage visible dans la zone d''inspection.'
    - icon: 4
      icon_bg: orange
      title: Conditions de test contrôlées
      desc: 'Les zones de test d''étanchéité à l''air et de durcissement sont maintenues dans un environnement contrôlé afin que les résultats ne soient pas affectés par les variations de température entre le jour et la nuit.'

rework_boundaries:
  tagline: Périmètre et limites
  title: Ce que ce système ne couvre pas
  body: |
    Le système de contrôle de la reprise s''applique aux planches de SUP gonflables terminées ou en cours fabriqué identifiées avec une fuite d''air, un échec de rétention de pression ou des défauts connexes du système d''air avant l''autorisation d''expédition. Il n''autorise pas les modifications de la construction, des matériaux, des graphismes, de la configuration produit ou des exigences client approuvés, et il ne couvre pas :

    - Les produits déjà expédiés ou dans les canaux clients.
    - Les dommages structurels ou déformations de planche non évalués par l''Ingénierie.
    - Les défaillances généralisées de rail ou de couture, les dommages du matériau du noyau ou les défauts pouvant affecter la sécurité.
    - Les projets où la reprise n''est pas permise : échantillons approuvés par le client, unités de certification ou d''essai.
    - Les projets avec des processus clients propriétaires, des matériaux spéciaux ou des exigences de réparation spéciales.
    - Les fuites récurrentes qui ne peuvent pas être localisées, ou les planches échouant de nouveau après reprise.

    Tout écart par rapport aux spécifications client exige une revue d''ingénierie documentée et, le cas échéant, une approbation écrite du client. Les planches qui ne peuvent pas être restaurées à leur spécification d''origine ne sont libérées que sous une concession explicite du client — jamais par la production seule.

method_cards:
  tagline: Système de cartes de méthode
  title: Index des cartes de méthode de reprise contrôlée
  subtitle: 'L''instruction générale contrôle le processus ; les cartes de méthode contrôlent l''opération. L''instruction de reprise (WI-QC-AT-001) référence les cartes de méthode MC-RW-01 à MC-RW-06, plus MC-RW-00 pour la mise au rebut et le rejet obligatoires.'
  headers:
    code: Carte de méthode
    defect: Classe de défaut
    scope: Périmètre d''application
    controls: Contrôles d''ingénierie clés
    approval: Autorité de signature
  rows:
    - code: MC-RW-01
      defect: Classe A (interface de valve)
      scope: 'Entretien du noyau de valve, nettoyage du joint et ré-assemblage'
      controls: 'Clé dynamométrique calibrée, siège de joint propre, aucun dommage aux filetages de valve'
      approval: 'Inspecteur QC'
    - code: MC-RW-02
      defect: Classe B (périphérie de valve)
      scope: 'Scellage de la bride de base de valve et serrage contrôlé'
      controls: 'Préparation de surface contrôlée, matériau de liaison approuvé, gabarit de pression circulaire'
      approval: 'QC + Ingénierie'
    - code: MC-RW-03
      defect: Classe C (micro-fuite de surface)
      scope: 'Scellage de trou d''épingle non structurel'
      controls: 'Adhésif approuvé bicomposant, aucun écoulement dans les graphismes ou l''EVA'
      approval: 'QC + Ingénierie'
    - code: MC-RW-04
      defect: Classe D (couture de rail locale)
      scope: 'Re-assemblage de couture de recouvrement de rail locale'
      controls: 'Activation thermique à température contrôlée, rouleau presseur, gabarit anti-enroulement'
      approval: 'Ingénierie + Responsable QA'
    - code: MC-RW-05
      defect: Classe B/C (rebord d''accessoire)
      scope: 'Patch de boîtier d''aileron et scellage de base de montage d''accessoire'
      controls: 'Promoteur d''adhérence de surface, bloc de serrage profilé, période de maintien définie'
      approval: 'QC + Ingénierie'
    - code: MC-RW-06
      defect: Classe D (couture nez/queue)
      scope: 'Intervention de couture de courbure à haute contrainte'
      controls: 'Matériau de liaison approuvé à haute résistance au cisaillement, période de durcissement prolongée avant re-test'
      approval: 'Ingénieur en chef'
    - code: MC-RW-00
      defect: Classe E/F/G (critique / rupture)
      scope: 'Mise au rebut obligatoire et destruction physique'
      controls: 'Coupure physique pour éviter le mélange, enregistrement de mise au rebut, revue de cause racine interdépartementale'
      approval: 'Directeur d''usine'

inspector_friendly:
  tagline: Inspection tierce partie
  title: Protocole adapté aux inspecteurs
  body: |
    Nous fournissons une zone d''inspection dédiée avec des manomètres calibrés, des tables lumineuses standardisées pour les contrôles de couture et de graphismes, et des Notes d''inspection pré-remplies afin que les agences tierces (SGS, BV, Intertek, QIMA) puissent compléter l''inspection avant expédition efficacement — économisant vos frais d''inspection.

    Chaque note résume les révisions documentaires applicables, la référence d''échantillon approuvée, les contrôles critiques pour la qualité, le niveau d''échantillonnage convenu, les tests fonctionnels et les exigences d''emballage et de code-barres pour le bon de commande. Les quantités, la qualité, le conditionnement et les éléments de sécurité de base spécifiés sont vérifiés par rapport aux références de projet approuvées — pas de chasse aux documents de dernière minute sur site.

