answer:
  label: 'Réponse directe'
  text: 'QINGDAO VATRAD GROUP.,LTD. contrôle la qualité des SUP gonflables par un système de vérification en 4 étapes : contrôle des matières entrantes (IQC), contrôle qualité en cours de fabrication (IPQC), test final des planches et vérification du gonflage (FQC), et conditionnement et autorisation avant expédition (OQC). Chaque commande est inspectée par rapport à l''échantillon approuvé, à la spécification technique, à l''épreuve des graphismes, à la BOM et aux normes d''emballage, avec vérification de l''étanchéité à l''air, contrôles visuels et dimensionnels, confirmation des accessoires et traçabilité des lots. Les articles échouant aux critères d''acceptation sont placés sous blocage ou quarantaine contrôlée, repris uniquement sous instructions approuvées et ré-inspectés avant l''autorisation de libération.'
  verified: '2026-08'

intro: 'Notre système qualité est conçu pour les projets OEM/ODM : les critères d''inspection sont définis par commande, documentés et suivis par les équipes de production et de qualité de la matière entrante au conditionnement. Cela maintient l''alignement des attentes qualité entre l''usine et votre marque, du premier échantillon aux expéditions de conteneurs complets.'

scope_note:
  tagline: Périmètre
  title: Critères d''inspection spécifiques au projet
  body: |
    Les spécifications qualité peuvent varier selon la construction de la planche (par ex. simple/double couche, drop-stitch tissé, rail fusionné), l''usage final prévu, les réglementations du marché cible et les paramètres approuvés par le client. L''autorisation de libération finale est strictement basée sur les critères d''inspection documentés convenus pour la commande.

stages:
  tagline: Cadre qualité
  title: Notre système de vérification qualité en 4 étapes
  subtitle: Une boucle QC complète de l''arrivée de la matière première à l''autorisation d''expédition.
  steps:
    - title: '1. Contrôle des matières entrantes (IQC)'
      desc: 'Les matériaux principaux et les composants achetés sont vérifiés par rapport aux spécifications approuvées et aux échantillons de référence avant d''entrer sur la ligne de production. Le drop-stitch et le PVC sont vérifiés pour l''identification du matériau, le lot fournisseur, le poids/densité, l''épaisseur, la correspondance des couleurs avec les échantillons approuvés et les défauts de surface. Les tapis de traction EVA sont vérifiés pour le motif, la couleur, l''épaisseur, la précision de découpe et la compatibilité de l''adhésif. Les valves et la quincaillerie subissent des tests de fonctionnalité, de filetage, d''intégrité du joint et de montage. Les accessoires et l''emballage (pompes, pagaies, ailerons, leashes, sacs, cartons) sont appariés pour la quantité, la couleur, la marque, la précision du code-barres et la version des graphismes par rapport à la BOM approuvée.'
    - title: '2. Contrôle qualité en cours de fabrication (IPQC)'
      desc: 'Les étapes de fabrication critiques sont inspectées pour détecter les non-conformités avant que les planches ne passent aux postes de travail suivants. La découpe et l''impression sont vérifiées pour les dimensions des panneaux, la disposition des graphismes, l''orientation miroir et la propreté des bords par rapport aux dessins techniques approuvés. L''assemblage de la planche et le collage des rails sont vérifiés pour la symétrie du contour, la continuité du recouvrement des coutures et l''élimination des vides ou poches d''air le long des zones à haute contrainte. La fixation des valves et des accessoires, les graphismes et le marquage sont vérifiés pour la position, l''orientation, la couverture de l''adhésif, l''orthographe du logo et la version des graphismes.'
    - title: '3. Test final des planches et vérification du gonflage (FQC)'
      desc: 'Les planches terminées subissent des essais physiques et structurels obligatoires avant l''approbation du conditionnement. Les planches sont gonflées à la pression d''inspection approuvée par le projet et maintenues pour vérifier la rigidité structurelle et la stabilité de pression. Les scans d''étanchéité à l''air couvrent le boîtier de valve, les coutures de rail, les cônes nez/queue et les joints de contrainte en utilisant des méthodes de détection de fuite calibrées (surveillance de la chute de pression ou test de bulles). L''inspection cosmétique et dimensionnelle vérifie les dimensions, le profil de rocker et l''alignement du tapis EVA (tolérance ±2 mm) sous un éclairage standard à la lumière du jour.'
    - title: '4. Conditionnement et autorisation avant expédition (OQC)'
      desc: 'Une vérification complète avant expédition garantit zéro écart de configuration SKU ou de marques d''expédition. La complétude du kit recoupe planche, aileron, leash, pagaie, pompe, sac, kit de réparation et manuel utilisateur par rapport à la BOM de commande. Les contrôles d''emballage et de code-barres vérifient les marques des cartons, les étiquettes SKU, la lisibilité des codes-barres, la langue du manuel et l''intégrité structurelle du carton. Les commandes ne sont libérées qu''après la signature de l''audit final d''emballage par un personnel qualité autorisé.'

inspection_points:
  tagline: Couverture d''inspection
  title: Points de contrôle d''inspection clés
  subtitle: Chaque point de contrôle est exécuté selon des critères d''acceptation documentés convenus par commande.
  features:
    - icon: A
      icon_bg: blue
      title: Vérification de l''étanchéité à l''air
      desc: 'Les planches terminées sont gonflées à la pression d''inspection approuvée et vérifiées pour la rétention de pression, l''état de la base de valve, les coutures de rail, les zones nez et queue et les emplacements à haute contrainte. Là où la procédure d''inspection l''exige, les zones suspectes de fuite sont examinées avec des méthodes de détection de fuite approuvées.'
    - icon: B
      icon_bg: green
      title: Inspection visuelle et dimensionnelle
      desc: 'Les planches sont inspectées sous un éclairage adapté pour l''état de la surface du matériau, les défauts d''impression, la variation de couleur, l''alignement EVA, les plis, les rayures, la contamination et l''apparence des collages. Les dimensions clés et les positions des accessoires sont vérifiées par rapport aux dessins ou spécifications approuvés.'
    - icon: C
      icon_bg: purple
      title: Vérification des accessoires et de l''emballage
      desc: 'La configuration complète du produit est vérifiée avant expédition : modèle de planche, système d''aileron, pagaie, pompe, leash, sac de transport, kit de réparation, manuel utilisateur et accessoires spécifiques au client — chacun apparié à l''échantillon approuvé, aux dessins et à la BOM.'
    - icon: D
      icon_bg: orange
      title: Conditionnement et autorisation d''expédition
      desc: 'Les unités emballées sont vérifiées pour la configuration SKU, la complétude des accessoires, les étiquettes produit, les informations de code-barres, la version du manuel, le marquage du carton, la quantité de conditionnement et l''état du carton. L''autorisation d''expédition n''est donnée qu''après complétion de toutes les exigences d''inspection et de conditionnement.'

traceability_intro:
  tagline: Traçabilité des lots
  title: Système de traçabilité au niveau du projet et du lot
  body: |
    Chaque commande de SUP personnalisée est gérée sous un code projet unifié reliant les spécifications techniques, la BOM approuvée, les révisions de graphismes, les numéros de lot des matériaux, les références de conditionnement et les enregistrements d''inspection. Les enregistrements de production et d''inspection sont conservés par le projet et le lot de production applicables, et chaque lot peut être relié à la spécification produit approuvée, à la BOM, aux graphismes et aux références de conditionnement.

    Cela soutient une revue efficace de la configuration produit, du statut d''inspection et du périmètre affecté lorsqu''un problème qualité est identifié — du produit fini aux enregistrements sources en utilisant l''identification de la planche ou du carton.

traceability_chain:
  tagline: Chaîne de traçabilité
  title: Du code projet à l''autorisation d''expédition
  subtitle: Une chaîne de références contrôlées de la confirmation de commande à l''expédition autorisée.
  steps:
    - step: '01'
      title: Code projet
      desc: Référence de projet unifiée qui relie chaque document contrôlé à la commande.
    - step: '02'
      title: Révisions de documents
      desc: Niveaux de révision actuels de la spécification, de la BOM, des graphismes et du conditionnement — seules les versions approuvées sont valides pour la production.
    - step: '03'
      title: Lot et matériaux
      desc: Lots de matériaux et de composants enregistrés contre le lot de production.
    - step: '04'
      title: Enregistrements d''inspection
      desc: Résultats d''inspection IQC, en cours de fabrication, d''étanchéité à l''air, finale et de conditionnement par lot.
    - step: '05'
      title: Conditionnement et libération
      desc: Lot de conditionnement, statut de clôture NCR et résumé d''autorisation d''expédition.

traceability_sample:
  tagline: Échantillon anonymisé
  title: Enregistrement de contrôle de traçabilité (Démo)
  body: |
    Les valeurs de démonstration sont affichées à titre d''illustration uniquement — les noms de clients, numéros de bons de commande, graphismes personnalisés, données fournisseurs et informations commerciales sont supprimés pour protéger la confidentialité.

    - **Fabricant :** QINGDAO VATRAD GROUP, LTD.
    - **Code projet :** DEMO-SUP-2026-01
    - **Référence SKU :** DEMO-TR-126
    - **Lot de production :** BATCH-AUG-01
    - **Révision Spécification / BOM / Graphismes :** Rev B / Rev C / Rev B
    - **Enregistrement d''étanchéité à l''air :** RÉUSSI — conservé par lot
    - **Statut d''inspection :** RÉUSSI
    - **Statut d''expédition :** LIBÉRÉ

quarantine_intro:
  tagline: Contrôle des non-conformités
  title: Contrôle des produits non conformes et mise en quarantaine
  body: |
    Les produits ou composants qui ne respectent pas les critères d''acceptation définis sont clairement identifiés et placés sous statut de blocage ou de quarantaine contrôlé. Ils ne peuvent pas passer à l''étape de production suivante, au conditionnement ou à l''expédition jusqu''à ce qu''une disposition autorisée soit complétée. La reprise est effectuée sous instructions approuvées et reliée à l''enregistrement de non-conformité concerné ; les articles repris sont ré-inspectés selon les exigences de projet applicables avant la libération qualité.

quarantine_flow:
  tagline: Flux de contrôle en 7 étapes
  title: Que se passe-t-il lorsqu''une non-conformité est trouvée
  subtitle: Identifier, contrôler, corriger, vérifier —puis libérer ou rejeter. Le produit non conforme ne retourne jamais dans la production ou le conditionnement sans contrôle.
  steps:
    - step: '01'
      title: Identifier
      desc: La non-conformité est enregistrée contre le produit, le SKU, le lot ou l''étape de processus affecté.
    - step: '02'
      title: Étiqueter
      desc: Les articles affectés sont clairement identifiés avec des étiquettes de statut contrôlées — HOLD, QUARANTINE ou REJECTED.
    - step: '03'
      title: Mettre en quarantaine
      desc: Les articles sont séparés dans une zone de quarantaine physiquement contrôlée ou contrôlée par système pour empêcher toute utilisation ou expédition involontaire.
    - step: '04'
      title: Évaluer le périmètre
      desc: Le périmètre affecté est revu par lot, étape de processus, lot de matériau et révision de document.
    - step: '05'
      title: Reprendre / remplacer
      desc: La correction n''est permise que par une disposition approuvée et une instruction de travail contrôlée.
    - step: '06'
      title: Ré-inspecter
      desc: Les articles corrigés sont ré-inspectés selon les critères d''acceptation applicables avant libération.
    - step: '07'
      title: Libérer ou rejeter
      desc: Seul le produit conforme autorisé passe au conditionnement ou à l''autorisation d''expédition.

