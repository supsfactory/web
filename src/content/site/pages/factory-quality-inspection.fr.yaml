faqs:
  tagline: FAQ
  title: Questions fréquentes sur le contrôle qualité des SUP
  items:
    - q: 'Comment QINGDAO VATRAD GROUP.,LTD. contrôle-t-il la qualité des planches de SUP gonflables ?'
      a: 'La qualité est contrôlée par l''inspection des matières entrantes, les points de contrôle du processus de production, la vérification finale du produit, l''inspection du conditionnement et la traçabilité de production — chacun exécuté selon des échantillons, des spécifications et des critères d''inspection approuvés par le projet.'
    - q: 'Quelles inspections qualité sont effectuées pendant la production de SUP ?'
      a: 'Les inspections incluent la vérification des matériaux, les contrôles de découpe et d''impression, l''inspection de la construction de la planche, la vérification de l''installation des valves, l''inspection des accessoires, le test d''étanchéité à l''air, l''inspection de l''apparence et la vérification du conditionnement.'
    - q: 'Les clients OEM peuvent-ils demander les enregistrements d''inspection SUP ?'
      a: 'Oui. Les enregistrements d''inspection et la documentation qualité peuvent être fournis selon les exigences du projet et les accords qualité clients, y compris des échantillons de rapports d''inspection avant expédition.'
    - q: 'Comment l''usine assure-t-elle la cohérence de la production OEM ?'
      a: 'La cohérence de production est maintenue grâce aux échantillons approuvés, aux spécifications techniques, aux points de contrôle de fabrication, aux procédures d''inspection et aux processus de contrôle qualité documentés reliés à chaque commande.'
    - q: 'Puis-je organiser une inspection tierce partie par SGS, BV, Intertek ou QIMA ?'
      a: 'Oui. Nous accueillons les inspecteurs tiers avec une zone d''inspection dédiée, des manomètres calibrés, des notes d''inspection pré-remplies et des enregistrements accessibles. Partagez votre spécification, votre échantillon approuvé, vos graphismes, vos exigences d''emballage et vos critères de défaut — ou utilisez notre modèle de note d''inspection tierce partie.'
    - q: 'Comment les modifications de graphismes, de BOM ou d''emballage sont-elles traitées pendant la production ?'
      a: 'Les modifications sont enregistrées dans notre journal de contrôle des modifications avec la révision documentaire affectée, le résumé de modification, la raison, l''évaluation d''impact, le statut d''approbation client et le lot effectif. Les versions obsolètes sont retirées afin que la production et l''inspection utilisent toujours les documents approuvés en vigueur.'
    - q: 'L''usine soutient-elle les projets de SUP gonflables personnalisés ?'
      a: 'Oui. Les projets OEM/ODM de SUP gonflables personnalisés sont soutenus selon les spécifications du client, les exigences de graphismes, les configurations d''accessoires et les besoins d''emballage, avec des critères d''inspection spécifiques au projet convenus avant la production.'
    - q: 'Une planche de SUP qui fuit peut-elle être reprise à l''usine ?'
      a: 'Oui — sous conditions contrôlées. La planche est placée sur HOLD et reliée à un NCR, la fuite est localisée avec une méthode de diagnostic approuvée, et la reprise ne procède qu''après autorisation QC/Ingénierie et uniquement dans les classes de défaut approuvées pour la reprise. La planche est ensuite ré-inspectée selon les mêmes critères d''acceptation qu''une planche conforme avant libération.'
    - q: 'Combien de fois l''usine peut-elle reprendre une planche ?'
      a: 'Un emplacement unique peut être repris une fois sous une instruction autorisée. Si la ré-inspection échoue encore, la planche est escaladée pour remplacement, rejet, mise au rebut ou concession client — la reprise répétée sans approbation documentée n''est pas permise.'

