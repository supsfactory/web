      title: Zone de test d''étanchéité à l''air
      desc: 'Planches gonflées maintenues dans la zone de test QC sous éclairage industriel, avec des manomètres numériques surveillant le test approuvé de maintien d''air à la base de valve, aux coutures de rail, au nez et à la queue et aux emplacements à haute contrainte. Les enregistrements sont conservés par lot et reliés à l''inspection finale.'
    - image: https://assets.supsfactory.com/site/quality/qc-hold-quarantine-station.avif
