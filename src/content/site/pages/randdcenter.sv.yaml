hero:
  tagline: R&D-centrum
  title: R & D-centrum
  subtitle: Fokus på framsteg

intro:
  - Vatrads forsknings- och utvecklingscentrum (R&D) är drivkraften bakom vår mission att förnya vattensportutrustning. Med outtröttlig innovation inom uppblåsbara stand up paddleboards (SUP) och gummibåtar möjliggör vi säkrare, bekvämare och vackrare produkter för vattensportsentusiaster över hela världen. Vårt dedikerade team av ingenjörer, designers och erfarna vattensportsfascinerade format framtiden för branschen och höjer ständigt ribban inom kvalitet, prestanda och hållbarhet.
  - Vår R&D-anläggning samlar materialforskare, sjöingenjörer och tillverkningsingenjörer under ett tak. Från tygformulering och skeppssimulering till utveckling av svetsprocesser och storskaliga vattenprov — varje fas av produktutvecklingen drivs av data och valideras genom tester.

