vision:
  tagline: Vår vision
  title: Formge vattensportens framtid
  body: Vatrad strävar efter att leda branschen för gummibåtar och SUP genom kontinuerlig innovation, konsekvent kvalitet och ett starkt engagemang för säkerhet och hållbarhet — och därmed berika vattensportsentusiastens upplevelser över hela världen. Vatrads R&D-centrum är platsen där passion möter innovation och där nya riktmärken för vattensportsbranschen sätts.

labs_section:
  tagline: Laboratorier
  title: Våra laboratorium
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: Laboratorium för PVC-tyger
      description: Kontinuerlig forskning och testning av uppblåsbara PVC- och Hypalon-material vad gäller draghållfasthet, UV-beständighet, slitage och köldflexibilitet, för långsiktig tillförlitlighet i marina miljöer.
      href: /sv/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Studio för skeppsbyggnadsteknik
      description: CAD-stödd design och finita elementanalys av skepp i HDPE, aluminium och glasfiber. Varje skepp simuleras digitalt för spänningsfördelning och slaghållfasthet innan den första prototypen byggs.
      href: /sv/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: HF-svetscenter
      description: Specialiserad högfrekvenssvetsanläggning med noggrann kontroll av temperatur och tryck, som producerar extremt starka, lufttäta sömmar enligt branschstandarder för uppblåsbara båtar.
      href: /sv/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hydrodynamisk släpptank
      description: Modellprov i vår släpptank för att optimera skeppsform, planering, stabilitet och effektivitet över ett intervall av last- och vågförhållanden.
      href: /sv/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypverkstad
      description: Anläggning i full storlek för prototyper och färdigställande, där nya modeller byggs, färdigställs och provas på vattnet. Varje prototyp genomgår ett vattentestprogram på minst 20 timmar innan den godkänns för produktion.
      href: /sv/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Kvalitets- & testlaboratorium
      description: Dedikerat kvalitetslaboratorium för dragprovning, lufttäthetscykler, svetsfogsprovning och materialcertifiering, för att säkerställa att varje bräda som lämnar verkstaden uppfyller våra publicerade specifikationer.
      href: /sv/randdcenter/quality-inspection-lab
