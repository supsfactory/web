capabilities:
  tagline: Kapacitet
  title: R&D-kapacitet
  subtitle: Fyra kärndiscipliner ger oss full kontroll över produktutvecklingen från början till slut — från råvaruforskning till slutlig certifiering.
  groups:
    - title: Materialvetenskap & tygteknik
      items:
        - Analys och optimering av PVC- och Hypalon-formuleringar
        - Utveckling av UV-stabilisering, flamskydd och antimikrobiella tillsatser
        - Flerskiktslaminering av tyger och teknik för limfogar
        - Accelererade åldringstester (UV, termisk, fukt, saltspray)
    - title: Skeppsbyggnadsteknik & hydrodynamik
      items:
        - Parametrisk 3D-skeppsdesign och CFD-optimering
        - Finita elementanalys för strukturella och stötbelastningar
        - Släpptankarprov med modeller och prestandavalidering
        - Anpassad skeppsutveckling för speciella användningsprofiler
    - title: Svetssteknik & förbandsteknik
      items:
        - Utveckling och optimering av det dielektriska HF-svetsprocessen
        - Varmlufts-, varmklisters- och ultraljudssvetsprocesser
        - Kvalificering av limfogar och fogband
        - Modellering av svetsstyrka och livslängdsprognos
    - title: Testning, certifiering & konformitet
      items:
        - Kvalitetsledning och CE-konformitetstester
        - Stöd för oberoende partitester och certifiering av tredje part
        - Utveckling av anpassade testprotokoll för inköpskvalificering
        - Analys av fältfel och orsaksutredning

