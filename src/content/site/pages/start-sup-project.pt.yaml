what_we_need:
  heading: 'O que preparar antes do briefing'
  body: |
    Um briefing completo acelera o processo. Eis o que ajuda:

    - **Especificações da prancha** — comprimento, largura e espessura-objetivo, peso do rider, uso previsto. As medidas de referência de pranchas ou modelos da concorrência são úteis.
    - **Ficheiros de design** — gráficas vetoriais (AI, SVG, PDF) para gráficas e logótipos. Se ainda não estão prontos, para a primeira viabilidade bastam moodboards ou imagens de referência.
    - **Quantidade & prazos** — quantidade-objetivo e plano de época. Basta já uma estimativa aproximada ("20–50 pranchas até março") para começar.
    - **Requisitos de conformidade** — mercados-alvo e requisitos de certificação específicos além de CE, ISO 9001, BSCI, REACH, RoHS.
    - **Quadro de orçamento** — um orçamento indicativo por prancha ou um custo de destino-objetivo ajuda-nos a aconselhar a plataforma certa.

    **Ainda não está tudo pronto?** Envia o que tens. Nós guiamos-te pelo resto.

faqs:
  tagline: FAQ
  title: 'Iniciar um projeto SUP — Perguntas frequentes'
  items:
    - q: 'Qual é a encomenda mínima para começar?'
      a: 'A entrada é escalonada: primeiro 1–2 amostras (7–12 dias), depois uma encomenda de prova de 20–50 pranchas (25–35 dias) e, em seguida, ciclos de série padrão de 90–100+ pranchas por configuração aprovada. O co-branding private label parte das 5–10 unidades sem fase de desenvolvimento.'
    - q: 'Quanto tempo é necessário para receber as amostras?'
      a: 'As amostras físicas são produzidas em 7–12 dias a partir da confirmação da especificação e do sinal. Com plataformas de casco existentes, todo o ciclo do briefing à encomenda de prova entregue exige normalmente 8–12 semanas. Um casco personalizado acrescenta 15–20 dias de desenvolvimento do molde.'
    - q: 'O meu design está protegido?'
      a: 'Sim. Uma NDA está disponível imediatamente — antes de partilhares informações confidenciais. Produzimos exclusivamente com a marca dos nossos clientes e nunca competimos com eles. Todos os ficheiros técnicos são conservados em sistemas com controlo de acessos e auditoria.'
    - q: 'O que pede o formulário de briefing de projeto?'
      a: 'O briefing pede o tipo de atividade, o nome da empresa, as especificações-objetivo da prancha, a faixa de quantidade de encomenda, os prazos e eventuais requisitos de conformidade. Leva cerca de 5–10 minutos. Podes anexar ficheiros de design (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) até 10 MB. Se não tens a certeza de um campo, salta-o — nós voltamos a contactar-te.'
    - q: 'O que acontece depois do envio do briefing?'
      a: 'Recebes uma resposta num dia útil. O gabinete técnico examina o teu briefing e fornece uma proposta detalhada com MOQ, custos das amostras e um plano por etapas. Não surge nenhum compromisso até examinares e assinares o contrato. Os custos das amostras são creditados na tua encomenda de produção.'

