answer:
  label: 'O que acontece depois'
  text: 'Depois de enviar um briefing de projeto, recebes uma resposta num dia útil. Antes de partilhar detalhes confidenciais está disponível uma NDA. O gabinete técnico examina o teu briefing e fornece uma proposta detalhada com MOQ, custos das amostras e um plano por etapas — em geral 7–12 dias para as amostras e 6–8 semanas para a primeira produção a partir da PO confirmada. Os custos das amostras são creditados na tua encomenda de produção. Nenhum compromisso até à assinatura.'
  verified: 'September 2026'

process_steps:
  tagline: O processo
  title: 'Do briefing às pranchas entregues — cinco passos'
  subtitle: 'Cada passo tem um tempo definido, um resultado documentado e uma milestone go/no-go. Avanças apenas quando estás pronto.'
  steps:
    - step: 'Passo 1'
      title: 'Envia o teu briefing de projeto'
      desc: 'Conta-nos sobre a tua prancha — especificações-objetivo, quantidade, requisitos de conformidade e prazos. O briefing leva 5–10 minutos. Se não tens a certeza de algum detalhe, partilha o que tens e nós guiamos-te no resto. Uma NDA está disponível antes de partilhares designs confidenciais.'
    - step: 'Passo 2'
      title: 'NDA & verificação de viabilidade (1–5 dias)'
      desc: 'Mediante pedido assinamos uma NDA, depois o gabinete técnico verifica o teu briefing face à capacidade produtiva, à disponibilidade de materiais e ao âmbito de conformidade. Recebes uma proposta detalhada com o cálculo da MOQ, os custos das amostras e um plano por etapas.'
    - step: 'Passo 3'
      title: 'Amostras & aprovação (7–21 dias)'
      desc: '1–2 pranchas físicas segundo a tua especificação. Remas e avalias — rigidez do casco, precisão gráfica, ajuste dos acessórios. As alterações são registadas numa BOM revista. A amostra aprovada torna-se a referência de produção. Os custos das amostras são creditados na produção.'
    - step: 'Passo 4'
      title: 'Planeamento de pré-produção (7 dias)'
      desc: 'Aprovisionamento dos materiais, preparação dos moldes, confirmação da embalagem e reserva do slot de produção. Todos os materiais são inspecionados à entrada face à BOM congelada. Antes do arranque da produção é emitido um plano com as datas dos gates QC.'
    - step: 'Passo 5'
      title: 'Produção, QC & envio (4–6 semanas)'
      desc: 'A produção passa pelo sistema de gates de inspeção de 7 níveis, com critérios aprovado/reprovado em cada gate. Embalagem conforme à exportação, documentação de conformidade e coordenação do transporte marítimo para mais de 50 países. Uma análise pós-entrega recolhe as melhorias para a encomenda seguinte.'

