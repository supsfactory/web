how_to_choose:
  title: Oikean koon valinta
  cards:
    - title: SUP-laudat
      description: Valitse pituus painosi ja aiotun käytön mukaan. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Pidemmät laudat (11-12 ft) kulkevat touring-käytössä paremmin. Raskaat melojat tarvitsevat suuremman tilavuuden laudat.
    - title: Touring-SUP-laudat
      description: Pidemmät laudat (11–12 ft) sopivat parhaiten matkojen kulkemiseen ja touring-käyttöön. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Tarkista painoraja koko kuorman osalta varusteet mukaan lukien.
    - title: Allround-SUP-laudat
      description: Valitse pituus melojan painon ja aiotun käytön mukaan. Allround-laudat sopivat vapaa-aikaan, kuntoon ja joogaan. Pienemmät laudat ovat ketterämpiä.

