why_north_america:
  tagline: 'Warum Käufer in Nordamerika'
  title: 'Für nordamerikanische Importe gebaut'
  subtitle: 'Die Fabrik beantwortet die Fragen, die Marken und Händler aus den USA und Kanada vor ihrem ersten Container stellen.'
  items:
    - title: 'DDP für planbare Landed-Kosten'
      description: 'DDP umfasst Zollabfertigung und Lieferung zu Ihrem Lager — Abgaben, Steuern und Fracht in einem Gesamtbetrag. Die beliebteste Wahl für Erstimporteure in die USA und nach Kanada.'
    - title: 'Anbindung West- und Ostküste'
      description: 'Wir kalkulieren Seefracht zu west- und ostküstlichen Häfen, je nachdem, was Transitzeit und Landed-Kosten für Ihre Logistik optimal ausbalanciert.'
    - title: 'Prüf- und Zolldokumentation'
      description: 'CE-, REACH- und Zolldokumentation wird für Ihre Zielmärkte erstellt, sodass Ihre Unterlagen für US-amerikanische und kanadische Einfuhrprozesse funktionieren.'
    - title: 'Eine Fabrik, ein Qualitätssystem'
      description: 'Entwicklung, Muster, Produktion und QC finden alle im 12,500-m²-Werk statt — keine Umwege über Makler, keine Muster, die die Produktion nicht erreichen kann.'

process_notes:
  tagline: 'So funktioniert es'
  title: 'Von der Spezifikation zum Container'
  subtitle: 'Dieselben sechs Stufen, ob Sie zwei Container pro Jahr oder zwanzig kaufen: Spezifikation, Engineering, Muster, Prüfung, Werkzeugbau, Produktion — dann FOB-, CIF- oder DDP-Lieferung.'
  items:
    - title: '1. Senden Sie Ihre Spezifikation'
      description: 'Ein Referenzboard, eine Skizze oder eine Konkurrenzspezifikation genügt. Engineering-Prüfung und Angebot kommen innerhalb eines Werktags.'
    - title: '2. Geben Sie das Muster frei'
      description: 'Ihr erstes physisches Muster versendet in 7–12 Tagen mit einem Freigabebogen zu Konstruktion, Druckfarben und Drucktestergebnissen.'
    - title: '3. Produktion & Export'
      description: 'Läufe werden in 25–35 Tagen mit QC-Checkpoints während der Produktion abgeschlossen. Packliste, Rechnung und Konnossement reisen dem Schiff voraus.'
    - title: '4. Lieferung zu Ihrem Lager'
      description: '4–6 Wochen Seefracht in die USA und nach Kanada — bei DDP übernehmen wir Abfertigung und Lieferung bis vor Ihre Tür.'

faq_section:
  tagline: FAQ
  title: 'Fragen zum Import nach Nordamerika'
  questions:
    - q: Wie lange dauert die Seefracht in die USA und nach Kanada?
      a: 'Rechnen Sie 4–6 Wochen vom Hafen Qingdao zu den Hauptcontainereingängen an der US-amerikanischen West- und Ostküste sowie zu kanadischen Häfen, je nach Bestimmungsort und Abfahrtsplan. DDP-Projekte enthalten die vollständige Tür-zu-Tür-Zeitlinie.'
    - q: Versenden Sie DDP in die USA und nach Kanada?
      a: 'Ja. DDP umfasst Seefracht, Zollabfertigung, Abgaben und Steuern sowie Lieferung zu Ihrem Lager — ein planbarer Gesamtpreis. FOB Qingdao und CIF sind ebenfalls verfügbar.'
    - q: Wie hoch ist die MOQ für einen Private-Label-SUP-Import?
      a: 'Die MOQ wird durch die Projektkonfiguration bestätigt: Musterentwicklung deckt 1–2 Stück ab, Pilotchargen laufen mit 20–50 Stück auf bestehenden Plattformen, und die Standard-Serienfertigung läuft mit 90–100+ Stück pro Design aus einer vollen 150-m-Drop-Stitch-Rolle.'
    - q: Unterstützen Sie die Zolldokumentation für die USA und Kanada?
      a: 'Ja. Die Dokumentation wird für Ihre Zielmärkte erstellt — einschließlich der Einfuhrunterlagen, die in US-amerikanische und kanadische Zollprozesse passen.'
    - q: Kann ich die Fabrik vor der Bestellung besuchen?
      a: 'Ja. Das 12,500-m²-Werk in Qingdao steht Kunden offen — virtuelle Fabrikbesichtigungen können online vereinbart werden, und persönliche Besuche werden durch die Produktionslinien und QC-Stationen geführt.'
    - q: Wie starte ich ein Projekt aus Nordamerika?
      a: 'Senden Sie ein Referenzboard, eine Skizze oder eine Spezifikation. Die Engineering-Prüfung und das Angebot kommen innerhalb eines Werktags, und vor jedem Dateiaustausch wird eine NDA unterzeichnet.'

