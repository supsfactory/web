key_factors:
  heading: 'Fattori importanti oltre al tipo di costruzione'
  body: |
    Il tipo di costruzione è una variabile della performance della tavola. Altri tre fattori sono altrettanto importanti o di più:

    - **Densità del drop-stitch** — I fili per pollice determinano quanto uniformemente la tavola mantiene la sua forma sotto pressione. Usiamo standard di 96 fili/pollice e 140 fili/pollice per le build performance. Densità maggiore = tavola più piatta = migliore planata.
    - **Qualità e spessore del PVC** — Non tutto il PVC è uguale. Il PVC da 0.7 mm importato dalla Corea ha una resistenza alla lacerazione e una protezione UV superiori rispetto alle alternative più sottili. Specificiamo la qualità del materiale per progetto.
    - **Costruzione delle rail** — Le rail monostrato sono il punto di rottura più comune nelle tavole economiche. Le rail a doppio strato e il rail tape rinforzato riducono drasticamente il rischio di forature delle rail. Tutte le nostre tavole usano rail rinforzate indipendentemente dal livello di costruzione.

faqs:
  tagline: FAQ
  title: 'Costruzione SUP — Domande frequenti'
  items:
    - q: 'Quale tipo di costruzione dovrei scegliere per il mio marchio?'
      a: 'Dipende dal tuo mercato target e dal posizionamento di prezzo. Entry-level e grande distribuzione: monostrato. Flotte di noleggio, associazioni e marchi medi: doppio strato. Performance, tour e premium: nucleo drop-stitch. La maggior parte dei marchi parte con il doppio strato come miglior compromesso tra costo, durata e esperienza di guida. Consigliamo in base al tuo mercato specifico durante la verifica di fattibilità.'
    - q: 'Posso offrire più livelli di costruzione sotto un unico marchio?'
      a: 'Sì — molti marchi offrono due o tre livelli. Produciamo tutte e tre le costruzioni sulla stessa linea con gli stessi gate QC, così puoi mescolare i tipi di costruzione all''interno di un singolo ordine. Forma dello scafo e grafiche possono essere identiche su tutti i livelli; cambiano solo costruzione e materiali.'
    - q: 'Quale standard di test di pressione vale per tutte le costruzioni?'
      a: 'Ogni tavola, indipendentemente dal tipo di costruzione, supera un test di tenuta a 18.0 PSI con scarto automatico in caso di caduta di pressione superiore a 0.50 PSI in 24 ore. Le tavole monostrato sono progettate per 12–15 PSI di pressione di guida, quelle a doppio strato per 15–18 PSI e quelle a nucleo drop-stitch per 18–25 PSI. La pressione di test supera la pressione nominale di tutti i tipi.'
    - q: 'In che modo la costruzione incide sulle richieste in garanzia?'
      a: 'Le tavole monostrato hanno un tasso di richieste in garanzia leggermente più alto nell''uso commerciale/di noleggio a causa di rail e forature. Le costruzioni a doppio strato e a nucleo drop-stitch hanno tassi di richieste nettamente inferiori. Forniamo dati di garanzia per livello tratti dai nostri registri di produzione durante la fase di offerta.'

