workshops:
  - title: Produção SUP
    description: '4 linhas de montagem automatizadas para SUP insufláveis com uma produção combinada de cerca de 10,000 pranchas por mês. As estações de impressão digital e serigrafia operam em paralelo. Capacidade SUP anual: mais de 120,000 pranchas.'
    output: '120,000+ SUP/ano'
  - title: Produção SUP — linhas de expansão
    description: 'Linhas de montagem automatizadas adicionais para SUP, ativadas assim que os volumes crescem. A colagem do núcleo drop-stitch, a impressão digital e as estações de montagem operam em paralelo.'
    output: 'Parte da capacidade anual de mais de 120,000 SUP'
  - title: Acessórios SUP & montagem mista
    description: 'Linhas de montagem multifuncionais para acessórios SUP — pás, aletas, leashes, bolsas e kits. As estações de soldadura a ar quente, as prensas dieletricas HF e os bancos de montagem são reconfigurados consoante o mix de encomendas. Capacidade anual de acessórios: mais de 5,000 unidades.'
    output: '5,000+ acessórios/ano'
  - title: Equipamento de segurança
    description: 'Área de produção separada em sala limpa para coletes salva-vidas e equipamento de segurança. Estações dedicadas de costura, inserção de espuma e ensaio. Capacidade anual de coletes salva-vidas: mais de 50,000 unidades.'
    output: '50,000+ coletes salva-vidas/ano'

oem_capacity:
  moq: 'SUP: amostra 1–2 | piloto 20–50 | quantidade 90–100+ (por bobina de 150 m)'
  lead_time: 'Padrão 25–35 dias. Amostras 7–12 dias. Expresso disponível.'
  payment: 'T/T 30% sinal + 70% saldo. L/C, Western Union aceites.'

lead_time_explainer:
  tagline: 'Planeamento & programação'
  title: 'Como a capacidade se traduz na tua entrega'
  subtitle: 'A capacidade não é um número único — eis como os prazos de entrega são realmente atribuídos.'
  items:
    - title: 'A capacidade varia com a tua especificação'
      body: 'Os slots disponíveis mudam com o tipo de prancha, a complexidade da construção, a embalagem e a procura sazonal. Durante o build-up de primavera/verão as linhas correm quase a plena capacidade e os slots para amostras esgotam-se em primeiro lugar.'
    - title: 'Planeia antes da tua estação de lançamento'
      body: 'Define antecipadamente a confirmação da amostra e o freeze gráfico. As encomendas de repetição são programadas no teu slot de repetição acordado assim que o golden sample é arquivado.'
    - title: 'Três vias de programação'
      body: 'As amostras entram primeiro na linha de protótipos, as encomendas iniciais caem na próxima janela de montagem livre e as encomendas de repetição correm no seu slot de repetição.'
    - title: 'Prazos de entrega vinculativos após verificação'
      body: 'Confirmamos um prazo de entrega vinculativo apenas depois de a especificação, as gráficas, a embalagem e a quantidade serem verificadas — nunca como promessa fixa antecipada.'

cta:
  title: 'Verifica a disponibilidade produtiva para a tua data de lançamento'
  subtitle: 'Envia o tipo de prancha, a quantidade e a data de envio alvo — respondemos com a próxima janela produtiva livre e uma estimativa de entrega vinculativa.'
