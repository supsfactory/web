meta:
  title: 'Capacidade produtiva — Fábrica de 12,500 m² | {SITE}'
  description: 'Capacidade da fábrica Vatrad: instalação de 12,500 m² com uma produção anual de mais de 120,000 SUP e possibilidade de expansão. Produção OEM/ODM de SUP insufláveis de alto volume.'
  dateModified: '2026-08-07'
