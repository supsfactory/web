hero:
  tagline: 'Ghid de conformitate'
  title: 'Conformitatea SUP pe piețe'
  subtitle: 'Fiecare piață țintă are cerințe distincte de certificare, etichetare și documentație. Acest ghid cartografiază peisajul conformității pentru plăcile SUP gonflabile pe principalele piețe — UE, America de Nord, Australia și dincolo — astfel încât să specificați domeniul corect la momentul ofertării, nu după producție.'

answer:
  label: 'Răspuns rapid'
  text: 'Pentru UE: marcajul CE este obligatoriu pentru plăcile vândute în Spațiul Economic European — noi certificăm modelele destinate piețelor UE, cu domeniul confirmat proiect cu proiect. Pentru SUA: se aplică CPSIA și reglementările statale privind VOC. Pentru Australia: conformitate cu AS/NZS 1586. Pentru toate piețele: ISO 9001 (fabrică), BSCI (audit social), REACH și RoHS (materiale) sunt standard în producția noastră, indiferent de destinație. Domeniul de conformitate și costurile sunt defalcate în ofertă — fără surprize după producție.'
  verified: 'Septembrie 2026'

