  tagline: 'Cerințe pe regiuni'
  title: 'Cerințe de conformitate pe piața țintă'
  subtitle: 'Domeniul de certificare este confirmat proiect cu proiect în etapa de analiză a fezabilității. Mai jos sunt cerințele tipice pe piețe.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
