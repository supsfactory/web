      desc: 'Marcajul CE este obligatoriu. REACH (securitate chimică), RoHS (substanțe restricționate), certificare de fabrică ISO 9001. Încărcări specifice produsului, conform directivei PPE sau directivei pentru ambarcațiuni recreative, după caz. Etichetare în limba oficială a țării de destinație. Audit social BSCI disponibil.'
    - icon: US
      icon_bg: green
