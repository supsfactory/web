answer:
  label: 'Kurze Antwort'
  text: 'Wir verwandeln ein CAD-Modell in ein fahr- und testfähiges Muster-Board in 7–12 Tagen: aufblasbares Prototyping, Testfahrten im Wellengang, Iterationen an Rail und Nose, danach die Entscheidung für das Produktionswerkzeug. Kompletter individueller Formenbau dauert 15–20 Tage zusätzlich zur Standardlieferzeit der Serienproduktion von 25–35 Tagen.'
  verified: 'September 2026'

