faq_section:
  tagline: FAQ
  title: Вопросы о разработке ODM
  questions:
    - q: Чем ODM отличается от OEM?
      a: 'ODM (Original Design Manufacturing) начинается с вашего брифа — наши инженеры разрабатывают конструкцию доски, её устройство, графику и упаковку, будь то на основе рыночной концепции, целевых характеристик или адаптации проверенной платформы. Вы утверждаете дизайн до производства. OEM (Original Equipment Manufacturing) производит по вашей утверждённой спецификации — вашим чертежам, габаритам, материалам и упаковке. Дизайн и права интеллектуальной собственности принадлежат вам. Оба пути проходят через один и тот же завод, систему контроля качества и экспортную команду; ODM — самый быстрый путь к брендированной доске, если дизайна у вас ещё нет.'
    - q: У меня только смутная идея — с чего начать?
      a: 'Пришлите короткий бриф: целевые пользователи, сценарии использования, примерный размер, рынки и объёмы. Наши инженеры в течение одного рабочего дня вернут концепцию, направление по образцу и план разработки — при необходимости NDA подписывается до любого детального обмена.'
    - q: Сколько времени занимает разработка новой доски SUP?
      a: 'Образцы прототипа отгружаются за 7–12 дней. Новый корпус со специальной пресс-формой добавляет 15–20 дней инженерной работы до изготовления образцов. Производственные серии занимают 25–35 дней после заказа и задатка.'
    - q: Каков MOQ для доски ODM?
      a: 'Стандартное серийное производство выполняется партиями по 90–100 шт. на рулон drop-stitch 150 m; пилотные партии начинаются с 20–50 шт. на готовых платформах. Мелкосерийный со-брендинг начинается с 5–10 шт. — полный расчёт приведён в нашем руководстве по MOQ и гибкому брендингу.'
    - q: Кому принадлежит дизайн и пресс-форма?
      a: 'Ваш бриф, дизайн и оснастка защищены NDA, условиями лицензирования бренда и положениями о праве собственности на пресс-форму или её выкупе, зафиксированными в договоре. Оснастка хранится для вашего бренда и может быть передана.'
    - q: Можете ли вы разработать конкретную форму (туризм, рыбалка, гонки, йога)?
      a: 'Да. Инженерия корпуса охватывает все основные категории SUP — универсальные, туристические, гоночные, для йоги, для рыбалки и многоместные — с возможностью валидации на гидродинамическом испытательном бассейне для высоких характеристик.'
    - q: Какими сертификатами будет обладать разработанная доска?
      a: 'ISO 9001:2015 — менеджмент качества (на уровне всего завода), BSCI — социальная ответственность (аудит площадки amfori), документация о соответствии CE для применимых конфигураций для рынка ЕС (директива о recreational craft — область действия подтверждается по каждому проекту), REACH (материалы), RoHS (электронные аксессуары) и соответствие ISO 25649 для применимых моделей надувных SUP. Сертификационные документы готовятся под каждый заказ для ваших рынков экспорта.'

process:
  title: Процесс ODM — от брифа к масштабированному производству
  subtitle: 'Шесть контролируемых этапов выполняет одна и та же внутренняя команда, которая проектирует, изготавливает образцы и масштабирует вашу доску — всё остаётся задокументированным.'
  steps:
    - phase: '01'
      title: Бриф и концепция
      period: 1 рабочий день
      items:
        - 'Вы предоставляете целевых пользователей, сценарии использования, размеры, рынки и объёмы — или просто идею.'
        - 'Наши инженеры возвращают направление концепции, варианты платформ и план разработки.'
    - phase: '02'
      title: Проектирование корпуса и конструкции
      period: Неделя 1–2
      items:
        - 'Габариты доски, характер корпуса, плотность drop-stitch и структура PVC проектируются собственными силами.'
        - 'Графика, компоновка накладок EVA и концепция упаковки разрабатываются под ваш бренд.'
    - phase: '03'
      title: Пресс-форма и оснастка
      period: +15–20 дней (новые формы)
      items:
        - 'Специальная оснастка проектируется и нарезается под новые формы корпуса; готовые платформы пропускают этот этап.'
        - 'Условия о владении оснасткой фиксируются в договоре до начала нарезки.'
    - phase: '04'
      title: Прототип и образец
      period: 7–12 дней
      items:
        - 'Физический прототип изготавливается, испытывается и отправляется вам на рассмотрение — включены испытания на воде.'
        - 'Образец (1–2 шт.) подтверждает форму, конструкцию и брендинг до серийного производства.'
    - phase: '05'
      title: Валидация и утверждение
      period: Параллельно
      items:
        - 'Проверки герметичности, удержания давления, прочности швов, нагрузки и УФ-стойкости для каждой производственной линии.'
        - 'Документация по CE, ISO 9001, BSCI, REACH и RoHS готовится для ваших рынков экспорта.'
        - 'Вы утверждаете прототип; заказ и задаток фиксируют слот под производство.'
    - phase: '06'
      title: Производство и поставка
      period: 25–35 дней
      items:
        - 'Стандартные партии составляют 90–100+ шт. на рулон 150 m, пилотные партии — от 20–50 шт.'
        - 'Включены экспортная упаковка, доставка FOB/CIF/DDP более чем в 50 стран и поддержка повторных заказов.'

