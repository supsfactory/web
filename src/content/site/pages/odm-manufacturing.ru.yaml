answer:
  label: 'Короткий ответ'
  text: 'iSupfactory — производитель SUP по модели ODM в Циндао, Китай. Разработка ODM начинается с вашего брифа, а не с ваших чертежей: проектирование корпуса (длина, ширина, rocker, объём), структуры материала и графики выполняется собственными силами, подтверждается образцами прототипа за 7–12 дней и производится при стандартном серийном MOQ 90–100 шт. на партию рулона 150 m (пилотные партии от 20–50 шт.). Производственные серии занимают 25–35 дней после подтверждения заказа и задатка; изготовление специальной пресс-формы добавляет 15–20 дней. Документация по CE, ISO 9001, BSCI, REACH и RoHS отгружается с каждым заказом.'
  verified: 'Сентябрь 2026'

