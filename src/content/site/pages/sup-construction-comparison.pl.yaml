key_factors:
  heading: 'Kluczowe czynniki poza typem konstrukcji'
  body: |
    Typ konstrukcji to tylko jedna ze zmiennych wpływających na właściwości deski. Trzy dodatkowe czynniki mają równie wielkie, a nawet większe znaczenie:

    - **Gęstość drop-stitch** — Liczba nici na cal decyduje o tym, jak równomiernie deska utrzymuje kształt pod ciśnieniem. Stosujemy standardowo 96 nici na cal, a 140 nici na cal w wersjach sportowych. Wyższa gęstość = płaska deska = lepsze ślizganie.
    - **Klasa i grubość PCV** — Nie każdy PCV jest taki sam. PCV o grubości 0,7 mm importowany z Korei ma wyższą wytrzymałość na rozciąganie i lepszą odporność na UV niż cieńsze alternatywy. Klasę materiału dobieramy dla każdego projektu.
    - **Konstrukcja krawędzi** — Krawędzie w jednowarstwowych deskach to najczęstsze miejsce awarii w tanich modelach. Dwuwarstwowość i wzmocniona taśma krawędziowa drastycznie ograniczają ryzyko przebicia krawędzi. Wszystkie nasze deski mają wzmocnione krawędzie, niezależnie od segmentu konstrukcji.

faqs:
  tagline: FAQ
  title: 'Konstrukcja SUP — najczęściej zadawane pytania'
  items:
    - q: 'Jaki typ konstrukcji powinienem wybrać dla mojej marki?'
      a: 'To zależy od Twojego rynku docelowego i pozycjonowania cenowego. Segment podstawowy i duże sieci handlowe: jedna warstwa. Floty najmowe, kluby i marki średniego segmentu: dwie warstwy. Sport, touring i premium: rdzeń drop-stitch. Większość marek zaczyna od dwóch warstw jako najlepszego kompromisu między kosztem, trwałością a odczuciami użytkownika. Rekomendujemy wariant w oparciu o Twój konkretny rynek podczas przeglądu wykonalności.'
    - q: 'Czy mogę oferować kilka segmentów konstrukcji pod jedną marką?'
      a: 'Tak — wiele marek oferuje dwa lub trzy segmenty. Wszystkie trzy konstrukcje produkujemy na tej samej linii z tymi samymi bramkami QC, więc możesz mieszać typy konstrukcji w ramach jednego zamówienia. Kształt kadłuba i grafika mogą być identyczne we wszystkich segmentach; różnią się tylko konstrukcja i materiały.'
    - q: 'Jaka jest norma badania ciśnieniowego dla wszystkich konstrukcji?'
      a: 'Każda deska, niezależnie od typu konstrukcji, przechodzi próbę podtrzymania 18.0 PSI z automatycznym odrzuceniem przy spadku ciśnienia powyżej 0.50 PSI w ciągu 24 godzin. Deski jednowarstwowe mają znamionowe ciśnienie użytkowe 12–15 PSI, dwuwarstwowe 15–18 PSI, a z rdzeniem drop-stitch 18–25 PSI. Ciśnienie próbne przekracza ciśnienie znamionowe dla wszystkich typów.'
    - q: 'Jak konstrukcja wpływa na reklamacje gwarancyjne?'
      a: 'Deski jednowarstwowe mają nieco wyższy wskaźnik reklamacji gwarancyjnych w zastosowaniach komercyjnych i wynajmowych z powodu ekspozycji krawędzi i przebić. Konstrukcje dwuwarstwowe i z rdzeniem drop-stitch mają znacząco niższe wskaźniki. Dane gwarancyjne dla każdego segmentu przekazujemy z naszych zapisów produkcyjnych na etapie wyceny.'

