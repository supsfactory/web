key_factors:
  heading: 'Vigtige faktorer ud over konstruktionstypen'
  body: |
    Konstruktionstypen er en variabel i brættets ydelse. Tre yderligere faktorer betyder lige så meget eller mere:

    - **Drop-stitch-tæthed** — Tråde pr. tomme afgør, hvor jævnt brættet holder formen under tryk. Vi bruger 96 tråde/tomme som standard og 140 tråde/tomme til ydelsesbyggeri. Højere tæthed = fladere bræt = bedre glidning.
    - **PVC-kvalitet og tykkelse** — Ikke al PVC er ens. Koreansk importeret 0.7 mm PVC har højere revnestyrke og UV-bestandighed end tyndere alternativer. Vi specificerer materialekvalitet pr. projekt.
    - **Kantkonstruktion** — Etlagskanter er det mest almindelige fejlpunkt på billige brætter. Tolags og forstærket kanttape reducerer risikoen for punktering i kanten drastisk. Alle vores brætter bruger forstærkede kanter uanset konstruktionsniveau.

faqs:
  tagline: FAQ
  title: 'SUP-konstruktion — ofte stillede spørgsmål'
  items:
    - q: 'Hvilken konstruktionstype bør jeg vælge til mit mærke?'
      a: 'Det afhænger af dit målmarked og din prisposition. Basisniveau og stormagasindetailhandel: etlags. Ulejningsflåder, klubber og mellempris-mærker: tolags. Ydelse, touring og premium: drop-stitch-kerne. De fleste mærker starter med tolags som den bedste balance mellem pris, holdbarhed og rytteroplevelse. Vi anbefaler ud fra dit konkrete marked under gennemgangen af mulighederne.'
    - q: 'Kan jeg tilbyde flere konstruktionsniveauer under et mærke?'
      a: 'Ja — mange mærker tilbyder to eller tre niveauer. Vi producerer alle tre konstruktioner på samme linje med de samme QC-porte, så du kan kombinere konstruktionstyper inden for en ordre. Skrogform og tryk kan være identiske på tværs af niveauerne; kun konstruktion og materialer ændrer sig.'
    - q: 'Hvad er standarden for trykprøvning for alle konstruktioner?'
      a: 'Ethvert bræt består uanset konstruktionstype en 18.0 PSI holdprøvning med automatisk kassering ved et trykfald på over 0.50 PSI over 24 timer. Etlagsbrætter er klassificeret til 12–15 PSI i drift, tolags til 15–18 PSI og drop-stitch-kerner til 18–25 PSI. Prøvetrykket ligger over den nominelle trykgrænse for alle typer.'
    - q: 'Hvordan påvirker konstruktionen garantireklamationer?'
      a: 'Etlagsbrætter har marginalt højere garantireklamationsrate i kommerciel brug og udlejning på grund af kantskader og punktering. Tolags- og drop-stitch-konstruktioner har markant lavere reklamationsrate. Vi udleverer garantidata pr. niveau fra vores produktionsoptegnelser under tilbudsfasen.'

