hero:
  tagline: 'Konstruktionsguide'
  title: 'Sammenligning af SUP-konstruktion'
  subtitle: 'Tre konstruktionstyper, en produktionslinje. Forstå afvejningen mellem stivhed, vægt, holdbarhed og pris for etlags-PVC, tolags-PVC og drop-stitch-SUP — og hvilken der passer til din målrytter og markedsposition.'

answer:
  label: 'Kort sammenligning'
  text: 'Etlags-PVC er lettest og mest prisvenligt — bedst til fritidsryttere og pris-sensitive markeder. Tolags-PVC tilføjer et ekstra PVC-skin for stivhed og holdbarhed ved moderat vægt — branchestandardvalget til udlejningsflåder og mellempris-mærker. Drop-stitch-kerne med PVC-skal giver den højeste stivhed og tryktolerance — foretrukket til ydelse, surfing og tunge ryttere. Alle tre konstruktioner produceres på samme produktionslinje med de samme QC-porte; forskellen er materialer og lamineringstrin.'
  verified: 'September 2026'

