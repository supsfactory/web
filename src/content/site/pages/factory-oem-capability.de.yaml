services:
  - title: Produktdesign & Konstruktion
    description: Unser hauseigenes F&E-Team arbeitet mit Ihrem Konzept oder Ihrer Spezifikation, um CAD-Zeichnungen, 3D-Modelle und Prototypen zu entwickeln. Wir bieten Formendesign, Rumpfform-Optimierung und Materialauswahl-Beratung.
  - title: Kundenspezifisches Branding & Grafiken
    description: Vollfarbiger Digitaldruck, Siebdruck, Prägung und Etikettenoptionen. Wir entwickeln markenspezifische Deckgrafiken, Schlauchbranding und handelsfertige Verpackung.
  - title: Material- & Spezifikations-Individualisierung
    description: Wählen Sie aus PVC (Standard, umweltfreundlich, schwer entflammbar), Hypalon/CSM, Drop-Stitch und Hybrid-Konstruktionen. Kundenspezifische Schlauchfarben, Stoffgewichte und Verstärkungsoptionen.
  - title: Verpackung & Logistik
    description: Kundenspezifische Handelsverpackung, Private-Label-Kartons, Vakuumverpackung, Palettierung und exportsichere Packungstour in-house vorbereitet.

moq_table:
  - product: Aufblasbare SUP-Boards
    standard_moq: 'Muster 1–2 | Pilot 20–50'
    custom_moq: 'Menge 90–100+ (pro 150-m-Rolle)'
    lead_time: 25–35 Tage

why_us:
  - title: Vertikale Integration
    description: Wir besitzen unsere Fabrik, unsere Formen und unsere Lieferkette —keine Zwischenhändler, keine Subunternehmer. Das gibt uns Kontrolle über Qualität, Kosten und Lieferung.
  - title: Doppelte Zertifizierung
    description: ISO 9001-Qualitätsmanagement und BSCI-Sozialkonformitätszertifizierung. Fabrik-Auditberichte auf Anfrage erhältlich.
  - title: CE-Konformität
    description: Die CE-Zertifizierung gilt für Modelle, die für EU-Märkte bestimmt sind (Umfang pro Projekt bestätigt). Kundenspezifische Modelle können über unseren etablierten Prozess CE-zertifiziert werden.
  - title: Projektspezifische MOQ
    description: 'Die MOQ wird durch Ihre Projektkonfiguration bestätigt — Co-Branding in kleinen Chargen beginnt bei 5–10 Einheiten, Standard-Serienfertigung läuft mit 90–100+ Einheiten pro Charge. Wir helfen neuen Marken, ohne Überengagement im Inventar zu starten.'

