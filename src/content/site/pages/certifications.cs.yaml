faqs:
  tagline: FAQ
  title: Často kladené otázky o našem systému kvality
  items:
    - q: 'Mohu si stáhnout skutečné zprávy o kontrole?'
      a: 'Ano. Sedm dvojjazyčných sad zpráv na této stránce — QIP, IQC, IPQC/FAI, nepropustnost, FQC, PSI a uvolnění zásilky — jsou skutečné řízené záznamy s odstraněnými důvěrnými poli. Ukazují přesnou strukturu, metody a kritéria přijetí používané u každé objednávky.'
    - q: 'Jak se sedm fází promítá do mého projektu?'
      a: 'Každý projekt dostane Plán kontroly kvality (QIP), který určuje fáze použitelné pro Váš výrobek a trh, rozsah kontroly v každé fázi a záznamy, které obdržíte. Stáhněte si ukázku QIP na této stránce a podívejte se na strukturu.'
    - q: 'Jsou tyto vzorky záznamů o kontrole skutečné?'
      a: 'Ano. Vzorky sledují naši skutečnou strukturu řízeného záznamu — hlavička dokumentu, kontrolní list, kritéria přijetí, metoda, výsledky, role kontrolora a rozhodnutí o uvolnění. Všechny identifikační hodnoty jsou nahrazeny ukázkovými (kódy DEMO-*), takže se neprozrazují žádná data zákazníků, grafiky, objednávek ani cen.'
    - q: 'Proč jsou vzorky anonymizované?'
      a: 'Na prvním místě je důvěrnost zákazníků. Názvy zákazníků, grafika, údaje objednávek, informace o dodavatelích a ceny jsou chráněny záměrně. Anonymizace umožňuje kterémukoli potenciálnímu kupujícímu ověřit strukturu našich záznamů a vysledovatelnost, aniž by odhalil podnikání jiného klienta.'
    - q: 'Můžeme pro náš projekt obdržet úplné zprávy o kontrole?'
      a: 'Ano. U schválených projektů poskytneme dokumentaci kvality použitelnou pro Vaši objednávku — plán kontroly kvality, zprávy o vstupní kontrole, kontrole během výroby, nepropustnosti, konečné kontrole a balení a autorizaci uvolnění zásilky — propojené s vysledovatelností Vaší šarže. Citlivé obchodní údaje zůstávají pod NDA dle dohody.'
    - q: 'Co obsahuje záznam o kontrole na úrovni šarže?'
      a: 'Každý záznam propojuje výrobní šarži s příslušnou revizí specifikace nebo výkresu, zaznamenává každý předmět kontroly vůči kritériím přijetí včetně použité metody a nástroje a končí rolí kontrolora, stavem výsledku a rozhodnutím o uvolnění podepsaným oddělením kvality.'
evidence_review:
  tagline: 'Důkazy a ověření'
  title: 'OVĚŘENÉ SPECIFIKACE'
  body: 'Všechna výrobní tvrzení na této stránce ověřuje náš konstrukčně-výrobní tým v závodě v Laixi, Qingdao. Certifikáty, záznamy o kontrole kvality, zprávy o tlakových a konstrukčních zkouškách a záznamy o vysledovatelnosti šarží jsou k dispozici na vyžádání. Specifikace naposledy ověřeny v září 2026.'

