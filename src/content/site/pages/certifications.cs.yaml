meta:
  title: 'Kontrola kvality individuálních SUP: kontrola v 7 fázích | iSupfactory'
  description: 'Jak se kontroluje každá individuální objednávka SUP: 7 kontrolních fází od plánování před výrobou po uvolnění zásilky, ke stažení jsou dvojjazyčné zprávy.'
  dateModified: '2026-08-15'
  keywords:
    - 'kontrola kvality sup'
    - 'kontrola v továrně sup'
    - 'plán kontroly kvality oem'
    - 'předexppediční inspekce sup'
    - 'certifikace ce sup'
    - 'iso 9001 sup'
hero:
  tagline: Kontrola kvality pro individuální projekty
  title: 'Kontrola kvality individuálních nafukovacích projektů SUP'
  subtitle: 'Kvalita se ověřuje podle schváleného vzorku, technické specifikace, grafiky, kusovníku a požadavků na obaly u každého projektu — nikoli podle obecného tvrzení. Od vstupních materiálů po uvolnění zásilky je náš proces kontroly strukturovaný tak, aby na definovaných fázích výroby potvrzoval shodu výrobku s požadavky. V provozu QINGDAO VATRAD GROUP — továrny nafukovacích desek SUP o ploše 12 500 m², která stojí za Vatrad.'
stats:
  - value: 100%
    label: Kusů otestováno tlakem
  - value: '7'
    label: Kontrolních fází s pevným režimem
  - value: '18,0 PSI'
    label: 24hodinové udržení tlaku
  - value: ISO 9001
    label: Potvrzeno certifikátem kvality
quality_basis:
  tagline: Základ kvality
  title: 'Co určuje přijetí výrobku'
  subtitle: 'Kritéria konečného přijetí se stanovují před uvolněním výroby. Tyto řízené projektové dokumenty určují, co se vyrábí, jak se ověřují klíčové detaily a co musí být zkontrolováno před odesláním — schválí se s kupujícím a zmrazí v Plánu kontroly kvality (QIP). Jakákoli žádost o změnu prochází zdokumentovanou kontrolou změn, nikdy potichu na lince.'
  items:
    - title: 'Schválený vzorek'
      description: 'Fyzická referenční deska podepsaná kupujícím. Každá hotová deska se s ní porovnává z hlediska rozměrů, profilu, tuhosti a povrchové úpravy.'
      icon: tabler:medal
    - title: 'Technická specifikace'
      description: 'Materiály, konstrukce a rozměrové výkresy jsou ukotveny číslem revize. FAI ověřuje první kus proti přesně této revizi.'
      icon: tabler:file-check
    - title: 'Schválená grafika'
      description: 'Grafika, barvy tisku a umístění jsou schváleny a verzně ukotveny před řezáním, takže každá paluba odchází v podobě, kterou značka schválila.'
      icon: tabler:palette
    - title: 'Kupujícím schválený kusovník'
      description: 'Kusovník — deska, pádlo, pumpička, leash, taška, návod — potvrzený kupujícím. PSI podle něj kontroluje 100% kompletnost soupravy.'
      icon: tabler:list-checks
    - title: 'Požadavky na obaly a označení'
      description: 'Konstrukce krabice, značky, čárové kódy, obsah etikety a přepravní značky jsou písemně stanoveny. Čitelnost čárových kódů a přesnost označení se ověřují ve fázi PSI.'
      icon: tabler:package
tests:
  - title: Tlaková zkouška
    description: Nafukovací komory jsou po delší dobu vystavovány tlakům překračujícím doporučené provozní meze. Tím se ověřuje nepropustnost a konstrukční integrita materiálu a švů, takže výrobek odolá zamýšlenému použití i případnému nadměrnému dofukování bez poruchy a netěsnosti.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Nafukovací komora SUP při tlakové zkoušce ověřující nepropustnost
  - title: Zkouška odolnosti proti nárazu
    description: Výrobky jsou vystavovány řízeným nárazům různými závažími z různých úhlů. Tím se posuzuje odolnost materiálu vůči propíchnutí, trhlinám a poškození při nárazu do překážek ve vodě, což prokazuje trvanlivost a životnost.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Zkušební zařízení pro nárazy posuzující odolnost materiálu nafukovacího člunu vůči propíchnutí
  - title: Zkouška odolnosti proti UV záření
    description: Vzorky materiálu se vystavují urychlenému UV záření, aby se ověřilo, že v čase nežloutnou, nepraskají a neztrácejí pevnost. Každá šarže PVC se před použitím ve výrobě prověří na stárnutí slunečním zářením.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: Vzorky materiálu PVC v urychleném UV záření při zkoušce odolnosti
  - title: Zkouška odolnosti proti oděru
    description: Vzorky materiálu se třou o drsné povrchy po určitý počet cyklů za řízeného tlaku. Tím se měří schopnost materiálu odolávat opotřebení a opotřebení z opakovaného používání, kontaktu s pískem, kameny či jinými povrchy, což zajišťuje dlouhodobou trvanlivost.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Stroj na zkoušku odolnosti proti oděru, který tře vzorek tkaniny PVC a měří odolnost proti opotřebení
  - title: Zkouška při nízkých teplotách
    description: Výrobky se zkoušejí v chladném prostředí, aby se posoudila jejich funkčnost a trvanlivost v různých teplotních podmínkách a zabránilo se tužení či praskání ve studené vodě. Zásadní pro čluny určené k zimnímu nebo vysokosouřadnicovému použití.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Nafukovací výrobek v chladicí komoře při zkoušce vlastností za nízkých teplot
  - title: Zkouška vztlaku a nosnosti
    description: Výrobky se zkoušejí s různými závažími, aby se určila jejich maximální nosnost a aby bylo prokázáno, že bezpečně nesou uživatele i vybavení. Jmenovitá nosnost každého modelu se ověřuje před uvolněním.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Zkouška vztlaku a nosnosti nafukovacího plavidla se závažími
  - title: Zkouška ovladatelnosti
    description: Výrobky se zkoušejí na odezvu na pádlování nebo pohon motorem, přičemž se hodnotí poloměr zatáčení a snadnost ovládání. Zkoušky na vodě potvrzují, že skutečné chování odpovídá projektovým specifikacím.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Zkouška ovladatelnosti na vodě nafukovací desky SUP a trupu člunu
  - title: Zkouška nepropustnosti
    description: Zcela smontované výrobky se ponoří do vody nebo se vystaví vodní sprše, aby se odhalily netěsnosti švů, ventilů či materiálu. Každý člun před odesláním projde povinnou kontrolou nepropustnosti.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Zkouška nepropustnosti ponořením, která kontroluje švy a ventily na netěsnosti
qc_flow:
  tagline: Schéma kontroly v 7 fázích
  title: 'Sedm kontrolních vrat kvality od začátku do konce'
  subtitle: 'Každá z těchto vrat je definována v Plánu kontroly kvality projektu včetně předmětu kontroly, metody, kritérií přijetí a vznikajícího záznamu. Dvojjazyčné sady zpráv jsou skutečné řízené záznamy — otevřete kteroukoli a uvidíte skutečnou strukturu.'
  obj_label: Předmět kontroly
  method_label: Metoda kontroly
  criteria_label: Kritéria přijetí
  record_label: Vznikající záznam
  stages:
    - stage: STAGE 01
      title: 'Plánování kvality projektu (PPM)'
      summary: 'Schůzka před výrobem před startem linky ukotví rozsah, výchozí hodnoty a plán kontroly.'
      checks:
        - 'Zaznamená se název výrobku, interní kód, SKU zákazníka, číslo objednávky a definice šarže.'
        - 'Specifikován je typ desky, jádro drop-stitch, materiály, výztuhy okrajů, EVA, ventily a systém žebra.'
        - 'Název souboru grafiky, verze, barvy, umístění loga a tisková plocha se ukotví a schválí.'
        - 'Kusovník — každá položka sady s množstvím, barvou, číslem dílu a pravidly náhrady — je schválen zákazníkem.'
        - 'Obaly, označení, čárové kódy, jazyk návodů a ujednání o třetí straně se písemně stanoví.'
      object: 'Rozsah projektu oproti požadavkům zákazníka — materiály, rozměry, grafika, obaly, cílový trh a použitelné normy.'
      method: 'Schůzka před výrobem s účastí obchodu, konstrukce a kontroly kvality; podpis referenčního vzorku; vydání Plánu kontroly kvality (QIP) pro objednávku.'
      criteria: 'Všech pět výchozích hodnot je schváleno a zmrazeno před začátkem sériové výroby. Nevyřešené body blokují uvolnění výroby.'
      record: 'QIP + zápisy z PPM, záznamy o schválení vzorku.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: 'Schůzka před výrobem: posouzení referenčního vzorku a plánu kontroly kvality pro objednávku OEM SUP'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Stáhnout QIP (PDF)'
    - stage: STAGE 02
      title: 'Vstupní kontrola materiálů (IQC)'
      summary: 'Suroviny se ověřují proti schválené specifikaci dodavatele ještě před vstupem do výroby.'
      checks:
        - 'Tkanina drop-stitch, role PVC, materiál okrajů a palubní podložky EVA se porovnávají se schváleným vzorkem — barva, tloušťka, hmotnost a povrchové vady.'
        - 'Ventily, držáky žebra, D-kroužky, madla a kovové části se kontrolují z hlediska typu, rozměru, povrchové úpravy, koroze a správné funkce.'
        - 'Pumpičky, pádla, leash, tašky a opravné sady se ověřují podle modelu, barvy a konfigurace projektu.'
        - 'Certifikáty dodavatele (COA), prohlášení k materiálům a dokumenty o souladu s REACH/RoHS se posuzují u každé šarže.'
        - 'Nevyhovující šarže se dají do karantény a vrátí dřív, než se materiál dostane na linku.'
      object: 'Tkanina drop-stitch, role PVC, ventily, žebra, příslušenství a obalové materiály proti schválené specifikaci a zkušebním certifikátům dodavatele.'
      method: 'Vizuální, rozměrová a váhová kontrola; výběrové zkoušení šarží dle AQL; posouzení certifikátů materiálu; dodržování schváleného seznamu dodavatelů.'
      criteria: 'Splňuje schválenou specifikaci a certifikáty. Nevyhovující šarže se dají do karantény a před uvolněním na linku se odmítnou.'
      record: 'Zprávy o zkouškách IQC s uvedením šarží a přijatého opatření.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Vstupní kontrola tkaniny PVC a součástek SUP v továrně
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Stáhnout zprávy IQC (PDF)'
    - stage: STAGE 03
      title: 'Kontrola během výroby a kontrola prvního kusu (IPQC / FAI)'
      summary: 'Metody sestavování a kontrolní body se volí podle schválené platformy desky a konfigurace projektu. První kus se kontroluje proti ukotveným výchozím hodnotám; každá směna dělá na lince pochůzkové kontroly.'
      checks:
        - 'První kus se ověří proti schválenému vzorku, technickému výkresu, kusovníku, grafice a souborům obalů ještě před začátkem sériové výroby.'
        - 'Změří se rozměry desky, obrys a souměrnost; potvrdí se směr, poloha a barvy tisku a loga i příslušná revize.'
        - 'Švy a plynulost výztuh okraje se na lince kontrolují z hlediska mezer, delaminace, zvrásnění, znečištění a posunutí.'
        - 'Montáž ventilu, D-kroužku, madla a držáku žebra se kontroluje z hlediska polohy, počtu a osazení vůči zákazníkem schválenému kusovníku.'
        - 'Schválení FAI verzně ukotví grafiku, rozměry a kusovník; odchylky se směřují do rozhodovacího procesu oprav — nikdy se neřeší přilepením na lince.'
      object: 'První kus a mezikroty během výroby — švy, okrajové výztuhy, držák žebra, základ ventilu, poloha grafiky, moment utažení spojovacího materiálu.'
      method: 'Kontrola prvního kusu na prvním vyrobeném kusu; pochůzkové kontroly každou směnu; pevnost svarů a souosost švů se ověřují přímo při výrobě.'
      criteria: 'Schválení FAI verzně ukotví grafiku, rozměry a kusovník. Odchylky se směřují do rozhodovacího procesu oprav — nikdy se neřeší přilepením na lince.'
      record: 'Protokol FAI, směnové pochůzkové záznamy, poznámky k opravám a přijatým opatřením.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Kontrola během výroby a kontrola prvního kusu při výrobě SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Stáhnout zprávy IPQC (PDF)'
    - stage: STAGE 04
      title: 'Dofukování a zkouška nepropustnosti'
      summary: 'Každá hotová deska před zabalením projde dofukováním a ověřením nepropustnosti — 100% kusů, ne výběrový vzorek.'
      checks:
        - 'Povrch desky, okrajové výztuhy a okolí ventilu se před dofukováním kontrolují z hlediska drobných děr, trhlin, neobvyklých záhybů nebo delaminace.'
        - 'Komory se kalibrovaným digitálním tlakoměrem dofukují na zkušební tlak projektu a počáteční údaj se zaznamená.'
        - 'Jádro ventilu, základ ventilu a švy okraje se kontrolují po celém obvodu — příď, zádě i zakřivené úseky.'
        - '24hodinové udržení tlaku s průběžným záznamem; automatické odmítnutí při překročení povoleného poklesu tlaku.'
        - 'Neúspěšné desky se dají do karantény, opraví podle pokynu a plně přezkouší — nikoli jen znovu zkontrolují v místě opravy.'
      object: '100% nafouknutých komor — detekce netěsností po celém švu, integrita ventilu a udržení poklesu tlaku.'
      method: 'Detekce netěsností po celém švu a následné 24hodinové udržení tlaku při 18,0 PSI; automatické odmítnutí při poklesu nad 0,50 PSI.'
      criteria: 'Nulový počet míst netěsnosti a pokles tlaku do 0,50 PSI na komoru; nevyhovující kusy se dají do karantény a opraví nebo vyřadí.'
      record: 'Zprávy o zkoušce nepropustnosti, jedna na komoru, spojené se šarží.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Dofukování a zkouška nepropustnosti nafukovací komory SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Stáhnout zprávy o nepropustnosti (PDF)'
    - stage: STAGE 05
      title: 'Konečná kontrola výrobku (FQC)'
      summary: 'Hotové desky se měří a vizuálně hodnotí proti schválenému referenčnímu vzorku.'
      checks:
        - 'Klíčové rozměry — délka, šířka a tloušťka — se měří při pracovním tlaku s ohledem na tolerance výkresu.'
        - 'Ověří se obrys desky, rocker a souměrnost; po dofukování nesmí být přítomna neobvyklá deformace, zkroucení či vybočení.'
        - 'Vzhled se hodnotí pod denním světlem D65: škrábance, skvrny, stopy lepidla, bubliny, zvrásnění, odchylka barvy.'
        - 'Funkční kontroly: otevírání a zavírání ventilu a dosednutí víčka, nasazení a upevnění žebra, D-kroužky, madla a funkčnost pádla.'
        - 'Konfigurace se ověří proti zákazníkem schválenému kusovníku a SKU — příslušenství, etikety, čárové kódy a sériová čísla.'
      object: 'Hotová deska proti referenčnímu vzorku — rozměry, rocker, profil, vzhled, osazení držáku žebra a kompletnost příslušenství.'
      method: 'Rozměrové ověření s ohledem na tolerance výkresu; hodnocení vzhledu pod denním světlem D65; zkoušky osazení držáku žebra a spojovacího materiálu.'
      criteria: 'Rozměry v toleranci (například 3508 × 814 × 150,3 mm), stupeň vzhledu podle schváleného vzorku, kompletní příslušenství.'
      record: 'Zprávy FQC s podpisem kontrolora a přijatým opatřením.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Konečná kontrola hotových desek SUP před zabalením
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Stáhnout zprávy FQC (PDF)'
    - stage: STAGE 06
      title: 'Balení a předexppediční kontrola (PSI)'
      summary: 'Zabalená souprava se kontroluje z hlediska kompletnosti, přesnosti označení a připravenosti k odeslání.'
      checks:
        - 'Kompletnost soupravy 100 % podle kusovníku: deska, pádlo, pumpička, leash, taška, opravná sada a návod — sada po sadě.'
        - 'Křehké části jsou chráněny (obaly pumpičky a listu), deska se skládá podle obalové SOP, příslušenství odpovídá modelu a barvě.'
        - 'Grafika krabice, značka, výstrahy a jazykové verze se ověřují proti schválené revizi grafiky.'
        - 'Ověří se typ, číslo, poloha a čitelnost čárových kódů; přepravní značky, SKU, objednávka, číslo krabice i množství musí být správné.'
        - 'Rozměr krabice, hmotnost brutto a netto i vnitřní obal odpovídají obalové specifikaci; v případě potřeby se zapíše výsledek zkoušky pádem.'
      object: 'Zabalená souprava — deska, pádlo, pumpička, leash, taška, návod — proti zákazníkem schválenému kusovníku a obalové specifikaci.'
      method: 'Kompletnost soupravy 100 % podle kusovníku; skenování čárového kódu (třída ≥ B); přesnost označení krabice; pádová zkouška ISTA-1A na zabalených krabicích.'
      criteria: 'Souprava 100 % shodná s kusovníkem, čitelné čárové kódy, správné označení a odolné balení proti pádu před naložením.'
      record: 'Kontrolní listy PSI a záznamy o balení pro každou krabici.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Předexppediční kontrola zabalené soupravy SUP podle kusovníku
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Stáhnout zprávy PSI (PDF)'
    - stage: STAGE 07
      title: 'Uvolnění zásilky a vysledovatelnost'
      summary: 'Kvalita podpíše šarži teprve tehdy, když je uzavřeno všech šest předchozích fází a každý záznam je úplný.'
      checks:
        - 'Výrobní šarže, číslo objednávky, SKU, množství a počet krabic odpovídají balicímu listu a obchodní faktuře.'
        - 'Specifikace, kusovník, grafika i soubory obalů jsou všechny v platné schválené revizi.'
        - 'Záznamy IQC, FAI, kontroly během výroby, nepropustnosti, FQC a PSI jsou úplné pro uvolňovanou šarži.'
        - 'Všechny nesoulady jsou odstraněny, opraveny, znovu zkontrolovány a uzavřeny — při uvolnění nejsou otevřené žádné body.'
        - 'Údaje o vysledovatelnosti se zaznamenávají pro každou šarži: kód projektu, objednávka, SKU, revize grafiky, kusovníku a obalů, datum výroby, kontrolor a čísla záznamů.'
      object: 'Autorizace uvolnění šarže — všechny fáze uzavřeny, záznamy úplné, sériová čísla přiřazena k šarži.'
      method: 'Kontrolní posouzení všech šesti předchozích záznamů oddělením kvality; sestavení vysledovatelnostního spisu šarže; předání záznamů se zásilkou.'
      criteria: 'Všechny fáze schváleny oddělením QA; záznamy šarže a vysledovatelnostní spis předány kupujícímu nebo na vyžádání uchovány pod NDA.'
      record: 'Autorizace uvolnění zásilky a vysledovatelnostní spis šarže.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Podpis uvolnění zásilky a předání záznamu o vysledovatelnosti šarže
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Stáhnout zprávy o uvolnění (PDF)'
system_map:
  tagline: Systém kvality
  title: 'Jeden systém, čtyři řízené normy'
  subtitle: 'Sedm fází uvedených výše běží podle čtyř zdokumentovaných norem, z nichž každá je zveřejněna jako řízený postup, který si můžete stáhnout a prověřit. Dohromady tvoří QMS, která stojí za každou objednávkou OEM/ODM — kritéria kontroly, řízení změn, nesoulady a laboratorní zkoušky.'
  items:
    - title: 'Normy pro kontrolu a uvolnění'
      description: 'Projektový QIP řídí každou fázi: předmět kontroly, metodu, kritéria přijetí a vznikající záznam pro každou objednávku. Zahrnuje čtyřfázový rámec kontroly kvality, řetěz vysledovatelnosti, postup karantény, matici vad a registr dokumentace 00–15.'
      icon: tabler:clipboard-check
      link: /cs/factory/quality-inspection
      link_label: 'Normy pro kontrolu a stažení dokumentace QMS'
    - title: 'Řízení změn při opravách'
      description: 'Žádná změna parametrů opravy bez zdokumentovaného řízení: izolace, klasifikace rizik, 9krokový cyklus změny, schvalovací matice a validace. Jakákoli změna schválených specifikací, vzorků, kusovníků či kritérií přijetí vyžaduje písemný souhlas zákazníka.'
      icon: tabler:git-branch
      link: /cs/factory/quality-change-control
      link_label: 'Norma řízení změn'
    - title: 'Řízení nevyhovujících výrobků'
      description: 'Uzavřený 7krokový cyklus podle ISO 9001:2015, část 8.7: identifikace, karanténa, rozhodnutí podle NCR, oprava nebo odmítnutí, opětovná kontrola, uvolnění, náprava. Zahrnuje pravomoci podle závažnosti, matici opatření pro vady SUP a zničení za dohledu.'
      icon: tabler:alert-triangle
      link: /cs/factory/non-conforming-control
      link_label: 'Norma řízení nevyhovujících výrobků'
    - title: 'Laboratorní zkoušky a vybavení'
      description: 'Laboratoř kvality pracuje nezávisle na výrobě: tahové zkoušky, pokles tlaku, stárnutí působením UV, odolnost svarů, detekce netěsností a teplotní komory — spolu s postupy kalibrace a zkoušek, na kterých stojí naše zveřejněná tvrzení.'
      icon: tabler:flask
      link: /cs/factory/quality-lab
      link_label: 'Laboratoř kvality a zkušební vybavení'
    - title: 'Laboratoř zkoušek materiálů (Vývoj)'
      description: 'Vývojové centrum vede nezávislé zkoušky materiálů: receptury PVC/Hypalon, urychlené stárnutí a podporu certifikace, a tím zásobí normy používané ve výrobě.'
      icon: tabler:microscope
      link: /cs/randdcenter/quality-inspection-lab
      link_label: 'Laboratoř zkoušek materiálů vývoje'
