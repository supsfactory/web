traceability:
  tagline: Vysledovatelnost na úrovni šarže
  title: 'Čtyři otázky, na které každá šarže odpoví'
  subtitle: 'Záznamy o kvalitě se vedou podle výrobních šarží a jsou propojeny s příslušnou výrobní specifikací, grafikou, kusovníkem a požadavky na obaly. To umožňuje šetření a řízené opatření, pokud se objeví problém s kvalitou. Při auditu kupujícího naše oddělení kvality odpovídá na tyto čtyři otázky přímo na díle — každá odpověď odkazuje na řízený záznam.'
  items:
    - title: 'Co bylo vyrobeno?'
      description: 'Výrobek, model, konfigurace a revize jsou svázány s číslem objednávky a revizí schválené specifikace.'
      icon: '1'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobrazit spis vysledovatelnosti (PDF)'
    - title: 'Jaké materiály byly použity?'
      description: 'Každá šarže materiálu vstupující do výroby je zaznamenána s dodavatelem, certifikátem a rozhodnutím IQC.'
      icon: '2'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobrazit spis vysledovatelnosti (PDF)'
    - title: 'Kdo kontroloval a kdy?'
      description: 'Každý záznam obsahuje roli kontrolora, datum, použité nástroje a výsledek — žádné anonymní podpisy.'
      icon: '3'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobrazit spis vysledovatelnosti (PDF)'
    - title: 'Jak byla šarže uvolněna?'
      description: 'Uvolnění autorizuje oddělení kvality až po uzavření všech fází; přijaté opatření je zaznamenáno v dokladu.'
      icon: '4'
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Zobrazit spis vysledovatelnosti (PDF)'
non_conformance:
  tagline: Řízení nevyhovujících výrobků
  title: 'Při zjištění vady: izolovat, rozhodnout, zdokumentovat'
  subtitle: 'Výrobky nebo součástky, které nesplňují stanovená kritéria přijetí, se zjistí a zařadí pod řízenou blokaci. Oprava nebo výměna je povolena pouze podle příslušného postupu kvality a následuje opětovná kontrola před autorizovaným uvolněním.'
  items:
    - title: 'Zjištění a oddělení'
      description: 'Neúspěšné kusy se označí červeně a přesunou na karanténní stanici — žádné další zpracování ani balení do rozhodnutí.'
      icon: tabler:alert-triangle
    - title: 'Rozhodnutí podle NCR'
      description: 'Oddělení kvality vydá hlášení o nesouladu (NCR) a podle rozhodovací matice kus nasměruje na opravu, opětovnou kontrolu, odmítnutí nebo vyřazení.'
      icon: tabler:git-branch
      link: /cs/factory/non-conforming-control
      link_label: 'Norma řízení nevyhovujících výrobků'
    - title: 'Ověření a uvolnění'
      description: 'Opravené kusy se znovu kontrolují podle stejných kritérií; NCR se uzavře až po úspěšném opětovném ověření.'
      icon: tabler:shield-check
    - title: 'Kontrola likvidace'
      description: 'Vyřazený materiál se zlikviduje s podepsaným protokolem o zničení, takže se nikdy nemůže vrátit do skladu ani na trh.'
      icon: tabler:trash
      link: https://assets.isupfactory.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Protokol o likvidaci a zničení (PDF)'
    - title: 'Zpětná vazba o kořeni vady'
      description: 'Opakované vady spouštějí nápravnou akci u odpovědného procesu nebo dodavatele — uzavřený cyklus, ne jen papírování.'
      icon: tabler:refresh
      link: https://assets.isupfactory.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'SOP řízení změn při opravách (PDF)'
