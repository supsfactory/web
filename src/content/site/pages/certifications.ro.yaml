faqs:
  tagline: FAQ
  title: Întrebări frecvente despre sistemul nostru de calitate
  items:
    - q: 'Pot descărca rapoartele efective de inspecție?'
      a: 'Da. Cele șapte dosare de rapoarte bilingve de pe această pagină — QIP, IQC, IPQC/FAI, etanșeitate la aer, FQC, PSI și eliberarea expediției — sunt înregistrări controlate reale, cu câmpurile confidențiale eliminate. Ele arată structura, metodele și criteriile de acceptare exacte folosite la fiecare comandă.'
    - q: 'Cum se mapează cele șapte porți pe proiectul meu?'
      a: 'Fiecare proiect primește un Plan de Inspecție a Calității (QIP) care definește porțile aplicabile produsului și pieței dumneavoastră, domeniul de inspecție la fiecare poartă și înregistrările pe care le veți primi. Descărcați mostra QIP de pe această pagină pentru a vedea structura.'
    - q: 'Sunt reale aceste mostre de înregistrări de inspecție?'
      a: 'Da. Mostrele urmează structura noastră reală de înregistrare controlată — antet document, listă de verificare a inspecției, criterii de acceptare, metodă, rezultate, rolul inspectorului și dispoziția de eliberare. Toate valorile de identificare sunt înlocuite cu valori demonstrative (coduri DEMO-*), astfel încât nu se expun date ale vreunui client, grafică, comandă sau preț.'
    - q: 'De ce sunt anonimizate mostrele?'
      a: 'Confidențialitatea cumpărătorului vine pe primul loc. Numele clienților, grafica, detaliile comenzilor, informațiile despre furnizori și prețurile sunt protejate prin proiectare. Anonimizarea permite oricărui cumpărător potențial să verifice structura înregistrărilor și trasabilitatea noastră fără a expune afacerea altui client.'
    - q: 'Putem primi rapoarte complete de inspecție pentru proiectul nostru?'
      a: 'Da. Pentru proiectele aprobate vă punem la dispoziție documentația de calitate aplicabilă comenzii dumneavoastră — plan de inspecție a calității, rapoarte de inspecție la intrare, în proces, de etanșeitate la aer, finale și de ambalare, plus autorizarea eliberării expediției — legate de trasabilitatea lotului dumneavoastră. Datele comerciale sensibile rămân sub NDA, așa cum s-a agreat.'
    - q: 'Ce conține o înregistrare de inspecție la nivel de lot?'
      a: 'Fiecare înregistrare leagă lotul de producție de revizia specificației sau a desenului aplicabilă, înregistrează fiecare element de inspecție față de criteriile sale de acceptare împreună cu metoda și unealta folosită și se încheie cu rolul inspectorului, starea rezultatului și dispoziția de eliberare semnată de calitate.'
