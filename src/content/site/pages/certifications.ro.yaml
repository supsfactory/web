quality_basis:
  tagline: Baza calității
  title: 'Ce definește acceptarea produsului'
  subtitle: 'Criteriile finale de acceptare sunt stabilite înainte de eliberarea producției. Aceste documente de proiect controlate definesc ce trebuie fabricat, cum sunt verificate detaliile cheie și ce trebuie verificat înainte de expediție — aprobate împreună cu cumpărătorul și înglobate în Planul de Inspecție a Calității (QIP). Orice cerere de modificare trece prin controlul documentat al modificărilor, niciodată tacit prin linia de producție.'
  items:
    - title: 'Mostra aprobată'
      description: 'Tabla de referință fizică semnată de cumpărător. Fiecare tablă finită este comparată cu ea pentru dimensiuni, profil, rigiditate și finisaj.'
      icon: tabler:medal
    - title: 'Specificație tehnică'
      description: 'Materiale, construcție și desene dimensionale fixate la un număr de revizie. FAI verifică primul articol față de această revizie exactă.'
      icon: tabler:file-check
    - title: 'Grafică aprobată'
      description: 'Grafică, culori de tipărire și amplasare aprobate și fixate ca versiune înainte de tăiere, astfel încât fiecare punte să fie expediată în aspectul pe care marca l-a aprobat.'
      icon: tabler:palette
    - title: 'BOM aprobat de client'
      description: 'Lista de materiale — tablă, vâslă, pompă, lesă, geantă, manual — confirmată de cumpărător. PSI verifică completitudinea kit-ului la 100% față de acest BOM.'
      icon: tabler:list-checks
    - title: 'Cerințe de ambalare și etichetare'
      description: 'Structura cutiei, marcajele, codurile de bare, conținutul etichetelor și marcajele de expediție fixate în scris. Lizibilitatea codului de bare și exactitatea marcajelor sunt verificate la PSI.'
      icon: tabler:package
tests:
  - title: Testare de presiune
    description: Camerele gonflabile sunt supuse unor presiuni care depășesc limitele lor de funcționare recomandate, pe perioade extinse. Aceasta verifică etanșeitatea la aer și integritatea structurală a materialului și a cusăturilor, asigurând că produsul poate rezista utilizării intenționate și eventualei suprumflări fără defectare sau scurgeri.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
    alt: Cameră SUP gonflabilă supusă testării de presiune pentru verificarea etanșeității la aer
  - title: Testare de impact
    description: Produsele sunt supuse unor impacturi controlate din diverse greutăți și unghiuri. Aceasta evaluează rezistența materialului la perforări, rupturi și deteriorări cauzate de coliziuni cu obstacole în apă, demonstrând durabilitatea și longevitatea.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
    alt: Banc de testare a impactului care evaluează rezistența materialului bărcilor gonflabile la perforare
  - title: Testare de rezistență la radiații UV
    description: Probe de material sunt expuse la radiații UV accelerate pentru a verifica că nu se îngălbenesc, nu se crapă și nu își pierd rezistența în timp. Fiecare lot de PVC este verificat față de degradarea solară înainte de utilizarea în producție.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
    alt: Probe de material PVC sub radiații UV accelerate în testarea de rezistență
  - title: Testare de rezistență la abraziune
    description: Probe de material sunt frecate de suprafețe abrazive pentru un număr specificat de cicluri, sub presiune controlată. Aceasta măsoară capacitatea materialului de a rezista la uzură din utilizare repetată, la contactul cu nisip, pietre sau alte suprafețe, asigurând durabilitate pe termen lung.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pvc-material-testing.webp
    alt: Mașină de testare a abraziunii care freacă o probă de material PVC pentru a măsura rezistența la uzură
  - title: Testare de performanță la temperaturi scăzute
    description: Produsele sunt testate în medii reci pentru a evalua funcționalitatea și durabilitatea în diverse condiții de temperatură, prevenind rigiditatea sau crăparea în ape mai reci. Esențial pentru bărcile destinate utilizării în sezonul rece sau la latitudini înalte.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-factory-exterior.webp
    alt: Produs gonflabil în cameră rece pentru testarea performanței la temperaturi scăzute
  - title: Testarea flotabilității și a capacității de încărcare
    description: Produsele sunt testate cu diverse greutăți pentru a determina capacitatea maximă de încărcare și a se asigura că susțin în siguranță utilizatorii și echipamentul. Capacitatea nominală a fiecărui model este verificată înainte de eliberare.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-stock-boat-inventory.webp
    alt: Test de flotabilitate și de capacitate de încărcare cu greutăți pe un mijloc de transport pe apă gonflabil
  - title: Testarea manevrabilității
    description: Produsele sunt testate pentru răspunsul lor la acțiuni de vâslire sau de motor, evaluând raza de viraj și ușurința manevrării. Încercările pe apă validează că manevrarea reală corespunde specificațiilor de proiectare.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
    alt: Testare a manevrabilității pe apă pentru plăci SUP gonflabile și carene de bărci
  - title: Testarea etanșeității la apă
    description: Produsele complet asamblate sunt scufundate sau supuse la pulverizare cu apă pentru a verifica orice scurgere prin cusături, valve sau materiale. Fiecare barcă trece o verificare obligatorie a etanșeității la apă înainte de expediere.
    image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
    alt: Test de etanșeitate prin scufundare care verifică cusăturile și valvele pentru scurgeri
qc_flow:
  tagline: Fluxul de inspecție în 7 etape
  title: 'Șapte porți de calitate controlate, de la un capăt la altul'
  subtitle: 'Fiecare poartă de mai jos este definită în Planul de Inspecție a Calității al proiectului, cu obiectul inspecției, metoda, criteriile de acceptare și rezultatul înregistrării. Dosarele de rapoarte bilingve sunt înregistrări controlate reale — deschideți oricare dintre ele pentru a vedea structura efectivă.'
  obj_label: Obiectul inspecției
  method_label: Metoda de inspecție
  criteria_label: Criterii de acceptare
  record_label: Rezultatul înregistrării
  stages:
    - stage: STAGE 01
      title: 'Planificarea calității proiectului (PPM)'
      summary: 'Ședința de preproducție fixează domeniul de aplicare, liniile de bază și planul de inspecție înainte de pornirea liniei.'
      checks:
        - 'Se înregistrează numele produsului, codul intern, SKU-ul clientului, numărul comenzii și definiția lotului.'
        - 'Se specifică tipul plăcii, miezul drop-stitch, materialele, benzile de șină, EVA, valvele și sistemul de aripioare.'
        - 'Numele fișierului de grafică, versiunea, culorile, poziția logo-ului și zona de tipărire sunt fixate și aprobate.'
        - 'BOM-ul — fiecare articol din set cu cantitate, culoare, cod de piesă și reguli de substituție — este aprobat de client.'
        - 'Ambalarea, etichetarea, codurile de bare, limba manualelor și aranjamentele inspecției terțe sunt fixate în scris.'
      object: 'Domeniul de aplicare al proiectului față de cerințele clientului — materiale, dimensiuni, grafică, ambalare, piață țintă și standarde aplicabile.'
      method: 'Ședință de preproducție cu vânzări, inginerie și QC; semnarea Mostrei Aurii; emiterea Planului de Inspecție a Calității (QIP) pentru comandă.'
      criteria: 'Toate cele cinci linii de bază sunt aprobate și înglobate înainte de începerea producției de masă. Elementele nerezolvate blochează eliberarea producției.'
      record: 'QIP + proces-verbal PPM, înregistrări ale mostrei aprobate.'
      image: https://assets.isupfactory.com/site/quality/node01-ppm.avif
      alt: Ședință de preproducție care examinează mostra aurie și planul de inspecție a calității pentru o comandă SUP OEM
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Descărcați QIP (PDF)'
    - stage: STAGE 02
      title: 'Inspecția materialelor la intrare (IQC)'
      summary: 'Materialele prime sunt verificate față de specificația aprobată a furnizorului înainte de a intra în producție.'
      checks:
        - 'Țesătura drop-stitch, rulourile de PVC, materialul șinelor și suprafețele de EVA sunt verificate față de mostra aprobată — culoare, grosime, greutate și defecte de suprafață.'
        - 'Valvele, cutiile de aripioară, inelele în D, mânerele și feroneria sunt verificate ca tip, dimensiune, finisaj, coroziune și funcționare corectă.'
        - 'Pompe, vâsle, lese, genți și kituri de reparații sunt verificate ca model, culoare și configurație de proiect.'
        - 'Certificatele furnizorului (COA), declarațiile de material și documentele de conformitate REACH/RoHS sunt analizate pentru fiecare lot.'
        - 'Loturile neconforme sunt puse în carantină și returnate înainte ca vreun material să ajungă pe linie.'
      object: 'Țesătura drop-stitch, rulourile de PVC, valvele, aripioarele, accesoriile și materialele de ambalare față de specificația aprobată și de certificatele de test ale furnizorului.'
      method: 'Verificări vizuale, dimensionale și de greutate; eșantionare pe lot conform AQL; certificate de material analizate; lista furnizorilor aprobați este obligatorie.'
      criteria: 'Respectă specificația și certificatele aprobate. Loturile neconforme sunt puse în carantină și respinse înainte de eliberarea către linie.'
      record: 'Rapoarte de test IQC cu referințe de lot și dispoziții.'
      image: https://assets.isupfactory.com/site/quality/node02-iqc.avif
      alt: Inspecția materialelor la intrare a țesăturii PVC și a componentelor SUP în fabrică
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descărcați rapoartele IQC (PDF)'
    - stage: STAGE 03
      title: 'Control în proces și primul articol (IPQC / FAI)'
      summary: 'Metodele de construcție și punctele de control sunt selectate în funcție de platforma de tablă aprobată și de configurația proiectului. Primul articol este verificat față de liniile de bază înglobate; fiecare tură menține verificări de patrulare pe linie.'
      checks:
        - 'Primul articol este verificat față de mostra aprobată, desenul tehnic, BOM, grafică și fișierele de ambalare înainte de începerea producției de masă.'
        - 'Dimensiunile, conturul și simetria plăcii sunt măsurate; direcția, poziția, culorile și revizia cernelii și a logo-ului sunt confirmate.'
        - 'Cusăturile și continuitatea șinelor sunt verificate pentru goluri, delaminare, cute, contaminare sau nealiniere pe linie.'
        - 'Instalarea valvei, a inelului în D, a mânerului și a cutiei de aripioară este verificată ca poziție, cantitate și potrivire față de BOM-ul aprobat de client.'
        - 'Aprobarea FAI fixează ca versiune grafica, dimensiunile și BOM-ul; abaterile sunt direcționate către fluxul de decizie de retuș — niciodată către pachetare ad hoc pe linie.'
      object: 'Primul articol și asamblările în proces — cusături, șine, cutia de aripioară, baza valvei, poziția graficii, cuplul feroneriei.'
      method: 'Inspecție a primului articol pe prima unitate; verificări de patrulare pe fiecare tură; rezistența cusăturilor și alinierea lor verificate pe linie.'
      criteria: 'Aprobarea FAI fixează ca versiune grafica, dimensiunile și BOM-ul. Abaterile sunt direcționate către fluxul de decizie de retuș — niciodată către pachetare ad hoc pe linie.'
      record: 'Înregistrare FAI, jurnale de patrulare pe tură, note de retuș și de dispoziție.'
      image: https://assets.isupfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Inspecție în proces și verificare a primului articol în timpul producției de plăci SUP
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descărcați rapoartele IPQC (PDF)'
    - stage: STAGE 04
      title: 'Umflare și testare a etanșeității la aer'
      summary: 'Fiecare tablă finalizată este supusă la umflare și la verificarea etanșeității la aer înainte de ambalare — 100% dintre unități, nu o probă.'
      checks:
        - 'Suprafața plăcii, șinele și zona valvei sunt verificate pentru microperforări, crăpături, cute anormale sau delaminare înainte de umflare.'
        - 'Camerele sunt umflate cu un manometru digital calibrat până la presiunea de test a proiectului, iar citirea inițială este înglobată.'
        - 'Nucleul valvei, baza valvei și cusăturile șinelor sunt verificate pe întreaga circumferință — proră, pupă și zone curbe.'
        - 'Menținere a presiunii timp de 24 de ore cu înregistrare continuă; respingere automată peste căderea de presiune permisă.'
        - 'Tablele eșuate sunt puse în carantină, retușate conform instrucțiunii și testate integral din nou — nu doar reverificate la punctul de reparație.'
      object: '100% dintre camerele umflate — detectarea scurgerilor pe cusăturile complete, integritatea valvei și retenția căderii de presiune.'
      method: 'Detectarea scurgerilor pe cusăturile complete, urmată de menținerea presiunii timp de 24 de ore la 18.0 PSI; respingere automată peste o cădere de 0.50 PSI.'
      criteria: 'Zero puncte de scurgere și cădere de presiune în limita de 0.50 PSI pe cameră; unitățile eșuate sunt puse în carantină și retușate sau eliminate.'
      record: 'Rapoarte de test a etanșeității la aer, câte unul pe cameră, legate de lot.'
      image: https://assets.isupfactory.com/site/quality/node04-airtightness.avif
      alt: Umflarea și testarea etanșeității la aer a unei camere SUP gonflabile
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Descărcați rapoartele de etanșeitate la aer (PDF)'
    - stage: STAGE 05
      title: 'Inspecția produsului finit (FQC)'
      summary: 'Tablele finite sunt măsurate și clasate cosmetic față de mostra aurie aprobată.'
      checks:
        - 'Dimensiunile cheie — lungime, lățime și grosime — sunt măsurate la presiunea de lucru, conform toleranțelor din desen.'
        - 'Conturul, rocker-ul și simetria plăcii sunt verificate; nicio deformare, răsucire sau îndoire anormală după umflare.'
        - 'Aspectul este clasat sub lămpi de lumină naturală D65: zgârieturi, pete, urme de lipici, bule, cute, abatere de culoare.'
        - 'Verificări funcționale: deschiderea/închiderea valvei și fixarea capacului, introducerea și blocarea aripioarei, inelele în D, mânerele și funcționarea vâslei.'
        - 'Configurația este verificată față de BOM-ul și SKU-ul aprobat de client — accesorii, etichete, coduri de bare și numere de serie.'
      object: 'Tabla finită față de mostra aurie — dimensiuni, rocker, profil, aspect, potrivirea cutiei de aripioară și completitudinea accesoriilor.'
      method: 'Verificare dimensională conform toleranțelor din desen; aspect clasat sub lămpi de lumină naturală D65; teste de potrivire a cutiei de aripioară și a feroneriei.'
      criteria: 'Dimensiuni în toleranță (de ex. 3508 × 814 × 150.3 mm), grad de aspect conform mostrei aprobate, toate accesoriile prezente.'
      record: 'Rapoarte FQC cu semnătura inspectorului și dispoziția.'
      image: https://assets.isupfactory.com/site/quality/node05-fqc.avif
      alt: Inspecția produsului finit a plăcilor SUP finite înainte de ambalare
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descărcați rapoartele FQC (PDF)'
    - stage: STAGE 06
      title: 'Ambalare și inspecție înainte de expediție (PSI)'
      summary: 'Kit-ul ambalat este verificat pentru completitudine, exactitatea marcajelor și pregătirea expediției.'
      checks:
        - 'Completitudinea kit-ului la 100% față de BOM: tablă, vâslă, pompă, lesă, geantă, kit de reparații și manual — câte un set pe rând.'
        - 'Piesele fragile sunt protejate (saci pentru pompă și pală), tabla este pliată conform SOP-ului de ambalare, accesoriile corespund modelului și culorii.'
        - 'Grafică cutiei, marcă, avertismente și versiuni lingvistice sunt verificate față de revizia de grafică aprobată.'
        - 'Tipul, numărul, poziția și lizibilitatea codului de bare sunt verificate; marcajele de expediție, SKU, PO, numărul cutiei și cantitatea sunt corecte.'
        - 'Dimensiunile cutiei, greutatea brută/netă și ambalajul interior corespund specificației de ambalare; rezultatul testului de cădere este înregistrat când este cerut.'
      object: 'Kit-ul ambalat — tablă, vâslă, pompă, lesă, geantă, manual — față de BOM-ul aprobat de client și de specificația de ambalare.'
      method: 'Completitudinea kit-ului la 100% față de BOM; scanare cod de bare (Grad ≥ B); exactitatea marcajelor cutiei; test de cădere ISTA-1A pe cutiile ambalate.'
      criteria: 'Kit la 100% conform BOM, coduri de bare lizibile, marcaje corecte și ambalare rezistentă la cădere înainte de încărcare.'
      record: 'Liste de verificare PSI și înregistrări de ambalare pe fiecare cutie.'
      image: https://assets.isupfactory.com/site/quality/node06-psi.avif
      alt: Inspecție înainte de expediție care verifică kit-ul SUP ambalat față de BOM
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descărcați rapoartele PSI (PDF)'
    - stage: STAGE 07
      title: 'Eliberarea expediției și trasabilitatea'
      summary: 'Calitatea semnează lotul numai atunci când toate cele șase porți anterioare sunt închise și fiecare înregistrare este completă.'
      checks:
        - 'Lotul de producție, numărul comenzii, SKU, cantitatea și numărul de cutii corespund listei de ambalare și facturii comerciale.'
        - 'Fișierele de specificație, BOM, grafică și ambalare sunt toate la revizia aprobată curentă.'
        - 'Înregistrările IQC, FAI, în proces, de etanșeitate la aer, FQC și PSI sunt complete pentru lotul care este eliberat.'
        - 'Toate neconformitățile sunt rezolvate, retușate, reinspectate și închise — niciun element deschis la eliberare.'
        - 'Câmpurile de trasabilitate sunt înregistrate pe lot: cod proiect, PO, SKU, reviziile graficii/BOM/ambalării, data producției, inspectorul și numerele înregistrărilor.'
      object: 'Autorizarea eliberării lotului — toate porțile închise, înregistrări complete, numere de serie mapate la lot.'
      method: 'Revizuirea de poartă a tuturor celor șase înregistrări anterioare de către calitate; dosarul de trasabilitate al lotului asamblat; înregistrările predate împreună cu expediția.'
      criteria: 'Toate porțile aprobate de QA; înregistrările lotului și dosarul de trasabilitate livrate cumpărătorului sau păstrate sub NDA la cerere.'
      record: 'Autorizarea eliberării expediției și dosarul de trasabilitate al lotului.'
      image: https://assets.isupfactory.com/site/quality/node07-shipment-release.avif
      alt: Semnarea eliberării expediției și predarea înregistrării de trasabilitate a lotului
      link: https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descărcați rapoartele de eliberare (PDF)'
system_map:
  tagline: Sistemul calității
  title: 'Un sistem, patru standarde controlate'
  subtitle: 'Cele șapte porți de mai sus funcționează pe baza a patru standarde documentate, fiecare publicat ca procedură controlată pe care o puteți descărca și audita. Împreună formează sistemul de management al calității din spatele fiecărei comenzi OEM/ODM — criterii de inspecție, control al modificărilor, neconformitate și testare de laborator.'
  items:
    - title: 'Standardele de inspecție și eliberare'
      description: 'QIP-ul proiectului conduce fiecare poartă: obiectul inspecției, metoda, criteriile de acceptare și rezultatul înregistrării pentru fiecare comandă. Include cadrul QC în 4 etape, lanțul de trasabilitate, fluxul de carantină, matricea de defecte și registrul de documentație 00–15.'
      icon: tabler:clipboard-check
      link: /ro/factory/quality-inspection
      link_label: 'Standarde de inspecție și descărcări QMS'
    - title: 'Controlul modificărilor la retuș'
      description: 'Nicio modificare a parametrilor de retuș fără control documentat: containment, clasificarea riscului, buclă de modificare în 9 pași, matrice de aprobare și validare. Orice modificare a specificațiilor, mostrelor, BOM-urilor sau criteriilor de acceptare aprobate necesită aprobarea scrisă a clientului.'
      icon: tabler:git-branch
      link: /ro/factory/quality-change-control
      link_label: 'Standardul de control al modificărilor'
    - title: 'Controlul produselor neconforme'
