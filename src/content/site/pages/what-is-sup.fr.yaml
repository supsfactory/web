body: |
  <h2>Qu'est-ce qu'un SUP gonflable ?</h2>
  <p>Un SUP gonflable (Stand-Up Paddle Board, planche à pagaie debout) est un véhicule nautique portable fait d'un matériau drop-stitch PVC qui devient rigide quand il est gonflé à haute pression (12–15 PSI). Contrairement aux planches rigides traditionnelles en mousse et fibre de verre, un SUP gonflable peut être dégonflé, enroulé et rangé dans un sac de transport de taille sac à dos.</p>
  <p>Malgré son gonflage, les SUP modernes égalisent la rigidité et la performance des planches rigides pour la plupart des applications récréatives et de touring. L'innovation clé est la <strong>construction drop-stitch</strong> : des milliers de fils de polyester relient les couches de tissu supérieure et inférieure, empêchant la planche de ballonner sous pression.</p>

  <h2>Comment ça marche : la technologie Drop-Stitch</h2>
  <p>Le cœur de chaque SUP gonflable est le tissu drop-stitch. Pendant la fabrication, des milliers de fils sont tissés entre deux couches de tissu enduit PVC. Quand la planche est gonflée :</p>
  <ul>
    <li>Les fils tirent les panneaux supérieur et inférieur à une distance fixe l'un de l'autre</li>
    <li>Cela crée une plateforme rigide et plate qui résiste à la flexion</li>
    <li>À 12–15 PSI, la planche atteint une rigidité comparable aux planches à cœur de mousse EPS</li>
  </ul>

  <h2>Composants clés</h2>
  <ul>
    <li><strong>Noyau PVC Drop-Stitch</strong> — La couche structurelle primaire assurant la rigidité</li>
    <li><strong>Bandes de rail</strong> — Bords renforcés protégeant contre l'abrasion et l'impact</li>
    <li><strong>Tapis de pont en mousse EVA</strong> — Surface antidérapante pour le confort debout et la traction</li>
    <li><strong>Système d'ailerons</strong> — Ailerons amovibles pour la stabilité directionnelle (configuration typique 2+1)</li>
    <li><strong>Valve</strong> — Valve haute pression à sens unique pour le gonflage et le dégonflage</li>
  </ul>

  <h2>Usages courants</h2>
  <ul>
    <li><strong>Pagaie en eau plate</strong> — Lacs, baies calmes et rivières à faible courant</li>
    <li><strong>Touring</strong> — Pagaie longue distance en eau libre nécessitant l'efficacité de glisse</li>
    <li><strong>Surf</strong> — Vagues petites à moyennes (débutant à intermédiaire)</li>
    <li><strong>Pêche</strong> — Accès silencieux en eau peu profonde pour les pêcheurs</li>
    <li><strong>Fitness</strong> — SUP yoga, pilates et entraînement du tronc sur l'eau</li>
    <li><strong>Voyage</strong> — La conception portable le rend idéal pour les avions et les voyages routiers</li>
  </ul>

  <h2>SUP gonflable vs SUP rigide : différences clés</h2>
  <table>
    <tr><th>Aspect</th><th>SUP gonflable</th><th>SUP rigide (EPS/fibre de verre)</th></tr>
    <tr><td>Portabilité</td><td>Se replie dans un sac à dos</td><td>Nécessite un porte-toit ou un grand véhicule</td></tr>
    <tr><td>Durabilité</td><td>Résistant aux impacts, pas d'éclats</td><td>Peut craquer, cabosser ou se délaminer</td></tr>
    <tr><td>Rangement</td><td>Tient dans un placard ou le coffre de voiture</td><td>Nécessite un espace de rangement dédié</td></tr>
    <tr><td>Performance</td><td>Excellent pour le récréatif et le touring</td><td>Supérieur pour la course et le surf avancé</td></tr>
    <tr><td>Accessibilité débutant</td><td>Pont plus doux, moins de risque de blessure</td><td>Surface dure, moins indulgente</td></tr>
    <tr><td>Temps de mise en place</td><td>Gonflage 3–5 minutes</td><td>Prêt à partir</td></tr>
  </table>

  <h2>Comment choisir le bon SUP</h2>
  <p>En sélectionnant un SUP gonflable, considérez ces facteurs :</p>
  <ul>
    <li><strong>Volume (litres)</strong> — Détermine la flottabilité. Un volume plus élevé supporte plus de poids et offre la stabilité.</li>
    <li><strong>Longueur</strong> — Les planches plus longues (11–14 pi) tiennent mieux la route pour le touring ; les plus courtes (9–10 pi) sont plus maniables pour le surf.</li>
    <li><strong>Largeur</strong> — Les planches plus larges (32–36 po) sont plus stables ; les plus étroites (28–31 po) sont plus rapides.</li>
    <li><strong>Épaisseur</strong> — Les planches de 6 pouces offrent une rigidité optimale ; les planches de 4,7 pouces sont plus légères et portables.</li>
    <li><strong>Qualité de construction</strong> — Recherchez un drop-stitch tissé ou à laminage fusion pour la durabilité.</li>
  </ul>

  <h2>Foire aux questions</h2>
  <h3>Un SUP gonflable est-il aussi rigide qu'une planche rigide ?</h3>
  <p>À un gonflage approprié (12–15 PSI), les SUP drop-stitch modernes atteignent une rigidité comparable pour la pagaie récréative. Les planches rigides offrent encore un avantage pour la course et le surf avancé grâce à leur poids plus léger et à leurs caractéristiques de flexion plus raffinées.</p>

  <h3>Combien de temps prend le gonflage ?</h3>
  <p>Avec une pompe à double action, la plupart des planches atteignent 12–15 PSI en 3–5 minutes. Des pompes électriques sont disponibles et réduisent le temps de gonflage à environ 2 minutes.</p>

  <h3>Puis-je emmener un SUP gonflable en avion ?</h3>
  <p>Oui. Dégonflé et enroulé, la plupart des SUP tiennent dans un sac à dos qui respecte les exigences de bagage en soute des compagnies aériennes. Vérifiez toujours auprès de votre compagnie les limites de taille et de poids.</p>

  <h3>Quelle est la durabilité des SUP gonflables ?</h3>
  <p>Les SUP gonflables sont très durables. La construction PVC de grade militaire résiste aux impacts, aux perforations et aux dommages UV. Les petites perforations peuvent être réparées sur le terrain avec le kit de réparation inclus.</p>

  <h3>Quelle maintenance est requise ?</h3>
  <p>Rincez à l'eau douce après usage en eau salée. Rangez dans un endroit frais et sec à l'abri de la lumière directe du soleil. Gonflez partiellement pendant le rangement longue durée pour maintenir la forme sans stresser les coutures.</p>

