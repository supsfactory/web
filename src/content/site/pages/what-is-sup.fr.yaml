  text: 'Un SUP gonflable est une planche à pagaie debout construite en tissu drop-stitch PVC qui devient rigide quand elle est gonflée à 12–15 PSI. Elle égalise la performance des planches rigides pour la plupart des usages récréatifs et de touring, pèse environ 8–10 kg, et se replie dans un sac à dos pour le rangement et le voyage.'
