meta:
  title: 'Fabrication OEM et marque privée | {SITE}'
  description: 'Du concept à la production : personnalisez chaque détail de votre gamme de SUP gonflables. Service OEM/ODM complet pour les marques de planches à pagaie en marque privée.'
  dateModified: '2026-08'
  keywords:
    - 'fabrication sup oem'
    - 'planche à pagaie marque privée'
    - 'sup gonflable oem'
    - 'usine sup personnalisée'
hero:
  tagline: Fabrication OEM/ODM
  title: Fabrication OEM et marque privée
  subtitle: Du concept à la production —personnalisez chaque détail de votre gamme de SUP gonflables

answer:
  label: 'Réponse directe'
  text: 'Le MOQ est confirmé par la configuration du projet plutôt que par un chiffre fixe : chaque projet passe par les étapes d''échantillon (1–2 unités) et de pilote (20–50 unités), avec une production standard en volume s''exécutant en 90–100+ unités par lot à partir d''un rouleau drop-stitch complet de 150 m. Les échantillons sont prêts en 7–12 jours ; la production standard s''exécute en 25–35 jours après bon de commande confirmé et acompte.'
  verified: '2026-08'

intro: 'Afarer offre des services OEM et ODM complets aux marques, distributeurs et agences gouvernementales du monde entier. Avec plus de 10 ans d''expérience à l''export et une usine certifiée ISO 9001 & BSCI de 12 500 m², nous gérons tout, de la conception produit et du développement de moules à la production à grande échelle, l''emballage et la gestion de l''export.'

highlight:
  - value: 10+
    label: Années d'expérience OEM
    detail: Depuis 2012
  - value: 50+
    label: Pays d'export
    detail: Portée mondiale
  - value: 200+
    label: Projets personnalisés livrés
    detail: Sur toutes les gammes de produits
  - value: 25–35
    label: Délai standard (jours)
    detail: Après bon de commande confirmé et acompte

services:
  - title: Conception produit et ingénierie
    description: Notre équipe R&D interne travaille avec votre concept ou votre spécification pour développer des dessins CAD, des modèles 3D et des prototypes. Nous proposons la conception de moules, l'optimisation de la forme de coque et des conseils de choix de matériaux.
  - title: Marque et graphismes personnalisés
    description: Impression numérique pleine couleur, sérigraphie, gaufrage et options d'étiquettes. Nous développons des graphismes de pont spécifiques à la marque, le marquage des tubes et un emballage prêt pour le retail.
  - title: Personnalisation des matériaux et spécifications
    description: Choisissez parmi PVC (standard, écologique, ignifuge), Hypalon/CSM, drop-stitch et constructions hybrides. Couleurs de tubes personnalisées, grammages de tissu et options de renfort.
  - title: Emballage et logistique
    description: Emballage retail personnalisé, boîtes en marque privée, mise sous vide, palettisation et conditionnement prêt à l'export préparés en interne.

moq_table:
  - product: Planches de SUP gonflables
    standard_moq: 'Échantillon 1–2 | Pilote 20–50'
    custom_moq: 'Volume 90–100+ (par rouleau de 150 m)'
    lead_time: 25–35 jours

why_us:
  - title: Intégration verticale
    description: Nous possédons notre usine, nos moules et notre chaîne d'approvisionnement — pas d'intermédiaires, pas de sous-traitants. Cela nous donne le contrôle sur la qualité, le coût et la livraison.
  - title: Double certification
    description: Certification de management de la qualité ISO 9001 et de conformité sociale BSCI. Rapports d'audit d'usine disponibles sur demande.
  - title: Conformité CE
    description: La certification CE s'applique aux modèles destinés aux marchés de l'UE (périmètre confirmé par projet). Les modèles personnalisés peuvent être certifiés CE par notre processus établi.
  - title: MOQ spécifique au projet
    description: 'Le MOQ est confirmé par la configuration de votre projet — le co-marquage en petits lots commence à 5–10 unités, la production standard en volume s''exécute en 90–100+ unités par lot. Nous aidons les marques émergentes à se lancer sans sur-engager de stock.'

cta:
