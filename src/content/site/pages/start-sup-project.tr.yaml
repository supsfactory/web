answer:
  label: 'Bundan sonra ne olur'
  text: 'Proje briefinizi gönderdikten sonra bir iş günü içinde yanıt alırsınız. Herhangi bir gizli detay paylaşmadan önce NDA hazırdır. Mühendislik ekibiniz briefinizi inceler ve MOQ, numune ücretleri ve kapı kapı zaman çizelgesini içeren kalemli bir teklifle döner — tipik olarak numuneler için 7–12 gün, onaylanan siparişten sonra ilk üretim için 6–8 hafta. Numune ücretleri üretim siparişinizden mahsup edilir. Sözleşmeyi imzayana kadar hiçbir taahhüt yoktur.'
  verified: 'Eylül 2026'

process_steps:
  tagline: 'Süreç'
  title: 'Brieften Teslim Edilen Boardlara — Beş Adım'
  subtitle: 'Her adımın tanımlı bir zaman çizelgesi, belgelenmiş bir çıktısı ve bir devam et veya durdur kontrol noktası vardır. Siz hazır olduğunuzda ilerleriz.'
  steps:
    - step: 'Adım 1'
      title: 'Proje Briefinizi Gönderin'
      desc: 'Boardunuzdan bahsedin — hedef teknik özellikler, hacim, uyum gereksinimleri ve zaman çizelgesi. Briefi doldurmak 5–10 dakika sürer. Her detaydan emin değilseniz, elinizdekini paylaşın, kalanını yönlendirelim. Özel tasarımlarınızı paylaşmadan önce NDA hazırdır.'
    - step: 'Adım 2'
      title: 'NDA ve Uygulanabilirlik İncelemesi (1–5 Gün)'
      desc: 'İstenirse NDA imzalarız, ardından mühendislik ekibimiz briefinizi üretim kabiliyetine, malzeme bulunabilirliğine ve uyum kapsamına göre inceler. MOQ hesabı, numune ücretleri ve kapı kapı zaman çizelgesini içeren kalemli bir teklif alırsınız.'
    - step: 'Adım 3'
      title: 'Numune ve Onay (7–21 Gün)'
      desc: 'Teknik özelliklerinize göre 1–2 fiziksel board üretilir. Siz bunlara binersiniz ve değerlendirirsiniz — gövde rijitliği, grafik isabeti, aksesuar uyumu. Yapılan değişiklikler revize edilmiş malzeme listesine işlenir. Dondurulan numune üretim referansı haline gelir. Numune ücretleri üretimden mahsup edilir.'
    - step: 'Adım 4'
      title: 'Üretim Öncesi Planlama (7 Gün)'
      desc: 'Malzeme tedariği, kalıp hazırlığı, ambalaj teyidi ve üretim kapasitesi rezervasyonu. Tüm malzemeler dondurulmuş malzeme listesine göre giriş muayenesinden geçirilir. Üretim başlamadan önce kalite kontrolü kapı tarihleriyle birlikte üretim takvimi yayınlanır.'
    - step: 'Adım 5'
      title: 'Üretim, Kalite Kontrolü ve Sevkiyat (4–6 Hafta)'
      desc: 'Üretim, her kapıda geçer/kriter bulunan 7 aşamalı muayene kapı sistemiyle yürütülür. İhracat sınıfı ambalajlama, uyum belgeleri ve 50 ülkeye deniz navlun koordinasyonu. Teslim sonrası değerlendirme, bir sonraki sipariş için iyileştirmeleri kayda geçirir.'

