what_we_need:
  heading: 'Briefinizden Önce Hazırlamanız Gerekenler'
  body: |
    Eksiksiz bir brief süreci hızlandırır. Şunlar yardımcı olur:

    - **Board teknik özellikleri** — Hedef uzunluk, genişlik, kalınlık, kullanıcı ağırlığı, kullanım alanı. Referans board ölçüleri veya rakip modeller faydalıdır.
    - **Tasarım dosyaları** — Grafikler ve logolar için vektör çalışma dosyaları (AI, SVG, PDF). Hazır değilse ilk uygulanabilirlik çalışması için moodboard veya referans görseller yeterlidir.
    - **Hacim ve zaman çizelgesi** — Hedef miktar ve sezon programı. Kaba bir aralık bile ("Mart'a kadar 20–50 board") başlamak için yeterlidir.
    - **Uyum gereksinimleri** — Hedef pazarlar ve CE, ISO 9001, BSCI, REACH, RoHS ötesindeki belirli sertifikasyon gereksinimleri.
    - **Bütçe aralığı** — Board başına gösterge niteliğinde bir bütçe veya hedef maliyet, doğru platformu önermemize yardımcı olur.

    **Her şey hazır değil mi?** Elinizdekini gönderin. Kalanını yönlendirelim.

faqs:
  tagline: SSS
  title: 'SUP Projesi Başlatmak — Sık Sorulan Sorular'
  items:
    - q: 'Başlamak için asgari sipariş nedir?'
      a: 'Giriş noktası kademelidir: önce 1–2 numune (7–12 gün), ardından 20–50 boardluk deneme siparişi (25–35 gün), sonra onaylanan her yapılandırma için parti başına 90–100+ boardluk standart hacimli üretim. Özel marka ortak markalama, geliştirme aşaması olmadan 5–10 adetten başlar.'
    - q: 'Numuneyi almak ne kadar sürer?'
      a: 'Fiziksel numuneler, özelliklerin doğrulanması ve depozito sonrasında 7–12 günde üretilir. Mevcut gövde platformlarını kullanıldığında, briefden teslim edilen deneme siparişine kadar tüm döngü tipik olarak 8–12 hafta sürer. Özel bir gövde, kalıp geliştirmeye 15–20 gün ekler.'
    - q: 'Tasarımım korunuyor mu?'
      a: 'Evet. NDA anında hazırdır — herhangi bir gizli bilgiyi paylaşmanızdan önce. Yalnızca müşterilerimizin markaları altında üretim yaparız ve asla onlarla rekabet etmeyiz. Tüm teknik dosyalar erişim denetimli sistemlerde, denetim kayıtlarıyla saklanır.'
    - q: 'Proje briefi formu neleri istiyor?'
      a: "Brief; işletme türünüzü, şirket adınızı, hedef board teknik özelliklerini, sipariş miktarı aralığını, zaman çizelgesini ve varsa uyum gereksinimlerini ister. Yaklaşık 5–10 dakika sürer. Tasarım dosyaları (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) 10 MB'a kadar ekleyebilirsiniz. Bir alandan emin değilseniz boş bırakın — biz takip ederiz."
    - q: 'Briefi gönderdikten sonra ne olur?'
      a: 'Bir iş günü içinde yanıt alırsınız. Mühendislik ekibimiz briefinizi inceler ve MOQ, numune ücretleri ve kapı kapı zaman çizelgesini içeren kalemli bir teklifle döner. Sözleşmeyi inceleyip imzalayana kadar hiçbir taahhüt gerekmez. Numune ücretleri üretim siparişinizden mahsup edilir.'

