faqs:
  tagline: Vanlige spørsmål for distributører
  title: 'Engrosdistribusjonsprogrammer — vanlige spørsmål'
  items:
    - q: 'Hva er minste ordre for en ny distributør?'
      a: 'Nye distribusjonspartnere starter vanligvis med en prøve- og forproduksjonsordre, etterfulgt av en første container tilpasset sesongen deres. De eksakte minimumsmengdene avhenger av territoriets omfang og det valgte sortimentet; kontaktpersonen din bekrefter den innledende mengden under sortiments- og brandingplanleggingen.'
    - q: 'Kan vi selge brettene under vårt eget varemerke?'
      a: 'Ja. Private label er standardmodellen her: brettene produseres under eget varemerke med din grafikk, din emballasje og dine spesifikasjoner. iSupfactory produserer utelukkende for sine egne kunder og konkurrerer ikke med dem i noe marked.'
    - q: 'Er territoriene eksklusive?'
      a: 'Ja. Distribusjonsprogrammene bygger på eksklusive territorier — hver engrospartner dekker et fastslått land eller en fastslått region og får pris- og programstøtte for det markedet, iht. den kommersielle avtalen.'
    - q: 'Støtter dere dropshipping?'
      a: 'Dropship-kapasiteten inngår i programmet. Prøver, emballasje og håndtering valideres i fasen for prøvegodkjenning, slik at dropship-ordrer fungerer problemfritt fra dag én.'
    - q: 'Hvilke modeller kan vi bestille?'
      a: 'Produksjonskatalogen omfatter oppblåsbare SUP-brett i Allround-, Touring- og Surf-utførelse, oppblåsbare kajakker, pumpestyrker, årer, flyteputer og vedlikeholdstilbehør, pluss tilpassede formater utviklet sammen med konstruksjonsteamet vårt. De fleste partnere starter med 4–8 bestselgende SKU-er og utvider i kommende sesonger.'
    - q: 'Hvordan sendes ordrene?'
      a: 'Ordrene forlater fabrikken med planlagte avganger, med mulighet for forhåndsbestilling for å stabilisere transportkostnadene. Den dedikerte kontaktpersonen din planlegger produksjon og frakt ut fra prognosene dine og sesongkalenderen.'
    - q: 'Hvordan registrerer jeg meg?'
      a: 'Bruk søknadsskjemaet på denne siden, eller kontakt oss direkte. Søknadene vurderes av salgsteamet, og vi svarer innen noen arbeidsdager med neste steg, inkludert territorietildeling og et avtaleutkast.'

