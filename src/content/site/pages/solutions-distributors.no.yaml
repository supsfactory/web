  text: 'Distributører og merker samarbeider direkte med fabrikken: white label-SUP-brett under eget varemerke, direkte engrosfabrikkpriser, eksklusivt territorium per program, 3–8 SKU-er i oppstarten og 45–60 dagers betalingsutsett (alt iht. den kommersielle avtalen), der 100 % av lageret trykktestes før levering. De innledende minimumsmengdene og transportvilkårene avtales per territorium, med frakt FOB Qingdao eller CIF.'
