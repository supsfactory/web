meta:
  title: 'R&D központ – felfújható SUP tervezése | {SITE}'
  description: 'Kutatás-fejlesztés – PVC szövetek vizsgálata, testtervezés, RF hegesztés, hidrodinamikai próbák és minőségi ellenőrzés. Testreszabott R&D szolgáltatások elérhetők.'
  dateModified: '2026-08'

hero:
  tagline: R&D központ
  title: R & D központunk
  subtitle: Fókuszban a fejlődés

intro:
  - A Vatrad Kutató- és Fejlesztő Központja (R&D) az a hajtóereje küldetésünknek, hogy a vizi sporteszközöket jobbá tegyük. A világ minden táján élő vizes sportkedvelőket biztonságosabb, kényelmesebb és élvezetesebb termékekkel szolgáljuk ki, a felfújható SUP deszkák és az állva evező csónakok területén végzett folyamatos innovációval. Mérnökeink, tervezőink és szenvedélyes vizes sportolóinkból álló elkötelezett csapatunk formálja az ipar jövőjét, folyamatosan emelve a minőség, a teljesítmény és a fenntarthatóság színvonalát.
  - Kutató- és fejlesztő létesítményünk egy tető alatt egyesíti az alapanyagkutatás szakértőit, a hajóépítőket és a gyártómérnököket. Az alapanyag-receptúráktól és a test szimulációjától a hegesztési folyamatok kifejlesztéséig és a valós méretű tengerzeti próbákig a termékfejlesztés minden szakaszát adatok támasztják alá és vizsgálatokkal validáljuk.

mission:
  tagline: Küldetésünk
  title: A vizes sportok jövőjét innováljuk
  pillars:
    - icon: lightning
      title: Technológiai fejlődés
      desc: Új anyagok, formák és gyártási módszerek megnyitása a kiemelkedőbb teljesítmény és hosszabb élettartam érdekében.
    - icon: design
      title: Felhasználóorientált tervezés
      desc: A felhasználói igények mélyreható megértése és túllépése az ergonomikus, intuitív termékekkel.
    - icon: globe
      title: Fenntartható gyakorlatok
      desc: A környezetre gyakorolt hatás minimalizálása környezetbarát anyagok és eljárások alkalmazásával.
    - icon: shield
      title: Biztonság kompromisszum nélkül
      desc: A legmagasabb biztonsági színvonal biztosítása szigorú vizsgálatokkal és tanúsításokkal.

pillars:
  - title: Technológiai fejlődés
    desc: Új anyagok, formák és gyártási folyamatok megnyitása a kiemelkedőbb teljesítmény és hosszabb élettartam eléréséhez.
    icon: tech
  - title: Fejlett alapanyagok
    desc: A PVC és Hypalon alapanyagok, az összetett anyagok és a fenntartható csúcstechnológiai alternatívák kutatása a kiváló termékjellemzők érdekében.
    icon: materials
  - title: Fenntarthatóság
    desc: 'Alapvet vállalás: a felelős környezetkezelésnek szenteljük magunkat fenntartható gyártással és újrahasznosítható anyagokkal.'
    icon: sustainability

capabilities:
  tagline: Képességek
  title: R&D képességeink
  subtitle: Négy alapvető tudományterület, amely teljes ellenőrzést ad a termékfejlesztés fölött – a nyersanyagkutatástól a végső tanúsításig.
  groups:
    - title: Alapanyagtudomány és szövettechnológia
      items:
        - A PVC és Hypalon receptúrák elemzése és optimalizálása
        - UV-stabilizátorok, égésgátlók és antimikrobiális adalékok fejlesztése
        - Többrétegű szövetlaminálás és a tapadás mérnöki kialakítása
        - Gyorsított öregítési próbák (UV, termikus, páratartalom, sós perm)
    - title: Testmérnökség és hidrodinamika
      items:
        - A test parametrikus 3D tervezése és CFD optimalizálás
        - Végeselemes vizsgálat a szerkezeti és ütési terhelésekhez
        - Vontatási medencés próbák léptékmodellekkel és a teljesítmény validálása
        - Testreszabott testek fejlesztése speciális feladatkörökhöz
    - title: Hegesztés és illesztés technológiája
      items:
        - Az RF dielektromos hegesztési folyamatok fejlesztése és optimalizálása
        - Meleglevegős, forró éll és ultrahangos hegesztési módszerek
        - A ragasztás és a varrószalagok minősítése
        - A varratszilárdság modellezése és az élettartam becslése
    - title: Vizsgálat, tanúsítás és megfelelőség
      items:
        - Minőségirányítás és a CE megfelelőségi vizsgálatok
        - Független harmadik fél vizsgálatok és tanúsítások támogatása
        - Testreszabott vizsgálati protokollok fejlesztése a beszállítók minősítéséhez
        - Üzemeltetési hibák elemzése és alapterv-okozati vizsgálatok

