rd_services:
  tagline: Testreszabott R&D
  title: R&D szolgáltatások partnereknek
  services:
    - title: Testreszabott alapanyagfejlesztés
      desc: Testreszabott szövetreceptúrákat, laminált rétegeket és ragasztórendszereket fejlesztünk az Ön üzemeltetési környezetéhez és teljesítménycéljaihoz igazítva.
    - title: OEM / ODM termékmérnökség
      desc: Termékmérnöki megoldásokat fejlesztünk OEM és ODM projektekhez, az alapanyag-kiválasztástól és a test tervezésétől a gyártóeszközök optimalizálásáig.
    - title: Harmadik fél vizsgálatok és tanúsítások
      desc: Használja ISO szerint megfelelő vizsgáló létesítményünket az alapanyagok független vizsgálatához, a termékek validálásához és a tanúsítás támogatásához.
  cta: Beszéljük meg a kutatás-fejlesztési igényeit →
  cta_link: /hu/contact

vision:
  tagline: Viziónk
  title: A vizes sportok jövőjét formáljuk
  body: A Vatrad arra törekszik, hogy a felfújható csónakok és SUP deszkák iparát vezesse a folyamatos innovációval, az állandó minőséggel, valamint a biztonság és a fenntarthatóság iránti határozott elköteleződéssel – így gazdagítva a világ minden táján élő vizes sportkedvelők élményeit. A Vatrad R&D központ az a hely, ahol a szenvedély találkozik az innovációval, új mércét állítva a vizes sportok ipará számára.

labs_section:
  tagline: Laboratóriumok
  title: Laboratóriumaink
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: PVC szöveglaboratórium
      description: A csőszerű PVC és Hypalon szövetek folyamatos kutatása és vizsgálata szakítási szilárdság, UV-állóság, kopás és alacsony hőmérsékleti hajlíthatóság tekintetében, hosszú távú megbízhatóságot biztosítva a tengeri környezetben.
      href: /hu/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Deszkamérnökségi stúdió
      description: CAD-alapú tervezés és végeselemes elemzés a HDPE, alumínium és üvegszálas testekhez. Minden testet digitálisan szimulálunk a feszültségeloszlás és az ütésállóság szempontjából, az első prototípus megépítése előtt.
      href: /hu/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: RF hegesztő központ
      description: Dedikált rádiófrekvenciás hegesztőüzem, pontos hőmérséklet- és nyomásszabályozással, amely a tengerzeti hajóépítési iparág szabványai szerint nagy szilárdságú és tömör varratokat állít elő a felfújható csónakokhoz.
      href: /hu/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hidrodinamikai próbamedence
      description: Léptekmodell-próbák saját beltéri medencénkben, a test formaoptimalizálásához, a csúszási teljesítményhez, a stabilitáshoz és az energiahatékonysághoz változó terhelési és tengerjárási viszonyok között.
      href: /hu/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototípusműhely
      description: Valós méretű prototípizáló és felszerelő létesítmény, ahol az új modelleket megépítjük, összeszereljük és tengerzeti próbáknak vetjük alá. Minden prototípus a gyártási jóváhagyás előtt legalább 20 órás vízpróba-programot teljesít.
      href: /hu/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Minőségi és ellenőrzési laboratórium
      description: Dedikált minőségbiztosítási laboratórium, amely szakítási próbákat, levegőmegőrzési ciklusokat, varrásleválási próbákat és alapanyag-tanúsítást végez, így a műhelyt elhagyó minden deszka megfelel a közzétett specifikációnknak.
      href: /hu/randdcenter/quality-inspection-lab
