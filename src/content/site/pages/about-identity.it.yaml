manufacturing_scope:
  heading: 'Ambito produttivo'
  body: |
    Il nostro ambito produttivo copre l''intera catena di produzione per i prodotti SUP gonfiabili e nautici — dal controllo di ingresso delle materie prime fino all''imballaggio finale e alla documentazione commerciale di esportazione.

    - **Categorie di prodotto**: tavole SUP gonfiabili (Allround, Touring, Surf, Fishing, Yoga, Racing), kayak gonfiabili, gommoni, pagaie, pompe e accessori.
    - **Tipi di costruzione**: PVC a singolo strato, PVC a doppio strato, nucleo drop-stitch con rivestimento in PVC. Specifiche di costruzione personalizzate per ogni progetto.
    - **Modelli di collaborazione**: OEM (design proprietario del cliente), ODM (sviluppato in fabbrica in base al briefing del cliente), private label/co-branding (marchio su piattaforme collaudate).
    - **Certificazioni**: ISO 9001:2015 (gestione della qualità in fabbrica), CE (modelli destinati al mercato UE, ambito per progetto), BSCI (conformità sociale), REACH (sicurezza chimica), RoHS (sostanze soggette a restrizione).
    - **Capacità produttiva**: 120.000+ tavole all''anno, circa 10,000 unità di produzione mensile su 4 linee automatizzate. Possibilità di ampliare la scala previa pianificazione della programmazione.

brand_positioning:
  heading: 'Posizionamento del marchio'
  body: |
    iSupfactory occupa una posizione specifica sul mercato — non siamo un marchio, siamo un produttore. Questa distinzione determina ogni aspetto del nostro modo di lavorare:

    - **Non vendiamo mai con un marchio proprio.** Ogni tavola che produciamo porta il marchio dell''acquirente. Non competiamo con i nostri clienti in nessun mercato e in nessun canale. Questa politica non è negoziabile.
    - **Non siamo un''azienda commerciale.** Gestiamo la fabbrica. Controllo qualità, progettazione, pianificazione della produzione e documentazione commerciale di esportazione sono tutti gestiti internamente. Non ci sono intermediari tra il tuo ordine e il reparto produttivo.
    - **Siamo specializzati in prodotti gonfiabili.** Non è un''attività secondaria né una categoria di prodotto tra molte altre. I prodotti SUP nautici e gonfiabili sono la nostra competenza fondamentale. Ogni macchina, ogni processo, ogni punto di controllo qualità è ottimizzato per questa categoria di prodotto.
    - **Serviamo acquirenti professionali.** I nostri clienti sono marchi, distributori, gestori di resort, club e scuole — non consumatori finali. La nostra struttura di prezzi, il MOQ, la documentazione e la comunicazione sono pensati per relazioni B2B.

evidence_review:
  tagline: 'Prove e verifica'
  title: 'SPECIFICHE VERIFICATE'
  body: 'Tutte le dichiarazioni organizzative e produttive di questa pagina sono verificabili. Il certificato ISO 9001, il report BSCI, la licenza commerciale e i documenti di registrazione della fabbrica sono disponibili su richiesta. Le visite in fabbrica sono benvenute. Specifiche verificate per l''ultima volta a settembre 2026.'

faqs:
  tagline: FAQ
  title: 'Identità del marchio — Domande frequenti'
  items:
    - q: 'iSupfactory è una società separata dal Qingdao Vatrad Group?'
      a: 'No. iSupfactory è il marchio orientato al cliente di Vatrad, la divisione nautica di produzione del Qingdao Vatrad Group Co., Ltd. Il soggetto contrattuale per tutti gli ordini è il Qingdao Vatrad Group Co., Ltd. La fabbrica, il team e il sistema qualità costituiscono un''unica operazione.'
    - q: 'Vendete tavole con un marchio proprio?'
      a: 'No. Produciamo esclusivamente con i marchi dei nostri clienti e non competiamo con loro in nessun mercato. È una politica fondamentale — non una posizione provvisoria. Se trovi sul mercato una tavola con il marchio iSupfactory, non proviene dalla nostra fabbrica.'
    - q: 'Posso visitare la fabbrica?'
      a: 'Sì. Accogliamo con piacere le visite in fabbrica e possiamo organizzare un audit strutturato che copra l''intero processo produttivo, i punti di controllo qualità, il magazzino materiali e l''esame dei documenti. Contattaci per concordare una visita.'
    - q: 'Qual è il rapporto tra Vatrad e iSupfactory?'
      a: 'Vatrad è il nome della divisione produttiva all''interno del Qingdao Vatrad Group. iSupfactory è il marchio internazionale orientato al cliente per i servizi di produzione OEM, ODM e private label. Entrambi si riferiscono alla stessa operazione — la divisione nautica di produzione a Laixi, Qingdao.'

