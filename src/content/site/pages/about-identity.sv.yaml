hero:
  tagline: 'Varumärkesidentitet'
  title: 'Vem är iSupfactory?'
  subtitle: 'iSupfactory är Vatrads kundorienterade produktionsmärke, den marina produktionsdivisionen inom Qingdao Vatrad Group Co., Ltd. — en tillverkare av uppblåsbara SUP-brädor och uppblåsbara marina produkter med säte i Laixi, Qingdao, Kina. Vi tillverkar enbart under våra kunders varumärken och konkurrerar aldrig med dem.'

answer:
  label: 'Kortfattat'
  text: 'Juridisk enhet: Qingdao Vatrad Group Co., Ltd. Produktionsdivision: Vatrad (varumärket iSupfactory). Fabrik: Laixi, Qingdao, Shandong, Kina. Verksamhetsområde: OEM-, ODM- och private label-produktion av uppblåsbara SUP-brädor, paddlar och uppblåsbara marina produkter. Certifieringar: ISO 9001:2015, CE (modeller avsedda för EU-marknaden), BSCI, REACH, RoHS. Vi säljer inte under något eget varumärke — varje bräda vi tillverkar bär köparens varumärke.'
  verified: 'September 2026'

