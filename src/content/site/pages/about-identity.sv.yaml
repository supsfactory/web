manufacturing_scope:
  heading: 'Produktionsomfång'
  body: |
    Vårt produktionsomfång omfattar hela produktionskedjan för uppblåsbara SUP- och marina produkter — från inkommande råvarukontroll till slutlig förpackning och exporthandelsdokumentation.

    - **Produktkategorier**: uppblåsbara SUP-brädor (allround, touring, surf, fishing, yoga, racing), uppblåsbara kajaker, uppblåsbara båtar, paddlar, pumpar och tillbehör.
    - **Konstruktionstyper**: enkelt lager PVC, dubbelt lager PVC, drop-stitch-kärna med PVC-beläggning. Anpassade konstruktionsspecifikationer för varje projekt.
    - **Samarbetsformer**: OEM (kundens egen design), ODM (utvecklat i fabriken utifrån kundens briefing), private label/co-branding (varumärke på bevisade plattformar).
    - **Certifieringar**: ISO 9001:2015 (kvalitetsledning i fabriken), CE (modeller avsedda för EU-marknaden, omfång per projekt), BSCI (social överensstämmelse), REACH (kemisk säkerhet), RoHS (begränsade ämnen).
    - **Produktionskapacitet**: 120 000+ brädor per år, cirka 10 000 produktionsenheter per månad på 4 automatiserade linjer. Uppskalering möjlig via förhandsplanerad produktion.

brand_positioning:
  heading: 'Varumärkespositionering'
  body: |
    iSupfactory intar en specifik position på marknaden — vi är inget varumärke, vi är en tillverkare. Den skillnaden präglar alla aspekter av vårt sätt att arbeta:

    - **Vi säljer aldrig under eget varumärke.** Varje bräda vi tillverkar bär köparens varumärke. Vi konkurrerar aldrig med våra kunder på någon marknad eller i någon kanal. Den här politiken är inte förhandlingsbar.
    - **Vi är inget handelsföretag.** Vi driver fabriken. Kvalitetskontroll, konstruktion, produktionsplanering och exporthandelsdokumentation hanteras internt. Det finns inga mellanhänder mellan din order och produktionsavdelningen.
    - **Vi är specialister på uppblåsbara produkter.** Det är inte en bisyssla eller en produktkategori bland många. Marina och uppblåsbara SUP-produkter är vår kärnkompetens. Varje maskin, varje process, varje kvalitetskontrollpunkt är optimerad för den här produktkategorin.
    - **Vi betj professionella köpare.** Våra kunder är varumärken, distributörer, resortchefer, klubbar och skolor — inte slutanvändare. Vår prisstruktur, våra MOQ, vår dokumentation och vår kommunikation är utformade för B2B-relationer.

evidence_review:
  tagline: 'Bevis och verifiering'
  title: 'VERIFIERADE SPECIFIKATIONER'
  body: 'Alla organisations- och produktpåståenden på den här sidan går att verifiera. ISO 9001-certifikatet, BSCI-rapporten, handelstillståndet och fabrikens registreringsdokument lämnas ut på begäran. Fabriksbesök är välkomna. Specifikationerna verifierades senast i september 2026.'

faqs:
  tagline: FAQ
  title: 'Varumärkesidentitet — vanliga frågor'
  items:
    - q: 'Är iSupfactory ett separat företag från Qingdao Vatrad Group?'
      a: 'Nej. iSupfactory är Vatrads kundorienterade varumärke, den marina produktionsdivisionen inom Qingdao Vatrad Group Co., Ltd. Motparten för alla order är Qingdao Vatrad Group Co., Ltd. Fabriken, teamet och kvalitetssystemet utgör en och samma verksamhet.'
    - q: 'Säljer ni brädor under eget varumärke?'
      a: 'Nej. Vi tillverkar enbart under våra kunders varumärken och konkurrerar aldrig med dem. Det är en grundläggande politik — ingen tillfällig position. Hittar du en bräda med varumärket iSupfactory ute på marknaden kommer den inte från vår fabrik.'
    - q: 'Kan jag besöka fabriken?'
      a: 'Ja. Vi välkomnar gärna fabriksbesök och kan ordna en strukturerad revision som täcker hela produktionsprocessen, kvalitetskontrollpunkterna, materiallagret och dokumentgranskningen. Kontakta oss för att boka ett besök.'
    - q: 'Vad är relationen mellan Vatrad och iSupfactory?'
      a: 'Vatrad är namnet på produktionsdivisionen inom Qingdao Vatrad Group. iSupfactory är det internationella kundorienterade varumärket för OEM-, ODM- och private label-tjänster. Båda syftar på samma verksamhet — den marina produktionsdivisionen i Laixi, Qingdao.'

