      link_label: 'Разработка высокопроизводительных досок'
      href: /ru/odm-manufacturing

key_factors:
  heading: 'Ключевые факторы помимо типа конструкции'
  body: |
    Тип конструкции — лишь одна переменная в характеристиках доски. Еще три фактора имеют не меньшее или большее значение:

    - **Плотность drop stitch** — Число нитей на дюйм определяет, насколько равномерно доска сохраняет форму под давлением. Мы используем стандарт 96 нитей на дюйм и 140 нитей на дюйм для высокопроизводительных сборок. Более высокая плотность = более плоская доска = лучшее скольжение.
    - **Марка и толщина ПВХ** — Не весь ПВХ одинаков. Импортированный из Кореи ПВХ толщиной 0,7 mm имеет более высокую прочность на разрыв и стойкость к УФ-излучению, чем более тонкие альтернативы. Мы задаем марку материала для каждого проекта.
    - **Конструкция бортов** — Однослойные борта — самая частая точка отказа на недорогих досках. Двухслойные борта и усиленная лента на борт значительно снижают риск прокола борта. Все наши доски используют усиленные борта независимо от конструктивного сегмента.

faqs:
  tagline: FAQ
  title: 'Конструкции SUP — часто задаваемые вопросы'
  items:
    - q: 'Какой тип конструкции выбрать для моего бренда?'
      a: 'Это зависит от вашего целевого рынка и ценового позиционирования. Начальный уровень и крупная розница: однослойная. Прокатные парки, клубы и бренды среднего сегмента: двухслойная. Высокие характеристики, туринг и премиум: ядро drop stitch. Большинство брендов начинают с двухслойной как лучшего баланса стоимости, долговечности и ощущений от гребли. Мы рекомендуем вариант на основе вашего конкретного рынка в ходе проверки осуществимости.'
    - q: 'Могу ли я предложить несколько конструктивных сегментов под одним брендом?'
      a: 'Да — многие бренды предлагают два или три сегмента. Мы производим все три конструкции на одной линии с одними и теми же контрольными воротами QC, поэтому вы можете комбинировать типы конструкции в рамках одного заказа. Форма корпуса и графика могут быть одинаковыми во всех сегментах; различаются только конструкция и материалы.'
    - q: 'Каков стандарт испытания давлением для всех конструкций?'
      a: 'Каждая доска независимо от типа конструкции проходит испытание удержанием 18.0 PSI с автоматическим браком при падении давления более 0,50 PSI за 24 часа. Однослойные доски рассчитаны на давление гребли 12–15 PSI, двухслойные — на 15–18 PSI, а с ядром drop stitch — на 18–25 PSI. Давление испытания превышает номинальное давление для всех типов.'
    - q: 'Как конструкция влияет на гарантийные обращения?'
      a: 'Однослойные доски имеют немного более высокий процент гарантийных обращений при коммерческом использовании и в прокате из-за воздействия на борта и риска прокола. Двухслойные конструкции и конструкции с ядром drop stitch имеют значительно более низкий процент обращений. Мы предоставляем данные по гарантии в разрезе сегментов из нашей производственной отчетности на этапе запроса цены.'

