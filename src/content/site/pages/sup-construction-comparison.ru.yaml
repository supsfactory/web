hero:
  tagline: 'Руководство по конструкции'
  title: 'Сравнение конструкций SUP'
  subtitle: 'Три типа конструкции, одна производственная линия. Разберитесь в компромиссах между жесткостью, весом, долговечностью и стоимостью у однослойного ПВХ, двухслойного ПВХ и досок с ядром drop stitch — и выясните, какая конструкция соответствует вашему целевому райдеру и позиционированию на рынке.'

answer:
  label: 'Краткое сравнение'
  text: 'Однослойный ПВХ — самый легкий и доступный: лучший вариант для нерегулярных райдеров и рынков, чувствительных к цене. Двухслойный ПВХ добавляет второй слой ПВХ для жесткости и долговечности при умеренном весе — отраслевой стандарт для прокатных парков и брендов среднего сегмента. Ядро drop stitch с оболочкой из ПВХ обеспечивает максимальную жесткость и устойчивость к давлению — предпочтительно для высоких характеристик, сёрфа и тяжелых райдеров. Все три конструкции изготавливаются на одной производственной линии с одними и теми же контрольными воротами QC; разница — в материалах и этапах ламинирования.'
  verified: 'Сентябрь 2026'

