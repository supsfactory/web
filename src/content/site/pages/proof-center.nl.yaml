answer:
  label: 'Kort antwoord'
  text: 'De keten van claim naar bewijs werkt zo: elke claim op deze site is gebaseerd op een registratie, een certificaat, een machine, een document of een testprotocol — en elk van die kan worden ingezien. SUPsfactory is de productontwikkelings- en SUP-productiedivisie van de Qingdao Vatrad Group Co., Ltd. (geregistreerd in Qingdao sinds 2012). De fabriek van 12,500 m² beschikt over kwaliteitsbeheer volgens ISO-9001:2015, conformiteit met ISO-25649, CE-conformiteitsdocumentatie, sociale conformiteit BSCI (auditrapport op aanvraag) en REACH/RoHS-materiaaldocumentatie voor elke bestelling. Elke opblaasbare kamer wordt 24 uur getest op 18,0 PSI met automatische afkeur boven 0,50 PSI drukval, en partijregistraties worden bewaard met 10 jaar ERP-traceerbaarheid. De papieren sporen zijn gepubliceerd of deelbaar, en de fabriek zelf staat open voor audits.'
  verified: 'September 2026'

