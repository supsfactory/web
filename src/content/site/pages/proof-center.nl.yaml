traceability:
  tagline: 'Eén partij, getraceerd van rol tot plank'
  title: 'Hoe traceerbaarheid er echt uitziet'
  body: |
    Aan elke partij wordt een **10-jaar ERP-partijcode** toegekend. De keten die onder een partij wordt geregistreerd:

    - **Binnenkomende rol** — materiaalcertificaat, rolnummer, gecontroleerde stofpartij (trek, snede, las)
    - **Snijden** — CNC-nestingopdracht tegenover het ontwerpbestand, geregistreerd afvalpercentage
    - **Lassen & lamineren** — lijn, operator, machineparameters per kamer
    - **Assemblage** — serienummer van de plank, ventieltype, partij van het deckpad
    - **Test** — 18,0 PSI × 24 h drukbehoud per kamer, automatische afkeur boven 0,50 PSI drukval
    - **Vrijgave** — 100-punts checklist per plank, vrijgave door de QA-directeur per partij
    - **Verder** — conformiteitscertificaat (Certificate of Conformance) bij levering; auditrecht contractueel voorbehouden

    Vraag het voorbeeld-QC-protocol aan vóór je eerste order — het heeft hetzelfde format als wat je bij de levering ontvangt.

faqs:
  tagline: 'FAQ'
  title: 'Vragen over het bewijs die kopers stellen'
  items:
    - q: 'Is deze pagina alleen voor verificatie en vervangt hij de due diligence niet?'
      a: 'Klopt — deze pagina toont waar elke claim kan worden geverifieerd: entiteitsregistratie, certificaten, machines, registraties en een fabriek die openstaat voor audits. Je gebruikelijke due diligence-stappen (registratiecontrole, audit, inspectie door derden) blijven geldig en zijn welkom.'
    - q: 'Welke entiteit moet op mijn orderdocumentatie verschijnen?'
      a: 'Bestellingen worden afgesloten met de Qingdao Vatrad Group Co., Ltd., die opereert als Vatrad (productiedivisie), met SUPsfactory als SUP-productlijn. Contractdocumenten worden ondertekend door de VP Sales, de hoofdingenieur en de QA-directeur.'
    - q: 'Kan ik vóór de bestelling kopieën van de certificaten ontvangen?'
      a: 'Ja — certificaatnummers en auditeocumenten worden verstrekt op aanvraag of tijdens een audit. De lijst is gepubliceerd, nooit "alleen op aanvraag beschikbaar".'
    - q: 'Hoe kan ik zelf de testprotocollen van partijen verifiëren?'
      a: 'Elke kamer wordt 24 uur getest op 18,0 PSI met automatische afkeur boven 0,50 PSI drukval; de testprotocollen zijn gekoppeld aan de serienummers en reizen mee met het conformiteitscertificaat van elke partij. Een pre-verzending inspectie door SGS, TÜV, BV of Intertek volgens ISO 2859-1 Niveau II kan naar jouw keuze worden gepland.'
    - q: 'Dekken de certificaten ook de accessoires?'
      a: 'De REACH/RoHS-materiaaldocumentatie geldt voor planken en accessoires van dezelfde bestelling en de QC-checklists dekken het volledige pakket — plank, peddel, pomp, leash en tas.'
    - q: 'Wat gebeurt er met het bewijs na de bestelling?'
      a: 'De ERP-partijtraceerbaarheid wordt 10 jaar bewaard. De QMS-SOP''s en testnormen blijven downloadbaar en de koper behoudt contractueel een auditrecht tijdens de productie.'

