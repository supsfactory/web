answer:
  label: 'Прямой ответ'
  text: 'Кастомные доски SUP проектируются собственными силами с использованием 3D-моделирования поверхностей в SolidWorks, FEA и CFD в ANSYS: каждая доска моделируется на распределение напряжений и жёсткость палубы с обязательным коэффициентом запаса ≥ 2.5 до прототипирования. Прототип кастомной формы занимает 7–12 дней; полностью кастомная оснастка добавляет 15–20 дней к производственному сроку 25–35 дней, а MOQ подтверждается конфигурацией проекта (см. наше руководство по MOQ).'
  verified: 'Сентябрь 2026'

intro: 'Форма доски SUP — её rocker, профиль усилителя борта, объём носа и кормы — определяет, как она идёт по воде, поворачивает и держит курс. В {SITE.name} наше бюро проектирования досок объединяет CAD-моделирование поверхностей, конечно-элементный анализ (FEA) конструкций drop-stitch и производственный опыт, чтобы выпускать доски, оптимизированные под предполагаемое применение: универсальную устойчивость, скольжение в touring или performance в сёрфинге. Каждая кастомная доска начинается с вашей спецификации, а не с типовой формы из каталога.'

content_html: |
  <h2>Там, где прочность встречается с гидродинамикой</h2>
  <p>Надувная доска SUP представляет собой конструкцию drop-stitch: тысячи полиэфирных нитей соединяют верхний и нижний слои PVC, удерживая палубу плоской при 12–15 PSI, тогда как геометрия усилителя борта и носа определяет взаимодействие доски с водой. Мы проектируем 3D-форму, моделируем надувную конструкцию и подтверждаем результат собственными силами до раскроя первого образца.</p>

  <h2>Инструменты проектирования и стандарты</h2>
  <p>Наша цифровая инженерная среда включает:</p>
  <table>
    <thead><tr><th>Возможность</th><th>Программа / инструмент</th><th>Применение</th></tr></thead>
    <tbody>
      <tr><td>3D-параметрическое моделирование</td><td>SolidWorks Professional</td><td>Поверхность доски, линия rocker, профиль усилителя борта, интеграция ручки и плавника</td></tr>
      <tr><td>Конечно-элементный анализ</td><td>ANSYS Mechanical</td><td>Картирование напряжений в сердцевине drop-stitch, жёсткость палубы под нагрузкой, усиление в точках крепления ручки</td></tr>
      <tr><td>Вычислительная гидродинамика</td><td>Ansys Fluent</td><td>Прогноз гидродинамического сопротивления, оптимизация посадки на плане</td></tr>
      <tr><td>Проектирование ламинатов</td><td>ESAComp</td><td>Раскладка слоёв PVC, выбор плотности ткани, расчёт массы</td></tr>
      <tr><td>Проверка поверхности оснастки</td><td>Moldex3D</td><td>Проверка геометрии сварочного инструмента для РФ-сварки</td></tr>
    </tbody>
  </table>

  <h2>Наш инженерный процесс</h2>
  <p>Каждый проект доски, будь то стандартная модель или полностью кастомный проект, проходит строгий пятиэтапный процесс:</p>
  <ol>
    <li><strong>Концепция и сбор требований</strong> — мы определяем диапазон веса пользователя, предполагаемое применение (универсальное, touring, сёрфинг, йога, прокатный парк), целевые длину, ширину и толщину, а также специальные функции (грузовые системы, накладки на палубу, точки крепления).</li>
    <li><strong>3D-моделирование и расчёт объёма</strong> — форма доски моделируется в SolidWorks и проверяется по распределению объёма, водоизмещению и устойчивости относительно целевого веса пользователя.</li>
    <li><strong>Структурный FEA</strong> — надувная доска анализируется при нагрузке стоящего пользователя, статической (пользователь в центре, 100 kg) и динамической (удар волны в усилитель борта). Контуры напряжений анализируются; коэффициент запаса ≥ 2.5 обязателен.</li>
    <li><strong>Оптимизация сопротивления средствами CFD</strong> — корпус моделируется при трёх режимах нагрузки и пяти скоростях. Смачиваемая поверхность, угол посадки и остаточное сопротивление последовательно снижаются.</li>
    <li><strong>Анализ и выпуск проекта</strong> — полный инженерный пакет (3D-модель, отчёт FEA, отчёт CFD, оценка массы, схема раскладки панелей) рассматривается нашим старшим инженером до передачи в цех прототипов.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Результаты FEA — универсальная доска 11''0 (32'' в ширину, 6'' в толщину)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Коэффициент запаса при нагрузке 120 kg стоящим пользователем</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">0 mm</span>
        <span class="text-gray-500">Прогиб палубы при 15 PSI без нагрузки</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">3.2 mm</span>
        <span class="text-gray-500">Максимальный прогиб палубы при пользователе 120 kg</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15 PSI</span>
        <span class="text-gray-500">Давление анализа — рабочий рейтинг платформы</span>
      </div>
    </div>
  </div>

  <h2>Кастомизация: ваша доска, ваши правила</h2>
  <p>У любых двух брендов требования различаются. Прокатному парку нужна широкая устойчивая универсальная доска с усиленными усилителями борта; touring-бренду нужен более длинный нос с водоизмещением и грузовыми точками крепления; сёрфинговой линии — подтянутый корма и профиль rocker. Мы не впихиваем вашу линейку в готовые формы, а проектируем начиная с вашей спецификации.</p>
  <p>Примеры недавних проектов кастомных досок:</p>
  <ul>
    <li>Touring SUP 14'' для бренда гонок на выносливость, с носом, работающим на водоизмещение, и утопленной грузовой палубой (+15% длины ватерлинии для скольжения).</li>
    <li>Широкая универсальная доска 10'6'' для парка курорта, с двухслойными боковыми усилителями борта и паспортной грузоподъёмностью 220 lb.</li>
    <li>Сёрфинговая SUP 9'' с подтянутым кормой и прогрессивным rocker, разработанная для специализированной линейки школы сёрфинга.</li>
  </ul>

  <h2>Наши инженеры</h2>
  <p>Бюро возглавляет старший продуктовый инженер с 14-летним опытом в проектировании надувных изделий, которого поддерживают два механических инженера, специализирующихся на FEA и CFD. Все трое имеют дипломы о высшем инженерном образовании в международно признанных университетах, а команда напрямую работает с нашим производственным цехом, чтобы каждый проект был реализуем в масштабе контейнерных отгрузок.</p>

  <h2>Станьте нашим партнёром в создании следующей доски</h2>
  <p>От первого эскиза концепции до финального отчёта по напряжениям наше бюро проектирования досок — ваш партнёр в создании доски, которая не просто изготовлена, а спроектирована. Мы вкладываем часы моделирования на старте, чтобы каждый шов, каждый слой ламината и каждый изгиб усилителя борта были там по причине.</p>
  <p>Нужна ли вам небольшая доработка существующей модели или полностью новая разработка с нуля, мы готовы обсудить ваши требования.</p>

