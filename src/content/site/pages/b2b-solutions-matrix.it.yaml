content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p>Ogni percorso di questa matrice parte dalle stesse due cose: il nostro <a href="/oem-manufacturing">programma di produzione OEM/ODM</a> e la <a href="/factory">fabbrica che c''è dietro</a> — un impianto di 12,500 m&sup2;, un unico set di standard di qualità, ogni canale servito.</p>
