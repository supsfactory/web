  text: 'Un SUP gonfiabile è un paddleboard stand-up in tessuto PVC drop-stitch che diventa rigido se gonfiato a 12–15 PSI. Per la maggior parte degli utilizzi ricreativi e da tour raggiunge le prestazioni delle tavole rigide, pesa circa 8–10 kg e può essere piegato e riposto in uno zaino per lo stoccaggio e i viaggi.'
