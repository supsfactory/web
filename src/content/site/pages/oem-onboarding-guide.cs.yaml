checklist:
  heading: 'Co si připravit před zadáním projektu'
  body: |
    Čím úplnější bude vaše zadání, tím rychlejší a přesnější bude nabídka. Mít připraveno byste měli toto:

    - **Specifikace desky** — cílová délka, šířka, tloušťka, hmotnostní rozsah jezdce a zamýšlené použití (touring, all-around, surf, rybolov, yoga atd.). Pokud máte rozměry referenční desky nebo konkurenci, zahrňte je.
    - **Návrhové soubory** — vektorová grafika (AI, SVG nebo PDF) pro grafiku desky, logo na podložce EVA a případný sekundární branding. Pokud grafika ještě není hotová, pro úvodní posouzení feasibility stačí moodboard nebo referenční obrázky.
    - **Objem objednávky a termín** — cílové množství pro první objednávku a sezónní termín, kterého potřebujeme dosáhnout. I hrubý odhad („20–50 desek do března“) stačí k potvrzení feasibility a dostupnosti slotu.
    - **Požadavky na soulad** — cílové trhy (EU, Severní Amerika, Austrálie atd.) a případné specifické požadavky na certifikaci nebo zkoušení nad rámec našeho standardního rozsahu (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Rozpočtové rozmezí** — orientační rozpočet na kus nebo cílová cena na doručení nám pomůže doporučit správnou platformu a úroveň konstrukce. Přesná cena se potvrzuje až po posouzení inženýringem — nikdy dříve.

    Pokud některou část ještě nemáte, pošlete to, co máte. Zbytek vás navedeme.

evidence_review:
  tagline: 'Důkazy a verifikace'
  title: 'SPECIFIKACE OVĚŘENY'
  body: 'Všechna tvrzení o výrobě na této stránce ověřil náš tým výrobního inženýrství v závodě Laixi u Qingdao. Certifikáty, záznamy kontrol kvality, zprávy o tlakových a konstrukčních zkouškách a logy o stopovatelnosti dávek jsou k dispozici na vyžádání. Specifikace naposledy ověřeny v září 2026.'

faqs:
  tagline: FAQ
  title: 'Onboarding OEM — často kladené otázky'
  items:
    - q: 'Jak dlouho trvá celý proces onboardingu?'
      a: 'Schválení vzorku obvykle trvá 2–4 týdny (včetně výroby vzorku za 7–12 dní a vašeho posouzení). První výrobní dávka trvá 6–8 týdnů od potvrzené objednávky a zálohy. Zákazkový tvar trupu přidává 15–20 dní vývoje formy. Každá brana má pevný termín, který si předem dohodnete.'
    - q: 'Musím podepsat NDA, než sdělím svůj návrh?'
      a: 'NDA je k dispozici ihned na vyžádání — ještě před sdílením jakýchkoli proprietárních technických specifikací nebo grafiky. Vyrábíme výhradně pod značkami našich klientů a na žádném trhu s nimi nesoutěžíme. Stejná zásada platí pro vzorek jedné desky i pro program celého kontejneru.'
    - q: 'Jaké je minimální množství pro první objednávku OEM?'
      a: 'Vstup je členěn po úrovních: nejprve 1–2 vzorky (připravené za 7–12 dní), potom zkušební nebo pilotní objednávka 20–50 desek (výroba 25–35 dní) a nakonec standardní sériové dávky 90–100+ desek na schválenou konfiguraci. Malá dávka ve spolupráci na značce začíná na 5–10 kusech, pokud není potřeba vývojová fáze. Poplatky za vzorek se odečítají z výrobní objednávky.'
    - q: 'Jak je během onboardingu řešena ochrana IP?'
      a: 'Vaše návrhy a specifikace jsou chráněny NDA podepsaným před sdílením jakékoli proprietární informace. Veškerá grafika, data kusovníku BOM a technické soubory jsou uloženy v systémech s řízeným přístupem a auditními stopami. V režimu OEM vlastníte všechna IP. V režimu ODM se IP přizpůsobené platformy sdílí podle dohody. V režimu Private Label zůstává IP u iSupfactory a vy si licenciujete použití značky.'
    - q: 'Jaké záruky kvality platí pro první objednávku?'
      a: 'Každá deska — vzorek, zkušební dávka i série — prochází stejným sedmistupňovým systémem kontrolních bran: kontrola vstupního materiálu, kontrola tkaniny drop-stitch, svařování a montáž, 24hodinové zkoušení tlaku a nepropustnosti (udržení 18,0 PSI, automatické odmítnutí při poklesu nad 0,50 PSI), instalace podložky EVA a příslušenství, kontrola grafiky a brandingu a závěrečné balení s dokumentací. Kvalita se nikdy nesnižuje u menších objednávek.'

