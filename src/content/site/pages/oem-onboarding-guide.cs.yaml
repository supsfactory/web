answer:
  label: 'Přímá odpověď'
  text: 'Typický onboarding OEM trvá 2–4 týdny do schválení vzorku a 6–8 týdnů do první výrobní dávky od potvrzené objednávky. Začínáte odevzdáním zadání projektu (specifikace desky, objem, požadavky na soulad). Odpovídáme do jednoho pracovního dne, před sdílením proprietárních detailů nabízíme NDA a vyrobíme 1–2 fyzické vzorky za 7–12 dní k vašemu posouzení a schválení. Jakmile je vzorek uzavřen, následuje plánování výroby a vlastní výroba s pevnými kontrolními branami v každé fázi. Každý krok je zdokumentovaný a stopovatelný.'
  verified: 'září 2026'

process_steps:
  tagline: Sedm bran
  title: 'Průběh onboardingu — sedm bran od zadání po dodání'
  subtitle: 'Každá brana má definovaný vstup, definovaný výstup a termín, který si předem dohodnete. Nikdy nepřejdete za bránu bez výslovného podpisu.'
  steps:
    - step: 'Brana 1'
      title: 'Úvodní poptávka a NDA (den 0)'
      desc: 'Odešlete zadání projektu přes /contact s cílovými specifikacemi desky, objemem objednávky, požadavky na soulad a termínem. NDA je k dispozici ihned — ještě před sdílením jakýchkoli proprietárních technických specifikací nebo grafiky. Odpověď do jednoho pracovního dne.'
    - step: 'Brana 2'
      title: 'Posouzení feasibility a nabídka (dny 1–5)'
      desc: 'Inženýring posoudí vaše zadání z hlediska výrobních schopností, dostupnosti materiálů a rozsahu souladu. Obdržíte položkovou nabídku s výpočtem MOQ, poplatky za vzorek (odečítanými z výroby) a jednotlivými úseky dodací lhůty — ne hrubý odhad, ale harmonogram po branách.'
    - step: 'Brana 3'
      title: 'Výroba vzorku (dny 6–17)'
      desc: 'Podle vaší specifikace se vyrobí 1–2 fyzické desky: tuhost trupu, textura protiskluzové podložky EVA, přesnost grafiky, fit příslušenství. Desku si před jakýmkoli dalším závazkem vyzkoušíte a posoudíte. Poplatky za vzorek se po podpisu smlouvy odečítají z výrobní objednávky.'
    - step: 'Brana 4'
      title: 'Posouzení a schválení vzorku (dny 18–21)'
      desc: 'Vzorek posoudíte oproti své specifikaci — jízdní kvalita, věrnost grafiky, obaly, příslušenství. Úpravy se zachytí v revidovaném kusovníku BOM a v podpisu grafiky. Uzavřená specifikace se stává výrobní referencí pro všechny další dávky.'
    - step: 'Brana 5'
      title: 'Plánování před výrobou (dny 22–28)'
      desc: 'Nákup materiálů, nastavení nástroje, potvrzení obalů a rezervace výrobního slotu. Všechny materiály se zkontrolují na vstupu oproti uzavřenému kusovníku BOM. Před zahájením výroby se vydá plán výroby s termíny kontrolních bran.'
    - step: 'Brana 6'
      title: 'Výroba a kontrolní brany (dny 29–55)'
      desc: 'Výroba prochází sedmistupňovým systémem kontrolních bran: kontrola vstupního materiálu, kontrola tkaniny drop-stitch, svařování a montáž, zkoušení tlaku a nepropustnosti (udržení 18,0 PSI, automatické odmítnutí při poklesu nad 0,50 PSI), instalace podložky EVA a příslušenství, kontrola grafiky a brandingu, závěrečné balení a dokumentace. Každá brana má kritéria úspěchu/neúspěchu a záznamy o stopovatelnosti.'
    - step: 'Brana 7'
      title: 'Expedice a hodnocení po dodání (dny 56–63)'
      desc: 'Vývozní balení, dokumentace o souladu (CE, ISO 9001, BSCI, REACH, RoHS) a koordinace námořní dopravy do 50+ zemí. Hodnocení po dodání zachycuje získané zkušenosti a vylepšení pro další objednávkový cyklus.'

