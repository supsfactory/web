hero:
  tagline: Productiecapaciteiten
  title: 'SUP-productiecapaciteiten'
  subtitle: 'Elk proces — rompengineering, verwerking van de drop-stitch kern, hoogfrequent lassen, printen, bevestiging, assemblage, testen en verpakking — gebeurt intern in onze fabriek van 12,500 m² in Qingdao. Eén verantwoordelijk team beheert je project van de eerste tekening tot de verzonden container.'

answer:
  label: 'Kort antwoord'
  text: 'De SUP-productie is volledig intern in onze fabriek in Qingdao: rompontwerp en dimensionale engineering met een CNC-precisie van 0,1 mm; verwerking van drop-stitch materiaal en hoogfrequent lassen op 4 geautomatiseerde lijnen; grafische print; EVA-deckpad stansen; interne bevestiging (+15–20 dagen voor nieuwe vormen); assemblage volgens een checklist van 100 punten en een druk- en dichtheidstest van 24 uur op 18,0 PSI met automatische afkeur bij een daling boven 0,50 PSI. De jaarcapaciteit is 120.000+ planken (circa 10.000/maand) in 4 speciale werkplaatsen met 350+ medewerkers, geleverd aan meer dan 50 landen onder jouw merk.'
  verified: 'September 2026'

