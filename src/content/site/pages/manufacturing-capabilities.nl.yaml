faq_section:
  tagline: FAQ
  title: Vragen over de SUP-productiecapaciteiten
  questions:
    - q: Welke productieprocessen vinden intern plaats?
      a: 'Alle kernprocessen zijn intern: rompengineering, verwerking van de drop-stitch kern, hoogfrequent lassen, printen, EVA-stansen, assemblage, testen en verpakking. Accessoires en sommige grondstoffen komen van gecertificeerde leveranciers; de eindsamenstelling van de kit gebeurt intern voor een volledige traceerbaarheid.'
    - q: Wat is jullie productiecapaciteit?
      a: '120.000+ planken per jaar (circa 10.000/maand) op 4 geautomatiseerde lijnen en 4 speciale werkplaatsen op 12,500 m² met meer dan 350 medewerkers.'
    - q: Welke minimum bestelhoeveelheid geldt voor deze capaciteiten?
      a: 'De standaardhoeveelheid start vanaf 90–100+ eenheden per goedgekeurde configuratie (één rol van 150 m drop-stitch weefsel); pilotpartijen starten vanaf 20–50 eenheden op bestaande platforms; orders met alleen een logo starten vanaf 5–10 eenheden.'
    - q: Met welke levertijden moeten we rekening houden?
      a: 'Prototypesamples in 7–12 dagen; productie 25–35 dagen na bevestigde bestelling en aanbetaling; de bevestiging voor vormen op maat voegt 15–20 dagen toe.'
    - q: Hoe beïnvloeden de capaciteiten de kwaliteit?
      a: 'Elk proces voedt het kwaliteitssysteem in 7 fasen: assemblagechecklist van 100 punten, drukbehoud van 18,0 PSI gedurende 24 uur met automatische afkeur boven 0,50 PSI daling, steekproeven volgens ISO 2859-1 Niveau II en ERP-partijtraceerbaarheid gedurende 10 jaar.'

