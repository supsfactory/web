  text: 'Le drop-stitch est un tissu dont les piliers de fil polyester maintiennent les couches PVC supérieure et inférieure à une distance fixe, de sorte que la pression d''air rend la planche rigide. Noyaux Afarer : 1 680 DTEX, 2 fils par pouce carré, laminé extérieur PVC de 1,2 mm, nominal à 15 PSI, validé par un test de maintien de 24 heures à 18,0 PSI.'
