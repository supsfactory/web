answer:
  label: 'Co dzieje się dalej'
  text: 'Po wysłaniu briefu projektu otrzymujesz odpowiedź w ciągu jednego dnia roboczego. NDA jest dostępne, zanim udostępnisz jakiekolwiek szczegóły zastrzeżone. Dział inżynierii analizuje Twój brief i przekazuje wycenę pozycjoną z MOQ, opłatami za próbki oraz harmonogramem bramka po bramce — zwykle 7–12 dni na próbki i 6–8 tygodni na pierwszą produkcję od potwierdzonego zamówienia. Opłaty za próbki zaliczasz na poczet zamówienia produkcyjnego. Nie zobowiązujesz się do niczego, dopóki nie podpiszesz umowy.'
  verified: 'Wrzesień 2026'

process_steps:
  tagline: 'Proces'
  title: 'Od briefu do dostarczonych desek — pięć kroków'
  subtitle: 'Każdy krok ma zdefiniowany termin, udokumentowany rezultat oraz punkt decyzyji tak/nie. Przechodzisz dalej dopiero wtedy, gdy jesteś gotowy.'
  steps:
    - step: 'Krok 1'
      title: 'Prześlij brief projektu'
      desc: 'Opowiedz nam o swojej desce — docelowa specyfikacja, wolumen, wymagania zgodności i termin. Wypełnienie briefu zajmuje 5–10 minut. Jeśli nie masz pewności co do każdego szczegółu, podaj to, co wiesz, a resztę pomożemy doprecyzować. NDA jest dostępne, zanim udostępnisz projekty zastrzeżone.'
    - step: 'Krok 2'
      title: 'NDA i przegląd wykonalności (1–5 dni)'
      desc: 'Podpisujemy NDA, jeśli tego wymagasz, a następnie dział inżynierii analizuje Twój brief pod kątem możliwości produkcyjnych, dostępności materiałów i zakresu zgodności. Otrzymujesz wycenę pozycjoną z obliczeniem MOQ, opłatami za próbki i harmonogramem bramka po bramce.'
    - step: 'Krok 3'
      title: 'Próbka i zatwierdzenie (7–21 dni)'
      desc: 'Wykonujemy 1–2 fizyczne deski zgodnie z Twoją specyfikacją. Wjeżdżasz na nich i je oceniasz — sztywność kadłuba, dokładność grafiki, dopasowanie akcesoriów. Zmiany zapisujemy w zrewidowanej liście materiałowej (BOM). Zamrożona próbka staje się punktem odniesienia dla produkcji. Opłaty za próbki zaliczasz na poczet produkcji.'
    - step: 'Krok 4'
      title: 'Planowanie przedprodukcyjne (7 dni)'
      desc: 'Zakup materiałów, przygotowanie oprzyrządowania, potwierdzenie opakowania i rezerwacja terminu produkcyjnego. Wszystkie materiały przechodzą inspekcję wejściową względem zamrożonej listy BOM. Przed rozpoczęciem produkcji wydajemy harmonogram produkcji z datami bramek QC.'
    - step: 'Krok 5'
      title: 'Produkcja, QC i wysyłka (4–6 tygodni)'
      desc: 'Produkcja przebiega przez 7-etapowy system bramek inspekcyjnych z kryteriami pass/fail na każdej bramce. Pakowanie eksportowe, dokumentacja zgodności i koordynacja żeglugi morskiej do ponad 50 krajów. Przegląd po dostawie pozwala zebrać usprawnienia na kolejne zamówienie.'

