what_we_need:
  heading: 'Co przygotować przed briefem'
  body: |
    Kompletny brief przyspiesza proces. Oto, co najbardziej pomaga:

    - **Specyfikacja deski** — docelowa długość, szerokość, grubość, waga użytkownika, zastosowanie. Przydatne są referencyjne wymiary desek lub specyfikacje modeli konkurencji.
    - **Pliki projektowe** — grafika wektorowa (AI, SVG, PDF) na nadruki i logotypy. Jeśli nie jest jeszcze gotowa, na potrzeby wstępnej oceny wykonalności wystarczą tablice inspiracji lub obrazy referencyjne.
    - **Wolumen i harmonogram** — docelowa ilość i terminarz sezonowy. Nawet przybliżony zakres ("20–50 desek do marca") wystarczy na start.
    - **Wymagania zgodności** — docelowe rynki oraz ewentualne szczególne wymagania certyfikacyjne wykraczające poza CE, ISO 9001, BSCI, REACH, RoHS.
    - **Przedział budżetowy** — orientacyjny budżet na jedną deskę lub docenowy koszt końcowy pomaga nam dobrać odpowiednią platformę.

    **Nie masz jeszcze wszystkiego?** Wyślij to, co masz. Resztę pomożemy Ci doprecyzować.

faqs:
  tagline: FAQ
  title: 'Rozpoczynanie projektu SUP — najczęściej zadawane pytania'
  items:
    - q: 'Jaka jest minimalna ilość zamówienia (MOQ), żeby zacząć?'
      a: 'Próg wejścia jest stopniowany: najpierw 1–2 próbki (7–12 dni), potem zamówienie próbne 20–50 desek (25–35 dni), a następnie standardowe partie 90–100+ desek w zwalidowanej konfiguracji. Współmarkowanie private label startuje od 5–10 sztuk, bez etapu rozwojowego.'
    - q: 'Ile trwa wykonanie próbek?'
      a: 'Fizyczne próbki powstają w 7–12 dni od potwierdzenia specyfikacji i wpłaty zaliczki. Korzystając z istniejących platform kadłuba, pełny cykl od briefu do dostarczonego zamówienia próbnego trwa zwykle 8–12 tygodni. Indywidualny kadłub dodaje 15–20 dni na opracowanie formy.'
    - q: 'Czy mój projekt jest chroniony?'
      a: 'Tak. NDA jest dostępne natychmiast — zanim udostępnisz jakiekolwiek informacje zastrzeżone. Produkujemy wyłącznie pod markami naszych klientów i nigdy z nimi nie konkurujemy. Wszystkie pliki techniczne przechowujemy w systemach z kontrolą dostępu i śladami audytowymi.'
    - q: 'Czego wymaga formularz briefu projektu?'
      a: 'Brief prosi o typ Twojej działalności, nazwę firmy, docelową specyfikację deski, zakres ilościowy zamówienia, termin oraz ewentualne wymagania zgodności. Wypełnienie zajmuje około 5–10 minut. Możesz dołączyć pliki projektowe (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) do 10 MB. Jeśli nie jesteś pewien danego pola, pomiń je — odezwiemy się.'
    - q: 'Co się stanie po wysłaniu briefu?'
      a: 'Otrzymujesz odpowiedź w ciągu jednego dnia roboczego. Dział inżynierii analizuje Twój brief i przekazuje wycenę pozycjoną z MOQ, opłatami za próbki i harmonogramem bramka po bramce. Nie zobowiązujesz się do niczego, dopóki nie przejrzysz i nie podpiszesz umowy. Opłaty za próbki zaliczasz na poczet zamówienia produkcyjnego.'

