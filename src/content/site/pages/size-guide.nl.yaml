how_to_choose:
  title: Zo vind je de juiste maat
  cards:
    - title: SUP-planken
      description: Kies de lengte op basis van jouw gewicht en het beoogde gebruik. De bredere planken (32"+ – 81 cm+) bieden meer stabiliteit. De langere planken (11-12 ft) houden beter koers tijdens tours. Zwaardere peddelaars hebben planken met meer volume nodig.
    - title: Touring-SUP
      description: De langere planken (11–12 ft) zijn het meest geschikt voor afstandspaddelen en tours. De bredere planken (32"+ – 81 cm+) bieden meer stabiliteit. Controleer de draagkracht voor het totale gewicht inclusief uitrusting.
    - title: Allround-SUP
      description: Kies de lengte op basis van het gewicht van de gebruiker en het beoogde gebruik. Allround-planken zijn geschikt voor vrije tijd, fitness en yoga. Kleinere planken zijn wendbaarder.

