faqs:
  tagline: FAQ
  title: Perguntas frequentes sobre o controlo de qualidade SUP
  items:
    - q: 'Como controla a QINGDAO VATRAD GROUP.,LTD. a qualidade dos SUP insufláveis?'
      a: 'A qualidade é controlada através de inspeção de entrada de mercadorias, pontos de controlo do processo de produção, verificação final do produto, inspeção da embalagem e rastreabilidade da produção — cada uma executada contra amostras, especificações e critérios de inspeção libertados para o projeto.'
    - q: 'Que controlos de qualidade são executados durante a produção SUP?'
      a: 'As inspeções incluem verificação dos materiais, controlos de corte e impressão, inspeção da construção das pranchas, verificação da instalação das válvulas, inspeção dos acessórios, teste de estanquidade ao ar, inspeção do aspeto e verificação da embalagem.'
    - q: 'Os clientes OEM podem pedir os registos de inspeção SUP?'
      a: 'Sim. Registos de inspeção e documentação de qualidade podem ser fornecidos com base nos requisitos do projeto e nos acordos de qualidade com o cliente, incluindo os relatórios das inspeções pré-embarque por amostragem.'
    - q: 'Como garante a fábrica uma qualidade de produção OEM consistente?'
      a: 'A consistência da produção é mantida através de amostras libertadas, especificações técnicas, pontos de controlo de fabrico, procedimentos de inspeção e processos de controlo de qualidade documentados, ligados a cada encomenda.'
    - q: 'Posso organizar uma inspeção de terceiros com SGS, BV, Intertek ou QIMA?'
      a: 'Sim. Acolhemos os inspetores de terceiros com uma área de inspeção dedicada, instrumentos de medição de pressão calibrados, briefs de inspeção pré-preenchidos e registos acessíveis. Partilhem a vossa especificação, a amostra libertada, a arte, os requisitos de embalagem e os critérios de defeito — ou usem o nosso template de brief de inspeção de terceiros.'
    - q: 'Como são geridas as alterações de arte, BOM ou embalagem durante a produção?'
      a: 'As alterações são registadas no nosso protocolo de controlo de alterações, incluindo a revisão documental afetada, a vista geral da alteração, o motivo, a avaliação do impacto, o estado da libertação do cliente e o lote eficaz. As versões obsoletas são retiradas, para que a produção e a inspeção usem sempre os documentos libertados correntes.'
    - q: 'A fábrica apoia projetos de SUP insufláveis personalizados?'
      a: 'Sim. Os projetos OEM/ODM personalizados de SUP insufláveis são apoiados com base nas especificações do cliente, nos requisitos de arte, nas configurações de acessórios e nas necessidades de embalagem, com critérios de inspeção específicos por projeto acordados antes da produção.'
    - q: 'Um SUP com fugas pode ser reprocessado em fábrica?'
      a: 'Sim — em condições controladas. A prancha é colocada em HOLD e ligada a uma NCR, a fuga é localizada com um método de diagnóstico libertado e o reprocessamento acontece apenas após autorização de QC/Engenharia e exclusivamente dentro das classes de defeito libertadas para reprocessamento. A prancha é depois novamente verificada contra os mesmos critérios de aceitação de uma prancha conforme antes da libertação.'
    - q: 'Quantas vezes pode a fábrica reprocessar uma prancha?'
      a: 'Um único ponto pode ser reprocessado uma vez sob uma instrução autorizada. Se a verificação repetida continuar a falhar, a prancha é escalada para substituição, rejeição, sucatamento ou concessão ao cliente — o reprocessamento repetido sem libertação documentada não é permitido.'

