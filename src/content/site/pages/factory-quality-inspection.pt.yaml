answer:
  label: 'Resposta clara'
  text: 'QINGDAO VATRAD GROUP.,LTD. controla a qualidade dos SUP insufláveis através de um sistema de verificação em 4 fases: controlo de entrada de mercadorias (IQC), controlo de qualidade de processo (IPQC), verificação final da prancha e de insuflagem (FQC) e pré-liberação de embalagem e expedição (OQC). Cada encomenda é verificada contra a amostra libertada, a especificação técnica, a prova de arte, a BOM e os padrões de embalagem — incluindo a verificação de estanquidade ao ar, os controlos visuais e dimensionais, a confirmação dos acessórios e a rastreabilidade dos lotes. As unidades que não cumprem os critérios de aceitação são bloqueadas ou colocadas em quarentena de forma controlada, reprocessadas exclusivamente segundo instruções libertadas e novamente verificadas antes da libertação autorizada.'
  verified: 'September 2026'

intro: 'O nosso sistema de qualidade é construído para projetos OEM/ODM: os critérios de inspeção são definidos, documentados e seguidos por encomenda pela equipa de produção e qualidade, desde a entrada de mercadorias até à embalagem. Assim, a expectativa de qualidade mantém-se alinhada entre a fábrica e a vossa marca, desde a primeira amostra até às entregas completas em contentor.'

scope_note:
  tagline: Âmbito
  title: Critérios de inspeção específicos por projeto
  body: |
    As especificações de qualidade podem variar consoante a construção da prancha (ex. de uma/duas camadas, drop-stitch em tecido, rail colado), o uso previsto, as normas do mercado de destino e os parâmetros aprovados pelo cliente. A libertação final baseia-se rigorosamente nos critérios de inspeção documentados acordados para a encomenda.

stages:
  tagline: Quadro de qualidade
  title: O nosso sistema de verificação de qualidade em 4 fases
  subtitle: Um ciclo QC completo desde a entrada das matérias-primas até à libertação para expedição.
  steps:
    - title: '1. Controlo de entrada de mercadorias (IQC)'
      desc: 'Os materiais principais e os componentes comprados são verificados contra as especificações libertadas e as amostras de referência antes de entrarem na linha de produção. O material drop-stitch e o PVC são verificados quanto à identificação do material, lote do fornecedor, peso/densidade, espessura, correspondência de cor contra as amostras libertadas e defeitos de superfície. Os pads de tração de EVA são controlados quanto ao motivo, cor, espessura, precisão de corte e compatibilidade do adesivo. Válvulas e acessórios passam em testes funcionais, de rosca, de integridade do vedante e de encaixe. Acessórios e embalagem (bombas, pás, aletas, leashes, bolsas, cartões) são comparados quanto a quantidade, cor, marca, precisão do código de barras e versão da arte contra a BOM libertada.'
    - title: '2. Controlo de qualidade de processo (IPQC)'
      desc: 'As fases críticas de produção são inspecionadas para identificar não conformidades antes de as pranchas chegarem às estações a jusante. O corte e a impressão são verificados quanto às dimensões dos painéis, layout da arte, orientação em espelho e limpeza das bordas contra os desenhos técnicos libertados. A montagem da prancha e a colagem do rail são controladas quanto à simetria do casco, continuidade da sobreposição das costuras e ausência de vazios ou bolhas de ar nas áreas altamente solicitadas. A fixação de válvulas e acessórios, as gráficas e a marca são verificadas quanto a posição, orientação, cobertura do adesivo, grafismo do logótipo e versão da arte.'
    - title: '3. Verificação final da prancha & de insuflagem (FQC)'
      desc: 'As pranchas concluídas passam por testes físicos e estruturais vinculativos antes da libertação para embalagem. As pranchas são insufladas e mantidas à pressão de prova libertada para o projeto a fim de verificar a rigidez estrutural e a estabilidade da pressão. As verificações de estanquidade ao ar cobrem o alojamento da válvula, as costuras dos rails, os cones de proa/popa e as juntas de tensão através de métodos calibrados de deteção de fugas (monitorização da queda de pressão ou teste de bolhas). A inspeção estética e dimensional verifica as dimensões, o perfil rocker e o alinhamento do pad de EVA (tolerância ±2 mm) em condições de luz diurna padrão.'
    - title: '4. Embalagem & pré-liberação de expedição (OQC)'
      desc: 'A pré-verificação de expedição completa garante uma correspondência de configuração SKU e marcações de expedição com zero desvios. O controlo de completude do kit compara prancha, aleta, leash, pá, bomba, bolsa, kit de reparação e manual de instruções contra a BOM da encomenda. Os controlos de embalagem e código de barras verificam as marcações do cartão, as etiquetas SKU, a legibilidade do código de barras, o idioma do manual e a integridade estrutural do cartão. As encomendas só são libertadas após o controlo de embalagem final assinado pelo pessoal de qualidade autorizado.'

inspection_points:
  tagline: Cobertura da inspeção
  title: Pontos de controlo de inspeção principais
  subtitle: Cada ponto de controlo é executado contra critérios de aceitação documentados e acordados por encomenda.
  features:
    - icon: A
      icon_bg: blue
      title: Verificação de estanquidade ao ar
      desc: 'As pranchas concluídas são insufladas à pressão de prova libertada e controladas quanto à manutenção da pressão, estado da base da válvula, costuras dos rails, zonas de proa e popa e pontos altamente solicitados. Onde a procedimento de inspeção o previr, as áreas de suspeita de fuga são examinadas com os métodos de deteção libertados.'
    - icon: B
      icon_bg: green
      title: Controlo visual & dimensional
      desc: 'As pranchas são controladas com iluminação adequada quanto ao estado da superfície do material, erros de impressão, diferenças cromáticas, alinhamento do EVA, dobras, riscos, impurezas e aspeto da colagem. As dimensões-chave e as posições dos acessórios são verificadas contra os desenhos ou as especificações libertadas.'
    - icon: C
      icon_bg: purple
      title: Verificação de acessórios & embalagem
      desc: 'Antes da expedição é verificada a configuração completa do produto: modelo de prancha, sistema de aletas, pá, bomba, leash, bolsa de transporte, kit de reparação, manual de instruções e acessórios personalizados — cada um comparado contra a amostra libertada, os desenhos e a BOM.'
    - icon: D
      icon_bg: orange
      title: Embalagem & libertação para expedição
      desc: 'As unidades embaladas são controladas quanto à configuração SKU, completude dos acessórios, etiquetas de produto, informações do código de barras, versão do manual de instruções, marcação do cartão, quantidade de embalagem e estado do cartão. A libertação para expedição é autorizada apenas após o cumprimento de todos os requisitos de inspeção e embalagem.'

traceability_intro:
  tagline: Rastreabilidade de lotes
  title: Sistema de rastreabilidade de projeto & lotes
  body: |
    Cada encomenda de SUP personalizado é gerida sob um código de projeto unificado que liga especificações técnicas, BOM libertada, revisões de arte, números de lote de material, referências de embalagem e registos de inspeção. Os registos de produção e inspeção são mantidos por projeto e lote de produção aplicáveis, e cada lote pode ser reconduzido à especificação de produto libertada, BOM, arte e referências de embalagem.

    Isto apoia a verificação eficiente da configuração do produto, do estado de inspeção e do âmbito afetado caso seja levantada uma preocupação de qualidade — do produto acabado aos registos de origem através da identificação da prancha ou do cartão.

traceability_chain:
  tagline: Cadeia de rastreabilidade
  title: Do código de projeto à libertação para expedição
  subtitle: Uma cadeia de referências controladas desde a confirmação da encomenda até à expedição autorizada.
  steps:
    - step: '01'
      title: Código de projeto
      desc: Referência de projeto unificada que liga cada documento controlado à encomenda.
    - step: '02'
      title: Revisões documentais
      desc: Níveis de revisão correntes da especificação, BOM, arte e embalagem — apenas as versões libertadas são válidas para a produção.
    - step: '03'
      title: Lote & materiais
      desc: Os lotes de material e componentes são registados contra o lote de produção.
    - step: '04'
      title: Registos de inspeção
      desc: Resultados de inspeção IQC, de processo, de estanquidade ao ar, finais e de embalagem por lote.
    - step: '05'
      title: Embalagem & libertação
      desc: Lote de embalagem, estado de fecho da NCR e vista geral da libertação para expedição autorizada.

traceability_sample:
  tagline: Exemplo anonimizado
  title: Registo de controlo da rastreabilidade (Demo)
  body: |
    Os valores demonstrativos servem apenas para ilustração — o nome do cliente, os números de encomenda, a arte personalizada, os dados do fornecedor e as informações comerciais foram removidos para salvaguarda da confidencialidade.

    - **Fabricante:** QINGDAO VATRAD GROUP, LTD.
    - **Código de projeto:** DEMO-SUP-2026-01
    - **Referência SKU:** DEMO-TR-126
    - **Lote de produção:** BATCH-AUG-01
    - **Especificação / BOM / Revisão de arte:** Rev B / Rev C / Rev B
    - **Registo de estanquidade ao ar:** PASS —conservado por lote
    - **Estado de inspeção:** PASS
    - **Estado de expedição:** LIBERTADO

quarantine_intro:
  tagline: Controlo de não conformidade
  title: Controlo de produtos não conformes & quarentena
  body: |
    Os produtos ou componentes que não cumprem os critérios de aceitação definidos são claramente marcados e bloqueados ou colocados em quarentena de forma controlada. Podem avançar para a fase de produção seguinte, para a embalagem ou para a expedição apenas após a conclusão de uma disposição autorizada. O reprocessamento ocorre segundo instruções libertadas e está ligado ao respetivo relatório de não conformidade; as unidades reprocessadas são novamente verificadas contra os requisitos de projeto aplicáveis antes da libertação de qualidade.

quarantine_flow:
  tagline: Fluxo de controlo em 7 fases
  title: O que acontece quando é encontrada uma não conformidade
  subtitle: Identificar, bloquear, corrigir, verificar — depois libertar ou rejeitar. Os produtos não conformes nunca voltam à produção ou à embalagem sem verificação.
  steps:
    - step: '01'
      title: Identificar
      desc: A não conformidade é registada contra o produto, a SKU, o lote ou a fase de processo afetados.
    - step: '02'
      title: Marcar
      desc: As unidades afetadas são claramente marcadas com etiquetas de estado controlado —HOLD, em quarentena ou rejeitadas.
    - step: '03'
      title: Quarentena
      desc: As unidades são separadas numa área de quarentena fisicamente controlada ou gerida pelo sistema, para prevenir uso ou expedição involuntários.
    - step: '04'
      title: Avaliar o âmbito
      desc: O âmbito afetado é examinado por lote, fase de processo, lote de material e revisão documental.
    - step: '05'
      title: Reprocessar / Substituir
      desc: Uma correção é permitida apenas através de disposição libertada e instrução de trabalho controlada.
    - step: '06'
      title: Verificar novamente
      desc: As unidades corrigidas são novamente verificadas contra os critérios de aceitação aplicáveis antes da libertação.
    - step: '07'
      title: Libertar ou rejeitar
      desc: Apenas o produto autorizado e conforme chega à embalagem ou à libertação para expedição.

quarantine_evidence:
  tagline: Na área produtiva
  title: Controlo & quarentena na prática
  subtitle: As fotos da nossa oficina de Qingdao mostram como o controlo de estado e os registos de inspeção são aplicados no local.
  features:
    - image: https://assets.supsfactory.com/site/quality/qc-air-tightness-test-area.avif
      alt: SUP insufláveis insuflados na área de teste de estanquidade ao ar da fábrica, monitorizados por um instrumento digital de medição de pressão
      title: Área de teste de estanquidade ao ar
      desc: 'As pranchas insufladas são mantidas na área de teste QC sob iluminação industrial; os instrumentos digitais de medição de pressão monitorizam o teste de manutenção de pressão libertado na base da válvula, nas costuras dos rails, na proa e popa e nos pontos altamente solicitados. Os registos são mantidos por lote e ligados ao controlo final.'
    - image: https://assets.supsfactory.com/site/quality/qc-hold-quarantine-station.avif
      alt: Folhas de controlo de qualidade e etiquetas de estado HOLD controladas na estação de inspeção da fábrica
