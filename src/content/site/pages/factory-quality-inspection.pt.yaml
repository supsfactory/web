rework_intro:
  tagline: Governação do reprocessamento
  title: Não conformidade de estanquidade ao ar controlada & governação do reprocessamento
  body: |
    Na QINGDAO VATRAD GROUP.,LTD. o reprocessamento é estritamente definido como o restabelecimento de uma unidade não conforme para a plena conformidade com a sua especificação técnica original — não como um remendo rápido. Cada prancha com uma não conformidade de estanquidade ao ar é bloqueada de forma controlada e ligada a um relatório de não conformidade (NCR) antes de qualquer processamento adicional; a fonte da fuga é localizada e registada com o método de diagnóstico libertado.

    O reprocessamento só pode avançar se o defeito estiver dentro do âmbito de reprocessamento libertado e se estiver disponível um método autorizado. A instrução de reprocessamento identifica produto, lote, posição do defeito, material libertado, método, condições exigidas e âmbito da verificação repetida. Após a fase de polimerização ou estabilização exigida, a prancha é novamente verificada contra os mesmos critérios de aceitação aplicáveis de uma prancha conforme — o reprocessamento nunca baixa o padrão de aceitação. Se a verificação repetida falhar, é exigida uma nova disposição de engenharia e qualidade; o reprocessamento repetido não é permitido sem libertação documentada.

rework_decision:
  tagline: Fluxo interativo
  title: Fluxo de decisão do reprocessamento — clica em cada nó
  subtitle: Segue como uma não conformidade de estanquidade ao ar é gerida da deteção à libertação ou ao sucatamento. Clica num nó para expandir os requisitos de controlo nesse passo.
  nodes:
    - id: detect
      type: start
      label: Fuga detetada
      detail: 'Durante a inspeção é encontrada uma não conformidade de estanquidade ao ar — erro de manutenção de pressão, fuga visível ou um erro relacionado do sistema de ar.'
    - id: hold
      type: step
      label: Parar a linha · etiqueta HOLD · NCR
      detail: 'O processamento é parado. ID da prancha, código do produto, lote, estação de trabalho, data e inspetor são registados; é aplicada uma etiqueta HOLD / quarentena e é aberta uma NCR contra a revisão de especificação aplicável.'
    - id: locate
      type: step
      label: Localizar a fonte da fuga
      detail: 'A prancha é insuflada à pressão de diagnóstico libertada para o projeto e a fonte é localizada com um método libertado — manutenção de pressão, teste de bolhas calibrado, dispositivo acústico ou de deteção de fugas.'
    - id: classify
      type: step
      label: Classificar o defeito (A–G)
      detail: 'O defeito é classificado contra a matriz de libertação: A interface da válvula, B costura da base da válvula, C furo de agulha superficial, D costura local do rail, E dano extenso no rail, F fuga recorrente, G dano estrutural.'
    - id: authorize
      type: decision
      label: Reprocessamento autorizado?
      yes: rework
      no: escalate
      detail: 'O QC confirma a categoria do defeito e a engenharia verifica se a prancha pode ser devolvida à sua especificação original. A autorização documenta ficha de método, materiais, condições e âmbito da verificação repetida — ou leva a substituição, rejeição, sucatamento ou concessão ao cliente.'
    - id: rework
      type: step
      label: Reprocessamento controlado
      detail: 'Executado exclusivamente dentro do limite de defeito libertado usando a ficha de método, o lote de material e as ferramentas libertadas — sem nunca alterar dimensões, construção, gráficas, acessórios ou requisitos de embalagem.'
    - id: cure
      type: step
      label: Polimerização & estabilização
      detail: 'A prancha permanece em HOLD durante a fase de polimerização e estabilização definida pela instrução de material e processo libertada e, em seguida, recebe uma pré-verificação visual e de acabamento.'
    - id: reinspect
      type: decision
      label: Verificação repetida superada?
      yes: release
      no: escalate
      detail: 'A prancha é insuflada à pressão de verificação repetida libertada para o projeto e o defeito original juntamente com todas as características potencialmente afetadas são novamente verificados — ponto de fuga, válvula, rail, costuras, áreas altamente solicitadas, acessórios e aspeto. O reprocessamento nunca baixa o padrão de aceitação.'
    - id: release
      type: release
      label: Libertação de qualidade
      detail: 'A Qualidade verifica a NCR fechada, o registo de reprocessamento e o resultado da verificação repetida e autoriza a libertação. Nenhuma prancha reprocessada é embalada ou expedida sem libertação de qualidade autorizada.'
    - id: escalate
      type: escalate
      label: Escalada — substituir / sucatar / concessão
      detail: 'Sem reprocessamento repetido sem libertação documentada. A prancha é substituída, rejeitada, sucatada ou é oferecida ao cliente uma concessão escrita se a especificação original não puder ser restabelecida.'

defect_matrix:
  tagline: Classificação de defeitos
  title: Classificação de defeitos de estanquidade ao ar & matriz de libertação
  subtitle: Nem toda a fuga é reprocessada — cada defeito é classificado e a sua disposição é libertada ao nível certo, do inspetor QC ao diretor da fábrica.
  headers:
    category: Categoria de defeito
    area: Área típica
    eligibility: Idoneidade para reprocessamento
    approval: Libertação exigida
  rows:
    - category: 'Classe A — Interface da válvula'
      area: 'Núcleo da válvula, vedante da tampa, estanquidade, interface da bomba'
      eligibility: 'Reprocessamento padrão autorizado'
      approval: 'Inspetor QC'
    - category: 'Classe B — Costura da base da válvula'
      area: 'Micro-fuga ao longo da borda da válvula'
      eligibility: 'Reprocessamento avaliado segundo a ficha de método libertada'
      approval: 'QC + Engenharia'
    - category: 'Classe C — Furo de agulha superficial'
      area: 'Micro furo de agulha local numa superfície não solicitada'
      eligibility: 'Autorizado apenas se conforme as especificações do cliente'
      approval: 'QC + Engenharia'
    - category: 'Classe D — Costura local do rail'
      area: 'Fuga local de sobreposição na banda do rail'
      eligibility: 'Risco elevado; disposição de engenharia rigorosa exigida'
      approval: 'Engenharia + Chefe de QA'
    - category: 'Classe E — Dano extenso no rail'
      area: 'Falha contínua da costura em zonas altamente solicitadas'
      eligibility: 'Reprocessamento padrão não autorizado — substituição ou verificação da causa raiz'
      approval: 'Chefe de QA + concessão do cliente'
    - category: 'Classe F — Fuga recorrente'
      area: 'Fuga não localizável ou erro no novo teste'
      eligibility: 'Sem reprocessamento repetido; substituição, sucatamento ou análise de engenharia da causa raiz'
      approval: 'QA / Engenharia sénior'
    - category: 'Classe G — Dano estrutural'
      area: 'Dano no material, deslaminação, deformação da prancha'
      eligibility: 'Libertação de reprocessamento não autorizada — substituição, sucatamento ou concessão escrita do cliente'
      approval: 'Quality Manager + libertação do cliente'

rework_flow:
  tagline: Ciclo fechado em 7 fases
  title: Workflow de reprocessamento controlado — da deteção à libertação ou ao sucatamento
  subtitle: 'Cada reprocessamento de estanquidade ao ar segue o mesmo ciclo controlado: detetar, colocar em quarentena, diagnosticar, autorizar, reprocessar, verificar novamente, libertar.'
  steps:
    - step: '01'
      title: Deteção, paragem de linha & quarentena
      desc: 'O processamento da prancha afetada para imediatamente. ID da prancha, código do produto, lote, estação de trabalho, data e inspetor são registados, é aplicada uma etiqueta HOLD / quarentena e é aberta uma NCR contra a revisão de especificação aplicável.'
    - step: '02'
      title: Diagnóstico sistemático da fuga
      desc: 'A prancha é insuflada à pressão de diagnóstico libertada para o projeto e a fonte da fuga é localizada com um método libertado — manutenção de pressão, teste de bolhas calibrado, dispositivo acústico ou de deteção de fugas. O ponto suspeito é marcado sem danificar a prancha.'
    - step: '03'
      title: Disposição de engenharia & autorização
      desc: 'O QC confirma a categoria do defeito e a engenharia verifica se a prancha pode ser devolvida à sua especificação original. Uma autorização de reprocessamento que referencia a NCR documenta método libertado, materiais, condições e âmbito da verificação repetida — ou atribui substituição, rejeição, sucatamento ou concessão ao cliente.'
    - step: '04'
      title: Execução controlada do reprocessamento
      desc: 'O reprocessamento é executado exclusivamente dentro do limite de defeito libertado com a ficha de método, o lote de material e as ferramentas libertadas. Dimensões da prancha, construção, gráficas, configuração de acessórios e requisitos de embalagem nunca são alterados.'
    - step: '05'
      title: Polimerização, estabilização & pré-verificação
      desc: 'A prancha reprocessada permanece em estado HOLD durante a fase de polimerização e estabilização definida pela instrução de material e processo libertada e recebe uma pré-verificação visual e de acabamento antes da verificação repetida.'
    - step: '06'
      title: Verificação repetida & teste de prova
      desc: 'A prancha é insuflada à pressão de verificação repetida libertada para o projeto e o defeito original juntamente com todas as características potencialmente afetadas são novamente verificados: ponto de fuga e zona circundante, válvula, rail, costuras, áreas altamente solicitadas, acessórios e aspeto. O reprocessamento nunca baixa o padrão de aceitação.'
    - step: '07'
      title: Libertação de QA ou disposição final
      desc: 'A Qualidade verifica a NCR fechada, o registo de reprocessamento e o resultado da verificação repetida e, em seguida, autoriza a libertação — ou escala para substituição, rejeição, sucatamento ou concessão ao cliente. Nenhuma prancha reprocessada é embalada ou expedida sem libertação de qualidade autorizada.'

quality_safeguards:
  tagline: Garantias de qualidade
  title: Regras anti-erro que protegem a vossa marca
  subtitle: Controlos rígidos que previnem ciclos de reparação não controlados — um reprocessamento documentado por defeito, limiares de alarme nos lotes, instrumentos de medição calibrados e condições de teste controladas.
  features:
    - icon: 1
      icon_bg: blue
      title: Um reprocessamento por defeito
      desc: 'Um único ponto pode ser reprocessado uma vez sob uma instrução autorizada. Se a verificação repetida continuar a falhar, a prancha é escalada para substituição, rejeição, sucatamento ou concessão ao cliente — o reprocessamento repetido sem libertação documentada não é permitido.'
    - icon: 2
      icon_bg: green
      title: Alarme de lote & paragem de linha
      desc: 'Se a não conformidade de um lote de produção exceder o limiar fixado pela engenharia, a linha é parada e a engenharia investiga a causa — lote de material, condições de processo e registos — antes de retomar a produção.'
    - icon: 3
      icon_bg: purple
      title: Instrumentos de medição calibrados
      desc: 'Os instrumentos de medição de pressão, os manómetros digitais e os cronómetros para as provas de estanquidade ao ar são verificados e calibrados por laboratórios terceiros dentro do seu período de validade; o estado de calibração é visível na área de inspeção.'
    - icon: 4
      icon_bg: orange
      title: Condições de teste controladas
      desc: 'As áreas de teste de estanquidade ao ar e de polimerização são mantidas num ambiente controlado, para que os resultados não sejam influenciados pelas flutuações de temperatura entre o dia e a noite.'

rework_boundaries:
  tagline: Âmbito & limites
  title: O que este sistema não cobre
  body: |
    O sistema de controlo do reprocessamento aplica-se aos SUP insufláveis acabados ou em produção em que sejam detetadas fugas de ar, erros de manutenção de pressão ou erros relacionados do sistema de ar antes da libertação para expedição. Não autoriza alterações à construção libertada, materiais, gráficas, configuração de produto ou requisitos do cliente e não cobre:

    - Produtos já expedidos ou presentes nos sistemas dos clientes.
    - Danos estruturais ou deformações da prancha não avaliados pela engenharia.
    - Defeitos extensos de rail ou costuras, danos no material do núcleo ou defeitos que possam comprometer a segurança.
    - Projetos em que o reprocessamento não é permitido: amostras aprovadas pelo cliente, unidades de certificação ou teste.
    - Projetos com processos proprietários do cliente, materiais especiais ou requisitos de reparação particulares.
    - Fugas recorrentes que não podem ser localizadas, ou pranchas que falham novamente após o reprocessamento.

    Cada desvio das especificações do cliente exige uma verificação de engenharia documentada e, quando aplicável, a libertação escrita do cliente. As pranchas que não podem ser devolvidas à sua especificação original são libertadas apenas sob uma concessão expressa do cliente — nunca apenas pela produção.

method_cards:
  tagline: Sistema de fichas de método
  title: Índice das fichas de método de reprocessamento controladas
  subtitle: 'A instrução geral controla o processo; as fichas de método controlam a execução. A instrução de reprocessamento (WI-QC-AT-001) referencia as fichas de método MC-RW-01 a MC-RW-06, além de MC-RW-00 para o sucatamento e a rejeição vinculativos.'
  headers:
    code: Ficha de método
    defect: Classe de defeito
    scope: Âmbito de aplicação
    controls: Controlos de engenharia principais
    approval: Autoridade de assinatura
  rows:
    - code: MC-RW-01
      defect: Classe A (interface da válvula)
      scope: 'Manutenção do núcleo da válvula, limpeza do vedante e remontagem'
      controls: 'Chave dinamométrica calibrada, sede do vedante limpa, sem danos na rosca da válvula'
      approval: 'Inspetor QC'
    - code: MC-RW-02
      defect: Classe B (circunferência da válvula)
      scope: 'Selagem da flange da base da válvula e aperto controlado'
      controls: 'Preparação superficial controlada, material adesivo libertado, dispositivo de pressão circular'
      approval: 'QC + Engenharia'
    - code: MC-RW-03
      defect: Classe C (micro-fuga superficial)
      scope: 'Selagem de furos de agulha não estruturais'
      controls: 'Adesivo bicomponente libertado, sem transbordo sobre gráficas ou EVA'
      approval: 'QC + Engenharia'
    - code: MC-RW-04
      defect: Classe D (costura local do rail)
      scope: 'Recolagem de costuras locais de sobreposição do rail'
      controls: 'Ativação a quente a temperatura controlada, rolo de pressão, dispositivo anti-encrespamento'
      approval: 'Engenharia + Chefe de QA'
    - code: MC-RW-05
      defect: Classe B/C (borda de acessórios)
      scope: 'Reparação da fin box e selagem da base de montagem de acessórios'
      controls: 'Primer de adesão superficial, bloco de aperto moldado, tempo de manutenção definido'
      approval: 'QC + Engenharia'
    - code: MC-RW-06
      defect: Classe D (costura de proa/popa)
      scope: 'Intervenção nas costuras curvas altamente solicitadas'
      controls: 'Material adesivo de alta resistência ao corte libertado, tempo de polimerização prolongado antes do novo teste'
      approval: 'Engenheiro-chefe'
    - code: MC-RW-00
      defect: Classe E/F/G (crítico / rutura)
      scope: 'Sucatamento e destruição física vinculativos'
      controls: 'Corte físico para prevenir a mistura, protocolo de sucatamento, verificação interfuncional da causa raiz'
      approval: 'Diretor da fábrica'

inspector_friendly:
  tagline: Inspeção de terceiros
  title: Protocolo à medida do inspetor
  body: |
    Fornecemos uma área de inspeção dedicada com instrumentos de medição de pressão calibrados, mesas de luz padronizadas para a verificação de costuras e gráficas e briefs de inspeção pré-preenchidos, para que as organizações terceiras (SGS, BV, Intertek, QIMA) possam executar a sua inspeção pré-embarque de forma eficiente — isto poupa-vos overhead de inspeção.

    Cada brief resume as revisões documentais aplicáveis, a referência da amostra libertada, os controlos de relevância crítica para a qualidade, o nível de amostragem acordado, os testes funcionais e os requisitos de embalagem e código de barras para a PO. Quantidades especificadas, qualidade, embalagem e aspetos de segurança fundamentais são verificados contra as referências de projeto libertadas — sem procuras desesperadas de documentos no local.

