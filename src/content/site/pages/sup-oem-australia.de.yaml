why_australia:
  tagline: 'Warum Käufer in Australien'
  title: 'Für den australischen Markt gebaut'
  subtitle: 'Für australische Marken zählt der Kalender: Bestellen Sie in der ersten Jahreshälfte, damit die Container vor dem Sommer eintreffen.'
  items:
    - title: 'Saisonorientierte Planung'
      description: 'Der australische Sommer dauert von Dezember bis Februar. Produktion von 25–35 Tagen plus 4–6 Wochen Fracht bedeutet: Eine Bestellung in Q1–Q2 bringt die Ware vor der Hochsaison in Ihre Regale.'
    - title: 'DDP für planbare Landed-Kosten'
      description: 'DDP umfasst Zollabfertigung, Abgaben, Steuern und Lieferung zu Ihrem Lager — ein Gesamtpreis, Tür zu Tür.'
    - title: 'FOB Qingdao mit eigenem Spediteur'
      description: 'Regelmäßiger Importeur? Nehmen Sie FOB Qingdao und nutzen Sie Ihren eigenen Logistikpartner — wir verladen und dokumentieren den Container, Sie kontrollieren den Rest.'
    - title: 'Eine Fabrik, ein Qualitätssystem'
      description: 'Entwicklung, Muster, Produktion und QC finden alle im 12,500-m²-Werk statt — das freigegebene Muster ist das Produkt, das Sie erhalten.'

process_notes:
  tagline: 'So funktioniert es'
  title: 'Von der Spezifikation zum Container'
  subtitle: 'Dieselben sechs Stufen, ob Sie zwei Container pro Jahr oder zwanzig kaufen: Spezifikation, Engineering, Muster, Prüfung, Werkzeugbau, Produktion — dann FOB-, CIF- oder DDP-Lieferung.'
  items:
    - title: '1. Senden Sie Ihre Spezifikation'
      description: 'Ein Referenzboard, eine Skizze oder eine Konkurrenzspezifikation genügt. Engineering-Prüfung und Angebot kommen innerhalb eines Werktags.'
    - title: '2. Geben Sie das Muster frei'
      description: 'Ihr erstes physisches Muster versendet in 7–12 Tagen mit einem Freigabebogen zu Konstruktion, Druckfarben und Drucktestergebnissen.'
    - title: '3. Produktion & Export'
      description: 'Läufe werden in 25–35 Tagen mit QC-Checkpoints während der Produktion abgeschlossen. Packliste, Rechnung und Konnossement reisen dem Schiff voraus.'
    - title: '4. Lieferung zu Ihrem Lager'
      description: '4–6 Wochen Seefracht nach Sydney, Melbourne oder Brisbane — bei DDP übernehmen wir Abfertigung und Lieferung bis vor Ihre Tür.'

faq_section:
  tagline: FAQ
  title: 'Fragen zum Import nach Australien'
  questions:
    - q: Wie lange dauert die Seefracht nach Australien?
      a: 'Rechnen Sie 4–6 Wochen vom Hafen Qingdao nach Sydney, Melbourne oder Brisbane, je nach Abfahrtsplan. DDP-Projekte enthalten die vollständige Tür-zu-Tür-Zeitlinie.'
    - q: Wann sollte ich bestellen, um vor dem Sommer Bestand zu haben?
      a: 'Produktion dauert 25–35 Tage und Fracht 4–6 Wochen, also bestellen Sie etwa 3–4 Monate, bevor Sie die Ware benötigen. Für die Sommersaison Dezember–Februar legen Sie die PO in der ersten Jahreshälfte.'
    - q: Versenden Sie DDP nach Australien?
      a: 'Ja. DDP umfasst Seefracht, Zollabfertigung, Abgaben und Steuern sowie Lieferung zu Ihrem Lager — ein planbarer Gesamtpreis. FOB Qingdao und CIF sind ebenfalls verfügbar.'
    - q: Wie hoch ist die MOQ für einen Private-Label-SUP-Import?
      a: 'Die MOQ wird durch die Projektkonfiguration bestätigt: Musterentwicklung deckt 1–2 Stück ab, Pilotchargen laufen mit 20–50 Stück auf bestehenden Plattformen, und die Standard-Serienfertigung läuft mit 90–100+ Stück pro Design aus einer vollen 150-m-Drop-Stitch-Rolle.'
    - q: Welche Dokumentation stellen Sie für Importe bereit?
      a: 'Das freigegebene Muster versendet mit CE- und REACH-Dokumentation, die für Ihre Zielmärkte erstellt wurde, und jeder Container versendet mit Packliste, Rechnung und Konnossement.'
    - q: Wie starte ich ein Projekt aus Australien?
      a: 'Senden Sie ein Referenzboard, eine Skizze oder eine Spezifikation. Die Engineering-Prüfung und das Angebot kommen innerhalb eines Werktags, und vor jedem Dateiaustausch wird eine NDA unterzeichnet.'

