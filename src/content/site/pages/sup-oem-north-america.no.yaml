why_north_america:
  tagline: 'Hvorfor kjøpere i Nord-Amerika'
  title: 'Bygd for nordamerikansk import'
  subtitle: 'Fabrikken besvarer spørsmålene merker og forhandlere i USA og Canada stiller før sin første container.'
  items:
    - title: 'DDP for planleggbare destinasjonskostnader'
      description: 'DDP omfatter tollbehandling og levering til ditt lager — importtoll, avgifter og frakt i ett totalbeløp. Det mest populære valget for nye importører til USA og Canada.'
    - title: 'Nærhet til vest- og østkysten'
      description: 'Vi beregner sjøfrakt til havnene på vest- og østkysten, avhengig av hvilket som gir best balanse mellom transittid og destinasjonskostnad for logistikken din.'
    - title: 'Test- og tolldokumentasjon'
      description: 'CE-, REACH- og tolldokumentasjonen utarbeides for målmarkedene dine, slik at dokumentene fungerer i amerikanske og kanadiske importprosesser.'
    - title: 'Én fabrikk, ett kvalitetssystem'
      description: 'Utvikling, prøver, produksjon og QC skjer alle i fabrikken på 12 500 m² — ingen omveier via mellomledd, ingen prøve som produksjonen ikke kan gjenskape.'

process_notes:
  tagline: 'Slik fungerer det'
  title: 'Fra spesifikasjon til container'
  subtitle: 'De samme seks fasene, uansett om du kjøper to eller tjue containere per år: spesifikasjon, konstruksjon, prøve, verifisering, verktøybygging, produksjon — deretter levering FOB, CIF eller DDP.'
  items:
    - title: '1. Send spesifikasjonen din'
      description: 'Et referansebrett, en skisse eller en konkurrentens spesifikasjon er nok. Teknisk verifisering og tilbud følger innen én arbeidsdag.'
    - title: '2. Godkjenn prøven'
      description: 'Din første fysiske prøve sendes innen 7–12 dager med en godkjenningsblankett for konstruksjon, trykkfarger og resultatene av trykkprøvningen.'
    - title: '3. Produksjon & eksport'
      description: 'Syklusene fullføres på 25–35 dager med QC-kontrollpunkter under produksjonen. Pakkeliste, faktura og bill of lading går før skipet.'
    - title: '4. Levering til lageret ditt'
      description: '4–6 ukers sjøfrakt til USA og Canada — med DDP håndterer vi tollbehandlingen og leveransen til døren din.'

faq_section:
  tagline: Vanlige spørsmål
  title: 'Spørsmål om import til Nord-Amerika'
  questions:
    - q: Hvor lang tid tar sjøfrakten til USA og Canada?
      a: 'Regn med 4–6 uker fra Qinhaos havn til de viktigste containerhavnene på USAs vest- og østkyst og til de kanadiske havnene, avhengig av destinasjon og avgangsschedules. DDP-prosjekter omfatter hele tidslinjen dør til dør.'
    - q: Sender dere DDP til USA og Canada?
      a: 'Ja. DDP omfatter sjøfrakt, tollbehandling, importtoll og avgifter pluss levering til ditt lager — én planleggbar totalpris. Også FOB Qingdao og CIF er tilgjengelige.'
    - q: Hva er MOQ for en private label-SUP-import?
      a: 'MOQ bekreftes av prosjektkonfigurasjonen: prøveutviklingen omfatter 1–2 stk, små pilotserier går med 20–50 stk på eksisterende plattformer, og standardvolumserier går med 90–100+ stk per design fra en hel drop-stitch-rull på 150 m.'
    - q: Støtter dere tolldokumentasjon for USA og Canada?
      a: 'Ja. Dokumentasjonen utarbeides for målmarkedene dine — inkludert importdokumenter som er kompatible med amerikanske og kanadiske tollrutiner.'
    - q: Kan jeg besøke fabrikken før bestillingen?
      a: 'Ja. Fabrikken på 12 500 m² i Qingdao er åpen for kunder — virtuelle fabrikkvisninger kan bestilles online, og fysiske besøk ledes langs produksjonslinjene og QC-stasjonene.'
    - q: Hvordan starter jeg et prosjekt fra Nord-Amerika?
      a: 'Send et referansebrett, en skisse eller en spesifikasjon. Den tekniske verifiseringen og tilbudet kommer innen én arbeidsdag, og en NDA signeres før hver filutveksling.'

