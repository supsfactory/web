hero:
  tagline: Produktionskapacitet
  title: 'SUP-produktionskapacitet'
  subtitle: 'Varje process — skalpkonstruktion, bearbetning av drop-stitch-kärnan, högfrekvenssvetsning, tryckning, fästen, montering, testning och förpackning — sker internt i vår fabrik på 12 500 m² i Qingdao. Ett ansvarigt team leder ditt projekt från den första ritningen till den lastade containern.'

answer:
  label: 'Kort svar'
  text: 'SUP-produktionen sker helt internt i vår fabrik i Qingdao: skalpdesign och dimensionell konstruktion med CNC-noggrannhet på 0.1 mm; bearbetning av drop-stitch-material och högfrekvenssvetsning på 4 automatiserade linjer; grafisk tryckning; stansning av EVA-deckpads; interna fästen (+15–20 dagar för nya former); montering enligt en 100-punktslista samt 24-timmars tryck- och lufttätningstest vid 18.0 PSI med automatisk kassering vid sjunk över 0.50 PSI. Årskapaciteten är 120 000+ brädor (cirka 10 000/månad) i 4 specialverkstäder med 350+ medarbetare, levererade till över 50 länder under ert varumärke.'
  verified: 'September 2026'

