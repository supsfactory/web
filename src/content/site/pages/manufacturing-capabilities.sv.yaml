faq_section:
  tagline: FAQ
  title: Frågor om SUP-produktionskapaciteten
  questions:
    - q: Vilka produktionsprocesser sker internt?
      a: 'Alla kärnprocesser sker internt: skalpkonstruktion, bearbetning av drop-stitch-kärnan, högfrekvenssvetsning, tryckning, EVA-stansning, montering, testning och förpackning. Tillbehör och vissa råvaror kommer från certifierade leverantörer; den slutliga sammansättningen av kitet sker internt för fullständig spårbarhet.'
    - q: Vad är er produktionskapacitet?
      a: '120 000+ brädor per år (cirka 10 000/månad) på 4 automatiserade linjer och 4 specialverkstäder på 12 500 m² med över 350 medarbetare.'
    - q: Vilken minsta beställningsmängd gäller för dessa kapaciteter?
      a: 'Standardvolymen startar från 90–100+ enheter per godkänd konfiguration (en rulle drop-stitch-tyg på 150 m); pilotpartier startar från 20–50 enheter på befintliga plattformar; beställningar med enbart logotyp startar från 5–10 enheter.'
    - q: Vilka leveranstider ska vi räkna med?
      a: 'Prototyprover på 7–12 dagar; produktion 25–35 dagar efter bekräftad beställning och handpengar; fastställandet av anpassade former lägger till 15–20 dagar.'
    - q: Hur påverkar kapaciteterna kvaliteten?
      a: 'Varje process matar kvalitetssystemets 7 faser: 100-punkts montagelista, 18.0 PSI tryckhållning under 24 timmar med automatisk kassering över 0.50 PSI sjunk, stickprov enligt ISO 2859-1 Nivå II och ERP-partispårbarhet under 10 år.'

