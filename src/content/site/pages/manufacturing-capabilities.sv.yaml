  description: 'SUP-produktionskapacitet i Qingdao: egen skalpkonstruktion (0.1 mm), bearbetning av drop-stitch, högfrekvenssvetsning, tryckning, fästen, 100-punkts kvalitetskontroll och 120 000+ brädor per år.'
