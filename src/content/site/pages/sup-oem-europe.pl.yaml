answer:
  label: 'Krótka odpowiedź'
  text: 'Europejskie marki zamawiają nadmuchiwane SUP w iSupfactory na standardowych warunkach: MOQ potwierdzamy wg konfiguracji projektu: serie próbkowe 1–2 szt. weryfikują wykonanie, serie pilotażowe 20–50 szt. testują rynek na istniejących platformach, a standardowa produkcja seryjna to 90–100+ szt. na projekt z pełnej rolki drop-stitch 150 m. Pierwsza próbka wyrusza 7–12 dni po zatwierdzeniu specyfikacji, produkcja trwa 25–35 dni od potwierdzonego zamówienia i zaliczki, a żegluga morska dodaje 4–6 tygodni do Rotterdamu lub Hamburga. Dokumentację CE i REACH przygotowujemy równolegle do zatwierdzonej próbki, a DDP obejmuje odprawę celną i dostawę do Twojego magazynu.'
  verified: 'Wrzesień 2026'

