    - text: 'Se hele rammen for MOQ og leveringstid'
      href: /da/sup-oem-moq-lead-time

answer:
  label: 'Det korte svar'
  text: 'Ja — du kan starte et mærke af oppustelige SUP med en prøveordre med lav MOQ. Indgangspunktet er trinvis frem for alt-eller-ingenting: bestil først 1–2 prøvebrætter (klar på 7–12 dage) for at fastlægge skrog, grafik og emballage; læg derefter en prøveordre på 20–50 brætter (produktion på 25–35 dage) for at teste det reelle salg; og skaler til sidst op til standardserier på 90–100+ brætter pr. 150 m rulle drop-stitch-dug, når formatet er dokumenteret. Co-branding i små serier starter fra så få som 5–10 stk. for udlejningsvirksomheder, der vil have mærkede brætter uden udviklingstrin overhovedet. Din første container kommer først, når data siger, at den skal.'
  verified: 'September 2026'

trial_included:
  tagline: 'Hvad prøveordren dækker'
  title: 'Alt, en lancering har brug for, uden overhead'
  subtitle: 'En prøveordre er ikke en nedskaleret faktura — det er den samme fabrikproces, tilpasset et mærke under opstart. Her er, hvad ethvert prøveprogram indeholder.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Brætplatform & konstruktion'
      desc: 'Gennemprøvede touring- og allround-skr og med drop-stitch-konstruktion, fusioneret kantbånd i tre lag og stivhed ved 12–15 PSI — de samme platforme, vores volumenkunder bruger, i lagerstørrelser fra 10 ft til 11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Dit branding, anvendt for alvor'
      desc: 'Digital tryk eller silketryk på hele overfladen, EVA-gripflade med dit logo og sekundært branding på nese eller sidekanter. Co-branding i små serier bruger iSupfactory-branding i midtsektionen med dit logo på nese eller kanter.'
    - icon: P
      icon_bg: purple
      title: 'Emballagemuligheder, der kan skaleres'
      desc: 'Start med generiske kartoner og barcodeetiketter, og opgrader til fuldfarvede, mærkede salgskasser i 5 lag til senere serier. Specialemballage har en selvstændig presseminimum; overskudskasser opbevares og frigives i takt med tidsplanen.'
    - icon: Q
      icon_bg: orange
      title: 'Kvalitetskontrol på fabriksniveau'
      desc: 'Ethvert bræt gennemgår den samme tjekliste for samling med 100 punkter og 24 timers tryk- og lufttæthedstest (holdeprøvning ved 18.0 PSI, automatisk kassation ved fald på over 0.50 PSI), der gælder for enhver ordre, prøvebræt eller container.'
    - icon: D
      icon_bg: blue
      title: 'Eksport & dokumentation'
      desc: 'Overholdelsesdokumentation for CE, ISO 9001, BSCI, REACH og RoHS, eksportkvalitetsemballage og koordinering af søfragt til 50+ lande — fra et prøvebræt på 1 stk. til fulde programmer.'
    - icon: T
      icon_bg: green
      title: 'En tidsplan, du kan planlægge efter'
      desc: 'Prøvebrætter på 7–12 dage, prøveproduktion på 25–35 dage efter bekræftet PO og depositum og bekræftede produktionspladser til ordrer før sæsonen — så lanceringen rammer i sæsonen, ikke efter den.'

trial_steps:
  tagline: 'Køreplanen for lanceringen'
  title: 'Fra ide til første salg i seks spærringer'
  subtitle: 'Den typiske første lancering løber over 8–12 uger fra brief til leveret prøveordre med eksisterende platforme — længere, når et skræddersyet skrog tilføjer udvikling af form. Alle spærringer har en dato, du aftaler på forhånd.'
  steps:
    - step: 'Spærring 1'
      title: 'Produktbrief & gennemgang i konstruktionen (dag 0–2)'
      desc: 'Du deler ønsket brætmodel, ordremængde, artwork og emballageintention. Gennemgangen i konstruktionen er færdig inden for en arbejdsdag, med NDA tilgængelig, før du deler fortrolige specifikationer.'
    - step: 'Spærring 2'
      title: 'Specifikation, minimumsordre & tilbud (dag 3–7)'
      desc: 'Specificeret tilbud med den præcise beregning af minimumsordrestørrelse, prøvegebyrer og led i leveringstiden. Prøvegebyrerne modregnes din produktionsordre ved underskrift af kontrakten.'
    - step: 'Spærring 3'
      title: 'Prøvebrætter på 7–12 dage'
      desc: '1–2 fysiske brætter validerer skrogstivhed, tekstur på EVA-gripflade, grafisk nøjagtighed og tilbehørspasform. Du pagajer brættet, før du binder dig til noget andet.'
    - step: 'Spærring 4'
      title: 'Prøveordre på 20–50 brætter (25–35 dage)'
      desc: 'Produktion på eksisterende skrogplatforme med lagerførte materialer og forenklet emballage — den mindste kommercielle test, der afspejler virkelige lagerforhold.'
    - step: 'Spærring 5'
      title: 'Salg og feedback-vindue'
      desc: 'Den vigtigste spærring ligger i dit marked, ikke på vores fabrik: udlejere og kunder bekræfter brættets format, grafik og prisniveau, før du skalerer.'
    - step: 'Spærring 6'
      title: 'Skaler til volumen (90–100+ brætter)'
      desc: 'Når formatet er dokumenteret, giver fulde ruller på 150 m fuld produktionseffektivitet, mærket emballage og volumenpriser. Et containerprogram er målet, ikke kravet.'

