  title: 'Hvad en lancering koster — referenceprisintervaller'
  subtitle: 'Vejledende referenceintervaller, EXW Qingdao (Kina), for et standard touring- eller allround-skrog i lagerstørrelser. Det endelige tilbud afhænger af skrogform, PVC, artwarksdækning, emballage, tilbehør og antal — bekræftet mod din konfiguration, før nogen forpligtelse.'
  headers:
    stage: Ordretrin
    price: 'Referencepris pr. bræt'
    notes: 'Bemærkninger'
  rows:
    - stage: 'Prøvebrætter (1–2 brætter)'
      price: 'USD 250–350'
      notes: 'Fysisk prøvebræt med din grafik anvendt. Prøvegebyrerne modregnes produktionsordren ved underskrift af kontrakten.'
    - stage: 'Prøve- / pilotordre (20–50 brætter)'
      price: 'USD 180–260'
      notes: 'Eksisterende skrogplatforme, lagerførte materialer og forenklet emballage. Den standardiserede vej til lancering med lav MOQ.'
    - stage: 'Standardvolumen (90–100+ brætter pr. 150 m rulle)'
      price: 'USD 150–220'
      notes: 'Fulde 150 m dugruller, mulighed for Pantone-PVC, mærket emballage og volumenpriser.'
    - stage: 'Skræddersyet skrog & værktøj (tilvalg)'
      price: 'Tilbud pr. projekt'
      notes: 'En skræddersyet skrogform lægger 15–20 dages udvikling af form til den samlede tidsplan; værktøj specificeres og tilbydes en gang.'

derisk:
  tagline: 'Lancer uden risikoen'
  title: 'Fire måder, hvorpå en prøveordre reducerer risikoen ved din lancering'
  subtitle: 'De fleste nye brandlanceringer fejler på lager, ikke på produktkvalitet. En prøveordre er udviklet til at gøre de undgåelige fejltagelser umulige.'
  features:
    - icon: I
      icon_bg: blue
      title: 'Ingen tung lagerforpligtelse'
      desc: 'Din eksponering i første sæson holder sig under 50 brætter. Hvis formatet skal justeres, justerer du, før den store udgift — ikke efter.'
    - icon: C
      icon_bg: green
      title: 'Pengestrømmen holder sig overskuelig'
      desc: 'Mindre ordrer betyder mindre depositum, betalinger i etaper og ingen bunden kapital i et lager. Volumenpriser venter, til de faktisk er fortjent.'
    - icon: Q
      icon_bg: purple
      title: 'Kvaliteten nedprioriteres aldrig'
      desc: 'En prøveordre på 20 brætter gennemgår den samme tjekliste med 100 punkter og tryktest som et containerprogram — ingen kompromiser om "prøv før kvalitet".'
    - icon: G
      icon_bg: orange
      title: 'Dokumenteret vej videre til skalering'
      desc: 'Hver prøveordre har en bekræftet vej til volumen: bevarede prøvekrediteringer, fastlåst artwork og BOM samt reserverede produktionspladser til din næste serie.'

scale_path:
  tagline: 'Efter prøveordren'
  title: 'Hvad der kommer efter en succesfuld prøveordre'
  subtitle: 'Prøveordren er bevidst udviklet som det første skridt i et længere samarbejde. Dette er vejen, vi aftaler, før det første bræt afsendes.'
  steps:
    - step: 'Fase 1'
      title: 'Prøveordre leveret & gennemgået'
      desc: '20–50 brætter ankommer i sæsonen, og salgsdata kommer tilbage fra din kanal — udlejning, detailhandel eller direkte salg.'
    - step: 'Fase 2'
      title: 'Feedback & justering'
      desc: 'Farvevarianter, grafik, emballage og sammensætningen af tilbehør justeres efter det reelle markedsrespons. Artwork og BOM fastlås til opfølgningen.'
    - step: 'Fase 3'
      title: 'Volumenserie (90–100+ brætter)'
      desc: 'Fulde ruller på 150 m med fuld produktionseffektivitet, mærket salgsemballage og volumenpriser — prøvekrediteringerne er allerede anvendt.'
    - step: 'Fase 4'
      title: 'Programmer i containerstørrelse'
      desc: 'Programmer på 300+ brætter med forskudte leverancer, specialmaterialer i Pantone og hele udviklingsforløbet — samme fabrik, nu i fuld skala.'

trial_faqs:
  tagline: FAQ
  title: 'Ofte stillede spørgsmål om lancering med en prøveordre'
  items:
    - q: 'Kan jeg virkelig starte et SUP-mærke uden en containerordre?'
      a: 'Ja. Indgangspunktet er trinvis: 1–2 prøvebrætter validerer brættet (klar på 7–12 dage), en prøveordre på 20–50 brætter validerer markedet (produktion på 25–35 dage), og volumen på 90–100+ brætter følger først, når salget dokumenterer formatet. Co-branding i små serier starter fra så få som 5–10 stk., når du vil have mærkede brætter uden et udviklingstrin.'
    - q: 'Hvor lang tid tager en fuld lancering fra start til slut?'
      a: 'Med eksisterende skrogplatforme løber en typisk første lancering over 8–12 uger fra produktbrief til leveret prøveordre: prøvebrætter på 7–12 dage og prøveproduktion på 25–35 dage efter bekræftet PO og depositum. Et skræddersyet skrog lægger 15–20 dages udvikling af form til.'
    - q: 'Hvad er inkluderet i prisen — og hvad er ikke?'
      a: 'Referenceintervallerne er EXW Qingdao for brættene selv, inklusive anvendelse af branding og standard QC. De er vejledende: det endelige tilbud bekræftes mod din konfiguration — skrog, PVC, artwarksdækning, emballage og tilbehør — før nogen forpligtelse. Fragt, told og tolddeklaration på destinationen tilbydes separat.'
    - q: 'Skal jeg købe 100 eller 500 brætter for at få mit logo på brætterne?'
      a: 'Nej. Co-branding i små serier placerer dit logo på nese eller sidekanter fra så få som 5–10 stk., og prøveordrer på 20–50 brætter understøtter fuld artwarksanvendelse i samme kvalitet som volumenproduktion. Det, der ændrer sig med mængden, er enhedsprisen, ikke tilgængeligheden.'
    - q: 'Hvad sker der, hvis jeg vil ændre designet efter prøveordren?'
      a: 'Ændringer mellem prøveordre og volumen er normale og ønskede — det er netop pointen med prøveordren. Farvevarianter, artwork, emballage og tilbehør prissættes igen efter den nye konfiguration og fastlægges derefter med signering af artwork og BOM, før volumenproduktionen. Formgebyrer for silketryk frafales ved gentbestillinger med samme artworkmål.'
    - q: 'Underskriver I en NDA, før jeg deler mine designs?'
      a: 'Ja. En fortrolighedsaftale er tilgængelig, før du deler fortrolige tekniske specifikationer eller artwork. Vi fremstiller udelukkende under vores kunders mærker og konkurrerer aldrig med dem på noget marked — samme politik gælder for et prøvebræt på 1 stk. som for et containerprogram.'

