hero:
  tagline: 'For nye og voksende SUP-brands'
  title: 'Start dit SUP-mærke med en prøveordre med lav MOQ'
  subtitle: 'Du behøver ikke en container for at starte et SUP-mærke. Valider dit bræt, din grafik og dit marked med et prøvebræt, og test derefter salget med en prøveordre på 20–50 brætter — længe før du binder dig til fuld volumenproduktion. Branding, kvalitetskontrol og eksportlogistik håndteres af Qingdao Vatrad Group Co., Ltd.'
  actions:
    - variant: primary
      text: 'Start din lancering med et prøvebræt'
