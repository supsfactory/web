workshops:
  - title: SUP-Board-Produktion
    description: '4 automatisierte Montagelinien für aufblasbare SUP-Boards mit einem kombinierten Ausstoß von ca. 10,000 Boards pro Monat. Digitaldruck- und Siebdruckstationen laufen parallel. Jahres-SUP-Kapazität: über 120,000 Boards.'
    output: '120,000+ SUPs/Jahr'
  - title: SUP-Board-Produktion — Erweiterungslinien
    description: 'Zusätzliche automatisierte Montagelinien für SUP-Boards, die aktiviert werden, sobald das Volumen steigt. Drop-Stitch-Kernverklebung, Digitaldruck und Montagestationen laufen parallel.'
    output: 'Teil der Jahreskapazität von über 120,000 SUP-Boards'
  - title: SUP-Zubehör & gemischte Montage
    description: 'Multifunktionale Montagelinien für SUP-Zubehör — Paddel, Finnen, Leashes, Taschen und Kits. Heißluftschweißstationen, HF-Dielektrikpressen und Montagearbeitsplätze werden je nach Auftragsmix umkonfiguriert. Jahres-Zubehörkapazität: über 5,000 Einheiten.'
    output: '5,000+ Zubehörteile/Jahr'
  - title: Sicherheitsausrüstung
    description: 'Separater Reinraum-Produktionsbereich für Rettungswesten und Sicherheitsausrüstung. Eigene Näh-, Schaumeinlege- und Prüfstationen. Jahreskapazität Rettungswesten: über 50,000 Einheiten.'
    output: '50,000+ Rettungswesten/Jahr'

oem_capacity:
  moq: 'SUP: Muster 1–2 | Pilot 20–50 | Menge 90–100+ (pro 150-m-Rolle)'
  lead_time: 'Standard 25–35 Tage. Muster 7–12 Tage. Express verfügbar.'
  payment: 'T/T 30 % Anzahlung + 70 % Restbetrag. L/C, Western Union akzeptiert.'

lead_time_explainer:
  tagline: 'Planung & Terminierung'
  title: 'Wie Kapazität in Ihre Lieferung übersetzt wird'
  subtitle: 'Kapazität ist keine einzelne Zahl — hier ist, wie Lieferzeiten tatsächlich zugeteilt werden.'
  items:
    - title: 'Die Kapazität variiert mit Ihrer Spezifikation'
      body: 'Verfügbare Slots verschieben sich mit Boardtyp, Konstruktionskomplexität, Verpackung und saisonaler Nachfrage. Während des Frühjahrs-/Sommeraufbaus laufen Linien nahezu voll aus, und Musterslots sind zuerst ausgebucht.'
    - title: 'Planen Sie vor Ihrer Markteinführungssaison'
      body: 'Legen Sie Ihre Musterbestätigung und den Grafik-Freeze früh fest. Wiederholungsaufträge werden in Ihren vereinbarten Wiederholungsslot terminiert, sobald das Golden Sample archiviert ist.'
    - title: 'Drei Terminierungsspuren'
      body: 'Muster werden zuerst in die Prototypenlinie eingespeist, Erstaufträge landen im nächsten offenen Montagefenster, und Wiederholungsaufträge laufen in ihrem Wiederholungsslot.'
    - title: 'Verbindliche Lieferzeiten nach Prüfung'
      body: 'Wir bestätigen eine verbindliche Lieferzeit erst, nachdem Spezifikation, Grafik, Verpackung und Menge geprüft wurden — niemals als festes Versprechen im Voraus.'

