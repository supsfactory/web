key_factors:
  heading: 'Belangrijke factoren naast het constructietype'
  body: |
    Het constructietype is één variabele in de prestaties van het board. Drie andere factoren zijn net zo belangrijk of belangrijker:

    - **Drop-stitch dichtheid** — De draden per inch bepalen hoe gelijkmatig het board onder druk zijn vorm behoudt. Wij gebruiken standaarden van 96 draden/inch en 140 draden/inch voor performance-builds. Hogere dichtheid = platter board = beter glijvermogen.
    - **Kwaliteit en dikte van het PVC** — Niet al het PVC is gelijk. PVC van 0,7 mm dat uit Korea wordt geïmporteerd, heeft superieure scheurweerstand en UV-bescherming ten opzichte van dunnere alternatieven. Wij specificeren de materiaalkwaliteit per project.
    - **Railconstructie** — Enkellaagse rails zijn het meest voorkomende breekpunt bij goedkope boards. Dubbellaagse rails en versterkte railtape verkleinen het risico op railbeschadigingen drastisch. Al onze boards gebruiken versterkte rails, ongeacht het constructieniveau.

faqs:
  tagline: FAQ
  title: 'SUP-constructie — Veelgestelde vragen'
  items:
    - q: 'Welk constructietype moet ik voor mijn merk kiezen?'
      a: 'Dat hangt af van je doelmarkt en je prijspositionering. Entry-level en grootdistributie: enkellaags. Verhuurvloten, verenigingen en middenmerken: dubbellaags. Performance, tour en premium: drop-stitch kern. De meeste merken starten met dubbellaags als beste compromis tussen kosten, duurzaamheid en rijbeleving. Tijdens de haalbaarheidscheck adviseren wij op basis van jouw specifieke markt.'
    - q: 'Kan ik meerdere constructieniveaus onder één merk aanbieden?'
      a: 'Ja — veel merken bieden twee of drie niveaus aan. Wij produceren alle drie de constructies op dezelfde lijn met dezelfde QC-gates, zodat je constructietypen binnen één enkele order kunt mengen. Rompvorm en graphics kunnen op alle niveaus identiek zijn; alleen de constructie en de materialen veranderen.'
    - q: 'Welke norm voor de drukproef geldt voor alle constructies?'
      a: 'Elk board, ongeacht het constructietype, slaagt voor een dichtheidstest op 18,0 PSI met automatische afkeur bij een drukverlies van meer dan 0,50 PSI in 24 uur. Enkellaagse boards zijn ontworpen voor 12–15 PSI rijdruk, dubbellaagse voor 15–18 PSI en drop-stitch kern boards voor 18–25 PSI. De testdruk overschrijdt de nominale druk van alle typen.'
    - q: 'Hoe beïnvloedt de constructie de garantieclaims?'
      a: 'Enkellaagse boards hebben een iets hoger garantieclaimpercentage bij commercieel/verhuurgebruik vanwege rails en lekken. Dubbellaagse en drop-stitch kern constructies hebben aanzienlijk lagere claimpercentages. Tijdens de offertefase leveren wij garantiegegevens per niveau uit onze productieregisters.'

