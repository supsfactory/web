hero:
  tagline: 'Constructiegids'
  title: 'Vergelijking van SUP-constructies'
  subtitle: 'Drie constructietypen, één productielijn. Begrijp de afwegingen tussen stijfheid, gewicht, duurzaamheid en kosten van enkellaags PVC, dubbellaags PVC en drop-stitch kern — en welke past bij jouw doelgroep rider en je marktpositionering.'

answer:
  label: 'Snelle vergelijking'
  text: 'Enkellaags PVC is het lichtst en het goedkoopst — ideaal voor recreatieve riders en prijsgevoelige markten. Dubbellaags PVC voegt een tweede PVC-huid toe voor stijfheid en duurzaamheid bij een gematigd gewicht — de standaardkeuze van de industrie voor verhuurvloten en modellen in het middensegment. De drop-stitch kern met PVC-afwerking biedt maximale stijfheid en druktolerantie — favoriet voor performance, surf en zware riders. Alle drie de constructies worden op dezelfde lijn geproduceerd met dezelfde QC-gates; het verschil zit in de materialen en de laminatiestappen.'
  verified: 'September 2026'

