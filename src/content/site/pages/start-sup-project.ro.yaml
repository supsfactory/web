answer:
  label: 'Ce urmează'
  text: 'După ce trimiteți un brief de proiect, primiți un răspuns în termen de o zi lucrătoare. Un NDA este disponibil înainte de a împărți orice detaliu confidențial. Echipa de inginerie vă analizează brieful și vă întoarce o ofertă detaliată, cu MOQ, costul mostrelor și un termen etapă cu etapă — de regulă 7–12 zile pentru mostre și 6–8 săptămâni pentru prima producție, de la confirmarea PO. Costul mostrelor se deduce din comanda dumneavoastră de producție. Niciun angajament înainte de semnare.'
  verified: 'Septembrie 2026'

process_steps:
  tagline: Procesul
  title: 'De la brief la plăcile livrate — cinci pași'
  subtitle: 'Fiecare pas are un termen definit, un rezultat documentat și un punct de decizie „da sau nu”. Continuați doar atunci când sunteți pregătit.'
  steps:
    - step: 'Pasul 1'
      title: 'Trimiteți brieful de proiect'
      desc: 'Spuneți-ne despre placa dumneavoastră — specificații țintă, volum, nevoile de conformitate și termenul. Completarea briefului durează 5–10 minute. Dacă nu sunteți sigur pentru fiecare detaliu, trimiteți ce aveți și vă vom îndruma în rest. Un NDA este disponibil înainte de a trimite proiecte confidențiale.'
    - step: 'Pasul 2'
      title: 'NDA și analiză de fezabilitate (1–5 zile)'
      desc: 'Semnăm un NDA, dacă este solicitat, apoi echipa de inginerie analizează brieful dumneavoastră din punct de vedere al capabilității de producție, al disponibilității materialelor și al domeniului de conformitate. Primiți o ofertă detaliată, cu calculul MOQ, costul mostrelor și un termen etapă cu etapă.'
    - step: 'Pasul 3'
      title: 'Mostră și aprobare (7–21 de zile)'
      desc: '1–2 plăci fizice produse conform specificațiilor dumneavoastră. Le folosiți și le evaluați — rigiditatea carenei, acuratețea graficii, montajul accesoriilor. Ajustările sunt consemnate într-o listă de materiale (BOM) revizuită. Mostra înghețată devine referința de producție. Costul mostrelor se deduce din producție.'
    - step: 'Pasul 4'
      title: 'Planificare preproducție (7 zile)'
      desc: 'Achiziția materialelor, pregătirea matrițelor, confirmarea ambalajului și rezervarea slotului de producție. Toate materialele sunt inspectate la recepție față de BOM-ul înghețat. Un program de producție cu date de control al calității pe etape este emis înainte de începerea producției.'
    - step: 'Pasul 5'
      title: 'Producție, control al calității și expediție (4–6 săptămâni)'
      desc: 'Producția parcurge sistemul de control în 7 etape, cu criterii de admis sau respingere la fiecare etapă. Ambalare de nivel export, documentație de conformitate și coordonarea transportului maritim către peste 50 de țări. După livrare, evaluarea de către dumneavoastră captează îmbunătățirile pentru următoarea comandă.'

