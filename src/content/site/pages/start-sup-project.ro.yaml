what_we_need:
  heading: 'Ce să pregătiți înainte de brief'
  body: |
    Un brief complet accelerează procesul. Iată ce ajută:

    - **Specificațiile plăcii** — lungimea, lățimea, grosimea țintă, greutatea vâslașului, cazul de utilizare. Dimensiunile de referință ale altor plăci sau modelele concurenților sunt utile.
    - **Fișierele de design** — grafică vectorială (AI, SVG, PDF) pentru ilustrații și logo-uri. Dacă nu sunt gata, moodboard-uri sau imagini de referință sunt suficiente pentru fezabilitatea inițială.
    - **Volum și termen** — cantitatea țintă și programul sezonului. Chiar și un interval aproximativ („20–50 de plăci până în martie”) este suficient pentru a începe.
    - **Nevoile de conformitate** — piețele țintă și orice cerință de certificare specifică dincolo de CE, ISO 9001, BSCI, REACH, RoHS.
    - **Intervalul de buget** — un buget orientativ pe placă sau o cost țintă „la poartă” ne ajută să recomandăm platforma potrivită.

    **Nu aveți totul pregătit?** Trimiteți ce aveți. Vă vom îndruma în rest.

faqs:
  tagline: FAQ
  title: 'Începerea unui proiect SUP — întrebări frecvente'
  items:
    - q: 'Care este comanda minimă pentru a începe?'
      a: 'Traseul de intrare este etapizat: mai întâi 1–2 mostre (7–12 zile), apoi o comandă de probă de 20–50 de plăci (25–35 de zile), urmată de producții standard de volum de 90–100+ plăci pentru fiecare configurație aprobată. Co-brandingul private label pornește de la 5–10 bucăți, fără etapă de dezvoltare.'
    - q: 'Cât durează până primesc mostrele?'
      a: 'Mostrele fizice sunt produse în 7–12 zile de la confirmarea specificațiilor și a avansului. Folosind platforme de carenă existente, ciclul complet, de la brief la comanda pilot livrată, durează de regulă 8–12 săptămâni. O carenă complet personalizată adaugă 15–20 de zile pentru dezvoltarea matriței.'
    - q: 'Designul meu este protejat?'
      a: 'Da. Un NDA este disponibil imediat — înainte de a împărți orice informație confidențială. Noi producem exclusiv sub mărcile clienților și nu concurăm niciodată cu ei. Toate fișierele tehnice sunt păstrate în sisteme cu acces controlat și cu urme de audit.'
    - q: 'Ce solicită formularul de brief de proiect?'
      a: 'Brieful solicită tipul companiei, denumirea, specificațiile țintă ale plăcii, intervalul cantității, termenul și eventualele cerințe de conformitate. Completarea durează aproximativ 5–10 minute. Puteți atașa fișiere de design (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) de până la 10 MB. Dacă aveți îndoieli asupra unui câmp, îl puteți lăsa gol — vă vom contacta ulterior.'
    - q: 'Ce se întâmplă după ce trimit brieful?'
      a: 'Primiți un răspuns în termen de o zi lucrătoare. Echipa de inginerie vă analizează brieful și vă întoarce o ofertă detaliată, cu MOQ, costul mostrelor și un termen etapă cu etapă. Nu este necesar niciun angajament până când revizuiți și semnați contractul. Costul mostrelor se deduce din comanda dumneavoastră de producție.'

