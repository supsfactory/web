key_factors:
  heading: 'Viktiga faktorer utöver konstruktionstypen'
  body: |
    Konstruktionstypen är en variabel av flera när det gäller brädans prestanda. Tre andra faktorer är lika viktiga eller viktigare:

    - **Drop-stitch-täthet** — Trådarna per tum avgör hur jämnt brädan behåller sin form under tryck. Vi använder standarder på 96 trådar/tum och 140 trådar/tum för prestandebyggen. Högre täthet = plattare bräda = bättre glidförmåga.
    - **PVC:ns kvalitet och tjocklek** — Allt PVC är inte lika. PVC på 0,7 mm som importeras från Sydkorea har överlägsen sprickhållfasthet och UV-skydd jämfört med tunnare alternativ. Vi specificerar materialkvaliteten per projekt.
    - **Railkonstruktion** — Enkellageriga rails är den vanligaste brutna punkten på billiga brädor. Dubbellageriga rails och förstärkt railband minskar risken för railskador drastiskt. Alla våra brädor använder förstärkta rails, oavsett konstruktionsnivå.

faqs:
  tagline: Vanliga frågor
  title: 'SUP-konstruktion — vanliga frågor'
  items:
    - q: 'Vilken konstruktionstyp ska jag välja för mitt varumärke?'
      a: 'Det beror på din målmarknad och din prispositionering. Entry-level och stordistribution: enkellagerigt. Uthyrningsflottor, föreningar och märken i mittsegmentet: dubbellagerigt. Prestanda, tour och premium: drop-stitch-kärna. De flesta varumärken börjar med dubbellagerigt som bästa kompromiss mellan kostnad, hållbarhet och paddlingsupplevelse. Under genomförbarhetskontrollen rådgör vi utifrån din specifika marknad.'
    - q: 'Kan jag erbjuda flera konstruktionsnivåer under ett varumärke?'
      a: 'Ja — många varumärken erbjuder två eller tre nivåer. Vi tillverkar alla tre konstruktioner på samma linje med samma QC-gränser, så att du kan blanda konstruktionstyper inom en enda order. Skeppsform och grafik kan vara identiska på alla nivåer; endast konstruktionen och materialen skiljer sig åt.'
    - q: 'Vilken standard för tryckprovning gäller för alla konstruktioner?'
      a: 'Varje bräda, oavsett konstruktionstyp, klarar ett täthetstest vid 18.0 PSI med automatiskt underkännande vid ett tryckfall på mer än 0.50 PSI under 24 timmar. Enkellageriga brädor är utformade för 12–15 PSI i bruk, dubbellageriga för 15–18 PSI och drop-stitch-kärnebrädor för 18–25 PSI. Testtrycket överstiger alla typernas nominella tryck.'
    - q: 'Hur påverkar konstruktionen garantianspråken?'
      a: 'Enkellageriga brädor har något högre andel garantianspråk vid kommersiell/uthyrningsbruk på grund av rails och läckage. Dubbellageriga och drop-stitch-kärnekonstruktioner har betydligt lägre andel anspråk. Under offertfasen levererar vi garantidata per nivå ur våra produktionsregister.'

