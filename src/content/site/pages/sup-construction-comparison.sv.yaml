hero:
  tagline: 'Konstruktionsguide'
  title: 'Jämförelse av SUP-konstruktioner'
  subtitle: 'Tre konstruktionstyper, en produktionslinje. Förstå avvägningarna mellan styvhet, vikt, hållbarhet och kostnad för enkellagerigt PVC, dubbellagerigt PVC och drop-stitch-kärna — och vilket som passar din målgrupp och din marknadspositionering.'

answer:
  label: 'Snabb jämförelse'
  text: 'Enkellagerigt PVC är lättast och billigast — idealiskt för rekreationspaddlare och priskänsliga marknader. Dubbellagerigt PVC tillför ett andra PVC-lager för styvhet och hållbarhet med måttlig vikt — branschens standardval för uthyrningsflottor och modeller i mittsegmentet. Drop-stitch-kärnan med PVC-finish ger maximal styvhet och trycktålighet — favoriten för prestanda, surf och tunga paddlare. Alla tre konstruktioner tillverkas på samma linje med samma QC-gränser; skillnaden ligger i materialen och lamineringstegen.'
  verified: 'September 2026'

