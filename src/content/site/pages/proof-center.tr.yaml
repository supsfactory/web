traceability:
  tagline: 'Bir Parti, Rulo ve Tahta Arasında Takip Edilirken'
  title: 'İzlenebilirlik Gerçekte Nasıl Görünür'
  body: |
    Her partiye **10 yıllık ERP lot kodu** verilir. Tek bir lot altında kaydedilen zincir:

    - **Gelen rulo** — malzeme sertifikası, rulo numarası, test edilen kumaş partisi (çekme, yırtma, dikiş)
    - **Kesim** — tasarım dosyasına karşı CNC yerleştirme işi, fire yüzdesi kaydedilir
    - **Kaynak ve laminasyon** — hat, operatör, hazne başına makine parametreleri
    - **Montaj** — tahta seri numarası, valf tipi, üst yüzey pad partisi
    - **Test** — hazne başına 18.0 PSI × 24 saat tutma, 0.50 PSI üzeri düşüşte otomatik ret
    - **Sevkiyat** — tahta başına 100 maddelik kontrol listesi, parti başına kalite güvenlik müdürü onayı
    - **Devamı** — sevkiyatla birlikte Uygunluk Sertifikası; sözleşmede denetim hakkı saklıdır

    İlk siparişinizden önce örnek kalite kontrol kaydını isteyin — sevkiyatınızla alacağınız biçimin aynısıdır.

faqs:
  tagline: SSS
  title: 'Alıcıların Sorduğu Kanıt Soruları'
  items:
    - q: 'Bu sayfa yalnızca doğrulama için mi, yoksa durum tespitinin yerini mi alıyor?'
      a: 'Doğru — bu sayfa her iddianın nerede doğrulanabileceğini gösterir: kurum kaydı, sertifikalar, makineler, kayıtlar ve denetime açık tesis. Durum tespiti adımlarınız (kayıt kontrolü, denetim, üçüncü taraf incelemesi) geçerlidir ve memnuniyetle karşılanır.'
    - q: 'Sipariş dokümantasyonumda hangi kurum yer almalı?'
      a: 'Siparişler, Vatrad (üretim bölümü) olarak faaliyet gösteren Qingdao Vatrad Group Co., Ltd. şirketiyle verilir; SUP ürün hattı ise iSupfactory adıdır. Sözleşme belgeleri Satış Başkan Yardımcısı, Baş Mühendis ve Kalite Güvenlik Müdürü tarafından imzalanır.'
    - q: 'Sipariş vermeden önce sertifikaların kopyalarını alabilir miyim?'
      a: 'Evet — sertifika numaraları ve denetim kayıtları talep üzerine veya denetim sırasında sağlanır. Liste yayımlanır, asla yalnızca talep üzerine mevcut değildir.'
    - q: 'Parti test kayıtlarını kendim nasıl doğrularım?'
      a: 'Her hazne 24 saat boyunca 18.0 PSI basınçta, 0.50 PSI üzeri düşüşte otomatik ret ile test edilir; test kayıtları seri numaralarına bağlanır ve parti başına Uygunluk Sertifikasıyla birlikte sevk edilir. ISO 2859-1 Level II kapsamında SGS, TÜV, BV veya Intertek ön sevkiyat incelemesi talebinize göre planlanabilir.'
    - q: 'Sertifikalar aksesuarları da kapsıyor mu?'
      a: 'REACH/RoHS malzeme dokümantasyonu aynı siparişte verilen tahtalar ve aksesuarlar için geçerlidir; kalite kontrol listeleri ise eksiksiz kiti kapsar — tahta, kürek, pompa, emniyet halatı ve çanta.'
    - q: 'Siparişten sonra kanıtlara ne olur?'
      a: 'ERP parti izlenebilirliği 10 yıl saklanır. QMS SOP belgeleri ve inceleme standartları indirilebilir kalır ve alıcı, sözleşmeye göre üretim sırasında denetim hakkını saklı tutar.'

