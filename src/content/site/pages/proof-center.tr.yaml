answer:
  label: 'Doğrudan yanıt'
  text: 'İddiadan kanıta zinciri şudur: bu sitedeki her ifade bir kayıt, bir sertifika, bir makine, bir belge veya bir test kaydıyla desteklenir ve bunların her biri incelenebilir. iSupfactory, Qingdao Vatrad Group Co., Ltd. şirketinin (2012 yılından bu yana Qingdao’da kayıtlı) SUP ürün geliştirme ve üretim bölümüdür. 12.500 m² tesis, ISO 9001:2015 kalite yönetimi, ISO 25649 uyumluluğu, CE uygunluk dokümantasyonu, BSCI sosyal uyumu (denetim raporu talep üzerine) ve sipariş başına REACH/RoHS malzeme dokümantasyonu taşır. Her şişirilebilir hazne 24 saat boyunca 18.0 PSI basınçta, 0.50 PSI üzeri düşüşte otomatik ret ile test edilir ve parti kayıtları 10 yıllık ERP izlenebilirliği altında tutulur. Belge izi yayımlanır veya paylaşılabilir, fabrikamız ise denetime açıktır.'
  verified: 'Eylül 2026'

