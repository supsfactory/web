answer:
  label: 'Det korte svar'
  text: 'QINGDAO VATRAD GROUP.,LTD. sikrer kvaliteten på oppustelige SUP gennem et 4-trins verifikationssystem: kontrol af modtagne materialer (IQC), kvalitetskontrol under processen (IPQC), endelig brættest og trykverificering (FQC) samt emballage og frigivelse før afsendelse (OQC). Hver ordre inspiceres mod det godkendte prøveeksemplar, den tekniske specifikation, artwork-proof, BOM og emballageskrav, med lufttæthedskontrol, visuelle og måltekniske kontroller, bekræftelse af tilbehør og batchspørgsmål. Varer, der ikke opfylder acceptkriterierne, placeres under kontrolleret hold eller i karantæne, genbearbejdes kun efter godkendte instruktioner og geninspekteres, før de frigives.'
  verified: 'September 2026'

intro: 'Vores kvalitetssystem er bygget til OEM/ODM-projekter: inspektionskriterierne defineres pr. ordre, dokumenteres og følges af produktions- og kvalitetsholdene fra modtagne materialer til emballage. Dermed holdes kvalitetsforventningerne mellem fabrikken og dit mærke i overensstemmelse fra det første prøveeksemplar til fulde containerforsendelser.'

scope_note:
  tagline: Omfang
  title: Projektspecifikke inspektionskriterier
  body: |
    Kvalitetsspecifikationerne kan variere afhængigt af brætets konstruktion (f.eks. enkelt-/dobbeltlag, woven drop-stitch, fusioneret kant), den tilsigtede slutbrug, regler på målmarkedet og kundegodkendte parametre. Endelig frigivelse sker udelukkende på grundlag af de dokumenterede inspektionskriterier, der er aftalt for ordren.

stages:
  tagline: Kvalitetsramme
  title: Vores 4-trins system til kvalitetsverificering
  subtitle: En komplet QC-løkke fra ankomst af råmateriale til frigivelse før afsendelse.
  steps:
    - title: '1. Kontrol af modtagne materialer (IQC)'
      desc: 'Hovedmaterialer og indkøbte komponenter kontrolleres mod godkendte specifikationer og referenceprøver, før de går på produktionslinjen. Drop-stitch og PVC verificeres for materialeidentifikation, leverandørbatch, vægt/densitet, tykkelse, farvematch mod godkendte farveprøver og overfladedefekter. EVA-gripflader kontrolleres for mønster, farve, tykkelse, snitpræcision og limens egnethed. Ventiler og beslag gennemgår funktions-, gevind-, tætnings- og pasformstest. Tilbehør og emballage (pumper, pagajer, finner, sikkerhedsliner, tasker, kartoner) afstemmes på antal, farve, branding, barcodepræcision og artworkversion mod den godkendte BOM.'
    - title: '2. Kvalitetskontrol under processen (IPQC)'
      desc: 'Kritiske fremstillings trin inspiceres for at opdage afvigelser, før brætterne flyttes til næste arbejdsplads. Skæring og tryk verificeres for panelmål, artworkplacering, spejlvendret orientering og rene kanter mod godkendte tekniske tegninger. Montering af bræt og binding af kant kontrolleres for symmetri i konturen, kontinuitet i sømoverlæg og at hulrum eller luftlommer langs belastede områder er elimineret. Montering af ventiler og tilbehør samt grafik og branding verificeres for placering, orientering, limdækning, korrekt stavemåde i logo og artworkversion.'
    - title: '3. Endelig brættest og trykverificering (FQC)'
      desc: 'Færdige bræt gennemgår obligatorisk fysisk og strukturel test, før emballage godkendes. Brætterne pumpes op til det projektgodkendte inspektionstryk og holdes for at verificere strukturel stivhed og trykstabilitet. Scans for lufttæthed dækker ventilhus, kantsømme, nese-/halekoner og belastede samlinger ved hjælp af kalibrerede lækagemetoder (overvågning af trykfald eller bobletest). Visuel og målteknisk inspektion verificerer mål, rockerprofil og placering af EVA-flader (tolerance ±2 mm) under standard dagslys.'
    - title: '4. Emballage og frigivelse før afsendelse (OQC)'
      desc: 'Omfattende kontrol før afsendelse sikrer nul afvigelse i SKU-konfiguration og afsendelsesmærkning. Kontrollen af sætets fuldstændighed afklarer bræt, finne, sikkerhedsline, pagaj, pumpe, taske, reparationssæt og brugervejledning mod ordrens BOM. Emballage- og barcodekontroller verificerer kartonnummer, SKU-etiketter, barcode-læsbarhed, sprog i vejledningen og kartonnernes strukturelle holdbarhed. Ordren frigives først, når den endelige emballageaudit er godkendt af autoriseret kvalitetspersonale.'

inspection_points:
  tagline: Inspektionsdækning
  title: Vigtigste kontrolpunkter
  subtitle: 'Hvert kontrolpunkt udføres mod dokumenterede acceptkriterier, der er aftalt pr. ordre.'
  features:
    - icon: A
      icon_bg: blue
      title: Verificering af lufttæthed
      desc: 'Færdige bræt pumpes op til det godkendte inspektionstryk og kontrolleres for trykfastholdelse, ventilbasis tilstand, kantsømme, nese- og haleområder samt belastede steder. Hvor inspektionsproceduren kræver det, undersøges mistænkte lækageområder med godkendte lækagemetoder.'
    - icon: B
      icon_bg: green
      title: Visuel og målteknisk inspektion
      desc: 'Brætter inspiceres under egnede lysforhold for materialets overfladetilstand, trykdefekter, farvevariation, EVA-placering, folder, ridser, forurening og limens udseende. Vigtige mål og placeringer af tilbehør verificeres mod godkendte tegninger eller specifikationer.'
    - icon: C
      icon_bg: purple
      title: Verificering af tilbehør og emballage
      desc: 'Hele produktkonfigurationen verificeres før afsendelse: brætmodel, finnesystem, pagaj, pumpe, sikkerhedsline, transporttaske, reparationssæt, brugervejledning og kundespecifikt tilbehør — hvert element afstemt mod det godkendte prøveeksemplar, tegningerne og BOM.'
    - icon: D
      icon_bg: orange
      title: Emballage og frigivelse til afsendelse
      desc: 'Pakkede enheder kontrolleres for SKU-konfiguration, tilbehørskomplethed, produktetiketter, barcodeoplysninger, version af instruktionsvejledning, kartonnummer, pakkemængde og kartonens tilstand. Frigivelse til afsendelse autoriseres først, når alle inspektions- og emballagekrav er opfyldt.'

traceability_intro:
  tagline: Batchspørgsmål
  title: System til sporing på projektniveau og batchniveau
  body: |
    Hver specialfremstillet SUP-ordre styres under en samlet projektkode, der forbinder tekniske specifikationer, den godkendte BOM, artworkrevisioner, materialenumre, pakningshenvisninger og inspektionsrekorder. Produktions- og inspektionsrekorder føres for det relevante projekt og den relevante produktionsbatch, og hver batch kan spores tilbage til den godkendte produktspecifikation, BOM, artwork og pakningshenvisninger.

    Det understøtter effektiv gennemgang af produktkonfiguration, inspektionsstatus og berørt omfang, hvis et kvalitetsspørgsmål opstår — fra færdigt produkt tilbage til kildematerialet ved hjælp af brættets eller kartons identifikation.

traceability_chain:
  tagline: Sporingskæde
  title: Fra projektkode til frigivelse før afsendelse
  subtitle: En kæde af kontrollerede henvisninger fra ordrebekræftelse til autoriseret afsendelse.
  steps:
    - step: '01'
      title: Projektkode
      desc: Samlet projekthenvisning, der forbinder hvert kontrolleret dokument med ordren.
    - step: '02'
      title: Dokumentrevisioner
      desc: 'Aktuelle revisionsniveauer for specifikation, BOM, artwork og pakning — kun godkendte versioner er gyldige til produktion.'
    - step: '03'
      title: Batch og materialer
      desc: 'Materiale- og komponentpartier registreres mod produktionsbatchen.'
    - step: '04'
      title: Inspektionsrekorder
      desc: 'Resultater af IQC, proceskontrol, lufttæthed, endelig inspektion og emballage pr. batch.'
    - step: '05'
      title: Emballage og frigivelse
      desc: 'Emballagebatch, status for lukning af afvigelsesrapporter og samlet oversigt over autoriseret frigivelse.'

traceability_sample:
  tagline: Anonymiseret eksempel
  title: Sporingsdokument (demo)
  body: |
    Demonstrationsværdier vises kun til illustrationsformål — kundenavne, PO-numre, specialartwork, leverandørdata og kommercielle oplysninger er fjernet for at beskytte fortroligheden.

    - **Producent:** QINGDAO VATRAD GROUP, LTD.
    - **Projektkode:** DEMO-SUP-2026-01
    - **SKU-referencer:** DEMO-TR-126
    - **Produktionsbatch:** BATCH-AUG-01
    - **Revision af specifikation / BOM / artwork:** Rev B / Rev C / Rev B
    - **Registrering af lufttæthed:** BESTÅET — opbevares pr. batch
    - **Inspektionsstatus:** BESTÅET
    - **Afsendelsesstatus:** FRIGIVET

quarantine_intro:
  tagline: Kontrol af afvigelser
  title: Kontrol af afvigende produkter og karantæne
  body: |
    Produkter eller komponenter, der ikke opfylder fastsatte acceptkriterier, identificeres tydeligt og placeres under kontrolleret hold eller karantænestatus. De kan ikke gå videre til næste produktionstrin, emballage eller afsendelse, før en autoriseret disposition er gennemført. Genbearbejdning udføres efter godkendte instruktioner og knyttes til den relevante afvigelsesrapport; genbearbejdede varer geninspekteres mod de gældende projektkrav, før kvalitetsfrigivelse.

quarantine_flow:
  tagline: Kontrolforløb i 7 trin
  title: Hvad der sker, når en afvigelse opdages
  subtitle: 'Identificer, kontrol, korrektion, verifikation — frigiv eller kasser. Afvigende produkt vender aldrig ukontrolleret tilbage til produktion eller emballage.'
  steps:
    - step: '01'
      title: Identificer
      desc: Afvigelsen registreres mod det berørte produkt, SKU, batch eller procestrin.
    - step: '02'
      title: Mærk
      desc: 'Berørte varer mærkes tydeligt med kontrollerede statusetiketter — HOLD, KARANTÆNE eller KASSERET.'
    - step: '03'
      title: Karantæne
      desc: 'Varer adskilles i et fysisk kontrolleret karantæneområde eller i et systemstyret område for at hindre uvedkommende anvendelse eller afsendelse.'
    - step: '04'
      title: Vurder omfang
      desc: 'Det berørte omfang gennemgås pr. batch, procestrin, materialeparti og dokumentrevision.'
    - step: '05'
      title: Genbearbejd / udskift
      desc: 'Korrektion er kun tilladt via en godkendt disposition og en kontrolleret arbejdsinstruktion.'
    - step: '06'
      title: Geninspekter
      desc: 'Korrigerede varer geninspekteres mod de gældende acceptkriterier, før de frigives.'
    - step: '07'
      title: Frigiv eller kasser
      desc: 'Kun autoriseret, overensstemmende produkt går videre til emballage eller frigivelse før afsendelse.'

quarantine_evidence:
  tagline: 'På fabriksgulvet'
  title: 'Kontrolleret test og karantæne i praksis'
  subtitle: 'Billeder fra vores værksted i Qingdao viser, hvordan statuskontrol og inspektionsrekorter anvendes på stedet.'
  features:
    - image: https://assets.isupfactory.com/site/quality/qc-air-tightness-test-area.avif
      alt: Oppustelige SUP-brætter i fabrikkens område til lufttæthedstest, overvåget af et digitalt manometer
      title: Område til lufttæthedstest
      desc: 'Oppustede brætter holdes i QC-testområdet under industrielt lys, mens digitale manometre overvåger den godkendte holdeprøvning ved ventilbasis, kantsømme, nese og hale samt belastede områder. Rekorderne føres pr. batch og kobles til den endelige inspektion.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
      alt: Kvalitetskontrollens tjeklister og kontrollerede statusetiketter på fabrikkens inspektionsstation
      title: Station til hold og karantæne
      desc: 'Inspektionsstation med QC-tjeklister og statusmærkning. Alle varer, der ikke opfylder acceptkriterierne, mærkes, registreres og flyttes til karantæne — de kan ikke gå videre til emballage, før en autoriseret disposition og obligatorisk geninspektion er gennemført.'
    - image: https://assets.isupfactory.com/site/quality/qc-air-tightness-rework.avif
      alt: QC-tekniker, der udfører kontrolleret genbearbejdning af lufttæthed på et oppusteligt SUP-bræt ved fabrikkens genbearbejdningsstation
      title: Kontrolleret genbearbejdningsstation
      desc: 'Genbearbejdning af lufttæthed udføres på en dedikeret station under et godkendt metodekort: fejlen markeres, brættet forbliver på HOLD, og efter den krævede hærdetid vender det tilbage til testområdet for geninspektion mod de oprindelige acceptkriterier.'
    - image: https://assets.isupfactory.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Demonstrationsfoto af kontrolleret karantæneadskillelse i fabrikken i Qingdao
