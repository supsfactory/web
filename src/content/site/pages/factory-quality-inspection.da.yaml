rework_intro:
  tagline: 'Styring af genbearbejdning'
  title: 'Kontrolleret håndtering af afvigelser i lufttæthed og genbearbejdning'
  body: |
    Hos QINGDAO VATRAD GROUP.,LTD. defineres genbearbejdning strengt som at bringe en afvigende enhed tilbage til fuld overensstemmelse med dens oprindelige ingeniørmæssige specifikation — ikke som en hurtig løsning. Ethvert bræt, der identificeres med en afvigelse i lufttæthed, placeres under kontrolleret hold og knyttes til en afvigelsesrapport (NCR), før der behandles videre; lækagens kilde findes og registreres ved hjælp af den godkendte diagnostikmetode.

    Genbearbejdning må kun ske, når fejlen ligger inden for det godkendte genbearbejdningsomfang, og en autoriseret metode er tilgængelig. Genbearbejdningsinstruktionen identificerer produkt, batch, fejlplacering, godkendt materiale, metode, påkrævede forhold og omfang af geninspektion. Efter den krævede hærde- eller stabiliseringsperiode geninspekteres brættet mod de samme gældende acceptkriterier som for et overensstemmende bræt — genbearbejdning sænker aldrig acceptstandarden. Hvis geninspektionen mislykkes, kræves ny ingeniørmæssig og kvalitetsmæssig disposition; gentagen genbearbejdning er ikke tilladt uden dokumenteret godkendelse.

rework_decision:
  tagline: Interaktivt flow
  title: Beslutningsflow for genbearbejdning — klik på et punkt
  subtitle: 'Følg, hvordan en afvigelse i lufttæthed håndteres fra opdagelse til frigivelse eller skroting. Klik på et punkt for at udvide kontrolkravene i det trin.'
  nodes:
    - id: detect
      type: start
      label: Lækage opdaget
      detail: 'En afvigelse i lufttæthed identificeres under inspektion — tab af trykfastholdelse, synlig lækage eller en relateret fejl i luftsystemet.'
    - id: hold
      type: step
      label: Stop på linjen · HOLD-etiket · NCR
      detail: 'Behandlingen stoppes. Bræt-ID, produktkode, batch, arbejdsplads, dato og inspektør registreres; der påsættes en HOLD / KARANTÆNE-etiket, og der åbnes en NCR mod den gældende specifikationsrevision.'
    - id: locate
      type: step
      label: Find lækagens kilde
      detail: 'Brættet pumpes op til det projektgodkendte diagnosticeringstryk, og kilden findes med en godkendt metode — trykfastholdelse, kalibreret bobletest, akustisk eller lækagedetekteringsudstyr.'
    - id: classify
      type: step
      label: Klassificering af fejlen (A–G)
      detail: 'Fejlen klassificeres mod godkendelsesmatricen: A ventilgrænseflade, B søm ved ventilbasis, C overfladehul i punktform, D lokal kantsøm, E omfattende kantfejl, F gentagne lækager, G strukturskade.'
    - id: authorize
      type: decision
      label: Genbearbejdning godkendt?
      yes: rework
      no: escalate
      detail: 'QC bekræfter fejlkategorien, og Konstruktion vurderer, om brættet kan føres tilbage til sin oprindelige specifikation. Godkendelsen registrerer metodekort, materialer, forhold og omfang af geninspektion — eller sender sagen til udskiftning, kassation, skroting eller kundens dispensation.'
    - id: rework
      type: step
      label: Kontrolleret genbearbejdning
      detail: 'Udføres kun inden for den godkendte fejlgrænse med det godkendte metodekort, materialebatch og værktøj — aldrig ændring af mål, konstruktion, grafik, tilbehør eller emballagekrav.'
    - id: cure
      type: step
      label: Hærdning og stabilisering
      detail: 'Brættet forbliver på HOLD gennem den hærde- og stabiliseringsperiode, der er fastsat i det godkendte materiale- og procesinstrument, og får derefter en visuel forkontrol af arbejdsudførelse.'
    - id: reinspect
      type: decision
      label: Geninspektion bestået?
      yes: release
      no: escalate
      detail: 'Brættet pumpes op til det projektgodkendte geninsktionstryk, og den oprindelige fejl samt alle potentielt berørte egenskaber verificeres igen — lækageplacering, ventil, kanter, sømme, belastede områder, tilbehør og udseende. Genbearbejdning sænker aldrig acceptstandarden.'
    - id: release
      type: release
      label: Kvalitetsfrigivelse
      detail: 'Kvalitet gennemgår den lukkede NCR, genbearbejdningsregistreringen og resultatet af geninspektionen og autoriserer frigivelse. Intet genbearbejdet bræt pakkes eller afsendes uden autoriseret kvalitetsfrigivelse.'
    - id: escalate
      type: escalate
      label: Eskalering — udskift / skrot / dispensation
      detail: 'Ingen gentagen genbearbejdning uden dokumenteret godkendelse. Brættet sendes til udskiftning, kassation, skroting eller en skriftlig dispensation fra kunden, hvor den oprindelige specifikation ikke kan genetableres.'

defect_matrix:
  tagline: Fejlklassificering
  title: Klassificering af lufttæthedsfejl og godkendelsesmatrix
  subtitle: 'Ikke enhver lækage genbearbejdes — hver fejl klassificeres, og dispositionen godkendes på det rette niveau, fra QC-inspektør til fabrikschef.'
  headers:
    category: Fejlkategori
    area: Typisk område
    eligibility: Berettigelse til genbearbejdning
    approval: Påkrævet godkendelse
  rows:
    - category: 'Klasse A — Ventilgrænseflade'
      area: 'Ventilkerne, hættepakning, pakning, pumpegrænseflade'
      eligibility: 'Standard genbearbejdning godkendt'
      approval: 'QC-inspektør'
    - category: 'Klasse B — Søm ved ventilbasis'
      area: 'Mikrolækage langs ventilens kant'
      eligibility: 'Genbearbejdning vurderes efter det godkendte metodekort'
      approval: 'QC + Konstruktion'
    - category: 'Klasse C — Overfladehul i punktform'
      area: 'Lokalt mikroshul på en ikke-belastet overflade'
      eligibility: 'Kun godkendt, når det er i overensstemmelse med kundens specifikationer'
      approval: 'QC + Konstruktion'
    - category: 'Klasse D — Lokal kantsøm'
      area: 'Lokal lækage i overlap på kantbåndet'
      eligibility: 'Høj risiko; kræver stram ingeniørmæssig disposition'
      approval: 'Konstruktion + QA-chef'
    - category: 'Klasse E — Omfattende kantfejl'
      area: 'Sammenhængende sømfejl i belastede områder'
      eligibility: 'Standard genbearbejdning er ikke godkendt — udskiftning eller årsagsanalyse'
      approval: 'QA-chef + Dispensation fra kunden'
    - category: 'Klasse F — Gentagen lækage'
      area: 'Lækage, der ikke kan lokaliseres, eller fejl ved gentest'
      eligibility: 'Ingen gentagen genbearbejdning; udskiftning, skroting eller ingeniørmæssig årsagsanalyse'
      approval: 'QA-leder / Konstruktion'
    - category: 'Klasse G — Strukturskade'
      area: 'Materialeskade, delaminering, deformering af brættet'
      eligibility: 'Genbearbejdningsfrigivelse er ikke godkendt — udskiftning, skroting eller skriftlig dispensation fra kunden'
      approval: 'Kvalitetschef + Kundens godkendelse'

rework_flow:
  tagline: 'Lukket løkke i 7 trin'
  title: 'Kontrolleret genbearbejdningsarbejdsgang — fra opdagelse til frigivelse eller skroting'
  subtitle: 'Enhver genbearbejdning af lufttæthed følger den samme kontrollerede løkke: opdag, karantæne, diagnosticer, godkend, genbearbejd, geninspekter, frigiv.'
  steps:
    - step: '01'
      title: 'Opdagelse, stop på linjen og karantæne'
      desc: 'Behandlingen stoppes straks på det berørte bræt. Bræt-ID, produktkode, batch, arbejdsplads, dato og inspektør registreres, der påsættes en HOLD / KARANTÆNE-etiket, og der åbnes en NCR mod den gældende specifikationsrevision.'
    - step: '02'
      title: 'Systematisk diagnosticering af lækage'
      desc: 'Brættet pumpes op til det projektgodkendte diagnosticeringstryk, og lækagens kilde findes med en godkendt metode — trykfastholdelse, kalibreret bobletest, akustisk eller lækagedetekteringsudstyr. Den mistænkte placering markeres uden at beskadige brættet.'
    - step: '03'
      title: 'Ingeniørmæssig disposition og godkendelse'
      desc: 'QC bekræfter fejlkategorien, og Konstruktion vurderer, om brættet kan føres tilbage til sin oprindelige specifikation. En genbearbejdningsgodkendelse med henvisning til NCR-registeret registrerer den godkendte metode, materialerne, forholdene og omfanget af geninspektionen — eller tildeler udskiftning, kassation, skroting eller dispensation fra kunden.'
    - step: '04'
      title: 'Kontrolleret udførelse af genbearbejdning'
      desc: 'Genbearbejdning udføres kun inden for den godkendte fejlgrænse med det godkendte metodekort, materialebatch og værktøj. Brættets mål, konstruktion, grafik, tilbehørskonfiguration og emballagekrav ændres aldrig.'
    - step: '05'
      title: 'Hærdning, stabilisering og forkontrol'
      desc: 'Det genbearbejdede bræt forbliver i HOLD-status gennem den hærde- og stabiliseringsperiode, der er fastsat i det godkendte materiale- og procesinstrument, og får derefter en visuel forkontrol af arbejdsudførelse, før det geninspekteres.'
    - step: '06'
      title: 'Geninspektion og prøvning'
      desc: 'Brættet pumpes op til det projektgodkendte geninsktionstryk, og den oprindelige fejl samt alle potentielt berørte egenskaber verificeres igen: lækageplacering og området omkring, ventil, kanter, sømme, belastede områder, tilbehør og udseende. Genbearbejdning sænker aldrig acceptstandarden.'
    - step: '07'
      title: 'QA-frigivelse eller endelig disposition'
      desc: 'Kvalitet gennemgår den færdige NCR, genbearbejdningsregistreringen og resultatet af geninspektionen og autoriserer derefter frigivelse — eller eskalerer til udskiftning, kassation, skroting eller dispensation fra kunden. Intet genbearbejdet bræt pakkes eller afsendes uden autoriseret kvalitetsfrigivelse.'

quality_safeguards:
  tagline: Kvalitetssikringer
  title: Anti-fejlregler, der beskytter dit mærke
  subtitle: 'Hårde kontroller, der forhindrer ukontrollerede reparationsløkker — en dokumenteret genbearbejdning pr. fejl, alarmtærskler pr. batch, kalibreret instrumentering og kontrollerede testforhold.'
  features:
    - icon: 1
      icon_bg: blue
      title: En genbearbejdning pr. fejl
      desc: 'Et enkelt sted må genbearbejdes en gang efter en autoriseret instruktion. Hvis geninspektionen stadig mislykkes, eskaleres brættet til udskiftning, kassation, skroting eller dispensation fra kunden — gentagen genbearbejdning uden dokumenteret godkendelse er ikke tilladt.'
    - icon: 2
      icon_bg: green
      title: 'Batchalarm og stop af linjen'
      desc: 'Når afvigelser i en produktionsbatch overstiger den konstruktionsmæssigt fastsatte tærskel, stoppes linjen, og Konstruktion undersøger årsagen — materialepartier, procesforhold og rekorder — før produktionen genoptages.'
    - icon: 3
      icon_bg: purple
      title: Kalibreret instrumentering
      desc: 'Manometre, digitale manometre og timere, der bruges til lufttæthedstest, er under kontrol og kalibreret af tredjepartslaboratorier inden for gyldighedsperioden, og kalibreringsstatus er synlig i inspektionsområdet.'
    - icon: 4
      icon_bg: orange
      title: Kontrollerede testforhold
      desc: 'Områder til lufttæthedstest og hærdning holdes i et kontrolleret miljø, så resultaterne ikke påvirkes af temperaturudsving mellem dag og nat.'

rework_boundaries:
  tagline: Omfang og grænser
  title: Hvad dette system ikke dækker
  body: |
    Genbearbejdningskontrolsystemet gælder færdige eller igangværende oppustelige SUP-bræt, der er identificeret med lækage, tab af trykfastholdelse eller relaterede fejl i luftsystemet, før frigivelse før afsendelse. Det giver ikke tilladelse til ændringer af godkendt konstruktion, materialer, grafik, produktkonfiguration eller kundekrav, og det dækker ikke:

    - Produkter, der allerede er afsendt eller er i kundens salgskanaler.
    - Strukturskade eller deformering af brættet, som ikke er vurderet af Konstruktion.
    - Omfattende kant- eller sømfejl, skade på kernemateriale eller fejl, der kan påvirke sikkerheden.
    - Projekter, hvor genbearbejdning ikke er tilladt: kundens godkendte prøveeksemplarer, certificerings- eller testenheder.
    - Projekter med kundens proprietære processer, specialmaterialer eller særlige reparationskrav.
    - Gentagne lækager, der ikke kan lokaliseres, eller bræt, der fejler igen efter genbearbejdning.

    Ethvert afvigelse fra kundens specifikationer kræver dokumenteret ingeniørmæssig gennemgang og, hvor det er relevant, skriftlig godkendelse fra kunden. Bræt, der ikke kan føres tilbage til den oprindelige specifikation, frigives kun efter en udtrykkelig dispensation fra kunden — aldrig alene af produktionen.

method_cards:
  tagline: System med metodekort
  title: Indeks over kontrollerede genbearbejdningsmetodekort
  subtitle: 'Den overordnede instruktion styrer processen; metodekortene styrer arbejdets udførelse. Genbearbejdningsinstruktionen (WI-QC-AT-001) henviser til metodekortene MC-RW-01 til MC-RW-06 samt MC-RW-00 til obligatorisk skroting og kassation.'
  headers:
    code: Metodekort
    defect: Fejlklasse
    scope: Anvendelsesområde
    controls: Vigtigste ingeniørmæssige kontroller
    approval: Godkendelsesbemyndigelse
  rows:
    - code: MC-RW-01
      defect: Klasse A (ventilgrænseflade)
      scope: 'Service af ventilkerne, rengøring af pakning og samling igen'
      controls: 'Kalibreret momentnøgle, ren pakningsflade, ingen skade på ventilens gevind'
      approval: 'QC-inspektør'
    - code: MC-RW-02
      defect: Klasse B (ventilperiferi)
      scope: 'Tætning af ventilens bundflange og kontrolleret fastspænding'
      controls: 'Kontrolleret overfladeforberedelse, godkendt limmateriale, cirkulært trykaggregat'
      approval: 'QC + Konstruktion'
    - code: MC-RW-03
      defect: Klasse C (overflademikrolækage)
      scope: 'Forsegling af ikke-strukturelle huller i punktform'
      controls: 'Godkendt tokomponentlim uden løb ind i grafik eller EVA'
      approval: 'QC + Konstruktion'
    - code: MC-RW-04
      defect: Klasse D (lokal kantsøm)
      scope: 'Genbinding af lokal kantsøm i overlap'
      controls: 'Temperaturstyret varmeaktivering, trykrulle, fixtur mod krølning'
      approval: 'Konstruktion + QA-chef'
    - code: MC-RW-05
      defect: Klasse B/C (tilbehørskant)
      scope: 'Tætning af finnekasse-lap og monteringsbase for tilbehør'
      controls: 'Overfladefremmer, profileret fastspændingsblok, fastsat holdetid'
      approval: 'QC + Konstruktion'
    - code: MC-RW-06
      defect: Klasse D (nese-/halesøm)
      scope: 'Indsats i søm med høj krumning og høj belastning'
      controls: 'Godkendt limmateriale med høj forskydningsstyrke, forlænget hærdetid før gentest'
      approval: 'Overingeniør'
    - code: MC-RW-00
      defect: Klasse E/F/G (kritisk / brud)
      scope: 'Obligatorisk skroting og fysisk ødelæggelse'
      controls: 'Fysisk gennemskæring for at forhindre fejlsamling, skrotningsregistrering, tværfaglig årsagsanalyse'
      approval: 'Fabrikschef'

inspector_friendly:
  tagline: Tredjepartsinspektion
  title: Inspektørvenlig protokol
  body: |
    Vi stiller et dedikeret inspektionsområde med kalibrerede manometre, standardiserede lysborde til søm- og grafikkontrol og forudfyldte inspektionsbriefs, så tredjepartsbureauer (SGS, BV, Intertek, QIMA) kan gennemføre forhåndsinspektion effektivt — og spare dine inspektionsomkostninger.

    Hver brief opsummerer de gældende dokumentrevisioner, referencen til det godkendte prøveeksemplar, kontroller af kvalitetskritiske egenskaber, aftalet udtagningsniveau, funktionstest samt krav til emballage og barcode for den pågældende PO. Angivne mængder, kvalitet, pakning og grundlæggende sikkerhedsforhold verificeres mod de godkendte projektreferencer — ingen jagt i dokumenterne i sidste øjeblik.

