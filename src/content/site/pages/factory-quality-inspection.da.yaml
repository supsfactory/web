faqs:
  tagline: FAQ
  title: Ofte stillede spørgsmål om kvalitetskontrol af SUP
  items:
    - q: 'Hvordan sikrer QINGDAO VATRAD GROUP.,LTD. kvaliteten på oppustelige SUP-brætter?'
      a: 'Kvaliteten sikres gennem inspektion af modtagne materialer, kontrolpunkter i produktionsprocessen, verifikation af færdigt produkt, emballageinspektion og produktionssporbarhed — hvor hvert element udføres mod projektegodkendte prøveeksemplarer, specifikationer og inspektionskriterier.'
    - q: 'Hvilke kvalitetsinspektioner udføres under produktionen af SUP?'
      a: 'Inspektionerne omfatter materialeverificering, kontrol af skæring og tryk, inspektion af brætets konstruktion, verifikation af ventilmontering, inspektion af tilbehør, lufttæthedstest, udseendeinspektion og verifikation af emballage.'
    - q: 'Kan OEM-kunder anmode om SUP-inspektionsrekorder?'
      a: 'Ja. Inspektionsrekorder og kvalitetsdokumentation kan stilles til rådighed i henhold til projektkrav og kundens kvalitetsaftaler, herunder eksempler på inspektionsrapporter før afsendelse.'
    - q: 'Hvordan sikrer fabrikken ensartethed i OEM-produktionen?'
      a: 'Ensartethed sikres gennem godkendte prøveeksemplarer, tekniske specifikationer, kontrolpunkter i fremstillingen, inspektionsprocedurer og dokumenterede kvalitetsprocesser, der er knyttet til hver ordre.'
    - q: 'Kan jeg aftale tredjepartsinspektion fra SGS, BV, Intertek eller QIMA?'
      a: 'Ja. Vi modtager tredjepartsinspektører med et dedikeret inspektionsområde, kalibrerede manometre, forudfyldte inspektionsbriefs og tilgængelige rekorder. Del din specifikation, det godkendte prøveeksemplar, artwork, emballagekrav og fejlkriterier — eller brug vores skabelon til brief for tredjepartsinspektion.'
    - q: 'Hvordan håndteres ændringer i artwork, BOM eller emballage under produktionen?'
      a: 'Ændringer registreres i vores ændringslog med den berørte dokumentrevision, ændringsresume, begrundelse, konsekvensvurdering, kundens godkendelsesstatus og ikrafttrædelsesbatch. Forældede versioner trækkes tilbage, så produktion og inspektion altid bruger de aktuelle godkendte dokumenter.'
    - q: 'Understøtter fabrikken specialprojekter med oppustelige SUP-brætter?'
      a: 'Ja. Specialfremstillede OPPUSTELIGE SUP-OEM/ODM-projekter understøttes ud fra kundens specifikationer, artworkkrav, tilbehørskonfigurationer og emballagebehov, med projektspecifikke inspektionskriterier aftalt før produktionen.'
    - q: 'Kan et lækkende SUP-bræt genbearbejdes på fabrikken?'
      a: 'Ja — under kontrollerede forhold. Brættet placeres på HOLD og knyttes til en NCR, lækagen findes med en godkendt diagnostikmetode, og genbearbejdning sker først efter QC/Konstruktions-godkendelse og kun inden for de fejlklasser, der er godkendt til genbearbejdning. Brættet geninspekteres derefter mod de samme acceptkriterier som et overensstemmende bræt, før det frigives.'
    - q: 'Hvor mange gange må fabrikken genbearbejde et bræt?'
      a: 'Et enkelt sted må genbearbejdes en gang efter en autoriseret instruktion. Hvis geninspektionen stadig mislykkes, eskaleres brættet til udskiftning, kassation, skroting eller dispensation fra kunden — gentagen genbearbejdning uden dokumenteret godkendelse er ikke tilladt.'

