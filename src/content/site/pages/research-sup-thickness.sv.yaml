  subtitle: '6 min läsning'

answer:
  label: 'Kort svar'
  text: 'Tjockleken är en kompromiss mellan styvhet och stabilitet: 4" (10 cm) är styvast, lättast och snabbast — idealiskt för turer och tävlingar; 5" (12.7 cm) är allroundvalet för de flesta paddlare; 6" (15.2 cm) maximerar den primära stabiliteten för yoga och tyngre paddlare (100+ kg). En tunnare genomskärning är strukturellt styvare, så en 4"-bräda böjer mindre vid 15 PSI än en 6"-bräda gör vid 25 PSI.'
  verified: 'September 2026'

content_html: |
  <h2>De tre standardtjocklekarna</h2>

  <h3>4" (10 cm) – Tur &amp; prestanda</h3>
  <ul>
    <li>Maximal styvhet – mindre nedböjning under last</li>
    <li>Lättare – mindre material, mindre luftvolym</li>
    <li>Utmärkt spårstabilitet – mindre gungning i sidled</li>
    <li>Snabbare – mindre motstånd, lättare att plana ut</li>
    <li>Idealiskt: turer, tävlingar, fitnesspaddling, erfarna paddlare</li>
  </ul>

  <h3>5" (12.7 cm) – Allround</h3>
  <ul>
    <li>God styvhet – balanserad förhållande mellan böjlighet och styvhet</li>
    <li>Måttlig vikt – standardmaterialförbrukning</li>
    <li>God primär och sekundär stabilitet</li>
    <li>Idealiskt: rekreationspaddling, nybörjare, enstaka hav och älvpaddling</li>
  </ul>

  <h3>6" (15.2 cm) – Stabilitet &amp; yoga</h3>
  <ul>
    <li>Maximal primär stabilitet – enorm flytkraft</li>
    <li>Tyngre – mer PVC-material, större luftvolym</li>
    <li>Långsammare – mer motstånd, svårare att plana ut</li>
    <li>Idealiskt: yoga/fitness, tunga paddlare (100+ kg), mycket rufflade förhållanden</li>
  </ul>

  <h2>Teknisk analys</h2>
  <p>Styvheten hos en uppblåsbar SUP bestäms av det interna lufttrycket och brädans tvärsnitts tröghetsmoment. Vid 20 PSI böjer en 4"-bräda cirka 30 % mindre under last än en 6"-bräda med samma bredd och längd. Den primära stabiliteten kommer från vattenlinjens bredd och flytkraften; den sekundära stabiliteten påverkas av railens form och brädans bredd.</p>

  <h2>Tjocklek baserat på paddlarens vikt</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Paddlarens vikt</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Rekommenderad tjocklek</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border">Mindre än 65 kg (143 lbs)</td><td class="p-3 border">4"</td></tr>
      <tr><td class="p-3 border">65 – 90 kg (143 – 198 lbs)</td><td class="p-3 border">5"</td></tr>
      <tr><td class="p-3 border">90 – 115 kg (198 – 253 lbs)</td><td class="p-3 border">5" eller 6"</td></tr>
      <tr><td class="p-3 border">Mer än 115 kg (253 lbs)</td><td class="p-3 border">6"</td></tr>
    </tbody>
  </table>

  <h2>Kompromissen mellan tjocklek och PSI</h2>
  <p>Ett vanligt misstag är att anta att ett högre PSI-värde kan kompensera en för tjock bräda. Vid 25 PSI böjer en 6"-bräda mer än en 4"-bräda gör vid 15 PSI, eftersom det geometriska tröghetsmomentet dominerar jämförelsen av styvhet. För prestandaorienterade paddlare presterar en tunnare bräda vid lägre tryck därför bättre än en tjockare bräda vid högre tryck.</p>

  <h2>Vatrads produktsortiment</h2>
  <ul>
    <li><strong>Brädor på 4":</strong> Cheetah Touring-serien – tur-SUP 12' x 30" x 4" för fitness och distanspaddling</li>
    <li><strong>Brädor på 5":</strong> Cheetah Allround-serien – 10'6" x 32" x 5" för rekreativt bruk</li>
    <li><strong>Brädor på 6":</strong> Cheetah Ultra Stable-serien – 10' x 34" x 6" för yoga, stora paddlare och fotoplattformar</li>
  </ul>
  <p>Alla brädor använder drop-stitch-kärnor på 1 680 DTEX med ett avsett tryck på 15 PSI och PVC-laminat på 1.2 mm.</p>
  <p>Tjocklek, PSI och tygspecifikationer kan konfigureras för skräddarsydda serier — se hur vi <a href="/sv/oem-manufacturing">utvecklar brädor för OEM- och private label-varumärken</a> och byggprocessen direkt <a href="/sv/factory">i fabriken</a>.</p>

