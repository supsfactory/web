hero:
  tagline: 'Transparentně a podle projektu'
  title: 'Průvodce flexibilním brandingem a MOQ při výrobě'
  subtitle: 'Pochopte fyziku surového drop-stitch materiálu, která určuje sériové výrobní dávky SUP — a jak náš nízkoprahový program spolupráce na značce funguje pro provozovatele půjčoven, kluby, resorty a rostoucí značky vodních sportů. Vyvinuto a provozováno Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Přímá odpověď'
  text: 'MOQ není jedno číslo platné pro všechny případy. Každé MOQ se potvrzuje podle konfigurace projektu: tvaru trupu a nástroje, barevných kombinací a PVC, náročnosti grafiky, obalů a skladu příslušenství. Plně na míru šitá sériová výroba běží po 90–100 kusech na dávku ze standardní 150m role drop-stitch tkaniny; malá dávka ve spolupráci na značce začíná na 5–10 kusech; a každý projekt se člení do tří samostatných fází — vývoj vzorku (1–2 kusy), pilotní objednávka (20–50 kusů) a sériová výroba (90–100+ kusů). Přesný výpočet pro vaši kombinaci SKU potvrdíme před nabídkou — žádné vágní sliby „nízkého MOQ“ a žádné skryté kompromisy.'
  verified: 'září 2026'

moq_principle:
  tagline: Inženýrská logika
  title: 'Proč je standardní sériové MOQ 90–100 kusů: fyzika role suroviny'
  subtitle: 'Velikosti výrobních dávek nejsou libovolná čísla stanovená obchodním oddělením — určují je délky rolí surové drop-stitch tkaniny a fyzika přestavěk na lince.'
  body: |
    **Výchozí surovina — 150 metrů tkaniny.** Drop-stitch tkanina s vysokou pevností osnovy se vyrábí a potahuje na nepřetržitých hlavních rolích. Standardní délka průmyslové role pro jednu dávku je 150 metrů nepřetržitého materiálu.

    **Výpočet výtěžnosti (90 až 100 desek).** U standardního touringového nebo all-around trupu SUP (10 ft 6 in až 11 ft 6 in) dává plná hlavní role o délce 150 m přibližně 90 až 100 hotových paddle boardů.

    **Politika bez spojů tkaniny.** Plné role tkaniny zajišťují úplnou strukturální kontinuitu — žádné příčné spojování tkaniny s vysokým rizikem a rovnoměrné napnutí vláken na horní i spodní ploše desky.

    **Tepelná a adhezní kalibrace.** Automatizované vysokofrekvenční svařování horkým vzduchem a laminovací linky s mořským lepidlem vyžadují 2 hodiny předehřevu, teplotní profilování a kalibraci tlaku. Plná dávka 90–100 kusů tyto pevné náklady na nastavení rozloží a dosáhne tak nejnižší možné jednotkové ceny.

