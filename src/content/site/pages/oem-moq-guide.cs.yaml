    - icon: B
      icon_bg: green
      title: 'Malá dávka ve spolupráci na značce — pod 20 kusů'
      desc: 'Nízkoprahové řešení postavené na našich osvědčených ročních produktových kolekcích pro kluby, půjčovny a resorty — žádná těžká zásoba. · Pevný plášť a geometrie: osvědčené tvary trupu se souladem CE / ISO 25649 · Primární identifikace: oficiální branding iSupfactory ve střední části · Sekundární vlastní branding: vaše logo na přídi nebo bočních výztuhách · 100% test celé dávky — 24hodinová zkouška tlaku a nepropustnosti'
      link: '/cs/contact#cobranding'
      link_label: 'Začít s malou dávkou ve spolupráci na značce'

