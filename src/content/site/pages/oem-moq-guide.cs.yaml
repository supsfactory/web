moq_stages:
  tagline: Vzorek · Pilot · Objem
  title: 'Tři samostatné objemové fáze'
  subtitle: 'Objemy vzorků, pilotní a sériové výroby se liší. Každý projekt je zařazen do jedné ze tří samostatných úrovní, abyste nejprve ověřili a teprve poté se zavázali.'
  steps:
    - step: '01'
      title: 'Vývoj vzorku (1–2 kusy)'
      desc: 'Fyzické potvrzení tuhosti trupu, textury protiskluzové podložky EVA, přesnosti grafiky a fitu příslušenství před jakýmkoli finančním závazkem. Poplatek za vzorek se účtuje a po podpisu smlouvy se odečítá z výrobní objednávky.'
    - step: '02'
      title: 'Pilotní objednávka (20–50 kusů)'
      desc: 'Předsezonní komerční testování a validace regionálního trhu s využitím existujících platforem trupu, skladových materiálů a zjednodušených obalů, aby se minimalizovala zátěž nastavení.'
    - step: '03'
      title: 'Sériová výroba (90–100+ kusů)'
      desc: 'Potvrzena po uzavření kusovníku BOM, finalizaci grafiky, vlastních obalech a naplánovaných dodávkách — plné 150m role tkaniny, vlastní tkaniny dle Pantone, zákazkové obaly, množstevní slevy a stopovatelnost celého řetězce dávky.'

moq_factors:
  tagline: Co určuje vaše MOQ
  title: 'Proč je plně na míru MOQ vždy podle projektu'
  subtitle: 'U 100% zákazkové výroby se MOQ počítá z kompletní produktové architektury — před nabídkou se společně posoudí tyto čtyři složky.'
  headers:
    component: Složka projektu
    driver: Výrobní faktor
    impact: Vliv na minimální množství
  rows:
    - component: 'Tvar trupu a nástroj'
      driver: 'Existující formy rocker v závodě oproti zákazkovým CAD řezným nástrojům a nástrojům pro lisování EVA'
      impact: 'Existující platformy: pilotní objednávky od 20 kusů. Zákazkové trupy: nutná amortizace dedikovaného nástroje.'
    - component: 'Barevné kombinace a PVC'
      driver: 'Jedna standardní skladová barva oproti proprietárním deskám z PVC barveným na Pantone'
      impact: 'Vlastní PVC v barvě Pantone vyžaduje samostatné chemické barvicí dávky s nezávislým MOQ suroviny.'
    - component: 'Značkové obaly'
      driver: 'Obecné krabice s barcode nálepkami oproti plnobarevným 5vrstvým maloobchodním dárkovým krabicím a značkovým manuálům'
      impact: 'Vlastní barevné krabice mají nezávislé minimum offsetového tisku (typicky 500+ krabic).'
    - component: 'Balíčky příslušenství'
      driver: 'Standardní hliníková nebo nylonová pádla oproti karbonovým pádlům na míru a značkovým pumpičkám'
      impact: 'Zcela značkové příslušenství se řídí dávkami subdodavatele v nižší úrovni.'

