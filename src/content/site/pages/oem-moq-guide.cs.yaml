moq_faqs:
  tagline: FAQ
  title: 'Často kladené otázky o MOQ'
  items:
    - q: 'Počítá se MOQ na objednávku, na model, nebo na barevnou kombinaci?'
      a: 'MOQ se může vztahovat na model, barevnou kombinaci, verzi grafiky, konfiguraci obalů nebo celkovou objednávku. Protože různé tloušťky drop-stitch (12 cm oproti 15 cm) a barvy PVC pocházejí z různých rolí suroviny, objednávka 50 desek rozložených na 5 barev znamená 5 samostatných požadavků na role tkaniny. Přesný výpočet oproti vaší matici SKU potvrdíme před nabídkou, abyste mohli kombinaci plánovat přehledně.'
    - q: 'Mohu si objednat vzorek před sériovou výrobou?'
      a: 'Ano. Vývoj vzorku (1–2 kusy) ověří tuhost trupu, texturu protiskluzové podložky EVA, přesnost grafiky a fit příslušenství před uvolněním sériové výroby. Poplatek za vzorek se účtuje a po podpisu smlouvy se odečítá z výrobní objednávky.'
    - q: 'Proč má vlastní maloobchodní balení nezávislé MOQ?'
      a: 'Flexografické a offsetové tiskárny na krabice vyžadují minimální produkční dávku 500+ kusů. Nabízíme řešení Hybridní balení se skladováním: vyrobíme těch 500 vlastních potištěných krabic, přebytek uskladníme v našem čistém skladu a vydáváme je postupně s vašemi plánovanými dodávkami desek — takže i menší objednávka desek může vyrazit v plném značkovém maloobchodním balení.'
    - q: 'Proč je standardní sériové MOQ 90–100 kusů?'
      a: 'Standardní sériové MOQ vychází ze suroviny: hlavní role 150 m vysoce kvalitní drop-stitch tkaniny dává přibližně 90–100 hotových desek pro standardní touringový nebo all-around trup. Výroba z plných rolí odstraňuje spojování tkaniny, udržuje rovnoměrné napnutí vláken a rozloží 2hodinovou kalibraci svařovací a laminovací linky — a dosáhne tak nejnižší možné jednotkové ceny.'
    - q: 'Sníží vyšší množství jednotkovou cenu?'
      a: 'U většiny projektů ano. Vyšší množství zlepšuje výtěžnost materiálu, rozkládá pevné náklady na nastavení výrobní linky na více desek a snižuje jednotkové náklady na obaly.'
    - q: 'Účtují se poplatky za formy ve spolupráci na značce znovu při opakovaných objednávkách?'
      a: 'Ne. Poplatky za formu sítotisku se účtují jednou při prvním nastavení a u opakovaných objednávek se stejným rozměrem grafiky se neúčtují. Platíte pouze poplatek závodu za manipulaci a tisk ve výši $1.00 USD za desku.'
    - q: 'Zavazuje mě požadavek o poradenství k MOQ k objednávce?'
      a: 'Ne. Požadavek o poradenství k MOQ vašeho projektu pouze umožní našemu inženýrskému týmu v Qingdao Vatrad Group Co., Ltd. posoudit vaše technické zadání a doporučit nákladově nejefektivnější cestu výroby. Dojednání o mlčenlivosti (NDA) je k dispozici před sdílením proprietárních technických specifikací nebo grafiky.'

evidence_review:
  tagline: 'Důkazy a verifikace'
  title: 'OVĚŘENÉ SPECIFIKACE'
  body: 'Všechna tvrzení o výrobě na této stránce ověřil náš tým výrobního inženýrství v závodě Laixi u Qingdao. Certifikáty, záznamy kontrol kvality, zprávy o tlakových a konstrukčních zkouškách a záznamy o stopovatelnosti dávek jsou k dispozici na vyžádání. Specifikace naposledy ověřeny v září 2026.'

