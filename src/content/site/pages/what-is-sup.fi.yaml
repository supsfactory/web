  text: 'Puhallettava SUP on drop-stitch-PVC-kankaasta valmistettu seisomamelo, joka muuttuu jäykäksi täytettäessä 12–15 PSI:iin. Se vastaa suorituskyvyltään kovaa lautaa useimmissa vapaa-aika- ja matkailukäytöissä, painaa noin 8–10 kg ja pakkuu säilytystä ja matkustamista varten reppuun.'
