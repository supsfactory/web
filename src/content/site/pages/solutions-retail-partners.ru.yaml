meta:
  title: 'Индивидуальное и private-label производство SUP для ритейлеров | {SITE}'
  description: 'Индивидуальное и private-label производство SUP для розничных брендов: спецификации досок, брендированная графика, низкий пробный MOQ и заводской контроль качества — от образца до серии.'
  dateModified: '2026-08'

hero:
  tagline: Розничные бренды
  title: 'Индивидуальное производство SUP для розничных брендов'
  subtitle: 'Розничные бренды запускают собственную линейку сапбордов вместе с нашим заводом: спецификации досок, разработанные по вашим требованиям, ваш бренд на изделии и производственный контроль качества от начала до конца.'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
    alt: Доски SUP производства Vatrad для розничного бренда

answer:
  label: 'Прямой ответ'
  text: 'MOQ подтверждается конфигурацией проекта: розничные бренды начинают с образца (1–2 единицы) или пилотной партии (20–50 единиц, образцы за 7–12 дней), переходят к стандартному серийному OEM-тиражу 90–100+ единиц на каждый дизайн (25–35 дней после PO и аванса) или инвестируют в индивидуальную пресс-форму для полностью bespoke-линеек (оснастка добавляет 15–20 дней). Каждая доска проходит испытание давлением до отгрузки, с условиями FOB, CIF или DDP из Циндао.'
  verified: 'Сентябрь 2026'

margin_section:
  title: 'Этапы производства для розничных брендов'
  subtitle: 'Начните с образца, проведите пилот для валидации, выйдите на стандартный серийный тираж или инвестируйте в индивидуальную пресс-форму — MOQ и сроки определяются производственным маршрутом, а не догадками.'
  items:
    - tier: 'Этап образца'
      moq: '1–2 шт.'
      margin_note: 'Срок изготовления образца 7–12 дней'
      features:
        - 'Разработка графики по материалам вашего бренда'
        - 'Физический образец для согласования'
        - 'Контроль качества на стандартной платформе'
    - tier: 'Пилотный этап'
      moq: '20–50 шт.'
      margin_note: 'Валидация рынка на складских платформах'
      features:
        - 'Графика на всю доску, логотип и раскладка EVA'
        - 'Повторные заказы на тех же проверенных платформах'
        - 'Экспортная документация включена'
    - tier: 'Индивидуальная пресс-форма'
      moq: 'Подтверждается конфигурацией проекта'
      margin_note: 'Оснастка добавляет 15–20 дней'
      features:
        - 'Новая форма доски и разработка пресс-формы'
        - 'Полный контроль спецификаций'
        - 'Приоритетное распределение производственных мощностей'

