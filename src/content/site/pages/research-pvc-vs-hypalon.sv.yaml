  subtitle: '10 min läsning'

answer:
  label: 'Kort svar'
  text: 'För SUP-brädor vinner PVC på kostnad, vikt, tryckbarhet och möjligheten till automatiserad radiofrekvenssvetsning (RF) — ett trelagerigt marint PVC på 1 680 DTEX med UV-stabilisatorer är branschstandarden. Hypalon/CSM tål solljus och kemikalier bättre, kostar dock cirka 3&ndash;5&times; mer, väger tyngre och limmas för hand — därför används det numera sällan på SUP.'
  verified: 'September 2026'

content_html: |
  <h2>Översikt över materialen</h2>

  <h3>PVC (polyvinylklorid)</h3>
  <p>PVC är standardmaterialet för uppblåsbara SUP-brädor. För konstruktionen förstärks det vanligtvis med ett polyesterväv (1 100 – 1 680 DTEX), beläggs på båda sidor och svetsas sedan runt en drop-stitch-kärna. Moderna formuleringar av marint PVC innehåller UV-stabilisatorer och mjukgörare för att förbättra flexibilitet och väderbeständighet; brädor byggda så här motstår arbetstryck på 12 – 15 PSI.</p>

  <h3>Hypalon (CSM – klorsulfonylpolyetylen)</h3>
  <p>Hypalon är en syntetisk gummiblandning (tillverkas numera generiskt som CSM sedan DuPont avyttrade varumärket Hypalon). Det är känt för sin exceptionella beständighet mot UV och ozon och räknas som det föredragna materialet för slangväggar i professionella och kommersiella båtar som utsätts för långvarigt direkt solljus. På SUP-brädor används Hypalon sällan — brädor kräver högtrycks- och dimensionellt stabila däck, som PVC-drop-stitch-konstruktioner levererar till en bråkdel av vikten.</p>

  <h2>Direkt jämförelse</h2>
  <table class="w-full text-sm border-collapse">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-3 text-left font-semibold text-gray-900 border">Egenskap</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">PVC</th>
        <th class="p-3 text-left font-semibold text-gray-900 border">Hypalon (CSM)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="p-3 border font-medium">UV-beständighet</td><td class="p-3 border">God (med stabilisatorer)</td><td class="p-3 border">Utmärkt (inneboende)</td></tr>
      <tr><td class="p-3 border font-medium">Slitagehållfasthet</td><td class="p-3 border">God</td><td class="p-3 border">Mycket god</td></tr>
      <tr><td class="p-3 border font-medium">Draghållfasthet</td><td class="p-3 border">3 000 – 5 000 N/5cm</td><td class="p-3 border">2 500 – 4 000 N/5cm</td></tr>
      <tr><td class="p-3 border font-medium">Vikt (per m&sup2;)</td><td class="p-3 border">850 – 1 200 g</td><td class="p-3 border">1 100 – 1 500 g</td></tr>
      <tr><td class="p-3 border font-medium">Köldflexibilitet (låga temperaturer)</td><td class="p-3 border">-30&deg;C</td><td class="p-3 border">-20&deg;C</td></tr>
      <tr><td class="p-3 border font-medium">Reparerbarhet</td><td class="p-3 border">Enkel (varmsvetsning eller limning)</td><td class="p-3 border">Kräver särskilt CSM-lim</td></tr>
      <tr><td class="p-3 border font-medium">Förbandmetod</td><td class="p-3 border">RF-svetsning, varmluftssvetsning</td><td class="p-3 border">Manuell limning (kontaktlim)</td></tr>
      <tr><td class="p-3 border font-medium">Kostnad (material)</td><td class="p-3 border">$8 – $15 / m&sup2;</td><td class="p-3 border">$20 – $40 / m&sup2;</td></tr>
      <tr><td class="p-3 border font-medium">Livslängd (tropisk sol)</td><td class="p-3 border">5 – 8 år</td><td class="p-3 border">10 – 15 år</td></tr>
    </tbody>
  </table>

  <h2>Vad ska du välja?</h2>

  <h3>Välj PVC när:</h3>
  <ul>
    <li>Du bygger uppblåsbara SUP-brädor (PVC + drop-stitch är branschstandarden)</li>
    <li>Brädans vikt spelar roll — PVC är 15 – 25 % lättare</li>
    <li>Du behöver köldflexibilitet under -20&deg;C</li>
    <li>Du vill ha ett bredare urval av färg- och ytbehandlingsalternativ</li>
    <li>Du behöver högt arbetstryck (12 – 15 PSI) för ett styvt och stabilt däck</li>
  </ul>

  <h3>Välj Hypalon när:</h3>
  <ul>
    <li>Produkten ligger eller lagras i full sol under flera år</li>
    <li>Du arbetar i tropisk miljö eller med kraftig UV utan lagringsmöjligheter</li>
    <li>Maximal livslängd väger tyngre än vikt och kostnad</li>
    <li>Du bygger professionella eller kommersiella båtar, såsom RIB</li>
    <li>Slitage från sand, betong eller bryggor är en viktig oro</li>
  </ul>

  <h2>Skillnader i produktion</h2>
  <p>PVC-brädor tillverkas genom RF-svetsning (radiofrekvens) eller varmluftssvetsning, vilket skapar en molekylär bindning mellan de belagda tyglagren. Det möjliggör automatiserad, konsekvent och lönsam tillverkning med hög noggrannhet på fogstyrkan i högtrycksbrädor. Hypalon monteras för hand med kontaktlim; varje fog rullas och pressas manuellt, vilket gör Hypalon-tillverkningen arbetskrävande och lämplig för konstruktion av lågtrycks-RIB.</p>

  <h2>Vatrads rekommendation</h2>
  <p>För uppblåsbara SUP-brädor ger modernt PVC av hög kvalitet med UV-stabilisatorer den bästa balansen mellan kostnad, vikt, prestanda och livslängd. Vatrad bygger varje SUP med marint PVC på 1 680 DTEX, trelagerbeläggning och en drop-stitch-kärna som är utformad för 15 PSI — där varje tygparti oberoende testas före produktionen i vårt laboratorium för PVC-tyger. Hypalon finns fortfarande tillgängligt på begäran för kommersiella båtar och speciella tillämpningar, tillverkade separat via vår kommersiella marinlina.</p>
  <p>Materialvalet avgör kostnaden, vikten och livslängden för ditt sortiment — berätta vilken målmarknad du har, så <a href="/sv/oem-manufacturing">specificerar vi rätt tyg för ditt OEM-projekt</a>, testat i vårt <a href="/sv/randdcenter/quality-inspection-lab">materialtestlaboratorium</a>.</p>

