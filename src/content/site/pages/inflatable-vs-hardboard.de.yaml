body: |
  <h2>Die Kernunterschiede</h2>
  <p>Aufblasbare SUPs (iSUPs) und harte Boards erfüllen denselben grundlegenden Zweck — Stehen und Paddeln auf dem Wasser — erreichen dies jedoch über völlig unterschiedliche Konstruktionsmethoden. Die richtige Wahl hängt davon ab, wie Sie das Board einsetzen möchten.</p>

  <table>
    <tr><th>Faktor</th><th>Aufblasbares SUP</th><th>Hartes SUP</th></tr>
    <tr><td>Konstruktion</td><td>Drop-Stitch-PVC, auf 12–15 PSI aufgeblasen</td><td>EPS-Schaumkern, ummantelt mit Glasfaser oder Epoxid</td></tr>
    <tr><td>Gewicht</td><td>18–28 lbs (nur Board)</td><td>20–30 lbs (nur Board)</td></tr>
    <tr><td>Packmaß</td><td>Rucksack (30 × 15 × 10 Zoll)</td><td>Volle Länge (10–14 ft)</td></tr>
    <tr><td>Aufbau</td><td>3–5 Minuten Aufpumpen</td><td>Sofort einsatzbereit</td></tr>
    <tr><td>Lebensdauer</td><td>5–10 Jahre bei guter Pflege</td><td>3–8 Jahre (neigt zu Dellen)</td></tr>
  </table>

  <h2>Tragbarkeit</h2>
  <p><strong>Aufblasbar gewinnt.</strong> Das ist der klarste Vorteil. Ein aufblasbares SUP lässt sich in einen Rucksack packen, der in einen Autokofferraum, einen Wohnungsschrank oder das Gepäckfach eines Flugzeugs passt. Reisende, Wohnungsbewohner und alle ohne Dachgepäckträger finden aufblasbare SUPs deutlich praktischer.</p>
  <p>Harte Boards erfordern einen Dachgepäckträger, ein großes Fahrzeug oder einen eigenen Stellplatz. Sie sind schwer zu transportieren und können ohne spezielle Versandboxen nicht ins Flugzeug mitgenommen werden.</p>

  <h2>Haltbarkeit</h2>
  <p><strong>Aufblasbar gewinnt.</strong> Aufblasbare SUPs werden aus PVC in Militärqualität hergestellt, das Stößen, Einstichen und UV-Schäden widersteht. Lässt man ein aufblasbares Board fallen oder trifft auf einen Felsen, federt es zurück. Ein hartes Board würde durch denselben Aufprall absplittern, brechen oder delaminieren.</p>
  <p>Harte Boards sind anfälliger für alltäglichen Verschleiß. Ein einziger Sturz auf Beton kann eine dauerhafte Delle verursachen, die die Leistung beeinträchtigt und Wassereintritt ermöglicht.</p>

  <h2>Leistung</h2>
  <p><strong>Hartboard gewinnt an der Spitze.</strong> Beim Freizeitpaddeln und Touren bei moderaten Geschwindigkeiten verhalten sich beide Boardtypen ähnlich. Harte Boards haben Vorteile bei:</p>
  <ul>
    <li><strong>Geschwindigkeit</strong> —Harte Boards sind leichter und steifer, was zu besserem Gleiten und höherer Spitzengeschwindigkeit führt</li>
    <li><strong>Surfen</strong> —Harte Boards bieten reaktionsschnellere Rail-zu-Rail-Übergänge und besseres Wellenverhalten</li>
    <li><strong>Rennen</strong> —Beim Wettkampf-Rennsport werden fast ausschließlich harte Boards wegen ihres Gewichts- und Steifigkeitsvorteils eingesetzt</li>
  </ul>
  <p>Für den durchschnittlichen Freizeitpaddler sind diese Leistungsunterschiede marginal. Die meisten Paddler werden ein hochwertiges aufblasbares Board nicht übertreffen.</p>

  <h2>Anfängerfreundlichkeit</h2>
  <p><strong>Aufblasbar gewinnt.</strong> Aufblasbare SUPs sind für Anfänger einfacher, weil:</p>
  <ul>
    <li>Die weichere Deckoberfläche bequemer ist und bei Stürzen seltener Verletzungen verursacht</li>
    <li>Breitere, dickere aufblasbare Boards mehr Primärstabilität bieten</li>
    <li>Geringere Anschaffungskosten den Einstieg erschwinglicher machen</li>
    <li>Einfacher Transport mehr Paddelgelegenheiten bedeutet</li>
  </ul>

  <h2>Lagerung und Pflege</h2>
  <p>Aufblasbare SUPs müssen vor der Lagerung getrocknet und ordnungsgemäß gefaltet werden. Harte Boards können montiert gelagert werden, benötigen aber Schutz vor Sonne, Hitze und Stößen. Beide profitieren von einem Abspülen mit Süßwasser nach dem Einsatz im Salzwasser.</p>

  <h2>Empfehlung</h2>
  <p><strong>Wählen Sie ein aufblasbares SUP, wenn:</strong> Sie reisen, wenig Stauraum haben, freizeitmäßig paddeln oder Anfänger sind. 90 % der Paddler sind mit einem hochwertigen aufblasbaren Board gut bedient.</p>
  <p><strong>Wählen Sie ein hartes Board, wenn:</strong> Sie wettkampfmäßig Rennen fahren, anspruchsvolle Wellen surfen oder maximale Leistung über Tragbarkeit und Haltbarkeit stellen.</p>

  <h2>FAQ</h2>
  <h3>Welches ist haltbarer: aufblasbares oder hartes SUP?</h3>
  <p>Aufblasbare SUPs sind im Allgemeinen haltbarer, weil sie Dellen, Rissen und Aufprallschäden widerstehen, die ein hartes Board dauerhaft beschädigen würden.</p>

  <h3>Ist ein aufblasbares SUP besser für Anfänger geeignet?</h3>
  <p>Ja. Aufblasbare SUPs werden für Anfänger empfohlen, weil sie verzeihender, einfacher zu transportieren sind und bei Stürzen seltener Verletzungen verursachen.</p>

  <h3>Können aufblasbare SUPs so gut abschneiden wie harte Boards?</h3>
  <p>Für Freizeitpaddeln und Touren erreichen aufblasbare SUPs die Leistung harter Boards. Harte Boards sind im Rennsport und beim anspruchsvollen Surfen weiterhin überlegen, da sie leichter sind und ein verfeinertes Flexverhalten aufweisen.</p>

