answer:
  label: 'Közvetlen válasz'
  text: 'Az MOQ-t a projekt konfigurációja határozza meg: a kiskereskedelmi márkák egy mintával (1–2 darab) vagy egy pilóta szállítmánnyal (20–50 darab, minták 7–12 nap alatt) indulnak, majd 90–100+ darab modellenkénti standard OEM tömeggyártásra (25–35 nap a megrendelés és az előleg után) lépnek, vagy teljesen egyedi sorokhoz testreszabott szerszámot vásárolnak (a szerszám további 15–20 napot ad hozzá). Minden deszkát kiszállítás előtt nyomáspróbázunk, a qingdaói FOB, CIF vagy DDP feltételekkel.'
  verified: '2026. szeptember'

margin_section:
  title: 'A gyártás szakaszai a kiskereskedelmi márkák számára'
  subtitle: 'Induljon mintával, végezzen pilótát a validáláshoz, skálázza standard tömeggyártásra, vagy fektessen be testreszabott szerszámba – az MOQ-t és a határidőket a gyártási útvonal határozza meg, nem feltételezések.'
  items:
    - tier: 'Mintaszakasz'
      moq: '1–2 darab'
      margin_note: 'Minták 7–12 nap alatt'
      features:
        - 'A grafika fejlesztése az Ön márkaanyagai alapján'
        - 'Fizikai minta jóváhagyásra'
        - 'Minőségi ellenőrzés a standard platformon'
    - tier: 'Pílótaszakasz'
      moq: '20–50 darab'
      margin_note: 'Piacvalidáció raktáron lévő platformokon'
      features:
        - 'Grafika a teljes deszkán, logó és EVA elhelyezés'
        - 'Ugyanazok a bizonyított platformok'
        - 'Exportdokumentáció mellékelve'
    - tier: 'Testreszabott szerszám'
      moq: 'A projekt konfigurációja szerint'
      margin_note: 'A szerszám további 15–20 napot ad hozzá'
      features:
        - 'Új deszkaforma és szerszámfejlesztés'
        - 'Teljes ellenőrzés a specifikációk felett'
        - 'Elsőbbségi gyártókapacitás-elosztás'

