meta:
  title: 'Produção SUP personalizada & private label para retalhistas | {SITE}'
  description: 'Produção SUP personalizada e private label para marcas comerciais: especificações das pranchas, gráficas da marca, MOQs de teste baixos e QC de fábrica — da amostra à série.'
  dateModified: '2026-08'

hero:
  tagline: Marcas comerciais
  title: 'Produção SUP personalizada para marcas comerciais'
  subtitle: 'As marcas comerciais lançam a sua linha de paddle boards com a nossa fábrica: especificações das pranchas desenvolvidas a partir dos teus requisitos, a tua marca no produto e QC de produção assumido de forma contínua.'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
    alt: Pranchas SUP Vatrad, produzidas para uma marca comercial

answer:
  label: 'Resposta breve'
  text: 'A MOQ é confirmada pela configuração do projeto: as marcas comerciais começam com uma amostra (1–2 unidades) ou uma pequena série piloto (20–50 unidades, amostras em 7–12 dias), escalam para uma série OEM padrão de 90–100+ unidades por design (25–35 dias após a PO e o sinal) ou investem numa forma personalizada para linhas completamente individuais (o equipamento acrescenta 15–20 dias). Cada prancha é testada em pressão antes do envio, com condições FOB, CIF ou DDP de Qingdao.'
  verified: 'September 2026'

margin_section:
  title: 'Níveis de produção para marcas comerciais'
  subtitle: 'Começa com uma amostra, valida com uma série piloto, escala para uma série padrão ou investe numa forma personalizada — MOQ e tempos de entrega são determinados pelo percurso produtivo, não por cotas.'
  items:
    - tier: 'Nível de amostra'
      moq: '1–2 unidades'
      margin_note: 'Entrega de amostras em 7–12 dias'
      features:
        - 'Desenvolvimento gráfico a partir dos recursos da tua marca'
        - 'Amostra física para a aprovação'
        - 'QC em plataforma padrão'
    - tier: 'Nível piloto'
      moq: '20–50 unidades'
      margin_note: 'Validação de mercado em plataformas existentes'
      features:
        - 'Gráficas a toda a superfície, logótipo e layout EVA'
        - 'Reencomendas nas mesmas plataformas aprovadas'
        - 'Documentação de exportação incluída'
    - tier: 'Forma personalizada'
      moq: 'Confirmado pela configuração do projeto'
      margin_note: 'O equipamento acrescenta 15–20 dias'
      features:
        - 'Nova forma da prancha e desenvolvimento do molde'
        - 'Controlo total das especificações'
        - 'Atribuição produtiva prioritária'

