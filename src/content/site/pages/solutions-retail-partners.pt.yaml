  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Aprofunda:</strong> descobre o <a href="/pt/oem-manufacturing">programa de produção OEM/ODM completo</a> — MOQs confirmados por projeto através dos níveis amostra, piloto e série, branding private label e conformidade CE — ou lê o <a href="/pt/oem-moq-guide">guia MOQ & branding flexível</a> ou visita a <a href="/pt/factory">fábrica</a> para ver como é implementado o QC pronto para o comércio.</p>
