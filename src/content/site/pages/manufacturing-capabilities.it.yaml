hero:
  tagline: Capacità di produzione
  title: 'Capacità di produzione SUP'
  subtitle: 'Ogni processo — ingegneria dello scafo, lavorazione del nucleo drop-stitch, saldatura ad alta frequenza, stampa, attrezzaggio, assemblaggio, collaudo e imballaggio — avviene internamente nel nostro stabilimento di 12,500 m² a Qingdao. Un unico team responsabile gestisce il tuo progetto dal primo disegno fino al container spedito.'

answer:
  label: 'Risposta breve'
  text: 'La produzione SUP è completamente interna nel nostro stabilimento di Qingdao: progettazione dello scafo e ingegneria dimensionale con precisione CNC di 0,1 mm; lavorazione del materiale drop-stitch e saldatura ad alta frequenza su 4 linee automatizzate; stampa grafica; fustellatura dei pad in EVA; attrezzaggio interno (+15–20 giorni per nuove forme); assemblaggio secondo una checklist a 100 punti e un test di tenuta di pressione di 24 ore a 18,0 PSI con scarto automatico in caso di calo superiore a 0,50 PSI. La capacità annuale è di 120.000+ tavole (circa 10.000/mese) in 4 officine specializzate con 350+ dipendenti, consegnate in oltre 50 Paesi con il tuo marchio.'
  verified: 'September 2026'

