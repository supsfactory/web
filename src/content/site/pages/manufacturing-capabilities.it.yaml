faq_section:
  tagline: FAQ
  title: Domande sulle capacità di produzione SUP
  questions:
    - q: Quali processi di produzione avvengono internamente?
      a: 'Tutti i processi chiave sono interni: ingegneria dello scafo, lavorazione del nucleo drop-stitch, saldatura ad alta frequenza, stampa, fustellatura EVA, assemblaggio, collaudo e imballaggio. Accessori e alcune materie prime provengono da fornitori certificati; la composizione finale del kit avviene internamente per una tracciabilità completa.'
    - q: Qual è la vostra capacità produttiva?
      a: '120.000+ tavole all''anno (circa 10.000/mese) su 4 linee automatizzate e 4 officine specializzate su 12,500 m² con oltre 350 dipendenti.'
    - q: Quale quantità minima d'ordine si applica a queste capacità?
      a: 'La quantità standard parte da 90–100+ unità per configurazione approvata (un rotolo da 150 m di tessuto drop-stitch); i lotti pilota partono da 20–50 unità su piattaforme esistenti; gli ordini solo logo partono da 5–10 unità.'
    - q: Quali tempi di consegna dobbiamo mettere in conto?
      a: 'Campioni prototipo in 7–12 giorni; produzione 25–35 giorni dopo ordine confermato e acconto; l''attrezzaggio per forme su misura aggiunge 15–20 giorni.'
    - q: In che modo le capacità influiscono sulla qualità?
      a: 'Ogni processo alimenta il sistema qualità in 7 fasi: checklist di assemblaggio a 100 punti, tenuta di pressione 18,0 PSI per 24 ore con scarto automatico oltre 0,50 PSI di calo, campionamento secondo ISO 2859-1 Livello II e tracciabilità dei lotti ERP per 10 anni.'

