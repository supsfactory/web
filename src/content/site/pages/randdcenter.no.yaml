capabilities:
  tagline: Kapasitet
  title: F&U-kapasitet
  subtitle: Fire kjernedisipliner gir oss full kontroll over produktutviklingen fra start til slutt — fra råvareforskning til endelig sertifisering.
  groups:
    - title: Materialvitenskap & stoffteknologi
      items:
        - Analyse og optimalisering av PVC- og Hypalon-formuleringer
        - Utvikling av UV-stabilisering, flammehemming og antimikrobielle tilsetninger
        - Flerlagslaminering av stoffer og teknikker for limfuger
        - Akselererte aldrings tester (UV, termisk, fukt, saltspray)
    - title: Skrogbyggingsteknologi & hydrodynamikk
      items:
        - Parametrisk 3D-skrogdesign og CFD-optimalisering
        - Elementanalyse for strukturelle og støtbelastninger
        - Slippprøver i tank med modeller og ytelsesvalidering
        - Tilpasset skrogutvikling for spesielle bruksområder
    - title: Sveiseteknologi & forbandsteknologi
      items:
        - Utvikling og optimalisering av den dielektriske HF-sveiseprosessen
        - Varmlufts-, varmlims- og ultralydsveiseprosesser
        - Kvalifisering av limfuger og fugesoner
        - Modellering av sveisestyrke og levetidsprognose
    - title: Testing, sertifisering & samsvar
      items:
        - Kvalitetsledelse og CE-samvarstester
        - Støtte til uavhengige partitester og sertifisering av tredjepart
        - Utvikling av tilpassede testprotokoller for innkjøpskvalifisering
        - Analyse av feltfeil og årsaksundersøkelse

