vision:
  tagline: Vår visjon
  title: Forme vannsportens framtid
  body: Vatrad streber etter å lede bransjen for gummibåter og SUP gjennom kontinuerlig innovasjon, konsekvent kvalitet og et sterkt engasjement for sikkerhet og bærekraft — og dermed berike vannsportsentusiastens opplevelser over hele verden. Vatrads F&U-senter er stedet der lidenskap møter innovasjon, og der nye målestokker settes for vannsportsbransjen.

labs_section:
  tagline: Laboratorier
  title: Laboratoriene våre
  labs:
    - image: https://assets.isupfactory.com/images/sups/randd/isupfactory-pvc-material-lab.webp
      title: Laboratorium for PVC-stoffer
      description: Kontinuerlig forskning og testing av oppblåsbare PVC- og Hypalon-materialer med hensyn til strekkstyrke, UV-bestandighet, slitasje og kuldefleksibilitet, for langsiktig pålitelighet i maritime miljøer.
      href: /no/randdcenter/pvc-fabric-lab
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-2.webp
      title: Studio for skrogbyggingsteknologi
      description: CAD-støttet design og elementanalyse av skrog i HDPE, aluminium og glassfiber. Hvert skrog simuleres digitalt for spenningsfordeling og slaghållfasthet før den første prototypen bygges.
      href: /no/randdcenter/hull-engineering
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing-3.webp
      title: HF-sveisingssenter
      description: Spesialisert høyfrekvenssveiseanlegg med nøyaktig kontroll av temperatur og trykk, som produserer ekstremt sterke, lufttette sømmer iht. bransjestandarder for oppblåsbare båter.
      href: /no/randdcenter/rf-welding
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-design-discussion-original.webp
      title: Hydrodynamisk slippbælter
      description: Modellprøving i slippbælten vår for å optimalisere skrogform, utrulling, stabilitet og effektivitet over et intervall av last- og bølgeforhold.
      href: /no/randdcenter/hydrodynamic-test-tank
    - image: https://assets.isupfactory.com/images/sups/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypeverksted
      description: Anlegg i full størrelse for prototyper og ferdigstillelse, der nye modeller bygges, ferdigstilles og prøves på vannet. Hver prototype gjennomgår et vanntestprogram på minst 20 timer før den godkjennes for produksjon.
      href: /no/randdcenter/prototype-workshop
    - image: https://assets.isupfactory.com/images/sups/factory/isupfactory-uv-resistance-testing.webp
      title: Kvalitets- og testlaboratorium
      description: Dedikert kvalitetslaboratorium for strekkprøving, lufttetthetssykluser, sveisesømprøving og materialsertifisering, for å sikre at hvert brett som forlater verkstedet oppfyller de publiserte spesifikasjonene våre.
      href: /no/randdcenter/quality-inspection-lab
