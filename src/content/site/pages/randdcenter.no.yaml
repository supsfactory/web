hero:
  tagline: F&U-senter
  title: F & U-senter
  subtitle: Fokus på fremskritt

intro:
  - Vatrads forsknings- og utviklingssenter (F&U) er drivkraften bakter vårt oppdrag om å fornye vannsportsutstyr. Med utrettelig innovasjon innen oppblåsbare stand up paddleboards (SUP) og gummibåter muliggjør vi tryggere, mer behagelige og vakrere produkter for vannsportsentusiaster over hele verden. Det dedikerte teamet vårt av ingeniører, designere og erfarne vannsportsentusiaster former bransjens framtid og hever stadig standarden for kvalitet, ytelse og holdbarhet.
  - Vårt F&U-anlegg samler materialforskere, marineingeniører og produksjonsingeniører under ett tak. Fra stoffformulering og skipsimulering til utvikling av sveiseprosesser og storskala vannprøving — hver fase av produktutviklingen styres av data og valideres gjennom testing.

