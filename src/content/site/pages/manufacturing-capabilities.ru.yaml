hero:
  tagline: Производственные возможности
  title: 'Производственные возможности SUP'
  subtitle: 'Все процессы — проектирование корпуса, обработка сердцевины drop-stitch, РФ-сварка, печать, оснастка форм, сборка, испытания и упаковка, — выполняются собственными силами на нашей площадке 12,500 m² в Циндао, поэтому одна ответственная команда ведёт ваш проект от первого чертежа до отгруженного контейнера.'

answer:
  label: 'Прямой ответ'
  text: 'Производство SUP полностью выполняется собственными силами на нашей площадке в Циндао: проектирование корпуса и размерная инженерия с точностью 0.1 mm на станках с ЧПУ; обработка материалов drop-stitch и РФ-сварка на 4 автоматизированных линиях; печать графики; вырубка накладок EVA; кастомная оснастка форм (+15–20 дней для новых форм); сборка по чек-листу из 100 пунктов; а также 24-часовое испытание с выдержкой давления 18.0 PSI с автоматическим браком при падении более 0.50 PSI. Годовая мощность составляет более 120,000 досок (~10,000 в месяц) на 4 специализированных цехах с 350+ работниками, отгружаемых более чем в 50 стран под вашим брендом.'
  verified: 'Сентябрь 2026'

