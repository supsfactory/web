faq_section:
  tagline: FAQ
  title: Вопросы о производственных возможностях по SUP
  questions:
    - q: Какие производственные процессы выполняются собственными силами?
      a: 'Все ключевые процессы выполняются собственными силами: проектирование корпуса, обработка сердцевины drop-stitch, РФ-сварка, печать, вырубка EVA, сборка, испытания и упаковка. Аксессуары и часть сырья поступают от сертифицированных поставщиков; финальная комплектация выполняется собственными силами для полной прослеживаемости.'
    - q: Какова ваша производственная мощность?
      a: 'Более 120,000 досок в год (около 10,000 в месяц) на 4 автоматизированных линиях и 4 специализированных цехах на площадке 12,500 m² с 350+ работниками.'
    - q: Какой MOQ применяется к этим возможностям?
      a: 'Стандартный тираж составляет 90–100+ единиц на каждую утверждённую конфигурацию (один рулон ткани drop-stitch 150 m); пилотные тиражи начинаются с 20–50 единиц на существующих платформах; заказы только с логотипом — от 5–10 единиц.'
    - q: Какие сроки следует планировать?
      a: 'Образцы прототипов — 7–12 дней; производство — 25–35 дней после подтверждения PO и внесения аванса; разработка кастомной формы добавляет 15–20 дней на оснастку.'
    - q: Как возможности трансформируются в качество?
      a: 'Каждый процесс питает 7-этапную систему качества: чек-лист сборки из 100 пунктов, 24-часовая выдержка давления 18.0 PSI с автоматическим браком при падении более 0.50 PSI, выборка ISO 2859-1 уровня II и 10-летняя прослеживаемость партий в ERP.'

