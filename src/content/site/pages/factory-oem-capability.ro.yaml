services:
  - title: Proiectare și inginerie de produs
    description: Echipa noastră internă de cercetare și dezvoltare lucrează împreună cu conceptul sau specificațiile dumneavoastră pentru a dezvolta desene CAD, modele 3D și prototipuri. Oferim proiectarea matrițelor, optimizarea formei corpului și consultanță privind selecția materialelor.
  - title: Branding și grafică personalizate
    description: Tipărire digitală full-color, serigrafie, embossing și opțiuni de etichete. Dezvoltăm grafică de deck specifică mărcii, branding pe tuburi și ambalaje pregătite pentru retail.
  - title: Personalizarea materialelor și specificațiilor
    description: Alegeți dintre PVC (standard, ecologic, ignifug), Hypalon/CSM, drop-stitch și construcții hibride. Culori personalizate pentru tuburi, gramaje de țesătură și opțiuni de ranforsare.
  - title: Ambalare și logistică
    description: Ambalaje retail personalizate, cutii private label, ambalare în vid, paletizare și ambalare de calitate export pregătite în regim propriu.

moq_table:
  - product: Plăci SUP gonflabile
    standard_moq: 'Mostră 1–2 | Pilot 20–50'
    custom_moq: 'Volum 90–100+ (pe rolă de 150 m)'
    lead_time: 25–35 zile

why_us:
  - title: Integrare verticală
    description: Deținem fabrica, matrițele și lanțul de aprovizionare — fără intermediari, fără subcontractori. Acest lucru ne oferă control asupra calității, costului și livrării.
  - title: Certificare dublă
    description: Managementul calității ISO 9001 și certificarea de conformitate socială BSCI. Rapoartele de audit al fabricii sunt disponibile la cerere.
  - title: Conformitate CE
    description: Certificarea CE se aplică modelelor destinate piețelor Uniunii Europene (domeniul se confirmă proiect cu proiect). Modelele personalizate pot fi certificate CE prin procesul nostru deja stabilit.
  - title: MOQ adaptat proiectului
    description: 'MOQ-ul este confirmat în funcție de configurația proiectului — producția în loturi mici cu marcă comună începe de la 5–10 unități, iar volumul standard rulează cu 90–100+ unități pe lot. Ajutăm mărcile în curs de afirmare să se lanseze fără a se angaja excesiv în stocuri.'

