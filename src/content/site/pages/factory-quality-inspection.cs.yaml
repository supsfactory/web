faqs:
  tagline: FAQ
  title: Často kladené otázky o kontrole kvality SUP
  items:
    - q: 'Jak QINGDAO VATRAD GROUP.,LTD. řídí kvalitu nafukovacích desek SUP?'
      a: 'Kvalita se řídí vstupní kontrolou materiálu, kontrolními body ve výrobním procesu, závěrečným ověřením výrobku, kontrolou balení a vysledovatelností výroby — každý krok se provádí proti projektem schváleným vzorkům, specifikacím a kontrolním kritériím.'
    - q: 'Jaké kontroly kvality se provádějí během výroby SUP?'
      a: 'Kontroly zahrnují ověření materiálu, kontrolu řezání a potisku, kontrolu konstrukce desky, ověření montáže ventilu, kontrolu příslušenství, zkoušení nepropustnosti, vizuální kontrolu a ověření balení.'
    - q: 'Mohou zákazníci OEM vyžádat kontrolní záznamy výroby SUP?'
      a: 'Ano. Kontrolní záznamy a dokumentace kvality lze dodat podle projektových požadavků a dohody o kvalitě, a to včetně ukázkových protokolů kontroly před odesláním.'
    - q: 'Jak závod zajišťuje stálost kvality výroby OEM?'
      a: 'Stálost kvality se udržuje prostřednictvím schválených vzorků, technických specifikací, kontrolních bodů výroby, kontrolních postupů a zdokumentovaných procesů kvality propojených s každou objednávkou.'
    - q: 'Mohu sjednat kontrolu třetí stranou SGS, BV, Intertek nebo QIMA?'
      a: 'Ano. Inspektory třetích stran přijímáme s vyhrazenou kontrolní zónou, kalibrovanými tlakovými měřidly, předem vyplněnými kontrolními briefy a dostupnými záznamy. Pošlete nám svou specifikaci, schválený vzorek, grafiku, požadavky na obaly a kritéria vad — nebo použijte naši šablonu Briefu pro kontrolu třetí stranou.'
    - q: 'Jak se během výroby řeší změny grafiky, kusovníku nebo obalů?'
      a: 'Změny se zaznamenávají v našem Protokolu řízení změn s uvedenou dotčenou revizí dokumentu, souhrnem změny, důvodem, posouzením dopadů, stavem souhlasu zákazníka a účinnou dávkou. Zastaralé verze se stahují, takže výroba i kontrola vždy používají aktuální schválené dokumenty.'
    - q: 'Podporuje závod individuální projekty nafukovacích SUP?'
      a: 'Ano. Individuální projekty OEM/ODM nafukovacích SUP podporujeme na základě specifikací zákazníka, požadavků na grafiku, konfigurace příslušenství a potřeb obalů, přičemž projektová kontrolní kritéria se dohodnou ještě před výrobou.'
    - q: 'Lze v závodě opravit protékající desku SUP?'
      a: 'Ano — za řízených podmínek. Deska se umístí do stavu BLOKACE a propojí s NCR, netěsnost se vyhledá schválenou diagnostickou metodou a oprava pokračuje až po oprávnění QC/Techniky a pouze v rámci tříd vad schválených k opravě. Deska se poté znovu zkontroluje proti stejným kritériím přijetí jako vyhovující deska a teprve poté se uvolní.'
    - q: 'Kolikrát může závod desku opravit?'
      a: 'Jedno místo lze opravit jednou podle oprávněného pokynu. Pokud opětovná kontrola stále nevyhovuje, deska se eskaluje k výměně, odmítnutí, zmetu nebo úlevě zákazníka — opakovaná oprava bez zdokumentovaného schválení není povolena.'

cta:
  title: Potřebujete ukázkový kompletní balíček kvality projektu?
  desc: 'Pro svůj projekt OEM/ODM si vyžádejte anonymizovaný balíček podpory kontroly třetí stranou a Plán kontroly kvality (QIP) — nebo si stáhněte ukázkové šablony a seznáte se se strukturou dokumentace, kterou pro svou objednávku můžete očekávat.'
  actions:
    - text: Vyžádat posouzení kvality
      variant: primary
      href: /cs/contact
    - text: Stáhnout ukázkový balíček kvality (PDF)
      href: 'https://assets.isupfactory.com/site/downloads/Qingdao_Vatrad_Group_SUP_Quality_Documentation_Pack.pdf?dl=1'
    - text: Stáhnout kontrolní protokol a kontrolní list PSI
      href: 'https://assets.isupfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_Quality_Inspection_Standards.pdf?dl=1'
