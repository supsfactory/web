      title: Oblast zkoušek nepropustnosti
      desc: 'Nafouknuté desky drží v oblasti zkoušek QC v průmyslovém osvětlení, přičemž digitální tlakové měřidla sledují schválenou zkoušku udržení tlaku u patice ventilu, švů výztuhy, přední a zadní části a míst s vysokým namáháním. Záznamy se vedou po dávkách a propojují se závěrečnou kontrolou.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
