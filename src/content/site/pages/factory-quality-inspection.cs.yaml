      title: Ukázka karantény v dílně
      desc: 'Ukázková fotografie z dílny, která dokládá, jak řízené oddělení v karanténě funguje na místě: oddělené jednotky zůstávají pod řízením stavu, dokud není dokončeno oprávněné rozhodnutí.'

rework_intro:
  tagline: Řízení oprav
  title: Řízení nevyhovujících výrobků a oprav z hlediska nepropustnosti
  body: |
    V QINGDAO VATRAD GROUP.,LTD. je oprava přísně definována jako uvedení nevyhovující jednotky do plného souladu s původní inženýrskou specifikací — nikoli jako rychlá oprava. Jakákoli deska označená nesouladem v nepropustnosti se umístí pod řízenou blokaci a propojí s Protokolem o nesouladu (NCR) před dalším zpracováním; zdroj netěsnosti se vyhledá a zaznamená schválenou diagnostickou metodou.

    Oprava může pokračovat pouze tehdy, když vada spadá do schváleného rozsahu oprav a je k dispozici oprávněná metoda. Opravný pokyn určuje výrobek, dávku, místo vady, schválený materiál, metodu, požadované podmínky a rozsah opětovné kontroly. Po požadované době vytvrdnutí nebo stabilizace se deska znovu zkontroluje proti stejným použitelným kritériím přijetí jako vyhovující deska — oprava nikdy nesnižuje přijímací normu. Neúspěšná opětovná kontrola vyžaduje nové rozhodnutí techniky a kvality; opakovaná oprava není povolena bez zdokumentovaného schválení.

rework_decision:
  tagline: Interaktivní schéma
  title: Rozhodovací schéma opravy — klikněte na libovolný uzel
  subtitle: Sledujte, jak se nakládá s nesouladem v nepropustnosti od zjištění po uvolnění nebo zmet. Kliknutím na uzel rozbalíte kontrolní požadavky daného kroku.
  nodes:
    - id: detect
      type: start
      label: Zjištěna netěsnost
      detail: 'Při kontrole je zjištěn nesoulad v nepropustnosti — selhání udržení tlaku, viditelný únik nebo související vada systému vzduchu.'
    - id: hold
      type: step
      label: Zastavit linku · štítek BLOKACE · NCR
      detail: 'Zpracování se zastaví. Zaznamená se ID desky, kód výrobku, dávka, pracoviště, datum a kontrolor; přiloží se štítek BLOKACE / KARANTÉNA a založí se NCR proti příslušné revizi specifikace.'
    - id: locate
      type: step
      label: Určit zdroj netěsnosti
      detail: 'Deska se dofukuje na projektem schválený diagnostický tlak a zdroj se určí schválenou metodou — sledováním udržení tlaku, kalibrovanou bublinkovou zkouškou, akusticky nebo detektorem netěsnosti.'
    - id: classify
      type: step
      label: Klasifikovat vadu (A–G)
      detail: 'Vada se zařadí podle schvalovací matice: A rozhraní ventilu, B šev patice ventilu, C bodový otvor povrchu, D místní šev výztuhy, E rozsáhlé selhání výztuhy, F opakovaná netěsnost, G strukturální poškození.'
    - id: authorize
      type: decision
      label: Je oprava oprávněná?
      yes: rework
      no: escalate
      detail: 'QC potvrzuje kategorii vady a Technika posuzuje, zda lze desku uvést do souladu s původní specifikací. Oprávnění zaznamenává kartu metody, materiály, podmínky a rozsah opětovné kontroly — nebo směřuje věc k výměně, odmítnutí, zmetu či úlevě schválené zákazníkem.'
    - id: rework
      type: step
      label: Řízená oprava
      detail: 'Provádí se výhradně v mezích schválené hranice vady, se schválenou kartou metody, dávkou materiálu a nástroji — nikdy se nemění rozměry, konstrukce, grafika, příslušenství ani obalové požadavky.'
    - id: cure
      type: step
      label: Vytvrzení a stabilizace
      detail: 'Deska zůstává ve stavu BLOKACE po celou dobu vytvrzování a stabilizace stanovenou schváleným materiálem a procesním pokynem a poté absolvuje vizuální kontrolu zpracování.'
    - id: reinspect
      type: decision
      label: Opětovná kontrola vyhověla?
      yes: release
      no: escalate
      detail: 'Deska se dofukuje na projektem schválený tlak pro opětovnou kontrolu a znovu se ověří původní selhání i všechny potenciálně dotčené vlastnosti — místo netěsnosti, ventil, výztuhy, švy, namáhané oblasti, příslušenství a vzhled. Oprava nikdy nesnižuje přijímací normu.'
    - id: release
      type: release
      label: Uvolnění kvalitou
      detail: 'Kvalita posoudí uzavřené NCR, opravný záznam a výsledek opětovné kontroly a autorizuje uvolnění. Žádná opravená deska se nezabalí ani neodešle bez oprávněného uvolnění kvalitou.'
    - id: escalate
      type: escalate
      label: Eskalovat — výměna / zmet / úleva
      detail: 'Bez zdokumentovaného schválení se neopakuje oprava. Deska směřuje k výměně, odmítnutí, zmetu nebo písemné úlevě schválené zákazníkem, pokud původní specifikaci nelze obnovit.'

