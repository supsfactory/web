answer:
  label: 'Přímá odpověď'
  text: 'QINGDAO VATRAD GROUP.,LTD. řídí kvalitu nafukovacích SUP čtyřfázovým systémem ověřování: vstupní kontrola materiálu (IQC), kontrola kvality během výroby (IPQC), závěrečné zkoušení desky a ověření dofukováním (FQC) a balení s uvolněním před odesláním (OQC). Každá objednávka se kontroluje proti schválenému vzorku, technické specifikaci, důkazu grafiky, kusovníku a obalovým standardům, včetně ověření nepropustnosti, vizuální a rozměrové kontroly, potvrzení příslušenství a vysledovatelnosti dávek. Položky, které nesplní kritéria přijetí, se umístí pod řízenou blokaci nebo do karantény, opraví se pouze podle schválených pokynů a před oprávněným uvolněním se znovu zkontrolují.'
  verified: 'září 2026'

intro: 'Náš systém kvality je postaven na projekty OEM/ODM: kontrolní kritéria se stanovují pro každou objednávku, dokumentují a dodržují týmy výroby i kvality od vstupního materiálu až po balení. Tím zůstávají očekávání na kvalitu mezi závodem a Vaší značkou sladěná od prvního vzorku až po celokonténerové zásilky.'

scope_note:
  tagline: Rozsah
  title: Projektová kontrolní kritéria
  body: |
    Požadavky na kvalitu se mohou lišit podle konstrukce desky (např. jednovrstvá/dvouvrstvá, tkaný drop-stitch, spojená výztuha), zamýšleného použití, předpisů cílového trhu a zákazníkem schválených parametrů. Závěrečné oprávnění k uvolnění se řídí výhradně zdokumentovanými kontrolními kritérii dohodnutými pro danou objednávku.

stages:
  tagline: Rámec kvality
  title: Náš 4fázový systém ověřování kvality
  subtitle: Kompletní cyklus kontroly kvality od příchodu suroviny po uvolnění zásilky.
  steps:
    - title: '1. Vstupní kontrola materiálu (IQC)'
      desc: 'Hlavní materiály a nakupované součástky se kontrolují proti schváleným specifikacím a referenčním vzorkům ještě před vstupem na výrobní linku. U drop-stitch a PVC se ověřuje identifikace materiálu, dodavatelská dávka, gramáž/hustota, tloušťka, shoda barvy se schválenými vzorky a povrchové vady. Protiskluzové podložky EVA se kontrolují z hlediska vzoru, barvy, tloušťky, přesnosti řezu a kompatibility lepidla. Ventily a hardware podléhají zkouškám funkčnosti, závitu, těsnosti a zabudování. Příslušenství a obaly (pumpičky, pádla, žebra, leash, tašky, krabice) se porovnávají podle množství, barvy, brandingu, správnosti čárových kódů a verze grafiky proti schválenému kusovníku.'
    - title: '2. Kontrola kvality během výroby (IPQC)'
      desc: 'Kritické výrobní kroky se kontrolují, aby se nesoulady zachytily dřív, než desky přejdou na další pracoviště. Řezání a potisk se ověřují podle rozměrů dílců, rozvržení grafiky, zrcadlové orientace a čistoty okrajů proti schváleným technickým výkresům. Montáž desky a spojování výztuhy se kontrolují z hlediska souměrnosti obrysu, souvislosti překryvu švů a vyloučení prázdných míst či vzduchových bublin v oblasti s vysokým namáháním. Upevnění ventilu a příslušenství, grafika a branding se ověřují z hlediska polohy, orientace, pokrytí lepidlem, správnosti pravopisu loga a verze grafiky.'
    - title: '3. Závěrečné zkoušení desky a ověření dofukováním (FQC)'
      desc: 'Hotové desky podléhají před schválením balení povinným fyzickým a konstrukčním zkoušením. Desky se dofukují na projektem schválený kontrolní tlak a drží se pod tlakem, čímž se ověří tuhost konstrukce a stabilita tlaku. Skenování nepropustnosti zahrnuje pouzdro ventilu, švy výztuhy, přední a zadní kužel a namáhané spoje, a to kalibrovanými metodami detekce netěsnosti (sledování poklesu tlaku nebo bublinková zkouška). Vizuální a rozměrová kontrola ověřuje rozměry, profil pružinování a zarovnání podložek EVA (tolerance ±2 mm) za denního standardního osvětlení.'
    - title: '4. Balení a uvolnění před odesláním (OQC)'
      desc: 'Komplexní ověření před odesláním zajišťuje nulový nesoulad v konfiguraci SKU a v přepravních značkách. Kontrola kompletnosti sady porovnává desku, žebro, leash, pádlo, pumpičku, tašku, opravnou sadu a uživatelskou příručku proti kusovníku objednávky. Kontrola obalů a čárových kódů ověřuje značení krabic, štítky SKU, čitelnost čárových kódů, jazyk příručky a konstrukční pevnost krabice. Objednávka se uvolní až poté, co závěrečný audit obalů podepíší oprávnění pracovníci kvality.'

inspection_points:
  tagline: Pokrytí kontrolou
  title: Klíčové kontrolní body
  subtitle: Každý kontrolní bod se provádí proti zdokumentovaným kritériím přijetí dohodnutým pro danou objednávku.
  features:
    - icon: A
      icon_bg: blue
      title: Ověření nepropustnosti
      desc: 'Hotové desky se dofukují na schválený kontrolní tlak a kontroluje se udržení tlaku, stav patice ventilu, švy výztuhy, přední a zadní oblast i místa s vysokým namáháním. Pokud to kontrolní postup vyžaduje, podezřelé oblasti netěsnosti se prozkoumají schválenými metodami detekce.'
    - icon: B
      icon_bg: green
      title: Vizuální a rozměrová kontrola
      desc: 'Desky se kontrolují za vhodného osvětlení z hlediska stavu povrchu materiálu, vad potisku, barevné variability, zarovnání EVA, zvrásnění, škrábanců, znečištění a vzhledu spojů. Klíčové rozměry a polohy příslušenství se ověřují proti schváleným výkresům nebo specifikacím.'
    - icon: C
      icon_bg: purple
      title: Ověření příslušenství a obalů
      desc: 'Před odesláním se ověřuje kompletní konfigurace výrobku: model desky, systém žebra, pádlo, pumpička, leash, přepravní taška, opravná sada, uživatelská příručka a příslušenství specifická pro zákazníka — každý prvek se porovnává se schváleným vzorkem, výkresy a kusovníkem.'
    - icon: D
      icon_bg: orange
      title: Balení a uvolnění zásilky
      desc: 'Zabalené jednotky se kontrolují z hlediska konfigurace SKU, kompletnosti příslušenství, produktových štítků, údajů čárového kódu, verze návodu, značení krabice, množství v balení a stavu krabice. Uvolnění zásilky se autorizuje až po dokončení všech kontrolních a obalových požadavků.'

traceability_intro:
  tagline: Vysledovatelnost dávek
  title: Systém vysledovatelnosti na úrovni projektu a dávky
  body: |
    Každá objednávka individuálních SUP se vede pod jednotným kódem projektu, který propojuje technické specifikace, schválený kusovník, revize grafiky, čísla šarží materiálu, odkazy na obaly a kontrolní záznamy. Výrobní a kontrolní záznamy se vedou podle příslušného projektu a výrobní dávky a každou dávku lze zpětně propojit se schválenou produktovou specifikací, kusovníkem, grafikou a obaly.

    Tím podporujeme rychlou kontrolu konfigurace výrobku, stavu kontrol a zasaženého rozsahu, pokud se objeví kvalitativní pochybnost — od hotového výrobku zpět k výchozím záznamům pomocí identifikace desky nebo krabice.

traceability_chain:
  tagline: Řetězec vysledovatelnosti
  title: Od kódu projektu po uvolnění zásilky
  subtitle: Jeden řetězec řízených odkazů od potvrzení objednávky po oprávněnou expedici.
  steps:
    - step: '01'
      title: Kód projektu
      desc: Jednotný projektový odkaz, který propojuje každý řízený dokument s objednávkou.
    - step: '02'
      title: Revize dokumentů
      desc: Aktuální úrovně revizí specifikace, kusovníku, grafiky a obalů — pro výrobu jsou platné pouze schválené verze.
    - step: '03'
      title: Dávka a materiály
      desc: Šarže materiálu a součástek zaznamenané k výrobní dávce.
    - step: '04'
      title: Kontrolní záznamy
      desc: Výsledky kontrol IQC, během výroby, nepropustnosti, závěrečné a obalové pro každou dávku.
    - step: '05'
      title: Balení a uvolnění
      desc: Dávka balení, stav uzavření NCR a souhrn oprávněného uvolnění zásilky.

traceability_sample:
  tagline: Anonymizovaná ukázka
  title: Kontrolní záznam vysledovatelnosti (demo)
  body: |
    Ukázkové hodnoty jsou uvedeny pouze pro ilustraci — názvy zákazníků, čísla objednávek, vlastní grafika, údaje dodavatelů a obchodní informace jsou odstraněny kvůli zachování důvěrnosti.

    - **Výrobce:** QINGDAO VATRAD GROUP, LTD.
    - **Kód projektu:** DEMO-SUP-2026-01
    - **Reference SKU:** DEMO-TR-126
    - **Výrobní dávka:** BATCH-AUG-01
    - **Revize specifikace / kusovníku / grafiky:** Rev B / Rev C / Rev B
    - **Záznam nepropustnosti:** VYHOVUJE — uchováváno po dobu dávky
    - **Stav kontroly:** VYHOVUJE
    - **Stav zásilky:** UVOLNĚNO

quarantine_intro:
  tagline: Řízení nevyhovujících produktů
  title: Řízení nevyhovujících výrobků a karanténa
  body: |
    Výrobky nebo součástky, které nesplňují stanovená kritéria přijetí, se jasně označí a umístí do stavu řízené blokace nebo karantény. Nesmějí postoupit do další výrobní fáze, k balení ani k odeslání, dokud není dokončeno oprávněné rozhodnutí. Oprava se provádí podle schválených pokynů a propojuje se s příslušným záznamem o nesouladu; opravené položky se před uvolněním kvalitou znovu zkontrolují proti příslušným projektovým požadavkům.

quarantine_flow:
  tagline: Řízený cyklus o 7 krocích
  title: Co se stane, když se najde nesoulad
  subtitle: Zjištění, zadržení, náprava, ověření — a poté uvolnění nebo odmítnutí. Nevyhovující výrobek se nikdy nevrátí bez kontroly do výroby ani na balení.
  steps:
    - step: '01'
      title: Zjištění
      desc: Nesoulad se zaznamená vůči dotčenému výrobku, SKU, dávce nebo fázi procesu.
    - step: '02'
      title: Označení
      desc: Dotčené položky se jasně označí štítky řízeného stavu — BLOKACE, KARANTÉNA nebo ODMÍTNUTO.
    - step: '03'
      title: Karanténa
      desc: Položky se fyzicky oddělí v kontrolované karanténní zóně nebo systémově zablokují, aby se zabránilo nežádoucímu použití či odeslání.
    - step: '04'
      title: Posouzení rozsahu
      desc: Zasažený rozsah se přezkoumá podle dávky, fáze procesu, šarže materiálu a revize dokumentu.
    - step: '05'
      title: Oprava / výměna
      desc: Náprava je povolena pouze prostřednictvím schváleného rozhodnutí a řízeného pracovního pokynu.
    - step: '06'
      title: Opětovná kontrola
      desc: Opravené položky se před uvolněním znovu zkontrolují proti příslušným kritériím přijetí.
    - step: '07'
      title: Uvolnění nebo odmítnutí
      desc: Pouze oprávněný vyhovující výrobek postupuje k balení nebo k uvolnění zásilky.

quarantine_evidence:
  tagline: Na výrobní ploše
  title: Řízené zkoušení a karanténa v praxi
  subtitle: Fotografie z naší dílny v Qingdao ukazují, jak se řízení stavu a kontrolní záznamy uplatňují přímo na místě.
