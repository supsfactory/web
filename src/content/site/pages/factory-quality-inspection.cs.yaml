rework_flow:
  tagline: Uzavřený cyklus o 7 krocích
  title: Řízený pracovní postup oprav — od zjištění po uvolnění nebo zmet
  subtitle: 'Každá oprava nepropustnosti sleduje stejný řízený cyklus: zjištění, karanténa, diagnóza, oprávnění, oprava, opětovná kontrola, uvolnění.'
  steps:
    - step: '01'
      title: Zjištění, zastavení linky a karanténa
      desc: 'Zpracování dotčené desky se okamžitě zastaví. Zaznamená se ID desky, kód výrobku, dávka, pracoviště, datum a kontrolor, přiloží se štítek BLOKACE / KARANTÉNA a založí se NCR proti příslušné revizi specifikace.'
    - step: '02'
      title: Systematická diagnóza netěsnosti
      desc: 'Deska se dofukuje na projektem schválený diagnostický tlak a zdroj netěsnosti se určí schválenou metodou — sledováním udržení tlaku, kalibrovanou bublinkovou zkouškou, akusticky nebo detektorem netěsnosti. Předpokládané místo se označí bez poškození desky.'
    - step: '03'
      title: Rozhodnutí techniky a oprávnění
      desc: 'QC potvrzuje kategorii vady a Technika posuzuje, zda lze desku uvést do souladu s původní specifikací. Oprávnění opravy odkazující na NCR zaznamenává schválenou metodu, materiály, podmínky a rozsah opětovné kontroly — nebo přidělí výměnu, odmítnutí, zmet či úlevu zákazníka.'
    - step: '04'
      title: Řízené provedení opravy
      desc: 'Oprava se provádí výhradně v mezích schválené hranice vady, se schválenou kartou metody, dávkou materiálu a nástroji. Rozměry desky, konstrukce, grafika, konfigurace příslušenství ani obalové požadavky se nikdy nemění.'
    - step: '05'
      title: Vytvrzení, stabilizace a předběžná kontrola
      desc: 'Opravená deska zůstává ve stavu BLOKACE po celou dobu vytvrzování a stabilizace stanovenou schváleným materiálem a procesním pokynem a poté absolvuje vizuální kontrolu zpracování před opětovnou kontrolou.'
    - step: '06'
      title: Opětovná kontrola a důkazní zkoušení
      desc: 'Deska se dofukuje na projektem schválený tlak pro opětovnou kontrolu a znovu se ověří původní selhání i všechny potenciálně dotčené vlastnosti: místo netěsnosti a jeho okolí, ventil, výztuhy, švy, namáhané oblasti, příslušenství a vzhled. Oprava nikdy nesnižuje přijímací normu.'
    - step: '07'
      title: Uvolnění QA nebo konečné rozhodnutí
      desc: 'Kvalita posoudí dokončené NCR, opravný záznam a výsledek opětovné kontroly a poté autorizuje uvolnění — nebo věc eskaluje k výměně, odmítnutí, zmetu či úlevě zákazníka. Žádná opravená deska se nezabalí ani neodešle bez oprávněného uvolnění kvalitou.'

quality_safeguards:
  tagline: Ochranné prvky kvality
  title: Pravidla proti chybám, která chrání Vaši značku
  subtitle: Tvrdé kontroly, které brání nekontrolovaným smyčkám oprav — jedna zdokumentovaná oprava na vadu, prahové hodnoty na úrovni dávky, kalibrované měřidla a řízené zkušební podmínky.
  features:
    - icon: 1
      icon_bg: blue
      title: Jedna oprava na jednu vadu
      desc: 'Jedno místo lze oprravit pouze jednou podle oprávněného pokynu. Pokud opětovná kontrola stále nevyhovuje, deska se eskaluje k výměně, odmítnutí, zmetu nebo úlevě zákazníka — opakovaná oprava bez zdokumentovaného schválení není povolena.'
    - icon: 2
      icon_bg: green
      title: Poplach na úrovni dávky a zastavení linky
      desc: 'Když nesoulad v výrobní dávce překročí technicky stanovenou hranici, linka se zastaví a Technika vyšetří příčinu — šarži materiálu, procesní podmínky a záznamy — než se výroba obnoví.'
    - icon: 3
      icon_bg: purple
      title: Kalibrovaná měřidla
      desc: 'Tlakoměry, digitální manometry a časovače používané při zkoušení nepropustnosti jsou řízené a kalibrované třetími laboratořemi v rámci platnosti kalibrace, přičemž stav kalibrace je v kontrolní zóně viditelný.'
    - icon: 4
      icon_bg: orange
      title: Řízené zkušební podmínky
      desc: 'Zóny pro zkoušení nepropustnosti a vytvrzování se udržují v řízeném prostředí, aby výsledky neovlivňovaly teplotní výkyvy mezi dnem a nocí.'

rework_boundaries:
  tagline: Rozsah a hranice
  title: Co tento systém nezahrnuje
  body: |
    Systém řízení oprav platí pro hotové nebo rozpracované nafukovací desky SUP se zjištěným únikem vzduchu, selháním udržení tlaku nebo souvisejícími vadami systému vzduchu před uvolněním zásilky. Nepovoluje změny schválené konstrukce, materiálu, grafiky, konfigurace výrobku nebo požadavků zákazníka a nezahrnuje:

    - Výrobky, které již byly odeslány nebo jsou v kanálech zákazníka.
    - Strukturální poškození nebo zkroucení desky, které neposoudila Technika.
    - Rozsáhlé selhání výztuhy či švu, poškození jádrového materiálu nebo vady, které mohou ovlivnit bezpečnost.
    - Projekty, v nichž není oprava povolena: zákazníkem schválené vzorky, certifikační nebo zkušební kusy.
    - Projekty s proprietárními zákaznickými procesy, speciálními materiály nebo zvláštními požadavky na opravu.
    - Opakovanou netěsnost, kterou nelze lokalizovat, nebo desky, které po opravě znovu selhaly.

    Jakákoli odchylka od specifikací zákazníka vyžaduje zdokumentované posouzení techniky a tam, kde je to použitelné, písemný souhlas zákazníka. Desky, které nelze uvést do souladu s původní specifikací, se uvolní výhradně na základě výslovné úlevy zákazníka — nikdy jen z vůle výroby.

method_cards:
  tagline: Systém karet metod
  title: Index řízených karet metod opravy
  subtitle: 'Obecný pokyn řídí proces; karty metody řídí operaci. Opravný pokyn (WI-QC-AT-001) odkazuje na karty metody MC-RW-01 až MC-RW-06, navíc na MC-RW-00 pro povinný zmet a odmítnutí.'
  headers:
    code: Karta metody
    defect: Třída vady
    scope: Rozsah použití
    controls: Klíčové inženýrské kontroly
    approval: Pravomoc k podpisu
  rows:
    - code: MC-RW-01
      defect: Třída A (rozhraní ventilu)
      scope: 'Servis jádra ventilu, čištění těsnění a opětovná montáž'
      controls: 'Kalibrovaný momentový klíč, čisté sedlo těsnění, žádné poškození závitů ventilu'
      approval: 'Kontrolor QC'
    - code: MC-RW-02
      defect: Třída B (obvod ventilu)
      scope: 'Těsnění pírkové příruby ventilu a řízené upnutí'
      controls: 'Řízená příprava povrchu, schválené lepidlo, kruhové přítlačné přípravky'
      approval: 'QC + Technika'
    - code: MC-RW-03
      defect: Třída C (mikroskopická netěsnost povrchu)
      scope: 'Těsnění bodového otvoru bez konstrukčního zatížení'
      controls: 'Schválené dvousložkové lepidlo, žádný přítok do grafiky ani EVA'
      approval: 'QC + Technika'
    - code: MC-RW-04
      defect: Třída D (místní šev výztuhy)
      scope: 'Opětovné spojení místního překryvu švu výztuhy'
      controls: 'Tepelná aktivace s řízenou teplotou, přítlačný válec, přípravek proti zvlnění'
      approval: 'Technika + vedoucí QA'
    - code: MC-RW-05
      defect: Třída B/C (obvod příslušenství)
      scope: 'Těsnění záplaty držáku žebra a základny upevnění příslušenství'
      controls: 'Promoční prostředek pro přilnavost povrchu, profilovaný přítlačný blok, definovaná doba držení'
      approval: 'QC + Technika'
    - code: MC-RW-06
      defect: Třída D (šev přední/zadní části)
      scope: 'Zásah do švu vysokého zakřivení s vysokým namáháním'
      controls: 'Schválené lepidlo odolné vůči vysokému smyku, prodloužená doba vytvrzování před opětovnou zkouškou'
      approval: 'Hlavní inženýr'
    - code: MC-RW-00
      defect: Třída E/F/G (kritická / trhlinová)
      scope: 'Povinný zmet a fyzické zničení'
      controls: 'Fyzické odstřižení bránící smíchání, záznam zmetu, přezkum kořene problému napříč odděleními'
      approval: 'Ředitel závodu'

inspector_friendly:
  tagline: Kontrola třetí stranou
  title: Protokol přátelský k inspektorům
  body: |
    Zajišťujeme vyhrazenou kontrolní zónu s kalibrovanými tlakovými měřidly, normalizovanými světelnými stoly pro kontrolu švů a grafiky a předem vyplněnými kontrolními briefy, aby třetí strany (SGS, BV, Intertek, QIMA) mohly účinně provést kontrolu před odesláním — ušetříte tak náklady na kontrolu.

    Každý brief shrnuje použitelné revize dokumentů, odkaz na schválený vzorek, kontroly kritické pro kvalitu, dohodnutou úroveň vzorkování, funkční zkoušky a požadavky na obaly a čárové kódy pro danou objednávku. Určená množství, kvalita, balení a základní bezpečnostní položky se ověřují proti schváleným projektovým odkazům — na místě nebudete hledat dokumenty na poslední chvíli.

