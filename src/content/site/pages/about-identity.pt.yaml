hero:
  tagline: 'Identidade da marca'
  title: 'Quem é a SUPsfactory?'
  subtitle: 'A SUPsfactory é a marca produtiva orientada para o cliente da Vatrad, a divisão náutica de produção do Qingdao Vatrad Group Co., Ltd. — um produtor de SUP insufláveis e produtos náuticos insufláveis com sede em Laixi, Qingdao, China. Produzimos exclusivamente com as marcas dos nossos clientes e não competimos com eles em nenhum mercado.'

answer:
  label: 'Em resumo'
  text: 'Entidade jurídica: Qingdao Vatrad Group Co., Ltd. Divisão de produção: Vatrad (marca SUPsfactory). Fábrica: Laixi, Qingdao, Shandong, China. Âmbito: produção OEM, ODM e marca própria de pranchas de paddle insufláveis, pás e produtos náuticos insufláveis. Certificações: ISO 9001:2015, CE (modelos destinados ao mercado da UE), BSCI, REACH, RoHS. Não vendemos com uma marca própria — cada prancha que produzimos leva a marca do comprador.'
  verified: 'September 2026'

