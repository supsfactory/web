manufacturing_scope:
  heading: 'Âmbito de produção'
  body: |
    O nosso âmbito de produção cobre toda a cadeia de fabrico dos produtos SUP insufláveis e náuticos — desde o controlo de entrada das matérias-primas até à embalagem final e à documentação comercial de exportação.

    - **Categorias de produto**: pranchas de paddle insufláveis (Allround, Touring, Surf, Fishing, Yoga, Racing), caiaques insufláveis, botes, pás, bombas e acessórios.
    - **Tipos de construção**: PVC de camada única, PVC de camada dupla, núcleo drop-stitch com revestimento em PVC. Especificações de construção personalizadas para cada projeto.
    - **Modelos de colaboração**: OEM (design exclusivo do cliente), ODM (desenvolvido em fábrica com base no briefing do cliente), marca própria/co-branding (marca em plataformas testadas).
    - **Certificações**: ISO 9001:2015 (gestão da qualidade em fábrica), CE (modelos destinados ao mercado da UE, âmbito por projeto), BSCI (conformidade social), REACH (segurança química), RoHS (substâncias sujeitas a restrição).
    - **Capacidade produtiva**: 120.000+ pranchas por ano, cerca de 10,000 unidades de produção mensal em 4 linhas automatizadas. Possibilidade de ampliar a escala mediante planeamento do programa.

brand_positioning:
  heading: 'Posicionamento da marca'
  body: |
    A SUPsfactory ocupa uma posição específica no mercado — não somos uma marca, somos um produtor. Esta distinção determina todos os aspetos do nosso modo de trabalhar:

    - **Nunca vendemos com uma marca própria.** Cada prancha que produzimos leva a marca do comprador. Não competimos com os nossos clientes em nenhum mercado nem em nenhum canal. Esta política é inegociável.
    - **Não somos uma empresa comercial.** Gerimos a fábrica. Controlo de qualidade, design, planeamento da produção e documentação comercial de exportação são todos geridos internamente. Não há intermediários entre a tua encomenda e o departamento de produção.
    - **Somos especializados em produtos insufláveis.** Não é uma atividade secundária nem uma categoria de produto entre muitas outras. Os produtos náuticos e SUP insufláveis são a nossa competência fundamental. Cada máquina, cada processo, cada ponto de controlo de qualidade é otimizado para esta categoria de produto.
    - **Servimos compradores profissionais.** Os nossos clientes são marcas, distribuidores, gestores de resorts, clubes e escolas — não consumidores finais. A nossa estrutura de preços, o MOQ, a documentação e a comunicação são pensados para relações B2B.

evidence_review:
  tagline: 'Provas e verificação'
  title: 'ESPECIFICAÇÕES VERIFICADAS'
  body: 'Todas as declarações organizacionais e produtivas desta página são verificáveis. O certificado ISO 9001, o relatório BSCI, a licença comercial e os documentos de registo da fábrica estão disponíveis mediante pedido. As visitas à fábrica são bem-vindas. Especificações verificadas pela última vez em setembro de 2026.'

faqs:
  tagline: FAQ
  title: 'Identidade da marca — Perguntas frequentes'
  items:
    - q: 'A SUPsfactory é uma empresa separada do Qingdao Vatrad Group?'
      a: 'Não. A SUPsfactory é a marca orientada para o cliente da Vatrad, a divisão náutica de produção do Qingdao Vatrad Group Co., Ltd. A parte contratante em todas as encomendas é o Qingdao Vatrad Group Co., Ltd. A fábrica, a equipa e o sistema de qualidade constituem uma única operação.'
    - q: 'Vendem pranchas com uma marca própria?'
      a: 'Não. Produzimos exclusivamente com as marcas dos nossos clientes e não competimos com eles em nenhum mercado. É uma política fundamental — não uma posição provisória. Se encontrares no mercado uma prancha com a marca SUPsfactory, não vem da nossa fábrica.'
    - q: 'Posso visitar a fábrica?'
      a: 'Sim. Recebemos com prazer as visitas à fábrica e podemos organizar uma auditoria estruturada que cobre todo o processo produtivo, os pontos de controlo de qualidade, o armazém de materiais e a análise de documentos. Contacta-nos para agendar uma visita.'
    - q: 'Qual é a relação entre a Vatrad e a SUPsfactory?'
      a: 'A Vatrad é o nome da divisão de produção dentro do Qingdao Vatrad Group. A SUPsfactory é a marca internacional orientada para o cliente dos serviços de produção OEM, ODM e marca própria. Ambas se referem à mesma operação — a divisão náutica de produção em Laixi, Qingdao.'

