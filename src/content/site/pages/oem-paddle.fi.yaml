faqs:
  title: 'OEM-melavalmistuksen usein kysytyt kysymykset'
  subtitle: 'Vastaukset yleisimpiin kysymyksiin brändeiltä, jotka lanseeraavat oman melansa.'
  items:
    - title: 'Miten teen oman melabrändin?'
      description: 'Lanseeraa brändisi: toimeksianto, suunnittelu, CE-sertifioitu prototyyppi, sarjatuotanto ja toimitus. Näytteet 7–12 päivässä, tuotanto 25–35 päivässä tilauksesta ja käsirahasta. Tutustu OEM-paketteihimme.'
    - title: 'Mikä on valmistuksen toimitusaika?'
      description: 'Näyte on valmis 7–12 päivässä ja sarjatuotanto vie 25–35 päivää tilauksen ja käsirahajan jälkeen riippuen volyymistä.'
    - title: 'Kantaako mela logomme?'
      description: 'Kyllä — täydellinen private label: logopainatus, räätälöidyt värit, pakkaus ja etiketit brändisi mukaisesti.'
    - title: 'Voinko ostaa tukkukauppaa heti alusta alkaen?'
      description: 'Vähimmäiseräkoko vahvistetaan projektin konfiguroinnin mukaan — näyte (1–2 kpl), pilottisarja (20–50 kpl) ja vakiintunut volyymierä (90–100+ kpl erää kohti), ja tukkuhinnat porrastuvat volyymin kasvaessa.'

