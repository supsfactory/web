answer:
  label: 'Suora vastaus'
  text: 'Vähimmäiseräkoko vahvistetaan projektin konfiguroinnin mukaan: näyte (1–2 kpl), pilottisarja (20–50 kpl) ja vakiintunut volyymierä (90–100+ kpl erää kohti 150 m drop-stitch-rullasta), sekä pienet co-branding-erät alkaen 5–10 kpl. Näytteet lähetetään 7–12 päivässä; sarjatuotanto 25–35 päivää tilauksen ja käsirahan jälkeen. EU-markkinoille tarkoitettujen mallien CE-sertifiointi ja täydellinen vaatimustenmukaisuusasiakirjoitus sisältyvät jokaiseen tilaukseen.'
  verified: 'Syyskuu 2026'
  image:
    src: https://assets.isupfactory.com/images/sups/products/sup-series/sup-medusa-glow-1.webp
    alt: Räätälöity OEM-puhallettava mela brändin logolla
  actions:
    - text: 'Aloita OEM-projektini'
      href: /fi/contact
      variant: primary
    - text: 'Tutustu OEM-paketteihin'
      href: /fi/oem-manufacturing
      variant: secondary
