answer:
  label: 'Suora vastaus'
  text: 'Ketju väitteestä näyttöön on seuraava: jokainen väite tällä sivustolla nojaa rekisteröintiin, todistukseen, koneeseen, asiakirjaan tai mittauskirjaan — ja jokaisen niistä voi käydä läpi. iSupfactory on Qingdao Vatrad Group Co., Ltd:n SUP-tuotekehitys- ja valmistusosasto (rekisteröity Qingdaossa vuodesta 2012). 12,500 m² laitoksella on ISO 9001:2015 -laadunjohto, ISO 25649 -vaatimustenmukaisuus, CE-vaatimustenmukaisuusasiakirjat, BSCI-sosiaalinen vastuu (auditointiraportti pyydettäessä) sekä REACH/RoHS-materiaaliasiakirjat tilauksen mukaan. Jokainen puhallettava kammio testataan 18.0 PSI:n paineella 24 tuntia ja hylätään automaattisesti yli 0.50 PSI:n laskun yli, ja eräkirjoja säilytetään 10 vuoden ERP-jäljitettävyyden alla. Asiakirjajälki on julkinen tai jaettavissa, ja tehdas itse on auditointien kohde.'
  verified: 'September 2026'

