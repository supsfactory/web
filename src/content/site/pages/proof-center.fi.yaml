certifications:
  tagline: 'Todistukset ja laajuus'
  title: 'Mitä meillä on, mitä se kattaa ja miten se varmennetaan'
  subtitle: 'Julkaistu luettelo — ei koskaan "vain pyydettäessä saatavilla". Todistusnumerot ja auditointikirjat toimitetaan pyydettäessä tai auditin yhteydessä.'
  headers:
    certificate: 'Todistus / standardi'
    scope: 'Kattavuus'
    verify: 'Näin varmennetaan'
  rows:
    - certificate: 'ISO 9001:2015'
      scope: 'SUP-suunnittelun ja -valmistuksen laadunjohto'
      verify: 'Todistusnumero ja auditointikirjat pyydettäessä tai auditin yhteydessä'
    - certificate: 'ISO 25649'
      scope: 'Puhallettavien alusten turvallisuus ja rakenteen vaatimustenmukaisuus (Eurooppa)'
      verify: 'Vaatimustenmukaisuusasiakirjat tuoteperhekohtaisesti'
    - certificate: 'CE'
      scope: 'EU-vaatimustenmukaisuus puhallettaville SUP-tuotteille'
      verify: 'CE-asiakirjat toimitetaan tilausten mukana'
    - certificate: 'BSCI'
      scope: 'Sosiaalinen vastuu laitokselle ja henkilöstölle'
      verify: 'Auditointiraportti saatavilla pyydettäessä'
    - certificate: 'REACH & RoHS'
      scope: 'Rajoitettujen aineiden ja materiaalien asiakirjat'
      verify: 'Materiaaliasiakirjat jokaisen tilauksen mukana'
    - certificate: 'Kolmansen osapuolen tarkastus (valinnainen)'
      scope: 'SGS-, TUV-, BV- tai Intertek-esilähetystarkastus'
      verify: 'ISO 2859-1 Level II, ajoitetaan haluamallasi tavalla'

