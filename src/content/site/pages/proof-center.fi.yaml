traceability:
  tagline: 'Erä rullasta lautaan'
  title: 'Miltä jäljitettävyys oikeasti näyttää'
  body: |
    Jokaiselle erälle annetaan **10 vuoden ERP-erätunnus**. Yhden erän alle kirjattu ketju:

    - **Saapuva rulla** — materiaalitodistus, rullanumero, kankaan erä testattu (veto, repäisy, sauma)
    - **Leikkaus** — CNC-legeistys työ piirustustiedostoon, hukkaprosentti kirjattu
    - **Hitsaus ja laminointi** — linja, operaattori, koneen parametrit kammiota kohti
    - **Kokoonpano** — laudan sarjanumero, venttiilin tyyppi, kansityynyn erä
    - **Testi** — 18.0 PSI × 24 h pito kammiota kohti, automaattinen hylkäys yli 0.50 PSI:n laskun yli
    - **Vapautus** — 100 kohdan tarkistuslista lautaa kohti, laadunvarmistusjohtajan hyväksyntä erää kohti
    - **Jatkoon** — vaatimustenmukaisuustodistus lähetyksen mukana; auditointioikeus varattu sopimukseen

    Pyydä näyte laadunvarmistuskirjasta ennen ensimmäistä tilaustasi — se on sama muoto, jonka saat lähetyksesi mukana.

faqs:
  tagline: 'UKK'
  title: 'Ostajien esittämät näyttöä koskevat kysymykset'
  items:
    - q: 'Onko tämä sivu vain varmentamista varten eikä korvaa due diligencea?'
      a: 'Oikein — tämä sivu näyttää, missä jokainen väite voidaan varmentaa: yksikön rekisteröinti, todistukset, koneet, kirjat ja auditointiin avoin laitos. Tavanomaiset due diligence -vaiheet (rekisteröintitarkistus, auditointi, kolmansen osapuolen tarkastus) koskevat edelleen ja ovat tervetulleita.'
    - q: 'Minkä yksikön pitäisi olla tilausasiakirjoissani?'
      a: 'Tilaukset tehdään Qingdao Vatrad Group Co., Ltd:lle, joka toimii nimellä Vatrad (valmistusosasto), ja iSupfactory on SUP-tuotelinja. Sopimusasiakirjat allekirjoittavat myyntijohtaja, pääinsinööri ja laadunvarmistusjohtaja.'
    - q: 'Saanko todistusten kopiot ennen tilausta?'
      a: 'Kyllä — todistusnumerot ja auditointikirjat toimitetaan pyydettäessä tai auditin yhteydessä. Luettelo on julkinen, ei koskaan "vain pyydettäessä saatavilla".'
    - q: 'Miten varmennan erien mittauskirjat itse?'
      a: 'Jokainen kammio testataan 18.0 PSI:n paineella 24 tuntia ja hylätään automaattisesti yli 0.50 PSI:n laskun yli; mittauslokit linkitetään sarjanumeroihin ja kulkevat vaatimustenmukaisuustodistuksen mukana erittäin. SGS-, TUV-, BV- tai Intertek-esilähetystarkastuksen ISO 2859-1 Level II mukaisesti voidaan ajoittaa haluamallasi tavalla.'
    - q: 'Kattovatko todistukset myös lisävarusteet?'
      a: 'REACH/RoHS-materiaaliasiakirjat koskevat lautoja ja lisävarusteita, jotka toimitetaan samassa tilauksessa, ja laadunvarmistuksen tarkistuslistat kattavat koko sarjan — laudan, melan, pumpun, hihan ja kassin.'
    - q: 'Mitä näytölle käy tilauksen jälkeen?'
      a: 'ERP-erien jäljitettävyys säilytetään 10 vuotta. QMS-sopimukset ja tarkastusstandardit säilyvät ladattavissa, ja ostajalla on sopimuksen mukainen auditointioikeus tuotannon aikana.'

