answer:
  label: 'Прямой ответ'
  text: 'Один завод обслуживает все направления B2B: производство OEM/ODM с подтверждённым по проекту минимальным заказом (образец 1–2 единицы, пилотная партия 20–50, серийный объём 90–100+ на рулон 150 m; ко-брендинг от 5–10 единиц), private label на проверенных платформах, оптовое распределение и флотовые программы для курортов, клубов и школ. Каждый тип клиента соотнесён с конкретным набором решений: образцы за 7–12 дней, производство через 25–35 дней после заказа и предоплаты.'
  verified: 'Сентябрь 2026'

