services:
  - title: Design de produto & construção
    description: A nossa equipa de I&D interna trabalha no teu conceito ou especificação para desenvolver desenhos CAD, modelos 3D e protótipos. Oferecemos design de moldes, otimização da forma do casco e consultoria na escolha de materiais.
  - title: Branding & gráficas personalizadas
    description: Impressão digital a cores plenas, serigrafia, gofragem e opções de etiquetas. Desenvolvemos gráficas de deck específicas da marca, branding das câmaras e embalagem pronta para o retalho.
  - title: Personalização de materiais & especificações
    description: Escolhe entre PVC (padrão, eco-friendly, ignífugo), Hypalon/CSM, drop-stitch e construções híbridas. Cores de câmaras personalizadas, gramagens de tecido e opções de reforço.
  - title: Embalagem & logística
    description: Embalagem comercial personalizada, cartões private label, embalagem a vácuo, paletização e estiva pronta para a exportação preparados internamente.

moq_table:
  - product: SUP insufláveis
    standard_moq: 'Amostra 1–2 | Piloto 20–50'
    custom_moq: 'Quantidade 90–100+ (por bobina de 150 m)'
    lead_time: 25–35 dias

why_us:
  - title: Integração vertical
    description: Somos donos da nossa fábrica, dos nossos moldes e da nossa cadeia de abastecimento — sem intermediários, sem subcontratados. Isto dá-nos o controlo sobre a qualidade, os custos e a entrega.
  - title: Dupla certificação
    description: Gestão da qualidade ISO 9001 e certificação de conformidade social BSCI. Relatórios de auditoria da fábrica disponíveis mediante pedido.
  - title: Conformidade CE
    description: A certificação CE aplica-se aos modelos destinados aos mercados da UE (âmbito confirmado por projeto). Os modelos personalizados podem ser certificados CE através do nosso processo consolidado.
  - title: MOQ específico por projeto
    description: 'O MOQ é confirmado pela tua configuração de projeto — o co-branding em pequenos lotes começa nas 5–10 unidades, a produção padrão em série corre com 90–100+ unidades por partida. Ajudamos as novas marcas a começar sem excesso de stock.'

