what_we_need:
  heading: 'Co připravit před odesláním briefu'
  body: |
    Úplný brief proces urychluje. Zde je, co pomůže:

    - **Parametry desky** — Cílová délka, šířka, tloušťka, hmotnost jezdce, scénář použití. Užitečné jsou referenční rozměry desek, nebo modely konkurence.
    - **Návrhové soubory** — Vektorová grafika (AI, SVG, PDF) pro ilustrace a loga. Pokud je nemáte hotové, pro úvodní posouzení proveditelnosti postačí moodboardy, nebo referenční snímky.
    - **Objem a termíny** — Cílové množství a sezónní harmonogram. Stačí i přibližný rozsah („20–50 desek do března“), abychom mohli začít.
    - **Požadavky na shodu** — Cílové trhy a případné konkrétní certifikační požadavky nad rámec CE, ISO 9001, BSCI, REACH, RoHS.
    - **Rozsah rozpočtu** — Orientační rozpočet na jednu desku, nebo cílová vlastní návratnost včetně dopravy nám pomáhá navrhnout vhodnou platformu.

    **Nemáte připravené všechno hned?** Pošlete to, co máte. Zbytek doplníme s Vámi.

faqs:
  tagline: FAQ
  title: 'Začátek projektu výroby SUP — časté dotazy'
  items:
    - q: 'Jaké je minimální množství pro start?'
      a: 'Start je rozdělen na fáze: nejprve 1–2 vzorky (7–12 dnů), poté zkušební objednávka 20–50 desek (25–35 dnů), po ní standardní sériové dávky 90–100+ desek na každou odsouhlasenou konfiguraci. Private label se společným brandingem začíná od 5–10 kusů bez fáze vývoje.'
    - q: 'Jak dlouho trvá získat vzorky?'
      a: 'Fyzické vzorky se vyrábějí za 7–12 dnů od potvrzení specifikace a přijetí zálohy. Při použití stávajících plášťových platforem trvá celý cyklus od briefu po dodání zkušební objednávky obvykle 8–12 týdnů. Vlastní trup přidává 15–20 dnů na vývoj formy.'
    - q: 'Je můj návrh chráněný?'
      a: 'Ano. NDA je k dispozici ihned — dříve, než sdělíte jakékoli důvěrné informace. Vyrábíme výhradně pod značkami našich klientů a nikdy s nimi nesoutěžíme. Všechny technické soubory jsou uloženy v systémech s řízeným přístupem a auditním záznamem.'
    - q: 'Co vyžaduje formulář briefu projektu?'
      a: 'Brief vyžaduje typ Vašeho podnikání, název společnosti, cílové parametry desky, rozsah množství, termíny a případné požadavky na shodu. Vyplnění trvá přibližně 5–10 minut. Můžete přiložit návrhové soubory (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) do velikosti 10 MB. Pokud si nejste jisti v některém poli, přeskočte jej — vrátíme se k němu později.'
    - q: 'Co se stane poté, co odešlu brief?'
      a: 'Dostanete odpověď do jednoho pracovního dne. Konstrukční tým brief prostuduje a vrátí podrobnou nabídku s MOQ, cenou vzorků a harmonogramem po fázích. Dokud si smlouvu neprostudujete a nepodepíšete, nevzniká žádný závazek. Cena vzorků se odečítá od výrobní objednávky.'

