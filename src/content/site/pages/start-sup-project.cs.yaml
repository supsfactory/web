answer:
  label: 'Co bude dál'
  text: 'Po odeslání briefu projektu dostanete odpověď do jednoho pracovního dne. NDA je k dispozici dříve, než sdělíte jakékoli důvěrné podrobnosti. Konstrukční tým brief prostuduje a vrátí podrobnou nabídku s kalkulací MOQ, cenou vzorků a harmonogramem po fázích — zpravidla 7–12 dnů na vzorky a 6–8 týdnů na první výrobu od potvrzeného PO. Cena vzorků se odečítá od výrobní objednávky. Bez závazků až do podpisu.'
  verified: 'září 2026'

process_steps:
  tagline: 'Proces'
  title: 'Od briefu po dodání desek — pět kroků'
  subtitle: 'Každý krok má stanovený termín, zdokumentovaný výstup a kontrolní bod „ano/ne“. Pokračujete až tehdy, když budete připraveni.'
  steps:
    - step: 'Krok 1'
      title: 'Odešlete brief projektu'
      desc: 'Povězte nám o své desce — cílové parametry, objem, požadavky na shodu a termíny. Vyplnění briefu zabere 5–10 minut. Pokud si nejste jisti v některých detailech, pošlete to, co už máte, a zbytek doplníme s Vámi. NDA je k dispozici dříve, než sdělíte důvěrné návrhy.'
    - step: 'Krok 2'
      title: 'NDA a prověření proveditelnosti (1–5 dnů)'
      desc: 'V případě potřeby podepíšeme NDA, potom konstrukční tým posoudí Váš brief z hlediska výrobních možností, dostupnosti materiálů a rozsahu požadavků na shodu. Dostanete podrobnou nabídku s kalkulací MOQ, cenou vzorků a harmonogramem po fázích.'
    - step: 'Krok 3'
      title: 'Vzorek a odsouhlasení (7–21 den)'
      desc: 'Vyrobí se 1–2 fyzické desky podle Vaší specifikace. Vyzkoušíte a posoudíte — tuhost trupu, přesnost grafiky, kompatibilitu příslušenství. Úpravy se zapíší do revidované specifikace (BOM). Odsouhlasený vzorek se stane výrobní etalonem. Cena vzorků se odečítá od výrobní objednávky.'
    - step: 'Krok 4'
      title: 'Plánování před výrobou (7 dnů)'
      desc: 'Nákup materiálů, příprava nástrojů, potvrzení obalů a rezervace výrobního termínu. Všechny materiály procházejí vstupní kontrolou proti zmrazenému BOM. Výrobní harmonogram s daty kontrolních bodů QC je vydán před zahájením výroby.'
    - step: 'Krok 5'
      title: 'Výroba, QC a odeslání (4–6 týdnů)'
      desc: 'Výroba prochází 7fázovým systémem kontrolních bran s kritérii „prošlo/neprošlo“ v každé fázi. Exportní obaly, dokumentace ke shodě a koordinace námořní dopravy do více než 50 zemí. Poprodační analýza zachycuje zlepšení pro další objednávku.'

