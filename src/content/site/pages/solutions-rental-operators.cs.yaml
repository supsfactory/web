fleet_guide:
  title: 'Průvodce volbou velikosti floty'
  subtitle: 'Odhadněte, kolik desek potřebuje Váš provoz, podle každodenní obměny v půjčovně.'
  tiers:
    - label: Malý stánek
      boards: '15-20'
      note: 'Až 2–3 obměny desek denně v hlavní sezóně'
    - label: Střední provoz
      boards: '30-50'
      note: 'Několik vstupních míst, nebo vysoká návštěvnost o víkendu'
    - label: Velká plážová půjčovna
      boards: '50-100'
      note: 'Plnohostrobní půjčovny na několika plážových stanicích'

content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Čtěte dále:</strong> půjčovací desky začínají Vaší specifikací — podívejte se na náš <a href="/cs/oem-manufacturing">program úprav OEM/ODM</a>, nízké zkušební MOQ a flotové ceny. Každá deska projde <a href="/cs/factory">výrobní linkou</a> v provozovně o ploše 12 500 m&sup2; a před odesláním je 100% podrobena tlakové zkoušce.</p>
  </div>

