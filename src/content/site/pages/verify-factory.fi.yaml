meta:
  title: 'Varmenna SUP-tehtaamme | Vieraile, auditointi ja tarkasta Qingdaossa'
  description: 'Näin varmennat SUP-tehtaan ennen sitoutumista: ajoita tehtavierailu, tee riippumaton auditointi tai tarkastus ja tarkista laadunvalvontakirjat, erien jäljitettävyys ja sertifioinnit Qingdaossa Kiinassa.'
  dateModified: '2026-09-23'
