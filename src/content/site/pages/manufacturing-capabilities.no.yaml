faq_section:
  tagline: FAQ
  title: Spørsmål om SUP-produksjonskapasiteten
  questions:
    - q: Hvilke produksjonsprosesser skjer internt?
      a: 'Alle kjerneprosesser skjer internt: skrogkonstruksjon, bearbeiding av drop-stitch-kjernen, høyfrekvenssveising, trykking, EVA-stansing, montering, testing og emballasje. Tilbehør og enkelte råvarer kommer fra sertifiserte leverandører; den endelige sammensetningen av settet skjer internt for fullstendig sporbarhet.'
    - q: Hva er produksjonskapasiteten deres?
      a: '120 000+ brett per år (rundt 10 000/måned) på 4 automatiserte linjer og 4 spesialverksteder på 12 500 m² med over 350 medarbeidere.'
    - q: Hvilken minste bestillingsmengde gjelder for disse kapasitetene?
      a: 'Standardvolumet starter fra 90–100+ enheter per godkjent konfigurasjon (en drop-stitch-rull på 150 m); pilotpartier starter fra 20–50 enheter på eksisterende plattformer; bestillinger med kun logo starter fra 5–10 enheter.'
    - q: Hvilke leveringstider bør vi regne med?
      a: 'Prototypeprøver på 7–12 dager; produksjon 25–35 dager etter bekreftet bestilling og depositum; fastsettelse av tilpassede former legger til 15–20 dager.'
    - q: Hvordan påvirker kapasitetene kvaliteten?
      a: 'Hver prosess mater kvalitetssystemets 7 faser: 100-punkts montasjeliste, 18.0 PSI trykkholding i 24 timer med automatisk kassering ved fall over 0.50 PSI, stikkprøve i henhold til ISO 2859-1 Nivå II og ERP-partisporbarhet i 10 år.'

