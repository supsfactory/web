how_to_choose:
  title: 'Jak wybrać właściwy rozmiar'
  cards:
    - title: 'Deski SUP'
      description: 'Długość dobierz do swojej wagi i planowanego zastosowania. Szersze deski (32"+) dają większą stabilność. Dłuższe deski (11-12 ft) lepiej się prowadzą podczas touringu. Ciężsi wioślarze potrzebują desek o większej objętości.'
    - title: 'Deski SUP do touringu'
      description: 'Dłuższe deski (11–12 ft) najlepiej sprawdzają się na dalszych dystansach i podczas touringu. Szersze deski (32"+) dają większą stabilność. Sprawdź nośność w odniesieniu do łącznej masy ładunku, wliczając sprzęt.'
    - title: 'Deski SUP Allround'
      description: 'Długość dobierz do wagi użytkownika i planowanego zastosowania. Deski allround sprawdzają się w rekreacji, fitnessie i jodze. Mniejsze deski są łatwiejsze w manewrowaniu.'

