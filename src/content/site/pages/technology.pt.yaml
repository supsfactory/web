meta:
  title: 'Tecnologia — Drop-stitch & PVC marinho | {SITE}'
  description: 'As tecnologias Vatrad: construção drop-stitch, PVC marinho, construções de dupla camada e alta pressão. Inovação de um produtor profissional de SUP insufláveis.'
  dateModified: '2026-08'
  keywords:
    - 'Tecnologia SUP'
