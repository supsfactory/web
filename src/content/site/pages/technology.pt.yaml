hero:
  tagline: 'Tecnologia'
  title: 'Construída para as prestações'
  subtitle: 'Cada SUP insuflável Vatrad é fabricado com construção drop-stitch e PVC marinho — materiais e métodos de produção de precisão, testados para ambientes marinhos exigentes.'

sections:
  - title: 'Núcleo drop-stitch'
    description: 'Milhares de fios internos em poliéster ligam a camada superior e inferior, criando uma estrutura rígida a 12–15 PSI. É a mesma tecnologia utilizada nos paddleboards profissionais e nos SUP racing insufláveis.'
    imageAlt: 'Diagrama do núcleo drop-stitch'
  - title: 'PVC marinho'
    description: 'Tecido em PVC laminado multicamada, projetado para ambientes marinhos. Cada camada é soldada e não colada, eliminando os riscos de delaminação. Testado para resistência aos raios UV, corrosão da água salgada e abrasão.'
    imageAlt: 'Camada em PVC'
  - title: 'PVC de qualidade militar'
    description: 'O PVC premium utilizado em todos os modelos SUP oferece uma resistência superior aos raios UV e aos agentes químicos. Permanece flexível a temperaturas extremas e resiste ao envelhecimento.'
    imageAlt: 'PVC'
  - title: 'Air-Deck Floor'
    description: 'Construção drop-stitch de ar comprimido para uma rigidez excecional em pé, na pesca e no yoga. Reduz os tempos de montagem, o peso global e o volume de arrumação.'
    imageAlt: 'Air-Deck'

