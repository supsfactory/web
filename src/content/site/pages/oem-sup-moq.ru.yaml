meta:
  title: "Минимальный заказ (MOQ) на надувные SUP — подробно разъяснено"
  description: "Понятные уровни MOQ для производства надувных SUP на заказ: 5–10 шт. со-брендинг, 20–50 пилотная партия, 90–100+ шт. серии на рулон. Дерево решений по уровню кастомизации."
  dateModified: "2026-08-20"

sections:
  - title: "Прямой ответ"
    directAnswer:
      answer: "Пилотные партии на готовой платформе начинаются с 20–50 шт.; стандартный минимальный заказ (MOQ) для серийного производства — 90–100+ шт. на рулон drop-stitch 150 m (~180–220 досок)."
      condition: "Конкретный MOQ зависит от формы доски, рулона материала, печати, упаковки и от того, нужна ли новая пресс-форма."
      value: "5–10 со-брендинг · 20–50 пилотная партия · 90–100+ на рулон, серия"
      verifiedDate: "Сентябрь 2026"
      sourceType: "factory-record"
    body: |
      MOQ в iSupfactory разделён по уровням кастомизации, а не задан единой плоской цифрой.
      Каждому уровню соответствует конкретный производственный сценарий:

      | Сценарий | MOQ | Единица | Условие |
      |----------|-----|------|-----------|
      | Готовая платформа, только наложение логотипа | 5–10 шт. | на дизайн | Та же форма, тот же рулон материала, то же сочетание цветов |
      | Собственная графика / EVA / упаковка на готовой платформе | 20–50 шт. | пилотная партия | Та же форма; новая графика требует визуального утверждения |
      | Стандартное серийное производство (любая платформа) | 90–100+ шт. | на рулон 150 m (~180–220 досок) | На каждый рулон материала; несколько SKU = отдельные рулоны |
      | Новая форма / специальная пресс-форма | 90–100+ шт. | производственная серия | Пресс-форма добавляет 15–20 дней; разовый сбор за пресс-форму |

  - title: "Что считается «рулоном материала»?"
    body: |
      Рулон drop-stitch ткани длиной 150 метров даёт приблизительно 180–220 досок в зависимости от
      габаритов доски (обычно 10–11 ft). Каждый отдельный SKU — то есть иной размер, иное сочетание
      цветов или иная спецификация материала — требует собственного рулона, а значит, и собственного MOQ.

      Именно поэтому MOQ указывается «на рулон 150 m», а не «на дизайн»: два сочетания цветов
      одной и той же формы доски — это два рулона и два MOQ.

  - title: "Со-брендинг против пилотной партии против серии"
    body: |
      **Со-брендинг (5–10 шт.)**: ваш логотип наносится на готовую платформу, которая уже
      находится в производстве для другого бренда. Никаких изменений в графике, кроме размещения
      логотипа. Самый быстрый путь к брендированному образцу.

      **Пилотная партия (20–50 шт.)**: собственная графика, дизайн EVA-коврика или упаковка на
      готовой форме платформы. Требует утверждения визуального образца до запуска в производство. Идеально
      для тестирования нового дизайна на рынке.

      **Серийное производство (90–100+ шт. на рулон)**: полная производственная серия с любой комбинацией
      кастомизации. Это стандартный коммерческий уровень. Каждый рулон материала даёт ~180–220 досок.

  - title: "MOQ для специальной пресс-формы"
    body: |
      Если ваш дизайн требует новой формы доски (а не просто новой графики на существующей форме),
      необходимо изготовить отдельную пресс-форму. Это выполняется на серийном уровне (90–100+ шт.),
      поскольку вложения в пресс-форму окупаются только за счёт производственной серии. Изготовление
      оснастки добавляет 15–20 дней к стандартному сроку изготовления.

      Право собственности на пресс-форму: пресс-форма принадлежит вам. Она хранится на нашей площадке
      и используется исключительно для ваших производственных серий.

  - title: "Образцы"
    body: |
      Предсерийные образцы доступны в количестве 1–2 досок для подтверждения посадки и отделки.
      Они изготавливаются вручную по вашей спецификации и обычно занимают 7–12 дней. Стоимость образца
      засчитывается в счёт вашего первого серийного заказа.

evidence_review:
  tagline: 'Подтверждение и проверка'
  title: 'ПОДТВЕРЖДЁННЫЕ ХАРАКТЕРИСТИКИ'
  body: 'Все заявления о производстве на этой странице подтверждены нашей инженерной службой производства на площадке в Лайси, Циндао. Сертификаты, записи контроля ОКК, отчёты об испытаниях давлением и прочностью, а также записи прослеживаемости партий предоставляются по запросу. Характеристики последний раз подтверждены в сентябре 2026.'
