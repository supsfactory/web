faq_section:
  tagline: FAQ
  title: Questions sur les capacités de fabrication
  questions:
    - q: Quels procédés de fabrication sont réalisés en interne ?
      a: 'Tous les procédés clés sont intégrés : ingénierie de coque, traitement du tissu drop-stitch, soudure HF, impression, découpe EVA, assemblage, tests et emballage. Les accessoires et certaines matières premières proviennent de fournisseurs certifiés ; le conditionnement final est réalisé en interne pour une traçabilité complète.'
    - q: Quelle est votre capacité de production ?
      a: '120 000+ planches par an (environ 10 000/mois) sur 4 lignes automatisées et 4 ateliers spécialisés dans une usine de 12 500 m² avec plus de 350 employés.'
    - q: Quelle quantité minimum (MOQ) s''applique à ces capacités ?
      a: 'La production de volume standard démarre à 90–100+ unités par configuration approuvée (un rouleau de tissu drop-stitch de 150 m) ; les séries pilotes démarrent à 20–50 unités sur des plateformes existantes ; les commandes logo seul dès 5–10 unités.'
    - q: Quels délais devons-nous prévoir ?
      a: 'Échantillons prototype en 7–12 jours ; production en 25–35 jours après bon de commande confirmé et acompte ; l''outillage de moule sur mesure ajoute 15–20 jours.'
    - q: Comment ces capacités se traduisent-elles en qualité ?
      a: 'Chaque étape alimente le système qualité en 7 étapes : check-list d''assemblage à 100 points, maintien de pression 18,0 PSI pendant 24 heures avec rejet automatique au-delà de 0,50 PSI, échantillonnage ISO 2859-1 niveau II et traçabilité de lot ERP sur 10 ans.'

