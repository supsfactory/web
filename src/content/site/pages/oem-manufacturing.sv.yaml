hero:
  tagline: OEM-produktion
  title: 'Anpassad SUP-OEM-produktion — din specifikation, vår fabrik'
  subtitle: 'Du tar med en design, en ritning eller ett bevisat plattformkoncept — vi producerar i containerskala. Teknisk granskning inom en arbetsdag, prover på 7–12 dagar, produktion 25–35 dagar efter orderbekräftelse och handpengar, levererat under ditt varumärke.'

answer:
  label: 'Kort svar'
  text: 'OEM-produktionen sker enligt din specifikation. MOQ fastställs per projekt, inte som en fast siffra: produktion i standardmängder sker med 90–100 enheter per parti från en rulle med 150 m drop-stitch-tyg, pilotkörningar startar från 20–50 enheter på befintliga plattformar och varje projekt går först igenom ett prov (1–2 enheter) före volymen. Prover skickas inom 7–12 dagar; produktionen tar 25–35 dagar efter orderbekräftelse och handpengar, plus 15–20 dagar om ny utrustning behövs.'
  verified: 'September 2026'

features:
