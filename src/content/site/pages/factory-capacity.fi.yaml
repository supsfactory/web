hero:
  tagline: Tuotantokapasiteetti
  title: Valmistuskapasiteetti ja vuosituotanto
  subtitle: 12,500 m² laitos, joka valmistaa yli 120,000 SUP-lautaa vuodessa ja mahdollistaa skaalauksen

answer:
  label: 'Suora vastaus'
  text: 'Tehtaan kapasiteetti: 12,500 m² neljällä erikoistuneella osastolla, yli 120,000 SUP-lautaa vuodessa, 350+ työntekijää kahdessa vuorossa ja vienti yli 50 maahan. Vähimmäiseräkoko vahvistetaan projektin konfiguroinnin mukaan — näyte (1–2 kpl), pilottisarja (20–50 kpl) ja vakiintunut volyymierä (90–100+ kpl 150 m rullaa kohti); koko logiikka on oppaassamme Minimitilaus ja joustava brändäys. Toimitusaika 25–35 päivää, näytteet 7–12 päivää.'
  verified: 'Syyskuu 2026'

intro: 'Vatrad toimii yhdellä Kiinan Qingdaon suurimmista omistetuista puhallettavien SUP-lautojen valmistuslaitoksista. 12,500 m²:n tehtaamme on jaettu neljään rinnakkain toimivaan erikoistuneeseen osastoon. Vuosikapasiteetti on yli 120,000 puhallettavaa SUP-lautaa (noin 10,000 kuukaudessa), ja erillisillä tuotelinjoilla valmistetaan yli 50,000 pelastusliivua ja yli 5,000 lisävarustetta.'

