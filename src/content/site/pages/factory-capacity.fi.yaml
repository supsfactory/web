workshops:
  - title: SUP-lautojen tuotanto
    description: '4 automaattista kokoonpanolinjaa puhallettaville SUP-lautoille, joiden yhteenlaskettu tuotanto on noin 10,000 lautaa kuukaudessa. Digitaalipainatus- ja silk screen -asemat toimivat samanaikaisesti. Vuosikapasiteetti: yli 120,000 SUP-lautaa.'
    output: '120,000+ SUP/vuosi'
  - title: SUP-lautojen tuotanto — laajennuslinjat
    description: 'Lisä automaattisia kokoonpanolinjoja SUP-lautoille, otetaan käyttöön volyymien kasvaessa. Drop-stitch-ytimien liimaus, digitaalipainatus ja kokoonpanoasemat toimivat samanaikaisesti.'
    output: 'Osa yli 120,000 SUP-laudan vuosikapasiteettia'
  - title: SUP-lisävarusteet ja sekakokoonpano
    description: 'Monikäyttöiset kokoonpanolinjat SUP-lisävarusteille — melat, evät, hihnat, laukut ja sarjat. Kuumailmahitsausasemat, RF-dielektriset puristimet ja kokoonpanotyöpöydät sopeutetaan tilausten rakenteen mukaan. Vuotuinen lisävarustekapasiteetti: yli 5,000 kpl.'
    output: '5,000+ lisävarustetta/vuosi'
  - title: Turvavarusteet
    description: 'Erillinen puhdas tilat pelastusliivujen ja turvavarusteiden valmistukseen. Omat ompeluosastot, vahtikoneistus- ja testausasemat. Vuosikapasiteetti: yli 50,000 pelastusliivua.'
    output: '50,000+ pelastusliivua/vuosi'

oem_capacity:
  moq: 'SUP: näyte 1–2 | pilotti 20–50 | volyymi 90–100+ (150 m rullaa kohti)'
  lead_time: 'Vakiintunut 25–35 päivää. Näyte 7–12 päivää. Kiiretoimitukset mahdollisia.'
  payment: 'T/T 30% käsiraha + 70% loppusumma. L/C, Western Union hyväksytään.'

lead_time_explainer:
  tagline: 'Suunnittelu ja aikataulutus'
  title: 'Näin kapasiteetti muuntuu toimitukseksesi'
  subtitle: 'Kapasiteetti ei ole yksittäinen luku — näin toimitusajat jaotellaan käytännössä.'
  items:
    - title: 'Kapasiteetti vaihtelee määrityksesi mukaan'
      body: 'Vapaat paikat siirtyvät laudan tyypin, rakenteen monimutkaisuuden, pakkauksen ja kysynnän kausivaihtelun mukaan. Kevät- ja kesäkysynnän kasvaessa linjat käyvät lähes täynnä ja näytepaikat varataan ensin.'
    - title: 'Suunnittele ennen lanseerauskautta'
      body: 'Lukitse näytteen vahvistus ja kuvituksen jäädyttäminen hyvissä ajoin. Uusinta tilaukset ajoitetaan sovittuusi toistuvaksi paikaksi, kun referenssinäyte on arkistoitu.'
    - title: 'Kolme aikataulutusjälkeä'
      body: 'Näytteet menevät ensin prototyyppilinjalle, ensitilaukset sijoittuvat lähimpään vapaaseen kokoonpanoikkunaan ja uusinta tilaukset kulkevat omassa toistuvassaan paikassaan.'
    - title: 'Varmistettu toimitusaika tarkastuksen jälkeen'
      body: 'Vahvistamme varman toimitusajan vasta määrityksen, kuvituksen, pakkauksen ja määrän tarkastuksen jälkeen — emme koskaan kiinteänä lupauksena etukäteen.'

