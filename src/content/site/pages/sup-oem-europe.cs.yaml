hero:
  tagline: 'Evropa'
  title: 'OEM nafukovacích SUP pro Evropu — s dokumentací CE z Qingdao'
  subtitle: 'Vzorek za 7–12 dnů, výroba za 25–35 dnů, námořní doprava 4–6 týdnů do Rotterdamu, nebo Hamburku. Dokumentaci pro CE a REACH připravíme spolu s Vaším odsouhlaseným vzorkem — dodání FOB Qingdao, CIF, nebo DDP.'

answer:
  label: 'Přímá odpověď'
  text: 'Evropské značky objednávají nafukovací SUP u iSupfactory za standardních podmínek: MOQ se potvrzuje podle konfigurace projektu — vzorky 1–2 kusy potvrdí konstrukci, pilotní dávky 20–50 kusy otestují trh na stávajících platformách a standardní sériová výroba běží po dávkách 90–100+ kusů na každý návrh z plné role drop stitch o délce 150 m. První vzorek odesíláme za 7–12 dnů od odsouhlasení specifikace, výroba trvá 25–35 dnů od potvrzeného PO a zálohy a námořní doprava přidává 4–6 týdnů do Rotterdamu, nebo Hamburku. Dokumentaci pro CE a REACH připravíme spolu s odsouhlaseným vzorkem a DDP zahrnuje vyclení i dopravu na Váš sklad.'
  verified: 'září 2026'

