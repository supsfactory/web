material_traceability:
  tagline: Trasabilitate
  title: Urmărirea materialelor și controlul loturilor
  description: Fiecare lot de material brut primește un număr de lot unic în sistemul nostru ERP. De la sosire, prin producție, până la produsul finit, lista de materiale a fiecărei plăci se leagă înapoi de lotul original al furnizorului. Aceasta permite trasabilitatea completă în amonte pentru orice anchetă de calitate sau conformitate.
  system: ERP personalizat (sistemul intern Qingdao Vatrad Group) + etichete fizice de lot pe fiecare ordin de lucru
  coverage: 100% din materialele de producție — PVC, Hypalon, țesătură drop-stitch, adezivi, valve, feronerie, ambalare
  records_retained: 10 ani (conform cerinței CE 2013/53/EU)
  suppliers:
    - material: PVC de calitate marină
      source: Furnizori chinezi și coreeni
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Furnizor japonez
      certified: ISO 9001, REACH
    - material: Țesătură drop-stitch
      source: Țesere proprie + partener extern
      certified: QC intern + ISO 9001 al furnizorului
    - material: Valve și feronerie
      source: Furnizori OEM chinezi
      certified: ISO 9001, certificate de material per lot

qc_dashboard:
  tagline: QC în cifre
  title: Indicatori de control al calității
  subtitle: Date reale de trecere/respingere de pe linia noastră de producție. Laboratorul nostru de calitate funcționează independent de producție și raportează direct conducerii.
  stats:
    - value: 100%
      label: Unități testate la presiune
      detail: Fiecare placă, fiecare cameră, fiecare lot
    - value: '<5%'
      label: Scădere de presiune maximă admisă
      detail: Pe 24h la 18.0 PSI
    - value: AQL 2.5
      label: Pragul defectelor majore
      detail: Conform standardului de eșantionare ISO 2859
    - value: 24h
      label: Durata menținerii presiunii
      detail: Fiecare placă, fiecare cameră
    - value: 18 PSI
      label: Presiunea de testare vs nominală
      detail: Marjă de siguranță pe fiecare cameră
    - value: 0%
      label: Toleranță la defectele de siguranță
      detail: Valve, inele D, cusături, flotabilitate

