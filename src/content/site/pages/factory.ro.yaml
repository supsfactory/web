qc_section:
  tagline: Controlul calității
  title: Procesul de testare și asigurare a calității
  subtitle: Fiecare placă trece prin testare obligatorie înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct conducerii.
  steps:
    - step: '1'
      title: Inspecția materialelor brute
      desc: PVC, Hypalon și țesăturile drop-stitch trec prin încercări de tracțiune (), propagare a sfâșierii și verificarea rezistenței la UV înainte ca vreun lot să intre în producție.
    - step: '2'
      title: Test de retenție a aerului pe 24 de ore
      desc: Fiecare cameră tubulară este umflată la 18.0 PSI și menținută timp de 24 de ore. O scădere de presiune de peste 0.50 PSI declanșează respingerea automată și re-inspecția cusăturilor.
    - step: '3'
      title: Testarea la sarcină și echilibru
      desc: Plăcile finalizate sunt umflate la presiunea nominală și verificate pentru umflare simetrică, rigiditate la 15 PSI și stabilitate sub sarcină. Fiecare placă este testată umed în bazinul nostru de testare înainte de inspecția finală.

oem_section:
  tagline: Proiecte OEM
  title: Studii de caz privind parteneriatele de marcă și OEM
  subtitle: De la concept la producție — cum ajutăm mărcile globale să lanseze și să scaleze liniile lor de plăci SUP gonflabile.
  cases:
    - challenge: Un retailer european de outdoor avea nevoie de o linie de plăci SUP private-label cu grafică unică pe punte, PVC ecologic și ambalare gata de vânzare — toate livrate în 60 de zile.
      solution: Am dezvoltat fișiere digitale personalizate de tipărire, am achiziționat PVC conform REACH și am comprimat eșantionarea de la 3 runde la 1 prin co-locarea echipei de proiectare la fabrica noastră din Qingdao.
      result: Producție de 25–35 de zile de la comanda semnată, cu prima livrare în fereastra de 60 de zile. 2,400 de unități în 4 SKU-uri. Comandă repetată plasată înainte ca primul lot să fie livrat complet.
      disclaimer: 'Rezumat de proiect anonimizat — tipul și amploarea proiectului sunt reprezentative; rezultatele specifice nu pot fi verificate independent.'
    - challenge: Un startup american de sporturi nautice avea nevoie de o placă SUP drop-stitch de înaltă performanță, cu formă personalizată, ambalare co-branded și certificare BSCI pentru plasarea în retail.
      solution: Am adaptat forma SUP existentă cu un contur modificat, am dezvoltat ambalajul co-branded și am furnizat documentația completă de audit BSCI.
      result: Plasată cu succes în retaileri outdoor cheie din SUA, generând un impuls puternic, cu peste 5,000 de unități vândute în anul 1 și o rată de vânzare de 98%.
      disclaimer: 'Rezumat de proiect anonimizat — tipul și amploarea proiectului sunt reprezentative; rezultatele specifice nu pot fi verificate independent.'
    - challenge: Un distribuitor australian a solicitat o gamă de plăci SUP certificate CE, cu culori personalizate și conformitate cu standardele australiene.
      solution: Am produs mostre de pre-producție cu 4 variante de culoare și am coordonat testarea de conformitate de către terți.
      result: Gamă de plăci SUP cu 3 modele lansată pe piața AU/NZ. Urmată de câștigarea unei licitații guvernamentale pentru 12 plăci SUP de patrulare.
      disclaimer: 'Rezumat de proiect anonimizat — tipul și amploarea proiectului sunt reprezentative; rezultatele specifice nu pot fi verificate independent.'

faq_section:
  tagline: FAQ
  title: Întrebări frecvente B2B și OEM
  questions:
    - q: Care este cantitatea minimă de comandă (MOQ) pentru plăcile SUP gonflabile OEM?
      a: 'MOQ-ul este confirmat prin configurația proiectului, nu printr-un număr fix — corp de apă și unelte, variante de culoare și PVC, grafică, ambalare și accesorii. Producția standard de volum rulează 90–100+ unități per lot dintr-o rolă completă de drop-stitch de 150 m, co-branding-ul în loturi mici începe de la 5–10 unități, iar fiecare proiect trece prin etapele de mostră (1–2 unități) și pilot (20–50 unități). Consultați Ghidul nostru MOQ și de branding flexibil pentru logica completă de calcul.'
    - q: Deține Vatrad certificarea BSCI?
      a: Da. Fabrica noastră menține o certificare valabilă de conformitate socială BSCI (raportul de audit disponibil la cerere). Deținem de asemenea ISO 9001 pentru managementul calității. Certificarea CE se aplică modelelor destinate piețelor UE; domeniul de aplicare este confirmat per proiect. Documentația de conformitate REACH și RoHS este furnizată cu fiecare comandă OEM.
    - q: Care este termenul tipic de livrare pentru o comandă OEM?
      a: Termenul standard este de 25–35 de zile de la comanda confirmată și avans pentru producția OEM de volum. Dezvoltarea formelor personalizate adaugă 15–20 de zile pentru unelte. Producția accelerată este disponibilă pentru comenzi urgente și perioade de vârf sezoniere. Mostrele de prototip sunt de obicei gata în 7–12 zile.
    - q: Vă ocupați de documentația de export?
      a: Da. Echipa noastră gestionează intern documentația de export și formalitățile vamale și livrăm în 50+ țări din piețele UE, SUA, AU și Asia.

b2b_moq: 'MOQ confirmat prin configurația proiectului: mostră 1–2, pilot 20–50, volum 90–100+ (per rolă de 150 m); co-branding în loturi mici de la 5–10 unități.'

production_flow:
  tagline: Fluxul de producție
  title: De la material la placa finită
  subtitle: Fiecare placă trece prin 6 etape de producție, cu puncte de control al calității la fiecare pas. Fără scurtături, fără inspecții omise.
  stages:
    - stage: '01'
      title: Recepția materialelor și QC la intrare
      description: 'Toate materialele primite sunt înregistrate după numărul de lot în sistemul nostru ERP. Rolele de țesătură PVC, miezurile drop-stitch, valvele, adezivii și feroneria sunt puse în carantină până la semnarea de către QC.'
      qc_check: 'Rezistență la tracțiune (ASTM D751), rezistență la sfâșiere (ISO 4674), grosimometru, vâscozitatea adezivului, scanare vizuală a defectelor'
      qc_threshold: '100% din loturi testate. Respingere dacă tracțiunea < 90% din specificație, sfâșierea < minimul din specificație sau orice defect vizual'
      responsibility: Echipa QC la intrare (3 inspectori)
    - stage: '02'
      title: Tăiere CNC și pregătirea materialelor
      description: 'Aranjarea optimizată pe computer așază panourile pe stocul de PVC pentru a minimiza deșeurile. Mașinile automate de tăiere CNC mențin o precizie pozițională de 0.1 mm.'
      qc_check: 'Verificare dimensională față de fișierele CAD DXF, inspecția calității marginilor, verificarea numărului de panouri'
      qc_threshold: 'Fiecare al 20-lea panou măsurat. Toleranță ±0.5 mm. Respingere a lotului dacă >2% sunt în afara toleranței'
      responsibility: Șeful atelierului de tăiere
    - stage: '03'
      title: Sudare și lipirea miezului drop-stitch
      description: 'Miezurile drop-stitch sunt lipite de straturile exterioare din PVC prin laminare la cald. Camerele tubulare sunt sudate RF sau cu aer cald. Benzile de șină sunt lipite prin fuziune în trei straturi.'
      qc_check: 'Test de decojire la fiecare 50 de unități (ASTM D751), măsurarea lățimii sudurii, verificarea jurnalului de temperatură a aerului cald, inspecția vizuală a cusăturilor în contralumină'
      qc_threshold: 'Rezistența la decojire min 8 N/cm. Toleranță a lățimii sudurii ±1 mm. Orice canal vizibil = respingere'
      responsibility: QC sudare (2 inspectori pe tură)
    - stage: '04'
      title: Asamblare și montaj
      description: 'Plăcile trec la asamblarea finală, unde toate componentele se îmbină: panourile de punte și de carenă fuzionate, valvele instalate, inelele D, mânerele, cutiile de derivă și husa de transport. Fiecare unitate urmează o listă de verificare a asamblării în 100 de puncte.'
      qc_check: 'Semnare a listei de verificare în 100 de puncte per unitate, test de funcționare a valvei (10 cicluri de deschidere/închidere), verificarea cuplului de strângere a feroneriei, inspecție vizuală'
      qc_threshold: 'Politică de zero defecte pentru articolele critice de siguranță (valve, inele D, mânere). Cosmetic minor: AQL 2.5 (ISO 2859)'
      responsibility: Șeful echipei de asamblare + QC de linie
    - stage: '05'
      title: Testarea la presiune și reținerea pentru calitate
      description: 'Fiecare cameră este umflată la 18.0 PSI (pentru o placă SUP nominalizată la 12–15 PSI) și menținută timp de 24 de ore. Senzorii de presiune înregistrează continuu. Camerele care depășesc 0.50 PSI scădere de presiune sunt respinse și trimise pentru re-inspecția cusăturilor.'
      qc_check: 'Jurnal de menținere a presiunii 24h, calibrarea senzorilor verificată zilnic, citire de presiune compensată termic, re-testarea cusăturilor după reparație'
      qc_threshold: 'Max 0.50 PSI scădere de presiune pe 24h la temperatură stabilă. Orice cameră care depășește acest prag = re-testare 100% a întregului lot de producție'
      responsibility: Laboratorul de calitate (independent de producție, raportează conducerii)
    - stage: '06'
      title: Inspecția finală și ambalarea
      description: 'Inspecție vizuală și funcțională finală. Defecte de suprafață, consistența culorilor, verificarea etichetei/BIN, integritatea ambalajului și caracterul complet al accesoriilor. Unitățile sunt ambalate în vid, în cutii și paletizate pentru încărcarea în container.'
      qc_check: 'Inspecție vizuală completă, listă de verificare a accesoriilor per SKU, test de cădere a ambalajului (1 m, eșantion aleatoriu), verificarea scanării etichetei/codului de bare'
      qc_threshold: 'AQL 2.5 pentru defecte majore, AQL 4.0 pentru minore. Toleranță zero la defectele de siguranță. 100% din unități inspectate vizual'
      responsibility: Echipa QC finală (4 inspectori) + Șeful echipei de ambalare

