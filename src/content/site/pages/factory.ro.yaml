workshops_section:
  tagline: Ateliere
  title: Ateliere de producție
  workshops:
    - title: Tăierea PVC și pregătirea materialelor
      description: Mașinile automate de tăiere CNC prelucrează țesăturile din PVC, Hypalon și drop-stitch cu o precizie sub milimetru. Aranjarea optimizată pe computer minimizează deșeurile de material și asigură că fiecare panou îndeplinește specificația sa dimensională înainte de sudare.
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: Mașină CNC de tăiere PVC care pregătește panouri de țesătură pentru plăci SUP gonflabile la fabrica din Qingdao
    - title: Sudarea tuburilor și termoetanșarea
      description: Atelier dedicat de sudare, cu mașini de termoetanșare și prese dielectrice RF. Termoetanșatoarele cu aer cald lipesc și fuzionează camerele tubulare din PVC, în timp ce sudurile RF produc cusături etanșe la aer, de mare rezistență, care depășesc cerințele.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Mașină de sudare RF care etanșează camerele tubulare ale ambarcațiunilor gonflabile la fabrica din Qingdao
    - title: Lipirea miezului drop-stitch
      description: Miezurile drop-stitch ale plăcilor SUP sunt lipite de straturile exterioare din PVC prin laminare la cald. Mii de fire interne din poliester conectează straturile superioară și inferioară, creând o structură rigidă la 12-15 PSI. Benzile de șină sunt lipite prin fuziune în trei straturi pentru rezistența marginilor.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Linie de producție de plăci SUP gonflabile cu echipament de lipire a miezului drop-stitch la fabrica din Qingdao
    - title: Tipărirea și decorarea plăcilor SUP
      description: Plăcile SUP sunt decorate prin tipărire digitală pentru grafică integral colorată și prin serigrafie pentru logo-uri și modele repetitive. Imprimantele digitale produc modele de punte de calitate fotografică, în timp ce serigrafia oferă mărci durabile și vii.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Interiorul departamentului de producție la fabrica de plăci SUP gonflabile din Qingdao
    - title: Asamblarea și montajul final
      description: Linie de asamblare în care valvele, inelele D, mânerele, cutiile de derivă și suprafețele de punte sunt instalate pe fiecare placă SUP. Fiecare placă urmează o listă de verificare a asamblării în 100 de puncte, semnată de șeful de echipă.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Departament de producție cu posturi de asamblare la fabrica din Qingdao
    - title: Testarea și inspecția calității
      description: Fiecare placă finalizată trece prin testare obligatorie de retenție a aerului, verificarea decojirii cusăturilor și o verificare completă a sistemelor înainte de expediere. Laboratorul nostru de calitate funcționează independent de producție și raportează direct conducerii.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Testarea la presiune a unei plăci SUP gonflabile pentru retenția aerului înainte de expediere la fabrica din Qingdao

