hero:
  tagline: Fabrica
  title: Fabrica și producția
  subtitle: Fabrică de plăci SUP de 12,500 m2 în Qingdao, China — producție personalizată de plăci SUP, de la materialul PVC brut până la placa paddle gonflabilă finită

answer:
  label: 'Răspuns direct'
  text: 'Fabrică certificată de plăci SUP gonflabile în Qingdao, China: ISO 9001, ISO 25649, BSCI, CE, REACH și RoHS. Uzină de 12,500 m² cu 4 ateliere specializate, 350+ de lucrători, 120,000+ plăci produse anual (10,000 de plăci/lună pe 4 linii automatizate). Fiecare placă este încercată la presiune la 18.0 PSI timp de 24 de ore, trece printr-o listă de verificare a asamblării în 100 de puncte și are trasabilitate a materialelor pe 10 ani.'
  verified: 'Septembrie 2026'

intro:
  - Ca divizie de producție a **Qingdao Vatrad Group Co., Ltd.**, Vatrad controlează fiecare etapă a producției de plăci SUP gonflabile — de la sosirea materialelor PVC brute până la inspecția finală înainte de livrare a plăcii paddle finite. Instalația noastră de producție din Zona de Dezvoltare Economică Qingdao se întinde pe 12,500 metri pătrați și găzduiește ateliere dedicate pentru tăierea PVC, lipirea miezului drop-stitch, tipărirea digitală a plăcilor SUP, asamblarea finală și testarea calității.
  - Prin integrarea proiectării, ingineriei, prototipării, producției și testării sub același acoperiș, eliminăm ineficiențele producției contractuale și menținem un control direct asupra calității construcției, selecției materialelor și termenelor de livrare. Fiecare placă SUP care părăsește atelierul nostru este construită de oamenii noștri, pe echipamentele noastre, după standardele noastre.

