material_traceability:
  tagline: Прослеживаемость
  title: Отслеживание материалов и контроль партий
  description: Каждой партии сырья присваивается уникальный номер партии в нашей ERP-системе. От момента поступления через производство до готовой продукции спецификация материалов и комплектующих каждой доски ведёт к исходной партии поставщика. Это обеспечивает полную прослеживаемость вверх по цепочке для любого запроса по качеству или комплаенсу.
  system: Собственная ERP-система (внутренняя система Qingdao Vatrad Group) + физические бирки партий на каждом производственном задании
  coverage: 100% производственных материалов — PVC, Hypalon, ткань drop-stitch, клеевые составы, клапаны, фурнитура, упаковка
  records_retained: 10 лет (согласно требованиям CE 2013/53/EU)
  suppliers:
    - material: PVC морского класса
      source: Поставщики из Китая и Кореи
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Поставщик из Японии
      certified: ISO 9001, REACH
    - material: Ткань drop-stitch
      source: Собственное ткачество + внешний партнёр
      certified: Внутренний контроль качества + ISO 9001 поставщика
    - material: Клапаны и фурнитура
      source: Китайские OEM-поставщики
      certified: ISO 9001, сертификаты на материалы по каждой партии

