qc_section:
  tagline: Контроль качества
  title: Процесс испытаний и подтверждения качества
  subtitle: Каждая доска проходит обязательные испытания перед отгрузкой. Наша лаборатория качества работает независимо от производства и подчиняется непосредственно руководству.
  steps:
    - step: '1'
      title: Контроль сырьевых материалов
      desc: Ткани PVC, Hypalon и drop-stitch проходят испытание на разрывное усилие (), распространение разрывов и проверку устойчивости к УФ-излучению до того, как любая партия попадёт в производство.
    - step: '2'
      title: 24-часовое испытание на герметичность
      desc: Каждая трубчатая камера накачивается до 18.0 PSI и выдерживается 24 часа. Падение давления более 0.50 PSI приводит к автоматическому браку и повторной проверке швов.
    - step: '3'
      title: Испытания на нагрузку и стабильность
      desc: Готовые доски накачиваются до рабочего давления и проверяются на симметричное распухание, жёсткость при 15 PSI и устойчивость под нагрузкой. Каждая доска проходит испытание в нашем испытательном бассейне перед финальным контролем.

oem_section:
  tagline: Проекты OEM
  title: Кейсы партнёрства с брендами по OEM
  subtitle: От концепции до производства — как мы помогаем мировым брендам запускать и масштабировать линейки надувных SUP.
  cases:
    - challenge: Европейскому ритейлеру активного отдыха требовалась линейка SUP под собственной маркой с уникальной графикой на палубе, экологичным PVC и упаковкой, готовой для розницы, — всё это за 60 дней.
      solution: Разработали индивидуальные файлы цифровой печати, подобрали PVC, соответствующий REACH, и сократили циклы выборочных испытаний с 3 до 1, разместив команду разработки на нашем заводе в Циндао.
      result: 25–35 дней производства от подписанного заказа, первая поставка в пределах 60-дневного окна. 2,400 единиц по 4 артикулам. Повторный заказ размещён до полной отгрузки первой партии.
      disclaimer: 'Обезличенное описание проекта — тип и объём проекта показательны; конкретные результаты не поддаются независимой проверке.'
    - challenge: Американскому стартапу в сфере водного спорта требовалась высокопроизводительная доска SUP с индивидуальной формой, упаковкой с ко-брендингом и сертификацией BSCI для размещения в рознице.
      solution: Адаптировали существующую пресс-форму SUP с изменённым контуром, разработали макеты упаковки с ко-брендингом и предоставили полный комплект документации по аудиту BSCI.
      result: 'Успешные размещения в ключевых розничных сетях активного отдыха США, обеспечившие высокую динамику: более 5,000 единиц продано за первый год при доле продаж 98%.'
      disclaimer: 'Обезличенное описание проекта — тип и объём проекта показательны; конкретные результаты не поддаются независимой проверке.'
    - challenge: Австралийскому дистрибьютору требовалась линейка SUP с сертификатом CE, индивидуальными цветами и соответствием австралийским стандартам.
      solution: Изготовили предсерийные образцы в 4 цветовых вариантах и координировали сторонние испытания на соответствие требованиям.
      result: Линейка SUP из 3 моделей запущена на рынке AU/NZ. Затем получена победа в государственном тендере на 12 патрульных SUP.
      disclaimer: 'Обезличенное описание проекта — тип и объём проекта показательны; конкретные результаты не поддаются независимой проверке.'

faq_section:
  tagline: FAQ
  title: Часто задаваемые вопросы по B2B и OEM
  questions:
    - q: Каков минимальный заказ (MOQ) для OEM-производства надувных досок SUP?
      a: 'MOQ определяется конфигурацией проекта, а не фиксированным числом: корпусом и оснасткой, цветовыми вариантами и PVC, макетами, упаковкой и аксессуарами. Стандартное серийное производство выполняется объёмом 90–100+ единиц в партии из полного рулона drop-stitch 150 m, малые партии с ко-брендингом начинаются с 5–10 единиц, и каждый проект проходит этапы образца (1–2 единицы) и пилотной партии (20–50 единиц). Полную логику расчёта см. в нашем руководстве по MOQ и гибкому брендированию.'
    - q: Есть ли у Vatrad сертификация BSCI?
      a: Да. Наш завод поддерживает действующий сертификат соответствия BSCI (отчёт об аудите предоставляется по запросу). Также мы располагаем ISO 9001 для менеджмента качества. Сертификация CE применяется к моделям, предназначенным для рынков ЕС; объём подтверждается по каждому проекту. Документация о соответствии REACH и RoHS предоставляется с каждым заказом OEM.
    - q: Каков типичный срок изготовления по заказу OEM?
      a: Стандартный срок составляет 25–35 дней с момента подтверждения заказа и предоплаты для серийного OEM-производства. Разработка нестандартной пресс-формы добавляет 15–20 дней на оснастку. Для срочных заказов и сезонных пиков доступно ускоренное производство. Образцы-прототипы обычно готовы за 7–12 дней.
    - q: Вы занимаетесь экспортной документацией?
      a: Да. Наша команда самостоятельно ведёт экспортную документацию и таможенное оформление, и мы поставляем продукцию более чем в 50 стран рынков ЕС, США, Австралии и Азии.

b2b_moq: 'MOQ определяется конфигурацией проекта: образец 1–2, пилот 20–50, объём 90–100+ (на рулон 150 m); малые партии с ко-брендингом от 5–10 единиц.'

production_flow:
  tagline: Производственный поток
  title: От материала к готовой доске
  subtitle: Каждая доска проходит 6 этапов производства с контрольными точками качества на каждом шаге. Никаких сокращений, никаких пропущенных проверок.
  stages:
    - stage: '01'
      title: Приёмка материалов и входной контроль качества
      description: 'Все входящие материалы регистрируются в нашей ERP-системе по номеру партии. Рулоны ткани PVC, сердцевины drop-stitch, клапаны, клеевые составы и фурнитура помещаются на карантин до подписания службой контроля качества.'
      qc_check: 'Разрывное усилие (ASTM D751), сопротивление разрыву (ISO 4674), измерение толщины, вязкость клея, визуальный контроль дефектов'
      qc_threshold: 'Испытываются 100% партий. Брак при разрывном усилии < 90% от спецификации, надрыве < минимального значения по спецификации или любом визуальном дефекте'
      responsibility: Бригада входного контроля качества (3 инспектора)
    - stage: '02'
      title: Раскрой с ЧПУ и подготовка материалов
      description: 'Компьютерная оптимизация раскладки размещает панели на заготовках PVC с минимальным отходом. Автоматические станки раскроя с ЧПУ обеспечивают позиционную точность 0.1 mm.'
      qc_check: 'Размерный контроль по файлам CAD DXF, контроль качества кромки, проверка количества панелей'
      qc_threshold: 'Измеряется каждая 20-я панель. Допуск ±0.5 mm. Партия отклоняется при более 2% вне допуска'
      responsibility: Начальник раскройного цеха
    - stage: '03'
      title: Сварка и соединение сердцевины Drop-Stitch
      description: 'Сердцевины drop-stitch соединяются с наружными слоями PVC методом термоламинации. Трубчатые камеры свариваются методом ВЧ-сварки или термовоздушной сварки. Усилители борта соединяются в три слоя.'
      qc_check: 'Испытание на отрыв каждые 50 единиц (ASTM D751), измерение ширины шва, проверка журнала температур термовоздушной сварки, визуальный осмотр швов с подсветкой'
      qc_threshold: 'Минимальная прочность на отрыв 8 N/cm. Допуск ширины шва ±1 mm. Любая видимая канальность = брак'
      responsibility: Контроль качества сварки (2 инспектора в смену)
    - stage: '04'
      title: Сборка и оснастка
      description: 'Доски переходят на финальную сборку, где соединяются все компоненты: панели палубы и корпуса сплавляются, устанавливаются клапаны, D-кольца, ручки, крепления для плавника и сумка для переноски. Каждая единица проходит чек-лист сборки из 100 пунктов.'
      qc_check: 'Подписание чек-листа из 100 пунктов по каждой единице, испытание функции клапана (10 циклов открытия и закрытия), проверка момента затяжки фурнитуры, визуальный контроль'
      qc_threshold: 'Политика нулевого брака для критичных для безопасности позиций (клапаны, D-кольца, ручки). Незначительные дефекты внешнего вида: AQL 2.5 (ISO 2859)'
      responsibility: Бригадир сборочного участка + контроль качества линии
    - stage: '05'
      title: Испытание давлением и удержание качества
      description: 'Каждая камера накачивается до 18.0 PSI (для SUP с номинальным 12–15 PSI) и выдерживается 24 часа. Датчики давления ведут непрерывную запись. Камеры с падением давления более 0.50 PSI отбраковываются и направляются на повторную проверку швов.'
      qc_check: 'Журнал 24-часового удержания давления, ежедневная проверка калибровки датчиков, показание давления с компенсацией температуры, повторное испытание швов после ремонта'
      qc_threshold: 'Максимальное падение давления 0.50 PSI за 24 ч при стабильной температуре. Превышение по любой камере = повторное испытание 100% всей производственной партии'
      responsibility: Лаборатория качества (независимо от производства, подчиняется руководству)
    - stage: '06'
      title: Финальный контроль и упаковка
      description: 'Финальный визуальный и функциональный контроль. Дефекты поверхности, однородность цвета, проверка этикеток и BIN, целостность упаковки, комплектность аксессуаров. Единицы вакуумируются, укладываются в короба и паллетируются для погрузки в контейнер.'
      qc_check: 'Полный визуальный контроль, чек-лист аксессуаров по каждому артикулу, тест упаковки на падение (1 m, случайная выборка), проверка считывания этикеток и штрихкодов'
      qc_threshold: 'AQL 2.5 для существенных дефектов, AQL 4.0 для незначительных. Нулевой допуск на дефекты безопасности. 100% единиц визуально проверено'
      responsibility: Бригада финального контроля качества (4 инспектора) + бригадир упаковки

