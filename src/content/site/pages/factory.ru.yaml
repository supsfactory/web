workshops_section:
  tagline: Цеха
  title: Производственные цеха
  workshops:
    - title: Раскрой PVC и подготовка материалов
      description: Автоматические станки раскроя с ЧПУ обрабатывают ткани PVC, Hypalon и drop-stitch с точностью до долей миллиметра. Компьютерная оптимизация раскладки минимизирует отходы материалов и гарантирует, что каждая панель соответствует своей размерной спецификации до сварки.
      image: https://assets.isupfactory.com/images/sups/hero/production-dept.webp
      alt: Станок раскроя PVC с ЧПУ готовит панели ткани надувной SUP на заводе в Циндао
    - title: Сварка трубок и термосваривание
      description: Специализированный сварочный цех с машинами термосваривания и прессами для ВЧ-диэлектрической сварки. Термовоздушные сварочные аппараты соединяют и сплавляют трубчатые камеры из PVC, а ВЧ-сварка формирует высокопрочные герметичные швы, превышающие требования.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Станок ВЧ-сварки герметизирует трубчатые камеры надувной лодки на заводе в Циндао
    - title: Соединение сердцевины Drop-Stitch
      description: Сердцевины drop-stitch досок SUP соединяются с наружными слоями PVC методом термоламинации. Тысячи внутренних полиэфирных нитей соединяют верхний и нижний слои, создавая жёсткую конструкцию при 12-15 PSI. Усилители борта соединяются в три слоя для прочности кромки.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-sup-manufacturing.webp
      alt: Линия производства надувных SUP с оборудованием для соединения сердцевины drop-stitch на заводе в Циндао
    - title: Печать и нанесение изображений на SUP
      description: Доски SUP декорируются цифровой печатью для полноцветной графики и трафаретной печатью для логотипов и повторяющихся рисунков. Цифровые принтеры обеспечивают фотографическое качество дизайна палубы, а трафаретная печать даёт стойкие, насыщенные элементы бренда.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department-2.webp
      alt: Интерьер производственного цеха на заводе надувных SUP в Циндао
    - title: Финальная сборка и оснастка
      description: Сборочная линия, где на каждую доску SUP устанавливаются клапаны, D-кольца, ручки, крепления для плавника и накладки на палубу. Каждая доска проходит чек-лист сборки из 100 пунктов, который подписывает бригадир.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-production-department.webp
      alt: Производственный цех со сборочными рабочими местами на заводе в Циндао
    - title: Испытания и контроль качества
      description: Каждая готовая доска проходит обязательные испытания на герметичность, проверку прочности швов на отрыв и полную проверку систем перед отгрузкой. Наша лаборатория качества работает независимо от производства и подчиняется непосредственно руководству.
      image: https://assets.isupfactory.com/images/sups/factory/isupfactory-pressure-testing.webp
      alt: Испытание надувной SUP давлением на герметичность перед отгрузкой на заводе в Циндао

