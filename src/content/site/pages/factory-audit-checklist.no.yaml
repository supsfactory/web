meta:
  title: 'Fabrikkaudit-sjekkliste — hva du bør kontrollere før du velger en SUP-produsent | iSupfactory'
  description: 'Fabrikkaudit-sjekkliste for kjøpere av oppblåsbare SUP-brett: kvalitetssystem, kapasitet, materialsporbarhet, trykktesting, sosialt samsvar og dokumentasjon.'
  dateModified: '2026-08-21'
