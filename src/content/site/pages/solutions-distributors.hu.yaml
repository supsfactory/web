answer:
  label: 'Közvetlen válasz'
  text: 'A nagykereskedők és a márkák közvetlenül a gyárral dolgoznak: white-label SUP deszkák az Ön márkájában, gyári nagykereskedelmi árak, minden programhoz kizárólagos terület, 3–8 SKU az induláshoz és 45–60 napos fizetési határidők (mindegyik kereskedelmi megállapodás fenntartásával), a készlet 100%-a kiszállítás előtt nyomáspróbázva. Az indulási minimumok és a szállítási feltételek területenként közösen egyeztetendők, FOB Qingdao vagy CIF szállítással.'
