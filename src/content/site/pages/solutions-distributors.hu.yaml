faqs:
  tagline: Gyakori kérdések nagykereskedőknek
  title: 'A nagykereskedelmi program – gyakori kérdések'
  items:
    - q: 'Mi az új nagykereskedő minimális rendelési mennyisége?'
      a: 'Az új nagykereskedelmi partnerek általában minta- és előgyártás-jóváhagyási rendeléssel indulnak, majd az első konténerrel, amelyet az adott szezonra ütemezünk. A pontos minimumok a terület méretétől és a választott választéktól függenek; ügyfélmenedzsserje a választék- és márkatervezési szakaszban erősíti meg az indulási mennyiséget.'
    - q: 'Eladhatjuk a deszkákat saját márkanévvel?'
      a: 'Igen. A private label itt az alapmodell: a deszkákat az Ön márkájában gyártjuk, az Ön grafikájával, csomagolásával és specifikációival. Az iSupfactory kizárólag saját ügyfelei számára gyárt, és egyetlen piacon sem versenyez velük.'
    - q: 'Kizárólagosak a területek?'
      a: 'Igen. A nagykereskedelmi programok kizárólagos területeken alapulnak – minden nagykereskedelmi partner egy meghatározott országot vagy régiót fed le, és arra a piacra vonatkozó árakat és programtámogatást kap, a kereskedelmi megállapodás rendelkezései szerint.'
    - q: 'Kínálnak támogatást a drop-ship kiszállításhoz?'
      a: 'A drop-ship képesség része a programnak. A minták, a csomagolás és a kezelés a minta-jóváhagyási szakaszban kerül validálásra, így a drop-ship rendeléseket már az elején problémamentesen teljesítjük.'
    - q: 'Mely modelleket rendelhetünk?'
      a: 'A gyártási katalógus felfújható SUP deszkákat tartalmaz all-around, túra és szörf formákkal, felfújható kajakokat, pumpákat, evezőket, mentőmellényeket és ápolási tartozékokat, valamint a mérnöki csapatunkkal közösen fejlesztett testreszabott formákat. A legtöbb partner a legjobban kelendő 4–8 SKU-val indul, majd a következő szezonokban bővít.'
    - q: 'Hogyan adjuk fel a rendeléseket?'
      a: 'A rendelések a gyárból ütemezett indulásokkal indulnak útnak, előrendelés lehetőséggel a szállítási költségek stabilizálására. Az Ön dedikált ügyfélmenedzsserje a prognózisok és a szezon naptára alapján tervezi a gyártást és a feladást.'
    - q: 'Hogyan jelentkezhetek?'
      a: 'Használja az ezen az oldalon található jelentkezési űrlapot, vagy lépjen közvetlenül kapcsolatba velünk. A jelentkezéseket a nagykereskedelmi csapatunk bírálja el, és néhány munkanapon belül válaszolunk a következő lépésekkel, beleértve a terület feltérképezését és a megállapodás tervezetét.'

