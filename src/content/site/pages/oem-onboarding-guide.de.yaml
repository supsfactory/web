answer:
  label: 'Kurze Antwort'
  text: 'Ein typisches OEM-Onboarding dauert 2–4 Wochen bis zur Musterfreigabe und 6–8 Wochen bis zum ersten Produktionslauf ab bestätigtem Auftrag. Sie starten mit einem Projekt-Briefing (Board-Spezifikationen, Menge, Konformitätsanforderungen). Wir antworten innerhalb eines Werktages, bieten vor dem Austausch proprietärer Details eine NDA an und produzieren 1–2 physische Muster in 7–12 Tagen für Ihre Prüfung und Freigabe. Sobald das Muster eingefroren ist, folgen Produktionsplanung und Fertigung mit festen QC-Toren in jeder Stufe. Jeder Schritt ist dokumentiert und rückverfolgbar.'
  verified: 'September 2026'

process_steps:
  tagline: Die sieben Tore
  title: 'Onboarding-Ablauf — sieben Tore vom Briefing bis zur Lieferung'
  subtitle: 'Jedes Tor hat einen definierten Input, einen definierten Output und einen vorab vereinbarten Zeitplan. Sie passieren kein Tor ohne ausdrückliche Freigabe.'
  steps:
    - step: 'Tor 1'
      title: 'Erstanfrage & NDA (Tag 0)'
      desc: 'Reichen Sie über /contact ein Projekt-Briefing mit Ihren Ziel-Board-Spezifikationen, Bestellmenge, Konformitätsanforderungen und Zeitplan ein. Eine NDA ist sofort verfügbar — bevor Sie proprietäre technische Spezifikationen oder Artwork teilen. Antwort innerhalb eines Werktages.'
    - step: 'Tor 2'
      title: 'Machbarkeitsprüfung & Offerte (Tag 1–5)'
      desc: 'Das Engineering prüft Ihr Briefing gegen Fertigungskapazität, Materialverfügbarkeit und Konformitätsumfang. Sie erhalten eine positionsgenaue Offerte mit MOQ-Berechnung, Musterkosten (auf die Produktion angerechnet) und Lieferzeitteilen — kein grober Bereich, sondern ein Tor-für-Tor-Zeitplan.'
    - step: 'Tor 3'
      title: 'Musterproduktion (Tag 6–17)'
      desc: '1–2 physische Boards nach Ihrer Spezifikation: Rumpfsteifigkeit, EVA-Antirutschpad-Griffigkeit, Grafikgenauigkeit, Zubehörpassform. Sie fahren und bewerten das Board, bevor Sie sich auf etwas Festes einlassen. Musterkosten werden nach Vertragsunterzeichnung auf den Produktionsauftrag angerechnet.'
    - step: 'Tor 4'
      title: 'Musterprüfung & Freigabe (Tag 18–21)'
      desc: 'Sie bewerten das Muster gegen Ihre Spezifikationen — Fahrgefühl, Grafiktreue, Verpackung, Zubehör. Anpassungen werden in ein überarbeitetes BOM und eine Artwork-Freigabe aufgenommen. Die eingefrorene Spezifikation wird zur Produktionsreferenz für alle weiteren Läufe.'
    - step: 'Tor 5'
      title: 'Vorproduktionsplanung (Tag 22–28)'
      desc: 'Materialbeschaffung, Werkzeugaufbau, Verpackungsbestätigung und Reservierung des Produktionsslots. Alle Materialien werden beim Wareneingang gegen das eingefrorene BOM geprüft. Vor Produktionsbeginn wird ein Produktionsplan mit QC-Tor-Terminen ausgegeben.'
    - step: 'Tor 6'
      title: 'Produktion & QC-Tore (Tag 29–55)'
      desc: 'Die Fertigung läuft durch das 7-stufige Prüf-Torsystem: Wareneingangsprüfung, Drop-stitch-Gewebeprüfung, Schweißen & Montage, Druck- & Dichtigkeitstest (18,0 PSI Halt, automatische Aussortierung über 0,50 PSI Abfall), EVA-Pad- & Zubehörmontage, Grafik- & Branding-QC, Endverpackung & Dokumentation. Jedes Tor hat Bestanden/Nicht-bestanden-Kriterien und Rückverfolgungsprotokolle.'
    - step: 'Tor 7'
      title: 'Versand & Bewertung nach Lieferung (Tag 56–63)'
      desc: 'Exportgerechte Verpackung, Konformitätsdokumentation (CE, ISO 9001, BSCI, REACH, RoHS) und Seefracht-Koordination in über 50 Länder. Eine Bewertung nach der Lieferung erfasst Erkenntnisse und Verbesserungen für den nächsten Auftragszyklus.'

