checklist:
  heading: 'Was Sie vor Ihrem Projekt-Briefing vorbereiten sollten'
  body: |
    Je vollständiger Ihr Briefing, desto schneller und genauer die Offerte. So bereiten Sie sich vor:

    - **Board-Spezifikationen** — Ziellänge, Breite, Dicke, Fahrergewichtsbereich und beabsichtigter Einsatz (Touring, Allround, Surfen, Angeln, Yoga usw.). Wenn Sie Referenz-Maße oder ein Konkurrenzmodell haben, fügen Sie diese hinzu.
    - **Designdateien** — Vektor-Artwork (AI, SVG oder PDF) für Board-Grafik, EVA-Pad-Logo und sekundäres Branding. Falls das Artwork noch nicht fertig ist, reichen für die erste Machbarkeit eine Mood-Board oder Referenzbilder.
    - **Bestellmenge & Zeitplan** — Ihre Zielmenge für die erste Bestellung und den Saisonzeitplan, den Sie einhalten müssen. Auch ein grober Bereich („20–50 Boards bis März") reicht zur Bestätigung von Machbarkeit und Slot-Verfügbarkeit.
    - **Konformitätsanforderungen** — Zielmärkte (EU, Nordamerika, Australien usw.) und spezifische Zertifizierungs- oder Prüfanforderungen über unseren Standardumfang hinaus (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Budgetrahmen** — Ein indikativer Pro-Board-Budget oder Ziel-Landed-Cost hilft uns, die richtige Plattform und Konstruktionsstufe zu empfehlen. Der exakte Preis wird erst nach der technischen Prüfung bestätigt — nie davor.

    Wenn Sie noch nicht alles haben, reichen Sie ein, was Sie haben. Den Rest führen wir Sie.

