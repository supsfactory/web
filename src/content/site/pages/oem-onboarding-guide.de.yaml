faqs:
  tagline: FAQ
  title: 'OEM-Onboarding — häufig gestellte Fragen'
  items:
    - q: 'Wie lange dauert der gesamte Onboarding-Prozess?'
      a: 'Die Musterfreigabe dauert in der Regel 2–4 Wochen (inklusive Musterproduktion in 7–12 Tagen und Ihrer Prüfphase). Der erste Produktionslauf dauert 6–8 Wochen ab bestätigtem Auftrag und Anzahlung. Eine eigene Rumpfform addiert 15–20 Tage Formenbau. Jedes Tor hat einen vorab vereinbarten Zeitplan.'
    - q: 'Muss ich vor dem Teilen meines Designs eine NDA unterzeichnen?'
      a: 'Eine NDA ist auf Anfrage sofort verfügbar — bevor Sie proprietäre technische Spezifikationen oder Artwork teilen. Wir fertigen ausschließlich unter den Marken unserer Kunden und treten in keinem Markt in Konkurrenz zu ihnen. Dieselbe Politik gilt für ein Einzelmuster wie für ein Containerprogramm.'
    - q: 'Wie hoch ist die Mindestbestellung für einen ersten OEM-Lauf?'
      a: 'Der Einstieg ist gestaffelt: zuerst 1–2 Muster (verfügbar in 7–12 Tagen), dann eine Probe- oder Pilotbestellung von 20–50 Boards (Produktion in 25–35 Tagen), danach Standard-Mengenläufe von 90–100+ Boards pro freigegebener Konfiguration. Kleinserien-Co-Branding startet ab 5–10 Einheiten, wenn keine Entwicklungsstufe nötig ist. Musterkosten werden auf den Produktionsauftrag angerechnet.'
    - q: 'Wie wird der IP-Schutz während des Onboardings gehandhabt?'
      a: 'Ihre Designs und Spezifikationen sind durch die vor dem Austausch proprietärer Informationen unterzeichnete NDA geschützt. Alle Artwork-, BOM-Daten und technischen Dateien werden in zugriffskontrollierten Systemen mit Audit-Trails gespeichert. Im OEM-Modus besitzen Sie das gesamte IP. Im ODM-Modus wird die adaptierte Plattform-IP wie vereinbart geteilt. Im Private-Label-Modus bleibt das IP bei iSupfactory und Sie lizenzieren die Markenanwendung.'
    - q: 'Welche Qualitätsgarantien gelten für eine erste Bestellung?'
      a: 'Jedes Board — Muster, Probe oder Menge — durchläuft dasselbe 7-stufige Prüf-Torsystem: Wareneingangsprüfung, Drop-stitch-Gewebeprüfung, Schweißen & Montage, 24-Stunden-Druck- und Dichtigkeitstest (18,0 PSI Halt, automatische Aussortierung über 0,50 PSI Abfall), EVA-Pad- & Zubehörmontage, Grafik- & Branding-QC sowie Endverpackung & Dokumentation. Bei kleineren Bestellungen wird die Qualität nie heruntergefahren.'

