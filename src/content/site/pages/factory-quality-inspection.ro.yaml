      title: Zona de testare a etanșeității la aer
      desc: 'Plăci umflate reținute în zona de testare QC sub iluminare industrială, cu manometre digitale care monitorizează testul de retenție a aerului la baza valvei, cusăturile șinei, proră și pupa și locațiile de solicitare ridicată. Înregistrările sunt păstrate per lot și legate de inspecția finală.'
    - image: https://assets.isupfactory.com/site/quality/qc-hold-quarantine-station.avif
