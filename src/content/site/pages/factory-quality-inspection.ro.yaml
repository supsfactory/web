rework_intro:
  tagline: Guvernanța retușurilor
  title: Controlul neconformităților de etanșeitate la aer și guvernanța retușurilor
  body: |
    La QINGDAO VATRAD GROUP.,LTD., retușul este definit strict ca readucerea unei unități neconforme la conformitate deplină cu specificația sa de inginerie originală — nu ca o reparație rapidă. Orice placă identificată cu o neconformitate de etanșeitate la aer este plasată sub reținere controlată și legată de un Raport de Neconformitate (NCR) înainte de orice procesare ulterioară; sursa scurgerii este localizată și înregistrată folosind metoda de diagnosticare aprobată.

    Retușul poate continua numai atunci când defectul se află în domeniul de retuș aprobat și este disponibilă o metodă autorizată. Instrucțiunea de retuș identifică produsul, lotul, locația defectului, materialul aprobat, metoda, condițiile necesare și domeniul de re-inspecție. După perioada necesară de întărire sau stabilizare, placa este re-inspectată față de aceleași criterii aplicabile de acceptare ca o placă conformă — retușul nu reduce niciodată standardul de acceptare. Eșecul re-inspecției necesită o nouă dispoziție de inginerie și calitate; retușurile repetate nu sunt permise fără aprobare documentată.

rework_decision:
  tagline: Flux interactiv
  title: Flux de decizie pentru retuș — faceți clic pe orice nod
  subtitle: Urmăriți modul în care o neconformitate de etanșeitate la aer este gestionată de la detectare până la eliberare sau deșeu. Faceți clic pe un nod pentru a extinde cerințele de control la acel pas.
  nodes:
    - id: detect
      type: start
      label: Scurgere detectată
      detail: 'O neconformitate de etanșeitate la aer este identificată în timpul inspecției — eșec de retenție a presiunii, scurgere vizibilă sau un defect conex al sistemului de aer.'
    - id: hold
      type: step
      label: Oprire linie · Etichetă HOLD · NCR
      detail: 'Procesarea se oprește. ID-ul plăcii, codul produsului, lotul, stația de lucru, data și inspectorul sunt înregistrate; se atașează o etichetă HOLD / QUARANTINE și se deschide un NCR față de revizia de specificație aplicabilă.'
    - id: locate
      type: step
      label: Localizarea sursei scurgerii
      detail: 'Placa este umflată la presiunea de diagnosticare aprobată pentru proiect, iar sursa este localizată cu o metodă aprobată — retenția presiunii, testarea calibrată cu bule, echipament acustic sau de detectare a scurgerilor.'
    - id: classify
      type: step
      label: Clasificarea defectului (A–G)
      detail: 'Defectul este clasificat față de matricea de aprobare: A interfața valvei, B cusătura bazei valvei, C perforație de suprafață, D cusătură locală a șinei, E defect major al șinei, F scurgere recurentă, G deteriorare structurală.'
    - id: authorize
      type: decision
      label: Retuș autorizat?
      yes: rework
      no: escalate
      detail: 'QC confirmă categoria defectului, iar Ingineria analizează dacă placa poate fi readusă la specificația sa originală. Autorizarea înregistrează fișa de metodă, materialele, condițiile și domeniul de re-inspecție — sau direcționează către înlocuire, respingere, deșeu sau concesie comercială din partea clientului.'
    - id: rework
      type: step
      label: Retuș controlat
      detail: 'Executat numai în limitele defectului aprobat, folosind fișa de metodă, lotul de material și uneltele aprobate — fără a modifica niciodată dimensiunile, construcția, grafica, accesoriile sau cerințele de ambalare.'
    - id: cure
      type: step
      label: Întărire și stabilizare
      detail: 'Placa rămâne pe HOLD pe durata perioadei de întărire și stabilizare definite de materialul și instrucțiunea de proces aprobate, apoi primește o pre-verificare vizuală și de execuție.'
    - id: reinspect
      type: decision
      label: Re-inspecție trecută?
      yes: release
      no: escalate
      detail: 'Placa este umflată la presiunea de re-inspecție aprobată pentru proiect, iar defectul original plus toate caracteristicile potențial afectate sunt reverificate — locația scurgerii, valva, șinele, cusăturile, zonele de solicitare ridicată, accesoriile și aspectul. Retușul nu reduce niciodată standardul de acceptare.'
    - id: release
      type: release
      label: Eliberarea calității
      detail: 'Calitatea revizuiește NCR-ul închis, înregistrarea de retuș și rezultatul re-inspecției și autorizează eliberarea. Nicio placă retușată nu este ambalată sau expediată fără eliberarea autorizată a calității.'
    - id: escalate
      type: escalate
      label: Escaladare — Înlocuire / Deșeu / Concesie
      detail: 'Fără retușuri repetate fără aprobare documentată. Placa este direcționată către înlocuire, respingere, deșeu sau o concesie comercială scrisă din partea clientului, atunci când specificația originală nu poate fi restabilită.'

defect_matrix:
  tagline: Clasificarea defectelor
  title: Clasificarea defectelor de etanșeitate la aer și matricea de aprobare
  subtitle: Nu fiecare scurgere este retușată — fiecare defect este clasificat, iar dispoziția sa este aprobată la nivelul corect, de la inspectorul QC până la directorul fabricii.
  headers:
    category: Categoria defectului
    area: Zona tipică
    eligibility: Eligibilitate pentru retuș
    approval: Aprobarea necesară
  rows:
    - category: 'Clasa A — Interfața valvei'
      area: 'Nucleul valvei, etanșarea capacului, garnitura, interfața pompei'
      eligibility: 'Retuș standard autorizat'
      approval: 'Inspector QC'
    - category: 'Clasa B — Cusătura bazei valvei'
      area: 'Micro-scurgere de-a lungul marginii valvei'
      eligibility: 'Retuș evaluat conform fișei de metodă aprobate'
      approval: 'QC + Inginerie'
    - category: 'Clasa C — Perforație de suprafață'
      area: 'Micro-perforație locală pe o suprafață fără solicitare'
      eligibility: 'Autorizat numai când este conform cu specificațiile clientului'
      approval: 'QC + Inginerie'
    - category: 'Clasa D — Cusătură locală a șinei'
      area: 'Scurgere locală de suprapunere pe banda șinei'
      eligibility: 'Risc ridicat; este necesară o dispoziție strictă de inginerie'
      approval: 'Inginerie + Șef QA'
    - category: 'Clasa E — Defect major al șinei'
      area: 'Defect continuu de cusătură în zone de solicitare ridicată'
      eligibility: 'Retuș standard neautorizat — înlocuire sau analiză a cauzei rădăcină'
      approval: 'Șef QA + Concesie client'
    - category: 'Clasa F — Scurgere recurentă'
      area: 'Scurgere nelocalizabilă sau eșec la re-testare'
      eligibility: 'Fără retuș repetat; înlocuire, deșeu sau analiză de inginerie a cauzei rădăcină'
      approval: 'Șef QA / Inginerie'
    - category: 'Clasa G — Deteriorare structurală'
      area: 'Deteriorarea materialului, delaminare, deformarea plăcii'
      eligibility: 'Eliberare prin retuș neautorizată — înlocuire, deșeu sau concesie scrisă a clientului'
      approval: 'Manager de calitate + Aprobarea clientului'

rework_flow:
  tagline: Buclă închisă în 7 pași
  title: Flux de lucru controlat pentru retuș — de la detectare la eliberare sau deșeu
  subtitle: 'Fiecare retuș de etanșeitate la aer urmează aceeași buclă controlată: detectare, carantină, diagnosticare, autorizare, retuș, re-inspecție, eliberare.'
  steps:
    - step: '01'
      title: Detectare, oprirea liniei și carantină
      desc: 'Procesarea se oprește imediat pe placa afectată. ID-ul plăcii, codul produsului, lotul, stația de lucru, data și inspectorul sunt înregistrate, se atașează o etichetă HOLD / QUARANTINE și se deschide un NCR față de revizia de specificație aplicabilă.'
    - step: '02'
      title: Diagnosticarea sistematică a scurgerii
      desc: 'Placa este umflată la presiunea de diagnosticare aprobată pentru proiect, iar sursa scurgerii este localizată cu o metodă aprobată — retenția presiunii, testarea calibrată cu bule, echipament acustic sau de detectare a scurgerilor. Locația suspectă este marcată fără a deteriora placa.'
    - step: '03'
      title: Dispoziția de inginerie și autorizarea
      desc: 'QC confirmă categoria defectului, iar Ingineria analizează dacă placa poate fi readusă la specificația sa originală. O autorizare de retuș care face referire la NCR înregistrează metoda, materialele, condițiile și domeniul de re-inspecție aprobate — sau atribuie înlocuirea, respingerea, deșeul sau concesia comercială din partea clientului.'
    - step: '04'
      title: Execuția retușului controlat
      desc: 'Retușul este executat numai în limitele defectului aprobat, folosind fișa de metodă, lotul de material și uneltele aprobate. Dimensiunile plăcii, construcția, grafica, configurația accesoriilor și cerințele de ambalare nu sunt niciodată modificate.'
    - step: '05'
      title: Stabilizarea întăririi și pre-verificarea
      desc: 'Placa retușată rămâne în stare HOLD pe durata perioadei de întărire și stabilizare definite de materialul și instrucțiunea de proces aprobate, apoi primește o pre-verificare vizuală și de execuție înainte de re-inspecție.'
    - step: '06'
      title: Re-inspecția și testarea de probă
      desc: 'Placa este umflată la presiunea de re-inspecție aprobată pentru proiect, iar defectul original plus toate caracteristicile potențial afectate sunt reverificate: locația scurgerii și zona înconjurătoare, valva, șinele, cusăturile, zonele de solicitare ridicată, accesoriile și aspectul. Retușul nu reduce niciodată standardul de acceptare.'
    - step: '07'
      title: Eliberarea QA sau dispoziția finală
      desc: 'Calitatea revizuiește NCR-ul finalizat, înregistrarea de retuș și rezultatul re-inspecției, apoi autorizează eliberarea — sau escaladează către înlocuire, respingere, deșeu sau concesie comercială din partea clientului. Nicio placă retușată nu este ambalată sau expediată fără eliberarea autorizată a calității.'

quality_safeguards:
  tagline: Măsuri de protecție a calității
  title: Reguli anti-eroare care vă protejează marca
  subtitle: Controale stricte care previn buclele de reparație necontrolate — un retuș documentat per defect, praguri de alertă la nivel de lot, instrumente calibrate și condiții de testare controlate.
  features:
    - icon: 1
      icon_bg: blue
      title: Un retuș per defect
      desc: 'O singură locație poate fi retușată o dată, conform unei instrucțiuni autorizate. Dacă re-inspecția eșuează în continuare, placa este escaladată pentru înlocuire, respingere, deșeu sau concesie comercială din partea clientului — retușurile repetate fără aprobare documentată nu sunt permise.'
    - icon: 2
      icon_bg: green
      title: Alertă de lot și oprirea liniei
      desc: 'Când neconformitatea într-un lot de producție depășește pragul stabilit de inginerie, linia este oprită, iar Ingineria investighează cauza — lotul de material, condițiile de proces și înregistrările — înainte ca producția să reia.'
    - icon: 3
      icon_bg: purple
      title: Instrumentație calibrată
      desc: 'Manometrele, manometrele digitale și Cronometrele folosite pentru testarea etanșeității la aer sunt controlate și calibrate de laboratoare terțe în perioada lor de valabilitate, cu starea calibrării vizibilă în zona de inspecție.'
    - icon: 4
      icon_bg: orange
      title: Condiții de testare controlate
      desc: 'Zonele de testare a etanșeității la aer și de întărire sunt menținute într-un mediu controlat, astfel încât rezultatele să nu fie afectate de variațiile de temperatură dintre zi și noapte.'

rework_boundaries:
  tagline: Domeniu și limite
  title: Ce nu acoperă acest sistem
  body: |
    Sistemul de control al retușurilor se aplică plăcilor SUP gonflabile finalizate sau în proces identificate cu scurgeri de aer, eșec de retenție a presiunii sau defecte conexe ale sistemului de aer înainte de eliberarea expediției. Nu autorizează modificări ale construcției, materialelor, graficii, configurației produsului sau cerințelor clientului aprobate și nu acoperă:

    - Produsele deja expediate sau aflate în canalele clienților.
    - Deteriorarea structurală sau deformarea plăcii neevaluate de Inginerie.
    - Defectele extinse ale șinei sau cusăturilor, deteriorarea materialului de miez sau defectele care pot afecta siguranța.
    - Proiectele în care retușul nu este permis: mostre aprobate de client, unități de certificare sau de testare.
    - Proiectele cu procese proprietare ale clientului, materiale speciale sau cerințe speciale de reparație.
    - Scurgerile recurente care nu pot fi localizate sau plăcile care eșuează din nou după retuș.

    Orice abatere de la specificațiile clientului necesită o analiză de inginerie documentată și, acolo unde este cazul, aprobarea scrisă a clientului. Plăcile care nu pot fi readuse la specificația lor originală sunt eliberate numai în baza unei concesii explicite din partea clientului — niciodată doar de către producție.

method_cards:
  tagline: Sistemul fișelor de metodă
  title: Indexul fișelor de metodă pentru retuș controlat
  subtitle: 'Instrucțiunea generală controlează procesul; fișele de metodă controlează operația. Instrucțiunea de retuș (WI-QC-AT-001) face referire la fișele de metodă MC-RW-01 până la MC-RW-06, plus MC-RW-00 pentru deșeu și respingere obligatorii.'
  headers:
    code: Fișa de metodă
    defect: Clasa de defect
    scope: Domeniu de aplicare
    controls: Controale cheie de inginerie
    approval: Autoritate de semnare
  rows:
    - code: MC-RW-01
      defect: Clasa A (Interfața valvei)
      scope: 'Service-ul nucleului valvei, curățarea și re-asamblarea etanșării'
      controls: 'Cheie dinamometrică calibrată, sediu curat pentru garnitură, fără deteriorarea filetelor valvei'
      approval: 'Inspector QC'
    - code: MC-RW-02
      defect: Clasa B (Perimetrul valvei)
      scope: 'Etanșarea flanșei bazei valvei și strângere controlată'
      controls: 'Pregătire controlată a suprafeței, material de lipire aprobat, dispozitiv circular de presiune'
      approval: 'QC + Inginerie'
    - code: MC-RW-03
      defect: Clasa C (Micro-scurgere de suprafață)
      scope: 'Etanșarea perforațiilor nestructurale'
      controls: 'Adeziv aprobat în două componente, fără scurgeri în grafică sau EVA'
      approval: 'QC + Inginerie'
    - code: MC-RW-04
      defect: Clasa D (Cusătură locală a șinei)
      scope: 'Re-lipirea cusăturii locale de suprapunere a șinei'
      controls: 'Activare termică controlată, rolă de presiune, dispozitiv anti-ondulare'
      approval: 'Inginerie + Șef QA'
    - code: MC-RW-05
      defect: Clasa B/C (Marginea accesoriului)
      scope: 'Etanșarea patch-ului cutiei de derivoare și a bazei de montare a accesoriilor'
      controls: 'Promotor de aderență de suprafață, bloc de strângere profilat, perioadă de reținere definită'
      approval: 'QC + Inginerie'
    - code: MC-RW-06
      defect: Clasa D (Cusătură proră/pupa)
      scope: 'Intervenție pe cusăturile de curbură solicitate ridicat'
      controls: 'Material de lipire aprobat pentru forfecare ridicată, perioadă de întărire extinsă înainte de re-testare'
      approval: 'Inginer Șef'
    - code: MC-RW-00
      defect: Clasa E/F/G (Critic / Ruptură)
      scope: 'Deșeu obligatoriu și distrugere fizică'
      controls: 'Tăiere fizică pentru a preveni amestecul, înregistrare a deșeului, analiză interdepartamentală a cauzei rădăcină'
      approval: 'Director de fabrică'

inspector_friendly:
  tagline: Inspecția terță
  title: Protocol prietenos pentru inspectori
  body: |
    Oferim o zonă de inspecție dedicată, cu manometre calibrate, mese de lumină standardizate pentru verificarea cusăturilor și graficii, și Instrucțiuni de Inspecție pre-completate, astfel încât agențiile terțe (SGS, BV, Intertek, QIMA) să poată finaliza eficient inspecția înainte de expediție — economisind timpul dumneavoastră de inspecție.

    Fiecare instrucțiune rezumă reviziile aplicabile ale documentelor, referința mostrei aprobate, verificările critice pentru calitate, nivelul de eșantionare convenit, testele funcționale și cerințele de ambalare și cod de bare pentru comanda respectivă. Cantitățile specificate, calitatea, ambalarea și elementele de siguranță de bază sunt verificate față de referințele aprobate ale proiectului — fără căutări de documente în ultima clipă la fața locului.

