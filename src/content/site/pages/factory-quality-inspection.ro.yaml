answer:
  label: 'Răspuns direct'
  text: 'QINGDAO VATRAD GROUP.,LTD. controlează calitatea plăcilor SUP gonflabile printr-un sistem de verificare în 4 etape: controlul materialelor la intrare (IQC), controlul calității în proces (IPQC), testarea finală a plăcii și verificarea umflării (FQC) și ambalarea și eliberarea înainte de expediție (OQC). Fiecare comandă este inspectată față de mostra aprobată, specificația tehnică, proba de grafică, BOM și standardele de ambalare, cu verificarea etanșeității la aer, controale vizuale și dimensionale, confirmarea accesoriilor și trasabilitatea loturilor. Articolele care nu îndeplinesc criteriile de acceptare sunt plasate sub reținere controlată sau în carantină, retușate numai conform instrucțiunilor aprobate și re-inspectate înainte de eliberarea autorizată.'
  verified: 'Septembrie 2026'

intro: 'Sistemul nostru de calitate este construit pentru proiecte OEM/ODM: criteriile de inspecție sunt definite per comandă, documentate și respectate de echipele de producție și calitate de la materialul la intrare până la ambalare. Astfel, așteptările de calitate rămân aliniate între fabrică și marca dumneavoastră, de la prima mostră până la expedițiile complete cu container.'

scope_note:
  tagline: Domeniu de aplicare
  title: Criterii de inspecție specifice proiectului
  body: |
    Specificațiile de calitate pot varia în funcție de construcția plăcii (de exemplu, un singur strat/dublu strat, drop-stitch țesut, șină fuzionată), de utilizarea finală prevăzută, de reglementările pieței țintă și de parametrii aprobați de client. Autorizarea finală de eliberare se bazează strict pe criteriile de inspecție documentate și convenite pentru comandă.

stages:
  tagline: Cadrul de calitate
  title: Sistemul nostru de verificare a calității în 4 etape
  subtitle: Un ciclu QC complet, de la sosirea materialului brut până la eliberarea expediției.
  steps:
    - title: '1. Controlul materialelor la intrare (IQC)'
      desc: 'Materialele principale și componentele achiziționate sunt verificate față de specificațiile aprobate și mostrele de referință înainte de a intra pe linia de producție. Drop-stitch și PVC sunt verificate pentru identificarea materialului, lotul furnizorului, greutate/densitate, grosime, potrivirea culorii față de mostrele aprobate și defectele de suprafață. Suprapușurile de tracțiune EVA sunt verificate pentru model, culoare, grosime, acuratețea tăierii și compatibilitatea adezivului. Valvele și feroneria trec prin teste de funcționare, filet, integritate a etanșării și montaj. Accesoriile și ambalajele (pompe, vâsle, derivoare, lese, genți, cutii) sunt potrivite pentru cantitate, culoare, branding, acuratețea codului de bare și versiunea graficii față de BOM-ul aprobat.'
    - title: '2. Controlul calității în proces (IPQC)'
      desc: 'Etapele critice de producție sunt inspectate pentru a detecta neconformitățile înainte ca plăcile să treacă la stațiile următoare. Tăierea și tipărirea sunt verificate pentru dimensiunile panourilor, aspectul graficii, orientarea în oglindă și curățenia marginilor față de desenele tehnice aprobate. Asamblarea plăcii și lipirea șinei sunt verificate pentru simetria conturului, continuitatea suprapunerii cusăturilor și eliminarea golurilor sau pungilor de aer de-a lungul zonelor de solicitare ridicată. Fixarea valvelor și a accesoriilor, grafica și brandingul sunt verificate pentru poziție, orientare, acoperirea adezivului, ortografia logo-ului și versiunea graficii.'
    - title: '3. Testarea finală a plăcii și verificarea umflării (FQC)'
      desc: 'Plăcile finalizate trec prin testare fizică și structurală obligatorie înainte de aprobarea ambalării. Plăcile sunt umflate la presiunea de inspecție aprobată pentru proiect și menținute pentru a verifica rigiditatea structurală și stabilitatea presiunii. Scanările de etanșeitate la aer acoperă carcasa valvei, cusăturile șinei, conurile de proră/pupa și îmbinările de solicitare, folosind metode calibrate de detectare a scurgerilor (monitorizarea scăderii de presiune sau testarea cu bule). Inspecția cosmetică și dimensională verifică dimensiunile, profilul de rocker și alinierea suprapușului EVA (toleranță ±2 mm) sub iluminare standard de lumină naturală.'
    - title: '4. Ambalarea și eliberarea înainte de expediție (OQC)'
      desc: 'Verificarea completă înainte de expediție asigură zero nepotriviri în configurația SKU sau în marcajele de expediere. Caracterul complet al kitului verifică încrucișat placa, derivoarea, lesa, vâsla, pompa, geanta, kitul de reparații și manualul de utilizare față de BOM-ul comenzii. Verificările de ambalare și cod de bare verifică marcajele cutiei, etichetele SKU, lizibilitatea codului de bare, limba manualului și integritatea structurală a cutiei. Comenzile sunt eliberate numai după ce auditul final de ambalare este semnat de personalul de calitate autorizat.'

inspection_points:
  tagline: Acoperirea inspecției
  title: Puncte cheie de control al inspecției
  subtitle: Fiecare punct de control este executat față de criterii de acceptare documentate și convenite per comandă.
  features:
    - icon: A
      icon_bg: blue
      title: Verificarea etanșeității la aer
      desc: 'Plăcile finalizate sunt umflate la presiunea de inspecție aprobată și verificate pentru retenția presiunii, starea bazei valvei, cusăturile șinei, zonele de proră și pupa și locațiile de solicitare ridicată. Acolo unde procedura de inspecție o cere, zonele suspecte de scurgere sunt examinate cu metode aprobate de detectare a scurgerilor.'
    - icon: B
      icon_bg: green
      title: Inspecția vizuală și dimensională
      desc: 'Plăcile sunt inspectate sub iluminare adecvată pentru starea suprafeței materialului, defecte de tipărire, variații de culoare, alinierea EVA, cute, zgârieturi, contaminare și aspectul lipirii. Dimensiunile cheie și pozițiile accesoriilor sunt verificate față de desenele sau specificațiile aprobate.'
    - icon: C
      icon_bg: purple
      title: Verificarea accesoriilor și ambalajului
      desc: 'Configurația completă a produsului este verificată înainte de expediție: modelul plăcii, sistemul de derivoare, vâsla, pompa, lesa, geanta de transport, kitul de reparații, manualul de utilizare și accesoriile specifice clientului — fiecare potrivit cu mostra aprobată, desenele și BOM-ul.'
    - icon: D
      icon_bg: orange
      title: Ambalarea și eliberarea expediției
      desc: 'Unitățile ambalate sunt verificate pentru configurația SKU, caracterul complet al accesoriilor, etichetele produsului, informațiile codului de bare, versiunea manualului de instrucțiuni, marcajul cutiei, cantitatea de ambalare și starea cutiei. Eliberarea expediției este autorizată numai după finalizarea tuturor cerințelor de inspecție și ambalare.'

traceability_intro:
  tagline: Trasabilitatea loturilor
  title: Sistem de trasabilitate la nivel de proiect și de lot
  body: |
    Fiecare comandă SUP personalizată este gestionată sub un cod de proiect unificat care leagă specificațiile tehnice, BOM-ul aprobat, reviziile graficii, numerele de lot ale materialelor, referințele de ambalare și înregistrările de inspecție. Înregistrările de producție și inspecție sunt menținute pe proiectul aplicabil și pe lotul de producție, iar fiecare lot poate fi legat înapoi de specificația de produs aprobată, BOM, grafică și referințele de ambalare.

    Aceasta sprijină revizuirea eficientă a configurației produsului, a stării inspecției și a domeniului afectat în cazul identificării unei probleme de calitate — de la produsul finit înapoi la înregistrările sursă, folosind identificarea plăcii sau a cutiei.

traceability_chain:
  tagline: Lanțul de trasabilitate
  title: De la codul de proiect la eliberarea expediției
  subtitle: Un singur lanț de referințe controlate, de la confirmarea comenzii până la expedierea autorizată.
  steps:
    - step: '01'
      title: Codul de proiect
      desc: Referință unificată de proiect care leagă fiecare document controlat de comandă.
    - step: '02'
      title: Reviziile documentelor
      desc: Nivelurile curente de revizie ale specificației, BOM-ului, graficii și ambalării — numai versiunile aprobate sunt valide pentru producție.
    - step: '03'
      title: Loturi și materiale
      desc: Loturile de materiale și componente înregistrate față de lotul de producție.
    - step: '04'
      title: Înregistrări de inspecție
      desc: Rezultatele inspecțiilor IQC, în proces, de etanșeitate la aer, finale și de ambalare, per lot.
    - step: '05'
      title: Ambalare și eliberare
      desc: Lotul de ambalare, starea de închidere a NCR și rezumatul eliberării autorizate a expediției.

traceability_sample:
  tagline: Mostră anonimizată
  title: Înregistrare de control al trasabilității (demo)
  body: |
    Valorile de demonstrație sunt prezentate doar cu titlu ilustrativ — numele clienților, numerele de comandă, grafica personalizată, datele furnizorilor și informațiile comerciale sunt eliminate pentru a proteja confidențialitatea.

    - **Producător:** QINGDAO VATRAD GROUP, LTD.
    - **Cod de proiect:** DEMO-SUP-2026-01
    - **Referință SKU:** DEMO-TR-126
    - **Lot de producție:** BATCH-AUG-01
    - **Revizia specificației / BOM / graficii:** Rev B / Rev C / Rev B
    - **Înregistrare de etanșeitate la aer:** PASS — păstrată per lot
    - **Starea inspecției:** PASS
    - **Starea expediției:** RELEASED

quarantine_intro:
  tagline: Controlul neconformităților
  title: Controlul produselor neconforme și carantina
  body: |
    Produsele sau componentele care nu îndeplinesc criteriile de acceptare definite sunt identificate clar și plasate sub reținere controlată sau în stare de carantină. Ele nu pot trece la următoarea etapă de producție, la ambalare sau la expediere până când nu este finalizată o dispoziție autorizată. Retușul se execută conform instrucțiunilor aprobate și este legat de înregistrarea de neconformitate relevantă; articolele retușate sunt re-inspectate față de cerințele aplicabile ale proiectului înainte de eliberarea calității.

quarantine_flow:
  tagline: Flux de control în 7 pași
  title: Ce se întâmplă când este identificată o neconformitate
  subtitle: Identificare, control, corectare, verificare — apoi eliberare sau respingere. Produsul neconform nu reintră niciodată în producție sau ambalare fără verificare.
  steps:
    - step: '01'
      title: Identificare
      desc: Neconformitatea este înregistrată față de produsul, SKU-ul, lotul sau etapa de proces afectată.
    - step: '02'
      title: Etichetare
      desc: Articolele afectate sunt identificate clar cu etichete de status controlate — HOLD, QUARANTINE sau REJECTED.
    - step: '03'
      title: Carantină
      desc: Articolele sunt segregate într-o zonă de carantină controlată fizic sau controlate prin sistem pentru a preveni utilizarea sau expedierea neintenționată.
    - step: '04'
      title: Evaluarea domeniului
      desc: Domeniul afectat este revizuit pe lot, etapă de proces, lot de material și revizie de document.
    - step: '05'
      title: Retuș / Înlocuire
      desc: Corectarea este permisă numai printr-o dispoziție aprobată și o instrucțiune de lucru controlată.
    - step: '06'
      title: Re-inspecție
      desc: Articolele corectate sunt re-inspectate față de criteriile aplicabile de acceptare înainte de eliberare.
    - step: '07'
      title: Eliberare sau respingere
      desc: Numai produsul conform autorizat trece la ambalare sau la eliberarea expediției.

quarantine_evidence:
  tagline: În atelierul de fabricație
  title: Testare controlată și carantină în practică
  subtitle: Fotografii din atelierul nostru din Qingdao care arată cum se aplică controlul statusului și înregistrările de inspecție la fața locului.
