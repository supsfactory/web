faqs:
  - question: 'Kan man stå og fiske på et oppusteligt SUP-bræt?'
    answer: 'Ja. Bredere oppustelige SUP-brætter (33 tommer eller mere) giver tilstrækkelig stabilitet til at stå og kaste. EVA-dækpuder i fuld længde giver et sikkert fodfæste, selv når de er våde.'
  - question: 'Er et oppusteligt SUP-bræt godt til fiskeri?'
    answer: 'Oppustelige SUP-brætter er fremragende fiskeriplatforme, især til fladfiskeri og til at dække grunde. Brede designs giver let adgang til tackle og udstyr.'
  - question: 'Hvor meget udstyr kan jeg tage med på et oppusteligt SUP-bræt?'
    answer: 'De fleste oppustelige SUP-brætter har en samlet kapacitet på 220-300 lbs (rider plus udstyr). Et typisk fiskerisæt med tackle, kølebox og sikkerhedsudstyr vejer 20-40 lbs. Se brættets volumenangivelse for at sikre tilstrækkelig kapacitet.'
body: |
  <h2>Hvorfor fiske fra et oppusteligt fartøj?</h2>
  <p>Oppustelige SUP-brætter giver lystfiskere fordele, som traditionelle både ikke kan matche. Den grundvandede draft gør det muligt at nå vand, som motordrevne både ikke kan komme ud i, mens den stille fremgang minimerer forstyrrelser for fisken. Transportfleksibiliteten betyder, at du kan fiske i afsides søer, floder og kystområder uden trailere eller bådeplads.</p>
  <p>De vigtigste fordele er:</p>
  <ul>
    <li><strong>Lysmøde</strong> — Ingen motorlarm betyder, at du kan nærme dig fisk uden at skræmme dem</li>
    <li><strong>Adgang til lavvandet</strong> — En draft på blot få tommer giver adgang til fiskeri i marsker, åløb og flader</li>
    <li><strong>Transportfleksibilitet</strong> — Pak dit fartøj til afsides steder, der ikke kan nås med båd</li>
    <li><strong>Mulighed for at stå</strong> — SUP-brætter giver et bedre udsyn over vandet, når du står</li>
  </ul>

  <h2>Krav til stabilitet</h2>
  <p>Fiskeri kræver en stabil platform. Når du vælger et oppusteligt fartøj til fiskeri, bør du prioritere:</p>
  <ul>
    <li><strong>Bredde</strong> — Bredere brætter (33-36 tommer) giver bedre stabilitet til at stå og kaste</li>
    <li><strong>Tykkelse</strong> — 6-tommers brætter giver større stivhed og bæreevne til udstyr</li>
    <li><strong>Volumen</strong> — Højere volumen (300+ liter) bærer den samlede vægt af lystfisk og udstyr</li>
    <li><strong>Dækoverflade</strong> — EVA-skum på hele dækket giver godt greb, selv når det er vådt</li>
  </ul>

  <h2>Kompatibilitet med udstyr</h2>
  <p>Typiske opstillinger til fiskeri omfatter:</p>
  <ul>
    <li><strong>Stangholdere</strong> — Påklinkrede eller dækmonterede stangholdere, så du kan pagaje med begge hænder fri</li>
    <li><strong>Kasse eller kølebox</strong> — Fastgjort på dækket med gummistropper til tackle og fangst</li>
    <li><strong>Ankersystem</strong> — Let foldbart anker eller stake-out-stang til at holde position i strøm</li>
    <li><strong>Pagaj-leash</strong> — Holder pagajen fast, når begge hænder er optaget af fiskeriet</li>
    <li><strong>Personlig redningsvest (PFD)</strong> — Vigtigt sikkerhedsudstyr for alle lystfiskere</li>
  </ul>

  <h2>Anbefalede fartøjstyper til fiskeri</h2>
  <p>Forskellige fiskesituationer passer til forskellige fartøjstyper:</p>

  <h3>SUP-brætter til fiskeri</h3>
  <p>Bedst til: fladfiskeri, abfefiskeri i søer og synfiskeri på lavvandet. Den forhøjede stående position giver fremragende udsyn. Vælg et bredere touring- eller allround-SUP for stabiliteten.</p>

  <h3>SUP-brætter til fiskeri</h3>
  <p>Bedst til: fisketure med flere personer, transport af tungt udstyr og beskyttede kystfarvande. SUP-brætter giver dækplads og bæreevne, samtidig med at de er transportfleksible.</p>

  <h2>Sikkerhedsmæssige forhold</h2>
  <ul>
    <li>Bær altid en redningsvest — fiskeri indebærer at stå, kaste og flytte udstyr, hvilket øger risikoen for fald</li>
    <li>Tjek vejret og vandforholdene, før du tager af sted</li>
    <li>Medtag en fløjte, telefon i vandtæt etui og et grundlæggende reparationssæt</li>
    <li>Fortal nogen, hvor du fisker, og hvornår du forventes tilbage</li>
  </ul>

  <h2>Ofte stillede spørgsmål</h2>
  <h3>Kan man stå og fiske på et oppusteligt SUP-bræt?</h3>
  <p>Ja. Bredere oppustelige SUP-brætter (33 tommer eller mere) giver tilstrækkelig stabilitet til at stå og kaste. EVA-dækpuder i fuld længde giver et sikkert fodfæste, selv når de er våde.</p>

  <h3>Hvor meget udstyr kan jeg tage med på et oppusteligt SUP-bræt?</h3>
  <p>De fleste oppustelige SUP-brætter har en samlet kapacitet på 220-300 lbs (rider plus udstyr). Et typisk fiskerisæt med tackle, kølebox og sikkerhedsudstyr vejer 20-40 lbs. Se brættets volumenangivelse for at sikre tilstrækkelig kapacitet.</p>

