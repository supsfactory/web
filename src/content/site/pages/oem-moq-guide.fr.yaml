moq_stages:
  tagline: Échantillon · Pilote · Volume
  title: 'Trois étapes de quantité distinctes'
  subtitle: 'Les quantités de production d''échantillon, de pilote et de volume sont différentes. Chaque projet est catégorisé en trois niveaux distincts pour que vous validiez avant de vous engager.'
  steps:
    - step: '01'
      title: 'Développement d''échantillon (1–2 unités)'
      desc: 'Confirmation physique de la rigidité de la coque, de la texture du tapis de traction EVA, de la précision des graphismes et du montage des accessoires avant tout engagement financier. Des frais d''échantillon s''appliquent et sont crédités sur votre commande de production à la signature du contrat.'
    - step: '02'
      title: 'Commande pilote (20–50 unités)'
      desc: 'Tests commerciaux de pré-saison et validation des marchés régionaux en utilisant les plateformes de coque existantes, les matériaux en stock et un emballage simplifié pour minimiser les frictions de configuration.'
    - step: '03'
      title: 'Production en volume (90–100+ unités)'
      desc: 'Confirmée après BOM figé, graphismes finalisés, emballage personnalisé et plans de livraison programmés — rouleaux de tissu complets de 150 m, tissus Pantone personnalisés, emballage sur mesure, remises de volume et traçabilité de lot complète sur toute la chaîne.'

moq_factors:
  tagline: Ce qui détermine votre MOQ
  title: 'Pourquoi le MOQ entièrement personnalisé est toujours spécifique au projet'
  subtitle: 'Pour une fabrication 100 % sur mesure, le MOQ est calculé à partir de l''architecture produit complète — ces quatre composants sont évalués ensemble avant le devis.'
  headers:
    component: Composant du projet
    driver: Facteur de fabrication
    impact: Impact sur la quantité minimale
  rows:
    - component: 'Forme de la coque et outillage'
      driver: 'Moules de rocker d''usine existants vs matrices de découpe CAO sur mesure et outillage de presse à chaud EVA'
      impact: 'Plateformes existantes : commandes pilotes dès 20 pièces. Coques sur mesure : amortissement d''outillage dédié requis.'
    - component: 'Coloris et PVC'
      driver: 'Couleurs standard uniques en stock vs feuilles PVC teintées Pantone propriétaires'
      impact: 'Le PVC Pantone personnalisé exige des séries de teinture chimique dédiées avec des MOQ de matière première indépendants.'
    - component: 'Emballage de marque'
      driver: 'Cartons génériques avec étiquettes de code-barres vs boîtes cadeaux retail 5 couches pleine couleur et manuels de marque'
      impact: 'Les boîtes couleur personnalisées portent un minimum de presse d''impression offset indépendant (généralement 500+ boîtes).'
    - component: 'Packs d''accessoires'
      driver: 'Pagaies aluminium ou nylon standard vs pagaies carbone assorties sur mesure et pompes de marque'
      impact: 'Les accessoires entièrement marqués suivent les lots de production des fournisseurs de sous-niveau.'

