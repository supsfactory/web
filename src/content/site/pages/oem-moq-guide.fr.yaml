  title: 'Guide MOQ SUP : Marque flexible et quantités minimales de commande'
  description: 'Comment le MOQ du SUP gonflable est calculé : les rouleaux de drop-stitch de 150 m donnent 90–100 planches, co-marquage dès 5–10 unités et frais de moule transparents.'
  dateModified: '2026-08-14'
  keywords:
