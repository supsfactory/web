moq_faqs:
  tagline: FAQ
  title: 'Questions fréquentes sur le MOQ'
  items:
    - q: 'Le MOQ est-il calculé par commande, par modèle ou par coloris ?'
      a: 'Le MOQ peut s''appliquer par modèle, coloris, version de graphisme, configuration d''emballage ou commande totale. Parce que différentes épaisseurs de drop-stitch (12 cm vs 15 cm) et couleurs de PVC proviennent de rouleaux de matière première distincts, commander 50 planches réparties sur 5 couleurs crée 5 exigences de rouleau de tissu séparées. Nous confirmons le calcul exact contre votre matrice de SKU avant devis pour que vous puissiez planifier clairement votre mix.'
    - q: 'Puis-je commander un échantillon avant la production en masse ?'
      a: 'Oui. Le développement d''échantillon (1–2 unités) vérifie la rigidité de la coque, la texture du tapis de traction EVA, la précision des graphismes et le montage des accessoires avant la sortie de production de masse. Des frais d''échantillon s''appliquent et sont crédités sur votre commande de production à la signature du contrat.'
    - q: 'Pourquoi l''emballage retail personnalisé a-t-il un MOQ indépendant ?'
      a: 'Les presses d''impression de cartons flexographiques ou offset personnalisées exigent une configuration de production minimale de 500+ unités. Nous proposons une Solution de Stockage d''Emballage Hybride : nous produisons les 500 cartons imprimés personnalisés, stockons le surplus dans notre entrepôt propre, et les libérons sur vos expéditions de planches programmées — pour qu''une commande de planches plus petite puisse encore partir en emballage retail entièrement marqué.'
    - q: 'Pourquoi le MOQ de volume standard est-il de 90–100 unités ?'
      a: 'Le MOQ de volume standard suit la matière première : un rouleau maître de 150 m de tissu drop-stitch haute qualité donne environ 90–100 planches finies pour une coque standard de randonnée ou polyvalente. L''exécution de rouleaux complets élimine l''épissure du tissu, maintient une tension de fibre uniforme et amortit le calibrage de 2 heures de la ligne de soudure et de laminage — offrant le coût unitaire le plus bas possible.'
    - q: 'Une quantité plus élevée réduit-elle le coût unitaire ?'
      a: 'Dans la plupart des projets, oui. Des quantités plus élevées améliorent le rendement matière, répartissent les frais généraux fixes de configuration de la ligne sur plus de planches et réduisent les coûts d''emballage par unité.'
    - q: 'Les frais de moule de co-marquage s''appliquent-ils à nouveau sur les ré-commandes ?'
      a: 'Non. Les frais de moule de sérigraphie sont facturés une fois à la configuration initiale et sont levés pour les ré-commandes utilisant la même dimension de graphisme. Vous ne payez que les 1,00 $ USD par planche de traitement d''usine et d''impression.'
    - q: 'Demander des conseils sur le MOQ m''engage-t-il dans une commande ?'
      a: 'Non. Demander des conseils sur le MOQ de projet permet simplement à notre équipe d''ingénierie de Qingdao Vatrad Group Co., Ltd. d''examiner votre brief technique et de conseiller la voie de production la plus rentable. Un accord de non-divulgation (NDA) est disponible avant que vous partagiez des spécifications techniques ou des graphismes propriétaires.'

