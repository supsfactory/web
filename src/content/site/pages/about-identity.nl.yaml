manufacturing_scope:
  heading: 'Productiescope'
  body: |
    Onze productiescope omvat de volledige productieketen voor opblaasbare SUP- en nautische producten — van de inkomende grondstoffencontrole tot de eindverpakking en de exportcommerciële documentatie.

    - **Productcategorieën**: opblaasbare SUP-boards (Allround, Touring, Surf, Fishing, Yoga, Racing), opblaasbare kajaks, opblaasbare boten, peddels, pompen en accessoires.
    - **Constructietypen**: enkellaags PVC, dubbellaags PVC, drop-stitch kern met PVC-coating. Aangepaste constructiespecificaties voor elk project.
    - **Samenwerkingsvormen**: OEM (eigen design van de klant), ODM (in de fabriek ontwikkeld op basis van de briefing van de klant), private label/co-branding (merk op beproefde platforms).
    - **Certificeringen**: ISO 9001:2015 (kwaliteitsmanagement in de fabriek), CE (modellen bestemd voor de EU-markt, scope per project), BSCI (sociale conformiteit), REACH (chemische veiligheid), RoHS (aan beperking onderworpen stoffen).
    - **Productiecapaciteit**: 120.000+ boards per jaar, circa 10.000 productie-eenheden per maand op 4 geautomatiseerde lijnen. Opschaling mogelijk via voorafgaande productieplanning.

brand_positioning:
  heading: 'Merpositionering'
  body: |
    iSupfactory neemt een specifieke positie op de markt in — wij zijn geen merk, wij zijn een producent. Dit onderscheid bepaalt elk aspect van onze manier van werken:

    - **Wij verkopen nooit onder een eigen merk.** Elk board dat wij produceren draagt het merk van de koper. Wij concurreren met onze klanten op geen enkele markt en in geen enkel kanaal. Dit beleid is niet onderhandelbaar.
    - **Wij zijn geen handelsmaatschappij.** Wij beheren de fabriek. Kwaliteitscontrole, ontwerp, productieplanning en exportcommerciële documentatie worden allemaal intern beheerd. Er zijn geen tussenpersonen tussen jouw order en de productieafdeling.
    - **Wij zijn gespecialiseerd in opblaasbare producten.** Het is geen nevenactiviteit of één productcategorie tussen vele. Nautische en opblaasbare SUP-producten zijn onze kerncompetentie. Elke machine, elk proces, elk kwaliteitscontrolepunt is geoptimaliseerd voor deze productcategorie.
    - **Wij bedienen professionele kopers.** Onze klanten zijn merken, distributeurs, resortbeheerders, clubs en scholen — geen eindconsumenten. Onze prijsstructuur, de MOQ, de documentatie en de communicatie zijn ontworpen voor B2B-relaties.

evidence_review:
  tagline: 'Bewijzen en verificatie'
  title: 'GEVERIFIEERDE SPECIFICATIES'
  body: 'Alle organisatorische en productieverklaringen op deze pagina zijn verifieerbaar. Het ISO 9001-certificaat, het BSCI-rapport, de handelslicentie en de registratiedocumenten van de fabriek zijn op aanvraag beschikbaar. Fabrieksbezoeken zijn welkom. Specificaties voor het laatst geverifieerd in september 2026.'

faqs:
  tagline: FAQ
  title: 'Merkidentiteit — Veelgestelde vragen'
  items:
    - q: 'Is iSupfactory een apart bedrijf van de Qingdao Vatrad Group?'
      a: 'Nee. iSupfactory is het klantgerichte merk van Vatrad, de nautische productiedivisie van Qingdao Vatrad Group Co., Ltd. De contractpartij voor alle orders is Qingdao Vatrad Group Co., Ltd. De fabriek, het team en het kwaliteitssysteem vormen één en dezelfde operatie.'
    - q: 'Verkopen jullie boards onder een eigen merk?'
      a: 'Nee. Wij produceren uitsluitend onder de merken van onze klanten en concurreren nergens met hen. Dit is een fundamenteel beleid — geen tijdelijke positie. Vind je op de markt een board met het merk iSupfactory, dan komt die niet uit onze fabriek.'
    - q: 'Kan ik de fabriek bezoeken?'
      a: 'Ja. Wij verwelkomen fabrieksbezoeken graag en kunnen een gestructureerde audit organiseren die het volledige productieproces, de kwaliteitscontrolepunten, het materialenmagazijn en het documentenonderzoek dekt. Neem contact met ons op om een bezoek af te spreken.'
    - q: 'Wat is de relatie tussen Vatrad en iSupfactory?'
      a: 'Vatrad is de naam van de productiedivisie binnen de Qingdao Vatrad Group. iSupfactory is het internationale klantgerichte merk voor OEM-, ODM- en private label productiediensten. Beide verwijzen naar dezelfde operatie — de nautische productiedivisie in Laixi, Qingdao.'

