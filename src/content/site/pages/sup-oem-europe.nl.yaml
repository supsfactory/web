answer:
  label: 'Kort antwoord'
  text: 'Europese merken bestellen opblaasbare SUP''s bij SUPsfactory onder standaardvoorwaarden: de MOQ wordt bevestigd door de projectconfiguratie: monstercycli met 1–2 stuks valideren de constructie, kleine pilotseries met 20–50 stuks testen de markt op bestaande platforms en de standaard productie in serie draait met 90–100+ stuks per design van een volledige drop-stitch rol van 150 m. Het eerste monster vertrekt 7–12 dagen na goedkeuring van de specificaties, de productie kost 25–35 dagen na bevestigde PO en aanbetaling en het zeetransport voegt 4–6 weken toe naar Rotterdam of Hamburg. De CE- en REACH-documentatie wordt parallel aan het goedgekeurde monster opgesteld en DDP dekt douaneafhandeling en levering aan jouw magazijn.'
  verified: 'September 2026'

