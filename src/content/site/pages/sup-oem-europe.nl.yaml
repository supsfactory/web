why_europe:
  tagline: 'Waarom kopers in Europa'
  title: 'Gebouwd voor Europese import'
  subtitle: 'De fabriek beantwoordt de vragen die Europese merken zich stellen vóór hun eerste container — certificering voorop.'
  items:
    - title: 'CE- en REACH-documentatie'
      description: 'Het goedgekeurde monster vertrekt met CE- en REACH-documentatie voor de EU-markt, zodat je technisch dossier en je douanedocumenten klaar zijn vóór de container.'
    - title: 'DDP voor planbare bestemmingskosten'
      description: 'DDP omvat douaneafhandeling, invoerrechten, belastingen en levering aan jouw magazijn — één totaalprijs, door-to-door door de hele EU.'
    - title: 'FOB Qingdao met jouw expediteur'
      description: 'Vaste importeur? Kies FOB Qingdao en gebruik je eigen logistieke partner — wij laden en documenteren de container, jij regelt de rest.'
    - title: 'Eén fabriek, één kwaliteitssysteem'
      description: 'Ontwikkeling, monsters, productie en QC vinden allemaal plaats in de fabriek van 12.500 m² — het goedgekeurde monster is het product dat je ontvangt.'

process_notes:
  tagline: 'Zo werkt het'
  title: 'Van specificatie tot container'
  subtitle: 'Dezelfde zes fasen, of je nu twee containers per jaar koopt of twintig: specificatie, engineering, monster, verificatie, attrezzaggio, productie — daarna levering FOB, CIF of DDP.'
  items:
    - title: '1. Stuur je specificatie'
      description: 'Een referentieboard, een schets of een specificatie van de concurrent is al genoeg. Technische verificatie en offerte volgen binnen één werkdag.'
    - title: '2. Keur het monster goed'
      description: 'Je eerste fysieke monster vertrekt binnen 7–12 dagen met een goedkeuringsformulier voor de constructie, printkleuren en de resultaten van de drukproef.'
    - title: '3. Productie & export'
      description: 'De cycli worden in 25–35 dagen afgerond met QC-checkpoints tijdens de productie. Packing list, factuur en cognossement gaan vóór het schip.'
    - title: '4. Levering aan jouw magazijn'
      description: '4–6 weken zeetransport naar Rotterdam of Hamburg — met DDP regelen wij de douaneafhandeling en de levering tot aan jouw deur.'

faq_section:
  tagline: FAQ
  title: 'Vragen over import naar Europa'
  questions:
    - q: Is de CE-documentatie bij mijn order inbegrepen?
      a: 'Ja. De CE- en REACH-documentatie wordt voor de EU-markt opgesteld, parallel aan je goedgekeurde monster, vóórdat de productie begint — de documenten reizen mee met de container.'
    - q: Hoe lang duurt het zeetransport naar Europa?
      a: 'Reken op 4–6 weken vanaf de haven van Qingdao naar Rotterdam of Hamburg, afhankelijk van het vertrekschema. DDP-projecten omvatten de volledige door-to-door-tijdlijn.'
    - q: Verzenden jullie DDP naar EU-landen?
      a: 'Ja. DDP omvat zeetransport, douaneafhandeling, invoerrechten en belastingen plus de levering aan jouw magazijn — één planbare totaalprijs. Ook FOB Qingdao en CIF zijn beschikbaar.'
    - q: Wat is de MOQ voor een private label SUP-import?
      a: 'De MOQ wordt bevestigd door de projectconfiguratie: de monsterontwikkeling dekt 1–2 stuks, kleine pilotseries draaien met 20–50 stuks op bestaande platforms en de standaard productie in serie draait met 90–100+ stuks per design van een volledige drop-stitch rol van 150 m.'
    - q: Welke documentatie leveren jullie voor importen?
      a: 'Het goedgekeurde monster vertrekt met CE- en REACH-documentatie die voor jouw doelmarkt is opgesteld en elke container vertrekt met packing list, factuur en cognossement.'
    - q: Hoe start ik een project vanuit Europa?
      a: 'Stuur een referentieboard, een schets of een specificatie. De technische verificatie en de offerte komen binnen één werkdag en vóór elke uitwisseling van bestanden wordt een NDA ondertekend.'

