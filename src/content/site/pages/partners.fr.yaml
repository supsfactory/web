  dateModified: '2026-08'
hero:
  tagline: Partenaires et distribution
  title: 'Partenariats de fabrication et distribution'
  subtitle: "Nous fabriquons pour des distributeurs marins, des revendeurs, des marques retail et des organisations dans 50+ pays. Vous spécifiez le produit — nous l'ingénierons, l'échantillonnons et le produisons sous votre marque."
  image:
    src: https://assets.afarer.com/images/afarer/partners/partners-hero.webp
    alt: Réseau mondial de partenaires et distributeurs Afarer

answer:
  label: 'Réponse directe'
  text: 'Les conditions de partenariat commencent par un échantillon (1–2 unités) et des lots pilotes (20–50 unités, échantillons en 7–12 jours), puis passent à l''échelle avec des séries OEM de volume standard de 90–100+ unités par lot à partir d''un rouleau complet de drop-stitch de 150 m, ou investissent dans des moules personnalisés pour les produits de marque privée. Le MOQ est confirmé par la configuration du projet. Les programmes de distribution portent des territoires exclusifs, une tarification gros en direct d''usine et des conditions de paiement de 45 à 60 jours, expédiés FOB Qingdao ou CIF.'
  verified: '2026-08'
content_programs:
  tagline: Programmes partenaires
  title: 'Modèles de partenariat fondés sur la fabrication'
  subtitle: 'Que vous soyez un distributeur, un revendeur ou un partenaire de marque, le programme est construit autour de vos exigences produit et de votre plan de production.'
  columns: 3
  items:
    - title: 'Programme distributeur'
      description: 'Accords de distribution avec accès direct à l''usine, support de spécification et qualité de ré-commande constante sur les territoires. Engagement minimal basé sur la taille du territoire.'
      icon: tabler:world
    - title: 'Programme revendeur'
      description: 'Spécifications produit, approbation d''échantillon, support de garantie et ré-commandes fiables pour les points de vente retail et les boutiques en ligne.'
      icon: tabler:building-store
    - title: 'Partenariat OEM/ODM'
      description: 'Fabrication OEM et ODM en service complet avec marque, emballage et spécifications produit personnalisés. Du concept au conteneur.'
      icon: tabler:certificate
    - title: 'Partenariat de marque'
      description: 'Marque privée et développement de modèles pour les marques établies dans le secteur du nautisme et des loisirs de plein air.'
      icon: tabler:stars
    - title: 'Gouvernement et institutionnel'
      description: 'Programmes de fournisseurs privilégiés pour les agences gouvernementales, les garde-côtes, l''armée et les organisations humanitaires. Documentation prête pour les appels d''offres.'
      icon: tabler:building-community
    - title: 'Partenaire station et location'
      description: 'Tarification de flotte, qualité constante et marque personnalisée pour les stations, centres de plongée et opérations de location du monde entier.'
      icon: tabler:sun
content_benefits:
  tagline: Pourquoi s''associer à nous
  title: 'Pourquoi les partenaires choisissent Afarer'
  subtitle: 'Nos partenaires travaillent avec une véritable capacité de fabrication, une qualité constante et un support d''ingénierie réactif.'
  list:
    - 'Accès direct à l''usine : Travaillez directement avec notre équipe de fabrication — pas d''intermédiaires. Réponses plus rapides, visibilité totale sur la production et réponses d''ingénierie des personnes qui construisent les planches.'
    - 'Personnalisation prête : Marquez vos produits avec des couleurs, logos, emballages et spécifications personnalisés. Le MOQ est confirmé par la configuration du projet — étapes échantillon, pilote et volume.'
    - 'Qualité garantie : Production certifiée ISO 9001 avec conformité CE, BSCI et REACH. Chaque produit testé en pression avant expédition.'
    - 'Logistique mondiale : Expédition depuis Qingdao, en Chine, avec options FOB, CIF et DDP. Entrepôt US à Montclair, CA pour la distribution nord-américaine.'
    - 'Documentation technique : Catalogues produits, photographie et documentation technique pour soutenir les décisions de spécification et de ré-commande.'
    - 'Support spéc. et QC : Échantillonnage avant le volume, support technique pour vos clients et coordination du service de garantie.'
content_process:
  tagline: Comment devenir partenaire
  title: 'Processus de partenariat'
  subtitle: 'Un processus simple — de la candidature à votre première série de production.'
  items:
    - title: 'Étape 1 : Soumettre la candidature'
      description: 'Remplissez notre formulaire de candidature partenaire avec le profil de votre entreprise, votre marché cible et vos intérêts produit.'
    - title: 'Étape 2 : Revue de qualification'
      description: 'Notre équipe examine votre candidature et vous contacte sous 3 jours ouvrés pour discuter des exigences.'
    - title: 'Étape 3 : Accord et configuration'
      description: 'Signez un accord de partenariat, configurez votre compte et recevez les échantillons produits, les spécifications et les conditions convenues.'
    - title: 'Étape 4 : Échantillonnage et production'
      description: 'Approuvez les échantillons physiques, confirmez les spécifications et le MOQ, et la production s''exécute sous votre marque.'
cta:
  title: 'Discuter d''un partenariat'
  subtitle: 'Envoyez vos exigences et notre équipe répondra sous 3 jours ouvrés.'
  actions:
    - variant: primary
      text: Envoyer vos exigences
      href: /fr/contact
    - text: Voir nos produits
      href: /fr/products

content_html: |
  <div class="mx-auto max-w-3xl space-y-4 rounded-2xl border bg-card p-6 text-[14.5px] leading-relaxed text-fg-2">
    <p><strong>Poursuivez votre lecture :</strong> les programmes partenaires partagent un seul <a href="/fr/oem-manufacturing">moteur de fabrication OEM/ODM</a> — les conditions, MOQ d''essai et la personnalisation y sont définis — et toute la production passe par l''<a href="/fr/factory">usine de 12 500 m&sup2;</a>.</p>
  </div>
