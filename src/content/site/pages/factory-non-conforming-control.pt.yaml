nc_intro:
  tagline: Controlo de produtos não conformes
  title: O que acontece quando um produto não cumpre os critérios
  body: |
    Os produtos ou componentes que não cumprem os critérios de aceitação definidos são identificados e controlados para prevenir a utilização involuntária, o processamento adicional ou o envio. Os critérios de aceitação aplicáveis baseiam-se na amostra libertada, na especificação técnica, nas gráficas, na lista de materiais, nos requisitos de embalagem e no plano de inspeção do projeto.

    Os artigos não conformes são avaliados para determinar o âmbito afetado e a disposição apropriada. Consoante o problema, o artigo pode ser retido, retrabalhado sob instruções controladas, substituído, rejeitado ou gerido através de um processo libertado. Os artigos retrabalhados ou corrigidos são inspecionados de novo antes da libertação. A libertação para envio só é permitida após a conclusão dos registos de qualidade pertinentes e a conformidade do produto com os critérios de aceitação aplicáveis.

nc_flow:
  tagline: Ciclo fechado padrão em 7 fases
  title: Da identificação à ação corretiva
  subtitle: 'Um ciclo controlado para cada não conformidade: identificar, bloquear, verificar, retrabalhar ou substituir, voltar a verificar, libertar ou rejeitar, melhorar.'
  steps:
    - step: '01'
      title: Identificar
      desc: 'Cada não conformidade identificada é registada contra o produto, a partida ou o componente afetado e avaliada contra os requisitos aplicáveis do projeto. A deteção pode ocorrer na entrada de mercadorias, no controlo de processo, na inspeção final, na embalagem ou na inspeção do cliente/de terceiros.'
    - step: '02'
      title: Bloquear
      desc: 'Os artigos são claramente identificados e colocados sob estado de bloqueio ou quarentena controlada para prevenir a utilização, o processamento adicional ou o envio involuntários. As etiquetas HOLD / QUARANTINE / REJECTED trazem número NCR, SKU, partida, quantidade, descrição do defeito e data.'
    - step: '03'
      title: Verificar
      desc: 'São avaliados o âmbito afetado e a disposição apropriada: unidade única, partida de turno, partida completa ou várias partidas — através de lotes de material comuns, revisões gráficas, fases de processo e revisões documentais. Se necessário, aplicam-se contenção adicional ou inspeção reforçada.'
    - step: '04'
      title: Retrabalho ou substituição
      desc: 'O retrabalho permitido segue instruções libertadas que identificam o artigo afetado, o método, os materiais, os pontos de inspeção e os requisitos de nova verificação. Nunca são permitidas alterações não autorizadas à especificação do produto, às gráficas, à configuração de acessórios ou à embalagem. Os artigos substitutos reentram nos gates de inspeção aplicáveis.'
    - step: '05'
      title: Voltar a verificar
      desc: 'Os artigos retrabalhados ou corrigidos são inspecionados de novo contra os critérios de aceitação aplicáveis. O defeito originalmente reprovado e todas as características associadas potencialmente afetadas pelo retrabalho são verificadas antes da libertação — pela QC independente e, para as reparações de estanquicidade ao ar, com um ciclo completo de novo teste de pressão de 24h.'
    - step: '06'
      title: Libertar ou rejeitar
      desc: 'O produto é libertado apenas após a conclusão da nova verificação exigida, quando o pessoal de qualidade autorizado confirma a conformidade com os requisitos aplicáveis do projeto. Os artigos que não podem ser levados à conformidade são rejeitados, substituídos, reenviados ou dispostos sob procedimentos controlados — incluindo a destruição física assistida.'
    - step: '07'
      title: Ação corretiva
      desc: 'As não conformidades recorrentes, significativas ou sistémicas são investigadas quanto à causa e à ação corretiva (CAPA). As melhorias podem incluir atualizações de instruções de trabalho, controlos de materiais, pontos de inspeção, formação, gestão de fornecedores ou controlo documental.'

nc_pillars:
  tagline: Pilares da confiança do comprador
  title: Três controlos que protegem a tua marca
  subtitle: 'O processo é construído em torno das perguntas que os compradores internacionais fazem realmente: os problemas são escondidos, o retrabalho foge ao controlo e as pranchas reparadas são verificadas de novo.'
  features:
    - icon: 1
      icon_bg: blue
      title: Apenas instruções controladas
      desc: 'O retrabalho é rigorosamente regulado por Standard Rework Instructions (SRI) autorizadas. As alterações no terreno não aprovadas, as variações de especificação ou as alterações gráficas sem autorização escrita são severamente proibidas.'
    - icon: 2
      icon_bg: green
      title: Nova verificação independente
      desc: 'As pranchas retrabalhadas são sujeitas a nova verificação a 100% pelos inspetores QA contra os critérios de aceitação originais. As reparações de estanquicidade ao ar exigem um ciclo completo de novo teste de pressão de 24h — nunca uma verificação parcial.'
    - icon: 3
      icon_bg: purple
      title: Libertação autorizada & rastreabilidade
      desc: 'A libertação para envio é permitida exclusivamente após documentação NCR completa e autorização QC, com o estado da partida a passar de HOLD para RELEASED. Os desvios sistémicos ou recorrentes ativam automaticamente os workflows CAPA para a análise de causas.'

