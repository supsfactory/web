answer:
  label: 'Resposta clara'
  text: 'Os produtos não conformes nunca são escondidos, retrabalhados informalmente ou libertados sem verificação na QINGDAO VATRAD GROUP.,LTD. Cada não conformidade identificada é registada contra o produto, a partida ou o componente afetado e ligada a um NCR. O artigo é marcado (HOLD / QUARANTINE / REJECTED), fisicamente separado e o âmbito afetado é avaliado por partida, lote de material, fase de processo e revisão documental. A disposição é decidida ao nível de autoridade correspondente à gravidade do defeito: os problemas ligeiros são assinados ao nível da linha, os problemas graves exigem uma disposição de QC Manager + Engenheiro técnico com instrução de retrabalho controlado e nova verificação independente a 100%, e os problemas críticos exigem uma decisão do Material Review Board com consentimento escrito do cliente quando exigido — caso contrário, destruição assistida obrigatória. Os artigos retrabalhados são verificados de novo contra os critérios de aceitação originais, as reparações de estanquicidade ao ar recebem um ciclo completo de novo teste de pressão e a libertação para envio só acontece após a qualificação de qualidade autorizada. Os problemas recorrentes ou sistémicos ativam a análise de causas e as ações corretivas (CAPA).'
  verified: 'September 2026'

