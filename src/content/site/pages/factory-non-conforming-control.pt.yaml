nc_severity:
  tagline: Gravidade do defeito & autoridade
  title: Classificação da gravidade & autoridade de disposição
  subtitle: Nem toda a não conformidade é gerida ao mesmo nível — a autoridade de disposição escala com a gravidade do defeito, da libertação ao nível da linha ao Material Review Board com consentimento do cliente.
  headers:
    severity: Gravidade
    examples: Exemplos típicos
    authority: Autoridade de disposição & controlo
    control: Condição de libertação
  rows:
    - severity: 'Ligeiro'
      examples: 'Acabamento do canto da caixa, ligeiro desalinhamento de um acessório não crítico'
      authority: 'Libertação no local pelo chefe QC de secção + supervisor de linha, com substituição ou libertação'
      control: 'Registado no NCR; sem impacto na função do produto ou nos requisitos do cliente'
    - severity: 'Grave'
      examples: 'Fuga lenta da válvula, desalinhamento EVA fora de tolerância (>2 mm), acessório em falta'
      authority: 'O QC Manager + Engenheiro técnico emitem uma instrução de retrabalho controlado (SRI)'
      control: 'Novo teste de conformidade independente a 100% dos defeitos originalmente reprovados e das características afetadas antes da libertação'
    - severity: 'Crítico'
      examples: 'Dano na câmara drop-stitch, bolha no rail ou laceração a alta pressão, impressão errada do logótipo do cliente ou desvio cromático'
      authority: 'Decisão do Material Review Board (MRB); consentimento escrito do cliente quando exigido'
      control: 'Sem libertação sem consentimento autorizado; caso contrário, destruição física assistida obrigatória'

nc_matrix:
  tagline: Matriz de protocolos de engenharia
  title: Matriz de disposição de defeitos & nova verificação SUP
  subtitle: Protocolos de engenharia padrão aplicados aos desvios de produção mais comuns — os mesmos parâmetros quantificados que os clientes podem verificar durante as auditorias.
  headers:
    defect: Categoria de defeito
    protocol: Protocolo de disposição controlada
    validation: Nova verificação & validação independente
  rows:
    - defect: 'Fuga lenta da válvula'
      protocol: 'Isolar a prancha. Desmontar o núcleo da válvula com ferramenta de aperto calibrada (25 N·m), limpar a rosca interna, substituir o anel O de silicone e apertar de novo.'
      validation: 'Imersão em solução saponosa; inflar a 18 PSI e executar um novo teste completo de queda de pressão de 24h (ΔP ≤ 0.05 PSI).'
    - defect: 'Bolhas de ar na costura do rail'
      protocol: 'Bloquear a partida de turno. Delaminar a área da bolha com bocal de calor assistido, limpar a superfície com solvente, aplicar adesivo PU bicomponente sob pressão de 5 bar.'
      validation: 'Inspeção visual e tátil da costura a 100%; prova estrutural de pressão de verificação (18.0 PSI) além da manutenção de estanquicidade ao ar de 24h.'
    - defect: 'Desalinhamento do pad EVA'
      protocol: 'Remoção a quente assistida com ferramenta a temperatura regulada (80°C). Novo alinhamento com gabarito de posicionamento acrílico de precisão.'
      validation: 'Verificação da tolerância de fabrico das folgas (≤ ±1.5 mm), verificação da simetria do padrão losangular, teste de adesão dos bordos a 100%.'
    - defect: 'Erro de branding/logótipo'
      protocol: 'Paragem imediata da linha de impressão. Bloquear todos os painéis impressos. Verificar a revisão vetorial com o cliente; zero alterações não autorizadas.'
      validation: 'Verificação de cor com espectrofotómetro (ΔE ≤ 1.5); inspeção visual a 100% do alinhamento do texto contra o PDF master vetorial assinado pelo cliente.'
    - defect: 'Desvio de embalagem / SKU em falta'
      protocol: 'Bloquear a palete de exportação. Abrir e executar uma verificação de posição a 100% segundo a BOM (bomba, aleta, leash, pá, tubo de reparação).'
      validation: 'Validação com balanças de controlo dinâmicas eletrónicas integradas (±30 g de variância); verificação com leitores óticos de códigos de barras 2D.'

nc_scrap:
  tagline: Zero fuga para o mercado
  title: Sucata & destruição assistida — protocolo anti-desvio a zero defeitos
  body: |
    Os parceiros de marca internacionais precisam da certeza de que as pranchas defeituosas nunca chegam aos canais de retalho secundário, mercados cinzentos ou e-commerce. As pranchas que não podem ser levadas à conformidade são destruídas sob um protocolo assistido e registado:

    **1. Corte de encaixes & acessórios.** Sob a supervisão do QA Director, uma cisalha hidráulica remove todos os anéis em D em aço inoxidável 316, as correias das pegas de transporte e as fivelas das bagagens. O grupo de válvula de inflagem e a base da fin box (US-box / aleta de encaixe) são removidos à raiz da prancha, eliminando assim todos os componentes reutilizáveis.

    **2. Incisão do drop-stitch & secionamento do rail.** O núcleo drop-stitch interno é cortado através da prancha e do deck com cortes cruzados profundos (≥ 50 cm por corte), e os rails laterais reforçados são secionados em pelo menos 4 segmentos — destruindo permanentemente a capacidade de selagem e flutuação.

    **3. Video- & fotovault.** A destruição é registada como um vídeo 1080p não cortado com primeiros planos do código de barras de série, do corte, da incisão do núcleo e do monte de sucata final pesado. O vídeo é submetido a hash (SHA-256) e arquivado por ≥ 5 anos num servidor controlado.

    **4. Eliminação de resíduos certificada.** Todos os fragmentos em PVC e drop-stitch são pesados, registados no registo de saída e transportados apenas por parceiros qualificados de reciclagem de polímeros — nenhum material residual sai das instalações por outros canais.

    > **Garantia de proteção da marca:** QINGDAO VATRAD GROUP CO., LTD. garante a destruição a 100% das embarcações não reparáveis e fora de especificação. Nenhum artigo de segunda escolha ou prancha comprometida chegará jamais aos canais de retalho secundário, mercados cinzentos ou e-commerce. O certificado de refugo & destruição (VAT-QA-SCRAP-CERT-2026) documenta o produto, a partida, a conclusão do MRB, as fotos de testemunho e a dupla assinatura do QA Director e do chefe de fábrica.

