faqs:
  tagline: FAQ
  title: FAQ sobre qualidade & controlo de defeitos para compradores globais
  items:
    - q: 'Como garantem que as pranchas retrabalhadas cumprem os padrões de segurança completos?'
      a: 'Cada prancha retrabalhada é tratada como uma nova unidade e deve percorrer o mesmo ciclo de teste completo do zero — para as reparações de estanquicidade ao ar, um teste de pressão completo de 24h. São os inspetores QC independentes, não os operadores de retrabalho, que conduzem a validação de libertação.'
    - q: 'A fábrica vai expedir pranchas com ligeiros desvios estéticos sem nos informar?'
      a: 'Nunca. Cada desvio que afeta golden samples aprovados pelo cliente, gráficas de logótipo, variantes de cor ou embalagem exige um acordo formal de concessão escrito, assinado pelo cliente, antes da libertação para envio.'
    - q: 'O que acontece se uma prancha retrabalhada não passar na nova verificação?'
      a: 'A prancha não é libertada. Volta a uma nova avaliação de disposição e, se não puder ser levada à conformidade, é substituída, rejeitada ou destruída sob o protocolo de refugo assistido. A reprovação repetida da mesma classe de defeito ativa uma CAPA para a análise de causas.'
    - q: 'As pranchas defeituosas podem ser vendidas como artigos de segunda escolha ou através de outros canais?'
      a: 'Não. As pranchas não reparáveis e fora de especificação são destruídas fisicamente sob o protocolo de refugo assistido — encaixes cortados, núcleo e rails secionados, vídeo registado com hash SHA-256 e arquivado durante pelo menos 5 anos. O certificado de refugo & destruição é assinado pelo QA Director e pelo chefe de fábrica.'
    - q: 'Como é avaliado o âmbito afetado quando é encontrado um defeito?'
      a: 'O âmbito é examinado quanto à identificação do produto, partida de produção, partida de material ou componente, fase de processo e revisão documental aplicável. Se o mesmo lote de material, a mesma revisão gráfica ou a mesma estação de trabalho estiver envolvido, os produtos afetados são incluídos e inspecionados em conformidade.'
    - q: 'O vosso consentimento é necessário antes de conceder uma concessão?'
      a: 'Sim. Cada aceitação sob concessão documentada que afeta os requisitos do cliente — amostras libertadas, especificação, gráficas, embalagem ou critérios de aceitação — exige a libertação escrita do cliente antes da liberação. Sem ela, o produto é retrabalhado, substituído ou rejeitado segundo o requisito original.'
    - q: 'Que documentação recebemos para uma não conformidade?'
      a: 'O registo NCR inclui o número NCR, a fase de deteção, o produto/SKU, a partida, as revisões documentais aplicáveis, a descrição do defeito, a contenção, a disposição, a referência da instrução de retrabalho, o resultado da nova verificação e a libertação ou encerramento final — disponível segundo o teu acordo de qualidade do projeto.'

