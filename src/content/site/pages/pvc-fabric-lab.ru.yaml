answer:
  label: 'Прямой ответ'
  text: 'Доски изготавливаются из морского PVC 1,680 DTEX с трехслойным покрытием и ядром drop stitch, рассчитанным на 12–15 PSI. Каждая входящая партия ткани независимо испытывается на нашей площадке: предел прочности при разрыве (ISO 1421), сохранение свойств после 2,000 часов экспозиции в ксеноновой дуге (ISO 4892), стойкость к истиранию и морозостойкость — ни одна партия не попадает в производство только на основании спецификаций поставщика.'
  verified: 'Сентябрь 2026'

intro: 'Ткань доски — самый критичный материал надувного SUP. Она должна выдерживать постоянное воздействие УФ-излучения, многократные циклы надувания, истирание о причалы и песчаные берега, а также резкие перепады температур — и при этом сохранять структурную целостность годами. В {SITE.name} наша Лаборатория тканей PVC посвящена исключительно характеризации, валидации и постоянному улучшению тканей, которые мы используем в каждой производимой доске.'

content_html: |
  <h2>Основа каждого надувного SUP</h2>
  <p>Мы не полагаемся только на спецификации поставщика. Каждая партия ткани PVC и ткани ядра drop stitch, поступающая в нашу мастерскую, независимо испытывается на собственной площадке. Это гарантирует, что опубликованная нами спецификация материала — это фактические свойства материала, которые вы получите — партия за партией, год за годом.</p>

  <h2>Стандартизированное испытательное оборудование</h2>
  <p>Наша тканевая лаборатория оснащена приборами промышленного класса, соответствующими методам испытаний ISO, ASTM и EN:</p>
  <table>
    <thead><tr><th>Оборудование</th><th>Измеряемые параметры</th><th>Стандарт</th></tr></thead>
    <tbody>
      <tr><td>Универсальный разрывный автомат (50 кН)</td><td>Разрывное усилие, относительное удлинение при разрыве, распространение надрыва</td><td>ISO 1421 / ASTM D751</td></tr>
      <tr><td>Камера старения в ксеноновой дуге</td><td>Стойкость к УФ-излучению (изменение цвета, сохранение прочности после 2000 ч)</td><td>ISO 4892 / ASTM G155</td></tr>
      <tr><td>Испытатель на изгиб при низких температурах</td><td>Температура появления трещин от -30 °C до -50 °C</td><td>ISO 4675 / ASTM D2136</td></tr>
      <tr><td>Испытатель на истирание Табера</td><td>Потеря массы после 1000 циклов (диск CS-10)</td><td>ASTM D3389 / ISO 5470-1</td></tr>
      <tr><td>Толщиномер (цифровой, разрешение 0,001 мм)</td><td>Однородность по ширине рулона</td><td>ISO 2286-3</td></tr>
      <tr><td>Испытатель гидростатического давления</td><td>Сопротивление проникновению воды</td><td>ISO 811</td></tr>
    </tbody>
  </table>
  <p class="text-sm text-gray-500">* Все оборудование ежегодно калибруется сторонними аккредитованными лабораториями.</p>

  <h2>От данных к решению: типичный рабочий процесс испытаний</h2>
  <p>Когда появляется новый кандидат из тканей, он проходит стандартизированный семиэтапный процесс квалификации:</p>
  <ol>
    <li><strong>Входной контроль</strong> — визуальная проверка на поверхностные дефекты, сквозные поры и соответствие размерам.</li>
    <li><strong>Картирование толщины</strong> — измерение в 20 точках поперек рулона; для приемки требуется CV &lt; 3%.</li>
    <li><strong>Испытание на разрыв</strong> — 5 образцов в направлении основы и утка. Минимум 3500 N/50 мм для PVC 1100 dtex.</li>
    <li><strong>УФ-кондиционирование</strong> — 1000 ч экспозиции в камере с ксеноновой дугой; требуется сохранение не менее 80 % прочности.</li>
    <li><strong>Холодное растрескивание</strong> — 4 ч при -35 °C, затем изгиб на 180° на оправке диаметром 25 мм. Без видимых трещин.</li>
    <li><strong>Стойкость к истиранию</strong> — 1000 циклов, потеря массы ≤ 0,05 г.</li>
    <li><strong>Утверждение</strong> — ткань допускается к производству только после прохождения всех семи ворот.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Типичный PVC 1100 dtex — сохранение прочности при разрыве после УФ-экспозиции</p>
    <div class="flex items-end gap-3 h-40">
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-600 rounded-t" style="height:100%"></div>
        <span class="text-xs mt-1">0 ч 100%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-500 rounded-t" style="height:95%"></div>
        <span class="text-xs mt-1">500 ч 95%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-400 rounded-t" style="height:88%"></div>
        <span class="text-xs mt-1">1000 ч 88%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-blue-300 rounded-t" style="height:82%"></div>
        <span class="text-xs mt-1">2000 ч 82%</span>
      </div>
      <div class="flex-1 flex flex-col items-center">
        <div class="w-full bg-gray-300 rounded-t" style="height:65%"></div>
        <span class="text-xs mt-1">Конкурент ~65%</span>
      </div>
    </div>
    <p class="text-xs text-gray-400 mt-2">Наша ткань PVC 1100 dtex сохраняет &gt; 80 % предела прочности при разрыве после 2000 ч экспозиции в ксеноновой дуге по сравнению с типичными отраслевыми марками, теряющими более 30 %.</p>
  </div>

  <h2>Наша профессиональная команда</h2>
  <p>В лаборатории работают два штатных инженера по материалам, каждый с высшим образованием в области науки о полимерах или текстильной инженерии и опытом работы в отрасли не менее шести лет. Их поддерживают три техника, которые выполняют текущие испытания и регистрацию данных. Команда регулярно участвует в межлабораторных круговых испытаниях, организуемых Международной организацией по стандартизации (ISO), для подтверждения точности наших методов испытаний.</p>

  <h2>Решение ваших сложнейших задач по материалам</h2>
  <p>Каждая водная среда отличается. Доска, работающая в тропиках, сталкивается с совершенно иными условиями УФ-излучения и температуры, чем доска на северном озере или в пустынном водохранилище. Наша Тканевая лаборатория помогает вам выбрать — или разработать — спецификацию ткани, оптимизированную под ваш эксплуатационный профиль.</p>
  <p>Недавние индивидуальные решения включают:</p>
  <ul>
    <li>Смесь PVC с повышенной стойкостью к истиранию для прокатного парка, доски которого регулярно касаются песчаных пляжей и бетонных спусков (+40 % ресурса по истиранию).</li>
    <li>Низкотемпературная рецептура для канадской дилерской программы зимнего хранения, испытанная до -50 °C без охрупчивания.</li>
    <li>Стабилизированный по цвету оранжевый настил для парка подготовки спасателей, сохраняющий видимость после 3 лет экспозиции тропическому солнцу.</li>
  </ul>
  <p>Мы не продаем готовые ткани и не надеемся, что они подойдут. Мы испытываем, валидируем и рекомендуем — или создаем — решение, адаптированное под ваш профиль эксплуатации. В этом заключается разница {SITE.name}.</p>

  <h2>Как мы работаем с вами</h2>
  <p>Когда вы обращаетесь к нам с задачей по материалу, вот чего можно ожидать:</p>
  <ol>
    <li><strong>Консультация</strong> — мы обсуждаем вашу эксплуатационную среду, целевые показатели и бюджет.</li>
    <li><strong>Предложение</strong> — составляется план испытаний с четкими критериями приемки и сроками.</li>
    <li><strong>Выполнение</strong> — наша лаборатория проводит испытания и выпускает подробный отчет с исходными данными и сравнительным анализом.</li>
    <li><strong>Рекомендация</strong> — мы предлагаем спецификацию ткани, включая альтернативные варианты, если вашим требованиям отвечают несколько материалов.</li>
    <li><strong>Сопровождение</strong> — после поставки мы остаемся на связи для поддержки по любым вопросам о материалах в эксплуатации.</li>
  </ol>
  <p>Наша цель — не просто продать вам доску. Мы хотим гарантировать, что доска, которую вы получили, надежно работает в тех условиях, в которых вы эксплуатируетесь, — и это начинается с ткани.</p>

