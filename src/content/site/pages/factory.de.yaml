qc_section:
  tagline: Qualitätskontrolle
  title: Prüf- & Qualitätssicherungsprozess
  subtitle: Jedes Board durchläuft vor dem Versand eine verbindliche Prüfung. Unser Qualitätslabor arbeitet unabhängig von der Produktion und berichtet direkt an das Management.
  steps:
    - step: '1'
      title: Rohmaterialkontrolle
      desc: PVC-, Hypalon- und Drop-Stitch-Gewebe unterziehen sich Zugfestigkeitsprüfungen, Weiterreißtests und UV-Beständigkeitsverifizierung, bevor eine Charge in die Produktion geht.
    - step: '2'
      title: 24-Stunden-Luftretentionstest
      desc: Jede Schlauchkammer wird auf 18.0 PSI aufgeblasen und 24 Stunden gehalten. Ein Druckabfall über 0.50 PSI löst automatische Ablehnung und Nahtwiederprüfung aus.
    - step: '3'
      title: Last- & Balanceprüfung
      desc: Fertige Boards werden auf Nenndruck aufgeblasen und auf symmetrische Füllung, Steifigkeit bei 15 PSI und Stabilität unter Last geprüft. Jedes Board wird vor der Endkontrolle in unserem Testbecken nassgetestet.

