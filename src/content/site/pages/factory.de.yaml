faq_section:
  tagline: FAQ
  title: Häufig gestellte Fragen zu B2B & OEM
  questions:
    - q: Was ist die Mindestbestellmenge (MOQ) für OEM-aufblasbare SUP-Boards?
      a: 'MOQ wird per Projektkonfiguration bestätigt und nicht durch eine feste Zahl — Rumpf und Werkzeug, Farbvarianten und PVC, Grafiken, Verpackung und Zubehör. Die Standard-Serienfertigung läuft 90–100+ Einheiten pro Charge aus einer vollen 150-m-Drop-Stitch-Rolle, Co-Branding in kleinen Chargen beginnt bei 5–10 Einheiten, und jedes Projekt durchläuft die Phasen Muster (1–2 Einheiten) und Pilot (20–50 Einheiten). Siehe unseren MOQ- & Flexible-Branding-Leitfaden für die vollständige Berechnungslogik.'
    - q: Besitzt Vatrad eine BSCI-Zertifizierung?
      a: Ja. Unsere Fabrik hält eine gültige BSCI-Sozialkonformitätszertifizierung (Auditbericht auf Anfrage erhältlich). Wir halten zudem ISO 9001 für Qualitätsmanagement. Die CE-Zertifizierung gilt für Modelle, die für den EU-Markt bestimmt sind; der Umfang wird je Projekt bestätigt. REACH- und RoHS-Konformitätsdokumentation wird mit jeder OEM-Bestellung bereitgestellt.
    - q: Wie lang ist die typische Lieferzeit für einen OEM-Auftrag?
      a: Die Standardlieferzeit beträgt 25–35 Tage ab bestätigter PO und Anzahlung für OEM-Stapelproduktion. Kundenspezifisches Formendesign ergänzt 15–20 Tage für den Werkzeugbau. Express-Produktion ist für eilige Aufträge und saisonale Spitzen verfügbar. Prototypenmuster sind typischerweise innerhalb von 7–12 Tagen fertig.
    - q: Übernehmen Sie die Exporthandelsdokumentation?
      a: Ja. Unser Team verwaltet die Exporthandelsdokumentation und Zollabfertigung hausintern, und wir liefern in 50+ Länder in den EU-, US-, AU- und Asienmärkten.

b2b_moq: 'MOQ per Projektkonfiguration bestätigt: Muster 1–2, Pilot 20–50, Menge 90–100+ (pro 150-m-Rolle); Co-Branding in kleinen Chargen ab 5–10 Einheiten.'

production_flow:
  tagline: Produktionsablauf
  title: Vom Material zum fertigen Board
  subtitle: Jedes Board durchläuft 6 Produktionsstufen mit QC-Kontrollpunkten bei jedem Schritt. Keine Abkürzungen, keine übersprungenen Inspektionen.
  stages:
    - stage: '01'
      title: Wareneingang & Wareneingangs-QC
      description: 'Alle eingehenden Materialien werden in unserem ERP-System nach Charge/Lot-Nummer geloggt. PVC-Geweberollen, Drop-Stitch-Kerne, Ventile, Klebstoffe und Beschläge werden bis zur QC-Freigabe unter Quarantäne gehalten.'
      qc_check: 'Zugfestigkeit (ASTM D751), Weiterreißfestigkeit (ISO 4674), Dickenmessung, Klebstoffviskosität, Sichtfehlerscan'
      qc_threshold: '100 % der Chargen getestet. Ablehnung, wenn Zugfestigkeit < 90 % der Spezifikation, Weiterreißfestigkeit < spez. Minimum oder ein Sichtfehler'
      responsibility: Wareneingangs-QC-Team (3 Inspektoren)
    - stage: '02'
      title: CNC-Zuschnitt & Materialvorbereitung
      description: 'Computersoptimierte Verschachtelung legt Paneele so auf den PVC-Rohstoff, dass Abfall minimiert wird. Automatische CNC-Schneidemaschinen halten 0.1 mm Positionsgenauigkeit.'
      qc_check: 'Maßprüfung gegen CAD-DXF-Dateien, Kantenqualitätsinspektion, Panelanzahl-Verifizierung'
      qc_threshold: 'Jedes 20. Panel gemessen. Toleranz ±0.5 mm. Charge ablehnen, wenn >2 % außerhalb der Toleranz'
      responsibility: Leiter der Zuschnittwerkstatt
    - stage: '03'
      title: Schweißen & Drop-Stitch-Verklebung
      description: 'Drop-Stitch-Kerne werden per Heißlaminierung mit den äußeren PVC-Laminaten verklebt. Schlauchkammern werden HF- oder heißluftgeschweißt. Railbänder werden dreilagig fusionverklebt.'
      qc_check: 'Abziehprüfung alle 50 Einheiten (ASTM D751), Schweißbreitenmessung, Heißlufttemperatur-Logprüfung, Sichtnahtinspektion unter Gegenlicht'
      qc_threshold: 'Abziehfestigkeit min. 8 N/cm. Schweißbreitentoleranz ±1 mm. Sichtbare Rinnenbildung = Ablehnung'
      responsibility: Schweiß-QC (2 Inspektoren pro Schicht)
    - stage: '04'
      title: Montage & Ausrüstung
      description: 'Boards gehen in die Endmontage, wo alle Komponenten zusammenkommen: Deck- und Rumpfpaneele verschweißt, Ventile installiert, D-Ringe, Griffe, Finboxes und Tragetasche gefittet. Jede Einheit folgt einer 100-Punkte-Montagecheckliste.'
      qc_check: '100-Punkte-Checklisten-Freigabe pro Einheit, Ventilfunktionstest (10 Öffnungs-/Schließzyklen), Beschlagdrehmoment-Verifizierung, Sichtprüfung'
      qc_threshold: 'Null-Fehler-Politik bei sicherheitskritischen Teilen (Ventile, D-Ringe, Griffe). Kleinere Kosmetik: AQL 2.5 (ISO 2859)'
      responsibility: Montageteamleiter + Linien-QC
    - stage: '05'
      title: Druckprüfung & Qualitätshalt
      description: 'Jede Kammer wird auf 18.0 PSI aufgeblasen (für ein mit 12–15 PSI bewertetes SUP) und 24 Stunden gehalten. Drucksensoren protokollieren kontinuierlich. Kammern mit einem Druckabfall über 0.50 PSI werden abgelehnt und zur Nahtwiederprüfung geschickt.'
      qc_check: '24h-Druckhaltlog, Sensor-Kalibrierung täglich verifiziert, temperaturkompensierte Druckmessung, Nahttest nach Reparatur'
      qc_threshold: 'Max. 0.50 PSI Druckabfall über 24h bei stabiler Temperatur. Jede Kammer, die dies überschreitet = 100 % Neustest der gesamten Produktionscharge'
      responsibility: Qualitätslabor (unabhängig von der Produktion, berichtet an das Management)
    - stage: '06'
      title: Endkontrolle & Verpackung
      description: 'Finale Sicht- und Funktionskontrolle. Oberflächenfehler, Farbkonsistenz, Etiketten-/BIN-Verifizierung, Verpackungsintegrität und Zubehörvollständigkeit. Einheiten werden vakuumverpackt, in Kartons verpackt und lagenweise für die Containerbeladung palettiert.'
      qc_check: 'Vollständige Sichtprüfung, Zubehörcheckliste je SKU, Verpackungsfalltest (1 m, Stichprobe), Etiketten-/Barcode-Scanverifizierung'
      qc_threshold: 'AQL 2.5 für schwere Fehler, AQL 4.0 für leichte. Null-Toleranz bei Sicherheitsfehlern. 100 % der Einheiten sichtgeprüft'
      responsibility: End-QC-Team (4 Inspektoren) + Packteamsleiter

