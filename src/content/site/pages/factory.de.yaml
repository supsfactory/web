material_traceability:
  tagline: Rückverfolgbarkeit
  title: Materialverfolgung & Chargenkontrolle
  description: Jede Rohmaterial-Charge erhält eine eindeutige Lot-Nummer in unserem ERP-System. Vom Eingang über die Produktion bis zum Endprodukt verlinkt die Stückliste jedes Boards zurück zur ursprünglichen Lieferanten-Charge. Dies ermöglicht vollständige vorgelagerte Rückverfolgbarkeit für jede Qualitäts- oder Compliance-Anfrage.
  system: Kundenspezifisches ERP (internes System der Qingdao Vatrad Group) + physische Chargenmarkierungen an jedem Arbeitsauftrag
  coverage: 100 % des Produktionsmaterials — PVC, Hypalon, Drop-Stitch-Gewebe, Klebstoffe, Ventile, Beschläge, Verpackung
  records_retained: 10 Jahre (gemäß CE 2013/53/EU-Anforderung)
  suppliers:
    - material: PVC in Marinequalität
      source: Chinesische und koreanische Lieferanten
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanischer Lieferant
      certified: ISO 9001, REACH
    - material: Drop-Stitch-Gewebe
      source: Eigenes Weben + externer Partner
      certified: Interne QC + Lieferant ISO 9001
    - material: Ventile & Beschläge
