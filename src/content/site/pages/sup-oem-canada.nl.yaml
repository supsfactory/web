why_canada:
  tagline: 'Waarom kopers in Canada'
  title: 'Gebouwd voor Canadese import'
  subtitle: 'De fabriek beantwoordt de vragen die Canadese merken en retailers zich stellen vóór hun eerste container.'
  items:
    - title: 'DDP voor planbare bestemmingskosten'
      description: 'DDP omvat douaneafhandeling en levering aan jouw magazijn — invoerrechten, belastingen en transport in één totaalbedrag in CAD of USD. De populairste keuze voor eerste importeurs.'
    - title: 'Aansluiting op de west- en oostkust'
      description: 'Wij berekenen het zeetransport naar Vancouver of naar Toronto en Montreal via de Suez-route — afhankelijk van wat de beste balans geeft tussen transittijd en bestemmingskosten.'
    - title: 'Tweetalig bruikbare productdocumenten'
      description: 'De CE-, REACH- en douanedocumentatie wordt voor jouw doelmarkten opgesteld, zodat jouw productdocumenten werken voor de verpakkingseisen in het Engels en Frans.'
    - title: 'Eén fabriek, één kwaliteitssysteem'
      description: 'Ontwikkeling, monsters, productie en QC vinden allemaal plaats in de fabriek van 12.500 m² — geen omwegen via brokers, geen monster dat de productie niet kan repliceren.'

process_notes:
  tagline: 'Zo werkt het'
  title: 'Van specificatie tot container'
  subtitle: 'Dezelfde zes fasen, of je nu twee containers per jaar koopt of twintig: specificatie, engineering, monster, verificatie, attrezzaggio, productie — daarna levering FOB, CIF of DDP.'
  items:
    - title: '1. Stuur je specificatie'
      description: 'Een referentieboard, een schets of een specificatie van de concurrent is al genoeg. Technische verificatie en offerte volgen binnen één werkdag.'
    - title: '2. Keur het monster goed'
      description: 'Je eerste fysieke monster vertrekt binnen 7–12 dagen met een goedkeuringsformulier voor de constructie, printkleuren en de resultaten van de drukproef.'
    - title: '3. Productie & export'
      description: 'De cycli worden in 25–35 dagen afgerond met QC-checkpoints tijdens de productie. Packing list, factuur en cognossement gaan vóór het schip.'
    - title: '4. Levering aan jouw magazijn'
      description: '4–6 weken zeetransport naar Vancouver, Toronto of Montreal — met DDP regelen wij de douaneafhandeling en de levering tot aan jouw deur.'

faq_section:
  tagline: FAQ
  title: 'Vragen over import naar Canada'
  questions:
    - q: Hoe lang duurt het zeetransport naar Canada?
      a: 'Reken op 4–6 weken vanaf de haven van Qingdao naar de Canadese havens — Vancouver aan de westkust, Toronto en Montreal in het oosten — afhankelijk van de bestemming en het vertrekschema. DDP-projecten omvatten de volledige door-to-door-tijdlijn.'
    - q: Verzenden jullie DDP naar Canada?
      a: 'Ja. DDP omvat zeetransport, douaneafhandeling, invoerrechten en belastingen plus de levering aan jouw magazijn — één planbare totaalprijs. Ook FOB Qingdao en CIF zijn beschikbaar.'
    - q: Wat is de MOQ voor een private label SUP-import?
      a: 'De MOQ wordt bevestigd door de projectconfiguratie: de monsterontwikkeling dekt 1–2 stuks, kleine pilotseries draaien met 20–50 stuks op bestaande platforms en de standaard productie in serie draait met 90–100+ stuks per design van een volledige drop-stitch rol van 150 m.'
    - q: Ondersteunen jullie verpakking in het Engels en Frans?
      a: 'Ja. Ons prepress-team bereidt de printbestanden voor de talen en regelgeving van jouw doelmarkten voor — inclusief tweetalige EN/FR-verpakking voor de Canadese markt.'
    - q: Kan ik de fabriek bezoeken vóór de order?
      a: 'Ja. De fabriek van 12.500 m² in Qingdao staat open voor klanten — virtuele fabrieksrondleidingen kunnen online worden afgesproken en fysieke bezoeken worden geleid langs de productielijnen en QC-stations.'
    - q: Hoe start ik een project vanuit Canada?
      a: 'Stuur een referentieboard, een schets of een specificatie. De technische verificatie en de offerte komen binnen één werkdag en vóór elke uitwisseling van bestanden wordt een NDA ondertekend.'

