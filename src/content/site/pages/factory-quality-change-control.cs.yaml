cc_validation:
  tagline: Inženýrská validace
  title: Protokol validace a přijetí — podklady místo tvrzení
  body: |
    Nejednoznačné formulace přijetí typu *"opravená deska musí být v pořádku"* nepřijímáme. Řízená formulace zní:

    > "Opravený vzorek musí splňovat stejná použitelná kritéria nepropustnosti, vizuální zpracování, funkčnosti ventilu a projektová kritéria přijetí jako vyhovující deska, pokud zákazníkem schválená odchylka výslovně neurčuje alternativní kritérium."

    Validační podklady jsou kvantitativní a inženýrská výchozí hodnota pro opravy nepropustnosti zahrnuje:

    - **Odstranění netěsnosti a udržení tlaku.** Původní netěsnost se odstraní bez trvalého bublání při detekci v mýdlové vodě; deska udrží standardní zkušební tlak 18,0 PSI po dobu 24 hodin, přičemž čistý pokles tlaku ΔP ≤ 0,2 PSI po teplotní a vlhkostní kompenzaci — jde o tužší výchozí hodnotu pro validaci oprav, odlišnou od prahu automatického odmítnutí 0,50 PSI uplatňovaného při závěrečném přijetí na výrobní lince.
    - **Funkčnost ventilu.** Utahovací moment jádra ventilu odpovídá specifikaci 15–20 N·m, bez mikroskopické netěsnosti na těsnění při dofukování vysokým tlakem a dynamickém stlačování.
    - **Spojování švů a životnost.** Na okrajích spoje se neobjeví nadzvednutí, bělení ani delaminace; po cyklech stárnutí v teple a vlhku nevykazuje lepidlová vrstva změkčení ani křehké praskání.
    - **Vzhled a zpracování.** Bez steků lepidla, bez poškození EVA, bez zkroucení desky a bez posunu loga či škrábanců na potištěném povrchu.

cc_engineering:
  tagline: Matice inženýrského provádění
  title: Kvantifikované parametry čtyř základních opravných procesů
  subtitle: 'Každý řízený opravný proces má definované parametry, metodiku a kritéria přijetí — stejné hodnoty, kterými se řídí naši operátoři a které si mohou zákazníci při auditech ověřit.'
  headers:
    process: Opravný proces
    parameters: Řízené parametry
    methodology: Zkušební metodika
    acceptance: Kritéria přijetí
  rows:
    - process: 'Oprava bodového otvoru / mikroskopické netěsnosti'
      parameters: 'Očištění rozpouštědlem a sušení 3–5 min; aktivace horkým vzduchem 60 °C ± 5 °C; přítlak válce ≥ 0,4 MPa'
      methodology: 'Dofukování na 18 PSI; úplné ponoření do vody nebo potření mýdlovou vodou; pozorování po dobu 10 minut'
      acceptance: 'Nulový vývoj bublinek; odtrh okraje o 180° bez nadzvednutí a bez steků lepidla'
    - process: 'Opětovné spojení boční výztuhy / švu'
      parameters: 'Přísně kontrolovaný poměr dvousložkového lepidla; prostředí 22–28 °C, relativní vlhkost ≤ 65 %; svěrák po dobu ≥ 4 h'
      methodology: 'Zkouška přetlakem 22 PSI po dobu 2 h; následně 6 h v sušárně při 50 °C a 2 h odpočinku při pokojové teplotě'
      acceptance: 'Žádné oddělení ani praskliny; čistý pokles tlaku ΔP ≤ 0,1 PSI; lepidlová vrstva bez bělení a křehnutí'
    - process: 'Uvolněná patice ventilu / mikroskopická netěsnost'
      parameters: 'Moment specializovaného klíče 18–20 N·m; těsnicí podložka v ploše bez deformace; potvrzena čistota závitů'
      methodology: 'Dofukování na 15 PSI; 20 cyklů dofukování a vypouštění; pozorování při ponoření pod vodu'
      acceptance: 'Nulové bublinky u jádra ventilu a na obvodu patice; moment po cyklech ≥ 16 N·m'
    - process: 'Závěrečná 24hodinová zkouška udržení tlaku'
      parameters: 'Referenční dofukování 18,0 PSI; digitální tlakoměr třídy 1,0 / ±0,5 %; okolní teplota a vlhkost se zaznamenávají a kompenzují'
      methodology: 'Digitální záznamník tlaku; průběžná 24hodinová křivka tlaku'
      acceptance: 'Čistý pokles tlaku ΔP ≤ 0,20 PSI / 24 h po kompenzaci; žádné vyboulení ani deformace desky'

