cc_intro:
  tagline: Rozsah a pravidla
  title: Základní zásady řízení
  body: |
    **Dokument:** QMS-SOP-QC-CC-001 — *Standard řízení změn procesních parametrů oprav* (Rev 2.0, oficiální vydání). **Výrobce:** QINGDAO VATRAD GROUP.,LTD. **Normová reference:** systémy řízení kvality ISO 9001:2015.

    - **Žádné neřízené změny.** Změny parametrů oprav musí projít formálním řízením změn. Operátoři na místě, vedoucí směny ani jediné oddělení nikdy nesmějí schválené parametry oprav měnit ústní dohodou nebo zápisem do opravnoho záznamu z volné ruky.
    - **Pokrytí všech prvků.** Řízený rozsah zahrnuje nepropustnost, usazení ventilu, boční výztuhy, spojování švů, vytvrzování horkovzduchem a zkoušení udržením tlaku — každý parametr, který může ovlivnit těsnost, strukturální životnost, vzhled, přijetí zákazníkem nebo vysledovatelnost.
    - **Zásada souhlasu zákazníka.** Jakákoli změna, která produkt odchýlí od zákazníkem schváleného vzorku, technické specifikace, kusovníku, grafiky, požadavku na obaly nebo kritéria přijetí, se implementuje pouze s písemným souhlasem zákazníka. Bez něj se deska opraví podle původního požadavku, nahradí nebo odmítne — nikdy se tolerance nezmírní jen z vůle závodu.

cc_scope:
  tagline: Klasifikace rizik
  title: Rozsah změn a klasifikace rizik
  subtitle: Kterákoli z následujících skutečností spouští formální řízení změn — nikdy se to neřeší poznámkou v opravném záznamu. Úroveň rizika určuje, kdo změnu schvaluje a jak rozsáhlá validace je nutná.
  headers:
    category: Kategorie změny
    examples: Typické příklady
    risk: Riziko
    requirements: Požadavky na kontrolu a schválení
  rows:
    - category: 'Opravné materiály'
      examples: 'Lepidlo, čisticí prostředek, materiál záplaty, těsnění ventilu, základní nátěr nebo změna dodavatele'
      risk: 'Vysoké'
      requirements: 'Posouzení napříč odděleními + validace kompatibility materiálu a udržení tlaku + souhlas zákazníka, kde je použitelný'
    - category: 'Procesní podmínky'
      examples: 'Příprava povrchu, teplota/vlhkost při vytvrzování horkovzduchem, přítlak svěráků, doba držení'
      risk: 'Vysoké'
      requirements: 'Schválení Techniky a Kvality s validací definovaného okna teploty a vlhkosti'
    - category: 'Nástroje a měřidla'
      examples: 'Manometry, detektory netěsnosti, horkovzdušné pistole, nástroje na ventily, zkušební software'
      risk: 'Střední až vysoké'
      requirements: 'Kontrola platnosti kalibrace + posouzení vhodnosti vybavení'
    - category: 'Rozsah vady'
      examples: 'Rozšíření plochy opravy; mikroskopická netěsnost povrchu přecházející do kritické zóny výztuhy, švu nebo usazení ventilu'
      risk: 'Vysoké'
      requirements: 'Nosné konstrukční plochy: povinné zastavení a nové posouzení'
    - category: 'Kontrolní metody'
      examples: 'Metoda detekce netěsnosti, zkušební tlak (18,0 PSI), doba udržení (24 h)'
      risk: 'Vysoké'
      requirements: 'Schválení Kvality + potvrzení technické dohody se zákazníkem'
    - category: 'Dokumentace a oprávnění'
      examples: 'Opravný pokyn, kontrolní listy, logika rozhodování NCR, kvalifikace operátora'
      risk: 'Střední'
      requirements: 'Řízená revize dokumentu (Rev A → Rev B) + záznamy o školení'

cc_containment:
  tagline: Pravidlo tvrdého zastavení
  title: Okamžité zadržení, když se podmínky zhorší
  body: |
    > "Dosud používaná metoda opravy se musí dát do přezkumu a nesmí se používat na další dotčené výrobky, dokud změna neposoudí a neautorizuje — výjimkou je zdokumentované dočasné odchylky schválené Kvalitou a Technikou."

    Současnou metodu opravy je nutné okamžitě pozastavit, když opětovná kontrola oprav opakovaně nevyhovuje, když vada zasahuje do konstrukčně nosných zón (patice ventilu, výztuhy, švy, oblast tlaku na nose a patě), když náhradní materiál ještě není validovaný nebo když současné parametry odporují zákazníkem schválené specifikaci.

    Dočasné odchylky se nikdy nestávají trvalou praxí: každá z nich má definované období platnosti, rozsah použitelných dávek, strop množství, validační požadavky a automatické ukončení platnosti. Ústná výjimka není výjimka — pokud není zdokumentovaná s vlastním termínem platnosti, neexistuje.

cc_flow:
  tagline: Standardní uzavřený cyklus o 9 krocích
  title: Od žádosti o změnu po uzavření a archivaci
  subtitle: 'Jeden zdokumentovaný cyklus pro každou změnu parametru: návrh, třízení, posouzení, schválení, validace, pilot, ověření, revize, uzavření.'
  steps:
    - step: '01'
      title: Žádost o změnu (ECR)
      desc: 'Žádost může podat kterékoli oddělení, ale vlastníkem je vedení Techniky, Kvality nebo Výroby. ECR odpovídá na otázky, proč se změna navrhuje, co se mění, čeho se dotkne a jak bude ověřena — včetně čísla řízení změn, souvisejícího NCR/CAPA, současného a navrženého parametru, dotčených dávek a klasifikace dočasné/trvalé.'
    - step: '02'
      title: Úvodní posouzení a zadržení
      desc: 'Žádost se nejprve posoudí z hlediska okamžitého zadržení: musí se současná metoda zastavit ihned? Pokud je dočasná odchylka povolena, je ohraničena obdobím platnosti, rozsahem dávek, stropem množství a automatickým ukončením platnosti.'
    - step: '03'
      title: Posouzení dopadů a rizik
      desc: 'Technika, Kvalita, Výroba, Nákup/Řetěz dodávek a Projekt posuzují výkonnost výrobku, kritéria přijetí, kompatibilitu materiálu, vzhled, schopnost procesu, vybavení a měřidla, kvalifikaci personálu, požadavky zákazníka, soulad s předpisy a rozsah vysledovatelnosti.'
    - step: '04'
      title: Společné posouzení a schválení
      desc: 'Schválení se řídí pevně stanovenou schvalovací maticí — nikoli pravidlem „kdo nejvíc mluví“. Změny s vysokým rizikem vyžadují schválení napříč odděleními a tam, kde je to nutné, i písemný souhlas zákazníka ještě před jakýmkoli pokusem.'
    - step: '05'
      title: Plán validace
      desc: 'U změn s vysokým rizikem je nutné mít schválený plán validace ještě před běžným použitím: reprezentativní vzorkové desky, srovnání současné a navržené metody, zkušební metody, kritéria přijetí, kontrolní fáze, odpovědné osoby a termín.'
    - step: '06'
      title: Řízený pilot a implementace
      desc: 'Nové dokumenty se vydávají a staré verze se stahují a označují jako ZRUŠENO; nové materiály a měřidla se ověřují a kalibrují; operátoři jsou proškoleni a kvalifikováni; první dávka běží pod přísnější kontrolou s jasným označením stavu.'
    - step: '07'
      title: Opětovná kontrola a přezkoumání účinnosti
      desc: 'Než lze změnu považovat za účinnou, změří se a posoudí podíl oprav přijatých na první pokus, podíl úspěšných opětovných kontrol, míru opakování a přijatelnost vzhledu — jedna opravená deska se nikdy nepovažuje za validaci procesu.'
    - step: '08'
      title: Revize dokumentů a školení
      desc: 'Pracovní pokyny, kontrolní listy, varianty rozhodování u NCR, karty parametrů a školící materiály se aktualizují na novou revizi se zdokumentovaným praktickým školením a kvalifikací operátora.'
    - step: '09'
      title: Uzavření a archivace záznamů
      desc: 'Změna se uzavře až poté, co se posoudí a schválí validační podklady, aktualizace dokumentace, záznamy o školení a účinnost implementace. Pokud zamýšleného výsledku není dosaženo, změna se reviduje, prodlužuje, pozastavuje nebo stahuje.'

