answer:
  label: 'Přímá odpověď'
  text: 'Změny parametrů oprav se v QINGDAO VATRAD GROUP.,LTD. nikdy nerozhodují ústně ani zpětně. Každá navržená změna schválených opravných materiálů, procesních podmínek, vybavení, zkušebních metod, kontrolních kritérií nebo oprávněných osob musí před implementací projít formálním řízením změn: zdokumentovanou žádostí o technickou změnu (ECR), posouzením dopadů a rizik, společným posouzením oddělení Techniky, Kvality, Výroby, Nákupu a Projektu, schválením na úrovni stanovené naší schvalovací maticí, schváleným plánem validace pro změny s vysokým rizikem, řízenou pilotní implementací, opětovnou kontrolou a přezkoumáním účinnosti a uzavřením až po revizi dokumentace a školení. Jakákoli změna dotýkající se zákazníkem schválených specifikací, vzorků, kusovníků, grafiky nebo kritérií přijetí navíc vyžaduje písemný souhlas zákazníka.'
  verified: 'září 2026'

