      alt: Hotové nafukovací desky SUP připojené k digitálním záznamníkům tlaku v závěrečné zkušební oblasti
      title: Závěrečné zkoušení udržením tlaku
      desc: 'Hotové desky se připojí k přesným digitálním záznamníkům tlaku; hlavní tlakoměr ukazuje referenční 18,00 PSI a všechna zkušební data se automaticky nahrávají a propojují se smluvním systémem vysledovatelnosti.'

cc_pokayoke:
  tagline: Ochrana proti chybám
  title: 'Poka-Yoke: tvrdé blokace, které zastaví neřízenou změnu'
  subtitle: Standard se vynucuje nejen postupy, ale i fyzickými a systémovými blokacemi, které neřízenou změnu jednoduše znemožní provést.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR brána pro odblokování nástrojů
      desc: 'Opravná pracoviště načtou čárový kód ECR podepsaný QA, než se odblokují pneumatické dofukovací ventily a míchačky lepidla. Bez schváleného záznamu řízení změn není možné zásobování — zpětný podpis („nejprve změna, pak podpis“) je fyzicky blokován.'
    - icon: 2
      icon_bg: green
      title: Automatické ukončení dočasné odchylky
      desc: 'Dočasné odchylky mají v systému stanovený tvrdý strop (například nejvýše 50 desek nebo 7 kalendářních dnů). Po dosažení stropu se dávka zamkne a tisk průchodného štítku zásilky se zablokuje, dokud změna nebude formálně posouzena.'
    - icon: 3
      icon_bg: purple
      title: Minimální validační podklady
      desc: 'Změny s vysokým rizikem vyžadují alespoň 5 reprezentativních vzorkových desek pokrývajících horní a dolní mez tolerance, plně zkontrolovaných 2 nezávislými kontrolory QC, než lze vydat validační zprávu — jedna opravená deska se nikdy nepovažuje za validaci procesu.'
    - icon: 4
      icon_bg: orange
      title: Řízení dokumentů 1-In-1-Out
      desc: 'Zastaralé karty pracovišť se fyzicky vyberou a zruší (děrovaním), teprve poté se vydá nová karta s razítkem řízené červené pečetě — stará a nová verze nikdy nesdílejí jedno pracoviště.'

