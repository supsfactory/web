faqs:
  tagline: FAQ
  title: Často kladené otázky o řízení změn při opravách
  items:
    - q: 'Může závod změnit parametry oprav, aniž by nás informoval?'
      a: 'Ne. Jakákoli navržená změna schválených opravných materiálů, procesních podmínek, nástrojů, zkušebních metod, kontrolních kritérií nebo oprávněných osob musí nejprve projít zdokumentovaným řízením změn. Změny dotýkající se zákazníkem schválených specifikací, vzorků, kusovníků, grafiky nebo kritérií přijetí vyžadují písemný souhlas zákazníka.'
    - q: 'Co se považuje za změnu s vysokým rizikem?'
      a: 'Za změnu s vysokým rizikem se považují změny opravných materiálů nebo dodavatelů, podmínek tlaku, držení a vytvrzování, metod opravy ventilu, výztuhy či švu, kontrolních nebo přijímacích kritérií a rozšíření rozsahu vady do konstrukčních zón. Vyžadují posouzení napříč odděleními, schválený plán validace a řízenou pilotní implementaci před běžným použitím.'
    - q: 'Lze dočasnou odchylku používat neomezeně?'
      a: 'Ne. Každá dočasná odchylka má definované období platnosti, rozsah dávek, strop množství a validační požadavky, včetně automatického ukončení platnosti. Po dosažení stropu se dávka zamkne a tisk průchodného štítku se zablokuje, dokud změna nebude formálně posouzena.'
    - q: 'Jak se prokáže, že nová metoda funguje, ještě před plným použitím?'
      a: 'Změny s vysokým rizikem vyžadují plán validace: alespoň 5 reprezentativních vzorkových desek pokrývajících meze tolerance, otestovaných 2 nezávislými kontrolory QC proti kvantifikovaným kritériím přijetí (odstranění netěsnosti, udržení tlaku, funkčnost ventilu, životnost švu, vzhled). Schválení k validaci není schválením k použití.'
    - q: 'Musíme schvalovat každou změnu?'
      a: 'Ne každou, ale jakákoli změna, která produkt odchýlí od zákazníkem schváleného vzorku, technické specifikace, kusovníku, grafiky, obalů nebo kritérií přijetí, se implementuje pouze s písemným souhlasem zákazníka. Bez něj se desky opraví podle původního požadavku, nahradí nebo odmítnou.'
    - q: 'Co se stane se starými dokumenty po schválení změny?'
      a: 'Staré pracovní pokyny, karty parametrů a kontrolní listy se fyzicky vyberou a zruší (1-In-1-Out), označí jako ZRUŠENO a po školení nahradí novou řízenou revizí. Stará a nová verze nikdy nesdílejí jedno pracoviště.'
    - q: 'Jak dlouho se uchovávají záznamy řízení změn?'
      a: 'Záznamy o uzavření — validační podklady, revize dokumentů, záznamy o školení a přezkoumání účinnosti — se uchovávají podle naší politiky archivace záznamů (minimálně 3 roky pro záznamy o uzavření), tak aby každá změna zůstala vysledovatelná pro audity a přezkoumání vysledovatelnosti.'

