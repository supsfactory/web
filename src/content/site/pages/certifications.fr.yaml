  subtitle: 'Partagez votre catégorie de produit, votre marché cible, votre quantité estimée et toute exigence d''inspection, de documentation ou d''emballage. Nous examinerons les intrants de projet applicables et vous conseillerons sur la prochaine étape pour le développement d''échantillons ou la planification de la production. Une discussion NDA est disponible avant de partager des spécifications, graphismes ou exigences qualité non publics.'
