traceability:
  tagline: Traçabilité au niveau du lot
  title: 'Quatre questions auxquelles chaque lot répond'
  subtitle: 'Les enregistrements qualité sont tenus par lot de production et reliés à la spécification produit, aux graphismes, à la BOM et aux exigences d''emballage applicables. Cela appuie l''investigation et les actions contrôlées si un problème qualité est identifié. Lors d''un audit acheteur, notre équipe qualité répond sur le terrain à ces quatre questions — chaque réponse renvoie à un enregistrement contrôlé.'
  items:
    - title: 'Qu''''a-t-on produit ?'
      description: 'Le produit, le modèle, la configuration et la révision sont liés au numéro de commande et à la révision de spécification approuvée.'
      icon: '1'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Voir le dossier de traçabilité (PDF)'
    - title: 'Quels matériaux ont été utilisés ?'
      description: 'Chaque lot de matériau alimentant le lot est consigné avec son fournisseur, son certificat et sa décision IQC.'
      icon: '2'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Voir le dossier de traçabilité (PDF)'
    - title: 'Qui a inspecté, et quand ?'
      description: 'Chaque enregistrement porte le rôle de l''inspecteur, la date, les outils utilisés et le résultat — aucune signature anonyme.'
      icon: '3'
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_BATCH_TRACEABILITY_AND_NCR_CONTROL_DOSSIER.pdf
      link_label: 'Voir le dossier de traçabilité (PDF)'
    - title: 'Comment le lot a-t-il été libéré ?'
      description: 'La libération n''est autorisée par la qualité que lorsque toutes les portes sont clôturées ; la décision est documentée sur l''enregistrement.'
