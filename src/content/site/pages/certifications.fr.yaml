meta:
  title: 'Contrôle qualité SUP personnalisé : inspection en 7 étapes | SUPsfactory'
  description: 'Comment chaque commande de SUP personnalisé est contrôlée : 7 points d''inspection, de la planification de la pré-production à l''autorisation d''expédition, avec des rapports bilingues téléchargeables.'
  dateModified: '2026-08-15'
  keywords:
    - 'contrôle qualité sup'
    - 'inspection usine sup'
    - 'plan d''inspection qualité oem'
    - 'inspection avant expédition sup'
    - 'certification ce sup'
    - 'iso 9001 sup'
hero:
  tagline: Contrôle qualité pour projets personnalisés
  title: 'Contrôle qualité pour projets de SUP gonflables personnalisés'
  subtitle: 'La qualité est vérifiée par rapport à l''échantillon approuvé, à la spécification technique, aux graphismes, à la nomenclature (BOM) et aux exigences d''emballage de chaque projet — et non par rapport à une allégation générale. De l''entrée des matières à l''autorisation d''expédition, notre processus d''inspection est structuré pour vérifier la conformité du produit aux stades de production définis. Propulsé par QINGDAO VATRAD GROUP, l''usine de SUP gonflables de 12 500 m² derrière afarer.'
stats:
  - value: 100%
    label: Unités testées en pression
  - value: '7'
    label: Points d'inspection contrôlés
  - value: 18.0 PSI
    label: Maintien de pression de 24 heures
  - value: ISO 9001
    label: Qualité certifiée
quality_basis:
  tagline: Base de la qualité
  title: 'Ce qui définit l''acceptation du produit'
  subtitle: 'Les critères finaux d''acceptation sont établis avant l''autorisation de production. Ces documents de projet contrôlés définissent ce qui doit être fabriqué, comment les détails clés sont vérifiés et ce qui doit être contrôlé avant l''expédition — approuvés avec l''acheteur et figés dans le Plan d''Inspection Qualité (QIP). Toute demande de modification passe par un contrôle documenté des modifications, jamais silencieusement sur la chaîne.'
  items:
    - title: 'Échantillon approuvé'
      description: 'La planche de référence physique validée par l''acheteur. Chaque planche finie est comparée à celle-ci pour les dimensions, le profil, la rigidité et la finition.'
      icon: tabler:medal
    - title: 'Spécification technique'
      description: 'Les matériaux, la construction et les plans dimensionnels verrouillés sur un numéro de révision. Le FAI vérifie le premier article par rapport à cette révision exacte.'
      icon: tabler:file-check
    - title: 'Graphismes approuvés'
      description: 'Les graphismes, les couleurs d''impression et le placement sont approuvés et verrouillés en version avant la découpe, afin que chaque pont parte dans le look approuvé par la marque.'
      icon: tabler:palette
    - title: 'BOM approuvée par le client'
      description: 'La nomenclature — planche, pagaie, pompe, leash, sac, manuel — confirmée par l''acheteur. Le PSI vérifie la complétude à 100 % du kit par rapport à cette BOM.'
      icon: tabler:list-checks
    - title: 'Exigences d''emballage et d''étiquetage'
      description: 'La structure du carton, les marquages, les codes-barres, le contenu des étiquettes et les marques d''expédition sont fixés par écrit. La lisibilité des codes-barres et la précision des marquages sont vérifiées au PSI.'
      icon: tabler:package
tests:
  - title: Tests de pression
    description: Les chambres gonflables sont soumises à des pressions dépassant leurs limites de fonctionnement recommandées sur des périodes prolongées. Cela vérifie l'étanchéité à l'air et l'intégrité structurelle du matériau et des coutures, garantissant que le produit peut supporter l'usage prévu et une éventuelle sur-gonflage sans défaillance ni fuite.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pressure-testing.webp
    alt: Chambre de SUP gonflable soumise à un test de pression pour vérifier l'étanchéité à l'air
  - title: Tests d'impact
    description: Les produits sont soumis à des impacts contrôlés de différentes masses et angles. Cela évalue la résistance du matériau aux perforations, aux déchirures et aux dommages dus aux collisions avec des obstacles dans l'eau, démontrant la durabilité et la longévité.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department.webp
    alt: Banc d'essai d'impact évaluant la résistance à la perforation du matériau du bateau gonflable
  - title: Tests de résistance aux UV
    description: Les échantillons de matériau sont exposés à un rayonnement UV accéléré pour vérifier qu'ils ne jaunissent pas, ne fissurent pas et ne perdent pas de résistance au fil du temps. Chaque lot de PVC est contrôlé contre la dégradation solaire avant utilisation en production.
    image: https://assets.afarer.com/images/afarer/factory/afarer-uv-resistance-testing.webp
    alt: Échantillons de matériau PVC sous rayonnement UV accéléré lors d'un test de résistance
  - title: Tests de résistance à l'abrasion
    description: Les échantillons de matériau sont frottés contre des surfaces abrasives pendant un nombre de cycles défini sous une pression contrôlée. Cela mesure la capacité du matériau à résister à l'usure due à une utilisation répétée, au contact avec le sable, les rochers ou d'autres surfaces, garantissant une durabilité à long terme.
    image: https://assets.afarer.com/images/afarer/factory/afarer-pvc-material-testing.webp
    alt: Machine de test d'abrasion frottant un échantillon de tissu PVC pour mesurer la résistance à l'usure
  - title: Tests de performance à basse température
    description: Les produits sont testés dans des environnements froids pour évaluer leur fonctionnalité et leur durabilité dans diverses conditions de température, évitant la rigidité ou les fissures dans les eaux plus froides. Essentiel pour les bateaux destinés à un usage hivernal ou à haute latitude.
    image: https://assets.afarer.com/images/afarer/factory/afarer-factory-exterior.webp
    alt: Produit gonflable à l'intérieur d'une chambre froide pour un test de performance à basse température
  - title: Tests de flottabilité et de capacité de charge
    description: Les produits sont testés avec différentes masses pour déterminer leur capacité de charge maximale et garantir qu'ils supportent en toute sécurité les utilisateurs et le matériel. La capacité nominale de chaque modèle est vérifiée avant sa mise sur le marché.
    image: https://assets.afarer.com/images/afarer/factory/afarer-stock-boat-inventory.webp
    alt: Test de flottabilité et de capacité de charge avec des charges sur une embarcation gonflable
  - title: Tests de manœuvrabilité
    description: Les produits sont testés pour leur réactivité aux commandes de pagaie ou de moteur, en évaluant le rayon de virage et la facilité de maniement. Les essais sur l'eau valident que le comportement réel correspond aux spécifications de conception.
    image: https://assets.afarer.com/images/afarer/factory/afarer-sup-manufacturing.webp
    alt: Test de manœuvrabilité sur l'eau de coques de SUP gonflable et de bateau
  - title: Tests d'étanchéité à l'eau
    description: Les produits entièrement assemblés sont immergés ou soumis à un jet d'eau pour vérifier toute fuite à travers les coutures, les valves ou les matériaux. Chaque bateau passe un contrôle obligatoire d'étanchéité à l'eau avant expédition.
    image: https://assets.afarer.com/images/afarer/factory/afarer-production-department-2.webp
    alt: Test d'étanchéité par immersion vérifiant les coutures et les valves contre les fuites
qc_flow:
  tagline: Le flux d'inspection en 7 étapes
  title: 'Sept points de contrôle qualité, de bout en bout'
  subtitle: 'Chaque point ci-dessous est défini dans le Plan d''Inspection Qualité du projet avec son objet d''inspection, sa méthode, ses critères d''acceptation et le dossier produit. Les dossiers de rapports bilingues sont de véritables enregistrements contrôlés — ouvrez-les pour voir la structure réelle.'
  obj_label: Objet d'inspection
  method_label: Méthode d'inspection
  criteria_label: Critères d'acceptation
  record_label: Dossier produit
  stages:
    - stage: STADE 01
      title: 'Planification qualité du projet (PPM)'
      summary: 'La réunion de pré-production verrouille le périmètre, les références et le plan d''inspection avant le démarrage de la chaîne.'
      checks:
        - 'Le nom du produit, le code interne, le SKU client, le numéro de commande et la définition du lot sont enregistrés.'
        - 'Le type de planche, le noyau drop-stitch, les matériaux, les bandes de rail, l''EVA, les valves et le système d''ailerons sont spécifiés.'
        - 'Le nom du fichier de graphismes, la version, les couleurs, la position du logo et la zone d''impression sont verrouillés et approuvés.'
        - 'La BOM — chaque article par ensemble avec quantité, couleur, numéro de pièce et règles de substitution — est approuvée par le client.'
        - 'L''emballage, l''étiquetage, les codes-barres, la langue des manuels et les dispositions d''inspection tierce partie sont fixés par écrit.'
      object: 'Périmètre du projet par rapport aux exigences client — matériaux, dimensions, graphismes, emballage, marché cible et normes applicables.'
      method: 'Réunion de pré-production avec les ventes, l''ingénierie et le contrôle qualité ; validation de l''échantillon maître ; Plan d''Inspection Qualité (QIP) émis pour la commande.'
      criteria: 'Les cinq références approuvées et figées avant le démarrage de la production en série. Tout point non résolu bloque l''autorisation de production.'
      record: 'Compte-rendu QIP + PPM, enregistrements d''échantillons approuvés.'
      image: https://assets.supsfactory.com/site/quality/node01-ppm.avif
      alt: Réunion de pré-production examinant l'échantillon maître et le plan d'inspection qualité pour une commande SUP OEM
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Télécharger QIP (PDF)'
    - stage: STADE 02
      title: 'Inspection des matières entrantes (IQC)'
      summary: 'Les matières premières sont vérifiées par rapport à la spécification fournisseur approuvée avant d''entrer en production.'
      checks:
        - 'Le tissu drop-stitch, les rouleaux de PVC, le matériau de rail et les tapis de pont EVA sont contrôlés par rapport à l''échantillon approuvé — couleur, épaisseur, poids et défauts de surface.'
        - 'Les valves, les boîtiers d''ailerons, les anneaux en D, les poignées et la quincaillerie sont contrôlés pour le type, la taille, la finition, la rouille et le bon fonctionnement.'
        - 'Les pompes, les pagaies, les leashes, les sacs et les kits de réparation sont vérifiés pour le modèle, la couleur et la configuration du projet.'
        - 'Les certificats fournisseurs (COA), les déclarations de matériaux et les documents de conformité REACH/RoHS sont examinés par lot.'
        - 'Les lots non conformes sont mis en quarantaine et renvoyés avant qu''aucun matériau n''atteigne la chaîne.'
      object: 'Tissu drop-stitch, rouleaux de PVC, valves, ailerons, accessoires et matériaux d''emballage par rapport à la spécification approuvée et aux certificats de test fournisseurs.'
      method: 'Contrôles visuels, dimensionnels et de poids ; échantillonnage par lot selon AQL ; certificats de matériaux examinés ; liste de fournisseurs approuvés appliquée.'
      criteria: 'Respecte la spécification et les certificats approuvés. Les lots non conformes sont mis en quarantaine et rejetés avant leur libération sur la chaîne.'
      record: 'Rapports de test IQC avec références de lots et décisions.'
      image: https://assets.supsfactory.com/site/quality/node02-iqc.avif
      alt: Inspection des matières entrantes du tissu PVC et des composants SUP à l'usine
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports IQC (PDF)'
    - stage: STADE 03
      title: 'Contrôle en cours de fabrication et premier article (IPQC / FAI)'
      summary: 'Les méthodes de construction et les points de contrôle sont sélectionnés en fonction de la plateforme de planche approuvée et de la configuration du projet. Le premier article est contrôlé par rapport aux références verrouillées ; chaque équipe effectue des contrôles de ronde sur la chaîne.'
      checks:
        - 'Le premier article est vérifié par rapport à l''échantillon approuvé, au plan technique, à la BOM, aux graphismes et aux fichiers d''emballage avant le démarrage de la production en série.'
        - 'Les dimensions, le contour et la symétrie de la planche sont mesurés ; la direction de l''encre et du logo, la position, les couleurs et la révision sont confirmées.'
        - 'Les coutures et la continuité du rail sont contrôlées pour détecter les espaces, la délamination, les plis, la contamination ou le désalignement sur la chaîne.'
        - 'L''installation de la valve, des anneaux en D, des poignées et du boîtier d''aileron est vérifiée pour la position, la quantité et l''ajustement par rapport à la BOM approuvée par le client.'
        - 'L''approbation du FAI verrouille en version les graphismes, les dimensions et la BOM ; les écarts sont orientés vers le processus de décision de reprise — jamais de réparation en ligne.'
      object: 'Premier article et assemblages en cours de fabrication — coutures, rails, boîtier d''aileron, base de valve, position des graphismes, couple de serrage de la quincaillerie.'
      method: 'Inspection du premier article sur la première unité ; contrôles de ronde par quart ; résistance du soudage et alignement des coutures vérifiés en ligne.'
      criteria: 'L''approbation du FAI verrouille en version les graphismes, les dimensions et la BOM. Les écarts sont orientés vers le processus de décision de reprise — jamais de réparation en ligne.'
      record: 'Enregistrement FAI, journaux de ronde par quart, notes de reprise et de décision.'
      image: https://assets.supsfactory.com/site/quality/node03-ipqc-fai.avif
      alt: Inspection en cours de fabrication et contrôle du premier article pendant la production de SUP
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports IPQC (PDF)'
    - stage: STADE 04
      title: 'Tests de gonflage et d''étanchéité à l''air'
      summary: 'Chaque planche terminée subit une vérification de gonflage et d''étanchéité à l''air avant l''emballage — 100 % des unités, et non un échantillon.'
      checks:
        - 'La surface de la planche, les rails et la zone des valves sont contrôlés pour détecter les micro-trous, fissures, plis anormaux ou délamination avant le gonflage.'
        - 'Les chambres sont gonflées avec un manomètre numérique calibré à la pression de test du projet et la lecture initiale est verrouillée.'
        - 'Le noyau de valve, la base de valve et les coutures des rails sont contrôlés sur toute la circonférence — nez, queue et zones courbes.'
        - 'Maintien de pression de 24 heures avec enregistrement continu ; rejet automatique au-delà de la chute de pression autorisée.'
        - 'Les planches défaillantes sont mises en quarantaine, reprises sous instruction et entièrement re-testées — pas seulement re-contrôlées au point de réparation.'
      object: '100 % des chambres gonflées — détection de fuite sur toute la couture, intégrité des valves et rétention de la chute de pression.'
      method: 'Détection de fuite sur toute la couture suivie d''un maintien de pression de 24 heures à 18,0 PSI ; rejet automatique au-delà d''une chute de 0,50 PSI.'
      criteria: 'Zéro point de fuite et chute de pression dans la limite de 0,50 PSI par chambre ; les unités défaillantes sont mises en quarantaine et reprises ou mises au rebut.'
      record: 'Rapports de test d''étanchéité à l''air, un par chambre, liés au lot.'
      image: https://assets.supsfactory.com/site/quality/node04-airtightness.avif
      alt: Test de gonflage et d'étanchéité à l'air d'une chambre de SUP gonflable
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports d''étanchéité à l''air (PDF)'
    - stage: STADE 05
      title: 'Inspection finale du produit (FQC)'
      summary: 'Les planches finies sont mesurées et notées esthétiquement par rapport à l''échantillon maître approuvé.'
      checks:
        - 'Les dimensions clés — longueur, largeur et épaisseur — sont mesurées à la pression de service par rapport aux tolérances de dessin.'
        - 'Le contour, le rocker et la symétrie de la planche sont vérifiés ; aucune distorsion, torsion ou gauchissement anormal après le gonflage.'
        - 'L''esthétique est notée sous lampes à lumière du jour D65 : rayures, taches, traces de colle, bulles, plis, écart de couleur.'
        - 'Contrôles fonctionnels : ouverture/fermeture de la valve et ajustement du bouchon, insertion et verrouillage de l''aileron, anneaux en D, poignées et fonction de la pagaie.'
        - 'La configuration est vérifiée par rapport à la BOM et au SKU approuvés par le client — accessoires, étiquettes, codes-barres et numéros de série.'
      object: 'Planche finie par rapport à l''échantillon maître — dimensions, rocker, profil, esthétique, montage du boîtier d''aileron et complétude des accessoires.'
      method: 'Vérification dimensionnelle par rapport aux tolérances de dessin ; esthétique notée sous lampes D65 ; tests d''ajustement du boîtier d''aileron et de la quincaillerie.'
      criteria: 'Dimensions dans les tolérances (par ex. 3508 × 814 × 150,3 mm), qualité esthétique conforme à l''échantillon approuvé, tous les accessoires présents.'
      record: 'Rapports FQC avec signature de l''inspecteur et décision.'
      image: https://assets.supsfactory.com/site/quality/node05-fqc.avif
      alt: Inspection finale du produit des planches SUP finies avant emballage
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports FQC (PDF)'
    - stage: STADE 06
      title: 'Emballage et inspection avant expédition (PSI)'
      summary: 'Le kit emballé est contrôlé pour la complétude, la précision des marquages et l''aptitude à l''expédition.'
      checks:
        - 'Complétude du kit à 100 % par rapport à la BOM : planche, pagaie, pompe, leash, sac, kit de réparation et manuel — un ensemble à la fois.'
        - 'Les pièces fragiles sont protégées (sacs des pompes et des lames), la planche pliée selon la procédure d''emballage SOP, les accessoires correspondent au modèle et à la couleur.'
        - 'Les graphismes du carton, la marque, les avertissements et les versions de langue sont vérifiés par rapport à la révision de graphismes approuvée.'
        - 'Le type, le numéro, la position et la lisibilité du code-barres sont vérifiés ; les marques d''expédition, le SKU, le bon de commande, le numéro de carton et la quantité sont corrects.'
        - 'La taille du carton, le poids brut/net et l''emballage intérieur correspondent à la spécification d''emballage ; le résultat du test de chute est enregistré lorsque requis.'
      object: 'Kit emballé — planche, pagaie, pompe, leash, sac, manuel — par rapport à la BOM approuvée par le client et à la spécification d''emballage.'
      method: 'Complétude du kit à 100 % par rapport à la BOM ; scan de code-barres (note ≥ B) ; précision des marquages des cartons ; test de chute ISTA-1A sur les cartons emballés.'
      criteria: 'Correspondance du kit à 100 % avec la BOM, codes-barres lisibles, marquages corrects et emballage résistant à la chute avant chargement.'
      record: 'Listes de contrôle PSI et enregistrements d''emballage par carton.'
      image: https://assets.supsfactory.com/site/quality/node06-psi.avif
      alt: Inspection avant expédition vérifiant le kit SUP emballé par rapport à la BOM
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports PSI (PDF)'
    - stage: STADE 07
      title: 'Autorisation d''expédition et traçabilité'
      summary: 'La qualité ne valide le lot que lorsque les six points précédents sont clôturés et que chaque enregistrement est complet.'
      checks:
        - 'Le lot de production, le numéro de commande, le SKU, la quantité et le nombre de cartons correspondent à la liste de colisage et à la facture commerciale.'
        - 'La spécification, la BOM, les graphismes et les fichiers d''emballage sont tous à la révision approuvée en vigueur.'
        - 'Les enregistrements IQC, FAI, en cours de fabrication, d''étanchéité à l''air, FQC et PSI sont complets pour le lot à libérer.'
        - 'Toutes les non-conformités sont résolues, reprises, re-inspectées et clôturées — aucun point ouvert sur la libération.'
        - 'Champs de traçabilité enregistrés par lot : code projet, bon de commande, SKU, révisions graphismes/BOM/emballage, date de production, inspecteur et numéros d''enregistrement.'
      object: 'Autorisation de libération du lot — toutes les portes clôturées, enregistrements complets, numéros de série reliés au lot.'
      method: 'Revue des portes des six enregistrements précédents par la qualité ; dossier de traçabilité du lot assemblé ; enregistrements remis avec l''expédition.'
      criteria: 'Toutes les portes approuvées par la QA ; les dossiers de lot et de traçabilité sont remis à l''acheteur ou conservés sous NDA sur demande.'
      record: 'Autorisation d''expédition et dossier de traçabilité du lot.'
      image: https://assets.supsfactory.com/site/quality/node07-shipment-release.avif
      alt: Signature d'autorisation d'expédition et remise de l'enregistrement de traçabilité du lot
      link: https://assets.supsfactory.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Télécharger les rapports de libération (PDF)'
system_map:
  tagline: Le système qualité
  title: 'Un système, quatre normes contrôlées'
  subtitle: 'Les sept portes ci-dessus reposent sur quatre normes documentées, chacune publiée comme procédure contrôlée que vous pouvez télécharger et auditer. Ensemble, elles forment le SMA (QMS) derrière chaque commande OEM/ODM — critères d''inspection, contrôle des modifications, non-conformité et essais de laboratoire.'
  items:
    - title: 'Normes d''inspection et de libération'
      description: 'Le QIP du projet pilote chaque porte : objet d''inspection, méthode, critères d''acceptation et dossier produit par commande. Inclut le cadre de contrôle qualité en 4 étapes, la chaîne de traçabilité, le flux de quarantaine, la matrice des défauts et le registre documentaire 00–15.'
      icon: tabler:clipboard-check
      link: /fr/factory/quality-inspection
      link_label: 'Normes d''inspection et téléchargements QMS'
    - title: 'Contrôle des modifications de reprise'
      description: 'Aucun changement de paramètre de reprise sans contrôle documenté : confinement, classification des risques, boucle de modification en 9 étapes, matrice d''approbation et validation. Toute modification des spécifications approuvées, des échantillons, des BOM ou des critères d''acceptation exige une approbation écrite du client.'
      icon: tabler:git-branch
      link: /fr/factory/quality-change-control
      link_label: 'Norme de contrôle des modifications'
    - title: 'Contrôle des produits non conformes'
      description: 'Une boucle fermée en 7 étapes selon la clause 8.7 de l''ISO 9001:2015 : identifier, mettre en quarantaine, décider selon NCR, reprendre ou rejeter, re-inspecter, libérer, corriger. Inclut l''autorité selon la gravité, la matrice de décision des défauts SUP et la destruction attestée.'
      icon: tabler:alert-triangle
      link: /fr/factory/non-conforming-control
      link_label: 'Norme de contrôle des produits non conformes'
    - title: 'Essais et équipements de laboratoire'
      description: 'Le laboratoire qualité fonctionne indépendamment de la production : essais de traction, décroissance de pression, vieillissement UV, pelage de soudure, détection de fuite et chambres de température — avec les procédures d''étalonnage et d''essai derrière nos allégations publiées.'
      icon: tabler:flask
      link: /fr/factory/quality-lab
      link_label: 'Laboratoire qualité et équipements d''essai'
    - title: 'Laboratoire d''essais de matériaux (R&D)'
      description: 'Le centre de R&D réalise des essais de matériaux indépendants pour les formulations PVC/Hypalon, le vieillissement accéléré et le support de certification, alimentant les normes utilisées en production.'
      icon: tabler:microscope
      link: /fr/randdcenter/quality-inspection-lab
      link_label: 'Laboratoire d''essais de matériaux R&D'
intelligence_cards:
  tagline: Documentation et traçabilité
  title: 'Enregistrements qualité qui soutiennent la traçabilité des projets'
