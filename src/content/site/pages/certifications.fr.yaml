content_certifications:
  tagline: Certifications et normes
  title: 'Qualité certifiée, reconnue mondialement'
  subtitle: 'Les certifications ne valent que par ce qu''elles couvrent. Voici le périmètre de certification, le titulaire du certificat et la manière de vérifier ou de demander les documents pour votre projet.'
  items:
    - title: 'Marquage CE'
      description: 'Les modèles standard de SUP et de bateaux portent le marquage CE conformément à la directive 2013/53/UE sur les embarcations de plaisance. Les modèles personnalisés sont certifiés CE via notre processus établi pour votre configuration. Numéros de certificat et rapports d''essai disponibles sur demande.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Système de management de la qualité certifié ISO 9001:2015, couvrant la conception, la fabrication et la distribution d''embarcations gonflables et d''équipements nautiques. Périmètre de certification et rapport d''audit disponibles sur demande.'
      icon: tabler:clipboard-check
    - title: 'Conformité sociale BSCI'
      description: 'Auditée selon BSCI (Business Social Compliance Initiative), couvrant les conditions de travail et la conformité de l''usine. Rapport d''audit disponible sur demande.'
      icon: tabler:heart-handshake
    - title: 'Conformité des matériaux REACH'
      description: 'Les matériaux respectent le règlement REACH de l''UE en matière de sécurité chimique. Les déclarations de matériaux sont fournies avec la documentation de production pour chaque expédition.'
      icon: tabler:flask
    - title: 'Conformité RoHS'
      description: 'Conformité aux substances dangereuses restreintes documentée selon RoHS pour les composants et matériaux applicables.'
      icon: tabler:flame
    - title: 'Essais de matériaux'
      description: 'Les tissus sont testés pour la résistance à la traction, la résistance à la déchirure, la dégradation UV et la performance au froid. Chaque lot de production est échantillonné et vérifié selon le protocole d''essai publié.'
      icon: tabler:test-pipe
faqs:
  tagline: FAQ
  title: Questions fréquentes sur notre système qualité
  items:
    - q: 'Puis-je télécharger les rapports d''''inspection réels ?'
      a: 'Oui. Les sept dossiers de rapports bilingues de cette page — QIP, IQC, IPQC/FAI, étanchéité à l''air, FQC, PSI et autorisation d''expédition — sont de véritables enregistrements contrôlés avec les champs confidentiels supprimés. Ils montrent la structure exacte, les méthodes et les critères d''acceptation utilisés sur chaque commande.'
    - q: 'Comment les sept portes correspondent-elles à mon projet ?'
      a: 'Chaque projet reçoit un Plan d''Inspection Qualité (QIP) qui définit les portes applicables à votre produit et à votre marché, le périmètre d''inspection à chaque porte et les enregistrements que vous recevrez. Téléchargez l''échantillon QIP sur cette page pour voir la structure.'
    - q: 'Ces échantillons d''''enregistrements d''''inspection sont-ils réels ?'
      a: 'Oui. Les échantillons suivent notre structure d''enregistrement contrôlé réelle — en-tête de document, liste de contrôle d''inspection, critères d''acceptation, méthode, résultats, rôle de l''inspecteur et décision de libération. Toutes les valeurs d''identification sont remplacées par des valeurs de démonstration (codes DEMO-*), de sorte qu''aucune donnée client, graphismes, commande ou tarification n''est exposée.'
    - q: 'Pourquoi les échantillons sont-ils anonymisés ?'
      a: 'La confidentialité des acheteurs passe en premier. Les noms de clients, les graphismes, les détails de commande, les informations fournisseurs et la tarification sont protégés par conception. L''anonymisation permet à tout acheteur potentiel de vérifier notre structure d''enregistrement et notre traçabilité sans exposer l''activité d''un autre client.'
    - q: 'Pouvons-nous recevoir les rapports d''''inspection complets pour notre projet ?'
      a: 'Oui. Pour les projets approuvés, nous partageons la documentation qualité applicable à votre commande — plan d''inspection qualité, rapports d''inspection entrante, en cours de fabrication, d''étanchéité à l''air, finale et d''emballage, et autorisation d''expédition — reliés à votre traçabilité de lot. Les données commerciales sensibles restent sous NDA comme convenu.'
    - q: 'Que contient un enregistrement d''''inspection au niveau du lot ?'
      a: 'Chaque enregistrement relie le lot de production à la spécification ou révision de dessin applicable, enregistre chaque élément d''inspection par rapport à ses critères d''acceptation avec la méthode et l''outil utilisés, et se clôt par le rôle de l''inspecteur, le statut du résultat et la décision de libération signée par la qualité.'
evidence_review:
  tagline: 'Preuves et vérification'
  title: 'SPÉCIFICATIONS VÉRIFIÉES'
  body: 'Toutes les allégations de fabrication de cette page sont vérifiées par notre équipe d''ingénierie de fabrication à l''usine de Laixi, Qingdao. Les certificats, les enregistrements d''inspection QC, les rapports de test de pression et de structure, et les enregistrements de traçabilité des lots sont disponibles sur demande. Spécifications dernièrement vérifiées en 2026-08.'

