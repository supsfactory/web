trial_faqs:
  tagline: FAQ
  title: 'Questions fréquentes sur le lancement avec une commande d''essai'
  items:
    - q: 'Puis-je vraiment lancer une marque de SUP sans commande en conteneur ?'
      a: 'Oui. Le point d''entrée est étagé : 1–2 échantillons valident la planche (prêts en 7–12 jours), une commande d''essai de 20–50 planches valide le marché (production en 25–35 jours), et les séries de volume de 90–100+ planches suivent uniquement quand l''écoulement prouve le format. Le co-marquage en petits lots commence dès 5–10 unités quand vous voulez des planches marquées sans aucune étape de développement.'
    - q: 'Combien de temps prend un lancement complet, de bout en bout ?'
      a: 'En utilisant les plateformes de coque existantes, un premier lancement typique s''exécute en 8–12 semaines du brief produit à la commande d''essai livrée : échantillons en 7–12 jours, production d''essai en 25–35 jours après bon de commande confirmé et acompte. Une coque sur mesure ajoute 15–20 jours de développement de moule.'
    - q: 'Que comprend le prix — et que ne comprend-il pas ?'
      a: 'Les fourchettes de référence sont EXW Qingdao pour les planches elles-mêmes, y compris l''application de la marque et le QC standard. Elles sont indicatives : le devis final est confirmé contre votre configuration — coque, PVC, couverture des graphismes, emballage et accessoires — avant tout engagement. Le fret, les droits et le dédouanement à destination sont devisés séparément.'
    - q: 'Dois-je acheter 100 ou 500 planches pour avoir mon logo sur les planches ?'
      a: 'Non. Le co-marquage en petits lots met votre logo sur le nez ou les rails latéraux dès 5–10 unités, et les commandes d''essai de 20–50 planches soutiennent l''application complète des graphismes à la même qualité que la production en volume. Ce qui change avec la quantité, c''est le prix unitaire, pas la disponibilité.'
    - q: 'Que se passe-t-il si je veux modifier le design après l''essai ?'
      a: 'Les modifications entre l''essai et le volume sont normales et bienvenues — c''est tout l''intérêt de l''essai. Les coloris, graphismes, emballage et accessoires sont re-devisés contre la nouvelle configuration, puis figés avec la signature des graphismes et de la BOM avant la série de volume. Les frais de moule pour la sérigraphie sont levés sur les ré-commandes utilisant la même dimension de graphisme.'
    - q: 'Signez-vous une NDA avant que je partage mes designs ?'
      a: 'Oui. Un accord de non-divulgation est disponible avant que vous partagiez des spécifications techniques ou des graphismes propriétaires. Nous fabriquons exclusivement sous les marques de nos clients et ne concurrençons jamais sur aucun marché — la même politique s''applique à un échantillon d''1 planche qu''à un programme conteneur.'

