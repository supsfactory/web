answer:
  label: 'Réponse directe'
  text: 'Oui — vous pouvez lancer une marque de SUP gonflable avec une commande d''essai à faible MOQ. Le point d''entrée est étagé plutôt que tout-ou-rien : commandez d''abord 1–2 échantillons (prêts en 7–12 jours) pour figer votre coque, vos graphismes et votre emballage ; puis placez une commande d''essai de 20–50 planches (production en 25–35 jours) pour tester l''écoulement réel ; enfin passez à l''échelle en séries de volume standard de 90–100+ planches par rouleau de tissu drop-stitch de 150 m une fois le format prouvé. Le co-marquage en petits lots commence dès 5–10 unités pour les opérateurs qui veulent des planches marquées sans aucune étape de développement. Votre premier conteneur n''arrive que lorsque les données le justifient.'
  verified: '2026-08'

trial_included:
  tagline: Ce que couvre la commande d'essai
  title: 'Tout ce qu''un lancement nécessite, sans les frais généraux'
  subtitle: 'Une commande d''essai n''est pas une facture réduite — c''est le même processus d''usine, dimensionné pour une marque en lancement. Voici ce que chaque programme d''essai inclut.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Plateforme et construction de planche'
      desc: 'Coques de randonnée et polyvalentes éprouvées sur le terrain avec construction drop-stitch, fusion de bande de rail triple couche et rigidité de 12–15 PSI — les mêmes plateformes utilisées par nos clients de volume, en tailles standard de 10 ft à 11 ft 6 po.'
    - icon: L
      icon_bg: green
      title: 'Votre marque, réellement appliquée'
      desc: 'Graphismes numériques pleine surface ou sérigraphiés, tapis de traction EVA avec votre logo et marque secondaire sur le nez ou les rails latéraux. Le co-marquage en petits lots utilise le marquage central SUPsfactory avec votre logo sur le nez ou les rails.'
    - icon: P
      icon_bg: purple
      title: 'Options d''emballage évolutives'
      desc: 'Commencez avec des cartons génériques et des étiquettes de code-barres, passez aux boîtes retail marquées 5 couches pleine couleur pour les séries ultérieures. L''emballage personnalisé a un minimum de presse indépendant ; les boîtes excédentaires sont stockées et libérées selon le calendrier.'
    - icon: Q
      icon_bg: orange
      title: 'Contrôle qualité au niveau usine'
      desc: 'Chaque planche passe la même liste de contrôle d''assemblage de 100 points et le même test de pression et d''étanchéité à l''air de 24 heures (maintien à 18,0 PSI, rejet automatique au-delà d''une chute de 0,50 PSI) que s''applique à toute commande, échantillon ou conteneur.'
    - icon: D
      icon_bg: blue
      title: 'Export et documentation'
      desc: 'Documentation de conformité CE, ISO 9001, BSCI, REACH et RoHS, conditionnement adapté à l''export et coordination du fret océanique vers 50+ pays — d''un échantillon d''1 planche aux programmes complets.'
    - icon: T
      icon_bg: green
      title: 'Un calendrier sur lequel planifier'
      desc: 'Échantillons en 7–12 jours, production d''essai en 25–35 jours après bon de commande confirmé et acompte, et créneaux de production confirmés pour les commandes de pré-saison — pour qu''un lancement arrive en saison, pas après.'

trial_steps:
  tagline: Feuille de route de lancement
  title: 'De l''idée au premier écoulement en six portes'
  subtitle: 'Le premier lancement typique s''exécute en 8–12 semaines du brief à la commande d''essai livrée en utilisant les plateformes existantes — plus long quand une coque sur mesure ajoute le développement du moule. Chaque porte a une date convenue à l''avance.'
  steps:
    - step: 'Porte 1'
      title: 'Brief produit et revue d''ingénierie (Jours 0–2)'
      desc: 'Vous partagez le modèle de planche cible, la quantité de commande, les graphismes et l''intention d''emballage. La revue d''ingénierie est complétée sous un jour ouvré, avec NDA disponible avant de partager des spécifications propriétaires.'
    - step: 'Porte 2'
      title: 'Spécification, MOQ et devis (Jours 3–7)'
      desc: 'Devis détaillé avec le calcul exact du MOQ, les frais d''échantillon et les segments de délai. Les frais d''échantillon sont crédités sur votre commande de production à la signature du contrat.'
    - step: 'Porte 3'
      title: 'Échantillons en 7–12 jours'
      desc: '1–2 planches physiques valident la rigidité de la coque, la texture du tapis de traction EVA, la précision des graphismes et le montage des accessoires. Vous montez sur la planche avant de vous engager dans autre chose.'
    - step: 'Porte 4'
      title: 'Commande d''essai de 20–50 planches (25–35 jours)'
      desc: 'Production sur les plateformes de coque existantes avec des matériaux en stock et un emballage simplifié — le test commercial minimum qui reflète les conditions réelles de stock.'
    - step: 'Porte 5'
      title: 'Fenêtre d''écoulement et de retour'
      desc: 'La porte importante se trouve sur votre marché, pas dans notre usine : les loueurs et clients confirment le format, les graphismes et le prix de la planche avant que vous passiez à l''échelle.'
    - step: 'Porte 6'
      title: 'Passage à l''échelle en séries de volume (90–100+ planches)'
      desc: 'Une fois le format prouvé, les séries standard sur rouleau de 150 m offrent une efficacité de production complète, un emballage marqué et une tarification de volume. Un programme conteneur est l''objectif, pas l''exigence.'

