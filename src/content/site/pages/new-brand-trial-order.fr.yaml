hero:
  tagline: 'Pour les marques de SUP nouvelles et en croissance'
  title: 'Lancez votre marque de SUP avec une commande d''essai à faible MOQ'
  subtitle: 'Vous n''avez pas besoin d''un conteneur pour lancer une marque de SUP. Validez votre planche, vos graphismes et votre marché avec un seul échantillon, puis testez l''écoulement avec une commande d''essai de 20–50 planches — avant de jamais vous engager dans des volumes de production complets. La marque, le contrôle qualité et la logistique d''export sont gérés par Qingdao Vatrad Group Co., Ltd.'
