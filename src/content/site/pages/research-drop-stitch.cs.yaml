answer:
  label: 'Přímá odpověď'
  text: 'Drop stitch je tkanina, v níž sloupce z polyesterových nití drží horní a dolní vrstvu PVC ve stálé vzdálenosti, takže tlak vzduchu udělá desku tuhou. Jádra Vatrad: 1 680 DTEX, 2 nitě na čtvereční palec, vnější laminát PVC 1,2 mm, dimenzováno na 15 PSI, potvrzeno 24hodinovou zkouškou udržení tlaku při 18,0 PSI.'
