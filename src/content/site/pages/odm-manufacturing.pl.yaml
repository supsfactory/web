answer:
  label: 'Wprost'
  text: 'iSupfactory to producent SUP ODM w Qingdao w Chinach. Rozwój ODM startuje od Twojego briefu, a nie od Twoich rysunków: projekt kadłuba (długość, szerokość, rocker, objętość), konstrukcja materiałowa i grafika są opracowywane u nas, walidowane próbkami prototypowymi w 7–12 dni i realizowane przy standardowym MOQ wolumenowym 90–100 szt. na partię z rolki 150 m (pilotażowo od 20–50 szt.). Produkcja trwa 25–35 dni po potwierdzeniu zamówienia i zaliczki; narzędzia formy na zamówienie dodają 15–20 dni. Dokumentacja CE, ISO 9001, BSCI, REACH i RoHS dołącza do każdego zamówienia.'
  verified: 'Wrzesień 2026'

features:
  title: Możliwości ODM
  subtitle: 'Wszystko, co dostajesz, gdy praca projektowa odbywa się w fabryce, a nie przy Twoim biurku.'
  items:
    - title: Projekt kadłuba
      description: 'Długość, szerokość, grubość, rocker i objętość projektujemy pod docelowych pływaków, zastosowania i rynki — od zera lub z naszej sprawdzonej biblioteki platform.'
      icon: 'tabler:waves'
    - title: Inżynieria konstrukcyjna
      description: 'Gęstość drop-stitch, liczba warstw i gatunek PCV, rozmieszczenie wzmocnień oraz konstrukcja krawędzi specyfikujemy i walidujemy dla Twojego projektu.'
      icon: 'tabler:building-factory'
    - title: Grafika i branding
      description: 'Grafikę pokładu, branding rur, nakładki EVA i opakowanie detaliczne opracowuje nasz wewnętrzny zespół projektowy wokół Twojej marki.'
      icon: 'tabler:palette'
    - title: Opracowanie formy
      description: 'Nowe kształty kadłubów zaczynają się od narzędzi formy zaprojektowanych i wyciętych u nas — wykonanie narzędzi dodaje 15–20 dni do harmonogramu projektu.'
      icon: 'tabler:shapes'
    - title: Walidacja prototypu
      description: 'Budujemy fizyczny prototyp, badamy go i wysyłamy do Twojego przeglądu wraz z testami na wózku — zwykle w 7–12 dni.'
      icon: 'tabler:tools'
    - title: Badania i zgodność
      description: 'Badania retencji powietrza, utrzymania ciśnienia i wytrzymałości szwów dla każdej sztuki, wraz z dokumentacją ISO 9001, BSCI, REACH, RoHS i CE właściwą dla rynku docelowego (zakres potwierdzany dla każdego projektu).'
      icon: 'tabler:certificate'
    - title: Warianty własności narzędzi
      description: 'Klauzule własności lub wykupu formy wpisujemy do umowy — Twój projekt zostaje Twój, a narzędzia przechowujemy na potrzeby zamówień powtarzalnych.'
      icon: 'tabler:lock'
    - title: Od prototypu do kontenera
      description: 'Zatwierdzony projekt ODM przechodzi wprost do standardowej produkcji seryjnej: 90–100+ szt. na partię z rolki 150 m, 25–35 dni po potwierdzeniu zamówienia.'
      icon: 'tabler:package'

customization:
  tagline: Projektujemy razem z Tobą
  title: Co opracowujemy wokół Twojego briefu
  subtitle: 'ODM oznacza, że produkt projektujemy dla Ciebie od zera lub z naszej biblioteki platform — to są dźwignie, które kontroluje Twój brief:'
  items:
    - 'Profil pływaka i rynek — początkujący, touring, wyścigi, joga, wędkarstwo lub pozycjonowanie wielofunkcyjne'
    - 'Wymiary deski — długość, szerokość, grubość i objętość dopasowane do docelowego pływaka i zastosowania'
    - 'Charakter kadłuba — rocker, profil krawędzi oraz kształt nosa i ogona dostrojone do stabilności albo prędkości'
    - 'Konstrukcja materiałowa — gęstość drop-stitch, liczba warstw i gatunek PCV, wzmocnienia i wstawki krawędziowe'
    - 'Grafika i kolory — kolory marki, grafika pokładu i branding rur opracowane u nas'
    - 'Nakładka antypoślizgowa EVA — układ, kolory i integracja logotypu na pokładzie'
    - 'Pakiet akcesoriów — wiosła, pompy, płetwy, smycze i worki dopasowane do deski'
    - 'Opakowanie i prezentacja detaliczna — pudełka detaliczne, ekspozytory i opakowanie eksportowe pod Twoją marką'

faq_section:
  tagline: FAQ
  title: Pytania o rozwój ODM
  questions:
    - q: Czym ODM różni się od OEM?
      a: 'ODM (Original Design Manufacturing) startuje od Twojego briefu — nasi inżynierzy opracowują konstrukcję deski, wykonanie, grafikę i opakowanie, czy to z koncepcji rynkowej, celu wydajnościowego, czy adaptacji sprawdzonej platformy. Zatwierdzasz projekt przed produkcją. OEM (Original Equipment Manufacturing) produkuje według Twojej zatwierdzonej specyfikacji — Twoich rysunków, wymiarów, materiałów i opakowania. To Ty dysponujesz projektem i własnością intelektualną. Oba modele przechodzą przez ten sam zakład, system QC i zespół eksportowy; ODM to najszybsza droga do deski z marką, gdy nie masz jeszcze projektu.'
    - q: Mam tylko ogólny pomysł — od czego zaczynamy?
      a: 'Wyślij krótki brief: docelowi pływacy, zastosowania, zgrubny rozmiar, rynki i wolumeny. Nasi inżynierzy wrócą w ciągu jednego dnia roboczego z koncepcją, kierunkiem deski wzorcowej i planem rozwoju — NDA podpisujemy przed jakąkolwiek szczegółową wymianą na Twoje życzenie.'
    - q: Ile trwa opracowanie nowej deski SUP?
      a: 'Próbki prototypowe wysyłamy w 7–12 dni. Nowy kadłub z narzędziami formy na zamówienie dodaje 15–20 dni inżynierii przed próbkami. Produkcja trwa 25–35 dni po zamówieniu i zaliczce.'
    - q: Jakie jest MOQ dla deski ODM?
      a: 'Standardowa produkcja seryjna to 90–100 szt. na partię z rolki drop-stitch 150 m; serie pilotażowe startują od 20–50 szt. na gotowych platformach. Współmarkowanie w małej serii zaczyna się od 5–10 szt. — pełne obliczenia znajdziesz w naszym Przewodniku MOQ i elastycznego brandingu.'
    - q: Kto dysponuje projektem i formą?
      a: 'Twój brief, projekt i narzędzia są chronione NDA, warunkami licencji marki oraz klauzulami własności lub wykupu formy wpisanymi do umowy. Narzędzia przechowujemy dla Twojej marki i można je przenieść.'
    - q: Czy możecie opracować konkretny kształt (touring, wędkarstwo, wyścigi, joga)?
      a: 'Tak. Inżynieria kadłuba obejmuje wszystkie główne kategorie SUP — allround, touring, wyścigi, joga, wędkarstwo i deski wieloosobowe — z możliwością walidacji w basenie hydrodynamicznym dla kształtów wydajnościowych.'
    - q: Jakie certyfikaty będzie miała opracowana deska?
      a: 'ISO 9001:2015 zarządzanie jakością (cały zakład), zgodność społeczna BSCI (audyt zakładu amfori), dokumentacja zgodności CE dla właściwych konfiguracji na rynek UE (dyrektywa o rekreacyjnych jednostkach pływających — zakres potwierdzany dla każdego projektu), REACH (materiały), RoHS (akcesoria elektroniczne) oraz zgodność z ISO 25649 dla właściwych modeli nadmuchiwanych SUP. Dokumenty certyfikacyjne przygotowujemy dla każdego zamówienia pod Twoje rynki eksportu.'

process:
  title: Proces ODM — od briefu do produkcji w skali
  subtitle: 'Sześć kontrolowanych etapów prowadzonych przez ten sam wewnętrzny zespół, który projektuje, wykonuje próbki i skaluje Twoją deskę — wszystko pozostaje udokumentowane.'
  steps:
    - phase: '01'
      title: Brief i koncepcja
      period: 1 dzień roboczy
      items:
        - 'Udostępniasz docelowych pływaków, zastosowania, rozmiary, rynki i wolumeny — albo po prostu pomysł.'
        - 'Nasi inżynierzy zwracają się z kierunkiem koncepcji, wariantami platform i planem rozwoju.'
    - phase: '02'
      title: Projekt kadłuba i konstrukcji
      period: Tydzień 1–2
      items:
        - 'Wymiary deski, charakter kadłuba, gęstość drop-stitch i konstrukcja PCV projektowane we własnym zakładzie.'
        - 'Grafika, układ pokładu EVA i koncepcja opakowania opracowywane wokół Twojej marki.'
    - phase: '03'
      title: Forma i narzędzia
      period: +15–20 dni (nowe kształty)
      items:
        - 'Narzędzia formy na nowe kształty kadłubów projektujemy i wycinamy; istniejące platformy pomijają ten etap.'
        - 'Warunki własności narzędzi ustalamy w umowie przed rozpoczęciem cięcia.'
    - phase: '04'
      title: Prototyp i próbka
      period: 7–12 dni
      items:
        - 'Budujemy fizyczny prototyp, badamy go i wysyłamy do Twojego przeglądu — z testami na wózku.'
        - 'Próbka (1–2 szt.) weryfikuje kształt, konstrukcję i branding przed wolumenem.'
    - phase: '05'
      title: Walidacja i zatwierdzenie
      period: Równolegle
      items:
        - 'Kontrole retencji powietrza, utrzymania ciśnienia, wytrzymałości szwów, obciążenia i UV dla każdej linii produkcyjnej.'
        - 'Dokumentacja CE, ISO 9001, BSCI, REACH i RoHS przygotowana dla Twoich rynków eksportu.'
        - 'Zatwierdzasz prototyp; zamówienie i zaliczka blokują termin produkcyjny.'
    - phase: '06'
      title: Produkcja i dostawa
      period: 25–35 dni
      items:
        - 'Standardowe partie to 90–100+ szt. na rolkę 150 m, serie pilotażowe od 20–50 szt.'
        - 'Opakowanie eksportowe, wysyłka FOB/CIF/DDP do ponad 50 krajów i wsparcie przy zamówieniach powtarzalnych w cenie.'

