answer:
  label: 'Kurze Antwort'
  text: 'Drop-stitch ist ein Stoff, dessen Polyesterfaden-Stege die Ober- und Unterseite aus PVC in einem festen Abstand halten — so macht der Luftdruck das Board steif. Vatrad-Kerne: 1,680 DTEX, 2 Garne pro Quadratzoll, 1.2 mm PVC-Außenlaminat, ausgelegt auf 15 PSI, validiert durch einen 24-Stunden-Haltetest bei 18.0 PSI.'
