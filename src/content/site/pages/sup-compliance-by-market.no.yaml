  title: 'SUP-samsvar per marked — CE-, REACH-, RoHS-, BSCI-, ISO 9001-krav | iSupfactory'
  description: 'Samsvarsguide for oppblåsbare SUP-brett per marked: CE (EU), CPSIA (USA), AS/NZS (AU), ISO 9001, BSCI, REACH og RoHS — omfang og dokumenter per marked.'
  dateModified: '2026-08-21'
  keywords:
    - 'sup samsvar per marked'
    - 'ce sertifisering sup'
    - 'regulering oppblåsbare sup'
