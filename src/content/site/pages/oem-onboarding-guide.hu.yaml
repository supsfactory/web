checklist:
  heading: 'Mire van szüksége a projekt specifikációs lapja előtt'
  body: |
    Minél teljesebb a specifikációs lap, annál gyorsabb és pontosabb az ajánlat. Íme, amit érdemes előkészítenie:

    - **A deszka specifikációi** – A célzott hosszúság, szélesség és vastagság, a sportoló súlytartománya és a rendeltetési felhasználás (touring, all-around, surf, horgászat, yoga stb.). Ha van referencia-mérete vagy egy versenytárs modellje, adja meg ezeket.
    - **A tervezési fájlok** – Vektoros grafika (AI, SVG vagy PDF) a deszka grafikájához, az EVA fedélen lévő logóhoz és minden másodlagos márkázáshoz. Ha a grafika még nem kész, egy moodboard vagy referenciaképek már elegendők a kezdeti megvalósíthatósághoz.
    - **A megrendelés térfogata és a határidő** – A célzott mennyiség az első megrendeléshez és a szezonbeli program, amelyet teljesítenie kell. Még egy hozzávetőleges tartomány („20–50 deszka márciusig”) is elegendő a megvalósíthatóság és a kapacitás elérhetőségének megerősítéséhez.
    - **A megfelelőségi igények** – A célpiacok (EU, Észak-Amerika, Ausztrália stb.) és minden olyan konkrét tanúsítási vagy tesztelési igény, amely túlmutat a standard hatókörünkön (CE, ISO 9001, BSCI, REACH, RoHS).
    - **A költségvetési tartomány** – Egy tájékoztató deszkánkénti költségvetés vagy egy célzott végső költség segít nekünk a megfelelő platform és szerkezeti szint ajánlásában. A pontos árat a mérnöki elemzés után erősítjük meg – soha előtte.

    Ha még nincs minden elem a kezében, küldje el, ami van. A többi részben végigvezetjük.

evidence_review:
  tagline: 'Bizonyítékok és ellenőrzés'
  title: 'ELLENŐRZÖTT SPECIFIKÁCIÓK'
  body: 'Ezen az oldalon szereplő valamennyi gyártási állítást a laixi (Qingdao) gyárunk Gyártómérnöki Csapata ellenőrizte. A tanúsítványok, az ellenőrzési nyilvántartások, a nyomás- és szerkezeti tesztjelentések, valamint a szállítmány-nyomon követési naplók kérésre rendelkezésre állnak. A specifikációkat legutóbb 2026 szeptemberében ellenőriztük.'

faqs:
  tagline: GYIK
  title: 'OEM bevezetés – gyakori kérdések'
  items:
    - q: 'Mennyi ideig tart a teljes bevezetési folyamat?'
      a: 'A minták jóváhagyása általában 2–4 hét (beleértve a 7–12 napos mintagyártást és az Ön értékelési időszakát). Az első gyártási szállítmány 6–8 hét a megerősített megrendeléstől és az előlegtől számítva. Az egyedi víztestforma további 15–20 nap formafejlesztési időt ad. Minden kapuhoz rögzített határidő tartozik, amelyről előre egyeztetünk.'
    - q: 'Alá kell írnom egy NDA-t, mielőtt megosztanám a kivitelemet?'
      a: 'Az NDA kérésre azonnal rendelkezésre áll – még bármilyen műszaki specifikáció vagy bizalmas grafika megosztása előtt. Kizárólag az ügyfelek márkái alatt gyártunk, és egyetlen piacon sem versenyzünk velük. Ugyanez a politika érvényes egyetlen deszkás mintára és egy teljes konténerprogramra egyaránt.'
    - q: 'Mi az első OEM szállítmány minimális megrendelése?'
      a: 'A belépési pont lépcsőzetes: először 1–2 minta (7–12 nap alatt kész), majd 20–50 deszkás próbarendelés vagy pilótaszállítmány (25–35 napos gyártás), majd 90–100+ deszkás standard térfogatszállítmány jóváhagyott konfigurációnként. A kis szállítmányú közös márkázás 5–10 darabtól indul, amikor nincs szükség fejlesztési lépésre. A mintadíjak jóváíródnak a gyártási megrendelésen.'
    - q: 'Hogyan kezelik a szellemi tulajdon védelmét a bevezetés során?'
      a: 'Az Ön kiviteleit és specifikációit az aláírt NDA védi, amelyet bármilyen bizalmas információ megosztása előtt kötünk meg. Valamennyi grafika, az anyaglista adatai és a műszaki fájlok hozzáférés-szabályozott rendszerekben, auditnyomokkal tárolódnak. OEM módban a szellemi tulajdonjogok teljes egészében az Önéi. ODM módban az adaptált platformra vonatkozó jogok a megállapodás szerint közösek. Private Label módban a jogok az iSupfactory-nál maradnak, Ön pedig licencseli a márka alkalmazását.'
    - q: 'Milyen minőségi garanciák érvényesek az első megrendelésre?'
      a: 'Minden deszka – minta, próbaszállítmány vagy térfogat – ugyanazt a 7 lépéses ellenőrzési kapurendszert járja: a beérkező anyagok ellenőrzése, a drop-stitch szövet vizsgálata, hegesztés és összeállítás, 24 órás nyomás- és tömörségi tesztelés (18.0 PSI nyomástartás, automatikus elutasítás 0.50 PSI-nél nagyobb esésnél), az EVA fedelek és tartozékok szerelése, a grafika és a márkázás ellenőrzése, valamint a végső csomagolás és a dokumentáció. A minőség soha nem csökken a kisebb megrendeléseknél sem.'

