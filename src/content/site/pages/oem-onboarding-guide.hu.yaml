answer:
  label: 'Közvetlen válasz'
  text: 'Egy szokásos OEM bevezetés 2–4 hét a minták jóváhagyásához, és 6–8 hét az első gyártási szállítmányhoz a megerősített megrendeléstől számítva. Kezdje egy projekt specifikációs lap elküldésével (deszkaspecifikációk, térfogat, megfelelőségi igények). Egy munkanapon belül válaszolunk, NDA-t kínálunk a bizalmas részletek megosztása előtt, és 7–12 nap alatt legenerálunk 1–2 fizikai mintát az Ön értékelésére és jóváhagyására. A minta rögzítése után következik a gyártás megtervezése és a fabrikálás, minden szakaszban rögzített minőségellenőrzési kapukkal. Minden lépés dokumentált és nyomon követhető.'
  verified: '2026. szeptember'

process_steps:
  tagline: A hét kapu
  title: 'A bevezetési folyamat – hét kapu a specifikációs laptól a kiszállításig'
  subtitle: 'Minden kapunak van egy definiált bemenete, egy definiált eredménye és egy határideje, amelyről előre egyeztetünk. Egyik kaput sem lépjük át explicit jóváhagyás nélkül.'
  steps:
    - step: '1. kapu'
      title: 'Kezdeti megkeresés és NDA (0. nap)'
      desc: 'Küldjön egy projekt specifikációs lapot a /hu/contact útvonalon a célzott deszkaspecifikációkkal, a megrendelés mennyiségével, a megfelelőségi igényekkel és a kívánt határidővel. Az NDA azonnal rendelkezésre áll – még bármilyen műszaki specifikáció vagy bizalmas grafika megosztása előtt. Egy munkanapon belül válaszolunk.'
    - step: '2. kapu'
      title: 'Megvalósíthatósági elemzés és ajánlat (1–5. nap)'
      desc: 'A mérnökség az Ön specifikációs lapját a gyártási kapacitás, az alapanyagok elérhetősége és a megfelelőségi hatókör szempontjából elemzi. Részletes, tételenkénti ajánlatot kap MOQ-számítással, mintadíjakkal (később jóváírtakkal a gyártásban) és határidőszakaszokkal – nem egy becsült tartomány, hanem kapuról kapura haladó ütemterv.'
    - step: '3. kapu'
      title: 'Mintagyártás (6–17. nap)'
      desc: '1–2 fizikai deszkát gyártunk az Ön specifikációi szerint: a víztest merevsége, az EVA csúszásgátló fedelem textúrája, a grafika pontossága, a tartozékok szerelése. Használja és értékelje a deszkát, mielőtt bármi másba belépne. A mintadíjak a szerződés aláírásakor jóváíródnak a gyártási megrendelésen.'
    - step: '4. kapu'
      title: 'Mintaelemzés és jóváhagyás (18–21. nap)'
      desc: 'Értékelje a mintát az Ön specifikációihoz viszonyítva – az evezési minőséget, a grafika hűségét, a csomagolást, a tartozékokat. A módosításokat egy felülvizsgált anyaglista és a grafika elfogadási jegyzőkönyve rögzíti. A rögzített specifikáció válik gyártási referenciává valamennyi későbbi szállítmányhoz.'
    - step: '5. kapu'
      title: 'Előkészítő gyártástervezés (22–28. nap)'
      desc: 'Alapanyag-beszerzés, szerszám-előkészítés, csomagolás-megerősítés és a gyártási kapacitás lefoglalása. Minden alapanyagot beérkezéskor ellenőrzünk a rögzített anyaglista szerint. A fabrikálás megkezdése előtt kiadjuk a gyártási ütemtervet a minőségellenőrzési kapuk dátumaival.'
    - step: '6. kapu'
      title: 'Gyártás és minőségellenőrzési kapuk (29–55. nap)'
      desc: 'A fabrikálás végighalad a 7 lépéses ellenőrzési kapurendszeren: a beérkező anyagok ellenőrzése, a drop-stitch szövet vizsgálata, hegesztés és összeállítás, nyomás- és tömörségi tesztelés (18.0 PSI nyomástartás, automatikus elutasítás 0.50 PSI-nél nagyobb esésnél), az EVA fedelek és tartozékok szerelése, a grafika és a márkázás ellenőrzése, végső csomagolás és dokumentáció. Minden kapuhoz elfogadási vagy elutasítási kritériumok és nyomon követési nyilvántartások tartoznak.'
    - step: '7. kapu'
      title: 'Feladás és kiszállítás utáni elemzés (56–63. nap)'
      desc: 'Exportminőségű csomagolás, megfelelőségi dokumentáció (CE, ISO 9001, BSCI, REACH, RoHS) és a tengeri szállítás koordinálása több mint 50 országba. A kiszállítás utáni elemzés rögzíti a következtetéseket és a fejlesztéseket a következő megrendelési ciklushoz.'

