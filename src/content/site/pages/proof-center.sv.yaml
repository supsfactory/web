traceability:
  tagline: 'Ett parti, spårat från rulle till bräda'
  title: 'Hur spårbarheten ser ut i praktiken'
  body: |
    Varje parti tilldelas en **10-årig ERP-partikod**. Kedjan som registreras under ett parti:

    - **Ingående rulle** — materialcertifikat, rollnummer, kontrollerat materialparti (drag, tillskärning, svets)
    - **Skärning** — CNC-nestningsorder mot designfilen, registrerad spillprocent
    - **Svetsning & laminering** — linje, operatör, maskinparametrar per luftkammare
    - **Montering** — brädans serienummer, ventiltyp, parti för däckstopp
    - **Test** — 18.0 PSI × 24 h tryckhållning per luftkammare, automatiskt underkännande över 0.50 PSI tryckfall
    - **Släpp** — 100-punktarschecklista per bräda, släpp av QA-chefen per parti
    - **Vidare** — konformitetsintyg (Certificate of Conformance) vid leverans; revisionsrätt förbehålls kontraktligt

    Begär exemplet på ett QC-protokoll före din första order — det har samma format som det du får vid leveransen.

faqs:
  tagline: 'Vanliga frågor'
  title: 'Frågor om beviset som köpare ställer'
  items:
    - q: 'Är den här sidan bara till för verifiering och ersätter den inte due diligence?'
      a: 'Rätt — den här sidan visar var varje påstående kan verifieras: enhetsregistrering, certifikat, maskiner, registreringar och en fabrik som står öppen för revisioner. Dina vanliga due diligence-steg (registerkontroll, revision, inspektion av tredje part) gäller fortfarande och är välkomna.'
    - q: 'Vilken enhet ska stå på min orderdokumentation?'
      a: 'Beställningar avslutas med Qingdao Vatrad Group Co., Ltd., som verkar under namnet Vatrad (produktionsdivisionen), med iSupfactory som SUP-serie. Kontraktsdokument undertecknas av VP Sales, chefsteknikern och QA-chefen.'
    - q: 'Kan jag få kopior av certifikaten före beställningen?'
      a: 'Ja — certifikatnummer och revisionsdokument lämnas ut på begäran eller i samband med en revision. Listan är publicerad, aldrig "endast tillgänglig på begäran".'
    - q: 'Hur kan jag själv verifiera partiets testprotokoll?'
      a: 'Varje luftkammare testas i 24 timmar vid 18.0 PSI med automatiskt underkännande över 0.50 PSI tryckfall; testprotokollen är kopplade till serienummren och följer med varje partis konformitetsintyg. En inspektion före leverans av SGS, TÜV, BV eller Intertek enligt ISO 2859-1 Nivå II kan planeras efter ditt val.'
    - q: 'Täcker certifikaten även tillbehören?'
      a: 'Materialdokumentationen enligt REACH/RoHS gäller brädor och tillbehör i samma order, och QC-checklistorna täcker hela paketet — bräda, paddel, pump, leash och väska.'
    - q: 'Vad händer med beviset efter beställningen?'
      a: 'ERP-spårbarheten per parti sparas i 10 år. QMS-SOP:erna och teststandarderna förblir nedladdningsbara, och köparen behåller kontraktligt en revisionsrätt under produktionen.'

