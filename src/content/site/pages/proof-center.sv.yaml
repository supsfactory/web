hero:
  tagline: 'Nav för fabriksbevis'
  title: 'Proof Center — allt vi påstår finns arkiverat här'
  subtitle: 'En sida som kopplar varje påstående på webbplatsen till beviset: den registrerade enheten bakom fabriken, certifikat med tillämpningsområde, maskinerna som gör jobbet och partiets registreringar som överlever varje produktionskörning.'
  actions:
    - { variant: primary, text: 'Beställ verifieringspaketet', href: '/sv/contact#trust-verification' }
    - { variant: ghost, text: 'Utforska kvalitetssystemet', href: '/sv/quality' }

answer:
  label: 'Kort svar'
  text: 'Kedjan från påstående till bevis fungerar så här: varje påstående på den här webbplatsen bygger på en registrering, ett certifikat, en maskin, ett dokument eller ett testprotokoll — och allt av det går att ta del av. iSupfactory är produktutvecklings- och SUP-produktionsdivisionen inom Qingdao Vatrad Group Co., Ltd. (registrerad i Qingdao sedan 2012). Fabriken på 12 500 m² har kvalitetsledning enligt ISO 9001:2015, konformitet enligt ISO 25649, CE-konformitetsdokumentation, social konformitet enligt BSCI (revisionsrapport på begäran) samt materialdokumentation enligt REACH/RoHS för varje order. Varje uppblåsbar luftkammare testas i 24 timmar vid 18.0 PSI med automatiskt underkännande över 0.50 PSI tryckfall, och partiets registreringar sparas med 10 års ERP-spårbarhet. Pappersspåren är publicerade eller delbara, och fabriken står öppen för revisioner.'
  verified: 'September 2026'

