why_canada:
  tagline: 'De ce cumpărătorii din Canada'
  title: 'Construit pentru importurile în Canada'
  subtitle: 'Fabrica răspunde întrebărilor pe care mărcile și retailerii canadieni le pun înainte de primul container.'
  items:
    - title: 'DDP pentru un cost final previzibil'
      description: 'DDP include formalitățile vamale și livrarea la depozitul dumneavoastră — taxe vamale, impozite și transport într-un singur total, în CAD sau USD. Cea mai populară alegere pentru importatorii de prima dată.'
    - title: 'Rutare către est și vest'
      description: 'Ofertăm transport maritim către Vancouver sau către Toronto și Montreal pe ruta prin Canalul Suez — în funcție de ce echilibrează mai bine timpul de tranzit și costul final.'
    - title: 'Fișiere de produs pregătite bilingv'
      description: 'Documentația CE, REACH și vamală este pregătită pentru piețele dumneavoastră țintă, astfel încât dosarul de produs să funcționeze pentru ambalaje în engleză și în franceză.'
    - title: 'O singură fabrică, un singur sistem de calitate'
      description: 'Dezvoltarea, mostrele, producția și controlul calității au loc toate în interiorul fabricii de 12,500 m² — fără deplasări la broker, fără mostre pe care producția nu le poate replica.'

process_notes:
  tagline: 'Cum funcționează'
  title: 'De la specificații la container'
  subtitle: 'Aceleași șase etape, indiferent dacă cumpărați două containere pe an sau douăzeci: specificații, inginerie, mostre, încercări, matriță, producție — apoi livrare FOB, CIF sau DDP.'
  items:
    - title: '1. Trimiteți specificațiile'
      description: 'O placă de referință, o schiță sau specificațiile unui concurent sunt suficiente. Analiza de inginerie și oferta revin în termen de o zi lucrătoare.'
    - title: '2. Aprobați mostra'
      description: 'Prima dumneavoastră mostră fizică se expediază în 7–12 zile, însoțită de o fișă de aprobare care acoperă construcția, culorile de imprimare și rezultatele testului de presiune.'
    - title: '3. Producție și export'
      description: 'Seriile se finalizează în 25–35 de zile, cu puncte de control al calității în proces. Lista de ambalare, factura și certificatul de transport maritim călătoresc înaintea vasului.'
    - title: '4. Livrare la depozitul dumneavoastră'
      description: '4–6 săptămâni de transport maritim până la Vancouver, Toronto sau Montreal — în regim DDP ne ocupăm de formalitățile vamale și de livrare la ușa dumneavoastră.'

faq_section:
  tagline: FAQ
  title: 'Întrebări despre importul în Canada'
  questions:
    - q: 'Cât durează transportul maritim până în Canada?'
      a: 'Alocați 4–6 săptămâni de la portul Qingdao până la porturile canadiene — Vancouver pe coasta de vest, Toronto și Montreal în est — în funcție de destinație și de programul plecărilor. Proiectele DDP includ întregul termen de la ușă la ușă.'
    - q: 'Livrați DDP în Canada?'
      a: 'Da. DDP include transportul maritim, formalitățile vamale, taxele vamale și impozitele, precum și livrarea la depozitul dumneavoastră — un singur preț total, previzibil. Sunt disponibile și FOB Qingdao și CIF.'
    - q: 'Care este MOQ-ul pentru un import SUP private label?'
      a: 'MOQ este confirmat în funcție de configurația proiectului: dezvoltarea mostrei acoperă 1–2 bucăți, loturile pilot sunt de 20–50 bucăți pe platforme existente, iar producția standard de volum rulează 90–100+ bucăți pe model dintr-o rolă completă de drop-stitch de 150 m.'
    - q: 'Oferiți suport pentru ambalaje în engleză și în franceză?'
      a: 'Da. Echipa noastră de prepress pregătește datele de tipar pentru limbile și reglementările piețelor dumneavoastră țintă — inclusiv ambalaje bilingve EN/FR pentru piața canadiană.'
    - q: 'Pot vizita fabrica înainte de comandă?'
      a: 'Da. Fabrica de 12,500 m² din Qingdao este deschisă clienților — tururile virtuale ale fabricii pot fi organizate online, iar vizitele în persoană sunt conduse pe liniile de producție și la posturile de control al calității.'
    - q: 'Cum încep un proiect din Canada?'
      a: 'Trimiteți o placă de referință, o schiță sau specificații. Analiza de inginerie și oferta revin în termen de o zi lucrătoare, iar un NDA este semnat înainte de orice schimb de fișiere.'

