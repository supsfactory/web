services:
  - title: Проектирование и инженерная разработка
    description: Наша внутренняя команда НИОКР работает с вашей концепцией или спецификацией, разрабатывая CAD-чертежи, 3D-модели и прототипы. Мы предлагаем проектирование пресс-форм, оптимизацию формы корпуса и рекомендации по подбору материалов.
  - title: Индивидуальный брендинг и графика
    description: Полноцветная цифровая печать, трафаретная печать, тиснение и варианты этикеток. Мы разрабатываем графику для палубы, брендинг на трубках и упаковку, готовую к рознице.
  - title: Индивидуализация материалов и спецификации
    description: Выбирайте из PVC (стандартный, экологичный, огнестойкий), Hypalon/CSM, drop-stitch и гибридных конструкций. Индивидуальные цвета трубок, плотности тканей и варианты усиления.
  - title: Упаковка и логистика
    description: Индивидуальная розничная упаковка, короба под собственной маркой, вакуумная упаковка, паллетирование и упаковка экспортного класса, выполняемые собственными силами.

moq_table:
  - product: Надувные доски SUP
    standard_moq: 'Образец 1–2 | Пилот 20–50'
    custom_moq: 'Объём 90–100+ (на рулон 150 m)'
    lead_time: 25–35 дней

why_us:
  - title: Вертикальная интеграция
    description: Мы владеем своим заводом, пресс-формами и цепочкой поставок — никаких посредников и субподрядчиков. Это даёт нам контроль над качеством, себестоимостью и сроками поставки.
  - title: Двойная сертификация
    description: Менеджмент качества по ISO 9001 и сертификация социальной ответственности BSCI. Отчёты об аудите завода предоставляются по запросу.
  - title: Соответствие CE
    description: Сертификация CE применяется к моделям, предназначенным для рынков ЕС (объём подтверждается по каждому проекту). Индивидуальные модели могут быть сертифицированы по CE через нашу отработанную процедуру.
  - title: MOQ под конкретный проект
    description: 'MOQ определяется конфигурацией вашего проекта — малые партии с ко-брендингом начинаются с 5–10 единиц, стандартный объём составляет 90–100+ единиц в партии. Мы помогаем развивающимся брендам выйти на рынок, не создавая избыточных запасов.'

