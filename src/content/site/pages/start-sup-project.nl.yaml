hero:
  tagline: 'Begin hier'
  title: 'Start je SUP-project'
  subtitle: 'Of je nu een nieuw merk wilt lanceren, een productlijn wilt uitbreiden of boards onder jouw merk voor je bedrijf wilt inkopen — elk project begint op dezelfde manier: met een projectbriefing, een NDA, een monster en een duidelijk pad naar de productie. Hier ontdek je wat er gebeurt nadat je op "Start" hebt geklikt.'
