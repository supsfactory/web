answer:
  label: 'Wat er daarna gebeurt'
  text: 'Na het insturen van een projectbriefing ontvang je binnen één werkdag een reactie. Vóór het delen van vertrouwelijke details is een NDA beschikbaar. Het technisch bureau bekijkt je briefing en levert een gedetailleerde offerte met MOQ, monstervoorrijkosten en een gefaseerd plan — doorgaans 7–12 dagen voor de monsters en 6–8 weken voor de eerste productie vanaf de bevestigde PO. De monstervoorrijkosten worden op je productieorder verrekend. Geen verplichtingen tot de ondertekening.'
  verified: 'September 2026'

process_steps:
  tagline: Het proces
  title: 'Van briefing tot geleverde boards — vijf stappen'
  subtitle: 'Elke stap heeft een vaste tijdsduur, een gedocumenteerd resultaat en een go/no-go-mijlpaal. Ga alleen verder wanneer jij er klaar voor bent.'
  steps:
    - step: 'Stap 1'
      title: 'Stuur je projectbriefing in'
      desc: 'Vertel ons over je board — doelspecificaties, hoeveelheden, conformiteitsvereisten en tijdlijnen. De briefing kost 5–10 minuten. Als je ergens niet zeker van bent, deel dan wat je hebt en wij begeleiden je door de rest. Een NDA is beschikbaar voordat je vertrouwelijke designs deelt.'
    - step: 'Stap 2'
      title: 'NDA & haalbaarheidscheck (1–5 dagen)'
      desc: 'Op verzoek ondertekenen wij een NDA, daarna controleert het technisch bureau je briefing op productiecapaciteit, beschikbaarheid van materialen en conformiteitsscope. Je ontvangt een gedetailleerde offerte met MOQ-berekening, monstervoorrijkosten en een gefaseerd plan.'
    - step: 'Stap 3'
      title: 'Monster & goedkeuring (7–21 dagen)'
      desc: '1–2 fysieke boards volgens jouw specificatie. Je vaart en beoordeelt — rompstijfheid, grafische precisie, passing van de accessoires. Wijzigingen worden vastgelegd in een herziene BOM. Het goedgekeurde monster wordt de productiereferentie. De monstervoorrijkosten worden op de productie verrekend.'
    - step: 'Stap 4'
      title: 'Pre-productieplanning (7 dagen)'
      desc: 'Materialen inkopen, matrijzen voorbereiden, verpakking bevestigen en het productieslot reserveren. Alle materialen worden bij ontvangst geïnspecteerd tegen de bevroren BOM. Vóór de productiestart wordt een plan met de QC-gatedata uitgebracht.'
    - step: 'Stap 5'
      title: 'Productie, QC & verzending (4–6 weken)'
      desc: 'De productie doorloopt het inspectiesysteem op 7 niveaus met geslaagd/niet-geslaagd-criteria bij elke gate. Exportconforme verpakking, conformiteitsdocumentatie en coördinatie van het zeetransport naar meer dan 50 landen. Een analyse na levering verzamelt verbeterpunten voor de volgende order.'

