what_we_need:
  heading: 'Wat je vóór de briefing voorbereidt'
  body: |
    Een volledige briefing versnelt het proces. Dit helpt:

    - **Boardspecificaties** — doellengte, -breedte en -dikte, ridergewicht, beoogd gebruik. Referentiemaatvoeringen van boards of concurrentmodellen zijn nuttig.
    - **Designbestanden** — vector graphics (AI, SVG, PDF) voor graphics en logo's. Als ze nog niet klaar zijn, volstaan moodboards of referentiebeelden voor de eerste haalbaarheidscheck.
    - **Hoeveelheid & tijdlijn** — doelhoeveelheid en seizoensplan. Een ruwe schatting ("20–50 boards vóór maart") is al genoeg om te starten.
    - **Conformiteitsvereisten** — doelmarkten en specifieke certificeringsvereisten naast CE, ISO 9001, BSCI, REACH, RoHS.
    - **Budgetkader** — een indicatief budget per board of een doelbestemmingskost helpt ons het juiste platform aan te bevelen.

    **Nog niet alles klaar?** Stuur wat je hebt. Wij begeleiden je door de rest.

faqs:
  tagline: FAQ
  title: 'Een SUP-project starten — Veelgestelde vragen'
  items:
    - q: 'Wat is de minimale order om te starten?'
      a: 'Het instappen is getrapt: eerst 1–2 monsters (7–12 dagen), daarna een proeforder van 20–50 boards (25–35 dagen), vervolgens standaard seriecycli van 90–100+ boards per goedgekeurde configuratie. Private label co-branding start vanaf 5–10 eenheden zonder ontwikkelingsfase.'
    - q: 'Hoe lang duurt het voordat ik de monsters ontvang?'
      a: 'De fysieke monsters worden in 7–12 dagen geproduceerd vanaf de bevestiging van de specificatie en de aanbetaling. Met bestaande rompplatforms kost de hele cyclus van briefing tot geleverde proeforder doorgaans 8–12 weken. Een aangepaste romp voegt 15–20 dagen matrijsontwikkeling toe.'
    - q: 'Is mijn design beschermd?'
      a: 'Ja. Een NDA is direct beschikbaar — vóórdat je vertrouwelijke informatie deelt. Wij produceren uitsluitend onder het merk van onze klanten en concurreren nooit met hen. Alle technische bestanden worden bewaard in systemen met toegangsbeheer en audittrail.'
    - q: 'Wat vraagt het projectbriefingformulier?'
      a: 'De briefing vraagt naar het type activiteit, de bedrijfsnaam, de doelspecificaties van het board, de bandbreedte van de bestelhoeveelheid, de tijdlijn en eventuele conformiteitsvereisten. Het kost circa 5–10 minuten. Je kunt designbestanden bijvoegen (PNG, JPG, SVG, PDF, AI, PSD, DWG, DXF, ZIP) tot 10 MB. Als je ergens niet zeker van bent, sla het veld over — wij nemen contact met je op.'
    - q: 'Wat gebeurt er na het insturen van de briefing?'
      a: 'Je ontvangt binnen één werkdag een reactie. Het technisch bureau bekijkt je briefing en levert een gedetailleerde offerte met MOQ, monstervoorrijkosten en een gefaseerd plan. Er ontstaat geen enkele verplichting totdat je het contract hebt bekeken en ondertekend. De monstervoorrijkosten worden op je productieorder verrekend.'

