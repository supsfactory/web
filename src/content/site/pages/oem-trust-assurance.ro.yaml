answer:
  label: 'Răspuns direct'
  text: 'Încrederea nu este o promisiune — este documentație. Suntem o entitate de producție chineză înregistrată (Qingdao Vatrad Group Co., Ltd.) cu o uzină fizică de 12,500 m² în Qingdao, 350+ de lucrători și o capacitate anuală de 120,000+ de plăci. Puteți verifica înregistrarea, audita fabrica, consulta SOP-urile QMS, descărca înregistrări de calitate mostră, programa inspecții terțe (SGS, TÜV, BV sau Intertek) și semna un NDA în 4 ore lucrătoare. Fiecare placă este încercată la presiune la 18.0 PSI timp de 24 de ore, cu respingere automată la o scădere de peste 0.50 PSI, iar fiecare lot păstrează trasabilitate ERP pe 10 ani. Dacă o afirmație nu poate fi documentată, nu o facem.'
  verified: 'Septembrie 2026'

