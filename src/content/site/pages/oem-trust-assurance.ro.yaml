trust_steps:
  tagline: 'Un studiu de caz real'
  title: 'Cum ne-a verificat o flotă de închiriere din Europa de Nord înainte de comandă'
  subtitle: 'Șapte etape de verificare pe care un operator comercial de închiriere le-a parcurs înainte de a plasa o comandă de flotă de 90–100+ bucăți — aceeași listă de verificare este disponibilă și pentru dumneavoastră.'
  steps:
    - step: '01'
      title: 'Verificarea entității oficiale'
      desc: 'Cumpărătorul a cerut Înregistrarea Comercială chineză și licența de comerț exterior. Entitatea legală din spatele iSupfactory este Qingdao Vatrad Group Co., Ltd., un producător înregistrat în Qingdao, Shandong din 2012 — verificat prin registrul național, sub NDA.'
    - step: '02'
      title: 'Fabrică fizică și audit al amplasamentului'
      desc: 'Un audit de fabrică (prezent și prin tur video) a confirmat uzină de 12,500 m²: patru ateliere specializate, 350+ de lucrători, patru linii automatizate și o producție lunară de aproximativ 10,000 de plăci. Raportul de audit este depus în dosarul contractual.'
    - step: '03'
      title: 'Oameni: ingineri reali, nu scripturi de vânzări'
      desc: 'Cumpărătorul a discutat direct cu echipa de inginerie — proiectarea corpului de apă, laboratorul de materiale și controlul calității. Specificația proiectului și NDA-ul au fost schimbate în 4 ore lucrătoare, iar analiza de inginerie a revenit în decurs de o zi lucrătoare.'
    - step: '04'
      title: 'Documente: QMS, certificate și inspecție terță'
      desc: 'Au fost analizate documentația de conformitate ISO 9001:2015, ISO 25649 și CE, înregistrările BSCI/REACH/RoHS și SOP-urile QMS. Cumpărătorul a programat o inspecție SGS înainte de expediție conform ISO 2859-1 Nivel II la prima comandă de volum — și a primit un Certificat de Conformitate pentru fiecare lot.'
    - step: '05'
      title: 'Date: înregistrări de încercare pentru fiecare număr de serie'
      desc: 'Cumpărătorul a auditat înregistrările reale de încercare: fiecare cameră încercată la 18.0 PSI timp de 24 de ore, cu respingere automată la o scădere de presiune de peste 0.50 PSI, liste de verificare a asamblării în 100 de puncte și trasabilitate ERP a loturilor pe 10 ani. Au fost furnizate înregistrări de control al calității mostră înainte de comandă.'
    - step: '06'
      title: 'Protecția contractuală'
      desc: 'Contractul comenzii a acoperit licențierea mărcii, o perioadă de exclusivitate teritorială agreată, proprietatea formelor și condițiile de răscumpărare, precum și datele și înregistrările care se transferă împreună cu uneltele. Cumpărătorul a aprobat forma la fabrică înainte de producție.'
    - step: '07'
      title: 'Guvernanță continuă'
      desc: 'Analize de afaceri trimestrale cu VP-ul de Vânzări și Inginerul Șef, un drept rezervat de audit în timpul producției și o cale de escaladare către Directorul QA pentru orice dispută de calitate. Acordul a fost semnat comun de VP-ul de Vânzări, Inginerul Șef și Directorul QA.'

trust_faqs:
  tagline: FAQ
  title: 'Cele 12 întrebări pe care cumpărătorii le pun înainte de comandă'
  items:
    - q: 'Este iSupfactory într-adevăr o fabrică sau o companie de tranzacții?'
      a: 'iSupfactory este divizia de dezvoltare și producție a produselor SUP a grupului Qingdao Vatrad Group Co., Ltd. Operăm personal uzina de 12,500 m² din Qingdao — proiectarea, tăierea, sudarea, asamblarea și încercarea au loc într-o singură instalație. Nu există predări tip companie de tranzacții: persoanele care răspund la întrebările dumneavoastră sunt cele care construiesc plăcile dumneavoastră.'
    - q: 'Cu cine voi lucra efectiv pe proiectul meu?'
      a: 'Cu un inginer de proiect nominal și un contact nominal pentru controlul calității, plus șefii de departament care semnează documentele dumneavoastră. Puteți cere să discutați direct cu Inginerul Șef, Directorul QA sau directorul fabricii — înainte și după comandă. Între dumneavoastră și echipa care execută lucrarea nu există niciun intermediar de cont.'
    - q: 'Pot vizita sau audita fabrica?'
      a: 'Da. Găzduim vizite în fabrică în Zona de Dezvoltare Economică Laixi, Qingdao și susținem audituri la distanță prin tururi video în direct. Auditurile pot fi organizate independent (inspectorul dumneavoastră sau o parte terță precum SGS, TÜV, BV sau Intertek), iar programul auditului poate fi înscris în contract.'
    - q: 'Semnăm un NDA înainte să-mi partajez proiectarea?'
      a: 'Da. NDA-ul nostru standard este semnat în 4 ore lucrătoare de la cererea dumneavoastră, înainte de a partaja orice specificație confidențială, artwork sau fișier tehnic. Sunt disponibile versiuni bilingve (engleză/chineză), iar documentul este contrasemnat de directorul fabricii.'
    - q: 'Cum știu că afirmațiile mele despre calitate sunt reale?'
      a: 'Fiecare afirmație de pe acest site are un document în spatele ei: SOP-urile QMS și standardele de inspecție pot fi descărcate, mostre de înregistrări de calitate anonimizate sunt publicate, iar datele de încercare sunt înregistrate pentru fiecare număr de serie, cu trasabilitate ERP a loturilor pe 10 ani. Puteți programa și o inspecție terță înainte de expediție, la alegerea dumneavoastră.'
    - q: 'Ce se întâmplă dacă plăcile ajung cu defecte?'
      a: 'Fiecare placă este încercată înainte de ambalare, iar înregistrările la nivel de lot permit urmărirea cauzei pentru fiecare număr de serie. Contractul definește obligațiile de inspecție, înlocuire și retuș, iar Directorul QA semnează eliberarea lotului. Plăcile retușate sunt reîncercate integral — niciodată verificate parțial.'
    - q: 'Puteți într-adevăr încerca 100% din plăci înainte de expediție?'
      a: 'Da — și înregistrările o dovedesc. Fiecare cameră este umflată la 18.0 PSI și menținută timp de 24 de ore, cu înregistrare continuă prin senzori; orice cameră care depășește 0.50 PSI scădere de presiune pe 24 de ore este respinsă automat și reinspectată. Jurnalele de încercare sunt legate de fiecare număr de serie și fac parte din documentația lotului.'
    - q: 'Ce certificări aveți în realitate?'
      a: 'Managementul calității ISO 9001:2015, ISO 25649 și conformitate CE pentru produsele SUP gonflabile, plus conformitate BSCI, REACH și RoHS pentru instalație și materiale. Numerele certificatelor și înregistrările de audit sunt furnizate la cerere sau în timpul unui audit — lista este publicată, nu „disponibilă doar la cerere”.'
    - q: 'Marca mea va fi protejată — proiectare, forme și piață?'
      a: 'Da. Marca, proiectările și uneltele dumneavoastră sunt protejate prin NDA, condiții de licențiere a mărcii și clauze de proprietate sau răscumpărare a formelor, înscrise în contract. Uneltele sunt păstrate pentru marcă și sunt transferabile. Condițiile teritoriale și de exclusivitate sunt stabilite în scris înainte de începerea producției.'
    - q: 'Care este MOQ-ul real?'
      a: 'MOQ-ul este specific proiectului și este explicat în ghidul nostru MOQ: mostre 1–2 bucăți, co-branding în loturi mici 5–10 bucăți, loturi pilot 20–50 bucăți și volum standard 90–100+ bucăți pe rolă de 150 m (aproximativ 180–220 de plăci). Formele personalizate se încadrează la nivelul de volum. Calculul este confirmat înainte de ofertă — fără nume vagi de „MOQ redus”.'
    - q: 'Ce se întâmplă dacă producția întârzie?'
      a: 'Termenul este confirmat după specificație, artwork și verificarea ambalajelor — niciodată promis în avans. Contractul acoperă planificarea, notificarea întârzierilor și calea de rezolvare, iar analiza de afaceri trimestrială urmărește performanța livrărilor față de calendarul agreat.'
    - q: 'Cine semnează documentele contractuale din partea dumneavoastră?'
      a: 'Comenzile și acordurile sunt semnate comun de VP-ul de Vânzări, Inginerul Șef și Directorul QA — cele trei persoane responsabile, respectiv, pentru termenii comerciali, execuția de inginerie și eliberarea calității. Documentele semnate vă sunt transmise împreună cu dosarul contractual.'

governance:
  tagline: 'Structura responsabilităților'
  title: 'Semnatari nominali și drepturi rezervate'
  subtitle: 'Fiecare angajament este legat de un rol nominal — nu de un departament de vânzări.'
  body: |
    **Semnătură comună.** Comenzile, planurile de calitate și rezolvările disputelor sunt semnate de trei roluri: VP-ul de Vânzări (termeni comerciali), Inginerul Șef (execuție de inginerie) și Directorul QA (eliberarea calității). SOP-urile bilingve sunt controlate pe versiuni și au aceeași structură de semnături.

    **Drepturi rezervate.** Cumpărătorul își păstrează dreptul de a audita producția, de a consulta înregistrările de încercare și de a bloca eliberarea lotului până la semnarea inspecției. Retușul are loc doar în baza unei înregistrări de modificare aprobate, iar eliberarea este validată de un control al calității independent — niciodată de operatorii care au realizat retușul.

    **Înregistrări care se transferă.** Jurnalele de încercare de lot, certificatele de conformitate și rapoartele de inspecție sunt livrate cu fiecare expediție, iar trasabilitatea ERP a loturilor este păstrată 10 ani. Dosarele uneltelor și desenele formelor se transferă împreună cu uneltele atunci când contractul prevede acest lucru.

