steps:
  tagline: Cómo funciona
  title: 'Camino de la Solicitud al Primer Contenedor'
  subtitle: 'Un proceso de incorporación claro y por etapas para que tu programa con marca envíe a tiempo en su primera temporada.'
  steps:
    - step: 1
      title: Solicitud
      desc: 'Presenta la solicitud de distribuidor con el perfil de tu empresa, tu volumen de negocio mayorista actual y tu territorio.'
    - step: 2
      title: Delimitación del territorio
      desc: 'Confirmamos qué países o regiones cubrirá tu programa con marca y si el territorio es exclusivo.'
    - step: 3
      title: Plan de gama y marca
      desc: 'Elige tus modelos base del catálogo de fabricación, congela las especificaciones y finaliza el arte de tu marca para producción.'
    - step: 4
      title: Aprobación de muestra y calidad
      desc: 'Pide muestras de certificación para probar la calidad, el embalaje y la gestión del envío directo. Las muestras se aprueban antes de iniciar la producción en serie.'
    - step: 5
      title: Reposición de temporada
      desc: 'Tu gestor de cuenta programa la producción y la reposición en función de tu previsión y del calendario de temporada.'

