faqs:
  tagline: FAQ de Distribuidores
  title: 'Programa de Distribución Mayorista — Preguntas Frecuentes'
  items:
    - q: '¿Cuál es el pedido mínimo para un nuevo distribuidor?'
      a: 'Los nuevos socios de distribución suelen empezar con un pedido de muestra y aprobación previa a producción seguido de un primer contenedor programado para su temporada. El mínimo exacto depende del tamaño del territorio y de la gama elegida; tu gestor de cuenta confirma el volumen de apertura durante la planificación de la gama y la marca.'
    - q: '¿Podemos vender las tablas bajo nuestra propia marca?'
      a: 'Sí. La marca privada es el modelo estándar aquí: las tablas se fabrican bajo tu marca con tu arte, embalaje y especificaciones. SUPsfactory fabrica exclusivamente para sus clientes y no compite con ellos en ningún mercado.'
    - q: '¿Los territorios son exclusivos?'
      a: 'Sí. Los programas de distribución se basan en territorios exclusivos: cada socio mayorista cubre un país o región definido y recibe precios y soporte de programa para ese mercado.'
    - q: '¿Ofrecéis envío directo?'
      a: 'La capacidad de envío directo está incluida en el programa. Las muestras, el embalaje y la manipulación se validan durante la fase de aprobación de muestra para que los envíos directos funcionen desde el primer día.'
    - q: '¿Qué modelos podemos pedir?'
      a: 'El catálogo de fabricación cubre tablas de SUP hinchables en todas las formas (all-around, touring y surf), kayaks hinchables, bombas, palas, chalecos salvavidas y accesorios de cuidado, además de formas personalizadas desarrolladas con nuestro equipo de ingeniería. La mayoría de los socios empieza con 4–8 SKU de más venta y amplía en temporadas posteriores.'
    - q: '¿Cómo se envían los pedidos?'
      a: 'Los pedidos salen de la fábrica en salidas programadas, con pedidos anticipados disponibles para estabilizar los costes de transporte. Tu gestor de cuenta planifica la producción y el despacho en función de tu previsión y del calendario de temporada.'
    - q: '¿Cómo puedo solicitar?'
      a: 'Usa el formulario de solicitud de esta página o ponte en contacto con nosotros directamente. Las solicitudes las revisa el equipo de distribución y respondemos con los siguientes pasos, incluida la delimitación del territorio y un contrato provisional, en pocos días hábiles.'

