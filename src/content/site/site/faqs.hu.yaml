faqs:
  - q: Ki az az iSupfactory?
    a: >-
      Az iSupfactory a kínai Qingdao székhelyű OEM- és ODM-gyártó, amely a felfújható SUP-deszkák
      termékfejlesztését, prototípuskészítését, gyártását, minőség-ellenőrzését és exportgyártását
      kínálja márkák, forgalmazók és outdoor-cegek részére.
  - q: Hol gyártják az iSupfactory termékeit?
    a: >-
      A SUP-deszkákat Kínában, Qingdaóban gyártják.
  - q: Az iSupfactory OEM gyártó?
    a: >-
      Igen. Az iSupfactory a vevő által jóváhagyott specifikáció szerint gyárt felfújható SUP-deszkákat,
      beleértve a méreteket, az anyagokat, a felépítést, a grafikát, a kiegészítőket és a csomagolást.
  - q: Kínál az iSupfactory ODM termékfejlesztési szolgáltatást?
    a: >-
      Igen. Az iSupfactory termékbriefből, piaci igényből vagy egy teljesítménycélből kiindulva
      fejleszti a SUP-termékeket, mérnöki munkával, prototípusfejlesztéssel, mintajóváhagyással és
      gyártással.
  - q: Kifejleszthető-e SUP-deszka a saját rajzaim alapján?
    a: >-
      Igen. A vevő rajzait, specifikációit és referenciatermékeit az ajánlat kiadása előtt
      gyárthatósági szempontból átvizsgáljuk.
  - q: Kifejleszthetnek-e SUP-deszkát egy ötletből kiindulva?
    a: >-
      Igen. Az ODM-projektek indulhatnak egy koncepcióból, egy piaci igényből vagy egy
      teljesítménycélból.
  - q: Rendelhetek prototípust?
    a: >-
      Igen. A prototípusminták a sorozatgyártás előtt legyárthatók; jelenleg a mintákat a
      specifikáció véglegesítésétől számított 7–12 napon belül szállítjuk ki.
  - q: Mennyi az Ön gyártási átfutási ideje?
    a: >-
      A standard gyártási átfutási idő 25–35 nap a megrendelés és az előleg megerősítésétől
      számítva, a projekt konfigurációjától függően; az egyedi szerszámok további 15–20 napot
      adnak hozzá.
  - q: Mi a minimális rendelési mennyiség (MOQ)?
    a: >-
      A MOQ a platformtól, a felépítéstől, a mennyiségtől, a csomagolástól és az
      anyagigényektől függ. A kis volumenű co-branding 5–10 darabbal indul, a pilótaszériák
      20–50 darabbal; a sorozatgyártás MOQ-ját a projekt konfigurációja alapján erősítjük meg.
  - q: Auditálhatják-e a vevők a gyárat?
    a: >-
      Igen. A vevői auditokat és a harmadik fél által végzett ellenőrzéseket a projekt igényei
      alapján megszervezhetjük.
  - q: Hol található a társaság és a gyár?
    a: >-
      Kínában, Qingdaóban vagyunk. Az iSupfactory a Qingdao Vatrad Group Co., Ltd. gyártórészlege — egy
      12 500 m²-es felfújható termékgyár a Laixi Economic
      Development Zone területén, amely 2012 óta működik. Az értékesítés és a technikai
      támogatás világrészen kiterjed; a gyártás Kínában, Qingdaóban
      zajlik.
  - q: Kínál a Vatrad OEM/ODM szolgáltatásokat a vízi sportok felfújható felszereléséhez?
    a: >-
      Igen. Az iSupfactory (a Qingdao Vatrad Group Co., Ltd. támogatásával) széleskörű OEM- és
      ODM-testreszabást kínál — a 3D tervektől és a drop-stitch
      anyagok kiválasztásától a globális márkák számára történő tömeggyártásig. Saját
      márkázást, testreszabott csomagolást, valamint BSCI-, CE- és egyéb
      tanúsítványokhoz kapcsolódó megfelelőségi
      dokumentációt vállalunk.
  - q: Milyen tanúsítványokkal rendelkezik a Vatrad a vízi sportok felfújható felszerelésének gyártásához?
    a: >-
      A Vatrad gyárában BSCI- és ISO 9001-tanúsítvány érvényes. A CE-tanúsítvány az
      EU-piacokra szánt modellekre vonatkozik; a hatókör minden
      projektnél megerősítésre kerül, és a célpiac alapján, valamint a termék konfigurációjától
      függően változik. A REACH és RoHS
      megfelelőségi dokumentáció kérésre rendelkezésre áll.
  - q: Mi az OEM felfújható SUP-deszkák minimális rendelési mennyisége (MOQ)?
    a: >-
      A MOQ-t a projekt konfigurációja alapján erősítjük meg, nem pedig egy rögzített
      számmal: minden projekt végigmegy a minta szakaszán (1–2 darab) és a
      pilóta szakaszán (20–50 darab), a standard sorozatgyártás pedig 90–100+ darab
      egy teljes, 150 m-es drop-stitch tekercsből készül. A kis volumenű co-branding 5–10
      darabbal indul. A teljes számítási logikát a MOQ és rugalmas márkázás
      útmutatóinkban találja.
  - q: Milyen anyagokat használ a Vatrad a felfújható SUP-deszkák gyártásához?
    a: >-
      A SUP-deszkákhoz tengerészeti minőségű PVC-t (0,9 mm–1,2 mm) és kettős rétegű
      drop-stitch magot használunk. Az anyagok tanúsított beszállítóktól
      származnak, és a gyártás előtt húzási szilárdságra, UV-állóságra és alacsony
      hőmérsékleti hajlításra teszteljük őket.
  - q: Kezel a Vatrad nagy volumenű nagykereskedelmi rendeléseket nemzetközi vevők számára?
    a: >-
      Igen. A 12 500 m²-es gyárunk évente több mint 120 000 darabot gyárt, 350+ képesített
      munkavállalóval dolgozó csapattal. Több mint 50 országba szállítunk, és
      a logisztikát is mi kezeljük, beleértve az FOB Qingdao-t, a CIF feltételt a fő
      kikötők felé, valamint a partnerszállítókon keresztüli házhozszállítást.
  - q: Mennyi az OEM felfújható SUP-deszkák gyártási átfutási ideje?
    a: >-
      A standard OEM gyártási átfutási idő 25–35 nap a megrendelés és az
      előleg megerősítésétől számítva. A testreszabott formák kifejlesztése további 15–20 napot
      ad hozzá a szerszámokhoz, a prototípusminták pedig 7–12 nap alatt kerülnek kiszállításra. Stabil
      partnerségek számára sürgős megrendeléseket is teljesítünk, megerősített anyagkészlettel.
  - q: Szállít a Vatrad katonai minőségű drop-stitch anyagot a SUP-deszkákhoz?
    a: >-
      Igen. A drop-stitch magunk tengerészeti specifikációjú PVC-szövetet használ, amelynek
      húzási szilárdsága meghaladja a 2000 N/5cm értéket. A kettős rétegű laminálási
      folyamat 18,0 PSI nyomáson biztosítja a leveőmegtartást, 24 órás
      nyomásesés-ingadozás 0,50 PSI alatt marad — a gyár leveőmegtartási
      integritási szabványának megfelelően.
  - q: Hogyan biztosítja a Vatrad a felfújható termékei tömítettségét és UV-állóságát?
    a: >-
      Minden felfújható cső kiszállítás előtt 24 órás, 18,0 PSI nyomáson
      végzett nyomástartási tesztelésen megy át; azokat a légkamrákat, amelyeknél a
      nyomásesés meghaladja a 0,50 PSI értéket, automatikusan visszautasítjuk. Az UV-állóságot
      gyorsított öregítéssel validáljuk, húzási szilárdságromlási küszöbökkel. PVC-
      vegyületünk UV-stabilizátorokat és antioxidáns adalékokat tartalmaz a hosszú távú
      kültéri tartósság érdekében.
  - q: Segít a Vatrad a csomagolás és a saját márkázás megtervezésében?
    a: >-
      Igen. Teljes körű saját csomagolást kínálunk: testreszabott kiskereskedelmi
      dobozokat, függesztett címkéket, kezelési kézikönyveket, valamint szállítódobozokat
      az Ön márkájának grafikájával. A gyárban működő
      designcsapatunk teljes vizuális márkaidentitást tud kifejleszteni az új piacra
      belépő cégek számára — a logó alkalmazásától a csomagolásnyitási
      élményig.
  - q: Elfogad a Vatrad nemzetközi vevők gyárauditjait?
    a: >-
      Természetesen. Örömmel elfogadjuk a gyárat érintő auditokat, akár helyszínen, akár
      harmadik fél által, beleértve a BSCI-, SMETA-auditokat és az ügyfél által előírt
      társadalmi megfelelőségi ellenőrzéseket. A 12 500 m²-es telephelyünk auditálásra
      kész, dokumentált minőség-ellenőrzési folyamatokkal, anyagkövethetőséggel, valamint
      a munkavállalók egészségére és biztonságára vonatkozó
      nyilvántartásokkal. A gyár virtuális bemutatója rendelkezésre áll a
      minősítés kezdeti szakaszában.
  - q: Milyen drop-stitch technológiát alkalmaz a Vatrad a SUP-deszkáknál?
    a: >-
      A drop-stitch olyan szövet szerkezet, amelyben több ezer poliészterfonal köti össze
      a felső PVC-réteget az alsóval. 12–15 PSI-re fújva ezek a
      fonalak rögzített távolságban tartják a paneleket, így merev és
      sík platformot hoznak létre. A Vatrad hőre ragasztott (fusion-laminated)
      drop-stitch technológiát alkalmaz — a fonalak termikusan kötődnek a PVC-hez —,
      ami jóval nagyobb delaminációállóságot eredményez, mint a hagyományos,
      ragasztóval rögzített magok.
  - q: Milyen platformokra van szüksége a kezdő evezőknek és a kölcsönzött vendégeknek?
    a: >-
      Azok a vevők, akik kölcsönzési, üdülőhelyi vagy iskolai flottát terveznek, általában
      széles, nagy térfogatú, stabil all-around platformokkal kezdenek,
      amelyek kezdők számára alkalmasak, és a napi kereskedelmi használatra
      sokoldalúak. Két- vagy többfős deszkákat, valamint csoportos
      oktatáshoz való lapokat is konfigurálunk. A platform kiválasztását a
      mintázás előtt az Ön felhasználóival összevetve értékeljük ki.
  - q: Milyen vízkörülmények között működnek a kereskedelmi SUP-programok?
    a: >-
      Az iSupfactory deszkái óceánban, tóban és folyóban való használatra készülnek.
      A túra-modellek ellenállnak a parti hullámoknak, és valamennyi
      deszka tengerészeti minőségű, a sós víz korróziójálval szemben
      ellenálló PVC-t használ. A sós vizekben működő flottákhoz a
      használatok közötti öblítést frissvízzel javasoljuk, és ezt
      a kereskedelmi készletekkel együtt átadott üzemeltetési útmutatóban
      is szerepeltetjük.
  - q: Szállítanak szivattyúkat és fújási kiegészítőket a kereskedelmi készletekhez?
    a: >-
      Igen. A kereskedelmi készletek kétszeresen működő kézi szivattyút tartalmaznak,
      az üdülőhelyek és a kölcsönző üzemeltetők számára pedig, akik naponta több
      deszkát kezelnek, elektromos szivattyúkat is kínálunk. A szivattyúk, az evezők, a
      biztonsági kötelek (leash), a vitorlák, a hátizsákok és a
      javítókészletek kiválasztása minden
      projektnél a kiegészítőkonfiguráció részeként erősítésre kerül.
  - q: Hogyan csomagolják a deszkákat kiszállításra és kiskereskedelmi átadásra?
    a: >-
      A sorozatgyártást légmentesített csomagolásban szállítjuk ki, amivel a
      térfogatsúly 50–60%-kal csökkenthető. A kiskereskedelmi programokhoz
      dobozjelölést, kézikönyveket, vonalkódokat és piaconként eltérő
      dobozjelölési megoldásokat kínálunk, és teljes, elválasztókkal
      csomagolt készleteket is előkészítünk, hogy minden dobozban
      ugyanaz a kiegészítőkészlet legyen.
  - q: Milyen evezősúly-tartományt bírnak a deszkáink?
    a: >-
      Az all-around platformok 220 lbs-ig, a túra- és a
      jógadeszkák 250 lbs-ig terhelhetők, nagyobb lapokon pedig nagyobb
      teherbíróképességi opciók is elérhetők. Az evező súlyát, a
      felépítést és a névleges nyomásokat minden platformhoz a
      műszaki adatlapon adunk meg, még a megrendelés vállalása előtt.
  - q: Mit tartalmaz egy teljes kereskedelmi készlet?
    a: >-
      Egy teljes készlet általában a következőket tartalmazza: a deszkát, a szállítóhátizsákot, a kétszeresen működő
      kézi szivattyút, a levehető vitorlát, a spirális biztonsági kötelet és a
      javítókészletet, evezőre és elektromos szivattyúra való továbbfejlesztési
      opciókkal. A készlet tartalmát a vevő által jóváhagyott alkatrészjegyzék (BOM)
      rögzíti, így a minták és a sorozatgyártás pontosan
      megfelelnek egymásnak.
  - q: Összekapcsolhatók a deszkák, a kiegészítők és a csomagolás egyetlen programban?
    a: >-
      Igen. A több SKU-t tartalmazó programok egyetlen gyári szerződésben
      fedik le a deszkákat, a kiegészítőket és a kiskereskedelmi
      csomagolást — a közös kiegészítőkészletek csökkentik az SKU-nkénti
      készletet, az egységes designrendszer megőrzi a márkázás
      következetességét, egyetlen minőségügyi felelős pedig kezeli a
      garanciaigényeket. Így működnek azok a forgalmazók és
      kiskereskedelmi partnereink, akik teljes SUP-kínálatot vezetnek
      be.
  - q: Mi az OEM, az ODM és a saját márkázás közötti különbség?
    a: >-
      Az OEM azt jelenti, hogy az Ön által jóváhagyott specifikáció szerint gyártunk — az Ön
      rajzai, méretei, anyagai és csomagolásai szerint. A design és a szellemi
      tulajdon az Öné. Az ODM azt jelenti, hogy mérnöki csapatunk az Ön briefje alapján
      fejleszti a deszkát — legyen az egy piaci koncepció, egy
      teljesítménycél vagy egy bevált platform adaptálása —, amelyet
      Ön jóváhagy a gyártás előtt. A saját márkázás az Ön márkáját,
      grafikáját és csomagolását jelenti egy bevált, meglévő platformon,
      szerkezeti módosítás nélkül. A legtöbb projekt ezek közé esik,
      és mi azt a konfigurációt ajánljuk, amely
      megfelel az Ön által kívánt termékdesign szintjének.
  - q: Mennyibe kerül egy prototípusminta, és levonható-e a díj a megrendelésből?
    a: >-
      A minták ára a projekt konfigurációját követi: a méret, a felépítés, a
      grafika és a csomagolás befolyásolja az ajánlatot. Azoknál a
      projekteknél, amelyek sorozatgyártásra lépnek, a mintadíjat általában
      levonjuk az első gyártási megrendelésből — a levonás
      feltételeit az ajánlatkéréskor írásban erősítjük meg, hogy
      később ne legyen meglepetés.
  - q: Hány felfújható SUP-deszka fér egy 20-as konténerbe?
    a: >-
      A légmentes csomagolt 11 lábas deszkák kiegészítő készletekkel egy
      20-as konténerbe általában 150–200 teljes készlet fér — a pontos
      szám a csomagolás kialakításától, a
      kiegészítők összetételétől és a dobozok méretétől függ.
      Csomagolási csapatunk az Ön által
      megadott tényleges alkatrészjegyzék alapján számolja ki a
      berakodási tervet, így az a darabszám, amelyre
      tervez, valóban az a darabszám, amelyet kiszállítunk.
  - q: Mit tartalmaznak a nagykereskedelmi ajánlatok — FOB vagy CIF?
    a: >-
      Az ajánlatok részletesek: a termék, a standard csomagolás és a
      szállítás a kiválasztott kereskedelmi feltétel szerint. Az FOB Qingdao
      az alapértelmezett alap, a CIF feltétel a fő
      kikötők felé, valamint a házhozszállítás partnerszállítóinkon
      keresztül rendelkezésre áll. Minden
      ajánlat pontosan megjelöli, mi tartozik bele, hogy ne
      hasonlítsa össze az almát az almával a
      beszállítók között.
  - q: Szanátoznak-e díjat szerszámokért vagy formákért testreszabott deszkák esetén?
    a: >-
      A grafikai előkészítés és a nyomólemezek költsége kicsi és újrahasznosítható; a szerkezeti
      szerszámok (új formák, testreszabott peremek vagy egyedi
      felépítések) külön kerülnek árazásra az ajánlatkérés
      szakaszában. Ahol szerszám szükséges, a költséget általában
      az első gyártási tételre amortizáljuk, nem pedig egyszeri
      meglepetésként számítjuk fel.
  - q: Milyen fizetési feltételeket alkalmaznak a gyártási megrendeléseknél?
    a: >-
      A standard feltételek előleget jelentenek, amelyek blokkolják a
      gyártást, az egyenleg pedig a kiszállítás előtt fizetendő. Az
      előleg százalékát és az egyenlegfizetés időpontját
      megrendelésenként meghatározzuk, és a szerződésben rögzítjük. A
      állandó megrendelési előzményekkel rendelkező stabil
      partnerek hosszabb határidőket tárgyalhatnak — mi inkább néhány
      egyértelmű feltételt választunk, mint bonyolult
      finanszírozási struktúrákat.
  - q: Milyen garanciát nyújtanak a nagykereskedelmi megrendelésekre?
    a: >-
      Minden deszka kiszállítás előtt 24 órás, 18,0 PSI nyomáson végzett nyomástartási
      teszten megy át, a garancia feltételeit pedig minden
      megrendelési szerződésben rögzítjük — ezek a
      gyártási hibákra vonatkoznak, mint például a
      delamináció, a hegesztések gyengülése és a
      szelepek szivárgása, és kizárják a használatból eredő
      károkat. A garanciaidőt és a reklamációs
      eljárást a beszerzési megrendelésben rögzítjük, nem
      utólag derül ki.
  - q: Mi történik, ha a deszkák sérülten vagy gyártási hibával érkeznek?
    a: >-
      Jelentse a problémát a megállapított határidőn belül (általában
      7–15 nappal az érkezés után), fényképes vagy videós
      bizonyítékkal. A helyzetet az Ön tételére megőrzött
      kiszállítás előtti ellenőrzési nyilvántartások alapján értékeljük ki,
      majd az esettől függően újragyártunk, cserélünk vagy
      jóváírást adunk. Az Ön készletének minőségbiztosítási
      fényképei mindkét fél számára is gyors és
      igazságos folyamatot eredményeznek.
  - q: Hogyan hagyják jóvá a testreszabott grafikát a gyártás előtt?
    a: >-
      A grafikák ellenőrzött jóváhagyási láncon mennek át: digitális
      mockup, nyomtatott próba, az első darab ellenőrzése a
      gyártódeszkán, majd a tétel gyártása. Minden
      lépést az Ön által aláírt grafikai fájlhoz viszonyítva
      ellenőriznek, ezért a nyomtatott színek, az
      EVA pad elhelyezkedése és a logó pozíciója
      akkor is megegyezik a márkafájlban megadottal, amikor a
      deszkák megérkeznek.
  - q: Milyen alkatrészket szállítanak a kereskedelmi flottákhoz?
    a: >-
      A flottaüzemeltetők pótalkatrészeket rendelhetnek a
      deszkákkal együtt vagy későbbi megrendelésekben: tartalékszelepek, javítókészletek (PVC-javítófoltok és
      ragasztó), uszálydobozok és uszályok, valamint a
      leggyakrabban cserélt kiegészítők. A pótalkatrészeket a
      gyártással együtt vagy kis szállítmányozásban küldjük ki,
      így egy hibás alkatrész nem veszi ki hosszú
      időre a deszkát a használatból.
  - q: Milyen információkat készítsek elő az ajánlatkérés előtt?
    a: >-
      Minél jobban előkészített a brief, annál gyorsabb az ajánlat: a
      célpiac és a felhasználás, a kívánt specifikációk (méretek, felépítés,
      nyomás), a mennyiség és a
      célár, a márkázási és csomagolási igény, valamint az Ön
      indulási ütemterve. Ajánlatkérő űrlapunk pontosan
      ezt a listát gyűjti össze — a megosztása
      megtakarítja az ajánlatkérési fordulókat, és
      az első értékeléskor szilárdabb becslést ad.
  - q: Mennyi ideig tart a minták elkészítése a gyártás előtt?
    a: >-
      A prototípusmintákat a specifikáció véglegesítésétől számított 7–12 napon belül
      szállítjuk ki. Adjon hozzá időt a saját
      tesztjeire és bármely felülvizsgálati
      fordulóra — a legtöbb projekt körülbelül
      két-három hét alatt zárja le a mintázási
      szakaszt. A gyártás a minta jóváhagyása után kezdődik,
      így a mintázási szakasz az egyetlen, ahol a
      többletidő későbbi időmegtakarítást jelent.
