faqs:
  - q: Wat is SUPsfactory?
    a: >-
      SUPsfactory is een OEM- en ODM-fabrikant van SUP-planken in Qingdao, China, en biedt productontwikkeling, prototyping, productie, kwaliteitscontrole en exportproductie voor merken, distributeurs en bedrijven in de outdoorbranche.
  - q: Waar worden de producten van SUPsfactory geproduceerd?
    a: >-
      De SUP-producten worden geproduceerd in Qingdao, China.
  - q: Is SUPsfactory een OEM-fabrikant?
    a: >-
      Ja. SUPsfactory produceert opblaasbare SUP's volgens door de klant goedgekeurde specificaties, inclusief afmetingen, materialen, constructie, opdruk, accessoires en verpakking.
  - q: Biedt SUPsfactory ODM-productontwikkeling?
    a: >-
      Ja. SUPsfactory ontwikkelt SUP-producten op basis van een productbriefing, een marktbehoefte of een prestatiedoel, via engineering, prototypeontwikkeling, monstergoedkeuring en productie.
  - q: Kan ik een SUP laten produceren op basis van mijn ontwerpen?
    a: >-
      Ja. Door de klant aangeleverde tekeningen, specificaties en referentieproducten worden vóór de offerte beoordeeld op produceerbaarheid.
  - q: Kunnen jullie een SUP ontwikkelen op basis van een idee?
    a: >-
      Ja. ODM-projecten kunnen starten vanuit een concept, een marktbehoefte of een prestatiedoel.
  - q: Kan ik een prototype bestellen?
    a: >-
      Ja. Prototypemonsters kunnen vóór de serieproductie worden geproduceerd; monsters worden momenteel binnen 7–12 dagen verzonden zodra de specificatie is vastgesteld.
  - q: Wat is jullie productietijd?
    a: >-
      De standaard productietijd is 25–35 dagen na bevestigde PO en aanbetaling, afhankelijk van de projectconfiguratie; op maat gemaakte mallen voegen 15–20 dagen toe.
  - q: Wat is de minimale bestelhoeveelheid (MOQ)?
    a: >-
      De MOQ hangt af van platform, constructie, hoeveelheid, verpakking en materiaalbehoeften. Co-branding in kleine oplages start bij 5–10 stuks en pilotbatches bij 20–50 stuks; de MOQ voor serieproductie wordt bevestigd op basis van de projectconfiguratie.
  - q: Kunnen klanten fabrieksaudits uitvoeren?
    a: >-
      Ja. Klantenaudits en inspecties door derden kunnen worden georganiseerd op basis van de projectvereisten.
  - q: Waar zijn jullie bedrijf en jullie fabriek gevestigd?
    a: >-
      We zijn gevestigd in Qingdao, China. SUPsfactory is de productiedivisie van de Qingdao Vatrad Group Co., Ltd. — een
      productiefaciliteit voor opblaasbare producten van 12.500 m² in de economische ontwikkelingszone van Laixi, in
      productie sinds 2012. Verkoop en technische ondersteuning zijn wereldwijd; de
      productie vindt plaats in Qingdao, China.
  - q: Biedt Vatrad OEM/ODM-diensten voor opblaasbare watersportuitrusting?
    a: >-
      Ja. SUPsfactory (gesteund door de Qingdao Vatrad Group Co., Ltd.) biedt een volledige
      OEM- en ODM-customisatie — van 3D-blueprints en de materiaalkeuze voor de drop-stitch
      tot serieproductie voor wereldwijde merken. We verzorgen private labeling,
      op maat gemaakte verpakking en conformiteitsdocumentatie voor BSCI, CE en andere certificeringen.
  - q: Welke certificeringen heeft Vatrad voor de productie van opblaasbare watersportuitrusting?
    a: >-
      De fabriek van Vatrad beschikt over de certificeringen BSCI en ISO 9001. CE-certificering
      geldt voor modellen bestemd voor de EU-markt; de reikwijdte wordt per project bevestigd
      en varieert per doelmarkt en productconfiguratie. De conformiteitsdocumentatie voor REACH en RoHS
      is op verzoek beschikbaar.
  - q: Wat is de minimale bestelhoeveelheid (MOQ) voor opblaasbare OEM-paddleboards?
    a: >-
      De MOQ wordt bevestigd op basis van de projectconfiguratie, niet via een vast getal: elk
      project doorloopt de fasen monsterneming (1–2 stuks) en pilotbatch (20–50 stuks),
      terwijl de standaard serieproductie 90–100+ stuks per batch omvat van een
      volledige rol drop-stitch van 150 m. Co-branding in kleine oplages start bij 5–10 stuks. Raadpleeg
      onze gids MOQ en Flexible Branding voor de volledige rekenlogica.
  - q: Welke materialen gebruikt Vatrad voor de productie van opblaasbare SUP's?
    a: >-
      We gebruiken PVC van maritieme kwaliteit (0,9 mm–1,2 mm) met een kern met een
      dubbele drop-stitch laag voor de SUP's. De materialen zijn afkomstig van gecertificeerde leveranciers en worden
      vóór de productie getest op treksterkte, UV-bestendigheid
      en flexibiliteit bij lage temperaturen.
  - q: Kan Vatrad grootschalige groothandelsbestellingen verwerken voor internationale kopers?
    a: >-
      Ja. Onze fabriek van 12.500 m² produceert meer dan 120.000 stuks per jaar met een
      toegewijd team van meer dan 350 gekwalificeerde technici. We leveren in meer dan 50 landen en
      verzorgen de logistiek inclusief FOB Qingdao, CIF naar de belangrijkste havens en
      deur-tot-deur levering via onze verzendpartners.
  - q: Wat is de levertijd voor OEM-productie van opblaasbare SUP's?
    a: >-
      De standaard levertijd voor OEM-productie is 25–35 dagen na bevestigde PO en
      aanbetaling. De ontwikkeling van op maat gemaakte mallen voegt 15–20 dagen tooling toe, en
      prototypemonsters worden binnen 7–12 dagen verzonden. Spoedeisende bestellingen zijn mogelijk voor
      gevestigde partners met bevestigde materiaalvoorraden.
  - q: Levert Vatrad drop-stitch materiaal van militaire kwaliteit voor paddleboards?
    a: >-
      Ja. Onze drop-stitch kern gebruikt PVC-weefsel in maritieme specificatie met
      een treksterkte van meer dan 2000 N/5cm. Het tweelaagse laminatieproces
      handhaaft de luchtdichtheid bij 18,0 PSI met een drukval van minder dan
      0,50 PSI over 24 uur — en voldoet daarmee aan de luchtdichtheidsnorm van de fabriek.
  - q: Hoe garandeert Vatrad de luchtdichtheid en UV-bestendigheid van zijn opblaasbare producten?
    a: >-
      Elk opblaasbaar luchtsysteem wordt vóór verzending onderworpen aan een druk-luchtdichtheidstest van 24 uur bij 18,0 PSI;
      kamers met een drukval van meer dan 0,50 PSI worden
      automatisch afgekeurd. De UV-bestendigheid wordt gevalideerd via versnelde veroudering
      met drempelwaarden voor de degradatie van de treksterkte. Onze PVC-formulering bevat
      UV-stabilisatoren en antioxiderende toevoegingen voor een lange levensduur
      buitenshuis.
  - q: Kan Vatrad verpakkingsontwerp en private label branding ondersteunen?
    a: >-
      Ja. We bieden kant-en-klare private label verpakking: op maat
      ontworpen handelsdozen, lussen, gebruikershandleidingen en verzenddozen met jouw
      merkopdruk. Ons interne designteam kan een volledige visuele merkidentiteit ontwikkelen
      voor nieuwe markttoetreders — van het toepassen van het logo tot de uitpakervaring.
  - q: Accepteert Vatrad fabrieksaudits van internationale kopers?
    a: >-
      Absoluut. We verwelkomen audits ter plaatse en fabrieksaudits door derden, inclusief
      BSCI, SMETA en klantgebonden sociale nalevingsaudits. Onze
      faciliteit van 12.500 m² is auditklaar, met gedocumenteerde QC-processen, materiaaltraceerbaarheid
      en veiligheidsregistraties op de werkvloer. Virtuele fabrieksrondleidingen zijn
      beschikbaar voor de eerste kwalificatie.
  - q: Wat is de drop-stitch technologie in Vatrad SUP-planken?
    a: >-
      Drop-stitch is een textielconstructie waarbij duizenden polyestergarens
      de boven- en onderlaag van PVC met elkaar verbinden. Wanneer opgeblazen tot 12–15 PSI, houden deze
      garens de oppervlakken op een vaste afstand en vormen ze een stijve, platte structuur.
      Vatrad gebruikt fusiegelast drop-stitch — waarbij de draden
      thermisch in het PVC worden opgenomen — voor een superieure delaminatiebestendigheid in vergelijking
      met traditioneel verlijmde kernen.
  - q: Welke platforms dienen beginnende peddelaars en verhuurklanten?
    a: >-
      Kopers die vloten plannen voor verhuur, resorts of scholen starten doorgaans met brede,
      voluminieuze allround platforms die stabiel zijn voor beginners en veelzijdig voor dagelijks
      commercieel gebruik. We kunnen daarnaast meerpersoons planken
      configureren voor groepslessen. De platformselectie wordt afgestemd op jouw
      doelgroep vóór de monsterneming.
  - q: In welke wateromstandigheden kunnen commerciële SUP-programma's opereren?
    a: >-
      De planken van SUPsfactory zijn gebouwd voor gebruik op meren, rivieren en zee. De touring
      platforms verwerken de deining, en alle planken gebruiken PVC van maritieme kwaliteit dat
      bestand is tegen corrosie. Voor vloten in zout water raden we de
      gebruikelijke procedure van spoelen met zoet water tussen de ritten aan en nemen we die op in de
      operatorhandleiding die bij de commerciële kits wordt geleverd.
  - q: Leveren jullie pompen en ophlaasaccessoires voor commerciële kits?
    a: >-
      Ja. Commerciële kits bevatten dubbelcilinder handpompen, met
      opties voor elektrische pompen voor resorts en verhuurbedrijven die meerdere
      planken per dag beheren. De selectie van pomp, peddel, leash, vin, rugzak en reparatieset wordt
      bevestigd als onderdeel van de accessoireconfiguratie van elk project.
  - q: Hoe worden de planken verpakt voor verzending en commerciële levering?
    a: >-
      Serieproductie wordt verzonden met vacuümverpakking om het volumetrische gewicht met
      50–60 % te verminderen. Voor commerciële programma's leveren we bedrukte cartons, handleidingen,
      barcodes en etikettering van de cartons afhankelijk van de markt, en we kunnen
      complete kits apart verpakken zodat elke doos met dezelfde set accessoires aankomt.
  - q: Welke gewichtsklasse aan peddelaars ondersteunen jullie planken?
    a: >-
      De allround platforms ondersteunen tot 220 lbs; de touring- en yogaplatforms
      ondersteunen tot 250 lbs, met varianten met een hogere capaciteit in de grotere planken. Het gewicht van de peddelaar, de constructie en de drukwaarden
      worden vermeld in het technische gegevensblad van elk platform
      vóór jouw goedkeuring van een productieserie.
  - q: Wat bevat een complete commerciële kit?
    a: >-
      Een complete kit bevat doorgaans de plank, de reistas, de dubbelcilinder
      handpomp, de verwijderbare vin, de coil-leash en de reparatieset, met een optionele elektrische
      pomp als upgrade. De kitinhoud wordt vastgelegd in de door de klant goedgekeurde BOM,
      zodat monsters en serieproductie exact overeenkomen.
  - q: Kunnen jullie planken, accessoires en verpakking bundelen in één programma?
    a: >-
      Ja. Multi-SKU-programma's dekken planken, accessoires en commerciële verpakking
      onder één enkel fabriekscontract — gedeelde accessoirekits verkleinen de voorraad per SKU,
      een designsysteem houdt de branding consistent en één
      referentie voor kwaliteit beheert de garantieaanvragen. Zo beheren onze distributeurs en
      handelspartners complete SUP-assortimenten.
  - q: Wat is het verschil tussen OEM, ODM en private label?
    a: >-
      OEM betekent dat we produceren volgens jouw goedgekeurde specificatie: jouw tekeningen,
      afmetingen, materialen en verpakking. Het ontwerp en het intellectuele
      eigendom blijven van jou. ODM betekent dat ons ontwikkelingsteam de plank ontwerpt op basis van jouw briefing
      — of het nu een marktconcept, een prestatiedoel of de aanpassing van een bewezen platform
      is — en jij keurt hem goed vóór de productie. Private label betekent jouw
      merk, jouw opdruk en jouw verpakking op een bestaand, gevalideerd platform, zonder
      constructieve wijzigingen. De meeste projecten bevinden zich tussen deze modi in, en we berekenen
      de configuratie op basis van hoeveel van de productontwikkeling jij wilt bezitten.
  - q: Wat kost een prototypemonster en kan de vergoeding op de bestelling worden verrekend?
    a: >-
      De monsterprijs volgt de projectconfiguratie: afmetingen, constructie,
      opdruk en verpakking beïnvloeden allemaal de offerte. Voor projecten die doorgaan naar de
      serieproductie wordt de monstervergoeding doorgaans verrekend op de eerste
      productiebestelling — de verrekeningsvoorwaarden worden in de fase van de
      offerte schriftelijk bevestigd, zodat er later geen verrassingen zijn.
  - q: Hoeveel opblaasbare paddleboards passen er in een 20-ft container?
    a: >-
      Met standaard 11-ft planken met vacuümverpakking en accessoirekits bevat een 20-ft container
      doorgaans 150–200 complete sets — het exacte aantal hangt af van het
      verpakkingsontwerp, de accessoiremix en de grootte van de cartons. Ons
      verpakkingsteam berekent het laadplan op basis van jouw werkelijke materialenlijst, zodat
      het aantal waarmee je plant overeenkomt met het aantal dat wordt verzonden.
  - q: Wat bevatten jullie groothandelsaanbiedingen — FOB of CIF?
    a: >-
      De offertes zijn gedetailleerd: product, standaardverpakking en transport volgens
      de gekozen Incoterm. FOB Qingdao is de standaardbasis, met CIF naar de belangrijkste havens
      en deur-tot-deur levering beschikbaar via onze verzendpartners.
      Elke offerte specificeert de exacte reikwijdte van wat inbegrepen is, zodat je
      geen appels met peren hoeft te vergelijken tussen verschillende leveranciers.
  - q: Factureren jullie gereedschaps- of malrekosten voor op maat gemaakte planken?
    a: >-
      De grafische instellingen en drukplaten zijn voordelig en herbruikbaar; het structurele
      gereedschap (nieuwe mallen, op maat gemaakte rails of speciale constructies) wordt in de fase van de
      offerte gedetailleerd. Waar gereedschap is voorzien, wordt de kosten doorgaans afgeschreven over de eerste
      productiecyclus, in plaats van als eenmalige verrassing te worden aangerekend.
  - q: Welke betalingsvoorwaarden hanteren jullie voor productiebestellingen?
    a: >-
      De standaardvoorwaarden voorzien in een aanbetaling om de productie te starten, met het saldo verschuldigd
      vóór verzending. Het percentage van de aanbetaling en de vervaldatum van het saldo worden per
      bestelling overeengekomen en in het contract vastgelegd. Gevestigde partners met een constante orderstroom
      kunnen ruimere voorwaarden bespreken — we verkiezen een paar eerlijke, heldere voorwaarden
      boven ingewikkelde financiële constructies.
  - q: Welke garantie bieden jullie voor grote volumebestellingen?
    a: >-
      Elke plank wordt vóór verzending onderworpen aan een druk-luchtdichtheidstest van 24 uur bij 18,0 PSI,
      en de garantievoorwaarden worden in elk bestelcontract vastgelegd — ze dekken
      fabricagefouten zoals loslatingen, bezwijkende naden en lekkende
      ventielen, en sluiten schade door gebruik uit. De garantieduur en de claimprocedure
      worden bevestigd in de inkooporderbevestiging, niet pas later ontdekt.
  - q: Wat gebeurt er als de planken beschadigd of met fabricagefouten aankomen?
    a: >-
      Meld het probleem binnen de overeengekomen termijn (doorgaans 7–15 dagen na
      aankomst) met fotobewijs of videobewijs. We verifiëren op basis van de inspectieprotocollen bij
      verzending die voor jouw partij zijn opgesteld en verhelpen het vervolgens met een herproductie, een vervanging of een tegoedbon.
      De gedocumenteerde QC-foto's van jouw goederen maken alles snel en
      correct voor beide partijen.
  - q: Hoe worden op maat gemaakte opdrukken goedgekeurd vóór de productie?
    a: >-
      De opdrukken doorlopen een gecontroleerde goedkeuringsketen: digitale mock-up, afgedrukte proof,
      verificatie van het eerste artikel op de productieplank en daarna serieproductie.
      Elke stap wordt gecontroleerd tegen jouw ondertekende opdrukken, en daarom
      komen de printkleuren, de EVA-layout en de logoplaatsing overeen met jouw merkbestand wanneer de planken arriveren.
  - q: Welke reserveonderdelen leveren jullie voor commerciële vloten?
    a: >-
      Vlootexploitanten kunnen reserveonderdelen bestellen samen met hun planken of bij
      nabestellingen: reserveventielen, reparatiesets (PVC-pleisters en
      lijm), vinbehuizingen en vinnen, naast de meest vervangen accessoires. De onderdelen
      worden verzonden met de productie of als kleine leveringen, zodat een defect onderdeel
      nooit een hele plank lang uit gebruik houdt.
  - q: Welke informatie moet ik voorbereiden vóór ik een offerte aanvraag?
    a: >-
      Hoe beter de briefing, hoe sneller de offerte: doelmarkt en gebruik,
      gewenste specificaties (afmetingen, constructie, druk), hoeveelheid en
      streefprijs, branding- en verpakkingsbehoeften en jouw lanceringsplanning. Ons
      aanvraagformulier vraagt precies om deze lijst — als je deze deelt, bespaar je offerterondes
      en krijg je al bij de eerste stap een degelijkere schatting.
  - q: Hoeveel tijd kost de monsterproductie vóór de productie?
    a: >-
      Prototypemonsters worden binnen 7–12 dagen verzonden zodra de specificatie is vastgesteld.
      Tel daar de verificatietijd voor jouw testen en eventuele
      revisierondes bij op — de meeste projecten voltooien de monsterproductie in ongeveer twee tot drie
      weken. De productie start na de monstergoedkeuring, en daarom is de monsterfase
      het moment waarop extra zorg zich terugbetaalt in tijd die later wordt bespaard.