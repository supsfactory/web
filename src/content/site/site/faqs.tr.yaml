faqs:
  - q: iSupfactory kimdir ve neler üretir?
    a: >-
      iSupfactory, Çin'in Qingdao kentinde yer alan bir SUP OEM ve ODM üreticisidir; markalar, distribütörler ve outdoor işletmeleri için ürün geliştirme, prototip geliştirme, üretim, kalite kontrol ve ihracat üretimi hizmeti sunar.
  - q: iSupfactory ürünleri nerede üretiliyor?
    a: >-
      SUP ürünleri Çin'in Qingdao kentinde üretilmektedir.
  - q: iSupfactory bir OEM üreticisi mi?
    a: >-
      Evet. iSupfactory; ölçüler, malzemeler, yapı, görsel tasarım, aksesuarlar ve ambalaj dahil olmak üzere müşteri tarafından onaylanan teknik şartnamelere uygun şişme SUP'ler üretir.
  - q: iSupfactory ODM ürün geliştirme hizmeti veriyor mu?
    a: >-
      Evet. iSupfactory, ürün brifi, pazar gereksinimi veya performans hedefi üzerinden mühendislik, prototip geliştirme, numune onayı ve üretim aşamalarına kadar SUP ürünlerini geliştirir.
  - q: Kendi çizimlerime göre bir SUP ürettirebilir miyim?
    a: >-
      Evet. Müşteri çizimleri, teknik şartnameler ve referans ürünler, teklif hazırlanmadan önce üretilebilirlik açısından incelenir.
  - q: Bir fikirden bir SUP geliştirebilir misiniz?
    a: >-
      Evet. ODM projeleri bir konseptten, pazar gereksiniminden veya performans hedefinden başlayabilir.
  - q: Prototip sipariş edebilir miyim?
    a: >-
      Evet. Seri üretim öncesinde prototip numune üretilebilir; teknik şartname kesinleştikten sonra numuneler şu anda 7–12 gün içinde sevk edilmektedir.
  - q: Üretim teslim süreniz nedir?
    a: >-
      Standart üretim teslim süresi, onaylanmış sipariş ve depozitodan itibaren 25–35 gündür ve proje yapılandırmasına bağlıdır; özel kalıp işlemi buna 15–20 gün ekler.
  - q: Minimum sipariş miktarı (MOQ) nedir?
    a: >-
      MOQ; platforma, yapıya, miktara, ambalaja ve malzeme gereksinimlerine bağlıdır. Küçük partili ortak markalama 5–10 adetle, pilot partiler ise 20–50 adetle başlar; seri üretim MOQ'su proje yapılandırmasıyla kesinleştirilir.
  - q: Alıcılar fabrikayı denetleyebilir mi?
    a: >-
      Evet. Proje gereksinimlerine bağlı olarak alıcı denetimleri ve üçüncü taraf incelemeleri düzenlenebilir.
  - q: Şirketiniz ve fabrikanız nerede bulunuyor?
    a: >-
      Çin'in Qingdao kentindeyiz. iSupfactory, Laixi Economic
      Development Zone'da yer alan ve 2012'den bu yana üretim yapan
      12,500 m²'lik bir şişme ürün üretim tesisi olan Qingdao Vatrad
      Group Co., Ltd.'nin üretim bölümüdür. Satış ve teknik destek
      küresel çapta, üretim ise Çin'in Qingdao kentindedir.
  - q: Vatrad, şişme su sporları ekipmanı için OEM/ODM hizmetleri veriyor mu?
    a: >-
      Evet. iSupfactory (Qingdao Vatrad Group Co., Ltd. desteğiyle), küresel
      markalar için 3D taslaklar ve drop-stitch malzeme seçiminden toplu
      üretime kadar uçtan uca OEM ve ODM özelleştirme sunar. Özel
      etiketleme, özel ambalaj ve BSCI, CE ve diğer sertifikalara ilişkin
      uygunluk belgelerini biz üstleniriz.
  - q: Vatrad'ın şişme su sporları ekipmanı üretiminde hangi sertifikaları vardır?
    a: >-
      Vatrad fabrikası BSCI ve ISO 9001 sertifikalarına sahiptir. CE sertifikası
      AB pazarlarına yönelik modeller için geçerlidir; kapsam proje bazında
      onaylanır ve hedef pazara ile ürün yapılandırmasına göre değişir. REACH ve
      RoHS uygunluk belgeleri talep üzerine sunulabilir.
  - q: OEM şişme paddle boardlar için minimum sipariş miktarı (MOQ) nedir?
    a: >-
      MOQ sabit bir sayı değil, proje yapılandırmasıyla belirlenir: her proje
      numune (1–2 adet) ve pilot (20–50 adet) aşamalarından geçer; standart
      seri üretim ise tam 150 m uzunluğundaki drop-stitch rulosundan parti
      başına 90–100+ adet olarak yapılır. Küçük partili ortak markalama 5–10
      adetle başlar. Hesaplama mantığının tamamı için MOQ ve Esnek Markalama
      Rehberimizi inceleyin.
  - q: Vatrad, şişme SUP üretiminde hangi malzemeleri kullanıyor?
    a: >-
      SUP'ler için çift katmanlı drop-stitch çekirdeğe sahip denizcilik sınıfı
      PVC (0,9 mm–1,2 mm) kullanıyoruz. Malzemeler sertifikalı tedarikçilerden
      temin edilir ve üretim öncesinde çekme dayanımı, UV direnci ve düşük
      sıcaklık esnekliği açısından test edilir.
  - q: Vatrad, uluslararası alıcılar için yüksek hacimli toptan siparişleri karşılayabiliyor mu?
    a: >-
      Evet. 12,500 m²'lik fabrikamız, 350'den fazla kalifiye işçiden oluşan
      özel bir ekiple yılda 120.000'den fazla adet üretir. 50'den fazla ülkeye
      sevkiyat yapıyor ve FOB Qingdao, ana limanlara CIF ile ve nakliye iş
      ortaklarımız üzerinden kapıdan kapıya teslimat dahil lojistiği yönetiyoruz.
  - q: OEM şişme SUP üretiminde teslim süresi nedir?
    a: >-
      Standart OEM üretim teslim süresi, onaylanmış sipariş ve depozitodan
      itibaren 25–35 gündür. Özel kalıp geliştirme, kalıp işlemi için 15–20 gün
      ekler ve prototip numuneler 7–12 gün içinde sevk edilir. Malzeme stoğu
      teyit edilmiş köklü iş ortaklarımız için acil siparişler mevcuttur.
  - q: Vatrad, paddle boardlar için askeri sınıf drop-stitch malzeme tedarik ediyor mu?
    a: >-
      Evet. Drop-stitch çekirdeğimiz, 2000 N/5cm üzerinde çekme dayanımına
      sahip denizcilik sınıfı PVC kumaş kullanır. Çift katmanlı laminasyon
      süreci, 24 saat boyunca 0,50 PSI'nin altında kalan basınç düşümüyle
      18.0 PSI'de hava tutma performansı sağlar — bu da fabrikanın hava tutma
      bütünlüğü standardını karşılar.
  - q: Vatrad, şişme ürünlerinin hava sızdırmazlığını ve UV dayanımını nasıl güvence altına alıyor?
    a: >-
      Her şişme boru, sevkiyat öncesinde 18.0 PSI'da 24 saatlik basınç tutma
      testinden geçer; 0,50 PSI'yı aşan basınç düşümü gösteren odalar otomatik
      olarak elenir. UV direnci, çekme dayanımı bozulma eşikleriyle hızlandırılmış
      hava koşulları testiyle doğrulanır. PVC bileşimimiz, uzun süreli dış mekan
      dayanıklılığı için UV stabilizatörler ve oksitleyici önleyici katkılar içerir.
  - q: Vatrad ambalaj tasarımı ve özel etiket markalamasında yardımcı oluyor mu?
    a: >-
      Evet. Markanızın görsel dosyalarıyla hazırlanmış, tam kapsamlı özel etiket
      ambalajı sunuyoruz: özel tasarım perakende kutuları, askı etiketleri,
      kullanım kılavuzları ve sevkiyat kutuları. Kendi tasarım ekibimiz, yeni
      pazara giren işletmeler için logo uygulamasından açılış deneyimine kadar
      eksiksiz bir marka görsel kimliği geliştirebilir.
  - q: Vatrad, uluslararası alıcılardan gelen fabrika denetimlerini kabul ediyor mu?
    a: >-
      Kesinlikle. BSCI, SMETA ve müşteriye özgü sosyal uyum denetimleri dahil
      yerinde ve üçüncü taraf fabrika denetimlerini memnuniyetle karşılıyoruz.
      12,500 m²'lik tesisimiz denetime hazırdır ve belgelenmiş kalite kontrol
      süreçleri, malzeme izlenebilirliği ile işçi sağlığı ve güvenliği
      kayıtlarına sahiptir. İlk nitelendirme amacıyla sanal fabrika turları
      düzenlenebilir.
  - q: Vatrad SUP levhalarında hangi drop-stitch teknolojisi kullanılıyor?
    a: >-
      Drop-stitch, binlerce polyester ipliğin üst ve alt PVC katmanlarını
      birbirine bağladığı bir kumaş yapısıdır. 12–15 PSI'ya şişirildiğinde bu
      iplikler panelleri sabit bir mesafede tutarak sert ve düz bir platform
      oluşturur. Vatrad, geleneksel yapıştırmalı çekirdeklere kıyasla çok daha
      üstün ayrışma (delaminasyon) direnci için ipliklerin PVC'ye termal olarak
      bağlandığı füzyon laminasyonlu drop-stitch kullanır.
  - q: İlk kez SUP kullananlar ve kiralama misafirleri hangi platformlara ihtiyaç duyar?
    a: >-
      Kiralama, tatil sitesi veya okul filosu planlayan alıcılar genellikle ilk
      kez deneyenler için stabil ve günlük ticari kullanıma uygun çok yönlü,
      geniş ve yüksek hacimli platformlarla başlar. Grup dersleri için çok
      kişilik levhaları da yapılandırabiliriz. Platform seçimi, numune alınmadan
      önce hedeflenen kullanıcı kitlesine göre değerlendirilir.
  - q: Ticari SUP programları hangi su koşullarında faaliyet gösterebilir?
    a: >-
      iSupfactory levhaları okyanus, göl ve nehir kullanımı için üretilmiştir.
      Tur platformları kıyı dalgalarına dayanır ve tüm levhalar tuzlu su
      korozyonuna dayanıklı denizcilik sınıfı PVC kullanır. Tuzlu su filoları
      için kullanımlar arasında standart tatlı su ile durulama rutinini öneriyor ve
      bunu ticari kitlerle birlikte verilen operatör kılavuzuna ekliyoruz.
  - q: Ticari kitler için pompa ve şişirme aksesuarları sağlıyor musunuz?
    a: >-
      Evet. Ticari kitler çift yönlü el pompaları içerir; günde birden fazla
      levha yöneten tatil sitesi ve kiralama işletmeleri için elektrikli pompa
      seçenekleri sunulur. Pompa, kürek, emniyet ipi (leash), palet, sırt çantası
      ve onarım kiti seçimleri, her projenin aksesuar yapılandırmasının bir
      parçası olarak kesinleştirilir.
  - q: Levhalar sevkiyat ve perakende teslimat için nasıl paketleniyor?
    a: >-
      Seri üretim, hacim ağırlığını %50–60 azaltmak için vakumlu ambalajda sevk
      edilir. Perakende programları için markalı kutular, kullanım kılavuzları,
      pazar bazında barkod ve kutu işaretlemeleri sağlanır; ayrıca ayraçlı
      ambalajlanmış tam kitler hazırlanabilir, böylece her kutu aynı aksesuar
      setiyle teslim edilir.
  - q: Levhalarınız hangi kullanıcı ağırlığı aralığını destekliyor?
    a: >-
      Çok yönlü platformlar 220 lbs'a kadar, tur ve yoga platformları ise
      250 lbs'a kadar yük taşır; daha büyük levhalarda daha yüksek kapasite
      seçenekleri sunulur. Kullanıcı ağırlığı, yapı ve basınç değerleri, seri
      üretime karar vermeden önce teknik veri sayfasında platform bazında
      belirtilir.
  - q: Eksiksiz bir ticari kit neleri içerir?
    a: >-
      Eksiksiz bir kit genellikle levhayı, seyahat sırt çantasını, çift yönlü el
      pompasını, çıkarılabilir paleti, yaylı emniyet ipini ve onarım kitini
      içerir; kürek ve elektrikli pompa yükseltmeleri ise opsiyoneldir. Kit
      içeriği, numune ile seri üretimin birebir aynı olması için müşteri onaylı
      BOM'da kesinleştirilir.
  - q: Levhaları, aksesuarları ve ambalajı tek bir program altında birleştirebilir misiniz?
    a: >-
      Evet. Çoklu SKU'lu programlar, levhaları, aksesuarları ve perakende
      ambalajını tek bir fabrika sözleşmesi altında kapsar — ortak aksesuar
      kitleri SKU başına stok maliyetini düşürür, tek bir tasarım sistemi marka
      bütünlüğünü korur ve tek bir kalite sorumlusu garanti taleplerini yönetir.
      Distribütörlerimiz ve perakende iş ortaklarımız eksiksiz SUP serilerini bu
      şekilde yürütmektedir.
  - q: OEM, ODM ve özel etiket arasındaki fark nedir?
    a: >-
      OEM, onayladığınız teknik şartnameye göre üretim yapmamız anlamına
      gelir — sizin çizimleriniz, ölçüleriniz, malzemeleriniz ve ambalajınız.
      Tasarımın ve fikri mülkiyetin sahibi sizsiniz. ODM, mühendislik ekibimizin
      levhayı sizin brifiniz üzerinden geliştirmesi anlamına gelir — ister bir
      pazar konsepti, ister bir performans hedefi, ister kanıtlanmış bir platformun
      uyarlanması olsun — ve üretim öncesinde onayınızı alırız. Özel etiket
      (private label) ise yapısal değişiklik yapılmadan onaylanmış mevcut bir
      platform üzerinde sizin markanız, grafikleriniz ve ambalajınız anlamına
      gelir. Projelerin çoğu bu modellerin arasında kalır ve ürün tasarımının
      ne kadarına sahip olmak istediğinize uygun yapılandırmayı teklif ederiz.
  - q: Prototip numunenin maliyeti nedir ve ücret siparişe mahsup edilebilir mi?
    a: >-
      Numune fiyatlandırması proje yapılandırmasına göre belirlenir: ölçü, yapı,
      görsel tasarım ve ambalaj teklifi doğrudan etkiler. Seri üretime geçen
      projelerde numune ücreti genellikle ilk üretim siparişine mahsup edilir —
      mahsup koşulları, sonradan sürpriz yaşanmaması için teklif aşamasında yazılı
      olarak onaylanır.
  - q: 20 ft'lik bir konteynere kaç şişme paddle board sığar?
    a: >-
      Standart vakumlu ambalajlanmış 11 ft levhalar aksesuar kitleriyle birlikte
      bir 20 ft konteynere genellikle 150–200 tam set sığar — kesin sayı ambalaj
      tasarımına, aksesuar bileşimine ve kutu ölçüsüne bağlıdır. Ambalaj
      ekibimiz yükleme planını gerçek malzeme listenizden hesaplar; böylece
      plan yaptığınız sayı sevk edilen sayıdır.
  - q: Toptan teklifleriniz neleri kapsıyor — FOB mı, CIF mi?
    a: >-
      Teklifler kalem kalem hazırlanır: seçtiğiniz teslim koşuluna göre ürün,
      standart ambalaj ve navlun. Varsayılan esas FOB Qingdao'dur; ana limanlara
      CIF ile ve nakliye iş ortaklarımız üzerinden kapıdan kapıya teslimat
      seçenekleri sunulur. Her teklif, kapsanan içeriğin tam kapsamını
      belirttiği için farklı tedarikçiler arasında elma ile portakal
      karşılaştırması yapmazsınız.
  - q: Özel levhalar için kalıp veya form ücreti alıyor musunuz?
    a: >-
      Grafik hazırlığı ve baskı kalıpları düşük maliyetlidir ve yeniden
      kullanılabilir; yapısal kalıp işlemi (yeni formlar, özel hatlar veya
      benzersiz yapılar) teklif aşamasında kalem kalem fiyatlandırılır. Kalıp
      işlemi gerektiğinde maliyet genellikle tek seferlik bir sürpriz olarak
      değil, ilk üretim partisi boyunca amortize edilir.
  - q: Üretim siparişlerine hangi ödeme koşullarını uyguluyorsunuz?
    a: >-
      Standart koşullar, üretimi kilitlemek için alınan bir depozito ve sevkiyattan
      önce ödenen bakiyedir. Depozito oranı ve bakiye zamanlaması her sipariş
      için ayrıca kararlaştırılır ve sözleşmede belirtilir. Düzenli sipariş
      geçmişi olan köklü iş ortakları vadeli koşulları görüşebilir — karmaşık
      finansman yapıları yerine birkaç açık ve adil koşulu tercih ederiz.
  - q: Toptan siparişlerde hangi garantiyi veriyorsunuz?
    a: >-
      Her levha sevkiyattan önce 18.0 PSI'da 24 saatlik basınç tutma testinden
      geçer ve garanti koşulları her sipariş sözleşmesine yazılır — bu koşullar
      ayrışma (delaminasyon), dikiş hatası ve supap sızıntısı gibi üretim
      kusurlarını kapsar, kullanımdan kaynaklanan hasarları kapsamaz. Garanti
      süresi ve talep prosedürü, sonradan öğrenilmek yerine satın alma
      siparişinde kesinleştirilir.
  - q: Levhalar hasarlı veya üretim kusurlu gelirse ne olur?
    a: >-
      Sorunu, ürünlerin varışından itibaren kararlaştırılan süre içinde
      (genellikle 7–15 gün) fotoğraf veya video kanıtıyla bildirin. Partiniz
      için tutulan sevkiyat öncesi kontrol kayıtlarına göre değerlendirme yapar,
      ardından yeniden işleme, değiştirme veya mahsup uygularız. Stokunuzun
      belgelenmiş kalite kontrol fotoğrafları bu süreci iki taraf için de hızlı
      ve adil kılar.
  - q: Özel görsel tasarım üretim öncesinde nasıl onaylanıyor?
    a: >-
      Grafikler kontrollü bir onay zincirinden geçer: dijital maket, basılı
      prova, üretim levhası üzerinde ilk ürün kontrolü ve ardından parti
      üretimi. Her adım, imzaladığınız grafik dosyasına göre kontrol edilir;
      bu nedenle levhalar elinize ulaştığında baskı renkleri, EVA yerleşimi ve
      logo konumu marka dosyanızla eşleşir.
  - q: Ticari filolar için hangi yedek parçaları sağlıyorsunuz?
    a: >-
      Filo işletmeleri, yedek parçaları levhalarıyla birlikte veya yeniden
      sipariş sırasında talep edebilir: yedek supaplar, onarım kitleri (PVC
      yamaları ve yapıştırıcı), palet yuvaları ve paletler ile en sık değiştirilen
      aksesuarlar. Yedek parçalar üretimle birlikte veya küçük sevkiyatlar olarak
      gönderilir; böylece arızalı bir bileşen bir levhanın uzun süre hizmet
      dışı kalmasına yol açmaz.
  - q: Teklif istemeden önce hangi bilgileri hazırlamalıyım?
    a: >-
      Brif ne kadar iyi hazırlanmışsa, teklif o kadar hızlıdır: hedef pazar ve
      kullanım alanı, istenen teknik özellikler (ölçü, yapı, basınç), miktar ve
      hedef fiyat, markalama ve ambalaj ihtiyaçları ile lansman takviminiz.
      Teklif talep formumuz tam olarak bu listeyi toplar — paylaşmanız teklif
      turlarından tasarruf sağlar ve ilk adımda daha sağlam bir tahmin almanızı
      sağlar.
  - q: Üretim öncesi numune süreci ne kadar sürer?
    a: >-
      Prototip numuneler, teknik şartname kesinleştikten sonra 7–12 gün içinde
      sevk edilir. Kendi testleriniz ve olası bir revizyon turu için gözden
      geçirme süresini buna ekleyin — projelerin çoğu numune sürecini yaklaşık
      iki ila üç haftada tamamlar. Üretim numune onayından sonra başladığı için
      numune aşaması, daha sonra zaman kazandıran tek aşamadır.
