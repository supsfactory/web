faqs:
  - q: Cine este iSupfactory?
    a: >-
      iSupfactory este un producător OEM și ODM de plăci SUP cu sediul în Qingdao, China, care oferă dezvoltare de produs, prototipare, producție, control al calității și producție pentru export către branduri, distribuitori și companii de outdoor.
  - q: Unde sunt fabricate produsele iSupfactory?
    a: >-
      Produsele SUP sunt fabricate în Qingdao, China.
  - q: Este iSupfactory un producător OEM?
    a: >-
      Da. iSupfactory produce plăci SUP gonflabile conform specificațiilor aprobate de client, inclusiv dimensiunile, materialele, construcția, grafica, accesoriile și ambalajele.
  - q: Oferă iSupfactory servicii de dezvoltare de produs ODM?
    a: >-
      Da. iSupfactory dezvoltă produse SUP pornind de la un brief de produs, de la o cerință de piață sau de la o țintă de performanță, prin inginerie, dezvoltarea prototipului, aprobarea mostrei și producție.
  - q: Pot fabrica o placă SUP după desenele proprii?
    a: >-
      Da. Desenele, specificațiile și produsele de referință ale clientului sunt analizate din punct de vedere al manufacturabilității înainte de emiterea ofertei.
  - q: Puteți dezvolta o placă SUP pornind de la o idee?
    a: >-
      Da. Proiectele ODM pot porni de la un concept, de la o cerință de piață sau de la o țintă de performanță.
  - q: Pot comanda un prototip?
    a: >-
      Da. Mostrele de prototip pot fi produse înainte de producția de serie; în prezent, mostrele se expediază în 7–12 zile de la definitivarea specificațiilor.
  - q: Care este termenul dumneavoastră de producție?
    a: >-
      Termenul standard de producție este de 25–35 de zile de la confirmarea comenzii și a avansului, în funcție de configurația proiectului; uneltele personalizate adaugă 15–20 de zile.
  - q: Care este cantitatea minimă de comandă (MOQ)?
    a: >-
      MOQ depinde de platformă, de construcție, de cantitate, de ambalaj și de cerințele de material. Co-brandingul în loturi mici începe de la 5–10 bucăți, iar loturile pilot de la 20–50 de bucăți; MOQ pentru producția de serie este confirmat în funcție de configurația proiectului.
  - q: Pot cumpărătorii să auditeze fabrica?
    a: >-
      Da. Auditurile cumpărătorilor și inspecțiile unor terți pot fi organizate în funcție de cerințele proiectului.
  - q: Unde este situată compania și fabrica dumneavoastră?
    a: >-
      Suntem cu sediul în Qingdao, China. iSupfactory este divizia de producție a Qingdao Vatrad Group Co., Ltd. — o
      fabrică de produse gonflabile de 12,500 m² în Laixi Economic
      Development Zone, care produce din 2012. Vânzările și suportul tehnic
      sunt globale; producția se desfășoară în Qingdao, China.
  - q: Oferă Vatrad servicii OEM/ODM pentru echipamente gonflabile pentru sporturi acvatice?
    a: >-
      Da. iSupfactory (cu sprijinul Qingdao Vatrad Group Co., Ltd.) oferă personalizare
      OEM și ODM de amploare — de la planșe 3D și selecția materialelor drop-stitch
      până la producția de masă pentru branduri globale. Ne ocupăm de etichetare
      privată, de ambalaje personalizate și de documentația de conformitate pentru BSCI,
      CE și alte certificări.
  - q: Ce certificări deține Vatrad pentru producția de echipamente gonflabile pentru sporturi acvatice?
    a: >-
      Fabrica Vatrad deține certificările BSCI și ISO 9001. Certificarea CE se aplică
      modelelor destinate piețelor din UE; domeniul este confirmat pentru fiecare
      proiect și variază în funcție de piața țintă și de configurația produsului. Documentația
      de conformitate REACH și RoHS este disponibilă la cerere.
  - q: Care este cantitatea minimă de comandă (MOQ) pentru plăci SUP gonflabile OEM?
    a: >-
      MOQ este confirmat în funcție de configurația proiectului, nu printr-un număr
      fix: fiecare proiect parcurge etapele de mostră (1–2 bucăți) și de pilot
      (20–50 de bucăți), iar producția standard de serie rulează cu 90–100+ bucăți pe lot
      dintr-o rolă drop-stitch completă de 150 m. Co-brandingul în loturi mici începe de
      la 5–10 bucăți. Pentru logica completă de calcul, consultați Ghidul nostru
      MOQ și branding flexibil.
  - q: Ce materiale folosește Vatrad pentru producția de plăci SUP gonflabile?
    a: >-
      Folosim PVC de clasă marină (0.9 mm–1.2 mm) cu nucleu drop-stitch dublu
      strat pentru plăcile SUP. Materialele sunt provenite de la furnizori certificați și
      sunt testate la rezistență la tracțiune, la rezistență la UV și la flexibilitate
      la temperaturi scăzute înainte de producție.
  - q: Poate Vatrad gestiona comenzi en-gros cu volume mari pentru cumpărători internaționali?
    a: >-
      Da. Fabrica noastră de 12,500 m² produce peste 120.000 de bucăți anual, cu o
      echipă dedicată de 350+ lucrători calificați. Expediem în peste 50 de țări și
      gestionăm logistica, inclusiv FOB Qingdao, CIF către porturi principale și
      livrare door-to-door prin partenerii noștri de transport.
  - q: Care este termenul de producție pentru plăcile SUP gonflabile OEM?
    a: >-
      Termenul standard de producție OEM este de 25–35 de zile de la confirmarea comenzii
      și a avansului. Dezvoltarea formelor personalizate adaugă 15–20 de zile pentru
      unelte, iar mostrele de prototip se expediază în 7–12 zile. Există comenzi
      urgente pentru partenerii stabili cu stoc de material confirmat.
  - q: Furnizează Vatrad material drop-stitch de grad militar pentru plăcile SUP?
    a: >-
      Da. Nucleul nostru drop-stitch folosește țesătură PVC cu specificații marine, cu o
      rezistență la tracțiune care depășește 2000 N/5cm. Procesul de laminare
      dublă strat asigură retenția aerului la 18.0 PSI, cu o cădere de presiune sub
      0.50 PSI pe 24 de ore — respectând standardul de integritate a retenției de aer
      al fabricii.
  - q: Cum asigură Vatrad etanșitatea și rezistența la UV a produselor sale gonflabile?
    a: >-
      Fiecare tub gonflabil este supus înainte de expediție unui test de menținere a
      presiunii de 24 de ore la 18.0 PSI; camerele care depășesc o cădere de presiune
      de 0.50 PSI sunt respinse automat. Rezistența la UV este validată prin îmbătrânire
      accelerată, cu praguri de degradare a rezistenței la tracțiune. Compusul nostru PVC
      include stabilizatori UV și aditivi antioxidanți pentru durabilitate pe termen
      lung în exterior.
  - q: Poate Vatrad ajuta cu designul ambalajelor și cu brandingul de etichetă privată?
    a: >-
      Da. Oferim ambalaje private complete: cutii de retail personalizate, etichete
      suspendate, manuale de instrucțiuni și cutii de transport cu grafica brandului
      dumneavoastră. Echipa noastră de design din fabrică poate dezvolta o identitate
      vizuală completă de brand pentru companiile care intră pe piețe noi — de la
      aplicarea logo-ului până la experiența de deschidere a ambalajului.
  - q: Acceptă Vatrad auditări ale fabricii din partea cumpărătorilor internaționali?
    a: >-
      Absolut. Acceptăm cu plăcere auditări ale fabricii, atât la fața locului, cât și
      din partea unor terți, inclusiv BSCI, SMETA și inspecții specifice clientului de conformitate
      socială. Instalația noastră de 12,500 m² este pregătită pentru auditare, cu procese
      documentate de control al calității, trasabilitatea materialelor și înregistrări
      privind sănătatea și securitatea lucrătorilor. Tururile virtuale ale fabricii
      sunt disponibile pentru etapa inițială de calificare.
  - q: Ce tehnologie drop-stitch este utilizată în plăcile SUP Vatrad?
    a: >-
      Drop-stitch este o construcție de țesătură în care mii de fire de poliester leagă
      stratul superior de cel inferior de PVC. Umflate la 12–15 PSI, aceste
      fire trag panourile la o distanță fixă, creând o platformă rigidă și
      plată. Vatrad folosește drop-stitch laminat prin fuziune — fire legate termic
      în PVC — pentru o rezistență superioară la delaminare față de nucleele
      tradiționale lipite cu adeziv.
  - q: Ce platforme au nevoie vâslașii începători și oaspeții de închiriere?
    a: >-
      Cumpărătorii care planifică flotele pentru închiriere, pentru stațiuni turistice
      sau pentru școli încep de obicei cu platforme all-around late și cu volum mare,
      stabile pentru începători și versatile pentru utilizare comercială zilnică. Putem
      configura și plăci pentru mai multe persoane, pentru lecțiile de grup. Selecția
      platformei este evaluată în raport cu utilizatorii vostru înainte de realizarea
      mostrelor.
  - q: În ce condiții de apă pot funcționa programele SUP comerciale?
    a: >-
      Plăcile iSupfactory sunt construite pentru utilizare în ocean, în lacuri și în râuri.
      Platformele de tur fac față valurilor de coastă, iar toate plăcile folosesc PVC
      de clasă marină, rezistent la coroziunea apei sărate. Pentru flotele din ape
      sărate, recomandăm procedura standard de clătire cu apă dulce între utilizări și
      o includem în ghidul de operare furnizat împreună cu kiturile comerciale.
  - q: Furnizați pompe și accesorii de umflare pentru kiturile comerciale?
    a: >-
      Da. Kiturile comerciale includ pompe de mână cu dublu acționare, iar pentru
      stațiunile turistice și operatorii de închiriere care gestionează mai multe plăci
      pe zi oferim opțiuni de pompe electrice. Selecția pompelor, a vâslelor, a curelor
      de siguranță (leash), a aripilor, a rucsacelor și a kiturilor de reparație se
      confirmă ca parte a configurației de accesorii pentru fiecare proiect.
  - q: Cum sunt ambalate plăcile pentru expediere și pentru livrare în retail?
    a: >-
      Producția de serie se expediază în ambalaj vidat, pentru a reduce greutatea volumică
      cu 50–60%. Pentru programele de retail oferim cutii marcate, manuale, coduri
      de bare și marcaje de cutie în funcție de piață, iar putem pregăti kituri complete
      ambalate cu separatoare, astfel încât fiecare cutie să ajungă cu același set
      de accesorii.
  - q: Ce interval de greutate a vâslașului susțin plăcile dumneavoastră?
    a: >-
      Platformele all-around susțin până la 220 lbs; platformele de tur și cele
      pentru yoga susțin până la 250 lbs, cu opțiuni de capacitate mai mare pe plăcile
      mai mari. Greutatea vâslașului, construcția și presiunile nominale sunt specificate
      pentru fiecare platformă în fișa tehnică, înainte de a vă angaja la o comandă.
  - q: Ce include un kit comercial complet?
    a: >-
      Un kit complet include, de regulă, tabla, rucsacul de transport, pompa de mână
      cu dublu acționare, aripa detașabilă, cureaua de siguranță spirală și kitul de
      reparație, cu opțiuni de upgrade pentru vâslă și pompă electrică. Conținutul kitului
      este fixat în lista de materiale (BOM) aprobată de client, astfel încât mostrele
      și producția de serie să corespundă exact.
  - q: Puteți combina plăci, accesorii și ambalaje într-un singur program?
    a: >-
      Da. Programele multi-SKU acoperă plăcile, accesoriile și ambalajele de retail
      într-un singur contract de fabrică — seturile de accesorii comune reduc stocul
      per SKU, un singur sistem de design păstrează consecvența brandingului, iar un
      singur responsabil de calitate gestionează solicitările de garanție. Așa
      funcționează distributorii și partenerii noștri de retail care lansează linii SUP
      complete.
  - q: Care este diferența dintre OEM, ODM și eticheta privată?
    a: >-
      OEM înseamnă că fabricăm conform specificației aprobate de dumneavoastră — desenele,
      dimensiunile, materialele și ambalajele dumneavoastră. Dumneavoastră dețineți
      designul și proprietatea intelectuală. ODM înseamnă că echipa noastră de inginerie
      dezvoltă tabla pornind de la brief-ul dumneavoastră — fie că este un concept
      de piață, o țintă de performanță sau adaptarea unei platforme validate — iar
      dumneavoastră aprobați înainte de producție. Eticheta privată înseamnă brandul,
      grafica și ambalajele dumneavoastră pe o platformă existentă validată, fără
      modificări structurale. Majoritatea proiectelor se încadrează între aceste modele,
      iar noi oferim configurația care corespunde gradului de design al produsului
      pe care doriți să îl dețineți.
  - q: Cât costă o mostră de prototip și poate fi taxa dedusă din comandă?
    a: >-
      Prețul mostrelor urmează configurația proiectului: dimensiunea, construcția,
      grafica și ambalajele influențează oferta. Pentru proiectele care trec la producția
      de serie, taxa pentru mostră este de regulă compensată din prima comandă de producție
      — condițiile compensării sunt confirmate în scris la etapa ofertei, astfel încât
      să nu existe surprize ulterioare.
  - q: Câte plăci SUP gonflabile încap într-un container de 20ft?
    a: >-
      Pentru plăci de 11 ft ambalate în vid, cu kituri de accesorii, într-un container
      de 20ft încap de obicei 150–200 de seturi complete — numărul exact depinde
      de designul ambalajului, de combinația de accesorii și de dimensiunea cutiilor. Echipa
      noastră de ambalaje calculează planul de încărcare pe baza listei reale de materiale
      furnizate de dumneavoastră, astfel încât numărul după care planificați este chiar
      numărul care se expediază.
  - q: Ce includ ofertele dumneavoastră en-gros — FOB sau CIF?
    a: >-
      Ofertele sunt detailiate: produsul, ambalajul standard și transportul conform
      termenului comercial ales. FOB Qingdao este baza implicită, iar CIF către porturi
      principale și livrare door-to-door sunt disponibile prin partenerii noștri de transport.
      Fiecare ofertă precizează exact sfera a ceea ce este inclus, astfel încât să nu
      comparați merele cu merele între furnizori.
  - q: Taxați pentru unelte sau forme în cazul plăcilor personalizate?
    a: >-
      Pregătirea grafică și plăcile de tiparire au costuri mici și sunt reutilizabile; uneltele
      structurale (forme noi, borduri personalizate sau construcții unice) sunt cotate
      separat la etapa ofertei. Acolo unde se aplică unelte, costul este de regulă
      amortizat pe primul lot de producție, nu taxat ca o surpriză unică.
  - q: Ce condiții de plată aplicați comenzilor de producție?
    a: >-
      Condițiile standard presupun un avans care blochează producția, iar soldul se
      plătește înainte de expediție. Procentul avansului și momentul plății soldului
      sunt stabilite pentru fiecare comandă și consemnate în contract. Partenerii
      stabili cu un istoric constant de comenzi pot discuta termene extinse — preferăm
      câțiva termeni clari unor structuri de finanțare complicate.
  - q: Ce garanție oferiți pentru comenzile en-gros?
    a: >-
      Fiecare tablă trece un test de menținere a presiunii de 24 de ore la 18.0 PSI înainte
      de expediție, iar termenii de garanție sunt înscrisi în fiecare contract de comandă
      — ei acoperă defectele de fabricație, precum delaminarea, cedarea sudurilor și
      scurgerile la supape, și exclud daunele cauzate de utilizare. Perioada de garanție
      și procedura de reclamație sunt stabilite pe comanda de achiziție, nu descoperite
      ulterior.
  - q: Ce se întâmplă dacă plăcile ajung deteriorate sau cu defecte de fabricație?
    a: >-
      Raportați problema în intervalul convenit (de regulă 7–15 zile de la sosire), cu
      dovezi foto sau video. Evaluăm situația pe baza înregistrărilor inspecției preexpediere,
      păstrate pentru lotul dumneavoastră, apoi refacem, înlocuim sau acordăm credit,
      în funcție de caz. Fotografiile documentate de control al calității pentru stocul
      dumneavoastră fac procesul rapid și echitabil pentru ambele părți.
  - q: Cum este aprobată grafica personalizată înainte de producție?
    a: >-
      Graficele parcurg un lanț de aprobare controlat: machetă digitală, probă tipărită,
      inspecția primei piese pe tabla de producție, apoi producția lotului. Fiecare
      etapă este verificată față de fișierul de grafică semnat de dumneavoastră, motiv
      pentru care culorile tipărite, dispunerea pad-ului EVA și poziția logo-ului
      corespund fișierului de brand atunci când plăcile ajung.
  - q: Ce piese de schimb furnizați pentru flotele comerciale?
    a: >-
      Operatorii de flotă pot comanda piese de service împreună cu plăcile sau la comenzi
      ulterioare: supape de rezervă, kituri de reparații (peticele din PVC și adeziv),
      cutii de aripi și aripi, precum și cele mai frecvent înlocuite accesorii. Piesele
      de schimb se expediază împreună cu producția sau ca mici consignații, astfel
      încât o componentă defectă să nu scoată o tablă din funcțiune mult timp.
  - q: Ce informații ar trebui să pregătesc înainte de a solicita o ofertă?
    a: >-
      Cu cât brief-ul este mai bine pregătit, cu atât oferta este mai rapidă: piața țintă
      și utilizarea, specificațiile dorite (dimensiuni, construcție, presiune), cantitatea
      și prețul țintă, necesarul de branding și ambalaje și calendarul dumneavoastră
      de lansare. Formularul nostru de solicitare culege exact această listă — partajarea
      ei economisește runde de ofertare și vă oferă o estimare mai fermă la prima evaluare.
  - q: Cât durează realizarea mostrelor înainte de producție?
    a: >-
      Mostrele de prototip se expediază în 7–12 zile de la definitivarea specificațiilor.
      Adăugați timpul necesar pentru testele dumneavoastră și pentru orice rundă de
      revizuire — majoritatea proiectelor finalizează etapa de mostrare în aproximativ
      două-trei săptămâni. Producția începe după aprobarea mostrei, așa că etapa
      de mostrare este singura în care atenția suplimentară se traduce în timp economisit
      ulterior.
