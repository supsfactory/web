faqs:
  - q: Quem é a iSupfactory?
    a: >-
      A iSupfactory é um fabricante OEM e ODM de SUP em Qingdao, na China, e oferece desenvolvimento de produto, prototipagem, fabrico, controlo de qualidade e produção para exportação a marcas, distribuidores e empresas do setor outdoor.
  - q: Onde são fabricados os produtos da iSupfactory?
    a: >-
      Os produtos SUP são fabricados em Qingdao, na China.
  - q: A iSupfactory é um fabricante OEM?
    a: >-
      Sim. A iSupfactory produz SUP insufláveis de acordo com especificações aprovadas pelo cliente, incluindo dimensões, materiais, construção, gráficas, acessórios e embalagem.
  - q: A iSupfactory oferece desenvolvimento de produto ODM?
    a: >-
      Sim. A iSupfactory desenvolve produtos SUP a partir de um briefing de produto, uma necessidade de mercado ou um objetivo de desempenho, através da engenharia, do desenvolvimento do protótipo, da aprovação da amostra e da produção.
  - q: Posso mandar fabricar um SUP com base nos meus desenhos?
    a: >-
      Sim. Desenhos, especificações e produtos de referência fornecidos pelo cliente são examinados para verificar a sua producibilidade antes do orçamento.
  - q: Podem desenvolver um SUP a partir de uma ideia?
    a: >-
      Sim. Os projetos ODM podem partir de um conceito, uma necessidade de mercado ou um objetivo de desempenho.
  - q: Posso encomendar um protótipo?
    a: >-
      Sim. As amostras de protótipo podem ser produzidas antes da produção em série; as amostras são atualmente enviadas no prazo de 7–12 dias uma vez fixada a especificação.
  - q: Qual é o vosso prazo de produção?
    a: >-
      O prazo de produção padrão é de 25–35 dias a partir da PO confirmada e do adiantamento, dependendo da configuração do projeto; o ferramental personalizado acrescenta 15–20 dias.
  - q: Qual é a quantidade mínima de encomenda (MOQ)?
    a: >-
      A MOQ depende da plataforma, construção, quantidade, embalagem e das necessidades de materiais. O co-branding em pequenos lotes parte de 5–10 unidades e os lotes piloto de 20–50 unidades; a MOQ para a produção em série é confirmada com base na configuração do projeto.
  - q: Os clientes podem realizar auditorias à fábrica?
    a: >-
      Sim. As auditorias de clientes e as inspeções de terceiros podem ser organizadas de acordo com os requisitos do projeto.
  - q: Onde se localizam a vossa empresa e a vossa fábrica?
    a: >-
      Temos sede em Qingdao, na China. A iSupfactory é a divisão de produção da Qingdao Vatrad Group Co., Ltd. — uma
      instalação de produção de insufláveis de 12.500 m² na zona de desenvolvimento económico de Laixi, em
      produção desde 2012. As vendas e a assistência técnica são globais; a
      produção é realizada em Qingdao, na China.
  - q: A Vatrad oferece serviços OEM/ODM para equipamentos insufláveis de desportos aquáticos?
    a: >-
      Sim. A iSupfactory (suportada pela Qingdao Vatrad Group Co., Ltd.) oferece uma personalização
      OEM e ODM completa — desde os blueprints 3D e a seleção do material drop-stitch
      até à produção em série para marcas globais. Gerimos o rótulo privado,
      a embalagem personalizada e a documentação de conformidade para BSCI, CE e outras certificações.
  - q: Que certificações possui a Vatrad para a produção de equipamentos insufláveis de desportos aquáticos?
    a: >-
      A fábrica da Vatrad possui as certificações BSCI e ISO 9001. A certificação CE
      aplica-se aos modelos destinados ao mercado da UE; o âmbito é confirmado para cada projeto
      e varia consoante o mercado de destino e a configuração do produto. A documentação de conformidade REACH e RoHS
      está disponível a pedido.
  - q: Qual é a quantidade mínima de encomenda (MOQ) para os paddle board insufláveis OEM?
    a: >-
      A MOQ é confirmada com base na configuração do projeto, não por um número fixo: cada
      projeto passa pelas fases de amostra (1–2 unidades) e lote piloto (20–50 unidades),
      enquanto a produção em série padrão inclui 90–100+ unidades por lote a partir de um
      rolo completo de drop-stitch de 150 m. O co-branding em pequenos lotes parte de 5–10 unidades. Consulta o
      nosso guia MOQ e Flexible Branding para a lógica de cálculo completa.
  - q: Que materiais utiliza a Vatrad para a produção de SUP insufláveis?
    a: >-
      Utilizamos PVC de qualidade marinha (0,9 mm–1,2 mm) com um núcleo drop-stitch de
      dupla camada para os SUP. Os materiais provêm de fornecedores certificados e são
      testados antes da produção quanto à resistência à tração, resistência aos raios UV
      e flexibilidade a baixas temperaturas.
  - q: A Vatrad consegue gerir encomendas por grosso de grandes volumes para compradores internacionais?
    a: >-
      Sim. A nossa fábrica de 12.500 m² produz mais de 120.000 unidades por ano com uma
      equipa dedicada de mais de 350 técnicos qualificados. Entregamos em mais de 50 países e
      gerimos a logística incluindo FOB Qingdao, CIF para os portos principais e
      entrega porta a porta através dos nossos parceiros de envio.
  - q: Qual é o prazo de entrega para a produção OEM de SUP insufláveis?
    a: >-
      O prazo de entrega padrão da produção OEM é de 25–35 dias a partir da PO confirmada e
      do adiantamento. O desenvolvimento de moldes personalizados acrescenta 15–20 dias de ferramental, e
      as amostras de protótipo são enviadas no prazo de 7–12 dias. Encomendas urgentes são possíveis para
      parceiros consolidados com stock de material confirmado.
  - q: A Vatrad fornece material drop-stitch de qualidade militar para paddle board?
    a: >-
      Sim. O nosso núcleo drop-stitch utiliza tecido PVC em especificação marinha com
      uma resistência à tração superior a 2000 N/5cm. O processo de laminação de dupla camada
      mantém a retenção de ar a 18,0 PSI com uma queda de pressão inferior a
      0,50 PSI em 24 horas — satisfazendo assim o padrão de retenção de ar da fábrica.
  - q: Como garante a Vatrad a retenção de ar e a resistência aos raios UV dos seus produtos insufláveis?
    a: >-
      Cada sistema de ar insuflável é submetido a um teste de retenção de pressão de 24 horas a 18,0 PSI antes do envio;
      as câmaras com uma queda de pressão superior a 0,50 PSI são
      rejeitadas automaticamente. A resistência aos raios UV é validada através de envelhecimento acelerado
      com limites para a degradação da resistência à tração. A nossa formulação de PVC contém
      estabilizadores UV e aditivos antioxidantes para uma duração a longo prazo
      ao ar livre.
  - q: A Vatrad consegue apoiar o design da embalagem e o branding de rótulo privado?
    a: >-
      Sim. Oferecemos embalagem de rótulo privado chave na mão: caixas comerciais
      desenhadas à medida, loops, manuais de utilização e caixas de expedição com as vossas
      gráficas de marca. A nossa equipa de design interna pode desenvolver uma identidade visual de marca
      completa para os novos operadores de mercado — da aplicação do logótipo à experiência de unboxing.
  - q: A Vatrad aceita auditorias na fábrica por parte de compradores internacionais?
    a: >-
      Absolutamente. Acolhemos com satisfação as auditorias no local e as auditorias à fábrica de terceiros, incluindo
      BSCI, SMETA e as inspeções de conformidade social ligadas ao cliente. A nossa
      instalação de 12.500 m² está pronta para auditoria, com processos de QC documentados, rastreabilidade
      dos materiais e registos de segurança no trabalho. Os tours virtuais da fábrica estão
      disponíveis para a qualificação inicial.
  - q: O que é a tecnologia drop-stitch nas pranchas SUP Vatrad?
    a: >-
      O drop-stitch é uma construção têxtil em que milhares de fios de poliéster
      ligam a camada superior e a inferior em PVC. Quando é insuflado a 12–15 PSI, estes
      fios mantêm as superfícies a uma distância fixa e criam uma plataforma rígida e plana.
      A Vatrad utiliza drop-stitch soldado a fusão — em que os fios são
      incorporados termicamente no PVC — para uma resistência superior à delaminação em comparação com
      os núcleos tradicionalmente colados.
  - q: Que plataformas servem para os paddlers principiantes e para os clientes do aluguer?
    a: >-
      Os compradores que planeiam frotas para aluguer, resorts ou escolas partem geralmente de plataformas
      allround largas e volumosas, estáveis para os principiantes e versáteis para o uso
      comercial diário. Podemos também configurar pranchas
      multi-lugar para os cursos de grupo. A seleção da plataforma é alinhada com o vosso
      público-alvo antes da produção da amostra.
  - q: Em que condições de água podem operar os programas SUP comerciais?
    a: >-
      As pranchas iSupfactory são construídas para uso em lagos, rios e mar. As plataformas
      de touring lidam com a rebentação, e todas as pranchas utilizam PVC de qualidade marinha que
      resiste à corrosão. Para as frotas em água salgada recomendamos o
      procedimento normal de enxaguamento com água doce entre utilizações e incluímos isso no
      manual do operador fornecido com os kits comerciais.
  - q: Fornecem bombas e acessórios de insuflação para os kits comerciais?
    a: >-
      Sim. Os kits comerciais incluem bombas manuais de dupla câmara, com
      opções de bomba elétrica para resorts e atividades de aluguer que gerem várias
      pranchas todos os dias. A seleção de bomba, pá, leash, aleta, mochila e kit de reparação é
      confirmada como parte da configuração de acessórios de cada projeto.
  - q: Como são embaladas as pranchas para o envio e a entrega comercial?
    a: >-
      A produção em série é enviada com embalagem a vácuo para reduzir o peso volumétrico em
      50–60 %. Para os programas comerciais fornecemos caixas impressas, manuais,
      código de barras e etiquetagem das caixas consoante o mercado e podemos preparar
      kits completos embalados separadamente para que cada caixa chegue com o mesmo conjunto de acessórios.
  - q: Que gama de peso do paddler suportam as vossas pranchas?
    a: >-
      As plataformas allround suportam até 220 lbs; as plataformas de touring e yoga
      suportam até 250 lbs, com variantes de capacidade superior nas pranchas maiores. O peso do paddler, a construção e os valores de pressão
      são indicados na ficha técnica de cada plataforma
      antes da vossa aprovação de uma série de produção.
  - q: O que contém um kit comercial completo?
    a: >-
      Um kit completo contém tipicamente a prancha, a mochila de viagem, a bomba manual de
      dupla câmara, a aleta removível, a coil-leash e o kit de reparação, com bomba
      elétrica opcional como upgrade. Os conteúdos do kit são fixados na BOM
      aprovada pelo cliente, para que amostras e produção em série coincidam exatamente.
  - q: Podem agrupar pranchas, acessórios e embalagem num único programa?
    a: >-
      Sim. Os programas multi-SKU cobrem pranchas, acessórios e embalagem comercial
      sob um único contrato de fábrica — os kits de acessórios partilhados reduzem o stock por SKU,
      um sistema de design mantém o branding coerente e um único
      interlocutor de qualidade gere os pedidos de garantia. É assim que os nossos distribuidores e
      parceiros comerciais gerem sortidos SUP completos.
  - q: Qual é a diferença entre OEM, ODM e private label?
    a: >-
      OEM significa que produzimos de acordo com a vossa especificação aprovada: os vossos desenhos,
      dimensões, materiais e embalagem. O design e a propriedade
      intelectual permanecem vossos. ODM significa que a nossa equipa de desenvolvimento desenha a prancha a partir do vosso briefing
      — seja um conceito de mercado, um objetivo de desempenho ou a adaptação de uma plataforma
      comprovada — e vocês aprovam-na antes da produção. Private label significa a vossa
      marca, as vossas gráficas e a vossa embalagem numa plataforma existente e validada, sem
      modificações construtivas. A maioria dos projetos situa-se entre estes modos, e calculamos
      a configuração com base na quantidade de desenvolvimento do produto que querem possuir.
  - q: Quanto custa uma amostra de protótipo e a taxa pode ser creditada na encomenda?
    a: >-
      O preço da amostra segue a configuração do projeto: dimensões, construção,
      gráficas e embalagem influenciam todos o orçamento. Para os projetos que passam à
      produção em série, a taxa da amostra é normalmente creditada na primeira
      encomenda de produção — as condições de crédito são confirmadas por escrito na fase de
      orçamento, para que não haja surpresas mais tarde.
  - q: Quantos paddle board insufláveis cabem num contentor de 20-ft?
    a: >-
      Com pranchas de 11-ft padrão com embalagem a vácuo e kits de acessórios, um contentor de 20-ft
      contém tipicamente 150–200 conjuntos completos — o número exato depende do
      design da embalagem, do mix de acessórios e do tamanho das caixas. A nossa
      equipa de embalagem calcula o plano de carga a partir da vossa lista de materiais real, para que
      o número com que planeiam corresponda ao número que é enviado.
  - q: O que incluem as vossas ofertas por grosso — FOB ou CIF?
    a: >-
      As ofertas são detalhadas: produto, embalagem padrão e transporte de acordo com
      o Incoterm escolhido. FOB Qingdao é a base padrão, com CIF para os portos principais
      e entrega porta a porta disponível através dos nossos parceiros de envio.
      Cada oferta especifica o âmbito exato do que está incluído, para que não tenham de
      comparar maçãs com laranjas entre fornecedores diferentes.
  - q: Faturam os custos de ferramental ou moldes para as pranchas personalizadas?
    a: >-
      As configurações gráficas e as chapas de impressão são económicas e reutilizáveis; o ferramental
      estrutural (novos moldes, rails personalizadas ou construções especiais) é detalhado na fase de
      orçamento. Onde está previsto ferramental, o custo é normalmente amortizado no primeiro
      ciclo de produção, em vez de ser faturado como uma surpresa única.
  - q: Que condições de pagamento aplicam às encomendas de produção?
    a: >-
      As condições padrão preveem um adiantamento para iniciar a produção, com o saldo devido
      antes do envio. A percentagem do adiantamento e a data de vencimento do saldo são acordadas para cada
      encomenda e fixadas no contrato. Os parceiros consolidados com um fluxo constante de encomendas
      podem discutir condições alargadas — preferimos poucas condições honestas e claras
      a estruturas financeiras complicadas.
  - q: Que garantia oferecem para as encomendas de grandes volumes?
    a: >-
      Cada prancha é submetida a um teste de retenção de pressão de 24 horas a 18,0 PSI antes do envio,
      e as condições de garantia são fixadas em cada contrato de encomenda — cobrem
      defeitos de fabrico como descolamentos, cedências das costuras e perdas das
      válvulas, e excluem os danos por utilização. A duração da garantia e o procedimento de reclamação
      são confirmados na confirmação da ordem de compra, não descobertos apenas mais tarde.
  - q: O que acontece se as pranchas chegarem danificadas ou com defeitos de fabrico?
    a: >-
      Avise sobre o problema dentro do prazo acordado (normalmente 7–15 dias após
      a chegada) com provas fotográficas ou vídeo. Verificamos com base nos protocolos de inspeção no
      envio geridos para o vosso lote e atuamos em conformidade com uma reprodução, uma substituição ou um crédito.
      As fotos QC documentadas da vossa mercadoria tornam tudo rápido e
      correto para ambas as partes.
  - q: Como são aprovadas as gráficas personalizadas antes da produção?
    a: >-
      As gráficas percorrem uma cadeia de aprovação controlada: mockup digital, prova
      impressa, verificação do primeiro artigo na prancha de produção e depois produção em série.
      Cada passo é verificado em relação às vossas gráficas assinadas, por isso
      as cores de impressão, o layout EVA e o posicionamento do logótipo correspondem ao vosso ficheiro de marca à chegada das pranchas.
  - q: Que peças de substituição fornecem para as frotas comerciais?
    a: >-
      Os operadores de frotas podem encomendar peças de substituição juntamente com as suas pranchas ou com
      as reencomendas: válvulas de substituição, kits de reparação (remendos em PVC e
      cola), caixas de aleta e aletas, além dos acessórios substituídos com mais frequência. As peças de substituição
      são enviadas com a produção ou como pequenas entregas, para que um componente defeituoso
      não mantenha nunca uma prancha inteira fora de uso durante muito tempo.
  - q: Que informações devo preparar antes de pedir um orçamento?
    a: >-
      Quanto melhor for o briefing, mais rápido é o orçamento: mercado de destino e utilização,
      especificações desejadas (dimensões, construção, pressão), quantidade e
      preço objetivo, necessidades de branding e embalagem e a vossa calendarização de lançamento. O nosso
      formulário de pedido pergunta exatamente esta lista — se a partilharem, poupam rondas de
      orçamento e obtêm uma estimativa mais sólida já no primeiro passo.
  - q: Quanto tempo demora a produção da amostra antes da produção?
    a: >-
      As amostras de protótipo são enviadas no prazo de 7–12 dias uma vez fixada a especificação.
      Acrescentem o tempo de verificação para os vossos testes e para cada ronda de
      revisão — a maioria dos projetos conclui a produção das amostras em cerca de duas ou três
      semanas. A produção começa após a aprovação da amostra, e é por isso que a fase da amostra
      é o momento em que um cuidado especial se paga em tempo poupado mais tarde.