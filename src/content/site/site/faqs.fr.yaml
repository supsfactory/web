faqs:
  - q: Où se trouvent votre entreprise et votre usine ?
    a: >-
      Nous sommes basés à Qingdao, en Chine. SUPsfactory est la marque B2B
      d'Afarer, la division de fabrication de Qingdao Vatrad Group Co., Ltd. — une
      usine de fabrication d'articles gonflables de 12,500 m² dans la zone de
      développement économique de Laixi, en production depuis 2012. Les ventes et
      le support technique sont mondiaux ; la production se trouve à Qingdao, en Chine.
  - q: Afarer propose-t-il des services OEM/ODM pour les équipements gonflables de sports nautiques ?
    a: >-
      Oui. Afarer (soutenu par Qingdao Vatrad Group Co., Ltd.) propose une
      personnalisation OEM et ODM à grande échelle — des plans 3D et de la
      sélection de matériau drop-stitch jusqu'à la production en série pour les
      marques mondiales. Nous assurons l'étiquetage privé, l'emballage
      personnalisé et la documentation de conformité pour BSCI, CE et autres certifications.
  - q: Quelles certifications Afarer détient-il pour la fabrication d'équipements gonflables de sports nautiques ?
    a: >-
      L'usine d'Afarer est certifiée BSCI et ISO 9001. La certification CE
      s'applique aux modèles destinés aux marchés de l'UE ; la portée est confirmée
      par projet et varie selon le marché cible et la configuration du produit. La
      documentation de conformité REACH et RoHS est disponible sur demande.
  - q: Quelle est la quantité de commande minimale (MOQ) pour les paddle boards gonflables OEM ?
    a: >-
      Le MOQ est confirmé selon la configuration du projet plutôt que par un
      nombre fixe : chaque projet passe par les étapes d'échantillon (1–2 unités)
      et de pilote (20–50 unités), avec une production en volume standard de
      90–100+ unités par lot à partir d'un rouleau complet de drop-stitch de 150 m.
      Le co-branding en petits lots démarre à 5–10 unités. Consultez notre Guide
      MOQ & Branding Flexible pour toute la logique de calcul.
  - q: Quels matériaux Afarer utilise-t-il pour la production de SUP gonflables ?
    a: >-
      Nous utilisons du PVC de grade maritime (0,9 mm–1,2 mm) avec un noyau
      drop-stitch à double couche pour les SUP. Les matériaux proviennent de
      fournisseurs certifiés et sont testés pour la résistance à la traction, la
      résistance aux UV et la flexibilité à basse température avant la production.
  - q: Afarer peut-il gérer des commandes de gros volume pour les acheteurs internationaux ?
    a: >-
      Oui. Notre usine de 12,500 m² produit plus de 120,000 unités par an avec une
      équipe dédiée de plus de 350 ouvriers qualifiés. Nous expédions vers plus de
      50 pays et gérons la logistique incluant FOB Qingdao, CIF vers les
      principaux ports, et la livraison porte-à-porte via nos partenaires de fret.
  - q: Quel est le délai de production pour les SUP gonflables OEM ?
    a: >-
      Le délai de production OEM standard est de 25–35 jours à partir de la
      confirmation du bon de commande et de l'acompte. Le développement de moules
      personnalisés ajoute 15–20 jours pour l'outillage, et les échantillons de
      prototype sont expédiés sous 7–12 jours. Commandes urgentes disponibles pour
      les partenaires établis avec un stock de matériaux confirmé.
  - q: Afarer fournit-il du matériau drop-stitch de grade militaire pour les paddle boards ?
    a: >-
      Oui. Notre noyau drop-stitch utilise un tissu PVC de spécification maritime
      avec une résistance à la traction supérieure à 2000 N/5cm. Le processus de
      laminage à double couche assure une rétention d'air à 18,0 PSI avec une
      chute de pression inférieure à 0,50 PSI sur 24 heures — répondant à la norme
      d'intégrité de rétention d'air de l'usine.
  - q: Comment Afarer assure-t-il l'étanchéité à l'air et la résistance aux UV de ses gonflables ?
    a: >-
      Chaque tube gonflable subit un test de maintien de pression de 24 heures à
      18,0 PSI avant l'expédition ; les chambres dépassant une chute de pression
      de 0,50 PSI sont automatiquement rejetées. La résistance aux UV est validée
      par vieillissement accéléré avec des seuils de dégradation de la résistance
      à la traction. Notre composé PVC inclut des stabilisateurs UV et des
      additifs antioxydants pour une durabilité extérieure à long terme.
  - q: Afarer peut-il aider pour la conception de l'emballage et le branding en marque privée ?
    a: >-
      Oui. Nous offrons un emballage en marque privée clé en main : boîtes de
      vente au détail personnalisées, étiquettes suspendues, manuels d'instruction
      et cartons d'expédition avec vos visuels de marque. Notre équipe de
      conception interne peut développer une identité visuelle complète pour les
      nouveaux entrants sur le marché — de l'application du logo à l'expérience de déballage.
  - q: Afarer accepte-t-il les audits d'usine des acheteurs internationaux ?
    a: >-
      Absolument. Nous accueillons les audits d'usine sur site et tiers, incluant
      BSCI, SMETA et les inspections de conformité sociale spécifiques au client.
      Notre installation de 12,500 m² est prête pour l'audit avec des processus
      QC documentés, la traçabilité des matériaux, et les registres de santé &
      sécurité des travailleurs. Visites virtuelles de l'usine disponibles pour la qualification initiale.
  - q: Quelle est la technologie drop-stitch utilisée dans les planches SUP d'Afarer ?
    a: >-
      Le drop-stitch est une construction textile où des milliers de fils de
      polyester relient les couches PVC supérieure et inférieure. Lorsqu'il est
      gonflé à 12–15 PSI, ces fils rapprochent les panneaux à une distance fixe,
      créant une plateforme rigide et plate. Afarer utilise un drop-stitch à
      laminage par fusion — où les fils sont thermiquement liés au PVC — pour une
      résistance à la délamination supérieure par rapport aux noyaux traditionnels collés à la colle.
  - q: Quelles plateformes les pagayeurs débutants et les clients de location ont-ils besoin ?
    a: >-
      Les acheteurs planifiant des flottes de location, de resort ou d'école
      commencent généralement par des plateformes polyvalentes larges et à haut
      volume, stables pour les débutants et polyvalentes pour un usage commercial
      quotidien. Nous pouvons aussi configurer des planches multipersonnes pour les
      cours en groupe. La sélection de la plateforme est revue selon vos riders
      cibles avant l'échantillonnage.
  - q: Dans quelles conditions d'eau les programmes SUP commerciaux peuvent-ils opérer ?
    a: >-
      Les planches SUPsfactory sont conçues pour l'océan, le lac et la rivière.
      Les plateformes de tourisme gèrent le clapot côtier, et toutes les planches
      utilisent du PVC de grade maritime qui résiste à la corrosion par l'eau de
      mer. Pour les flottes en eau salée, nous recommandons la routine de rinçage
      à l'eau douce standard entre les utilisations, et l'incluons dans le guide
      opérateur fourni avec les kits commerciaux.
  - q: Fournissez-vous des pompes et accessoires de gonflage pour les kits commerciaux ?
    a: >-
      Oui. Les kits commerciaux incluent des pompes à main à double action, avec
      options de pompe électrique pour les resorts et opérateurs de location
      gérant plusieurs planches par jour. La pompe, la pagaie, la leash, la
      dérive, le sac à dos et le kit de réparation sont confirmés dans le cadre de
      la configuration des accessoires de chaque projet.
  - q: Comment les planches sont-elles emballées pour l'expédition et la livraison au détail ?
    a: >-
      La production en volume est expédiée sous vide pour réduire le poids
      volumétrique de 50–60 %. Pour les programmes de vente au détail, nous
      fournissons des cartons de marque, des manuels, le code-barres et le
      marquage des cartons par marché, et pouvons préparer des kits complets
      séparés par diviseurs afin que chaque boîte arrive avec le même ensemble d'accessoires.
  - q: Quelle plage de poids du rider vos planches supportent-elles ?
    a: >-
      Les plateformes polyvalentes supportent jusqu'à 220 lbs ; les plateformes de
      tourisme et de yoga supportent jusqu'à 250 lbs, avec des options à plus
      haute capacité sur les grandes planches. Le poids du rider, la construction
      et les pressions nominales sont spécifiés par plateforme dans la fiche
      technique avant que vous ne vous engagiez dans une série.
  - q: Qu'est-ce qu'un kit commercial complet inclut ?
    a: >-
      Un kit complet inclut typiquement la planche, le sac de voyage, la pompe à
      main à double action, la dérive amovible, la leash en spirale et le kit de
      réparation, avec options de mise à niveau pagaie et pompe électrique. Le
      contenu du kit est verrouillé dans la nomenclature d'approbation client afin
      que l'échantillon et la production en volume correspondent exactement.
  - q: Pouvez-vous regrouper planches, accessoires et emballage dans un seul programme ?
    a: >-
      Oui. Les programmes multi-SKU couvrent les planches, les accessoires et
      l'emballage de vente au détail sous un seul contrat d'usine — des kits
      d'accessoires partagés réduisent l'inventaire par SKU, un système de design
      unique maintient la cohérence de la marque, et un unique responsable qualité
      gère les réclamations de garantie. C'est ainsi que nos distributeurs et
      partenaires de vente au détail gèrent des gammes SUP complètes.
  - q: Quelle est la différence entre OEM, ODM et marque privée ?
    a: >-
      L'OEM signifie que nous fabriquons selon votre spécification approuvée — vos
      plans, dimensions, matériaux et emballage. Vous possédez le design et la
      propriété intellectuelle. L'ODM signifie que notre équipe d'ingénierie
      développe la planche à partir de votre brief — qu'il s'agisse d'un concept de
      marché, d'un objectif de performance ou d'une adaptation d'une plateforme
      éprouvée — et vous approuvez avant la production. La marque privée signifie
      votre marque, vos graphismes et votre emballage sur une plateforme validée
      existante sans changement structurel. La plupart des projets se situent
      entre ces modes, et nous cotons la configuration selon le niveau de
      possession du design produit que vous souhaitez.
  - q: Combien coûte un échantillon de prototype, et ce frais peut-il être imputé à la commande ?
    a: >-
      La tarification de l'échantillon suit la configuration du projet : taille,
      construction, graphisme et emballage affectent tous le devis. Pour les
      projets passant à la production en volume, le frais d'échantillon est
      généralement crédité sur la première commande de production — les conditions
      de crédit sont confirmées par écrit à l'étape du devis afin qu'il n'y ait aucune surprise plus tard.
  - q: Combien de paddle boards gonflables entrent dans un conteneur de 20 pieds ?
    a: >-
      Pour des planches standard de 11 pi sous vide avec kits d'accessoires, un
      conteneur de 20 pieds transporte typiquement 150–200 ensembles complets — le
      nombre exact dépend de la conception de l'emballage, du mix d'accessoires et
      de la taille des cartons. Notre équipe d'emballage calcule le plan de
      chargement à partir de votre nomenclature réelle, donc le nombre sur lequel
      vous planifiez est le nombre expédié.
  - q: Que comprennent vos devis de gros — FOB ou CIF ?
    a: >-
      Les devis sont détaillés : produit, emballage standard et fret selon
      l'incoterm choisi. FOB Qingdao est la base par défaut, avec CIF vers les
      principaux ports et livraison porte-à-porte disponible via nos partenaires
      de fret. Chaque devis indique la portée exacte de ce qui est inclus, afin
      que vous ne compariez pas des pommes et des oranges entre fournisseurs.
  - q: Facturez-vous des frais d'outillage ou de moules pour les planches personnalisées ?
    a: >-
      Les configurations graphiques et les plaques d'impression sont peu
      coûteuses et réutilisables ; l'outillage structurel (nouvelles formes, rails
      personnalisés ou construction unique) est détaillé à l'étape du devis. Lorsque
      l'outillage s'applique, le coût est généralement amorti sur la première série
      de production plutôt que facturé comme une surprise ponctuelle.
  - q: Quelles conditions de paiement appliquez-vous aux commandes de production ?
    a: >-
      Les conditions standard sont un acompte pour verrouiller la production, le
      solde étant dû avant l'expédition. Le pourcentage d'acompte et le calendrier
      du solde sont convenus par commande et indiqués dans le contrat. Les
      partenaires établis avec un historique de commandes régulier peuvent discuter
      de conditions étendues — nous préférons quelques conditions honnêtes plutôt
      que des structures de financement compliquées.
  - q: Quelle garantie fournissez-vous sur les commandes en gros ?
    a: >-
      Chaque planche passe un test de maintien de pression de 24 heures à 18,0 PSI
      avant l'expédition, et les conditions de garantie sont écrites dans chaque
      contrat de commande — elles couvrent les défauts de fabrication tels que la
      délamination, la défaillance des coutures et les fuites de valve, et excluent
      les dommages liés à l'usage. La période de garantie et la procédure de
      réclamation sont confirmées sur le bon de commande, et non découvertes plus tard.
  - q: Que se passe-t-il si les planches arrivent endommagées ou avec des défauts de fabrication ?
    a: >-
      Signalez le problème dans la fenêtre convenue (typiquement 7–15 jours après
      l'arrivée) avec des photos ou des preuves vidéo. Nous évaluons par rapport
      aux registres d'inspection pré-expédition conservés pour votre lot, puis
      retravaillons, remplaçons ou créditons en conséquence. Les photos QC
      documentées de votre stock rendent cela rapide et équitable pour les deux parties.
  - q: Comment l'artwork personnalisé est-il approuvé avant la production ?
    a: >-
      Les graphismes passent par une chaîne d'approbation contrôlée : maquette
      numérique, preuve imprimée, inspection du premier article sur la planche de
      production, puis production en série. Chaque étape est vérifiée contre votre
      artwork signé, ce qui explique pourquoi les couleurs imprimées, la
      disposition EVA et le placement du logo correspondent à votre fichier de
      marque lorsque les planches arrivent.
  - q: Quelles pièces détachées fournissez-vous pour les flottes commerciales ?
    a: >-
      Les opérateurs de flotte peuvent commander des pièces réparables avec leurs
      planches ou lors des réapprovisionnements : valves de remplacement, kits de
      réparation (patches PVC et adhésif), boîtiers de dérive et dérives, et les
      accessoires les plus fréquemment remplacés. Les pièces détachées sont
      expédiées avec la production ou en petits lots, afin qu'un composant cassé ne
      retire jamais une planche entière du service trop longtemps.
  - q: Quelles informations dois-je préparer avant de demander un devis ?
    a: >-
      Plus le brief est précis, plus le devis est rapide : marché cible et usage,
      spécifications souhaitées (taille, construction, pression), quantité et prix
      cible, besoins de marque et d'emballage, et votre calendrier de lancement.
      Notre formulaire de demande collecte exactement cette liste — la partager
      économise des cycles de devis et vous donne une estimation plus ferme dès le premier passage.
  - q: Combien de temps l'échantillonnage prend-il avant la production ?
    a: >-
      Les échantillons de prototype sont expédiés sous 7–12 jours une fois la
      spécification figée. Ajoutez le temps de revue pour vos tests et tout cycle
      de révision — la plupart des projets complètent l'échantillonnage en environ
      deux à trois semaines. La production démarre après l'approbation de
      l'échantillon, donc l'étape d'échantillon est le seul endroit où un soin
      supplémentaire rapporte en temps économisé plus tard.
