faqs:
  - q: Hvem er iSupfactory?
    a: >-
      iSupfactory er en OEM- og ODM-producent af SUP i Qingdao, Kina, og leverer produktudvikling,
      prototyper, produktion, kvalitetskontrol og eksportproduktion til mærker, distributører
      og friluftsvirksomheder.
  - q: Hvor fremstilles iSupfactorys produkter?
    a: >-
      Vores SUP-produkter fremstilles i Qingdao, Kina.
  - q: Er iSupfactory en OEM-producent?
    a: >-
      Ja. iSupfactory fremstiller oppustelige SUP-bræt efter kundens godkendte specifikationer,
      herunder mål, materialer, konstruktion, grafik, tilbehør og emballage.
  - q: Tilbyder iSupfactory ODM-produktudvikling?
    a: >-
      Ja. iSupfactory udvikler SUP-produkter ud fra et produktbrief, et markedsbehov eller et
      ydelsesmål og fører dem gennem konstruktion, prototypeudvikling, prøvegodkendelse og produktion.
  - q: Kan I fremstille et SUP-bræt ud fra mine egne tegninger?
    a: >-
      Ja. Kundens tegninger, specifikationer og referenceprodukter gennemgås med hensyn til
      produktionsmuligheder, før der afgives tilbud.
  - q: Kan I udvikle et SUP-bræt ud fra en tanke?
    a: >-
      Ja. ODM-projekter kan starte ud fra et koncept, et markedsbehov eller et ydelsesmål.
  - q: Kan jeg bestille en prototype?
    a: >-
      Ja. Prøveprototyper kan fremstilles før serieproduktionen; prøver sendes i øjeblikket inden for
      7–12 dage, når specifikationen er fastlåst.
  - q: Hvad er jeres leveringstid for produktion?
    a: >-
      Standardleveringstiden er 25–35 dage fra bekræftet ordre og depositum,
      afhængigt af projektets konfiguration; specialfremstillet værktøj medfører yderligere
      15–20 dage.
  - q: Hvad er minimumsordren (MOQ)?
    a: >-
      MOQ afhænger af platform, konstruktion, antal, emballage og materialekrav.
      Co-branding i små partier starter ved 5–10 stk, og pilotserier ved 20–50 stk; minimumsordren
      for serieproduktion fastlægges ud fra projektets konfiguration.
  - q: Kan købere auditere fabrikken?
    a: >-
      Ja. Køberrevisioner og tredjepartsinspektioner kan arrangeres efter projektets krav.
  - q: Hvor er virksomheden og fabrikken beliggende?
    a: >-
      Vi er baseret i Qingdao, Kina. iSupfactory er produktionsafdelingen i Qingdao Vatrad Group Co., Ltd. — en
      12 500 m² fabrik til oppustelige produkter i Laixi Economic
      Development Zone, som har produceret siden 2012. Salg og teknisk support er
      globalt; produktionen foregår i Qingdao, Kina.
  - q: Tilbyder Vatrad OEM/ODM-tjenester til oppusteligt vandsportsudstyr?
    a: >-
      Ja. iSupfactory (bakket op af Qingdao Vatrad Group Co., Ltd.) tilbyder fuld
      OEM- og ODM-tilpasning — fra 3D-tegninger og valg af drop-stitch-materiale
      til masseproduktion for globale mærker. Vi håndterer private labeling,
      specialfremstillet emballage og overensstemmelsesdokumentation for BSCI, CE og andre certificeringer
  - q: Hvilke certificeringer har Vatrad til fremstilling af oppusteligt vandsportsudstyr?
    a: >-
      Vatrads fabrik er certificeret i henhold til BSCI og ISO 9001. CE-certificering
      gælder modeller til EU-markeder; omfanget bekræftes pr. projekt
      og varierer efter målmarked og produktkonfiguration. Dokumentation for
      overensstemmelse med REACH og RoHS kan fremskaffes på anmodning.
  - q: Hvad er minimumsordren (MOQ) for OEM-oppustelige paddleboards?
    a: >-
      MOQ fastlægges ud fra projektets konfiguration frem for et fast tal: hvert
      projekt gennemløber prøvefasen (1–2 stk) og pilotfasen (20–50 stk),
      mens standard serieproduktion kører 90–100+ stk pr. parti fra et fuldt
      150 m drop-stitch rul. Co-branding i små partier starter ved 5–10 stk. Se
      vores guide om minimumsordrer og fleksibel branding for hele beregningslogikken.
  - q: Hvilke materialer bruger Vatrad til produktion af oppustelige SUP-bræt?
    a: >-
      Vi bruger marine-PVC (0.9 mm–1.2 mm) med dobbeltlaget
      drop-stitch-kerne til SUP-bræt. Materialerne kommer fra certificerede leverandører og
      testes for trækstyrke, UV-bestandighed og fleksibilitet ved lave
      temperaturer før produktionen.
  - q: Kan Vatrad håndtere store engrosordrer fra internationale købere?
    a: >-
      Ja. Vores fabrik på 12 500 m² producerer over 120 000 stk om året med et
      dedikeret team på 350+ kvalificerede arbejdere. Vi sender til 50+ lande og
      håndterer logistikken, herunder FOB Qingdao, CIF til større havne og
      levering til døren via vores fragtpartnere.
  - q: Hvad er leveringstiden for OEM-produktion af oppustelige SUP-bræt?
    a: >-
      Standardleveringstiden for OEM-produktion er 25–35 dage fra bekræftet
      ordre og depositum. Udvikling af specialfremstillede forme tager yderligere 15–20 dage til
      værktøjet, og prototypeprøver sendes inden for 7–12 dage. Hasteordrer er
      mulige for etablerede partnere med bekræftet materialelager.
  - q: Leverer Vatrad drop-stitch-materiale i militær kvalitet til paddleboards?
    a: >-
      Ja. Vores drop-stitch-kerne bruger PVC-dug i marinekvalitet med en
      trækstyrke på over 2000 N/5cm. Lamineringen i to lag
      opretholder lufttætheden ved 18.0 PSI med et trykfald på under
      0.50 PSI over 24 timer — hvilket opfylder fabrikkens standard for lufttæthed.
  - q: Hvordan sikrer Vatrad lufttæthed og UV-bestandighed i sine oppustelige produkter?
    a: >-
      Hver oppustelig slange gennemgår en 24-timers trykholdetest ved 18.0 PSI
      inden afsendelse; kamre med et trykfald på over 0.50 PSI
      afvises automatisk. UV-bestandigheden valideres via accelereret
      aldring med grænseværdier for tab af trækstyrke. Vores PVC-blanding indeholder
      UV-stabilisatorer og antioxidanter til lang holdbarhed udendørs.
  - q: Kan Vatrad hjælpe med emballage-design og private-label-branding?
    a: >-
      Ja. Vi tilbyder komplette private label-emballeringsløsninger: specialdesignede
      salgskartoner, hængeteg, brugsanvisninger og transportkartoner med jeres
      brandgrafik. Vores interne designteam kan udvikle en komplet visuel
      brandidentitet for nye markedsaktører — fra placering af logoet til
      oplevelsen af at pakke ud.
  - q: Accepterer Vatrad fabrikrevisioner fra internationale købere?
    a: >-
      Absolut. Vi byder velkommen til revisioner på stedet og fra tredjepart, herunder
      BSCI, SMETA og kundespecifikke inspektioner for social compliance. Vores
      anlæg på 12 500 m² er revisionsklart med dokumenterede QC-processer, materialesporbarhed
      og registreringer for arbejdernes sikkerhed. Virtuelle fabriksture
      er mulige ved den første kvalificering.
  - q: Hvad er den drop-stitch-teknologi, der anvendes i Vatrads SUP-bræt?
    a: >-
      Drop-stitch er en stofkonstruktion, hvor tusindvis af polyestertråde
      forbinder det øverste og det nederste PVC-lag. Når brættet pustes op til 12–15 PSI, trækker
      trådene panelerne sammen til en fast afstand og skaber en stiv, flad
      platform. Vatrad bruger fusionlamineret drop-stitch — hvor trådene
      er termisk bundet ind i PVC'en — for overlegen delamineringsbestandighed sammenlignet
      med traditionelt limlakerede kerner.
  - q: Hvilke platforme har førstegangspaddlere og udlejningsgæster brug for?
    a: >-
      Købere, der planlægger flåder til udlejning, resorts eller skoler, starter
      typisk med brede, rummelige allround-platforme, som er stabile for
      førstegangspaddlere og alsidige i daglig kommerciel drift. Vi kan også
      konfigurere flerspersonsbræt til gruppeundervisning. Platformvalget
      gennemgås i forhold til dine målpaddlere, før prøverne tages.
  - q: Hvilke vandforhold kan kommercielle SUP-programmer drives under?
    a: >-
      iSupfactory-bræt er bygget til brug i hav, søer og floder.
      Touringplatforme klarer kystbølger, og alle bræt bruger marine-PVC, der
      modstår korrosion fra saltvand. Til flåder i saltvand anbefaler vi den
      vane at skylle med ferskvand mellem turene, og den indgår i
      betjeningsvejledningen, der følger med kommercielle sæt.
  - q: Leverer I pumper og oppustningstilbehør til kommercielle sæt?
    a: >-
      Ja. Kommercielle sæt indeholder håndpumper med dobbeltvirkning, med
      mulighed for elektriske pumper til resorts og udlejningsvirksomheder, der
      håndterer flere bræt om dagen. Valget af pumpe, pagaj, leash, finne, rygsæk og reparationssæt
      bekræftes som en del af tilbehørskonfigurationen for hvert projekt.
  - q: Hvordan pakkes bræt til forsendelse og levering til detailled?
    a: >-
      Serieproduktion sendes vakuumpakket, hvilket reducerer den volumetriske vægt med
      50–60 %. Til detailprogrammer leverer vi brandede kartoner, manualer,
      stregkode og kartonmærkning tilpasset markedet, og vi kan pakke komplette
      sæt med skillevægge, så hver karton ankommer med det samme tilbehørssæt.
  - q: Hvilken ryttervægt kan jeres bræt bære?
    a: >-
      Allround-platforme bærer op til 220 lbs; touring- og yoga-platforme
      bærer op til 250 lbs, med mulighed for højere kapacitet på de større bræt.
      Ryttervægt, konstruktion og trykklassificering er angivet pr.
      platform i det tekniske datasheet, før du binder dig til en produktion.
  - q: Hvad indeholder et komplet kommercielt sæt?
    a: >-
      Et komplet sæt indeholder typisk brættet, transportrygsækken, håndpumpen med
      dobbeltvirkning, den aftagelige finne, coil-leash og reparationssættet, med valgfri opgradering til pagaj
      og elektrisk pumpe. Sættets indhold fastlægges i den kundegodkendte
      stykliste, så prøver og serieproduktion stemmer helt overens.
  - q: Kan I samle bræt, tilbehør og emballage i et samlet program?
    a: >-
      Ja. Multi-SKU-programmer dækker bræt, tilbehør og detailemballage
      under en enkelt fabrikskontrakt — fælles tilbehørssæt reducerer lagerbeholdningen pr. SKU,
      det fælles designsystem holder brandingen ensartet, og en enkelt
      kvalitetsansvarlig håndterer garantikrav. Sådan driver vores distributører og
      detailpartnere komplette SUP-sortimenter.
  - q: Hvad er forskellen på OEM, ODM og private label?
    a: >-
      OEM betyder, at vi fremstiller efter din godkendte specifikation — dine tegninger,
      mål, materialer og emballage. Designet og den intellektuelle
      ejendomsret tilhører dig. ODM betyder, at vores ingeniørteam udvikler brættet ud fra din produktbrief
      — hvad enten det er et markedskoncept, et ydelsesmål eller en tilpasning af en dokumenteret
      platform — og du godkender det før produktionen. Private label betyder dit
      brand, din grafik og din emballage på en eksisterende, valideret platform uden
      strukturelle ændringer. De fleste projekter havner mellem disse modeller, og vi
      giver tilbud på den konfiguration, der matcher, hvor meget af produktdesignet du vil eje.
  - q: Hvad koster en prototypeprøve, og kan beløbet indregnes i ordren?
    a: >-
      Prøveprisen følger projektets konfiguration: mål, konstruktion,
      grafik og emballage påvirker alle tilbudet. For projekter, der går videre til
      serieproduktion, indregnes prøvebeløbet typisk i den første
      produktionsordre — vilkårene for indregningen bekræftes skriftligt i tilbudsfasen,
      så der ikke opstår overraskelser senere.
  - q: Hvor mange oppustelige paddleboards passer i en 20-fods container?
    a: >-
      Med standard vakuumpakkede 11-fods bræt med tilbehørssæt rummer en 20-fods
      container normalt 150–200 komplette sæt — det præcise antal
      afhænger af embalagedesign, tilbehørsmix og kartonstørrelse. Vores
      emballageteam beregner lasteplanen ud fra din faktiske stykliste,
      så det antal, du planlægger efter, er det antal, der sendes.
  - q: Hvad indeholder jeres engrostilbud — FOB eller CIF?
    a: >-
      Tilbud er specificerede: produkt, standardemballage og fragt iht.
      valgt Incoterm. FOB Qingdao er standardgrundlaget, med CIF til større
      havne og levering til døren via vores fragtpartnere.
      Hvert tilbud angiver præcist, hvad der er inkluderet, så du ikke
      sammenligner æbler med pærer på tværs af leverandører.
  - q: Opkræver I værktøjs- eller formgebyrer for specialfremstillede bræt?
    a: >-
      Grafiske opsætninger og trykplader er billige og genbrugelige; strukturelt
      værktøj (nye former, specialfremstillede kantlister eller unikke konstruktioner) specificeres i
      tilbudsfasen. Hvor værktøj er aktuelt, fordeles omkostningen typisk over den første
      produktionsserie frem for at blive opkrævet som en uventet engangsbetaling.
  - q: Hvilke betalingsvilkår anvender I på produktionsordrer?
    a: >-
      Standardvilkårene er et depositum, der låser produktionen, med restbeløbet forfalden
      før afsendelse. Depositoens størrelse og tidspunktet for restbetalingen aftales pr.
      ordre og fremgår af kontrakten. Etablerede partnere med et jævnt ordremønster
      kan drøfte forlængede vilkår — vi foretrækker få ærlige vilkår
      frem for komplicerede finansieringsstrukturer.
  - q: Hvilken garanti giver I på større ordrer?
    a: >-
      Hvert bræt gennemgår en 24-timers trykholdetest ved 18.0 PSI inden
      afsendelse, og garantivilkårene står i hver ordrekontrakt — de dækker
      produktionsfejl som delaminering, fejl i sømme og lækkende
      ventiler og udelukker brugsrelaterede skader. Garantiperioden og
      reklamationsproceduren fremgår af ordrebekræftelsen, opdages ikke først senere.
  - q: Hvad sker der, hvis bræt ankommer beskadigede eller med produktionsfejl?
    a: >-
      Rapporter problemet inden for den aftalte frist (normalt 7–15 dage efter
      ankomst) med fotos- eller videoevidens. Vi vurderer op imod de
      inspektionsposter, der er registreret for dit parti fra før afsendelsen, og
      følger op med oparbejdning, udskiftning eller kreditering.
      De dokumenterede QC-fotos af dit lager gør processen hurtig og
      fair for begge parter.
  - q: Hvordan godkendes specialfremstillet grafik før produktionen?
    a: >-
      Grafikken gennemgår en kontrolleret godkendelseskæde: digital mockup, trykt
      korrektur, førstevareinspektion på produktionsbrættet og derefter
      batchproduktion. Hvert trin kontrolleres mod din signerede grafik, og derfor
      svarer trykte farver, EVA-layout og logoplacering til din brandfil, når
      brætterne ankommer.
  - q: Hvilke reservedele leverer I til kommercielle flåder?
    a: >-
      Flådeoperatører kan bestille reservedele sammen med brættene eller ved
      genbestillinger: erstatningsventiler, reparationssæt (PVC-lapper og
      lim), finnekasser og finner samt de mest almindeligt udskiftede
      tilbehørsdele. Reservedele sendes sammen med produktionen eller som
      mindre forsendelser, så en defekt del aldrig tager et helt bræt ud af drift længe.
  - q: Hvilke oplysninger bør jeg forberede, før jeg beder om et tilbud?
    a: >-
      Jo bedre briefet er, desto hurtigere kommer tilbuddet: målmarked og anvendelse,
      ønskede specifikationer (mål, konstruktion, tryk), antal og
      målpris, behov for branding og emballage samt din lanceringsplan. Vores
      forespørgselsformular indsamler præcis denne liste — deler du den, sparer du
      tilbudsrunder og får et skarpere estimat på første runde.
  - q: Hvor lang tid tager prøveproduktionen før produktionen?
    a: >-
      Prototypeprøver sendes inden for 7–12 dage, når specifikationen er
      fastlåst. Læg desuden tid til egen test og eventuelle
      revisionsrunder — de fleste projekter afslutter prøvefasen på cirka to til tre
      uger. Produktionen starter efter prøvegodkendelsen, og prøvefasen er
      altså det sted, hvor ekstra omhu sparer tid senere.
