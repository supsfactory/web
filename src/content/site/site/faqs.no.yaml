faqs:
  - q: Hva er iSupfactory?
    a: >-
      iSupfactory er en OEM- og ODM-produsent av SUP-brett i Qingdao, Kina, og tilbyr produktutvikling,
      prototyping, produksjon, kvalitetskontroll og eksportproduksjon for merkevarer, distributører
      og virksomheter i friluftslivsbransjen.
  - q: Hvor produseres iSupfactorys produkter?
    a: >-
      Våre SUP-produkter produseres i Qingdao, Kina.
  - q: Er iSupfactory en OEM-produsent?
    a: >-
      Ja. iSupfactory produserer oppblåsbare SUP-brett iht. kundgodkjente spesifikasjoner, inkludert mål,
      materialer, konstruksjon, artwork, tilbehør og emballasje.
  - q: Tilbyr iSupfactory ODM-produktutvikling for merkevarer?
    a: >-
      Ja. iSupfactory utvikler SUP-produkter basert på en produktbrief, et markedsbehov eller et
      ytelsesmål, gjennom konstruksjon, prototypeutvikling, prøvegodkjenning og produksjon.
  - q: Kan jeg få et SUP-brett produsert ut fra mine egne design?
    a: >-
      Ja. Tegninger, spesifikasjoner og referanseprodukter som kunden leverer, vurderes med hensyn til
      produserbarhet før tilbudet gis.
  - q: Kan dere utvikle et SUP-brett ut fra en idé?
    a: >-
      Ja. ODM-prosjekter kan starte fra et konsept, et markedsbehov eller et ytelsesmål.
  - q: Kan jeg bestille en prototyp?
    a: >-
      Ja. Prototypeprøver kan produseres før serieproduksjonen; prøver sendes i dag innen 7–12 dager
      så snart spesifikasjonen er fastslått.
  - q: Hvor lang er produksjonstiden?
    a: >-
      Standard produksjonstid er 25–35 dager etter bekreftet bestilling og depositum, avhengig av
      prosjektkonfigurasjonen; tilpassede former tar 15–20 dager ekstra.
  - q: Hva er minste bestillingskvantum (MOQ)?
    a: >-
      MOQ avhenger av plattform, konstruksjon, antall, emballasje og materialbehov. Co-branding i små
      volumer starter ved 5–10 stk, og pilotpartier ved 20–50 stk; MOQ for serieproduksjon bekreftes
      ut fra prosjektkonfigurasjonen.
  - q: Kan kunder gjennomføre fabrikkbesiktigelser?
    a: >-
      Ja. Kundebesiktigelser og tredjepartsinspeksjoner kan arrangeres ut fra prosjektenes krav.
  - q: Hvor er selskapet og fabrikken deres?
    a: >-
      Vi er basert i Qingdao, Kina. iSupfactory er produksjonsdivisjonen i Qingdao Vatrad Group Co., Ltd. — en
      produksjonsanlegg for oppblåsbare produkter på 12 500 m² i Laixis økonomiske utviklingssone, i
      drift siden 2012. Salg og teknisk støtte skjer globalt; produksjonen
      skjer i Qingdao, Kina.
  - q: Tilbyr Vatrad OEM/ODM-tjenester for oppblåsbare vannsportsprodukter?
    a: >-
      Ja. iSupfactory (med støtte fra Qingdao Vatrad Group Co., Ltd.) tilbyr full
      OEM- og ODM-tilpasning — fra 3D-tegninger og materialvalget for drop-stitch
      til serieproduksjon for globale merkevarer. Vi håndterer private labeling,
      tilpasset emballasje og samsvarsdokumentasjon for BSCI, CE og andre sertifiseringer.
  - q: Hvilke sertifiseringer har Vatrad for produksjon av oppblåsbare vannsportsprodukter?
    a: >-
      Vatrad-fabriken er sertifisert etter BSCI og ISO 9001. CE-sertifisering
      gjelder modeller beregnet for EU-markedet; omfanget bekreftes per prosjekt
      og varierer med målmarked og produktkonfigurasjon. Dokumentasjon for REACH og RoHS
      leveres på forespørsel.
  - q: Hva er minste bestillingskvantum (MOQ) for oppblåsbare OEM-paddlebrett?
    a: >-
      MOQ bekreftes ut fra prosjektkonfigurasjonen, ikke via et fast tall: hvert
      prosjekt går gjennom fasene prøvetaking (1–2 stk) og pilotparti (20–50 stk),
      mens standard serieproduksjon omfatter 90–100+ stk per parti fra en
      hel rull drop-stitch på 150 m. Co-branding i små volumer starter ved 5–10 stk. Se
      vår guide for MOQ og fleksibel branding for hele beregningslogikken.
  - q: Hvilke materialer bruker Vatrad for produksjon av oppblåsbare SUP-brett?
    a: >-
      Vi bruker PVC av marinekvalitet (0.9 mm–1.2 mm) med et dobbelt
      drop-stitch-lag som kjerne i SUP-brettene. Materialet kommer fra sertifiserte leverandører og
      testes før produksjonen med hensyn til strekkstyrke, UV-bestandighet
      og fleksibilitet ved lave temperaturer.
  - q: Kan Vatrad håndtere store engrosbestillinger for internasjonale kjøpere?
    a: >-
      Ja. Vår fabrikk på 12 500 m² produserer mer enn 120 000 stk per år med et
      dedikert team på mer enn 350 kvalifiserte teknikere. Vi leverer til over 50 land og
      håndterer logistikken inkludert FOB Qingdao, CIF til de viktigste havnene og
      levering til dør via våre fraktpartnere.
  - q: Hva er leveringstiden for OEM-produksjon av oppblåsbare SUP-brett?
    a: >-
      Standard leveringstid for OEM-produksjon er 25–35 dager etter bekreftet bestilling og
      depositum. Utvikling av tilpassede former tar 15–20 dager ekstra for verktøyet, og
      prototypeprøver sendes innen 7–12 dager. Hastebestillinger er mulige for
      etablerte partnere med bekreftede materialreserver.
  - q: Leverer Vatrad drop-stitch-materiale av militær kvalitet for paddlebrett?
    a: >-
      Ja. Vår drop-stitch-kjerne bruker PVC-vev av marinekvalitet med
      en strekkstyrke på mer enn 2000 N/5cm. Lamineringen i to lag
      opprettholder lufttettingsnivået på 18.0 PSI med et trykktap på mindre enn
      0.50 PSI i løpet av 24 timer — og dermed oppfyller fabrikkens krav til lufttetting.
  - q: Hvordan garanterer Vatrad lufttetting og UV-bestandighet i de oppblåsbare produktene sine?
    a: >-
      Hvert oppblåsbart luftsystem testes før levering med en 24-timers trykk- og lufttettingstest ved
      18.0 PSI; kamre med et trykktap på mer enn 0.50 PSI
      kvalifiseres automatisk. UV-bestandigheten valideres gjennom akselerert aldring
      med grenseverdier for forringelse av strekkstyrken. Vår PVC-formulering inneholder
      UV-stabilisatorer og antioksidanttilsetninger for lang levetid
      utendørs.
  - q: Kan Vatrad støtte emballasjedesign og private label-branding?
    a: >-
      Ja. Vi tilbyr ferdige private label-emballasjer: skreddersydde
      handelskartonger, håndtak, brukerhåndbøker og transportkartonger med ditt
      merkenavn trykt på. Vårt interne designteam kan utvikle en komplett visuell merkevareidentitet
      for nye markedsaktører — fra plasseringen av logoen til oppakningsopplevelsen.
  - q: Aksepterer Vatrad fabrikkbesiktigelser fra internasjonale kjøpere?
    a: >-
      Absolutt. Vi ønsker velkommen stedsbesiktigelser og fabrikkbesiktigelser fra tredjepart, inkludert
      BSCI, SMETA og kundespesifikke revisjoner av sosial etterlevelse. Vårt
      anlegg på 12 500 m² er revisjonsklart, med dokumenterte QC-prosesser, materialsporbarhet
      og sikkerhetsregistreringer på verkstedgulvet. Virtuelle fabrikkturer
      er tilgjengelige for den første kvalifiseringen.
  - q: Hva er drop-stitch-teknikken i Vatrad SUP-brett?
    a: >-
      Drop-stitch er en tekstilkonstruksjon der tusenvis av polyestertråder
      binder sammen det øvre og det nedre PVC-laget. Når brettet blåses opp til 12–15 PSI, holder
      trådene overflatene på en bestemt avstand og danner en stiv, flat struktur.
      Vatrad bruker fusiegelast drop-stitch — der trådene
      termisk integreres i PVC-et — for overlegen delamineringsbestandighet sammenlignet
      med tradisjonelt limte kjerner.
  - q: Hvilke plattformer passer nybegynnere og utleiekunder?
    a: >-
      Kjøpere som planlegger flåter for utleie, resorts eller skoler starter vanligvis med brede,
      romslige allround-plattformer som er stabile for nybegynnere og fleksible for daglig
      kommersiell bruk. Vi kan dessuten konfigurere flerpersonersbrett
      for gruppeundervisning. Plattformvalget tilpasses din
      målgruppe før prøvetakingen.
  - q: Under hvilke vannforhold kan kommersielle SUP-program drives?
    a: >-
      iSupfactorys brett er bygget for bruk i ferskvann, elver og hav. Touring-
      plattformene tåler bølger, og alle brett bruker PVC av marinekvalitet som
      motstår korrosjon. For flåter i saltvann anbefaler vi den vanlige
      rutinen med å skylle med ferskvann mellom turene, og vi tar den med i
      operatørhåndboken som følger med de kommersielle settene.
  - q: Leverer dere pumper og oppblåsingstilbehør for kommersielle sett?
    a: >-
      Ja. Kommersielle sett inneholder doble sylinderhåndpumper, med
      alternativer for elektriske pumper for resorts og utleieselskaper som håndterer flere
      brett per dag. Valget av pumpe, padle, leash, fin, ryggsekk og reparasjonssett
      bekreftes som en del av hvert prosjekts tilbehørskonfigurasjon.
  - q: Hvordan pakkes brettene for frakt og kommersiell levering?
    a: >-
      Serieproduksjon sendes vakuumpakket for å redusere den volumetriske vekten med
      50–60 %. For kommersielle programmer leverer vi trykte kartonger, manualer,
      strekkoder og kartongmerking avhengig av marked, og vi kan pakke komplette
      sett separat slik at hver kartong inneholder det samme tilbehørsettet.
  - q: Hvilke vektklasser for padlere støtter brettene deres?
    a: >-
      Allround-plattformene tåler opptil 220 lbs; touring- og yogaplattformene
      tåler opptil 250 lbs, med varianter med høyere kapasitet på de større brettene. Padlerens
      vekt, konstruksjonen og trykkverdiene er angitt i det tekniske databladet for hver
      plattform før du godkjenner en produksjonsserie.
  - q: Hva inneholder et komplett kommersielt sett?
    a: >-
      Et komplett sett inneholder vanligvis brettet, transportvesken, den doble sylinderhåndpumpen,
      den avtakbare finnen, spiral-leashet og reparasjonssettet, med en valgfri elektrisk
      pumpe som oppgradering. Innholdet i settet fastlegges i den kundegodkjente BOM-listen,
      slik at prøver og serieproduksjon stemmer nøyaktig overens.
  - q: Kan dere samle brett, tilbehør og emballasje i ett enkelt program?
    a: >-
      Ja. Multi-SKU-programmer dekker brett, tilbehør og kommersiell emballasje
      under én enkelt fabrikkontraktt — delte tilbehørsett reduserer lagerbeholdningen per SKU,
      et designsystem holder merkevarebrandingen konsistent, og en
      felles kvalitetsreferanse håndterer garantisøknadene. Slik håndterer distributørene våre og
      handelspartnerne våre et komplett SUP-sortiment.
  - q: Hva er forskjellen mellom OEM, ODM og private label?
    a: >-
      OEM betyr at vi produserer etter din godkjente spesifikasjon: tegningene dine,
      mål, materialer og emballasje. Designen og den immaterielle
      eiendommen forblir din. ODM betyr at utviklingsteamet vårt formgir brettet ut fra briefen din
      — enten det er et markedskonsept, et ytelsesmål eller en tilpasning av en bevist plattform
      — og du godkjenner det før produksjonen. Private label betyr ditt
      merkenavn, din artwork og din emballasje på en eksisterende, validert plattform, uten
      strukturelle endringer. De fleste prosjektene ligger mellom disse modellene, og vi
      dimensjonerer konfigurasjonen ut fra hvor mye av produktutviklingen du vil eie.
  - q: Hva koster en prototypeprøve, og kan prøvekostnaden trekkes fra bestillingen?
    a: >-
      Prøveprisen følger prosjektkonfigurasjonen: mål, konstruksjon,
      artwork og emballasje påvirker alle tilbudet. For prosjekter som går videre til
      serieproduksjonen trekkes prøvekostnaden normalt fra den første
      produksjonsbestillingen — avtrekksvilkårene bekreftes skriftlig i tilbudsfasen,
      slik at det ikke blir noen overraskelser senere.
  - q: Hvor mange oppblåsbare paddlebrett får plass i en 20-fots container?
    a: >-
      Med vakuumpakkede standardbrett på 11 fot og tilbehørsett inneholder en 20-fots container
      vanligvis 150–200 komplette sett — det eksakte antallet avhenger av
      emballasjedesignen, tilbehørsmiksen og kartongstørrelsen. Vårt
      emballasjeteam regner ut lasteplanen ut fra din faktiske materialliste, slik at
      antallet du planlegger for stemmer med antallet som sendes.
  - q: Hva inngår i engrosstilbudene deres — FOB eller CIF?
    a: >-
      Tilbudene er detaljerte: produkt, standardemballasje og transport iht.
      valgt Incoterm. FOB Qingdao er standardbasen, med CIF til de viktigste havnene
      og levering til dør via våre fraktpartnere.
      Hvert tilbud spesifiserer nøyaktig hva som inngår, slik at du
      ikke trenger å sammenligne epler og pærer mellom ulike leverandører.
  - q: Fakturerer dere verktøy- eller formkostnader for skreddersydde brett?
    a: >-
      De grafiske oppsettene og trykkplatene er kostnadseffektive og gjenbrukbare; det strukturelle
      verktøyet (nye former, tilpassede rails eller spesialkonstruksjoner) spesifiseres i tilbudsfasen.
      Der verktøy inngår, skrives kostnaden normalt av over den første
      produksjonssyklusen, i stedet for å komme som en engangsoverraskelse.
  - q: Hvilke betalingsvilkår bruker dere for produksjonsbestillinger?
    a: >-
      Standardvilkårene innebærer et depositum for å starte produksjonen, med restbeløpet forfaller
      før levering. Depositosatsen og forfallsdagen for restbeløpet avtales per
      bestilling og fastsettes i kontrakten. Etablerte partnere med jevn ordrestrøm
      kan diskutere mer fleksible vilkår — vi foretrekker noen ærlige, tydelige vilkår
      framfor kompliserte finansielle konstruksjoner.
  - q: Hvilken garanti tilbyr dere for større volumbestillinger?
    a: >-
      Hvert brett testes før levering med en 24-timers trykk- og lufttettingstest ved 18.0 PSI,
      og garantivilkårene fastsettes i hver bestillingskontrakt — de dekker
      produksjonsfeil som delaminering, sprengte sømmer og lekkende
      ventiler, og ekskluderer transportskader. Garantiperioden og skadebehandlingsprosedyren
      bekreftes i ordrebekreftelsen, ikke først i etterkant.
  - q: Hva skjer hvis brettene ankommer skadet eller med produksjonsfeil?
    a: >-
      Meld inn problemet innenfor den avtalte fristen (vanligvis 7–15 dager etter
      ankomst) med foto- eller videobevis. Vi verifiserer ut fra inspeksjonsrutinene ved
      levering som er etablert for din forsendelse, og hjelper deg deretter videre med ny
      produksjon, et bytte eller en kredittnota.
      De dokumenterte QC-bildene av varene dine gjør alt raskt og
      korrekt for begge parter.
  - q: Hvordan godkjennes skreddersydde trykk før produksjonen?
    a: >-
      Trykkene går gjennom en kontrollert godkjenningskjede: digital mockup, trykt korrektur,
      verifisering av første eksemplar på produksjonsbrettet og deretter serieproduksjon.
      Hvert trinn kontrolleres mot dine signerte trykk, og derfor
      samsvarer trykkfargene, EVA-layouten og plasseringen av logoen med merkevarefilen din når
      brettene ankommer.
  - q: Hvilke reservedeler leverer dere for kommersielle flåter?
    a: >-
      Flåteoperatører kan bestille reservedeler sammen med brettene sine eller ved
      kompletteringsbestillinger: reserveventiler, reparasjonssett (PVC-lapper og
      lim), finnbeskyttelse og finner, i tillegg til de mest utskiftbare tilbehørene. Delene
      sendes med produksjonen eller som mindre leveranser, slik at en defekt del
      aldri holder et helt brett ute av tjeneste lenge.
  - q: Hvilken informasjon bør jeg forberede før jeg ber om tilbud?
    a: >-
      Jo bedre briefen er, desto raskere blir tilbudet: målmarked og bruk,
      ønskede spesifikasjoner (mål, konstruksjon, trykk), antall og
      målpris, krav til merkevarebranding og emballasje samt din lanseringsplan. Vårt
      forespørselsskjema spør etter nøyaktig denne listen — hvis du deler den, sparer du
      tilbudsrunder og får et bedre estimat allerede i første runde.
  - q: Hvor lang tid tar prøveproduksjonen før produksjonen?
    a: >-
      Prototypeprøver sendes innen 7–12 dager så snart spesifikasjonen er fastslått.
      Regn i tillegg med verifiseringstiden for egne tester og eventuelle
      revisjonsrunder — de fleste prosjekter fullfører prøveproduksjonen på omtrent to til tre
      uker. Produksjonen starter etter prøvegodkjenningen, og derfor er prøvefasen
      det tidspunktet der ekstra omsorg lønner seg i form av spart tid senere.
