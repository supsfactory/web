faqs:
  - q: Kdo je iSupfactory?
    a: >-
      iSupfactory je výrobce SUP desek OEM a ODM z Qingdao v Číně, který pro značky,
      distributory a outdoorové firmy zajišťuje vývoj produktů, výrobu prototypů,
      vlastní výrobu, kontrolu kvality i exportní produkci.
  - q: Kde se vyrábějí produkty iSupfactory?
    a: >-
      Produkty SUP se vyrábějí v Qingdao v Číně.
  - q: Je iSupfactory výrobce OEM?
    a: >-
      Ano. iSupfactory vyrábí nafukovací SUP desky podle specifikací schválených
      zákazníkem, a to včetně rozměrů, materiálů, konstrukce, grafiky, příslušenství
      a balení.
  - q: Poskytuje iSupfactory služby vývoje produktů ODM?
    a: >-
      Ano. iSupfactory vyvíjí produkty SUP na základě zadání, požadavku trhu nebo
      výkonnostního cíle, a to od konstrukčního návrhu a výroby prototypu až po
      schválení vzorku a zahájení sériové výroby.
  - q: Mohu si nechat vyrobit SUP desku podle vlastních výkresů?
    a: >-
      Ano. Vaše výkresy, specifikace a referenční vzorky posoudíme z hlediska
      technologické zpracovatelnosti ještě před vydáním nabídky.
  - q: Umíte vyvinout SUP desku na základě nápadu?
    a: >-
      Ano. Projekty ODM mohou začínat konceptem, požadavkem trhu nebo výkonnostním cílem.
  - q: Mohu si objednat prototyp?
    a: >-
      Ano. Prototypové vzorky lze vyrobit před sériovou výrobou; vzorky dnes odesíláme
      do 7–12 dnů od schválení specifikace.
  - q: Jaká je výrobní dodací lhůta?
    a: >-
      Standardní výrobní dodací lhůta činí 25–35 dnů od potvrzení objednávky a úhrady
      zálohy, a to podle konfigurace projektu; zakázkové nástroje přidávají 15–20 dnů.
  - q: Jaké je minimální objednací množství (MOQ)?
    a: >-
      MOQ závisí na platformě, konstrukci, množství, požadavcích na balení a materiály.
      Malé série s vlastní značkou začínají na 5–10 ks a pilotní série na 20–50 ks; MOQ
      pro sériovou výrobu se potvrzuje podle konfigurace projektu.
  - q: Mohou kupující provést audit továrny?
    a: >-
      Ano. Audity kupujících i inspekce třetích stran lze zorganizovat podle požadavků
      projektu.
  - q: Kde se nachází Vaše společnost a továrna?
    a: >-
      Působíme v Qingdao v Číně. iSupfactory je výrobní divize společnosti Qingdao Vatrad
      Group Co., Ltd. — závodu na výrobu nafukovacích výrobků o rozloze 12 500 m²
      v zóně ekonomického rozvoje Laixi, který pracuje od roku 2012. Prodej a technická
      podpora jsou globální; výroba sídlí v Qingdao v Číně.
  - q: Poskytuje Vatrad služby OEM/ODM pro nafukovací vybavení pro vodní sporty?
    a: >-
      Ano. iSupfactory (za podpory Qingdao Vatrad Group Co., Ltd.) nabízí komplexní
      úpravy OEM a ODM — od 3D výkresů a výběru materiálu drop-stitch až po sériovou
      výrobu pro globální značky. Zajišťujeme vlastní značku na výrobku, zakázkové balení
      a dokumentaci shody pro BSCI, CE a další certifikace
  - q: Jaké certifikace má Vatrad pro výrobu nafukovacího vybavení pro vodní sporty?
    a: >-
      Továrna Vatrad má certifikace BSCI a ISO 9001. Certifikace CE se vztahuje na modely
      určené pro trhy EU; její rozsah se potvrzuje u každého projektu a závisí na cílovém
      trhu a konfiguraci produktu. Dokumentaci shody s REACH a RoHS poskytneme na vyžádání.
  - q: Jaké je minimální objednací množství (MOQ) pro OEM nafukovací pádlové desky?
    a: >-
      MOQ se potvrzuje podle konfigurace projektu, nikoli jako pevné číslo: každý
      projekt projde etapou vzorku (1–2 ks) a pilotní série (20–50 ks), zatímco
      standardní sériová výroba běží v dávkách 90–100+ ks z plného 150 m role drop-stitch.
      Malé série s vlastní značkou začínají na 5–10 ks. Úplnou výpočtovou logiku
      najdete v našem průvodci MOQ a flexibilním brandingu.
  - q: Jaké materiály používá Vatrad pro výrobu nafukovacích SUP desek?
    a: >-
      Na SUP desky používáme PVC tkaninu námořní třídy (0.9 mm–1.2 mm) s dvouvrstvým
      jádrem drop-stitch. Materiály pocházejí od certifikovaných dodavatelů a před výrobou
      se testují na pevnost v tahu, odolnost vůči UV záření a ohebnost za nízkých teplot.
  - q: Umí Vatrad zajišťovat velkoobjemové velkoobchodní objednávky pro mezinárodní kupující?
    a: >-
      Ano. Naše továrna o rozloze 12 500 m² vyrobí ročně přes 120 000 kusů, a to díky
      specializovanému týmu více než 350 kvalifikovaných pracovníků. Dodáváme do
      více než 50 zemí a zajišťujeme logistiku včetně FOB Qingdao, CIF do velkých přístavů
      a doručení „na dveře“ prostřednictvím našich dopravních partnerů.
  - q: Jaká je dodací lhůta OEM výroby nafukovacích SUP desek?
    a: >-
      Standardní dodací lhůta OEM výroby činí 25–35 dnů od potvrzení objednávky a úhrady
      zálohy. Vývoj zakázkové formy přidává 15–20 dnů na nástroje a prototypové vzorky
      odesíláme do 7–12 dnů. Spěšné objednávky přijímáme pro ověřené partnery při
      potvrzené zásobě materiálu.
  - q: Dodává Vatrad drop-stitch materiál vojenské třídy pro pádlové desky?
    a: >-
      Ano. Naše jádro drop-stitch používá PVC tkaninu námořní specifikace s pevností
      v tahu přesahující 2000 N/5 cm. Dvouvrstvý laminovací proces zajišťuje udržení tlaku
      18.0 PSI s poklesem tlaku pod 0.50 PSI za 24 hodin — dle našeho interního standardu
      nepropustnosti a těsnosti.
  - q: Jak Vatrad zajišťuje těsnost a odolnost vůči UV záření u svých nafukovacích výrobků?
    a: >-
      Každá nafukovací komora před odesláním projde 24hodinovým testem udržení tlaku při
      18.0 PSI; komory s poklesem tlaku nad 0.50 PSI se automaticky vyřazují. Odolnost
      vůči UV záření se potvrzuje zrychleným stárnutím s mezními hodnotami degradace pevnosti
      v tahu. Naše PVC směs obsahuje UV stabilizátory a antioxidační přísady pro
      dlouhodobou životnost v exteriéru.
  - q: Umí Vatrad pomoci s návrhem balení a brandingu pod vlastní značkou?
    a: >-
      Ano. Nabízíme komplexní balení pod vlastní značku na klíč: zakázkově navržené
      prodejní krabice, visací štítky, návody k obsluze a přepravní bedny s Vaší firemní
      grafikou. Náš designérský tým může pro nové účastníky trhu vytvořit kompletní
      vizuální identitu značky — od aplikace loga až po zážitek z rozbalování.
  - q: Přijímá Vatrad tovární audity od mezinárodních kupujících?
    a: >-
      Samozřejmě. Vítáme audity na místě i audity třetích stran, včetně BSCI, SMETA
      a inspekcí sociální shody dle požadavků zákazníka. Naše zařízení o rozloze 12 500 m²
      je připraveno na audit: máme zdokumentované procesy kontroly kvality, sledovatelnost
      materiálů a záznamy o ochraně zdraví a bezpečnosti pracovníků. Pro úvodní kvalifikaci
      jsou dostupné virtuální prohlídky továrny.
  - q: Jaká technologie drop-stitch se používá na SUP deskách Vatrad?
    a: >-
      Drop-stitch je tkaninová konstrukce, v níž tisíce polyesterových nití spojuje horní
      a spodní vrstvu PVC. Při nafukování na 12–15 PSI tyto nitě přitahují panely na pevnou
      vzdálenost a vytvářejí tuhou plochou platformu. Vatrad používá drop-stitch s fúzní
      laminací, při níž se nitě tepelně spojují s PVC, což zajišťuje vyšší odolnost
      proti delaminaci oproti tradičním jádrům lepeným lepidlem.
  - q: Jaké platformy potřebují začínají paddleři a zákazníci půjčoven?
    a: >-
      Kupující, kteří budují flotilu pro půjčovnu, resort nebo školu, obvykle začínají
      širokými univerzálními platformami s velkým objemem, které jsou stabilní pro
      začínající a univerzální pro každodenní komerční použití. Umíme také sestavit
      vícemístné desky pro skupinové lekce. Výběr platformy posoudíme podle Vašich
      cílových paddleřů ještě před výrobou vzorků.
  - q: Za jakých vodních podmínek mohou komerční SUP programy fungovat?
    a: >-
      Desky iSupfactory jsou určeny pro použití na moři, na jezeře i na řece. Turistické
      platformy zvládají příboj u břehu a všechny desky používají PVC tkaninu námořní
      třídy, která odolává korozi ve slané vodě. Pro flotily pracující ve slané vodě
      doporučujeme běžné oplachování čerstvou vodou mezi použitími a zahrneme jej do návodu
      pro obsluhu dodávaného s komerčními soupravami.
  - q: Dodáváte pumpy a nafukovací příslušenství v rámci komerčních souprav?
    a: >-
      Ano. Komerční soupravy zahrnují ruční dvouzápalové pumpy a pro resorty a půjčovny,
      které denně obsluhují více desek, jsou dostupné také elektrické pumpy. Volba pumpy,
      pádla, vodítka, ploutve, batohu a opravné sady se potvrzuje v rámci konfigurace
      příslušenství pro každý projekt.
  - q: Jak se desky balí pro expedici a dodání do maloobchodu?
    a: >-
      Sériová výroba se dodává vakuově zabalená, což snižuje objemovou hmotnost o 50–60 %.
      Pro maloobchodní programy dodáváme značkové krabice, návody, čárové kódy a označení
      krabic podle požadavků trhu a umíme sestavit kompletní sady s dělicími obaly, aby
      do každé krabice přišla stejná sada příslušenství.
  - q: Jakou hmotnost paddleře Vaše desky unesou?
    a: >-
      Univerzální platformy nesou až 220 lbs; turistické a jógové platformy až 250 lbs
      a na větších deskách jsou k dispozici varianty se zvýšenou nosností.
      Hmotnost paddleře, konstrukce a tlakové parametry jsou pro každou platformu
      uvedeny v technickém listu dříve, než se rozhodnete spustit sérii.
  - q: Co obsahuje kompletní komerční souprava?
    a: >-
      Kompletní souprava obvykle zahrnuje desku, cestovní batoh, ruční dvouzápalovou pumpu,
      vyjímatelnou ploutev, vinutí vodítko a opravnou sadu, s možností objednat pádlo
      a elektrickou pumpu jako doplněk. Obsah soupravy je pevně zafixován ve specifikaci
      (BOM) schválené zákazníkem, takže vzorek a sériová výroba se přesně shodují.
  - q: Umíte spojit desky, příslušenství a balení do jednoho programu?
    a: >-
      Ano. Programy s více položkami (SKU) pokrývají desky, příslušenství a maloobchodní
      balení v rámci jedné tovární smlouvy — sdílené sady příslušenství snižují skladové
      zásoby pro jednotlivé položky, jednotný designový systém zajišťuje konzistentní
      branding a jediný vlastník kvality řeší záležitosti týkající se záruky. Takto
      naši distributoři a maloobchodní partneři řídí kompletní řady SUP.
  - q: Jaký je rozdíl mezi OEM, ODM a vlastní značkou?
    a: >-
      OEM znamená výrobu podle Vaší schválené specifikace: Vaše výkresy, rozměry, materiály
      a balení. Design i duševní vlastnictví patří Vám. ODM znamená, že naši konstruktéři
      vyvinou desku podle Vašeho zadání — ať jde o koncept pro trh, výkonnostní cíl,
      nebo úpravu osvědčené platformy — a Vy výsledek schválíte před spuštěním výroby.
      Private label znamená Vaši značku, grafiku a balení na existující ověřené platformě
      bez konstrukčních změn. Většina projektů leží mezi těmito režimy a my nabídneme
      konfiguraci, která odpovídá tomu, jakou část produktového designu chcete vlastnit.
  - q: Kolik stojí prototypový vzorek a lze tuto částku započíst do objednávky?
    a: >-
      Cena vzorku vychází z konfigurace projektu: rozměr, konstrukce, grafika i balení
      ovlivňují nabídku. U projektů, které přecházejí do sériové výroby, se cena vzorku
      obvykle započítává do první výrobní objednávky — podmínky započtení potvrdíme
      písemně ve fázi vydání nabídky, aby později nedošlo k nepříjemným překvapením.
  - q: Kolik nafukovacích pádlových desek se vejde do 20ft kontejneru?
    a: >-
      Do standardního 20ft kontejnu se obvykle vejde 150–200 kompletních sad vakuově
      zabalených 11 ft desek s příslušenstvím; přesný počet závisí na návrhu balení,
      složení příslušenství a rozměru krabic. Náš balicí tým vypočítá plán nakládky
      podle Vaší skutečné specifikace (BOM), takže vypočtené číslo odpovídá skutečně
      odeslanému množství.
  - q: Co zahrnuje Vaše velkoobchodní nabídka — FOB, nebo CIF?
    a: >-
      Nabídky jsou rozčleněné: produkt, standardní balení a doprava podle Vámi zvolených
      dodacích podmínek (Incoterms). Základem je FOB Qingdao; k dispozici jsou také
      CIF do velkých přístavů a doručení „na dveře“ prostřednictvím našich dopravních
      partnerů. Každá nabídka uvádí přesný rozsah zahrnutého, abyste porovnávali
      srovnatelné podmínky napříč jednotlivými dodavateli.
  - q: Účtujete poplatek za nástroje nebo formy u zakázkových desek?
    a: >-
      Příprava tiskových forem a šablon je levná a opakovaně použitelná; konstrukční
      nástroje (nové tvary, zakázkové zesílené hrany nebo unikátní konstrukce) se naceněňují
      zvlášť ve fázi vydání nabídky. Tam, kde nástroje připadají v úvahu, se jejich cena
      obvykle rozloží do první výrobní dávky, místo aby byla účtována jako jednorázový
      překvapivý poplatek.
  - q: Jaké platební podmínky uplatňujete u výrobních objednávek?
    a: >-
      Standardní podmínkou je záloha, která zajišťuje rezervaci výroby, a zbytek je uhrazen
      před odesláním. Procento zálohy a termín úhrady zbytku se sjednávají u každé
      objednávky a uvádějí ve smlouvě. Ověření partneři se stabilní objednávkovou historií
      mohou jednat o prodloužené podmínky — dáváme přednost několika poctivým podmínkám
      před složitými finančními schématy.
  - q: Jakou záruku poskytujete u velkoobchodních objednávek?
    a: >-
      Každá deska před odesláním projde 24hodinovým testem udržení tlaku při 18.0 PSI
      a záruční podmínky jsou uvedeny v objednávce každého zákazníka — pokrývají výrobní
      vady, jako je delaminace, prasknutí švů a netěsnost ventilů, a nevztahují se na poškození
      vzniklé používáním. Doba záruky a postup při reklamaci se potvrzují v nákupním
      příkazu, nikoli dodatečně.
  - q: Co když dorazí desky poškozené nebo s výrobními vadami?
    a: >-
      Nahlaste problém v dohodnutém termínu (zpravidla 7–15 dnů od doručení) a přiložte
      fotografie nebo video. My ho posoudíme podle protokolů předexpediční kontroly, které
      vedeme pro Vaši dávku, a následně provedeme přepracování, výměnu nebo úvěr. Zdokumentované
      fotografie kontroly kvality Vašeho zboží tento proces urychlí a udělají ho
      férovým pro obě strany.
  - q: Jak se schvaluje zakázková grafika před spuštěním výroby?
    a: >-
      Grafika prochází řízeným schvalovacím řetězcem: digitální maketa, tištěný proof,
      kontrola prvního kusu na produkční desce a poté sériová výroba. Každý krok se porovnává
      s Vámi podepsanou grafikou, proto při dodání desek odpovídají tištěné barvy, rozložení
      EVA a umístění loga Vašemu značkovému souboru.
  - q: Jaké náhradní díly dodáváte pro komerční flotily?
    a: >-
      Provozovatelé flotil si mohou objednat servisní díly společně s deskami nebo při
      opakované objednávce: náhradní ventily, opravné sady (laminované záplaty z PVC
      a lepidlo), boxy na ploutev a ploutve a nejčastěji vyměňované příslušenství. Náhradní
      díly odesíláme spolu s výrobou nebo jako samostatné malé zásilky, takže rozbitá
      součástka nevyřadí celou desku z provozu na dlouho.
  - q: Jaké údaje si mám připravit před žádostí o nabídku?
    a: >-
      Čím podrobnější zadání, tím rychlejší nabídka: cílový trh a způsob použití,
      požadované parametry (rozměr, konstrukce, tlak), množství a cílová cena, požadavky
      na branding a balení a termín spuštění. Náš formulář pro dotazy sbírá přesně tyto
      údaje — jejich předání šetří iterace výpočtu a hned na první poptávce získáte
      pevnější odhad.
  - q: Jak dlouho trvá výroba vzorků před sériovou výrobou?
    a: >-
      Prototypové vzorky odesíláme do 7–12 dnů od schválení specifikace. Připočítejte
      čas na Vaše testy a jedno až dvě kola úprav — u většiny projektů trvá výroba vzorků
      zhruba dva až tři týdny. Výroba začíná po schválení vzorku, takže právě etapa
      vzorku je místem, kde se extra péče vyplatí v pozdější ušetřeném čase.
