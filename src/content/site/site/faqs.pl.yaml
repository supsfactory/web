faqs:
  - q: Kim jest iSupfactory?
    a: >-
      iSupfactory to producent OEM i ODM desek SUP z siedzibą w Qingdao w Chinach, który oferuje rozwój produktów, prototypy, produkcję, kontrolę jakości i produkcję eksportową dla marek, dystrybutorów oraz firm outdoorowych.
  - q: Gdzie produkowane są wyroby iSupfactory?
    a: >-
      Deski SUP produkujemy w Qingdao w Chinach.
  - q: Czy iSupfactory jest producentem OEM?
    a: >-
      Tak. iSupfactory produkuje nadmuchiwane deski SUP zgodnie ze specyfikacjami zatwierdzonymi przez klienta, w tym z wymiarami, materiałami, konstrukcją, grafiką, akcesoriami i opakowaniem.
  - q: Czy iSupfactory oferuje rozwój produktów w modelu ODM?
    a: >-
      Tak. iSupfactory opracowuje produkty SUP od briefu produktowego, wymagania rynkowego lub celu wydajności, przez projektowanie inżynieryjne, wykonanie prototypu i akceptację próbki aż po produkcję.
  - q: Czy mogę zlecić produkcję deski SUP na podstawie własnych rysunków?
    a: >-
      Tak. Twoje rysunki, specyfikacje i produkty referencyjne oceniamy pod kątem możliwości wykonania przed przygotowaniem oferty.
  - q: Czy możesz opracować deskę SUP na podstawie pomysłu?
    a: >-
      Tak. Projekty ODM mogą rozpoczynać się od koncepcji, wymagania rynkowego lub celu wydajności.
  - q: Czy mogę zamówić prototyp?
    a: >-
      Tak. Próbki prototypowe można wyprodukować przed rozpoczęciem produkcji seryjnej; obecnie wysyłamy je w ciągu 7–12 dni od ustalenia specyfikacji.
  - q: Ile trwa realizacja produkcji?
    a: >-
      Standardowy czas realizacji produkcji wynosi 25–35 dni od potwierdzenia zamówienia (PO) i wpłaty zaliczki, w zależności od konfiguracji projektu; niestandardowe oprzyrządowanie wydłuża ten czas o 15–20 dni.
  - q: Jaka jest minimalna ilość zamówienia (MOQ)?
    a: >-
      Minimalna ilość zamówienia (MOQ) zależy od platformy, konstrukcji, wielkości serii, wymagań dotyczących opakowania i materiałów. Małe serie z co-brandingiem zaczynają się od 5–10 szt., a partie pilotażowe od 20–50 szt.; MOQ dla produkcji seryjnej potwierdzamy na podstawie konfiguracji projektu.
  - q: Czy kupujący mogą przeprowadzić audyt fabryki?
    a: >-
      Tak. Audyty kupujących oraz inspekcje stron trzecich można zorganizować zgodnie z wymaganiami projektu.
  - q: Gdzie znajduje się Twoja firma i fabryka?
    a: >-
      Działamy w Qingdao w Chinach. iSupfactory to dział produkcyjny Qingdao Vatrad Group Co., Ltd. —
      zakład produkcji wyrobów nadmuchiwanych o powierzchni 12 500 m² w Laixi Economic
      Development Zone, działający od 2012 roku. Sprzedaż i wsparcie techniczne
      są globalne; produkcja odbywa się w Qingdao w Chinach.
  - q: Czy Vatrad świadczy usługi OEM/ODM w zakresie nadmuchiwanych sprzętów sportów wodnych?
    a: >-
      Tak. iSupfactory (wspierana przez Qingdao Vatrad Group Co., Ltd.) oferuje kompleksowe
      dostosowanie OEM i ODM — od rysunków 3D i doboru materiału drop-stitch
      po produkcję seryjną dla globalnych marek. Zajmujemy się private label,
      niestandardowym opakowaniem oraz dokumentacją zgodności dla BSCI, CE i innych certyfikacji
  - q: Jakie certyfikacje posiada Vatrad w zakresie produkcji nadmuchiwanych sprzętów sportów wodnych?
    a: >-
      Fabryka Vatrad posiada certyfikaty BSCI i ISO 9001. Certyfikacja CE
      dotyczy modeli przeznaczonych na rynki UE; jej zakres potwierdzamy w ramach każdego projektu
      i zależy on od rynku docelowego oraz konfiguracji produktu. Dokumentację zgodności
      z REACH i RoHS udostępniamy na życzenie.
  - q: Jaka jest minimalna ilość zamówienia (MOQ) dla nadmuchiwanych desek SUP w modelu OEM?
    a: >-
      MOQ potwierdzamy na podstawie konfiguracji projektu, a nie jako stałą wartość: każdy
      projekt przechodzi przez etap próbki (1–2 szt.) i pilotażu (20–50 szt.),
      a standardowa produkcja seryjna to 90–100+ szt. w serii z pełnej rolki
      drop-stitch długości 150 m. Małe serie z co-brandingiem zaczynają się od 5–10 szt. Pełną
      logikę obliczeń przedstawiamy w naszym przewodniku MOQ i elastyczne budowanie marki.
  - q: Z jakich materiałów korzysta Vatrad w produkcji nadmuchiwanych desek SUP?
    a: >-
      Do desek SUP stosujemy PCV klasy morskiej (0.9 mm–1.2 mm) z dwuwarstwowym rdzeniem drop-stitch. Materiały pozyskujemy od certyfikowanych dostawców, a przed produkcją badamy je pod kątem wytrzymałości na rozciąganie, odporności na UV i giętkości w niskiej temperaturze.
  - q: Czy Vatrad obsługuje duże zamówienia hurtowe od kupujących międzynarodowych?
    a: >-
      Tak. Nasza fabryka o powierzchni 12 500 m² produkuje rocznie ponad 120 000 szt., a w pracach
      uczestniczy zespół ponad 350 wykwalifikowanych pracowników. Wysyłamy do ponad 50 krajów
      i zarządzamy logistyką, w tym FOB Qingdao, CIF do głównych portów oraz dostawę
      od drzwi do drzwi we współpracy z naszymi partnerami logistycznymi.
  - q: Ile trwa realizacja produkcji OEM nadmuchiwanych desek SUP?
    a: >-
      Standardowy czas realizacji produkcji OEM wynosi 25–35 dni od potwierdzenia zamówienia (PO)
      i wpłaty zaliczki. Opracowanie niestandardowych form wydłuża czas o 15–20 dni na oprzyrządowanie, a
      próbki prototypowe wysyłamy w ciągu 7–12 dni. Zamówienia pilne realizujemy dla
      sprawdzonych partnerów, gdy surowiec jest dostępny w magazynie.
  - q: Czy Vatrad dostarcza materiał drop-stitch klasy wojskowej na deski paddle?
    a: >-
      Tak. Nasz rdzeń drop-stitch wykorzystuje tkaninę PCV klasy morskiej o wytrzymałości na rozciąganie
      przekraczającej 2000 N/5 cm. Proces laminowania dwuwarstwowego
      zapewnia retencję ciśnienia na poziomie 18.0 PSI przy spadku poniżej
      0.50 PSI w ciągu 24 godzin — zgodnie ze standardem szczelności obowiązującym w naszej fabryce.
  - q: W jaki sposób Vatrad zapewnia szczelność i odporność swoich wyrobów na UV?
    a: >-
      Każdy nadmuchiwany wąż przechodzi przed wysyłką 24-godzinną próbę trzymania ciśnienia na poziomie 18.0 PSI;
      komory o spadku ciśnienia przekraczającym 0.50 PSI są
      automatycznie odrzucane. Odporność na UV potwierdzamy metodą przyspieszonych badań
      starzeniowych z określonymi progami degradacji wytrzymałości na rozciąganie. Nasza mieszanka PCV zawiera
      stabilizatory UV i dodatki antyoksydacyjne, co zapewnia długotrwałą trwałość na zewnątrz.
  - q: Czy Vatrad pomaga w projektowaniu opakowań i budowaniu marki private label?
    a: >-
      Tak. Oferujemy kompletne opakowanie private label: projektowane indywidualnie opakowania
      detaliczne, zawieszki, instrukcje obsługi i kartony transportowe z Twoją
      grafiką. Nasz wewnętrzny zespół projektowy może opracować pełną identyfikację
      wizualną marki dla nowych graczy — od zastosowania logo po doświadczenie z rozpakowywania.
  - q: Czy Vatrad przyjmuje audyty fabryki z ramienia międzynarodowych kupujących?
    a: >-
      Oczywiście. Zapraszamy na audyty fabryki na miejscu oraz audyty prowadzone przez strony trzecie,
      w tym audyty BSCI, SMETA i inspekcje zgodności społecznej specyficzne dla klienta. Nasz
      obiekt o powierzchni 12 500 m² jest gotowy do audytu: mamy udokumentowane procesy kontroli jakości,
      identyfikowalność materiałów oraz dokumentację BHP pracowników. Możliwe są wirtualne
      wizyty w fabryce na etapie kwalifikacji wstępnej.
  - q: Jaka technologia drop-stitch jest stosowana w deskach Vatrad?
    a: >-
      Drop-stitch to konstrukcja tkaniny, w której tysiące poliestrowych nici
      łączy górną i dolną warstwę PCV. Po nadmuchaniu do 12–15 PSI nici te
      rozciągają panele na ustaloną odległość, tworząc sztywną, płaską
      platformę. Vatrad stosuje drop-stitch laminowany fuzyjnie — nici są
      termicznie wiązane z PCV — co zapewnia lepszą odporność na rozwarstwienie niż
      tradycyjne rdzenie klejone.
  - q: Jakie platformy potrzebują osoby stawiające pierwsze kroki na desce oraz goście wypożyczalni?
    a: >-
      Kupujący planujący floty wypożyczalni, ośrodków wypoczynkowych lub szkół zwykle zaczynają od szerokich,
      dużej pojemności platform allround, które są stabilne dla początkujących i uniwersalne
      w codziennym użytkowaniu komercyjnym. Możemy także skonfigurować deski dla kilku osób
      na zajęcia grupowe. Wybór platformy omawiamy z Twoimi docelowymi użytkownikami przed wykonaniem próbki.
  - q: W jakich warunkach wodnych mogą działać komercyjne programy SUP?
    a: >-
      Deski iSupfactory są przeznaczone do używania na morzu, jeziorach i rzekach. Platformy
      turystyczne radzą sobie z falą przybrzeżną, a wszystkie deski wykorzystują PCV klasy morskiej,
      który opiera się na korozji w wodzie słonej. W przypadku flot używanych na wodzie słonej zalecamy
      standardowe płukanie wodą słodką między użyciami i dołączamy tę instrukcję do wytycznych dla operatora
      przekazywanych wraz z zestawami komercyjnymi.
  - q: Czy w zestawach komercyjnych dostarczane są pompki i akcesoria do pompowania?
    a: >-
      Tak. Zestawy komercyjne obejmują pompki dwuosiowe, a dla ośrodków wypoczynkowych i wypożyczalni obsługujących kilka desek dziennie dostępne są warianty z pompą elektryczną. Dobór pompy, wiosła, smyczy, płetwy, plecaka i zestawu naprawczego potwierdzamy w ramach konfiguracji akcesoriów dla każdego projektu.
  - q: W jaki sposób deski są pakowane do wysyłki i dostawy detalicznej?
    a: >-
      Produkcja seryjna jest wysyłana w opakowaniach próżniowych, co zmniejsza wagę objętościową o
      50–60%. W przypadku programów detalicznych dostarczamy kartony z Twoim nadrukiem, instrukcje,
      kody kreskowe oraz oznaczenia kartonów zgodne z wymogami danego rynku, a możemy też przygotować
      gotowe zestawy z przegródkami, dzięki czemu w każdym kartonie trafia ten sam zestaw akcesoriów.
  - q: Jaki zakres masy użytkownika obsługują Twoje deski?
    a: >-
      Platformy allround obsługują użytkowników do 220 lbs; platformy turystyczne i jogi
      do 250 lbs, a wersje o większej nośności są dostępne w większych rozmiarach.
      Masa użytkownika, konstrukcja i znamionowe ciśnienie są podane dla każdej
      platformy w karcie technicznej, zanim podejmiesz decyzję o realizacji serii.
  - q: Co obejmuje kompletny zestaw komercyjny?
    a: >-
      Kompletny zestaw obejmuje zwykle deskę, plecak podróżny, pompkę dwuosiową,
      wymienną płetwę, smycz spiralną i zestaw naprawczy, a opcjonalnie wiosło
      i pompę elektryczną w wersji rozszerzonej. Zawartość zestawu jest utrwalona w liście materiałowej (BOM)
      zatwierdzonej przez klienta, dzięki czemu próbka i produkcja seryjna są identyczne.
  - q: Czy można połączyć deski, akcesoria i opakowania w jeden program?
    a: >-
      Tak. Programy multi-SKU obejmują deski, akcesoria i opakowania
      detaliczne na podstawie jednej umowy z fabryką — wspólne zestawy akcesoriów ograniczają zapas magazynowy dla każdego wariantu,
      jeden system projektowy zapewnia spójność marki, a jedna osoba odpowiedzialna za jakość obsługuje reklamacje
      z tytułu gwarancji. Tak właśnie nasi dystrybutorzy i partnerzy detaliczni prowadzą kompletne linie produktów SUP.
  - q: Czym różni się OEM, ODM i private label?
    a: >-
      OEM oznacza, że produkujemy zgodnie z Twoją zatwierdzoną specyfikacją — Twoimi rysunkami,
      wymiarami, materiałami i opakowaniem. Projekt i własność intelektualna należą do Ciebie. ODM oznacza, że nasz zespół
      inżynieryjny opracowuje deskę na podstawie briefu — niezależnie od tego, czy jest to koncepcja rynkowa, cel wydajności
      czy adaptacja sprawdzonej platformy — a Ty zatwierdzasz projekt przed produkcją. Private label oznacza natomiast
      Twoją markę, grafikę i opakowanie na istniejącej, zwalidowanej platformie, bez zmian konstrukcyjnych. Większość projektów
      mieści się pomiędzy tymi trybami, a my wyceniamy konfigurację odpowiadającą temu, ile projektu produktu chcesz przejąć.
  - q: Ile kosztuje próbka prototypowa i czy opłatę można zaliczyć na poczet zamówienia?
    a: >-
      Koszt próbki zależy od konfiguracji projektu: na wycenę wpływają rozmiar, konstrukcja,
      grafika i opakowanie. W przypadku projektów przechodzących do produkcji seryjnej opłata za próbkę jest zazwyczaj
      zaliczana na poczet pierwszego zamówienia produkcyjnego — warunki zaliczki potwierdzamy na piśmie na etapie wyceny,
      aby później nie było żadnych niespodzianek.
  - q: Ile nadmuchiwanych desek paddle mieści się w kontenerze 20-stopowym?
    a: >-
      Na standardowym kontenerze 20-stopowym mieści się zwykle 150–200 kompletnych zestawów
      11-stopowych desek w opakowaniach próżniowych wraz z akcesoriami — dokładna liczba
      zależy od projektu opakowania, zestawu akcesoriów i rozmiaru kartonu. Nasz zespół
      opakowań wylicza plan załadunku na podstawie Twojej rzeczywistej listy materiałowej, więc liczba, na której planujesz, jest liczbą, którą wysyłamy.
  - q: Co obejmują Twoje oferty hurtowe — FOB czy CIF?
    a: >-
      Oferty przygotowujemy pozycjowo: produkt, opakowanie standardowe i fracht na podstawie
      wybranego Incoterms. Podstawą jest FOB Qingdao, a CIF do głównych portów oraz dostawa od drzwi do drzwi
      są dostępne we współpracy z naszymi partnerami logistycznymi.
      Każda oferta wskazuje dokładny zakres tego, co obejmuje, dzięki czemu nie porównujesz
      różnych rzeczy u różnych dostawców.
  - q: Czy są pobierane opłaty za oprzyrządowanie lub formy przy deskach na zamówienie?
    a: >-
      Przygotowanie grafiki i formy drukarskie są tanie i można je wykorzystywać wielokrotnie; oprzyrządowanie konstrukcyjne
      (nowe kształty, niestandardowe listwy krawędziowe lub unikalna konstrukcja) jest wyceniane pozycjowo
      na etapie oferty. Tam, gdzie oprzyrządowanie jest wymagane, koszt jest zwykle rozłożony na pierwszą serię
      produkcyjną, a nie doliczany niespodziewanie jako opłata jednorazowa.
  - q: Jakie warunki płatności obowiązują przy zamówieniach produkcyjnych?
    a: >-
      Standardowe warunki to zaliczka blokująca produkcję, a pozostała kwota płatna przed wysyłką.
      Wysokość zaliczki i termin płatności salda ustalamy dla każdego zamówienia i zapisujemy w umowie. Sprawdzonych partnerów
      z konsekwentną historią zamówień możemy zaprosić do rozmowy o wydłużonych terminach — wolimy kilka uczciwych warunków
      niż skomplikowane konstrukcje finansowe.
  - q: Jaką gwarancję otrzymujesz przy zamówieniach hurtowych?
    a: >-
      Każda deska przechodzi przed wysyłką 24-godzinną próbę trzymania ciśnienia na poziomie 18.0 PSI,
      a warunki gwarancji są zapisane w umowie każdego zamówienia — obejmują wady produkcyjne,
      takie jak rozwarstwienie, nieszczelność szwów i przeciekające zawory, a wyłączają uszkodzenia wynikające z użytkowania.
      Okres gwarancji i procedura reklamacyjna są potwierdzone w zamówieniu, a nie dowiadywane się o nich po fakcie.
  - q: Co się stanie, jeśli deski dotrą uszkodzone lub z wadami produkcyjnymi?
    a: >-
      Prosimy zgłosić problem w uzgodnionym terminie (zwykle 7–15 dni od
      dostawy), dołączając zdjęcia lub nagranie wideo. Oceniamy go na podstawie dokumentacji z kontroli przedwysyłkowej
      prowadzonej dla Twojej partii, a następnie wykonujemy naprawę, wymianę lub wystawiamy nota kredytową.
      Udokumentowane zdjęcia z kontroli jakości Twojego zapasu sprawiają, że procedura jest szybka
      i uczciwa dla obu stron.
  - q: W jaki sposób zatwierdza się niestandardową grafikę przed produkcją?
    a: >-
      Grafika przechodzi kontrolowany łańcuch zatwierdzeń: makietę cyfrową, próbny
      druk, kontrolę pierwszego egzemplarza na desce produkcyjnej, a następnie produkcję całej partii.
      Każdy etap jest porównywany z Twoim zatwierdzonym plikiem, dlatego kolory druku, rozmieszczenie EVA
      i położenie logo odpowiadają plikowi marki w chwili dostawy desek.
  - q: Jakie części zamienne są dostępne do flot komercyjnych?
    a: >-
      Operatorzy flot mogą zamawiać części eksploatacyjne razem z deskami lub przy zamówieniach uzupełniających: wymienne zawory, zestawy naprawcze (łaty z PCV i klej),
      skrzynki na płetwy i płetwy oraz najczęściej wymieniane akcesoria. Części zamienne wysyłamy razem z produkcją lub
      jako małe przesyłki, więc uszkodzony element nie wyłącza całej deski z eksploatacji na długo.
  - q: Jakie informacje powinienem przygotować przed poproszeniem o wycenę?
    a: >-
      Im lepszy brief, tym szybsza wycena: rynek docelowy i sposób użytkowania,
      pożądane parametry (rozmiar, konstrukcja, ciśnienie), wielkość serii i cena docelowa,
      potrzeby w zakresie marki i opakowania oraz harmonogram wdrożenia. Nasz
      formularz zapytania zbiera dokładnie tę listę — udostępnienie go skraca cykle wyceny i pozwala uzyskać bardziej wiarygodny
      szacunek już za pierwszym razem.
  - q: Ile trwa wykonanie próbek przed produkcją?
    a: >-
      Próbki prototypowe wysyłamy w ciągu 7–12 dni od ustalenia specyfikacji.
      Należy doliczyć czas na Twoje testy i ewentualną rundę poprawek —
      większość projektów kończy etap próbek w około dwa do trzech tygodni. Produkcja
      rozpoczyna się po akceptacji próbki, więc etap próbki to jedyne miejsce, w którym dodatkowa staranność zwraca się później zaoszczędzonym czasem.
