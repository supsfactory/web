faqs:
  - q: Vad är iSupfactory?
    a: >-
      iSupfactory är en OEM- och ODM-tillverkare av SUP-brädor i Qingdao, Kina, och erbjuder produktutveckling, prototyping, tillverkning, kvalitetskontroll och exportproduktion för varumärken, distributörer och företag inom friluftslivsbranschen.
  - q: Var tillverkas iSupfactorys produkter?
    a: >-
      Våra SUP-produkter tillverkas i Qingdao, Kina.
  - q: Är iSupfactory en OEM-tillverkare?
    a: >-
      Ja. iSupfactory tillverkar uppblåsbara SUP-brädor enligt kundgodkända specifikationer, inklusive mått, material, konstruktion, artwork, tillbehör och förpackning.
  - q: Erbjuder iSupfactory ODM-produktutveckling för varumärken?
    a: >-
      Ja. iSupfactory utvecklar SUP-produkter utifrån en produktbrief, ett marknadsbehov eller ett prestandamål, via konstruktion, prototyputveckling, provgodkännande och tillverkning.
  - q: Kan jag få en SUP tillverkad utifrån mina egna designer?
    a: >-
      Ja. Ritningar, specifikationer och referensprodukter som tillhandahålls av kunden bedöms avseende tillverkningsbarhet innan offerten lämnas.
  - q: Kan ni utveckla en SUP utifrån en idé?
    a: >-
      Ja. ODM-projekt kan starta från ett koncept, ett marknadsbehov eller ett prestandamål.
  - q: Kan jag beställa en prototyp?
    a: >-
      Ja. Prototypprov kan tillverkas före serietillverkningen; prover skickas i dag inom 7–12 dagar så snart specifikationen är fastställd.
  - q: Hur lång är er tillverkningstid?
    a: >-
      Standardtillverkningstiden är 25–35 dagar efter bekräftad order och deposition, beroende på projektkonfiguration; anpassade former tar 15–20 dagar till.
  - q: Vilken är er minsta beställningskvantitet (MOQ)?
    a: >-
      MOQ beror på plattform, konstruktion, kvantitet, förpackning och materialbehov. Co-branding i små volymer startar vid 5–10 st. och pilotpartier vid 20–50 st.; MOQ för serietillverkning bekräftas utifrån projektkonfigurationen.
  - q: Kan kunder utföra fabriksrevisioner?
    a: >-
      Ja. Kundrevisioner och tredjepartsinspektioner kan arrangeras utifrån projektens krav.
  - q: Var är ert företag och er fabrik belägna?
    a: >-
      Vi är baserade i Qingdao, Kina. iSupfactory är produktionsdivisionen inom Qingdao Vatrad Group Co., Ltd. — en
      produktionsanläggning för uppblåsbara produkter på 12 500 m² i Laixis ekonomiska utvecklingszon, i
      drift sedan 2012. Försäljning och teknisk support sker globalt; produktionen
      sker i Qingdao, Kina.
  - q: Erbjuder Vatrad OEM/ODM-tjänster för uppblåsbara vattensportprodukter?
    a: >-
      Ja. iSupfactory (med stöd av Qingdao Vatrad Group Co., Ltd.) erbjuder en fullständig
      OEM- och ODM-anpassning — från 3D-ritningar och materialvalet för drop-stitch
      till serietillverkning för globala varumärken. Vi hanterar private labeling,
      anpassad förpackning och konformitetsdokumentation för BSCI, CE och andra certifieringar.
  - q: Vilka certifieringar har Vatrad för tillverkning av uppblåsbara vattensportprodukter?
    a: >-
      Vatradfabriken är certifierad enligt BSCI och ISO 9001. CE-certifiering
      gäller modeller avsedda för EU-marknaden; omfattningen bekräftas per projekt
      och varierar med målmarknad och produktkonfiguration. Dokumentation för REACH och RoHS
      lämnas på begäran.
  - q: Vilken är minsta beställningskvantitet (MOQ) för uppblåsbara OEM-paddelbrädor?
    a: >-
      MOQ bekräftas utifrån projektkonfigurationen, inte via ett fast tal: varje
      projekt går igenom faserna provtagning (1–2 st.) och pilotparti (20–50 st.),
      medan standardserietillverkning omfattar 90–100+ st. per parti från en
      hel rulle drop-stitch på 150 m. Co-branding i små volymer startar vid 5–10 st. Se
      vår guide för MOQ och flexibel branding för hela beräkningslogiken.
  - q: Vilka material använder Vatrad för tillverkning av uppblåsbara SUP-brädor?
    a: >-
      Vi använder PVC av marinkvalitet (0.9 mm–1.2 mm) med en kärna med dubbla
      drop-stitch-lager till SUP-brädorna. Materialen kommer från certifierade leverantörer och testas
      före tillverkningen på draghållfasthet, UV-beständighet
      och flexibilitet vid låga temperaturer.
  - q: Kan Vatrad hantera stora grossistbeställningar för internationella köpare?
    a: >-
      Ja. Vår fabrik på 12 500 m² producerar mer än 120 000 st. per år med ett
      dedikerat team på mer än 350 kvalificerade tekniker. Vi levererar till över 50 länder och
      hanterar logistiken inklusive FOB Qingdao, CIF till de viktigaste hamnerna och
      leverans till dörren via våra fraktpartners.
  - q: Vilken är leveranstiden för OEM-tillverkning av uppblåsbara SUP-brädor?
    a: >-
      Standardleveranstiden för OEM-tillverkning är 25–35 dagar efter bekräftad order och
      deposition. Utveckling av anpassade former tar 15–20 dagar extra för verktyget, och
      prototypprov skickas inom 7–12 dagar. Brådskande beställningar är möjliga för
      etablerade partners med bekräftade materialreserver.
  - q: Levererar Vatrad drop-stitch-material av militär kvalitet för paddelbrädor?
    a: >-
      Ja. Vår drop-stitch-kärna använder PVC-väv i marinkvalitet med
      en draghållfasthet på mer än 2000 N/5cm. Lamineringen i två lager
      upprätthåller lufttätheten vid 18.0 PSI med ett tryckfall på mindre än
      0.50 PSI under 24 timmar — och uppfyller därmed fabrikens lufttäthetsnorm.
  - q: Hur garanterar Vatrad lufttäthet och UV-beständighet i sina uppblåsbara produkter?
    a: >-
      Varje uppblåsbart luftsystem testas före leverans med ett 24-timmars tryck- och lufttäthetstest vid 18.0 PSI;
      kamrar med ett tryckfall på mer än 0.50 PSI
      kvalificeras automatiskt. UV-beständigheten valideras genom accelererad åldrande
      med gränsvärden för försämring av draghållfastheten. Vår PVC-formulering innehåller
      UV-stabilisatorer och antioxidanttillsatser för lång livslängd
      utomhus.
  - q: Kan Vatrad stödja förpackningsdesign och private label-branding?
    a: >-
      Ja. Vi erbjuder färdiga private label-förpackningar: skräddarsydda
      handelskartonger, handtag, användarhandböcker och transportkartonger med ditt
      varumärke tryckt på. Vårt interna designteam kan ta fram en komplett visuell varumärkesidentitet
      för nya marknadsaktörer — från logotypens placering till uppackningsupplevelsen.
  - q: Accepterar Vatrad fabriksrevisioner från internationella köpare?
    a: >-
      Absolut. Vi välkomnar platsbesiktningar och fabriksrevisioner av tredje part, inklusive
      BSCI, SMETA och kundspecifika revisioner av social regelefterlevnad. Vår
      anläggning på 12 500 m² är revisionsklar, med dokumenterade QC-processer, materialspårbarhet
      och säkerhetsregistreringar på verkstadsgolvet. Virtuella fabriksturer
      finns tillgängliga för den första kvalificeringen.
  - q: Vad är drop-stitch-tekniken i Vatrad SUP-brädor?
    a: >-
      Drop-stitch är en textilkonstruktion där tusentals polyestertrådar
      binder samman det övre och det undre PVC-lagret. När brädan blåses upp till 12–15 PSI håller
      trådarna ytorna på ett bestämt avstånd och bildar en styv, platt struktur.
      Vatrad använder fusiegelast drop-stitch — där trådarna
      termiskt integreras i PVC:et — för överlägsen delamineringsbeständighet jämfört
      med traditionellt limmade kärnor.
  - q: Vilka plattformar passar nybörjare och uthyrningskunder?
    a: >-
      Köpare som planerar flottor för uthyrning, resorts eller skolor börjar vanligtvis med breda,
      rymliga allround-plattformar som är stabila för nybörjare och flexibla för daglig
      kommersiell användning. Vi kan dessutom konfigurera flerpersonersbrädor
      för grupplektioner. Plattformsvalet anpassas till din
      målgrupp före provtagningen.
  - q: I vilka vattenförhållanden kan kommersiella SUP-program bedrivas?
    a: >-
      iSupfactorys brädor är byggda för användning i sötvatten, älvar och hav. Touring-
      plattformarna klarar dyningen, och alla brädor använder PVC av marinkvalitet som
      motstår korrosion. För flottor i saltvatten rekommenderar vi den
      vanliga rutinen att skölja med färskvatten mellan turerna, och vi tar med den i
      operatörshandboken som levereras med de kommersiella kiten.
  - q: Levererar ni pumpa och uppblåsningstillbehör för kommersiella kit?
    a: >-
      Ja. Kommersiella kit innehåller dubbelcylindriga handpumpar, med
      alternativ för elektriska pumpar för resorts och uthyrningsföretag som hanterar flera
      brädor per dag. Valet av pumpa, paddel, leash, fena, ryggsäck och reparationssats
      bekräftas som en del av varje projekts tillbehörskonfiguration.
  - q: Hur förpackas brädorna för frakt och kommersiell leverans?
    a: >-
      Serietillverkning skickas vakuumförpackad för att minska den volymetriska vikten med
      50–60 %. För kommersiella program levererar vi tryckta kartonger, manualer,
      streckkoder och kartongmärkning beroende på marknad, och vi kan
      förpacka kompletta kit separat så att varje kartong innehåller samma tillbehörsuppsättning.
  - q: Vilka viktklasser av paddlare stöder era brädor?
    a: >-
      Allround-plattformarna klarar upp till 220 lbs; touring- och yogaplattformerna
      klarar upp till 250 lbs, med varianter med högre kapacitet på de större brädorna. Paddlarens vikt, konstruktionen och tryckvärdena
      anges i det tekniska databladet för varje plattform
      innan du godkänner en produktionsserie.
  - q: Vad innehåller ett komplett kommersiellt kit?
    a: >-
      Ett komplett kit innehåller vanligtvis brädan, transportväskan, den dubbelcylindriga
      handpumpen, den löstagbara fenan, spiral-leashen och reparationssatsen, med en valfri elektrisk
      pump som uppgradering. Kitets innehåll fastställs i den kundgodkända BOM-listan,
      så att prover och serietillverkning stämmer exakt överens.
  - q: Kan ni bundla brädor, tillbehör och förpackning i ett enda program?
    a: >-
      Ja. Multi-SKU-program täcker brädor, tillbehör och kommersiell förpackning
      under ett enda fabrikkontrakt — delade tillbehörskit minskar lagret per SKU,
      ett designsystem håller varumärkningen konsekvent och en
      gemensam kvalitetsreferens hanterar garantiansökningarna. Så hanterar våra distributörer och
      handelspartners kompletta SUP-sortiment.
  - q: Vad är skillnaden mellan OEM, ODM och private label?
    a: >-
      OEM innebär att vi tillverkar enligt din godkända specifikation: dina ritningar,
      mått, material och förpackning. Designen och den immateriella
      egendomen förblir din. ODM innebär att vårt utvecklingsteam utformar brädan utifrån din brief
      — oavsett om det är ett marknadskoncept, ett prestandamål eller en anpassning av en beprövad plattform
      — och du godkänner den före tillverkningen. Private label innebär ditt
      varumärke, din artwork och din förpackning på en befintlig, validerad plattform, utan
      strukturella förändringar. De flesta projekten ligger mellan dessa modeller, och vi
      dimensionerar konfigurationen utifrån hur mycket av produktutvecklingen du vill äga.
  - q: Vad kostar ett prototypprov och kan provkostnaden räknas av mot beställningen?
    a: >-
      Provpriset följer projektkonfigurationen: mått, konstruktion,
      artwork och förpackning påverkar alla offerten. För projekt som går vidare till
      serietillverkningen räknas provkostnaden normalt av mot den första
      produktionsbeställningen — avräkningsvillkoren bekräftas skriftligt i offertfasen,
      så att det inte blir några överraskningar senare.
  - q: Hur många uppblåsbara paddelbrädor får plats i en 20-fots container?
    a: >-
      Med vakuumförpackade standardbrädor på 11 fot och tillbehörskit innehåller en 20-fots container
      vanligtvis 150–200 kompletta set — det exakta antalet beror på
      förpackningsdesignen, tillbehörsmixen och kartongstorleken. Vårt
      förpackningsteam räknar ut lastplanen utifrån din faktiska materiallista, så att
      antalet du planerar för stämmer med antalet som skickas.
  - q: Vad ingår i era grossistoffer — FOB eller CIF?
    a: >-
      Offerterna är detaljerade: produkt, standardförpackning och transport enligt
      vald Incoterm. FOB Qingdao är standardbasen, med CIF till de viktigaste hamnarna
      och leverans till dörren via våra fraktpartners.
      Varje offert specificerar exakt vad som ingår, så att du
      inte behöver jämföra äpplen med päron mellan olika leverantörer.
  - q: Fakturerar ni verktygs- eller formkostnader för skräddarsydda brädor?
    a: >-
      De grafiska inställningarna och tryckplattorna är kostnadseffektiva och återanvändbara; det strukturella
      verktyget (nya former, anpassade rails eller specialkonstruktioner) specificeras i offertfasen.
      Där verktyg ingår skrivs kostnaden normalt av över den första
      produktionscykeln, i stället för att tas ut som en engångsöverraskning.
  - q: Vilka betalningsvillkor tillämpar ni för produktionsbeställningar?
    a: >-
      Standardvillkoren innebär en deposition för att starta produktionen, med saldot förfallande
      före leverans. Depositionsprocenten och saldoförfallodagen avtalas per
      beställning och tas fast i kontraktet. Etablerade partners med ett jämnt orderflöde
      kan diskutera mer flexibla villkor — vi föredrar några ärliga, tydliga villkor
      framför komplicerade finansiella konstruktioner.
  - q: Vilken garanti erbjuder ni för stora volymbeställningar?
    a: >-
      Varje bräda testas före leverans med ett 24-timmars tryck- och lufttäthetstest vid 18.0 PSI,
      och garantivillkoren tas fast i varje beställningskontrakt — de täcker
      tillverkningsfel som delaminering, brustna sömmar och läckande
      ventiler, och utesluter transportskador. Garantitiden och skadehanteringsförfarandet
      bekräftas i orderbekräftelsen, inte först i efterhand.
  - q: Vad händer om brädorna anlår skadade eller med tillverkningsfel?
    a: >-
      Rapportera problemet inom den avtalade tidsfristen (vanligtvis 7–15 dagar efter
      ankomst) med foto- eller videobevis. Vi verifierar utifrån de inspektionsrutiner vid
      leverans som upprättats för din sändning och hjälper dig sedan vidare med en omtillverkning, ett byte eller en kreditnota.
      De dokumenterade QC-fotona av dina varor gör allt snabbt och
      korrekt för båda parter.
  - q: Hur godkänns skräddarsydda tryck före tillverkningen?
    a: >-
      Trycken går igenom en kontrollerad godkännandekedja: digital mockup, tryckt korrektur,
      verifiering av första exemplar på produktionsbrädan och därefter serietillverkning.
      Varje steg kontrolleras mot dina undertecknade tryck, och därför
      matchar tryckfärgerna, EVA-layouten och logotypens placering din varumärkesfil när brädorna anländer.
  - q: Vilka reservdelar levererar ni för kommersiella flottor?
    a: >-
      Flottoperatörer kan beställa reservdelar tillsammans med sina brädor eller vid
      kompletteringsbeställningar: reservventiler, reparationssatser (PVC-lagningar och
      lim), fenskydd och fenor, utöver de mest utbytta tillbehören. Delarna
      skickas med produktionen eller som mindre leveranser, så att en defekt del
      aldrig håller en hel bräda ur tjänst länge.
  - q: Vilken information bör jag förbereda innan jag begär en offert?
    a: >-
      Ju bättre briefen är, desto snabbare blir offerten: målmarknad och användning,
      önskade specifikationer (mått, konstruktion, tryck), kvantitet och
      målpris, krav på varumärkning och förpackning samt din lanseringsplan. Vår
      förfrågan frågar efter exakt den här listan — om du delar den sparar du offertrundor
      och får en bättre uppskattning redan i första steget.
  - q: Hur lång tid tar provtillverkningen före produktionen?
    a: >-
      Prototypprov skickas inom 7–12 dagar så snart specifikationen är fastställd.
      Räkna dessutom med verifieringstiden för dina egna tester och eventuella
      revisionsomgångar — de flesta projekt slutför provtillverkningen på cirka två till tre
      veckor. Tillverkningen startar efter provgodkännandet, och därför är provfasen
      det tillfälle då extra omsorg betalar sig i tid som sparas senare.
