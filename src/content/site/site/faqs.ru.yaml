faqs:
  - q: Кто такой iSupfactory?
    a: >-
      iSupfactory — OEM- и ODM-производитель SUP- досок из Циндао, Китай, который
      выполняет разработку продукции, изготовление прототипов, производство,
      контроль качества и экспортное производство для брендов, дистрибьюторов и
      компаний из сектора активного отдыха.
  - q: Где производится продукция iSupfactory?
    a: >-
      Продукция SUP производится в Циндао, Китай.
  - q: Является ли iSupfactory OEM-производителем?
    a: >-
      Да. iSupfactory производит надувные SUP-доски по согласованным с заказчиком
      спецификациям, включая размеры, материалы, конструкцию, графику, аксессуары и
      упаковку.
  - q: Предоставляет ли iSupfactory услуги ODM-разработки продукта?
    a: >-
      Да. iSupfactory разрабатывает продукты SUP на основе технического задания,
      требований рынка или целевых показателей — от инженерной проработки и
      изготовления прототипа до утверждения образца и запуска производства.
  - q: Могу ли я изготовить SUP-доску по собственным чертежам?
    a: >-
      Да. Чертежи, спецификации и референсные образцы заказчика проверяются на
      технологичность изготовления до выдачи предложения.
  - q: Можете ли вы разработать SUP-доску на основе идеи?
    a: >-
      Да. ODM-проекты могут начинаться с концепции, требований рынка или целевых
      показателей.
  - q: Могу ли я заказать прототип?
    a: >-
      Да. Образцы прототипа могут быть изготовлены до серийного производства;
      в настоящее время образцы отгружаются в течение 7–12 дней после утверждения
      спецификации.
  - q: Каков ваш срок производства?
    a: >-
      Стандартный срок производства составляет 25–35 дней с момента подтверждения
      заказа и получения задатка, в зависимости от конфигурации проекта;
      индивидуальная оснастка добавляет 15–20 дней.
  - q: Каков минимальный заказ (MOQ)?
    a: >-
      MOQ зависит от платформы, конструкции, количества, требований к упаковке и
      материалам. Мелкие партии под собственной маркой начинаются с 5–10 шт, а
      пилотные партии — с 20–50 шт; минимальный заказ для серийного производства
      определяется конфигурацией проекта.
  - q: Могут ли покупатели проводить аудит фабрики?
    a: >-
      Да. Аудиты покупателей и сторонние инспекции можно организовать с учётом
      требований проекта.
  - q: Где расположены ваша компания и фабрика?
    a: >-
      Мы находимся в Циндао, Китай. iSupfactory — это производственное подразделение
      Qingdao Vatrad Group Co., Ltd. — завода по производству надувной продукции
      площадью 12,500 м² в зоне экономического развития Лайси, работающего с 2012
      года. Продажи и техническая поддержка доступны по всему миру; производство
      расположено в Циндао, Китай.
  - q: Предоставляет ли Vatrad услуги OEM/ODM для надувного оборудования для водных видов спорта?
    a: >-
      Да. iSupfactory (при поддержке Qingdao Vatrad Group Co., Ltd.) предлагает полный
      цикл OEM- и ODM-кастомизации — от 3D-чертежей и выбора материала drop-stitch
      до серийного производства для мировых брендов. Мы берём на себя нанесение
      собственной марки, индивидуальную упаковку и подготовку документов о
      соответствии требованиям BSCI, CE и другим стандартам сертификации
  - q: Какие сертификаты имеет Vatrad на производство надувного оборудования для водных видов спорта?
    a: >-
      Фабрика Vatrad имеет сертификаты BSCI и ISO 9001. Сертификация CE применяется к
      моделям, предназначенным для рынков ЕС; её объём определяется по каждому
      проекту и зависит от целевого рынка и конфигурации продукта. Документы о
      соответствии REACH и RoHS предоставляются по запросу.
  - q: Каков минимальный заказ (MOQ) для OEM-надувных SUP-досок?
    a: >-
      MOQ определяется конфигурацией проекта, а не фиксированным числом: каждый
      проект проходит стадии образца (1–2 шт) и пилотной партии (20–50 шт), при этом
      стандартное серийное производство составляет 90–100+ шт в партии из полного
      рулона drop-stitch шириной 150 м. Мелкие партии под собственной маркой
      начинаются с 5–10 шт. Полную логику расчёта см. в нашем руководстве по MOQ и
      гибким вариантам брендирования.
  - q: Какие материалы использует Vatrad для производства надувных SUP-досок?
    a: >-
      Для SUP-досок мы используем ПВХ-ткань морского класса (0.9 мм–1.2 мм) с
      двухслойным сердцевиной drop-stitch. Материалы поставляются сертифицированными
      поставщиками и до начала производства тестируются на прочность на разрыв,
      устойчивость к УФ-излучению и гибкость при низких температурах.
  - q: Может ли Vatrad выполнять крупные оптовые заказы для международных покупателей?
    a: >-
      Да. Наша фабрика площадью 12 500 м² выпускает более 120 000 единиц в год силами
      специализированной команды из более чем 350 квалифицированных рабочих. Мы
      отгружаем продукцию более чем в 50 стран и организуем логистику, включая FOB
      Циндао, CIF в крупные порты и доставку «до двери» через наших
      экспедиторских партнёров.
  - q: Каков срок OEM-производства надувных SUP-досок?
    a: >-
      Стандартный срок OEM-производства составляет 25–35 дней с момента
      подтверждения заказа и получения задатка. Разработка индивидуальной пресс-формы
      добавляет 15–20 дней на оснастку, а образцы прототипа отгружаются в течение
      7–12 дней. Срочные заказы доступны для проверенных партнёров при наличии
      подтверждённого запаса материалов.
  - q: Поставляет ли Vatrad drop-stitch материал военного класса для SUP-досок?
    a: >-
      Да. Наша сердцевина drop-stitch выполнена из ПВХ-ткани морской спецификации с
      прочностью на разрыв свыше 2000 H/5 см. Технология двухслойной ламинации
      обеспечивает удержание давления 18,0 PSI с падением давления менее 0,50 PSI за
      24 часа — в соответствии с внутренним стандартом фабрики по целостности и
      герметичности.
  - q: Как Vatrad обеспечивает герметичность и устойчивость к УФ-излучению своей надувной продукции?
    a: >-
      Каждая надувная секция проходит 24-часовой тест на удержание давления при
      18,0 PSI перед отгрузкой; камеры с падением давления более 0,50 PSI
      автоматически отбраковываются. Устойчивость к УФ-излучению подтверждается
      ускоренным старением с пороговыми значениями деградации прочности на разрыв. Наша
      ПВХ-композитная смесь содержит УФ-стабилизаторы и антиоксидантные добавки для
      долговечности при эксплуатации на открытом воздухе.
  - q: Может ли Vatrad помочь с разработкой упаковки и брендированием под собственной маркой?
    a: >-
      Да. Мы предлагаем упаковку под собственную марку «под ключ»: разработанные по
      индивидуальным запросам коробки для розницы, бирки, инструкции и транспортные
      короба с вашей фирменной графикой. Наша дизайнерская команда может разработать
      полноценную визуальную айдентику бренда для новых участников рынка — от
      нанесения логотипа до впечатления от распаковки.
  - q: Принимает ли Vatrad фабричные аудиты от международных покупателей?
    a: >-
      Конечно. Мы приветствуем выездные и сторонние аудиты фабрики, включая BSCI,
      SMETA и инспекции по социальной ответственности по требованиям заказчика. Наша
      площадка 12 500 м² готова к аудиту: документированные процессы контроля
      качества, прослеживаемость материалов и записи охраны здоровья и безопасности
      работников. Для первичной квалификации доступны виртуальные туры по фабрике.
  - q: Какая технология drop-stitch применяется в SUP-досках Vatrad?
    a: >-
      Drop-stitch — это конструкция из ткани, в которой тысячи полиэфирных нитей
      соединяют верхний и нижний слои ПВХ. При накачивании до 12–15 PSI эти нити
      удерживают панели на фиксированном расстоянии, формируя жёсткую плоскую
      платформу. Vatrad использует drop-stitch с фузионной ламинацией, при которой
      нити термически соединяются с ПВХ, что обеспечивает более высокую стойкость к
      расслоению по сравнению с традиционными сердцевинами на клеевом соединении.
  - q: Какие платформы нужны начинающим гребцам и клиентам проката?
    a: >-
      Покупатели, формирующие парк для проката, курортов или школ, обычно
      начинают с широких универсальных платформ большого объёма, которые стабильны
      для начинающих и универсальны для ежедневного коммерческого использования. Мы
      также можем сконфигурировать многоместные доски для групповых занятий. Выбор
      платформы проверяется на соответствие вашим целевым гребцам перед изготовлением
      образцов.
  - q: В каких условиях воды могут работать коммерческие программы SUP?
    a: >-
      Доски iSupfactory рассчитаны на использование в океане, на озере и реке. Туристические
      платформы выдерживают прибой у берега, а все доски используют ПВХ-ткань морского
      класса, устойчивую к коррозии в солёной воде. Для парков, работающих в солёной
      воде, мы рекомендуем стандартный режим промывки пресной водой между выходами и
      включаем его в руководство для операторов, поставляемое вместе с коммерческими
      комплектами.
  - q: Поставляете ли вы насосы и принадлежности для накачивания в составе коммерческих комплектов?
    a: >-
      Да. Коммерческие комплекты включают ручные насосы двустороннего действия, а для
      курортов и прокатных операторов, управляющих несколькими досками в день,
      доступны электрические насосы. Выбор насоса, весла, поводка, плавника, рюкзака и
      ремонтного комплекта согласовывается в составе конфигурации аксессуаров для
      каждого проекта.
  - q: Как доски упаковываются для отгрузки и доставки в розницу?
    a: >-
      Серийная продукция отгружается в вакуумной упаковке, что снижает объёмный вес
      на 50–60%. Для розничных программ мы предоставляем брендированные коробки,
      инструкции, штрихкоды и маркировку коробов согласно требованиям рынка, а также
      можем комплектовать полные наборы с разделительной упаковкой, чтобы в каждую
      коробку попал одинаковый набор аксессуаров.
  - q: Какой диапазон веса гребца выдерживают ваши доски?
    a: >-
      Универсальные платформы выдерживают до 220 lbs; туристические платформы и
      платформы для йоги выдерживают до 250 lbs, а на более крупных досках доступны
      варианты повышенной грузоподъёмности.
      Вес гребца, конструкция и показатели давления указаны для каждой платформы в
      техническом паспорте до того, как Вы примете решение о запуске партии.
  - q: Что входит в полный коммерческий комплект?
    a: >-
      Полный комплект обычно включает доску, дорожный рюкзак, ручной насос двустороннего
      действия, съёмный плавник, витой поводок и ремонтный комплект, с возможностью
      дополнительного заказа весла и электрического насоса. Состав комплекта
      фиксируется в спецификации (BOM), утверждённой заказчиком, поэтому образец и
      серийная продукция полностью совпадают.
  - q: Можете ли вы объединить доски, аксессуары и упаковку в одну программу?
    a: >-
      Да. Программы с несколькими артикулами (SKU) охватывают доски, аксессуары и
      розничную упаковку в рамках одного заводского договора — общие комплекты
      аксессуаров сокращают складские запасы по каждому артикулу, единая система
      дизайна обеспечивает единообразие брендинга, а единый ответственный за
      качество решает вопросы по гарантийным случаям. Именно так наши дистрибьюторы и
      розничные партнёры управляют полными линейками SUP.
  - q: В чём разница между OEM, ODM и собственной маркой?
    a: >-
      OEM — это производство по утверждённой Вами спецификации: ваши чертежи,
      размеры, материалы и упаковка. Дизайн и интеллектуальная собственность
      принадлежат Вам. ODM — это разработка доски нашими инженерами на основе Вашего
      технического задания: будь то рыночная концепция, целевые показатели или
      адаптация проверенной платформы; Вы утверждаете результат до запуска
      производства. Работа под собственной маркой (private label) — это Ваш бренд,
      графика и упаковка на существующей проверенной платформе без конструктивных
      изменений. Большинство
      проектов попадает между этими режимами, и мы предлагаем конфигурацию,
      соответствующую тому, какую часть дизайна продукта Вы хотите контролировать.
  - q: Сколько стоит образец прототипа и можно ли зачесть эту сумму в заказ?
    a: >-
      Стоимость образца определяется конфигурацией проекта: размер, конструкция,
      графика и упаковка влияют на предложение. Для проектов, переходящих к серийному
      производству, стоимость образца обычно засчитывается в первый производственный
      заказ — условия зачёта подтверждаются в письменной форме на этапе выдачи
      предложения, чтобы впоследствии не было неожиданностей.
  - q: Сколько надувных SUP-досок помещается в 20-футовый контейнер?
    a: >-
      В стандартный 20-футовый контейнер обычно помещается 150–200 полных комплектов
      из вакуумно упакованных досок 11 футов с комплектами аксессуаров; точное
      количество зависит от конструкции упаковки, состава аксессуаров и размера
      коробов. Наша упаковочная команда рассчитывает план загрузки по вашей реальной
      спецификации (BOM), поэтому расчётное число совпадает с фактически отгружаемым.
  - q: Что входит в ваше оптовое предложение — FOB или CIF?
    a: >-
      Предложения детализируются: продукция, стандартная упаковка и транспорт в
      соответствии с выбранными вами условиями поставки (инкотермс). Базовый вариант —
      FOB Циндао; также доступны CIF в крупные порты и доставка «до двери» через наших
      экспедиторских партнёров. В каждом предложении указан точный объём включённого,
      поэтому Вы не сравниваете несопоставимые условия у разных поставщиков.
  - q: Взимаете ли вы плату за оснастку или пресс-формы при индивидуальных досках?
    a: >-
      Подготовка печатных форм и клише недорога и многоразова; конструктивная оснастка
      (новые формы, индивидуальные усиленные кромки или уникальная конструкция)
      рассчитывается отдельно на этапе выдачи предложения. Там, где требуется
      оснастка, её стоимость обычно распределяется на первую производственную партию,
      а не предъявляется как единовременный неожиданный платёж.
  - q: Какие условия оплаты Вы применяете к производственным заказам?
    a: >-
      Стандартные условия — задаток для фиксации производства, остаток оплачивается
      до отгрузки. Процент задатка и срок оплаты остатка согласовываются по каждому
      заказу и указываются в договоре. Проверенные партнёры с устойчивой историей
      заказов могут обсудить расширенные условия — мы предпочитаем несколько
      честных условий сложным финансовым схемам.
  - q: Какую гарантию Вы предоставляете при оптовых заказах?
    a: >-
      Каждая доска проходит 24-часовой тест на удержание давления при 18,0 PSI перед
      отгрузкой, а гарантийные условия прописаны в договоре на каждый заказ — они
      охватывают производственные дефекты, такие как расслоение, разрыв швов и утечки
      клапанов, и не распространяются на повреждения в процессе эксплуатации. Срок
      гарантии и порядок обращения по гарантии фиксируются в заказе на закупку, а не
      выясняются позже.
  - q: Что происходит, если доски прибывают повреждёнными или с производственными дефектами?
    a: >-
      Сообщите о проблеме в согласованный срок (как правило, 7–15 дней с момента
      прибытия), приложив фотографии или видео. Мы оцениваем ситуацию на основании
      протоколов предотгрузочной проверки, хранящихся для Вашей партии, а затем
      выполняем переработку, замену или зачёт средств. Документированные фотографии
      контроля качества Вашей продукции делают этот процесс быстрым и прозрачным для
      обеих сторон.
  - q: Как согласовывается индивидуальная графика перед запуском производства?
    a: >-
      Графика проходит контролируемую цепочку согласования: цифровой макет, печатная
      проба, проверка первого изделия на производственной доске, затем серийное
      производство. Каждый этап сверяется с подписанной Вами графикой, поэтому при
      поставке досок печатные цвета, раскладка EVA и расположение логотипа
      соответствуют Вашему бренд-файлу.
  - q: Какие запчасти Вы поставляете для коммерческих парков?
    a: >-
      Операторы парков могут заказать обслуживаемые детали вместе с досками или при
      повторном заказе: сменные клапаны, ремонтные комплекты (ламинированные заплатки
      ПВХ и клей), планки и плавники, а также наиболее часто заменяемые аксессуары.
      Запчасти отгружаются вместе с продукцией или отдельными небольшими партиями,
      поэтому сломанный компонент не выводит из эксплуатации целую доску надолго.
  - q: Какие данные следует подготовить перед запросом предложения?
    a: >-
      Чем подробнее задание, тем быстрее предложение: целевой рынок и сценарий
      использования, желаемые характеристики (размер, конструкция, давление),
      количество и целевая цена, требования к брендингу и упаковке, а также сроки
      запуска. Наша форма запроса собирает именно эти данные — их передача экономит
      итерации расчёта и позволяет сразу получить более точную оценку.
  - q: Сколько времени занимает изготовление образцов перед производством?
    a: >-
      Образцы прототипа отгружаются в течение 7–12 дней после утверждения
      спецификации. Добавьте время на Ваши испытания и один-два цикла правок — в
      большинстве проектов изготовление образцов занимает около двух-трёх недель.
      Производство начинается после утверждения образца, поэтому этап образца — как
      раз тот случай, когда дополнительная тщательность окупается сэкономленным
      позже временем.
